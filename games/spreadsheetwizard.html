<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{background:#1b3a2e;border-radius:14px;padding:16px;text-align:center;max-width:640px;margin:0 auto}
#hud{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;margin-bottom:10px;flex-wrap:wrap;gap:6px}
#hud span{color:#ffd54f}
#timerBarOuter{height:10px;background:#0b2118;border-radius:6px;overflow:hidden;margin-bottom:12px}
#timerBar{height:100%;background:linear-gradient(90deg,#4caf50,#ffd54f,#e94560);width:100%;transition:width .1s linear}
#formula{color:#7ec8ff;font-size:1.05rem;font-weight:700;min-height:1.6em;margin-bottom:8px}
#grid{display:inline-grid;gap:4px;background:#0b2118;padding:8px;border-radius:10px;margin:0 auto}
.gcell{width:56px;height:38px;display:flex;align-items:center;justify-content:center;background:#fdfdfd;color:#222;font-weight:700;border-radius:4px;font-size:.95rem}
.gcell.hdr{background:#0b2118;color:#7ec8ff;font-weight:800}
.gcell.target{background:#ffd54f;color:#222;outline:3px solid #e94560;position:relative}
.gcell.correct{background:#4caf50!important;color:#fff!important}
.gcell.wrong{background:#e94560!important;color:#fff!important}
#answerRow{margin-top:14px}
#answerInput{font-size:1.3rem;font-weight:800;width:140px;text-align:center;padding:8px;border-radius:8px;border:none;background:#fdfdfd;color:#222}
#answerRow button{padding:9px 20px;background:#4caf50;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin-left:8px;font-weight:700}
#msg{color:#fff;min-height:1.4em;margin-top:10px;font-weight:700}
#numpad{display:none;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:10px}
#numpad button{height:44px;font-size:1.1rem;font-weight:800;border:none;border-radius:8px;background:#2a4d3d;color:#fff;cursor:pointer}
@media(max-width:480px){
  .gcell{width:42px;height:32px;font-size:.8rem}
  #numpad{display:grid}
}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Spreadsheet Wizard</div>
  <div class="game-frame" style="padding:16px">
    <div id="wrap">
      <div id="hud"><div>Round <span id="roundNum">1</span></div><div>Score: <span id="scoreVal">0</span></div><div>Streak: <span id="streakVal">0</span></div><div>Best: <span id="bestVal">0</span></div></div>
      <div id="timerBarOuter"><div id="timerBar"></div></div>
      <div id="formula">Compute the highlighted cell</div>
      <div id="grid"></div>
      <div id="answerRow">
        <input id="answerInput" type="number" inputmode="numeric" autocomplete="off" placeholder="?">
        <button id="submitBtn">Enter</button>
      </div>
      <div id="numpad"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A highlighted cell shows a formula (row sum, column sum, or simple math). Type the correct number and hit <b>Enter</b> before time runs out. Wrong or late answers cost points; each round gets faster and trickier.</div>
</div>
<script>
const ROWS=4,COLS=4;
let grid=[],round=1,score=0,streak=0,best=0,timeLimit=10,timeLeft=10,timerId=null,target={},answer=0,playing=false;
const bestKey='spreadsheetwizard_best';
best=parseInt(localStorage.getItem(bestKey)||'0',10);

const gridEl=document.getElementById('grid');
const formulaEl=document.getElementById('formula');
const msgEl=document.getElementById('msg');
const answerInput=document.getElementById('answerInput');
const timerBar=document.getElementById('timerBar');
const numpad=document.getElementById('numpad');

function fmtBest(){document.getElementById('bestVal').textContent=best;}
fmtBest();

function buildNumpad(){
  numpad.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','-','0','⌫'].forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k;
    b.onclick=()=>{
      if(k==='⌫')answerInput.value=answerInput.value.slice(0,-1);
      else answerInput.value=(answerInput.value==='?'?'':answerInput.value)+k;
      answerInput.focus();
    };
    numpad.appendChild(b);
  });
}
buildNumpad();

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function newGrid(){
  grid=[];
  const maxVal=Math.min(9+round*2,40);
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++)row.push(randInt(1,maxVal));
    grid.push(row);
  }
}

function pickTask(){
  const kinds=round<3?['row','col']:['row','col','diff','sumtwo'];
  const kind=kinds[randInt(0,kinds.length-1)];
  if(kind==='row'){
    const r=randInt(0,ROWS-1);
    const sum=grid[r].reduce((a,b)=>a+b,0);
    return {kind,r,text:I18N.t('sw_rowsum','Sum of Row {r}').replace('{r}',r+1),answer:sum};
  }
  if(kind==='col'){
    const c=randInt(0,COLS-1);
    let sum=0;for(let r=0;r<ROWS;r++)sum+=grid[r][c];
    return {kind,c,text:I18N.t('sw_colsum','Sum of Column {c}').replace('{c}',String.fromCharCode(65+c)),answer:sum};
  }
  if(kind==='diff'){
    const r1=randInt(0,ROWS-1),c1=randInt(0,COLS-1);
    let r2=randInt(0,ROWS-1),c2=randInt(0,COLS-1);
    while(r2===r1&&c2===c1){r2=randInt(0,ROWS-1);c2=randInt(0,COLS-1);}
    const a=grid[r1][c1],b=grid[r2][c2];
    const big=Math.max(a,b),small=Math.min(a,b);
    return {kind,cells:[[r1,c1],[r2,c2]],text:I18N.t('sw_diff','{a} minus {b}').replace('{a}',big).replace('{b}',small),answer:big-small,highlightCells:[[r1,c1],[r2,c2]]};
  }
  // sumtwo
  const r1=randInt(0,ROWS-1),c1=randInt(0,COLS-1);
  let r2=randInt(0,ROWS-1),c2=randInt(0,COLS-1);
  while(r2===r1&&c2===c1){r2=randInt(0,ROWS-1);c2=randInt(0,COLS-1);}
  return {kind,cells:[[r1,c1],[r2,c2]],text:I18N.t('sw_sumtwo','Sum of highlighted cells'),answer:grid[r1][c1]+grid[r2][c2],highlightCells:[[r1,c1],[r2,c2]]};
}

function render(resultClass){
  gridEl.style.gridTemplateColumns=`repeat(${COLS+1},1fr)`;
  gridEl.innerHTML='';
  const corner=document.createElement('div');corner.className='gcell hdr';corner.textContent='#';gridEl.appendChild(corner);
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='gcell hdr';h.textContent=String.fromCharCode(65+c);gridEl.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const rh=document.createElement('div');rh.className='gcell hdr';rh.textContent=r+1;gridEl.appendChild(rh);
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='gcell';
      cell.textContent=grid[r][c];
      const isTarget = (target.kind==='row'&&target.r===r) || (target.kind==='col'&&target.c===c) ||
        ((target.kind==='diff'||target.kind==='sumtwo')&&target.highlightCells.some(([hr,hc])=>hr===r&&hc===c));
      if(isTarget){
        cell.classList.add('target');
        if(resultClass)cell.classList.add(resultClass);
      }
      gridEl.appendChild(cell);
    }
  }
}

function startRound(){
  newGrid();
  target=pickTask();
  answer=target.answer;
  formulaEl.textContent=target.text+' = ?';
  render();
  answerInput.value='';
  msgEl.textContent='';
  document.getElementById('roundNum').textContent=round;
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('streakVal').textContent=streak;
  timeLimit=Math.max(4,10-round*0.4);
  timeLeft=timeLimit;
  playing=true;
  clearInterval(timerId);
  timerId=setInterval(tick,100);
  answerInput.focus();
}

function tick(){
  timeLeft-=0.1;
  timerBar.style.width=Math.max(0,(timeLeft/timeLimit)*100)+'%';
  if(timeLeft<=0){
    clearInterval(timerId);
    playing=false;
    SFX.fail();
    streak=0;
    render('wrong');
    msgEl.textContent=I18N.t('sw_timeout','Time\'s up! Answer was {a}').replace('{a}',answer);
    setTimeout(nextRound,1100);
  }
}

function submit(){
  if(!playing)return;
  const v=parseInt(answerInput.value,10);
  playing=false;
  clearInterval(timerId);
  if(v===answer){
    const bonus=Math.round(10+timeLeft*5+streak*2);
    score+=bonus;
    streak++;
    SFX.success();
    render('correct');
    msgEl.textContent=I18N.t('sw_correct','Correct! +{b}').replace('{b}',bonus);
  }else{
    score=Math.max(0,score-8);
    streak=0;
    SFX.fail();
    render('wrong');
    msgEl.textContent=I18N.t('sw_wrong','Wrong — answer was {a}').replace('{a}',answer);
  }
  if(score>best){best=score;localStorage.setItem(bestKey,String(best));fmtBest();}
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('streakVal').textContent=streak;
  setTimeout(nextRound,900);
}

function nextRound(){
  round++;
  startRound();
}

document.getElementById('submitBtn').addEventListener('click',submit);
answerInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});

startRound();
</script></body></html>
