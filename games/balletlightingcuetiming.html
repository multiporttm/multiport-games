<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#120a1e;display:block;border-radius:8px}
#hud{color:#e6c9ff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ballet Lighting Cue Timing</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreDisp">Score: 0 | Hi: 0</span><span id="livesDisp">❤️❤️❤️</span><span id="levelDisp">Act 1</span></div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Click</b>, or <b>Tap</b> exactly when the moving cue light enters the glowing target zone to trigger each lighting cue on time. Miss or mistime it and you lose a life. Clear trickier cue sequences as the show goes on.</div>
</div>
<script>
const GID='balletlightingcuetiming';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),livesDisp=document.getElementById('livesDisp'),levelDisp=document.getElementById('levelDisp');
const TRACK_X0=40,TRACK_X1=760,TRACK_Y=170;
const MAX_LEVEL=6;
const CUE_NAMES=['Spotlight Rise','Blue Wash','Amber Glow','Full Stage Bump','Follow Spot','Blackout Cue','Side Light','Gobo Shift'];
const CUE_COLORS=['#7ec8e3','#4a6fff','#ffb74d','#ffffff','#ff7ab8','#222233','#7effa0','#d08bff'];

let hi=parseInt(localStorage.getItem(GID+'_hi')||'0',10);
let score=0,lives=3,level=1,cuesDone=0,cuesNeeded=3;
let pointerX=TRACK_X0,pointerDir=1,pointerSpeed=2.6;
let zoneX=0,zoneW=90,cueIdx=0,cueColor='#7ec8e3',cueName='Spotlight Rise';
let state='ready'; // ready | playing | levelup | lost | won
let flashT=0,msgTimer=0,msg='';

function lives2str(){return '❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));}

function newZone(){
  zoneW=Math.max(34,100-level*10);
  zoneX=TRACK_X0+20+Math.random()*(TRACK_X1-TRACK_X0-zoneW-40);
  const i=Math.floor(Math.random()*CUE_NAMES.length);
  cueName=CUE_NAMES[i];cueColor=CUE_COLORS[i];
  pointerSpeed=2.4+level*0.55;
}

function startLevel(){
  cuesDone=0;
  cuesNeeded=2+level;
  pointerX=TRACK_X0;pointerDir=1;
  newZone();
  state='playing';
}

function resetGame(){
  score=0;lives=3;level=1;
  startLevel();
  state='playing';
  msg='';msgTimer=0;
}

function flash(m){msg=m;msgTimer=50;}

function trigger(){
  if(state==='ready'){resetGame();return;}
  if(state==='lost'||state==='won'){resetGame();return;}
  if(state!=='playing')return;
  const inZone=pointerX>=zoneX&&pointerX<=zoneX+zoneW;
  if(inZone){
    const center=zoneX+zoneW/2;
    const precision=1-Math.min(1,Math.abs(pointerX-center)/(zoneW/2));
    const gained=Math.round(60+precision*90);
    score+=gained;
    cuesDone++;
    SFX.success();
    flashT=10;
    flash((precision>0.8?'Perfect cue! +':'Cue hit! +')+gained);
    if(cuesDone>=cuesNeeded){
      if(level>=MAX_LEVEL){
        state='won';SFX.win();
        if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
        return;
      }
      level++;
      if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
      startLevel();
      flash(I18N.t('act_clear','Act complete!'));
    } else {
      newZone();
      pointerX=pointerDir>0?TRACK_X0:TRACK_X1;
    }
  } else {
    lives--;
    SFX.hurt();
    flash(I18N.t('mistimed','Mistimed cue!'));
    if(lives<=0){
      state='lost';SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
    } else {
      newZone();
      pointerX=pointerDir>0?TRACK_X0:TRACK_X1;
    }
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();trigger();}
});
c.addEventListener('pointerdown',e=>{e.preventDefault();trigger();});
c.addEventListener('touchstart',e=>{e.preventDefault();trigger();},{passive:false});

function drawStage(){
  ctx.fillStyle='#0c0714';ctx.fillRect(0,0,800,300);
  // proscenium
  ctx.fillStyle='#1a1026';ctx.fillRect(0,0,800,40);
  ctx.fillStyle='#1a1026';ctx.fillRect(0,240,800,60);
  ctx.fillStyle=cueColor+'33';
  ctx.beginPath();ctx.ellipse(400,230,320,70,0,0,Math.PI*2);ctx.fill();
}

function drawTrack(){
  ctx.fillStyle='#241a33';
  ctx.fillRect(TRACK_X0,TRACK_Y-6,TRACK_X1-TRACK_X0,12);
  // target zone
  const glow=flashT>0?1:0.55+0.25*Math.sin(Date.now()/150);
  ctx.save();
  ctx.globalAlpha=glow;
  ctx.fillStyle=cueColor;
  ctx.fillRect(zoneX,TRACK_Y-16,zoneW,32);
  ctx.restore();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(zoneX,TRACK_Y-16,zoneW,32);
  // pointer (lighting fixture)
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(pointerX-10,TRACK_Y-40);ctx.lineTo(pointerX+10,TRACK_Y-40);ctx.lineTo(pointerX,TRACK_Y-16);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(pointerX,TRACK_Y-16);ctx.lineTo(pointerX,TRACK_Y+40);ctx.stroke();
}

function drawHud(){
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 20px Arial';
  ctx.fillText(I18N.t('cue_label','Next cue: {n}').replace('{n}',cueName),400,80);
  if(msgTimer>0){
    ctx.font='bold 22px Arial';
    ctx.fillStyle='#ffd54f';
    ctx.fillText(msg,400,110);
    msgTimer--;
  }
}

function drawCenterText(lines){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,800,300);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 34px Arial';
  ctx.fillText(lines[0],400,130);
  ctx.font='20px Arial';
  for(let i=1;i<lines.length;i++)ctx.fillText(lines[i],400,130+30*i);
}

function loop(){
  drawStage();
  if(state==='ready'){
    drawCenterText([I18N.t('lx_title','Ballet Lighting Cue Timing'),I18N.t('start_hint','Press Space / Tap to start')]);
  } else if(state==='lost'){
    drawTrack();drawHud();
    drawCenterText([I18N.t('game_over_title','GAME OVER'),I18N.t('restart_hint','Tap or Space to restart')]);
  } else if(state==='won'){
    drawTrack();drawHud();
    drawCenterText([I18N.t('show_complete','SHOW COMPLETE!'),I18N.t('restart_hint','Tap or Space to restart')]);
  } else {
    pointerX+=pointerDir*pointerSpeed;
    if(pointerX>=TRACK_X1){pointerX=TRACK_X1;pointerDir=-1;}
    if(pointerX<=TRACK_X0){pointerX=TRACK_X0;pointerDir=1;}
    if(flashT>0)flashT--;
    drawTrack();drawHud();
  }
  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesDisp.textContent=lives2str();
  levelDisp.textContent=I18N.t('act_label','Act {n}').replace('{n}',level);
  requestAnimationFrame(loop);
}
startLevel();
state='ready';
loop();
</script></body></html>
