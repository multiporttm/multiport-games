<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Hot Air Balloon</title><meta name="description" content="Play Hot Air Balloon free online — Tap or hold to fire the burner and rise, release to descend, dodging mountains and birds while collecting stars."><link rel="canonical" href="https://games.multiportllc.com/games/hotairballoon"><meta property="og:title" content="Hot Air Balloon - Multiport Games"><meta property="og:description" content="Play Hot Air Balloon free online — Tap or hold to fire the burner and rise, release to descend, dodging mountains and birds while collecting stars."><meta property="og:url" content="https://games.multiportllc.com/games/hotairballoon"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Hot Air Balloon","description":"Play Hot Air Balloon free online instantly. Tap or hold to fire the burner and rise, release to descend, dodging mountains and birds while collecting stars. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/hotairballoon","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a3a6b;display:block;border-radius:8px}
#score-display{color:#8ecbff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Hot Air Balloon</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold / tap to fire the burner and <b>rise</b>, release to <b>descend</b>. Dodge mountains and birds while collecting stars as you drift forward!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
let best=parseFloat(localStorage.getItem('hotairballoon_best')||'0');
let balloon,obstacles,stars,dist,speed,frame,gameOver,started,burning;

function reset(){
  balloon={x:150,y:H/2,vy:0};
  obstacles=[];stars=[];dist=0;speed=2.6;frame=0;gameOver=false;started=false;burning=false;
}
reset();

function startBurn(){
  if(!started)started=true;
  if(gameOver){reset();return;}
  burning=true;
}
function stopBurn(){burning=false;}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();startBurn();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')stopBurn();});
c.addEventListener('mousedown',startBurn);
c.addEventListener('mouseup',stopBurn);
c.addEventListener('mouseleave',stopBurn);
c.addEventListener('touchstart',e=>{e.preventDefault();startBurn();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();stopBurn();},{passive:false});

function spawnObstacle(){
  const type=Math.random()<0.6?'mountain':'bird';
  if(type==='mountain'){
    const h=100+Math.random()*180;
    const fromTop=Math.random()<0.5;
    obstacles.push({type,x:W+40,y:fromTop?0:H-h,w:70,h,fromTop});
  }else{
    obstacles.push({type,x:W+40,y:80+Math.random()*(H-160),w:36,h:22,frame:0});
  }
}
function spawnStar(){
  stars.push({x:W+30,y:60+Math.random()*(H-120),r:12,taken:false});
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawBalloon(){
  ctx.save();
  ctx.translate(balloon.x,balloon.y);
  ctx.fillStyle='#ff477e';
  ctx.beginPath();ctx.ellipse(0,0,28,36,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.moveTo(-10,30);ctx.lineTo(10,30);ctx.lineTo(6,50);ctx.lineTo(-6,50);ctx.closePath();ctx.fill();
  if(burning){
    ctx.fillStyle='rgba(255,150,0,0.8)';
    ctx.beginPath();ctx.moveTo(-6,50);ctx.lineTo(6,50);ctx.lineTo(0,66+Math.random()*8);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawObstacle(o){
  ctx.save();
  if(o.type==='mountain'){
    ctx.fillStyle='#4a3728';
    if(o.fromTop)ctx.fillRect(o.x,0,o.w,o.h);
    else ctx.fillRect(o.x,H-o.h,o.w,o.h);
  }else{
    ctx.fillStyle='#2c2c2c';
    const flap=Math.sin(o.frame/5)*8;
    ctx.beginPath();
    ctx.moveTo(o.x,o.y);
    ctx.quadraticCurveTo(o.x-16,o.y-flap,o.x-30,o.y);
    ctx.quadraticCurveTo(o.x-16,o.y+4,o.x,o.y);
    ctx.quadraticCurveTo(o.x+16,o.y-flap,o.x+30,o.y);
    ctx.quadraticCurveTo(o.x+16,o.y+4,o.x,o.y);
    ctx.fill();
  }
  ctx.restore();
}
function drawStar(s){
  ctx.save();
  ctx.fillStyle='#ffe066';
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(Math.PI*2/5)*i-Math.PI/2;
    const x=s.x+Math.cos(a)*s.r,y=s.y+Math.sin(a)*s.r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    const a2=a+Math.PI/5;
    ctx.lineTo(s.x+Math.cos(a2)*s.r*0.45,s.y+Math.sin(a2)*s.r*0.45);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();
}

let starsCollected=0;
function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a1f3d');sky.addColorStop(1,'#3a6ea5');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(gameOver){
    obstacles.forEach(drawObstacle);
    stars.forEach(s=>{if(!s.taken)drawStar(s);});
    drawBalloon();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('crashed_title','CRASHED!'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+20);
    document.getElementById('score-display').textContent=I18N.t('distance_best_label','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',Math.floor(best));
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffffffaa';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint4','Hold or tap to fire the burner and start'),W/2,H/2);
    drawBalloon();
    requestAnimationFrame(loop);return;
  }

  frame++;
  dist+=speed*0.15;
  if(dist>best){best=dist;localStorage.setItem('hotairballoon_best',best);}
  speed=2.6+dist/500;

  balloon.vy+=burning?-0.5:0.32;
  balloon.vy*=0.94;
  balloon.y+=balloon.vy;
  if(balloon.y<30){balloon.y=30;balloon.vy=0;}
  if(balloon.y>H-30){balloon.y=H-30;balloon.vy=0;}

  if(frame%95===0)spawnObstacle();
  if(frame%130===0)spawnStar();

  obstacles=obstacles.filter(o=>o.x>-80);
  obstacles.forEach(o=>{
    o.x-=speed;
    if(o.frame!==undefined)o.frame++;
    drawObstacle(o);
    const bb={x:balloon.x-24,y:balloon.y-32,w:48,h:64};
    if(rectHit(bb,{x:o.x,y:o.y,w:o.w,h:o.h})){gameOver=true;SFX.lose();}
  });

  stars=stars.filter(s=>s.x>-40);
  stars.forEach(s=>{
    s.x-=speed;
    if(!s.taken){
      drawStar(s);
      if(Math.hypot(s.x-balloon.x,s.y-balloon.y)<34){s.taken=true;starsCollected++;SFX.coin();}
    }
  });

  drawBalloon();
  document.getElementById('score-display').textContent=I18N.t('distance_best_label','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',Math.floor(best));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
