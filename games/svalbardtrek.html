<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Svalbard Trek</title><meta name="description" content="Play Svalbard Trek free online — Press Space/Up or Tap to jump crevasses, Down/Tap-lower to duck under ice ridges. Manage your stamina and warmth to reach camp before nightfall."><link rel="canonical" href="https://games.multiportllc.com/games/svalbardtrek"><meta property="og:title" content="Svalbard Trek - Multiport Games"><meta property="og:description" content="Play Svalbard Trek free online — Press Space/Up or Tap to jump crevasses, Down/Tap-lower to duck under ice ridges. Manage your stamina and warmth to reach camp before nightfall."><meta property="og:url" content="https://games.multiportllc.com/games/svalbardtrek"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Svalbard Trek","description":"Play Svalbard Trek free online instantly. Trek across the rugged Svalbard arctic archipelago, jumping crevasses and ducking ice ridges while managing stamina and cold-exposure to reach each day's camp marker before exhaustion or nightfall. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/svalbardtrek","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#9fd3e8;display:block;border-radius:8px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 4px;color:#eaf6ff;font-size:.95rem;font-weight:700}
#hud .meter{display:flex;align-items:center;gap:6px}
#hud .bar{width:90px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
#hud .fill{height:100%;border-radius:6px;transition:width .15s linear}
#stamFill{background:linear-gradient(90deg,#7ec850,#cde87a)}
#warmFill{background:linear-gradient(90deg,#ff8a3d,#ffd54f)}
#dayLabel{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Svalbard Trek</div>
  <div class="game-frame">
    <div id="hud">
      <div id="dayLabel">Day 1</div>
      <div class="meter">Stamina <div class="bar"><div class="fill" id="stamFill" style="width:100%"></div></div></div>
      <div class="meter">Warmth <div class="bar"><div class="fill" id="warmFill" style="width:100%"></div></div></div>
      <div id="score-display">Dist: 0 | Hi: 0</div>
    </div>
    <canvas id="c" width="800" height="250"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space/Up Arrow</b> or <b>Tap top half</b> to jump crevasses. Press <b>Down Arrow</b> or <b>Tap bottom half</b> to duck under ice ridges. Walk over supply caches to recover stamina and warmth. Reach each day's camp marker before either meter runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const HIKEY='svalbardtrek_hi';
let hi=parseFloat(localStorage.getItem(HIKEY)||'0');
let dist=0,totalDist=0,spd=5,frame=0,gameOver=false,started=false,day=1;
let stamina=100,warmth=100,campDist=600;
const hiker={x:90,y:200,w:34,h:50,vy:0,jumps:0,ducking:false};
const ground=200;
let obs=[],cache=[];
let lastTime=null,obsTimer=0,cacheTimer=0;

function reset(){
  dist=0;spd=5;frame=0;gameOver=false;started=false;day=1;campDist=600;
  stamina=100;warmth=100;hiker.y=ground;hiker.vy=0;hiker.jumps=0;hiker.ducking=false;
  obs=[];cache=[];lastTime=null;obsTimer=0;cacheTimer=0;
  document.getElementById('dayLabel').textContent=I18N.t('day_label','Day {d}').replace('{d}',day);
}

function jump(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(hiker.ducking)return;
  if(hiker.jumps<2){hiker.vy=-13+hiker.jumps*2;hiker.jumps++;SFX.jump();}
}
function setDuck(v){
  if(!started||gameOver)return;
  hiker.ducking=v;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='ArrowDown'){e.preventDefault();setDuck(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowDown')setDuck(false);
});
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const y=(e.clientY-r.top)/r.height;
  if(!started||gameOver){jump();return;}
  if(y>0.6)setDuck(true); else jump();
});
c.addEventListener('pointerup',()=>setDuck(false));
c.addEventListener('pointercancel',()=>setDuck(false));
c.addEventListener('touchstart',e=>{e.preventDefault();
  const r=c.getBoundingClientRect();
  const touch=e.touches[0];
  const y=(touch.clientY-r.top)/r.height;
  if(!started||gameOver){jump();return;}
  if(y>0.6)setDuck(true); else jump();
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();setDuck(false);},{passive:false});

function spawnObs(){
  const type=Math.random()<0.55?'crevasse':'ridge';
  if(type==='crevasse'){
    obs.push({type,x:820,w:46,h:14,y:ground+hiker.h-6});
  }else{
    obs.push({type,x:820,w:34,h:60,y:ground-28});
  }
}
function spawnCache(){
  cache.push({x:820,y:ground+hiker.h-18,w:20,h:20,taken:false});
}

function drawHiker(){
  ctx.save();
  const h=hiker.ducking?hiker.h*0.55:hiker.h;
  const yTop=hiker.ducking?hiker.y+hiker.h-h:hiker.y;
  ctx.fillStyle='#d94f4f';
  ctx.fillRect(hiker.x,yTop,hiker.w,h);
  ctx.fillStyle='#f2c08a';
  ctx.fillRect(hiker.x+hiker.w-14,yTop-14,20,16);
  ctx.fillStyle='#2b2b3a';
  ctx.fillRect(hiker.x+hiker.w-4,yTop-10,4,4);
  const legOff=Math.floor(frame/6)%2===0?0:8;
  ctx.fillStyle='#8a3a3a';
  ctx.fillRect(hiker.x+4,yTop+h,8,10+legOff);
  ctx.fillRect(hiker.x+hiker.w-12,yTop+h,8,10+(8-legOff));
  ctx.restore();
}
function drawObs(o){
  if(o.type==='crevasse'){
    ctx.fillStyle='#0d2538';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#1c4a63';
    ctx.fillRect(o.x+4,o.y+2,o.w-8,o.h-6);
  }else{
    ctx.fillStyle='#d8e8ef';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#b9d4de';
    ctx.fillRect(o.x+4,o.y+6,o.w-8,o.h-12);
  }
}
function drawCache(k){
  if(k.taken)return;
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(k.x,k.y,k.w,k.h);
  ctx.fillStyle='#b8860b';
  ctx.fillRect(k.x+4,k.y+4,k.w-8,k.h-8);
}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function endRun(){
  gameOver=true;
  if(totalDist+dist>hi){hi=totalDist+dist;localStorage.setItem(HIKEY,String(Math.floor(hi)));}
  SFX.lose();
}

function nextDay(){
  totalDist+=campDist;
  day++;
  campDist=600+day*120;
  spd+=0.6;
  dist=0;
  stamina=Math.min(100,stamina+30);
  warmth=Math.min(100,warmth+30);
  obs=[];cache=[];obsTimer=0;cacheTimer=0;
  document.getElementById('dayLabel').textContent=I18N.t('day_label','Day {d}').replace('{d}',day);
  SFX.success();
}

function loop(){
  ctx.clearRect(0,0,800,250);
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#1c4a63');sky.addColorStop(1,'#9fd3e8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,250);
  ctx.fillStyle='#e8f4fa';ctx.fillRect(0,ground+hiker.h,800,50);
  ctx.fillStyle='#c7dde8';ctx.fillRect(0,ground+hiker.h,800,4);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','YOU COLLAPSED'),400,110);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,148);
    updateHud();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#0d2538cc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start trekking'),400,120);
    drawHiker();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;dist+=dt*(spd/5);

  stamina-=0.045*dt;
  warmth-=(0.035+day*0.004)*dt;
  if(hiker.ducking)stamina-=0.03*dt;
  if(stamina<=0||warmth<=0){endRun();}

  obsTimer+=dt;
  const obsInterval=Math.max(40,95-day*4);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObs();}
  cacheTimer+=dt;
  if(cacheTimer>=180){cacheTimer-=180;spawnCache();}

  hiker.vy+=0.7*dt;hiker.y+=hiker.vy*dt;
  if(hiker.y>=ground){hiker.y=ground;hiker.vy=0;hiker.jumps=0;}

  const duckH=hiker.ducking?hiker.h*0.55:hiker.h;
  const duckY=hiker.ducking?hiker.y+hiker.h-duckH:hiker.y;
  const hikerHit={x:hiker.x+4,y:duckY,w:hiker.w-4,h:duckH};

  obs=obs.filter(o=>o.x>-50);
  obs.forEach(o=>{o.x-=spd*dt;drawObs(o);
    if(!gameOver&&rect(hikerHit,{x:o.x,y:o.y,w:o.w,h:o.h})){
      stamina-=18;warmth-=6;SFX.hit();
      o.x=-999;
    }
  });
  cache=cache.filter(k=>k.x>-30);
  cache.forEach(k=>{k.x-=spd*dt;drawCache(k);
    if(!k.taken&&rect(hikerHit,{x:k.x,y:k.y,w:k.w,h:k.h})){
      k.taken=true;stamina=Math.min(100,stamina+22);warmth=Math.min(100,warmth+22);SFX.powerup();
    }
  });

  drawHiker();
  if(!gameOver&&dist>=campDist){nextDay();}
  updateHud();
  requestAnimationFrame(loop);
}
function updateHud(){
  document.getElementById('stamFill').style.width=Math.max(0,stamina)+'%';
  document.getElementById('warmFill').style.width=Math.max(0,warmth)+'%';
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Dist: {s} | Hi: {h}').replace('{s}',Math.floor(totalDist+dist)).replace('{h}',Math.floor(hi));
}
reset();
loop();
</script></body></html>
