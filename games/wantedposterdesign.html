<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#2b1d10;border-radius:14px;padding:18px;max-width:820px;margin:0 auto;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
#report{background:#16213e;color:#e0e0e0;border-radius:10px;padding:14px 16px;flex:1 1 300px;min-width:260px;font-size:.9rem;line-height:1.5}
#report h3{color:#ffd54f;margin-bottom:6px}
#builder{flex:1 1 320px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.field{background:#3a2a18;border-radius:10px;padding:10px}
.field label{display:block;color:#ffd54f;font-weight:700;font-size:.85rem;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:#5a3d20;color:#f3e2b3;border:2px solid transparent;border-radius:16px;padding:6px 12px;font-size:.8rem;cursor:pointer;user-select:none}
.opt.selected{border-color:#ffd54f;background:#7a1f1f;color:#fff}
#poster{background:#f3e2b3;color:#2b1d10;border:4px double #6b4a26;border-radius:8px;padding:12px;font-family:Georgia,serif;text-align:center;min-height:120px}
#poster h2{letter-spacing:3px;color:#7a1f1f;margin-bottom:4px}
#submitBtn{background:#7a1f1f;color:#fff;border:none;border-radius:20px;padding:10px 24px;font-size:1rem;cursor:pointer;align-self:center}
#submitBtn:disabled{opacity:.5;cursor:not-allowed}
#statusRow{width:100%;display:flex;justify-content:space-between;color:#fff;font-weight:700;flex-wrap:wrap;gap:6px}
#lives{color:#ffd54f}
#msg{width:100%;text-align:center;min-height:1.4em;color:#ffd54f;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wanted Poster Design</div>
  <div class="game-frame">
    <div id="table">
      <div id="statusRow">
        <span id="scoreLine">Score: 0 | Hi: 0</span>
        <span id="lives">❤❤❤</span>
      </div>
      <div id="report">
        <h3 data-i18n="report_title">Sheriff's Report</h3>
        <div id="reportText"></div>
      </div>
      <div id="builder">
        <div class="field"><label data-i18n="feature_label">Facial Feature</label><div class="opts" id="featureOpts"></div></div>
        <div class="field"><label data-i18n="bounty_label">Bounty Amount</label><div class="opts" id="bountyOpts"></div></div>
        <div class="field"><label data-i18n="crimes_label">Crimes (select all that apply)</label><div class="opts" id="crimeOpts"></div></div>
        <div id="poster">
          <h2 data-i18n="wanted_title">WANTED</h2>
          <div id="posterBody"></div>
        </div>
        <button id="submitBtn">Submit Poster</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the <b>sheriff's report</b>, then build the poster by choosing the matching <b>facial feature</b>, <b>bounty amount</b>, and <b>every crime listed</b> (and only those). Click <b>Submit Poster</b> when it exactly matches the report.</div>
</div>
<script>
const FEATURES=['Scarred cheek','Missing tooth','Crooked nose','Gold tooth','Eyepatch','Burn mark'];
const BOUNTIES=[250,500,750,1000,1500,2000,3000];
const CRIMES=['Bank Robbery','Cattle Rustling','Train Heist','Horse Theft','Saloon Brawling','Stagecoach Ambush','Jailbreak','Claim Jumping'];
const NAMES=['"Rattlesnake" Ray','"Black" Hollis','"Iron" Sal','"Two-Bit" Tanner','"Coyote" Mae','"Deadeye" Doss'];

let score=0,hi=parseInt(localStorage.getItem('wantedposterdesign_hi')||'0',10),lives=3,level=1,target=null,selFeature=null,selBounty=null,selCrimes=new Set(),locked=false;

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function newRound(){
  locked=false;
  selFeature=null;selBounty=null;selCrimes=new Set();
  const crimeCount=Math.min(1+Math.floor(level/2),4);
  const shuffledCrimes=shuffle(CRIMES).slice(0,crimeCount);
  target={
    name:rand(NAMES),
    feature:rand(FEATURES),
    bounty:rand(BOUNTIES),
    crimes:new Set(shuffledCrimes)
  };
  document.getElementById('reportText').innerHTML=
    I18N.t('report_body','Outlaw <b>{n}</b> has a <b>{f}</b>. Bounty: <b>${b}</b>. Wanted for: <b>{c}</b>.')
      .replace('{n}',target.name).replace('{f}',target.feature).replace('{b}',target.bounty.toLocaleString())
      .replace('{c}',Array.from(target.crimes).join(', '));
  renderOpts();
  renderPoster();
  document.getElementById('msg').textContent='';
  updateStatus();
}

function renderOpts(){
  const fWrap=document.getElementById('featureOpts');fWrap.innerHTML='';
  shuffle(FEATURES).forEach(f=>{
    const el=document.createElement('div');el.className='opt';el.textContent=f;
    el.onclick=()=>{if(locked)return;selFeature=f;renderOpts();renderPoster();SFX.select();};
    if(selFeature===f)el.classList.add('selected');
    fWrap.appendChild(el);
  });
  const bWrap=document.getElementById('bountyOpts');bWrap.innerHTML='';
  shuffle(BOUNTIES).forEach(b=>{
    const el=document.createElement('div');el.className='opt';el.textContent='$'+b.toLocaleString();
    el.onclick=()=>{if(locked)return;selBounty=b;renderOpts();renderPoster();SFX.select();};
    if(selBounty===b)el.classList.add('selected');
    bWrap.appendChild(el);
  });
  const cWrap=document.getElementById('crimeOpts');cWrap.innerHTML='';
  CRIMES.forEach(c=>{
    const el=document.createElement('div');el.className='opt';el.textContent=c;
    el.onclick=()=>{
      if(locked)return;
      if(selCrimes.has(c))selCrimes.delete(c);else selCrimes.add(c);
      renderOpts();renderPoster();SFX.select();
    };
    if(selCrimes.has(c))el.classList.add('selected');
    cWrap.appendChild(el);
  });
}

function renderPoster(){
  const body=document.getElementById('posterBody');
  const crimesText=selCrimes.size?Array.from(selCrimes).join(', '):'—';
  body.innerHTML=
    '<div>'+target.name+'</div>'+
    '<div>'+I18N.t('feature_line','Feature: {v}').replace('{v}',selFeature||'—')+'</div>'+
    '<div>'+I18N.t('bounty_line','Bounty: {v}').replace('{v}',selBounty?('$'+selBounty.toLocaleString()):'—')+'</div>'+
    '<div>'+I18N.t('crimes_line','Crimes: {v}').replace('{v}',crimesText)+'</div>';
}

function updateStatus(){
  document.getElementById('scoreLine').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives').textContent='❤'.repeat(Math.max(lives,0))+'♡'.repeat(3-Math.max(lives,0));
}

function crimesMatch(){
  if(selCrimes.size!==target.crimes.size)return false;
  for(const c of selCrimes)if(!target.crimes.has(c))return false;
  return true;
}

function submit(){
  if(locked)return;
  const ok=selFeature===target.feature&&selBounty===target.bounty&&crimesMatch();
  if(ok){
    locked=true;
    score+=15*level;
    if(score>hi){hi=score;localStorage.setItem('wantedposterdesign_hi',hi);}
    SFX.success();
    document.getElementById('msg').textContent=I18N.t('board_approved','Poster approved by the town board!');
    level++;
    updateStatus();
    setTimeout(newRound,1200);
  }else{
    SFX.error();
    lives--;
    updateStatus();
    if(lives<=0){
      SFX.lose();
      document.getElementById('msg').textContent=I18N.t('board_rejected_final','The board rejects your posters for good this time. Click Submit to try again.');
      score=0;lives=3;level=1;
      document.getElementById('submitBtn').onclick=()=>{document.getElementById('submitBtn').onclick=submit;newRound();};
    }else{
      document.getElementById('msg').textContent=I18N.t('board_rejected',"Rejected — details don't match the report. Try again.");
    }
  }
}

document.getElementById('submitBtn').onclick=submit;

document.addEventListener('keydown',e=>{
  if(e.code==='Enter')submit();
});

updateStatus();
newRound();
</script></body></html>
