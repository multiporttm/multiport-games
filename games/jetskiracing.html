<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Jet Ski Racing</title><meta name="description" content="Play Jet Ski Racing free online — Use Left/Right Arrows or A/D (or drag) to steer between the buoys. Ride the wake chevrons for a speed boost and avoid crashing into rivals or buoys. Race across 3 heats to win the best overall finish!"><link rel="canonical" href="https://games.multiportllc.com/games/jetskiracing"><meta property="og:title" content="Jet Ski Racing - Multiport Games"><meta property="og:description" content="Play Jet Ski Racing free online — Use Left/Right Arrows or A/D (or drag) to steer between the buoys. Ride the wake chevrons for a speed boost and avoid crashing into rivals or buoys. Race across 3 heats to win the best overall finish!"><meta property="og:url" content="https://games.multiportllc.com/games/jetskiracing"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Jet Ski Racing","description":"Play Jet Ski Racing free online instantly. Steer your jet ski through a buoy-marked open-water course, grab wake boosts, avoid rival riders, and race for the best finish across three heats. No download or signup required.","genre":"Racing","url":"https://games.multiportllc.com/games/jetskiracing","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a4a63;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;color:#dff6ff;font-size:.95rem;font-weight:700;padding:6px 4px;flex-wrap:wrap}
#hud span{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Jet Ski Racing</div>
  <div class="game-frame">
    <div id="hud"><div id="score-display">Heat 1/3 | Pos: 1st | Time: 0.0s</div><div id="hi-display">Best Time: —</div></div>
    <canvas id="c" width="480" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right Arrows</b> or <b>A/D</b> (or drag) to steer between the buoys. Ride the wake chevrons for a speed boost and avoid crashing into rivals or buoys. Race across 3 heats to earn the best overall finish!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=640;
const RACE_DIST=4000;
const TOTAL_HEATS=3;
let bestTime=parseFloat(localStorage.getItem('jetskiracing_best')||'0')||null;

let heat,totalPoints,state,lastTime;
let player,ais,obstacles,boosts,elapsed,resultText,heatResults;

function makeRacer(x,baseSpeed,color){
  return {x,progress:0,speed:baseSpeed,baseSpeed,boost:0,bumpCd:0,color};
}

function newHeat(){
  player=makeRacer(W/2,3.4,'#ffd54f');
  ais=[
    makeRacer(W*0.3,3.1,'#ff6b6b'),
    makeRacer(W*0.5,3.3,'#6bc4ff'),
    makeRacer(W*0.7,3.0,'#7ec850'),
  ];
  obstacles=[];boosts=[];
  let d=300;
  while(d<RACE_DIST-100){
    obstacles.push({d,x:60+Math.random()*(W-120)});
    if(Math.random()<0.55)boosts.push({d:d+120+Math.random()*60,x:60+Math.random()*(W-120)});
    d+=220+Math.random()*140;
  }
  elapsed=0;
  state='countdown';
  countdownT=3;
}
let countdownT=0;

function resetSession(){
  heat=1;totalPoints=0;heatResults=[];
  newHeat();
}
resetSession();

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(state==='result'){advance();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
let dragX=null;
c.addEventListener('pointerdown',e=>{dragX=e.clientX*(W/c.getBoundingClientRect().width);if(state==='result')advance();});
c.addEventListener('pointermove',e=>{
  if(dragX==null||state!=='racing')return;
  const rect=c.getBoundingClientRect();
  const nx=(e.clientX-rect.left)*(W/rect.width);
  player.x += (nx-player.x)*0.25;
  dragX=e.clientX;
});
window.addEventListener('pointerup',()=>{dragX=null;});

function advance(){
  if(heat>=TOTAL_HEATS){resetSession();return;}
  heat++;newHeat();
}

function aiThink(ai,dt){
  // gentle weaving + rubber band toward player progress
  ai.speed=ai.baseSpeed+Math.sin((ai.progress+ai.x)*0.01)*0.25;
  if(ai.progress<player.progress-150)ai.speed+=0.4;
  if(ai.progress>player.progress+150)ai.speed-=0.4;
  ai.x+=Math.sin(ai.progress*0.008+ai.x)*1.1*dt;
  ai.x=Math.max(40,Math.min(W-40,ai.x));
}

function rankAll(){
  const all=[{r:player,me:true},...ais.map(r=>({r,me:false}))];
  all.sort((a,b)=>b.r.progress-a.r.progress);
  return all;
}

function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';}

function loop(now){
  if(lastTime==null)lastTime=now;
  const dt=Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  ctx.clearRect(0,0,W,H);
  drawWater();

  if(state==='countdown'){
    countdownT-=dt/60;
    drawTrackStatic();
    ctx.fillStyle='#fff';ctx.font='bold 54px Arial';ctx.textAlign='center';
    ctx.fillText(countdownT>0?Math.ceil(countdownT):I18N.t('go_label','GO!'),W/2,H/2);
    if(countdownT<=-0.5)state='racing';
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(state==='racing'){
    elapsed+=dt/60;
    if(keys['ArrowLeft']||keys['KeyA'])player.x-=4.2*dt;
    if(keys['ArrowRight']||keys['KeyD'])player.x+=4.2*dt;
    player.x=Math.max(30,Math.min(W-30,player.x));

    obstacles.forEach(o=>{
      if(!o.hit && Math.abs(o.d-player.progress)<18 && Math.abs(o.x-player.x)<24){
        o.hit=true;player.speed=player.baseSpeed*0.4;SFX.hit();
      }
    });
    boosts.forEach(b=>{
      if(!b.used && Math.abs(b.d-player.progress)<20 && Math.abs(b.x-player.x)<28){
        b.used=true;player.boost=45;SFX.powerup();
      }
    });

    player.boost=Math.max(0,player.boost-dt);
    const boostMul=player.boost>0?1.6:1;
    player.speed += (player.baseSpeed-player.speed)*0.06*dt;
    player.progress += player.speed*boostMul*dt*3;

    ais.forEach(ai=>{
      aiThink(ai,dt);
      ai.progress+=ai.speed*dt*3;
      if(Math.abs(ai.progress-player.progress)<16 && Math.abs(ai.x-player.x)<26 && ai.bumpCd<=0 ){
        player.speed*=0.85;ai.bumpCd=40;SFX.hit();
      }
      ai.bumpCd=Math.max(0,ai.bumpCd-dt);
    });

    drawTrack();
    updateHud();

    if(player.progress>=RACE_DIST){
      const ranking=rankAll();
      const pos=ranking.findIndex(x=>x.me)+1;
      const pts=[10,7,5,3][pos-1]||1;
      totalPoints+=pts;
      heatResults.push({pos,time:elapsed});
      if(heat===TOTAL_HEATS){
        if(bestTime==null||elapsed<bestTime){}
        const totalTime=heatResults.reduce((s,h)=>s+h.time,0);
        if(bestTime==null||totalTime<bestTime){bestTime=totalTime;localStorage.setItem('jetskiracing_best',String(bestTime));}
      }
      resultText={pos,pts,elapsed};
      state='result';
      SFX.win();
    }
    requestAnimationFrame(loop);return;
  }

  if(state==='result'){
    drawTrackStatic();
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('heat_finish','Heat {h} Finished!').replace('{h}',heat),W/2,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('finish_pos','Finished: {p}').replace('{p}',ordinal(resultText.pos)),W/2,220);
    ctx.fillText(I18N.t('finish_time','Time: {t}s').replace('{t}',resultText.elapsed.toFixed(1)),W/2,250);
    ctx.fillText(I18N.t('total_points','Total Points: {p}').replace('{p}',totalPoints),W/2,280);
    ctx.font='18px Arial';
    ctx.fillText(heat<TOTAL_HEATS?I18N.t('next_heat_hint','Tap or press a key for next heat'):I18N.t('session_done_hint','Session complete! Tap or press a key to race again'),W/2,320);
    updateHud();
    requestAnimationFrame(loop);return;
  }
}

let waterT=0;
function drawWater(){
  waterT+=1;
  ctx.fillStyle='#0d5a78';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;
  for(let i=0;i<10;i++){
    const y=((i*70)+waterT*3)%H;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y-20);ctx.stroke();
  }
}

function worldY(d){ return H-100 - (d-player.progress); }

function drawTrackStatic(){
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(20,0,10,H);ctx.fillRect(W-30,0,10,H);
}

function drawTrack(){
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(20,0,10,H);ctx.fillRect(W-30,0,10,H);

  obstacles.forEach(o=>{
    const y=worldY(o.d);
    if(y<-30||y>H+30)return;
    ctx.fillStyle=o.hit?'#888':'#ff5e5e';
    ctx.beginPath();ctx.arc(o.x,y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,y,5,0,Math.PI*2);ctx.fill();
  });
  boosts.forEach(b=>{
    const y=worldY(b.d);
    if(y<-30||y>H+30)return;
    ctx.strokeStyle=b.used?'rgba(255,213,79,.25)':'#ffd54f';
    ctx.lineWidth=4;
    for(let k=0;k<3;k++){
      ctx.beginPath();
      ctx.moveTo(b.x-20,y+10-k*10);ctx.lineTo(b.x,y-6-k*10);ctx.lineTo(b.x+20,y+10-k*10);
      ctx.stroke();
    }
  });

  ais.forEach(ai=>drawBoat(ai.x,worldY(ai.progress),ai.color));
  drawBoat(player.x,worldY(player.progress),player.color,true);
}

function drawBoat(x,y,color,isPlayer){
  if(y<-40||y>H+40)return;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-10,40);ctx.lineTo(10,40);ctx.closePath();ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(12,14);ctx.lineTo(-12,14);ctx.closePath();ctx.fill();
  if(isPlayer && player.boost>0){
    ctx.fillStyle='rgba(255,213,79,.8)';
    ctx.beginPath();ctx.moveTo(-6,16);ctx.lineTo(0,36);ctx.lineTo(6,16);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function updateHud(){
  const ranking=rankAll();
  const pos=ranking.findIndex(x=>x.me)+1;
  document.getElementById('score-display').textContent=
    I18N.t('jetski_hud','Heat {h}/{n} | Pos: {p} | Time: {t}s').replace('{h}',heat).replace('{n}',TOTAL_HEATS).replace('{p}',ordinal(pos)).replace('{t}',elapsed.toFixed(1));
  document.getElementById('hi-display').textContent=
    I18N.t('best_time_label','Best Total Time: {b}').replace('{b}',bestTime!=null?bestTime.toFixed(1)+'s':'—');
}

requestAnimationFrame(loop);
</script></body></html>
