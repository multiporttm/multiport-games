<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#7b1fa2,#f8bbd0);display:block;border-radius:8px;touch-action:none;cursor:none}
#score-display{color:#f8bbd0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Butterfly Catch</div>
  <div class="game-frame">
    <div id="score-display">Caught: 0 | Hi: 0 | Time: 45</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your net with the <b>Mouse</b>, <b>Arrow Keys</b>, or <b>Touch</b>, then <b>Click / Tap</b> near a butterfly to swing your net and catch it. Rarer, faster butterflies are worth more points!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let hi=parseInt(localStorage.getItem('butterflycatch_hi')||'0');
let caught=0,timeLeft=45,gameOver=false,started=false,lastTime=null;
const net={x:400,y:225,r:34,swing:0};
const keys={};
let butterflies=[];
let particles=[];
const colors=[
  {body:'#ffca28',wing:'#ffe082',rarity:0,pts:5,spd:1.0},
  {body:'#ef5350',wing:'#ffcdd2',rarity:0,pts:5,spd:1.0},
  {body:'#42a5f5',wing:'#bbdefb',rarity:1,pts:10,spd:1.4},
  {body:'#ab47bc',wing:'#e1bee7',rarity:1,pts:10,spd:1.4},
  {body:'#26c6da',wing:'#b2ebf2',rarity:2,pts:25,spd:2.0},
  {body:'#ffee58',wing:'#fff9c4',rarity:3,pts:50,spd:2.6}
];

function spawnButterfly(){
  const r=Math.random();
  let palette;
  if(r<0.55)palette=colors[Math.floor(Math.random()*2)];
  else if(r<0.85)palette=colors[2+Math.floor(Math.random()*2)];
  else if(r<0.96)palette=colors[4];
  else palette=colors[5];
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-20;}
  else if(edge===1){x=W+20;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}
  butterflies.push({
    x,y,palette,
    baseX:x,baseY:y,
    ang:Math.random()*Math.PI*2,
    angVel:(Math.random()*0.02+0.01)*(Math.random()<0.5?-1:1),
    wobble:Math.random()*Math.PI*2,
    flap:0,
    tx:Math.random()*W,ty:Math.random()*H,
    caught:false,fleeing:0
  });
}

function reset(){
  caught=0;timeLeft=45;gameOver=false;started=false;lastTime=null;
  butterflies=[];particles=[];
  for(let i=0;i<6;i++)spawnButterfly();
}
reset();

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

c.addEventListener('mousemove',e=>{ if(!started||gameOver)return; const p=pointerPos(e); net.x=p.x;net.y=p.y; });
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(!started){started=true;} const p=pointerPos(e); net.x=p.x;net.y=p.y; },{passive:false});

function swing(px,py){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  net.swing=10;
  SFX.swoosh();
  let bestIdx=-1,bestDist=Infinity;
  for(let i=0;i<butterflies.length;i++){
    const b=butterflies[i];
    if(b.caught)continue;
    const d=Math.hypot(b.x-net.x,b.y-net.y);
    if(d<net.r+14&&d<bestDist){bestDist=d;bestIdx=i;}
  }
  if(bestIdx>=0){
    const b=butterflies[bestIdx];
    b.caught=true;
    caught++;
    const pts=b.palette.pts;
    for(let i=0;i<10;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:30,color:b.palette.body});
    SFX.catch();
    if(caught%5===0)SFX.levelup();
    butterflies=butterflies.filter(x=>x!==b);
    spawnButterfly();
  } else {
    SFX.error();
  }
}

c.addEventListener('click',e=>{ const p=pointerPos(e); net.x=p.x;net.y=p.y; swing(p.x,p.y); });
c.addEventListener('touchstart',e=>{ e.preventDefault(); const p=pointerPos(e); net.x=p.x;net.y=p.y; swing(p.x,p.y); },{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();keys[e.code]=true;if(!started)started=true;}
  if(e.code==='Space'){e.preventDefault();swing(net.x,net.y);}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function updateNetKeys(dt){
  const spd=6*dt;
  if(keys.ArrowUp)net.y-=spd;
  if(keys.ArrowDown)net.y+=spd;
  if(keys.ArrowLeft)net.x-=spd;
  if(keys.ArrowRight)net.x+=spd;
  net.x=Math.max(10,Math.min(W-10,net.x));
  net.y=Math.max(10,Math.min(H-10,net.y));
}

function drawNet(){
  ctx.save();
  ctx.translate(net.x,net.y);
  const s=net.swing>0?1.3:1;
  ctx.scale(s,s);
  ctx.strokeStyle='#5d4037';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-6,net.r+10);ctx.stroke();
  ctx.beginPath();ctx.arc(-6,0,net.r,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fill();
  ctx.restore();
  if(net.swing>0)net.swing--;
}

function drawButterfly(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(Math.sin(b.wobble)*0.3);
  const flap=Math.sin(b.flap)*0.9;
  ctx.fillStyle=b.palette.wing;
  ctx.save();ctx.scale(1+flap*0.3,1);
  ctx.beginPath();ctx.ellipse(-8,-6,9,7,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-8,6,7,6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.scale(1-flap*0.3,1);
  ctx.beginPath();ctx.ellipse(8,-6,9,7,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(8,6,7,6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=b.palette.body;
  ctx.fillRect(-1.5,-9,3,18);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,W,H);
  sky.addColorStop(0,'#7b1fa2');sky.addColorStop(1,'#f8bbd0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<5;i++)ctx.beginPath(),ctx.ellipse(100+i*160,H-30,80,20,0,0,Math.PI*2),ctx.fill();

  if(gameOver){
    if(caught>hi){hi=caught;localStorage.setItem('butterflycatch_hi',hi);}
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('bc_final','Caught: {c}').replace('{c}',caught),W/2,220);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Click to restart'),W/2,255);
    document.getElementById('score-display').textContent=I18N.t('bc_status','Caught: {c} | Hi: {h} | Time: {t}').replace('{c}',caught).replace('{h}',hi).replace('{t}','0');
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bc_start','Move & Click / Tap to start'),W/2,H/2);
    butterflies.forEach(drawButterfly);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  timeLeft-=dt/60;
  if(timeLeft<=0){timeLeft=0;gameOver=true;SFX.lose();}

  updateNetKeys(dt);

  butterflies.forEach(b=>{
    b.flap+=0.3*dt;
    b.wobble+=0.05*dt;
    b.ang+=b.angVel*dt;
    const dx=b.tx-b.x,dy=b.ty-b.y;
    const d=Math.hypot(dx,dy);
    if(d<20){b.tx=Math.random()*W;b.ty=Math.random()*H;}
    const curveX=Math.cos(b.ang)*2;
    const curveY=Math.sin(b.ang*1.3)*2;
    const dirX=(dx/(d||1))*b.palette.spd;
    const dirY=(dy/(d||1))*b.palette.spd;
    b.x+=(dirX+curveX)*dt;
    b.y+=(dirY+curveY)*dt;
    b.x=Math.max(10,Math.min(W-10,b.x));
    b.y=Math.max(10,Math.min(H-10,b.y));
    drawButterfly(b);
  });

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  drawNet();

  document.getElementById('score-display').textContent=I18N.t('bc_status','Caught: {c} | Hi: {h} | Time: {t}').replace('{c}',caught).replace('{h}',hi).replace('{t}',Math.ceil(timeLeft));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
