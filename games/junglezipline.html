<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0f5c2e,#1b8a3a);display:block;border-radius:8px}
#score-display{color:#c8ffd4;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Jungle Zipline</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to release your zipline and grab the next cable when it's in reach. Avoid branches, vines, and birds, and grab jungle fruit for bonus points!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let dist=0,hi=0,gameOver=false,started=false;
hi=parseFloat(localStorage.getItem('junglezipline_hi')||'0');

let spd=4;
let scrollX=0;
const gravity=0.5;

// rider state relative to world; anchorX tracks the current zipline's fixed world x (post scroll)
const rider={x:220,y:150,vy:0,onLine:true};
let currentLine=null; // {worldX, topY, botY}
let lines=[]; // upcoming zipline cables {worldX, topY,botY, used}
let obstacles=[]; // {worldX,y,w,h,type}
let fruits=[]; // {worldX,y,collected}
let spawnTimer=0, obsTimer=0, fruitTimer=0;
let particles=[];

function rand(a,b){return a+Math.random()*(b-a);}

function reset(){
  dist=0;gameOver=false;started=false;spd=4;scrollX=0;
  rider.x=220;rider.y=150;rider.vy=0;rider.onLine=true;
  lines=[{worldX:220,topY:20,botY:400}];
  currentLine=lines[0];
  obstacles=[];fruits=[];spawnTimer=0;obsTimer=0;fruitTimer=0;particles=[];
  spawnNextLine();
}

function spawnNextLine(){
  const last=lines[lines.length-1];
  const worldX=last.worldX+rand(260,340);
  lines.push({worldX,topY:rand(10,60),botY:rand(360,410),used:false});
}

function spawnObstacle(){
  const worldX=scrollX+W+rand(0,60);
  const types=['branch','bird'];
  const type=types[Math.floor(Math.random()*types.length)];
  const y=type==='bird'?rand(80,300):rand(120,350);
  obstacles.push({worldX,y,w:34,h:18,type});
}
function spawnFruit(){
  const worldX=scrollX+W+rand(0,80);
  const y=rand(100,320);
  fruits.push({worldX,y,collected:false});
}

reset();

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('jungle_score_label','Distance: {d}m | Hi: {h}m')
      .replace('{d}',Math.floor(dist)).replace('{h}',Math.floor(hi));
}

function release(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(rider.onLine){
    rider.onLine=false;
    SFX.jump();
  } else {
    // try grab nearest upcoming line within reach
    const targetLine=lines.find(l=>!l.used && l.worldX-scrollX>rider.x-40 && l.worldX-scrollX<rider.x+70);
    if(targetLine){
      const lineYAt=(l)=>l.topY+(l.botY-l.topY)*0.4;
      const ly=lineYAt(targetLine);
      if(Math.abs(rider.y-ly)<70){
        targetLine.used=true;
        currentLine=targetLine;
        rider.onLine=true;
        rider.vy=0;
        SFX.catch();
      } else {
        // grabbed wrong spot -> treat as miss, but only fail if too far off, else just no-op
      }
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();release();}});
c.addEventListener('click',release);
c.addEventListener('touchstart',e=>{e.preventDefault();release();},{passive:false});

function drawCanopy(){
  ctx.fillStyle='rgba(0,60,20,0.4)';
  for(let i=0;i<6;i++){
    const bx=(i*160-((scrollX*0.3)%160));
    ctx.beginPath();ctx.arc(bx,30,60,0,Math.PI*2);ctx.fill();
  }
}

function drawLine(l){
  const sx=l.worldX-scrollX;
  ctx.strokeStyle='#3a2a10';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx,l.topY);ctx.lineTo(sx,l.botY);ctx.stroke();
  ctx.fillStyle=l.used?'#8d6e33':'#c9a35a';
  ctx.beginPath();ctx.arc(sx,l.topY,6,0,Math.PI*2);ctx.fill();
}

function drawRider(){
  const sx=rider.x;
  ctx.save();
  ctx.translate(sx,rider.y);
  ctx.strokeStyle='#eee';ctx.lineWidth=2;
  if(rider.onLine){
    const lx=currentLine.worldX-scrollX-sx;
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(lx,-40);ctx.stroke();
  }
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(0,-6,9,0,Math.PI*2);ctx.fill(); // head
  ctx.fillStyle='#e94560';
  ctx.fillRect(-6,2,12,20); // body
  ctx.restore();
}

function drawObstacle(o){
  const sx=o.worldX-scrollX;
  if(o.type==='branch'){
    ctx.fillStyle='#5a3a1a';
    ctx.fillRect(sx,o.y,o.w,o.h);
    ctx.fillStyle='#2d5a27';
    ctx.beginPath();ctx.arc(sx+o.w,o.y+o.h/2,14,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='#333';
    ctx.beginPath();ctx.ellipse(sx+o.w/2,o.y+o.h/2,16,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffcc00';
    ctx.beginPath();ctx.arc(sx+o.w-4,o.y+o.h/2-2,3,0,Math.PI*2);ctx.fill();
  }
}

function drawFruit(f){
  if(f.collected)return;
  const sx=f.worldX-scrollX;
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.arc(sx,f.y,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4caf50';
  ctx.fillRect(sx-1,f.y-13,3,6);
}

function circleRectHit(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawCanopy();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Space / Tap to start'),W/2,H/2);
    lines.forEach(drawLine);
    drawRider();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    lines.forEach(drawLine);
    obstacles.forEach(drawObstacle);
    fruits.forEach(drawFruit);
    drawRider();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    requestAnimationFrame(loop);return;
  }

  scrollX+=spd;
  dist+=spd*0.05;
  if(dist>hi){hi=dist;localStorage.setItem('junglezipline_hi',hi);}
  spd=4+dist/200;

  // rider physics
  if(rider.onLine){
    // follow the line's slope proportionally to horizontal progress along screen
    const sx=currentLine.worldX-scrollX;
    const t=Math.max(0,Math.min(1,(rider.x-40)/(W-80)));
    // simple: gravity pulls rider down along fixed line path as it approaches then passes anchor
    rider.y+=1.6;
    if(rider.y>currentLine.botY-10){rider.y=currentLine.botY-10;}
  } else {
    rider.vy+=gravity;
    rider.y+=rider.vy;
    if(rider.y>H-20||rider.y<0){
      gameOver=true;SFX.lose();
    }
  }

  // remove passed lines, spawn more
  while(lines.length && lines[0].worldX-scrollX<-60){
    lines.shift();
  }
  while(lines[lines.length-1] && lines[lines.length-1].worldX-scrollX<W+200){
    spawnNextLine();
  }
  lines.forEach(drawLine);

  // obstacles
  obsTimer+=1;
  if(obsTimer>70){obsTimer=0;spawnObstacle();}
  obstacles=obstacles.filter(o=>o.worldX-scrollX>-60);
  obstacles.forEach(o=>{
    drawObstacle(o);
    if(circleRectHit(rider.x,rider.y,12,o.worldX-scrollX,o.y,o.w,o.h)){
      gameOver=true;SFX.lose();
    }
  });

  // fruit
  fruitTimer+=1;
  if(fruitTimer>55){fruitTimer=0;spawnFruit();}
  fruits=fruits.filter(f=>f.worldX-scrollX>-40);
  fruits.forEach(f=>{
    drawFruit(f);
    if(!f.collected){
      const sx=f.worldX-scrollX;
      const dx=rider.x-sx,dy=rider.y-f.y;
      if(Math.sqrt(dx*dx+dy*dy)<20){
        f.collected=true;dist+=5;SFX.coin();
      }
    }
  });

  drawRider();
  updateScore();
  requestAnimationFrame(loop);
}
updateScore();
loop();
</script></body></html>
