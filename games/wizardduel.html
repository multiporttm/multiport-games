<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a0f2e;cursor:pointer}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wizard Duel</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Round: 1 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Watch the 4 rune symbols light up in sequence, then tap them back in the same order. Get it right and the sequence grows by one — how long a spell can you memorize?</div>
</div>
<script>
const W=360,H=360,COLS=2,ROWS=2,CELL=W/COLS;
const RUNES=['🔥','💧','🌪️','⚡'];
const COLORS=['#ef5350','#42a5f5','#66bb6a','#ffca28'];
let sequence,playerIdx,showingIdx,round,state,flashCell,flashTimer;

function loadBest(){return +(localStorage.getItem('wizardduel_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('wizardduel_best',v);}

function init(){round=1;sequence=[];state='show';addStep();}

function addStep(){
  sequence.push(Math.floor(Math.random()*4));
  showingIdx=0;
  state='show';
  flashCell=-1;flashTimer=0;
}

function update(){
  if(state==='show'){
    flashTimer--;
    if(flashTimer<=0){
      if(flashCell>=0){flashCell=-1;flashTimer=14;}
      else if(showingIdx<sequence.length){
        flashCell=sequence[showingIdx];
        showingIdx++;
        flashTimer=26;
        SFX.tick();
      }else{
        state='play';playerIdx=0;
      }
    }
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){round=1;sequence=[];addStep();return;}
  if(state!=='play')return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  const idx=row*COLS+col;
  flashCell=idx;flashTimer=10;
  if(idx===sequence[playerIdx]){
    SFX.click();
    playerIdx++;
    if(playerIdx>=sequence.length){
      round++;
      SFX.success();
      saveBest(round-1);
      setTimeout(addStep,600);
      state='wait';
    }
  }else{
    state='over';
    SFX.lose();
    saveBest(round-1);
  }
  updateUI();
});

function draw(){
  ctx.fillStyle='#1a0f2e';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    for(let c2=0;c2<COLS;c2++){
      const idx=r*COLS+c2;
      const x=c2*CELL,y=r*CELL;
      const lit=flashCell===idx;
      ctx.fillStyle=lit?COLORS[idx]:'rgba(255,255,255,.08)';
      ctx.fillRect(x+6,y+6,CELL-12,CELL-12);
      ctx.font='50px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.globalAlpha=lit?1:0.4;
      ctx.fillText(RUNES[idx],x+CELL/2,y+CELL/2);
      ctx.globalAlpha=1;
    }
  }

  ctx.fillStyle='#ce93d8';ctx.font='14px Arial';
  ctx.fillText(state==='show'?'Watch the sequence...':state==='play'?'Repeat the sequence!':'',W/2,H-16);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ce93d8';ctx.font='bold 26px Arial';
    ctx.fillText('SPELL BROKEN!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Reached Round: ${round} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Round: ${round} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
