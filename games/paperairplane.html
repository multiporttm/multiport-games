<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#81d4fa}
#ui{color:#01579b;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
#launchBtn{display:block;margin:6px auto;padding:10px 26px;border-radius:10px;background:#0288d1;color:#fff;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Paper Airplane Toss</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="down">⬇️</button>
    </div>
    <button id="launchBtn">✈️ LAUNCH</button>
  </div>
  <div class="game-instructions">Tap LAUNCH to throw. While flying, use Up/Down (or the D-pad) to steer through the gaps in the wind gusts — flying through a gust knocks you off course!</div>
</div>
<script>
const W=360,H=360;
let planeX,planeY,vx,vy,flying,dist,best,gusts,state,keys={};

function loadBest(){return +(localStorage.getItem('paperairplane_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('paperairplane_best',v);}

function init(){best=loadBest();state='play';reset();}
function reset(){
  planeX=40;planeY=H/2;vx=0;vy=0;flying=false;dist=0;gusts=[];
}

function launch(){
  if(flying)return;
  vx=5.5;vy=-1.5;flying=true;
  SFX.swoosh();
}
document.getElementById('launchBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  launch();
});
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();launch();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelector('#dpad .up').addEventListener('mousedown',()=>keys['arrowup']=true);
document.querySelector('#dpad .up').addEventListener('mouseup',()=>keys['arrowup']=false);
document.querySelector('#dpad .up').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowup']=true;},{passive:false});
document.querySelector('#dpad .up').addEventListener('touchend',e=>{e.preventDefault();keys['arrowup']=false;},{passive:false});
document.querySelector('#dpad .down').addEventListener('mousedown',()=>keys['arrowdown']=true);
document.querySelector('#dpad .down').addEventListener('mouseup',()=>keys['arrowdown']=false);
document.querySelector('#dpad .down').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowdown']=true;},{passive:false});
document.querySelector('#dpad .down').addEventListener('touchend',e=>{e.preventDefault();keys['arrowdown']=false;},{passive:false});

function update(){
  if(state!=='play'||!flying)return;
  if(keys['arrowup'])vy-=0.25;
  if(keys['arrowdown'])vy+=0.25;
  vy+=0.04;
  vy=Math.max(-4,Math.min(4,vy));
  planeX+=vx;planeY+=vy;
  vx*=0.997;
  dist=Math.max(dist,Math.floor((planeX-40)/5));

  if(Math.random()<0.02)gusts.push({x:W+20,y:planeY+((Math.random()-0.5)*160),r:20});
  gusts.forEach(g=>g.x-=3);
  gusts=gusts.filter(g=>g.x>-20);
  gusts.forEach(g=>{
    if(Math.hypot(g.x-planeX,g.y-planeY)<g.r){
      vy+=(Math.random()-0.5)*3;
      SFX.hurt();
      g.hit=true;
    }
  });
  gusts=gusts.filter(g=>!g.hit);

  if(planeY<0||planeY>H||planeX>W-20||vx<0.5){
    flying=false;
    if(dist>best){best=dist;saveBest(best);SFX.success();}
    else SFX.fail();
    state='over';
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#81d4fa';ctx.fillRect(0,0,W,H);

  ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  gusts.forEach(g=>ctx.fillText('💨',g.x,g.y));

  ctx.save();
  ctx.translate(planeX,planeY);
  ctx.rotate(Math.atan2(vy,vx));
  ctx.font='26px Arial';
  ctx.fillText('✈️',0,0);
  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#01579b';ctx.font='bold 26px Arial';
    ctx.fillText(flying?'':'LANDED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Distance: ${dist}m | Best: ${best}m`,W/2,H/2+12);
    ctx.fillText('Tap LAUNCH to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${dist}m | Best: ${best}m`;
}

init();draw();
</script></body></html>
