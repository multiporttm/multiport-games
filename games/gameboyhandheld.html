<style>

#consoleWrap{display:flex;justify-content:center;padding:14px}

#screenFrame{background:#2b2f26;border-radius:8px;padding:14px 12px 18px;box-shadow:inset 0 4px 12px rgba(0,0,0,.6)}

#dpad{position:relative;width:104px;height:104px}

#dLeft{left:0;top:34px;width:34px;height:36px;border-radius:6px 0 0 6px}
#dRight{right:0;top:34px;width:34px;height:36px;border-radius:0 6px 6px 0}

.abtn:active{box-shadow:0 1px 0 rgba(0,0,0,.4);transform:translateY(2px) rotate(-20deg)}

<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Game Boy Handheld</div>
  <div class="game-frame">
    <div id="consoleWrap">
      <div id="gb">
        <div id="screenFrame">
          <div id="screenTop"><span>BATTERY</span><span id="gbScoreTop">SCORE 000</span></div>
          <canvas id="lcd" width="160" height="144"></canvas>
        </div>
        <div id="brandRow"><span>BRICK BOY</span><span>STEREO</span></div>
        <div id="controls">
          <div id="dpad">
            <button class="dbtn" id="dUp" aria-label="Up"></button>
            <button class="dbtn" id="dDown" aria-label="Down"></button>
            <button class="dbtn" id="dLeft" aria-label="Left"></button>
            <button class="dbtn" id="dRight" aria-label="Right"></button>
            <div id="dCenter"></div>
          </div>
          <div id="abtns">
            <button class="abtn" id="btnB">B</button>
            <button class="abtn" id="btnA">A</button>
          </div>
        </div>
        <div id="startSelect">
          <button class="ssbtn" id="btnSelect">SELECT</button>
          <button class="ssbtn" id="btnStart">START</button>
        </div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right arrows</b> or the <b>D-pad</b> to move the paddle. Press <b>A</b>, <b>Space</b>, or tap the screen to launch the ball. Break every brick to clear the stage — each stage adds a faster ball and a new brick pattern!</div>
</div>
<script>
const canvas=document.getElementById('lcd'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=160,H=144;
const OFF='#9bbc0f',ON='#0f380f',MID='#306230',MID2='#8bac0f';

let paddle,ball,bricks,stage,score,hi,lives,launched,gameOver,keys={};
hi=+(localStorage.getItem('gameboyhandheld_hi')||0);

function initStage(){
  paddle={w:26,h:4,x:(W-26)/2,y:H-12};
  ball={x:W/2,y:H-18,vx:0,vy:0,r:2};
  launched=false;
  bricks=[];
  const rows=3+Math.min(3,Math.floor(stage/2));
  const cols=10;
  const bw=14,bh=6,gap=1,offX=(W-(cols*(bw+gap)-gap))/2,offY=14;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(stage>2 && (r+c)%5===0) continue; // pattern gaps for later stages
      bricks.push({x:offX+c*(bw+gap),y:offY+r*(bh+gap),w:bw,h:bh,alive:true});
    }
  }
}

function reset(){
  stage=1;score=0;lives=3;gameOver=false;
  initStage();
}
reset();

function launch(){
  if(launched||gameOver)return;
  launched=true;
  const speed=2.0+stage*0.25;
  ball.vx=speed*(Math.random()<0.5?-0.6:0.6);
  ball.vy=-speed;
  SFX.jump();
}

function restartIfOver(){
  if(gameOver){ reset(); return true; }
  return false;
}

function movePaddle(dir){ paddle.x+=dir*5; paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x)); }

// keyboard
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;
  if(e.key===' '||e.key==='a'||e.key==='A'){ if(!restartIfOver()) launch(); }
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function heldDir(){
  if(keys['ArrowLeft'])return -1;
  if(keys['ArrowRight'])return 1;
  return 0;
}

// on-screen buttons
function bindHold(id,fn){
  const el=document.getElementById(id);
  let iv=null;
  const start=(ev)=>{ ev.preventDefault(); fn(); iv=setInterval(fn,50); };
  const stop=()=>{ clearInterval(iv); iv=null; };
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointerleave',stop);
  el.addEventListener('pointercancel',stop);
}
bindHold('dLeft',()=>movePaddle(-1));
bindHold('dRight',()=>movePaddle(1));
document.getElementById('btnA').addEventListener('pointerdown',e=>{e.preventDefault(); if(!restartIfOver())launch();});
document.getElementById('btnB').addEventListener('pointerdown',e=>{e.preventDefault(); if(!restartIfOver())launch();});
document.getElementById('btnStart').addEventListener('pointerdown',e=>{e.preventDefault(); restartIfOver();});
canvas.addEventListener('pointerdown',e=>{ if(!restartIfOver()) launch(); });

function rectHit(bx,by,bw,bh){
  return ball.x+ball.r>bx && ball.x-ball.r<bx+bw && ball.y+ball.r>by && ball.y-ball.r<by+bh;
}

function update(){
  if(gameOver)return;
  const d=heldDir();
  if(d)movePaddle(d);

  if(!launched){
    ball.x=paddle.x+paddle.w/2;
    ball.y=paddle.y-4;
    return;
  }

  ball.x+=ball.vx;
  ball.y+=ball.vy;

  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx*=-1;}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-1;SFX.tick();}

  // paddle collision
  if(ball.vy>0 && rectHit(paddle.x,paddle.y,paddle.w,paddle.h)){
    ball.y=paddle.y-ball.r;
    const hitPos=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2); // -1..1
    const speed=Math.hypot(ball.vx,ball.vy);
    ball.vx=hitPos*speed*1.1;
    ball.vy=-Math.abs(speed);
    SFX.click();
  }

  // brick collisions
  for(const b of bricks){
    if(!b.alive)continue;
    if(rectHit(b.x,b.y,b.w,b.h)){
      b.alive=false;
      score+=10;
      SFX.coin();
      // simple reflect: compare overlap direction
      const overlapX=Math.min(ball.x+ball.r-b.x, b.x+b.w-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y, b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY)ball.vx*=-1; else ball.vy*=-1;
      break;
    }
  }

  if(ball.y-ball.r>H){
    lives--;
    SFX.hurt();
    if(lives<=0){
      gameOver=true;
      if(score>hi){hi=score;localStorage.setItem('gameboyhandheld_hi',hi);}
      SFX.lose();
    } else {
      launched=false;
    }
  }

  if(bricks.every(b=>!b.alive)){
    stage++;
    SFX.levelup();
    initStage();
  }
}

function px(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

function draw(){
  ctx.fillStyle=OFF; ctx.fillRect(0,0,W,H);
  // border frame
  ctx.strokeStyle=MID; ctx.lineWidth=2; ctx.strokeRect(1,1,W-2,H-2);

  bricks.forEach(b=>{ if(b.alive) px(b.x,b.y,b.w,b.h,MID); });

  px(paddle.x,paddle.y,paddle.w,paddle.h,ON);
  px(ball.x-ball.r,ball.y-ball.r,ball.r*2,ball.r*2,ON);

  // HUD text
  ctx.fillStyle=ON; ctx.font='8px monospace'; ctx.textAlign='left';
  ctx.fillText('LV'+stage,4,H-3);
  ctx.textAlign='right';
  ctx.fillText('♥'.repeat(Math.max(0,lives)),W-4,H-3);

  if(!launched && !gameOver){
    ctx.fillStyle=ON; ctx.textAlign='center'; ctx.font='7px monospace';
    ctx.fillText(I18N.t('gb_launch_hint','A / SPACE / TAP'),W/2,H/2+30);
  }

  if(gameOver){
    ctx.fillStyle=MID2; ctx.fillRect(20,50,W-40,44);
    ctx.strokeStyle=ON; ctx.strokeRect(20,50,W-40,44);
    ctx.fillStyle=ON; ctx.textAlign='center'; ctx.font='10px monospace';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,68);
    ctx.font='7px monospace';
    ctx.fillText(I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi),W/2,82);
    ctx.fillText(I18N.t('gb_restart_hint','START / A to retry'),W/2,92);
  }

  document.getElementById('gbScoreTop').textContent='SCORE '+String(score).padStart(3,'0');
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script></body></html>
