<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#0d3b5c,#4fb8e8);display:block;border-radius:8px}
#hud{color:#eaf6ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ski Jumping</div>
  <div class="game-frame">
    <div id="hud">Jump 1/3 | Score: 0 | Best Jump: 0m | Best Score: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> when the marker is in the green zone to build speed, again at the ramp edge to launch, then keep tapping to hold your <b>balance</b> in the air for a long, clean landing.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const hud=document.getElementById('hud');
const KEY='skijumping_best';
function loadBest(){try{return JSON.parse(localStorage.getItem(KEY))||{dist:0,score:0};}catch(e){return {dist:0,score:0};}}
function saveBest(b){localStorage.setItem(KEY,JSON.stringify(b));}
let best=loadBest();

let phase='ready'; // ready, inrun, launch, air, land, result, done
let jumpNum=1,totalScore=0;
let power=0,launchQ=0,dist=0,style=0,lastJumpDist=0,lastJumpScore=0;
let barT=0,balance=0.5,wobble=0.006,wobbleDir=1,airTime=0,airTimer=0,crashed=false;
let flashMsg='',flashT=0;

function resetRound(){jumpNum=1;totalScore=0;phase='ready';}

function act(){
  if(phase==='ready'){phase='inrun';barT=0;return;}
  if(phase==='inrun'){
    // marker position via sine
    const pos=(Math.sin(barT)+1)/2; // 0..1
    const q=1-Math.abs(pos-0.5)*2; // 1 at center
    power=Math.max(0.15,q);
    SFX.click();
    phase='launch';barT=0;
    return;
  }
  if(phase==='launch'){
    const pos=(Math.sin(barT)+1)/2;
    const q=1-Math.abs(pos-0.62)*2.2; // target slightly past center for good angle
    launchQ=Math.max(0.1,Math.min(1,q));
    SFX.jump();
    phase='air';
    dist=0;balance=0.5;wobble=0.006+Math.random()*0.004;wobbleDir=Math.random()<0.5?-1:1;
    airTime=1.1+power*1.1+launchQ*0.6;airTimer=0;crashed=false;
    return;
  }
  if(phase==='air'){
    // nudge balance toward center
    balance+=(0.5-balance)*0.35;
    wobbleDir*=-1;
    SFX.tick();
    return;
  }
  if(phase==='result'){
    if(jumpNum>=3){
      // finalize
      if(totalScore>best.score||dist>0){ }
      phase='done';
      if(totalScore>best.score)best.score=totalScore;
      saveBest(best);
      SFX.win();
    }else{
      jumpNum++;phase='ready';
    }
    return;
  }
  if(phase==='done'){
    resetRound();
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act();}});
c.addEventListener('click',act);
c.addEventListener('touchstart',e=>{e.preventDefault();act();},{passive:false});

function drawBar(label,targetCenter,targetHalf){
  const bx=150,by=340,bw=500,bh=26;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#7ec850';
  ctx.fillRect(bx+(targetCenter-targetHalf)*bw,by,targetHalf*2*bw,bh);
  const pos=(Math.sin(barT)+1)/2;
  ctx.fillStyle='#fff';ctx.fillRect(bx+pos*bw-3,by-6,6,bh+12);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(label,bx+bw/2,by-14);
}

function drawSkier(x,y,lean){
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='#e94560';ctx.fillRect(-4,-20,8,26);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-26,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.fillRect(-14,4,34,3);
  ctx.restore();
}

function drawScene(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d3b5c');sky.addColorStop(1,'#4fb8e8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // ramp
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(0,120);ctx.lineTo(500,120);ctx.lineTo(500,360);ctx.lineTo(0,360);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e0f0ff';
  ctx.beginPath();ctx.moveTo(500,120);ctx.lineTo(560,300);ctx.lineTo(500,360);ctx.closePath();ctx.fill();
  // landing slope
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(560,300);ctx.lineTo(800,380);ctx.lineTo(800,400);ctx.lineTo(500,400);ctx.lineTo(500,360);ctx.closePath();ctx.fill();
}

function loop(){
  drawScene();
  if(phase==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ski_ready_msg','Tap / Space to start in-run'),400,80);
    drawSkier(60,110,0);
  } else if(phase==='inrun'){
    barT+=0.09;
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ski_inrun_msg','BUILD SPEED — tap in the zone!'),400,60);
    drawBar(I18N.t('ski_speed_label','SPEED'),0.5,0.14);
    const px=60+((Math.sin(barT*0.4)+1)/2)*20;
    drawSkier(px,110,0);
  } else if(phase==='launch'){
    barT+=0.11;
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ski_launch_msg','LAUNCH — tap at the edge!'),400,60);
    drawBar(I18N.t('ski_launch_label','LAUNCH TIMING'),0.62,0.12);
    drawSkier(470,340,-0.15);
  } else if(phase==='air'){
    airTimer+=1/60;
    balance+=wobbleDir*wobble;
    balance=Math.max(0,Math.min(1,balance));
    const t=Math.min(1,airTimer/airTime);
    dist=t*(60+power*90+launchQ*40);
    if(!crashed&&(balance<=0||balance>=1)){crashed=true;SFX.hit();}
    const x=560+t*220;
    const y=300+t*t*70;
    const lean=(balance-0.5)*1.4;
    drawSkier(x,y,lean-0.3);
    // balance meter
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(300,20,200,18);
    ctx.fillStyle=balance>0.3&&balance<0.7?'#7ec850':'#e94560';
    ctx.fillRect(300+balance*196,20,4,18);
    ctx.strokeStyle='#fff';ctx.strokeRect(300,20,200,18);
    ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ski_balance_label','BALANCE — tap to lean'),400,16);
    if(airTimer>=airTime||crashed){
      style=crashed?0:Math.max(0,1-Math.abs(balance-0.5)*2);
      lastJumpDist=Math.round(dist);
      lastJumpScore=Math.round(dist*10+style*100+launchQ*40);
      if(lastJumpDist>best.dist){best.dist=lastJumpDist;saveBest(best);}
      totalScore+=lastJumpScore;
      phase='result';
    }
  } else if(phase==='result'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(crashed?I18N.t('ski_crash_title','CRASH!'):I18N.t('ski_land_title','LANDED!'),400,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('ski_dist_label','Distance: {d}m').replace('{d}',lastJumpDist),400,180);
    ctx.fillText(I18N.t('ski_jumpscore_label','Jump Score: {s}').replace('{s}',lastJumpScore),400,210);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('ski_next_hint','Tap / Space to continue'),400,250);
  } else if(phase==='done'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ski_round_over_title','ROUND OVER'),400,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('ski_total_label','Total Score: {s}').replace('{s}',totalScore),400,180);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('ski_restart_hint','Tap / Space for a new round'),400,220);
  }
  hud.textContent=I18N.t('ski_hud_label','Jump {j}/3 | Score: {s} | Best Jump: {bd}m | Best Score: {bs}')
    .replace('{j}',Math.min(jumpNum,3)).replace('{s}',totalScore).replace('{bd}',best.dist).replace('{bs}',best.score);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
