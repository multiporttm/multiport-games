<style>
body{background:#08080f}
#c{background:#2e1e14;display:block;border-radius:8px;cursor:crosshair}
#score-display{color:#e0a86b;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wig Making Knotting</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="340"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the density diagram, then click/tap the glowing <b>mesh points</b> in order with your ventilating needle, one knot per beat of the rhythm bar. Skipping a point or knotting out of order breaks the pattern. Denser patterns appear each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;
const HI_KEY='wigmakingknotting_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,score=0,gameOver=false,started=false;
let points=[],nextIdx=0,misses=0,maxMisses=3;
let beat=0,beatSpeed,beatOn=false;
let message='',messageTimer=0;
let flashTimer=0,flashColor='';
let particles=[];
const meshCx=W/2, meshCy=150, meshR=110;

function genPattern(){
  const n=Math.min(16,5+round*2);
  points=[];
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2 - Math.PI/2 + (Math.random()-0.5)*0.15;
    const rr=meshR*(0.35+Math.random()*0.6);
    points.push({
      x:meshCx+Math.cos(ang)*rr,
      y:meshCy+Math.sin(ang)*rr,
      done:false
    });
  }
  // shuffle order independent of position but keep a visible index order 1..n for guidance
  nextIdx=0;
}

function setupRound(){
  genPattern();
  misses=0;
  beatSpeed=Math.max(0.035,0.07-round*0.004);
  beat=0;
  message=I18N.t('round_start_knot','Round {r} — denser mesh!').replace('{r}',round);
  messageTimer=90;
}

function reset(){
  round=1;score=0;gameOver=false;started=false;
  setupRound();
}
reset();

function hitTest(x,y){
  for(let i=0;i<points.length;i++){
    const p=points[i];
    if(p.done)continue;
    const d=Math.hypot(x-p.x,y-p.y);
    if(d<22)return i;
  }
  return -1;
}

function pointerAction(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const idx=hitTest(x,y);
  if(idx===-1)return;
  if(idx===nextIdx){
    points[idx].done=true;
    nextIdx++;
    const rhythmQuality=1-Math.abs(((beat%1)-0.5))*2; // closer to beat pulse = better, simplistic
    score+=Math.round(12+rhythmQuality*10);
    SFX.success();
    flashColor='#8be3c8';flashTimer=12;
    spawnKnotParticles(points[idx].x,points[idx].y,true);
    if(nextIdx>=points.length){
      SFX.levelup();
      score+=50;
      message=I18N.t('mesh_complete','Mesh complete! Next round...');
      messageTimer=90;
      round++;
      setTimeout(()=>{ if(!gameOver) setupRound(); },800);
    }
  } else {
    misses++;
    SFX.error();
    flashColor='#e36b6b';flashTimer=12;
    spawnKnotParticles(x,y,false);
    if(misses>=maxMisses){
      gameOver=true;
      SFX.lose();
      message=I18N.t('too_many_skips','Too many skipped points — pattern ruined!');
      messageTimer=200;
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    }
  }
}

function spawnKnotParticles(x,y,good){
  for(let i=0;i<8;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*4,
      vy:(Math.random()-0.5)*4,
      life:26,
      color: good?'#e0a86b':'#555'
    });
  }
}

c.addEventListener('mousedown',e=>{
  const r=c.getBoundingClientRect();
  pointerAction((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.touches[0];
  pointerAction((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started){started=true;return;}
    if(gameOver){reset();return;}
    if(nextIdx<points.length){
      const p=points[nextIdx];
      pointerAction(p.x,p.y);
    }
  }
});

function drawMeshDiagram(){
  ctx.save();
  ctx.strokeStyle='rgba(224,168,107,0.25)';
  ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    ctx.beginPath();ctx.arc(meshCx,meshCy,meshR*(i+1)/6,0,Math.PI*2);ctx.stroke();
  }
  for(let a=0;a<Math.PI*2;a+=Math.PI/8){
    ctx.beginPath();
    ctx.moveTo(meshCx,meshCy);
    ctx.lineTo(meshCx+Math.cos(a)*meshR,meshCy+Math.sin(a)*meshR);
    ctx.stroke();
  }
  ctx.restore();

  points.forEach((p,i)=>{
    if(p.done){
      ctx.fillStyle='#8be3c8';
      ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();
      // little knot strand
      ctx.strokeStyle='#5a3b26';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+6,p.y+14);ctx.stroke();
    } else if(i===nextIdx){
      const pulse=6+Math.sin(beat*20)*3;
      ctx.fillStyle='#ffd866';
      ctx.beginPath();ctx.arc(p.x,p.y,10+pulse*0.4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,10+pulse*0.4,0,Math.PI*2);ctx.stroke();
    } else {
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
    }
  });
}

function drawBench(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#241610');bg.addColorStop(1,'#3d2a1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
}

function drawParticles(dt){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.globalAlpha=Math.max(0,p.life/26);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  });
  ctx.globalAlpha=1;
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('knotting_status','Round: {r} | Score: {s} | Hi: {h}')
      .replace('{r}',round).replace('{s}',score).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  ctx.clearRect(0,0,W,H);
  drawBench();

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!started){
    drawMeshDiagram();
    ctx.fillStyle='#ffd866';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_knot','Tap / Space to begin knotting'),W/2,290);
    requestAnimationFrame(loop);
    return;
  }

  if(!gameOver)beat+=beatSpeed*dt;

  drawMeshDiagram();
  drawParticles(dt);

  // progress bar
  ctx.fillStyle='#222';ctx.fillRect(100,300,W-200,14);
  ctx.fillStyle='#e0a86b';ctx.fillRect(100,300,(W-200)*(nextIdx/points.length),14);
  ctx.strokeStyle='#5a3b26';ctx.strokeRect(100,300,W-200,14);

  ctx.textAlign='left';ctx.font='16px Arial';ctx.fillStyle='#e36b6b';
  ctx.fillText(I18N.t('skips_label','Skipped: {m}/{x}').replace('{m}',misses).replace('{x}',maxMisses),20,320);

  if(flashTimer>0){
    flashTimer-=dt;
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=0.15*(flashTimer/12);
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  if(messageTimer>0){
    messageTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(message,W/2,40);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,160);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,198);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
