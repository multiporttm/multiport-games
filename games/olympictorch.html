<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Olympic Torch</title><meta name="description" content="Play Olympic Torch free online — Jump hurdles, duck banners, and grab wind-shields to keep your torch lit as you race down the endless track."><link rel="canonical" href="https://games.multiportllc.com/games/olympictorch"><meta property="og:title" content="Olympic Torch - Multiport Games"><meta property="og:description" content="Play Olympic Torch free online — Jump hurdles, duck banners, and grab wind-shields to keep your torch lit as you race down the endless track."><meta property="og:url" content="https://games.multiportllc.com/games/olympictorch"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Olympic Torch","description":"Play Olympic Torch free online instantly. Jump hurdles, duck banners, and grab wind-shields to keep your torch lit as you race down the endless track. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/olympictorch","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2f5c;display:block;border-radius:8px;margin:0 auto}
#score-display{color:#ffca28;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#flameWrap{max-width:400px;margin:0 auto 6px;background:rgba(0,0,0,.4);border-radius:8px;height:14px;overflow:hidden}
#flameBar{height:100%;background:linear-gradient(90deg,#ff6b00,#ffca28);width:100%;transition:width .15s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Olympic Torch</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <div id="flameWrap"><div id="flameBar"></div></div>
    <canvas id="c" width="800" height="250"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> / <b>Up Arrow</b> or <b>tap top</b> to jump hurdles. Press <b>Down Arrow</b> or <b>tap bottom</b> to duck under banners. Grab the wind-shield pickups to refill your torch — if the flame goes out, the run ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const flameBar=document.getElementById('flameBar');
let dist=0,hi=parseFloat(localStorage.getItem('olympictorch_hi')||'0'),spd=5,frame=0,gameOver=false,started=false;
const runner={x:80,y:200,w:36,h:50,vy:0,jumps:0,ducking:false};
const ground=200;
let hurdles=[],banners=[],winds=[];
let flame=100;
let lastTime=null,hurdleTimer=0,bannerTimer=0,windTimer=0;

function reset(){
  dist=0;spd=5;frame=0;gameOver=false;started=false;
  hurdles=[];banners=[];winds=[];flame=100;
  runner.y=ground;runner.vy=0;runner.jumps=0;runner.ducking=false;
  lastTime=null;hurdleTimer=0;bannerTimer=0;windTimer=0;
}

function jump(){
  if(!started)started=true;
  if(gameOver){reset();return;}
  if(runner.jumps<2&&!runner.ducking){runner.vy=-13.5+runner.jumps*2;runner.jumps++;SFX.jump();}
}
function duck(on){
  if(!started)started=true;
  if(gameOver)return;
  runner.ducking=on&&runner.jumps===0&&runner.y>=ground-1;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='ArrowDown'){e.preventDefault();duck(true);}
});
document.addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck(false);});

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const y=(e.clientY-rect.top)*(250/rect.height);
  if(y>150)quickDuck(); else jump();
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const y=(t.clientY-rect.top)*(250/rect.height);
  if(y>150)quickDuck(); else jump();
},{passive:false});

function quickDuck(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  duck(true);
  setTimeout(()=>duck(false),450);
}

function spawnHurdle(){ hurdles.push({x:820,w:22,h:34+Math.random()*20}); }
function spawnBanner(){ banners.push({x:820,w:60,h:22,y:ground-50}); }
function spawnWind(){ winds.push({x:820,y:ground-30-Math.random()*70,r:12}); }

function drawRunner(){
  ctx.save();
  const y=runner.ducking?runner.y+18:runner.y;
  const h=runner.ducking?runner.h-18:runner.h;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(runner.x,y,runner.w,h);
  // head
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(runner.x+runner.w-8,y-14,18,16);
  // torch arm
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(runner.x+runner.w,y+4);ctx.lineTo(runner.x+runner.w+18,y-14);ctx.stroke();
  // flame
  const flick=Math.sin(frame*0.5)*3;
  const flameSize=8+flame/12;
  ctx.fillStyle=flame>0?'#ff7043':'#555';
  ctx.beginPath();
  ctx.moveTo(runner.x+runner.w+18,y-14);
  ctx.quadraticCurveTo(runner.x+runner.w+18+flick,y-14-flameSize,runner.x+runner.w+18,y-14-flameSize*1.6);
  ctx.quadraticCurveTo(runner.x+runner.w+18-flick,y-14-flameSize,runner.x+runner.w+18,y-14);
  ctx.fill();
  if(flame>0){
    ctx.fillStyle='#ffca28';
    ctx.beginPath();ctx.arc(runner.x+runner.w+18,y-14-flameSize*0.6,flameSize*0.35,0,Math.PI*2);ctx.fill();
  }
  // legs
  const legOff=Math.floor(frame/6)%2===0?0:8;
  ctx.fillStyle='#e0e0e0';
  ctx.fillRect(runner.x+5,y+h,9,10+legOff);
  ctx.fillRect(runner.x+runner.w-14,y+h,9,10+(8-legOff));
  ctx.restore();
}

function drawHurdle(o){
  ctx.fillStyle='#ff5252';
  ctx.fillRect(o.x,ground+runner.h-o.h,o.w,o.h);
  ctx.fillStyle='#ffcdd2';
  ctx.fillRect(o.x,ground+runner.h-o.h,o.w,4);
}
function drawBanner(b){
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#01579b';
  ctx.fillRect(b.x,b.y,b.w,4);
  ctx.fillRect(b.x-6,b.y-14,4,40);
  ctx.fillRect(b.x+b.w+2,b.y-14,4,40);
}
function drawWind(w){
  ctx.strokeStyle='#81d4fa';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(w.x,w.y,w.r,0.2*Math.PI,1.6*Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(w.x+4,w.y,w.r*0.6,0.2*Math.PI,1.6*Math.PI);
  ctx.stroke();
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function loop(){
  ctx.clearRect(0,0,800,250);
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#0a1a3d');sky.addColorStop(1,'#1a2f5c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,250);
  ctx.fillStyle='#37474f';ctx.fillRect(0,ground+runner.h,800,50);
  ctx.fillStyle='#eceff1';ctx.fillRect(0,ground+runner.h,800,4);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('torch_out_title','TORCH EXTINGUISHED'),400,110);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,148);
    document.getElementById('score-display').textContent=I18N.t('torch_score_hi_label','Distance: {s}m | Hi: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(hi));
    flameBar.style.width='0%';
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffca2899';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),400,110);
    drawRunner();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  frame+=dt;
  dist+=dt*0.12;
  if(dist>hi)hi=dist;
  spd=6+dist/60;

  flame-=0.06*dt;
  if(flame<0)flame=0;
  flameBar.style.width=flame+'%';
  if(flame<=0&&!gameOver){gameOver=true;SFX.lose();}

  hurdleTimer+=dt;
  const hurdleInterval=Math.max(45,100-dist/8);
  if(hurdleTimer>=hurdleInterval){hurdleTimer-=hurdleInterval;spawnHurdle();}

  if(dist>20){
    bannerTimer+=dt;
    if(bannerTimer>=150){bannerTimer-=150;spawnBanner();}
  }

  windTimer+=dt;
  if(windTimer>=200){windTimer-=200;spawnWind();}

  runner.vy+=0.7*dt;
  runner.y+=runner.vy*dt;
  if(runner.y>=ground){runner.y=ground;runner.vy=0;runner.jumps=0;}

  const duckActive=runner.ducking&&runner.jumps===0;
  const hitH=duckActive?runner.h-18:runner.h+13;
  const hitY=duckActive?runner.y+18:runner.y-13;
  const hitBox={x:runner.x+4,y:hitY,w:runner.w+4,h:hitH};

  hurdles=hurdles.filter(o=>o.x>-30);
  hurdles.forEach(o=>{o.x-=spd*dt;drawHurdle(o);
    const oBox={x:o.x,y:ground+runner.h-o.h,w:o.w,h:o.h};
    if(rect(hitBox,oBox)&&!gameOver){gameOver=true;SFX.lose();}
  });

  banners=banners.filter(b=>b.x>-70);
  banners.forEach(b=>{b.x-=spd*dt;drawBanner(b);
    if(rect(hitBox,{x:b.x,y:b.y,w:b.w,h:b.h})&&!gameOver){gameOver=true;SFX.lose();}
  });

  winds=winds.filter(w=>w.x>-30);
  winds.forEach(w=>{
    w.x-=spd*dt;drawWind(w);
    const wBox={x:w.x-w.r,y:w.y-w.r,w:w.r*2,h:w.r*2};
    if(rect(hitBox,wBox)){
      flame=Math.min(100,flame+30);
      w.x=-999;
      SFX.powerup();
    }
  });

  drawRunner();
  document.getElementById('score-display').textContent=I18N.t('torch_score_hi_label','Distance: {s}m | Hi: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(hi));
  if(gameOver)localStorage.setItem('olympictorch_hi',hi.toFixed(1));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
