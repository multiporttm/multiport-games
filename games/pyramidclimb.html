<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#3a2a1a;touch-action:none}
#ui{color:#ffd54f;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#ctrls{display:flex;gap:10px;justify-content:center;padding:8px}
#ctrls button{width:60px;height:50px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ctrls button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pyramid Climb</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0m | Best: 0m</div>
    <canvas id="c" width="340" height="480"></canvas>
    <div id="ctrls">
      <button id="left-btn">⬅️</button>
      <button id="jump-btn">⬆️</button>
      <button id="right-btn">➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / A D or drag to move, <b>Space</b> or the ⬆️ button to jump between stone blocks. Dodge falling rocks and swinging pendulums, grab ancient coins, and don't fall off the bottom!</div>
</div>
<script>
const W=340,H=480;
let player,blocks,rocks,pendulums,coins,camY,best,state,keys={},topY,dragX,score,particles;
let rockTimer=0;

function loadBest(){return +(localStorage.getItem('pyramidclimb_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('pyramidclimb_best',v);}

function addBlock(){
  topY-=52+Math.random()*26;
  const w=54+Math.random()*36;
  const x=20+Math.random()*(W-40-w);
  blocks.push({x,y:topY,w});
  if(Math.random()<0.22)coins.push({x:x+w/2,y:topY-16,r:8,taken:false});
  if(Math.random()<0.14){
    pendulums.push({anchorX:x+w/2+(Math.random()<0.5?-40:40),anchorY:topY-90,len:70+Math.random()*40,ang:Math.random()*Math.PI-Math.PI/2,speed:0.02+Math.random()*0.02,dir:Math.random()<0.5?1:-1});
  }
}

function init(){
  player={x:W/2,y:H-60,vy:0,vx:0,onGround:true};
  blocks=[{x:W/2-40,y:H-30,w:80}];
  rocks=[];pendulums=[];coins=[];particles=[];
  topY=H-30;
  for(let i=0;i<12;i++)addBlock();
  camY=0;
  state='play';
  score=0;
  best=loadBest();
  rockTimer=0;
  dragX=null;
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==='Space'){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function jump(){
  if(state!=='play'){init();return;}
  if(player.onGround){player.vy=-11;player.onGround=false;SFX.jump();}
}
document.getElementById('jump-btn').addEventListener('click',jump);
function heldBtn(id,key){
  const btn=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;};
  const off=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',on,{passive:false});
  btn.addEventListener('touchend',off,{passive:false});
  btn.addEventListener('mousedown',on);
  btn.addEventListener('mouseup',off);
  btn.addEventListener('mouseleave',off);
}
heldBtn('left-btn','a');
heldBtn('right-btn','d');

const c=document.getElementById('c'),ctx=c.getContext('2d');
function canvasX(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  return (cx-r.left)*(W/r.width);
}
c.addEventListener('mousedown',e=>{ if(state!=='play'){init();return;} dragX=canvasX(e); });
c.addEventListener('mousemove',e=>{ if(dragX!==null)dragX=canvasX(e); });
window.addEventListener('mouseup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{ e.preventDefault(); if(state!=='play'){init();return;} dragX=canvasX(e); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(dragX!==null)dragX=canvasX(e); },{passive:false});
c.addEventListener('touchend',e=>{ e.preventDefault(); dragX=null; },{passive:false});

function spawnRock(){
  rocks.push({x:20+Math.random()*(W-40),y:camY-20,r:9+Math.random()*6,vy:2+Math.random()*1.5});
}

function update(){
  if(state!=='play')return;
  if(keys['a']||keys['arrowleft'])player.x-=3.2;
  if(keys['d']||keys['arrowright'])player.x+=3.2;
  if(dragX!==null)player.x+=(dragX-player.x)*0.2;
  player.x=Math.max(12,Math.min(W-12,player.x));

  player.vy+=0.5;
  player.y+=player.vy;

  player.onGround=false;
  for(const b of blocks){
    if(player.vy>0&&player.x>b.x-10&&player.x<b.x+b.w+10&&player.y+14>=b.y&&player.y+14<=b.y+16){
      player.y=b.y-14;player.vy=0;player.onGround=true;
    }
  }

  const targetCamY=player.y-H*0.6;
  if(targetCamY<camY)camY=targetCamY;

  const height=Math.max(0,Math.floor((H-60-(player.y))/10));

  while(blocks[blocks.length-1].y>camY-100){
    topY=blocks[blocks.length-1].y;
    addBlock();
  }
  blocks=blocks.filter(b=>b.y<camY+H+60);

  // pendulums swing
  pendulums.forEach(p=>{
    p.ang+=p.speed*p.dir;
    if(p.ang>Math.PI/2.2||p.ang<-Math.PI/2.2)p.dir*=-1;
  });
  pendulums=pendulums.filter(p=>p.anchorY<camY+H+60);

  // rocks spawn & fall
  rockTimer++;
  if(rockTimer>Math.max(35,70-height/8)){
    rockTimer=0;
    if(Math.random()<0.7)spawnRock();
  }
  rocks.forEach(r=>{r.y+=r.vy;});
  rocks=rocks.filter(r=>r.y<camY+H+40);

  // coin collection
  coins.forEach(coin=>{
    if(!coin.taken&&Math.hypot(coin.x-player.x,coin.y-player.y)<16){
      coin.taken=true;score+=5;SFX.coin();
      particles.push({x:coin.x,y:coin.y,life:16});
    }
  });
  coins=coins.filter(coin=>!coin.taken&&coin.y<camY+H+60);

  // collisions -> fall / hit
  const px=player.x,py=player.y;
  let hit=false;
  rocks.forEach(r=>{ if(Math.hypot(r.x-px,r.y-py)<r.r+10)hit=true; });
  pendulums.forEach(p=>{
    const bx=p.anchorX+Math.sin(p.ang)*p.len;
    const by=p.anchorY+Math.cos(p.ang)*p.len;
    if(Math.hypot(bx-px,by-py)<18)hit=true;
  });
  if(hit&&state==='play'){
    state='over';
    SFX.hit();SFX.lose();
    saveBest(Math.max(height,score>0?height:height));best=loadBest();
  }

  particles.forEach(pt=>pt.life--);
  particles=particles.filter(pt=>pt.life>0);

  document.getElementById('ui').textContent=I18N.t('height_best_label','Height: {n}m | Best: {b}m').replace('{n}',height).replace('{b}',Math.max(best,height));

  if(player.y-camY>H+40&&state==='play'){
    state='over';
    SFX.lose();
    saveBest(height);best=loadBest();
  }
}

function drawBlock(b){
  const py=b.y-camY;
  if(py<-30||py>H+30)return;
  ctx.fillStyle='#c9a876';
  ctx.fillRect(b.x,py,b.w,14);
  ctx.fillStyle='#8a6d4a';
  ctx.fillRect(b.x,py+11,b.w,4);
  ctx.strokeStyle='rgba(0,0,0,.25)';
  for(let i=0;i<b.w;i+=18){ ctx.beginPath();ctx.moveTo(b.x+i,py);ctx.lineTo(b.x+i,py+14);ctx.stroke(); }
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5a3d24');g.addColorStop(1,'#2e1e10');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,220,150,.04)';
  for(let y=0;y<H;y+=40){ctx.fillRect(0,y,W,1);}

  blocks.forEach(drawBlock);

  coins.forEach(coin=>{
    const py=coin.y-camY;
    if(py<-20||py>H+20)return;
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(coin.x,py,coin.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c9960f';ctx.lineWidth=2;ctx.stroke();
  });

  pendulums.forEach(p=>{
    const ay=p.anchorY-camY;
    if(ay<-120||ay>H+40)return;
    const bx=p.anchorX+Math.sin(p.ang)*p.len;
    const by=ay+Math.cos(p.ang)*p.len;
    ctx.strokeStyle='#777';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p.anchorX,ay);ctx.lineTo(bx,by);ctx.stroke();
    ctx.fillStyle='#b0bec5';
    ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#37474f';
    ctx.beginPath();ctx.arc(bx-4,by-4,3,0,Math.PI*2);ctx.fill();
  });

  rocks.forEach(r=>{
    const py=r.y-camY;
    if(py<-20||py>H+20)return;
    ctx.fillStyle='#6d6d6d';
    ctx.beginPath();ctx.arc(r.x,py,r.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a4a4a';
    ctx.beginPath();ctx.arc(r.x-2,py-2,r.r*0.4,0,Math.PI*2);ctx.fill();
  });

  particles.forEach(pt=>{
    ctx.fillStyle=`rgba(255,213,79,${pt.life/16})`;
    ctx.beginPath();ctx.arc(pt.x,pt.y-camY,4,0,Math.PI*2);ctx.fill();
  });

  ctx.fillStyle='#ff8a65';
  ctx.beginPath();ctx.arc(player.x,player.y-camY,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(player.x-6,player.y-camY-4,4,4);
  ctx.fillRect(player.x+2,player.y-camY-4,4,4);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('fell_msg','FELL!'),W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('coins_collected_label','Coins collected: {s}').replace('{s}',score),W/2,H/2);
    ctx.fillText(I18N.t('tap_jump_climb_again','Tap Jump to climb again'),W/2,H/2+26);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
init();loop();
</script></body></html>
