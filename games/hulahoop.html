<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#e91e63,#ffd54f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Hula Hoop</div>
  <div class="game-frame">
    <div id="score-display">Time: 0.0s | Best: 0.0s</div>
    <canvas id="c" width="480" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Left Arrow</b> and <b>Right Arrow</b> keys alternately (or tap the <b>left/right sides</b> of the screen) in rhythm to keep the hoop spinning. Don't press the same side twice in a row, and don't let the meter run out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=480,CX=240,CY=270;
let hi=parseFloat(localStorage.getItem('hulahoop_hi')||'0');
let meter=60,time=0,gameOver=false,started=false;
let lastSide=null,hoopAngle=0,hoopSpeed=0;
let lastTime=null;
let bodySwayPhase=0;
let missFlash=0;

function reset(){
  meter=60;time=0;gameOver=false;started=false;lastSide=null;hoopAngle=0;hoopSpeed=0;lastTime=null;missFlash=0;
}

function press(side){
  if(gameOver){reset();return;}
  if(!started){started=true;lastTime=performance.now();}
  if(side===lastSide){
    // same side twice — bad rhythm
    meter-=10;
    missFlash=10;
    SFX.error();
  }else{
    lastSide=side;
    meter=Math.min(100,meter+9);
    hoopSpeed=Math.min(14,hoopSpeed+1.2);
    SFX.tick();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();press('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();press('R');}
});
c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  const x=e.clientX-r.left;
  press(x<r.width/2?'L':'R');
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-r.left;
  press(x<r.width/2?'L':'R');
},{passive:false});

function drawPerson(sway){
  ctx.save();
  ctx.translate(CX,CY);
  // legs
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-14,60);ctx.lineTo(-18+sway*2,120);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,60);ctx.lineTo(18+sway*2,120);ctx.stroke();
  // torso
  ctx.fillStyle='#4a90d9';
  ctx.beginPath();
  ctx.moveTo(-22,60);ctx.lineTo(22,60);ctx.lineTo(16,-40);ctx.lineTo(-16,-40);
  ctx.closePath();ctx.fill();
  // arms
  ctx.strokeStyle='#f2c199';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-16,-25);ctx.lineTo(-34-sway,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,-25);ctx.lineTo(34+sway,10);ctx.stroke();
  // head
  ctx.fillStyle='#f2c199';
  ctx.beginPath();ctx.arc(0,-58,20,0,Math.PI*2);ctx.fill();
  // face
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-6,-60,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6,-60,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-52,6,0,Math.PI,false);ctx.stroke();
  // hair
  ctx.fillStyle='#5a3a2a';
  ctx.beginPath();ctx.arc(0,-64,20,Math.PI,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawHoop(angle,speed){
  ctx.save();
  ctx.translate(CX,CY+30);
  const squish=0.35+0.15*Math.sin(angle*2);
  ctx.rotate(0);
  ctx.scale(1,squish);
  ctx.strokeStyle='#00e5ff';
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.ellipse(0,0,90,90,0,0,Math.PI*2);
  ctx.stroke();
  // hoop highlight dot to show spin
  const dotX=Math.cos(angle)*90;
  const dotY=Math.sin(angle)*90;
  ctx.fillStyle='#fff176';
  ctx.beginPath();ctx.arc(dotX,dotY,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawMeter(){
  const bx=40,by=30,bw=W-80,bh=22;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.fillRect(bx,by,bw,bh);
  const pct=Math.max(0,meter)/100;
  const grad=ctx.createLinearGradient(bx,0,bx+bw,0);
  grad.addColorStop(0,'#ff5252');grad.addColorStop(0.5,'#ffd740');grad.addColorStop(1,'#69f0ae');
  ctx.fillStyle=grad;
  ctx.fillRect(bx,by,bw*pct,bh);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(bx,by,bw,bh);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#e91e63');bg.addColorStop(1,'#ffd54f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // floor
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,H-60,W,60);

  drawMeter();

  if(!started){
    drawPerson(0);
    drawHoop(0,0);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Left/Right or Tap sides to start'),CX,H-70);
    document.getElementById('score-display').textContent=I18N.t('time_hi_label','Time: {s}s | Best: {h}s').replace('{s}','0.0').replace('{h}',hi.toFixed(1));
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawPerson(0);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hoop_dropped_title','HOOP DROPPED!'),CX,200);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or press an arrow key to try again'),CX,235);
    document.getElementById('score-display').textContent=I18N.t('time_hi_label','Time: {s}s | Best: {h}s').replace('{s}',time.toFixed(1)).replace('{h}',hi.toFixed(1));
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;
  time+=dt;
  if(time>hi){hi=time;localStorage.setItem('hulahoop_hi',hi.toFixed(2));}

  // meter decays over time, faster as hoop speed decays too
  meter-=dt*(6+Math.max(0,4-hoopSpeed*0.3));
  hoopSpeed=Math.max(0,hoopSpeed-dt*1.6);
  hoopAngle+=hoopSpeed*dt*2;
  bodySwayPhase+=dt*hoopSpeed;

  if(meter<=0){
    meter=0;gameOver=true;SFX.lose();
  }

  if(missFlash>0)missFlash--;

  drawPerson(Math.sin(bodySwayPhase)*6);
  drawHoop(hoopAngle,hoopSpeed);

  if(missFlash>0){
    ctx.fillStyle='rgba(255,0,0,.25)';ctx.fillRect(0,0,W,H);
  }

  document.getElementById('score-display').textContent=I18N.t('time_hi_label','Time: {s}s | Best: {h}s').replace('{s}',time.toFixed(1)).replace('{h}',hi.toFixed(1));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
