<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3b2a17;display:block;border-radius:8px}
#hud{color:#e8c98a;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:space-between;max-width:800px;margin:0 auto}
#hud span{padding:0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Papyrus Making</div>
  <div class="game-frame">
    <div id="hud"><span id="sheets">Sheets: 0 | Hi: 0</span><span id="lives">Tears left: 3</span></div>
    <canvas id="c" width="800" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>click</b>, or <b>tap</b> the instant the swinging beater lands inside the glowing zone. Slice reeds into strips, lay them in a crisscross pattern, then press each sheet evenly — three bad tears and the scribe's order is ruined!</div>
</div>
<script>
const HI_KEY='papyrusmaking_hi';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=380;
const sheetsEl=document.getElementById('sheets'),livesEl=document.getElementById('lives');

let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let sheets=0,lives=3,gameOver=true,started=false;
let phase=0; // 0 slice, 1 lay, 2 press
const PHASE_NAMES=['slice_phase','lay_phase','press_phase'];
const PHASE_FALLBACK=['Slicing Reeds','Laying Crosshatch','Pressing Sheet'];
const PHASE_NEED=[4,3,5];
let phaseHits=0;
let tear=0; // 0..100 meter, hitting outside zone raises it
let pointer=0,pointerDir=1,pointerSpeed=2.4;
let zoneStart=0.4,zoneWidth=0.22;
let flashTimer=0,flashColor='';
let strips=[]; // laid strips for phase1 visual
let sheetLevel=0; // difficulty progression

function fmtSheets(){
  sheetsEl.textContent=I18N.t('sheets_hi_label','Sheets: {s} | Hi: {h}').replace('{s}',sheets).replace('{h}',hi);
}
function fmtLives(){
  livesEl.textContent=I18N.t('tears_left_label','Tears left: {n}').replace('{n}',lives);
}

function newPhaseTargets(){
  const diffShrink=Math.min(0.5,sheetLevel*0.015);
  zoneWidth=Math.max(0.08,0.24-diffShrink);
  zoneStart=Math.random()*(1-zoneWidth);
  pointerSpeed=2.2+Math.min(2.5,sheetLevel*0.06);
  pointer=Math.random();
  pointerDir=Math.random()<0.5?1:-1;
}

function reset(){
  sheets=0;lives=3;phase=0;phaseHits=0;tear=0;sheetLevel=0;strips=[];gameOver=false;started=true;
  newPhaseTargets();
  fmtSheets();fmtLives();
}

function tearSheet(){
  lives--;
  fmtLives();
  SFX.fail();
  flashTimer=20;flashColor='#e94560';
  tear=0;
  phase=0;phaseHits=0;strips=[];
  newPhaseTargets();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(sheets>hi){hi=sheets;localStorage.setItem(HI_KEY,String(hi));}
    fmtSheets();
  }
}

function completeSheet(){
  sheets++;
  sheetLevel++;
  SFX.win();
  flashTimer=20;flashColor='#7ec850';
  phase=0;phaseHits=0;tear=Math.max(0,tear-30);strips=[];
  newPhaseTargets();
  if(sheets>hi){hi=sheets;localStorage.setItem(HI_KEY,String(hi));}
  fmtSheets();
}

function strike(){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  const inZone = pointer>=zoneStart && pointer<=zoneStart+zoneWidth;
  if(inZone){
    phaseHits++;
    SFX.point();
    flashTimer=8;flashColor='#7ec850';
    if(phase===1){
      strips.push({h:Math.random()<0.5,pos:phaseHits});
    }
    if(phaseHits>=PHASE_NEED[phase]){
      phase++;phaseHits=0;
      if(phase>=3){
        completeSheet();
        return;
      }
      SFX.select();
    }
    newPhaseTargets();
  } else {
    tear+=22;
    SFX.hit();
    flashTimer=8;flashColor='#e94560';
    newPhaseTargets();
    if(tear>=100){
      tearSheet();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();strike();}
});
c.addEventListener('pointerdown',e=>{e.preventDefault();strike();});
c.addEventListener('touchstart',e=>{e.preventDefault();strike();},{passive:false});

function drawBar(){
  const barX=100,barY=260,barW=600,barH=36;
  ctx.fillStyle='#2a1c0f';
  ctx.fillRect(barX,barY,barW,barH);
  // target zone
  ctx.fillStyle='rgba(126,200,80,0.55)';
  ctx.fillRect(barX+zoneStart*barW,barY,zoneWidth*barW,barH);
  ctx.strokeStyle='#7ec850';
  ctx.lineWidth=2;
  ctx.strokeRect(barX+zoneStart*barW,barY,zoneWidth*barW,barH);
  // pointer
  const px=barX+pointer*barW;
  ctx.fillStyle='#e8c98a';
  ctx.beginPath();
  ctx.moveTo(px,barY-14);
  ctx.lineTo(px-10,barY);
  ctx.lineTo(px+10,barY);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(px-3,barY,6,barH);
  ctx.strokeStyle='#5a3d1f';
  ctx.strokeRect(barX,barY,barW,barH);
}

function drawTearMeter(){
  const x=100,y=316,w=600,h=16;
  ctx.fillStyle='#2a1c0f';ctx.fillRect(x,y,w,h);
  const pct=tear/100;
  ctx.fillStyle=pct>0.7?'#e94560':pct>0.4?'#ffb347':'#7ec850';
  ctx.fillRect(x,y,w*pct,h);
  ctx.strokeStyle='#5a3d1f';ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='#e8c98a';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('tear_meter_label','Tear risk'),x,y-4);
}

function drawFrame(){
  const fx=250,fy=60,fw=300,fh=150;
  ctx.strokeStyle='#8a5a2b';
  ctx.lineWidth=10;
  ctx.strokeRect(fx,fy,fw,fh);
  ctx.fillStyle='#e8c98a';
  ctx.fillRect(fx+5,fy+5,fw-10,fh-10);
  if(phase===0){
    // reed stalks waiting to be sliced
    ctx.fillStyle='#3d8020';
    for(let i=0;i<5;i++){
      const rx=fx+20+i*52;
      ctx.fillRect(rx,fy+20,14,fh-40);
    }
    ctx.fillStyle='#0d3b1e';
    ctx.font='bold 14px Arial';ctx.textAlign='center';
    for(let i=0;i<phaseHits;i++){
      ctx.fillText('✂',fx+20+i*52+7,fy+fh/2);
    }
  } else if(phase===1){
    strips.forEach((s,idx)=>{
      ctx.strokeStyle='#a97c3f';
      ctx.lineWidth=6;
      ctx.beginPath();
      if(s.h){
        const y=fy+25+idx*28;
        ctx.moveTo(fx+10,y);ctx.lineTo(fx+fw-10,y);
      } else {
        const x=fx+25+idx*40;
        ctx.moveTo(x,fy+10);ctx.lineTo(x,fy+fh-10);
      }
      ctx.stroke();
    });
  } else {
    // pressed sheet visual, darker as more hits land
    const shade=200-phaseHits*20;
    ctx.fillStyle=`rgb(${shade},${shade-30},${shade-90})`;
    ctx.fillRect(fx+10,fy+10,fw-20,fh-20);
    ctx.strokeStyle='#3b2a17';
    ctx.lineWidth=1;
    for(let i=1;i<6;i++){
      ctx.beginPath();ctx.moveTo(fx+10,fy+10+i*(fh-20)/6);ctx.lineTo(fx+fw-10,fy+10+i*(fh-20)/6);ctx.stroke();
    }
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1e140a');sky.addColorStop(1,'#3b2a17');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#e8c98a';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawFrame();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('order_result_label','Sheets crafted: {s}').replace('{s}',sheets),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+42);
    requestAnimationFrame(loop);
    return;
  }

  pointer+=pointerDir*pointerSpeed*0.01;
  if(pointer>1){pointer=1;pointerDir=-1;}
  if(pointer<0){pointer=0;pointerDir=1;}

  ctx.fillStyle='#e8c98a';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t(PHASE_NAMES[phase],PHASE_FALLBACK[phase]),W/2,30);
  ctx.font='14px Arial';
  ctx.fillText(I18N.t('phase_progress_label','Step {a} of {b}').replace('{a}',phaseHits).replace('{b}',PHASE_NEED[phase]),W/2,50);

  drawFrame();
  drawBar();
  drawTearMeter();

  if(flashTimer>0){
    flashTimer--;
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flashTimer/20*0.35;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  requestAnimationFrame(loop);
}
fmtSheets();fmtLives();
loop();
</script></body></html>
