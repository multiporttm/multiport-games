<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#ff9800;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffcc80;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pumpkin Chunkin</div>
  <div class="game-frame">
    <div id="score-display">Launch 1/5 | Best: 0ft | Round Total: 0ft</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and <b>drag back</b> on the pumpkin to pull the catapult arm — the angle and pull distance set your launch angle and power. <b>Release</b> to fire! You get <b>5 launches</b> per round — try to beat your personal best distance.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const GROUND_Y=H-40;
const PIVOT={x:110,y:GROUND_Y-60};
const ARM_LEN=90;
const SCALE=0.12; // pixels-to-feet
const MAX_LAUNCHES=5;

let best=parseFloat(localStorage.getItem('pumpkin_best')||'0')||0;
let bestRoundTotal=parseFloat(localStorage.getItem('pumpkin_best_round')||'0')||0;

let launchNum,roundTotal,dragging,dragStart,pullVec,pumpkin,inFlight,lastDist,camX,roundOver;

function reset(){
  launchNum=1;roundTotal=0;roundOver=false;
  setupPumpkin();
}
function setupPumpkin(){
  dragging=false;pullVec={x:0,y:0};
  pumpkin={x:PIVOT.x+ARM_LEN,y:PIVOT.y,vx:0,vy:0,r:14,launched:false,landed:false};
  inFlight=false;lastDist=0;camX=0;
}
reset();

function localPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};
}

function startDrag(e){
  if(inFlight)return;
  if(pumpkin.landed){startNextRound();return;}
  if(pumpkin.launched)return;
  dragging=true;
  dragStart=localPos(e);
}
function moveDrag(e){
  if(!dragging)return;
  const p=localPos(e);
  let dx=p.x-pumpkin.x, dy=p.y-pumpkin.y;
  // limit pull radius
  const maxPull=110;
  const d=Math.hypot(dx,dy);
  if(d>maxPull){dx*=maxPull/d;dy*=maxPull/d;}
  pullVec={x:dx,y:dy};
}
function endDrag(){
  if(!dragging)return;
  dragging=false;
  const power=Math.hypot(pullVec.x,pullVec.y);
  if(power<8){pullVec={x:0,y:0};return;}
  // launch opposite of pull direction, scaled
  const launchPower=power*0.22;
  pumpkin.vx=-pullVec.x/power*launchPower;
  pumpkin.vy=-pullVec.y/power*launchPower;
  pumpkin.launched=true;
  inFlight=true;
  SFX.swoosh();
  pullVec={x:0,y:0};
}

c.addEventListener('mousedown',startDrag);
c.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);
c.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();moveDrag(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endDrag();},{passive:false});

function startNextRound(){
  if(launchNum>=MAX_LAUNCHES){
    // new round entirely
    launchNum=1;roundTotal=0;roundOver=false;
  }else{
    launchNum++;
  }
  setupPumpkin();
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('pumpkin_score','Launch {n}/{m} | Best: {b}ft | Round Total: {r}ft')
      .replace('{n}',launchNum).replace('{m}',MAX_LAUNCHES)
      .replace('{b}',Math.round(best)).replace('{r}',Math.round(roundTotal));
}

function step(dt){
  if(!inFlight)return;
  pumpkin.vy+=0.28*dt;
  pumpkin.x+=pumpkin.vx*dt;
  pumpkin.y+=pumpkin.vy*dt;
  if(pumpkin.y+pumpkin.r>=GROUND_Y){
    pumpkin.y=GROUND_Y-pumpkin.r;
    inFlight=false;
    pumpkin.landed=true;
    const distFt=Math.max(0,(pumpkin.x-PIVOT.x)*SCALE);
    lastDist=distFt;
    roundTotal+=distFt;
    if(distFt>best){best=distFt;localStorage.setItem('pumpkin_best',best);SFX.success();}
    else SFX.land();
    if(launchNum>=MAX_LAUNCHES){
      roundOver=true;
      if(roundTotal>bestRoundTotal){bestRoundTotal=roundTotal;localStorage.setItem('pumpkin_best_round',bestRoundTotal);}
    }
  }
}

function drawCatapult(){
  ctx.strokeStyle='#6d4c41';ctx.lineWidth=10;ctx.lineCap='round';
  // base legs
  ctx.beginPath();ctx.moveTo(PIVOT.x-40,GROUND_Y);ctx.lineTo(PIVOT.x,PIVOT.y);ctx.lineTo(PIVOT.x+40,GROUND_Y);ctx.stroke();
  // arm from pivot to pumpkin (or resting position)
  let armEndX=pumpkin.launched?PIVOT.x+ARM_LEN:pumpkin.x;
  let armEndY=pumpkin.launched?PIVOT.y:pumpkin.y;
  ctx.strokeStyle='#5d4037';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(PIVOT.x,PIVOT.y);ctx.lineTo(armEndX,armEndY);ctx.stroke();
  ctx.fillStyle='#3e2723';
  ctx.beginPath();ctx.arc(PIVOT.x,PIVOT.y,10,0,Math.PI*2);ctx.fill();
}

function drawPumpkin(x,y,r){
  ctx.fillStyle='#fb8c00';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e65100';ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.moveTo(x+i*r*0.5,y-r*0.85);ctx.lineTo(x+i*r*0.5,y+r*0.85);ctx.stroke();
  }
  ctx.fillStyle='#4e342e';
  ctx.fillRect(x-3,y-r-8,6,8);
}

function drawAimGuide(){
  if(!dragging)return;
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.lineWidth=2;
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(pumpkin.x,pumpkin.y);
  ctx.lineTo(pumpkin.x-pullVec.x*3,pumpkin.y-pullVec.y*3);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawField(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#ffb74d');sky.addColorStop(1,'#ffe0b2');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND_Y);
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle='#a1887f';ctx.fillRect(0,GROUND_Y,W,4);
  // distance markers every 50ft
  ctx.strokeStyle='rgba(255,255,255,0.4)';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font='11px Arial';ctx.textAlign='center';
  for(let ft=0;ft<=1000;ft+=50){
    const sx=PIVOT.x+ft/SCALE;
    if(sx>W)break;
    ctx.beginPath();ctx.moveTo(sx,GROUND_Y);ctx.lineTo(sx,GROUND_Y-10);ctx.stroke();
    if(ft%100===0)ctx.fillText(ft+'ft',sx,GROUND_Y-14);
  }
  // best marker
  const bestSx=PIVOT.x+best/SCALE;
  if(bestSx<W&&best>0){
    ctx.strokeStyle='#ffeb3b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bestSx,GROUND_Y-30);ctx.lineTo(bestSx,GROUND_Y);ctx.stroke();
    ctx.fillStyle='#ffeb3b';ctx.font='bold 11px Arial';
    ctx.fillText(I18N.t('pumpkin_bestmark','BEST'),bestSx,GROUND_Y-34);
  }
}

let lastTs=null;
function loop(ts){
  const dt=lastTs===null?1:Math.min((ts-lastTs)/16.6667,3);
  lastTs=ts;
  ctx.clearRect(0,0,W,H);
  drawField();
  drawCatapult();

  step(dt);

  if(!pumpkin.launched){
    const px=pumpkin.x-pullVec.x, py=pumpkin.y-pullVec.y;
    drawPumpkin(px,py,pumpkin.r);
    drawAimGuide();
  }else{
    drawPumpkin(pumpkin.x,pumpkin.y,pumpkin.r);
  }

  if(pumpkin.landed&&!inFlight){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pumpkin_dist','Distance: {d}ft').replace('{d}',Math.round(lastDist)),W/2,60);
    ctx.font='16px Arial';
    ctx.fillText(roundOver?I18N.t('pumpkin_roundover','Round complete! Tap to start a new round.'):I18N.t('pumpkin_next','Tap the pumpkin to load next launch'),W/2,88);
  }else if(!pumpkin.launched&&!dragging){
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pumpkin_hint','Drag back on the pumpkin, then release!'),W/2,40);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
