<style>
body{background:linear-gradient(135deg,#5a4a2f,#231c10)}
#c{display:block;border-radius:10px;margin:0 auto;background:linear-gradient(160deg,#5a4a2f,#231c10);touch-action:none}

<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn" data-i18n="back">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">🎶 <span data-i18n="title">Xylophone Making Bar Cutting</span></div>
  <div class="game-frame" style="padding:10px">
    <div id="hud">
      <span data-i18n="score_lbl">Score: <b id="scoreVal">0</b></span>
      <span data-i18n="best_lbl">Best: <b id="bestVal">0</b></span>
    </div>
    <canvas id="c" width="360" height="460"></canvas>
    <div id="focusWrap"><div id="focusBar"></div></div>
    <button id="bigBtn" data-i18n="start_btn">Start</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">A saw sweeps back and forth over the bar. Tap, click, or press Space/Enter the instant it is in the green zone for a clean cut. Misses drain your precision meter - empty it and the round ends. Chain clean cuts to speed up and raise your score!</div>
</div>
<script>
(function(){
'use strict';
const ID='xylophonemakingbarcutting', HS_KEY='xylophonemakingbarcutting_highscore';
const c=document.getElementById('c'), ctx=c.getContext('2d');
const W=c.width, H=c.height;
const scoreEl=document.getElementById('scoreVal'), bestEl=document.getElementById('bestVal');
const focusBar=document.getElementById('focusBar');
const bigBtn=document.getElementById('bigBtn');

let best=0;
try{ best=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){}
bestEl.textContent=best;

const TRACK_X0=28, TRACK_X1=W-28, TRACK_Y=0, TRACK_H=30; // TRACK_Y set per-frame below hero area
const HERO_H=240;

let state='idle'; // idle | play | over
let score=0, hits=0, round=1, focus=100, speed=0.9, zoneW=92;
let phase=Math.random()*2, flash=0, flashColor='', lastT=performance.now();
let zoneStart=pickZone();
const MISS_PENALTY=20, BASE_SPEED=0.9, SPEED_STEP=0.085, MIN_ZONE=34, ZONE_SHRINK=4;

function pickZone(){
  const w=Math.max(MIN_ZONE, zoneW);
  return TRACK_X0 + Math.random()*((TRACK_X1-TRACK_X0)-w);
}

function pingpong(p){
  const f=p%2;
  return f<1?f:2-f;
}

function markerX(){
  return TRACK_X0 + (TRACK_X1-TRACK_X0)*pingpong(phase);
}

function reset(){
  score=0; hits=0; round=1; focus=100; speed=BASE_SPEED; zoneW=92;
  phase=Math.random()*2; flash=0;
  zoneStart=pickZone();
  updateHud();
}

function updateHud(){
  scoreEl.textContent=score;
  focusBar.style.width=Math.max(0,focus)+'%';
  focusBar.style.background = focus>55? 'linear-gradient(90deg,#ffd54f,#8bc34a)' : (focus>25? 'linear-gradient(90deg,#ff9800,#ffd54f)' : 'linear-gradient(90deg,#d32f2f,#ff9800)');
}

function startGame(){
  reset();
  state='play';
  bigBtn.style.display='none';
  SFX.click();
}

function endGame(){
  state='over';
  bigBtn.textContent=I18N.t('retry_btn','Play Again');
  bigBtn.style.display='block';
  if(score>best){
    best=score;
    try{ localStorage.setItem(HS_KEY,String(best)); }catch(e){}
  }
  bestEl.textContent=best;
  SFX.lose();
}

function act(){
  if(state==='idle'||state==='over'){ startGame(); return; }
  if(state!=='play') return;
  const mx=markerX();
  const zoneEnd=zoneStart+Math.max(MIN_ZONE,zoneW);
  if(mx>=zoneStart && mx<=zoneEnd){
    const center=zoneStart+(zoneEnd-zoneStart)/2;
    const dist=Math.abs(mx-center)/((zoneEnd-zoneStart)/2);
    const bonus= dist<0.35 ? 15 : 10;
    hits++; score+=bonus+round;
    flash=1; flashColor='#8bc34a';
    if(dist<0.35) SFX.coin(); else SFX.point();
    round++;
    if(hits%5===0){ speed+=SPEED_STEP; zoneW=Math.max(MIN_ZONE, zoneW-ZONE_SHRINK); SFX.levelup(); }
  } else {
    focus-=MISS_PENALTY;
    flash=1; flashColor='#e53935';
    SFX.error();
    if(focus<=0){ focus=0; updateHud(); endGame(); return; }
  }
  phase=Math.random()*2;
  zoneStart=pickZone();
  updateHud();
}

bigBtn.addEventListener('click',(e)=>{ e.stopPropagation(); act(); });
c.addEventListener('pointerdown',(e)=>{ e.preventDefault(); act(); });
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); act(); }
});

function woodGrain(ctx,x,y,w,h,base,dark){
  ctx.fillStyle=base; ctx.beginPath(); ctx.roundRect(x,y,w,h,4); ctx.fill();
  ctx.strokeStyle=dark; ctx.lineWidth=1.3; ctx.globalAlpha=.55;
  for(let i=0;i<5;i++){
    const gy=y+6+i*(h-12)/4;
    ctx.beginPath(); ctx.moveTo(x+4,gy);
    for(let xx=x+4;xx<x+w-4;xx+=14){ ctx.lineTo(xx+7,gy+(Math.sin(xx*0.11+i)*2)); }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawHero(ctx,t,mf,flash,flashColor){
  const horseY=182, horseTopY=150;
  ctx.strokeStyle='#4a3a28'; ctx.lineWidth=6; ctx.lineCap='round';
  [70,290].forEach(cx=>{
    ctx.beginPath(); ctx.moveTo(cx-20,horseY+26); ctx.lineTo(cx+6,horseTopY); ctx.lineTo(cx+20,horseY+26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-6,horseY+26); ctx.lineTo(cx+20,horseTopY); ctx.lineTo(cx+34,horseY+26); ctx.stroke();
  });

  woodGrain(ctx,34,horseTopY-28,292,38,'#c08a4a','#6b4423');
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(180,horseTopY-28); ctx.lineTo(180,horseTopY+10); ctx.stroke();
  ctx.setLineDash([]);

  const bx=34+mf*292, by=horseTopY-54+Math.sin(t*9)*3;
  ctx.save(); ctx.translate(bx,by);
  ctx.fillStyle='#b0bec5'; ctx.beginPath(); ctx.moveTo(-3,-26); ctx.lineTo(3,-26); ctx.lineTo(10,30); ctx.lineTo(-10,30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#cfd8dc';
  for(let i=-8;i<=8;i+=4){ ctx.beginPath(); ctx.moveTo(i,30); ctx.lineTo(i+2,36); ctx.lineTo(i+4,30); ctx.fill(); }
  ctx.fillStyle='#5d4037'; ctx.fillRect(-5,-40,10,16);
  ctx.restore();

  if(flash>0){
    ctx.globalAlpha=flash*0.75;
    ctx.fillStyle=flashColor;
    ctx.beginPath(); ctx.arc(bx,horseTopY-8,30,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.textAlign='center'; ctx.fillStyle='rgba(241,233,216,.85)'; ctx.font='12px Arial, sans-serif';
  ctx.fillText(I18N.t('flavor_barcutting','Cut the bar to length — lock the saw in the green zone'), 180, 34);
}


function draw(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(state==='play') phase += dt*speed;
  if(flash>0) flash=Math.max(0,flash-dt*2.2);

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#5a4a2f'); bg.addColorStop(1,'#231c10');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  drawHero(ctx, now/1000, state==='play'?pingpong(phase):0.5, flash, flashColor);

  // track
  const trackY=HERO_H+34;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.roundRect(TRACK_X0,trackY,TRACK_X1-TRACK_X0,TRACK_H,8); ctx.fill();

  // zone
  const zw=Math.max(MIN_ZONE,zoneW);
  ctx.fillStyle='rgba(139,195,74,.85)';
  ctx.beginPath(); ctx.roundRect(zoneStart,trackY,zw,TRACK_H,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(zoneStart+zw/2-1.5,trackY,3,TRACK_H);

  // marker
  if(state==='play'){
    const mx=markerX();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(mx,trackY-10); ctx.lineTo(mx-9,trackY-2); ctx.lineTo(mx+9,trackY-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(mx-2.5,trackY-2,5,TRACK_H+4);
  }

  // labels
  ctx.textAlign='center'; ctx.fillStyle='#f1e9d8';
  ctx.font='bold 13px Arial, sans-serif';
  ctx.fillText(I18N.t('round_lbl','Round {n}').replace('{n}',round), W/2, trackY+TRACK_H+22);

  if(state!=='play'){
    ctx.fillStyle='rgba(10,8,4,.62)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f'; ctx.font='bold 26px Arial, sans-serif'; ctx.textAlign='center';
    if(state==='idle'){
      ctx.fillText(I18N.t('ready_title','🎶 Ready?'), W/2, H/2-14);
      ctx.fillStyle='#f1e9d8'; ctx.font='15px Arial, sans-serif';
      ctx.fillText(I18N.t('ready_sub','Tap Start to begin'), W/2, H/2+16);
    } else {
      ctx.fillText(I18N.t('over_title','Game Over'), W/2, H/2-30);
      ctx.fillStyle='#fff'; ctx.font='bold 20px Arial, sans-serif';
      ctx.fillText(I18N.t('final_score','Score: {n}').replace('{n}',score), W/2, H/2+2);
      ctx.font='14px Arial, sans-serif'; ctx.fillStyle='#f1e9d8';
      ctx.fillText(score>=best ? I18N.t('new_best','New Best!') : I18N.t('best_was','Best: {n}').replace('{n}',best), W/2, H/2+26);
    }
  }

  requestAnimationFrame(draw);
}

updateHud();
requestAnimationFrame(draw);
})();
</script>
