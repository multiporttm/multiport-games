<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap-frame{background:linear-gradient(135deg,#0288d1,#b3e5fc);border-radius:14px;padding:14px;text-align:center}
#stats{color:#08343f;font-weight:800;font-size:1.05rem;margin-bottom:8px;text-shadow:0 1px 2px rgba(255,255,255,.4)}
#sheet{display:inline-grid;gap:6px;background:rgba(255,255,255,.25);padding:10px;border-radius:12px;user-select:none}
.bubble{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3f6ff,#7fc9e8 60%,#4a9cc4 100%);box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 -2px 3px rgba(0,60,90,.3);cursor:pointer;transition:transform .08s;}
.bubble:active{transform:scale(.9)}
.bubble.popped{background:radial-gradient(circle at 40% 40%,#dbeaf0,#c9d9df);box-shadow:inset 0 2px 4px rgba(0,0,0,.35);cursor:default}
.bubble.big{width:56px;height:56px;background:radial-gradient(circle at 35% 30%,#fff6d8,#ffd54f 60%,#f9a825 100%);}
.bubble.big.popped{background:radial-gradient(circle at 40% 40%,#e8e2d0,#d8cfb8);}
#msg{color:#08343f;font-weight:900;font-size:1.2rem;min-height:1.6em;margin-top:8px}
@media(max-width:480px){.bubble{width:30px;height:30px}.bubble.big{width:44px;height:44px}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bubble Wrap</div>
  <div class="game-frame" style="padding:10px">
    <div id="wrap-frame">
      <div id="stats">Time: 30 | Score: 0 | Hi: 0</div>
      <div id="sheet"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or <b>Tap</b> bubbles to pop them for points before the timer runs out. Pop every bubble on a sheet before time's up to earn a <b>bonus</b> and get a fresh sheet. Watch for the occasional big golden bubble worth extra points!</div>
</div>
<script>
const ROWS=6,COLS=7;
let grid=[],timeLeft=30,score=0,hi=+(localStorage.getItem('bubblewrap_hi')||0);
let totalPopped=+(localStorage.getItem('bubblewrap_total')||0);
let bestSheets=+(localStorage.getItem('bubblewrap_sheets')||0);
let sheetsThisRound=0,running=false,timerId=null;

function buildSheet(){
  grid=[];
  const sheetEl=document.getElementById('sheet');
  sheetEl.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  sheetEl.innerHTML='';
  for(let i=0;i<ROWS*COLS;i++){
    const big=Math.random()<0.06;
    grid.push({popped:false,big});
    const el=document.createElement('div');
    el.className='bubble'+(big?' big':'');
    el.dataset.idx=i;
    el.addEventListener('click',()=>pop(i));
    el.addEventListener('touchstart',e=>{e.preventDefault();pop(i);},{passive:false});
    sheetEl.appendChild(el);
  }
}

function pop(i){
  if(!running)return;
  const b=grid[i];
  if(b.popped)return;
  b.popped=true;
  totalPopped++;
  const pts=b.big?15:1;
  score+=pts;
  if(b.big)SFX.coin();else SFX.click();
  const el=document.querySelector(`.bubble[data-idx="${i}"]`);
  if(el)el.classList.add('popped');
  updateStats();
  if(grid.every(x=>x.popped)){
    sheetsThisRound++;
    score+=20;
    timeLeft=Math.min(timeLeft+8,60);
    SFX.levelup();
    showMsg(I18N.t('sheet_cleared','Sheet cleared! +20 bonus, +8s'));
    buildSheet();
    updateStats();
  }
}

function showMsg(t){
  const m=document.getElementById('msg');
  m.textContent=t;
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>{m.textContent='';},1400);
}

function updateStats(){
  if(score>hi){hi=score;localStorage.setItem('bubblewrap_hi',hi);}
  document.getElementById('stats').textContent=I18N.t('bw_stats_label','Time: {t} | Score: {s} | Hi: {h}')
    .replace('{t}',Math.ceil(timeLeft)).replace('{s}',score).replace('{h}',hi);
}

function tick(){
  if(!running)return;
  timeLeft-=1;
  if(timeLeft<=0){
    endRound();
    return;
  }
  updateStats();
  timerId=setTimeout(tick,1000);
}

function endRound(){
  running=false;
  clearTimeout(timerId);
  localStorage.setItem('bubblewrap_total',totalPopped);
  if(sheetsThisRound>bestSheets){bestSheets=sheetsThisRound;localStorage.setItem('bubblewrap_sheets',bestSheets);}
  SFX.lose();
  updateStats();
  showMsg(I18N.t('time_up_retry','Time\'s up! Tap sheet to play again'));
  document.getElementById('sheet').addEventListener('click',restartOnce,{once:true});
}

function restartOnce(){
  startRound();
}

function startRound(){
  score=0;timeLeft=30;sheetsThisRound=0;running=true;
  buildSheet();
  updateStats();
  clearTimeout(timerId);
  timerId=setTimeout(tick,1000);
}

startRound();
</script></body></html>
