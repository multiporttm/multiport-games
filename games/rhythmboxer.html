<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#241017;display:block;border-radius:8px;margin:0 auto}
#score-display{color:#ff477e;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#btnRow{display:flex;gap:10px;justify-content:center;margin:10px 0}
#btnRow button{flex:1;max-width:150px;padding:14px 0;border:none;border-radius:12px;font-weight:900;font-size:1rem;color:#fff;cursor:pointer}
#btnRow button:active{transform:scale(.95)}
#btnLeft{background:#ff477e}
#btnBlock{background:#4dd0e1}
#btnRight{background:#ffb703}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rhythm Boxer</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Combo: 0 | Hi: 0</div>
    <canvas id="c" width="700" height="320"></canvas>
    <div id="btnRow">
      <button id="btnLeft">A ← Left Punch</button>
      <button id="btnBlock">S ↓ Block</button>
      <button id="btnRight">D → Right Punch</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>A</b>, <b>S</b>, or <b>D</b> (or tap the buttons) for <b>Left Punch</b>, <b>Block</b>, or <b>Right Punch</b> exactly when the prompt reaches the hit zone. Build a combo streak — miss 5 times and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=320;
const LANES={left:{x:150,color:'#ff477e',label:'LEFT PUNCH',key:'a'},block:{x:350,color:'#4dd0e1',label:'BLOCK',key:'s'},right:{x:550,color:'#ffb703',label:'RIGHT PUNCH',key:'d'}};
const HITZONE_Y=250;
const HIT_WINDOW=26;
let notes=[],score=0,hi=parseInt(localStorage.getItem('rhythmboxer_hi')||'0'),combo=0,misses=0,maxMisses=5,gameOver=false,started=false;
let beatTimer=0,beatInterval=62,speed=3.2,frame=0;
let flashes=[];

function reset(){
  notes=[];score=0;combo=0;misses=0;gameOver=false;started=false;beatTimer=0;speed=3.2;frame=0;flashes=[];
}

function spawnNote(){
  const keys=Object.keys(LANES);
  const lane=keys[Math.floor(Math.random()*keys.length)];
  notes.push({lane,y:-20,hit:false});
}

function tryHit(lane){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  // find closest unhit note in this lane within window
  let best=null,bestDist=999;
  for(const n of notes){
    if(n.lane!==lane||n.hit)continue;
    const d=Math.abs(n.y-HITZONE_Y);
    if(d<bestDist){bestDist=d;best=n;}
  }
  flashes.push({lane,t:8});
  if(best&&bestDist<=HIT_WINDOW){
    best.hit=true;
    combo++;
    const gain=10+Math.min(combo,20);
    score+=gain;
    if(score>hi){hi=score;localStorage.setItem('rhythmboxer_hi',String(hi));}
    SFX.hit();
    if(combo>0&&combo%10===0)SFX.levelup();
  } else {
    combo=0;
    misses++;
    SFX.error();
    if(misses>=maxMisses){gameOver=true;SFX.lose();}
  }
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='a'){tryHit('left');}
  else if(k==='s'){tryHit('block');}
  else if(k==='d'){tryHit('right');}
});
document.getElementById('btnLeft').addEventListener('click',()=>tryHit('left'));
document.getElementById('btnBlock').addEventListener('click',()=>tryHit('block'));
document.getElementById('btnRight').addEventListener('click',()=>tryHit('right'));
document.getElementById('btnLeft').addEventListener('touchstart',e=>{e.preventDefault();tryHit('left');},{passive:false});
document.getElementById('btnBlock').addEventListener('touchstart',e=>{e.preventDefault();tryHit('block');},{passive:false});
document.getElementById('btnRight').addEventListener('touchstart',e=>{e.preventDefault();tryHit('right');},{passive:false});
c.addEventListener('click',()=>{ if(!started)started=true; else if(gameOver)reset(); });

function drawLane(key,l){
  ctx.save();
  ctx.strokeStyle=l.color+'55';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(l.x,0);ctx.lineTo(l.x,H);ctx.stroke();
  // hit zone ring
  ctx.strokeStyle=l.color;
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(l.x,HITZONE_Y,26,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ffffffaa';
  ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(l.key.toUpperCase(),l.x,HITZONE_Y+4);
  ctx.font='bold 13px Arial';
  ctx.fillStyle=l.color;
  ctx.fillText(l.label,l.x,H-10);
  ctx.restore();
}

let lastTime=null;
function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0810');bg.addColorStop(1,'#3a1522');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  Object.entries(LANES).forEach(([k,l])=>drawLane(k,l));

  if(!started){
    ctx.fillStyle='#ff477e';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_rhythm','Press A/S/D or Tap to start'),W/2,120);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,158);
    updateScore();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  speed=Math.min(6,3.2+score/400);

  beatTimer+=dt;
  const interval=Math.max(34,beatInterval-score/60);
  if(beatTimer>=interval){beatTimer-=interval;spawnNote();}

  notes.forEach(n=>n.y+=speed*dt);
  // missed notes past hitzone
  notes.forEach(n=>{
    if(!n.hit&&n.y>HITZONE_Y+HIT_WINDOW+4&&!n.counted){
      n.counted=true;
      combo=0;misses++;SFX.error();
      if(misses>=maxMisses){gameOver=true;SFX.lose();}
    }
  });
  notes=notes.filter(n=>n.y<H+30);

  notes.forEach(n=>{
    const l=LANES[n.lane];
    ctx.save();
    ctx.fillStyle=n.hit?'#ffffff88':l.color;
    ctx.beginPath();ctx.arc(l.x,n.y,16,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  flashes.forEach(f=>{
    const l=LANES[f.lane];
    ctx.strokeStyle='#ffffff'+Math.floor(f.t/8*255).toString(16).padStart(2,'0');
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(l.x,HITZONE_Y,30,0,Math.PI*2);ctx.stroke();
    f.t-=dt;
  });
  flashes=flashes.filter(f=>f.t>0);

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('rhythm_score_label','Score: {s} | Combo: {c} | Hi: {h}')
      .replace('{s}',score).replace('{c}',combo).replace('{h}',hi);
}

loop();
</script></body></html>
