<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Wakeboarding</title><meta name="description" content="Play Wakeboarding free online — Press Space or Tap to jump off the wake ramps at the right moment, then press again in the air to land a trick before you hit the water."><link rel="canonical" href="https://games.multiportllc.com/games/wakeboarding"><meta property="og:title" content="Wakeboarding - Multiport Games"><meta property="og:description" content="Play Wakeboarding free online — Press Space or Tap to jump off the wake ramps at the right moment, then press again in the air to land a trick before you hit the water."><meta property="og:url" content="https://games.multiportllc.com/games/wakeboarding"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Wakeboarding","description":"Play Wakeboarding free online instantly. Press Space or Tap to jump off the wake ramps at the right moment, then press again in the air to land a trick before you hit the water. Bad landings cost a life. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/wakeboarding","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0288d1,#01579b);display:block;border-radius:8px;touch-action:none}
#score-display{color:#e1f5fe;background:#01344d;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wakeboarding</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="280"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to jump off a wake ramp as it reaches you, then press again while airborne to spin a trick. Land cleanly for points — a mistimed jump or trick costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280;
const waterY=200;
let hi=parseInt(localStorage.getItem('wakeboarding_hi')||'0',10);
let score=0,lives=3,spd=5,frame=0,gameOver=false,started=false,lastTime=null;
const rider={x:150,y:waterY,vy:0,onRamp:false,airborne:false,trickDone:false,trickSpin:0,rot:0};
let ramps=[],rampTimer=0,particles=[];
let feedback='',feedbackTimer=0;

function reset(){
  score=0;lives=3;spd=5;frame=0;gameOver=false;started=false;lastTime=null;
  rider.y=waterY;rider.vy=0;rider.onRamp=false;rider.airborne=false;rider.trickDone=false;rider.trickSpin=0;rider.rot=0;
  ramps=[];rampTimer=0;particles=[];feedback='';feedbackTimer=0;
}

function spawnRamp(){
  ramps.push({x:820,w:60,hit:false});
}

function action(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(!rider.airborne){
    // try to jump: check if a ramp is under/near rider
    const near=ramps.find(r=>!r.hit&&Math.abs((r.x+r.w/2)-rider.x)<40);
    if(near){
      near.hit=true;
      rider.airborne=true;
      rider.vy=-13;
      rider.trickDone=false;
      rider.trickSpin=0;
      SFX.jump();
      feedback=I18N.t('wb_good_jump','Nice ramp!');feedbackTimer=40;
    }else{
      // jumped with no ramp nearby - small penalty jump, wobble
      SFX.error();
    }
  }else{
    // trick attempt
    if(!rider.trickDone){
      rider.trickDone=true;
      rider.trickSpin=1;
      SFX.swoosh();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();action();}});
c.addEventListener('mousedown',e=>{action();});
c.addEventListener('touchstart',e=>{e.preventDefault();action();},{passive:false});

function drawBoat(){
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(30,waterY-10);
  ctx.lineTo(80,waterY-10);
  ctx.lineTo(70,waterY+8);
  ctx.lineTo(40,waterY+8);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffca28';
  ctx.fillRect(45,waterY-22,20,14);
  ctx.restore();
  // rope
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(75,waterY);ctx.lineTo(rider.x-10,rider.y);ctx.stroke();
}

function drawRider(){
  ctx.save();
  ctx.translate(rider.x,rider.y);
  ctx.rotate(rider.rot);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-30,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.fillRect(-8,-22,16,20);
  ctx.fillStyle='#5d4037';
  ctx.fillRect(-16,-2,32,6);
  ctx.restore();
}

function drawRamp(r){
  ctx.fillStyle='#ffb74d';
  ctx.beginPath();
  ctx.moveTo(r.x,waterY+6);
  ctx.lineTo(r.x+r.w,waterY+6);
  ctx.lineTo(r.x+r.w*0.75,waterY-18);
  ctx.lineTo(r.x+r.w*0.25,waterY-18);
  ctx.closePath();ctx.fill();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,waterY);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#0288d1');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,waterY);
  const water=ctx.createLinearGradient(0,waterY,0,H);
  water.addColorStop(0,'#01579b');water.addColorStop(1,'#013a66');
  ctx.fillStyle=water;ctx.fillRect(0,waterY,W,H-waterY);
  // water ripples
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const yy=waterY+15+i*12;
    ctx.beginPath();
    for(let x=0;x<=W;x+=20){
      ctx.lineTo(x,yy+Math.sin((x+frame*2+i*30)/30)*3);
    }
    ctx.stroke();
  }

  if(gameOver){
    drawBoat();ramps.forEach(drawRamp);drawRider();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,110);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,148);
    updateDisplay();
    requestAnimationFrame(loop);return;
  }

  if(!started){
    drawBoat();drawRider();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wb_start_hint','Press Space / Tap to start'),W/2,110);
    updateDisplay();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  score+=0.1*dt;
  spd=5+score/200;

  rampTimer+=dt;
  const rampInterval=Math.max(55,110-score/8);
  if(rampTimer>=rampInterval){rampTimer-=rampInterval;spawnRamp();}

  ramps=ramps.filter(r=>r.x>-80);
  ramps.forEach(r=>{r.x-=spd*dt;});

  // physics
  if(rider.airborne){
    rider.vy+=0.55*dt;
    rider.y+=rider.vy*dt;
    if(rider.trickSpin>0){
      rider.rot+=0.35*dt;
      if(rider.rot>=Math.PI*2){rider.rot=0;}
    }
    if(rider.y>=waterY){
      rider.y=waterY;
      rider.vy=0;
      rider.airborne=false;
      const spunClean=(rider.rot<0.35||rider.rot>Math.PI*2-0.35)||rider.rot===0;
      if(rider.trickDone){
        if(spunClean){
          score+=50;
          SFX.success();
          feedback=I18N.t('wb_trick_land','Trick landed! +50');feedbackTimer=45;
        }else{
          lives--;
          SFX.fail();
          feedback=I18N.t('wb_wipeout','Wipeout!');feedbackTimer=45;
        }
      }
      rider.rot=0;
      rider.trickDone=false;
      rider.trickSpin=0;
      if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=Math.floor(score);localStorage.setItem('wakeboarding_hi',hi);}}
    }
  }

  if(score>hi)hi=Math.floor(score);

  drawBoat();
  ramps.forEach(drawRamp);
  drawRider();

  if(feedbackTimer>0){
    feedbackTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(feedback,W/2,60);
  }

  updateDisplay();
  requestAnimationFrame(loop);
}

function updateDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('wb_score_label','Score: {s} | Hi: {h} | Lives: {l}')
      .replace('{s}',Math.floor(score)).replace('{h}',hi).replace('{l}',Math.max(0,lives));
}

updateDisplay();
requestAnimationFrame(loop);
</script></body></html>
