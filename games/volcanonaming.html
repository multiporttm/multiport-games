<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Volcano Naming</title><meta name="description" content="Play Volcano Naming free online — A volcano's silhouette is highlighted on the map. Pick its name before time runs out! Wrong guesses cost a life. Build a streak across increasingly tricky volcanoes."><link rel="canonical" href="https://games.multiportllc.com/games/volcanonaming"><meta property="og:title" content="Volcano Naming - Multiport Games"><meta property="og:description" content="Play Volcano Naming free online — A volcano's silhouette is highlighted on the map. Pick its name before time runs out! Wrong guesses cost a life. Build a streak across increasingly tricky volcanoes."><meta property="og:url" content="https://games.multiportllc.com/games/volcanonaming"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Volcano Naming","description":"Play Volcano Naming free online instantly. A volcano's silhouette is highlighted on a simplified world map. Pick its correct name before time runs out! Wrong guesses cost a life. Build a streak of correct answers across increasingly tricky volcanoes. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/volcanonaming","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{padding:16px;text-align:center}
#hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:#fff;font-weight:700;margin-bottom:10px;font-size:.95rem}
#hud .stat{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 12px}
#timerBar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-bottom:12px}
#timerFill{height:100%;background:linear-gradient(90deg,#ff8a65,#e64a19);width:100%;transition:width .1s linear}
#mapBox{background:#241014;border-radius:14px;padding:10px;position:relative}
#mapSvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.landDot{fill:#3a2028}
.volcShape{fill:#5a2a1a;stroke:#7a3a2a;stroke-width:.5}
.volcShape.target{fill:#ff6d3b;stroke:#ffd54f;stroke-width:2.5;filter:drop-shadow(0 0 8px #ff6d3b)}
#region{color:#ffab91;font-size:.85rem;margin:8px 0 4px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:14px auto 4px;padding:0 4px}
.opt{padding:14px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s}
.opt:hover{background:rgba(255,255,255,.14)}
.opt.correct{background:#2e7d32;border-color:#66bb6a}
.opt.wrong{background:#c62828;border-color:#ef5350}
.opt:disabled{cursor:default}
#msg{min-height:1.6em;color:#ffd54f;font-weight:800;margin:8px 0}
#overlay{position:absolute;inset:0;background:rgba(20,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border-radius:14px;gap:10px;padding:20px;text-align:center}
#overlay h2{margin:0;font-size:1.6rem}
#overlay button{margin-top:8px;padding:12px 28px;border-radius:24px;border:none;background:#ff6d3b;color:#2a0e04;font-weight:800;font-size:1rem;cursor:pointer}
@media(max-width:480px){#options{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Volcano Naming</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <div class="stat" id="streakStat">Streak: 0</div>
        <div class="stat" id="livesStat">❤️❤️❤️</div>
        <div class="stat" id="hiStat">Best: 0</div>
      </div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="mapBox" style="position:relative">
        <div id="region">World</div>
        <svg id="mapSvg" viewBox="0 0 300 200"></svg>
        <div id="overlay" style="display:none"></div>
      </div>
      <div id="msg"></div>
      <div id="options"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A volcano's location is highlighted on the map as a glowing triangle. Select its correct name before the timer runs out! Wrong guesses cost a <b>life</b>. Build the longest streak — volcanoes get trickier as you go.</div>
</div>
<script>
const VOLCANOES=[
{n:"Mount Vesuvius",r:"Europe",d:1,x:238,y:70},
{n:"Mount Etna",r:"Europe",d:1,x:243,y:78},
{n:"Mount Fuji",r:"Asia",d:1,x:270,y:65},
{n:"Krakatoa",r:"Asia",d:1,x:250,y:120},
{n:"Mount St. Helens",r:"North America",d:1,x:40,y:45},
{n:"Mauna Loa",r:"Oceania",d:2,x:10,y:100},
{n:"Kilauea",r:"Oceania",d:2,x:12,y:104},
{n:"Mount Pinatubo",r:"Asia",d:2,x:255,y:100},
{n:"Popocatepetl",r:"North America",d:2,x:55,y:80},
{n:"Mount Kilimanjaro",r:"Africa",d:1,x:175,y:105},
{n:"Cotopaxi",r:"South America",d:2,x:75,y:135},
{n:"Mount Rainier",r:"North America",d:2,x:38,y:42},
{n:"Yellowstone",r:"North America",d:2,x:45,y:38},
{n:"Mount Nyiragongo",r:"Africa",d:3,x:165,y:110},
{n:"Mount Merapi",r:"Asia",d:2,x:252,y:122},
{n:"Eyjafjallajokull",r:"Europe",d:2,x:200,y:15},
{n:"Mount Bromo",r:"Asia",d:3,x:254,y:124},
{n:"Sakurajima",r:"Asia",d:3,x:272,y:70},
{n:"Mount Erebus",r:"Antarctica",d:3,x:190,y:190},
{n:"Mount Tambora",r:"Asia",d:3,x:256,y:126},
{n:"Mount Cameroon",r:"Africa",d:3,x:150,y:100},
{n:"Mount Ararat",r:"Asia",d:3,x:215,y:65},
{n:"Mount Elbrus",r:"Europe",d:3,x:212,y:58},
{n:"Villarrica",r:"South America",d:3,x:78,y:175},
{n:"Mount Nyamuragira",r:"Africa",d:3,x:167,y:111},
{n:"Ojos del Salado",r:"South America",d:3,x:76,y:160},
{n:"Mount Sinabung",r:"Asia",d:3,x:248,y:118},
{n:"Mount Agung",r:"Asia",d:3,x:255,y:125},
{n:"Mount Taal",r:"Asia",d:2,x:258,y:98},
{n:"Mount Aso",r:"Asia",d:3,x:268,y:72},
{n:"Nevado del Ruiz",r:"South America",d:3,x:72,y:130},
{n:"Mount Paricutin",r:"North America",d:3,x:53,y:82},
{n:"Mount Katmai",r:"North America",d:3,x:8,y:20},
{n:"Mount Shasta",r:"North America",d:2,x:36,y:50},
{n:"Mount Redoubt",r:"North America",d:3,x:6,y:18}
];

const TOTAL_LIVES=3, TIME_MS=10000;
let streak=0,hi=+(localStorage.getItem('volcanonaming_hi')||0),lives=TOTAL_LIVES,timerEnd=0,timerRAF=null,current=null,recent=[],locked=false;

const region=document.getElementById('region'),svg=document.getElementById('mapSvg'),msg=document.getElementById('msg'),
optionsEl=document.getElementById('options'),overlay=document.getElementById('overlay'),
streakStat=document.getElementById('streakStat'),livesStat=document.getElementById('livesStat'),hiStat=document.getElementById('hiStat'),
timerFill=document.getElementById('timerFill');

function updateHud(){
  streakStat.textContent=I18N.t('streak_label','Streak: {s}').replace('{s}',streak);
  livesStat.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(TOTAL_LIVES-Math.max(0,lives));
  hiStat.textContent=I18N.t('best_label','Best: {h}').replace('{h}',hi);
}

function pickPool(){
  const maxD=Math.min(3,1+Math.floor(streak/4));
  return VOLCANOES.filter(v=>v.d<=maxD);
}

function nextRound(){
  locked=false;
  msg.textContent='';
  const pool=pickPool().filter(v=>!recent.includes(v.n));
  const usable=pool.length>=4?pool:pickPool();
  current=usable[Math.floor(Math.random()*usable.length)];
  recent.push(current.n); if(recent.length>6)recent.shift();
  region.textContent=current.r;
  drawMap();
  buildOptions();
  startTimer();
}

function drawMap(){
  svg.innerHTML='';
  // faint continental dots for context
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',300);bg.setAttribute('height',200);bg.setAttribute('fill','#241014');
  svg.appendChild(bg);
  VOLCANOES.forEach(v=>{
    const tri=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    const isTarget=v===current;
    const s=isTarget?9:5;
    tri.setAttribute('points',`${v.x},${v.y-s} ${v.x-s},${v.y+s} ${v.x+s},${v.y+s}`);
    tri.setAttribute('class','volcShape'+(isTarget?' target':''));
    svg.appendChild(tri);
  });
}

function buildOptions(){
  const wrongPool=VOLCANOES.filter(v=>v.n!==current.n);
  const wrongs=[];
  while(wrongs.length<3&&wrongPool.length){
    const idx=Math.floor(Math.random()*wrongPool.length);
    const cand=wrongPool.splice(idx,1)[0];
    if(!wrongs.some(w=>w.n===cand.n))wrongs.push(cand);
  }
  const choices=[current,...wrongs].sort(()=>Math.random()-0.5);
  optionsEl.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=c.n;
    btn.onclick=()=>answer(c.n===current.n,btn);
    optionsEl.appendChild(btn);
  });
}

function startTimer(){
  cancelAnimationFrame(timerRAF);
  timerEnd=performance.now()+TIME_MS;
  tickTimer();
}
function tickTimer(){
  const remain=timerEnd-performance.now();
  const pct=Math.max(0,remain/TIME_MS);
  timerFill.style.width=(pct*100)+'%';
  timerFill.style.background=pct<0.25?'linear-gradient(90deg,#ff5252,#c62828)':'linear-gradient(90deg,#ff8a65,#e64a19)';
  if(remain<=0){ if(!locked) answer(false,null); return; }
  timerRAF=requestAnimationFrame(tickTimer);
}

function answer(correct,btn){
  if(locked)return;
  locked=true;
  cancelAnimationFrame(timerRAF);
  [...optionsEl.children].forEach(b=>b.disabled=true);
  if(btn)btn.classList.add(correct?'correct':'wrong');
  if(!btn){
    [...optionsEl.children].forEach(b=>{ if(b.textContent===current.n) b.classList.add('correct'); });
  }
  if(correct){
    streak++;
    if(streak>hi){hi=streak;localStorage.setItem('volcanonaming_hi',hi);}
    SFX.success();
    msg.textContent=I18N.t('correct_msg','Correct!');
    msg.style.color='#66bb6a';
  }else{
    lives--;
    SFX.fail();
    [...optionsEl.children].forEach(b=>{ if(b.textContent===current.n) b.classList.add('correct'); });
    msg.textContent=I18N.t('wrong_msg','Wrong! It was {n}').replace('{n}',current.n);
    msg.style.color='#ef5350';
  }
  updateHud();
  setTimeout(()=>{
    if(lives<=0){ gameOver(); } else { nextRound(); }
  },1100);
}

function gameOver(){
  SFX.lose();
  overlay.style.display='flex';
  overlay.innerHTML=`<h2>${I18N.t('game_over_title','GAME OVER')}</h2><div>${I18N.t('final_streak','Final streak: {s}').replace('{s}',streak)}</div><div>${I18N.t('best_label','Best: {h}').replace('{h}',hi)}</div><button id="playAgain">${I18N.t('play_again','Play Again')}</button>`;
  document.getElementById('playAgain').onclick=startGame;
}

function startGame(){
  overlay.style.display='none';
  streak=0;lives=TOTAL_LIVES;recent=[];
  updateHud();
  nextRound();
}

document.addEventListener('keydown',e=>{
  if(locked)return;
  const idx=parseInt(e.key,10)-1;
  if(idx>=0&&idx<optionsEl.children.length){ optionsEl.children[idx].click(); }
});

updateHud();
startGame();
</script></body></html>
