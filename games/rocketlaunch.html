<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a237e,#000051);display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8eaf6;background:#1a1a3d;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
#stageBtn{display:block;margin:10px auto 0;padding:14px 34px;font-size:1.2rem;font-weight:800;border:none;border-radius:10px;background:#ff7043;color:#fff;cursor:pointer}
#stageBtn:disabled{opacity:.45;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rocket Launch</div>
  <div class="game-frame">
    <div id="score-display">Best Altitude: 0m | Best Score: 0</div>
    <canvas id="c" width="800" height="380"></canvas>
    <button id="stageBtn">FUEL UP</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click <b>the stage button</b> (or tap it) exactly when the moving marker is inside the green zone of the timing bar. Nail every stage — fueling, ignition, liftoff, and separation — for maximum altitude and score!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=380;
const btn=document.getElementById('stageBtn');
let bestAlt=parseInt(localStorage.getItem('rocketlaunch_bestalt')||'0',10);
let bestScore=parseInt(localStorage.getItem('rocketlaunch_bestscore')||'0',10);

const STAGES=[
  {key:'fuel',label:'FUEL UP'},
  {key:'ignite',label:'IGNITE'},
  {key:'liftoff',label:'LIFTOFF'},
  {key:'separate',label:'SEPARATE'},
];

let stageIndex=0,marker=0,markerDir=1,zoneStart=0.4,zoneWidth=0.2,speed=0.012;
let results=[],phase='playing',launched=false,rocketY=300,rocketVy=0,altitude=0,finalScore=0,lastTime=null;
let flameOn=false,flameTimer=0;
let particles=[];

function reset(){
  stageIndex=0;marker=0;markerDir=1;
  zoneWidth=0.22;speed=0.011;
  results=[];phase='playing';launched=false;rocketY=300;rocketVy=0;altitude=0;finalScore=0;lastTime=null;
  flameOn=false;particles=[];
  setZone();
  btn.disabled=false;
  btn.textContent=STAGES[0].label;
}

function setZone(){
  zoneStart=0.15+Math.random()*0.55;
}

function pressStage(){
  if(phase!=='playing')return;
  const dist=Math.abs(marker-(zoneStart+zoneWidth/2));
  const inZone=marker>=zoneStart&&marker<=zoneStart+zoneWidth;
  let quality;
  if(inZone && dist<zoneWidth*0.18){quality=1;SFX.success();}
  else if(inZone){quality=0.7;SFX.point();}
  else {quality=0.25;SFX.error();}
  results.push(quality);
  stageIndex++;
  speed=Math.min(0.022,speed+0.002);
  zoneWidth=Math.max(0.1,zoneWidth-0.02);
  if(stageIndex>=STAGES.length){
    phase='launching';
    btn.disabled=true;
    const avg=results.reduce((a,b)=>a+b,0)/results.length;
    finalScore=Math.round(avg*1000);
    altitude=Math.round(avg*12000+Math.random()*300);
    launched=true;
    SFX.levelup();
    flameOn=true;
  }else{
    marker=0;markerDir=1;
    setZone();
    btn.textContent=STAGES[stageIndex].label;
  }
}

btn.addEventListener('click',()=>{
  if(phase==='done'){reset();return;}
  pressStage();
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(phase==='done'){reset();return;}
    if(phase==='playing')pressStage();
  }
});

function drawBar(){
  const bx=100,by=320,bw=600,bh=28;
  ctx.fillStyle='#263238';
  ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#43a047';
  ctx.fillRect(bx+zoneStart*bw,by,zoneWidth*bw,bh);
  const mx=bx+marker*bw;
  ctx.fillStyle='#fff';
  ctx.fillRect(mx-3,by-6,6,bh+12);
  ctx.strokeStyle='#90a4ae';ctx.lineWidth=2;
  ctx.strokeRect(bx,by,bw,bh);
}

function drawRocket(y,flame){
  ctx.save();
  ctx.translate(400,y);
  ctx.fillStyle='#eceff1';
  ctx.beginPath();
  ctx.moveTo(0,-40);
  ctx.lineTo(16,10);
  ctx.lineTo(-16,10);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.beginPath();ctx.moveTo(-16,10);ctx.lineTo(-26,26);ctx.lineTo(-14,18);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(16,10);ctx.lineTo(26,26);ctx.lineTo(14,18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.arc(0,-16,7,0,Math.PI*2);ctx.fill();
  if(flame){
    const flen=14+Math.random()*18;
    const grad=ctx.createLinearGradient(0,10,0,10+flen);
    grad.addColorStop(0,'#fff59d');grad.addColorStop(0.5,'#ff9800');grad.addColorStop(1,'#ff704300');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(-10,10);ctx.lineTo(10,10);ctx.lineTo(0,10+flen);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#000051');sky.addColorStop(1,'#1a237e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect((i*67)%W,(i*131)%(H-60),1,1);
  }
  ctx.fillStyle='#212121';ctx.fillRect(0,H-30,W,30);

  if(phase==='playing'){
    marker+=speed*markerDir*dt;
    if(marker>1){marker=1;markerDir=-1;}
    if(marker<0){marker=0;markerDir=1;}
    drawRocket(rocketY,false);
    drawBar();
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('rl_stage_label','Stage {n}/{t}: {s}')
      .replace('{n}',stageIndex+1).replace('{t}',STAGES.length).replace('{s}',STAGES[stageIndex].label),W/2,60);
  } else if(phase==='launching'){
    rocketVy+=0.15*dt;
    if(rocketVy>10)rocketVy=10;
    rocketY-=rocketVy*dt;
    flameTimer+=dt;
    drawRocket(rocketY,true);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('rl_launching','Launching...'),W/2,60);
    if(rocketY<-60){
      phase='done';
      if(altitude>bestAlt){bestAlt=altitude;localStorage.setItem('rocketlaunch_bestalt',bestAlt);}
      if(finalScore>bestScore){bestScore=finalScore;localStorage.setItem('rocketlaunch_bestscore',bestScore);}
      SFX.win();
      btn.disabled=false;
      btn.textContent=I18N.t('rl_again','LAUNCH AGAIN');
    }
  } else if(phase==='done'){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('rl_result_title','Launch Complete!'),W/2,110);
    ctx.font='24px Arial';
    ctx.fillText(I18N.t('rl_altitude_label','Altitude: {a}m').replace('{a}',altitude),W/2,160);
    ctx.fillText(I18N.t('rl_score_label2','Score: {s}').replace('{s}',finalScore),W/2,196);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('rl_restart_hint','Click LAUNCH AGAIN or press Space'),W/2,240);
  }

  updateDisplay();
  requestAnimationFrame(loop);
}

function updateDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('rl_score_label','Best Altitude: {a}m | Best Score: {s}')
      .replace('{a}',bestAlt).replace('{s}',bestScore);
}

reset();
updateDisplay();
requestAnimationFrame(loop);
</script></body></html>
