<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b2b33;display:block;border-radius:8px}
#score-display{color:#cbb994;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Stonemason</div>
  <div class="game-frame">
    <div id="score-display">Statues: 0 | Best: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or <b>Tap</b> (or press <b>Space</b>) when the sweeping marker is inside the green zone to chisel the statue. Bad timing chips the wrong spot and drains your <b>Integrity</b> meter — hit zero and the stone cracks!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let statues=0,best=parseInt(localStorage.getItem('stonemason_best')||'0',10);
let integrity=100,precision=0,gameOver=false,started=false;

// The target silhouette: list of blocks (grid cells) that make up a simple statue shape.
const GRID_COLS=14,GRID_ROWS=14;
const CELL=18;
const gridX=W/2-GRID_COLS*CELL/2, gridY=60;

function buildSilhouette(){
  // simple humanoid statue silhouette on a 14x14 grid
  const shape=new Set();
  const add=(x,y)=>shape.add(x+','+y);
  // head
  for(let x=5;x<=8;x++)for(let y=0;y<=2;y++)add(x,y);
  // torso
  for(let x=4;x<=9;x++)for(let y=3;y<=7;y++)add(x,y);
  // arms
  for(let y=3;y<=6;y++){add(2,y);add(3,y);add(10,y);add(11,y);}
  // legs
  for(let x=4;x<=6;x++)for(let y=8;y<=12;y++)add(x,y);
  for(let x=7;x<=9;x++)for(let y=8;y<=12;y++)add(x,y);
  // base
  for(let x=2;x<=11;x++)add(x,13);
  return shape;
}
let silhouette,carved,remaining;

function newStatue(){
  silhouette=buildSilhouette();
  carved=new Set();
  remaining=Array.from(silhouette);
  integrity=100;
}

// Sweeping marker
let markerPos=0,markerDir=1,markerSpeed=0.016;
let goodZoneCenter=0.5,goodZoneWidth=0.14;

function newZone(){
  goodZoneCenter=0.15+Math.random()*0.7;
  goodZoneWidth=Math.max(0.06,0.16-statues*0.006);
}

function reset(){
  statues=0;gameOver=false;started=false;precision=0;
  newStatue();
  markerPos=0;markerDir=1;markerSpeed=0.016;
  newZone();
}
reset();

function strike(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const dist=Math.abs(markerPos-goodZoneCenter);
  if(dist<=goodZoneWidth/2){
    // good hit - carve a piece
    if(remaining.length>0){
      const idx=Math.floor(Math.random()*remaining.length);
      const cell=remaining[idx];
      carved.add(cell);
      remaining.splice(idx,1);
      precision+=Math.max(1,Math.round((1-dist/(goodZoneWidth/2))*10));
      SFX.hit();
    }
    if(remaining.length===0){
      statues++;
      if(statues>best){best=statues;localStorage.setItem('stonemason_best',String(best));}
      SFX.success();
      newStatue();
    }
    newZone();
    markerSpeed=Math.min(0.045,markerSpeed+0.001);
  } else {
    // bad hit - chip a random unrelated area, damage integrity
    const dmg=10+Math.round(dist*40);
    integrity-=dmg;
    SFX.error();
    if(integrity<=0){
      integrity=0;
      gameOver=true;
      SFX.lose();
    } else {
      newZone();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();strike();}});
c.addEventListener('click',strike);
c.addEventListener('touchstart',e=>{e.preventDefault();strike();},{passive:false});

function drawSilhouetteBlocks(){
  ctx.save();
  for(const key of silhouette){
    const [x,y]=key.split(',').map(Number);
    ctx.fillStyle=carved.has(key)?'#cbb994':'#3a3a44';
    ctx.fillRect(gridX+x*CELL,gridY+y*CELL,CELL-1,CELL-1);
  }
  ctx.restore();
}

function drawBar(){
  const barY=H-70,barX=60,barW=W-120,barH=18;
  ctx.fillStyle='#1a1a22';
  ctx.fillRect(barX,barY,barW,barH);
  // good zone
  const zoneX=barX+(goodZoneCenter-goodZoneWidth/2)*barW;
  const zoneW=goodZoneWidth*barW;
  ctx.fillStyle='#6fbf73';
  ctx.fillRect(zoneX,barY,zoneW,barH);
  // marker
  const mx=barX+markerPos*barW;
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(mx-3,barY-8,6,barH+16);
}

function drawIntegrity(){
  const barX=60,barY=H-30,barW=W-120,barH=14;
  ctx.fillStyle='#1a1a22';
  ctx.fillRect(barX,barY,barW,barH);
  const pct=integrity/100;
  ctx.fillStyle=pct>0.5?'#6fbf73':pct>0.25?'#ffb74d':'#e94560';
  ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle='#555';ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('integrity_label','Integrity'),barX,barY-4);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1b1b22');bg.addColorStop(1,'#33333d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawSilhouetteBlocks();

  if(!started){
    ctx.fillStyle='#cbb994cc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_stone','Click / Tap / Space to start'),W/2,H/2);
    drawBar();drawIntegrity();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    document.getElementById('score-display').textContent=I18N.t('statues_best_label','Statues: {s} | Best: {b}').replace('{s}',statues).replace('{b}',best);
    drawIntegrity();
    requestAnimationFrame(loop);
    return;
  }

  markerPos+=markerSpeed*markerDir;
  if(markerPos>=1){markerPos=1;markerDir=-1;}
  if(markerPos<=0){markerPos=0;markerDir=1;}

  drawBar();
  drawIntegrity();

  document.getElementById('score-display').textContent=I18N.t('statues_best_precision_label','Statues: {s} | Best: {b} | Precision: {p}').replace('{s}',statues).replace('{b}',best).replace('{p}',precision);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
