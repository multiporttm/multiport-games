<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#81d4fa,#e1f5fe);display:block;border-radius:8px;touch-action:none}
#score-display{color:#01579b;background:#e1f5fe;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
#touch-controls{display:flex;justify-content:center;gap:10px;margin-top:8px}
#touch-controls button{padding:12px 22px;font-size:1.1rem;font-weight:700;border:none;border-radius:10px;background:#0288d1;color:#fff;cursor:pointer}
#touch-controls button.boost{background:#ff7043}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Penguin Waddle</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="280"></canvas>
    <div id="touch-controls">
      <button id="btnL">◀ Left</button>
      <button id="btnSlide" class="boost">Slide</button>
      <button id="btnR">Right ▶</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b> and <b>Right Arrow</b> (or tap the buttons) to waddle forward. Press <b>Space</b> or tap <b>Slide</b> to belly-slide for a speed boost on smooth ice — but sliding on a rough patch spins you out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280;
const TRACK_LEN=2800;
let hiTime=parseFloat(localStorage.getItem('penguinwaddle_hi')||'0')||null;
let wins=parseInt(localStorage.getItem('penguinwaddle_wins')||'0',10);

let racers,lastKey,started,finished,raceTime,spinTimer,camX,lastTime,patches;

function makePatches(){
  const arr=[];
  let x=300;
  while(x<TRACK_LEN-200){
    arr.push({x,w:120+Math.random()*80,smooth:Math.random()<0.6});
    x+=200+Math.random()*180;
  }
  return arr;
}

function patchAt(x){
  return patches.find(p=>x>=p.x&&x<=p.x+p.w);
}

function makeRacers(){
  return [
    {x:0,color:'#212121',isPlayer:true,waddlePhase:0,slideTimer:0,finishTime:null},
    {x:0,color:'#5d4037',isPlayer:false,aiRhythm:36+Math.random()*14,aiTimer:0,waddlePhase:0,slideTimer:0,finishTime:null},
    {x:0,color:'#37474f',isPlayer:false,aiRhythm:32+Math.random()*18,aiTimer:0,waddlePhase:0,slideTimer:0,finishTime:null},
  ];
}

function reset(){
  patches=makePatches();
  racers=makeRacers();
  lastKey=null;started=false;finished=false;raceTime=0;spinTimer=0;camX=0;lastTime=null;
}
reset();

function waddle(side){
  if(finished){reset();return;}
  if(!started){started=true;lastTime=null;}
  const p=racers[0];
  if(spinTimer>0||p.slideTimer>0)return;
  if(side===lastKey){
    spinTimer=35;lastKey=null;SFX.error();return;
  }
  lastKey=side;
  p.x+=36+Math.random()*6;
  p.waddlePhase=1;
  SFX.jump();
}

function slide(){
  if(finished||!started)return;
  const p=racers[0];
  if(spinTimer>0||p.slideTimer>0)return;
  const patch=patchAt(p.x);
  if(patch&&patch.smooth){
    p.slideTimer=45;
    SFX.powerup();
  }else{
    spinTimer=50;
    SFX.error();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();waddle('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();waddle('R');}
  else if(e.code==='Space'){e.preventDefault();slide();}
});
document.getElementById('btnL').addEventListener('touchstart',e=>{e.preventDefault();waddle('L');},{passive:false});
document.getElementById('btnR').addEventListener('touchstart',e=>{e.preventDefault();waddle('R');},{passive:false});
document.getElementById('btnSlide').addEventListener('touchstart',e=>{e.preventDefault();slide();},{passive:false});
document.getElementById('btnL').addEventListener('click',()=>waddle('L'));
document.getElementById('btnR').addEventListener('click',()=>waddle('R'));
document.getElementById('btnSlide').addEventListener('click',()=>slide());

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('pw_score_label','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',hiTime?hiTime.toFixed(1)+'s':'--');
}

function drawPenguin(r,laneY,label){
  const sx=r.x-camX+80;
  if(sx<-40||sx>W+40)return;
  const bob=r.waddlePhase>0?Math.sin(r.waddlePhase*Math.PI)*10:0;
  const sliding=r.slideTimer>0;
  ctx.save();
  if(sliding){
    ctx.fillStyle=r.color;
    ctx.beginPath();ctx.ellipse(sx,laneY-4,22,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(sx+4,laneY-4,12,6,0,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle=r.color;
    ctx.beginPath();ctx.ellipse(sx,laneY-14-bob,14,20,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(sx,laneY-10-bob,8,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff9800';
    ctx.beginPath();ctx.moveTo(sx-4,laneY-28-bob);ctx.lineTo(sx+4,laneY-28-bob);ctx.lineTo(sx,laneY-22-bob);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle='#01579b';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(label,sx,laneY-40);
}

function drawTrack(){
  ctx.fillStyle='#e1f5fe';ctx.fillRect(0,80,W,180);
  patches.forEach(p=>{
    const sx=p.x-camX+80;
    if(sx+p.w<0||sx>W)return;
    ctx.fillStyle=p.smooth?'#b3e5fc':'#cfd8dc';
    ctx.fillRect(sx,80,p.w,180);
    if(!p.smooth){
      ctx.fillStyle='#90a4ae';
      for(let i=0;i<p.w;i+=14)ctx.fillRect(sx+i,80,3,180);
    }
  });
  for(let i=1;i<3;i++){
    ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(0,80+i*60);ctx.lineTo(W,80+i*60);ctx.stroke();
  }
  ctx.setLineDash([]);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#81d4fa');grad.addColorStop(1,'#e1f5fe');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  drawTrack();

  if(!started){
    racers.forEach((r,i)=>drawPenguin(r,80+i*60+40,i===0?I18N.t('pw_you_label','YOU'):'CPU'));
    ctx.fillStyle='#01579b';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pw_start_hint','Alternate L/R to start!'),W/2,40);
    requestAnimationFrame(loop);return;
  }

  if(finished){
    racers.forEach((r,i)=>drawPenguin(r,80+i*60+40,i===0?I18N.t('pw_you_label','YOU'):'CPU'));
    ctx.fillStyle='#01579b';ctx.font='bold 30px Arial';ctx.textAlign='center';
    const won=racers[0].finishTime!==null&&racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    ctx.fillText(won?I18N.t('pw_win','YOU WIN!'):I18N.t('pw_lose','YOU LOSE'),W/2,40);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,66);
    requestAnimationFrame(loop);return;
  }

  raceTime+=dt/60;

  if(spinTimer>0)spinTimer-=dt;
  const p=racers[0];
  if(p.slideTimer>0){
    p.slideTimer-=dt;
    const patch=patchAt(p.x);
    if(!(patch&&patch.smooth)){
      // slid off smooth patch onto rough - spin out
      p.slideTimer=0;spinTimer=50;SFX.error();
    }else{
      p.x+=3.4*dt;
    }
  }

  // AI
  racers.forEach((r,i)=>{
    if(i===0)return;
    if(r.slideTimer>0){
      r.slideTimer-=dt;
      const patch=patchAt(r.x);
      if(patch&&patch.smooth)r.x+=3.2*dt;
      else r.slideTimer=0;
      return;
    }
    r.aiTimer+=dt;
    if(r.aiTimer>=r.aiRhythm){
      r.aiTimer=0;
      r.x+=34+Math.random()*8;
      r.waddlePhase=1;
      const patch=patchAt(r.x);
      if(patch&&patch.smooth&&Math.random()<0.3)r.slideTimer=40;
      if(Math.random()<0.07)r.aiTimer=-20;
    }
  });

  racers.forEach(r=>{
    if(r.waddlePhase>0){r.waddlePhase-=0.06*dt;if(r.waddlePhase<0)r.waddlePhase=0;}
    if(r.finishTime===null&&r.x>=TRACK_LEN){r.finishTime=raceTime;}
  });

  camX=Math.max(0,racers[0].x-200);

  const finishSx=TRACK_LEN-camX+80;
  if(finishSx>-20&&finishSx<W+20){
    for(let i=0;i<180;i+=20){
      ctx.fillStyle=((i/20)%2===0)?'#222':'#fff';
      ctx.fillRect(finishSx,80+i,10,20);
    }
  }

  racers.forEach((r,i)=>drawPenguin(r,80+i*60+40,i===0?I18N.t('pw_you_label','YOU'):'CPU'));

  if(spinTimer>0){
    ctx.fillStyle='rgba(255,0,0,0.6)';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pw_spinout','SPIN OUT!'),W/2,110);
  }

  if(racers[0].finishTime!==null&&!finished){
    finished=true;
    const won=racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    if(won){
      wins++;
      localStorage.setItem('penguinwaddle_wins',wins);
      if(hiTime===null||raceTime<hiTime){
        hiTime=raceTime;
        localStorage.setItem('penguinwaddle_hi',hiTime);
      }
      SFX.win();
    }else{
      SFX.lose();
    }
  } else if(!finished && racers.some((r,i)=>i>0&&r.finishTime!==null)){
    finished=true;SFX.lose();
  }

  ctx.fillStyle='#01579b';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('pw_time_label','Time: {t}s').replace('{t}',raceTime.toFixed(1)),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('pw_progress_label','{p}%').replace('{p}',Math.min(100,Math.floor(racers[0].x/TRACK_LEN*100))),W-10,20);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
