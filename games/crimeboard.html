<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Crime Board</title><meta name="description" content="Play Crime Board free online — Click a clue, then click the suspect it points to, and string them together to solve the case before time runs out."><link rel="canonical" href="https://games.multiportllc.com/games/crimeboard"><meta property="og:title" content="Crime Board - Multiport Games"><meta property="og:description" content="Play Crime Board free online — Click a clue, then click the suspect it points to, and string them together to solve the case before time runs out."><meta property="og:url" content="https://games.multiportllc.com/games/crimeboard"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Crime Board","description":"Play Crime Board free online instantly. Click a clue, then click the suspect it points to, and string them together to solve the case before time runs out. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/crimeboard","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#4e342e,#a1887f);border-radius:14px;padding:16px}
#hud{display:flex;justify-content:space-between;color:#3e2723;font-weight:800;font-size:1.05rem;margin-bottom:8px;background:rgba(255,255,255,.5);border-radius:8px;padding:4px 10px}
#board{position:relative;background:#6d4c41;border-radius:10px;padding:14px;min-height:420px;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 40px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 40px)}
#lines{position:absolute;inset:0;pointer-events:none}
.cols{display:flex;justify-content:space-between;gap:16px;position:relative;z-index:1}
.col{flex:1;display:flex;flex-direction:column;gap:12px}
.col-label{color:#fff;font-weight:900;text-align:center;font-size:.9rem;letter-spacing:1px;margin-bottom:2px}
.card{background:#fdf6e3;border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.35);transform:rotate(-1deg);transition:transform .1s,box-shadow .1s;position:relative}
.card:nth-child(odd){transform:rotate(1deg)}
.card:hover{transform:scale(1.05) rotate(0deg)}
.card.selected{outline:3px solid #ffd54f;transform:scale(1.08) rotate(0deg)}
.card.solved{outline:3px solid #4caf50;opacity:.55;cursor:default}
.card.wrong{outline:3px solid #e53935}
.card-icon{font-size:1.8rem}
.card-text{font-size:.72rem;color:#3e2723;font-weight:700;margin-top:2px}
.pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:1rem}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;text-align:center;padding:20px}
#overlay button{margin-top:14px;padding:10px 24px;background:#4e342e;border:none;border-radius:20px;color:#fff;font-size:1rem;cursor:pointer}
.frame-wrap{position:relative}
#timerbar-bg{height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;margin-bottom:10px}
#timerbar{height:100%;background:#4caf50;transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Crime Board</div>
  <div class="game-frame" style="padding:14px">
    <div class="frame-wrap">
      <div id="table">
        <div id="hud"><span id="score-display">Cases: 0 | Hi: 0</span><span id="lives-display">Lives: 3</span></div>
        <div id="timerbar-bg"><div id="timerbar" style="width:100%"></div></div>
        <div id="board">
          <svg id="lines"></svg>
          <div class="cols">
            <div class="col"><div class="col-label">CLUES</div><div id="clues"></div></div>
            <div class="col"><div class="col-label">SUSPECTS</div><div id="suspects"></div></div>
          </div>
        </div>
      </div>
      <div id="overlay" style="display:none">
        <div id="overlay-title" style="font-size:1.6rem;font-weight:900">CASE CLOSED</div>
        <div id="overlay-sub" style="margin-top:8px"></div>
        <button id="overlay-btn">New Investigation</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click a <b>clue</b>, then click the <b>suspect</b> it points to, to string them together. Match every clue to the right suspect before time runs out — a wrong match costs a life!</div>
</div>
<script>
const SUSPECT_POOL=[
  {name:'Mr. Reed',emoji:'🕴️',traits:['drives a red car','has muddy boots','smokes cigars','wears glasses','left-handed','collects stamps']},
  {name:'Ms. Vale',emoji:'👩‍💼',traits:['owns a black umbrella','wears red lipstick','has a cat','plays piano','right-handed','allergic to peanuts']},
  {name:'Chef Marco',emoji:'👨‍🍳',traits:['smells of garlic','carries a chef knife','has a burn scar','wears an apron','tall with a beard','owns a food truck']},
  {name:'Dr. Kane',emoji:'🥼',traits:['carries a stethoscope','has shaky hands','wears a lab coat','drives a white van','left-handed','collects rare coins']},
  {name:'Old Pete',emoji:'🧓',traits:['walks with a cane','smells of pipe tobacco','has a torn jacket','wears a wool hat','deaf in one ear','feeds pigeons daily']},
  {name:'Ruby',emoji:'💃',traits:['wears gold earrings','has a tattoo of a rose','carries a switchblade','drives a motorcycle','bites her nails','collects vinyl records']}
];
const CLUE_TEMPLATES={
  'drives a red car':{icon:'🚗',text:'Red car seen fleeing'},
  'has muddy boots':{icon:'👢',text:'Muddy footprints found'},
  'smokes cigars':{icon:'🚬',text:'Cigar ash on the floor'},
  'wears glasses':{icon:'👓',text:'Glasses lens fragment'},
  'left-handed':{icon:'✍️',text:'Note written left-handed'},
  'collects stamps':{icon:'📮',text:'Rare stamp left behind'},
  'owns a black umbrella':{icon:'☂️',text:'Black umbrella forgotten'},
  'wears red lipstick':{icon:'💄',text:'Lipstick mark on a cup'},
  'has a cat':{icon:'🐈',text:'Cat hair on the couch'},
  'plays piano':{icon:'🎹',text:'Sheet music nearby'},
  'right-handed':{icon:'✋',text:'Note written right-handed'},
  'allergic to peanuts':{icon:'🥜',text:'Epi-pen found at scene'},
  'smells of garlic':{icon:'🧄',text:'Garlic smell lingered'},
  'carries a chef knife':{icon:'🔪',text:'Knife wound, precise cut'},
  'has a burn scar':{icon:'🔥',text:'Burn mark on the door'},
  'wears an apron':{icon:'🧑‍🍳',text:'Apron string caught on nail'},
  'tall with a beard':{icon:'🧔',text:'Witness saw a tall bearded man'},
  'owns a food truck':{icon:'🚚',text:'Food truck receipt found'},
  'carries a stethoscope':{icon:'🩺',text:'Stethoscope left on desk'},
  'has shaky hands':{icon:'🤲',text:'Shaky handwriting on note'},
  'wears a lab coat':{icon:'🥼',text:'White coat fiber found'},
  'drives a white van':{icon:'🚐',text:'White van on camera'},
  'collects rare coins':{icon:'🪙',text:'Rare coin dropped at scene'},
  'walks with a cane':{icon:'🦯',text:'Cane mark in the mud'},
  'smells of pipe tobacco':{icon:'🎯',text:'Pipe tobacco smell noted'},
  'has a torn jacket':{icon:'🧥',text:'Torn jacket thread found'},
  'wears a wool hat':{icon:'🧢',text:'Wool fiber on the fence'},
  'deaf in one ear':{icon:'👂',text:'Witness had to repeat twice'},
  'feeds pigeons daily':{icon:'🐦',text:'Birdseed trail leads away'},
  'wears gold earrings':{icon:'💍',text:'Gold earring found nearby'},
  'has a tattoo of a rose':{icon:'🌹',text:'Rose tattoo glimpsed'},
  'carries a switchblade':{icon:'🔪',text:'Switchblade cut on rope'},
  'drives a motorcycle':{icon:'🏍️',text:'Motorcycle tire tracks'},
  'bites her nails':{icon:'💅',text:'Bitten nail fragment found'},
  'collects vinyl records':{icon:'💿',text:'Vinyl record left behind'}
};

let cases=0,hi=+(localStorage.getItem('crimeboard_hi')||0),lives=3,gameOver=false,level=1;
let round=null,selectedClue=null,timeLeft=0,maxTime=0,tickInterval=null,solvedCount=0,roundTotal=0;

const scoreEl=document.getElementById('score-display');
const livesEl=document.getElementById('lives-display');
const cluesEl=document.getElementById('clues');
const suspectsEl=document.getElementById('suspects');
const linesSvg=document.getElementById('lines');
const board=document.getElementById('board');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlay-title');
const overlaySub=document.getElementById('overlay-sub');
const overlayBtn=document.getElementById('overlay-btn');

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function updateHud(){
  scoreEl.textContent=I18N.t('cases_hi_label','Cases: {s} | Hi: {h}').replace('{s}',cases).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',Math.max(0,lives));
}

function genRound(){
  const n=Math.min(SUSPECT_POOL.length, 3+Math.floor(level/2));
  const suspects=shuffle(SUSPECT_POOL).slice(0,n);
  const pairs=suspects.map(s=>{
    const trait=s.traits[Math.floor(Math.random()*s.traits.length)];
    return {suspect:s,trait,clue:CLUE_TEMPLATES[trait]};
  });
  round={
    suspects,
    clues:shuffle(pairs),
    matched:new Set() // suspect names matched
  };
  solvedCount=0;
  roundTotal=n;
  selectedClue=null;
  renderBoard();
  maxTime=Math.max(12,22-level*0.8);
  timeLeft=maxTime;
}

function renderBoard(){
  cluesEl.innerHTML='';
  suspectsEl.innerHTML='';
  round.clues.forEach((pair,i)=>{
    const div=document.createElement('div');
    div.className='card clue-card';
    div.dataset.idx=i;
    if(round.matched.has(pair.suspect.name))div.classList.add('solved');
    div.innerHTML=`<div class="pin">📌</div><div class="card-icon">${pair.clue.icon}</div><div class="card-text">${pair.clue.text}</div>`;
    div.addEventListener('click',()=>selectClue(i,div));
    cluesEl.appendChild(div);
  });
  round.suspects.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='card suspect-card';
    div.dataset.name=s.name;
    if(round.matched.has(s.name))div.classList.add('solved');
    div.innerHTML=`<div class="pin">📌</div><div class="card-icon">${s.emoji}</div><div class="card-text">${s.name}</div>`;
    div.addEventListener('click',()=>selectSuspect(s,div));
    suspectsEl.appendChild(div);
  });
  drawLines();
}

function selectClue(i,el){
  if(gameOver)return;
  const pair=round.clues[i];
  if(round.matched.has(pair.suspect.name))return;
  document.querySelectorAll('.clue-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedClue=pair;
}

function selectSuspect(s,el){
  if(gameOver||!selectedClue)return;
  if(round.matched.has(s.name))return;
  const correct=selectedClue.suspect.name===s.name;
  if(correct){
    round.matched.add(s.name);
    solvedCount++;
    SFX.success();
    document.querySelectorAll('.clue-card').forEach(c=>c.classList.remove('selected'));
    selectedClue=null;
    renderBoard();
    if(solvedCount>=roundTotal){
      finishCase(true);
    }
  }else{
    el.classList.add('wrong');
    SFX.error();
    loseLife();
    setTimeout(()=>{ el.classList.remove('wrong'); },400);
    document.querySelectorAll('.clue-card').forEach(c=>c.classList.remove('selected'));
    selectedClue=null;
  }
}

function drawLines(){
  linesSvg.innerHTML='';
  const boardRect=board.getBoundingClientRect();
  round.matched.forEach(name=>{
    const clueDiv=Array.from(document.querySelectorAll('.clue-card')).find((d)=>round.clues[d.dataset.idx].suspect.name===name);
    const suspDiv=document.querySelector(`.suspect-card[data-name="${CSS.escape(name)}"]`);
    if(!clueDiv||!suspDiv)return;
    const r1=clueDiv.getBoundingClientRect(),r2=suspDiv.getBoundingClientRect();
    const x1=r1.right-boardRect.left,y1=r1.top+r1.height/2-boardRect.top;
    const x2=r2.left-boardRect.left,y2=r2.top+r2.height/2-boardRect.top;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke','#e53935');
    line.setAttribute('stroke-width','2');
    linesSvg.appendChild(line);
  });
}

function finishCase(success){
  if(success){
    cases++;
    if(cases>hi){hi=cases;localStorage.setItem('crimeboard_hi',hi);}
    level++;
    updateHud();
  }
  setTimeout(()=>{ if(!gameOver)genRound(); },500);
}

function loseLife(){
  lives--;
  updateHud();
  if(lives<=0)endGame();
}

function endGame(){
  gameOver=true;
  clearInterval(tickInterval);
  SFX.lose();
  overlayTitle.textContent=I18N.t('case_closed_title','CASE CLOSED');
  overlaySub.textContent=I18N.t('final_cases_label','You solved {s} cases! High score: {h}').replace('{s}',cases).replace('{h}',hi);
  overlayBtn.textContent=I18N.t('new_investigation','New Investigation');
  overlay.style.display='flex';
}

function tick(){
  if(gameOver)return;
  timeLeft-=0.1;
  const pct=Math.max(0,timeLeft/maxTime*100);
  const bar=document.getElementById('timerbar');
  bar.style.width=pct+'%';
  bar.style.background=pct<30?'#e94560':(pct<60?'#ffb300':'#4caf50');
  if(timeLeft<=0){
    SFX.error();
    loseLife();
    if(!gameOver)finishCase(false);
  }
}

window.addEventListener('resize',()=>{ if(round)drawLines(); });

function startGame(){
  cases=0;lives=3;gameOver=false;level=1;
  overlay.style.display='none';
  updateHud();
  genRound();
  clearInterval(tickInterval);
  tickInterval=setInterval(tick,100);
}

overlayBtn.addEventListener('click',startGame);
startGame();
</script></body></html>
