<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d0d17;cursor:pointer}
#ui{color:#ffe0b2;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Campfire Cooking</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Roasted: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Your marshmallow slowly toasts as it sits over the fire. Tap when the roast meter is in the golden zone to pull it out for a perfect s'more! Too early is raw, too late is burnt — three bad roasts and the fire goes out.</div>
</div>
<script>
const W=360,H=360;
let roast,state,strikes,roasted,best,rate;

function loadBest(){return +(localStorage.getItem('campfirecooking_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('campfirecooking_best',v);}

const GOLDEN_LO=62,GOLDEN_HI=78;

function init(){
  roast=0;state='play';strikes=0;roasted=0;best=loadBest();
  rate=0.35;
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  let result;
  if(roast>=GOLDEN_LO&&roast<=GOLDEN_HI){
    result='perfect';roasted++;SFX.success();
  }else if(roast<GOLDEN_LO){
    result='raw';strikes++;SFX.fail();
  }else if(roast<=95){
    result='burnt';strikes++;SFX.hit();
  }else{
    result='ash';strikes+=2;SFX.hurt();
  }
  flashResult(result);
  saveBest(roasted);
  if(strikes>=3){
    state='over';SFX.lose();
  }else{
    roast=0;
    rate=Math.min(0.7,rate+0.02);
  }
  updateUI();
});

let flash=null,flashT=0;
function flashResult(r){flash=r;flashT=40;}

function update(){
  if(state!=='play')return;
  roast+=rate;
  if(roast>100){
    strikes+=2;
    SFX.hurt();
    flashResult('ash');
    if(strikes>=3){state='over';SFX.lose();}
    else{roast=0;}
    updateUI();
  }
  if(flashT>0)flashT--;
}

function draw(){
  ctx.fillStyle='#0d0d17';ctx.fillRect(0,0,W,H);

  ctx.font='60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🔥',W/2,H-70);

  const stickY=H-70-70+ (roast/100)*0 ;
  ctx.save();
  ctx.translate(W/2,H-160);
  ctx.font='22px Arial';
  ctx.fillText('🥢',0,0);
  let mmEmoji='⚪';
  if(roast>=GOLDEN_LO&&roast<=GOLDEN_HI)mmEmoji='🟤';
  else if(roast>95)mmEmoji='⬛';
  else if(roast>GOLDEN_HI)mmEmoji='🟫';
  ctx.font='30px Arial';
  ctx.fillText(mmEmoji,0,-26);
  ctx.restore();

  const barX=40,barY=40,barW=W-80,barH=22;
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='rgba(255,213,79,.5)';
  ctx.fillRect(barX+barW*(GOLDEN_LO/100),barY,barW*((GOLDEN_HI-GOLDEN_LO)/100),barH);
  ctx.fillStyle='#ff8a65';
  ctx.fillRect(barX,barY,barW*Math.min(1,roast/100),barH);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.strokeRect(barX,barY,barW,barH);

  ctx.fillStyle='#ffe0b2';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('strikes_label','Strikes: {n}/3').replace('{n}',strikes),W/2,barY+barH+18);

  if(flash&&flashT>0){
    const labels={perfect:[I18N.t('perfect_msg','PERFECT!'),'#a5d6a7'],raw:[I18N.t('too_raw_msg','TOO RAW!'),'#90caf9'],burnt:[I18N.t('burnt_msg','BURNT!'),'#ef9a9a'],ash:[I18N.t('burned_ash_msg','BURNED TO ASH!'),'#ef5350']};
    const [text,color]=labels[flash];
    ctx.fillStyle=color;ctx.font='bold 22px Arial';
    ctx.globalAlpha=Math.min(1,flashT/20);
    ctx.fillText(text,W/2,H/2+60);
    ctx.globalAlpha=1;
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe0b2';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('fire_went_out','FIRE WENT OUT!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('roasted_best_label','Roasted: {n} | Best: {b}').replace('{n}',roasted).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_cook_again','Tap to cook again'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Roasted: ${roasted} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
