<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0288d1}
#ui{color:#b3e5fc;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Water Slide Splash</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Left/Right arrows or A/D (or the D-pad) to steer between 3 lanes as you slide down. Hit ⭐ boost pads for a speed burst and dodge the 🪨 blockers — hitting one ends your run.</div>
</div>
<script>
const W=360,H=360,LANES=3,LANE_W=W/LANES;
let player,items,dist,speed,state,scrollOffset=0,boostT=0,spawnTimer;

function loadBest(){return +(localStorage.getItem('watersplash_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('watersplash_best',v);}

function init(){
  player={lane:1,x:LANE_W*1.5};
  items=[];dist=0;speed=3;state='play';spawnTimer=0;boostT=0;
}

function laneX(l){return LANE_W*l+LANE_W/2;}

function moveLane(dir){
  player.lane=Math.max(0,Math.min(LANES-1,player.lane+dir));
}

document.addEventListener('keydown',e=>{
  if(state==='over'){init();return;}
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')moveLane(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')moveLane(1);
});
document.querySelector('#dpad .left').addEventListener('click',()=>{if(state==='over')init();else moveLane(-1);});
document.querySelector('#dpad .right').addEventListener('click',()=>{if(state==='over')init();else moveLane(1);});

function spawnItem(){
  const lane=Math.floor(Math.random()*LANES);
  const type=Math.random()<0.28?'boost':'rock';
  items.push({lane,type,y:-40});
}

function update(){
  if(state!=='play')return;
  const boosted=boostT>0;
  if(boosted)boostT--;
  speed=(boosted?6.5:3)+dist*0.0015;
  dist+=speed*0.08;
  scrollOffset=(scrollOffset+speed)%40;
  player.x+=(laneX(player.lane)-player.x)*0.3;

  spawnTimer--;
  if(spawnTimer<=0){
    spawnItem();
    spawnTimer=Math.max(16,36-dist*0.02);
  }

  items.forEach(it=>it.y+=speed);
  items=items.filter(it=>it.y<H+40);

  items.forEach(it=>{
    if(it.lane===player.lane&&it.y>H-70&&it.y<H-20&&!it.hit){
      it.hit=true;
      if(it.type==='boost'){boostT=60;SFX.powerup();}
      else{state='over';SFX.lose();saveBest(Math.floor(dist));}
    }
  });
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#0288d1';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.3)';
  for(let l=1;l<LANES;l++){
    for(let y=-40;y<H;y+=40){
      ctx.fillRect(l*LANE_W-2,y+scrollOffset,4,20);
    }
  }

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  items.forEach(it=>{
    if(it.hit&&it.type==='rock')return;
    ctx.fillText(it.type==='boost'?'⭐':'🪨',laneX(it.lane),it.y);
  });
  ctx.fillText(boostT>0?'💦':'🏄',player.x,H-45);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#b3e5fc';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('splash','SPLASH!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('distance_best_m_label','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('press_lane_retry','Press a lane key to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`;
}

init();draw();
</script></body></html>
