<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4fc3f7;cursor:pointer}
#ui{color:#fff3e0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sandcastle Builder</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">A marker slides left and right across the block below — tap when it's centered to stack a well-placed layer. Miss the center too far and the layer wobbles; three wobbly layers and the tide washes your castle away!</div>
</div>
<script>
const W=360,H=360,BASE_Y=320,LAYER_H=18;
let layers,markerX,dir,wobbles,state,best;

function loadBest(){return +(localStorage.getItem('sandcastlebuilder_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('sandcastlebuilder_best',v);}

function init(){
  layers=[{w:120,off:0}];wobbles=0;state='play';best=loadBest();
  markerX=0;dir=1;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  const lastW=layers[layers.length-1].w;
  const target=lastW/2;
  const diff=Math.abs(markerX-target);
  let newW=lastW,off=markerX-target;
  if(diff<8){
    SFX.success();
  }else if(diff<24){
    newW=Math.max(30,lastW-diff*0.6);
    wobbles++;
    SFX.point();
  }else{
    wobbles+=2;
    newW=Math.max(20,lastW-diff*0.9);
    SFX.fail();
  }
  layers.push({w:newW,off});
  saveBest(layers.length-1);
  if(wobbles>=3||newW<18){
    state='over';
    SFX.lose();
    saveBest(layers.length-1);
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  const lastW=layers[layers.length-1].w;
  markerX+=dir*(2+layers.length*0.05);
  if(markerX>lastW||markerX<0)dir*=-1;
}

function draw(){
  ctx.fillStyle='#4fc3f7';ctx.fillRect(0,0,W,H*0.6);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(0,H*0.6,W,H*0.4);

  let cx=W/2,cy=BASE_Y;
  layers.forEach((l,i)=>{
    cx+=l.off*0.3;
    ctx.fillStyle=i%2===0?'#ffb74d':'#ffa726';
    ctx.fillRect(cx-l.w/2,cy-LAYER_H,l.w,LAYER_H);
    ctx.strokeStyle='rgba(0,0,0,.15)';
    ctx.strokeRect(cx-l.w/2,cy-LAYER_H,l.w,LAYER_H);
    cy-=LAYER_H;
  });

  if(state==='play'){
    const lastW=layers[layers.length-1].w;
    const barY=cy-30;
    ctx.fillStyle='rgba(0,0,0,.15)';
    ctx.fillRect(cx-lastW/2,barY,lastW,10);
    ctx.fillStyle='#e91e63';
    ctx.fillRect(cx-lastW/2+markerX-2,barY-4,4,18);
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff3e0';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('washed_away','WASHED AWAY!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('height_best_label','Height: {n} | Best: {b}').replace('{n}',layers.length-1).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_build_again','Tap to build again'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Height: ${layers.length-1} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
