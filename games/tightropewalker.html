<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4a148c}
#ui{color:#e1bee7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,80px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:56px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Tightrope Walker</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0% | Best: 0%</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️ <span data-i18n="lean">Lean</span></button>
      <button class="right"><span data-i18n="lean">Lean</span> ➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold Left/Right (or the buttons) to lean against sudden wind gusts and keep your balance meter centered. Progress steadily across the rope — fall off and it's game over!</div>
</div>
<script>
const W=360,H=360;
let balance,wind,progress,best,state,keys={};

function loadBest(){return +(localStorage.getItem('tightropewalker_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('tightropewalker_best',v);}

function init(){best=loadBest();state='play';balance=0;wind=0;progress=0;}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(state==='over'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))init();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const leftBtn=document.querySelector('#dpad .left'),rightBtn=document.querySelector('#dpad .right');
leftBtn.addEventListener('mousedown',()=>{if(state==='over')init();else keys['arrowleft']=true;});
leftBtn.addEventListener('mouseup',()=>keys['arrowleft']=false);
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();if(state==='over')init();else keys['arrowleft']=true;},{passive:false});
leftBtn.addEventListener('touchend',e=>{e.preventDefault();keys['arrowleft']=false;},{passive:false});
rightBtn.addEventListener('mousedown',()=>{if(state==='over')init();else keys['arrowright']=true;});
rightBtn.addEventListener('mouseup',()=>keys['arrowright']=false);
rightBtn.addEventListener('touchstart',e=>{e.preventDefault();if(state==='over')init();else keys['arrowright']=true;},{passive:false});
rightBtn.addEventListener('touchend',e=>{e.preventDefault();keys['arrowright']=false;},{passive:false});

function update(){
  if(state!=='play')return;
  if(Math.random()<0.02+progress*0.0003)wind+=(Math.random()-0.5)*4;
  wind*=0.95;
  balance+=wind*0.05;
  if(keys['arrowleft'])balance-=0.3;
  if(keys['arrowright'])balance+=0.3;
  balance*=0.96;

  if(Math.abs(balance)<3)progress+=0.15;

  if(Math.abs(balance)>=10){
    state='over';
    SFX.lose();
    saveBest(Math.floor(progress));
  }
  if(progress>=100){
    state='over';
    SFX.win();
    saveBest(100);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#4a148c';ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='#8d6e63';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(20,220);ctx.lineTo(W-20,220);ctx.stroke();

  const barW=W-60;
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(30,60,barW,16);
  ctx.fillStyle='#ce93d8';ctx.fillRect(30+barW/2-3,55,6,26);
  const markerX=30+barW/2+balance*barW/22;
  ctx.fillStyle='#ffca28';
  ctx.fillRect(Math.max(30,Math.min(30+barW-6,markerX-3)),55,6,26);

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  const px=20+progress*(W-40)/100;
  ctx.save();
  ctx.translate(px,200);
  ctx.rotate(balance*0.03);
  ctx.fillText('🤸',0,0);
  ctx.restore();

  ctx.fillStyle='#e1bee7';ctx.font='13px Arial';
  ctx.fillText(I18N.t('wind_label','Wind: {d}').replace('{d}',wind>0?'→':wind<0?'←':'–'),W/2,260);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1bee7';ctx.font='bold 26px Arial';
    ctx.fillText(progress>=100?I18N.t('crossed','CROSSED!'):I18N.t('fell_off','FELL OFF!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('distance_best_label','Distance: {n}% | Best: {b}%').replace('{n}',Math.floor(progress)).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_lean_retry','Tap Lean to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(progress)}% | Best: ${loadBest()}%`;
}

init();draw();
</script></body></html>
