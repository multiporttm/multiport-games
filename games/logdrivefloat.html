<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Log Drive Float</title><meta name="description" content="Play Log Drive Float free online — Click a floating log then click the matching sorting bin on the riverbank before it floats past. River speeds up over time."><link rel="canonical" href="https://games.multiportllc.com/games/logdrivefloat"><meta property="og:title" content="Log Drive Float - Multiport Games"><meta property="og:description" content="Play Log Drive Float free online — Click a floating log then click the matching sorting bin on the riverbank before it floats past. River speeds up over time."><meta property="og:url" content="https://games.multiportllc.com/games/logdrivefloat"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Log Drive Float","description":"Play Log Drive Float free online instantly. Logs of different types and sizes float down a river in lanes — click a log, then click the matching sorting bin on the riverbank before it floats past the end of the screen. The river speeds up over time; eight missed or misrouted logs ends the run. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/logdrivefloat","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a6f5c;display:block;border-radius:8px;touch-action:none}
#score-display{color:#a5d6a7;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Log Drive Float</div>
  <div class="game-frame">
    <div id="score-display">Sorted: 0 | Misses: 0/8 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap a floating <b>log</b> to select it, then click/tap the <b>bin</b> on the riverbank with the matching label before it floats off screen. The river flows faster over time — 8 misses ends the run!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const TYPES=[
  {id:'pine',label:'Pine',color:'#8d6e63',ring:'#6d4c41'},
  {id:'oak',label:'Oak',color:'#a1887f',ring:'#795548'},
  {id:'birch',label:'Birch',color:'#e0d6c3',ring:'#bcaaa4'},
  {id:'big',label:'Big Log',color:'#5d4037',ring:'#3e2723'},
];
const LANES=4;
const laneY=[70,170,270,370];
const bankW=110;
let bins=[]; // {type, x,y,w,h}
let logs=[];
let sorted=0,misses=0,hi=0,gameOver=false,started=false;
let spawnTimer=0,spd=1.2,selected=null;
let lastTime=null;

hi=parseInt(localStorage.getItem('logdrivefloat_hi')||'0',10);

function layoutBins(){
  bins=[];
  const bw=bankW-10,bh=70;
  TYPES.forEach((t,i)=>{
    bins.push({type:t.id,label:t.label,color:t.color,x:W-bankW+5,y:20+i*(bh+8),w:bw,h:bh});
  });
}
layoutBins();

function reset(){
  logs=[];sorted=0;misses=0;gameOver=false;started=false;spawnTimer=0;spd=1.2;selected=null;lastTime=null;
}

function spawnLog(){
  const lane=Math.floor(Math.random()*LANES);
  const type=TYPES[Math.floor(Math.random()*TYPES.length)];
  const w=50+Math.random()*30;
  logs.push({x:-w,y:laneY[lane]-22,w,h:44,type,lane,sel:false,done:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawWater(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1c5445');grad.addColorStop(1,'#2a6f5c');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W-bankW,H);
  // ripple lines
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=2;
  const t=performance.now()/500;
  for(let i=0;i<10;i++){
    const y=(i*45+((t*20)%45))%H;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-bankW,y);ctx.stroke();
  }
}

function drawBank(){
  ctx.fillStyle='#4e342e';
  ctx.fillRect(W-bankW,0,bankW,H);
  bins.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=selected&&b.type===selected.type.id?'#ffeb3b':'#00000055';
    ctx.lineWidth=selected&&b.type===selected.type.id?4:2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+4);
  });
}

function drawLog(l){
  ctx.save();
  ctx.translate(l.x,l.y);
  ctx.fillStyle=l.type.color;
  ctx.fillRect(0,0,l.w,l.h);
  ctx.fillStyle=l.type.ring;
  ctx.beginPath();ctx.ellipse(2,l.h/2,6,l.h/2-4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(l.w-2,l.h/2,6,l.h/2-4,0,0,Math.PI*2);ctx.fill();
  // wood grain lines
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){
    ctx.beginPath();ctx.moveTo(10,6+i*(l.h-12)/2);ctx.lineTo(l.w-10,6+i*(l.h-12)/2);ctx.stroke();
  }
  if(l===selected){
    ctx.strokeStyle='#ffeb3b';ctx.lineWidth=3;
    ctx.strokeRect(-2,-2,l.w+4,l.h+4);
  }
  ctx.restore();
}

function scoreLabel(){
  return I18N.t('log_score_label','Sorted: {s} | Misses: {m}/8 | Hi: {h}')
    .replace('{s}',sorted).replace('{m}',misses).replace('{h}',hi);
}

function pointerToCanvas(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

function handlePointer(e){
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;return;}
  const p=pointerToCanvas(e);
  // check bins first if a log is selected
  if(selected){
    for(const b of bins){
      if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
        if(b.type===selected.type.id){
          SFX.point();
          sorted++;
          if(sorted>hi){hi=sorted;localStorage.setItem('logdrivefloat_hi',hi);}
        }else{
          SFX.error();
          misses++;
        }
        selected.done=true;
        selected=null;
        checkEnd();
        return;
      }
    }
  }
  // else check logs
  for(let i=logs.length-1;i>=0;i--){
    const l=logs[i];
    if(l.done)continue;
    if(p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h){
      selected=l;
      SFX.click();
      return;
    }
  }
  selected=null;
}

c.addEventListener('mousedown',handlePointer);
c.addEventListener('touchstart',handlePointer,{passive:false});

function checkEnd(){
  if(misses>=8&&!gameOver){
    gameOver=true;
    SFX.lose();
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawWater();

  if(!started){
    drawBank();
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('log_start_hint','Tap to start'),(W-bankW)/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawBank();
    logs.forEach(l=>{if(!l.done)drawLog(l);});
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),(W-bankW)/2,H/2-14);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('log_final','Logs sorted: {s}').replace('{s}',sorted),(W-bankW)/2,H/2+18);
    ctx.fillText(I18N.t('restart_hint','Tap to restart'),(W-bankW)/2,H/2+46);
    document.getElementById('score-display').textContent=scoreLabel();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  spd=1.2+sorted*0.03+misses*0.02;
  spawnTimer+=dt;
  const interval=Math.max(35,90-sorted*1.5);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnLog();}

  logs.forEach(l=>{
    if(l.done)return;
    l.x+=spd*dt;
    if(l.x>W-bankW-l.w&&!l.done){
      // floated past end -> miss
      l.done=true;
      misses++;
      SFX.error();
      if(selected===l)selected=null;
      checkEnd();
    }
  });
  logs=logs.filter(l=>l.x<W+20&&!l.done);

  drawBank();
  logs.forEach(l=>drawLog(l));

  document.getElementById('score-display').textContent=scoreLabel();
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
