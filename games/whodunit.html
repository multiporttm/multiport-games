<link rel="stylesheet" href="../css/style.css?v=6">
<style>
body{background:#08080f}
#ui{color:#ef9a9a;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#clues{max-width:480px;margin:0 auto;padding:10px 16px;color:rgba(255,255,255,.7);font-size:.9rem;line-height:1.7;min-height:60px}
#suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:480px;margin:0 auto;padding:10px 16px}
.suspect{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .12s}
.suspect:hover{background:rgba(255,255,255,.12)}
.suspect .emoji{font-size:2.2rem}
.suspect .attrs{font-size:.68rem;color:rgba(255,255,255,.45);margin-top:4px}
.suspect.correct{border-color:#69f0ae;background:rgba(105,240,174,.15)}
.suspect.wrong{border-color:#ff5252;background:rgba(255,82,82,.15)}
#clue-btn{display:block;margin:10px auto;padding:10px 24px;background:rgba(233,69,96,.18);border:1px solid rgba(233,69,96,.4);border-radius:50px;color:#ff8fa3;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
#clue-btn:disabled{opacity:.4;cursor:default}
#msg{text-align:center;font-weight:700;min-height:24px;padding:4px}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Whodunit</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">Case 1 | Guesses left: 3 | Score: 0</div>
    <div id="clues"></div>
    <button id="clue-btn">🔍 Get a Clue</button>
    <div id="msg"></div>
    <div id="suspects"></div>
  </div>
  <div class="game-instructions">A crime has been committed! Tap "Get a Clue" to reveal facts about the culprit, then click the suspect you think did it. Fewer clues used = more points. Guess wrong and you lose a life!</div>
</div>
<script>
const COLORS=['red','blue','green','yellow','purple','orange'];
const ITEMS=['a hat','a knife','a briefcase','a candle','a rope','a wrench'];
const PLACES=['the library','the kitchen','the garden','the study','the attic','the hallway'];
const NAMES=['Mr. Fox','Ms. Owl','Dr. Bear','Capt. Wolf','Prof. Cat','Lady Crow'];
const EMOJI=['🦊','🦉','🐻','🐺','🐱','🐦‍⬛'];

let suspects,culpritIdx,cluesRevealed,guessesLeft,score,lives;

function newCase(){
  suspects=NAMES.map((n,i)=>({
    name:n,emoji:EMOJI[i],color:COLORS[Math.floor(Math.random()*COLORS.length)],
    item:ITEMS[Math.floor(Math.random()*ITEMS.length)],place:PLACES[Math.floor(Math.random()*PLACES.length)],
  }));
  culpritIdx=Math.floor(Math.random()*suspects.length);
  cluesRevealed=0;guessesLeft=3;
  document.getElementById('clues').innerHTML='';
  document.getElementById('msg').textContent='';
  document.getElementById('clue-btn').disabled=false;
  renderSuspects();
  updateUI();
}

function clueText(n){
  const c=suspects[culpritIdx];
  if(n===0)return `The culprit was seen wearing ${c.color}.`;
  if(n===1)return `The culprit was carrying ${c.item}.`;
  return `The culprit was last seen in ${c.place}.`;
}

document.getElementById('clue-btn').addEventListener('click',()=>{
  if(cluesRevealed>=3)return;
  const div=document.createElement('div');
  div.textContent='• '+clueText(cluesRevealed);
  document.getElementById('clues').appendChild(div);
  cluesRevealed++;
  if(cluesRevealed>=3)document.getElementById('clue-btn').disabled=true;
});

function renderSuspects(){
  const el=document.getElementById('suspects');
  el.innerHTML='';
  suspects.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='suspect';
    d.innerHTML=`<div class="emoji">${s.emoji}</div><div>${s.name}</div><div class="attrs">${s.color} · ${s.item} · ${s.place}</div>`;
    d.onclick=()=>guess(i,d);
    el.appendChild(d);
  });
}

function guess(i,el){
  if(guessesLeft<=0||el.classList.contains('correct'))return;
  if(i===culpritIdx){
    el.classList.add('correct');
    const pts=Math.max(10,(3-cluesRevealed)*20+10);
    score+=pts;
    document.getElementById('msg').textContent=`✅ Correct! +${pts} points`;
    document.getElementById('msg').style.color='#69f0ae';
    document.getElementById('clue-btn').disabled=true;
    setTimeout(newCase,1600);
  } else {
    el.classList.add('wrong');
    guessesLeft--;
    if(guessesLeft<=0){
      lives--;
      document.getElementById('msg').textContent=lives<=0?`💀 Game Over! Final score: ${score}`:`❌ Out of guesses! The culprit was ${suspects[culpritIdx].name}.`;
      document.getElementById('msg').style.color='#ff5252';
      document.getElementById('clue-btn').disabled=true;
      suspects.forEach((s,j)=>{if(j===culpritIdx)document.querySelectorAll('.suspect')[j].classList.add('correct');});
      if(lives>0)setTimeout(newCase,2000);
      else setTimeout(()=>{score=0;lives=3;newCase();},2200);
    } else {
      document.getElementById('msg').textContent=`❌ Not them! ${guessesLeft} guess${guessesLeft===1?'':'es'} left.`;
      document.getElementById('msg').style.color='#ff8a80';
    }
  }
  updateUI();
}

function updateUI(){
  document.getElementById('ui').textContent=`Lives: ${'❤️'.repeat(Math.max(0,lives))} | Guesses left: ${guessesLeft} | Score: ${score}`;
}

score=0;lives=3;
newCase();
</script></body></html>
