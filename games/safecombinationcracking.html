<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#20202a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#c8a84a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff6b6b;font-size:1rem;text-align:center;padding:0 0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Safe Combination Cracking</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right Arrows</b> or <b>drag the dial</b> to turn it, and press <b>Space</b> or <b>tap the dial</b> to test the current number on the selected wheel. Watch for the flash — that means you found the click! Crack every wheel before your turns run out.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const scoreEl=document.getElementById('score-display'),livesEl=document.getElementById('lives-display');

let score=0,hi=parseInt(localStorage.getItem('safecombinationcracking_hi')||'0',10);
let lives=3,level=1,gameOver=false,started=false;
let wheels=[],activeWheel=0,dialValue=0,turnsLeft=0,flashTimer=0,shakeTimer=0,safeOpen=false;

function wheelCountForLevel(l){ return Math.min(2+Math.floor((l-1)),6); }
function turnsForLevel(l,n){ return n*7+6; }

function setupLevel(l){
  const n=wheelCountForLevel(l);
  wheels=[];
  for(let i=0;i<n;i++){
    wheels.push({target:Math.floor(Math.random()*40),found:false});
  }
  activeWheel=0;
  dialValue=0;
  turnsLeft=turnsForLevel(l,n);
  safeOpen=false;
}

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  setupLevel(level);
}
resetGame();

function nextLevel(){
  level++;
  SFX.levelup();
  setupLevel(level);
}

function testDial(){
  if(gameOver||safeOpen)return;
  turnsLeft--;
  const w=wheels[activeWheel];
  if(!w.found && dialValue===w.target){
    w.found=true;
    SFX.click();
    flashTimer=16;
    score+=25*level;
    const nextIdx=wheels.findIndex(ww=>!ww.found);
    if(nextIdx===-1){
      safeOpen=true;
      SFX.success();
      score+=100*level;
      if(score>hi){hi=score;localStorage.setItem('safecombinationcracking_hi',String(hi));}
      setTimeout(()=>{ if(!gameOver) nextLevel(); },600);
    }else{
      activeWheel=nextIdx;
    }
  }else{
    SFX.tick();
    // small proximity hint via shake (closer = less shake)
    const dist=Math.min(Math.abs(dialValue-w.target),40-Math.abs(dialValue-w.target));
    shakeTimer=dist<4?4:0;
  }
  if(turnsLeft<=0 && !safeOpen){
    loseLife();
  }
}

function loseLife(){
  lives--;
  SFX.hit();
  shakeTimer=18;
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;localStorage.setItem('safecombinationcracking_hi',String(hi));}
  }else{
    // retry same level with fresh turns but keep found wheels reset for challenge
    const n=wheelCountForLevel(level);
    wheels.forEach(w=>w.found=false);
    activeWheel=0;
    turnsLeft=turnsForLevel(level,n);
  }
}

function turnDial(dir,amt){
  dialValue=(dialValue+dir*amt+40)%40;
}

function switchWheel(dir){
  if(wheels.length<2)return;
  let idx=activeWheel;
  do{ idx=(idx+dir+wheels.length)%wheels.length; }while(wheels[idx].found && idx!==activeWheel);
  activeWheel=idx;
}

// ---- Input ----
document.addEventListener('keydown',e=>{
  if(!started&&!gameOver){started=true;}
  if(gameOver){ if(e.key===' '||e.key==='Enter'){resetGame();started=true;} return; }
  if(e.key==='ArrowLeft'){e.preventDefault();turnDial(-1,1);SFX.select();}
  else if(e.key==='ArrowRight'){e.preventDefault();turnDial(1,1);SFX.select();}
  else if(e.key==='ArrowUp'){e.preventDefault();switchWheel(-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();switchWheel(1);}
  else if(e.key===' '){e.preventDefault();testDial();}
});

let dragStart=null,dragStartVal=0;
function canvasPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width), y:cy*(H/r.height)};
}
function handleDown(x,y){
  if(!started&&!gameOver){started=true;return;}
  if(gameOver){resetGame();started=true;return;}
  const cx=W/2,cy=H/2+10;
  const dist=Math.hypot(x-cx,y-cy);
  if(dist<130){
    dragStart={x,y};
    dragStartVal=dialValue;
  }else if(x<W*0.15){
    switchWheel(-1);
  }else if(x>W*0.85){
    switchWheel(1);
  }
}
function handleMove(x,y){
  if(!dragStart)return;
  const dx=x-dragStart.x;
  const steps=Math.round(dx/8);
  dialValue=((dragStartVal+steps)%40+40)%40;
}
function handleUp(){
  if(dragStart){ testDial(); }
  dragStart=null;
}
c.addEventListener('mousedown',e=>{const p=canvasPos(e);handleDown(p.x,p.y);});
c.addEventListener('mousemove',e=>{const p=canvasPos(e);handleMove(p.x,p.y);});
window.addEventListener('mouseup',handleUp);
c.addEventListener('touchstart',e=>{e.preventDefault();const p=canvasPos(e);handleDown(p.x,p.y);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const p=canvasPos(e);handleMove(p.x,p.y);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();handleUp();},{passive:false});

function drawDial(){
  const cx=W/2,cy=H/2+10,r=130;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle='#2e2e3a';
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.stroke();
  // ticks
  for(let i=0;i<40;i++){
    const ang=(i/40)*Math.PI*2-Math.PI/2+ (dialValue/40)*Math.PI*2*0; // static ring, pointer rotates instead
  }
  ctx.rotate((dialValue/40)*Math.PI*2);
  for(let i=0;i<40;i++){
    const ang=(i/40)*Math.PI*2;
    const isMajor=i%5===0;
    const r1=r-10,r2=isMajor?r-28:r-18;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*r1,Math.sin(ang)*r1);
    ctx.lineTo(Math.cos(ang)*r2,Math.sin(ang)*r2);
    ctx.strokeStyle=isMajor?'#ccc':'#777';
    ctx.lineWidth=isMajor?3:1.5;
    ctx.stroke();
    if(isMajor){
      ctx.save();
      ctx.translate(Math.cos(ang)*(r-42),Math.sin(ang)*(r-42));
      ctx.rotate(-((dialValue/40)*Math.PI*2));
      ctx.fillStyle='#999';ctx.font='11px Arial';ctx.textAlign='center';
      ctx.fillText(String(i),0,4);
      ctx.restore();
    }
  }
  ctx.restore();

  // fixed pointer at top
  ctx.fillStyle = flashTimer>0 ? '#4caf50' : '#ffd54f';
  ctx.beginPath();
  ctx.moveTo(cx,cy-r-10);
  ctx.lineTo(cx-10,cy-r+14);
  ctx.lineTo(cx+10,cy-r+14);
  ctx.closePath();ctx.fill();

  // flash overlay
  if(flashTimer>0){
    ctx.fillStyle=`rgba(76,201,112,${flashTimer/16*0.5})`;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  }

  // center hub showing value
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#666';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(String(dialValue),cx,cy+8);
}

function drawWheelsStatus(){
  const n=wheels.length;
  const totalW=Math.min(500,n*70);
  const startX=W/2-totalW/2;
  const slot=totalW/n;
  for(let i=0;i<n;i++){
    const x=startX+slot*i+slot/2;
    ctx.fillStyle=wheels[i].found?'#4caf50':(i===activeWheel?'#ffd54f':'#555');
    ctx.beginPath();ctx.arc(x,56,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText(wheels[i].found?'✓':String(i+1),x,61);
  }
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?1:Math.min((t-lastTime)/16.6667,3);
  lastTime=t;
  if(flashTimer>0)flashTimer-=dt;
  if(shakeTimer>0)shakeTimer-=dt;

  let sx=0,sy=0;
  if(shakeTimer>0){sx=(Math.random()-0.5)*6;sy=(Math.random()-0.5)*6;}
  ctx.save();
  ctx.translate(sx,sy);
  ctx.fillStyle='#20202a';ctx.fillRect(-10,-10,W+20,H+20);

  if(!started){
    ctx.fillStyle='#c8a84a';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('safe_start_hint','Press any key or tap the dial to start'),W/2,H/2);
  }else{
    drawWheelsStatus();
    drawDial();

    ctx.fillStyle='#ccc';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('safe_level_label','Safe {n}').replace('{n}',level),W/2,24);
    ctx.fillText(I18N.t('turns_left_label','Turns left: {n}').replace('{n}',Math.max(0,turnsLeft)),W/2,H-20);

    if(safeOpen){
      ctx.fillStyle='rgba(76,201,112,0.25)';ctx.fillRect(-10,-10,W+20,H+20);
      ctx.fillStyle='#4caf50';ctx.font='bold 28px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('safe_cracked','SAFE CRACKED!'),W/2,H/2+150>H?H-30:H-30);
    }

    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-10,-10,W+20,H+20);
      ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
      ctx.font='18px Arial';
      ctx.fillText(I18N.t('restart_hint','Tap or press Space to restart'),W/2,H/2+16);
    }
  }
  ctx.restore();

  livesEl.textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
