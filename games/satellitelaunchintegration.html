<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0c1118;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#hud{color:#d6e4ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.lives{letter-spacing:2px;color:#ff6b6b}
#timerWrap{max-width:600px;margin:0 auto 8px;background:#101826;border-radius:10px;padding:4px}
#timerBar{height:12px;border-radius:8px;background:linear-gradient(90deg,#4fc3f7,#90e0ef);width:100%;transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Satellite Launch Integration</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud">
      <span id="stackLbl">Stack 1</span>
      <span id="scoreLbl">Score: 0</span>
      <span id="hiLbl">Hi: 0</span>
      <span class="lives" id="livesLbl">●●●</span>
    </div>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap each interface pad in the order shown on the manifest (top to bottom), or use <b>Tab/Arrow Keys</b> to move the highlighted pad and <b>Enter/Space</b> to connect it. Connecting one out of order costs a life.</div>
</div>
<script>
(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=800,H=460;
const ID='satellitelaunchintegration';
const hiKey=ID+'_hi';

let lives=3,score=0,stackNum=1,hi=0,gameOver=false,started=false,win=false;
let lastTime=null;
let pads=[]; // {x,y,type,label,done}
let order=[]; // array of pad indices in required order
let nextIdx=0;
let selSel=0; // selected pad index for keyboard nav
let timeLeft=0,timeTotal=0;
let flashT=0,shakeT=0;

try{hi=parseFloat(localStorage.getItem(hiKey))||0;}catch(e){hi=0;}

function satellitesForStack(n){ return Math.min(1+Math.floor((n-1)/1),6); } // # of satellites in this stack
function padsPerSat(n){ return Math.min(3+n,9); }

function buildStack(){
  pads=[];order=[];nextIdx=0;selSel=0;
  const satCount=satellitesForStack(stackNum);
  const padCount=Math.min(padsPerSat(stackNum),12);
  const totalPads=Math.min(satCount*2+padCount,18);
  // lay out pads in a circle-ish grid around a central rocket/adapter graphic
  const cx=W/2,cy=H/2+10;
  const n=totalPads;
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2 - Math.PI/2;
    const rad=150+((i%3)*18);
    const x=cx+Math.cos(ang)*rad;
    const y=cy+Math.sin(ang)*(rad*0.62);
    const type=i%2===0?'E':'M';
    pads.push({x,y,type,idx:i,done:false});
  }
  order=pads.map((p,i)=>i);
  // shuffle order (the required connection sequence), independent of layout
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  timeTotal=Math.max(9000,20000-stackNum*900);
  timeLeft=timeTotal;
}

function reset(){
  lives=3;score=0;stackNum=1;gameOver=false;win=false;started=false;lastTime=null;
  buildStack();
}

function labelFor(pad,orderPos){
  return pad.type+(orderPos+1);
}

function connectPad(padIndex){
  if(gameOver||!started)return;
  const pad=pads[padIndex];
  if(pad.done)return;
  const expected=order[nextIdx];
  if(padIndex===expected){
    pad.done=true;
    nextIdx++;
    score+=40+stackNum*5;
    SFX.success();
    flashT=10;
    if(nextIdx>=order.length){
      // stack complete
      if(score>hi){hi=score;try{localStorage.setItem(hiKey,String(hi));}catch(e){}}
      stackNum++;
      if(stackNum>8){win=true;gameOver=true;SFX.win();}
      else buildStack();
    }
  } else {
    lives--;
    SFX.error();
    shakeT=12;
    if(lives<=0){gameOver=true;win=false;SFX.lose();}
  }
}

function update(dt){
  if(!started||gameOver)return;
  timeLeft-=dt*16.6667;
  if(timeLeft<=0){
    timeLeft=0;
    lives--;
    SFX.fail();
    shakeT=12;
    if(lives<=0){gameOver=true;win=false;SFX.lose();}
    else buildStack();
  }
  if(flashT>0)flashT-=dt;
  if(shakeT>0)shakeT-=dt;
}

function drawAdapter(){
  const cx=W/2,cy=H/2+10;
  ctx.save();
  ctx.strokeStyle='#4a5a70';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,70,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#1a2230';
  ctx.beginPath();ctx.arc(cx,cy,68,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8fa3bf';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('adapter_ring','ADAPTER RING'),cx,cy-4);
  ctx.fillText(I18N.t('stack_label_short','Stack {n}').replace('{n}',stackNum),cx,cy+16);
  ctx.restore();
}

function drawPad(pad,i){
  const sx=shakeT>0?(Math.random()-0.5)*4:0;
  const sy=shakeT>0?(Math.random()-0.5)*4:0;
  const x=pad.x+sx,y=pad.y+sy;
  const isNext=order[nextIdx]===i;
  const isSel=selSel===i;
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);
  ctx.fillStyle=pad.done?'#2e7d32':(pad.type==='E'?'#263a52':'#3a2a2a');
  ctx.fill();
  ctx.lineWidth=isSel?4:2;
  ctx.strokeStyle=pad.done?'#7ed957':(isNext&&isSel?'#ffd166':(isSel?'#ffffff':'#5a6b80'));
  ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(pad.type==='E'?'⚡':'🔧',x,y+4);
  ctx.restore();
}

function drawManifest(){
  const x=20,y=20;
  ctx.save();
  ctx.fillStyle='rgba(16,22,33,.85)';
  ctx.fillRect(x-8,y-6,150,22+Math.min(order.length,12)*18);
  ctx.strokeStyle='#4a5a70';ctx.strokeRect(x-8,y-6,150,22+Math.min(order.length,12)*18);
  ctx.fillStyle='#d6e4ff';ctx.font='bold 13px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('manifest_label','MANIFEST ORDER'),x,y+8);
  for(let i=0;i<order.length;i++){
    const padIdx=order[i];
    const pad=pads[padIdx];
    const done=pad.done;
    const isNext=i===nextIdx;
    ctx.fillStyle=done?'#7ed957':(isNext?'#ffd166':'#8fa3bf');
    ctx.font=(isNext?'bold ':'')+'13px Arial';
    ctx.fillText((done?'✓ ':(isNext?'→ ':'  '))+labelFor(pad,i),x,y+26+i*18);
  }
  ctx.restore();
}

function drawHUD(){
  document.getElementById('stackLbl').textContent=I18N.t('stack_label','Stack {n} of 8').replace('{n}',Math.min(stackNum,8));
  document.getElementById('scoreLbl').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('hiLbl').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
  document.getElementById('livesLbl').textContent='●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives));
  document.getElementById('timerBar').style.width=Math.max(0,(timeLeft/timeTotal*100))+'%';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0c1118';ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#d6e4ff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click a pad or press any key to begin'),W/2,H/2-60);
    ctx.font='15px Arial';
    ctx.fillText(I18N.t('integration_intro','Connect pads in the manifest order before time runs out'),W/2,H/2-32);
    drawAdapter();
    pads.forEach((p,i)=>drawPad(p,i));
    drawManifest();
    drawHUD();
    return;
  }

  drawAdapter();
  pads.forEach((p,i)=>drawPad(p,i));
  drawManifest();

  if(flashT>0){
    ctx.fillStyle=`rgba(126,217,87,${flashT/10*0.25})`;
    ctx.fillRect(0,0,W,H);
  }

  if(gameOver){
    ctx.fillStyle='rgba(5,7,15,.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=win?'#7ed957':'#ff6b6b';
    ctx.font='bold 34px Arial';
    ctx.fillText(win?I18N.t('integration_complete','INTEGRATION COMPLETE'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.fillStyle='#d6e4ff';ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: {s}').replace('{s}',score),W/2,H/2+20);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Press any key or tap to restart'),W/2,H/2+52);
  }

  drawHUD();
}

function loop(now){
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startIfNeeded(){
  if(gameOver){reset();return true;}
  if(!started){started=true;return true;}
  return false;
}

function pointerPos(e){
  const rect=canvas.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*(W/rect.width),y:(clientY-rect.top)*(H/rect.height)};
}

function padAt(x,y){
  for(let i=0;i<pads.length;i++){
    const p=pads[i];
    const dx=x-p.x,dy=y-p.y;
    if(dx*dx+dy*dy<=22*22)return i;
  }
  return -1;
}

canvas.addEventListener('pointerdown',e=>{
  if(startIfNeeded())return;
  const p=pointerPos(e);
  const idx=padAt(p.x,p.y);
  if(idx>=0){selSel=idx;connectPad(idx);}
});

document.addEventListener('keydown',e=>{
  if(['Tab','ArrowRight','ArrowDown'].includes(e.key)){
    e.preventDefault();
    if(startIfNeeded())return;
    selSel=(selSel+1)%pads.length;
    return;
  }
  if(['ArrowLeft','ArrowUp'].includes(e.key)){
    e.preventDefault();
    if(startIfNeeded())return;
    selSel=(selSel-1+pads.length)%pads.length;
    return;
  }
  if(e.key==='Enter'||e.code==='Space'){
    e.preventDefault();
    if(startIfNeeded())return;
    connectPad(selSel);
    return;
  }
  startIfNeeded();
});

reset();
requestAnimationFrame(loop);
})();
</script></body></html>
