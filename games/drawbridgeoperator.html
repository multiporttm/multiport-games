<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a3a2a;display:block;border-radius:8px;touch-action:none;max-width:100%;height:auto}
#hud{color:#e8d9b0;font-size:1.05rem;font-weight:700;text-align:center;padding:6px 0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
#crank{display:block;margin:12px auto;padding:14px 34px;border-radius:14px;border:2px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.08);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none}
#crank.active{background:#e94560;border-color:#ff8fa3;box-shadow:0 0 16px rgba(233,69,96,.55)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Drawbridge Operator</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Hi: <b id="hi">0</b></span></div>
    <canvas id="c" width="800" height="320"></canvas>
    <button id="crank">🔧 Hold to Wind Crank (raise bridge)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b> or the <b>Wind Crank</b> button to raise the drawbridge, release to let it fall. Keep the bridge <b>down</b> so friendly merchants and allies can cross, and raise it in time to block approaching <b>enemy riders</b>.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const bridgeX=420,gateX=560;
const KEY='mp_hi_drawbridgeoperator';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let angle=0; // 0=down(flat/passable), 90=up(closed)
let holding=false;
let score=0,lives=3,gameOver=false,started=false,travelers=[],spawnTimer=0,elapsed=0;

function reset(){angle=0;score=0;lives=3;gameOver=false;travelers=[];spawnTimer=0;elapsed=0;}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;}
}

function spawnTraveler(){
  const enemyChance=Math.min(0.75,0.3+elapsed/6000);
  const friendly=Math.random()>enemyChance;
  travelers.push({x:W+20,y:150,speed:1.1+Math.random()*0.5+elapsed/9000,friendly,resolved:false});
}

function setHold(v){
  if(gameOver||!started){if(v)startOrRestart();return;}
  holding=v;
  document.getElementById('crank').classList.toggle('active',v);
}
const crankBtn=document.getElementById('crank');
crankBtn.addEventListener('mousedown',()=>setHold(true));
crankBtn.addEventListener('mouseup',()=>setHold(false));
crankBtn.addEventListener('mouseleave',()=>setHold(false));
crankBtn.addEventListener('touchstart',e=>{e.preventDefault();setHold(true);},{passive:false});
crankBtn.addEventListener('touchend',e=>{e.preventDefault();setHold(false);},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setHold(true);}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();setHold(false);}});

function drawScene(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#213524');sky.addColorStop(1,'#3a5a3d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // road
  ctx.fillStyle='#7a6a4d';ctx.fillRect(0,160,W,40);
  // moat
  ctx.fillStyle='#2a5a8a';ctx.fillRect(bridgeX,150,gateX-bridgeX,60);
  // castle gate
  ctx.fillStyle='#555568';ctx.fillRect(gateX,60,60,220);
  ctx.fillStyle='#333340';ctx.fillRect(gateX+16,150,28,70);
  // bridge (pivots at bridgeX, rotates up as angle increases)
  const rad=angle*Math.PI/180;
  const bx=bridgeX,by=180;
  const len=gateX-bridgeX+6;
  ctx.save();
  ctx.translate(bx,by);
  ctx.rotate(-rad);
  ctx.fillStyle=angle>60?'#8a6a4a':'#a9865c';
  ctx.fillRect(0,-6,len,12);
  ctx.restore();

  travelers.forEach(t=>{
    ctx.fillStyle=t.friendly?'#4caf50':'#e94560';
    ctx.beginPath();ctx.arc(t.x,178,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(t.friendly?'🐴':'⚔️',t.x,183);
  });

  if(!started){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to start'),W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('game_over_title','THE CASTLE HAS FALLEN'),W/2,H/2-16);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Space to try again'),W/2,H/2+22);
  }
  document.getElementById('score').textContent=Math.floor(score);
  document.getElementById('lives').textContent=Math.max(0,lives);
  document.getElementById('hi').textContent=Math.floor(hi);
}

function update(dt){
  if(!started||gameOver)return;
  elapsed+=dt*16.6667;
  angle+=(holding?2.4:-2.0)*dt;
  angle=Math.max(0,Math.min(90,angle));

  spawnTimer+=dt;
  const interval=Math.max(50,110-elapsed/200);
  if(spawnTimer>=interval){spawnTimer=0;spawnTraveler();}

  travelers.forEach(t=>{
    if(t.resolved)return;
    t.x-=t.speed*dt;
    if(t.x<=bridgeX+20){
      t.resolved=true;
      const blocked=angle>=55;
      if(t.friendly){
        if(!blocked){score+=10;SFX.success();}
        else{lives--;SFX.fail();}
      }else{
        if(blocked){score+=15;SFX.hit();}
        else{lives--;SFX.hurt();}
      }
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });
  travelers=travelers.filter(t=>!t.resolved&&t.x>-40);
}

let last=null;
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/16.6667,3);
  last=ts;
  update(dt);
  drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
