<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#021220;display:block;border-radius:8px;touch-action:none}
#hud{color:#8fe9ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#decoBar{width:180px;height:14px;background:#0b2b3a;border-radius:7px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
#decoFill{height:100%;width:0%;background:linear-gradient(90deg,#4caf50,#ffd54f,#ff4444);transition:width .1s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Submarine Escape Pod</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Depth: 0m | Hi: 0m</span><span>Bends risk:<span id="decoBar"><span id="decoFill"></span></span></span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>←/→ Arrows</b>, <b>A/D</b>, or <b>drag</b> to steer your pod and dodge falling debris. Hold <b>↑</b> / tap-and-hold to boost upward (raises decompression risk), press <b>↓</b> to vent and cool down. Keep the meter from maxing out and reach the surface!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const scoreEl=document.getElementById('score-display');
const decoFill=document.getElementById('decoFill');
const HI_KEY='sep_hiscore';
let hi=parseFloat(localStorage.getItem(HI_KEY)||'0');

const pod={x:400,y:360,w:34,h:46,vx:0};
let depth=0,deco=0,gameOver=false,started=false;
let debris=[],bubbles=[];
let keys={};
let pointerX=null;
let boosting=false,venting=false;
let baseSpeed=1.6;
let spawnTimer=0;
let lastTime=null;

function reset(){
  pod.x=400;pod.vx=0;depth=0;deco=0;gameOver=false;started=false;
  debris=[];bubbles=[];spawnTimer=0;lastTime=null;baseSpeed=1.6;
}

function spawnDebris(){
  const w=20+Math.random()*40;
  debris.push({x:Math.random()*(W-w),y:-40,w,h:w*0.6+10,vy:2.5+Math.random()*2+depth/400,rot:Math.random()*Math.PI});
}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(!started){started=true;}
  if(gameOver){reset();return;}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

c.addEventListener('pointerdown',e=>{
  if(!started){started=true;}
  if(gameOver){reset();return;}
  pointerX=e.offsetX*(W/c.clientWidth);
  boosting=true;
});
c.addEventListener('pointermove',e=>{ if(pointerX!==null) pointerX=e.offsetX*(W/c.clientWidth); });
window.addEventListener('pointerup',()=>{pointerX=null;boosting=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();
  if(!started){started=true;}
  if(gameOver){reset();return;}
  const r=c.getBoundingClientRect();
  pointerX=(e.touches[0].clientX-r.left)*(W/r.width);
  boosting=true;
},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();
  const r=c.getBoundingClientRect();
  pointerX=(e.touches[0].clientX-r.left)*(W/r.width);
},{passive:false});
c.addEventListener('touchend',e=>{pointerX=null;boosting=false;});

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawPod(){
  ctx.save();
  ctx.translate(pod.x,pod.y);
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();
  ctx.ellipse(0,0,pod.w/2,pod.h/2,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#8fe9ff';
  ctx.beginPath();ctx.arc(0,-6,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=boosting?'#ff8844':'#4a6a7a';
  ctx.fillRect(-6,pod.h/2-4,12,10+((boosting)?6*Math.sin(performance.now()/40):0));
  ctx.restore();
}

function drawDebris(d){
  ctx.save();
  ctx.translate(d.x+d.w/2,d.y+d.h/2);
  ctx.rotate(d.rot);
  ctx.fillStyle='#5a4535';
  ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.fillStyle='#3a2a20';
  ctx.strokeRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#021018');bg.addColorStop(1,'#063a52');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // ambient bubbles
  if(Math.random()<0.3)bubbles.push({x:Math.random()*W,y:H+10,r:2+Math.random()*4,vy:1+Math.random()*2});
  bubbles=bubbles.filter(b=>b.y>-10);
  bubbles.forEach(b=>{b.y-=b.vy;ctx.fillStyle='rgba(180,230,255,0.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title', deco>=100?'THE BENDS!':'POD DESTROYED'),W/2,180);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_depth','Depth reached: {d}m').replace('{d}',Math.floor(depth)),W/2,214);
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,242);
    drawPod();
    decoFill.style.width=Math.min(100,deco)+'%';
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#8fe9ffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key / Tap to start'),W/2,120);
    drawPod();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  // horizontal control
  if(keys['ArrowLeft']||keys['KeyA'])pod.vx-=0.9*dt;
  if(keys['ArrowRight']||keys['KeyD'])pod.vx+=0.9*dt;
  if(pointerX!==null){
    const diff=pointerX-pod.x;
    pod.vx+=Math.sign(diff)*Math.min(Math.abs(diff)*0.02,1.1)*dt;
  }
  pod.vx*=0.9;
  pod.x+=pod.vx*dt;
  pod.x=Math.max(pod.w/2,Math.min(W-pod.w/2,pod.x));

  boosting = boosting || keys['ArrowUp']||keys['KeyW']||keys['Space'];
  venting = keys['ArrowDown']||keys['KeyS'];

  let speed=baseSpeed;
  if(boosting){speed=baseSpeed*2.1;deco=Math.min(100,deco+0.9*dt);}
  else if(venting){speed=baseSpeed*0.5;deco=Math.max(0,deco-0.7*dt);}
  else {deco=Math.max(0,deco-0.08*dt);}

  depth+=speed*dt;
  baseSpeed=1.6+depth/900;
  if(depth>hi){hi=depth;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}

  spawnTimer+=dt;
  const interval=Math.max(18,46-depth/40);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnDebris();}

  const podHit={x:pod.x-pod.w/2+4,y:pod.y-pod.h/2+4,w:pod.w-8,h:pod.h-8};
  debris=debris.filter(d=>d.y<H+60);
  debris.forEach(d=>{
    d.y+=(d.vy+speed*0.4)*dt;
    d.rot+=0.02*dt;
    drawDebris(d);
    if(rect(podHit,d)&&!gameOver){gameOver=true;SFX.lose();}
  });

  if(deco>=100&&!gameOver){gameOver=true;SFX.lose();}

  drawPod();

  decoFill.style.width=Math.min(100,deco)+'%';
  scoreEl.textContent=I18N.t('depth_hi_label','Depth: {d}m | Hi: {h}m').replace('{d}',Math.floor(depth)).replace('{h}',Math.floor(hi));

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
