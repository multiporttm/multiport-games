<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Flag Match</title><meta name="description" content="Play Flag Match free online — Flip two cards at a time to find matching country flag pairs. Match all pairs to advance to a bigger grid. Fewer flips means a higher score!"><link rel="canonical" href="https://games.multiportllc.com/games/flagmatch"><meta property="og:title" content="Flag Match - Multiport Games"><meta property="og:description" content="Play Flag Match free online — Flip two cards at a time to find matching country flag pairs. Match all pairs to advance to a bigger grid. Fewer flips means a higher score!"><meta property="og:url" content="https://games.multiportllc.com/games/flagmatch"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Flag Match","description":"Play Flag Match free online instantly. Flip two cards at a time to find matching country flag pairs. Match all pairs to advance to a bigger grid. Fewer flips means a higher score! No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/flagmatch","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;max-width:560px;margin:0 auto 10px;color:#ffd54f;font-weight:800;font-size:1rem}
#grid{display:grid;gap:8px;max-width:560px;margin:0 auto;justify-content:center}
.card{width:64px;height:64px;border-radius:10px;background:#16213e;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:transform .18s;position:relative;perspective:400px}
.card.matched{cursor:default}
.card-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:transform .18s}
.card .back{background:#0b3d2e;color:#7ec850;font-weight:900;font-size:1.4rem;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:10px}
.card.flipped .back,.card.matched .back{display:none}
.card .front{display:none;width:100%;height:100%;align-items:center;justify-content:center;border-radius:10px;background:#fdfdfd}
.card.flipped .front,.card.matched .front{display:flex}
.card.matched{outline:3px solid #4caf50}
.card.wrong{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#msg{text-align:center;color:#a3e6b0;min-height:1.4em;margin-top:10px;font-weight:700}
#newBtn{display:block;margin:14px auto 0;padding:10px 26px;background:#e94560;border:none;border-radius:22px;color:#fff;font-size:1rem;font-weight:800;cursor:pointer}
@media(max-width:480px){.card{width:52px;height:52px;font-size:1.5rem}#hud{font-size:.85rem}}
@media(max-width:360px){.card{width:44px;height:44px;font-size:1.3rem}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Flag Match</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud"><span id="roundDisplay">Round: 1</span><span id="pairsDisplay">Pairs: 0/6</span><span id="flipsDisplay">Flips: 0</span><span id="bestDisplay">Best: 0</span></div>
    <div id="grid"></div>
    <div id="msg">Find every matching pair of flags!</div>
    <button id="newBtn">New Game</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click two cards at a time to flip them. Find all the matching <b>country flag</b> pairs to clear the round — matched pairs stay face up. Clear a round to move to a bigger grid. Fewer flips earns a higher score!</div>
</div>
<script>
const FLAGS=['🇺🇸','🇬🇧','🇫🇷','🇩🇪','🇮🇹','🇪🇸','🇯🇵','🇨🇳','🇧🇷','🇨🇦','🇦🇺','🇮🇳','🇲🇽','🇰🇷','🇷🇺','🇿🇦','🇪🇬','🇦🇷','🇳🇱','🇸🇪','🇳🇴','🇬🇷','🇹🇷','🇵🇹','🇮🇪','🇨🇭'];
const grid=document.getElementById('grid');
const roundDisplay=document.getElementById('roundDisplay');
const pairsDisplay=document.getElementById('pairsDisplay');
const flipsDisplay=document.getElementById('flipsDisplay');
const bestDisplay=document.getElementById('bestDisplay');
const msg=document.getElementById('msg');
const newBtn=document.getElementById('newBtn');
const BEST_KEY='flagmatch_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);
bestDisplay.textContent=I18N.t('best_label','Best: {b}').replace('{b}',best);

let round=1,pairsCount=6,flips=0,matchedPairs=0,cards=[],flippedIdx=[],locked=false,score=0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function setupRound(){
  pairsCount=Math.min(6+ (round-1)*2, FLAGS.length);
  const chosen=shuffle(FLAGS.slice()).slice(0,pairsCount);
  cards=shuffle(chosen.concat(chosen)).map(f=>({flag:f,flipped:false,matched:false}));
  flips=0;matchedPairs=0;flippedIdx=[];locked=false;
  roundDisplay.textContent=I18N.t('round_label','Round: {r}').replace('{r}',round);
  pairsDisplay.textContent=I18N.t('pairs_label','Pairs: {m}/{t}').replace('{m}',matchedPairs).replace('{t}',pairsCount);
  flipsDisplay.textContent=I18N.t('flips_label','Flips: {f}').replace('{f}',flips);
  msg.textContent=I18N.t('find_pairs','Find every matching pair of flags!');
  renderGrid();
}

function renderGrid(){
  const n=cards.length;
  let cols=Math.ceil(Math.sqrt(n*1.3));
  cols=Math.max(3,Math.min(cols,8));
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML='';
  cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card'+(c.flipped?' flipped':'')+(c.matched?' matched':'');
    el.innerHTML=`<div class="back">☘️</div><div class="front">${c.flag}</div>`;
    el.addEventListener('click',()=>flipCard(i));
    grid.appendChild(el);
  });
}

function flipCard(i){
  if(locked)return;
  const c=cards[i];
  if(c.flipped||c.matched)return;
  if(flippedIdx.length>=2)return;
  c.flipped=true;
  flippedIdx.push(i);
  SFX.click();
  renderGrid();
  if(flippedIdx.length===2){
    flips++;
    flipsDisplay.textContent=I18N.t('flips_label','Flips: {f}').replace('{f}',flips);
    locked=true;
    const [a,b]=flippedIdx;
    if(cards[a].flag===cards[b].flag){
      cards[a].matched=true;cards[b].matched=true;
      matchedPairs++;
      pairsDisplay.textContent=I18N.t('pairs_label','Pairs: {m}/{t}').replace('{m}',matchedPairs).replace('{t}',pairsCount);
      SFX.success();
      flippedIdx=[];
      locked=false;
      renderGrid();
      if(matchedPairs>=pairsCount)finishRound();
    } else {
      SFX.error();
      setTimeout(()=>{
        cards[a].flipped=false;cards[b].flipped=false;
        flippedIdx=[];
        locked=false;
        renderGrid();
      },700);
    }
  }
}

function finishRound(){
  const roundScore=Math.max(10,pairsCount*20-flips*3);
  score+=roundScore;
  msg.textContent=I18N.t('round_clear','Round clear! +{s} points. Next: bigger grid!').replace('{s}',roundScore);
  SFX.win();
  if(score>best){
    best=score;
    localStorage.setItem(BEST_KEY,String(best));
    bestDisplay.textContent=I18N.t('best_label','Best: {b}').replace('{b}',best);
  }
  round++;
  setTimeout(()=>{
    if(round>6||pairsCount>=FLAGS.length){
      msg.textContent=I18N.t('game_complete','All rounds complete! Final score: {s}').replace('{s}',score);
    } else {
      setupRound();
    }
  },1400);
}

newBtn.addEventListener('click',()=>{
  round=1;score=0;
  setupRound();
});

setupRound();
</script></body></html>
