<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#160f08}
#c{background:#2a1c10;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd37a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Croissant Baking Oven Baking</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Up/Down Arrow</b> or <b>W/S</b> (or touch and drag up/down) to raise or lower the oven temperature. Keep the orange line tracking the dashed <b>target curve</b> on the chart — too hot burns the crust, too cold leaves it pale!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
let hi=parseInt(localStorage.getItem('croissantbakingovenbaking_hi')||'0',10);
let score=0,round=1,started=false,gameOver=false,lastTime=null;
let temp=160,target=160,timeT=0,duration=22,tol=14;
let history=[],targetHistory=[];
let badTime=0,maxBad=4.0;
let keys={};
let curveFn=null;

function buildCurve(r){
  // temperature curve from 150-230C baseline with increasing complexity
  const base=170+Math.random()*20;
  const amp1=20+r*4;
  const amp2=5+Math.min(20,r*2);
  const freq1=0.9+Math.random()*0.5;
  const freq2=1.5+r*0.35+Math.random()*0.5;
  duration=20+Math.min(14,r*1.4);
  tol=Math.max(7,14-r*0.5);
  return function(t){
    const p=t/duration;
    let v=base+amp1*Math.sin(p*Math.PI)*0.9;
    v+=amp2*Math.sin(p*freq2*Math.PI*2+r);
    if(r>2)v+=Math.sin(p*freq1*Math.PI*4)*amp2*0.5;
    return Math.max(140,Math.min(245,v));
  };
}

function newRound(){
  round++;
  curveFn=buildCurve(round);
  timeT=0;history=[];targetHistory=[];
  temp=curveFn(0);
  badTime=0;
}

function reset(){
  score=0;round=0;started=false;gameOver=false;lastTime=null;
  newRound();
}
reset();

function hiScore(){if(score>hi){hi=score;localStorage.setItem('croissantbakingovenbaking_hi',String(Math.floor(hi)));}}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','KeyW','KeyS','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'){
    if(!started)started=true;
    else if(gameOver)reset();
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let touchDir=0,touchY=null;
c.addEventListener('mousedown',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  touchY=e.clientY;
});
window.addEventListener('mousemove',e=>{
  if(touchY!==null){touchDir=(touchY-e.clientY)>4?1:((touchY-e.clientY)<-4?-1:0);}
});
window.addEventListener('mouseup',()=>{touchY=null;touchDir=0;});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  touchY=e.touches[0].clientY;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(touchY!==null){const y=e.touches[0].clientY;touchDir=(touchY-y)>4?1:((touchY-y)<-4?-1:0);}
},{passive:false});
c.addEventListener('touchend',()=>{touchY=null;touchDir=0;});

function drawOvenPanel(){
  // Left side: oven visual with dial-based flame glow
  const ox=110,oy=330;
  ctx.save();
  ctx.translate(ox,oy);
  ctx.fillStyle='#1a1008';
  ctx.fillRect(-90,-130,180,160);
  ctx.strokeStyle='#5a3a22';ctx.lineWidth=6;
  ctx.strokeRect(-90,-130,180,160);
  // window
  const diff=Math.abs(temp-target);
  let glow = temp>target+tol? '#e94560' : (temp<target-tol? '#4a7fd6' : '#ffb347');
  ctx.fillStyle=glow+'55';
  ctx.fillRect(-70,-110,140,120);
  ctx.strokeStyle=glow;ctx.lineWidth=3;
  ctx.strokeRect(-70,-110,140,120);
  // croissant inside
  ctx.save();
  ctx.translate(0,-50);
  ctx.scale(1.6,1.2);
  let crustColor = temp>target+tol*1.6? '#2a1406' : (temp>target+tol? '#7a4418' : (temp<target-tol? '#f3e4b8' : '#c8863a'));
  ctx.fillStyle=crustColor;
  ctx.beginPath();
  ctx.arc(0,0,30,Math.PI*0.15,Math.PI*1.55);
  ctx.arc(7,3,24,Math.PI*1.55,Math.PI*0.15,true);
  ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle='#ffd37a';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(Math.round(temp)+'°C',0,40);
  ctx.restore();
}

function drawChart(){
  const cx=260,cy=60,cw=500,ch=260;
  ctx.fillStyle='#1c130a';
  ctx.fillRect(cx,cy,cw,ch);
  ctx.strokeStyle='#5a3a2244';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=cy+ch*i/4;
    ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx+cw,y);ctx.stroke();
  }
  const minT=130,maxT=250;
  function yFor(v){return cy+ch*(1-(v-minT)/(maxT-minT));}
  function xFor(t){return cx+cw*(t/duration);}

  // target tolerance band drawn as filled path
  ctx.beginPath();
  for(let i=0;i<targetHistory.length;i++){
    const pt=targetHistory[i];
    const x=xFor(pt.t),yHi=yFor(pt.v+tol);
    if(i===0)ctx.moveTo(x,yHi);else ctx.lineTo(x,yHi);
  }
  for(let i=targetHistory.length-1;i>=0;i--){
    const pt=targetHistory[i];
    const x=xFor(pt.t),yLo=yFor(pt.v-tol);
    ctx.lineTo(x,yLo);
  }
  ctx.closePath();
  ctx.fillStyle='#5aaa3022';
  ctx.fill();

  // target dashed curve
  ctx.setLineDash([6,5]);
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
  ctx.beginPath();
  targetHistory.forEach((pt,i)=>{
    const x=xFor(pt.t),y=yFor(pt.v);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  // actual temp curve
  ctx.strokeStyle='#ff6b35';ctx.lineWidth=3;
  ctx.beginPath();
  history.forEach((pt,i)=>{
    const x=xFor(pt.t),y=yFor(pt.v);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // current point
  if(history.length){
    const last=history[history.length-1];
    ctx.fillStyle='#ff6b35';
    ctx.beginPath();ctx.arc(xFor(last.t),yFor(last.v),5,0,Math.PI*2);ctx.fill();
  }

  ctx.strokeStyle='#fff3';ctx.lineWidth=1;
  ctx.strokeRect(cx,cy,cw,ch);

  ctx.fillStyle='#ccc';ctx.font='12px Arial';ctx.textAlign='right';
  ctx.fillText(maxT+'°C',cx-6,cy+10);
  ctx.fillText(minT+'°C',cx-6,cy+ch);
}

function drawBadBar(){
  const gx=260,gy=340,gw=500,gh=14;
  ctx.fillStyle='#2a1a0d';
  ctx.fillRect(gx,gy,gw,gh);
  const frac=Math.min(1,badTime/maxBad);
  ctx.fillStyle = frac>0.75?'#e94560':'#ffb347';
  ctx.fillRect(gx,gy,gw*frac,gh);
  ctx.strokeStyle='#fff3';ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='#ffd37a';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('oven_offtemp_label','Off-temp meter'),gx,gy-4);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2e1e10');bg.addColorStop(1,'#180f08');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#ffd37a';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('oven_title','🔥 Oven Temperature Control'),W/2,30);

  document.getElementById('score-display').textContent=I18N.t('round_score_hi','Round: {r} | Score: {s} | Hi: {h}')
    .replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));

  if(!started){
    ctx.fillStyle='#ffd37acc';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('start_hint_oven','Tap / Click / Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawOvenPanel();drawChart();drawBadBar();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+32);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  let dirInput=0;
  if(keys['ArrowUp']||keys['KeyW'])dirInput=1;
  if(keys['ArrowDown']||keys['KeyS'])dirInput=-1;
  if(touchDir!==0)dirInput=touchDir;
  temp+=dirInput*0.9*dt;
  temp=Math.max(130,Math.min(250,temp));

  timeT+=dt/60;
  target=curveFn(Math.min(timeT,duration));
  history.push({t:timeT,v:temp});
  targetHistory.push({t:timeT,v:target});
  if(history.length>900){history.shift();}
  if(targetHistory.length>900){targetHistory.shift();}

  const diff=Math.abs(temp-target);
  if(diff>tol){
    badTime+=dt/60;
    if(badTime>=maxBad){
      gameOver=true;SFX.lose();hiScore();
    }
  } else {
    badTime=Math.max(0,badTime-dt/60*0.5);
    score+=0.12*dt;
  }

  if(timeT>=duration){
    hiScore();
    score+=40+round*5;
    SFX.levelup();
    setTimeout(()=>{if(!gameOver)newRound();},300);
    started=true;
  }

  drawOvenPanel();
  drawChart();
  drawBadBar();

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
