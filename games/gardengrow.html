<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#ui{color:#a5d6a7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#plots{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,70px);gap:6px;justify-content:center;background:#3e2723;padding:10px;border-radius:14px;margin:0 auto}
.plot{background:#4e342e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;position:relative}
.plot:hover{background:#5d4037}
.plot .bar{position:absolute;bottom:4px;left:6px;right:6px;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.plot .bar-fill{height:100%;background:#8bc34a}
#shop{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px}
.seed-btn{padding:10px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.seed-btn.selected{border-color:#a5d6a7;background:rgba(165,214,167,.2)}
.seed-btn:disabled{opacity:.4;cursor:default}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Garden Grower</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">🪙 0 coins</div>
    <div id="plots"></div>
    <div id="shop"></div>
  </div>
  <div class="game-instructions">Pick a seed below, then tap an empty plot to plant it. Watch the bar fill as it grows, then tap the ripe plant to harvest for coins. Better seeds grow faster and pay more!</div>
</div>
<script>
const SEEDS=[
  {key:'carrot',emoji:'🥕',cost:0,growMs:4000,reward:8},
  {key:'tomato',emoji:'🍅',cost:30,growMs:6000,reward:16},
  {key:'corn',emoji:'🌽',cost:80,growMs:9000,reward:32},
  {key:'melon',emoji:'🍉',cost:200,growMs:14000,reward:70},
];
const ROWS=3,COLS=3;
let plots,coins,selectedSeed,unlocked;

function init(){
  plots=Array.from({length:ROWS*COLS},()=>null);
  coins=0;
  unlocked={carrot:true,tomato:false,corn:false,melon:false};
  selectedSeed='carrot';
  renderShop();
  renderPlots();
  updateUI();
  setInterval(tick,100);
}

function buySeedUnlock(seed){
  if(unlocked[seed.key]||coins<seed.cost)return;
  coins-=seed.cost;
  unlocked[seed.key]=true;
  selectedSeed=seed.key;
  renderShop();updateUI();
}

function renderShop(){
  const el=document.getElementById('shop');
  el.innerHTML='';
  SEEDS.forEach(s=>{
    const b=document.createElement('button');
    b.className='seed-btn'+(selectedSeed===s.key?' selected':'');
    if(unlocked[s.key]){
      b.textContent=`${s.emoji} ${s.key} (+${s.reward}🪙)`;
      b.onclick=()=>{selectedSeed=s.key;renderShop();};
    } else {
      b.textContent=`🔒 ${s.emoji} Unlock (${s.cost}🪙)`;
      b.disabled=coins<s.cost;
      b.onclick=()=>buySeedUnlock(s);
    }
    el.appendChild(b);
  });
}

function plant(i){
  if(plots[i])return;
  const seed=SEEDS.find(s=>s.key===selectedSeed);
  plots[i]={seed,plantedAt:Date.now(),ready:false};
  renderPlots();
}

function harvest(i){
  const p=plots[i];
  if(!p||!p.ready)return;
  coins+=p.seed.reward;
  plots[i]=null;
  renderPlots();updateUI();renderShop();
}

function tick(){
  let changed=false;
  plots.forEach(p=>{
    if(p&&!p.ready&&Date.now()-p.plantedAt>=p.seed.growMs){p.ready=true;changed=true;}
  });
  renderPlots();
  if(changed)updateUI();
}

function renderPlots(){
  const el=document.getElementById('plots');
  el.innerHTML='';
  plots.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='plot';
    if(!p){
      d.textContent='➕';
      d.onclick=()=>plant(i);
    } else if(p.ready){
      d.innerHTML=`<span style="animation:none">${p.seed.emoji}</span>`;
      d.style.background='#33691e';
      d.onclick=()=>harvest(i);
    } else {
      const pct=Math.min(100,(Date.now()-p.plantedAt)/p.seed.growMs*100);
      d.innerHTML=`🌱<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;
    }
    el.appendChild(d);
  });
}

function updateUI(){
  document.getElementById('ui').textContent=`🪙 ${coins} coins`;
}

init();
</script></body></html>
