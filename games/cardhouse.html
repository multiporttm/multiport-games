<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Card House</title><meta name="description" content="Play Card House free online — Tap or press Space to place the swinging card precisely into your house of cards. Precise placements keep it stable and build it higher; sloppy ones make it wobble and collapse."><link rel="canonical" href="https://games.multiportllc.com/games/cardhouse"><meta property="og:title" content="Card House - Multiport Games"><meta property="og:description" content="Play Card House free online — Tap or press Space to place the swinging card precisely into your house of cards. Precise placements keep it stable and build it higher; sloppy ones make it wobble and collapse."><meta property="og:url" content="https://games.multiportllc.com/games/cardhouse"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Card House","description":"Play Card House free online instantly. Tap or press Space to place the swinging card precisely into your house of cards. Precise placements keep the stability meter high and build the house taller; sloppy placements wobble the house until it collapses. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/cardhouse","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1b5e20,#a5d6a7);display:block;border-radius:8px}
#score-display{color:#e8f5e9;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#stability-wrap{width:min(92vw,400px);height:14px;background:rgba(0,0,0,.35);border-radius:7px;margin:0 auto 8px;overflow:hidden}
#stability-fill{height:100%;background:#66bb6a;width:100%;transition:width .15s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Card House</div>
  <div class="game-frame">
    <div id="score-display">Height: 0 | Best: 0</div>
    <div id="stability-wrap"><div id="stability-fill"></div></div>
    <canvas id="c" width="400" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to place the swinging card. Land each leaning pair or flat card as <b>centered</b> as possible on the layer below to keep the house stable and build it as high as you can — sloppy placements shake the stability meter and can topple the whole house!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=400,H=600;
const stabilityFill=document.getElementById('stability-fill');
const scoreDisplay=document.getElementById('score-display');

let hi=parseInt(localStorage.getItem('cardhouse_hi')||'0',10);
let score=0,stability=100,gameOver=true,started=false;
let layers=[]; // each {x,w,y,type:'pair'|'flat'}
let swing={pivotX:W/2,pivotY:60,len:80,ang:0,dir:1};
let cardW=70,cardH=100;
let dropping=false,fallingCard=null;
let baseY=H-60;
let nextType='pair';

function reset(){
  score=0;stability=100;gameOver=false;started=true;dropping=false;fallingCard=null;
  cardW=70;
  layers=[{x:W/2-cardW/2*1.6,w:cardW*1.6,y:baseY,type:'pair'}];
  swing.pivotX=W/2;swing.pivotY=60;swing.len=80;swing.ang=0;swing.dir=1;
  nextType='pair';
  updateHUD();
}

function updateHUD(){
  scoreDisplay.textContent=I18N.t('cardhouse_score_label','Height: {s} | Best: {h}').replace('{s}',score).replace('{h}',hi);
  stabilityFill.style.width=Math.max(0,stability)+'%';
  stabilityFill.style.background=stability>60?'#66bb6a':stability>30?'#ffca28':'#ef5350';
}

function currentX(){
  return swing.pivotX+Math.sin(swing.ang)*swing.len;
}

function drop(){
  if(!started||gameOver){reset();return;}
  if(dropping)return;
  dropping=true;
  const x=currentX();
  const w=nextType==='pair'?cardW*1.6:cardW;
  fallingCard={x:x-w/2,y:swing.pivotY,w,vy:2,type:nextType};
  SFX.click();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop();}});
c.addEventListener('click',drop);
c.addEventListener('touchstart',e=>{e.preventDefault();drop();},{passive:false});

function topLayer(){return layers[layers.length-1];}

function land(){
  const top=topLayer();
  const center=fallingCard.x+fallingCard.w/2;
  const topCenter=top.x+top.w/2;
  const offset=Math.abs(center-topCenter);
  const maxOffset=fallingCard.w/2+top.w/2;
  const offsetRatio=offset/maxOffset;

  if(offsetRatio>0.9){
    stability-=45;
    SFX.fail();
  } else {
    const penalty=offset*0.7;
    stability-=penalty;
    if(offset<5){
      score+=3;stability=Math.min(100,stability+4);SFX.success();
    } else {
      score+=1;SFX.point();
    }
    const newW=Math.max(30,fallingCard.w-offset*0.5);
    const newX=(center+topCenter)/2-newW/2;
    const newY=top.y-38;
    layers.push({x:newX,w:newW,y:newY,type:fallingCard.type});
    cardW=Math.max(22,cardW-1);
    nextType=nextType==='pair'?'flat':'pair';
    if(newY<160){
      const shift=160-newY;
      layers.forEach(l=>l.y+=shift);
    }
  }
  fallingCard=null;
  dropping=false;
  updateHUD();
  if(stability<=0){
    gameOver=true;
    if(score>hi){hi=score;localStorage.setItem('cardhouse_hi',hi);}
    SFX.lose();
  }
}

function drawCardPair(x,w,y,h,wobble){
  // two cards leaning together forming an inverted V
  ctx.save();
  ctx.translate(x+w/2,y);
  const lean=0.35+wobble*0.02;
  ctx.fillStyle='#fdfdfd';
  ctx.strokeStyle='#c62828';ctx.lineWidth=1.5;
  // left card
  ctx.save();ctx.rotate(-lean);ctx.translate(-w*0.02,0);
  ctx.fillRect(-w/4,-h,w/2,h);ctx.strokeRect(-w/4,-h,w/2,h);
  ctx.restore();
  // right card
  ctx.save();ctx.rotate(lean);ctx.translate(w*0.02,0);
  ctx.fillRect(-w/4,-h,w/2,h);ctx.strokeRect(-w/4,-h,w/2,h);
  ctx.restore();
  ctx.restore();
}
function drawCardFlat(x,w,y,h){
  ctx.fillStyle='#fdfdfd';
  ctx.strokeStyle='#1565c0';ctx.lineWidth=1.5;
  ctx.fillRect(x,y-h*0.18,w,h*0.18);
  ctx.strokeRect(x,y-h*0.18,w,h*0.18);
}

function drawLayer(l,wobble){
  if(l.type==='pair')drawCardPair(l.x,l.w,l.y,cardH*0.75,wobble);
  else drawCardFlat(l.x,l.w,l.y,cardH*0.75);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1b5e20');bg.addColorStop(1,'#66bb6a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,H-20,W,20);

  const wobble=(100-stability)/10;

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    layers.forEach(l=>drawLayer(l,0));
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('collapse_title','HOUSE COLLAPSED!'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+14);
    requestAnimationFrame(loop);return;
  }

  if(!dropping){
    swing.ang+=0.045*swing.dir;
    if(swing.ang>1.1){swing.ang=1.1;swing.dir=-1;}
    if(swing.ang<-1.1){swing.ang=-1.1;swing.dir=1;}
  }

  const shakeX=Math.sin(Date.now()/70)*wobble;
  ctx.save();
  ctx.translate(shakeX,0);
  layers.forEach(l=>drawLayer(l,wobble));
  ctx.restore();

  ctx.strokeStyle='#1b5e20';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(swing.pivotX-40,30);ctx.lineTo(swing.pivotX+40,30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(swing.pivotX,30);ctx.lineTo(swing.pivotX,swing.pivotY);ctx.stroke();

  const w=nextType==='pair'?cardW*1.6:cardW;
  if(dropping&&fallingCard){
    fallingCard.y+=fallingCard.vy;
    fallingCard.vy+=0.5;
    const top=topLayer();
    if(fallingCard.y>=top.y){
      fallingCard.y=top.y;
      drawLayer({x:fallingCard.x,w:fallingCard.w,y:fallingCard.y,type:fallingCard.type},wobble);
      land();
    } else {
      drawLayer({x:fallingCard.x,w:fallingCard.w,y:fallingCard.y,type:fallingCard.type},wobble);
    }
  } else {
    const x=currentX();
    ctx.strokeStyle='#5d4037';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(swing.pivotX,swing.pivotY);ctx.lineTo(x,swing.pivotY);ctx.stroke();
    drawLayer({x:x-w/2,w,y:swing.pivotY,type:nextType},0);
  }

  updateHUD();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
