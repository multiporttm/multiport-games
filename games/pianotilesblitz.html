<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#fff;cursor:pointer}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Piano Tiles Blitz</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap the black tile in each row as it reaches the bottom strike zone — anywhere in that lane's column works. Miss the tile or tap the wrong lane and it's game over. Speed increases as you go.</div>
</div>
<script>
const W=360,H=360,LANES=4,LANE_W=W/LANES,STRIKE_Y=H-50,ROW_H=90;
let tiles,score,speed,state,best=+(localStorage.getItem('pianotiles_best')||0);

function loadBest(){return +(localStorage.getItem('pianotiles_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('pianotiles_best',v);}

function init(){
  tiles=[];score=0;speed=2.2;state='play';best=loadBest();
  for(let i=0;i<4;i++)spawnTile(-i*ROW_H);
}

function spawnTile(y){
  tiles.push({lane:Math.floor(Math.random()*LANES),y,hit:false});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const lane=Math.floor(x/LANE_W);
  handleTap(lane);
});

function handleTap(lane){
  let hitOne=false;
  for(const t of tiles){
    if(t.lane===lane&&!t.hit&&Math.abs(t.y-STRIKE_Y)<50){
      t.hit=true;score++;hitOne=true;
      speed=2.2+score*0.04;
      break;
    }
  }
  if(!hitOne){
    state='over';
    saveBest(score);
  }
  updateUI();
}

function update(){
  if(state!=='play')return;
  tiles.forEach(t=>t.y+=speed);
  tiles.forEach(t=>{
    if(!t.hit&&t.y>STRIKE_Y+50){
      state='over';
      saveBest(score);
    }
  });
  tiles=tiles.filter(t=>t.y<H+100);
  const maxY=Math.max(...tiles.map(t=>t.y));
  if(maxY>-ROW_H+90)spawnTile(maxY-ROW_H);
  updateUI();
}

function draw(){
  ctx.fillStyle='#f5f5f5';ctx.fillRect(0,0,W,H);
  for(let l=1;l<LANES;l++){
    ctx.strokeStyle='#ccc';
    ctx.beginPath();ctx.moveTo(l*LANE_W,0);ctx.lineTo(l*LANE_W,H);ctx.stroke();
  }
  ctx.strokeStyle='#9c27b0';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,STRIKE_Y+30);ctx.lineTo(W,STRIKE_Y+30);ctx.stroke();

  tiles.forEach(t=>{
    if(t.hit)return;
    ctx.fillStyle='#212121';
    ctx.fillRect(t.lane*LANE_W+4,t.y-ROW_H/2+8,LANE_W-8,ROW_H-16);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ce93d8';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('MISSED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${score} | Best: ${best}`;
}

init();draw();
</script></body></html>
