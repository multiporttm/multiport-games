<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{background:linear-gradient(135deg,#e65100,#ffb74d);border-radius:14px;padding:16px;text-align:center;color:#2b1600}
#stats{font-weight:800;font-size:1.05rem;margin-bottom:8px;color:#2b1600}
#order{background:#fff8ee;border-radius:12px;padding:10px 14px;display:inline-block;margin:0 auto 10px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#orderTitle{font-weight:800;color:#e65100;margin-bottom:4px}
#orderList{display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.ing-chip{padding:3px 10px;border-radius:8px;background:#fff;font-size:.9rem;font-weight:700;border:2px solid #ffcc80;min-width:90px}
.ing-chip.done{background:#c8e6c9;border-color:#66bb6a;text-decoration:line-through;opacity:.6}
.ing-chip.next{border-color:#e65100;box-shadow:0 0 0 2px #ffe0b2}
#stackArea{background:#fff8ee;border-radius:12px;min-height:180px;width:160px;margin:0 auto 12px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
.placed{width:110px;height:20px;border-radius:8px;margin-top:-2px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#3e2200}
#flipBar{position:relative;width:280px;height:26px;background:#3e2200;border-radius:13px;margin:6px auto;overflow:hidden;display:none}
#flipZone{position:absolute;top:0;bottom:0;background:#66bb6a}
#flipMarker{position:absolute;top:-3px;width:6px;height:32px;background:#fff;border-radius:3px}
#flipHint{font-weight:700;min-height:1.4em;margin-bottom:4px}
#tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tray-btn{padding:10px 14px;border-radius:10px;border:none;background:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);color:#2b1600}
.tray-btn:active{transform:scale(.93)}
#msg{min-height:1.6em;font-weight:800;margin-top:8px;color:#b71c1c}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Burger Flip</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="stats">Burgers: 0 | Lives: 3 | Best: 0</div>
      <div id="order">
        <div id="orderTitle">Order</div>
        <div id="orderList"></div>
      </div>
      <div id="stackArea"></div>
      <div id="flipHint"></div>
      <div id="flipBar"><div id="flipZone"></div><div id="flipMarker"></div></div>
      <div id="tray"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the tray ingredients in the exact order shown on the <b>Order</b> card. When it's time for the patty, click <b>Flip!</b> while the moving marker is inside the green zone on the timing bar to cook it perfectly. Wrong order or a bad flip costs a life.</div>
</div>
<script>
const ALL_ING=[
  {id:'bunB',name:'Bottom Bun',color:'#e2a662'},
  {id:'patty',name:'Patty',color:'#6d4c41'},
  {id:'cheese',name:'Cheese',color:'#ffca28'},
  {id:'lettuce',name:'Lettuce',color:'#7cb342'},
  {id:'tomato',name:'Tomato',color:'#e53935'},
  {id:'onion',name:'Onion',color:'#eee'},
  {id:'bunT',name:'Top Bun',color:'#d98e3a'}
];

let burgers=0,lives=3,best=0,round=1,order=[],placedIdx=0,gameOver=false;
let flipping=false,flipPos=0,flipDir=1,flipRAF=null,flipZoneStart=0,flipZoneW=0;

best=parseInt(localStorage.getItem('burgerflip_hi')||'0',10);

function buildOrder(){
  const len=Math.min(5+Math.floor(round/2),ALL_ING.length);
  const pool=ALL_ING.slice(0,len);
  order=[{id:'bunB'},...pool.filter(i=>!['bunB','bunT'].includes(i.id)).sort(()=>Math.random()-0.5),{id:'bunT'}];
  // dedupe accidental double bun refs, keep unique middle set sized by round
  const midCount=Math.min(2+Math.floor(round/2),5);
  const middles=ALL_ING.filter(i=>!['bunB','bunT'].includes(i.id)).sort(()=>Math.random()-0.5).slice(0,midCount);
  // always include patty
  if(!middles.some(m=>m.id==='patty')){middles[0]=ALL_ING.find(i=>i.id==='patty');}
  order=[ALL_ING.find(i=>i.id==='bunB'),...middles,ALL_ING.find(i=>i.id==='bunT')];
  placedIdx=0;
}

function ingById(id){return ALL_ING.find(i=>i.id===id);}

function renderOrder(){
  const el=document.getElementById('orderList');
  el.innerHTML='';
  order.forEach((ing,i)=>{
    const d=document.createElement('div');
    d.className='ing-chip'+(i<placedIdx?' done':'')+(i===placedIdx?' next':'');
    d.textContent=ing.name;
    el.appendChild(d);
  });
}

function renderStack(){
  const el=document.getElementById('stackArea');
  el.innerHTML='';
  for(let i=0;i<placedIdx;i++){
    const ing=order[i];
    const p=document.createElement('div');
    p.className='placed';
    p.style.background=ing.color;
    p.textContent=ing.name;
    el.appendChild(p);
  }
}

function renderTray(){
  const el=document.getElementById('tray');
  el.innerHTML='';
  const shuffled=ALL_ING.slice().sort(()=>Math.random()-0.5);
  shuffled.forEach(ing=>{
    const b=document.createElement('button');
    b.className='tray-btn';
    b.textContent=ing.name;
    b.style.background=ing.color;
    b.onclick=()=>tryPlace(ing.id);
    el.appendChild(b);
  });
}

function setMsg(t){document.getElementById('msg').textContent=t;}
function updStats(){document.getElementById('stats').textContent=I18N.t('burger_stats','Burgers: {b} | Lives: {l} | Best: {k}').replace('{b}',burgers).replace('{l}',lives).replace('{k}',best);}

function tryPlace(id){
  if(gameOver||flipping)return;
  const expected=order[placedIdx];
  if(!expected)return;
  if(id!==expected.id){
    failAttempt(I18N.t('wrong_ingredient','Wrong ingredient! That is not next.'));
    return;
  }
  if(id==='patty'){
    startFlip();
    return;
  }
  placedIdx++;
  SFX.click();
  renderOrder();renderStack();
  if(placedIdx>=order.length)completeOrder();
}

function startFlip(){
  flipping=true;
  document.getElementById('flipHint').textContent=I18N.t('flip_hint','Click FLIP! when the marker is in the green zone!');
  const bar=document.getElementById('flipBar');
  bar.style.display='block';
  const w=280;
  flipZoneW=60-round*2>28?60-round*2:28;
  flipZoneStart=Math.random()*(w-flipZoneW);
  document.getElementById('flipZone').style.left=flipZoneStart+'px';
  document.getElementById('flipZone').style.width=flipZoneW+'px';
  flipPos=0;flipDir=1;
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  const b=document.createElement('button');
  b.className='tray-btn';
  b.textContent=I18N.t('flip_btn','FLIP!');
  b.style.background='#ffab40';
  b.onclick=doFlip;
  tray.appendChild(b);
  const speed=2.2+round*0.25;
  function anim(){
    flipPos+=flipDir*speed;
    if(flipPos>=w-6){flipPos=w-6;flipDir=-1;}
    if(flipPos<=0){flipPos=0;flipDir=1;}
    document.getElementById('flipMarker').style.left=flipPos+'px';
    flipRAF=requestAnimationFrame(anim);
  }
  anim();
}

function doFlip(){
  if(!flipping)return;
  cancelAnimationFrame(flipRAF);
  flipping=false;
  document.getElementById('flipBar').style.display='none';
  document.getElementById('flipHint').textContent='';
  const inZone=flipPos+3>=flipZoneStart&&flipPos+3<=flipZoneStart+flipZoneW;
  if(inZone){
    SFX.success();
    placedIdx++;
    renderOrder();renderStack();renderTray();
    if(placedIdx>=order.length)completeOrder();
  }else{
    failAttempt(I18N.t('bad_flip','Bad flip! The patty is ruined.'));
  }
}

function failAttempt(msg){
  SFX.error();
  lives--;
  setMsg(msg);
  updStats();
  if(lives<=0){endGame();return;}
  buildOrder();
  renderOrder();renderStack();renderTray();
  document.getElementById('flipBar').style.display='none';
  document.getElementById('flipHint').textContent='';
}

function completeOrder(){
  SFX.win();
  burgers++;
  if(burgers>best){best=burgers;localStorage.setItem('burgerflip_hi',String(best));}
  setMsg(I18N.t('burger_served','Burger served! Next order...'));
  updStats();
  round++;
  setTimeout(()=>{ if(!gameOver){ buildOrder();renderOrder();renderStack();renderTray();setMsg(''); } },900);
}

function endGame(){
  gameOver=true;
  setMsg(I18N.t('game_over_title','GAME OVER')+' — '+I18N.t('tap_restart','Tap Restart to play again'));
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  const b=document.createElement('button');
  b.className='tray-btn';
  b.textContent=I18N.t('restart_btn','Restart');
  b.style.background='#ffab40';
  b.onclick=startGame;
  tray.appendChild(b);
  SFX.lose();
}

function startGame(){
  burgers=0;lives=3;round=1;gameOver=false;
  buildOrder();
  renderOrder();renderStack();renderTray();
  updStats();
  setMsg('');
  document.getElementById('flipBar').style.display='none';
  document.getElementById('flipHint').textContent='';
}

startGame();
</script></body></html>
