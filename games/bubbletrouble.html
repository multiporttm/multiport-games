<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d47a1;cursor:pointer}
#ui{color:#bbdefb;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bubble Trouble</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Rows: 8</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap a bubble to pop it and every connected bubble of the same color (2+ needed to pop). Clear rows to shrink the stack — if bubbles reach the bottom line, it's game over!</div>
</div>
<script>
const W=360,H=360,COLS=8,ROWS=10,CELL=W/COLS;
const COLORS=['#e53935','#43a047','#fdd835','#8e24aa','#1e88e5'];
let grid,score,state,danger;

function loadBest(){return +(localStorage.getItem('bubbletrouble_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('bubbletrouble_best',v);}

function init(){
  score=0;state='play';danger=H-60;
  grid=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++)row.push(r<5?Math.floor(Math.random()*COLORS.length):-1);
    grid.push(row);
  }
}

function neighbors(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
}

function floodFind(r,c,color,visited){
  const key=r+','+c;
  if(visited.has(key))return;
  if(r<0||r>=ROWS||c<0||c>=COLS)return;
  if(grid[r][c]!==color)return;
  visited.add(key);
  neighbors(r,c).forEach(([nr,nc])=>floodFind(nr,nc,color,visited));
}

function applyGravity(){
  for(let c=0;c<COLS;c++){
    let stack=[];
    for(let r=ROWS-1;r>=0;r--){if(grid[r][c]!==-1)stack.push(grid[r][c]);}
    for(let r=ROWS-1;r>=0;r--){grid[r][c]=stack.length?stack.shift():-1;}
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  if(row<0||row>=ROWS||col<0||col>=COLS||grid[row][col]===-1)return;
  const color=grid[row][col];
  const visited=new Set();
  floodFind(row,col,color,visited);
  if(visited.size<2){SFX.error();return;}
  visited.forEach(key=>{
    const [r,cc]=key.split(',').map(Number);
    grid[r][cc]=-1;
  });
  score+=visited.size*visited.size;
  SFX.success();
  applyGravity();
  saveBest(score);
  const filled=grid.flat().filter(v=>v!==-1).length;
  if(filled===0){SFX.win();}
  updateUI();
});

function draw(){
  ctx.fillStyle='#0d47a1';ctx.fillRect(0,0,W,H);

  for(let r=0;r<ROWS;r++){
    for(let cl=0;cl<COLS;cl++){
      const v=grid[r][cl];
      if(v===-1)continue;
      const x=cl*CELL+CELL/2,y=r*CELL+CELL/2;
      ctx.fillStyle=COLORS[v];
      ctx.beginPath();ctx.arc(x,y,CELL/2-2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.beginPath();ctx.arc(x-4,y-4,4,0,Math.PI*2);ctx.fill();
    }
  }

  let maxRow=0;
  for(let r=ROWS-1;r>=0;r--){if(grid[r].some(v=>v!==-1)){maxRow=r;break;}}
  if((maxRow+1)*CELL>danger&&state==='play'){
    state='over';
    SFX.lose();
    saveBest(score);
  }

  ctx.strokeStyle='#ef5350';ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(0,danger);ctx.lineTo(W,danger);ctx.stroke();
  ctx.setLineDash([]);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#bbdefb';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('overflow_title','OVERFLOW!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('score_best','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to retry'),W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('score_best','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest());
}

init();draw();
</script></body></html>
