<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#42a5f5}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:6px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
#chuteBtn{display:block;margin:6px auto;padding:10px 26px;border-radius:10px;background:#fff;color:#1565c0;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Skydiving Freefall</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Rings: 0 | Altitude: 3000m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
    <button id="chuteBtn">🪂 PULL CHUTE</button>
  </div>
  <div class="game-instructions">Left/Right (or the D-pad) to steer through the golden rings and dodge the clouds. Pull your chute before you run out of altitude — too high and you'll drift past the landing zone, too low and it's a hard landing!</div>
</div>
<script>
const W=360,H=360;
let playerX,altitude,rings,clouds,ringCount,state,chuteOpen;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('skydivingfreefall_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('skydivingfreefall_best',v);}

function init(){
  playerX=W/2;altitude=3000;rings=[];clouds=[];ringCount=0;state='play';chuteOpen=false;
}

document.addEventListener('keydown',e=>{
  if(state==='over'){init();return;}
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')playerX-=24;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')playerX+=24;
});
document.querySelector('#dpad .left').addEventListener('click',()=>{if(state==='over')init();else playerX-=28;});
document.querySelector('#dpad .right').addEventListener('click',()=>{if(state==='over')init();else playerX+=28;});
document.getElementById('chuteBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(!chuteOpen){
    chuteOpen=true;
    SFX.swoosh();
  }
});

function spawnStuff(){
  const type=Math.random()<0.5?'ring':'cloud';
  if(type==='ring')rings.push({x:rand(40,W-40),y:-30,hit:false});
  else clouds.push({x:rand(40,W-40),y:-30});
}

function update(){
  if(state!=='play')return;
  playerX=Math.max(20,Math.min(W-20,playerX));
  const fallSpd=chuteOpen?2:6;
  altitude-=fallSpd*2;

  if(Math.random()<0.03)spawnStuff();
  rings.forEach(r=>r.y+=fallSpd);
  clouds.forEach(cl=>cl.y+=fallSpd);
  rings=rings.filter(r=>r.y<H+30);
  clouds=clouds.filter(cl=>cl.y<H+30);

  rings.forEach(r=>{
    if(!r.hit&&Math.abs(r.x-playerX)<26&&r.y>H-70&&r.y<H-20){
      r.hit=true;ringCount++;
      SFX.point();
      saveBest(ringCount);
    }
  });
  clouds.forEach(cl=>{
    if(!cl.hit&&Math.abs(cl.x-playerX)<26&&cl.y>H-70&&cl.y<H-20){
      cl.hit=true;
      SFX.hurt();
    }
  });

  if(altitude<=0){
    state='over';
    if(chuteOpen)SFX.success();else SFX.lose();
    saveBest(ringCount);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle=chuteOpen?'#81d4fa':'#42a5f5';ctx.fillRect(0,0,W,H);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  rings.forEach(r=>{if(!r.hit)ctx.fillText('⭕',r.x,r.y);});
  clouds.forEach(cl=>ctx.fillText('☁️',cl.x,cl.y));

  ctx.font='26px Arial';
  ctx.fillText(chuteOpen?'🪂':'🧑', playerX,H-45);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 24px Arial';
    ctx.fillText(chuteOpen?'SAFE LANDING!':'HARD LANDING!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Rings: ${ringCount} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap PULL CHUTE to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Rings: ${ringCount} | Altitude: ${Math.max(0,Math.floor(altitude))}m`;
}

init();draw();
</script></body></html>
