<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#6d4c41;cursor:pointer}
#ui{color:#d7ccc8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rock Climbing</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">One hold glows at a time — tap it before it fades out to grip and climb higher. Miss it or tap the wrong hold and you slip back down a bit. The window gets shorter the higher you climb!</div>
</div>
<script>
const W=360,H=360;
let holds,activeIdx,glowT,glowMax,height,best,state,climbed;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('rockclimbing_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('rockclimbing_best',v);}

function init(){best=loadBest();state='play';height=0;climbed=0;genHolds();pickNext();}
function genHolds(){
  holds=[];
  for(let i=0;i<7;i++)holds.push({x:rand(40,W-40),y:60+i*42});
}
function pickNext(){
  activeIdx=Math.floor(Math.random()*holds.length);
  glowMax=Math.max(26,55-climbed);
  glowT=glowMax;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const hold=holds[activeIdx];
  if(Math.hypot(hold.x-x,hold.y-y)<24&&glowT>0){
    climbed++;
    height=Math.max(height,climbed);
    SFX.success();
    saveBest(height);
    pickNext();
  }else{
    climbed=Math.max(0,climbed-2);
    SFX.hurt();
    pickNext();
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  glowT--;
  if(glowT<=0){
    climbed=Math.max(0,climbed-2);
    SFX.fail();
    pickNext();
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#6d4c41';ctx.fillRect(0,0,W,H);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  holds.forEach((h,i)=>{
    const active=i===activeIdx;
    ctx.globalAlpha=active?Math.max(0.3,glowT/glowMax):0.6;
    ctx.fillText(active?'🟡':'🪨',h.x,h.y);
    ctx.globalAlpha=1;
  });

  ctx.font='30px Arial';
  ctx.fillText('🧗',W/2,H-30-((climbed%7)*6));

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d7ccc8';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('fell_title','FELL!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('height_best','Height: {n}m | Best: {b}m').replace('{n}',height).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('height_best','Height: {n}m | Best: {b}m').replace('{n}',height).replace('{b}',loadBest());
}

init();draw();
</script></body></html>
