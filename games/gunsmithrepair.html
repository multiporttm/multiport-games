<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#2b2318;border-radius:14px;padding:18px;max-width:760px;margin:0 auto}
#statusRow{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;margin-bottom:10px;flex-wrap:wrap;gap:6px}
#timerWrap{background:#1a1510;border-radius:8px;height:14px;overflow:hidden;margin-bottom:12px}
#timerBar{background:#e94560;height:100%;width:100%;transition:width .1s linear}
#stageLabel{text-align:center;color:#ffd54f;font-weight:800;margin-bottom:10px;font-size:1.05rem}
#bench{background:#4a3a24;border-radius:10px;padding:16px;min-height:180px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.part{background:#8a6d3a;color:#2b2318;border:3px solid #5a3d1f;border-radius:10px;padding:14px 10px;min-width:88px;text-align:center;cursor:pointer;font-weight:700;font-size:.85rem;user-select:none;transition:transform .1s,background .15s}
.part:hover{transform:translateY(-3px)}
.part.done{background:#3d8b40;color:#fff;opacity:.55;cursor:default}
.part.broken{background:#e94560;color:#fff;animation:pulse 1s infinite}
.part.placed{background:#4caf50;color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.6)}50%{box-shadow:0 0 0 8px rgba(233,69,96,0)}}
#slotRow{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.slot{width:60px;height:40px;border:2px dashed #6b5b3a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#c9b48a}
.slot.filled{border-style:solid;background:#4caf40;color:#fff}
#msg{min-height:1.4em;color:#ffd54f;font-weight:700;text-align:center;margin-top:12px}
#lives{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gunsmith Repair</div>
  <div class="game-frame">
    <div id="table">
      <div id="statusRow">
        <span id="scoreLine">Jobs: 0 | Hi: 0</span>
        <span id="lives">❤❤❤</span>
      </div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="stageLabel">Disassemble the revolver in order</div>
      <div id="bench"></div>
      <div id="slotRow"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions"><b>Step 1:</b> click each part in the order shown to disassemble the revolver. <b>Step 2:</b> click the worn/broken part (it pulses red). <b>Step 3:</b> click the parts again in the correct reassembly order. Finish before the timer runs out!</div>
</div>
<script>
const PARTS=[
  {id:'barrel',label:'Barrel'},
  {id:'cylinder',label:'Cylinder'},
  {id:'hammer',label:'Hammer'},
  {id:'trigger',label:'Trigger'},
  {id:'grip',label:'Grip'},
  {id:'frame',label:'Frame'}
];

let score=0,hi=parseInt(localStorage.getItem('gunsmithrepair_hi')||'0',10),lives=3;
let stage='disassemble',order=[],step=0,brokenId=null,timeLeft=0,timerMax=0,rafId=null,lastTs=null,locked=false;

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function newJob(){
  locked=false;
  order=shuffle(PARTS).map(p=>p.id);
  brokenId=rand(order);
  step=0;
  stage='disassemble';
  timerMax=Math.max(14,26-Math.floor(score/3));
  timeLeft=timerMax;
  lastTs=null;
  document.getElementById('stageLabel').textContent=I18N.t('stage_disassemble','Disassemble the revolver in order');
  document.getElementById('slotRow').innerHTML='';
  document.getElementById('msg').textContent='';
  renderBench();
  updateStatus();
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(tick);
}

function renderBench(){
  const bench=document.getElementById('bench');
  bench.innerHTML='';
  const displayOrder = stage==='reassemble' ? [...order].reverse() : order;
  displayOrder.forEach(id=>{
    const p=PARTS.find(x=>x.id===id);
    const el=document.createElement('div');
    el.className='part';
    el.dataset.id=id;
    el.textContent=I18N.t('part_'+id,p.label);
    const doneIdx=displayOrder.indexOf(id);
    if(stage==='disassemble'&&doneIdx<step)el.classList.add('done');
    if(stage==='identify'&&id===brokenId)el.classList.add('broken');
    if(stage==='reassemble'&&doneIdx<step)el.classList.add('placed');
    el.onclick=()=>handleClick(id,displayOrder);
    bench.appendChild(el);
  });
}

function handleClick(id,displayOrder){
  if(locked)return;
  if(stage==='disassemble'){
    if(id===order[step]){
      step++;
      SFX.click();
      if(step>=order.length){
        stage='identify';
        document.getElementById('stageLabel').textContent=I18N.t('stage_identify','Click the worn/broken part');
        SFX.tick();
      }
      renderBench();
    }else{
      SFX.error();
      penalize();
    }
  }else if(stage==='identify'){
    if(id===brokenId){
      SFX.hit();
      step=0;
      stage='reassemble';
      document.getElementById('stageLabel').textContent=I18N.t('stage_reassemble','Reassemble in the correct order');
      renderBench();
    }else{
      SFX.error();
      penalize();
    }
  }else if(stage==='reassemble'){
    const expected=[...order].reverse()[step];
    if(id===expected){
      step++;
      SFX.click();
      renderBench();
      if(step>=order.length){
        finishJob(true);
      }
    }else{
      SFX.error();
      penalize();
    }
  }
}

function penalize(){
  timeLeft=Math.max(0,timeLeft-3);
  document.getElementById('msg').textContent=I18N.t('wrong_part_msg','Wrong part! -3 seconds.');
  setTimeout(()=>{ if(!locked) document.getElementById('msg').textContent=''; },800);
}

function finishJob(success){
  locked=true;
  if(success){
    score++;
    if(score>hi){hi=score;localStorage.setItem('gunsmithrepair_hi',hi);}
    SFX.success();
    document.getElementById('msg').textContent=I18N.t('job_done_msg','Repaired! Customer is happy.');
  }
  updateStatus();
  if(rafId)cancelAnimationFrame(rafId);
  setTimeout(()=>{ if(lives>0)newJob(); },1000);
}

function failJob(){
  locked=true;
  lives--;
  SFX.fail();
  document.getElementById('msg').textContent=I18N.t('job_failed_msg',"Time's up — the customer left unhappy!");
  updateStatus();
  if(rafId)cancelAnimationFrame(rafId);
  if(lives<=0){
    SFX.lose();
    document.getElementById('msg').textContent=I18N.t('game_over_msg','Game over! Click the bench to reopen the shop.');
    score=0;lives=3;
    setTimeout(()=>{
      document.getElementById('bench').addEventListener('click',restartOnce,{once:true});
    },50);
  }else{
    setTimeout(newJob,1200);
  }
}

function restartOnce(){
  updateStatus();
  newJob();
}

function updateStatus(){
  document.getElementById('scoreLine').textContent=I18N.t('jobs_hi_label','Jobs: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives').textContent='❤'.repeat(Math.max(lives,0))+'♡'.repeat(3-Math.max(lives,0));
}

function tick(ts){
  if(lastTs===null)lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(!locked){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;
      document.getElementById('timerBar').style.width='0%';
      failJob();
      return;
    }
    document.getElementById('timerBar').style.width=(timeLeft/timerMax*100)+'%';
  }
  rafId=requestAnimationFrame(tick);
}

document.addEventListener('keydown',e=>{
  const n=parseInt(e.key,10);
  if(n>=1&&n<=6){
    const els=document.querySelectorAll('#bench .part');
    const el=els[n-1];
    if(el)el.click();
  }
});

updateStatus();
newJob();
</script></body></html>
