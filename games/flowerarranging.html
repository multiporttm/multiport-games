<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#1f3d2c;border-radius:14px;padding:18px;text-align:center;max-width:600px;margin:0 auto}
#stats{color:#fff;font-size:1rem;font-weight:700;margin:4px 0}
#status{color:#e8f5e9;font-size:.95rem;font-weight:600;margin:6px 0;min-height:1.4em}
#order-card{background:#fdf6e3;border-radius:10px;padding:12px;margin:10px auto;max-width:360px}
#order-title{color:#8a6a1e;font-weight:800;font-size:.85rem;margin-bottom:6px}
#order-seq{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed #c9b98a;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.slot.filled{border-style:solid}
#timerWrap{background:#0e2318;border-radius:6px;height:10px;overflow:hidden;margin:10px 0}
#timerBar{height:100%;background:linear-gradient(90deg,#8bc34a,#ff9800);width:100%}
#bouquet-progress{min-height:44px;display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.chosen{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:#2e5540}
#tray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.flower-btn{width:56px;height:56px;border-radius:50%;border:none;font-size:1.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.flower-btn:active{transform:scale(.9)}
#actions button{padding:9px 22px;background:#8bc34a;border:none;border-radius:20px;color:#123;font-weight:700;cursor:pointer;font-size:1rem;margin:0 5px}
#actions button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Flower Arranging</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="stats">Bouquets: 0 | Lives: 3 | Best: 0</div>
      <div id="status">Match the order, then click Wrap</div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="order-card">
        <div id="order-title">ORDER</div>
        <div id="order-seq"></div>
      </div>
      <div id="bouquet-progress"></div>
      <div id="tray"></div>
      <div id="actions">
        <button id="wrapBtn">Wrap</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click flowers from the <b>garden tray</b> in the exact order shown on the <b>order card</b>, then click <b>Wrap</b> before time runs out. A wrong order resets your attempt and costs a <b>life</b>!</div>
</div>
<script>
const FLOWERS=[
  {id:'rose',emoji:'🌹'},
  {id:'tulip',emoji:'🌷'},
  {id:'sunflower',emoji:'🌻'},
  {id:'hibiscus',emoji:'🌺'},
  {id:'blossom',emoji:'🌸'},
  {id:'daisy',emoji:'🌼'},
];

let order=[],chosen=[],bouquets=0,lives=3,best=parseInt(localStorage.getItem('flowerarranging_best')||'0',10);
let gameOver=false,timerInterval=null,timeLeft=0,timeTotal=0,trayFlowers=[];

function genOrder(){
  const len=Math.min(3+Math.floor(bouquets/2),8);
  const trayCount=Math.min(6,4+Math.floor(bouquets/3));
  trayFlowers=FLOWERS.slice(0,trayCount);
  const seq=[];
  for(let i=0;i<len;i++){
    seq.push(trayFlowers[Math.floor(Math.random()*trayFlowers.length)]);
  }
  return seq;
}

function renderOrder(){
  const el=document.getElementById('order-seq');
  el.innerHTML='';
  order.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='slot'+(i<chosen.length?' filled':'');
    d.textContent=f.emoji;
    el.appendChild(d);
  });
}

function renderProgress(){
  const el=document.getElementById('bouquet-progress');
  el.innerHTML='';
  chosen.forEach(f=>{
    const d=document.createElement('div');
    d.className='chosen';
    d.textContent=f.emoji;
    el.appendChild(d);
  });
}

function renderTray(){
  const el=document.getElementById('tray');
  el.innerHTML='';
  trayFlowers.forEach(f=>{
    const b=document.createElement('button');
    b.className='flower-btn';
    b.textContent=f.emoji;
    b.style.background='#eef7ea';
    b.onclick=()=>pickFlower(f);
    el.appendChild(b);
  });
}

function pickFlower(f){
  if(gameOver)return;
  if(chosen.length>=order.length)return;
  chosen.push(f);
  SFX.click();
  renderOrder();
  renderProgress();
}

function clearChosen(){
  if(gameOver)return;
  chosen=[];
  renderOrder();
  renderProgress();
}

function checkSequence(){
  if(chosen.length!==order.length)return false;
  return chosen.every((f,i)=>f.id===order[i].id);
}

function wrap(){
  if(gameOver)return;
  if(checkSequence()){
    bouquets++;
    SFX.success();
    setStatus(I18N.t('fa_correct','Beautiful bouquet! 🎉'));
    nextRound();
  }else{
    lives--;
    SFX.fail();
    setStatus(I18N.t('fa_wrong','That\'s not quite right — try again!'));
    updateStats();
    if(lives<=0){
      endGame();
    }else{
      chosen=[];
      renderOrder();
      renderProgress();
      resetTimer();
    }
  }
}

function setStatus(t){document.getElementById('status').textContent=t;}

function updateStats(){
  document.getElementById('stats').textContent=
    I18N.t('fa_stats_label','Bouquets: {b} | Lives: {l} | Best: {best}')
      .replace('{b}',bouquets).replace('{l}',lives).replace('{best}',best);
}

function resetTimer(){
  clearInterval(timerInterval);
  timeTotal=6000+order.length*1400;
  timeLeft=timeTotal;
  updateTimerBar();
  timerInterval=setInterval(()=>{
    timeLeft-=100;
    updateTimerBar();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      onTimeout();
    }
  },100);
}

function updateTimerBar(){
  document.getElementById('timerBar').style.width=Math.max(0,(timeLeft/timeTotal)*100)+'%';
}

function onTimeout(){
  if(gameOver)return;
  lives--;
  SFX.error();
  setStatus(I18N.t('fa_timeout','Time\'s up! The order wilted.'));
  updateStats();
  if(lives<=0){
    endGame();
  }else{
    chosen=[];
    renderOrder();
    renderProgress();
    resetTimer();
  }
}

function nextRound(){
  order=genOrder();
  chosen=[];
  renderOrder();
  renderProgress();
  renderTray();
  updateStats();
  resetTimer();
}

function endGame(){
  gameOver=true;
  clearInterval(timerInterval);
  if(bouquets>best){best=bouquets;localStorage.setItem('flowerarranging_best',best);}
  setStatus(I18N.t('fa_game_over','Out of lives! Click New Game to try again.'));
  SFX.lose();
  document.getElementById('wrapBtn').disabled=true;
  document.getElementById('clearBtn').disabled=true;
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  const btn=document.createElement('button');
  btn.textContent=I18N.t('fa_new_game','New Game');
  btn.style.cssText='padding:10px 24px;background:#8bc34a;border:none;border-radius:20px;color:#123;font-weight:700;cursor:pointer;font-size:1rem';
  btn.onclick=startGame;
  tray.appendChild(btn);
  updateStats();
}

document.getElementById('wrapBtn').onclick=wrap;
document.getElementById('clearBtn').onclick=clearChosen;

function startGame(){
  bouquets=0;lives=3;gameOver=false;
  document.getElementById('wrapBtn').disabled=false;
  document.getElementById('clearBtn').disabled=false;
  setStatus(I18N.t('fa_intro','Match the order, then click Wrap'));
  nextRound();
}

startGame();
</script></body></html>
