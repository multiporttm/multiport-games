<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b3a4b;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ecbe9;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Zoo First Aid Station</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Match the waiting guest's symptom to the correct remedy. Press <b>1-4</b> or <b>Tap/Click</b> a remedy before time runs out. Clear enough guests before closing time — 3 mistakes and the station closes early!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HS_KEY='hs_zoofirstaidstation';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const SYMPTOMS=[
  {key:'cut',icon:'🩸',name:()=>I18N.t('sym_cut','Small Cut'),remedy:0},
  {key:'sunburn',icon:'🥵',name:()=>I18N.t('sym_sunburn','Overheated'),remedy:1},
  {key:'sting',icon:'🐝',name:()=>I18N.t('sym_sting','Bee Sting'),remedy:2},
  {key:'twist',icon:'🦶',name:()=>I18N.t('sym_twist','Twisted Ankle'),remedy:3},
  {key:'dizzy',icon:'💫',name:()=>I18N.t('sym_dizzy','Dizzy Spell'),remedy:1},
  {key:'splinter',icon:'🪵',name:()=>I18N.t('sym_splinter','Splinter'),remedy:0}
];
const REMEDIES=[
  {icon:'🩹',name:()=>I18N.t('rem_bandage','Bandage')},
  {icon:'🧊',name:()=>I18N.t('rem_cool','Cool & Hydrate')},
  {icon:'❄️',name:()=>I18N.t('rem_ice','Ice Pack')},
  {icon:'🦽',name:()=>I18N.t('rem_rest','Rest & Elevate')}
];
const remBoxes=[];
(function layout(){
  const n=REMEDIES.length,gap=20,w=(W-gap*(n+1))/n,h=150,y=260;
  for(let i=0;i<n;i++)remBoxes.push({x:gap+i*(w+gap),y,w,h});
})();

let level=1,score=0,lives=3,gameOver=false,started=false,lastTime=null;
let unlockedSymptoms=3;
let quota=0,cleared=0;
let current=null,guestTimeLeft=0,guestTimeLimit=0;
let flashBox=-1,flashColor=null,flashTimer=0;
let interBreak=0;

function pickSymptom(){
  const idx=Math.floor(Math.random()*unlockedSymptoms);
  return SYMPTOMS[idx];
}
function newLevel(){
  quota=4+level;
  cleared=0;
  unlockedSymptoms=Math.min(SYMPTOMS.length,2+level);
  nextGuest();
}
function nextGuest(){
  current=pickSymptom();
  guestTimeLimit=Math.max(3.2,7-level*0.4);
  guestTimeLeft=guestTimeLimit;
  interBreak=0;
}
function resetGame(){
  level=1;score=0;lives=3;gameOver=false;started=false;lastTime=null;
  newLevel();
}
resetGame();

function flash(i,color){flashBox=i;flashColor=color;flashTimer=16;}

function answer(i){
  if(gameOver||!started||interBreak>0)return;
  if(!current)return;
  if(i===current.remedy){
    score+=15*level;
    cleared++;
    flash(i,'#4caf50');
    SFX.success();
    if(cleared>=quota){
      score+=60*level;
      SFX.levelup();
      level++;
      interBreak=1.2;
      setTimeout(()=>{ if(!gameOver) newLevel(); },900);
    } else {
      interBreak=0.35;
      setTimeout(()=>{ if(!gameOver&&!current) return; if(!gameOver) nextGuest(); },300);
    }
  } else {
    lives--;
    flash(i,'#e94560');
    SFX.error();
    if(lives<=0){
      gameOver=true;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
    }
  }
}

function startGame(){started=true;}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4',' ','Enter'].includes(e.key))e.preventDefault();
  if(gameOver){ if(e.key===' '||e.key==='Enter')resetGame(); return; }
  startGame();
  if(e.key>='1'&&e.key<='4')answer(parseInt(e.key,10)-1);
});

function posFromEvent(evt){
  const r=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-r.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}
function handlePointer(evt){
  evt.preventDefault();
  if(gameOver){resetGame();return;}
  startGame();
  const p=posFromEvent(evt);
  for(let i=0;i<remBoxes.length;i++){
    const b=remBoxes[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){answer(i);return;}
  }
}
c.addEventListener('pointerdown',handlePointer);
c.addEventListener('touchstart',handlePointer,{passive:false});

function drawRemedy(i){
  const b=remBoxes[i],r=REMEDIES[i];
  ctx.save();
  let bg='#234b5e';
  if(flashBox===i&&flashTimer>0)bg=flashColor;
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,14):ctx.rect(b.x,b.y,b.w,b.h);ctx.fill();
  ctx.font='48px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(r.icon,b.x+b.w/2,b.y+55);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
  ctx.fillText(r.name(),b.x+b.w/2,b.y+110);
  ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';
  ctx.fillText(String(i+1),b.x+b.w/2,b.y+135);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0f2733');sky.addColorStop(1,'#1b3a4b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),16,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',lives),W-16,30);
  ctx.textAlign='center';
  ctx.fillText(I18N.t('queue_label','Guests cleared: {c}/{q}').replace('{c}',cleared).replace('{q}',quota),W/2,30);

  if(!started&&!gameOver){
    ctx.fillStyle='#7ecbe9';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('start_hint','Press 1-4 / Tap a remedy to start'),W/2,100);
  } else if(current){
    ctx.font='90px Arial';
    ctx.fillText(current.icon,W/2,150);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';
    ctx.fillText(current.name(),W/2,210);
    const pct=Math.max(0,guestTimeLeft/guestTimeLimit);
    ctx.fillStyle='#222';ctx.fillRect(W/2-180,225,360,14);
    ctx.fillStyle=pct>0.3?'#4caf50':'#e94560';
    ctx.fillRect(W/2-180,225,360*pct,14);
  } else if(interBreak>0){
    ctx.fillStyle='#4caf50';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('level_clear','Line cleared! Next shift...'),W/2,150);
  }

  remBoxes.forEach((b,i)=>drawRemedy(i));

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
  }

  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));

  if(flashTimer>0){flashTimer--; if(flashTimer<=0)flashBox=-1;}
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(started&&!gameOver&&current&&interBreak<=0){
    guestTimeLeft-=dt;
    if(guestTimeLeft<=0){
      lives--;
      SFX.hurt();
      current=null;
      if(lives<=0){
        gameOver=true;SFX.lose();
        if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
      } else {
        interBreak=0.6;
        setTimeout(()=>{ if(!gameOver) nextGuest(); },500);
      }
    }
  }
  if(interBreak>0)interBreak-=dt;

  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
