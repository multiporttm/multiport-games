<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Number Guess</title><meta name="description" content="Play Number Guess free online — Guess the secret number in 10 tries. Hot/Cold hints guide you!"><link rel="canonical" href="https://games.multiportllc.com/games/numguess"><meta property="og:title" content="Number Guess - Multiport Games"><meta property="og:description" content="Play Number Guess free online — Guess the secret number in 10 tries. Hot/Cold hints guide you!"><meta property="og:url" content="https://games.multiportllc.com/games/numguess"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Number Guess","description":"Play Number Guess free online instantly. Guess the secret number in 10 tries. Hot/Cold hints guide you! No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/numguess","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#game-area{max-width:420px;margin:0 auto;padding:24px;text-align:center}
#guess-input{padding:12px 20px;font-size:1.4rem;border-radius:8px;border:2px solid #4a148c;background:#0d1a2e;color:#fff;outline:none;width:140px;text-align:center}
#guess-input:focus{border-color:#ba68c8}
#submit-btn{padding:12px 24px;font-size:1.1rem;background:#9c27b0;border:none;border-radius:8px;color:#fff;cursor:pointer;margin-left:10px}
#history{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.guess-item{padding:8px 16px;border-radius:8px;font-size:1rem;font-weight:700}
.too-low{background:#1565c0;color:#fff}.too-high{background:#b71c1c;color:#fff}.correct{background:#2e7d32;color:#fff}
#feedback{font-size:1.3rem;font-weight:700;margin:14px 0;min-height:2rem;color:#ce93d8}
#tries{color:#aaa;margin:6px 0}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Number Guess</div>
  <div class="game-frame">
    <div id="game-area">
      <p style="color:#aaa"><span data-i18n="thinking_prompt">I'm thinking of a number between</span> <b style="color:#ce93d8">1 and 100</b></p>
      <div id="feedback">Make your first guess!</div>
      <div id="tries">Tries: 0 / 10</div>
      <div style="margin:12px 0">
        <input id="guess-input" type="number" min="1" max="100" placeholder="??">
        <button id="submit-btn" onclick="guess()"><span data-i18n="guess_btn">Guess!</span></button>
      </div>
      <div id="history"></div>
      <button id="new-btn" onclick="newGame()" style="margin-top:14px;padding:8px 20px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer"><span data-i18n="new_game">New Game</span></button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Guess the secret number in 10 tries. Hot/Cold hints guide you!</div>
</div>
<script>
let secret,tries,over,best=999;

function newGame(){
  secret=Math.floor(Math.random()*100)+1;tries=0;over=false;
  document.getElementById('feedback').textContent=I18N.t('first_guess_prompt','Make your first guess!');
  document.getElementById('tries').textContent=I18N.t('tries_label','Tries: {n} / 10').replace('{n}',0);
  document.getElementById('history').innerHTML='';
  document.getElementById('guess-input').value='';document.getElementById('guess-input').disabled=false;
  document.getElementById('guess-input').focus();
}

function guess(){
  if(over)return;
  const v=parseInt(document.getElementById('guess-input').value);
  if(!v||v<1||v>100){document.getElementById('feedback').textContent=I18N.t('enter_range','Enter 1-100!');return;}
  tries++;
  const diff=Math.abs(v-secret);
  const hist=document.getElementById('history');
  const d=document.createElement('div');d.className='guess-item';
  if(v===secret){
    d.className+=' correct';d.textContent=I18N.t('correct_mark','✓ {n} — Correct!').replace('{n}',v);hist.prepend(d);
    over=true;document.getElementById('guess-input').disabled=true;
    if(tries<best)best=tries;
    document.getElementById('feedback').textContent=I18N.t('got_it_msg','🎉 Got it in {n} tries! (Best: {b})').replace('{n}',tries).replace('{b}',best);
  } else {
    const dir=v<secret?I18N.t('too_low','📈 Too low'):I18N.t('too_high','📉 Too high');
    const heat=diff<5?I18N.t('heat_very_hot','🔥 Very hot!'):diff<15?I18N.t('heat_hot','♨️ Hot'):diff<30?I18N.t('heat_warm','😐 Warm'):I18N.t('heat_cold','🧊 Cold');
    d.className+=v<secret?' too-low':' too-high';d.textContent=`${v} — ${dir} ${heat}`;hist.prepend(d);
    document.getElementById('feedback').textContent=`${dir} ${heat}`;
    if(tries>=10){over=true;document.getElementById('guess-input').disabled=true;document.getElementById('feedback').textContent=I18N.t('out_of_tries','💀 Out of tries! It was {n}').replace('{n}',secret);}}
  document.getElementById('tries').textContent=I18N.t('tries_label','Tries: {n} / 10').replace('{n}',tries);
  document.getElementById('guess-input').value='';
}

document.getElementById('guess-input').addEventListener('keydown',e=>{if(e.code==='Enter')guess();});
newGame();
</script></body></html>
