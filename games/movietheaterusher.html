<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#160e1e;display:block;border-radius:8px;touch-action:manipulation;cursor:pointer}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;color:#f0c419;font-weight:700;font-size:1rem;flex-wrap:wrap;gap:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Movie Theater Usher</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="lives-display">Lives: 3</span></div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each guest's ticket shows a film and showtime. Click the theater door with the matching film + showtime, or press its number key (1-4), before the guest's patience runs out and they wander into a door themselves — the wrong door costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('score-display'),livesDisp=document.getElementById('lives-display');
const HI_KEY='movietheaterusher_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

const FILMS=['Star Voyage','Laugh Riot','Deep Blue','Iron Legends','Haunted Hall','Sweet Escape'];
const TIMES=['4:00','5:30','7:00','8:45'];
const DOOR_COUNT=4;
const DOOR_W=150,DOOR_H=180,DOOR_Y=60,DOOR_GAP=20;
const totalW=DOOR_COUNT*DOOR_W+(DOOR_COUNT-1)*DOOR_GAP;
const startX=(800-totalW)/2;

let doors=[];
let guests=[]; // guest queue at bottom
let score=0,hi2=hi,lives=3,gameOver=false,started=false;
let spawnTimer=0,spawnInterval=170,difficultyTimer=0;
let selectedGuest=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function setupDoors(){
  const filmPick=shuffle(FILMS).slice(0,DOOR_COUNT);
  const timePick=shuffle(TIMES);
  doors=[];
  for(let i=0;i<DOOR_COUNT;i++){
    doors.push({
      x:startX+i*(DOOR_W+DOOR_GAP),y:DOOR_Y,w:DOOR_W,h:DOOR_H,
      film:filmPick[i],time:timePick[i%timePick.length],idx:i,flash:0
    });
  }
}

function makeGuest(){
  // 60% chance ticket matches an existing door exactly (so there is always a correct answer)
  const d=doors[Math.floor(Math.random()*doors.length)];
  let film=d.film,time=d.time;
  if(Math.random()<0.35){
    // decoy: correct film wrong time, or vice versa, still must match SOME door precisely only if lucky
    if(Math.random()<0.5)time=TIMES[Math.floor(Math.random()*TIMES.length)];
    else film=FILMS[Math.floor(Math.random()*FILMS.length)];
  }
  return {film,time,x:400+(Math.random()*160-80),y:420,life:1,maxLife:1,speed:0.0016+Math.min(0.0016,score/8000)};
}

function correctDoorIndex(g){
  for(const d of doors)if(d.film===g.film&&d.time===g.time)return d.idx;
  return -1;
}

function reset(){
  score=0;lives=3;gameOver=false;started=false;guests=[];selectedGuest=null;
  spawnTimer=0;spawnInterval=170;difficultyTimer=0;
  setupDoors();
  updateHud();
}
function updateHud(){
  scoreDisp.textContent=I18N.t('score_hi_label2','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesDisp.textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',lives);
}

function pickGuest(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(guests.length)selectedGuest=guests[0];
}

function sendGuestToDoor(doorIdx){
  if(gameOver)return;
  if(!started){started=true;return;}
  if(!guests.length)return;
  const g=guests[0];
  const correct=correctDoorIndex(g);
  doors[doorIdx].flash=30;
  if(correct===doorIdx){
    score+=50+Math.round(g.life*50);
    SFX.success();
  } else {
    lives--;
    SFX.error();
  }
  guests.shift();
  selectedGuest=null;
  updateHud();
  if(hi<score){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  if(lives<=0){gameOver=true;SFX.lose();}
}

function keyToIndex(e){
  if(e.code==='Digit1'||e.code==='Numpad1')return 0;
  if(e.code==='Digit2'||e.code==='Numpad2')return 1;
  if(e.code==='Digit3'||e.code==='Numpad3')return 2;
  if(e.code==='Digit4'||e.code==='Numpad4')return 3;
  return -1;
}
document.addEventListener('keydown',e=>{
  const i=keyToIndex(e);
  if(i>=0){e.preventDefault();sendGuestToDoor(i);}
  else if(e.code==='Space'){e.preventDefault();pickGuest();}
});

function pointFromEvent(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(800/r.width),y:cy*(440/r.height)};
}
function handleTap(e){
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const p=pointFromEvent(e);
  for(const d of doors){
    if(p.x>=d.x&&p.x<=d.x+d.w&&p.y>=d.y&&p.y<=d.y+d.h){
      sendGuestToDoor(d.idx);return;
    }
  }
}
c.addEventListener('click',handleTap);
c.addEventListener('touchstart',handleTap,{passive:false});

function drawDoor(d){
  ctx.save();
  ctx.fillStyle=d.flash>0?'#4caf50':'#5c3a21';
  ctx.fillRect(d.x,d.y,d.w,d.h);
  ctx.strokeStyle='#2a1810';ctx.lineWidth=4;
  ctx.strokeRect(d.x,d.y,d.w,d.h);
  ctx.fillStyle='#f0c419';
  ctx.fillRect(d.x+10,d.y+10,d.w-20,30);
  ctx.fillStyle='#160e1e';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('screen_label','Screen {n}').replace('{n}',d.idx+1),d.x+d.w/2,d.y+30);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
  wrapText(d.film,d.x+d.w/2,d.y+65,d.w-16,16);
  ctx.fillStyle='#ffd54f';ctx.font='bold 16px Arial';
  ctx.fillText(d.time,d.x+d.w/2,d.y+d.h-20);
  ctx.fillStyle='#ddd';ctx.font='11px Arial';
  ctx.fillText('['+(d.idx+1)+']',d.x+d.w/2,d.y+d.h-6);
  if(d.flash>0)d.flash--;
  ctx.restore();
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;
  }
  lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
}

function drawGuest(g,i,isFirst){
  ctx.save();
  const y=g.y-i*46;
  ctx.fillStyle=isFirst?'#ff9f43':'#8b6b9f';
  ctx.beginPath();ctx.arc(g.x,y,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5deb3';ctx.beginPath();ctx.arc(g.x,y-18,9,0,Math.PI*2);ctx.fill();
  if(isFirst){
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.font='bold 13px Arial';ctx.textAlign='center';
    const label=g.film+' · '+g.time;
    ctx.strokeText(label,g.x,y-32);
    ctx.fillText(label,g.x,y-32);
    // patience bar
    ctx.fillStyle='#333';ctx.fillRect(g.x-30,y+22,60,6);
    ctx.fillStyle=g.life>0.4?'#4caf50':'#ff5252';
    ctx.fillRect(g.x-30,y+22,60*g.life,6);
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,800,440);
  const bg=ctx.createLinearGradient(0,0,0,440);
  bg.addColorStop(0,'#241531');bg.addColorStop(1,'#160e1e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,440);

  doors.forEach(drawDoor);

  ctx.fillStyle='#aaa';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('lobby_label','LOBBY'),400,270);

  if(!started){
    ctx.fillStyle='#f0c419';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Tap a door or press 1-4 to start'),400,310);
    requestAnimationFrame(loop);return;
  }
  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,310);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,340);
    requestAnimationFrame(loop);return;
  }

  spawnTimer++;
  difficultyTimer++;
  spawnInterval=Math.max(70,170-Math.floor(difficultyTimer/600)*8);
  if(spawnTimer>=spawnInterval&&guests.length<6){
    spawnTimer=0;
    guests.push(makeGuest());
  }

  guests.forEach((g,i)=>{
    if(i===0){
      g.life-=g.speed;
      if(g.life<=0){
        // wander in on their own
        const correct=correctDoorIndex(g);
        const chosen=Math.floor(Math.random()*doors.length);
        doors[chosen].flash=30;
        if(chosen===correct){score+=10;SFX.point();}
        else{lives--;SFX.hurt();}
        updateHud();
        guests.shift();
        if(lives<=0){gameOver=true;SFX.lose();}
      }
    }
  });

  guests.slice(0,5).forEach((g,i)=>drawGuest(g,i,i===0));

  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
