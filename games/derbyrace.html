<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8d6e42;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe0b2;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#tapBtn{display:block;margin:10px auto 0;padding:12px 34px;background:#c62828;border:none;border-radius:24px;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer;touch-action:manipulation}
#tapBtn:active{background:#8e1c1c}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Derby Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="320"></canvas>
    <button id="tapBtn">TAP TO URGE</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap <b>Space</b> or the <b>TAP TO URGE</b> button rhythmically to urge your horse forward. Tapping too fast tires your horse (watch the stamina meter) while tapping too slow loses ground. Race against 5 rivals to the finish line!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const TRACK_LEN=2400;
const LANE_H=42;
const NUM_HORSES=6; // 1 player + 5 AI

let wins=0,bestTime=null;
try{wins=parseInt(localStorage.getItem('derbyrace_wins')||'0');}catch(e){}
try{const b=localStorage.getItem('derbyrace_best_time');bestTime=b?parseFloat(b):null;}catch(e){}

let horses=[];
let raceStarted=false,raceOver=false,winnerIdx=-1,countdown=0,raceTime=0;
let lastTapTime=-999;

const colors=['#1565c0','#c62828','#2e7d32','#f9a825','#6a1b9a','#00838f'];
const names=['You','Thunder','Blaze','Storm','Comet','Shadow'];

function initHorses(){
  horses=[];
  for(let i=0;i<NUM_HORSES;i++){
    horses.push({
      x:0,speed:0,stamina:100,lane:i,color:colors[i],name:names[i],finished:false,finishTime:0,
      aiRhythm: 22+Math.random()*8, aiTimer:Math.random()*10
    });
  }
}

function startCountdown(){
  initHorses();
  raceStarted=false;raceOver=false;winnerIdx=-1;raceTime=0;
  countdown=3;
  const iv=setInterval(()=>{
    countdown--;
    SFX.tick();
    if(countdown<=0){
      clearInterval(iv);
      raceStarted=true;
      SFX.jump();
    }
  },800);
}

function tap(){
  if(!raceStarted||raceOver)return;
  const p=horses[0];
  if(p.finished)return;
  const now=performance.now();
  const gap=now-lastTapTime;
  lastTapTime=now;
  // ideal rhythm ~ 220-320ms; too fast drains stamina fast, too slow gives little boost
  if(p.stamina>5){
    const boost=gap<140?2.2:(gap<450?4.5:2.8);
    p.speed=Math.min(9,p.speed+boost);
    const drain=gap<140?6:(gap<450?2.5:1.2);
    p.stamina=Math.max(0,p.stamina-drain);
    SFX.click();
  }
}

function handleAction(){
  if(raceOver||(!raceStarted&&countdown<=0)){startCountdown();return;}
  tap();
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    handleAction();
  }
});
document.getElementById('tapBtn').addEventListener('click',handleAction);
document.getElementById('tapBtn').addEventListener('touchstart',e=>{
  e.preventDefault();
  handleAction();
},{passive:false});

function updateHorses(dt){
  horses.forEach((h,i)=>{
    if(h.finished)return;
    if(i===0){
      // player: natural decel + stamina regen when not tapping hard
      h.speed=Math.max(0,h.speed-0.05*dt);
      h.stamina=Math.min(100,h.stamina+0.06*dt);
    }else{
      // AI rhythm-based
      h.aiTimer+=dt;
      if(h.aiTimer>=h.aiRhythm){
        h.aiTimer=0;
        if(h.stamina>5){
          h.speed=Math.min(8.3,h.speed+3.2);
          h.stamina=Math.max(0,h.stamina-2.2);
        }
      }
      h.speed=Math.max(0,h.speed-0.05*dt);
      h.stamina=Math.min(100,h.stamina+0.05*dt);
    }
    h.x+=h.speed*dt;
    if(h.x>=TRACK_LEN&&!h.finished){
      h.finished=true;
      h.finishTime=raceTime;
      if(winnerIdx===-1)winnerIdx=i;
    }
  });
}

function drawTrack(){
  ctx.fillStyle='#8d6e42';ctx.fillRect(0,0,W,H);
  for(let i=0;i<NUM_HORSES;i++){
    ctx.fillStyle=i%2===0?'#9c7c4d':'#8d6e42';
    ctx.fillRect(0,20+i*LANE_H,W,LANE_H);
  }
  // finish line
  ctx.fillStyle='#fff';
  for(let y=20;y<20+NUM_HORSES*LANE_H;y+=10){
    ctx.fillStyle=(Math.floor(y/10)%2===0)?'#222':'#fff';
    ctx.fillRect(W-70,y,10,10);
  }
}

function drawHorse(h,i){
  const trackW=W-140;
  const px=40+Math.min(1,h.x/TRACK_LEN)*trackW;
  const py=20+i*LANE_H+LANE_H/2;
  ctx.fillStyle=h.color;
  ctx.beginPath();ctx.ellipse(px,py,16,9,0,0,7);ctx.fill();
  ctx.fillRect(px+10,py-14,6,14);
  ctx.fillStyle='#3e2723';
  ctx.fillRect(px-20,py+6,4,10);
  ctx.fillRect(px+14,py+6,4,10);
  ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='left';
  ctx.fillText(h.name,6,py-10);
}

function drawStamina(){
  const p=horses[0];
  if(!p)return;
  const x=20,y=H-24,w=200,h=14;
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(x,y,w,h);
  const pct=p.stamina/100;
  ctx.fillStyle=pct>0.4?'#4caf50':(pct>0.15?'#ffb300':'#e53935');
  ctx.fillRect(x,y,w*pct,h);
  ctx.strokeStyle='#fff';ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('stamina_label','Stamina'),x,y-4);
}

function finishRace(){
  raceOver=true;
  if(winnerIdx===0){
    wins++;
    try{localStorage.setItem('derbyrace_wins',wins);}catch(e){}
    if(bestTime===null||raceTime<bestTime){
      bestTime=raceTime;
      try{localStorage.setItem('derbyrace_best_time',bestTime);}catch(e){}
    }
    SFX.win();
  }else{
    SFX.lose();
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawTrack();

  if(horses.length===0){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('derby_start_hint','Space / Tap button to start the race'),W/2,H/2);
  }else{
    horses.forEach((h,i)=>drawHorse(h,i));
    drawStamina();

    if(countdown>0){
      ctx.fillStyle='#fff';ctx.font='bold 60px Arial';ctx.textAlign='center';
      ctx.fillText(String(countdown),W/2,H/2);
    }else if(raceStarted&&!raceOver){
      raceTime+=dt/60;
      updateHorses(dt);
      const allDone=horses.every(h=>h.finished)||horses[0].finished;
      if(winnerIdx!==-1 && (horses[0].finished || horses.filter(h=>h.finished).length>=NUM_HORSES)){
        finishRace();
      }
      ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='right';
      ctx.fillText(raceTime.toFixed(1)+'s',W-14,20);
    }else if(raceOver){
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
      ctx.fillText(winnerIdx===0?I18N.t('you_win_race_title','YOU WIN THE RACE!'):I18N.t('you_lose_race_title','RACE LOST'),W/2,H/2-16);
      ctx.font='18px Arial';
      ctx.fillText(I18N.t('finish_time_label','Your time: {t}s').replace('{t}',horses[0].finishTime?horses[0].finishTime.toFixed(1):raceTime.toFixed(1)),W/2,H/2+16);
      ctx.font='16px Arial';
      ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+46);
    }
  }

  document.getElementById('score-display').textContent=I18N.t('derby_score_label','Wins: {w} | Best Time: {t}').replace('{w}',wins).replace('{t}',bestTime!==null?bestTime.toFixed(1)+'s':'--');

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
