<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#2b1a33;border-radius:14px;padding:18px;text-align:center;max-width:640px;margin:0 auto}
#score-display{color:#ff70a6;font-size:1.15rem;font-weight:800;padding:4px}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:4px 0;min-height:1.5em}
#timerbar-wrap{background:#1a0e1f;border-radius:8px;height:14px;overflow:hidden;margin:8px auto;max-width:520px}
#timerbar{height:100%;background:#ff70a6;width:100%;transition:width .1s linear}
#order-card{background:#fff0f6;border-radius:12px;padding:12px;margin:12px auto;max-width:520px;color:#3a1a2c}
#order-title{font-weight:900;color:#e0447b;margin-bottom:6px}
#order-seq{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.order-icon{width:42px;height:42px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid #e0447b}
#cupcake-preview{margin:14px auto;position:relative;width:140px;height:140px}
#progress-seq{display:flex;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap;min-height:30px}
.prog-icon{width:30px;height:30px;border-radius:6px;background:#4caf50;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem}
#tray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.tray-icon{width:56px;height:56px;border-radius:12px;background:#fff;border:2px solid #d1a3c2;display:flex;align-items:center;justify-content:center;font-size:1.7rem;cursor:pointer;transition:transform .1s}
.tray-icon:hover{transform:scale(1.08)}
.tray-icon:active{transform:scale(.92)}
#donebtn{margin-top:10px;padding:11px 30px;font-size:1.05rem;font-weight:800;border:none;border-radius:22px;background:#ff70a6;color:#3a1a2c;cursor:pointer}
#donebtn:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cupcake Decorating</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="score-display">Cupcakes: 0 | Hi: 0 | Lives: 3</div>
      <div id="status">Get ready to decorate!</div>
      <div id="timerbar-wrap"><div id="timerbar"></div></div>
      <div id="order-card">
        <div id="order-title">Order:</div>
        <div id="order-seq"></div>
      </div>
      <div id="progress-seq"></div>
      <div id="tray"></div>
      <button id="donebtn">Done</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the decoration icons from the tray in the <b>exact order</b> shown on the order card, then click <b>Done</b> before the timer runs out. A wrong order resets your attempt and costs a life!</div>
</div>
<script>
const FROSTINGS=[{k:'f_pink',e:'🩷',c:'pink'},{k:'f_choc',e:'🟤',c:'chocolate'},{k:'f_vanilla',e:'⚪',c:'vanilla'},{k:'f_mint',e:'🟢',c:'mint'}];
const TOPPINGS=[{k:'t_cherry',e:'🍒',c:'cherry'},{k:'t_straw',e:'🍓',c:'strawberry'},{k:'t_choc',e:'🍫',c:'choc chip'},{k:'t_star',e:'⭐',c:'star'}];
const SPRINKLES=[{k:'s_rainbow',e:'🌈',c:'rainbow'},{k:'s_gold',e:'✨',c:'gold'},{k:'s_dot',e:'🔴',c:'red dot'},{k:'s_heart',e:'💛',c:'heart'}];
const ALL=[...FROSTINGS,...TOPPINGS,...SPRINKLES];

let score=0,lives=3,hi=parseInt(localStorage.getItem('cupcake_hi')||'0',10),decorated=0;
let order=[],progress=[],orderLen=3,timeLimit=8000,timerStart=0,timerId=null,gameOver=false;

function setStatus(t){document.getElementById('status').textContent=t;}
function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('cupcakes_hi_lives_label','Cupcakes: {c} | Hi: {h} | Lives: {l}')
      .replace('{c}',decorated).replace('{h}',hi).replace('{l}',lives);
}

function pick(n){
  const items=[];
  for(let i=0;i<n;i++){
    items.push(ALL[Math.floor(Math.random()*ALL.length)]);
  }
  return items;
}

function newOrder(){
  order=pick(orderLen);
  progress=[];
  renderOrder();
  renderProgress();
  startTimer();
}

function renderOrder(){
  const seq=document.getElementById('order-seq');
  seq.innerHTML='';
  order.forEach(it=>{
    const d=document.createElement('div');
    d.className='order-icon';
    d.textContent=it.e;
    seq.appendChild(d);
  });
}

function renderProgress(){
  const p=document.getElementById('progress-seq');
  p.innerHTML='';
  progress.forEach(it=>{
    const d=document.createElement('div');
    d.className='prog-icon';
    d.textContent=it.e;
    p.appendChild(d);
  });
}

function renderTray(){
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  ALL.forEach(it=>{
    const b=document.createElement('div');
    b.className='tray-icon';
    b.textContent=it.e;
    b.title=it.c;
    b.onclick=()=>clickIcon(it);
    tray.appendChild(b);
  });
}

function clickIcon(it){
  if(gameOver)return;
  const idx=progress.length;
  if(idx>=order.length)return;
  if(order[idx].k===it.k){
    progress.push(it);
    renderProgress();
    SFX.select();
    if(progress.length===order.length){
      setStatus('Sequence complete! Click Done!');
    }
  }else{
    failAttempt('Wrong order! That reset your cupcake.');
  }
}

function startTimer(){
  clearInterval(timerId);
  timerStart=performance.now();
  document.getElementById('timerbar').style.width='100%';
  timerId=setInterval(()=>{
    const elapsed=performance.now()-timerStart;
    const pct=Math.max(0,100-(elapsed/timeLimit*100));
    document.getElementById('timerbar').style.width=pct+'%';
    if(elapsed>=timeLimit){
      clearInterval(timerId);
      failAttempt("Time's up! Order not finished.");
    }
  },50);
}

function failAttempt(msg){
  clearInterval(timerId);
  lives--;
  SFX.error();
  setStatus(msg+' Lives: '+lives);
  updateHud();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(()=>{ if(!gameOver) newOrder(); },900);
  }
}

document.getElementById('donebtn').addEventListener('click',()=>{
  if(gameOver)return;
  if(progress.length===order.length&&order.every((o,i)=>o.k===progress[i].k)){
    clearInterval(timerId);
    const elapsed=performance.now()-timerStart;
    const speedBonus=Math.max(0,Math.floor((timeLimit-elapsed)/100));
    score+=50+speedBonus;
    decorated++;
    if(score>hi){hi=score;localStorage.setItem('cupcake_hi',hi);}
    SFX.success();
    setStatus('Cupcake decorated! +'+(50+speedBonus)+' points');
    orderLen=Math.min(7,orderLen+ (Math.random()<0.5?1:0));
    timeLimit=Math.max(4000,timeLimit-200);
    updateHud();
    setTimeout(()=>{ if(!gameOver) newOrder(); },700);
  }else{
    failAttempt('Not finished yet! Match the full order first.');
  }
});

function endGame(){
  gameOver=true;
  clearInterval(timerId);
  SFX.lose();
  document.getElementById('donebtn').disabled=true;
  document.getElementById('tray').innerHTML='';
  setStatus(I18N.t('game_over_msg','GAME OVER — Cupcakes decorated: {n} | Hi: {h}').replace('{n}',decorated).replace('{h}',hi)+ ' — Tap card to restart');
  document.getElementById('order-card').onclick=restart;
}

function restart(){
  score=0;lives=3;orderLen=3;timeLimit=8000;gameOver=false;decorated=0;
  document.getElementById('donebtn').disabled=false;
  document.getElementById('order-card').onclick=null;
  renderTray();
  updateHud();
  newOrder();
}

renderTray();
updateHud();
newOrder();
</script></body></html>
