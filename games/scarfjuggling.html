<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Scarf Juggling - Multiport Games</title><meta name="description" content="Play Scarf Juggling free online — Click or tap a floating scarf right as it drifts within reach to catch and re-toss it. Keep every scarf airborne to build your combo."><link rel="canonical" href="https://games.multiportllc.com/games/scarfjuggling"><meta property="og:title" content="Scarf Juggling - Multiport Games"><meta property="og:description" content="Play Scarf Juggling free online — Click or tap a floating scarf right as it drifts within reach to catch and re-toss it. Keep every scarf airborne to build your combo."><meta property="og:url" content="https://games.multiportllc.com/games/scarfjuggling"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Scarf Juggling","description":"Play Scarf Juggling free online instantly. Juggle several colorful scarves that float and drift in slow-motion physics. Click or tap each scarf as it nears your hand to catch and re-toss it, keeping every scarf airborne without a drop to build the longest combo. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/scarfjuggling","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#1a1a3a,#2d2d5a);display:block;border-radius:8px;touch-action:none}
#hud{color:#f0e6ff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Scarf Juggling</div>
  <div class="game-frame">
    <div id="hud"><span>Combo: <b id="comboVal">0</b></span><span>Best: <b id="bestVal">0</b></span><span>Scarves: <b id="scarfCount">3</b></span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap a scarf when it drifts down near your <b>hand zone</b> at the bottom to catch and re-toss it. Scarves fall slowly and float — miss one and it drops, ending your combo. A new scarf joins every 8 catches. Keep the longest combo alive!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const HI_KEY='scarfjuggling_hi';
let best=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let combo=0,dropped=false,started=false,lastCombo=0;
const handZoneY=H-70,handZoneH=50;
const colors=['#ff6b9d','#ffd166','#7ec8ff','#a78bfa','#7ec850','#ff9f5b'];

function makeScarf(x,color,delay){
  return {
    x, y:60+Math.random()*40, vx:(Math.random()-0.5)*0.6, vy:-2.4-Math.random()*0.6,
    color, state:'idle', // idle(flying), caught, falling
    swayPhase:Math.random()*Math.PI*2, swaySpeed:0.02+Math.random()*0.015,
    grabbed:false, delay:delay||0, w:46,h:70,
  };
}

let scarves=[];
function resetGame(){
  combo=0;dropped=false;
  scarves=[
    makeScarf(W*0.3,colors[0],0),
    makeScarf(W*0.5,colors[1],20),
    makeScarf(W*0.7,colors[2],40),
  ];
  updateHud();
}

function updateHud(){
  document.getElementById('comboVal').textContent=combo;
  document.getElementById('bestVal').textContent=best;
  document.getElementById('scarfCount').textContent=scarves.length;
}

function addScarfIfDue(){
  if(scarves.length<7 && combo>0 && combo%8===0 && !scarves._justAdded){
    scarves.push(makeScarf(80+Math.random()*(W-160),colors[scarves.length%colors.length],0));
    scarves._justAdded=true;
    SFX.powerup();
  }
  if(combo%8!==0)scarves._justAdded=false;
}

function tossScarf(s){
  s.state='idle';
  s.vy=-(4.4+Math.random()*1.0);
  s.vx=(Math.random()-0.5)*1.2;
  s.grabbed=false;
}

const GRAV=0.028; // slow floaty gravity, much less than a ball

function update(dt){
  if(!started||dropped)return;
  scarves.forEach(s=>{
    if(s.state==='caught')return;
    s.swayPhase+=s.swaySpeed*dt;
    s.vy+=GRAV*dt;
    s.y+=s.vy*dt;
    s.x+=s.vx*dt+Math.sin(s.swayPhase)*0.35;
    if(s.x<30){s.x=30;s.vx*=-0.6;}
    if(s.x>W-30){s.x=W-30;s.vx*=-0.6;}
    if(s.y> H-20 && s.state!=='falling'){
      s.state='falling';
    }
    if(s.y>H+40 && !dropped){
      dropped=true;
      SFX.lose();
      onDrop();
    }
  });
}

function onDrop(){
  lastCombo=combo;
  combo=0;
  updateHud();
  setTimeout(()=>{ resetGame(); started=true; },1300);
}

function tryCatch(px,py){
  if(!started){ started=true; return; }
  if(dropped)return;
  let best_=null,bestDist=Infinity;
  scarves.forEach(s=>{
    if(s.state==='caught')return;
    const d=Math.hypot(s.x-px,s.y-py);
    if(d<70 && s.y>handZoneY-40 && d<bestDist){bestDist=d;best_=s;}
  });
  if(best_){
    combo++;
    if(combo>best){best=combo;localStorage.setItem(HI_KEY,String(best));}
    SFX.catch();
    tossScarf(best_);
    addScarfIfDue();
    updateHud();
  }
}

c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const px=(e.clientX-r.left)*(W/r.width);
  const py=(e.clientY-r.top)*(H/r.height);
  tryCatch(px,py);
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started){started=true;return;}
    if(dropped)return;
    // catch the lowest scarf near hand zone
    let lowest=null;
    scarves.forEach(s=>{ if(s.state!=='caught' && s.y>handZoneY-60 && (!lowest||s.y>lowest.y)) lowest=s; });
    if(lowest)tryCatch(lowest.x,lowest.y);
  }
});

function drawScarf(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  const wave=Math.sin(s.swayPhase*2)*6;
  ctx.fillStyle=s.color;
  ctx.beginPath();
  ctx.moveTo(-s.w/2,0);
  ctx.quadraticCurveTo(wave,s.h*0.4,-s.w/2+4,s.h*0.7);
  ctx.quadraticCurveTo(0,s.h,s.w/2-4,s.h*0.7);
  ctx.quadraticCurveTo(-wave,s.h*0.4,s.w/2,0);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#fff';
  ctx.fillRect(-s.w/2,-2,s.w,6);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1a3a');sky.addColorStop(1,'#2d2d5a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // hand zone
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(0,handZoneY,W,handZoneH);
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(0,handZoneY);ctx.lineTo(W,handZoneY);ctx.stroke();
  ctx.setLineDash([]);

  scarves.forEach(drawScarf);

  ctx.textAlign='center';
  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to start juggling'),W/2,H/2);
  } else if(dropped){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('dropped_title','SCARF DROPPED!'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_combo','Final combo: {c}').replace('{c}',lastCombo),W/2,H/2+24);
  }
}

let lastT=null;
function loop(t){
  const dt=lastT===null?1:Math.min((t-lastT)/16.6667,3);
  lastT=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script></body></html>
