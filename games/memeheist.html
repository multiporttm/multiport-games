<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#timer-bar{height:8px;background:#8e24aa;margin:0 20px 10px;border-radius:4px;transition:width .3s linear}
#bases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:480px;margin:0 auto;padding:10px 16px}
.base{background:rgba(255,255,255,.06);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;user-select:none}
.base .emoji{font-size:2.4rem}
.meter{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px;position:relative}
.meter-fill{position:absolute;top:0;left:0;height:100%;width:100%}
.base .coins{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:4px}
#msg{text-align:center;font-weight:700;min-height:24px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Meme Heist</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">🪙 0 | Best: 0 | ⏱ 45s</div>
    <div id="timer-bar" style="width:100%"></div>
    <div id="bases"></div>
    <div id="msg" data-i18n="click_base_start">Click a base to start!</div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each base has a guard meter that cycles through safe (green), risky (yellow), and danger (red) zones. Click while it's green to steal coins — click during red and you get caught, losing coins instead!</div>
</div>
<script>
const N=6,TIME=45;
const EMOJI=['🏠','🏚️','🏦','🏰','⛺','🏢'];
let bases,coins,best,timeLeft,active,timer,tickTimer;

function loadBest(){return +(localStorage.getItem('memeheist_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('memeheist_best',v);}

function init(){
  bases=Array.from({length:N},(_,i)=>({emoji:EMOJI[i],phase:Math.random()*100,speed:1+Math.random()*1.2,cooldown:0}));
  coins=0;best=loadBest();timeLeft=TIME;active=false;
  clearInterval(timer);clearInterval(tickTimer);
  render();
  document.getElementById('msg').textContent=I18N.t('click_base_start','Click a base to start!');
  document.getElementById('timer-bar').style.width='100%';
  updateUI();
}

function zoneAt(phase){
  const p=phase%100;
  if(p<50)return 'safe';
  if(p<75)return 'risk';
  return 'danger';
}
function zoneColor(z){return z==='safe'?'#66bb6a':z==='risk'?'#ffca28':'#ef5350';}
const ZONE_KEYS={safe:'zone_safe',risk:'zone_risk',danger:'zone_danger'};
function zoneLabel(z){return I18N.t(ZONE_KEYS[z],z);}

function startGame(){
  active=true;
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer-bar').style.width=(timeLeft/TIME*100)+'%';
    updateUI();
    if(timeLeft<=0){
      active=false;clearInterval(timer);clearInterval(tickTimer);
      SFX.lose();
      saveBest(coins);best=loadBest();
      document.getElementById('msg').textContent='⏱ '+I18N.t('times_up_stole','Time\'s up! You stole {n} coins.').replace('{n}',coins);
      document.getElementById('msg').style.color='#ce93d8';
      updateUI();
    }
  },1000);
  tickTimer=setInterval(()=>{
    bases.forEach(b=>{b.phase+=b.speed;if(b.cooldown>0)b.cooldown--;});
    render();
  },60);
}

function steal(i){
  if(!active){startGame();}
  const b=bases[i];
  if(b.cooldown>0)return;
  const z=zoneAt(b.phase);
  b.cooldown=15;
  if(z==='safe'){
    const gain=10+Math.floor(Math.random()*15);
    coins+=gain;
    SFX.coin();
    flashMsg('✅ '+I18N.t('stole_coins','Stole {n} coins!').replace('{n}',gain),'#69f0ae');
  } else if(z==='risk'){
    const gain=5;
    coins+=gain;
    SFX.tick();
    flashMsg('⚠️ '+I18N.t('risky_steal','Risky steal, only +{n}').replace('{n}',gain),'#ffca28');
  } else {
    const loss=Math.min(coins,15);
    coins-=loss;
    SFX.hurt();
    flashMsg('🚨 '+I18N.t('caught_lose_coins','Caught! -{n} coins').replace('{n}',loss),'#ff5252');
  }
  updateUI();
}

function flashMsg(txt,color){
  const m=document.getElementById('msg');
  m.textContent=txt;m.style.color=color;
}

function render(){
  const el=document.getElementById('bases');
  el.innerHTML='';
  bases.forEach((b,i)=>{
    const z=zoneAt(b.phase);
    const d=document.createElement('div');
    d.className='base';
    d.innerHTML=`<div class="emoji">${b.emoji}</div>
      <div class="meter"><div class="meter-fill" style="background:${zoneColor(z)};opacity:${b.cooldown>0?.3:1}"></div></div>
      <div class="coins">${b.cooldown>0?I18N.t('cooldown_label','cooldown…'):zoneLabel(z)}</div>`;
    d.onclick=()=>steal(i);
    el.appendChild(d);
  });
}

function updateUI(){
  document.getElementById('ui').textContent='🪙 '+coins+' | '+I18N.t('best_label','Best: {b}').replace('{b}',Math.max(best,coins))+' | ⏱ '+Math.max(0,timeLeft)+'s';
}

init();
</script></body></html>
