<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;touch-action:none;background:#0b3d2e}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:1rem;padding:6px 10px;max-width:760px;margin:0 auto}
#hud span{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Table Tennis Rally</div>
  <div class="game-frame" style="padding:10px">
    <div id="hud"><div>You: <span id="pVal">0</span></div><div>Game <span id="gVal">1</span></div><div>CPU: <span id="cVal">0</span></div></div>
    <canvas id="c" width="760" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your paddle up/down with <b>Arrow keys/WASD</b> or drag. <b>Click/Tap</b> to swing when the ball is close. Long rallies add spin and speed — watch for smash chances! First to <b>11</b> points, win by 2 — the CPU gets tougher each game.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,MIDX=W/2;
const BALL_R=7,REACH=60,TARGET=11;
const PLAYER_X=42,AI_X=W-42;
const KEY='tabletennisrally_best';
let best=parseInt(localStorage.getItem(KEY)||'0',10);

let pScore=0,cScore=0,gameNum=1,level=1,state='idle';
let player={x:PLAYER_X,y:H/2,vy:0};
let ai={x:AI_X,y:H/2};
let ball={x:MIDX,y:H/2,vx:5,vy:2,spin:0};
let rallyLen=0;
let keys={};
let pointer={active:false,y:player.y};
let swingFlashP=0,swingFlashA=0;
let lastTime=null;

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function serve(dir){
  ball={x:MIDX,y:H/2+(Math.random()-0.5)*80,vx:4.6*dir,vy:(Math.random()-0.5)*4,spin:0};
  rallyLen=0;
}

function startMatch(){
  pScore=0;cScore=0;gameNum=1;level=1;state='play';
  player={x:PLAYER_X,y:H/2,vy:0};ai={x:AI_X,y:H/2};
  serve(Math.random()<0.5?1:-1);
}
function nextGame(){
  gameNum++;level++;pScore=0;cScore=0;
  serve(Math.random()<0.5?1:-1);
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='idle')startMatch();
    else if(state==='gamewon'){nextGame();state='play';}
    else if(state==='gamelost')startMatch();
    else swing();
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function getPos(e){
  const rect=c.getBoundingClientRect();
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {y:(cy-rect.top)*H/rect.height};
}
let dragStartY=null,dragMoved=false;
function pdown(e){
  e.preventDefault();
  if(state==='idle'){startMatch();return;}
  if(state==='gamewon'){nextGame();state='play';return;}
  if(state==='gamelost'){startMatch();return;}
  const p=getPos(e);
  dragStartY=p.y;dragMoved=false;
  pointer.active=true;pointer.y=p.y;
}
function pmove(e){
  if(!pointer.active)return;
  e.preventDefault();
  const p=getPos(e);
  if(dragStartY!==null&&Math.abs(p.y-dragStartY)>6)dragMoved=true;
  pointer.y=p.y;
}
function pup(){
  if(state==='play'&&!dragMoved)swing();
  pointer.active=false;dragStartY=null;
}
c.addEventListener('mousedown',pdown);
c.addEventListener('mousemove',pmove);
window.addEventListener('mouseup',pup);
c.addEventListener('touchstart',pdown,{passive:false});
c.addEventListener('touchmove',pmove,{passive:false});
c.addEventListener('touchend',pup);
c.addEventListener('touchcancel',()=>{pointer.active=false;});

function swing(){
  swingFlashP=10;
  const d=Math.hypot(ball.x-player.x,ball.y-player.y);
  if(d<=REACH&&ball.vx<0){
    hitBall('player');
  } else {
    SFX.swoosh();
  }
}

function hitBall(who){
  rallyLen++;
  const paddle=who==='player'?player:ai;
  const speed=Math.min(13,5+rallyLen*0.5);
  const off=(ball.y-paddle.y)/40;
  const smash=Math.abs(paddle.vy||0)>5;
  ball.vx=(who==='player'?1:-1)*(smash?speed*1.25:speed);
  ball.vy=off*5+ball.spin*2+(Math.random()-0.5)*1.2;
  ball.spin=clamp(off*1.5,-3,3);
  SFX.hit();
  if(smash)SFX.powerup();
}

function endPoint(winner){
  if(winner==='player'){pScore++;SFX.point();} else {cScore++;SFX.tick();}
  const lead=Math.abs(pScore-cScore);
  if((pScore>=TARGET||cScore>=TARGET)&&lead>=2){
    if(pScore>cScore){
      SFX.win();
      if(pScore>best){best=pScore;localStorage.setItem(KEY,String(best));}
      state='gamewon';
    } else {
      SFX.lose();
      state='gamelost';
    }
  } else {
    serve(winner==='player'?1:-1);
  }
}

function update(dt){
  // player movement
  let dy=0;
  if(keys['ArrowUp']||keys['KeyW'])dy-=1;
  if(keys['ArrowDown']||keys['KeyS'])dy+=1;
  const prevY=player.y;
  if(dy){
    player.y+=dy*5.2*dt;
  } else if(pointer.active){
    player.y+=(pointer.y-player.y)*0.3*dt;
  }
  player.y=clamp(player.y,20,H-20);
  player.vy=(player.y-prevY)/Math.max(dt,0.01);

  // AI movement + auto swing
  const aiSpeed=3.2+level*0.4;
  const prevAiY=ai.y;
  if(ball.vx>0){
    const errMargin=Math.max(4,26-level*3);
    ai.y+=clamp((ball.y+(Math.random()-0.5)*errMargin)-ai.y,-aiSpeed*dt,aiSpeed*dt);
  } else {
    ai.y+=clamp(H/2-ai.y,-aiSpeed*0.5*dt,aiSpeed*0.5*dt);
  }
  ai.y=clamp(ai.y,20,H-20);
  ai.vy=(ai.y-prevAiY)/Math.max(dt,0.01);
  const dAi=Math.hypot(ball.x-ai.x,ball.y-ai.y);
  if(ball.vx>0&&dAi<REACH+level*3){
    const missChance=Math.max(0.02,0.24-level*0.03);
    if(Math.random()>missChance){
      swingFlashA=10;
      hitBall('ai');
    }
  }

  // ball
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt+ball.spin*0.3*dt;
  if(ball.y-BALL_R<10){ball.y=10+BALL_R;ball.vy*=-0.9;SFX.tick();}
  if(ball.y+BALL_R>H-10){ball.y=H-10-BALL_R;ball.vy*=-0.9;SFX.tick();}

  if(ball.x<0){endPoint('ai');return;}
  if(ball.x>W){endPoint('player');return;}
  // also lose point if ball passes paddle plane without being hit (already covered by x<0/x>W)

  if(swingFlashP>0)swingFlashP-=dt;
  if(swingFlashA>0)swingFlashA-=dt;
}

function drawTable(){
  ctx.fillStyle='#0b3d2e';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=5;
  ctx.strokeRect(6,6,W-12,H-12);
  ctx.setLineDash([10,8]);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(MIDX,10);ctx.lineTo(MIDX,H-10);ctx.stroke();ctx.setLineDash([]);
  // net posts
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(MIDX-2,10,4,H-20);
}
function drawPaddle(p,color,flash){
  ctx.fillStyle=flash>0?'#fff':color;
  ctx.fillRect(p.x-8,p.y-38,16,76);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(p.x-8,p.y-38,16,76);
}
function drawBall(){
  ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#ff7a00';ctx.lineWidth=1.5;ctx.stroke();
}
function drawOverlay(title,sub){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd54f';ctx.font='bold 30px Arial';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-16);
  ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.fillText(sub,W/2,H/2+20);
}
function render(){
  drawTable();
  drawPaddle(ai,'#e94560',swingFlashA);
  drawPaddle(player,'#66c0f4',swingFlashP);
  drawBall();
  document.getElementById('pVal').textContent=pScore;
  document.getElementById('cVal').textContent=cScore;
  document.getElementById('gVal').textContent=gameNum;

  if(state==='idle'){
    drawOverlay(I18N.t('tt_title','TABLE TENNIS RALLY'),I18N.t('tt_start_hint','Tap / Space to start'));
  } else if(state==='gamewon'){
    drawOverlay(I18N.t('tt_won','GAME WON!'),I18N.t('tt_next_hint','Tap for tougher CPU next game'));
  } else if(state==='gamelost'){
    drawOverlay(I18N.t('tt_lost','GAME LOST'),I18N.t('tt_final','Best: {b} — Tap to retry').replace('{b}',best));
  }
}
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(state==='play')update(dt);
  render();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
