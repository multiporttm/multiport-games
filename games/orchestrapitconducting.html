<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1030;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Orchestra Pit Conducting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to swing the baton exactly when the ring reaches the beat line. Watch stage cues: a <b>held note</b> means slow your tempo, a <b>dance break</b> means speed it up. Miss too many beats and the show falls apart!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const HS_KEY='mp_hi_orchestrapitconducting';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0;
let score=0,health=100,combo=0,gameOver=false,started=false,win=false;
let beatInterval=800; // ms between beats, baseline
let targetTempo=800;
let beatTimer=0,lastTime=null;
let ringR=0,ringMax=70,ringActive=false,ringStart=0;
let cue=null,cueTimer=0,totalBeats=0,beatsNeeded=60;
let flashColor=null,flashTimer=0;
let particles=[];

function reset(){
  score=0;health=100;combo=0;gameOver=false;started=false;win=false;
  beatInterval=800;targetTempo=800;beatTimer=0;lastTime=null;
  ringR=0;ringActive=false;cue=null;cueTimer=0;totalBeats=0;flashColor=null;flashTimer=0;particles=[];
}

function newCue(){
  const r=Math.random();
  if(r<0.33){cue={type:'held',label:I18N.t('cue_held','HELD NOTE — slow down!')};targetTempo=1300;}
  else if(r<0.66){cue={type:'dance',label:I18N.t('cue_dance','DANCE BREAK — speed up!')};targetTempo=480;}
  else {cue=null;targetTempo=800;}
  cueTimer=4000+Math.random()*2000;
}

function startBeatRing(){
  ringActive=true;ringStart=performance.now();
}

// A pulse ring grows outward each beat; tap when it lines up with the target ring.
function attemptHit(){
  if(!started){started=true;newCue();lastTime=null;return;}
  if(gameOver){reset();return;}
  const t=performance.now()-ringStart;
  const progress=t/beatInterval; // 0..1+ ideally hit near 1.0
  const err=Math.abs(progress-1.0);
  if(err<0.12){
    const perfect=err<0.05;
    score+=perfect?15:8;
    combo++;
    health=Math.min(100,health+(perfect?4:1));
    SFX.success();
    flashColor='#7ec850';flashTimer=200;
    for(let i=0;i<10;i++)particles.push({x:400,y:150,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:30,c:'#ffd54f'});
    totalBeats++;
    ringStart=performance.now();
  } else {
    combo=0;
    health-=12;
    SFX.error();
    flashColor='#e94560';flashTimer=200;
    if(health<=0){
      gameOver=true;win=false;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();attemptHit();}});
c.addEventListener('pointerdown',e=>{e.preventDefault();attemptHit();});

function drawConductor(scale){
  ctx.save();
  ctx.translate(400,230);
  ctx.fillStyle='#2b2b40';
  ctx.fillRect(-25,-10,50,70);
  ctx.beginPath();ctx.arc(0,-30,22,0,Math.PI*2);ctx.fillStyle='#e0b089';ctx.fill();
  ctx.save();
  ctx.rotate(scale);
  ctx.strokeStyle='#fff';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(20,-30);ctx.lineTo(70,-70);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?16:now-lastTime;
  lastTime=now;
  ctx.clearRect(0,0,800,300);
  const sky=ctx.createLinearGradient(0,0,0,300);
  sky.addColorStop(0,'#2a1a4a');sky.addColorStop(1,'#120a24');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,300);
  ctx.fillStyle='#000';ctx.fillRect(0,260,800,40);

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start conducting'),400,120);
    drawConductor(0);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SHOW OVER'),400,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,158);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(win){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('win_title','BRAVO! CURTAIN CALL!'),400,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,158);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  // ease tempo toward target tempo
  beatInterval+=(targetTempo-beatInterval)*0.02;

  // cue timer
  cueTimer-=dt;
  if(cueTimer<=0)newCue();

  if(totalBeats>=beatsNeeded){
    win=true;SFX.win();
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  }

  const t=performance.now()-ringStart;
  const progress=Math.min(1.4,t/beatInterval);
  const r=progress*ringMax;

  // Outer target ring
  ctx.beginPath();ctx.arc(400,150,ringMax,0,Math.PI*2);ctx.strokeStyle='rgba(255,213,79,0.5)';ctx.lineWidth=3;ctx.stroke();
  // Growing pulse ring
  ctx.beginPath();ctx.arc(400,150,r,0,Math.PI*2);ctx.strokeStyle=progress>0.88&&progress<1.12?'#7ec850':'#e94560';ctx.lineWidth=6;ctx.stroke();
  // baton angle oscillates with beat
  drawConductor(Math.sin(progress*Math.PI)*0.4);

  if(progress>1.4){
    // missed entirely
    combo=0;health-=8;SFX.error();ringStart=performance.now();
    if(health<=0){gameOver=true;win=false;SFX.lose();if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}}
  }

  // cue text
  if(cue){
    ctx.fillStyle=cue.type==='held'?'#80c7ff':'#ff9ecf';
    ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(cue.label,400,60);
  }

  // flash
  if(flashTimer>0){
    flashTimer-=dt;
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=Math.max(0,flashTimer/200)*0.25;
    ctx.fillRect(0,0,800,300);
    ctx.globalAlpha=1;
  }

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;ctx.fillStyle=p.c;ctx.globalAlpha=p.life/30;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;});

  // health bar
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(300,20,200,14);
  ctx.fillStyle=health>40?'#7ec850':'#e94560';ctx.fillRect(300,20,200*(health/100),14);
  ctx.strokeStyle='#fff';ctx.strokeRect(300,20,200,14);

  // progress
  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('beats_label','Beats: {n}/{m}').replace('{n}',totalBeats).replace('{m}',beatsNeeded),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('combo_label','Combo: {c}').replace('{c}',combo),780,30);

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
