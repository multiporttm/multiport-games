<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0288d1}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Whirlpool Rescue</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Rescued: 0 | Time: 45s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to swim. Reach a stranded swimmer to pick them up, then get back to the 🚤 boat to rescue them — all while dodging the swirling whirlpools!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,boat,swimmers,whirlpools,carrying,rescued,timeLeft,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('whirlpoolrescue_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('whirlpoolrescue_best',v);}

function init(){
  player={x:60,y:60};boat={x:40,y:40};
  swimmers=[];whirlpools=[];carrying=false;rescued=0;timeLeft=45;state='play';
  for(let i=0;i<4;i++)spawnSwimmer();
  for(let i=0;i<3;i++)whirlpools.push({x:rand(80,W-40),y:rand(80,H-40),ang:0});
}
function spawnSwimmer(){swimmers.push({x:rand(100,W-30),y:rand(100,H-30)});}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.4;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  whirlpools.forEach(w=>{
    w.ang+=0.03;
    const pull=Math.max(0,40-dist(player,w))/40;
    if(pull>0){
      const ang=Math.atan2(w.y-player.y,w.x-player.x);
      player.x+=Math.cos(ang)*pull*1.5;
      player.y+=Math.sin(ang)*pull*1.5;
      if(pull>0.7)SFX.hurt();
    }
  });

  if(!carrying){
    swimmers=swimmers.filter(s=>{
      if(dist(player,s)<20){carrying=true;SFX.click();return false;}
      return true;
    });
  }else if(dist(player,boat)<24){
    carrying=false;rescued++;
    SFX.success();
    saveBest(rescued);
    if(swimmers.length<4)spawnSwimmer();
  }

  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(rescued);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#0288d1';ctx.fillRect(0,0,W,H);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  whirlpools.forEach(w=>{
    ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.ang);
    ctx.fillText('🌀',0,0);
    ctx.restore();
  });

  ctx.font='26px Arial';
  ctx.fillText('🚤',boat.x,boat.y);

  ctx.font='18px Arial';
  swimmers.forEach(s=>ctx.fillText('🏊',s.x,s.y));

  ctx.font='22px Arial';
  ctx.fillText(carrying?'🏊‍♂️':'🛟',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 26px Arial';
    ctx.fillText("TIME'S UP!",W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Rescued: ${rescued} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Rescued: ${rescued} | Time: ${Math.ceil(timeLeft)}s`;
}

init();draw();
</script></body></html>
