<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:radial-gradient(circle at 50% 40%,#2b1a3a,#0d0714);display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:22px;color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;flex-wrap:wrap}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cotton Candy Spin</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="cone-display">Cone: 1</span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag (or use <b>Arrow Keys</b>) to sweep the stick around the spinning sugar cloud. Keep the fullness ring even on every side without over-spinning any one spot. Finish before the machine overheats to score — tolerance shrinks with each new cone!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const cx=W/2,cy=H/2+10;
const N=48; // ring segments
const outerR=150,innerR=40;

let score=0,hi=parseFloat(localStorage.getItem('cottoncandyspin_best')||'0');
let coneNum=1,gameOver=false,started=false;
let fullness=new Array(N).fill(0);
let stickAngle=0;
let maxOver=1.4; // over-spin tolerance ceiling before burst, shrinks each cone
let heat=0;
let keys={};
let dragging=false;
let doneMessage=null,doneTimer=0;
let burstStreak=0;
const MAX_BURST_STREAK=3;

function reset(){
  score=0;coneNum=1;gameOver=false;started=false;burstStreak=0;
  newCone();
}
function newCone(){
  fullness=new Array(N).fill(0);
  stickAngle=-Math.PI/2;
  heat=0;
  maxOver=Math.max(1.05,1.5-coneNum*0.06);
  doneMessage=null;
}
reset();

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('cone-display').textContent=I18N.t('cone_label','Cone: {n}').replace('{n}',coneNum);
}

function angleToSeg(a){
  let n=((a+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*N;
  return Math.floor(n)%N;
}

function start(){if(!started)started=true;}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  start();
  if(gameOver){
    if(score>hi){hi=score;localStorage.setItem('cottoncandyspin_best',String(hi));}
    reset();
  }
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerAngle(clientX,clientY){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const x=(clientX-rect.left)*scaleX-cx;
  const y=(clientY-rect.top)*scaleY-cy;
  return Math.atan2(y,x);
}
c.addEventListener('pointerdown',e=>{
  start();
  if(gameOver){
    if(score>hi){hi=score;localStorage.setItem('cottoncandyspin_best',String(hi));}
    reset();return;
  }
  dragging=true;
  stickAngle=pointerAngle(e.clientX,e.clientY);
});
c.addEventListener('pointermove',e=>{
  if(dragging)stickAngle=pointerAngle(e.clientX,e.clientY);
});
window.addEventListener('pointerup',()=>{dragging=false;});

function finishCone(){
  // score based on evenness (low variance) and average fullness
  const avg=fullness.reduce((a,b)=>a+b,0)/N;
  const variance=fullness.reduce((a,b)=>a+(b-avg)*(b-avg),0)/N;
  const evenness=Math.max(0,1-Math.sqrt(variance)/1.2);
  const sizeScore=Math.min(1,avg/1.0);
  const pts=Math.round(evenness*400*sizeScore + sizeScore*100);
  score+=pts;
  doneMessage=I18N.t('cone_done_msg','Cone done! Evenness {e}% — +{p} pts').replace('{e}',Math.round(evenness*100)).replace('{p}',pts);
  doneTimer=90;
  SFX.success();
  coneNum++;
  burstStreak=0;
}

function burstCone(){
  doneMessage=I18N.t('cone_burst_msg','Overspun and popped! Cone ruined.');
  doneTimer=90;
  SFX.fail();
  coneNum++;
  burstStreak++;
}

function drawMachine(){
  ctx.save();
  ctx.fillStyle='#3a2f4a';
  ctx.beginPath();ctx.arc(cx,cy,innerR-4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#221a2e';ctx.lineWidth=6;ctx.stroke();
  ctx.restore();
}

function drawRing(){
  for(let i=0;i<N;i++){
    const a0=(i/N)*Math.PI*2-Math.PI/2;
    const a1=((i+1)/N)*Math.PI*2-Math.PI/2;
    const f=Math.min(fullness[i],maxOver);
    const r=innerR+(outerR-innerR)*Math.min(fullness[i],1.15);
    let color;
    if(fullness[i]>maxOver*0.95)color='#ff5252';
    else if(fullness[i]>0.85)color='#ffd54f';
    else if(fullness[i]>0.15)color='#fdf3e0';
    else color='rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }
  // outer target ring outline
  ctx.beginPath();ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.stroke();
}

function drawStick(){
  const sx=cx+Math.cos(stickAngle)*(outerR+18);
  const sy=cy+Math.sin(stickAngle)*(outerR+18);
  ctx.strokeStyle='#c9a227';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+Math.cos(stickAngle)*innerR,cy+Math.sin(stickAngle)*innerR);ctx.lineTo(sx,sy);ctx.stroke();
  ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}

function drawHeatBar(){
  const bx=250,by=30,bw=300,bh=18;
  ctx.fillStyle='#111';ctx.fillRect(bx-3,by-3,bw+6,bh+6);
  ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
  const w=Math.min(1,heat)*bw;
  const g=ctx.createLinearGradient(bx,0,bx+bw,0);
  g.addColorStop(0,'#4caf50');g.addColorStop(0.6,'#ffd54f');g.addColorStop(1,'#ff5252');
  ctx.fillStyle=g;ctx.fillRect(bx,by,w,bh);
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('heat_label','Machine Heat'),bx+bw/2,by-8);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(cx,cy,20,cx,cy,320);
  bg.addColorStop(0,'#2b1a3a');bg.addColorStop(1,'#0d0714');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Drag or Arrow Keys to start spinning!'),cx,80);
    drawRing();drawMachine();drawStick();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),cx,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',Math.floor(score)),cx,225);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint4','Tap / Space to try again'),cx,260);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(doneMessage){
    doneTimer--;
    drawRing();drawMachine();
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(doneMessage,cx,cy-outerR-40);
    if(burstStreak>=MAX_BURST_STREAK){
      ctx.fillStyle='#ff8080';ctx.font='bold 16px Arial';
      ctx.fillText(I18N.t('too_many_bursts','Too many burst cones in a row!'),cx,cy-outerR-14);
    }
    if(doneTimer<=0){
      if(burstStreak>=MAX_BURST_STREAK){
        gameOver=true;
        if(score>hi){hi=score;localStorage.setItem('cottoncandyspin_best',String(hi));}
      }else{
        newCone();
      }
    }
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  // keyboard control
  const rotSpeed=0.06;
  if(keys['arrowleft'])stickAngle-=rotSpeed;
  if(keys['arrowright'])stickAngle+=rotSpeed;

  // Build up sugar at current segment
  const seg=angleToSeg(stickAngle);
  fullness[seg]+=0.028;
  heat+=0.0016;

  // check overspin burst
  if(fullness[seg]>maxOver){
    burstCone();
  } else if(heat>=1){
    finishCone();
  } else {
    // check completion: all segments reasonably full
    const minFull=Math.min(...fullness);
    if(minFull>0.85){
      finishCone();
    }
  }

  drawRing();
  drawMachine();
  drawStick();
  drawHeatBar();
  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
