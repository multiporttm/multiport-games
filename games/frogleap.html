<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2d5a27;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ec850;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#padWrap{display:flex;justify-content:center;margin-top:10px}
#pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:5px}
#pad button{background:#16213e;color:#7ec850;border:2px solid #2d5a27;border-radius:10px;font-size:1.4rem;font-weight:900;cursor:pointer}
#pad button:active{background:#2d5a27}
#pad .empty{visibility:hidden}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Frog Leap</div>
  <div class="game-frame">
    <div id="score-display">Crossings: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="480" height="480"></canvas>
    <div id="padWrap">
      <div id="pad">
        <div class="empty"></div><button data-d="up">▲</button><div class="empty"></div>
        <button data-d="left">◀</button><div class="empty"></div><button data-d="right">▶</button>
        <div class="empty"></div><button data-d="down">▼</button><div class="empty"></div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> or the <b>on-screen pad</b> / swipe to hop the frog forward across the road and river to the goal at the top. Dodge cars, hop on logs and lily pads, and don't fall in the water — reach the goal to score!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=480,ROWS=12,CELL=40;
let score=0,lives=3,hi=0,level=1,gameOver=false,started=false;
hi=parseFloat(localStorage.getItem('frogleap_hi')||'0');

let frog,cars,rivers,frame,resultMsg,resultTimer;

function laneType(row){
  // row 0 = goal (top), rows 1-5 river, row 6 = median/safe, rows 7-11 road, row 11 start
  if(row===0)return 'goal';
  if(row>=1&&row<=5)return 'river';
  if(row===6)return 'safe';
  return 'road';
}

function initLevel(){
  frog={x:5,row:11,offsetX:0};
  cars=[];
  rivers=[];
  const roadSpeed=1.2+level*0.35;
  for(let row=7;row<=11-1;row++){ // rows 7..10 are road lanes (11 is start/safe)
    const dir=row%2===0?1:-1;
    const speed=(roadSpeed+Math.random()*0.6)*dir;
    const gap=3+Math.random()*1.5;
    const carW=1;
    let arr=[];
    let x=Math.random()*12;
    for(let i=0;i<5;i++){arr.push(x);x+=gap;}
    cars.push({row,speed,items:arr,w:carW});
  }
  for(let row=1;row<=5;row++){
    const dir=row%2===0?1:-1;
    const speed=(0.6+level*0.18+Math.random()*0.3)*dir;
    const isLog=row%2===0;
    const objW=isLog?2.2:1.4;
    const gap=isLog?4:3.2;
    let arr=[];
    let x=Math.random()*12;
    for(let i=0;i<5;i++){arr.push(x);x+=gap;}
    rivers.push({row,speed,items:arr,w:objW,isLog});
  }
  frame=0;
}

function reset(){score=0;lives=3;level=1;gameOver=false;started=false;resultMsg=null;initLevel();}
reset();

function endGameCheck(){
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;localStorage.setItem('frogleap_hi',hi);}
  }
}

function loseLife(msg){
  lives--;
  SFX.hit();
  resultMsg=msg;
  resultTimer=45;
  frog.x=5;frog.row=11;frog.offsetX=0;
  endGameCheck();
}

function reachGoal(){
  score++;
  SFX.point();
  if(score>hi){hi=score;localStorage.setItem('frogleap_hi',hi);}
  level++;
  resultMsg=I18N.t('crossing_msg','Crossing complete!');
  resultTimer=45;
  initLevel();
}

function move(dir){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  if(resultTimer>0)return;
  let {x,row}=frog;
  if(dir==='up')row--;
  else if(dir==='down')row++;
  else if(dir==='left')x--;
  else if(dir==='right')x++;
  row=Math.max(0,Math.min(11,row));
  x=Math.max(0,Math.min(11,x));
  frog.x=x;frog.row=row;
  SFX.jump();
  if(row===0){reachGoal();}
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});
document.querySelectorAll('#pad button').forEach(b=>{
  b.addEventListener('click',()=>move(b.dataset.d));
});
let touchStart=null;
c.addEventListener('touchstart',e=>{
  if(!started){started=true;}
  if(gameOver){reset();return;}
  const t=e.touches[0];
  touchStart={x:t.clientX,y:t.clientY};
},{passive:true});
c.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
  touchStart=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});
c.addEventListener('click',()=>{ if(gameOver)reset(); if(!started)started=true; });

function rowY(row){return row*CELL;}
function colX(col){return col*CELL;}

function laneColor(row){
  const t=laneType(row);
  if(t==='goal')return '#2a4d3a';
  if(t==='river')return '#1a4d6b';
  if(t==='safe')return '#3d5a2d';
  return '#333';
}

function drawCar(x,row,w,dir){
  const px=colX(x),py=rowY(row);
  ctx.fillStyle=dir>0?'#e94560':'#ffd54f';
  ctx.fillRect(px+2,py+8,w*CELL-4,CELL-16);
  ctx.fillStyle='#222';
  ctx.fillRect(px+6,py+6,w*CELL-12,6);
}
function drawLog(x,row,w){
  const px=colX(x),py=rowY(row);
  ctx.fillStyle='#8b5a2b';
  ctx.fillRect(px,py+10,w*CELL,CELL-20);
  ctx.fillStyle='#6b4423';
  for(let i=0;i<w;i++)ctx.fillRect(px+i*CELL+CELL/2-2,py+10,4,CELL-20);
}
function drawPad(x,row,w){
  const px=colX(x),py=rowY(row);
  ctx.fillStyle='#3d8b3d';
  ctx.beginPath();
  ctx.ellipse(px+w*CELL/2,py+CELL/2,w*CELL/2-2,CELL/2-6,0,0,7);
  ctx.fill();
}

function drawFrog(){
  const px=colX(frog.x)+CELL/2,py=rowY(frog.row)+CELL/2;
  ctx.save();
  ctx.translate(px,py);
  ctx.fillStyle='#7ec850';
  ctx.beginPath();ctx.ellipse(0,0,14,12,0,0,7);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(-6,-6,3,0,7);ctx.arc(6,-6,3,0,7);ctx.fill();
  ctx.restore();
}

function wrapItems(lane,widthUnits){
  return lane.items.map(v=>{
    let x=((v%(widthUnits))+widthUnits)%widthUnits;
    return x;
  });
}

function update(dt){
  cars.forEach(lane=>{
    lane.items=lane.items.map(x=>x+lane.speed*dt*0.05);
    lane.items=lane.items.map(x=>{let v=x; if(v>12)v-=12-lane.w; if(v< -lane.w)v+=12+lane.w; return v;});
  });
  rivers.forEach(lane=>{
    lane.items=lane.items.map(x=>x+lane.speed*dt*0.05);
    lane.items=lane.items.map(x=>{let v=x; if(v>12)v-=12-lane.w; if(v< -lane.w)v+=12+lane.w; return v;});
  });
}

function checkCollision(){
  if(resultTimer>0)return;
  const t=laneType(frog.row);
  if(t==='road'){
    const lane=cars.find(l=>l.row===frog.row);
    if(lane){
      for(const x of lane.items){
        if(frog.x+0.5>x-0.15 && frog.x+0.5<x+lane.w+0.15){loseLife(I18N.t('hit_car_msg','Squashed by a car!'));return;}
      }
    }
  } else if(t==='river'){
    const lane=rivers.find(l=>l.row===frog.row);
    let onSomething=false;
    let carriedSpeed=0;
    if(lane){
      for(const x of lane.items){
        if(frog.x+0.5>x-0.1 && frog.x+0.5<x+lane.w+0.1){onSomething=true;carriedSpeed=lane.speed;break;}
      }
    }
    if(!onSomething){loseLife(I18N.t('fell_water_msg','Fell in the river!'));return;}
    frog.x+=carriedSpeed*0.05;
    if(frog.x<0||frog.x>11.3){loseLife(I18N.t('fell_water_msg','Fell in the river!'));return;}
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  for(let row=0;row<=11;row++){
    ctx.fillStyle=laneColor(row);
    ctx.fillRect(0,rowY(row),W,CELL);
  }
  cars.forEach(lane=>{
    lane.items.forEach(x=>drawCar(x,lane.row,lane.w,lane.speed));
  });
  rivers.forEach(lane=>{
    lane.items.forEach(x=>{
      if(lane.isLog)drawLog(x,lane.row,lane.w);
      else drawPad(x,lane.row,lane.w);
    });
  });
  drawFrog();

  document.getElementById('score-display').textContent=
    I18N.t('frog_status_label','Crossings: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{l}',lives).replace('{h}',Math.floor(hi));

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or press an arrow key to start'),W/2,H/2);
  }
  if(resultMsg&&resultTimer>0){
    ctx.fillStyle='#000000aa';ctx.fillRect(0,H/2-30,W,60);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,H/2+8);
  }
  if(gameOver){
    ctx.fillStyle='#000000cc';ctx.fillRect(0,H/2-50,W,100);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-8);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+24);
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(started&&!gameOver){
    if(resultTimer>0)resultTimer-=dt;
    else{update(dt);checkCollision();}
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
