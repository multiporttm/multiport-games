<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Egg and Spoon Race</title><meta name="description" content="Play Egg and Spoon Race free online — Hold Right Arrow or tap to run forward while balancing an egg on a spoon. Hold Steady to stop wobble, but watch your speed!"><link rel="canonical" href="https://games.multiportllc.com/games/eggandspoonrace"><meta property="og:title" content="Egg and Spoon Race - Multiport Games"><meta property="og:description" content="Play Egg and Spoon Race free online — Hold Right Arrow or tap to run forward while balancing an egg on a spoon. Hold Steady to stop wobble, but watch your speed!"><meta property="og:url" content="https://games.multiportllc.com/games/eggandspoonrace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Egg and Spoon Race","description":"Play Egg and Spoon Race free online instantly. Hold Right Arrow or tap Run to move forward while balancing an egg on a spoon. Hold Steady to calm the wobble at the cost of speed. Bumps and going too fast increase wobble — let it wobble too far and the egg falls! Race to the finish against three AI competitors. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/eggandspoonrace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#a5d6a7,#4caf50);display:block;border-radius:8px;touch-action:none}
#score-display{color:#1b5e20;background:#e8f5e9;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
#touch-controls{display:flex;justify-content:center;gap:14px;margin-top:8px}
#touch-controls button{padding:10px 22px;border-radius:20px;border:none;font-weight:800;font-size:1rem;cursor:pointer}
#runBtn{background:#43a047;color:#fff}
#steadyBtn{background:#fb8c00;color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Egg and Spoon Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="260"></canvas>
    <div id="touch-controls">
      <button id="runBtn">RUN</button>
      <button id="steadyBtn">STEADY</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Right Arrow</b> (or the <b>RUN</b> button) to move forward. Running fast and hitting bumps wobbles your egg — hold <b>Down Arrow</b> or <b>STEADY</b> to calm it, but you'll slow down. Don't let the egg fall off the spoon!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=260;
const TRACK_LEN=2400;
let hiTime=parseFloat(localStorage.getItem('eggandspoonrace_hi')||'0')||null;
let wins=parseInt(localStorage.getItem('eggandspoonrace_wins')||'0',10);

let player,ais,bumps,started,finished,raceTime,camX,lastTime,running,steadying,dropTimer;

function makeBumps(){
  const arr=[];
  for(let x=300;x<TRACK_LEN-100;x+=140+Math.random()*160){
    arr.push(x);
  }
  return arr;
}

function reset(){
  player={x:0,speed:0,wobble:0,dropped:false,finishTime:null};
  ais=[
    {x:0,speed:2.1,finishTime:null},
    {x:0,speed:2.0,finishTime:null},
    {x:0,speed:2.25,finishTime:null},
  ];
  bumps=makeBumps();
  started=false;finished=false;raceTime=0;camX=0;lastTime=null;
  running=false;steadying=false;dropTimer=0;
}
reset();

function setRunning(v){
  if(finished){reset();return;}
  if(!started&&v){started=true;lastTime=null;}
  running=v;
}
function setSteadying(v){steadying=v;}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowRight'){e.preventDefault();setRunning(true);}
  else if(e.code==='ArrowDown'){e.preventDefault();setSteadying(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowRight'){setRunning(false);}
  else if(e.code==='ArrowDown'){setSteadying(false);}
});
const runBtn=document.getElementById('runBtn'),steadyBtn=document.getElementById('steadyBtn');
runBtn.addEventListener('mousedown',()=>setRunning(true));
runBtn.addEventListener('mouseup',()=>setRunning(false));
runBtn.addEventListener('mouseleave',()=>setRunning(false));
runBtn.addEventListener('touchstart',e=>{e.preventDefault();setRunning(true);},{passive:false});
runBtn.addEventListener('touchend',e=>{e.preventDefault();setRunning(false);},{passive:false});
steadyBtn.addEventListener('mousedown',()=>setSteadying(true));
steadyBtn.addEventListener('mouseup',()=>setSteadying(false));
steadyBtn.addEventListener('mouseleave',()=>setSteadying(false));
steadyBtn.addEventListener('touchstart',e=>{e.preventDefault();setSteadying(true);},{passive:false});
steadyBtn.addEventListener('touchend',e=>{e.preventDefault();setSteadying(false);},{passive:false});
c.addEventListener('mousedown',()=>setRunning(true));
c.addEventListener('mouseup',()=>setRunning(false));
c.addEventListener('touchstart',e=>{e.preventDefault();setRunning(true);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();setRunning(false);},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('egg_score_label','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',hiTime?hiTime.toFixed(1)+'s':'--');
}

function nearBump(x){
  return bumps.some(b=>Math.abs(b-x)<18);
}

function drawRunner(x,label,wobble,dropped){
  const sx=x-camX+80;
  if(sx<-40||sx>W+40)return;
  const legPhase=Math.sin(x*0.05)*10;
  ctx.fillStyle='#8d6e63';
  ctx.fillRect(sx-5,180,10,20+legPhase*0.3);
  ctx.fillRect(sx+5,180,10,20-legPhase*0.3);
  ctx.fillStyle='#5d4037';
  ctx.fillRect(sx-12,140,24,44);
  ctx.fillStyle='#ffccbc';
  ctx.beginPath();ctx.arc(sx,128,12,0,Math.PI*2);ctx.fill();
  // spoon arm
  ctx.strokeStyle='#c9a227';ctx.lineWidth=4;
  const wob=wobble!==undefined?Math.sin(performance.now()/60)*wobble*10:0;
  ctx.beginPath();ctx.moveTo(sx+10,150);ctx.lineTo(sx+34+wob,132);ctx.stroke();
  if(!dropped){
    ctx.fillStyle='#fffde7';
    ctx.beginPath();ctx.ellipse(sx+36+wob,128,7,9,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e0c068';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.fillStyle='#1b5e20';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(label,sx,110);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#87ceeb');grad.addColorStop(1,'#a5d6a7');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#c8e6c9';ctx.fillRect(0,200,W,60);
  ctx.fillStyle='#81c784';ctx.fillRect(0,200,W,6);

  if(!started){
    ctx.fillStyle='#1b5e20';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('egg_start_hint','Hold RUN or Right Arrow to start!'),W/2,40);
    drawRunner(player.x,I18N.t('egg_you_label','YOU'),player.wobble,player.dropped);
    requestAnimationFrame(loop);return;
  }

  if(finished){
    ctx.fillStyle='#1b5e20';ctx.font='bold 30px Arial';ctx.textAlign='center';
    const won=player.finishTime!==null&&ais.every(a=>a.finishTime===null||a.finishTime>=player.finishTime);
    ctx.fillText(won?I18N.t('egg_win','YOU WIN!'):I18N.t('egg_lose','YOU LOSE'),W/2,40);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or RUN to restart'),W/2,66);
    drawRunner(player.x,I18N.t('egg_you_label','YOU'),player.wobble,player.dropped);
    ais.forEach((a,i)=>drawRunner(a.x,'CPU'+(i+1),0,false));
    requestAnimationFrame(loop);return;
  }

  raceTime+=dt/60;

  // draw bumps on track (relative)
  ctx.fillStyle='#795548';
  bumps.forEach(b=>{
    const sx=b-camX+80;
    if(sx>-20&&sx<W+20){
      ctx.beginPath();ctx.ellipse(sx,206,14,6,0,0,Math.PI*2);ctx.fill();
    }
  });

  if(!player.dropped){
    // speed & wobble physics
    const targetSpeed=running?(steadying?1.6:3.4):0;
    player.speed+=(targetSpeed-player.speed)*0.08*dt;
    player.x+=player.speed*dt;

    let wobbleRate=(player.speed-1.5)*0.006;
    if(steadying)wobbleRate-=0.05;
    if(nearBump(player.x))wobbleRate+=0.35;
    player.wobble=Math.max(0,player.wobble+wobbleRate*dt);
    if(player.wobble>3){
      player.wobble=3;
    }
    if(player.wobble>=3){
      player.dropped=true;
      dropTimer=90;
      SFX.error();
    }
  } else {
    dropTimer-=dt;
    player.speed=0;
    if(dropTimer<=0){
      player.dropped=false;
      player.wobble=0;
    }
  }

  ais.forEach(a=>{
    if(a.finishTime===null){
      const wig=1+Math.sin(a.x*0.01+a.speed)*0.15;
      a.x+=a.speed*wig*dt;
    }
  });

  camX=Math.max(0,player.x-200);

  const finishSx=TRACK_LEN-camX+80;
  if(finishSx>-20&&finishSx<W+20){
    for(let i=0;i<60;i+=20){
      ctx.fillStyle=((i/20)%2===0)?'#222':'#fff';
      ctx.fillRect(finishSx,200+i,10,20);
    }
  }

  drawRunner(player.x,I18N.t('egg_you_label','YOU'),player.wobble,player.dropped);
  ais.forEach((a,i)=>drawRunner(a.x,'CPU'+(i+1),0,false));

  if(player.dropped){
    ctx.fillStyle='rgba(255,0,0,0.6)';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('egg_dropped','EGG DROPPED!'),W/2,90);
  }

  if(player.x>=TRACK_LEN&&player.finishTime===null){player.finishTime=raceTime;}
  ais.forEach(a=>{if(a.x>=TRACK_LEN&&a.finishTime===null)a.finishTime=raceTime;});

  if(player.finishTime!==null&&!finished){
    finished=true;
    const won=ais.every(a=>a.finishTime===null||a.finishTime>=player.finishTime);
    if(won){
      wins++;localStorage.setItem('eggandspoonrace_wins',wins);
      if(hiTime===null||raceTime<hiTime){hiTime=raceTime;localStorage.setItem('eggandspoonrace_hi',hiTime);}
      SFX.win();
    }else{
      SFX.lose();
    }
  } else if(!finished&&ais.some(a=>a.finishTime!==null)&&player.finishTime===null){
    finished=true;SFX.lose();
  }

  ctx.fillStyle='#1b5e20';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('egg_time_label','Time: {t}s').replace('{t}',raceTime.toFixed(1)),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('egg_wobble_label','Wobble: {w}%').replace('{w}',Math.floor(player.wobble/3*100)),W-10,20);
  ctx.textAlign='center';

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
