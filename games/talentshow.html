<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4a148c;cursor:pointer}
#ui{color:#e1bee7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Talent Show Star</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Combo: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">A marker sweeps back and forth across the bar. Tap anywhere when it's inside the golden zone for a perfect hit — miss the zone 5 times and the show ends. Zones get narrower as your score climbs!</div>
</div>
<script>
const W=360,H=360,BAR_Y=H/2,BAR_W=W-60;
let marker,dir,zoneStart,zoneWidth,score,combo,misses,state;

function loadBest(){return +(localStorage.getItem('talentshow_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('talentshow_best',v);}

function init(){
  score=0;combo=0;misses=0;state='play';
  marker=0;dir=1;
  newZone();
}

function newZone(){
  zoneWidth=Math.max(30,80-score*1.5);
  zoneStart=Math.random()*(BAR_W-zoneWidth);
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(marker>=zoneStart&&marker<=zoneStart+zoneWidth){
    score++;combo++;
    SFX.success();
    if(combo%5===0)SFX.levelup();
    saveBest(score);
    newZone();
  }else{
    combo=0;misses++;
    SFX.fail();
    if(misses>=5){
      state='over';
      SFX.lose();
      saveBest(score);
    }else{
      newZone();
    }
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  const spd=2.2+score*0.06;
  marker+=dir*spd;
  if(marker>BAR_W||marker<0)dir*=-1;
}

function draw(){
  ctx.fillStyle='#4a148c';ctx.fillRect(0,0,W,H);

  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎤',W/2,BAR_Y-60);

  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.fillRect(30,BAR_Y-10,BAR_W,20);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(30+zoneStart,BAR_Y-10,zoneWidth,20);
  ctx.fillStyle='#fff';
  ctx.fillRect(30+marker-3,BAR_Y-18,6,36);

  ctx.font='14px Arial';ctx.fillStyle='#e1bee7';
  ctx.fillText(`Misses: ${misses}/5`,W/2,BAR_Y+50);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1bee7';ctx.font='bold 26px Arial';
    ctx.fillText("SHOW'S OVER",W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${score} | Combo: ${combo}`;
}

init();draw();
</script></body></html>
