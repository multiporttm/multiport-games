<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Frisbee Golf</title><meta name="description" content="Play Frisbee Golf free online — Set your power and angle, then release to curve the disc around obstacles into the basket."><link rel="canonical" href="https://games.multiportllc.com/games/frisbeegolf"><meta property="og:title" content="Frisbee Golf - Multiport Games"><meta property="og:description" content="Play Frisbee Golf free online — Set your power and angle, then release to curve the disc around obstacles into the basket."><meta property="og:url" content="https://games.multiportllc.com/games/frisbeegolf"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Frisbee Golf","description":"Play Frisbee Golf free online instantly. Set your power and angle, then release to curve the disc around obstacles into the basket. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/frisbeegolf","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#66bb6a;cursor:pointer}
#ui{color:#e8f5e9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Frisbee Golf</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Hole: 1 | Throws: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap once to set power (bar fills), tap again to set the angle (marker swings), then it throws automatically. Curve around the trees to land in the basket — fewer throws is better!</div>
</div>
<script>
const W=360,H=360;
let discX,discY,discVX,discVY,flying,trees,basket,hole,throws,phase,power,angle,powerDir,angleT,state;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('frisbeegolf_best')||0);}
function saveBest(v){if(v<loadBest()||loadBest()===0)localStorage.setItem('frisbeegolf_best',v);}

function init(){hole=1;throws=0;state='play';newHole();}
function newHole(){
  discX=40;discY=H-40;flying=false;phase='power';power=0;powerDir=1;angle=0;angleT=0;
  basket={x:rand(260,330),y:rand(40,120)};
  trees=[];
  for(let i=0;i<2+hole;i++)trees.push({x:rand(100,300),y:rand(80,300),r:16});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(flying)return;
  if(phase==='power'){
    phase='angle';
    SFX.click();
  }else if(phase==='angle'){
    const rad=(angle-90)*Math.PI/180;
    const spd=3+power*0.09;
    discVX=Math.cos(rad)*spd;discVY=Math.sin(rad)*spd;
    flying=true;throws++;
    SFX.swoosh();
    updateUI();
  }
});

function update(){
  if(state!=='play')return;
  if(!flying){
    if(phase==='power'){power+=powerDir*2.4;if(power>100||power<0)powerDir*=-1;}
    else if(phase==='angle'){angleT+=0.05;angle=90+Math.sin(angleT)*70;}
    return;
  }
  discX+=discVX;discY+=discVY;
  discVX*=0.995;

  trees.forEach(t=>{
    if(Math.hypot(discX-t.x,discY-t.y)<t.r+6){
      discVX*=-0.4;discVY*=-0.4;discX+=discVX*2;
      SFX.hit();
    }
  });

  if(Math.hypot(discX-basket.x,discY-basket.y)<16){
    SFX.success();
    saveBest(throws);
    hole++;
    setTimeout(newHole,900);
    flying=false;
    return;
  }

  if(discX<0||discX>W||discY<0||discY>H){
    discX=40;discY=H-40;flying=false;phase='power';power=0;
    SFX.fail();
  }
}

function draw(){
  ctx.fillStyle='#66bb6a';ctx.fillRect(0,0,W,H);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  trees.forEach(t=>ctx.fillText('🌳',t.x,t.y));
  ctx.fillText('🥅',basket.x,basket.y);

  if(!flying){
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(20,H-20,W-40,10);
    if(phase==='power'){
      ctx.fillStyle='#ffca28';ctx.fillRect(20,H-20,(W-40)*power/100,10);
    }else{
      ctx.fillStyle='#66bb6a';ctx.fillRect(20,H-20,(W-40)*power/100,10);
      const rad=(angle-90)*Math.PI/180;
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(discX,discY);ctx.lineTo(discX+Math.cos(rad)*30,discY+Math.sin(rad)*30);ctx.stroke();
    }
  }

  ctx.font='22px Arial';
  ctx.fillText('🥏',discX,discY);

  ctx.fillStyle='#e8f5e9';ctx.font='13px Arial';
  ctx.fillText(flying?'':phase==='power'?'Tap to set power':'Tap to set angle & throw',W/2,H-32);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e8f5e9';ctx.font='bold 26px Arial';
    ctx.fillText('COURSE DONE!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Total throws: ${throws}`,W/2,H/2+12);
    ctx.fillText('Tap to replay',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Hole: ${hole} | Throws: ${throws}`;
}

init();draw();
</script></body></html>
