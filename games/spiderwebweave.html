<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a1a2e,#3d2b56);display:block;border-radius:8px;cursor:pointer}
#score-display{color:#c9a8ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Spider Web Weave</div>
  <div class="game-frame">
    <div id="score-display">Webs: 0 | Best Time: —</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click two <b>Anchor Points</b> in sequence to weave a thread between them. Recreate the faint target web pattern exactly to complete the level — click a connected pair again to remove that thread. Patterns get more complex each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500,cx=W/2,cy=H/2-10;

let webs=0,bestTime=null;
try{const bt=localStorage.getItem('spiderwebweave_best');if(bt)bestTime=parseFloat(bt);}catch(e){}

let level=1,anchors=[],targetEdges=[],drawnEdges=[],selected=null;
let startTime=null,elapsed=0,won=false,message='';

function edgeKey(a,b){return a<b?a+'-'+b:b+'-'+a;}

function genLevel(){
  const n=Math.min(6+Math.floor(level/2),12);
  anchors=[];
  const radius=190;
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2 + i*(Math.PI*2/n);
    anchors.push({x:cx+Math.cos(ang)*radius,y:cy+Math.sin(ang)*radius,idx:i});
  }
  // generate target edges: random spanning-ish structure plus extra chords
  const edgeSet=new Set();
  // connect ring (consecutive) partially, then random chords
  const numTargetEdges=Math.min(n + level, n*2);
  // start with a connected cycle subset to keep it feeling web-like
  for(let i=0;i<n;i++){
    if(Math.random()<0.7){
      edgeSet.add(edgeKey(i,(i+1)%n));
    }
  }
  let guard=0;
  while(edgeSet.size<numTargetEdges && guard<500){
    guard++;
    const a=Math.floor(Math.random()*n);
    let b=Math.floor(Math.random()*n);
    if(a===b)continue;
    // avoid too many crossing chords for tiny levels
    edgeSet.add(edgeKey(a,b));
  }
  targetEdges=Array.from(edgeSet).map(k=>k.split('-').map(Number));
  drawnEdges=[];
  selected=null;
  won=false;
  message='';
  startTime=performance.now();
}
genLevel();

function findAnchorAt(px,py){
  for(const a of anchors){
    const dx=px-a.x,dy=py-a.y;
    if(dx*dx+dy*dy<20*20)return a.idx;
  }
  return null;
}

function hasEdge(list,a,b){
  const k=edgeKey(a,b);
  return list.some(([x,y])=>edgeKey(x,y)===k);
}

function toggleEdge(a,b){
  const k=edgeKey(a,b);
  const idx=drawnEdges.findIndex(([x,y])=>edgeKey(x,y)===k);
  if(idx>=0){drawnEdges.splice(idx,1);SFX.click();}
  else{drawnEdges.push([a,b]);SFX.point();}
}

function checkComplete(){
  if(drawnEdges.length!==targetEdges.length)return false;
  return targetEdges.every(([a,b])=>hasEdge(drawnEdges,a,b));
}

c.addEventListener('click',e=>{
  if(won)return;
  const r=c.getBoundingClientRect();
  const px=(e.clientX-r.left)*(W/r.width);
  const py=(e.clientY-r.top)*(H/r.height);
  const idx=findAnchorAt(px,py);
  if(idx===null)return;
  if(selected===null){
    selected=idx;
  } else if(selected===idx){
    selected=null;
  } else {
    toggleEdge(selected,idx);
    selected=null;
    if(checkComplete()){
      won=true;
      elapsed=(performance.now()-startTime)/1000;
      webs++;
      if(bestTime===null||elapsed<bestTime){
        bestTime=elapsed;
        try{localStorage.setItem('spiderwebweave_best',bestTime);}catch(e){}
      }
      SFX.win();
      message=I18N.t('web_complete','Web complete in {t}s!').replace('{t}',elapsed.toFixed(1));
      setTimeout(()=>{level++;genLevel();},1600);
    }
  }
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  c.dispatchEvent(new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY}));
},{passive:false});

function drawEdge(a,b,color,width){
  const A=anchors[a],B=anchors[b];
  ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#14142a');bg.addColorStop(1,'#3d2b56');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // faint target pattern
  targetEdges.forEach(([a,b])=>{
    const done=hasEdge(drawnEdges,a,b);
    drawEdge(a,b,done?'rgba(200,168,255,0.15)':'rgba(200,168,255,0.35)',1.5);
  });
  // drawn threads
  drawnEdges.forEach(([a,b])=>{
    const isTarget=hasEdge(targetEdges,a,b);
    drawEdge(a,b,isTarget?'#e8e8ff':'#ff6b6b',2.5);
  });

  // anchors
  anchors.forEach((a,i)=>{
    ctx.fillStyle=selected===i?'#ffd54f':'#c9a8ff';
    ctx.beginPath();ctx.arc(a.x,a.y,selected===i?11:8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });

  // center spider
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();

  if(!won){
    elapsed=(performance.now()-startTime)/1000;
  }

  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {l}').replace('{l}',level),20,30);
  ctx.fillText(I18N.t('progress_label','Threads: {d}/{t}').replace('{d}',drawnEdges.length).replace('{t}',targetEdges.length),20,54);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('time_label','Time: {s}s').replace('{s}',elapsed.toFixed(1)),W-20,30);

  if(message){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(message,W/2,H-30);
  }

  document.getElementById('score-display').textContent=
    I18N.t('web_score_label','Webs: {w} | Best Time: {b}').replace('{w}',webs).replace('{b}',bestTime===null?'—':bestTime.toFixed(1)+'s');

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
