<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3d2e1f;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ec850;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#hud{display:flex;justify-content:center;gap:14px;color:#fff;font-size:.92rem;padding:0 8px 6px;flex-wrap:wrap}
#hud span{background:rgba(255,255,255,.08);border-radius:10px;padding:4px 12px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Solar Farm Layout Planning</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="hud"><span id="plot-label">Plot 1</span><span id="target-label">Target: 0/0</span><span id="lives-label">Lives: 3</span><span id="time-label">Time: 0s</span></div>
    <canvas id="c" width="760" height="470"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Up/Down Arrows</b> (or tap a row) to pick a row, then <b>Space/Enter</b> (or tap again) to place a line of panels. Leave enough gap rows between panel rows to avoid shading, and dodge the blocked terrain!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=760,H=470;
const scoreEl=document.getElementById('score-display');
const plotEl=document.getElementById('plot-label');
const targetEl=document.getElementById('target-label');
const livesEl=document.getElementById('lives-label');
const timeEl=document.getElementById('time-label');
const HI_KEY='solarfarmlayoutplanning_hi';

const COLS=12,ROWS=8;
const GRID_X=20,GRID_Y=46,CELL=58;

let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0;
let score=0,lives=3,plot=1,state='ready'; // ready, playing, roundend, gameover, win
let grid=[],placedRows=[],selRow=0,minGap=1,target=0,roundScore=0,timeLeft=0,timeLimit=30;
let msg='',msgTimer=0,flash=0;

function genGrid(density){
  grid=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let col=0;col<COLS;col++) row.push(Math.random()<density?1:0);
    grid.push(row);
  }
}

function resetRound(n){
  plot=n;
  const density=Math.min(0.35,0.05+n*0.035);
  minGap=1+Math.floor((n-1)/2);
  timeLimit=Math.max(14,30-(n-1)*1.8);
  genGrid(density);
  placedRows=[];
  selRow=0;
  roundScore=0;
  let avail=0;
  grid.forEach(row=>row.forEach(v=>{if(v===0)avail++;}));
  target=Math.round(avail*0.42);
  timeLeft=timeLimit;
  state='playing';
  plotEl.textContent=I18N.t('plot_label','Plot {n}').replace('{n}',n);
}

function startGame(){
  score=0;lives=3;msg='';msgTimer=0;
  resetRound(1);
}

function setMsg(t,dur){msg=t;msgTimer=dur||1.6;}

function rowPanelCount(r){ return grid[r].filter(v=>v===0).length; }

function canPlace(r){
  if(placedRows.includes(r))return false;
  for(const pr of placedRows){
    if(Math.abs(pr-r)<=minGap)return false;
  }
  return true;
}

function attemptPlace(r){
  if(state!=='playing')return;
  if(canPlace(r)){
    placedRows.push(r);
    const n=rowPanelCount(r);
    roundScore+=n;
    score+=n*10;
    if(score>hi)hi=score;
    SFX.coin();
    flash=0.25;
  } else {
    lives--;
    SFX.error();
    flash=-0.25;
    if(lives<=0){
      state='gameover';
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
      SFX.lose();
    } else {
      setMsg(I18N.t('too_close','Too close — shading violation!'),1.1);
    }
  }
}

document.addEventListener('keydown',e=>{
  if(state==='ready'){ if(e.code==='Space'||e.code==='Enter'){startGame();} return; }
  if(state==='gameover'||state==='win'){ if(e.code==='Space'||e.code==='Enter'){startGame();} return; }
  if(state!=='playing')return;
  if(e.code==='ArrowUp'){e.preventDefault();selRow=Math.max(0,selRow-1);}
  else if(e.code==='ArrowDown'){e.preventDefault();selRow=Math.min(ROWS-1,selRow+1);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();attemptPlace(selRow);}
});

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  if(state==='ready'||state==='gameover'||state==='win'){startGame();return;}
  const p=getPos(e);
  const r=Math.floor((p.y-GRID_Y)/CELL);
  if(r<0||r>=ROWS)return;
  if(r===selRow){ attemptPlace(r); }
  else { selRow=r; SFX.select(); }
});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});

function drawGrid(){
  ctx.fillStyle='#4a3826';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    for(let col=0;col<COLS;col++){
      const x=GRID_X+col*CELL,y=GRID_Y+r*CELL;
      const blocked=grid[r][col]===1;
      const placedHere=placedRows.includes(r)&&!blocked;
      ctx.fillStyle=blocked?'#5d4428':(placedHere?'#2d6cb5':'#6b5636');
      ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      if(blocked){
        ctx.fillStyle='#3d7a3d';
        ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,CELL*0.28,0,Math.PI*2);ctx.fill();
      } else if(placedHere){
        ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
        ctx.strokeRect(x+6,y+6,CELL-12,CELL-12);
        ctx.fillStyle='rgba(255,255,255,.25)';
        ctx.fillRect(x+6,y+CELL/2-2,CELL-12,2);
      }
    }
  }
  // row highlight
  const hy=GRID_Y+selRow*CELL;
  ctx.strokeStyle=flash>0?'#4caf50':(flash<0?'#e94560':'#ffd54f');
  ctx.lineWidth=3;
  ctx.strokeRect(GRID_X,hy,COLS*CELL,CELL);
}

function drawCenterText(lines,sub){
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
  ctx.fillText(lines,W/2,H/2-10);
  if(sub){ctx.font='17px Arial';ctx.fillStyle='#ffd54f';ctx.fillText(sub,W/2,H/2+26);}
  ctx.restore();
}

function updateHud(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  livesEl.textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',lives);
  targetEl.textContent=I18N.t('target_label','Target: {a}/{b}').replace('{a}',Math.min(roundScore,target)).replace('{b}',target);
  timeEl.textContent=I18N.t('time_label','Time: {t}s').replace('{t}',Math.ceil(Math.max(0,timeLeft)));
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  drawGrid();
  if(flash!==0){ flash-=Math.sign(flash)*dt*1.5; if(Math.abs(flash)<0.02)flash=0; }

  if(state==='ready'){
    drawCenterText(I18N.t('tap_to_start','Tap / Space to Start'),I18N.t('layout_hint','Place panel rows, avoid rocks, mind the spacing'));
  } else if(state==='playing'){
    timeLeft-=dt;
    if(roundScore>=target){
      SFX.success();
      setMsg(I18N.t('plot_passed','Plot {n} complete!').replace('{n}',plot),1.4);
      state='roundend';
    } else if(timeLeft<=0){
      lives--;
      SFX.fail();
      if(lives<=0){
        state='gameover';
        if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
        SFX.lose();
      } else {
        setMsg(I18N.t('time_up','Time is up! Lost a life.'),1.4);
        state='roundend';
      }
    }
  } else if(state==='roundend'){
    msgTimer-=dt;
    drawCenterText(msg);
    if(msgTimer<=0){
      if(plot>=8 && msg.indexOf('complete')>=0){
        state='win';
        if(score>hi)hi=score;
        localStorage.setItem(HI_KEY,String(Math.floor(hi)));
        SFX.win();
      } else if(msg.indexOf('complete')>=0){
        resetRound(plot+1);
      } else {
        resetRound(plot);
      }
    }
  } else if(state==='gameover'){
    drawCenterText(I18N.t('game_over_title','GAME OVER'),I18N.t('restart_hint','Tap or Space to restart'));
  } else if(state==='win'){
    drawCenterText(I18N.t('you_win_title','YOU WIN! Master Planner!'),I18N.t('restart_hint','Tap or Space to restart'));
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
