<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1410;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#hud{color:#ffb74d;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#80deea}
#hud span.hs{color:#7ec850}
#safeBtnRow{display:flex;justify-content:center;gap:10px;padding:6px 10px}
#safeBtnRow button{padding:12px 26px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.05rem;color:#1a1410;background:#aed581}
#safeBtnRow button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Climbing Harness Inspection</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="safeBtnRow"><button id="safeBtn">0 Looks Safe</button></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Inspect the harness zones for <b>fraying webbing</b>, a <b>mis-threaded buckle</b>, or a <b>stuck carabiner gate</b>. Press the <b>number key</b> for the faulty zone (or tap it), or press <b>0</b> / tap <b>Looks Safe</b> if nothing is wrong, before the clock runs out.</div>
</div>
<script>
(function(){
const HS_KEY='climbingharnessinspection_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;

const ZONES=[
  {key:'waist', label:'Waist Webbing', x:260, y:150, w:280, h:36},
  {key:'buckle', label:'Buckle', x:560, y:140, w:70, h:56},
  {key:'legloop', label:'Leg Loop', x:300, y:220, w:200, h:30},
  {key:'biner', label:'Carabiner', x:180, y:100, w:60, h:90}
];
const FAULTS={
  waist:'frayed_webbing',
  buckle:'bad_thread',
  legloop:'frayed_webbing',
  biner:'stuck_gate'
};
const FAULT_LABELS={
  frayed_webbing:'The webbing shows visible fraying',
  bad_thread:'The buckle is not threaded back through',
  stuck_gate:'The carabiner gate will not snap closed'
};

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let faultZone=null,resolved=false,resolveTimer=0,resolveOk=false,timeLeft=0,timeLimit=0;
let zoneRects=[];

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function activeZones(){
  const n=Math.min(ZONES.length,3+Math.floor(level/2));
  return ZONES.slice(0,n);
}

function newInspection(){
  const zones=activeZones();
  const faultChance=Math.min(0.85,0.5+level*0.03);
  faultZone=(Math.random()<faultChance)?zones[Math.floor(Math.random()*zones.length)].key:null;
  timeLimit=Math.max(150,320-level*14);
  timeLeft=timeLimit;
  resolved=false;
  layoutZones(zones);
}

function layoutZones(zones){
  zoneRects=zones.map((z,i)=>({...z}));
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newInspection(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failInspection(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  resolveOk=false;resolveTimer=50;resolved=true;
}

function passInspection(){
  score+=25*level;SFX.success();
  if(score>=level*240)levelUp();
  resolveOk=true;resolveTimer=38;resolved=true;
}

function onPick(zoneKeyOrSafe){
  if(!started||gameOver||resolved)return;
  if(zoneKeyOrSafe==='safe'){
    if(faultZone===null){ passInspection(); } else { failInspection(); }
  } else {
    if(zoneKeyOrSafe===faultZone){ passInspection(); } else { failInspection(); }
  }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

document.getElementById('safeBtn').addEventListener('pointerdown',e=>{e.stopPropagation(); if(!started||gameOver){startGame();return;} onPick('safe');});

c.addEventListener('pointerdown',e=>{
  if(!started||gameOver){startGame();return;}
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
  for(const z of zoneRects){
    if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){ onPick(z.key); return; }
  }
});

document.addEventListener('keydown',e=>{
  if(e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  if(!started||gameOver)return;
  if(e.code==='Digit0'){ e.preventDefault(); onPick('safe'); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m){
    e.preventDefault();
    const idx=parseInt(m[1],10)-1;
    if(zoneRects[idx])onPick(zoneRects[idx].key);
  }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawZone(z,i){
  const isFault=z.key===faultZone;
  ctx.save();
  ctx.fillStyle=isFault?'#8d6e63':'#607d8b';
  ctx.fillRect(z.x,z.y,z.w,z.h);
  ctx.strokeStyle=isFault?'#d84315':'#263238';
  ctx.lineWidth=3;
  ctx.strokeRect(z.x,z.y,z.w,z.h);
  if(isFault){
    ctx.strokeStyle='#ff5252';ctx.lineWidth=2;
    ctx.beginPath();
    for(let k=0;k<4;k++){
      const fx=z.x+10+k*(z.w-20)/3,fy=z.y+z.h/2;
      ctx.moveTo(fx,fy-8);ctx.lineTo(fx+6,fy+8);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText((i+1)+' '+I18N.t('zone_'+z.key,z.label),z.x+z.w/2,z.y+z.h+16);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2b2018');bg.addColorStop(1,'#1a1410');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ffb74d';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!resolved){
    timeLeft--;
    if(timeLeft<=0){ failInspection(); }
  } else {
    resolveTimer--;
    if(resolveTimer<=0){ newInspection(); }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('inspect_hint','Find the unsafe part, or call it safe'),W/2,30);

  if(!resolved){
    const barW=420,barH=10,barX=W/2-barW/2,barY=44;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  } else {
    ctx.fillStyle=resolveOk?'#2ecc71':'#e74c3c';
    ctx.font='bold 20px Arial';
    const msg=resolveOk
      ? (faultZone?I18N.t('found_fault','Caught it! '+(FAULT_LABELS[FAULTS[faultZone]]||'')):I18N.t('confirmed_safe','Confirmed safe — good eye!'))
      : I18N.t('missed_fault','Wrong call — that gear would have failed!');
    ctx.fillText(msg,W/2,50);
  }

  zoneRects.forEach((z,i)=>drawZone(z,i));

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
