<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Speed Reading</title><meta name="description" content="Play Speed Reading free online — Read the passage before time runs out, then answer a quick comprehension question about what you just read."><link rel="canonical" href="https://games.multiportllc.com/games/speedreading"><meta property="og:title" content="Speed Reading - Multiport Games"><meta property="og:description" content="Play Speed Reading free online — Read the passage before time runs out, then answer a quick comprehension question about what you just read."><meta property="og:url" content="https://games.multiportllc.com/games/speedreading"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Speed Reading","description":"Play Speed Reading free online instantly. Read the passage before time runs out, then answer a quick comprehension question about what you just read. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/speedreading","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#sr-frame{background:#16213e;border-radius:14px;padding:20px;max-width:520px;margin:0 auto;color:#fff;text-align:center}
#sr-timerbar{height:8px;background:rgba(255,255,255,0.15);border-radius:4px;margin-bottom:14px;overflow:hidden}
#sr-timerfill{height:100%;background:#4fc3f7;width:100%;transition:width 0.1s linear}
#sr-passage{font-size:1.05rem;line-height:1.5;min-height:120px;text-align:left}
#sr-question{font-size:1.1rem;font-weight:700;margin:14px 0 10px}
.sr-choice{display:block;width:100%;background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:8px;padding:10px;margin:6px 0;font-size:1rem;cursor:pointer;text-align:left}
.sr-choice:hover{background:rgba(255,255,255,0.2)}
#score-display{color:#4fc3f7;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Speed Reading</div>
  <div class="game-frame">
    <div id="score-display">Passages: 0 | Lives: 3</div>
    <div id="sr-frame">
      <div id="sr-timerbar"><div id="sr-timerfill"></div></div>
      <div id="sr-passage"></div>
      <div id="sr-question" style="display:none"></div>
      <div id="sr-choices"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the passage before it disappears, then answer the <b>comprehension question</b> about it. Wrong answers or running out of time cost a life!</div>
</div>
<script>
const PASSAGES = [
  {text:"Maria planted three rows of tomatoes in her garden every spring. This year she added a row of peppers next to them.", q:"What did Maria add this year?", choices:["Peppers","Carrots","Onions","Beans"], answer:0},
  {text:"The old lighthouse keeper climbed 87 steps every evening to light the lamp. He had done this every day for twenty-two years.", q:"How many steps did he climb?", choices:["50","65","87","100"], answer:2},
  {text:"Before the marathon, runners lined up at dawn. The race began at exactly 6:15 AM under a cloudy sky.", q:"What time did the race begin?", choices:["5:45 AM","6:00 AM","6:15 AM","7:00 AM"], answer:2},
  {text:"The bakery on Elm Street sells fresh sourdough every Tuesday and Friday. On other days it only offers day-old bread.", q:"On which days is fresh sourdough sold?", choices:["Monday and Wednesday","Tuesday and Friday","Every day","Weekends only"], answer:1},
  {text:"A hummingbird can flap its wings up to 80 times per second. This rapid motion lets it hover in place while feeding.", q:"What does the rapid wing motion let the hummingbird do?", choices:["Fly backwards only","Hover in place","Swim underwater","Change color"], answer:1},
  {text:"The museum's new exhibit features fossils from three continents: Africa, Asia, and South America.", q:"How many continents are featured?", choices:["Two","Three","Four","Five"], answer:1},
  {text:"Jacob forgot his umbrella at home, so he borrowed one from his coworker Lin before walking to the train station.", q:"Who did Jacob borrow an umbrella from?", choices:["His neighbor","Lin","His brother","A stranger"], answer:1},
  {text:"The recipe calls for two cups of flour, one cup of sugar, and a pinch of salt, baked at 350 degrees for 25 minutes.", q:"At what temperature should it bake?", choices:["300 degrees","325 degrees","350 degrees","400 degrees"], answer:2},
  {text:"The library extended its hours during exam week, staying open until midnight instead of the usual 9 PM closing time.", q:"Why did the library extend its hours?", choices:["A holiday","Exam week","A book fair","Renovation"], answer:1},
  {text:"Captain Reyes steered the fishing boat north, chasing a school of mackerel that had been spotted near the reef.", q:"Which direction did the boat go?", choices:["South","East","West","North"], answer:3},
  {text:"The children built a sandcastle with four towers and a moat, but the tide washed it away before sunset.", q:"How many towers did the sandcastle have?", choices:["Two","Three","Four","Five"], answer:2},
  {text:"After the storm, the power was out for six hours before crews restored electricity to the whole neighborhood.", q:"How long was the power out?", choices:["Two hours","Four hours","Six hours","Ten hours"], answer:2},
  {text:"The chess tournament had thirty-two players competing, and the final match lasted nearly three hours.", q:"How many players competed?", choices:["Sixteen","Twenty","Thirty-two","Fifty"], answer:2},
  {text:"Ana adopted a gray tabby cat from the shelter and named him Pepper because of the dark spots on his fur.", q:"What did Ana name the cat?", choices:["Whiskers","Pepper","Shadow","Tiger"], answer:1},
  {text:"The train departs from platform 9 every hour on the half-hour, arriving at the coast three stops later.", q:"From which platform does the train depart?", choices:["Platform 5","Platform 7","Platform 9","Platform 12"], answer:2},
  {text:"The chef added fresh basil and a squeeze of lemon to the pasta just before serving it to the guests.", q:"What did the chef add just before serving?", choices:["Basil and lemon","Garlic and oil","Cheese only","Pepper and salt"], answer:0},
  {text:"Twelve volunteers spent the weekend cleaning up the riverbank, collecting over 200 pounds of litter.", q:"How many volunteers helped clean up?", choices:["Six","Ten","Twelve","Twenty"], answer:2},
  {text:"The astronaut spent 180 days aboard the space station before returning safely to Earth in a capsule.", q:"How many days did the astronaut spend in space?", choices:["90 days","120 days","180 days","365 days"], answer:2},
  {text:"The orchestra tuned their instruments quietly backstage while the audience took their seats in the concert hall.", q:"Where did the orchestra tune their instruments?", choices:["On stage","Backstage","In the lobby","Outside"], answer:1},
  {text:"Every autumn, the maple trees along the boulevard turn a deep shade of red before dropping their leaves.", q:"What season is being described?", choices:["Spring","Summer","Autumn","Winter"], answer:2},
];

let round=0,lives=3,gameOver=false,timerInterval=null,timeLeft=0,timeMax=0,current=null;

function shuffled(arr){return [...arr].sort(()=>Math.random()-0.5);}

function updateHUD(){
  document.getElementById('score-display').textContent=I18N.t('passages_lives_label','Passages: {n} | Lives: {l}').replace('{n}',round).replace('{l}',Math.max(0,lives));
}

function startRound(){
  if(gameOver)return;
  current=PASSAGES[Math.floor(Math.random()*PASSAGES.length)];
  timeMax=Math.max(3,6-round*0.15);
  timeLeft=timeMax;
  document.getElementById('sr-passage').textContent=current.text;
  document.getElementById('sr-passage').style.display='block';
  document.getElementById('sr-question').style.display='none';
  document.getElementById('sr-choices').innerHTML='';
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft-=0.1;
    document.getElementById('sr-timerfill').style.width=Math.max(0,(timeLeft/timeMax)*100)+'%';
    if(timeLeft<=0){
      clearInterval(timerInterval);
      showQuestion();
    }
  },100);
}

function showQuestion(){
  document.getElementById('sr-passage').style.display='none';
  const qDiv=document.getElementById('sr-question');
  qDiv.style.display='block';
  qDiv.textContent=current.q;
  const choicesDiv=document.getElementById('sr-choices');
  choicesDiv.innerHTML='';
  const order=current.choices.map((c,i)=>i);
  shuffled(order).forEach(idx=>{
    const btn=document.createElement('button');
    btn.className='sr-choice';
    btn.textContent=current.choices[idx];
    btn.onclick=()=>{
      if(idx===current.answer){
        round++;
        SFX.success();
        updateHUD();
        setTimeout(startRound,600);
      }else{
        loseLife();
      }
    };
    choicesDiv.appendChild(btn);
  });
}

function loseLife(){
  lives--;
  SFX.error();
  updateHUD();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(startRound,800);
  }
}

function endGame(){
  gameOver=true;
  clearInterval(timerInterval);
  SFX.lose();
  document.getElementById('sr-passage').style.display='block';
  document.getElementById('sr-question').style.display='none';
  document.getElementById('sr-choices').innerHTML='';
  document.getElementById('sr-passage').textContent=I18N.t('game_over_passages','Game Over! Passages answered correctly: {n}').replace('{n}',round);
  const retryBtn=document.createElement('button');
  retryBtn.className='sr-choice';
  retryBtn.textContent=I18N.t('play_again_btn','Play Again');
  retryBtn.onclick=()=>{
    gameOver=false;round=0;lives=3;
    updateHUD();
    startRound();
  };
  document.getElementById('sr-choices').appendChild(retryBtn);
}

updateHUD();
startRound();
</script></body></html>
