<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#e8ddc0;display:block;border-radius:50%;margin:0 auto}
#score-display{color:#ffb74d;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#timerbar-wrap{width:320px;max-width:90vw;height:10px;background:rgba(255,255,255,.15);border-radius:5px;margin:6px auto 12px;overflow:hidden}
#timerbar{height:100%;background:linear-gradient(90deg,#ff7043,#ffca28);width:100%;transition:width .1s linear}
#answer-row{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
#answer-input{width:100px;font-size:1.4rem;text-align:center;padding:8px;border-radius:8px;border:none;font-weight:800}
#submit-btn{padding:9px 22px;background:#ff7043;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Color Vision Test</div>
  <div class="game-frame" style="padding:16px">
    <div id="score-display">Solved: 0 | Hi: 0 | Lives: ❤️❤️❤️</div>
    <div id="timerbar-wrap"><div id="timerbar"></div></div>
    <canvas id="c" width="320" height="320"></canvas>
    <div id="answer-row">
      <input id="answer-input" type="tel" inputmode="numeric" maxlength="2" placeholder="?">
      <button id="submit-btn">Submit</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Look at the dot pattern and type the hidden <b>number</b> you see, then press <b>Submit</b> or <b>Enter</b> before the timer runs out. Each round the color difference gets subtler!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=320,H=320,CX=160,CY=160,R=155;
let solved=0,hi=0,lives=3,level=1,timeLeft,timerMax,timerId,curNum,gameOver=false;
hi=parseInt(localStorage.getItem('colorblindtest_hi')||'0',10);

function scoreLabel(){
  return I18N.t('cvt_score_label','Solved: {s} | Hi: {h} | Lives: {l}')
    .replace('{s}',solved).replace('{h}',hi).replace('{l}','❤️'.repeat(Math.max(0,lives)));
}
function updateHud(){document.getElementById('score-display').textContent=scoreLabel();}

// digit bitmap patterns (5x7 grid of 0/1) for digits 0-9
const DIGITS={
  0:['01110','10001','10011','10101','11001','10001','01110'],
  1:['00100','01100','00100','00100','00100','00100','01110'],
  2:['01110','10001','00001','00010','00100','01000','11111'],
  3:['11111','00010','00100','00010','00001','10001','01110'],
  4:['00010','00110','01010','10010','11111','00010','00010'],
  5:['11111','10000','11110','00001','00001','10001','01110'],
  6:['00110','01000','10000','11110','10001','10001','01110'],
  7:['11111','00001','00010','00100','01000','01000','01000'],
  8:['01110','10001','10001','01110','10001','10001','01110'],
  9:['01110','10001','10001','01111','00001','00010','01100'],
};

function digitCells(num){
  const str=String(num);
  const cellsAll=[];
  const gw=5,gh=7;
  const scale=14;
  const totalW=str.length*gw*scale+((str.length-1)*scale);
  const startX=CX-totalW/2;
  str.split('').forEach((ch,di)=>{
    const pat=DIGITS[ch];
    const offX=startX+di*(gw*scale+scale);
    for(let r=0;r<gh;r++){
      for(let cIdx=0;cIdx<gw;cIdx++){
        if(pat[r][cIdx]==='1'){
          cellsAll.push({x:offX+cIdx*scale,y:CY-(gh*scale)/2+r*scale,w:scale,h:scale});
        }
      }
    }
  });
  return cellsAll;
}

function pointInCells(x,y,cells){
  for(const cell of cells){
    if(x>=cell.x&&x<cell.x+cell.w&&y>=cell.y&&y<cell.y+cell.h)return true;
  }
  return false;
}

function hslToRgb(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))];
}

function drawPattern(num,diff){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#e8ddc0';ctx.fillRect(0,0,W,H);
  const cells=digitCells(num);
  const baseHue=20+Math.random()*20; // orange-ish background family
  const fgHue=baseHue+diff; // subtler as diff shrinks
  let attempts=0;
  const dotCount=850;
  for(let i=0;i<dotCount;i++){
    let x,y;
    let ok=false,tries=0;
    do{
      const ang=Math.random()*Math.PI*2;
      const rad=Math.sqrt(Math.random())*R;
      x=CX+Math.cos(ang)*rad;
      y=CY+Math.sin(ang)*rad;
      tries++;
      ok=true;
    }while(!ok&&tries<5);
    const inNum=pointInCells(x,y,cells);
    const radius=2.5+Math.random()*3.5;
    const hueJitter=(Math.random()-0.5)*14;
    const satJitter=40+Math.random()*20;
    const lightJitter=40+Math.random()*22;
    let hue;
    if(inNum){
      hue=fgHue+hueJitter;
    }else{
      hue=baseHue+hueJitter;
    }
    const [r,g,b]=hslToRgb(hue,satJitter,lightJitter);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(x,y,radius,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='#00000022';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,R-1,0,Math.PI*2);ctx.stroke();
}

function newRound(){
  curNum=1+Math.floor(Math.random()*89);
  if(curNum<10)curNum=10+Math.floor(Math.random()*89);
  curNum=Math.floor(Math.random()*90)+10; // 10-99 two digit for visual clarity
  const diff=Math.max(6,34-level*2.2); // hue difference shrinks with level -> harder
  drawPattern(curNum,diff);
  document.getElementById('answer-input').value='';
  document.getElementById('answer-input').focus();
  timerMax=Math.max(5000,9000-level*250);
  timeLeft=timerMax;
  clearInterval(timerId);
  timerId=setInterval(tick,100);
}

function tick(){
  if(gameOver)return;
  timeLeft-=100;
  document.getElementById('timerbar').style.width=Math.max(0,(timeLeft/timerMax*100))+'%';
  if(timeLeft<=0){
    clearInterval(timerId);
    handleWrong(true);
  }
}

function handleWrong(timedOut){
  SFX.error();
  lives--;
  updateHud();
  if(lives<=0){
    endGame();
  }else{
    level=Math.max(1,level-1);
    newRound();
  }
}

function submitAnswer(){
  if(gameOver)return;
  const val=parseInt(document.getElementById('answer-input').value,10);
  if(val===curNum){
    clearInterval(timerId);
    SFX.success();
    solved++;
    level++;
    if(solved>hi){hi=solved;localStorage.setItem('colorblindtest_hi',hi);}
    updateHud();
    newRound();
  }else{
    handleWrong(false);
  }
}

function endGame(){
  gameOver=true;
  clearInterval(timerId);
  SFX.lose();
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('game_over_title','GAME OVER'),CX,CY-10);
  ctx.font='16px Arial';
  ctx.fillText(I18N.t('cvt_final','Solved: {s} patterns').replace('{s}',solved),CX,CY+20);
  ctx.fillText(I18N.t('restart_hint2','Tap Restart to try again'),CX,CY+46);
  document.getElementById('answer-input').disabled=true;
  document.getElementById('submit-btn').textContent=I18N.t('restart_btn','Restart');
  document.getElementById('submit-btn').onclick=restart;
}

function restart(){
  gameOver=false;
  solved=0;lives=3;level=1;
  document.getElementById('answer-input').disabled=false;
  document.getElementById('submit-btn').textContent=I18N.t('submit_btn','Submit');
  document.getElementById('submit-btn').onclick=submitAnswer;
  updateHud();
  newRound();
}

document.getElementById('submit-btn').onclick=submitAnswer;
document.getElementById('answer-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();submitAnswer();}
});

updateHud();
newRound();
</script></body></html>
