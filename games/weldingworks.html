<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b2b2b;display:block;border-radius:8px;margin:0 auto;touch-action:none;cursor:crosshair}
#score-display{color:#ffb300;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#qualityWrap{max-width:460px;margin:0 auto 8px;background:rgba(255,255,255,.08);border-radius:8px;height:16px;overflow:hidden}
#qualityBar{height:100%;width:100%;background:linear-gradient(90deg,#ff5252,#ffca28,#66bb6a);transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Welding Works</div>
  <div class="game-frame" style="padding:10px">
    <div id="score-display">Seams: 0 | Lives: 3</div>
    <div id="qualityWrap"><div id="qualityBar"></div></div>
    <canvas id="c" width="460" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and <b>hold the mouse</b> or <b>touch and drag</b> the torch along the glowing seam line from start to end. Stay close to the line to keep weld quality high — drifting off costs quality, and a botched weld costs a life.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=460,H=380;
let path,progress,quality,seams,lives,hi,gameOver,welding,torch,level,sparks;

function loadHi(){return +(localStorage.getItem('weldingworks_hi')||0);}
function saveHi(v){if(v>loadHi())localStorage.setItem('weldingworks_hi',v);}

function genPath(lvl){
  // generate a smooth wandering path across the canvas using control points
  const pts=[];
  const n=4+Math.min(4,Math.floor(lvl/2));
  const segW=(W-80)/(n-1);
  for(let i=0;i<n;i++){
    const x=40+i*segW;
    const y=H/2+(Math.sin(i*1.7+lvl)+((Math.random()-0.5)*2))*(60+Math.min(70,lvl*6));
    pts.push({x,y:Math.max(40,Math.min(H-40,y))});
  }
  // densify with quadratic interpolation into many small points for distance checks
  const dense=[];
  const steps=200;
  for(let s=0;s<=steps;s++){
    const t=s/steps*(pts.length-1);
    const i=Math.min(pts.length-2,Math.floor(t));
    const localT=t-i;
    const a=pts[i],b=pts[i+1];
    dense.push({x:a.x+(b.x-a.x)*localT,y:a.y+(b.y-a.y)*localT});
  }
  return dense;
}

function reset(){
  seams=0;lives=3;gameOver=false;level=1;
  hi=loadHi();
  sparks=[];
  newSeam();
}
function newSeam(){
  path=genPath(level);
  progress=0;
  quality=100;
  welding=false;
  torch=null;
}

function torchPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};
}

function nearestOnPath(p){
  let best=1e9,bi=0;
  for(let i=0;i<path.length;i++){
    const d=(path[i].x-p.x)**2+(path[i].y-p.y)**2;
    if(d<best){best=d;bi=i;}
  }
  return {dist:Math.sqrt(best),idx:bi};
}

function startWeld(e){
  if(gameOver){reset();return;}
  const p=torchPos(e);
  const near=nearestOnPath(p);
  if(near.idx<15&&near.dist<40){
    welding=true;
    torch=p;
  }
}
function moveWeld(e){
  if(!welding)return;
  torch=torchPos(e);
}
function endWeld(){
  welding=false;
}

c.addEventListener('mousedown',e=>{startWeld(e);});
c.addEventListener('mousemove',moveWeld);
window.addEventListener('mouseup',endWeld);
c.addEventListener('touchstart',e=>{e.preventDefault();startWeld(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();moveWeld(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endWeld();},{passive:false});

function update(){
  if(gameOver)return;
  if(welding&&torch){
    const near=nearestOnPath(torch);
    // advance progress if moving forward along path near the current progress point
    if(near.idx>=progress-5){
      progress=Math.max(progress,near.idx);
    }
    if(near.dist>35){
      quality-=1.6;
    } else if(near.dist>18){
      quality-=0.5;
    } else {
      quality+=0.15;
      if(Math.random()<0.3)sparks.push({x:torch.x,y:torch.y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:14});
    }
    quality=Math.max(0,Math.min(100,quality));

    if(quality<=0){
      failSeam();
    } else if(progress>=path.length-2){
      completeSeam();
    }
  }
  sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.life--;});
  sparks=sparks.filter(s=>s.life>0);
}

function failSeam(){
  welding=false;
  lives--;
  SFX.error();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    saveHi(seams);hi=loadHi();
  } else {
    newSeam();
  }
}

function completeSeam(){
  welding=false;
  seams++;
  level++;
  if(quality>=70){SFX.success();}else{SFX.point();}
  if(seams>hi)hi=seams;
  newSeam();
}

function draw(){
  ctx.fillStyle='#2b2b2b';ctx.fillRect(0,0,W,H);
  // plate texture
  ctx.strokeStyle='rgba(255,255,255,.03)';
  for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // seam path: unwelded portion dim, welded portion glowing
  ctx.lineWidth=4;
  ctx.strokeStyle='rgba(255,255,255,.25)';
  ctx.beginPath();
  path.forEach((p,i)=>{ if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.stroke();

  if(progress>0){
    ctx.strokeStyle='#ff9800';
    ctx.lineWidth=6;
    ctx.shadowColor='#ffb300';ctx.shadowBlur=12;
    ctx.beginPath();
    for(let i=0;i<=progress;i++){ const p=path[i]; if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  // start/end markers
  ctx.fillStyle='#66bb6a';
  ctx.beginPath();ctx.arc(path[0].x,path[0].y,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ef5350';
  ctx.beginPath();ctx.arc(path[path.length-1].x,path[path.length-1].y,7,0,Math.PI*2);ctx.fill();

  // sparks
  sparks.forEach(s=>{
    ctx.fillStyle=`rgba(255,${150+Math.random()*80|0},50,${Math.max(0,s.life/14)})`;
    ctx.fillRect(s.x,s.y,3,3);
  });

  // torch
  if(torch){
    ctx.fillStyle=welding?'#fff176':'#90a4ae';
    ctx.beginPath();ctx.arc(torch.x,torch.y,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#455a64';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(torch.x,torch.y);ctx.lineTo(torch.x+14,torch.y-14);ctx.stroke();
  }

  document.getElementById('qualityBar').style.width=quality+'%';
  document.getElementById('score-display').textContent=
    I18N.t('seams_lives_label','Seams: {s} | Lives: {l}').replace('{s}',seams).replace('{l}',Math.max(0,lives));

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('seams_hi_label','Seams completed: {s} | Best: {h}').replace('{s}',seams).replace('{h}',hi),W/2,H/2+8);
    ctx.fillText(I18N.t('restart_hint_click','Click or tap to start a new plate'),W/2,H/2+32);
  } else if(!welding&&progress===0){
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('weld_start_hint','Press near the green dot and drag along the seam'),W/2,30);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
