<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Sky Writing</title><meta name="description" content="Play Sky Writing free online — Use Arrow Keys or WASD (or drag/touch) to steer your plane and trace the faint outline in the sky with your trail before the fuel runs out."><link rel="canonical" href="https://games.multiportllc.com/games/skywriting"><meta property="og:title" content="Sky Writing - Multiport Games"><meta property="og:description" content="Play Sky Writing free online — Use Arrow Keys or WASD (or drag/touch) to steer your plane and trace the faint outline in the sky with your trail before the fuel runs out."><meta property="og:url" content="https://games.multiportllc.com/games/skywriting"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Sky Writing","description":"Play Sky Writing free online instantly. Use Arrow Keys or WASD (or drag/touch) to steer your plane and trace the faint outline in the sky with your trail before the fuel runs out. Score is based on how closely your trail matches the target shape. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/skywriting","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#4fa8e0;display:block;border-radius:8px;touch-action:none}
#score-display{color:#bbdefb;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sky Writing</div>
  <div class="game-frame">
    <div id="score-display">Last: 0% | Best: 0% | Shapes: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or drag/touch) to steer your plane. Fly over the faint outline in the sky to trace it with your trail before your fuel runs out — the closer your trail matches the shape, the higher your score!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let score=0,best=parseInt(localStorage.getItem('skywriting_best')||'0'),shapesDone=0;
let started=false,roundOver=false,pauseTimer=0;
const CX=400,CY=210,RAD=130;

const plane={x:100,y:H-60,heading:-Math.PI/2,speed:2.6,minSp:1.4,maxSp:4.2};
let trail=[];
let fuel=100,fuelMax=100,fuelRate=0.42;
let target=[];
let keys={};
let touchPos=null,touching=false;

function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}

function genShape(){
  const type=Math.floor(Math.random()*5);
  const pts=[];
  const n=64;
  if(type===0){ // circle
    for(let i=0;i<=n;i++){const t=i/n*Math.PI*2;pts.push({x:CX+Math.cos(t)*RAD,y:CY+Math.sin(t)*RAD});}
  } else if(type===1){ // star
    const spikes=5,outer=RAD,inner=RAD*0.45;
    for(let i=0;i<=spikes*2;i++){
      const r=i%2===0?outer:inner;
      const t=i/(spikes*2)*Math.PI*2 - Math.PI/2;
      pts.push({x:CX+Math.cos(t)*r,y:CY+Math.sin(t)*r});
    }
  } else if(type===2){ // triangle
    for(let i=0;i<=3;i++){
      const t=i/3*Math.PI*2 - Math.PI/2;
      pts.push({x:CX+Math.cos(t)*RAD,y:CY+Math.sin(t)*RAD});
    }
  } else if(type===3){ // heart (parametric)
    for(let i=0;i<=n;i++){
      const t=i/n*Math.PI*2;
      const hx=16*Math.pow(Math.sin(t),3);
      const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      pts.push({x:CX+hx*7,y:CY-hy*7});
    }
  } else { // square
    const s=RAD*0.9;
    const corners=[[-s,-s],[s,-s],[s,s],[-s,s],[-s,-s]];
    for(const [dx,dy] of corners)pts.push({x:CX+dx,y:CY+dy});
  }
  return pts;
}

function newRound(){
  target=genShape();
  trail=[];
  fuel=fuelMax;
  plane.x=100;plane.y=H-60;plane.heading=-Math.PI/2;plane.speed=2.6;
  roundOver=false;
  pauseTimer=0;
}

function keyDown(e){
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();
  keys[k]=true;
  if(!started)started=true;
}
function keyUp(e){ keys[e.key.toLowerCase()]=false; }
document.addEventListener('keydown',keyDown);
document.addEventListener('keyup',keyUp);

function canvasPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
}
function onDown(e){ e.preventDefault(); if(!started)started=true; touching=true;touchPos=canvasPos(e); }
function onMove(e){ if(touching){e.preventDefault();touchPos=canvasPos(e);} }
function onUp(){ touching=false; }
c.addEventListener('mousedown',onDown);
c.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
c.addEventListener('touchstart',onDown,{passive:false});
c.addEventListener('touchmove',onMove,{passive:false});
c.addEventListener('touchend',onUp);

function scoreRound(){
  const hitRadius=20;
  let hits=0;
  for(const p of target){
    let minD=Infinity;
    for(const tp of trail){
      const d=Math.hypot(p.x-tp.x,p.y-tp.y);
      if(d<minD)minD=d;
      if(minD<hitRadius)break;
    }
    if(minD<hitRadius)hits++;
  }
  return Math.round(hits/target.length*100);
}

function drawPlane(){
  ctx.save();
  ctx.translate(plane.x,plane.y);
  ctx.rotate(plane.heading+Math.PI/2);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-8);ctx.lineTo(-6,0);ctx.lineTo(-10,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd54f';ctx.fillRect(-8,-1,6,2);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1e88c7');sky.addColorStop(1,'#7ec8f0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // clouds decor
  ctx.fillStyle='rgba(255,255,255,0.25)';
  [[100,80,40],[650,340,50],[720,90,30],[60,300,35]].forEach(([x,y,r])=>{
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r*0.8,y+6,r*0.7,0,Math.PI*2);ctx.arc(x-r*0.8,y+8,r*0.6,0,Math.PI*2);ctx.fill();
  });

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key or tap to start'),W/2,40);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=3;ctx.setLineDash([6,8]);
    ctx.beginPath();target.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);
    drawPlane();
    requestAnimationFrame(loop);return;
  }

  // draw target outline (faint)
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.setLineDash([6,8]);
  ctx.beginPath();target.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);

  if(roundOver){
    pauseTimer++;
    ctx.strokeStyle='#ffee58';ctx.lineWidth=3;
    ctx.beginPath();trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('round_complete_label','Shape Score: {s}%').replace('{s}',score),W/2,H/2);
    if(pauseTimer>90){ newRound(); }
    requestAnimationFrame(loop);return;
  }

  // input -> heading
  let steer=0;
  if(keys['arrowleft']||keys['a'])steer-=1;
  if(keys['arrowright']||keys['d'])steer+=1;
  if(keys['arrowup']||keys['w'])plane.speed=Math.min(plane.maxSp,plane.speed+0.08);
  if(keys['arrowdown']||keys['s'])plane.speed=Math.max(plane.minSp,plane.speed-0.08);

  if(touching&&touchPos){
    const dx=touchPos.x-plane.x, dy=touchPos.y-plane.y;
    if(Math.hypot(dx,dy)>8){
      const targetAngle=Math.atan2(dy,dx);
      steer = Math.max(-1,Math.min(1,norm(targetAngle-plane.heading)*2));
    }
  }
  plane.heading += steer*0.045;

  plane.x += Math.cos(plane.heading)*plane.speed;
  plane.y += Math.sin(plane.heading)*plane.speed;
  if(plane.x<12){plane.x=12;plane.heading=Math.PI-plane.heading;}
  if(plane.x>W-12){plane.x=W-12;plane.heading=Math.PI-plane.heading;}
  if(plane.y<12){plane.y=12;plane.heading=-plane.heading;}
  if(plane.y>H-12){plane.y=H-12;plane.heading=-plane.heading;}

  trail.push({x:plane.x,y:plane.y});
  if(trail.length>4000)trail.shift();

  fuel -= fuelRate;
  if(fuel<=0){
    fuel=0;
    score=scoreRound();
    shapesDone++;
    if(score>best){best=score;localStorage.setItem('skywriting_best',best);}
    if(score>=55)SFX.success(); else SFX.fail();
    roundOver=true;
  }

  // trail
  ctx.strokeStyle='#ffee58';ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.beginPath();trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();

  drawPlane();

  // fuel bar
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(20,20,200,16);
  ctx.fillStyle=fuel>25?'#66bb6a':'#ef5350';ctx.fillRect(20,20,200*(fuel/fuelMax),16);
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(20,20,200,16);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('fuel_label','FUEL'),24,32);

  document.getElementById('score-display').textContent =
    I18N.t('skywriting_status','Last: {s}% | Best: {b}% | Shapes: {n}')
      .replace('{s}',score).replace('{b}',best).replace('{n}',shapesDone);

  requestAnimationFrame(loop);
}
target=genShape();
newRound();
loop();
</script></body></html>
