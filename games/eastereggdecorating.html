<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:10px}
.eggbox{background:#16213e;border-radius:14px;padding:14px;text-align:center}
.eggbox h3{color:#ffd54f;margin:0 0 8px;font-size:.95rem}
#hud{color:#fff;text-align:center;font-weight:800;margin-bottom:10px;font-size:1.05rem}
#timerbar{width:280px;height:10px;background:#0b1030;border-radius:6px;margin:6px auto;overflow:hidden}
#timerfill{height:100%;background:linear-gradient(90deg,#7ec850,#ffd54f);width:100%;transition:width .1s linear}
.palette{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.active{border-color:#fff;transform:scale(1.15)}
.patternbtns{display:flex;gap:8px;justify-content:center;margin:8px 0}
.patternbtns button{padding:6px 12px;border-radius:16px;border:none;background:#3a3a5c;color:#fff;cursor:pointer;font-size:.85rem}
.patternbtns button.active{background:#e94560}
#msg{color:#7ec850;font-weight:800;min-height:1.4em;margin-top:8px}
#nextBtn{margin-top:8px;padding:8px 20px;border-radius:20px;border:none;background:#e94560;color:#fff;cursor:pointer;font-size:.95rem;display:none}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Easter Egg Decorating</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud">Round 1 | Score: 0 | Best: 0</div>
    <div id="timerbar"><div id="timerfill"></div></div>
    <div id="wrap">
      <div class="eggbox"><h3>Reference</h3><canvas id="ref" width="140" height="180"></canvas></div>
      <div class="eggbox"><h3>Your Egg</h3><canvas id="egg" width="140" height="180"></canvas></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="patternbtns" id="patternbtns">
      <button data-p="plain" class="active">Plain</button>
      <button data-p="dot">● Dot</button>
      <button data-p="stripe">▬ Stripe</button>
    </div>
    <div id="msg"></div>
    <button id="nextBtn">Next Egg ▶</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Match the reference egg! Click a color, then click egg zones to paint them. Click a pattern, then click a zone to stamp dots or stripes. Match the reference as closely as you can before time runs out.</div>
</div>
<script>
const COLORS=['#e94560','#ffd54f','#7ec850','#4fc3f7','#ba68c8','#ff8a65','#ffffff','#3a3a5c'];
const refCv=document.getElementById('ref'),refCtx=refCv.getContext('2d');
const eggCv=document.getElementById('egg'),eggCtx=eggCv.getContext('2d');
let round=1,score=0,best=+(localStorage.getItem('eastereggdecorating_best')||0);
let zones=[]; // {cx,cy,r-ish bounding row band index} we'll use horizontal bands
let refData=[]; // per zone: {color,pattern}
let myData=[];
let curColor=COLORS[0],curPattern='plain';
let timeLeft=0,timerId=null,roundActive=false;

document.getElementById('hud').textContent=`Round ${round} | Score: ${score} | Best: ${best}`;

function buildPalette(){
  const p=document.getElementById('palette');
  p.innerHTML='';
  COLORS.forEach((c,i)=>{
    const s=document.createElement('div');
    s.className='swatch'+(i===0?' active':'');
    s.style.background=c;
    s.onclick=()=>{curColor=c;[...p.children].forEach(ch=>ch.classList.remove('active'));s.classList.add('active');SFX.select();};
    p.appendChild(s);
  });
}
buildPalette();

document.querySelectorAll('#patternbtns button').forEach(b=>{
  b.onclick=()=>{
    curPattern=b.dataset.p;
    document.querySelectorAll('#patternbtns button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    SFX.select();
  };
});

function numZones(){ return Math.min(3+Math.floor((round-1)/2),8); }

function eggPath(ctx){
  ctx.beginPath();
  ctx.moveTo(70,178);
  ctx.bezierCurveTo(10,178,8,90,30,45);
  ctx.bezierCurveTo(42,15,98,15,110,45);
  ctx.bezierCurveTo(132,90,130,178,70,178);
  ctx.closePath();
}

function genRef(){
  const n=numZones();
  refData=[];
  for(let i=0;i<n;i++){
    const pat = Math.random()<0.55 ? (Math.random()<0.5?'dot':'stripe') : 'plain';
    refData.push({color:COLORS[Math.floor(Math.random()*COLORS.length)],pattern:pat});
  }
  myData=refData.map(()=>({color:null,pattern:'plain'}));
}

function drawEggBands(ctx,data,topY,botY){
  ctx.save();
  eggPath(ctx);
  ctx.clip();
  ctx.fillStyle='#fff8ec';
  ctx.fillRect(0,0,140,180);
  const n=data.length;
  const bandH=(botY-topY)/n;
  for(let i=0;i<n;i++){
    const y=topY+i*bandH;
    const d=data[i];
    ctx.fillStyle=d.color||'#fff8ec';
    ctx.fillRect(0,y,140,bandH+1);
    if(d.pattern==='dot'&&d.color){
      ctx.fillStyle='rgba(0,0,0,.35)';
      for(let dx=15;dx<130;dx+=22){
        ctx.beginPath();ctx.arc(dx,y+bandH/2,4,0,7);ctx.fill();
      }
    } else if(d.pattern==='stripe'&&d.color){
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.fillRect(0,y+bandH*0.35,140,bandH*0.3);
    }
  }
  ctx.restore();
  ctx.save();
  eggPath(ctx);
  ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.stroke();
  ctx.restore();
}

function renderRef(){
  refCtx.clearRect(0,0,140,180);
  drawEggBands(refCtx,refData,15,178);
}
function renderMine(){
  eggCtx.clearRect(0,0,140,180);
  drawEggBands(eggCtx,myData,15,178);
}

eggCv.addEventListener('click',e=>handleClick(e));
eggCv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const r=eggCv.getBoundingClientRect();handleClick({clientX:t.clientX,clientY:t.clientY,rect:r});},{passive:false});

function handleClick(e){
  if(!roundActive)return;
  const rect=e.rect||eggCv.getBoundingClientRect();
  const scaleY=180/rect.height;
  const y=(e.clientY-rect.top)*scaleY;
  const n=myData.length;
  const topY=15,botY=178;
  const bandH=(botY-topY)/n;
  let idx=Math.floor((y-topY)/bandH);
  if(idx<0||idx>=n)return;
  myData[idx]={color:curColor,pattern:curPattern};
  renderMine();
  SFX.click();
}

function startRound(){
  genRef();
  renderRef();
  renderMine();
  document.getElementById('msg').textContent='';
  document.getElementById('nextBtn').style.display='none';
  roundActive=true;
  timeLeft=Math.max(10, 18 - round*0.5);
  const totalTime=timeLeft;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft-=0.1;
    document.getElementById('timerfill').style.width=Math.max(0,(timeLeft/totalTime*100))+'%';
    if(timeLeft<=0){
      clearInterval(timerId);
      finishRound();
    }
  },100);
}

function finishRound(){
  roundActive=false;
  let matches=0;
  for(let i=0;i<refData.length;i++){
    if(myData[i].color===refData[i].color && myData[i].pattern===refData[i].pattern)matches++;
  }
  const pct=Math.round(matches/refData.length*100);
  const pts=matches*10;
  score+=pts;
  if(score>best){best=score;localStorage.setItem('eastereggdecorating_best',best);}
  document.getElementById('hud').textContent=`Round ${round} | Score: ${score} | Best: ${best}`;
  if(pct>=100){
    document.getElementById('msg').textContent=I18N.t('egg_perfect','🎉 Perfect match! +{p} pts').replace('{p}',pts);
    SFX.win();
  } else if(pct>=50){
    document.getElementById('msg').textContent=I18N.t('egg_good','Nice! {pct}% match, +{p} pts').replace('{pct}',pct).replace('{p}',pts);
    SFX.success();
  } else {
    document.getElementById('msg').textContent=I18N.t('egg_bad','Time up! Only {pct}% match, +{p} pts').replace('{pct}',pct).replace('{p}',pts);
    SFX.fail();
  }
  document.getElementById('nextBtn').style.display='inline-block';
}

document.getElementById('nextBtn').onclick=()=>{
  round++;
  startRound();
};

startRound();
</script></body></html>
