<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#e91e63,#ffd54f);display:block;border-radius:8px;margin:0 auto;touch-action:none;cursor:pointer}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Piñata Smash</div>
  <div class="game-frame">
    <div id="score-display">Candy: 0 | Hi: 0</div>
    <canvas id="c" width="480" height="430"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">You're blindfolded! Watch the <b>warmth meter</b> as the piñata sways side to side, then <b>Click / Tap</b> to swing your bat when it feels centered. Land enough hits to burst it for candy — miss too much and it drifts away trickier than before.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=430;
const CX=W/2, ropeTopY=40, ropeLen=140;
let hi=parseInt(localStorage.getItem('pinata_hi')||'0',10);
let candy=0, smashed=0, hitsNeeded=3, hitsLanded=0;
let swayAmp=110, swayFreq=0.018, swayPhase=0, swaySpeed=1;
let t=0, misses=0, gameOver=false, started=false;
let swingAnim=0, burst=[], msg='', msgTimer=0;
let level=1;

function pinataX(){ return CX + Math.sin(t*swayFreq*swaySpeed)*swayAmp; }

function resetPinata(){
  hitsNeeded=3+Math.floor((level-1)/2);
  hitsLanded=0;
  swayAmp=90+level*8;
  swayFreq=0.014+level*0.0018;
  swaySpeed=1+level*0.15;
  t=0;
}

function reset(){
  candy=0; smashed=0; level=1; misses=0; gameOver=false; started=false;
  resetPinata();
  burst=[]; msg=''; msgTimer=0;
}
reset();

function swing(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(swingAnim>0)return;
  swingAnim=1;
  const px=pinataX();
  const dist=Math.abs(px-CX);
  // warmth: 0 (far) .. 1 (dead center)
  const warmth=Math.max(0,1-dist/swayAmp);
  if(warmth>0.72){
    hitsLanded++;
    SFX.hit();
    if(hitsLanded>=hitsNeeded){
      // burst!
      smashed++;
      candy+=10+level*2;
      if(candy>hi){hi=candy;localStorage.setItem('pinata_hi',hi);}
      SFX.success();
      for(let i=0;i<24;i++){
        burst.push({x:px,y:ropeTopY+ropeLen,vx:(Math.random()-0.5)*8,vy:-Math.random()*7-2,life:50,color:['#ffd54f','#e91e63','#4fc3f7','#81c784'][i%4]});
      }
      msg=I18N.t('pinata_burst','🎉 Piñata burst! +{c} candy').replace('{c}',10+level*2);
      msgTimer=90;
      level++;
      setTimeout(()=>{ if(!gameOver) resetPinata(); },700);
    } else {
      msg=I18N.t('pinata_crack','Crack! {a}/{b} hits').replace('{a}',hitsLanded).replace('{b}',hitsNeeded);
      msgTimer=50;
    }
  } else {
    misses++;
    SFX.error();
    msg=I18N.t('pinata_miss','Miss! Too far off.');
    msgTimer=50;
    swayAmp=Math.min(150,swayAmp+6);
    if(misses>=5){
      gameOver=true;
      SFX.lose();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();swing();}});
c.addEventListener('click',swing);
c.addEventListener('touchstart',e=>{e.preventDefault();swing();},{passive:false});

function drawPinata(px,py){
  ctx.save();
  ctx.translate(px,py);
  const crackFrac=hitsLanded/hitsNeeded;
  ctx.fillStyle='#8e24aa';
  ctx.beginPath();ctx.ellipse(0,0,42,50,0,0,Math.PI*2);ctx.fill();
  // stripes
  const colors=['#ff7043','#ffee58','#26c6da','#ec407a'];
  for(let i=0;i<colors.length;i++){
    ctx.fillStyle=colors[i];
    ctx.beginPath();
    ctx.ellipse(0,-38+i*22,40,10,0,0,Math.PI*2);
    ctx.fill();
  }
  // cracks
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;
  for(let i=0;i<Math.floor(crackFrac*5);i++){
    ctx.beginPath();
    ctx.moveTo((i-2)*10,-20+((i*13)%40));
    ctx.lineTo((i-2)*10+8,10+((i*7)%20));
    ctx.stroke();
  }
  ctx.restore();
}

function drawBat(){
  ctx.save();
  const swingT=swingAnim;
  const angle = swingT>0? -0.9+Math.sin(swingT*Math.PI)*1.6 : -0.9;
  ctx.translate(W/2, H-40);
  ctx.rotate(angle);
  ctx.fillStyle='#a1887f';
  ctx.fillRect(-8,-140,16,110);
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(-6,-20,12,30);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#e91e63');g.addColorStop(1,'#ffd54f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // blindfold fog vignette
  const vg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,300);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=vg;

  if(!started){
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pinata_start','Click / Tap / Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  t+=1;
  const px=pinataX();
  const py=ropeTopY+ropeLen;

  // rope
  ctx.strokeStyle='#5d4037';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(px,ropeTopY);ctx.lineTo(px,py-40);ctx.stroke();

  if(!gameOver && (hitsLanded<hitsNeeded || smashed===0)){
    drawPinata(px,py-10);
  }

  // burst particles
  burst=burst.filter(p=>p.life>0);
  burst.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  });

  drawBat();
  if(swingAnim>0){
    swingAnim+=0.12;
    if(swingAnim>1)swingAnim=0;
  }

  // fog overlay
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // warmth meter
  const dist=Math.abs(px-CX);
  const warmth=Math.max(0,1-dist/swayAmp);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(20,H-30,W-40,16);
  ctx.fillStyle = warmth>0.72?'#4caf50':warmth>0.4?'#ffca28':'#ef5350';
  ctx.fillRect(20,H-30,(W-40)*warmth,16);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.strokeRect(20,H-30,W-40,16);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('warmth_label','WARMTH'),W/2,H-34);

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,60);
  }

  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('misses_label','Misses: {n}/5').replace('{n}',misses),10,20);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('pinata_final','Candy: {c} | Piñatas: {p}').replace('{c}',candy).replace('{p}',smashed),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
  }

  document.getElementById('score-display').textContent=I18N.t('candy_hi_label','Candy: {s} | Hi: {h}').replace('{s}',candy).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
