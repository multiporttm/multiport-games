<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#241708;display:block;border-radius:8px;touch-action:none}
#score-display{color:#d4a24c;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Clockwork Toy Assembly</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the blueprint light up a sequence of gears, the mainspring, and the cam. Then click/tap the matching parts on the arbor tray — or press their number key — in the same order. Fit the whole sequence to wind the toy!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisplay=document.getElementById('score-display');
const HS_KEY='hs_clockworktoyassembly';

const PART_DEFS=[
  {color:'#d4a24c',label:'1'},
  {color:'#7ec850',label:'2'},
  {color:'#4a90d9',label:'3'},
  {color:'#e94560',label:'4'},
  {color:'#b06fd1',label:'5'},
  {color:'#ff9f43',label:'6'},
];

let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10),lives=3,level=1;
let seq=[],playerIdx=0,typesCount=3;
let state='idle'; // idle, show, input, roundwin, gameover
let showIdx=-1,showTimer=0,flashSlot=-1,flashUntil=0,flashOk=true;
let windAnim=0;
let lastTime=null;

const TRAY_Y=320,SLOT_W=110,SLOT_H=90;
const BP_Y=70,BP_W=70,BP_H=70;

function traySlotRect(i,n){
  const totalW=n*SLOT_W;
  const startX=400-totalW/2;
  return {x:startX+i*SLOT_W+10,y:TRAY_Y,w:SLOT_W-20,h:SLOT_H};
}
function bpRect(i,n){
  const totalW=n*BP_W;
  const startX=400-totalW/2;
  return {x:startX+i*BP_W+8,y:BP_Y,w:BP_W-16,h:BP_H};
}

function startRound(){
  typesCount=Math.min(3+Math.floor((level-1)/2),PART_DEFS.length);
  const len=Math.min(3+(level-1),12);
  seq=[];
  for(let i=0;i<len;i++)seq.push(Math.floor(Math.random()*typesCount));
  playerIdx=0;
  showIdx=-1;
  showTimer=0;
  state='show';
}

function updateHud(){
  scoreDisplay.textContent=I18N.t('score_hi_lives_label','Score: {s} | Hi: {h} | Lives: {l}')
    .replace('{s}',score).replace('{h}',hi).replace('{l}',Math.max(0,lives));
}

function saveHi(){ if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));} }

function drawGear(cx,cy,r,color,label,glow){
  ctx.save();
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=20;}
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a0=i/8*Math.PI*2,a1=a0+Math.PI/8;
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
  }
  ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,r*0.72,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1208';
  ctx.beginPath();ctx.arc(cx,cy,r*0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,cx,cy+r*0.72+12);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,800,400);
  const bg=ctx.createLinearGradient(0,0,0,400);
  bg.addColorStop(0,'#1a1208');bg.addColorStop(1,'#2e2010');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,400);

  ctx.fillStyle='#d4a24c';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),400,30);

  // Blueprint row
  ctx.strokeStyle='#5a3e1b';ctx.lineWidth=2;
  ctx.strokeRect(400-Math.min(seq.length,12)*BP_W/2-10,BP_Y-10,Math.min(seq.length,12)*BP_W+20,BP_H+20);
  if(state==='show'||state==='input'){
    for(let i=0;i<seq.length;i++){
      const r=bpRect(i,seq.length);
      const cx=r.x+r.w/2,cy=r.y+r.h/2;
      if(state==='show'&&i===showIdx){
        drawGear(cx,cy,r.w/2,PART_DEFS[seq[i]].color,PART_DEFS[seq[i]].label,true);
      } else if(state==='input'&&i<playerIdx){
        drawGear(cx,cy,r.w/2,PART_DEFS[seq[i]].color,PART_DEFS[seq[i]].label,false);
      } else {
        ctx.fillStyle='#3a2a15';
        ctx.beginPath();ctx.arc(cx,cy,r.w/2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8a6a3a';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('?',cx,cy);
      }
    }
  }

  // Tray
  for(let i=0;i<typesCount;i++){
    const r=traySlotRect(i,typesCount);
    const cx=r.x+r.w/2,cy=r.y+r.h/2;
    ctx.fillStyle='#2a1c0c';
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle= (flashSlot===i&&performance.now()<flashUntil) ? (flashOk?'#7ec850':'#e94560') : '#5a3e1b';
    ctx.lineWidth=3;
    ctx.strokeRect(r.x,r.y,r.w,r.h);
    drawGear(cx,cy-6,30,PART_DEFS[i].color,PART_DEFS[i].label,false);
  }

  if(state==='roundwin'){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('toy_wound_label','Toy wound up! It walks!'),400,230);
    // little walking toy animation
    const wx=200+((windAnim*120)%400);
    ctx.fillStyle='#d4a24c';
    ctx.fillRect(wx,260,40,30);
    ctx.fillRect(wx+8,290,8,14+Math.sin(windAnim*10)*6);
    ctx.fillRect(wx+24,290,8,14-Math.sin(windAnim*10)*6);
  }

  if(state==='idle'){
    ctx.fillStyle='#d4a24ccc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or press any number key to start'),400,230);
  }

  if(state==='gameover'){
    ctx.fillStyle='#0008';ctx.fillRect(0,0,800,400);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',score),400,220);
    ctx.fillText(I18N.t('restart_hint2','Tap or press Enter to restart'),400,250);
  }
}

function loop(now){
  if(lastTime===null)lastTime=now;
  const dt=Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(state==='show'){
    showTimer+=dt;
    const onDur=24,offDur=10;
    const period=onDur+offDur;
    const totalIdx=Math.floor(showTimer/period);
    showIdx = (showTimer%period<onDur)? totalIdx : -1;
    if(totalIdx>=seq.length){
      state='input';playerIdx=0;
    }
  } else if(state==='roundwin'){
    windAnim+=dt/60;
    showTimer+=dt;
    if(showTimer>70){ score+=10*level; level++; saveHi(); startRound(); }
  }
  draw();
  updateHud();
  requestAnimationFrame(loop);
}

function flashSlotFx(i,ok){ flashSlot=i;flashOk=ok;flashUntil=performance.now()+220; }

function pickSlot(i){
  if(i<0||i>=typesCount)return;
  if(state==='idle'){ state='idle'; startRound(); return; }
  if(state!=='input')return;
  if(seq[playerIdx]===i){
    flashSlotFx(i,true);
    SFX.click();
    playerIdx++;
    if(playerIdx>=seq.length){
      SFX.success();
      state='roundwin';
      windAnim=0;showTimer=0;
    }
  } else {
    flashSlotFx(i,false);
    SFX.error();
    lives--;
    updateHud();
    if(lives<=0){
      SFX.lose();
      saveHi();
      state='gameover';
    } else {
      // retry the same level with a fresh sequence after a brief pause
      state='mistake_pause';
      setTimeout(()=>{ if(state==='mistake_pause') startRound(); },300);
    }
  }
}

function restartGame(){
  score=0;lives=3;level=1;
  updateHud();
  startRound();
}

function handlePointer(x,y){
  if(state==='idle'){ restartGame(); return; }
  if(state==='gameover'){ restartGame(); return; }
  for(let i=0;i<typesCount;i++){
    const r=traySlotRect(i,typesCount);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ pickSlot(i); return; }
  }
}

function canvasPos(evt){
  const rect=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-rect.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-rect.top;
  return {x:cx*(800/rect.width),y:cy*(400/rect.height)};
}

c.addEventListener('click',e=>{ const p=canvasPos(e); handlePointer(p.x,p.y); });
c.addEventListener('touchstart',e=>{ e.preventDefault(); const p=canvasPos(e); handlePointer(p.x,p.y); },{passive:false});

document.addEventListener('keydown',e=>{
  if(state==='idle'){ if(/^[1-6]$/.test(e.key)){ restartGame(); } return; }
  if(state==='gameover'){ if(e.key==='Enter'||e.code==='Space'){ restartGame(); } return; }
  if(/^[1-6]$/.test(e.key)){
    const idx=parseInt(e.key,10)-1;
    pickSlot(idx);
  }
});

state='idle';
updateHud();
draw();
requestAnimationFrame(loop);
</script></body></html>
