<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Pet Vet</title><meta name="description" content="Play Pet Vet free online — Read each sick pet's symptom and click the correct treatment before time runs out. Heal as many pets as you can this shift!"><link rel="canonical" href="https://games.multiportllc.com/games/petvet"><meta property="og:title" content="Pet Vet - Multiport Games"><meta property="og:description" content="Play Pet Vet free online — Read each sick pet's symptom and click the correct treatment before time runs out. Heal as many pets as you can this shift!"><meta property="og:url" content="https://games.multiportllc.com/games/petvet"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Pet Vet","description":"Play Pet Vet free online instantly. Read each sick pet's symptom and click the correct treatment before time runs out. Heal as many pets as you can this shift! No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/petvet","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#00897b,#b2dfdb);border-radius:14px;padding:20px;text-align:center}
#hud{display:flex;justify-content:space-between;color:#004d40;font-weight:800;font-size:1.05rem;margin-bottom:6px}
#timerbar-bg{height:8px;background:rgba(0,77,64,.25);border-radius:4px;overflow:hidden;margin-bottom:14px}
#timerbar{height:100%;background:#2e7d32;transition:width .1s linear}
#pet-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
#pet-emoji{font-size:4rem}
#pet-name{font-weight:800;color:#004d40;font-size:1.2rem;margin-top:4px}
#pet-symptom{color:#333;font-size:1.05rem;margin-top:6px;font-style:italic}
#options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt-btn{padding:14px 8px;background:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;color:#00695c;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .1s}
.opt-btn:active{transform:scale(.95)}
.opt-btn.correct{background:#a5d6a7}
.opt-btn.wrong{background:#ef9a9a}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;text-align:center;padding:20px}
#overlay button{margin-top:14px;padding:10px 24px;background:#00897b;border:none;border-radius:20px;color:#fff;font-size:1rem;cursor:pointer}
.frame-wrap{position:relative}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pet Vet</div>
  <div class="game-frame" style="padding:14px">
    <div class="frame-wrap">
      <div id="table">
        <div id="hud"><span id="score-display">Treated: 0 | Hi: 0</span><span id="lives-display">Lives: 3</span></div>
        <div id="timerbar-bg"><div id="timerbar" style="width:100%"></div></div>
        <div id="pet-card">
          <div id="pet-emoji">🐶</div>
          <div id="pet-name">Rex</div>
          <div id="pet-symptom">"Ow, my paw hurts!"</div>
        </div>
        <div id="options"></div>
      </div>
      <div id="overlay" style="display:none">
        <div id="overlay-title" style="font-size:1.6rem;font-weight:900">SHIFT OVER</div>
        <div id="overlay-sub" style="margin-top:8px"></div>
        <button id="overlay-btn">Start Shift</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the sick pet's <b>symptom</b> and click the correct <b>treatment</b> before the timer runs out. A wrong treatment or a timeout costs a life. Heal as many pets as you can this shift!</div>
</div>
<script>
const PET_TYPES=[
  {name:'Rex',emoji:'🐶'},{name:'Whiskers',emoji:'🐱'},{name:'Hopper',emoji:'🐰'},
  {name:'Quackers',emoji:'🦆'},{name:'Squeaky',emoji:'🐹'},{name:'Slither',emoji:'🐍'},
  {name:'Chirpy',emoji:'🦜'},{name:'Nibbles',emoji:'🐹'},{name:'Spike',emoji:'🦔'},{name:'Goldie',emoji:'🐠'}
];
const CASES=[
  {symptom:'"Ow, my paw hurts!"',treatment:'Bandage'},
  {symptom:'Achoo! Sneezing nonstop',treatment:'Medicine'},
  {symptom:'My tummy feels upset...',treatment:'Medicine'},
  {symptom:'So sleepy, no energy at all',treatment:'Rest'},
  {symptom:'There is a scrape on my leg',treatment:'Bandage'},
  {symptom:'I feel a fever coming on',treatment:'Medicine'},
  {symptom:'I need a good long nap',treatment:'Rest'},
  {symptom:'My fur is matted and dirty',treatment:'Bath'},
  {symptom:'Ouch, a splinter in my paw!',treatment:'Bandage'},
  {symptom:'I feel itchy all over',treatment:'Bath'},
  {symptom:'I twisted my ankle running',treatment:'Bandage'},
  {symptom:'I overate and feel sick',treatment:'Medicine'},
  {symptom:'I stayed up all night, exhausted',treatment:'Rest'},
  {symptom:'I rolled in the mud today',treatment:'Bath'},
  {symptom:'I have a nasty cough',treatment:'Medicine'}
];
const ALL_TREATMENTS=['Bandage','Medicine','Rest','Bath'];
const TREATMENT_EMOJI={Bandage:'🩹',Medicine:'💊',Rest:'😴',Bath:'🛁'};

let treated=0,hi=+(localStorage.getItem('petvet_hi')||0),lives=3,gameOver=false,current=null,timeLeft=0,maxTime=0,tickInterval=null,answered=false;

const scoreEl=document.getElementById('score-display');
const livesEl=document.getElementById('lives-display');
const optionsEl=document.getElementById('options');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlay-title');
const overlaySub=document.getElementById('overlay-sub');
const overlayBtn=document.getElementById('overlay-btn');

function updateHud(){
  scoreEl.textContent=I18N.t('treated_hi_label','Treated: {s} | Hi: {h}').replace('{s}',treated).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',Math.max(0,lives));
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function newPatient(){
  answered=false;
  const pet=PET_TYPES[Math.floor(Math.random()*PET_TYPES.length)];
  const c=CASES[Math.floor(Math.random()*CASES.length)];
  current={pet,case:c};
  document.getElementById('pet-emoji').textContent=pet.emoji;
  document.getElementById('pet-name').textContent=pet.name;
  document.getElementById('pet-symptom').textContent=c.symptom;
  const opts=shuffle(ALL_TREATMENTS);
  optionsEl.innerHTML='';
  opts.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=TREATMENT_EMOJI[t]+' '+I18N.t('treatment_'+t.toLowerCase(),t);
    btn.addEventListener('click',()=>chooseTreatment(t,btn));
    optionsEl.appendChild(btn);
  });
  maxTime=Math.max(4,8-treated*0.08);
  timeLeft=maxTime;
}

function chooseTreatment(t,btn){
  if(gameOver||answered)return;
  answered=true;
  const correct=t===current.case.treatment;
  if(correct){
    btn.classList.add('correct');
    SFX.success();
    treated++;
    if(treated>hi){hi=treated;localStorage.setItem('petvet_hi',hi);}
    updateHud();
    setTimeout(()=>{ if(!gameOver)newPatient(); },500);
  }else{
    btn.classList.add('wrong');
    Array.from(optionsEl.children).forEach(b=>{ if(b.textContent.includes(TREATMENT_EMOJI[current.case.treatment]))b.classList.add('correct'); });
    SFX.error();
    loseLife();
    setTimeout(()=>{ if(!gameOver)newPatient(); },700);
  }
}

function loseLife(){
  lives--;
  updateHud();
  if(lives<=0)endGame();
}

function endGame(){
  gameOver=true;
  clearInterval(tickInterval);
  SFX.lose();
  overlayTitle.textContent=I18N.t('shift_over_title','SHIFT OVER');
  overlaySub.textContent=I18N.t('final_treated_label','You treated {s} pets! High score: {h}').replace('{s}',treated).replace('{h}',hi);
  overlayBtn.textContent=I18N.t('start_shift','Start Shift');
  overlay.style.display='flex';
}

function tick(){
  if(gameOver||answered)return;
  timeLeft-=0.1;
  const pct=Math.max(0,timeLeft/maxTime*100);
  const bar=document.getElementById('timerbar');
  bar.style.width=pct+'%';
  bar.style.background=pct<30?'#e94560':(pct<60?'#ffb300':'#2e7d32');
  if(timeLeft<=0&&!answered){
    answered=true;
    SFX.error();
    Array.from(optionsEl.children).forEach(b=>{ if(b.textContent.includes(TREATMENT_EMOJI[current.case.treatment]))b.classList.add('correct'); });
    loseLife();
    setTimeout(()=>{ if(!gameOver)newPatient(); },700);
  }
}

function startGame(){
  treated=0;lives=3;gameOver=false;
  overlay.style.display='none';
  updateHud();
  newPatient();
  clearInterval(tickInterval);
  tickInterval=setInterval(tick,100);
}

overlayBtn.addEventListener('click',startGame);
startGame();
</script></body></html>
