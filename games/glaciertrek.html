<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0e2a3d;display:block;border-radius:8px;touch-action:none}
#score-display{color:#a8e6ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Glacier Trek</div>
  <div class="game-frame">
    <div id="score-display">Floes: 0 | Hi: 0</div>
    <canvas id="c" width="500" height="700"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b>/<b>WASD</b>, or <b>tap/drag</b> toward a nearby floe, to hop between drifting ice floes. Each floe sinks after you land — keep moving! Grab fish for bonus points and don't fall in the water.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=700;
let score=0,hi=0,gameOver=false,started=false,frame=0,lastTime=null;
hi=parseFloat(localStorage.getItem('glaciertrek_hi')||'0');

const player={x:W/2,y:H-80,r:14,floeIdx:0};
let floes=[],fish=[],camY=0;
let rowsGenerated=0;

function reset(){
  score=0;gameOver=false;started=false;frame=0;lastTime=null;camY=0;rowsGenerated=0;
  floes=[];fish=[];
  // starting floe
  floes.push({x:W/2,y:H-80,r:38,vx:0,drift:0,sink:0,id:0});
  player.x=W/2;player.y=H-80;player.floeIdx=0;
  for(let i=1;i<10;i++)genRow(i);
}

function genRow(i){
  const y=H-80-i*90;
  const count=1+Math.floor(Math.random()*1);
  const x=60+Math.random()*(W-120);
  const dir=Math.random()<0.5?-1:1;
  floes.push({x,y,r:30+Math.random()*10,vx:dir*(0.3+Math.random()*0.6),drift:0,sink:0,id:i});
  if(Math.random()<0.35){
    fish.push({x:x+(Math.random()<0.5?-1:1)*20,y,taken:false});
  }
  rowsGenerated=i;
}

function currentFloe(){return floes[player.floeIdx];}

function tryMove(dx,dy){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const cf=currentFloe();
  if(!cf)return;
  const tx=player.x+dx,ty=player.y+dy;
  // find nearest floe to target within reach
  let best=null,bestD=9999;
  floes.forEach((f,idx)=>{
    if(idx===player.floeIdx)return;
    const d=Math.hypot(f.x-tx,f.y-ty);
    if(d<f.r+18&&d<bestD){bestD=d;best=idx;}
  });
  if(best!==null){
    cf.sink=1; // start sinking the one we left
    player.floeIdx=best;
    const nf=floes[best];
    player.x=nf.x;player.y=nf.y;
    nf.sink=Math.max(nf.sink,0.001);
    score++;
    if(score>hi){hi=score;localStorage.setItem('glaciertrek_hi',hi);}
    SFX.point();
    // scroll camera up if player advanced far enough
    const targetCam=Math.max(0,(H-250)-nf.y);
    if(targetCam>camY)camY=targetCam;
    // generate more rows ahead
    while(rowsGenerated-  (H-80-nf.y)/90 < 8){genRow(rowsGenerated+1);}
  } else {
    SFX.error();
  }
}

document.addEventListener('keydown',e=>{
  const step=90;
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();tryMove(0,-step);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();tryMove(0,step);}
  else if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();tryMove(-step,0);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();tryMove(step,0);}
});

function pointerToGame(clientX,clientY){
  const rect=c.getBoundingClientRect();
  const sx=(clientX-rect.left)*(W/rect.width);
  const sy=(clientY-rect.top)*(H/rect.height)+camY;
  return {x:sx,y:sy};
}

c.addEventListener('click',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const p=pointerToGame(e.clientX,e.clientY);
  jumpToward(p.x,p.y);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const t=e.changedTouches[0];
  const p=pointerToGame(t.clientX,t.clientY);
  jumpToward(p.x,p.y);
},{passive:false});

function jumpToward(gx,gy){
  const cf=currentFloe();
  let best=null,bestScore=-1;
  floes.forEach((f,idx)=>{
    if(idx===player.floeIdx)return;
    const dPlayer=Math.hypot(f.x-player.x,f.y-player.y);
    if(dPlayer>150)return;
    const dTarget=Math.hypot(f.x-gx,f.y-gy);
    const sc=1/(dTarget+1)+1/(dPlayer+1);
    if(sc>bestScore){bestScore=sc;best=idx;}
  });
  if(best!==null){
    cf.sink=Math.max(cf.sink,0.001);
    player.floeIdx=best;
    const nf=floes[best];
    player.x=nf.x;player.y=nf.y;
    nf.sink=Math.max(nf.sink,0.001);
    score++;
    if(score>hi){hi=score;localStorage.setItem('glaciertrek_hi',hi);}
    SFX.point();
    const targetCam=Math.max(0,(H-250)-nf.y);
    if(targetCam>camY)camY=targetCam;
    while(rowsGenerated - (H-80-nf.y)/90 < 8){genRow(rowsGenerated+1);}
  }
}

function drawFloe(f){
  ctx.save();
  const shrink=Math.max(0,1-f.sink*0.9);
  ctx.fillStyle='#dff6ff';
  ctx.beginPath();ctx.ellipse(f.x,f.y-camY,f.r*shrink,f.r*0.75*shrink,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#9fd7ea';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}
function drawFish(f){
  if(f.taken)return;
  ctx.save();
  ctx.translate(f.x,f.y-camY);
  ctx.fillStyle='#ff9f43';
  ctx.beginPath();ctx.ellipse(0,0,10,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(-16,-6);ctx.lineTo(-16,6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y-camY);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-6,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3949ab';
  ctx.fillRect(-12,4,24,18);
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(-6,-10,3,3);
  ctx.fillRect(3,-10,3,3);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#123c52');sky.addColorStop(1,'#0a1f2e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // water ripple lines
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  for(let i=0;i<10;i++){
    const yy=((frame*0.5+i*70)%(H+70))-35;
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+16);
    document.getElementById('score-display').textContent=I18N.t('floes_hi_label','Floes: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#a8e6ff99';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key or tap to start'),W/2,H/2);
    floes.forEach(drawFloe);
    fish.forEach(drawFish);
    drawPlayer();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  // update floes: drift + sink
  floes.forEach(f=>{
    f.x+=f.vx*dt;
    if(f.x<f.r+10||f.x>W-f.r-10)f.vx*=-1;
    if(f.sink>0){f.sink+=0.006*dt;}
  });
  // keep current floe under player position, and if it fully sinks -> game over
  const cf=currentFloe();
  if(cf){
    player.x=cf.x;player.y=cf.y;
    if(cf.sink>1.05){gameOver=true;SFX.lose();}
  }

  // remove fully sunk far floes to keep array small, but keep index mapping intact by leaving nulls out only if far behind
  // (skip removal complexity: cap array length)
  if(floes.length>40){
    // drop floes below the camera view that are not the current one and already sunk deep
    const cutoff=camY+H+200;
    floes=floes.filter((f,idx)=>idx===player.floeIdx||f.y<cutoff+400);
    fish=fish.filter(f=>f.y<cutoff+400);
  }

  floes.forEach(drawFloe);
  fish.forEach(f=>{
    drawFish(f);
    if(!f.taken&&Math.hypot(f.x-player.x,f.y-player.y)<26){
      f.taken=true;score+=2;SFX.coin();
      if(score>hi){hi=score;localStorage.setItem('glaciertrek_hi',hi);}
    }
  });
  drawPlayer();

  document.getElementById('score-display').textContent=I18N.t('floes_hi_label','Floes: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
