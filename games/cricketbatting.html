<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3d8b40;display:block;border-radius:8px;touch-action:none}
#score-display{color:#fff59d;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cricket Batting</div>
  <div class="game-frame">
    <div id="score-display">Runs: 0 | Wickets: 0/3 | Best: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> the moment the ball reaches the bat to swing. A well-timed shot scores runs — a perfectly timed swing can hit a boundary! Mistime it or swing too early/late and you risk getting out. 3 wickets ends your innings.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const BAT_X=650,BAT_Y=300;
const BOWL_X=100,BOWL_Y=180;

let runs=0,wickets=0,best=0,gameOver=false,started=false;
try{best=parseInt(localStorage.getItem('cricketbatting_best')||'0');}catch(e){}

let ball=null; // {x,y,vx,vy,t,speed,length}
let swingWindowActive=false;
let swung=false;
let resultMsg='';
let resultTimer=0;
let deliveryTimer=0;

function startDelivery(){
  swung=false;
  resultMsg='';
  const speed=3.5+Math.random()*2.5; // px per frame-ish
  const length=0.3+Math.random()*0.5; // fraction of travel where it 'arrives'
  ball={x:BOWL_X,y:BOWL_Y,startY:BOWL_Y,vx:speed,t:0,speed,arriveT:null};
  // total distance to travel
  ball.totalDist=BAT_X-BOWL_X;
  ball.bounceX=BOWL_X+ball.totalDist*length;
  ball.arrived=false;
}

function reset(){
  runs=0;wickets=0;gameOver=false;started=false;
  ball=null;resultMsg='';resultTimer=0;
}

function swing(){
  if(!started){started=true;startDelivery();return;}
  if(gameOver){reset();return;}
  if(!ball||swung)return;
  swung=true;
  const distToBat=Math.abs(ball.x-BAT_X);
  // timing window: perfect if within 18px, good within 45px, else miss
  if(distToBat<16){
    // great timing - power shot
    const r=Math.random();
    if(r<0.15){runs+=6;resultMsg=I18N.t('six_msg','SIX! 🎉');SFX.success();}
    else{runs+=4;resultMsg=I18N.t('four_msg','FOUR!');SFX.success();}
  }else if(distToBat<45){
    const add=1+Math.floor(Math.random()*3);
    runs+=add;
    resultMsg=I18N.t('runs_msg','{n} runs!').replace('{n}',add);
    SFX.point();
  }else if(distToBat<75){
    resultMsg=I18N.t('dot_ball_msg','Dot ball');
    SFX.tick();
  }else{
    // bad timing - risk of out
    if(Math.random()<0.65){
      outBatter();
      return;
    }else{
      resultMsg=I18N.t('survived_msg','Survived!');
      SFX.error();
    }
  }
  resultTimer=60;
  ball=null;
}

function outBatter(){
  wickets++;
  resultMsg=I18N.t('out_msg','OUT!');
  SFX.fail();
  resultTimer=60;
  ball=null;
  if(wickets>=3){
    gameOver=true;
    if(runs>best){best=runs;try{localStorage.setItem('cricketbatting_best',best);}catch(e){}}
    SFX.lose();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();swing();}
});
c.addEventListener('click',swing);
c.addEventListener('touchstart',e=>{e.preventDefault();swing();},{passive:false});

function drawField(){
  ctx.fillStyle='#3d8b40';ctx.fillRect(0,0,W,H);
  // pitch
  ctx.fillStyle='#d7c48a';
  ctx.fillRect(BOWL_X-30,150,BAT_X-BOWL_X+80,90);
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();ctx.moveTo(BOWL_X-20,150);ctx.lineTo(BOWL_X-20,240);ctx.stroke();
  ctx.beginPath();ctx.moveTo(BAT_X+20,150);ctx.lineTo(BAT_X+20,240);ctx.stroke();
  // stumps at bat end
  ctx.fillStyle='#8d6e42';
  for(let i=0;i<3;i++)ctx.fillRect(BAT_X+30+i*8,BAT_Y-45,4,45);
  // bowler stumps
  for(let i=0;i<3;i++)ctx.fillRect(BOWL_X-40+i*8,BOWL_Y-30,3,30);
}

function drawBatter(){
  ctx.save();
  ctx.fillStyle='#1565c0';
  ctx.fillRect(BAT_X-10,BAT_Y-55,22,55);
  ctx.fillStyle='#ffd699';
  ctx.beginPath();ctx.arc(BAT_X+1,BAT_Y-65,12,0,7);ctx.fill();
  // bat
  const angle=swung?-0.9:0.15;
  ctx.save();
  ctx.translate(BAT_X+8,BAT_Y-30);
  ctx.rotate(angle);
  ctx.fillStyle='#c9a86a';
  ctx.fillRect(-4,0,10,45);
  ctx.restore();
  ctx.restore();
}

function drawBowler(){
  ctx.fillStyle='#c62828';
  ctx.fillRect(BOWL_X-45,BOWL_Y-40,20,45);
  ctx.fillStyle='#ffd699';
  ctx.beginPath();ctx.arc(BOWL_X-35,BOWL_Y-50,10,0,7);ctx.fill();
}

function drawBall(){
  if(!ball)return;
  ctx.fillStyle='#c0392b';
  ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,7);ctx.fill();
}

function updateBall(dt){
  if(!ball)return;
  ball.t+=dt;
  const progress=Math.min(1,(ball.x-BOWL_X)/ball.totalDist);
  ball.x+=ball.speed*dt;
  // arc: rises slightly then comes down toward bat height near bounce point
  const bounceProgress=(ball.bounceX-BOWL_X)/ball.totalDist;
  if(progress<bounceProgress){
    ball.y=BOWL_Y+(progress/bounceProgress)*10;
  }else{
    const p2=(progress-bounceProgress)/(1-bounceProgress);
    ball.y=BOWL_Y+10-(p2)*(BOWL_Y+10-BAT_Y+50);
  }
  if(ball.x>=BAT_X+20){
    // ball passed - missed swing entirely
    if(!swung){
      outBatter();
    }else{
      ball=null;
    }
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawField();
  drawBowler();
  drawBatter();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('cricket_start_hint','Space / Tap to start your innings'),W/2,80);
  }else if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('innings_over_title','INNINGS OVER'),W/2,H/2-20);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {r} runs').replace('{r}',runs),W/2,H/2+16);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+50);
  }else{
    if(ball){
      updateBall(dt);
      drawBall();
    }else if(!gameOver && resultTimer<=0){
      deliveryTimer+=dt;
      if(deliveryTimer>40){deliveryTimer=0;startDelivery();}
    }
    if(resultTimer>0){
      resultTimer-=dt;
      ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
      ctx.fillText(resultMsg,W/2,80);
    }
  }

  document.getElementById('score-display').textContent=I18N.t('cricket_score_label','Runs: {r} | Wickets: {w}/3 | Best: {b}').replace('{r}',runs).replace('{w}',wickets).replace('{b}',best);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
