<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0e2a3a;display:block;border-radius:8px;cursor:crosshair;touch-action:none}
#hud{display:flex;justify-content:space-between;color:#8ecae6;font-size:1rem;font-weight:700;padding:6px 4px;max-width:800px;margin:0 auto}
#request{text-align:center;color:#ffd54f;font-size:1.3rem;font-weight:800;padding:6px;min-height:1.6em}
#timerbar{height:10px;background:#0b3d2e;border-radius:6px;max-width:780px;margin:4px auto;overflow:hidden}
#timerfill{height:100%;background:#52b788;width:100%}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cartography Grid Referencing</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="lives-display">Lives: 3</span><span id="level-display">Level: 1</span></div>
    <div id="request">—</div>
    <div id="timerbar"><div id="timerfill"></div></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">A grid reference request appears above — plot it before the timer bar runs out! <b>Tap</b> the correct cell, or move the cursor with <b>Arrow Keys</b> and confirm with <b>Enter/Space</b>. The grid gets finer and references trickier each level.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const HI_KEY='cartographygridreferencing_hi';
let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10),lives=3,level=1;
let gameOver=false,started=false;
let cols,rows,cellW,cellH,target,cursor,timeLeft,timeMax,round;

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',lives);
  document.getElementById('level-display').textContent=I18N.t('level_label','Level: {n}').replace('{n}',level);
}

function colLabel(i){
  // A, B, ... Z, AA, AB...
  let s='',n=i;
  do{ s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26)-1; }while(n>=0);
  return s;
}

function gridSize(){
  cols=Math.min(14,6+Math.floor(level/1.5));
  rows=Math.min(10,5+Math.floor(level/2));
  cellW=W/cols;cellH=H/rows;
}

function newRound(){
  gridSize();
  target={col:Math.floor(Math.random()*cols),row:Math.floor(Math.random()*rows)};
  timeMax=Math.max(2.2,5.5-level*0.25);
  timeLeft=timeMax;
  document.getElementById('request').textContent=I18N.t('locate_request','Locate grid reference {r}').replace('{r}',colLabel(target.col)+(target.row+1));
}

function reset(){
  score=0;lives=3;level=1;round=0;gameOver=false;started=false;
  cursor={c:0,r:0};
  newRound();updateHud();
}
reset();

function nextRound(correct){
  if(correct){
    const bonus=Math.floor(50+level*8+timeLeft*20);
    score+=bonus;
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
    SFX.success();
    round++;
    if(round>0&&round%4===0)level++;
  }else{
    lives--;
    SFX.error();
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      updateHud();
      return;
    }
  }
  updateHud();
  newRound();
}

function selectCell(c,r){
  if(!started||gameOver)return;
  if(c===target.col&&r===target.row){
    nextRound(true);
  }else{
    nextRound(false);
  }
}

function canvasPoint(evt){
  const rect=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-rect.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

function handleTap(evt){
  evt.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;return;}
  const p=canvasPoint(evt);
  const col=Math.floor(p.x/cellW),row=Math.floor(p.y/cellH);
  selectCell(col,row);
}
c.addEventListener('click',handleTap);
c.addEventListener('touchstart',handleTap,{passive:false});

document.addEventListener('keydown',e=>{
  if(!started){started=true;return;}
  if(gameOver){
    if(e.code==='Space'||e.code==='Enter'){reset();started=true;}
    return;
  }
  if(e.code==='ArrowUp'){e.preventDefault();cursor.r=Math.max(0,cursor.r-1);}
  else if(e.code==='ArrowDown'){e.preventDefault();cursor.r=Math.min(rows-1,cursor.r+1);}
  else if(e.code==='ArrowLeft'){e.preventDefault();cursor.c=Math.max(0,cursor.c-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();cursor.c=Math.min(cols-1,cursor.c+1);}
  else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();selectCell(cursor.c,cursor.r);}
});

function drawGrid(){
  ctx.strokeStyle='#ffffff22';
  ctx.lineWidth=1;
  for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*cellW,0);ctx.lineTo(i*cellW,H);ctx.stroke();}
  for(let j=0;j<=rows;j++){ctx.beginPath();ctx.moveTo(0,j*cellH);ctx.lineTo(W,j*cellH);ctx.stroke();}
  ctx.fillStyle='#8ecae6';ctx.font='bold 11px Arial';ctx.textAlign='center';
  for(let i=0;i<cols;i++)ctx.fillText(colLabel(i),i*cellW+cellW/2,12);
  ctx.textAlign='left';
  for(let j=0;j<rows;j++)ctx.fillText(String(j+1),4,j*cellH+cellH/2+4);
}

function drawScene(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#123a4d');bg.addColorStop(1,'#0e2a3a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawGrid();

  // keyboard cursor highlight
  if(started&&!gameOver){
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
    ctx.strokeRect(cursor.c*cellW+2,cursor.r*cellH+2,cellW-4,cellH-4);
  }

  if(!started){
    ctx.fillStyle='#e8f6ff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or press any key to start'),W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='#000a';ctx.fillRect(0,H/2-50,W,100);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-8);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+26);
  }
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?0:Math.min((t-lastTime)/1000,0.1);
  lastTime=t;
  if(started&&!gameOver){
    timeLeft-=dt;
    const pct=Math.max(0,timeLeft/timeMax)*100;
    document.getElementById('timerfill').style.width=pct+'%';
    document.getElementById('timerfill').style.background=pct<25?'#e94560':(pct<55?'#ffd54f':'#52b788');
    if(timeLeft<=0){
      nextRound(false);
    }
  }
  drawScene();
  requestAnimationFrame(loop);
}
updateHud();
requestAnimationFrame(loop);
</script></body></html>
