<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(180deg,#1a0f2e 0%,#2e1a4a 100%);display:block;border-radius:8px;touch-action:manipulation}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Conductor Cue</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Combo: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the baton swing to the beat. When a section's cue light lights up, click/tap that <b>section icon</b> (Strings, Brass, Percussion, Woodwinds) right on the beat. Wrong section or bad timing breaks your combo — the tempo speeds up as you go!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;
const SECTIONS=[
  {k:'strings',e:'🎻',label:'Strings',x:180,color:'#ff8a65'},
  {k:'brass',e:'🎺',label:'Brass',x:360,color:'#ffd54f'},
  {k:'percussion',e:'🥁',label:'Percussion',x:540,color:'#4fc3f7'},
  {k:'woodwinds',e:'🎷',label:'Woodwinds',x:720,color:'#aed581'}
];
let score=0,combo=0,bestCombo=0,hi=parseInt(localStorage.getItem('conductor_hi')||'0',10);
let gameOver=false,started=false;
let bpm=70,beatDur=0,lastBeatTime=0,beatCount=0,cueSection=null,cueWindowOpen=false,cueResult=null,cueResultTimer=0;
let baton=0; // 0..1 phase
let missTolerance=1;
let sinceStart=0;

function reset(){
  score=0;combo=0;bestCombo=0;bpm=70;gameOver=false;started=false;beatCount=0;cueSection=null;cueWindowOpen=false;cueResult=null;sinceStart=0;
}
reset();

function beatInterval(){return 60000/bpm;}

function scheduleNextCue(){
  cueSection=SECTIONS[Math.floor(Math.random()*SECTIONS.length)];
  cueWindowOpen=true;
}

let lastTime=null;
let beatTimer=0;

function hitSection(sec){
  if(!started){started=true;lastTime=null;lastBeatTime=performance.now();scheduleNextCue();return;}
  if(gameOver){reset();return;}
  if(!cueWindowOpen||!cueSection){
    // clicked with no active cue -> break combo
    combo=0;
    cueResult={msg:I18N.t('too_early','Too early!'),color:'#e53935'};
    cueResultTimer=40;
    SFX.error();
    return;
  }
  const now=performance.now();
  const beatPhase=((now-lastBeatTime)%beatInterval())/beatInterval(); // 0..1, 0/1 = on beat
  const distToBeat=Math.min(beatPhase,1-beatPhase)*beatInterval();
  const correctSection=sec.k===cueSection.k;
  if(correctSection&&distToBeat<120){
    const pts=distToBeat<50?100:60;
    score+=pts+combo*2;
    combo++;
    if(combo>bestCombo)bestCombo=combo;
    if(score>hi){hi=score;localStorage.setItem('conductor_hi',hi);}
    cueResult={msg:(distToBeat<50?I18N.t('perfect_cue','PERFECT!'):I18N.t('good_cue','Good!'))+' +'+(pts+combo*2-2>0?pts+ (combo-1)*2:pts),color:'#4caf50'};
    SFX.point();
    if(combo>0&&combo%10===0){SFX.levelup();bpm=Math.min(180,bpm+8);}
    cueWindowOpen=false;
    cueSection=null;
    setTimeout(()=>{ if(!gameOver&&started) scheduleNextCue(); },beatInterval()*0.6);
  }else{
    combo=0;
    cueResult={msg:correctSection?I18N.t('off_beat','Off beat!'):I18N.t('wrong_section','Wrong section!'),color:'#e53935'};
    cueResultTimer=40;
    SFX.error();
    cueWindowOpen=false;
    cueSection=null;
    setTimeout(()=>{ if(!gameOver&&started) scheduleNextCue(); },beatInterval()*0.6);
  }
  cueResultTimer=40;
}

function getSectionAt(x,y){
  for(const s of SECTIONS){
    if(Math.hypot(x-s.x,y-260)<45)return s;
  }
  return null;
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.changedTouches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.changedTouches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('click',e=>{
  if(!started){hitSection(null);return;}
  if(gameOver){reset();return;}
  const p=getPos(e);
  const s=getSectionAt(p.x,p.y);
  if(s)hitSection(s);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){hitSection(null);return;}
  if(gameOver){reset();return;}
  const p=getPos(e);
  const s=getSectionAt(p.x,p.y);
  if(s)hitSection(s);
},{passive:false});

document.addEventListener('keydown',e=>{
  const map={'1':0,'2':1,'3':2,'4':3};
  if(map[e.key]!==undefined){
    if(!started){hitSection(null);return;}
    if(gameOver){reset();return;}
    hitSection(SECTIONS[map[e.key]]);
  }
});

function drawBaton(t){
  const cx=W/2,cy=60;
  const swing=Math.sin(t*Math.PI*2)*70;
  ctx.strokeStyle='#ffd54f';
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+swing,cy+50);
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx+swing,cy+50,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8d6e63';
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
}

function drawSections(now){
  SECTIONS.forEach(s=>{
    const active=cueWindowOpen&&cueSection&&cueSection.k===s.k;
    ctx.beginPath();
    ctx.arc(s.x,260,45,0,Math.PI*2);
    ctx.fillStyle=active?s.color:'#33334d';
    ctx.fill();
    ctx.lineWidth=active?5:2;
    ctx.strokeStyle=active?'#fff':'#555577';
    ctx.stroke();
    ctx.font='34px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s.e,s.x,260);
    ctx.font='13px Arial';
    ctx.fillStyle='#fff';
    ctx.fillText(s.label,s.x,315);
  });
}

function loop(now){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a0f2e');grad.addColorStop(1,'#2e1a4a');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / 1-4 keys to start'),W/2,180);
    drawSections();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawSections();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,150);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('best_combo_label','Best combo: {n}').replace('{n}',bestCombo),W/2,185);
    ctx.fillText(I18N.t('restart_hint','Tap or Click to restart'),W/2,215);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  const nowT=performance.now();
  const phase=((nowT-lastBeatTime)%beatInterval())/beatInterval();

  // detect beat crossing to auto-close stale windows (miss)
  if(cueWindowOpen&&cueSection){
    const distToBeat=Math.min(phase,1-phase)*beatInterval();
    // if we passed well beyond the beat without a hit, auto-miss
    if(phase>0.5&&distToBeat>140){
      cueWindowOpen=false;
      combo=0;
      cueResult={msg:I18N.t('missed_cue','Missed!'),color:'#e53935'};
      cueResultTimer=40;
      SFX.error();
      cueSection=null;
      setTimeout(()=>{ if(!gameOver&&started) scheduleNextCue(); },beatInterval()*0.4);
    }
  }

  drawBaton(phase);
  drawSections(nowT);

  if(cueResult&&cueResultTimer>0){
    ctx.fillStyle=cueResult.color;
    ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(cueResult.msg,W/2,340);
    cueResultTimer--;
  }

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('score_combo_hi_label','Score: {s} | Combo: {c} | Hi: {h}')
      .replace('{s}',score).replace('{c}',combo).replace('{h}',hi);
}

requestAnimationFrame(loop);
</script></body></html>
