<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#87ceeb,#c9e8f5);display:block;border-radius:8px;touch-action:none}
#hud{color:#fff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
#hud span{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Windmill Repair</div>
  <div class="game-frame">
    <div id="hud">
      <div>Windmills: <span id="wmCount">0</span></div>
      <div>Best: <span id="wmBest">0</span></div>
      <div id="livesRow">Misses: <span id="wmMiss">0</span>/3</div>
    </div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or press <b>Space</b> when the rotating blade lines up with the glowing repair mark. Fix all blades on a windmill to complete it before it breaks down. Three misses ends the game — repair as many windmills as you can as the blades spin faster!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420,cx=400,cy=190,armLen=150;

let windmills=0,best=parseInt(localStorage.getItem('windmillrepair_best')||'0',10);
let misses=0,MAX_MISSES=3;
let angle=0,speed=0.02;
let numBlades=4,fixed=[],targetAngle=0,tolerance=0.22;
let gameOver=false,started=false,flashTimer=0,flashGood=false;
let particles=[];

document.getElementById('wmBest').textContent=best;

function newWindmill(){
  numBlades=4;
  fixed=new Array(numBlades).fill(false);
  speed=0.018+windmills*0.0022;
  tolerance=Math.max(0.10,0.22-windmills*0.012);
  pickTarget();
}

function pickTarget(){
  // pick an unfixed blade slot's angular target (fixed position in world, blade must pass through it)
  targetAngle=Math.random()*Math.PI*2;
}

function bladeAngles(){
  const arr=[];
  for(let i=0;i<numBlades;i++)arr.push(angle+i*(Math.PI*2/numBlades));
  return arr;
}

function angleDiff(a,b){
  let d=(a-b)%(Math.PI*2);
  if(d>Math.PI)d-=Math.PI*2;
  if(d<-Math.PI)d+=Math.PI*2;
  return Math.abs(d);
}

function normAngle(a){
  a=a%(Math.PI*2);
  if(a<0)a+=Math.PI*2;
  return a;
}

function attemptRepair(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const angles=bladeAngles();
  let hitIdx=-1,bestD=Infinity;
  for(let i=0;i<angles.length;i++){
    if(fixed[i])continue;
    const d=angleDiff(normAngle(angles[i]),targetAngle);
    if(d<bestD){bestD=d;hitIdx=i;}
  }
  if(hitIdx>=0&&bestD<=tolerance){
    fixed[hitIdx]=true;
    SFX.success();
    flashTimer=18;flashGood=true;
    spawnParticles(true);
    if(fixed.every(f=>f)){
      windmills++;
      if(windmills>best){best=windmills;localStorage.setItem('windmillrepair_best',String(best));}
      document.getElementById('wmCount').textContent=windmills;
      document.getElementById('wmBest').textContent=best;
      SFX.win();
      newWindmill();
    }else{
      // pick next target among remaining blades
      pickTarget();
    }
  }else{
    misses++;
    document.getElementById('wmMiss').textContent=misses;
    SFX.error();
    flashTimer=18;flashGood=false;
    spawnParticles(false);
    if(misses>=MAX_MISSES){
      gameOver=true;
      SFX.lose();
    }
  }
}

function spawnParticles(good){
  const mx=cx+Math.cos(targetAngle)*armLen*0.75;
  const my=cy+Math.sin(targetAngle)*armLen*0.75;
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1+Math.random()*3;
    particles.push({x:mx,y:my,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:24,good});
  }
}

function reset(){
  windmills=0;misses=0;gameOver=false;started=false;particles=[];
  document.getElementById('wmCount').textContent=0;
  document.getElementById('wmMiss').textContent=0;
  newWindmill();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();attemptRepair();}});
c.addEventListener('pointerdown',e=>{e.preventDefault();attemptRepair();});

function drawTower(){
  ctx.fillStyle='#c9a876';
  ctx.beginPath();
  ctx.moveTo(cx-30,H-20);
  ctx.lineTo(cx-14,cy+30);
  ctx.lineTo(cx+14,cy+30);
  ctx.lineTo(cx+30,H-20);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#a3855c';
  ctx.fillRect(cx-30,H-20,60,20);
  // hub
  ctx.fillStyle='#5d4a36';
  ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.fill();
}

function drawBlades(){
  const angles=bladeAngles();
  angles.forEach((a,i)=>{
    const x2=cx+Math.cos(a)*armLen;
    const y2=cy+Math.sin(a)*armLen;
    ctx.strokeStyle=fixed[i]?'#7ec850':'#f0f0f0';
    ctx.lineWidth=14;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x2,y2);
    ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.15)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x2,y2);ctx.stroke();
    if(!fixed[i]){
      // damage marks
      const mx=cx+Math.cos(a)*armLen*0.7,my=cy+Math.sin(a)*armLen*0.7;
      ctx.fillStyle='#c0392b';
      ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();
    }
  });
}

function drawTargetMark(){
  const mx=cx+Math.cos(targetAngle)*armLen*0.75;
  const my=cy+Math.sin(targetAngle)*armLen*0.75;
  const pulse=4+Math.sin(performance.now()/120)*2;
  ctx.strokeStyle='#ffd54f';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(mx,my,14+pulse,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,213,79,.35)';
  ctx.beginPath();ctx.arc(mx,my,14+pulse,0,Math.PI*2);ctx.fill();
  // draw a thin radial guide line from center through target
  ctx.strokeStyle='rgba(255,213,79,.5)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(mx,my);ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.fillStyle=p.good?`rgba(126,200,80,${p.life/24})`:`rgba(230,80,60,${p.life/24})`;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  });
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#8ec9ea');sky.addColorStop(1,'#dff1f8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='rgba(255,255,255,.7)';
  [[120,60,40],[650,90,30],[300,40,25]].forEach(([x,y,r])=>{
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r*0.8,y+6,r*0.7,0,Math.PI*2);ctx.arc(x-r*0.8,y+6,r*0.7,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#8fbf6a';ctx.fillRect(0,H-20,W,20);

  if(!started&&!gameOver){
    drawTower();
    ctx.save();ctx.translate(cx,cy);drawBladesStatic();ctx.restore();
    ctx.fillStyle='rgba(20,20,30,.85)';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wm_start_hint','Click / Tap / Space to start repairing'),400,70);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawTower();drawBlades();drawParticles();
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('wm_result','Windmills repaired: {n}').replace('{n}',windmills),400,220);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,258);
    requestAnimationFrame(loop);return;
  }

  angle+=speed;
  drawTower();
  drawTargetMark();
  drawBlades();
  drawParticles();

  if(flashTimer>0){
    flashTimer--;
    ctx.fillStyle=flashGood?`rgba(126,200,80,${flashTimer/40})`:`rgba(230,60,60,${flashTimer/40})`;
    ctx.fillRect(0,0,W,H);
  }

  requestAnimationFrame(loop);
}

function drawBladesStatic(){
  for(let i=0;i<numBlades;i++){
    const a=i*(Math.PI*2/numBlades);
    ctx.strokeStyle='#f0f0f0';ctx.lineWidth=14;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*armLen,Math.sin(a)*armLen);ctx.stroke();
  }
}

newWindmill();
loop();
</script></body></html>
