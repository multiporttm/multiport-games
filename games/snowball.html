<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#b3e5fc}
#ui{color:#01579b;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
#throwBtn{display:block;margin:4px auto;padding:10px 24px;border-radius:10px;background:#0288d1;color:#fff;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Snowball Showdown</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">HP: 100 | Score: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
    <button id="throwBtn">❄️ Throw (Space)</button>
  </div>
  <div class="game-instructions">Left/Right (or the D-pad) to dodge along your side. Throw (Space or the button) to lob a snowball at the AI — hit it 5 times to win a round. Watch out for incoming snowballs!</div>
</div>
<script>
const W=360,H=360;
let playerX,aiX,hp,score,snowballs,state,throwCD=0,aiTimer;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('snowball_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('snowball_best',v);}

function init(){
  playerX=W/2;aiX=W/2;hp=100;score=0;snowballs=[];state='play';throwCD=0;aiTimer=40;
}

function throwSnowball(){
  if(state==='over'){init();return;}
  if(throwCD>0)return;
  throwCD=25;
  snowballs.push({x:playerX,y:H-60,vy:-4,from:'player'});
  SFX.swoosh();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')playerX-=20;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')playerX+=20;
  if(e.key===' '){e.preventDefault();throwSnowball();}
});
document.querySelector('#dpad .left').addEventListener('click',()=>playerX-=30);
document.querySelector('#dpad .right').addEventListener('click',()=>playerX+=30);
document.getElementById('throwBtn').addEventListener('click',throwSnowball);

function update(){
  if(state!=='play')return;
  playerX=Math.max(20,Math.min(W-20,playerX));
  if(throwCD>0)throwCD--;

  aiTimer--;
  if(aiTimer<=0){
    aiX=rand(20,W-20);
    if(Math.random()<0.7)snowballs.push({x:aiX,y:60,vy:4,from:'ai'});
    aiTimer=35+rand(0,20);
  }

  snowballs.forEach(s=>s.y+=s.vy);
  snowballs=snowballs.filter(s=>{
    if(s.from==='player'&&s.y<60&&Math.abs(s.x-aiX)<26){
      score++;
      SFX.hit();
      saveBest(score);
      if(score%5===0)SFX.win();
      return false;
    }
    if(s.from==='ai'&&s.y>H-70&&Math.abs(s.x-playerX)<26){
      hp-=15;
      SFX.hurt();
      if(hp<=0){
        hp=0;state='over';
        SFX.lose();
      }
      return false;
    }
    return s.y>0&&s.y<H;
  });
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#b3e5fc';ctx.fillRect(0,0,W,H);

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🧑',playerX,H-40);
  ctx.fillText('🤖',aiX,40);

  ctx.font='18px Arial';
  snowballs.forEach(s=>ctx.fillText('❄️',s.x,s.y));

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#01579b';ctx.font='bold 26px Arial';
    ctx.fillText('KNOCKED OUT!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Throw to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`HP: ${Math.max(0,hp)} | Score: ${score}`;
}

init();draw();
</script></body></html>
