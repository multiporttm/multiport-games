<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#023047;display:block;border-radius:8px;touch-action:none}
#hud{color:#8ecae6;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#80deea}
#hud span.hs{color:#7ec850}
#pumpBtns{display:flex;justify-content:center;gap:16px;padding:6px 10px;flex-wrap:wrap}
#pumpBtns button{padding:14px 26px;border:none;border-radius:18px;font-weight:800;cursor:pointer;font-size:1rem;color:#fff;background:#219ebc;touch-action:none;user-select:none}
#pumpBtns button:active{transform:scale(0.95)}
#pumpBtns button.right{background:#fb8500}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ship Ballast Adjustment</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Level: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="pumpBtns">
      <button id="btnLeft">⬅ Pump Port</button>
      <button id="btnRight" class="right">Pump Starboard ➡</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Cargo shifts keep tilting the ship. Hold <b>Left Arrow / A</b> or <b>tap/hold "Pump Port"</b> to pump ballast left, and <b>Right Arrow / D</b> or <b>"Pump Starboard"</b> to pump right. Keep the list away from the red zone or the ship capsizes!</div>
</div>
<script>
(function(){
const HS_KEY='shipballastadjustment_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const CAPSIZE=100;
const DANGER=78;

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let list=0,vel=0;
let pumpLeft=false,pumpRight=false;
let survived=0,levelTarget=18*60;
let loadTimer=0,lastTime=null;
let dangerFlash=0;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  list=0;vel=0;survived=0;levelTarget=18*60;loadTimer=0;lastTime=null;dangerFlash=0;
}
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('level_label','Level: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

function cargoShift(){
  const strength=6+level*1.6;
  const dir=Math.random()<0.5?-1:1;
  vel+=dir*strength;
  SFX.hit();
}

function capsize(){
  lives--;SFX.hurt();
  dangerFlash=30;
  if(lives<=0){ endGame(); return; }
  list=0;vel=0;loadTimer=0;
}

function levelUp(){
  level++;SFX.levelup();
  score+=100*level;
  levelTarget=18*60+level*4*60;
  survived=0;
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ e.preventDefault(); pumpLeft=true; }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ e.preventDefault(); pumpRight=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ pumpLeft=false; }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ pumpRight=false; }
});

const btnLeft=document.getElementById('btnLeft');
const btnRight=document.getElementById('btnRight');
function bind(btn,setter){
  btn.addEventListener('pointerdown',e=>{e.stopPropagation(); if(!started||gameOver){startGame();return;} setter(true);});
  btn.addEventListener('pointerup',e=>{e.stopPropagation(); setter(false);});
  btn.addEventListener('pointerleave',e=>{ setter(false); });
  btn.addEventListener('pointercancel',e=>{ setter(false); });
}
bind(btnLeft,v=>pumpLeft=v);
bind(btnRight,v=>pumpRight=v);

function drawShip(){
  const cx=W/2,cy=170;
  const ang=(list/CAPSIZE)*0.5;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(ang);
  ctx.fillStyle='#8ecae6';
  ctx.beginPath();ctx.moveTo(-140,20);ctx.lineTo(140,20);ctx.lineTo(110,60);ctx.lineTo(-110,60);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffb703';ctx.fillRect(-40,-30,80,50);
  ctx.strokeStyle='#023047';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-140,20);ctx.lineTo(140,20);ctx.lineTo(110,60);ctx.lineTo(-110,60);ctx.closePath();ctx.stroke();
  // tanks
  ctx.fillStyle='rgba(2,48,71,0.5)';
  ctx.fillRect(-100,28,70,24);
  ctx.fillRect(30,28,70,24);
  const leftFill=Math.max(0,Math.min(1,0.5-list/200));
  const rightFill=Math.max(0,Math.min(1,0.5+list/200));
  ctx.fillStyle='#219ebc';
  ctx.fillRect(-100,28+24*(1-leftFill),70,24*leftFill);
  ctx.fillStyle='#fb8500';
  ctx.fillRect(30,28+24*(1-rightFill),70,24*rightFill);
  ctx.restore();

  // waterline
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(0,230);ctx.lineTo(W,230);ctx.stroke();
  ctx.setLineDash([]);
}

function drawMeter(){
  const mx=W/2,my=270,mw=460,mh=22;
  ctx.fillStyle='#0b2232';ctx.fillRect(mx-mw/2,my-mh/2,mw,mh);
  ctx.strokeStyle='#8ecae6';ctx.strokeRect(mx-mw/2,my-mh/2,mw,mh);
  // danger zones
  const dzw=(mw/2)*((CAPSIZE-DANGER)/CAPSIZE);
  ctx.fillStyle='rgba(231,76,60,0.5)';
  ctx.fillRect(mx-mw/2,my-mh/2,dzw,mh);
  ctx.fillRect(mx+mw/2-dzw,my-mh/2,dzw,mh);
  // needle
  const frac=Math.max(-1,Math.min(1,list/CAPSIZE));
  const nx=mx+frac*(mw/2-4);
  ctx.fillStyle=Math.abs(list)>=DANGER?'#e74c3c':'#2ecc71';
  ctx.fillRect(nx-4,my-mh/2-6,8,mh+12);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('port_label','PORT'),mx-mw/2-28,my+4);
  ctx.fillText(I18N.t('starboard_label','STARBOARD'),mx+mw/2+40,my+4);
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#01131d');bg.addColorStop(1,'#023047');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    drawShip();drawMeter();
    ctx.fillStyle='#8ecae6';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,60);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawShip();drawMeter();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  // physics
  const pumpStrength=2.0+level*0.1;
  if(pumpLeft)vel-=pumpStrength*dt;
  if(pumpRight)vel+=pumpStrength*dt;
  vel*=0.965; // drag
  list+=vel*dt*0.35;
  list=Math.max(-CAPSIZE-10,Math.min(CAPSIZE+10,list));

  loadTimer+=dt;
  const loadInterval=Math.max(55,140-level*6);
  if(loadTimer>=loadInterval){ loadTimer=0; cargoShift(); }

  survived+=dt;
  score+=dt*0.08*level;
  if(score>hi)hi=score;

  if(Math.abs(list)>=CAPSIZE){
    capsize();
  } else if(survived>=levelTarget){
    levelUp();
  }

  if(dangerFlash>0)dangerFlash-=dt;

  drawShip();
  drawMeter();

  ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';
  if(Math.abs(list)>=DANGER){
    ctx.fillStyle=Math.sin(now/90)>0?'#e74c3c':'#fff';
    ctx.fillText(I18N.t('danger_hint','DANGER — LIST CRITICAL!'),W/2,30);
  } else {
    ctx.fillStyle='#b2dfdb';
    ctx.fillText(I18N.t('survive_hint','Keep the ship level to advance'),W/2,30);
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
