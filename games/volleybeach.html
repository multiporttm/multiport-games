<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0288d1;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Beach Volleyball</div>
  <div class="game-frame">
    <div id="score-display">You: 0 | CPU: 0 | Match Wins: 0</div>
    <canvas id="c" width="700" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to move and <b>Space</b> or <b>Up</b> to jump and hit. Rally the ball over the net — first to 11 points (win by 2) beats the CPU!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=380;
const GROUND=H-40;
const NET_X=W/2, NET_H=110, NET_TOP=GROUND-NET_H;
const WIN_SCORE=11;
let matchWins=parseInt(localStorage.getItem('volleybeach_wins')||'0');

let player,cpu,ball,playerScore,cpuScore,serving,gameOver,winner,rallyMsg,msgTimer,started;

function reset(fullMatch){
  player={x:170,y:GROUND,w:44,h:60,vy:0,vx:0,jumping:false};
  cpu={x:W-170,y:GROUND,w:44,h:60,vy:0,vx:0,jumping:false,reactTimer:0};
  ball={x:170,y:GROUND-100,vx:0,vy:0,r:14};
  if(fullMatch){playerScore=0;cpuScore=0;}
  serving='player';
  gameOver=false;winner=null;rallyMsg='';msgTimer=0;
  started=(fullMatch===undefined)?started:started;
  serveBall();
}

function serveBall(){
  if(serving==='player'){
    ball.x=player.x; ball.y=GROUND-90; ball.vx=0; ball.vy=0;
  } else {
    ball.x=cpu.x; ball.y=GROUND-90; ball.vx=0; ball.vy=0;
  }
}

let keys={left:false,right:false,jump:false};
function startGame(){
  if(!started){started=true;}
  if(gameOver){reset(true);return;}
}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  else if(e.code==='ArrowUp'||e.code==='Space')keys.jump=true;
  startGame();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
  else if(e.code==='ArrowUp'||e.code==='Space')keys.jump=false;
});
c.addEventListener('click',()=>{startGame();keys.jump=true;setTimeout(()=>keys.jump=false,120);});
c.addEventListener('touchstart',e=>{e.preventDefault();startGame();keys.jump=true;setTimeout(()=>keys.jump=false,120);},{passive:false});

let touchDir=null;
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const x=(e.touches[0].clientX-r.left)*W/r.width;
  touchDir = x<player.x?'left':'right';
},{passive:false});
c.addEventListener('touchend',e=>{touchDir=null;},{passive:false});

function rectCircle(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  return Math.hypot(cx-nx,cy-ny)<cr;
}

function awardPoint(who){
  if(who==='player'){playerScore++;rallyMsg=I18N.t('point_you','Point: You!');SFX.point();}
  else {cpuScore++;rallyMsg=I18N.t('point_cpu','Point: CPU');SFX.hit();}
  msgTimer=70;
  serving=who;
  if((playerScore>=WIN_SCORE||cpuScore>=WIN_SCORE)&&Math.abs(playerScore-cpuScore)>=2){
    gameOver=true;
    winner=playerScore>cpuScore?'player':'cpu';
    if(winner==='player'){matchWins++;localStorage.setItem('volleybeach_wins',String(matchWins));SFX.win();}
    else SFX.lose();
  } else {
    setTimeout(()=>{if(!gameOver)serveBall();},900);
  }
}

function update(dt){
  // player movement
  let dir=0;
  if(keys.left||touchDir==='left')dir=-1;
  if(keys.right||touchDir==='right')dir=1;
  player.vx=dir*5;
  player.x+=player.vx*dt;
  player.x=Math.max(player.w/2+10,Math.min(NET_X-16,player.x));

  if(keys.jump&&!player.jumping){player.vy=-13;player.jumping=true;SFX.jump();}
  player.vy+=0.55*dt;
  player.y+=player.vy*dt;
  if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.jumping=false;}

  // CPU AI
  cpu.reactTimer-=dt;
  if(cpu.reactTimer<=0){
    const targetX=Math.max(NET_X+16,Math.min(W-cpu.w/2-10,ball.x));
    const dx=targetX-cpu.x;
    cpu.vx=Math.max(-4.5,Math.min(4.5,dx*0.15));
    cpu.reactTimer=4;
  }
  cpu.x+=cpu.vx*dt;
  cpu.x=Math.max(NET_X+16,Math.min(W-cpu.w/2-10,cpu.x));
  if(ball.x>NET_X && ball.y>GROUND-140 && !cpu.jumping && Math.random()<0.06*dt){cpu.vy=-12.5;cpu.jumping=true;}
  cpu.vy+=0.55*dt;
  cpu.y+=cpu.vy*dt;
  if(cpu.y>=GROUND){cpu.y=GROUND;cpu.vy=0;cpu.jumping=false;}

  // ball physics
  const serveHeld = (serving==='player'&&Math.abs(ball.vx)<0.01&&Math.abs(ball.vy)<0.01);
  if(serveHeld){
    ball.x=player.x; ball.y=GROUND-90;
    if(keys.jump){
      ball.vx=5.5; ball.vy=-11; SFX.hit();
    }
  } else if(serving==='cpu'&&Math.abs(ball.vx)<0.01&&Math.abs(ball.vy)<0.01){
    ball.x=cpu.x; ball.y=GROUND-90;
    setTimeout(()=>{ if(serving==='cpu'){ball.vx=-5.5;ball.vy=-11;} },400);
  } else {
    ball.vy+=0.3*dt;
    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;
  }

  // net collision
  if(ball.x+ball.r>NET_X-6 && ball.x-ball.r<NET_X+6 && ball.y+ball.r>NET_TOP){
    if(ball.x<NET_X)ball.vx=-Math.abs(ball.vx)*0.6;
    else ball.vx=Math.abs(ball.vx)*0.6;
  }

  // paddle hits
  const pBox={x:player.x-player.w/2,y:player.y-player.h,w:player.w,h:player.h};
  if(ball.vy>0 && rectCircle(pBox.x,pBox.y,pBox.w,pBox.h,ball.x,ball.y,ball.r) && ball.x<NET_X){
    ball.vy=-11-Math.random()*2;
    ball.vx=(ball.x-player.x)*0.35+player.vx*0.5;
    ball.vx=Math.max(-9,Math.min(9,ball.vx));
    ball.y=pBox.y-ball.r;
    SFX.hit();
  }
  const cBox={x:cpu.x-cpu.w/2,y:cpu.y-cpu.h,w:cpu.w,h:cpu.h};
  if(ball.vy>0 && rectCircle(cBox.x,cBox.y,cBox.w,cBox.h,ball.x,ball.y,ball.r) && ball.x>NET_X){
    ball.vy=-10.5-Math.random()*2;
    ball.vx=(ball.x-cpu.x)*0.3;
    ball.vx=Math.max(-8,Math.min(8,ball.vx));
    ball.y=cBox.y-ball.r;
  }

  // side walls
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*0.7;}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*0.7;}

  // ball hits ground -> score
  if(ball.y+ball.r>=GROUND+10 && !gameOver){
    if(ball.x<NET_X)awardPoint('cpu');
    else awardPoint('player');
    ball.vx=0;ball.vy=0;
  }
}

function drawFigure(f,color){
  ctx.save();
  ctx.fillStyle=color;
  ctx.fillRect(f.x-f.w/2,f.y-f.h,f.w,f.h*0.65);
  ctx.beginPath();ctx.arc(f.x,f.y-f.h*0.65-13,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath();ctx.ellipse(f.x,GROUND+6,f.w*0.5,7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBall(){
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0.3,2.0);ctx.stroke();
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,3.4,5.1);ctx.stroke();
  ctx.restore();
}

function drawScene(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#81d4fa');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#ffe082';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(60+i*120,GROUND+10+((i%2)*8),3,0,Math.PI*2);ctx.stroke();}
  // net
  ctx.fillStyle='#eee';
  ctx.fillRect(NET_X-3,NET_TOP,6,NET_H);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;
  for(let y=NET_TOP;y<GROUND;y+=10){ctx.beginPath();ctx.moveTo(NET_X-3,y);ctx.lineTo(NET_X+3,y);ctx.stroke();}
}

let lastTime=null;
function loop(){
  drawScene();
  if(!started){
    drawFigure(player,'#e94560');drawFigure(cpu,'#3d5afe');drawBall();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_vb','Press a key or tap to start'),W/2,60);
    requestAnimationFrame(loop);return;
  }
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!gameOver)update(dt);

  drawFigure(player,'#e94560');
  drawFigure(cpu,'#3d5afe');
  drawBall();

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(rallyMsg,W/2,50);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(winner==='player'?I18N.t('you_win_match','You win the match!'):I18N.t('cpu_wins_match','CPU wins the match'),W/2,H/2-14);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_score_vb','Final: You {p} — CPU {c}').replace('{p}',playerScore).replace('{c}',cpuScore),W/2,H/2+18);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+46);
  }

  document.getElementById('score-display').textContent=
    I18N.t('vb_score_label','You: {p} | CPU: {c} | Match Wins: {w}')
      .replace('{p}',playerScore).replace('{c}',cpuScore).replace('{w}',matchWins);

  requestAnimationFrame(loop);
}
started=false;
reset(true);
loop();
</script></body></html>
