<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Soap Making</title><meta name="description" content="Play Soap Making free online — Pick a color, then click and hold over the mold to pour a layer of soap. Match the target pattern's colors and layer thickness to set the soap and score points."><link rel="canonical" href="https://games.multiportllc.com/games/soapmaking"><meta property="og:title" content="Soap Making - Multiport Games"><meta property="og:description" content="Play Soap Making free online — Pick a color, then click and hold over the mold to pour a layer of soap. Match the target pattern's colors and layer thickness to set the soap and score points."><meta property="og:url" content="https://games.multiportllc.com/games/soapmaking"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Soap Making","description":"Play Soap Making free online instantly. Pick a color, then click and hold over the mold to pour a layer of soap. Match the target pattern's colors and layer thickness to set the soap and score points. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/soapmaking","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#80deea,#e1bee7);display:block;border-radius:8px;touch-action:none}
#score-display{color:#e1bee7;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#palette{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.swatch.active{border-color:#fff;transform:scale(1.12)}
#buttons{display:flex;justify-content:center;gap:10px;margin:6px 0}
#buttons button{padding:8px 18px;background:#8e5db8;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:.95rem}
#buttons button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Soap Making</div>
  <div class="game-frame">
    <div id="score-display">Soaps: 0 | Best: 0</div>
    <canvas id="c" width="640" height="360"></canvas>
    <div id="palette"></div>
    <div id="buttons">
      <button id="undoBtn">Undo Layer</button>
      <button id="newBtn">New Soap</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click a <b>color swatch</b>, then <b>click and hold</b> over the mold to pour a layer — the longer you hold, the thicker the layer. Match the target pattern shown on the right, in order from the bottom up. Use <b>Undo Layer</b> if you make a mistake (limited undos per soap).</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=360;
const PALETTE=['#ff8a80','#ffd54f','#80deea','#a5d6a7','#ce93d8','#ffab91','#90caf9','#f48fb1'];
let selColor=PALETTE[0];
let soaps=0,best=0;
let target=[]; // array of {color,frac}
let poured=[]; // array of {color,frac}
let undosLeft=3;
let pouring=false,pourStart=0;
let setAnim=0; // >0 while flashing success
let doneMsg='';

const MOLD={x:70,y:60,w:220,h:250};
const TARGET_BOX={x:420,y:60,w:150,h:250};

function loadHi(){ try{return parseInt(localStorage.getItem('soapmaking_best')||'0',10);}catch(e){return 0;} }
function saveHi(v){ try{localStorage.setItem('soapmaking_best',String(v));}catch(e){} }
best=loadHi();

function genTarget(level){
  const nLayers=Math.min(2+Math.floor(level/2),6);
  const t=[];
  let remaining=1;
  for(let i=0;i<nLayers;i++){
    let frac;
    if(i===nLayers-1)frac=remaining;
    else{
      frac=Math.max(0.12,Math.min(remaining-0.1*(nLayers-i-1), (0.3+Math.random()*0.35)*remaining));
      remaining-=frac;
    }
    const color=PALETTE[Math.floor(Math.random()*PALETTE.length)];
    t.push({color,frac:Math.max(0.08,frac)});
  }
  // normalize
  const sum=t.reduce((a,b)=>a+b.frac,0);
  t.forEach(l=>l.frac/=sum);
  return t;
}

function newSoap(){
  target=genTarget(soaps);
  poured=[];
  undosLeft=3;
  doneMsg='';
  updateUndoBtn();
  updateScore();
}

function updateUndoBtn(){
  document.getElementById('undoBtn').disabled = undosLeft<=0 || poured.length===0;
  document.getElementById('undoBtn').textContent = I18N.t('undo_layer_btn','Undo Layer')+` (${undosLeft})`;
}

function updateScore(){
  document.getElementById('score-display').textContent = I18N.t('soaps_best_label','Soaps: {s} | Best: {b}').replace('{s}',soaps).replace('{b}',best);
}

function buildPalette(){
  const p=document.getElementById('palette');
  p.innerHTML='';
  PALETTE.forEach(col=>{
    const sw=document.createElement('div');
    sw.className='swatch'+(col===selColor?' active':'');
    sw.style.background=col;
    sw.onclick=()=>{selColor=col;buildPalette();};
    p.appendChild(sw);
  });
}

function pouredTotal(){ return poured.reduce((a,l)=>a+l.frac,0); }

function startPour(){
  if(setAnim>0)return;
  if(pouredTotal()>=0.995)return;
  pouring=true;
  pourStart=performance.now();
}

function endPour(){
  if(!pouring)return;
  pouring=false;
  const dur=(performance.now()-pourStart)/1000;
  let frac=Math.min(0.6, Math.max(0.05,dur*0.35));
  const remaining=1-pouredTotal();
  frac=Math.min(frac,remaining);
  if(frac<=0.01)return;
  poured.push({color:selColor,frac});
  SFX.click();
  updateUndoBtn();
  checkComplete();
}

function checkComplete(){
  const total=pouredTotal();
  if(total<0.995)return;
  // compare poured vs target
  let ok=poured.length===target.length;
  if(ok){
    for(let i=0;i<target.length;i++){
      const t=target[i],p=poured[i];
      if(t.color!==p.color || Math.abs(t.frac-p.frac)>0.09){ok=false;break;}
    }
  }
  if(ok){
    soaps++;
    const precision=100;
    if(soaps>best){best=soaps;saveHi(best);}
    SFX.success();
    setAnim=90;
    doneMsg=I18N.t('soap_set_msg','Soap set! On to the next one.');
    updateScore();
    setTimeout(()=>{ newSoap(); },1200);
  } else {
    SFX.fail();
    doneMsg=I18N.t('soap_mismatch_msg',"That doesn't match — try Undo or New Soap.");
  }
}

document.getElementById('undoBtn').onclick=()=>{
  if(undosLeft<=0||poured.length===0)return;
  poured.pop();
  undosLeft--;
  doneMsg='';
  updateUndoBtn();
};
document.getElementById('newBtn').onclick=()=>{ newSoap(); };

function pointInRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function getPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width), y:cy*(H/rect.height)};
}
c.addEventListener('mousedown',e=>{const p=getPos(e); if(pointInRect(p.x,p.y,MOLD))startPour();});
c.addEventListener('mouseup',endPour);
c.addEventListener('mouseleave',endPour);
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e); if(pointInRect(p.x,p.y,MOLD))startPour();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endPour();},{passive:false});

function drawLayers(box,layers,fillFrac){
  const innerH=box.h;
  let y=box.y+innerH;
  const totalDrawn=fillFrac!=null?fillFrac:1;
  let acc=0;
  for(const l of layers){
    const h=l.frac*innerH;
    y-=h;
    ctx.fillStyle=l.color;
    ctx.fillRect(box.x,y,box.w,h);
    acc+=l.frac;
  }
}

function drawMoldOutline(box){
  ctx.strokeStyle='#5d3a7a';
  ctx.lineWidth=4;
  ctx.strokeRect(box.x,box.y,box.w,box.h);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#80deea');bg.addColorStop(1,'#e1bee7');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Mold
  ctx.fillStyle='#ffffffaa';
  ctx.fillRect(MOLD.x,MOLD.y,MOLD.w,MOLD.h);
  let curPoured=poured.slice();
  if(pouring){
    const dur=(performance.now()-pourStart)/1000;
    let frac=Math.min(0.6,Math.max(0,dur*0.35));
    const remaining=1-pouredTotal();
    frac=Math.min(frac,remaining);
    if(frac>0)curPoured=curPoured.concat([{color:selColor,frac}]);
  }
  drawLayers(MOLD,curPoured);
  drawMoldOutline(MOLD);
  ctx.fillStyle='#3a2350';
  ctx.font='bold 16px Arial';
  ctx.textAlign='center';
  ctx.fillText(I18N.t('your_mold_label','Your Mold'),MOLD.x+MOLD.w/2,MOLD.y-14);

  // Target
  ctx.fillStyle='#ffffff66';
  ctx.fillRect(TARGET_BOX.x,TARGET_BOX.y,TARGET_BOX.w,TARGET_BOX.h);
  drawLayers(TARGET_BOX,target);
  drawMoldOutline(TARGET_BOX);
  ctx.fillStyle='#3a2350';
  ctx.fillText(I18N.t('target_label','Target'),TARGET_BOX.x+TARGET_BOX.w/2,TARGET_BOX.y-14);

  // progress
  ctx.fillStyle='#3a2350';
  ctx.font='14px Arial';
  ctx.fillText(I18N.t('fill_label','Fill: {p}%').replace('{p}',Math.round(pouredTotal()*100)), MOLD.x+MOLD.w/2, MOLD.y+MOLD.h+26);

  if(doneMsg){
    ctx.font='bold 18px Arial';
    ctx.fillStyle=setAnim>0?'#2e7d32':'#b71c1c';
    ctx.fillText(doneMsg,W/2,30);
  }
  if(setAnim>0)setAnim--;

  requestAnimationFrame(loop);
}
buildPalette();
newSoap();
loop();
</script></body></html>
