<link rel="stylesheet" href="../css/style.css?v=6">
<style>
body{background:#08080f}
#ui{color:#f8bbd0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#egg-wrap{display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
#egg{font-size:4.5rem;cursor:pointer;user-select:none;transition:transform .1s}
#egg:active{transform:scale(.92)}
#egg-bar{width:220px;height:14px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
#egg-fill{height:100%;background:linear-gradient(90deg,#ec407a,#f8bbd0);width:0%;transition:width .08s linear}
#shop{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px}
.shop-btn{padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.shop-btn:disabled{opacity:.4;cursor:default}
#pets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;max-width:480px;margin:0 auto}
.pet{font-size:1.8rem;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Pet Tycoon</div>
  <div class="game-frame">
    <div id="ui">🪙 0 coins | 0 coins/sec | Pets: 0</div>
    <div id="egg-wrap">
      <div id="egg">🥚</div>
      <div id="egg-bar"><div id="egg-fill"></div></div>
      <div style="color:rgba(255,255,255,.4);font-size:.8rem">Tap the egg to fill it up!</div>
    </div>
    <div id="shop">
      <button class="shop-btn" id="buy-common">🥚 Basic Egg (Free)</button>
      <button class="shop-btn" id="buy-rare">🟣 Rare Egg (50🪙)</button>
      <button class="shop-btn" id="buy-legend">🟡 Legendary Egg (200🪙)</button>
    </div>
    <div id="pets"></div>
  </div>
  <div class="game-instructions">Tap the egg to fill it up and hatch a pet. Every pet you own earns coins automatically, even while you're hatching more! Spend coins on rarer eggs for better pets.</div>
</div>
<script>
const PETS={
  common: ['🐶','🐱','🐰','🐹'],
  rare: ['🦊','🐼','🐨','🐸'],
  legend: ['🐉','🦄','🦁','🐯'],
};
const RATE={common:1,rare:3,legend:8};
let coins=0,perSec=0,pets=[],eggProgress=0,eggPower=1,eggType='common',hatching=false;

function loadHi(){return +(localStorage.getItem('pettycoon_hi')||0);}
function saveHi(v){localStorage.setItem('pettycoon_hi',Math.max(v,loadHi()));}

function tapEgg(){
  if(hatching)return;
  eggProgress+=eggPower;
  document.getElementById('egg').style.transform='scale(1.15)';
  setTimeout(()=>document.getElementById('egg').style.transform='scale(1)',80);
  if(eggProgress>=100){
    hatchPet();
  }
  updateUI();
}

function hatchPet(){
  hatching=true;
  eggProgress=100;
  updateUI();
  setTimeout(()=>{
    const pool=PETS[eggType];
    const pet=pool[Math.floor(Math.random()*pool.length)];
    pets.push({emoji:pet,rate:RATE[eggType]});
    perSec+=RATE[eggType];
    eggProgress=0;
    eggType='common';
    hatching=false;
    renderPets();
    updateUI();
  },500);
}

function buyEgg(type,cost){
  if(coins<cost||hatching)return;
  coins-=cost;
  eggType=type;
  eggProgress=0;
  updateUI();
}
document.getElementById('buy-common').addEventListener('click',()=>buyEgg('common',0));
document.getElementById('buy-rare').addEventListener('click',()=>buyEgg('rare',50));
document.getElementById('buy-legend').addEventListener('click',()=>buyEgg('legend',200));
document.getElementById('egg').addEventListener('click',tapEgg);

function renderPets(){
  const el=document.getElementById('pets');
  el.innerHTML=pets.map(p=>`<div class="pet">${p.emoji}</div>`).join('');
}

function updateUI(){
  document.getElementById('egg-fill').style.width=eggProgress+'%';
  document.getElementById('egg').textContent=hatching?'🐣':(eggType==='rare'?'🟣':eggType==='legend'?'🟡':'🥚');
  document.getElementById('buy-rare').disabled=coins<50;
  document.getElementById('buy-legend').disabled=coins<200;
  document.getElementById('ui').textContent=`🪙 ${Math.floor(coins)} coins | ${perSec} coins/sec | Pets: ${pets.length} | Best: ${loadHi()}`;
}

setInterval(()=>{
  coins+=perSec/10;
  saveHi(coins);
  updateUI();
},100);

updateUI();
</script></body></html>
