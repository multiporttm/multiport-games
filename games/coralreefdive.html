<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#01579b,#00bfa5);display:block;border-radius:8px;touch-action:none}
#score-display{color:#80deea;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#o2-wrap{width:min(92vw,500px);height:14px;background:rgba(0,0,0,.35);border-radius:7px;margin:0 auto 8px;overflow:hidden}
#o2-fill{height:100%;background:#29b6f6;width:100%;transition:width .15s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Coral Reef Dive</div>
  <div class="game-frame">
    <div id="score-display">Pearls: 0 | Best: 0</div>
    <div id="o2-wrap"><div id="o2-fill"></div></div>
    <canvas id="c" width="500" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b>/<b>WASD</b> or <b>drag</b> to swim freely through the reef. Collect glowing <b>pearls</b>, avoid <b>jellyfish</b>, and watch out for <b>current zones</b> that push you around. Swim up into the bright <b>air pockets</b> near the surface to refill oxygen before it runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=500;
const scoreDisplay=document.getElementById('score-display');
const o2Fill=document.getElementById('o2-fill');

let hi=parseInt(localStorage.getItem('coralreefdive_hi')||'0',10);
let score=0,oxygen=100,gameOver=true,started=false;
let diver={x:250,y:250,vx:0,vy:0,r:16};
let keys={};
let pearls=[],jellies=[],currents=[],airPockets=[];
let frame=0,spawnTimer=0;
let dragTarget=null;

function reset(){
  score=0;oxygen=100;gameOver=false;started=true;frame=0;spawnTimer=0;
  diver.x=250;diver.y=250;diver.vx=0;diver.vy=0;
  pearls=[];jellies=[];currents=[];
  airPockets=[{x:0,y:0,w:W,h:50}];
  for(let i=0;i<6;i++)spawnPearl();
  for(let i=0;i<2;i++)spawnJelly();
  for(let i=0;i<2;i++)spawnCurrent();
  updateHUD();
}

function rnd(a,b){return a+Math.random()*(b-a);}

function spawnPearl(){pearls.push({x:rnd(30,W-30),y:rnd(80,H-30),r:8,glow:Math.random()*Math.PI*2});}
function spawnJelly(){jellies.push({x:rnd(30,W-30),y:rnd(100,H-30),r:16,vx:rnd(-0.6,0.6),vy:rnd(-0.4,0.4),phase:Math.random()*Math.PI*2});}
function spawnCurrent(){
  const horiz=Math.random()<0.5;
  currents.push({
    x:rnd(40,W-160),y:rnd(100,H-120),
    w:horiz?140:60,h:horiz?60:140,
    dx:horiz?rnd(0.5,1.2)*(Math.random()<0.5?1:-1):0,
    dy:horiz?0:rnd(0.5,1.2)
  });
}

function updateHUD(){
  scoreDisplay.textContent=I18N.t('pearls_hi_label','Pearls: {s} | Best: {h}').replace('{s}',score).replace('{h}',hi);
  o2Fill.style.width=Math.max(0,oxygen)+'%';
  o2Fill.style.background=oxygen>50?'#29b6f6':oxygen>20?'#ffca28':'#ef5350';
}

function start(){
  if(!started||gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(!started||gameOver)start();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

c.addEventListener('click',()=>{ if(!started||gameOver)start(); });
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started||gameOver){start();return;}
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  dragTarget={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!started||gameOver)return;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  dragTarget={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragTarget=null;},{passive:false});

function circleHit(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)<a.r+b.r;}

function drawDiver(){
  ctx.save();
  ctx.translate(diver.x,diver.y);
  const angle=Math.atan2(diver.vy,diver.vx||0.001);
  ctx.rotate(diver.vx!==0||diver.vy!==0?angle*0.3:0);
  ctx.fillStyle='#ffca28';
  ctx.beginPath();ctx.ellipse(0,0,diver.r,diver.r*0.7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#212121';
  ctx.beginPath();ctx.arc(6,-4,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.beginPath();ctx.moveTo(-diver.r,0);ctx.lineTo(-diver.r-10,-8);ctx.lineTo(-diver.r-10,8);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawJelly(j){
  ctx.save();
  ctx.translate(j.x,j.y);
  ctx.fillStyle='rgba(255,138,255,.75)';
  ctx.beginPath();ctx.arc(0,0,j.r,Math.PI,0);ctx.fill();
  ctx.strokeStyle='rgba(255,138,255,.6)';
  ctx.lineWidth=2;
  for(let i=-2;i<=2;i++){
    ctx.beginPath();
    const wob=Math.sin(frame*0.15+i)*4;
    ctx.moveTo(i*6,0);
    ctx.lineTo(i*6+wob,16);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCurrent(cur){
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.08)';
  ctx.fillRect(cur.x,cur.y,cur.w,cur.h);
  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.lineWidth=2;
  const horiz=cur.dx!==0;
  const dir=horiz?Math.sign(cur.dx):Math.sign(cur.dy);
  for(let i=0;i<3;i++){
    const off=((frame*2+i*40)%(horiz?cur.w:cur.h));
    ctx.beginPath();
    if(horiz){
      const ax=cur.x+(dir>0?off:cur.w-off);
      ctx.moveTo(ax,cur.y+cur.h/2);
      ctx.lineTo(ax-dir*14,cur.y+cur.h/2-8);
      ctx.moveTo(ax,cur.y+cur.h/2);
      ctx.lineTo(ax-dir*14,cur.y+cur.h/2+8);
    }else{
      const ay=cur.y+(dir>0?off:cur.h-off);
      ctx.moveTo(cur.x+cur.w/2,ay);
      ctx.lineTo(cur.x+cur.w/2-8,ay-dir*14);
      ctx.moveTo(cur.x+cur.w/2,ay);
      ctx.lineTo(cur.x+cur.w/2+8,ay-dir*14);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#4fc3f7');bg.addColorStop(1,'#01579b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // surface air zone
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.fillRect(0,0,W,50);
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('air_zone_label','AIR'),W/2,20);

  // coral decorations (static)
  ctx.fillStyle='#ff7043';
  for(let i=0;i<6;i++){
    const cx=40+i*80,cy=H-20;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-16,cy-40-((i%3)*10));ctx.lineTo(cx+16,cy-40-((i%3)*10));ctx.closePath();ctx.fill();
  }

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or press a key to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+14);
    requestAnimationFrame(loop);return;
  }

  frame++;

  // movement
  let ax=0,ay=0;
  if(keys['arrowleft']||keys['a'])ax-=0.5;
  if(keys['arrowright']||keys['d'])ax+=0.5;
  if(keys['arrowup']||keys['w'])ay-=0.5;
  if(keys['arrowdown']||keys['s'])ay+=0.5;
  if(dragTarget){
    ax+=(dragTarget.x-diver.x)*0.02;
    ay+=(dragTarget.y-diver.y)*0.02;
  }

  // currents push
  currents.forEach(cur=>{
    if(diver.x>cur.x&&diver.x<cur.x+cur.w&&diver.y>cur.y&&diver.y<cur.y+cur.h){
      ax+=cur.dx*0.3;ay+=cur.dy*0.3;
    }
    cur.x+=Math.sin(frame*0.003)*0.1;
  });

  diver.vx=(diver.vx+ax)*0.9;
  diver.vy=(diver.vy+ay)*0.9;
  diver.x+=diver.vx;
  diver.y+=diver.vy;
  diver.x=Math.max(diver.r,Math.min(W-diver.r,diver.x));
  diver.y=Math.max(diver.r,Math.min(H-diver.r,diver.y));

  // oxygen
  oxygen-=0.09;
  if(diver.y<50){oxygen=Math.min(100,oxygen+0.6);}
  if(oxygen<=0){
    gameOver=true;
    if(score>hi){hi=score;localStorage.setItem('coralreefdive_hi',hi);}
    SFX.lose();
  }

  // spawn more over time
  spawnTimer++;
  if(spawnTimer>200){spawnTimer=0;if(pearls.length<10)spawnPearl();if(jellies.length<5&&Math.random()<0.5)spawnJelly();}

  currents.forEach(drawCurrent);

  pearls.forEach(p=>{p.glow+=0.1;});
  pearls=pearls.filter(p=>{
    if(circleHit(diver,p)){
      score++;SFX.coin();
      return false;
    }
    return true;
  });
  pearls.forEach(p=>{
    const g=0.5+Math.sin(p.glow)*0.5;
    ctx.save();
    ctx.shadowColor='#fff9c4';ctx.shadowBlur=10+g*10;
    ctx.fillStyle='#fffde7';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  jellies.forEach(j=>{
    j.x+=j.vx+Math.sin(frame*0.02+j.phase)*0.3;
    j.y+=j.vy;
    if(j.x<20||j.x>W-20)j.vx*=-1;
    if(j.y<80||j.y>H-20)j.vy*=-1;
    drawJelly(j);
    if(!gameOver&&circleHit(diver,j)){
      gameOver=true;
      if(score>hi){hi=score;localStorage.setItem('coralreefdive_hi',hi);}
      SFX.hurt();
    }
  });

  drawDiver();
  updateHUD();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
