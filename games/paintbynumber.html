<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#5e35b1,#26c6da);border-radius:14px;padding:16px;text-align:center}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:6px 0;min-height:1.6em}
#c{background:#fdfdfd;display:block;margin:10px auto;border-radius:8px;touch-action:none}
#palette{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:10px;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.1rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.swatch.selected{border-color:#fff;transform:scale(1.08)}
#newBtn{padding:9px 22px;background:#ff4081;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin-top:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Paint by Number</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="status">Completed: 0 | Best time: —</div>
      <canvas id="c" width="360" height="360"></canvas>
      <div id="palette"></div>
      <button id="newBtn" onclick="newPicture()">New Picture</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Select a <b>color</b> from the palette, then click every numbered cell that matches it to fill it in. Fill in all the cells correctly to reveal the picture!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const GRID=10;
const CELL=360/GRID;
const PALETTE=[
  {n:1,color:'#e53935',name:'Red'},
  {n:2,color:'#1e88e5',name:'Blue'},
  {n:3,color:'#fdd835',name:'Yellow'},
  {n:4,color:'#43a047',name:'Green'},
  {n:5,color:'#8e24aa',name:'Purple'}
];
const BG_N=0; // background stays white/blank, not part of palette

let picture=[]; // GRID x GRID of numbers (0 = background/blank, never needs painting)
let filled=[];  // GRID x GRID booleans
let selected=1;
let completed=parseInt(localStorage.getItem('paintbynumber_completed')||'0');
let bestTime=localStorage.getItem('paintbynumber_best');
bestTime=bestTime?parseFloat(bestTime):null;
let startTime=null,finished=false;

// A handful of simple hand-designed 10x10 pictures using numbers 1-5 (0=blank).
const PICS=[
  // heart
  ()=>{
    const g=Array.from({length:GRID},()=>Array(GRID).fill(0));
    const rows=[
      '0011001100','0111101110','1111111111','1111111111',
      '1111111111','0111111110','0011111100','0001111000',
      '0000110000','0000000000'
    ];
    for(let r=0;r<GRID;r++)for(let col=0;col<GRID;col++) if(rows[r][col]==='1') g[r][col]=1;
    return g;
  },
  // smiley face
  ()=>{
    const g=Array.from({length:GRID},()=>Array(GRID).fill(0));
    for(let r=1;r<9;r++)for(let col=1;col<9;col++) g[r][col]=3;
    // eyes
    g[3][3]=1;g[3][6]=1;
    // mouth
    for(let col=3;col<=6;col++)g[6][col]=1;
    g[7][2]=1;g[7][7]=1;
    return g;
  },
  // tree
  ()=>{
    const g=Array.from({length:GRID},()=>Array(GRID).fill(0));
    for(let r=0;r<6;r++){
      for(let col=Math.max(0,4-r);col<=Math.min(9,5+r);col++){
        if(r<6)g[r][col]=4;
      }
    }
    for(let r=6;r<9;r++)for(let col=4;col<=5;col++)g[r][col]=5;
    return g;
  },
  // star
  ()=>{
    const g=Array.from({length:GRID},()=>Array(GRID).fill(0));
    const rows=[
      '0000110000','0000110000','0001111000','0011111100',
      '1111111111','0111111110','0110000110','0100000010',
      '0100000010','1000000001'
    ];
    for(let r=0;r<GRID;r++)for(let col=0;col<GRID;col++) if(rows[r][col]==='1') g[r][col]=3;
    return g;
  },
  // fish
  ()=>{
    const g=Array.from({length:GRID},()=>Array(GRID).fill(0));
    for(let r=2;r<8;r++)for(let col=1;col<7;col++) g[r][col]=2;
    // tail
    g[1][7]=2;g[2][8]=2;g[3][8]=2;g[4][9]=2;g[5][8]=2;g[6][8]=2;g[7][7]=2;
    // eye
    g[3][2]=1;
    return g;
  }
];

function usedNumbers(g){
  const s=new Set();
  g.forEach(row=>row.forEach(v=>{if(v!==0)s.add(v);}));
  return s;
}

function newPicture(){
  const gen=PICS[Math.floor(Math.random()*PICS.length)];
  picture=gen();
  filled=Array.from({length:GRID},()=>Array(GRID).fill(false));
  finished=false;
  startTime=performance.now();
  const used=Array.from(usedNumbers(picture));
  selected=used[0]||1;
  buildPalette(used);
  updateStatus();
  render();
}

function buildPalette(used){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  used.forEach(n=>{
    const info=PALETTE.find(p=>p.n===n);
    const el=document.createElement('div');
    el.className='swatch'+(n===selected?' selected':'');
    el.style.background=info.color;
    el.textContent=info.n;
    el.onclick=()=>{selected=n;buildPalette(used);};
    pal.appendChild(el);
  });
}

function updateStatus(msg){
  const bestStr=bestTime!=null?bestTime.toFixed(1)+'s':'—';
  document.getElementById('status').textContent = msg || I18N.t('paint_status_label','Completed: {c} | Best time: {b}').replace('{c}',completed).replace('{b}',bestStr);
}

function render(){
  ctx.clearRect(0,0,360,360);
  for(let r=0;r<GRID;r++){
    for(let col=0;col<GRID;col++){
      const v=picture[r][col];
      const x=col*CELL,y=r*CELL;
      if(v===0){
        ctx.fillStyle='#f5f5f5';
        ctx.fillRect(x,y,CELL,CELL);
      }else if(filled[r][col]){
        const info=PALETTE.find(p=>p.n===v);
        ctx.fillStyle=info.color;
        ctx.fillRect(x,y,CELL,CELL);
      }else{
        ctx.fillStyle='#fff';
        ctx.fillRect(x,y,CELL,CELL);
        ctx.fillStyle='#555';
        ctx.font='bold 14px Arial';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(v,x+CELL/2,y+CELL/2);
      }
      ctx.strokeStyle='#ddd';
      ctx.strokeRect(x,y,CELL,CELL);
    }
  }
  if(finished){
    ctx.fillStyle='rgba(0,0,0,.0)'; // no overlay, picture fully visible
  }
}

function checkComplete(){
  for(let r=0;r<GRID;r++)for(let col=0;col<GRID;col++){
    if(picture[r][col]!==0 && !filled[r][col]) return false;
  }
  return true;
}

function handleClick(px,py){
  if(finished)return;
  const col=Math.floor(px/CELL),r=Math.floor(py/CELL);
  if(r<0||r>=GRID||col<0||col>=GRID)return;
  const v=picture[r][col];
  if(v===0)return;
  if(filled[r][col])return;
  if(v===selected){
    filled[r][col]=true;
    SFX.point();
    render();
    if(checkComplete()){
      finished=true;
      completed++;
      localStorage.setItem('paintbynumber_completed',completed);
      const elapsed=(performance.now()-startTime)/1000;
      if(bestTime===null || elapsed<bestTime){
        bestTime=elapsed;
        localStorage.setItem('paintbynumber_best',bestTime.toFixed(2));
      }
      SFX.win();
      updateStatus(I18N.t('picture_complete_label','🎉 Picture complete in {t}s! Click New Picture to continue.').replace('{t}',elapsed.toFixed(1)));
    }
  }else{
    SFX.error();
  }
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  handleClick((e.clientX-r.left)*(360/r.width),(e.clientY-r.top)*(360/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  handleClick((t.clientX-r.left)*(360/r.width),(t.clientY-r.top)*(360/r.height));
},{passive:false});

newPicture();
</script></body></html>
