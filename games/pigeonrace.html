<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#7ec0e0;display:block;border-radius:8px;touch-action:none}
#hud{color:#fff;font-size:1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pigeon Race</div>
  <div class="game-frame">
    <div id="hud">Race <span id="raceNum">1</span>/3 | Pos: <span id="posLabel">-</span> | Time: <span id="timeLabel">0.0</span>s | Best: <span id="bestLabel">-</span>s</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b>, or <b>drag</b> on mobile, to steer your racing pigeon home. Ride the glowing wind streams for a speed boost, and dodge the power lines and hawks. Race across 3 legs and beat the flock to the loft!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const COURSE=6000;
const TOTAL_RACES=3;
let raceNum=1,best=parseFloat(localStorage.getItem('pigeonrace_best')||'0')||0;
document.getElementById('bestLabel').textContent=best?best.toFixed(1):'-';

let player,ais,winds,obstacles,camX,raceTime,state,keys,dragY,totalPos;
function resetRace(){
  player={x:60,y:150,vy:0,vx:2.6,w:34,h:24,flap:0,boost:0};
  const names=['#e94560','#ffd54f','#4caf50'];
  ais=names.map((col,i)=>({x:60-10*i,y:90+i*60,vx:2.3+Math.random()*0.5,col,baseVx:2.3+Math.random()*0.5}));
  winds=[];
  for(let i=0;i<10;i++){
    winds.push({x:600+i*550+Math.random()*200,y:40+Math.random()*220,w:220,h:70,dir:Math.random()<0.5?1:-1});
  }
  obstacles=[];
  for(let i=0;i<14;i++){
    const type=Math.random()<0.5?'pole':'hawk';
    obstacles.push({x:500+i*400+Math.random()*150,y:type==='pole'?0:40+Math.random()*200,type,vy:(Math.random()-0.5)*1.5,hit:false});
  }
  camX=0;raceTime=0;state='countdown';keys={};dragY=null;
  document.getElementById('raceNum').textContent=raceNum;
  document.getElementById('posLabel').textContent='-';
  document.getElementById('timeLabel').textContent='0.0';
}
resetRace();

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(state==='over')advance();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  dragY=(e.clientY-r.top)*(H/r.height);
  if(state==='over')advance();
});
c.addEventListener('pointermove',e=>{
  if(dragY===null)return;
  const r=c.getBoundingClientRect();
  dragY=(e.clientY-r.top)*(H/r.height);
});
window.addEventListener('pointerup',()=>{dragY=null;});

function advance(){
  raceNum++;
  if(raceNum>TOTAL_RACES){raceNum=1;}
  resetRace();
}

function windAt(x,y){
  for(const w of winds){
    if(x>w.x-camX&&x<w.x-camX+w.w&&y>w.y&&y<w.y+w.h)return w.dir;
  }
  return 0;
}

function update(dt){
  if(state==='countdown'){
    raceTime+=dt;
    if(raceTime>1.4){state='racing';raceTime=0;}
    return;
  }
  if(state!=='racing')return;
  raceTime+=dt;

  // player control
  let targetVy=0;
  if(keys['ArrowUp']||keys['KeyW'])targetVy=-2.6;
  if(keys['ArrowDown']||keys['KeyS'])targetVy=2.6;
  if(dragY!==null){
    const diff=dragY-player.y;
    targetVy=Math.max(-3.2,Math.min(3.2,diff*0.12));
  }
  player.vy+=(targetVy-player.vy)*0.15*dt*60/1;
  player.y+=player.vy*dt*60;
  player.y=Math.max(10,Math.min(H-30,player.y));

  let baseSpeed=3.0;
  if(keys['ArrowRight']||keys['KeyD'])baseSpeed=3.6;
  if(keys['ArrowLeft']||keys['KeyA'])baseSpeed=2.2;
  const wDir=windAt(player.x+camX,player.y);
  if(wDir>0){player.boost=Math.min(1,player.boost+0.03*dt*60);}
  else{player.boost=Math.max(0,player.boost-0.02*dt*60);}
  player.vx=baseSpeed+player.boost*3.2;
  camX+=player.vx*dt*60;
  player.flap+=dt*20;

  // AI
  ais.forEach(a=>{
    const wDir2=windAt(a.x+camX+40,a.y);
    let sp=a.baseVx+(wDir2>0?2.2:0);
    a.x+=sp*dt*60/60*1; // will accumulate as world progress relative measure
    a.progress=(a.progress||0)+sp*dt*60;
    a.y+=Math.sin((raceTime+a.baseVx*10))*0.4;
    a.y=Math.max(10,Math.min(H-30,a.y));
    // occasional obstacle dodge randomness
  });
  player.progress=(player.progress||0)+player.vx*dt*60;

  // obstacles collision
  obstacles.forEach(o=>{
    if(o.type==='hawk'){o.y+=o.vy*dt*60;if(o.y<20||o.y>H-40)o.vy*=-1;}
    const sx=o.x-camX;
    if(!o.hit&&sx>player.x-20&&sx<player.x+20&&Math.abs(o.y-player.y)<22){
      o.hit=true;
      player.progress-=250;
      player.boost=0;
      SFX.hit();
    }
  });

  if(player.progress>=COURSE){
    finishRace();
  }
}

function finishRace(){
  state='over';
  const ranks=[{who:'you',p:player.progress}].concat(ais.map((a,i)=>({who:'ai'+i,p:a.progress})));
  ranks.sort((x,y)=>y.p-x.p);
  const pos=ranks.findIndex(r=>r.who==='you')+1;
  document.getElementById('posLabel').textContent=pos+'/'+(ais.length+1);
  document.getElementById('timeLabel').textContent=raceTime.toFixed(1);
  if(pos===1){
    SFX.win();
    if(!best||raceTime<best){best=raceTime;localStorage.setItem('pigeonrace_best',best.toFixed(2));document.getElementById('bestLabel').textContent=best.toFixed(1);}
  }else{
    SFX.lose();
  }
}

function drawWind(w){
  const sx=w.x-camX;
  if(sx+w.w<0||sx>W)return;
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle=w.dir>0?'#fff9c4':'#b3e5fc';
  ctx.fillRect(sx,w.y,w.w,w.h);
  ctx.globalAlpha=0.8;
  ctx.strokeStyle=w.dir>0?'#ffd54f':'#4fc3f7';
  ctx.lineWidth=2;
  for(let i=0;i<3;i++){
    const yy=w.y+12+i*(w.h-24);
    ctx.beginPath();
    ctx.moveTo(sx+10,yy);
    ctx.lineTo(sx+w.w-20,yy);
    const ax=w.dir>0?sx+w.w-20:sx+10;
    ctx.moveTo(ax-6*w.dir,yy-6);
    ctx.lineTo(ax,yy);
    ctx.lineTo(ax-6*w.dir,yy+6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawObstacle(o){
  const sx=o.x-camX;
  if(sx<-60||sx>W+60||o.hit)return;
  if(o.type==='pole'){
    ctx.fillStyle='#5d4037';
    ctx.fillRect(sx-4,0,8,H);
    ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx-60,30);ctx.lineTo(sx+60,30);ctx.stroke();
  }else{
    ctx.fillStyle='#4a2c1a';
    ctx.beginPath();ctx.ellipse(sx,o.y,16,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2d1810';
    const wf=Math.sin(raceTime*15)*8;
    ctx.beginPath();ctx.moveTo(sx-16,o.y);ctx.lineTo(sx-30,o.y-wf);ctx.lineTo(sx-16,o.y+6);ctx.fill();
    ctx.beginPath();ctx.moveTo(sx+16,o.y);ctx.lineTo(sx+30,o.y-wf);ctx.lineTo(sx+16,o.y+6);ctx.fill();
  }
}

function drawBird(x,y,col,flap){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,0,16,9,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(13,-3,7,6,0,0,Math.PI*2);ctx.fill();
  const wf=Math.sin(flap)*10;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-20,-8-wf);ctx.lineTo(-6,4);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(16,-4,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#b3e5fc');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<6;i++){
    const cx=((i*300-camX*0.3)%(W+200)+(W+200))%(W+200)-100;
    ctx.beginPath();ctx.ellipse(cx,40+i%3*60,40,18,0,0,Math.PI*2);ctx.fill();
  }
  winds.forEach(drawWind);
  obstacles.forEach(drawObstacle);
  ais.forEach(a=>drawBird(a.x,a.y,a.col,raceTime*20+a.baseVx*10));
  drawBird(player.x,player.y,'#3e3e3e',player.flap);

  // finish flag
  const finSx=COURSE-camX;
  if(finSx<W+50){
    ctx.fillStyle='#fff';ctx.fillRect(finSx,0,4,H);
    ctx.font='bold 20px Arial';ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.fillText('🏠',finSx,30);
  }

  if(state==='countdown'){
    ctx.fillStyle='#fff';ctx.font='bold 48px Arial';ctx.textAlign='center';
    const n=Math.max(1,3-Math.floor(raceTime/0.45));
    ctx.fillText(I18N.t('get_ready',n>0?String(n):'GO!'),W/2,H/2);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('race_finished','Race Finished!'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tap_next','Tap / press any key for next race'),W/2,H/2+20);
  }

  document.getElementById('timeLabel').textContent=raceTime.toFixed(1);
}

let last=null;
function loop(t){
  if(last===null)last=t;
  const dt=Math.min((t-last)/1000,0.05);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
