<style>
body{background:#1a0e04}
#c{background:#b35a1f;display:block;border-radius:8px;touch-action:none}
#hud{color:#ffe0c0;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#ffd080}
#hud span.hs{color:#b0ff90}
#btnRow{display:flex;justify-content:center;gap:10px;padding:6px 10px 14px;flex-wrap:wrap}
#btnRow button{padding:12px 26px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.15rem;color:#fff;background:#8a3a10}

</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gin Still Heating</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Batch: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="btnRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Up Arrow</b> (or the Flame Up button) to heat the still and <b>Down Arrow</b> (or Flame Down) to cool it. Keep the gauge needle inside the green <b>safe distilling zone</b> as long as you can — boil-up surges and cold drafts will try to knock it out!</div>
</div>
<script>
(function(){
const HS_KEY='gindistillingstillheating_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let heat=50,targetLo=0,targetHi=0,survivedTime=0,batchGoal=0,eventTimer=0,eventShake=0;
let heatUp=false,heatDown=false,gustDir=0,gustTimer=0;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function newBatch(){
  heat=50;
  const width=Math.max(10,26-level*1.3);
  const center=40+Math.random()*20;
  targetLo=center-width/2;targetHi=center+width/2;
  survivedTime=0;
  batchGoal=Math.max(360,500-level*14);
  eventTimer=90+Math.random()*60;
  gustDir=0;gustTimer=0;
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newBatch(); }
reset();

function buildButtons(){
  const el=document.getElementById('btnRow');
  el.innerHTML='';
  const down=document.createElement('button');
  down.textContent=I18N.t('flame_down_btn','🔽 Flame Down');
  down.addEventListener('pointerdown',e=>{e.stopPropagation(); heatDown=true;});
  down.addEventListener('pointerup',e=>{e.stopPropagation(); heatDown=false;});
  down.addEventListener('pointerleave',()=>{heatDown=false;});
  const up=document.createElement('button');
  up.textContent=I18N.t('flame_up_btn','🔼 Flame Up');
  up.addEventListener('pointerdown',e=>{e.stopPropagation(); heatUp=true;});
  up.addEventListener('pointerup',e=>{e.stopPropagation(); heatUp=false;});
  up.addEventListener('pointerleave',()=>{heatUp=false;});
  el.appendChild(down);el.appendChild(up);
}
buildButtons();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('batch_label','Batch: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failBatch(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newBatch();
}

function passBatch(){
  score+=200*level;SFX.win();
  if(score>=level*500)levelUp();
  newBatch();
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();}
    return;
  }
  if(e.code==='ArrowUp'){ e.preventDefault(); heatUp=true; }
  else if(e.code==='ArrowDown'){ e.preventDefault(); heatDown=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp'){ heatUp=false; }
  else if(e.code==='ArrowDown'){ heatDown=false; }
});

function drawStill(){
  const sx=W/2,sy=220;
  ctx.save();
  ctx.fillStyle='#d9924a';
  ctx.beginPath();ctx.ellipse(sx,sy,110,80,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7a4a1a';ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle='#e8a85a';
  ctx.beginPath();ctx.moveTo(sx-40,sy-70);ctx.lineTo(sx+10,sy-150);ctx.lineTo(sx+30,sy-150);ctx.lineTo(sx+40,sy-70);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#7a4a1a';ctx.stroke();
  // flame
  const flameH=10+heat*0.6;
  ctx.fillStyle=heat>75?'#ff5722':(heat>40?'#ff9800':'#ffd54f');
  ctx.beginPath();
  ctx.moveTo(sx-20,sy+80);
  ctx.quadraticCurveTo(sx-26,sy+80-flameH*0.6,sx,sy+80-flameH);
  ctx.quadraticCurveTo(sx+26,sy+80-flameH*0.6,sx+20,sy+80);
  ctx.closePath();ctx.fill();
  ctx.restore();

  // gauge
  const gx=sx,gy=80;
  ctx.font='16px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText(I18N.t('safe_zone_label','Keep the needle in the safe zone'),gx,30);
  const barW=420,barH=20,barX=gx-barW/2,barY=46;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(barX,barY,barW,barH);
  const loX=barX+(targetLo/100)*barW;
  const hiX=barX+(targetHi/100)*barW;
  ctx.fillStyle='rgba(46,204,113,0.6)';
  ctx.fillRect(loX,barY,hiX-loX,barH);
  const needleX=barX+(heat/100)*barW;
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(needleX,barY-8);ctx.lineTo(needleX,barY+barH+8);ctx.stroke();
  ctx.fillStyle='#ffe0c0';ctx.font='bold 16px Arial';
  ctx.fillText(Math.round(heat)+'°',needleX,barY-14);

  if(gustDir!==0){
    ctx.font='bold 15px Arial';
    ctx.fillStyle=gustDir>0?'#ff7043':'#4fc3f7';
    ctx.fillText(gustDir>0?I18N.t('boilup_label','⚠ Boil-up surge!'):I18N.t('draft_label','⚠ Cold draft!'),gx,barY+barH+28);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#5a2a0a');bg.addColorStop(1,'#b35a1f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ffe0c0';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawStill();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  let drift=0;
  if(heatUp)drift+=0.55;
  if(heatDown)drift-=0.55;
  drift-=0.06; // natural cooling

  eventTimer--;
  if(eventTimer<=0){
    gustDir=Math.random()<0.5?1:-1;
    gustTimer=50+Math.random()*30;
    eventTimer=140+Math.random()*100-level*4;
    SFX.swoosh();
  }
  if(gustTimer>0){
    drift+=gustDir*(0.5+level*0.05);
    gustTimer--;
    if(gustTimer<=0)gustDir=0;
  }

  heat=Math.max(0,Math.min(100,heat+drift));

  const inZone=heat>=targetLo&&heat<=targetHi;
  if(inZone){
    survivedTime++;
    score+=0.5*level;
    if(survivedTime>=batchGoal){ passBatch(); }
  } else {
    survivedTime=Math.max(0,survivedTime-1);
    if(heat<=0||heat>=100){ failBatch(); }
  }

  const barW=400,barH=8,barX=W/2-barW/2,barY=H-20;
  ctx.fillStyle='#2a1505';ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=inZone?'#2ecc71':'#e74c3c';
  ctx.fillRect(barX,barY,barW*Math.min(1,survivedTime/batchGoal),barH);

  drawStill();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
