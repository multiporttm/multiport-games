<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Kite Festival</title><meta name="description" content="Play Kite Festival free online — Steer with Arrow Keys, A/D, or touch drag to dodge birds and wind gusts while climbing as high as you can."><link rel="canonical" href="https://games.multiportllc.com/games/kitefestival"><meta property="og:title" content="Kite Festival - Multiport Games"><meta property="og:description" content="Play Kite Festival free online — Steer with Arrow Keys, A/D, or touch drag to dodge birds and wind gusts while climbing as high as you can."><meta property="og:url" content="https://games.multiportllc.com/games/kitefestival"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Kite Festival","description":"Play Kite Festival free online instantly. Steer with Arrow Keys, A/D, or touch drag to dodge birds and wind gusts while climbing as high as you can. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/kitefestival","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a3a6b;display:block;border-radius:8px}
#score-display{color:#8ecbff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Kite Festival</div>
  <div class="game-frame">
    <div id="score-display">Altitude: 0m | Best: 0m</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / A D</b> or touch-drag to steer your kite left and right. Dodge birds and wind gusts while climbing as high as possible!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
let best=parseFloat(localStorage.getItem('kitefestival_best')||'0');
let kite,birds,gusts,altitude,speed,frame,gameOver,started,keys,dragX;

function reset(){
  kite={x:W/2,y:H-80,vx:0};
  birds=[];gusts=[];altitude=0;speed=1.6;frame=0;gameOver=false;started=false;keys={};dragX=null;
}
reset();

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.code==='Space'){e.preventDefault(); if(!started)started=true; if(gameOver)reset();}
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
c.addEventListener('pointerdown',e=>{
  if(!started)started=true;
  if(gameOver){reset();return;}
  dragX=e.offsetX;
});
c.addEventListener('pointermove',e=>{
  if(dragX!==null){kite.vx=(e.offsetX-dragX)*0.12;dragX=e.offsetX;}
});
c.addEventListener('pointerup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{e.preventDefault(); if(!started)started=true; if(gameOver)reset();},{passive:false});

function spawnBird(){
  const y=H-100-Math.random()*(H-200);
  const dir=Math.random()<0.5?1:-1;
  birds.push({x:dir>0?-30:W+30,y,w:28,h:18,dir,frame:0});
}
function spawnGust(){
  const y=H-100-Math.random()*(H-200);
  gusts.push({x:W+40,y,w:70,h:40,dir:Math.random()<0.5?-1:1});
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawKite(){
  ctx.save();
  ctx.translate(kite.x,kite.y);
  ctx.fillStyle='#ff477e';
  ctx.beginPath();
  ctx.moveTo(0,-22);ctx.lineTo(18,0);ctx.lineTo(0,10);ctx.lineTo(-18,0);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(18,0);ctx.moveTo(0,-22);ctx.lineTo(0,10);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();ctx.moveTo(0,10);
  for(let i=1;i<=5;i++)ctx.lineTo(Math.sin(frame/10+i)*6,10+i*8);
  ctx.stroke();
  ctx.restore();
}
function drawBird(b){
  ctx.save();
  ctx.fillStyle='#2c2c2c';
  const flap=Math.sin(b.frame/5)*8;
  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.quadraticCurveTo(b.x-14,b.y-flap,b.x-26,b.y);
  ctx.quadraticCurveTo(b.x-14,b.y+4,b.x,b.y);
  ctx.quadraticCurveTo(b.x+14,b.y-flap,b.x+26,b.y);
  ctx.quadraticCurveTo(b.x+14,b.y+4,b.x,b.y);
  ctx.fill();
  ctx.restore();
}
function drawGust(g){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=3;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(g.x-g.w/2,g.y-10+i*10);
    ctx.lineTo(g.x+g.w/2*g.dir,g.y-10+i*10);
    ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a1f3d');sky.addColorStop(1,'#3a6ea5');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<5;i++){
    const cy=(H-(altitude*3+i*140)%(H+100));
    ctx.beginPath();ctx.ellipse(150+i*130,cy,50,20,0,0,Math.PI*2);ctx.fill();
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('grounded_title','GROUNDED!'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('retry_hint2','Tap or Space to retry'),W/2,H/2+20);
    document.getElementById('score-display').textContent=I18N.t('altitude_best_label','Altitude: {n}m | Best: {b}m').replace('{n}',Math.floor(altitude)).replace('{b}',Math.floor(best));
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffffffaa';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint2','Steer or tap to launch your kite'),W/2,H/2);
    drawKite();
    requestAnimationFrame(loop);return;
  }

  frame++;
  altitude+=speed*0.2;
  if(altitude>best){best=altitude;localStorage.setItem('kitefestival_best',best);}
  speed=1.6+altitude/400;

  if(keys['ArrowLeft']||keys['a']||keys['A'])kite.vx-=0.6;
  if(keys['ArrowRight']||keys['d']||keys['D'])kite.vx+=0.6;
  kite.vx*=0.9;
  kite.x+=kite.vx;
  if(kite.x<20)kite.x=20;
  if(kite.x>W-20)kite.x=W-20;

  if(frame%70===0)spawnBird();
  if(frame%110===0)spawnGust();

  birds=birds.filter(b=>b.dir>0?b.x<W+40:b.x>-40);
  birds.forEach(b=>{
    b.x+=b.dir*(2.2+altitude/300);
    b.frame++;
    drawBird(b);
    if(rectHit({x:kite.x-16,y:kite.y-18,w:32,h:32},{x:b.x-14,y:b.y-9,w:28,h:18})){
      gameOver=true;SFX.lose();
    }
  });

  gusts=gusts.filter(g=>g.x>-100);
  gusts.forEach(g=>{
    g.x-=2.4;
    drawGust(g);
    if(Math.abs(g.x-kite.x)<40 && Math.abs(g.y-kite.y)<30){
      kite.vx+=g.dir*0.8;
    }
  });

  drawKite();
  document.getElementById('score-display').textContent=I18N.t('altitude_best_label','Altitude: {n}m | Best: {b}m').replace('{n}',Math.floor(altitude)).replace('{b}',Math.floor(best));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
