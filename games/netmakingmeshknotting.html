<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1c3a4a;display:block;border-radius:8px}
#score-display{color:#e8c99a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Net Making Mesh Knotting</div>
  <div class="game-frame">
    <div id="score-display">Knots: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Click</b>, or <b>Tap</b> in rhythm with the needle to tie each mesh knot. Land the tap inside the glowing safe zone to keep the knot tight. Miss the zone and the knot slips loose. Rows get longer every round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const ROWY=[90,160,230,300,370-10];
let round=1,rowLen=8,knotsTied=0,knotsNeeded=8,score=0,hi=0;
let state='ready'; // ready, playing, rowclear, slipped, gameover
let needleT=0,needleSpeed=0.016,needleDir=1;
let safeCenter=0.5,safeWidth=0.22;
let currentRow=0,knotX=[];
let flashTimer=0,flashColor='';
let shakeTimer=0;
let particles=[];
let lastTime=null;

try{hi=parseFloat(localStorage.getItem('netmakingmeshknotting_hi'))||0;}catch(e){hi=0;}

function initRound(){
  rowLen=7+round*2;
  knotsNeeded=rowLen;
  currentRow=0;
  knotsTied=0;
  startRow();
}
function startRow(){
  knotX=[];
  needleT=0;needleDir=1;
  needleSpeed=0.012+round*0.0015+currentRow*0.0005;
  safeWidth=Math.max(0.10,0.26-round*0.012-currentRow*0.004);
  state='playing';
}
function resetGame(){round=1;score=0;initRound();state='playing';}

function tryTap(){
  if(state==='gameover'){resetGame();SFX.click();return;}
  if(state==='ready'){resetGame();SFX.click();return;}
  if(state!=='playing')return;
  // needleT oscillates 0..1..0; position along row
  const pos=needleT;
  const dist=Math.abs(pos-safeCenter);
  if(dist<=safeWidth/2){
    // good knot
    knotX.push(pos);
    knotsTied++;score++;
    flashTimer=14;flashColor='#6fe08a';
    SFX.point();
    spawnParticles(pos,true);
    if(knotX.length>=rowLen){
      state='rowclear';flashTimer=28;flashColor='#ffd54f';
      SFX.success();
      setTimeout(()=>{
        currentRow++;
        if(currentRow>=ROWY.length){round++;SFX.levelup();initRound();}
        else startRow();
      },650);
    } else {
      // move safe zone for next knot, roughly advancing along row
      safeCenter=Math.min(0.92,0.08+ (knotX.length/rowLen)*0.84 + (Math.random()*0.06-0.03));
    }
  } else {
    // slipped knot
    flashTimer=16;flashColor='#e94560';
    shakeTimer=14;
    SFX.hurt();
    spawnParticles(pos,false);
    state='slipped';
    setTimeout(()=>{
      if(score>hi){hi=score;try{localStorage.setItem('netmakingmeshknotting_hi',String(hi));}catch(e){}}
      state='gameover';SFX.lose();
    },500);
  }
}

function spawnParticles(pos,good){
  const x=40+pos*(W-80);
  for(let i=0;i<10;i++){
    particles.push({x,y:ROWY[currentRow],vx:(Math.random()-0.5)*4,vy:-Math.random()*3-1,life:30,good});
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tryTap();}});
c.addEventListener('click',tryTap);
c.addEventListener('touchstart',e=>{e.preventDefault();tryTap();},{passive:false});

function drawNeedleTrack(ry){
  ctx.strokeStyle='#8a6a45';
  ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(40,ry);ctx.lineTo(W-40,ry);ctx.stroke();
  // mesh row rope texture
  ctx.strokeStyle='#c9a876';
  ctx.lineWidth=2;
  for(let x=40;x<W-40;x+=14){
    ctx.beginPath();ctx.moveTo(x,ry-5);ctx.lineTo(x+7,ry+5);ctx.stroke();
  }
}

function drawSafeZone(ry){
  const x1=40+(safeCenter-safeWidth/2)*(W-80);
  const w=safeWidth*(W-80);
  const pulse=0.5+0.5*Math.sin(performance.now()/180);
  ctx.fillStyle=`rgba(111,224,138,${0.18+pulse*0.12})`;
  ctx.fillRect(x1,ry-22,w,44);
  ctx.strokeStyle='#6fe08a';ctx.lineWidth=2;
  ctx.strokeRect(x1,ry-22,w,44);
}

function drawKnots(ry){
  knotX.forEach(p=>{
    const x=40+p*(W-80);
    ctx.save();
    ctx.translate(x,ry);
    ctx.fillStyle='#e8c99a';
    ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#8a6a45';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  });
}

function drawNeedle(ry){
  const x=40+needleT*(W-80);
  ctx.save();
  ctx.translate(x,ry);
  ctx.rotate(needleDir>0?0.25:-0.25);
  ctx.fillStyle='#d9d9e0';
  ctx.fillRect(-3,-34,6,50);
  ctx.beginPath();ctx.moveTo(-3,-34);ctx.lineTo(3,-34);ctx.lineTo(0,-44);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b5651d';
  ctx.fillRect(-5,10,10,10);
  ctx.restore();
}

function drawRowsAbove(){
  for(let r=0;r<currentRow;r++){
    drawNeedleTrack(ROWY[r]);
    ctx.fillStyle='#6fe08a';
    for(let i=0;i<rowLen;i++){
      const x=40+(0.08+i/(rowLen-1)*0.84)*(W-80);
      ctx.beginPath();ctx.arc(x,ROWY[r],6,0,Math.PI*2);ctx.fill();
    }
  }
}

function draw(){
  let ox=0,oy=0;
  if(shakeTimer>0){ox=(Math.random()-0.5)*8;oy=(Math.random()-0.5)*8;shakeTimer--;}
  ctx.save();
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#123445');bg.addColorStop(1,'#1c3a4a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.translate(ox,oy);

  // frame posts
  ctx.fillStyle='#5a4631';
  ctx.fillRect(20,60,14,H-100);
  ctx.fillRect(W-34,60,14,H-100);

  drawRowsAbove();

  if(state==='playing'||state==='slipped'||state==='rowclear'){
    drawNeedleTrack(ROWY[currentRow]);
    drawSafeZone(ROWY[currentRow]);
    drawKnots(ROWY[currentRow]);
    if(state==='playing')drawNeedle(ROWY[currentRow]);
  }

  // particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    ctx.fillStyle=p.good?`rgba(111,224,138,${p.life/30})`:`rgba(233,69,96,${p.life/30})`;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });

  if(flashTimer>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flashTimer/28*0.35;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    flashTimer--;
  }

  ctx.textAlign='center';
  if(state==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('mesh_start_hint','Tap / Click / Space to start knotting'),W/2,H/2);
  }
  if(state==='rowclear'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('mesh_row_clear','Row complete!'),W/2,H/2);
  }
  if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('mesh_slipped','KNOT SLIPPED!'),W/2,H/2-14);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('mesh_restart','Tap / Space to try again'),W/2,H/2+22);
  }
  ctx.restore();

  document.getElementById('score-display').textContent=
    I18N.t('mesh_score_label','Knots: {s} | Round: {r} | Hi: {h}')
      .replace('{s}',score).replace('{r}',round).replace('{h}',Math.floor(hi));
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;
  if(state==='playing'){
    needleT+=needleSpeed*needleDir*dt;
    if(needleT>=1){needleT=1;needleDir=-1;}
    if(needleT<=0){needleT=0;needleDir=1;}
  }
  draw();
  requestAnimationFrame(loop);
}
state='ready';
draw();
requestAnimationFrame(loop);
</script></body></html>
