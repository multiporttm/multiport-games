<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1b5e20,#81c784);display:block;border-radius:8px;touch-action:none}
#score-display{color:#c8e6c9;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Recycling Sort</div>
  <div class="game-frame">
    <div id="score-display">Sorted: 0 | Misses: 0/8 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click an item on the belt, then click the matching bin (<b>Recycle</b>, <b>Compost</b>, or <b>Trash</b>) before it slides off the end. Sort fast — the belt speeds up!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const LANES=[70,150,230];
const BINS=[
  {label:'Recycle',color:'#2196f3',type:'recycle',x:80,w:200},
  {label:'Compost',color:'#8d6e63',type:'compost',x:300,w:200},
  {label:'Trash',color:'#616161',type:'trash',x:520,w:200},
];
const BIN_Y=360,BIN_H=50;

const ITEMS=[
  {icon:'🍾',type:'recycle',name:'bottle'},
  {icon:'🥫',type:'recycle',name:'can'},
  {icon:'📰',type:'recycle',name:'paper'},
  {icon:'📦',type:'recycle',name:'cardboard'},
  {icon:'🍌',type:'compost',name:'banana peel'},
  {icon:'🍎',type:'compost',name:'apple core'},
  {icon:'🥕',type:'compost',name:'veggie scrap'},
  {icon:'🍕',type:'compost',name:'food scrap'},
  {icon:'🥤',type:'trash',name:'cup'},
  {icon:'🧴',type:'trash',name:'lotion bottle'},
  {icon:'🩹',type:'trash',name:'bandage'},
  {icon:'🪥',type:'trash',name:'toothbrush'},
];

let items=[],sorted=0,misses=0,hi=0,gameOver=false,started=false;
let spawnTimer=0,spd=0.9,lastTime=null,selected=null,frame=0;
const MAX_MISSES=8;
const BELT_END=800;

hi=parseInt(localStorage.getItem('recyclingsort_hi')||'0',10);

function reset(){
  items=[];sorted=0;misses=0;gameOver=false;started=false;
  spawnTimer=0;spd=0.9;lastTime=null;selected=null;frame=0;
  updateScore();
}

function spawnItem(){
  const laneIdx=Math.floor(Math.random()*LANES.length);
  const def=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  items.push({x:-40,y:LANES[laneIdx],icon:def.icon,type:def.type,name:def.name,w:40,h:40,id:Math.random()});
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('recycle_score_label','Sorted: {s} | Misses: {m}/{mm} | Hi: {h}')
      .replace('{s}',sorted).replace('{m}',misses).replace('{mm}',MAX_MISSES).replace('{h}',hi);
}

function pointInItem(px,py,it){
  return px>=it.x-it.w/2&&px<=it.x+it.w/2&&py>=it.y-it.h/2&&py<=it.y+it.h/2;
}
function pointInBin(px,py,bin){
  return px>=bin.x&&px<=bin.x+bin.w&&py>=BIN_Y&&py<=BIN_Y+BIN_H;
}

function handlePointer(px,py){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  // check bin click first if item selected
  if(selected){
    for(const bin of BINS){
      if(pointInBin(px,py,bin)){
        if(selected.type===bin.type){
          sorted++;SFX.success();
        }else{
          misses++;SFX.error();
          if(misses>=MAX_MISSES) endGame();
        }
        items=items.filter(it=>it.id!==selected.id);
        selected=null;
        updateScore();
        return;
      }
    }
  }
  // check item click
  for(let i=items.length-1;i>=0;i--){
    if(pointInItem(px,py,items[i])){
      selected=items[i];
      SFX.select();
      return;
    }
  }
  selected=null;
}

function getPos(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  let cx,cy;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*scaleX,y:(cy-rect.top)*scaleY};
}

c.addEventListener('click',e=>{const p=getPos(e);handlePointer(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);handlePointer(p.x,p.y);},{passive:false});

function endGame(){
  gameOver=true;
  if(sorted>hi){hi=sorted;localStorage.setItem('recyclingsort_hi',hi);}
  SFX.lose();
}

function drawBelt(){
  LANES.forEach(y=>{
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.fillRect(0,y-30,BELT_END,60);
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=2;
    for(let x=(frame*2)%20-20;x<BELT_END;x+=20){
      ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+10,y+30);ctx.stroke();
    }
  });
}

function drawBins(){
  BINS.forEach(bin=>{
    ctx.fillStyle=bin.color;
    ctx.fillRect(bin.x,BIN_Y,bin.w,BIN_H);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.strokeRect(bin.x,BIN_Y,bin.w,BIN_H);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bin_'+bin.type,bin.label),bin.x+bin.w/2,BIN_Y+30);
  });
}

function drawItem(it){
  ctx.save();
  if(selected&&selected.id===it.id){
    ctx.shadowColor='#ffeb3b';ctx.shadowBlur=20;
    ctx.strokeStyle='#ffeb3b';ctx.lineWidth=3;
    ctx.strokeRect(it.x-it.w/2-4,it.y-it.h/2-4,it.w+8,it.h+8);
  }
  ctx.font='34px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(it.icon,it.x,it.y);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawBelt();
  drawBins();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_recycle','Tap to start sorting!'),W/2,180);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    items.forEach(drawItem);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('recycle_final_label','Sorted {s} items').replace('{s}',sorted),W/2,220);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,250);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  spd=0.9+sorted/40+misses/60;
  spawnTimer+=dt;
  const interval=Math.max(35,75-sorted*1.5);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnItem();}

  items.forEach(it=>{it.x+=spd*dt;});
  // items reaching end unsorted
  const stillGoing=[];
  for(const it of items){
    if(it.x>BELT_END+20){
      misses++;
      if(selected&&selected.id===it.id)selected=null;
      SFX.error();
      if(misses>=MAX_MISSES){endGame();}
    }else{
      stillGoing.push(it);
    }
  }
  items=stillGoing;
  items.forEach(drawItem);
  updateScore();

  requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!started){started=true;} else if(gameOver){reset();}}
});

reset();
loop();
</script></body></html>
