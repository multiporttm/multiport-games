<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Coffeepot Making Brew Testing","description":"Time each pour against a sweeping flow gauge to brew the perfect test cup of coffee.","applicationCategory":"GameApplication","operatingSystem":"Any"}</script>

<style>
body{background:linear-gradient(135deg,#6b4a2f,#302010)}
#gf{padding:12px}
#wrap{position:relative;width:360px;max-width:100%;margin:0 auto}
canvas#c{display:block;border-radius:10px;margin:0 auto;background:radial-gradient(circle at 50% 20%, #6b4a2f, #302010)}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:.85rem;padding:0 4px 8px;max-width:360px;margin:0 auto}
#hud span{opacity:.9}
#big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:10px;gap:10px;color:#fff;text-align:center;padding:16px}
#big.hidden{display:none}
#startBtn{background:#ff9f40;color:#15181c;border:none;padding:14px 32px;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#startBtn:active{transform:translateY(1px)}
#bigScore{font-size:1.4rem;font-weight:800}
#bigSub{font-size:.85rem;opacity:.85;max-width:280px}
</style>
</head>
<body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">&larr; Back</a>
    <div class="game-title" style="margin:0">☕ Coffeepot Making Brew Testing</div>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-frame" id="gf">
    <div id="hud"><span data-i18n="score_label2">Score: <b id="scoreVal">0</b></span><span data-i18n="round_label">Pours: <b id="roundVal">0</b></span><span data-i18n="best_label">Best: <b id="bestVal">0</b></span></div>
    <div id="wrap">
      <canvas id="c" width="360" height="480"></canvas>
      <div id="big">
        <div id="bigTitle" style="font-size:1.3rem;font-weight:800">☕ Coffeepot Making Brew Testing</div>
        <div id="bigScore"></div>
        <div id="bigSub"></div>
        <button id="startBtn">Start</button>
      </div>
    </div>
    <div style="max-width:360px;margin:8px auto 0;padding:0 4px">
      <div style="display:flex;justify-content:space-between;color:#fff;font-size:.75rem;margin-bottom:4px"><span data-i18n="focus_label">Flow Rating</span></div>
      <div style="background:rgba(255,255,255,0.12);border-radius:8px;height:10px;overflow:hidden">
        <div id="focusFill" style="height:100%;width:100%;background:#ff9f40;transition:width .15s,background .15s"></div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">The flow needle sweeps across the gauge as coffee pours. Tap, click, or press Space/Enter when it is in the amber zone for a perfect, even pour. Bad pours spill and hurt your flow rating!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=480;
const HS_KEY='coffeepotmakingbrewtesting_highscore';
let highScore=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let state='ready'; // ready | play | over
let score=0, round=0, hitsInTier=0, focus=100;
let zoneW=0.22, speed=0.012, dir=1, t=0.5, angle=0;
let flashTimer=0, flashGood=false, shakeTimer=0;
let particles=[];

function reset(){
  score=0; round=0; hitsInTier=0; focus=100;
  zoneW=0.22; speed=0.012; dir=1; t=Math.random();
  angle=Math.random()*Math.PI*2;
  particles=[];
  zonePos=Math.random()*(1-zoneW);
}
let zonePos=Math.random()*(1-zoneW);

function newAttempt(){
  zonePos=Math.random()*(1-zoneW);
}

function tierUp(){
  hitsInTier=0;
  speed=Math.min(speed*1.09,0.055);
  zoneW=Math.max(zoneW*0.94,0.10);
  SFX.levelup();
}

function doHit(){
  if(state!=='play')return;
  
  const inZone = t>=zonePos && t<=zonePos+zoneW;
  
  if(inZone){
    round++; hitsInTier++; score+=10+round*2;
    focus=Math.min(100,focus+6);
    flashGood=true; flashTimer=14;
    SFX.coin();
    spawnParticles(true);
    if(hitsInTier>=5) tierUp();
    newAttempt();
  } else {
    focus-=22;
    flashGood=false; flashTimer=14; shakeTimer=10;
    SFX.error();
    spawnParticles(false);
    if(focus<=0){
      endGame();
    } else {
      newAttempt();
    }
  }
}

function spawnParticles(good){
  for(let i=0;i<10;i++){
    particles.push({
      x:W/2+(Math.random()-0.5)*60, y:H*0.42+(Math.random()-0.5)*20,
      vx:(Math.random()-0.5)*4, vy:(Math.random()-0.9)*4,
      life:30, good
    });
  }
}

function endGame(){
  state='over';
  SFX.lose();
  if(score>highScore){
    highScore=score;
    localStorage.setItem(HS_KEY,String(highScore));
  }
  showOverlay();
}

function startGame(){
  reset();
  state='play';
  SFX.select();
  hideOverlay();
}

function showOverlay(){
  const big=document.getElementById('big');
  big.classList.remove('hidden');
  const title=document.getElementById('bigTitle');
  const btn=document.getElementById('startBtn');
  const bigScore=document.getElementById('bigScore');
  const bigSub=document.getElementById('bigSub');
  if(state==='ready'){
    title.textContent=I18N.t('ready_title','☕ Coffeepot Making Brew Testing');
    bigScore.textContent='';
    bigSub.textContent=I18N.t('ready_sub','Press when the needle sweeps into the amber zone for a perfect, even test pour.');
    btn.textContent=I18N.t('start_btn','Start');
  } else {
    title.textContent=I18N.t('over_title','Game Over');
    bigScore.textContent=I18N.t('final_score','Score: {n}').replace('{n}',score)+'   '+I18N.t('best_score','Best: {n}').replace('{n}',highScore);
    bigSub.textContent=I18N.t('over_sub','Pours completed: {n}').replace('{n}',round);
    btn.textContent=I18N.t('again_btn','Play Again');
  }
}
function hideOverlay(){ document.getElementById('big').classList.add('hidden'); }

function update(){
  if(state==='play'){
    
    t += dir*speed;
    if(t>1){t=1;dir=-1;}
    if(t<0){t=0;dir=1;}
    
    if(flashTimer>0)flashTimer--;
    if(shakeTimer>0)shakeTimer--;
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;});
    particles=particles.filter(p=>p.life>0);
  }
}


function drawBackground(){
  ctx.save();
  if(shakeTimer>0){ ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  ctx.fillStyle='rgba(255,255,255,0.04)';
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.arc(60+i*70,H*0.18,26,0,Math.PI*2);ctx.fill();
  }
  ctx.font='13px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.textAlign='center';
  ctx.fillText(I18N.t('flavor1','Pour steady, not too fast'),W/2,H*0.14);
  ctx.font='bold 22px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.fillText('☕', W*0.18, H*0.42);
  ctx.fillText('☕', W*0.82, H*0.42);
  ctx.restore();
}
function drawGauge(){
  ctx.save();
  if(shakeTimer>0){ ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  const bx=40, bw=W-80, by=H*0.42-16, bh=32;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
  const zx=bx+zonePos*bw, zw=zoneW*bw;
  ctx.fillStyle='#ff9f40';
  ctx.beginPath();ctx.roundRect(zx,by,zw,bh,6);ctx.fill();
  const mx=bx+t*bw;
  ctx.strokeStyle=flashTimer>0?(flashGood?'#ffffff':'#ff5555'):'#ffffff';
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(mx,by-10);ctx.lineTo(mx,by+bh+10);ctx.stroke();
  ctx.beginPath();ctx.arc(mx,by+bh/2,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.font='bold 14px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.textAlign='center';
  ctx.fillText('POUR CHECK', W/2, by+bh+34);
  ctx.restore();
}


function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawGauge();
  drawParticles();
  drawHud();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.good?'#ff9f40':'#ff5555';
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawHud(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('roundVal').textContent=round;
  document.getElementById('bestVal').textContent=highScore;
  const pct=Math.max(0,focus);
  const fm=document.getElementById('focusFill');
  fm.style.width=pct+'%';
  fm.style.background = pct>50 ? '#ff9f40' : (pct>20 ? '#ffb020' : '#ff4d4d');
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click',()=>{
  startGame();
});

function press(e){
  if(e){e.preventDefault&&e.preventDefault();}
  if(state!=='play')return;
  doHit();
}

c.addEventListener('mousedown',press);
c.addEventListener('touchstart',press,{passive:false});
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state==='play') doHit();
  }
});

showOverlay();
loop();
</script>
</body>
</html>
