<link rel="stylesheet" href="../css/style.css?v=8">

<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0b2238;display:block;border-radius:8px}
#score-display{color:#5ec8e0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dive Certification Written Exam</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read each question on dive tables, gas laws, and safety procedures, then click/tap an answer (or use <b>Arrow Keys + Enter</b> or <b>1-4</b>) before the clock runs out. Three wrong answers and you fail the exam!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=460;
const scoreDisp=document.getElementById('score-display');
const HS_KEY='divecertificationwrittenexam_hiscore';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const BANK=[
  {q:"At 20 meters depth, approximately how many atmospheres of pressure act on a diver (including surface pressure)?",choices:["1 ATA","2 ATA","3 ATA","4 ATA"],correct:2},
  {q:"Per Boyle's Law, as a diver descends and pressure increases, gas volume in a flexible space will:",choices:["Increase","Decrease","Stay the same","Double regardless of depth"],correct:1},
  {q:"What is the maximum recommended depth for an Open Water certified diver?",choices:["12 meters","18 meters","30 meters","40 meters"],correct:1},
  {q:"A diver surfaces with a severe shortage of a planned safety stop after a deep dive. What should they do first?",choices:["Immediately dive again to depth","Rest, breathe oxygen if available, and watch for DCS symptoms","Ignore it, no risk if dive was short","Fly home immediately"],correct:1},
  {q:"Nitrogen narcosis risk primarily increases with:",choices:["Increasing depth","Increasing water temperature","Decreasing depth","Decreasing tank pressure"],correct:0},
  {q:"What does the 'turnaround pressure' typically refer to?",choices:["The tank pressure at the start of the dive","The pressure gauge's maximum reading","The pressure at which a diver should begin heading back","The pressure that triggers equipment failure"],correct:2},
  {q:"According to Dalton's Law, the total pressure of a gas mixture equals:",choices:["The pressure of the rarest gas only","The sum of the partial pressures of each gas","The average of all partial pressures","The square of the total volume"],correct:1},
  {q:"A diver's required safety stop is typically performed at what depth for how long?",choices:["20m for 1 minute","5m for 3 minutes","10m for 10 minutes","No stop ever required"],correct:1},
  {q:"What is the main cause of decompression sickness (DCS)?",choices:["Running out of air","Nitrogen bubbles forming in tissues from too-fast ascent","Water entering the mask","Cold water exposure"],correct:1},
  {q:"The 'rule of thirds' for gas management on a dive typically means:",choices:["Use 1/3 to go out, 1/3 to return, 1/3 as reserve","Use all gas evenly over three dives","Only use a third of your tank total per trip","Share a third of gas with your buddy always"],correct:0},
  {q:"Per Henry's Law, the amount of gas that dissolves into a diver's blood is proportional to:",choices:["The color of the gas","The partial pressure of that gas","The diver's body weight only","The size of the dive tank"],correct:1},
  {q:"What should a diver do before entering open water for the first time on a dive?",choices:["Skip the buddy check to save time","Complete a full equipment and buddy safety check","Only check their own fins","Check only air pressure"],correct:1},
  {q:"Ascending too quickly primarily increases risk of:",choices:["Sunburn","Decompression sickness and lung overexpansion injuries","Hearing loss only","Hypothermia"],correct:1},
  {q:"A dive table or computer helps a diver primarily track:",choices:["Water temperature trends","Nitrogen absorption and no-decompression limits","Boat fuel usage","Marine life species"],correct:1},
  {q:"If two divers in a group have different certification levels, the group's maximum planned depth should be:",choices:["The average of both levels","Based on the more advanced diver only","Limited to the less experienced diver's certified limit","Decided by a coin flip"],correct:2},
];

let order=[],qIdx=0,score=0,lives=3,gameOver=false,started=false;
let sel=0,selected=-1,feedback=null,feedbackTimer=0,timeLeft,maxTime,round=1;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function nextQuestion(){
  if(order.length===0)order=shuffle(BANK.map((_,i)=>i));
  qIdx=order.pop();
  sel=0;selected=-1;feedback=null;
  maxTime=Math.max(9,20-Math.floor(round/3));
  timeLeft=maxTime;
}

function reset(){
  score=0;lives=3;round=1;gameOver=false;started=false;order=[];
  nextQuestion();
}
reset();

function choose(i){
  if(gameOver||feedback)return;
  const q=BANK[qIdx];
  selected=i;
  const correct=(i===q.correct);
  if(correct){
    score+=Math.max(15,Math.floor(timeLeft*6));
    SFX.success();
    feedback={ok:true,msg:I18N.t('correct_msg','Correct!')};
  } else {
    lives--;
    SFX.error();
    feedback={ok:false,msg:I18N.t('wrong_msg','Incorrect — review the material!')};
  }
  feedbackTimer=55;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
}

function advance(){
  if(lives<=0){gameOver=true;SFX.lose();return;}
  round++;
  nextQuestion();
}

document.addEventListener('keydown',e=>{
  if(gameOver&&e.code==='Space'){reset();return;}
  if(!started){started=true;return;}
  if(feedback)return;
  const q=BANK[qIdx];
  if(e.code==='ArrowUp'||e.code==='ArrowLeft'){sel=(sel+q.choices.length-1)%q.choices.length;SFX.click();}
  else if(e.code==='ArrowDown'||e.code==='ArrowRight'){sel=(sel+1)%q.choices.length;SFX.click();}
  else if(e.code==='Enter'||e.code==='Space'){choose(sel);}
  else {
    const m=e.code.match(/^Digit([1-9])$/);
    if(m){const idx=parseInt(m[1],10)-1;if(idx<q.choices.length)choose(idx);}
  }
});

function hitTest(mx,my){
  const q=BANK[qIdx];
  const boxY=240,boxH=50,gap=12,boxW=620,boxX=(W-boxW)/2;
  for(let i=0;i<q.choices.length;i++){
    const y=boxY+i*(boxH+gap);
    if(mx>=boxX&&mx<=boxX+boxW&&my>=y&&my<=y+boxH)return i;
  }
  return -1;
}

function pointerAt(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(feedback)return;
  const p=pointerAt(e);
  const i=hitTest(p.x,p.y);
  if(i>=0)choose(i);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(feedback)return;
  const p=pointerAt(e);
  const i=hitTest(p.x,p.y);
  if(i>=0)choose(i);
},{passive:false});

function wrapText(text,x,y,maxW,lineH,align){
  ctx.textAlign=align||'center';
  const words=text.split(' ');
  let line='',lines=[];
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  return lines.length;
}

let lastTime=null;
function loop(t){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#123a52');sky.addColorStop(1,'#061320');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('game_title_canvas','DIVE CERTIFICATION EXAM'),W/2,120);
    ctx.font='20px Arial';ctx.fillStyle='#9fd8ec';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to begin the exam'),W/2,165);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('exam_failed','EXAM FAILED'),W/2,150);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),W/2,195);
    ctx.font='18px Arial';ctx.fillStyle='#9fd8ec';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,230);
    scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);
    return;
  }

  const now=t;
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(!feedback){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;lives--;SFX.error();
      feedback={ok:false,msg:I18N.t('time_up_msg','Time ran out on this question!')};
      feedbackTimer=55;
    }
  } else {
    feedbackTimer--;
    if(feedbackTimer<=0){feedback=null;advance();}
  }

  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
  ctx.fillText(I18N.t('question_label','Question {r}').replace('{r}',round),20,32);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {l}').replace('{l}',lives),W-20,32);
  ctx.textAlign='center';

  const q=BANK[qIdx];
  ctx.fillStyle='#ffd54f';ctx.font='bold 17px Arial';
  wrapText(q.q,W/2,70,680,22,'center');

  // timer bar
  const barW=620,barX=(W-barW)/2,barY=130;
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(barX,barY,barW,8);
  const frac=Math.max(0,timeLeft/maxTime);
  ctx.fillStyle=frac>0.4?'#5ec8e0':'#ff6b6b';
  ctx.fillRect(barX,barY,barW*frac,8);

  const boxY=240,boxH=50,gap=12,boxW=620,boxX=(W-boxW)/2;
  q.choices.forEach((opt,i)=>{
    const y=boxY+i*(boxH+gap);
    let fill='rgba(255,255,255,0.1)';
    if(feedback){
      if(i===q.correct)fill='rgba(80,200,120,0.45)';
      else if(i===selected)fill='rgba(230,80,80,0.45)';
    } else if(i===sel)fill='rgba(94,200,224,0.25)';
    ctx.fillStyle=fill;
    ctx.fillRect(boxX,y,boxW,boxH);
    ctx.strokeStyle=(!feedback&&i===sel)?'#5ec8e0':'rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.strokeRect(boxX,y,boxW,boxH);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.textAlign='center';
    ctx.fillText((i+1)+'. '+opt,W/2,y+boxH/2+5);
  });

  if(feedback){
    ctx.fillStyle=feedback.ok?'#7ec850':'#ff8080';
    ctx.font='bold 20px Arial';
    ctx.fillText(feedback.msg,W/2,440);
  }

  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
