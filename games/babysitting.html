<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#stage{background:linear-gradient(135deg,#ffb6c1,#e91e63);border-radius:8px;display:block;margin:0 auto}
#score-display{color:#fff;font-size:1.15rem;font-weight:700;text-align:center;padding:10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#lives-display{color:#ffd54f;font-size:1rem;font-weight:700;text-align:center;padding:0 10px 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Babysitting</div>
  <div class="game-frame">
    <div id="score-display">Soothed: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the <b>crying baby</b> to soothe it before its distress meter fills up. More babies join over time — keep them all calm! <b>3 lives</b> per shift.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
let score=0,hi=parseInt(localStorage.getItem('babysitting_hi')||'0'),lives=3,gameOver=false,started=false,t=0,lastTime=null;
let babies=[],addTimer=0,nextAddAt=8;

const SPOTS=[
  {x:120,y:120},{x:320,y:100},{x:520,y:120},{x:700,y:150},
  {x:100,y:290},{x:300,y:300},{x:500,y:300},{x:690,y:310},
  {x:200,y:210},{x:600,y:210}
];

function reset(){
  score=0;lives=3;gameOver=false;started=false;t=0;addTimer=0;nextAddAt=8;lastTime=null;
  babies=[];
  addBaby();addBaby();
  render();
}

function addBaby(){
  if(babies.length>=SPOTS.length)return;
  const usedSpots=babies.map(b=>b.spot);
  let idx=0;
  for(let i=0;i<SPOTS.length;i++){if(!usedSpots.includes(i)){idx=i;break;}}
  babies.push({
    spot:idx,x:SPOTS[idx].x,y:SPOTS[idx].y,
    crying:false,distress:0,
    nextCryAt:3+Math.random()*5,
    calmTimer:0,
    wobble:Math.random()*10
  });
}

function startCry(b){
  b.crying=true;b.distress=0;
}

function soothe(b){
  b.crying=false;b.distress=0;
  b.nextCryAt=t+2+Math.random()*4/Math.max(0.5,1); // will be overwritten below
  b.nextCryAt=t+(2+Math.random()*4)/difficultyFactor();
}

function difficultyFactor(){
  return 1+Math.min(2.2,score*0.06);
}

function difficultySpeed(){
  return 1+Math.min(2.5,score*0.05);
}

function handleClick(mx,my){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  for(const b of babies){
    const dx=mx-b.x,dy=my-(b.y+10);
    if(dx*dx+dy*dy<45*45){
      if(b.crying){
        soothe(b);
        score++;
        if(score>hi){hi=score;localStorage.setItem('babysitting_hi',hi);}
        SFX.success();
      }else{
        SFX.click();
      }
      return;
    }
  }
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const sx=c.width/r.width, sy=c.height/r.height;
  let cx,cy;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}
c.addEventListener('click',e=>{const p=getPos(e);handleClick(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);handleClick(p.x,p.y);},{passive:false});

function drawBaby(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  const wob=b.crying?Math.sin(t*10+b.wobble)*3:0;
  ctx.translate(wob,0);
  // crib/mat
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();ctx.ellipse(0,55,60,16,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle='#fff8ec';
  ctx.beginPath();ctx.ellipse(0,30,32,26,0,0,Math.PI*2);ctx.fill();
  // head
  ctx.fillStyle='#ffe0bd';
  ctx.beginPath();ctx.arc(0,-10,26,0,Math.PI*2);ctx.fill();
  // hair tuft
  ctx.strokeStyle='#7a5230';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-34);ctx.quadraticCurveTo(4,-44,0,-46);ctx.stroke();
  // eyes
  if(b.crying){
    ctx.strokeStyle='#3a2a1a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-14,-12);ctx.lineTo(-6,-16);ctx.moveTo(-14,-16);ctx.lineTo(-6,-12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,-12);ctx.lineTo(14,-16);ctx.moveTo(6,-16);ctx.lineTo(14,-12);ctx.stroke();
    // mouth crying
    ctx.fillStyle='#a83a3a';
    ctx.beginPath();ctx.ellipse(0,2,9,11,0,0,Math.PI*2);ctx.fill();
    // tears
    ctx.fillStyle='#7ec8ff';
    const drip=(Math.sin(t*8+b.wobble)+1)/2*10;
    ctx.beginPath();ctx.ellipse(-12,-4+drip,3,6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(12,-4+drip,3,6,0,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#3a2a1a';
    ctx.beginPath();ctx.arc(-8,-12,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(8,-12,3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#a83a3a';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,7,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  }
  // cheeks
  ctx.fillStyle='rgba(255,120,120,.4)';
  ctx.beginPath();ctx.arc(-16,-2,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(16,-2,5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // distress meter
  if(b.crying){
    const bw=60,bh=8;
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.fillRect(b.x-bw/2,b.y-70,bw,bh);
    ctx.fillStyle=b.distress>0.7?'#ff3b3b':'#ffd54f';
    ctx.fillRect(b.x-bw/2,b.y-70,bw*b.distress,bh);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;
    ctx.strokeRect(b.x-bw/2,b.y-70,bw,bh);
  }
}

function livesStr(){
  let s='';
  for(let i=0;i<3;i++)s+= i<lives?'♥':'♡';
  return s;
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.1);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#ffb6c1');bg.addColorStop(1,'#e91e63');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  document.getElementById('score-display').textContent=I18N.t('babysit_score_label','Soothed: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',livesStr());

  if(!started){
    babies.forEach(drawBaby);
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_baby','Tap to start your shift'),W/2,60);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    babies.forEach(drawBaby);
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('shift_over_title','SHIFT OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('babysit_final_label','Babies soothed: {s}').replace('{s}',score),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    requestAnimationFrame(loop);return;
  }

  t+=dt;
  addTimer+=dt;
  if(addTimer>=nextAddAt&&babies.length<SPOTS.length){
    addTimer=0;nextAddAt=Math.max(5,10-score*0.15);
    addBaby();
    SFX.point();
  }

  babies.forEach(b=>{
    if(!b.crying){
      if(t>=b.nextCryAt)startCry(b);
    }else{
      b.distress+=dt*0.13*difficultySpeed();
      if(b.distress>=1){
        b.crying=false;b.distress=0;
        b.nextCryAt=t+(3+Math.random()*3)/difficultyFactor();
        lives--;
        SFX.hit();
        if(lives<=0){gameOver=true;SFX.lose();}
      }
    }
    drawBaby(b);
  });

  requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started)started=true;
    else if(gameOver)reset();
  }
});

reset();
requestAnimationFrame(loop);
</script></body></html>
