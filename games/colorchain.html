<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#16213e;border-radius:14px;padding:16px;text-align:center}
#status{color:#fff;font-size:1.1rem;font-weight:800;margin:4px 0 10px;min-height:1.6em}
#grid{display:inline-grid;grid-template-columns:repeat(8,42px);grid-template-rows:repeat(8,42px);gap:4px;background:#0b1030;padding:10px;border-radius:12px;margin:0 auto}
.orb{width:42px;height:42px;border-radius:50%;cursor:pointer;transition:transform .12s,opacity .18s;box-shadow:inset -4px -4px 8px rgba(0,0,0,.35),inset 3px 3px 6px rgba(255,255,255,.25);}
.orb.pop{transform:scale(0);opacity:0}
.orb.fall{animation:fall .18s ease-in}
@keyframes fall{from{transform:translateY(-46px)}to{transform:translateY(0)}}
.orb.dead{opacity:.35;cursor:default}
#controls{margin:12px 0}
#controls button{padding:9px 22px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin:0 5px}
@media(max-width:480px){
  #grid{grid-template-columns:repeat(8,34px);grid-template-rows:repeat(8,34px)}
  .orb{width:34px;height:34px}
}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Color Chain</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="status">Score: 0 | Best: 0</div>
      <div id="grid"></div>
      <div id="controls"><button id="newBtn" onclick="newGame()">New Game</button></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click a group of <b>2 or more</b> touching orbs of the same color to pop them — bigger chains score more points. Orbs above fall down to fill the gaps. The game ends when no matching pairs remain.</div>
</div>
<script>
const SIZE=8;
const COLORS=['#e94560','#ffd54f','#4caf50','#42a5f5','#ab47bc'];
let grid,score=0,hi=parseInt(localStorage.getItem('colorchain_hi')||'0',10),over=false;

function newGame(){
  grid=[];
  for(let r=0;r<SIZE;r++){
    const row=[];
    for(let c=0;c<SIZE;c++)row.push(Math.floor(Math.random()*COLORS.length));
    grid.push(row);
  }
  score=0;over=false;
  ensureSolvable();
  render();
  setStatus();
}

function ensureSolvable(){
  // keep re-rolling until at least one valid move exists
  let tries=0;
  while(!hasMove()&&tries<50){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)grid[r][c]=Math.floor(Math.random()*COLORS.length);
    tries++;
  }
}

function neighbors(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([nr,nc])=>nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE);
}

function hasMove(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(grid[r][c]==null)continue;
    for(const [nr,nc] of neighbors(r,c)){
      if(grid[nr][nc]===grid[r][c])return true;
    }
  }
  return false;
}

function floodFill(r,c){
  const color=grid[r][c];
  if(color==null)return [];
  const seen=new Set();
  const stack=[[r,c]];
  const group=[];
  while(stack.length){
    const [cr,cc]=stack.pop();
    const key=cr+','+cc;
    if(seen.has(key))continue;
    seen.add(key);
    if(grid[cr][cc]!==color)continue;
    group.push([cr,cc]);
    for(const [nr,nc] of neighbors(cr,cc)){
      if(!seen.has(nr+','+nc))stack.push([nr,nc]);
    }
  }
  return group;
}

function setStatus(msg){
  document.getElementById('status').textContent =
    (msg?msg+' ':'')+I18N.t('score_best_label','Score: {s} | Best: {b}').replace('{s}',score).replace('{b}',hi);
}

function popCell(r,c){
  if(over)return;
  const group=floodFill(r,c);
  if(group.length<2){SFX.error();return;}
  const gained=group.length*(group.length-1)*5;
  score+=gained;
  if(score>hi){hi=score;localStorage.setItem('colorchain_hi',hi);}
  group.forEach(([gr,gc])=>{grid[gr][gc]=null;});
  SFX.point();
  if(group.length>=6)SFX.success();
  applyGravity();
  render();
  setStatus(I18N.t('chain_popped_label','Popped {n}! +{g}').replace('{n}',group.length).replace('{g}',gained));
  setTimeout(()=>{
    if(!hasMove()){
      over=true;
      setStatus(I18N.t('game_over_label','Game Over —'));
      SFX.lose();
    }
  },50);
}

function applyGravity(){
  for(let c=0;c<SIZE;c++){
    const col=[];
    for(let r=SIZE-1;r>=0;r--){
      if(grid[r][c]!=null)col.push(grid[r][c]);
    }
    while(col.length<SIZE)col.push(Math.floor(Math.random()*COLORS.length));
    for(let r=SIZE-1;r>=0;r--){
      grid[r][c]=col[SIZE-1-r];
    }
  }
}

function render(){
  const gridEl=document.getElementById('grid');
  gridEl.innerHTML='';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell=document.createElement('div');
      cell.className='orb'+(over?' dead':'');
      const colorIdx=grid[r][c];
      cell.style.background=COLORS[colorIdx];
      cell.onclick=()=>popCell(r,c);
      gridEl.appendChild(cell);
    }
  }
}

newGame();
</script></body></html>
