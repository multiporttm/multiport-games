<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="manifest" href="../manifest.json">
<style>
body{background:#08080f}
#c{background:#2b1d14;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#hud{color:#d9b382;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Shoe Last Shaping</div>
  <div class="game-frame">
    <div id="hud">
      <span id="level-display">Last: 1 / 6</span>
      <span id="score-display">Score: 0 | Hi: 0</span>
      <span id="lives-display">Lives: 3</span>
    </div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag across the wooden last outline to <b>rasp/sand</b> it down toward the glowing <b>target silhouette</b>. Stay inside the target band at each checkpoint — shave too little or too much and you lose a life. Finish all checkpoints on 6 lasts to win!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display'),levelEl=document.getElementById('level-display'),livesEl=document.getElementById('lives-display');
const W=800,H=420;
let score=0,hi=parseInt(localStorage.getItem('hs_shoelastshaping')||'0',10),lives=3,level=1,maxLevel=6;
let gameOver=false,won=false,drawing=false;

// Checkpoints along the last's profile: x positions with a target thickness band.
const NUM_CP=7;
let checkpoints=[];
let current=0;
let baseThickness=[];
let targetThickness=[];
let shaved=[];

function rand(a,b){return a+Math.random()*(b-a);}

function setupLevel(){
  checkpoints=[];
  baseThickness=[];
  targetThickness=[];
  shaved=[];
  const margin=60;
  for(let i=0;i<NUM_CP;i++){
    const x=margin+(W-2*margin)*(i/(NUM_CP-1));
    const base=rand(70,110);
    const target=base-rand(15,32)-level*1.5;
    checkpoints.push(x);
    baseThickness.push(base);
    targetThickness.push(Math.max(20,target));
    shaved.push(0);
  }
  current=0;
  updateHud();
}

function updateHud(){
  levelEl.textContent=I18N.t('level_display','Last: {n} / {m}').replace('{n}',level).replace('{m}',maxLevel);
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  livesEl.textContent=I18N.t('lives_display','Lives: {l}').replace('{l}',lives);
}

function thicknessAt(x){
  // interpolate between checkpoints, applying shaved amount
  for(let i=0;i<checkpoints.length-1;i++){
    if(x>=checkpoints[i]&&x<=checkpoints[i+1]){
      const t=(x-checkpoints[i])/(checkpoints[i+1]-checkpoints[i]);
      const b=baseThickness[i]-shaved[i]+(baseThickness[i+1]-shaved[i+1]-(baseThickness[i]-shaved[i]))*t;
      return b;
    }
  }
  const idx=x<checkpoints[0]?0:checkpoints.length-1;
  return baseThickness[idx]-shaved[idx];
}

function drawLast(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1c130c');bg.addColorStop(1,'#2b1d14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  const midY=H/2;

  // target band (ghost silhouette)
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();
  for(let i=0;i<checkpoints.length;i++){
    const x=checkpoints[i],t=targetThickness[i]/2;
    if(i===0)ctx.moveTo(x,midY-t);else ctx.lineTo(x,midY-t);
  }
  for(let i=checkpoints.length-1;i>=0;i--){
    const x=checkpoints[i],t=targetThickness[i]/2;
    ctx.lineTo(x,midY+t);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();

  // current wood shape
  ctx.fillStyle='#c68642';
  ctx.beginPath();
  for(let i=0;i<checkpoints.length;i++){
    const x=checkpoints[i],t=(baseThickness[i]-shaved[i])/2;
    if(i===0)ctx.moveTo(x,midY-t);else ctx.lineTo(x,midY-t);
  }
  for(let i=checkpoints.length-1;i>=0;i--){
    const x=checkpoints[i],t=(baseThickness[i]-shaved[i])/2;
    ctx.lineTo(x,midY+t);
  }
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8a5a2e';ctx.lineWidth=2;ctx.stroke();

  // checkpoint markers
  for(let i=0;i<checkpoints.length;i++){
    const x=checkpoints[i];
    const inBand=Math.abs((baseThickness[i]-shaved[i])-targetThickness[i])<=6;
    ctx.beginPath();
    ctx.arc(x,midY,6,0,Math.PI*2);
    ctx.fillStyle = i<current?'#4caf50': i===current?(inBand?'#ffd54f':'#e94560'):'#555';
    ctx.fill();
  }

  if(!gameOver&&!won){
    ctx.fillStyle='#d9b382';ctx.font='bold 16px Arial';ctx.textAlign='center';
    const cpX=checkpoints[current];
    ctx.fillText(I18N.t('checkpoint_hint','Checkpoint {n}').replace('{n}',current+1),cpX,midY-100);
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+24);
  } else if(won){
    ctx.fillStyle='#4caf50';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('win_title','ALL LASTS SHAPED!'),W/2,H/2-10);
    ctx.font='18px Arial';ctx.fillStyle='#fff';
    ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+24);
  }
}

function shaveAt(mx){
  if(gameOver||won)return;
  const x=checkpoints[current];
  if(Math.abs(mx-x)>45)return;
  shaved[current]+=1.4;
  const diff=(baseThickness[current]-shaved[current])-targetThickness[current];
  if(diff<=6&&diff>=-6){
    // close enough already — allow fine tuning without penalty
  }
  if((baseThickness[current]-shaved[current])<targetThickness[current]-14){
    loseLife();
    return;
  }
  SFX.click();
  drawLast();
}

function confirmCheckpoint(){
  if(gameOver||won)return;
  const diff=Math.abs((baseThickness[current]-shaved[current])-targetThickness[current]);
  if(diff<=6){
    score+=20;
    SFX.point();
    current++;
    if(current>=checkpoints.length){
      levelComplete();
    }
  } else {
    loseLife();
  }
  updateHud();
  drawLast();
}

function loseLife(){
  lives--;
  SFX.error();
  updateHud();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;localStorage.setItem('hs_shoelastshaping',String(Math.floor(hi)));}
    updateHud();
  } else {
    // retry this checkpoint from scratch-ish
    shaved[current]=Math.max(0,shaved[current]-20);
  }
  drawLast();
}

function levelComplete(){
  score+=50;
  SFX.success();
  if(level>=maxLevel){
    won=true;
    if(score>hi){hi=score;localStorage.setItem('hs_shoelastshaping',String(Math.floor(hi)));}
  } else {
    level++;
    setupLevel();
  }
  updateHud();
}

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;won=false;
  setupLevel();
  drawLast();
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return cx*(W/r.width);
}

c.addEventListener('mousedown',e=>{
  if(gameOver||won){resetGame();return;}
  drawing=true;shaveAt(getPos(e));
});
c.addEventListener('mousemove',e=>{if(drawing)shaveAt(getPos(e));});
window.addEventListener('mouseup',()=>{if(drawing){drawing=false;confirmCheckpoint();}});

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver||won){resetGame();return;}
  drawing=true;shaveAt(getPos(e));
},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(drawing)shaveAt(getPos(e));},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();if(drawing){drawing=false;confirmCheckpoint();}},{passive:false});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(gameOver||won){resetGame();return;}
    shaveAt(checkpoints[current]);
  } else if(e.code==='Enter'){
    confirmCheckpoint();
  }
});

resetGame();
function loop(){ drawLast(); requestAnimationFrame(loop); }
loop();
</script></body></html>
