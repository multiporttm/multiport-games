<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Crop Dusting</title><meta name="description" content="Play Crop Dusting free online — Fly your crop-duster with Arrow Keys/WASD or drag, hold Space or tap to spray pesticide on infestations, and dodge silos, power lines, and birds."><link rel="canonical" href="https://games.multiportllc.com/games/cropdusting"><meta property="og:title" content="Crop Dusting - Multiport Games"><meta property="og:description" content="Play Crop Dusting free online — Fly your crop-duster with Arrow Keys/WASD or drag, hold Space or tap to spray pesticide on infestations, and dodge silos, power lines, and birds."><meta property="og:url" content="https://games.multiportllc.com/games/cropdusting"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Crop Dusting","description":"Play Crop Dusting free online instantly. Fly your crop-duster with Arrow Keys/WASD or drag, hold Space or tap to spray pesticide on spreading pest infestations, and dodge silos, power lines, and birds. Clear a field's infestations before they spread too far to score points and save lives. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/cropdusting","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#4a7c2e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#c8e6c9;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Crop Dusting</div>
  <div class="game-frame">
    <div id="score-display">Fields Saved: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys/WASD</b> or <b>touch-drag</b> to fly the plane. Hold <b>Space</b> or <b>tap and hold</b> to spray pesticide on the spreading red infestations before they take over the field. Dodge <b>silos</b>, <b>power lines</b>, and <b>birds</b> — colliding costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let plane,infestations,obstacles,score,hi,lives,fieldsSaved,gameOver,started,spraying,fieldTimer,fieldDuration,spawnTimer,frame;
let keys={};
let dragTarget=null;

function loadHi(){ hi=parseInt(localStorage.getItem('cropdust_hi')||'0'); fieldsSaved=parseInt(localStorage.getItem('cropdust_fields')||'0'); }
function saveHi(){ if(score>hi)hi=score; localStorage.setItem('cropdust_hi',Math.floor(hi)); localStorage.setItem('cropdust_fields',fieldsSaved); }

function newInfestation(){
  return {x:100+Math.random()*(W-200),y:100+Math.random()*(H-160),r:8+Math.random()*4,growRate:0.045+Math.random()*0.03};
}

function resetField(){
  infestations=[];
  for(let i=0;i<4;i++)infestations.push(newInfestation());
  fieldTimer=0;
  fieldDuration=2600;
  spawnTimer=0;
}

function reset(){
  plane={x:100,y:H/2,w:36,h:20};
  obstacles=[];
  score=0;
  lives=3;
  frame=0;
  gameOver=false;
  started=false;
  spraying=false;
  resetField();
}

function spawnObstacle(){
  const type=Math.random();
  if(type<0.4){
    obstacles.push({type:'silo',x:W+30,y:50+Math.random()*(H-160),w:30,h:70});
  } else if(type<0.7){
    const y=80+Math.random()*(H-200);
    obstacles.push({type:'wire',x:W+30,y,w:6,h:H-40});
  } else {
    obstacles.push({type:'bird',x:W+30,y:60+Math.random()*(H-140),w:28,h:16,vy:(Math.random()-0.5)*2});
  }
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'){ if(gameOver){reset();} spraying=true; }
  if(!started&&e.code!=='Space')started=true;
  if(!started)started=true;
});
document.addEventListener('keyup',e=>{keys[e.code]=false; if(e.code==='Space')spraying=false;});

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*(W/rect.width),y:(clientY-rect.top)*(H/rect.height)};
}
c.addEventListener('mousedown',e=>{ if(gameOver){reset();return;} started=true; spraying=true; dragTarget=pointerPos(e); });
c.addEventListener('mousemove',e=>{ if(dragTarget)dragTarget=pointerPos(e); });
window.addEventListener('mouseup',()=>{dragTarget=null;spraying=false;});
c.addEventListener('touchstart',e=>{ e.preventDefault(); if(gameOver){reset();return;} started=true; spraying=true; dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(dragTarget)dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragTarget=null;spraying=false;},{passive:false});

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawField(){
  ctx.fillStyle='#4a7c2e';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.12)';
  ctx.lineWidth=2;
  for(let y=20;y<H;y+=28){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawInfestations(){
  infestations.forEach(inf=>{
    ctx.fillStyle='rgba(198,40,40,0.85)';
    ctx.beginPath();ctx.arc(inf.x,inf.y,inf.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,82,82,0.5)';
    ctx.beginPath();ctx.arc(inf.x,inf.y,inf.r*0.6,0,7);ctx.fill();
  });
}

function drawPlane(){
  ctx.save();
  ctx.translate(plane.x,plane.y);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(-18,-6,36,12);
  ctx.fillStyle='#e53935';
  ctx.fillRect(-4,-16,8,10);
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(28,-4);ctx.lineTo(28,4);ctx.closePath();ctx.fill();
  ctx.restore();
  if(spraying){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(plane.x-6,plane.y+8);
    ctx.lineTo(plane.x-30,plane.y+34);
    ctx.lineTo(plane.x+18,plane.y+34);
    ctx.lineTo(plane.x+6,plane.y+8);
    ctx.closePath();ctx.fill();
  }
}

function drawObstacle(o){
  if(o.type==='silo'){
    ctx.fillStyle='#b0bec5';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#78909c';
    ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y,o.w/2,8,0,0,7);ctx.fill();
  } else if(o.type==='wire'){
    ctx.strokeStyle='#37474f';
    ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(o.x,20);ctx.lineTo(o.x,H-20);ctx.stroke();
    ctx.fillStyle='#263238';
    ctx.fillRect(o.x-8,10,16,10);
    ctx.fillRect(o.x-8,H-20,16,10);
  } else {
    ctx.fillStyle='#3e2723';
    ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/2,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(o.x-o.w/2,o.y);ctx.lineTo(o.x-o.w,o.y-6);ctx.lineTo(o.x-o.w/2,o.y+3);ctx.fill();
    ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y-6);ctx.lineTo(o.x+o.w/2,o.y+3);ctx.fill();
  }
}

function loseLife(){
  lives--;
  SFX.hit();
  if(lives<=0){
    gameOver=true;
    saveHi();
    SFX.lose();
  } else {
    plane.x=100;plane.y=H/2;
  }
}

function nextField(){
  fieldsSaved++;
  score+=200;
  SFX.levelup();
  saveHi();
  resetField();
}

function loop(){
  drawField();

  if(!started){
    drawInfestations();
    drawPlane();
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('crop_start_hint','Space or Tap to start, drag/arrows to fly'),W/2,50);
    document.getElementById('score-display').textContent=I18N.t('crop_score_label','Fields Saved: {f} | Lives: {l} | Hi: {h}').replace('{f}',fieldsSaved).replace('{l}',lives==null?3:lives).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawInfestations();
    obstacles.forEach(drawObstacle);
    drawPlane();
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('crop_game_over','GAME OVER'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('crop_restart_hint','Space or Tap to restart'),W/2,H/2+26);
    document.getElementById('score-display').textContent=I18N.t('crop_score_label','Fields Saved: {f} | Lives: {l} | Hi: {h}').replace('{f}',fieldsSaved).replace('{l}',lives).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);
    return;
  }

  frame++;

  // movement
  let vx=0,vy=0;
  if(keys['ArrowUp']||keys['KeyW'])vy-=1;
  if(keys['ArrowDown']||keys['KeyS'])vy+=1;
  if(keys['ArrowLeft']||keys['KeyA'])vx-=1;
  if(keys['ArrowRight']||keys['KeyD'])vx+=1;
  if(dragTarget){
    const dx=dragTarget.x-plane.x,dy=dragTarget.y-plane.y;
    const dist=Math.hypot(dx,dy);
    if(dist>4){vx=dx/dist;vy=dy/dist;}
  }
  const mag=Math.hypot(vx,vy);
  if(mag>0.01){
    vx/=mag;vy/=mag;
    plane.x+=vx*4;
    plane.y+=vy*4;
  }
  plane.x=Math.max(20,Math.min(W-20,plane.x));
  plane.y=Math.max(20,Math.min(H-20,plane.y));

  // spraying
  if(spraying){
    const sprayBox={x:plane.x-30,y:plane.y+4,w:48,h:32};
    infestations.forEach(inf=>{
      const d=Math.hypot(inf.x-plane.x,inf.y-(plane.y+18));
      if(d<40){
        inf.r-=0.5;
        if(frame%6===0)SFX.point();
      }
    });
    infestations=infestations.filter(inf=>{
      if(inf.r<=2){score+=25;return false;}
      return true;
    });
  }

  // grow infestations
  infestations.forEach(inf=>{ inf.r+=inf.growRate; });
  const spread=infestations.some(inf=>inf.r>60);
  fieldTimer++;

  if(infestations.length===0){
    nextField();
  } else if(spread||fieldTimer>fieldDuration){
    gameOver=false;
    loseLife();
    if(!gameOver)resetField();
  }

  // spawn obstacles
  spawnTimer++;
  const interval=Math.max(70,140-fieldsSaved*5);
  if(spawnTimer>interval){
    spawnTimer=0;
    spawnObstacle();
  }
  obstacles=obstacles.filter(o=>o.x>-60);
  obstacles.forEach(o=>{
    o.x-=3.5;
    if(o.type==='bird'){o.y+=o.vy;if(o.y<40||o.y>H-40)o.vy*=-1;}
    const box={x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h};
    const box2=o.type==='silo'?{x:o.x,y:o.y,w:o.w,h:o.h}:box;
    const planeBox={x:plane.x-16,y:plane.y-9,w:32,h:18};
    if(rectsOverlap(planeBox,box2)&&!gameOver){
      loseLife();
      o.x=-999;
    }
  });

  drawInfestations();
  obstacles.forEach(drawObstacle);
  drawPlane();

  score+=0.05;
  if(score>hi)hi=score;

  document.getElementById('score-display').textContent=I18N.t('crop_score_label','Fields Saved: {f} | Lives: {l} | Hi: {h}').replace('{f}',fieldsSaved).replace('{l}',lives).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}

loadHi();
reset();
loop();
</script></body></html>
