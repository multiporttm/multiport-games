<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a0533,#3a1466);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ce93d8;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wizard Spellcast</div>
  <div class="game-frame">
    <div id="score-display">Spells: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="480" height="520"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag with your <b>Mouse</b> or <b>Finger</b> across the lower panel to trace the glowing rune pattern shown above, matching each arrow in order before time runs out. Wrong gestures or timeouts cost a life.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=520;
const PATTERN_TOP=10,PATTERN_H=110;
const DRAW_TOP=140,DRAW_H=360;

let lives=3,spells=0,hi=0,gameOver=false,started=false;
let pattern=[],drawn=[];
let drawing=false,pts=[];
let timeLeft=0,timeMax=0;
let flashMsg='',flashUntil=0,flashColor='#fff';
let lastTime=null;

hi=parseInt(localStorage.getItem('wizardspellcast_hi')||'0',10);

const DIRS={U:{dx:0,dy:-1,arrow:'↑'},D:{dx:0,dy:1,arrow:'↓'},L:{dx:-1,dy:0,arrow:'←'},R:{dx:1,dy:0,arrow:'→'}};
const DIRKEYS=Object.keys(DIRS);

function newPattern(){
  const len=Math.min(3+Math.floor(spells/2),8);
  const seq=[];
  let last=null;
  for(let i=0;i<len;i++){
    let d;
    do{d=DIRKEYS[Math.floor(Math.random()*4)];}while(d===last);
    seq.push(d);
    last=d;
  }
  pattern=seq;
  drawn=[];
  timeMax=4+len*1.6;
  timeLeft=timeMax;
}

function reset(){
  lives=3;spells=0;gameOver=false;started=false;
  newPattern();
}
reset();

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

function startDraw(e){
  if(gameOver){reset();return;}
  if(!started){started=true;}
  const p=pointerPos(e);
  if(p.y<DRAW_TOP)return;
  drawing=true;pts=[p];
  e.preventDefault&&e.preventDefault();
}
function moveDraw(e){
  if(!drawing)return;
  const p=pointerPos(e);
  p.y=Math.max(DRAW_TOP+2,Math.min(H-2,p.y));
  p.x=Math.max(2,Math.min(W-2,p.x));
  pts.push(p);
  e.preventDefault&&e.preventDefault();
}
function endDraw(e){
  if(!drawing)return;
  drawing=false;
  evaluateGesture();
}

c.addEventListener('mousedown',startDraw);
c.addEventListener('mousemove',moveDraw);
window.addEventListener('mouseup',endDraw);
c.addEventListener('touchstart',startDraw,{passive:false});
c.addEventListener('touchmove',moveDraw,{passive:false});
c.addEventListener('touchend',endDraw,{passive:false});

function segmentToDirs(points){
  const MIN_SEG=22;
  const dirs=[];
  let anchor=points[0];
  for(let i=1;i<points.length;i++){
    const p=points[i];
    const dx=p.x-anchor.x,dy=p.y-anchor.y;
    const dist=Math.hypot(dx,dy);
    if(dist<MIN_SEG)continue;
    let d;
    if(Math.abs(dx)>Math.abs(dy)) d=dx>0?'R':'L';
    else d=dy>0?'D':'U';
    if(dirs.length===0||dirs[dirs.length-1]!==d)dirs.push(d);
    anchor=p;
  }
  return dirs;
}

function evaluateGesture(){
  if(gameOver)return;
  const dirs=segmentToDirs(pts);
  const match=dirs.length===pattern.length&&dirs.every((d,i)=>d===pattern[i]);
  if(match){
    spells++;
    if(spells>hi){hi=spells;localStorage.setItem('wizardspellcast_hi',String(hi));}
    SFX.success();
    flashMsg=I18N.t('spell_cast','Spell Cast!');flashColor='#7ee787';flashUntil=performance.now()+700;
    newPattern();
  }else{
    lives--;
    SFX.fail();
    flashMsg=I18N.t('miscast','Miscast!');flashColor='#ff6b6b';flashUntil=performance.now()+700;
    if(lives<=0){
      gameOver=true;
      SFX.lose();
    }else{
      newPattern();
    }
  }
  pts=[];
}

function drawArrow(x,y,size,dirKey,color){
  ctx.save();
  ctx.translate(x,y);
  const rot={U:-Math.PI/2,D:Math.PI/2,L:Math.PI,R:0}[dirKey];
  ctx.rotate(rot);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(size,0);
  ctx.lineTo(-size*0.5,-size*0.6);
  ctx.lineTo(-size*0.5,size*0.6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPatternRow(){
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.fillRect(0,PATTERN_TOP,W,PATTERN_H);
  const n=pattern.length;
  const gap=Math.min(56,(W-40)/n);
  const startX=W/2-((n-1)*gap)/2;
  const y=PATTERN_TOP+PATTERN_H/2;
  for(let i=0;i<n;i++){
    const done=i<drawn.length;
    const color=done?'#ffd54f':'#ce93d8';
    drawArrow(startX+i*gap,y,16,pattern[i],color);
    if(i<n-1){
      ctx.strokeStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.moveTo(startX+i*gap+20,y);ctx.lineTo(startX+(i+1)*gap-20,y);ctx.stroke();
    }
  }
}

function drawDrawArea(){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(0,DRAW_TOP,W,DRAW_H);
  ctx.strokeStyle='rgba(206,147,216,0.4)';
  ctx.strokeRect(4,DRAW_TOP+4,W-8,DRAW_H-8);
  if(pts.length>1){
    ctx.strokeStyle='#ffd54f';
    ctx.lineWidth=4;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
    ctx.lineWidth=1;
  }
  if(!drawing&&pts.length===0&&!gameOver&&started){
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('draw_hint','Draw the pattern here'),W/2,DRAW_TOP+DRAW_H/2);
  }
}

function drawTimerBar(){
  const pct=Math.max(0,timeLeft/timeMax);
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.fillRect(20,DRAW_TOP+DRAW_H+8,W-40,10);
  ctx.fillStyle=pct>0.3?'#7ee787':'#ff6b6b';
  ctx.fillRect(20,DRAW_TOP+DRAW_H+8,(W-40)*pct,10);
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('spells_lives_hi','Spells: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',spells).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1a0533');bg.addColorStop(1,'#3a1466');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawPatternRow();
  drawDrawArea();

  if(!gameOver)drawTimerBar();

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint2','Drag below to start'),W/2,DRAW_TOP+DRAW_H/2+40);
  }

  if(started&&!gameOver){
    const now=performance.now();
    const dt=lastTime===null?0:(now-lastTime)/1000;
    lastTime=now;
    if(!drawing){
      timeLeft-=dt;
      if(timeLeft<=0){
        lives--;
        SFX.fail();
        flashMsg=I18N.t('too_slow','Too Slow!');flashColor='#ff6b6b';flashUntil=performance.now()+700;
        if(lives<=0){gameOver=true;SFX.lose();}
        else newPattern();
      }
    }
  }else{
    lastTime=performance.now();
  }

  if(performance.now()<flashUntil){
    ctx.fillStyle=flashColor;ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,DRAW_TOP-14>30?DRAW_TOP-14:30);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('spells_cast_final','Spells cast: {s}').replace('{s}',spells),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint2','Tap to try again'),W/2,H/2+44);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
