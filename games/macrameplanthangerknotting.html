<style>
body{background:#08080f}
#c{background:#2b1d14;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8c07d;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff8a8a;text-align:center;font-size:1rem;margin-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Macrame Plant Hanger Knotting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the strands light up in sequence, then repeat the pattern by clicking the strands (or pressing their number keys) in the same order to tie each knot. Keep the hanger balanced across trickier multi-tier designs.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display'),livesEl=document.getElementById('lives-display');
const W=800,H=420,barY=40,potBaseY=360;

let state='start'; // start, show, input, tierclear, gameover, win
let score=0,hi=parseInt(localStorage.getItem('macrameplanthangerknotting_hi')||'0',10);
let lives=3,tier=1,level=1;
const WIN_TIER=7;

let numStrands=4,seqLen=3;
let sequence=[],inputIdx=0,showIdx=0,showTimer=0;
let tilt=0,targetTilt=0;
let knots=[]; // {strand, y} tied knots this tier
let timeLimit=0,timeLeft=0;
let flashStrand=-1,flashTimer=0;
let msg='',msgTimer=0;
let shakeT=0;

function strandX(i){
  const margin=120;
  if(numStrands===1)return W/2;
  return margin+i*((W-2*margin)/(numStrands-1));
}

function setupTier(){
  numStrands=Math.min(8,3+Math.floor((tier-1)/1)+1);
  seqLen=Math.min(9,3+Math.floor((tier-1)*0.8));
  sequence=[];
  for(let i=0;i<seqLen;i++)sequence.push(Math.floor(Math.random()*numStrands));
  inputIdx=0;
  knots=[];
  tilt=0;targetTilt=0;
  timeLimit=Math.max(55,110-tier*6);
  showIdx=0;showTimer=0;
  state='show';
}

function startGame(){
  score=0;lives=3;tier=1;level=1;
  setupTier();
  state='show';
}

function flash(i){flashStrand=i;flashTimer=22;}

function knotY(countForStrand){ return 90+countForStrand*34; }

function countOnStrand(s){ return knots.filter(k=>k.strand===s).length; }

function tieKnot(s){
  const correct=sequence[inputIdx]===s;
  if(correct){
    knots.push({strand:s,y:knotY(countOnStrand(s))});
    inputIdx++;
    score+=10+tier*2;
    if(score>hi){hi=score;localStorage.setItem('macrameplanthangerknotting_hi',String(hi));}
    SFX.point();
    flash(s);
    // balance nudges toward center as symmetric strands get knots
    const leftCount=knots.filter(k=>strandX(k.strand)<W/2).length;
    const rightCount=knots.filter(k=>strandX(k.strand)>W/2).length;
    targetTilt=(leftCount-rightCount)*2.2;
    if(inputIdx>=sequence.length){
      // tier cleared
      SFX.levelup();
      msg=I18N.t('tier_clear','Tier {t} tied! Hanger balanced.').replace('{t}',tier);
      msgTimer=90;
      state='tierclear';
      if(tier>=WIN_TIER){
        setTimeout(()=>{ state='win'; SFX.win(); },900);
      } else {
        setTimeout(()=>{ tier++; level=tier; setupTier(); },1100);
      }
    } else {
      timeLeft=timeLimit;
    }
  } else {
    mistake();
  }
}

function mistake(){
  lives--;
  SFX.hurt();
  shakeT=14;
  targetTilt=(Math.random()<0.5?1:-1)*(14+tier);
  if(lives<=0){
    state='gameover';
    SFX.lose();
  } else {
    // retry same knot, reset timer, small penalty
    timeLeft=timeLimit;
  }
}

function strandAtX(x){
  let best=-1,bd=1e9;
  for(let i=0;i<numStrands;i++){
    const d=Math.abs(strandX(i)-x);
    if(d<bd){bd=d;best=i;}
  }
  return bd<45?best:-1;
}

function handlePick(s){
  if(s<0)return;
  if(state==='show'){ return; }
  if(state!=='input')return;
  tieKnot(s);
}

c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  if(state==='start'){startGame();return;}
  if(state==='gameover'||state==='win'){startGame();return;}
  handlePick(strandAtX(x));
});

document.addEventListener('keydown',e=>{
  if(state==='start'||state==='gameover'||state==='win'){
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();}
    return;
  }
  const n=parseInt(e.key,10);
  if(!isNaN(n)&&n>=1&&n<=numStrands){
    e.preventDefault();
    handlePick(n-1);
  }
});

function drawBar(){
  ctx.fillStyle='#4a2f1d';
  ctx.fillRect(60,barY-8,W-120,16);
  ctx.fillStyle='#6b4226';
  ctx.fillRect(60,barY-8,W-120,4);
}

function drawPot(){
  const cx=W/2+tilt*2.2,cy=potBaseY+Math.abs(tilt)*0.6;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(tilt*Math.PI/180*0.12);
  ctx.fillStyle='#b5651d';
  ctx.beginPath();
  ctx.moveTo(-55,0);ctx.lineTo(55,0);ctx.lineTo(42,55);ctx.lineTo(-42,55);ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#2d5a27';
  ctx.beginPath();ctx.ellipse(0,-8,46,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4f8f3f';
  for(let i=-2;i<=2;i++){
    ctx.beginPath();ctx.ellipse(i*14,-22,10,16,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawStrands(){
  for(let i=0;i<numStrands;i++){
    const x=strandX(i);
    const isNext=state==='input'&&sequence[inputIdx]===i;
    const isShowing=state==='show'&&showIdx===i;
    ctx.strokeStyle=(flashStrand===i&&flashTimer>0)?'#ffe08a':(isNext?'#ffd54f':'#c9a876');
    ctx.lineWidth=(isShowing||flashStrand===i&&flashTimer>0)?6:3;
    ctx.beginPath();
    ctx.moveTo(x,barY);
    ctx.lineTo(x,potBaseY-20+Math.sin((Date.now()/400)+i)*2);
    ctx.stroke();
    // knots
    const myKnots=knots.filter(k=>k.strand===i);
    myKnots.forEach(k=>{
      ctx.fillStyle='#8a5a2b';
      ctx.beginPath();ctx.arc(x,k.y,9,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#5a3a18';ctx.lineWidth=2;ctx.stroke();
    });
    // number label
    ctx.fillStyle=isShowing?'#ffe08a':'#e8c07d';
    ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(String(i+1),x,barY-16);
  }
}

function update(dt){
  tilt+=(targetTilt-tilt)*0.08*dt;
  if(flashTimer>0)flashTimer-=dt;
  if(shakeT>0)shakeT-=dt;
  if(msgTimer>0)msgTimer-=dt;

  if(state==='show'){
    showTimer+=dt;
    if(showTimer>=18){
      showTimer=0;
      if(showIdx<sequence.length){
        flash(sequence[showIdx]);
        showIdx++;
      } else {
        state='input';
        inputIdx=0;
        timeLeft=timeLimit;
      }
    }
  } else if(state==='input'){
    timeLeft-=dt;
    if(timeLeft<=0){
      mistake();
    }
  }
}

function draw(){
  ctx.save();
  const sx=shakeT>0?(Math.random()-0.5)*shakeT*0.6:0;
  ctx.translate(sx,0);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1022');sky.addColorStop(1,'#2b1d14');
  ctx.fillStyle=sky;ctx.fillRect(-20,0,W+40,H);

  drawBar();
  drawStrands();
  drawPot();

  ctx.textAlign='center';
  if(state==='start'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('ph_start_title','Macrame Plant Hanger'),W/2,160);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or press Space to start'),W/2,200);
  } else if(state==='show'){
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('ph_watch','Watch the knot sequence...'),W/2,280);
  } else if(state==='input'){
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('ph_repeat','Repeat it! Tie knot {n} of {total}').replace('{n}',inputIdx+1).replace('{total}',sequence.length),W/2,280);
    // time bar
    const pct=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle='#3a2a1a';ctx.fillRect(W/2-120,300,240,10);
    ctx.fillStyle=pct<0.3?'#e94560':'#7ec850';ctx.fillRect(W/2-120,300,240*pct,10);
  } else if(state==='tierclear'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';
    ctx.fillText(msg,W/2,280);
  } else if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,214);
  } else if(state==='win'){
    ctx.fillStyle='#7ec850';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('ph_win','Masterpiece hanger complete!'),W/2,180);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,214);
  }
  ctx.restore();
}

let last=null;
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/16.6667,3);
  last=ts;
  if(state!=='start')update(dt);
  draw();
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
  requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);
</script></body></html>
