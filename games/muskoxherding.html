<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#dce9f0;display:block;border-radius:8px;touch-action:none}
#score-display{color:#2d6ca0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Muskox Herding</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Penned: 0/0 | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b>, or <b>drag/tap</b> on the snow, to drive the snowmobile. Nudge straying muskoxen (don't crash straight into them — approach gently) toward the <b>pen</b> on the right. Get them all in before you run out of fuel!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
const HI_KEY='mp_hi_muskoxherding';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

const pen={x:660,y:170,w:120,h:160};
let snow={x:120,y:250,vx:0,vy:0,ang:0};
let oxen=[];
let round=1,penned=0,total=0,fuel=100,gameOver=false,won=false,started=false;
let keys={};
let pointer=null; // {x,y} target when dragging/tapping

function spawnOxen(n){
  oxen=[];
  for(let i=0;i<n;i++){
    let x,y;
    do{
      x=60+Math.random()*420;
      y=40+Math.random()*420;
    }while(Math.hypot(x-snow.x,y-snow.y)<100);
    oxen.push({x,y,vx:0,vy:0,spooked:0,penned:false,wob:Math.random()*Math.PI*2});
  }
  total=n;penned=0;
}

function reset(full){
  if(full){round=1;fuel=100;}
  snow.x=120;snow.y=250;snow.vx=0;snow.vy=0;
  spawnOxen(4+round);
  gameOver=false;won=false;
}

function startGame(){
  started=true;
  reset(true);
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(!started){startGame();return;}
  if((gameOver||won)&&(e.key===' '||e.key==='Enter')){
    if(won){round++;reset(false);}else{reset(true);}
  }
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function toCanvasCoords(clientX,clientY){
  const r=c.getBoundingClientRect();
  return {x:(clientX-r.left)*(W/r.width), y:(clientY-r.top)*(H/r.height)};
}
function handlePointerDown(x,y){
  if(!started){startGame();return;}
  if(gameOver||won){
    if(won){round++;reset(false);}else{reset(true);}
    return;
  }
  pointer={x,y};
}
c.addEventListener('mousedown',e=>{const p=toCanvasCoords(e.clientX,e.clientY);handlePointerDown(p.x,p.y);});
c.addEventListener('mousemove',e=>{if(pointer){const p=toCanvasCoords(e.clientX,e.clientY);pointer={x:p.x,y:p.y};}});
window.addEventListener('mouseup',()=>{pointer=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const p=toCanvasCoords(t.clientX,t.clientY);handlePointerDown(p.x,p.y);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(pointer){const t=e.touches[0];const p=toCanvasCoords(t.clientX,t.clientY);pointer={x:p.x,y:p.y};}},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();pointer=null;},{passive:false});

function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#eef6fb');sky.addColorStop(1,'#cfe3ee');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // snow texture dots
  ctx.fillStyle='#ffffff';
  for(let i=0;i<40;i++){
    ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.arc((i*193+((performance.now()/40)|0))%W,(i*97)%H,2,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // pen
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=6;
  ctx.strokeRect(pen.x,pen.y,pen.w,pen.h);
  ctx.fillStyle='rgba(138,90,43,0.12)';
  ctx.fillRect(pen.x,pen.y,pen.w,pen.h);
  ctx.fillStyle='#8a5a2b';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('pen_label','PEN'),pen.x+pen.w/2,pen.y-8);

  if(!started){
    ctx.fillStyle='#2d6ca0';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press any key / Tap to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  document.getElementById('score-display').textContent=
    I18N.t('hud_label','Round: {r} | Penned: {p}/{t} | Fuel: {f}% | Hi: {h}')
      .replace('{r}',round).replace('{p}',penned).replace('{t}',total)
      .replace('{f}',Math.max(0,Math.round(fuel))).replace('{h}',hi);

  if(gameOver){
    ctx.fillStyle='#b23a3a';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('out_of_fuel','OUT OF FUEL'),W/2,H/2-10);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or press Space to restart'),W/2,H/2+24);
    requestAnimationFrame(loop);return;
  }
  if(won){
    ctx.fillStyle='#2e7d32';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('round_clear','HERD PENNED!'),W/2,H/2-10);
    ctx.font='18px Arial';ctx.fillText(I18N.t('next_round_hint','Tap or press Space for next round'),W/2,H/2+24);
    requestAnimationFrame(loop);return;
  }

  // snowmobile control
  let ax=0,ay=0;
  if(keys['arrowup']||keys['w'])ay-=1;
  if(keys['arrowdown']||keys['s'])ay+=1;
  if(keys['arrowleft']||keys['a'])ax-=1;
  if(keys['arrowright']||keys['d'])ax+=1;
  if(pointer){
    const dx=pointer.x-snow.x,dy=pointer.y-snow.y;
    const d=Math.hypot(dx,dy);
    if(d>8){ax+=dx/d;ay+=dy/d;}
  }
  const moving=(ax!==0||ay!==0);
  if(moving){
    const len=Math.hypot(ax,ay)||1;
    snow.vx+=(ax/len)*0.9*dt;
    snow.vy+=(ay/len)*0.9*dt;
    fuel-=0.045*dt;
    snow.ang=Math.atan2(ay,ax);
  }
  snow.vx*=0.9;snow.vy*=0.9;
  snow.x=clamp(snow.x+snow.vx*dt,20,W-20);
  snow.y=clamp(snow.y+snow.vy*dt,20,H-20);
  const snowSpeed=Math.hypot(snow.vx,snow.vy);

  if(fuel<=0){gameOver=true;SFX.fail();}

  // oxen behavior
  oxen.forEach(ox=>{
    if(ox.penned)return;
    const dx=ox.x-snow.x,dy=ox.y-snow.y;
    const dist=Math.hypot(dx,dy)||1;
    // flee from snowmobile if close, strength depends on speed (gentle nudging vs spooking)
    if(dist<90){
      const spookStrength=snowSpeed>3?1.0:0.35;
      const f=(90-dist)/90*0.55*spookStrength;
      ox.vx+=(dx/dist)*f;
      ox.vy+=(dy/dist)*f;
      if(snowSpeed>3)ox.spooked=30;
    }
    // mild herd cohesion toward other oxen (flocking) and gentle drift toward pen once nudged
    let cx=0,cy=0,cnt=0;
    oxen.forEach(o2=>{ if(o2!==ox&&!o2.penned){cx+=o2.x;cy+=o2.y;cnt++;} });
    if(cnt>0){
      cx/=cnt;cy/=cnt;
      ox.vx+=(cx-ox.x)*0.0006;
      ox.vy+=(cy-ox.y)*0.0006;
    }
    ox.wob+=0.05*dt;
    ox.vx+=Math.sin(ox.wob)*0.01;
    ox.vy*=1; // no extra
    ox.vx*=0.9;ox.vy*=0.9;
    ox.x=clamp(ox.x+ox.vx*dt,20,W-20);
    ox.y=clamp(ox.y+ox.vy*dt,20,H-20);
    if(ox.spooked>0)ox.spooked-=dt;

    if(ox.x>pen.x+10&&ox.x<pen.x+pen.w-10&&ox.y>pen.y+10&&ox.y<pen.y+pen.h-10){
      ox.penned=true;penned++;SFX.point();
      if(penned>=total){
        won=true;SFX.win();
        if(round>hi){hi=round;localStorage.setItem(HI_KEY,String(hi));}
      }
    }
  });

  // draw oxen
  oxen.forEach(ox=>{
    ctx.save();
    ctx.translate(ox.x,ox.y);
    ctx.fillStyle=ox.penned?'#6d4c2b':(ox.spooked>0?'#8b3a3a':'#5a4631');
    ctx.beginPath();ctx.ellipse(0,0,16,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3b2d1f';
    ctx.beginPath();ctx.ellipse(-12,-4,7,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d8c39a';
    ctx.beginPath();ctx.moveTo(-16,-7);ctx.lineTo(-22,-13);ctx.lineTo(-14,-9);ctx.fill();
    ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-16,-15);ctx.lineTo(-8,-10);ctx.fill();
    ctx.restore();
  });

  // draw snowmobile
  ctx.save();
  ctx.translate(snow.x,snow.y);
  ctx.rotate(snow.ang+Math.PI/2);
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(10,14);ctx.lineTo(-10,14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#222';
  ctx.fillRect(-9,10,18,8);
  ctx.restore();

  if(fuel<25){
    ctx.fillStyle='#b23a3a';ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('low_fuel','LOW FUEL!'),W/2,26);
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
