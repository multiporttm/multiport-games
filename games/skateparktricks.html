<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Skate Park Tricks</title><meta name="description" content="Play Skate Park Tricks free online — Time your button taps to land tricks off each ramp before you hit the ground. Chain combos for bigger scores."><link rel="canonical" href="https://games.multiportllc.com/games/skateparktricks"><meta property="og:title" content="Skate Park Tricks - Multiport Games"><meta property="og:description" content="Play Skate Park Tricks free online — Time your button taps to land tricks off each ramp before you hit the ground. Chain combos for bigger scores."><meta property="og:url" content="https://games.multiportllc.com/games/skateparktricks"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Skate Park Tricks","description":"Play Skate Park Tricks free online instantly. Time your button taps to land tricks off each ramp before you hit the ground. Chain combos for bigger scores. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/skateparktricks","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#37474f;cursor:pointer}
#ui{color:#ffca28;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Skate Park Tricks</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Combo: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap to launch off the ramp, then tap again while airborne to land a trick — the greener the "sweet spot" zone glows, the bigger the score. Botch the landing and your combo resets.</div>
</div>
<script>
const W=360,H=360,GROUND=H-40;
let phase,airT,sweetStart,sweetLen,score,combo,best,rampX,state;

function loadBest(){return +(localStorage.getItem('skateparktricks_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('skateparktricks_best',v);}

function init(){
  score=0;combo=0;best=loadBest();state='play';
  phase='ground';rampX=60;
}

function newAir(){
  phase='air';airT=0;
  sweetLen=Math.max(10,26-combo);
  sweetStart=20+Math.random()*40;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state!=='play')return;
  if(phase==='ground'){
    newAir();
    SFX.jump();
  }else if(phase==='air'){
    if(airT>=sweetStart&&airT<=sweetStart+sweetLen){
      score+=10+combo*2;combo++;
      SFX.success();
      saveBest(score);best=loadBest();
    }else{
      combo=0;
      SFX.fail();
    }
    phase='ground';
    updateUI();
  }
});

function update(){
  if(state!=='play')return;
  if(phase==='air'){
    airT++;
    if(airT>70){phase='ground';combo=0;SFX.fail();updateUI();}
  }
}

function draw(){
  ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#455a64';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#607d8b';
  ctx.beginPath();ctx.moveTo(rampX-30,GROUND);ctx.lineTo(rampX+30,GROUND);ctx.lineTo(rampX,GROUND-40);ctx.fill();

  if(phase==='air'){
    const barW=W-60;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(30,60,barW,20);
    ctx.fillStyle='#66bb6a';ctx.fillRect(30+sweetStart,60,sweetLen,20);
    const pos=Math.min(barW,airT);
    ctx.fillStyle='#fff';ctx.fillRect(30+pos-2,55,4,30);
    ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🛹',W/2,150);
  }else{
    ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🛹',rampX,GROUND-14);
  }

  ctx.fillStyle='#ffca28';ctx.font='14px Arial';
  ctx.fillText(phase==='ground'?I18N.t('tap_launch_hint','Tap to launch'):I18N.t('tap_green_zone_hint','Tap in the green zone!'),W/2,220);

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('score_label','Score: {n}').replace('{n}',score)+' | '+I18N.t('combo_label','Combo: {n}').replace('{n}',combo)+' | '+I18N.t('best_label2','Best: {n}').replace('{n}',best);
}

init();draw();
</script></body></html>
