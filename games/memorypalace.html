<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Memory Palace</title><meta name="description" content="Play Memory Palace free online — Watch objects appear one by one in rooms, then click them back in a grid in the same order to test your memory."><link rel="canonical" href="https://games.multiportllc.com/games/memorypalace"><meta property="og:title" content="Memory Palace - Multiport Games"><meta property="og:description" content="Play Memory Palace free online — Watch objects appear one by one in rooms, then click them back in a grid in the same order to test your memory."><meta property="og:url" content="https://games.multiportllc.com/games/memorypalace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Memory Palace","description":"Play Memory Palace free online instantly. Watch a sequence of rooms appear one at a time, each holding a distinct object, then click the objects in a grid in the same order they appeared to test your memory. Each round the sequence grows by one room. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/memorypalace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#4a148c,#ce93d8);border-radius:14px;padding:20px;text-align:center}
#status{color:#fff;font-size:1.15rem;font-weight:800;margin:4px 0 10px;min-height:1.6em;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#room{width:260px;height:180px;margin:0 auto 16px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:inset 0 0 30px rgba(0,0,0,.3)}
#grid{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center;margin:0 auto 12px}
.obj{width:72px;height:72px;background:rgba(255,255,255,.9);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;transition:transform .1s,background .15s;user-select:none}
.obj:active{transform:scale(.9)}
.obj.picked{background:#4caf50;color:#fff;opacity:.55;cursor:default}
.obj.wrong{background:#e94560}
#stats{color:#fff;font-weight:700;font-size:1rem;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#lives{font-size:1.3rem;letter-spacing:3px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Memory Palace</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="status">Watch the rooms...</div>
      <div id="room">🏛️</div>
      <div id="grid"></div>
      <div id="stats">Level: 1 &nbsp;|&nbsp; <span id="lives">❤️❤️❤️</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the sequence of objects appear one by one in the room, then click the objects in the <b>grid below</b> in the same order they appeared. Each round the sequence gets one room longer!</div>
</div>
<script>
const ALL_OBJS=['🕯️','🗿','🏺','🪞','🖼️','📜','🔑','🕰️','💎','🪔','🗝️','🏆','🎭','⚱️','🪟','🛡️'];
let sequence=[],playerIdx=0,level=1,lives=3,best=0,showing=false,gridObjs=[];
const statusEl=document.getElementById('status'),roomEl=document.getElementById('room'),gridEl=document.getElementById('grid'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),tableEl=document.getElementById('table');

best=parseInt(localStorage.getItem('memorypalace_best')||'0',10);
bestEl.textContent=best;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function setStatus(t){statusEl.textContent=t;}

function updateLives(){livesEl.textContent='❤️'.repeat(Math.max(0,lives));}
function updateStats(){document.getElementById('stats').innerHTML=I18N.t('level_lives_best','Level: {l} &nbsp;|&nbsp; ').replace('{l}',level)+'<span id="lives">'+'❤️'.repeat(Math.max(0,lives))+'</span> &nbsp;|&nbsp; '+I18N.t('best_label','Best: ')+'<span id="best">'+best+'</span>';}

function startLevel(){
  playerIdx=0;
  showing=true;
  sequence=[];
  const n=Math.min(ALL_OBJS.length,level+2);
  const pool=shuffle(ALL_OBJS.slice()).slice(0,n>=4?n:4);
  for(let i=0;i<level+2;i++)sequence.push(pool[i%pool.length]);
  gridObjs=shuffle(Array.from(new Set(sequence.concat(shuffle(ALL_OBJS.slice()).slice(0,8)))).slice(0,12));
  if(gridObjs.length<sequence.length)gridObjs=shuffle(ALL_OBJS.slice());
  buildGrid(true);
  setStatus(I18N.t('watch_msg','Watch closely...'));
  roomEl.textContent='🏛️';
  let i=0;
  const showNext=()=>{
    if(i>=sequence.length){
      showing=false;
      setStatus(I18N.t('your_turn','Your turn! Click objects in order.'));
      roomEl.textContent='❓';
      buildGrid(false);
      return;
    }
    roomEl.textContent=sequence[i];
    SFX.tick();
    setTimeout(()=>{
      roomEl.textContent='🏛️';
      i++;
      setTimeout(showNext,350);
    },700);
  };
  setTimeout(showNext,500);
}

function buildGrid(disabled){
  gridEl.innerHTML='';
  gridObjs.forEach(obj=>{
    const d=document.createElement('div');
    d.className='obj';
    d.textContent=obj;
    if(disabled){d.style.opacity='.4';d.style.cursor='default';}
    else d.onclick=()=>pick(obj,d);
    gridEl.appendChild(d);
  });
}

function pick(obj,el){
  if(showing||lives<=0)return;
  if(obj===sequence[playerIdx]){
    SFX.point();
    el.classList.add('picked');
    el.onclick=null;
    playerIdx++;
    if(playerIdx>=sequence.length){
      SFX.success();
      level++;
      if(level-1>best){best=level-1;localStorage.setItem('memorypalace_best',best);}
      updateStats();
      setStatus(I18N.t('correct_next','Correct! Next room sequence...'));
      setTimeout(startLevel,1000);
    }
  }else{
    SFX.error();
    el.classList.add('wrong');
    lives--;
    updateStats();
    if(lives<=0){
      gameOver();
    }else{
      setStatus(I18N.t('wrong_try','Wrong order! Try again — same sequence.'));
      setTimeout(()=>{playerIdx=0;buildGrid(false);setStatus(I18N.t('your_turn','Your turn! Click objects in order.'));},900);
    }
  }
}

function gameOver(){
  showing=true;
  SFX.lose();
  setStatus(I18N.t('game_over_msg','GAME OVER — Reached level {l}. Click to retry.').replace('{l}',level));
  gridEl.innerHTML='';
  const retry=document.createElement('div');
  retry.style.cssText='grid-column:1/-1;color:#fff;font-weight:800;font-size:1.3rem;cursor:pointer;padding:14px;';
  retry.textContent=I18N.t('tap_retry','Tap here to play again');
  retry.onclick=()=>{level=1;lives=3;updateStats();startLevel();};
  gridEl.appendChild(retry);
}

updateStats();
startLevel();
</script></body></html>
