<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#6a1b9a,#ff477e);border-radius:14px;padding:18px;text-align:center}
#hud{display:flex;justify-content:space-between;max-width:460px;margin:0 auto 10px;color:#fff;font-weight:800;font-size:1.05rem}
#order{background:rgba(0,0,0,.35);border-radius:12px;padding:14px;max-width:460px;margin:0 auto 12px}
#orderTitle{color:#ffd54f;font-weight:900;margin-bottom:8px}
#orderList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.oitem{width:44px;height:44px;border-radius:8px;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:2px solid #ffffff44;position:relative}
.oitem.done{background:#4caf5088;border-color:#4caf50}
.oitem.next{border-color:#ffd54f;box-shadow:0 0 8px #ffd54f}
#glass{margin:10px auto;width:70px;min-height:90px;background:#ffffff22;border:3px solid #fff;border-radius:0 0 20px 20px;display:flex;flex-direction:column-reverse;align-items:center;padding:4px}
.glayer{font-size:1.3rem;line-height:1.3rem}
#timerBar{max-width:460px;margin:8px auto;height:10px;background:#0004;border-radius:6px;overflow:hidden}
#timerFill{height:100%;background:#ffd54f;width:100%;transition:width .1s linear}
#tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:500px;margin:14px auto}
.ing{width:56px;height:56px;border-radius:10px;background:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 2px 4px #0004}
.ing:active{transform:scale(.9)}
#serveBtn{margin-top:12px;padding:10px 26px;background:#ffd54f;border:none;border-radius:20px;font-weight:900;font-size:1.05rem;cursor:pointer}
#serveBtn:disabled{opacity:.4;cursor:not-allowed}
#status{color:#fff;font-weight:800;min-height:1.6em;margin-top:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bartending</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="hud"><span id="servedDisp">Served: 0 | Hi: 0</span><span id="livesDisp">Lives: 3</span></div>
      <div id="order">
        <div id="orderTitle">Order</div>
        <div id="orderList"></div>
      </div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="glass"></div>
      <div id="tray"></div>
      <button id="serveBtn" onclick="serve()">Serve</button>
      <div id="status">Click ingredients in order, then Serve!</div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the ingredient icons from the tray in the <b>exact order</b> shown on the order card, then click <b>Serve</b> before the timer runs out. A wrong order resets your attempt and costs a life.</div>
</div>
<script>
const INGREDIENTS=[
  {k:'ice',e:'🧊'},{k:'vodka',e:'🍸'},{k:'rum',e:'🥃'},{k:'gin',e:'🍶'},
  {k:'soda',e:'🥤'},{k:'juice',e:'🧃'},{k:'lime',e:'🍋'},{k:'cherry',e:'🍒'},
  {k:'mint',e:'🌿'},{k:'olive',e:'🫒'}
];
let served=0,hi=0,lives=3,round=0,order=[],progress=[],timeLeft=0,timeMax=0,timerId=null,gameOver=false,busy=false;
hi=parseInt(localStorage.getItem('bartending_hi')||'0',10);

function pick(n){
  const pool=[...INGREDIENTS];
  const out=[];
  for(let i=0;i<n&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}

function newOrder(){
  round++;
  const len=Math.min(3+Math.floor(round/2),7);
  order=pick(len);
  progress=[];
  timeMax=Math.max(5000,9000-round*300);
  timeLeft=timeMax;
  renderOrder();
  renderGlass();
  renderTray();
  document.getElementById('serveBtn').disabled=false;
  setStatus(I18N.t('order_new','New order! Click ingredients in order.'));
}

function renderOrder(){
  const el=document.getElementById('orderList');
  el.innerHTML='';
  order.forEach((ing,i)=>{
    const d=document.createElement('div');
    d.className='oitem'+(i<progress.length?' done':(i===progress.length?' next':''));
    d.textContent=ing.e;
    el.appendChild(d);
  });
}

function renderGlass(){
  const g=document.getElementById('glass');
  g.innerHTML='';
  progress.forEach(ing=>{
    const s=document.createElement('div');
    s.className='glayer';
    s.textContent=ing.e;
    g.appendChild(s);
  });
}

function renderTray(){
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  // tray = shuffled set including all order ingredients plus a few decoys
  const need=[...order];
  const decoyPool=INGREDIENTS.filter(i=>!order.some(o=>o.k===i.k));
  const decoys=[];
  const decoyCount=Math.min(3,decoyPool.length);
  for(let i=0;i<decoyCount;i++){
    const idx=Math.floor(Math.random()*decoyPool.length);
    decoys.push(decoyPool.splice(idx,1)[0]);
  }
  const trayItems=[...need,...decoys].sort(()=>Math.random()-0.5);
  trayItems.forEach(ing=>{
    const b=document.createElement('button');
    b.className='ing';
    b.textContent=ing.e;
    b.onclick=()=>clickIngredient(ing);
    tray.appendChild(b);
  });
}

function setStatus(t){document.getElementById('status').textContent=t;}

function clickIngredient(ing){
  if(gameOver||busy)return;
  const expected=order[progress.length];
  if(!expected)return;
  if(ing.k===expected.k){
    progress.push(ing);
    SFX.point();
    renderOrder();
    renderGlass();
    if(progress.length===order.length){
      setStatus(I18N.t('order_ready','All ingredients added — hit Serve!'));
    }
  } else {
    SFX.error();
    failAttempt(I18N.t('wrong_order','Wrong order! Attempt reset.'));
  }
}

function failAttempt(msg){
  busy=true;
  lives--;
  updateHud();
  setStatus(msg);
  if(lives<=0){
    endGame();
    return;
  }
  setTimeout(()=>{
    progress=[];
    renderOrder();
    renderGlass();
    busy=false;
    setStatus(I18N.t('try_again','Try again — follow the order!'));
  },700);
}

function serve(){
  if(gameOver||busy)return;
  if(progress.length!==order.length){
    SFX.error();
    failAttempt(I18N.t('incomplete','Not finished yet!'));
    return;
  }
  const ok=progress.every((ing,i)=>ing.k===order[i].k);
  if(ok){
    served++;
    if(served>hi){hi=served;localStorage.setItem('bartending_hi',hi);}
    SFX.success();
    updateHud();
    setStatus(I18N.t('served_ok','Served! Next order coming up.'));
    document.getElementById('serveBtn').disabled=true;
    setTimeout(()=>{ if(!gameOver) newOrder(); },600);
  } else {
    SFX.error();
    failAttempt(I18N.t('wrong_order','Wrong order! Attempt reset.'));
  }
}

function updateHud(){
  document.getElementById('servedDisp').textContent=I18N.t('served_hi_label','Served: {s} | Hi: {h}').replace('{s}',served).replace('{h}',hi);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',lives);
}

function tick(){
  if(gameOver)return;
  timeLeft-=100;
  const pct=Math.max(0,timeLeft/timeMax*100);
  document.getElementById('timerFill').style.width=pct+'%';
  if(timeLeft<=0){
    SFX.error();
    lives--;
    updateHud();
    if(lives<=0){endGame();return;}
    setStatus(I18N.t('time_up','Time up! Order lost.'));
    setTimeout(()=>{ if(!gameOver) newOrder(); },700);
    timeLeft=timeMax; // avoid double-trigger while waiting
  }
}

function endGame(){
  gameOver=true;
  clearInterval(timerId);
  document.getElementById('serveBtn').disabled=true;
  SFX.lose();
  setStatus(I18N.t('shift_over','Shift over! Tap New Shift to play again.'));
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  const b=document.createElement('button');
  b.className='ing';
  b.style.width='auto';b.style.padding='10px 20px';b.style.fontSize='1rem';
  b.textContent=I18N.t('new_shift','New Shift');
  b.onclick=startGame;
  tray.appendChild(b);
}

function startGame(){
  served=0;lives=3;round=0;gameOver=false;busy=false;
  updateHud();
  clearInterval(timerId);
  timerId=setInterval(tick,100);
  newOrder();
}

startGame();
</script></body></html>
