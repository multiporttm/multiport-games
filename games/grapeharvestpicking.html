<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3a2a1a;display:block;border-radius:8px;touch-action:none}
#hud{color:#f4e4c1;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud b{color:#c77dff}
#weatherBar{width:100%;max-width:800px;margin:0 auto 6px;height:10px;background:#1a1410;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#weatherFill{height:100%;width:100%;background:linear-gradient(90deg,#7ec850,#ffd54f,#e94560);transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Grape Harvest Picking</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="level-display">Level 1</span><span id="lives-display">❤❤❤</span></div>
    <div id="weatherBar"><div id="weatherFill"></div></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap only the <b>ripe purple</b> grape clusters to basket them — leave the green (under-ripe) and brown (rotten) ones alone! Use <b>Arrow keys</b> to move the cursor and <b>Space/Enter</b> to pick. Pick fast before the rain gauge empties!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLS=6,ROWS=3,CW=800/COLS,CH=(420-30)/ROWS;
let score=0,hi=0,lives=3,level=1,weather=100,gameOver=false,started=false;
let clusters=[],spawnTimer=0,cursorR=1,cursorC=0,frame=0,lastTime=null;
const hiKey='grapeharvestpicking_hi';
hi=parseFloat(localStorage.getItem(hiKey))||0;

function cellCenter(r,cl){return {x:cl*CW+CW/2, y:30+r*CH+CH/2};}

function reset(){
  score=0;lives=3;level=1;weather=100;gameOver=false;started=false;
  clusters=[];spawnTimer=0;cursorR=1;cursorC=0;frame=0;lastTime=null;
  for(let i=0;i<4;i++)spawnCluster();
}

function spawnCluster(){
  // pick empty cell
  let r,cl,tries=0;
  do{r=Math.floor(Math.random()*ROWS);cl=Math.floor(Math.random()*COLS);tries++;}
  while(clusters.some(g=>g.r===r&&g.c===cl)&&tries<30);
  if(tries>=30)return;
  const roll=Math.random();
  let type;
  if(roll<0.55)type='ripe';
  else if(roll<0.8)type='under';
  else type='rotten';
  const life=Math.max(260,520-level*22)+Math.random()*120;
  clusters.push({r,c:cl,type,age:0,life,size:0});
}

function pick(r,cl){
  const idx=clusters.findIndex(g=>g.r===r&&g.c===cl);
  if(idx<0)return;
  const g=clusters[idx];
  if(g.type==='ripe'){
    score+=10+level;
    weather=Math.min(100,weather+6);
    SFX.coin();
    clusters.splice(idx,1);
    spawnCluster();
  } else {
    lives--;
    weather=Math.max(0,weather-10);
    SFX.error();
    clusters.splice(idx,1);
    if(lives<=0)endGame();
  }
}

function endGame(){
  gameOver=true;
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(hiKey,String(hi));}
}

function startOrRestart(){
  if(gameOver){reset();return;}
  if(!started){started=true;}
}

function moveCursor(dr,dc){
  cursorR=Math.max(0,Math.min(ROWS-1,cursorR+dr));
  cursorC=Math.max(0,Math.min(COLS-1,cursorC+dc));
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();
  if(gameOver&&(e.key==='Enter'||e.key===' ')){reset();return;}
  if(!started){started=true;}
  if(e.key==='ArrowUp')moveCursor(-1,0);
  else if(e.key==='ArrowDown')moveCursor(1,0);
  else if(e.key==='ArrowLeft')moveCursor(0,-1);
  else if(e.key==='ArrowRight')moveCursor(0,1);
  else if(e.key===' '||e.key==='Enter')pick(cursorR,cursorC);
});

function posToCell(x,y){
  const rect=c.getBoundingClientRect();
  const sx=(x-rect.left)*(800/rect.width);
  const sy=(y-rect.top)*(420/rect.height);
  const cl=Math.floor(sx/CW);
  const r=Math.floor((sy-30)/CH);
  return {r,c:cl};
}

c.addEventListener('pointerdown',e=>{
  startOrRestart();
  const {r,c:cl}=posToCell(e.clientX,e.clientY);
  if(r>=0&&r<ROWS&&cl>=0&&cl<COLS){cursorR=r;cursorC=cl;if(!gameOver)pick(r,cl);}
});

function clusterColor(type,size){
  if(type==='ripe')return '#8e44ec';
  if(type==='under')return '#7ec850';
  return '#6b4a2b';
}

function draw(){
  ctx.clearRect(0,0,800,420);
  const sky=ctx.createLinearGradient(0,0,0,420);
  sky.addColorStop(0,'#1d1424');sky.addColorStop(1,'#3a2a1a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,420);

  // row vines
  ctx.strokeStyle='rgba(255,255,255,.08)';
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,30+r*CH);ctx.lineTo(800,30+r*CH);ctx.stroke();}
  for(let cl=0;cl<=COLS;cl++){ctx.beginPath();ctx.moveTo(cl*CW,30);ctx.lineTo(cl*CW,420);ctx.stroke();}

  clusters.forEach(g=>{
    const {x,y}=cellCenter(g.r,g.c);
    const grow=Math.min(1,g.age/30);
    const rad=16*grow+4;
    ctx.fillStyle=clusterColor(g.type);
    for(let i=0;i<5;i++){
      const ang=i*(Math.PI*2/5);
      ctx.beginPath();
      ctx.arc(x+Math.cos(ang)*8,y+Math.sin(ang)*8,rad*0.6,0,Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle='#4a3a1a';
    ctx.fillRect(x-2,y-rad-10,4,12);
    // life bar
    const pct=1-g.age/g.life;
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(x-14,y+rad+4,28,3);
    ctx.fillStyle=pct>0.4?'#7ec850':'#e94560';
    ctx.fillRect(x-14,y+rad+4,28*pct,3);
  });

  // cursor
  const cc=cellCenter(cursorR,cursorC);
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
  ctx.strokeRect(cursorC*CW+4,30+cursorR*CH+4,CW-8,CH-8);
  ctx.lineWidth=1;

  if(!started&&!gameOver){
    ctx.fillStyle='#f4e4c1cc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click a cluster or press Space to start'),400,210);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,800,420);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,190);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,228);
  }
}

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('level-display').textContent=I18N.t('level_label','Level {l}').replace('{l}',level);
  document.getElementById('lives-display').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
  document.getElementById('weatherFill').style.width=weather+'%';
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(started&&!gameOver){
    frame+=dt;
    level=1+Math.floor(score/120);
    weather-=0.06*dt*(1+level*0.08);
    if(weather<=0){weather=0;endGame();}

    spawnTimer+=dt;
    const interval=Math.max(26,60-level*3);
    if(spawnTimer>=interval&&clusters.length<ROWS*COLS-1){spawnTimer-=interval;spawnCluster();}

    clusters.forEach(g=>{g.age+=dt;});
    const expired=clusters.filter(g=>g.age>=g.life);
    if(expired.length){
      clusters=clusters.filter(g=>g.age<g.life);
      expired.forEach(()=>{ if(Math.random()<0.4)spawnCluster(); });
    }
  }

  draw();
  updateHud();
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
