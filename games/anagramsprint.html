<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
.as-wrap{max-width:360px;margin:0 auto;text-align:center;color:#e8eaf6}
#ui{padding:8px;font-size:1.1rem;font-weight:700}
#scramble{font-size:2rem;font-weight:800;letter-spacing:4px;margin:18px 0;color:#ffd54f;min-height:2.4rem}
#answer{font-size:1.3rem;letter-spacing:3px;min-height:2rem;color:#80deea;margin-bottom:12px}
#keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:340px;margin:0 auto}
#keys button{width:34px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
#keys button:active{background:rgba(255,255,255,.22)}
#clear{margin-top:14px;padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer}
#msg{min-height:1.4rem;font-weight:700;color:#a5d6a7;margin-top:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Anagram Sprint</div>
  <div class="game-frame" style="padding:14px">
    <div class="as-wrap">
      <div id="ui">Score: 0 | Time: 60 | Best: 0</div>
      <div id="scramble"></div>
      <div id="answer"></div>
      <div id="keys"></div>
      <button id="clear">Clear</button>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions">Tap the scrambled letters in the right order to spell the hidden word before the 60-second timer runs out. Solve a word to score points and get a fresh scramble instantly!</div>
</div>
<script>
const WORDS=['apple','beach','cloud','dance','eagle','flame','grape','house','island','jungle',
'kitten','lemon','mango','night','ocean','piano','queen','river','stone','tiger',
'umbra','violet','whale','xenon','yacht','zebra','bread','chess','dream','earth',
'flute','giant','honey','ivory','joker','koala','light','magic','noble','olive',
'peace','quilt','robot','snake','table','uncle','vivid','water','xray','young'];

let score,timeLeft,state,best,current,answer,timerId;

function loadBest(){return +(localStorage.getItem('anagramsprint_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('anagramsprint_best',v);}

function shuffle(word){
  let letters=word.split('');
  let scrambled;
  do{
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    scrambled=letters.join('');
  }while(scrambled===word);
  return scrambled;
}

function newWord(){
  const word=WORDS[Math.floor(Math.random()*WORDS.length)];
  current={word,scrambled:shuffle(word)};
  answer='';
  renderScramble();
  renderKeys();
  renderAnswer();
}

function renderScramble(){
  document.getElementById('scramble').textContent=current.scrambled.toUpperCase();
}

function renderKeys(){
  const box=document.getElementById('keys');
  box.innerHTML='';
  current.scrambled.split('').forEach((ch,i)=>{
    const btn=document.createElement('button');
    btn.textContent=ch.toUpperCase();
    btn.dataset.idx=i;
    btn.addEventListener('click',()=>{
      if(state!=='play'||btn.disabled)return;
      answer+=ch;
      btn.disabled=true;
      btn.style.opacity=.25;
      renderAnswer();
      SFX.tick();
      checkAnswer();
    });
    box.appendChild(btn);
  });
}

function renderAnswer(){
  document.getElementById('answer').textContent=answer.toUpperCase();
}

function checkAnswer(){
  if(answer.length!==current.word.length)return;
  if(answer===current.word){
    score+=current.word.length*10;
    SFX.success();
    msg('Correct!','#a5d6a7');
    saveBest(score);
    updateUI();
    setTimeout(()=>{if(state==='play')newWord();},350);
  }else{
    SFX.fail();
    msg('Not quite — cleared','#ef9a9a');
    setTimeout(()=>{if(state==='play'){answer='';renderKeys();renderAnswer();}},400);
  }
}

document.getElementById('clear').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  answer='';renderKeys();renderAnswer();
  SFX.click();
});

function msg(text,color){
  const el=document.getElementById('msg');
  el.textContent=text;el.style.color=color;
  setTimeout(()=>{if(el.textContent===text)el.textContent='';},700);
}

function init(){
  score=0;timeLeft=60;state='play';best=loadBest();
  newWord();
  updateUI();
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(state!=='play')return;
    timeLeft--;
    if(timeLeft<=0){
      timeLeft=0;state='over';
      SFX.lose();
      saveBest(score);
    }
    updateUI();
  },1000);
}

function updateUI(){
  document.getElementById('ui').textContent=state==='over'
    ?`Final Score: ${score} | Best: ${loadBest()}`
    :`Score: ${score} | Time: ${timeLeft} | Best: ${loadBest()}`;
  if(state==='over'){
    document.getElementById('scramble').textContent='TIME UP!';
    document.getElementById('answer').textContent='';
    document.getElementById('keys').innerHTML='';
    msg('Tap Play Again to restart','#ffd54f');
    document.getElementById('clear').textContent='Play Again';
  }else{
    document.getElementById('clear').textContent='Clear';
  }
}

init();
</script></body></html>
