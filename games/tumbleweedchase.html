<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#c9915a;display:block;border-radius:8px;touch-action:none;max-width:100%}
#score-display{color:#7a4a1f;background:#f3d9a8;font-size:1.2rem;font-weight:700;text-align:center;padding:8px;border-radius:8px 8px 0 0}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Tumbleweed Chase</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Up/Down Arrows</b> or <b>W/S</b> (or <b>swipe/tap</b> the top or bottom half of the track) to switch lanes. Dodge wagons, cacti and horses, and roll through golden <b>wind gusts</b> for a speed boost. Race for the longest distance!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300,LANES=3;
const laneY=[70,150,230];
let dist=0,hi=parseFloat(localStorage.getItem('tumbleweedchase_hi')||'0'),spd=6,gameOver=false,started=false;
let lane=1,targetLane=1,laneY_cur=laneY[1];
let obstacles=[],gusts=[];
let boostTimer=0,frame=0,lastTime=null,spawnTimer=0,gustTimer=0;
const weed={x:120,r:26};

function reset(){
  dist=0;spd=6;gameOver=false;started=false;lane=1;targetLane=1;laneY_cur=laneY[1];
  obstacles=[];gusts=[];boostTimer=0;frame=0;lastTime=null;spawnTimer=0;gustTimer=0;weed.r=0;
}

function moveLane(dir){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  const nl=targetLane+dir;
  if(nl>=0&&nl<LANES){targetLane=nl;SFX.swoosh();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();moveLane(-1);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();moveLane(1);}
  else if(e.code==='Space'&&gameOver){reset();}
});

let touchStartY=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  const relY=(t.clientY-rect.top)/rect.height*H;
  touchStartY=t.clientY;
  if(!started||gameOver){moveLane(0);return;}
},{passive:false});
c.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const rect=c.getBoundingClientRect();
  const relY=(t.clientY-rect.top)/rect.height*H;
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(touchStartY!=null){
    const dy=t.clientY-touchStartY;
    if(Math.abs(dy)>20){moveLane(dy<0?-1:1);}
    else{
      if(relY<H/2)moveLane(-1);else moveLane(1);
    }
  }
},{passive:false});
c.addEventListener('click',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const rect=c.getBoundingClientRect();
  const relY=(e.clientY-rect.top)/rect.height*H;
  if(relY<H/2)moveLane(-1);else moveLane(1);
});

function spawnObstacle(){
  const l=Math.floor(Math.random()*LANES);
  const types=['wagon','cactus','horse'];
  const type=types[Math.floor(Math.random()*types.length)];
  obstacles.push({x:W+40,lane:l,type,w:type==='wagon'?54:type==='horse'?46:26,h:type==='wagon'?40:type==='horse'?38:34});
}
function spawnGust(){
  const l=Math.floor(Math.random()*LANES);
  gusts.push({x:W+40,lane:l,r:20});
}

function drawWeed(x,y,r){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(frame*0.12);
  ctx.strokeStyle='#5a3d1f';
  ctx.lineWidth=2;
  for(let i=0;i<10;i++){
    const ang=(i/10)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.strokeStyle='#7a5230';
  ctx.stroke();
  ctx.restore();
  if(boostTimer>0){
    ctx.strokeStyle='rgba(255,213,79,0.6)';
    for(let i=1;i<=3;i++){
      ctx.beginPath();ctx.moveTo(x-r-i*10,y);ctx.lineTo(x-r-i*10-8,y);ctx.stroke();
    }
  }
}

function drawObstacle(o){
  const y=laneY[o.lane];
  ctx.save();
  if(o.type==='cactus'){
    ctx.fillStyle='#3d8b40';
    ctx.fillRect(o.x-o.w/2,y-o.h/2,o.w*0.4,o.h);
    ctx.fillRect(o.x-o.w/2-8,y-o.h/4,o.w*0.3,o.h*0.5);
    ctx.fillRect(o.x+o.w/2-o.w*0.3,y-o.h/6,o.w*0.3,o.h*0.4);
  }else if(o.type==='wagon'){
    ctx.fillStyle='#7a4a1f';
    ctx.fillRect(o.x-o.w/2,y-o.h/2,o.w,o.h*0.6);
    ctx.fillStyle='#4a2f14';
    ctx.beginPath();ctx.arc(o.x-o.w/3,y+o.h/6,9,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(o.x+o.w/3,y+o.h/6,9,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#5a3d20';
    ctx.fillRect(o.x-o.w/2,y-o.h/2,o.w,o.h*0.55);
    ctx.fillRect(o.x+o.w/2-10,y-o.h,12,o.h*0.6);
  }
  ctx.restore();
}

function drawGust(g){
  const y=laneY[g.lane];
  ctx.save();
  ctx.strokeStyle='#ffd54f';
  ctx.lineWidth=3;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(g.x,y,g.r-i*6,0.3+frame*0.05,2.0+frame*0.05);
    ctx.stroke();
  }
  ctx.restore();
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#f0c987');sky.addColorStop(1,'#c9915a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  laneY.forEach((y,i)=>{
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.setLineDash([12,10]);
    ctx.beginPath();ctx.moveTo(0,y+40);ctx.lineTo(W,y+40);ctx.stroke();
    ctx.setLineDash([]);
  });

  if(gameOver){
    ctx.fillStyle='#3a2510';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SNAGGED!'),W/2,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to roll again'),W/2,158);
    updateDisplay();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#3a2510cc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or press a key to start rolling'),W/2,140);
    drawWeed(weed.x,laneY[1],26);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  laneY_cur+=(laneY[targetLane]-laneY_cur)*0.2*dt;
  lane=targetLane;

  const boosted=boostTimer>0;
  if(boosted)boostTimer-=dt;
  const curSpd=(boosted?spd*1.8:spd);
  dist+=curSpd*dt*0.08;
  if(dist>hi){hi=dist;}
  spd=6+dist/220;

  spawnTimer+=dt;
  const interval=Math.max(38,80-dist/25);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle();}
  gustTimer+=dt;
  if(gustTimer>=210){gustTimer-=210;spawnGust();}

  const weedHit={x:weed.x-22,y:laneY_cur-22,w:44,h:44};

  obstacles=obstacles.filter(o=>o.x>-60);
  obstacles.forEach(o=>{
    o.x-=curSpd*dt*4;
    drawObstacle(o);
    if(o.lane===lane){
      const oy=laneY[o.lane];
      if(rectsOverlap(weedHit.x,weedHit.y,weedHit.w,weedHit.h,o.x-o.w/2,oy-o.h/2,o.w,o.h)&&!gameOver){
        gameOver=true;SFX.lose();
        if(dist>parseFloat(localStorage.getItem('tumbleweedchase_hi')||'0')){
          localStorage.setItem('tumbleweedchase_hi',dist.toFixed(0));
        }
      }
    }
  });

  gusts=gusts.filter(g=>g.x>-60);
  gusts.forEach(g=>{
    g.x-=curSpd*dt*4;
    drawGust(g);
    if(g.lane===lane){
      const gy=laneY[g.lane];
      if(Math.abs(weed.x-g.x)<28&&Math.abs(laneY_cur-gy)<28&&!g.used){
        g.used=true;boostTimer=90;SFX.powerup();
      }
    }
  });

  drawWeed(weed.x,laneY_cur,26);
  updateDisplay();
  requestAnimationFrame(loop);
}

function updateDisplay(){
  const dspHi=Math.max(hi,parseFloat(localStorage.getItem('tumbleweedchase_hi')||'0'));
  document.getElementById('score-display').textContent=
    I18N.t('distance_hi_label','Distance: {s}m | Hi: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(dspHi));
}

reset();
loop();
</script></body></html>
