<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#7cb342}
#ui{color:#f1f8e9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Egg Hunt Frenzy</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Eggs: 0 | Time: 30s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to run around the yard collecting 🥚 eggs. Avoid the 🐓 rooster — touching it costs you eggs! Grab as many as you can before time runs out.</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,eggs,rooster,collected,timeLeft,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('egghunt_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('egghunt_best',v);}

function init(){
  player={x:W/2,y:H/2};
  eggs=[];collected=0;timeLeft=30;state='play';
  rooster={x:rand(30,W-30),y:rand(30,H-30),vx:rand(-1,1),vy:rand(-1,1)};
  for(let i=0;i<7;i++)spawnEgg();
}

function spawnEgg(){
  eggs.push({x:rand(20,W-20),y:rand(20,H-20)});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.4;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  rooster.x+=rooster.vx;rooster.y+=rooster.vy;
  if(rooster.x<20||rooster.x>W-20)rooster.vx*=-1;
  if(rooster.y<20||rooster.y>H-20)rooster.vy*=-1;

  eggs=eggs.filter(e=>{
    if(dist(e,player)<20){collected++;SFX.coin();spawnEgg();return false;}
    return true;
  });

  if(dist(player,rooster)<22&&collected>0){
    collected=Math.max(0,collected-1);
    SFX.hurt();
    player.x+=rand(-20,20);player.y+=rand(-20,20);
  }

  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(collected);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#7cb342';ctx.fillRect(0,0,W,H);

  ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  eggs.forEach(e=>ctx.fillText('🥚',e.x,e.y));

  ctx.font='24px Arial';
  ctx.fillText('🐓',rooster.x,rooster.y);

  ctx.font='22px Arial';
  ctx.fillText('🧺',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f1f8e9';ctx.font='bold 26px Arial';
    ctx.fillText("TIME'S UP!",W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Eggs: ${collected} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Eggs: ${collected} | Time: ${Math.ceil(timeLeft)}s`;
}

init();draw();
</script></body></html>
