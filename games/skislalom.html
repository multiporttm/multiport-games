<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#eaf7ff;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#4fc3f7;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ski Slalom</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Distance: 0m | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to steer, or <b>drag</b> on mobile. Weave through each <b>red/blue gate pair</b> in order — missing a gate costs a <b>life</b>. Clearing gates boosts your score and speed!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let hiScore=parseInt(localStorage.getItem('skislalom_hi')||'0');
let score,distance,lives,spd,frame,gameOver,started,gateTimer,gates,nextGateColor;
const player={x:W/2,y:H-110,w:30,h:44,vx:0};
let keys={left:false,right:false};
let dragX=null;
let lastTime=null;

function reset(){
  score=0;distance=0;lives=3;spd=5;frame=0;gameOver=false;started=false;
  player.x=W/2;player.vx=0;
  gates=[];gateTimer=0;nextGateColor='red';
  lastTime=null;
}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;startOrRestart();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;startOrRestart();}
  else if(e.code==='Space'){startOrRestart();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
c.addEventListener('click',startOrRestart);
c.addEventListener('touchstart',e=>{e.preventDefault();startOrRestart();dragX=e.touches[0].clientX;},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragX!==null){
    const dx=e.touches[0].clientX-dragX;
    player.x+=dx*1.3;
    dragX=e.touches[0].clientX;
  }
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragX=null;},{passive:false});

// A gate is a pair: red flag on one side, blue flag on the other, with a gap to ski through.
// nextGateColor alternates which side must be passed on the LEFT vs RIGHT to keep it interesting;
// simplified rule: ski between the two flags of each gate, gates alternate red-left/blue-right and blue-left/red-right.
function spawnGate(){
  const gapCenter=90+Math.random()*(W-180);
  const gapWidth=110;
  const leftIsRed=nextGateColor==='red';
  gates.push({
    y:-40,
    leftX:gapCenter-gapWidth/2,
    rightX:gapCenter+gapWidth/2,
    leftColor:leftIsRed?'#e53935':'#1e88e5',
    rightColor:leftIsRed?'#1e88e5':'#e53935',
    passed:false,
    missed:false
  });
  nextGateColor=nextGateColor==='red'?'blue':'red';
}

function drawFlag(x,y,color){
  ctx.save();
  ctx.strokeStyle='#5a3a24';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x,y+30);ctx.lineTo(x,y-30);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x,y-30);ctx.lineTo(x+22,y-22);ctx.lineTo(x,y-14);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawGate(g){
  drawFlag(g.leftX,g.y,g.leftColor);
  drawFlag(g.rightX,g.y,g.rightColor);
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.vx*0.02);
  // skis
  ctx.strokeStyle='#333';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-14,player.h/2+6);ctx.lineTo(-14,player.h/2-14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,player.h/2+6);ctx.lineTo(14,player.h/2-14);ctx.stroke();
  // body
  ctx.fillStyle='#e94560';
  ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
  // head
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-player.h/2-8,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(-5,-player.h/2-14,12,5);
  ctx.restore();
}

let bgOffset=0;
function drawBg(dt){
  bgOffset=(bgOffset+spd*dt)%40;
  ctx.fillStyle='#eaf7ff';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c9ecff';
  ctx.lineWidth=2;
  for(let y=-40;y<H+40;y+=40){
    ctx.beginPath();ctx.moveTo(0,y+bgOffset);ctx.lineTo(W,y+bgOffset);ctx.stroke();
  }
}

function loop(){
  if(gameOver){
    drawBg(0);
    ctx.fillStyle='#1a1a2e';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Key to restart'),W/2,H/2+14);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    drawBg(0);
    drawPlayer();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_ski','Press a Key or Tap to start'),W/2,80);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  distance+=dt*(spd/5);
  spd=5+distance/220;

  if(keys.left)player.vx=Math.max(player.vx-0.6*dt,-7);
  else if(keys.right)player.vx=Math.min(player.vx+0.6*dt,7);
  else player.vx*=0.85;
  player.x+=player.vx*dt;
  if(player.x<20)player.x=20;
  if(player.x>W-20)player.x=W-20;

  drawBg(dt);

  gateTimer+=dt;
  const gateInterval=Math.max(48,85-distance/12);
  if(gateTimer>=gateInterval){gateTimer-=gateInterval;spawnGate();}

  gates=gates.filter(g=>g.y<H+60);
  gates.forEach(g=>{
    g.y+=(spd+2)*dt;
    drawGate(g);
    if(!g.passed&&!g.missed&&g.y>player.y-20&&g.y<player.y+20){
      if(player.x>g.leftX&&player.x<g.rightX){
        g.passed=true;
        score+=10;
        distance+=5;
        SFX.point();
      }
    }
    if(!g.passed&&!g.missed&&g.y>player.y+30){
      g.missed=true;
      lives--;
      SFX.error();
      if(lives<=0&&!gameOver){
        gameOver=true;
        if(score>hiScore){hiScore=score;localStorage.setItem('skislalom_hi',String(hiScore));}
        SFX.lose();
      }
    }
  });

  drawPlayer();
  if(score>hiScore)hiScore=score;
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  if(score>hiScore){hiScore=score;localStorage.setItem('skislalom_hi',String(hiScore));}
  document.getElementById('score-display').textContent=
    I18N.t('ski_score_label','Score: {s} | Distance: {d}m | Lives: {l} | Hi: {h}')
      .replace('{s}',Math.floor(score)).replace('{d}',Math.floor(distance)).replace('{l}',Math.max(0,lives)).replace('{h}',Math.floor(hiScore));
}

reset();
loop();
</script></body></html>
