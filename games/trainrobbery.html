<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2436;display:block;border-radius:8px;touch-action:none}
#hud{color:#ffd54f;font-size:1.05rem;font-weight:700;text-align:center;padding:6px}
#timeWrap{max-width:800px;margin:0 auto 6px;background:#222;border-radius:8px;height:12px;overflow:hidden}
#timeBar{height:100%;background:linear-gradient(90deg,#7ec850,#ffd54f,#e94560);width:100%;transition:width .2s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Train Robbery</div>
  <div class="game-frame">
    <div id="hud">Car 0/10 | Score: 0 | Hi: 0</div>
    <div id="timeWrap"><div id="timeBar"></div></div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">
    Press <b>Space</b>/<b>Up</b> or <b>tap the upper half</b> to jump over gaps and guards. Press <b>Down</b> or <b>tap the lower half</b> to duck under low lanterns. Reach the cargo car before time runs out, then tap in the green zone when prompted to crack the safe!
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='trainrobbery_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
const CARS_TARGET=10;
const ground=200;
let phase='run'; // run -> safe -> done
let started=false,gameOver=false,won=false;
let player={x:100,y:ground,vy:0,ducking:false,jumps:0};
let obstacles=[],spawnTimer=0,dist=0,carsCrossed=0,spd=6,score=0,timeLeft=45,frame=0;
let lastTime=null;

// safe crack state
let needle=0,needleDir=1,tumblers=0,tumblersNeeded=3,safeTimeLeft=12,safeZone={lo:60,hi:80},safeMsg='',safeMsgTimer=0;

function reset(){
  phase='run';started=true;gameOver=false;won=false;
  player.y=ground;player.vy=0;player.jumps=0;player.ducking=false;
  obstacles=[];spawnTimer=0;dist=0;carsCrossed=0;spd=6;score=0;timeLeft=45;frame=0;lastTime=null;
  needle=0;needleDir=1;tumblers=0;safeTimeLeft=12;safeMsg='';safeMsgTimer=0;
}

function jump(){
  if(!started){reset();return;}
  if(gameOver){reset();return;}
  if(phase!=='run')return;
  if(player.ducking)return;
  if(player.jumps<2){player.vy=-13+player.jumps*2;player.jumps++;SFX.jump();}
}
function duck(v){
  if(phase!=='run')return;
  player.ducking=v && player.jumps===0;
}

function tryCrack(){
  if(phase!=='safe'||gameOver)return;
  if(needle>=safeZone.lo&&needle<=safeZone.hi){
    tumblers++;SFX.success();
    safeMsg=I18N.t('tr_tumbler','Tumbler {n}/{t} cracked!').replace('{n}',tumblers).replace('{t}',tumblersNeeded);
    safeMsgTimer=50;
    if(tumblers>=tumblersNeeded){
      won=true;gameOver=true;score+=200;SFX.win();
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    }
  } else {
    SFX.error();
    safeTimeLeft-=2;
    safeMsg=I18N.t('tr_miss','Missed! Guard is getting suspicious.');
    safeMsgTimer=40;
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();
    if(phase==='safe')tryCrack(); else jump();
  }
  else if(e.code==='ArrowDown'){e.preventDefault();duck(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowDown'){duck(false);}
});
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!started||gameOver){reset();return;}
  if(phase==='safe'){tryCrack();return;}
  const rect=c.getBoundingClientRect();
  const relY=(e.clientY-rect.top)/rect.height;
  if(relY>0.55){duck(true);} else {jump();}
});
c.addEventListener('pointerup',e=>{duck(false);});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});

function spawnObstacle(){
  const r=Math.random();
  if(r<0.4){
    obstacles.push({type:'gap',x:820,w:60});
  } else if(r<0.75){
    obstacles.push({type:'guard',x:820,w:26,h:50});
  } else {
    obstacles.push({type:'lantern',x:820,w:40,h:26,y:ground-40});
  }
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawPlayer(){
  const h=player.ducking?28:50;
  const y=player.y+50-h;
  ctx.fillStyle='#c9a15a';
  ctx.fillRect(player.x,y,32,h);
  ctx.fillStyle='#3a2418';
  ctx.fillRect(player.x-2,y-14,36,16);
}

function drawTrainRoof(){
  ctx.fillStyle='#3a4a63';
  ctx.fillRect(0,ground+50,800,50);
  ctx.fillStyle='#2a3448';
  ctx.fillRect(0,ground+50,800,6);
}

function loop(){
  ctx.clearRect(0,0,800,300);
  const sky=ctx.createLinearGradient(0,0,0,250);
  sky.addColorStop(0,'#0d1b2e');sky.addColorStop(1,'#1a2436');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,300);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tr_start_hint','Tap / Space to start the heist'),400,140);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawTrainRoof();
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('tr_win_title','SAFE CRACKED! JACKPOT!'):I18N.t('tr_lose_title','CAUGHT! HEIST FAILED'),400,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_label','Score: {s}').replace('{s}',score),400,160);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,200);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  if(phase==='run'){
    timeLeft-=dt/60;
    if(timeLeft<=0){
      timeLeft=0;gameOver=true;won=false;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    }

    dist+=spd*dt;
    spd=6+dist/900;
    const newCars=Math.floor(dist/260);
    if(newCars>carsCrossed){carsCrossed=newCars;score+=10;
      if(carsCrossed>=CARS_TARGET){
        phase='safe';SFX.powerup();
      }
    }

    spawnTimer+=dt;
    const interval=Math.max(45,95-dist/40);
    if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle();}

    player.vy+=0.7*dt;
    player.y+=player.vy*dt;
    if(player.y>=ground){player.y=ground;player.vy=0;player.jumps=0;}

    drawTrainRoof();

    const pHeight=player.ducking?28:50;
    const pHit={x:player.x+4,y:player.y+50-pHeight,w:24,h:pHeight};

    obstacles=obstacles.filter(o=>o.x>-80);
    obstacles.forEach(o=>{
      o.x-=spd*dt;
      if(o.type==='gap'){
        ctx.fillStyle='#0d1b2e';
        ctx.fillRect(o.x,ground+50,o.w,50);
        if(player.x+28>o.x&&player.x<o.x+o.w&&player.y>=ground-2&&player.jumps===0){
          gameOver=true;won=false;SFX.lose();
          if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
        }
      } else if(o.type==='guard'){
        ctx.fillStyle='#4a3020';
        ctx.fillRect(o.x,ground+50-o.h,o.w,o.h);
        ctx.fillStyle='#e0b088';
        ctx.beginPath();ctx.arc(o.x+13,ground+50-o.h-8,9,0,Math.PI*2);ctx.fill();
        if(rect(pHit,{x:o.x,y:ground+50-o.h,w:o.w,h:o.h})){
          gameOver=true;won=false;SFX.lose();
          if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
        }
      } else if(o.type==='lantern'){
        ctx.fillStyle='#ffcc00';
        ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);ctx.fill();
        if(rect(pHit,{x:o.x,y:o.y,w:o.w,h:o.h})){
          gameOver=true;won=false;SFX.lose();
          if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
        }
      }
    });

    drawPlayer();

  } else if(phase==='safe'){
    drawTrainRoof();
    safeTimeLeft-=dt/60;
    if(safeTimeLeft<=0){
      gameOver=true;won=false;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    }
    needle+=needleDir*1.6*dt;
    if(needle>=100){needle=100;needleDir=-1;}
    if(needle<=0){needle=0;needleDir=1;}

    ctx.fillStyle='#2a1810';ctx.fillRect(250,90,300,90);
    ctx.strokeStyle='#8b5a2b';ctx.lineWidth=4;ctx.strokeRect(250,90,300,90);
    const zx=250+300*(safeZone.lo/100);
    const zw=300*((safeZone.hi-safeZone.lo)/100);
    ctx.fillStyle='rgba(126,200,80,0.4)';
    ctx.fillRect(zx,110,zw,50);
    const nx=250+300*(needle/100);
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(nx,100);ctx.lineTo(nx,190);ctx.stroke();

    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tr_safe_hint','Tap / Space when the needle is in the green zone!'),400,60);
    ctx.fillText(I18N.t('tr_tumbler_progress','Tumblers: {n}/{t}').replace('{n}',tumblers).replace('{t}',tumblersNeeded),400,215);

    if(safeMsgTimer>0){
      safeMsgTimer--;
      ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';
      ctx.fillText(safeMsg,400,240);
    }
  }

  const barTime=phase==='safe'?safeTimeLeft/12:timeLeft/45;
  document.getElementById('timeBar').style.width=Math.max(0,barTime*100)+'%';
  document.getElementById('hud').textContent=
    phase==='safe'
      ? I18N.t('tr_hud_safe','Cracking the safe! | Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi)
      : I18N.t('tr_hud','Car {c}/{n} | Score: {s} | Hi: {h}').replace('{c}',carsCrossed).replace('{n}',CARS_TARGET).replace('{s}',score).replace('{h}',hi);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
