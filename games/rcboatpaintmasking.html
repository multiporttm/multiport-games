<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#0a1620}
#c{background:#102838;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7fd8ff;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">RC Boat Paint Masking</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>template</b> at the top, then click/tap each lane on the hull below (or use <b>←/→</b> and <b>Space</b>) to toggle masking tape on or off. Match the template exactly — no overlaps, no gaps — then press <b>Spray It</b> before time runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HI_KEY='rcboatpaintmasking_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,score=0,gameOver=false,started=false;
let lanes=[]; // template bool array
let player=[]; // player bool array
let selected=0;
let timeLeft=0,timeTotal=0;
let flashMsg='',flashT=0,locked=false;

function laneCountFor(r){return Math.min(5+Math.floor((r-1)/2),14);}

function newRound(){
  const n=laneCountFor(round);
  lanes=[];
  player=new Array(n).fill(false);
  // build a pattern with at least one taped and one untaped lane, varying by round
  const density=0.4+Math.min(round*0.03,0.3);
  let anyOn=false,anyOff=false;
  for(let i=0;i<n;i++){
    const on=Math.random()<density;
    lanes.push(on);
    if(on)anyOn=true; else anyOff=true;
  }
  if(!anyOn)lanes[0]=true;
  if(!anyOff)lanes[1%n]=false;
  timeTotal=Math.max(16,30-round);
  timeLeft=timeTotal;
  selected=0;
  locked=false;
  flashMsg='';flashT=0;
}

function reset(){round=1;score=0;gameOver=false;started=true;newRound();}

function toggleLane(i){
  if(locked||gameOver)return;
  player[i]=!player[i];
  SFX.click();
}

document.addEventListener('keydown',e=>{
  if(!started){if(e.code==='Space'||e.code==='Enter')reset();return;}
  if(gameOver){if(e.code==='Space'||e.code==='Enter')reset();return;}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){selected=(selected-1+player.length)%player.length;e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){selected=(selected+1)%player.length;e.preventDefault();}
  else if(e.code==='Space'){toggleLane(selected);e.preventDefault();}
  else if(e.code==='Enter'){trySpray();}
});

function laneGeom(){
  const n=player.length;
  const margin=60;
  const laneW=(W-2*margin)/n;
  return {margin,laneW,n};
}

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  handlePointer(mx,my);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const t=e.touches[0];
  const mx=(t.clientX-rect.left)*(W/rect.width);
  const my=(t.clientY-rect.top)*(H/rect.height);
  handlePointer(mx,my);
},{passive:false});

function handlePointer(mx,my){
  if(!started){reset();return;}
  if(gameOver){reset();return;}
  if(mx>W-160&&mx<W-20&&my>H-55&&my<H-15){trySpray();return;}
  const hullY=290,hullH=90;
  if(my>hullY&&my<hullY+hullH){
    const {margin,laneW,n}=laneGeom();
    const idx=Math.floor((mx-margin)/laneW);
    if(idx>=0&&idx<n){selected=idx;toggleLane(idx);}
  }
}

function trySpray(){
  if(locked||gameOver||!started)return;
  locked=true;
  const match=player.every((v,i)=>v===lanes[i]);
  if(match){
    score+=100+round*10;
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    SFX.success();
    flashMsg=I18N.t('perfect_mask','Perfect Mask! Spraying...');flashT=90;
    setTimeout(()=>{round++;newRound();},1300);
  } else {
    let wrong=0;
    player.forEach((v,i)=>{if(v!==lanes[i])wrong++;});
    if(wrong<=1){
      SFX.fail();
      flashMsg=I18N.t('close_mask','Almost — check for gaps/overlaps');flashT=70;
      locked=false;
    } else {
      SFX.lose();
      gameOver=true;
      flashMsg=I18N.t('ruined_paint','PAINT RUINED! Pattern mismatch')
      flashT=200;
    }
  }
}

function drawTemplate(){
  const y=60,h=90;
  ctx.fillStyle='#9fd8ff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('design_template','DESIGN TEMPLATE'),W/2,38);
  const {margin,laneW,n}=laneGeom();
  ctx.fillStyle='#1c3a4a';ctx.fillRect(margin-10,y,W-2*margin+20,h);
  for(let i=0;i<n;i++){
    const x=margin+i*laneW;
    ctx.fillStyle=lanes[i]?'#e8c74a':'#2a4a5c';
    ctx.fillRect(x+2,y+6,laneW-4,h-12);
    ctx.strokeStyle='#0a1620';ctx.lineWidth=1;ctx.strokeRect(x+2,y+6,laneW-4,h-12);
  }
  ctx.strokeStyle='#7fd8ff';ctx.lineWidth=2;ctx.strokeRect(margin-10,y,W-2*margin+20,h);
}

function drawHull(){
  const hullY=290,hullH=90;
  // boat body background
  ctx.fillStyle='#d6dadd';
  ctx.beginPath();
  ctx.moveTo(60,hullY-10);
  ctx.quadraticCurveTo(W/2,hullY-30,W-60,hullY-10);
  ctx.lineTo(W-60,hullY+hullH+10);
  ctx.quadraticCurveTo(W/2,hullY+hullH+30,60,hullY+hullH+10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#8fa3ad';ctx.lineWidth=2;ctx.stroke();

  ctx.fillStyle='#9fd8ff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('your_masking','YOUR MASKING'),W/2,hullY-22);

  const {margin,laneW,n}=laneGeom();
  for(let i=0;i<n;i++){
    const x=margin+i*laneW;
    ctx.fillStyle=player[i]?'#e8c74a':'#aebcc4';
    ctx.fillRect(x+2,hullY+6,laneW-4,hullH-12);
    if(player[i]){
      // tape texture lines
      ctx.strokeStyle='rgba(120,90,10,0.3)';ctx.lineWidth=1;
      for(let yy=hullY+10;yy<hullY+hullH-6;yy+=6){
        ctx.beginPath();ctx.moveTo(x+4,yy);ctx.lineTo(x+laneW-4,yy);ctx.stroke();
      }
    }
    ctx.strokeStyle=i===selected&&!gameOver?'#ffd54f':'#5a6a72';
    ctx.lineWidth=i===selected&&!gameOver?3:1;
    ctx.strokeRect(x+2,hullY+6,laneW-4,hullH-12);
  }
  ctx.strokeStyle='#7fd8ff';ctx.lineWidth=2;ctx.strokeRect(margin-10,hullY,W-2*margin+20,hullH);
}

function drawButton(){
  ctx.fillStyle=locked?'#555':'#1a7fb0';
  ctx.fillRect(W-160,H-55,140,40);
  ctx.strokeStyle='#7fd8ff';ctx.lineWidth=2;ctx.strokeRect(W-160,H-55,140,40);
  ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('spray_it','SPRAY IT (Enter)'),W-90,H-30);
}

function drawTimer(){
  const pct=Math.max(0,timeLeft/timeTotal);
  ctx.fillStyle='#0d2430';ctx.fillRect(20,H-45,220,20);
  ctx.fillStyle=pct>0.3?'#38d976':'#e94560';
  ctx.fillRect(20,H-45,220*pct,20);
  ctx.strokeStyle='#7fd8ff';ctx.strokeRect(20,H-45,220,20);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('mask_timer','MASKING TIME'),20,H-50);
}

let lastT=null;
function loop(now){
  if(lastT===null)lastT=now;
  const dt=Math.min((now-lastT)/1000,0.1);
  lastT=now;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0e2030');bg.addColorStop(1,'#0a1620');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#7fd8ff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Press Space/Enter to Start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  drawTemplate();
  drawHull();
  drawButton();
  drawTimer();

  if(!locked&&!gameOver){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;
      SFX.lose();
      gameOver=true;
      flashMsg=I18N.t('time_up_mask','TIME UP! Paint job ruined');flashT=200;
    }
  }

  if(flashT>0){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(0.6,flashT/150)})`;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=gameOver?'#e94560':'#38d976';
    ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H/2);
    if(gameOver){
      ctx.font='18px Arial';ctx.fillStyle='#fff';
      ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+40);
    }
    flashT--;
  }

  document.getElementById('score-display').textContent=
    I18N.t('mask_status','Round: {r} | Score: {s} | Hi: {h}').replace('{r}',round).replace('{s}',score).replace('{h}',hi);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
