e trapped, across more intricate deck shapes each round. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/skateboarddeckgripapplication","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>

<style>
body{background:#08080f}
#c{background:#3b2a1d;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8c468;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Skateboard Deck Grip Application</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag the squeegee (or use <b>Arrow Keys</b>) and sweep from the center of the deck outward, inside the glowing safe-pressure ring, to pop every trapped air bubble out of the grip tape before you run out of passes. Too much pressure tears the tape!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const KEY='skateboarddeckgripapplication_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let round=1,passesLeft=0,maxPasses=0,gameOver=false,won=false,started=false;
let deck,bubbles,squeegee,trail;
let keys={};

function deckShapeAt(cx,hw,hh,t){
  // t in [0,1] along length, returns half-width multiplier for nose/tail taper
  const edge=0.12;
  if(t<edge)return 0.55+0.45*(t/edge);
  if(t>1-edge)return 0.55+0.45*((1-t)/edge);
  return 1;
}

function makeDeck(roundNum){
  const cx=W/2, cy=H/2;
  const length=320, width=90+Math.min(roundNum*2,20);
  const notches = Math.min(2+Math.floor(roundNum/2),6); // more intricate shape each round
  return {cx,cy,length,width,notches};
}

function pointInDeck(px,py){
  const d=deck;
  const dx=px-d.cx, dy=py-d.cy;
  // rotate none, deck long axis = x
  const t=(dx+d.length/2)/d.length;
  if(t<0||t>1)return false;
  const mult=deckShapeAt(0,0,0,t);
  const hw=(d.width/2)*mult;
  return Math.abs(dy)<=hw;
}

function spawnBubbles(roundNum){
  const n=4+roundNum; // more bubbles as rounds increase
  const arr=[];
  let tries=0;
  while(arr.length<n && tries<2000){
    tries++;
    const x=deck.cx-deck.length/2+20+Math.random()*(deck.length-40);
    const y=deck.cy-deck.width/2+10+Math.random()*(deck.width-20);
    if(!pointInDeck(x,y))continue;
    const r=8+Math.random()*10;
    let overlap=false;
    for(const b of arr){if(Math.hypot(b.x-x,b.y-y)<r+b.r+6){overlap=true;break;}}
    if(overlap)continue;
    arr.push({x,y,r,popped:false});
  }
  return arr;
}

function resetRound(){
  deck=makeDeck(round);
  bubbles=spawnBubbles(round);
  maxPasses=14+round*2;
  passesLeft=maxPasses;
  squeegee={x:deck.cx,y:deck.cy,r:26};
  trail=[];
  gameOver=false;won=false;
}

function newGame(){round=1;resetRound();started=false;}

function torn(){ // if pressure zone exceeded center bound too long -> tear deck
}

let drag=false;
function toCanvasCoords(evt){
  const rect=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-rect.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-rect.top;
  return {x:cx*(W/rect.width), y:cy*(H/rect.height)};
}

c.addEventListener('mousedown',e=>{started=true;drag=true;moveSqueegeeTo(toCanvasCoords(e));});
c.addEventListener('mousemove',e=>{if(drag)moveSqueegeeTo(toCanvasCoords(e));});
window.addEventListener('mouseup',()=>drag=false);
c.addEventListener('touchstart',e=>{e.preventDefault();started=true;drag=true;moveSqueegeeTo(toCanvasCoords(e));},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(drag)moveSqueegeeTo(toCanvasCoords(e));},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();drag=false;},{passive:false});
c.addEventListener('click',()=>{ if(gameOver){ if(won){round++;resetRound();}else{newGame();} } });

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  started=true;
  if(e.code==='Enter'||e.code==='Space'){ if(gameOver){ if(won){round++;resetRound();}else{newGame();} } }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let lastSqueegee={x:deck?deck.cx:400,y:deck?deck.cy:210};
function moveSqueegeeTo(p){
  if(gameOver)return;
  lastSqueegee={x:squeegee.x,y:squeegee.y};
  squeegee.x=p.x;squeegee.y=p.y;
  processSweep();
}

function processSweep(){
  // distance moved this step consumes "pass budget" proportionally to how far from center it travels relative to safe ring
  const d=Math.hypot(squeegee.x-deck.cx,squeegee.y-deck.cy);
  const safeMax=deck.length/2*0.95;
  trail.push({x:squeegee.x,y:squeegee.y,age:0});
  if(trail.length>60)trail.shift();
  // pop bubbles under squeegee if within safe radius travel (sweeping from center outward)
  let popped=false;
  for(const b of bubbles){
    if(b.popped)continue;
    if(Math.hypot(b.x-squeegee.x,b.y-squeegee.y)<squeegee.r*0.75 && d<=safeMax){
      b.popped=true;popped=true;SFX.point();
    }
  }
  if(popped){
    passesLeft-=0.3; // efficient pop costs little
  } else {
    const moveDist=Math.hypot(squeegee.x-lastSqueegee.x,squeegee.y-lastSqueegee.y);
    if(moveDist>2)passesLeft-=0.15;
  }
  if(d>safeMax){
    // tearing the tape - leaving the deck edge too hard
    passesLeft-=0.6;
  }
  checkEnd();
}

function checkEnd(){
  if(bubbles.every(b=>b.popped)){
    gameOver=true;won=true;
    SFX.success();
    if(round>hi){hi=round;localStorage.setItem(KEY,String(hi));SFX.levelup();}
  } else if(passesLeft<=0){
    gameOver=true;won=false;
    SFX.fail();
  }
}

function drawDeck(){
  const d=deck;
  ctx.save();
  ctx.translate(d.cx,d.cy);
  // deck body with simple nose/tail curve approximation via polygon
  ctx.beginPath();
  const steps=40;
  const pts=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const x=-d.length/2+t*d.length;
    const mult=deckShapeAt(0,0,0,t);
    pts.push([x,-(d.width/2)*mult]);
  }
  for(let i=steps;i>=0;i--){
    const t=i/steps;
    const x=-d.length/2+t*d.length;
    const mult=deckShapeAt(0,0,0,t);
    pts.push([x,(d.width/2)*mult]);
  }
  pts.forEach(([x,y],i)=>{ if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.closePath();
  const grad=ctx.createLinearGradient(-d.length/2,0,d.length/2,0);
  grad.addColorStop(0,'#caa368');grad.addColorStop(0.5,'#e8c99a');grad.addColorStop(1,'#caa368');
  ctx.fillStyle=grad;
  ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle='#5a3d22';ctx.stroke();
  // wood grain lines
  ctx.strokeStyle='rgba(90,61,34,0.25)';ctx.lineWidth=1.5;
  for(let gy=-d.width/2+8;gy<d.width/2;gy+=9){
    ctx.beginPath();ctx.moveTo(-d.length/2+10,gy);ctx.lineTo(d.length/2-10,gy);ctx.stroke();
  }
  ctx.restore();

  // safe pressure ring
  const safeMax=d.length/2*0.95;
  ctx.beginPath();
  ctx.ellipse(d.cx,d.cy,safeMax,d.width/2+14,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(126,200,255,0.5)';
  ctx.setLineDash([8,6]);
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBubbles(){
  for(const b of bubbles){
    if(b.popped)continue;
    const grad=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,2,b.x,b.y,b.r);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.5,'rgba(200,230,255,0.55)');
    grad.addColorStop(1,'rgba(150,190,220,0.25)');
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.5;ctx.stroke();
  }
}

function drawTrail(){
  ctx.strokeStyle='rgba(255,230,120,0.35)';
  ctx.lineWidth=squeegee.r*1.6;
  ctx.lineCap='round';
  ctx.beginPath();
  trail.forEach((p,i)=>{ if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.stroke();
}

function drawSqueegee(){
  ctx.save();
  ctx.translate(squeegee.x,squeegee.y);
  ctx.fillStyle='#ff6b35';
  ctx.beginPath();ctx.roundRect(-squeegee.r,-10,squeegee.r*2,20,6);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(-6,-28,12,20);
  ctx.restore();
}

function handleKeyMove(dt){
  if(gameOver||drag)return;
  if(!started)return;
  const spd=5*dt;
  let moved=false;
  if(keys['ArrowLeft']){squeegee.x-=spd;moved=true;}
  if(keys['ArrowRight']){squeegee.x+=spd;moved=true;}
  if(keys['ArrowUp']){squeegee.y-=spd;moved=true;}
  if(keys['ArrowDown']){squeegee.y+=spd;moved=true;}
  if(moved){lastSqueegee={x:squeegee.x,y:squeegee.y};processSweep();}
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  handleKeyMove(dt);

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a1410');bg.addColorStop(1,'#2a1f16');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawDeck();
  drawTrail();
  drawBubbles();
  if(!gameOver)drawSqueegee();

  const remaining=bubbles.filter(b=>!b.popped).length;
  document.getElementById('score-display').textContent=
    I18N.t('grip_status','Round: {r} | Bubbles left: {b} | Passes: {p} | Hi: {h}')
      .replace('{r}',round).replace('{b}',remaining).replace('{p}',Math.max(0,Math.ceil(passesLeft))).replace('{h}',hi);

  if(!started){
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('grip_start','Drag or use arrows to start smoothing'),W/2,40);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(won?I18N.t('grip_win','GRIP APPLIED!'):I18N.t('grip_lose','TAPE RUINED'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('grip_continue','Click or press Enter to continue'),W/2,H/2+26);
  }

  requestAnimationFrame(loop);
}
newGame();
loop();
</script></body></html>
