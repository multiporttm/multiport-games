<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#37474f,#90a4ae);display:block;border-radius:8px;touch-action:none}
#score-display{color:#eceff1;background:#263238;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
#touch-controls{display:flex;justify-content:center;gap:20px;margin-top:10px}
#touch-controls button{width:90px;height:56px;font-size:1.3rem;font-weight:900;border:none;border-radius:10px;background:#546e7a;color:#fff;cursor:pointer}
#touch-controls button:active{background:#37474f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Weightlifting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Best Lift: 0 kg</div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="touch-controls">
      <button id="btnL">L</button>
      <button id="btnR">R</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b> and <b>Right Arrow</b> (or tap the <b>L</b>/<b>R</b> buttons) rapidly to lift the barbell up the meter. Once it reaches the top, hold a steady rhythm to survive the <b>lockout</b> — mash too fast and the bar wobbles out of control!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
let hiWeight=parseFloat(localStorage.getItem('weightlifting_hiweight')||'0')||0;
let hiScore=parseFloat(localStorage.getItem('weightlifting_hiscore')||'0')||0;

let weight,liftProgress,wobble,lastKey,phase,score,lockoutTimer,lockoutNeeded,liftTimeLeft,gameOver,failMsg,attempt;

function newAttempt(){
  attempt=(attempt||0)+1;
  weight=20+attempt*15;
  liftProgress=0;
  wobble=0;
  lastKey=null;
  phase='lift'; // lift -> lockout -> success/fail
  lockoutTimer=0;
  lockoutNeeded=90;
  liftTimeLeft=420;
  failMsg=null;
}

function reset(){
  score=0;
  attempt=0;
  gameOver=false;
  newAttempt();
}
reset();

function press(side){
  if(gameOver){reset();return;}
  if(phase==='lift'){
    if(side===lastKey){
      // pressing same side in a row - less efficient, small wobble
      wobble+=4;
      SFX.error();
    }else{
      lastKey=side;
      const resistance=weight/40;
      liftProgress+=Math.max(1.5,7-resistance);
      wobble=Math.max(0,wobble-1);
      SFX.click();
      if(liftProgress>=100){
        liftProgress=100;
        phase='lockout';
        SFX.point();
      }
    }
  }else if(phase==='lockout'){
    if(side===lastKey){
      wobble+=6; // mashing same side during lockout destabilizes
    }else{
      lastKey=side;
      wobble=Math.max(0,wobble-3);
      lockoutTimer+=6;
    }
    SFX.click();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();press('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();press('R');}
});
document.getElementById('btnL').addEventListener('touchstart',e=>{e.preventDefault();press('L');},{passive:false});
document.getElementById('btnR').addEventListener('touchstart',e=>{e.preventDefault();press('R');},{passive:false});
document.getElementById('btnL').addEventListener('mousedown',()=>press('L'));
document.getElementById('btnR').addEventListener('mousedown',()=>press('R'));
c.addEventListener('click',()=>{ if(gameOver)reset(); });
c.addEventListener('touchstart',e=>{ if(gameOver){e.preventDefault();reset();} },{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('wl_score_label','Score: {s} | Best Lift: {w} kg')
      .replace('{s}',Math.floor(score))
      .replace('{w}',Math.floor(hiWeight));
}

function drawBarbell(barY,plateSize){
  ctx.save();
  const shakeX=(Math.random()-0.5)*wobble*0.6;
  ctx.translate(shakeX,0);
  ctx.strokeStyle='#78909c';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(220,barY);ctx.lineTo(580,barY);ctx.stroke();
  ctx.fillStyle='#263238';
  ctx.fillRect(210,barY-plateSize/2,20,plateSize);
  ctx.fillRect(570,barY-plateSize/2,20,plateSize);
  ctx.fillStyle='#37474f';
  ctx.fillRect(180,barY-plateSize/2-6,26,plateSize+12);
  ctx.fillRect(594,barY-plateSize/2-6,26,plateSize+12);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#37474f');grad.addColorStop(1,'#90a4ae');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // platform
  ctx.fillStyle='#455a64';ctx.fillRect(150,270,500,30);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wl_over_title','LIFT FAILED'),W/2,110);
    ctx.font='18px Arial';
    ctx.fillText(failMsg||'',W/2,145);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,175);
    updateScoreDisplay();
    requestAnimationFrame(loop);return;
  }

  // barbell height based on progress or lockout hold
  const barY=270-Math.min(liftProgress,100)*1.5;
  const plateSize=40+Math.min(60,weight*0.5);
  drawBarbell(barY,plateSize);

  // resistance meter
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(30,40,30,220);
  ctx.fillStyle='#ffca28';
  ctx.fillRect(30,40+220*(1-liftProgress/100),30,220*(liftProgress/100));
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(30,40,30,220);

  // wobble meter
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(740,40,30,220);
  ctx.fillStyle=wobble>60?'#e53935':'#66bb6a';
  ctx.fillRect(740,40+220*(1-Math.min(wobble,100)/100),30,220*(Math.min(wobble,100)/100));
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(740,40,30,220);

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('wl_lift_meter','LIFT'),45,32);
  ctx.fillText(I18N.t('wl_wobble_meter','WOBBLE'),755,32);

  ctx.font='bold 22px Arial';
  ctx.fillText(I18N.t('wl_weight_label','{w} kg').replace('{w}',weight),W/2,40);

  if(phase==='lift'){
    liftTimeLeft-=1;
    ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('wl_lift_hint','Alternate L/R to lift!'),W/2,220);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(300,235,200,14);
    ctx.fillStyle=liftTimeLeft<120?'#e53935':'#42a5f5';
    ctx.fillRect(300,235,200*Math.max(0,liftTimeLeft/420),14);
    ctx.strokeStyle='#fff';ctx.strokeRect(300,235,200,14);
    if(liftTimeLeft<=0){
      gameOver=true;
      failMsg=I18N.t('wl_tootime','Too slow — the bar never left the platform!');
      SFX.lose();
    }
  }else if(phase==='lockout'){
    // lockout decay - wobble slowly rises if idle, drift needs constant alternation
    wobble+=0.15;
    ctx.font='bold 20px Arial';
    ctx.fillStyle='#ffd54f';
    ctx.fillText(I18N.t('wl_lockout_hint','LOCKOUT! Keep alternating steadily!'),W/2,220);
    // lockout progress bar
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(300,235,200,14);
    ctx.fillStyle='#4caf50';ctx.fillRect(300,235,200*Math.min(1,lockoutTimer/lockoutNeeded),14);
    ctx.strokeStyle='#fff';ctx.strokeRect(300,235,200,14);

    if(wobble>=100){
      gameOver=true;
      failMsg=I18N.t('wl_dropped','You dropped the bar!');
      SFX.lose();
    }else if(lockoutTimer>=lockoutNeeded){
      // success!
      const gained=weight*2;
      score+=gained;
      if(score>hiScore){hiScore=score;localStorage.setItem('weightlifting_hiscore',hiScore);}
      if(weight>hiWeight){hiWeight=weight;localStorage.setItem('weightlifting_hiweight',hiWeight);}
      SFX.success();
      newAttempt();
    }
  }

  // wobble also decays slowly during lift phase if inactive too long — keep simple
  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
