<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a6fa5;display:block;border-radius:8px;touch-action:none}
#hud{color:#fff;font-size:1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">River Rafting</div>
  <div class="game-frame">
    <div id="hud">Round <span id="roundNum">1</span> | Gates: <span id="gatesLabel">0</span>/<span id="gatesTotal">8</span> | Time: <span id="timeLabel">0.0</span>s | Best: <span id="bestLabel">-</span></div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b>, or <b>drag</b> on mobile, to steer your raft down the rushing river. <b>Click</b> or <b>Tap</b> for a paddle burst of speed. Pass through the yellow gates, dodge the rocks, and survive — the rapids get more turbulent each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let round=1,best=parseInt(localStorage.getItem('riverrafting_best')||'0')||0;
document.getElementById('bestLabel').textContent=best||'-';

let raft,rocks,gates,scrollY,gatesPassed,gatesTotal,elapsed,state,keys,dragX,turbulence,shakeT,lastSuccess;

function genCourse(){
  rocks=[];gates=[];
  const segLen=4200-round*150;
  gatesTotal=8+round;
  document.getElementById('gatesTotal').textContent=gatesTotal;
  for(let i=0;i<gatesTotal;i++){
    const y=400+i*(segLen/gatesTotal);
    const gx=60+Math.random()*(W-180);
    gates.push({y,x1:gx,x2:gx+90,passed:false});
  }
  const rockCount=18+round*6;
  for(let i=0;i<rockCount;i++){
    rocks.push({x:30+Math.random()*(W-60),y:300+Math.random()*(segLen-100),r:14+Math.random()*14});
  }
}

function resetRound(){
  raft={x:W/2,y:120,w:34,h:50,vx:0};
  scrollY=0;gatesPassed=0;elapsed=0;state='countdown';keys={};dragX=null;
  turbulence=0.6+round*0.35;shakeT=0;
  genCourse();
  document.getElementById('roundNum').textContent=round;
  document.getElementById('gatesLabel').textContent='0';
  document.getElementById('timeLabel').textContent='0.0';
}
resetRound();

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space')paddleBurst();
  if(state==='over')nextRound();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  dragX=(e.clientX-r.left)*(W/r.width);
  if(state==='over'){nextRound();return;}
  paddleBurst();
});
c.addEventListener('pointermove',e=>{
  if(dragX===null)return;
  const r=c.getBoundingClientRect();
  dragX=(e.clientX-r.left)*(W/r.width);
});
window.addEventListener('pointerup',()=>{dragX=null;});

let burstT=0;
function paddleBurst(){
  if(state!=='racing')return;
  burstT=0.35;
  SFX.swoosh();
}

function nextRound(){
  round++;
  resetRound();
}
function restartAll(){
  round=1;
  resetRound();
}

function rectHitCircle(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function update(dt){
  if(state==='countdown'){
    elapsed+=dt;
    if(elapsed>1.2){state='racing';elapsed=0;}
    return;
  }
  if(state!=='racing')return;
  elapsed+=dt;
  burstT=Math.max(0,burstT-dt);

  let targetVx=0;
  if(keys['ArrowLeft']||keys['KeyA'])targetVx=-4.5;
  if(keys['ArrowRight']||keys['KeyD'])targetVx=4.5;
  if(dragX!==null){
    const diff=dragX-raft.x;
    targetVx=Math.max(-6,Math.min(6,diff*0.15));
  }
  // river current turbulence pushes raft randomly
  const drift=Math.sin(scrollY*0.01+round)*turbulence;
  raft.vx+=(targetVx-raft.vx)*0.2;
  raft.x+=raft.vx+drift*dt*30;
  raft.x=Math.max(20,Math.min(W-20,raft.x));

  let speed=180+(burstT>0?260:0);
  scrollY+=speed*dt;

  // check gate pass
  gates.forEach(g=>{
    const gy=g.y-scrollY;
    if(!g.passed&&gy<raft.y+8&&gy>raft.y-8){
      g.passed=true;
      if(raft.x>g.x1&&raft.x<g.x2){
        gatesPassed++;
        SFX.point();
        document.getElementById('gatesLabel').textContent=gatesPassed;
      } else {
        SFX.hit();
        shakeT=0.3;
      }
    }
  });

  rocks.forEach(r=>{
    const ry=r.y-scrollY;
    if(ry>-40&&ry<H+40&&rectHitCircle(raft.x-raft.w/2,raft.y-raft.h/2,raft.w,raft.h,r.x,ry,r.r-4)){
      endRound(false);
    }
  });

  if(scrollY>gates[gates.length-1].y+250){
    endRound(true);
  }

  document.getElementById('timeLabel').textContent=elapsed.toFixed(1);
}

function endRound(success){
  state='over';
  lastSuccess=success;
  if(success){
    SFX.win();
    const scoreVal=gatesPassed*100+Math.max(0,3000-Math.floor(elapsed*10));
    if(scoreVal>best){best=scoreVal;localStorage.setItem('riverrafting_best',best);document.getElementById('bestLabel').textContent=best;}
  } else {
    SFX.lose();
    round=1; // wiped out — restart progression from round 1
  }
}

function drawRaft(){
  ctx.save();
  ctx.translate(raft.x,raft.y);
  ctx.rotate(raft.vx*0.03);
  ctx.fillStyle='#c99b5e';
  ctx.beginPath();
  ctx.ellipse(0,0,raft.w/2,raft.h/2,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#8a6238';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.arc(0,-4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';
  ctx.fillRect(-2,10,4,20);
  ctx.restore();
}

function draw(){
  ctx.save();
  if(shakeT>0){
    shakeT-=1/60;
    ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
  }
  ctx.clearRect(-10,-10,W+20,H+20);
  const water=ctx.createLinearGradient(0,0,0,H);
  water.addColorStop(0,'#2196c9');water.addColorStop(1,'#0d5c8a');
  ctx.fillStyle=water;ctx.fillRect(0,0,W,H);
  // ripple lines
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const y=((i*70-scrollY*1.5)%(H+70)+(H+70))%(H+70)-35;
    ctx.beginPath();
    for(let x=0;x<=W;x+=20){
      const yy=y+Math.sin(x*0.05+scrollY*0.02)*6;
      x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  // rocks
  rocks.forEach(r=>{
    const ry=r.y-scrollY;
    if(ry<-40||ry>H+40)return;
    ctx.fillStyle='#6d5849';
    ctx.beginPath();ctx.arc(r.x,ry,r.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a7361';
    ctx.beginPath();ctx.arc(r.x-r.r*0.3,ry-r.r*0.3,r.r*0.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,ry,r.r+4,0,Math.PI*2);ctx.stroke();
  });
  // gates
  gates.forEach(g=>{
    const gy=g.y-scrollY;
    if(gy<-30||gy>H+30)return;
    ctx.strokeStyle=g.passed?'rgba(255,213,79,0.4)':'#ffd54f';
    ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(g.x1,gy);ctx.lineTo(g.x1,gy-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(g.x2,gy);ctx.lineTo(g.x2,gy-2);ctx.stroke();
    ctx.fillStyle=g.passed?'rgba(255,213,79,0.35)':'#ffd54f';
    ctx.fillRect(g.x1-4,gy-4,8,8);
    ctx.fillRect(g.x2-4,gy-4,8,8);
    ctx.strokeStyle=g.passed?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.6)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(g.x1,gy);ctx.lineTo(g.x2,gy);ctx.stroke();
  });
  drawRaft();

  if(state==='countdown'){
    ctx.fillStyle='#fff';ctx.font='bold 44px Arial';ctx.textAlign='center';
    const n=Math.max(1,3-Math.floor(elapsed/0.4));
    ctx.fillText(I18N.t('get_ready',n>0?String(n):'GO!'),W/2,H/2);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(lastSuccess? I18N.t('run_complete','Run Complete!') : I18N.t('capsized','Capsized!'), W/2,H/2-24);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('gates_passed','Gates passed: {g}/{t}').replace('{g}',gatesPassed).replace('{t}',gatesTotal),W/2,H/2+10);
    ctx.fillText(I18N.t('tap_next','Tap / press any key to continue'),W/2,H/2+40);
  }
  ctx.restore();
}

let last=null;
function loop(t){
  if(last===null)last=t;
  const dt=Math.min((t-last)/1000,0.05);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
