<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d1b2a,#43a047);display:block;border-radius:8px;touch-action:none}
#score-display{color:#a5d6a7;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Alien Abduction</div>
  <div class="game-frame">
    <div id="score-display">Abducted: 0 | Best: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b> or <b>touch-drag</b> to move the UFO. Hold <b>Space</b> or tap and hold over an animal to beam it up. Don't linger too long — the farmer will show up and shoot at you!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
let hi=parseInt(localStorage.getItem('alienabduction_hi')||'0',10);
let abducted=0,lives=3,gameOver=false,started=false;
const ufo={x:W/2,y:80,r:26,speed:3};
let keys={};
let beaming=false;
let animals=[];
let farmer=null;
let lingerTimer=0,lastX=ufo.x,lastY=ufo.y;
let bullets=[];
let spawnTimer=0;

function reset(){
  abducted=0;lives=3;gameOver=false;
  ufo.x=W/2;ufo.y=80;
  animals=[];farmer=null;bullets=[];
  lingerTimer=0;
  for(let i=0;i<6;i++)spawnAnimal();
}

function spawnAnimal(){
  const types=['cow','sheep','pig'];
  animals.push({
    x:60+Math.random()*(W-120),
    y:350+Math.random()*100,
    type:types[Math.floor(Math.random()*types.length)],
    beamProgress:0,
    abductedFlag:false
  });
}

function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('abducted_best_lives_label','Abducted: {a} | Best: {b} | Lives: {l}').replace('{a}',abducted).replace('{b}',hi).replace('{l}',Math.max(0,lives));
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(!started)started=true;
  if(k===' ')beaming=true;
  if(gameOver&&(k===' '||k==='enter')){gameOver=false;reset();}
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys[k]=false;
  if(k===' ')beaming=false;
});

let touchStart=null,touchActive=false;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started)started=true;
  if(gameOver){gameOver=false;reset();return;}
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  touchStart={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
  touchActive=true;
  beaming=true;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!touchActive)return;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  const cur={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
  const dx=cur.x-touchStart.x,dy=cur.y-touchStart.y;
  ufo.x+=dx*0.25;ufo.y+=dy*0.25;
  touchStart=cur;
},{passive:false});
c.addEventListener('touchend',()=>{touchActive=false;beaming=false;});
c.addEventListener('mousedown',()=>{
  if(!started){started=true;return;}
  if(gameOver){gameOver=false;reset();return;}
  beaming=true;
});
c.addEventListener('mouseup',()=>{beaming=false;});
c.addEventListener('mouseleave',()=>{beaming=false;});

function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}

function drawUfo(){
  ctx.save();
  ctx.fillStyle='#90a4ae';
  ctx.beginPath();ctx.ellipse(ufo.x,ufo.y,ufo.r,ufo.r*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.arc(ufo.x,ufo.y-8,12,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffee58';
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.arc(ufo.x+i*16,ufo.y+4,3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(beaming){
    ctx.fillStyle='rgba(255,241,118,0.25)';
    ctx.beginPath();
    ctx.moveTo(ufo.x-12,ufo.y+8);
    ctx.lineTo(ufo.x+12,ufo.y+8);
    ctx.lineTo(ufo.x+55,H);
    ctx.lineTo(ufo.x-55,H);
    ctx.closePath();ctx.fill();
  }
}

function drawAnimal(a){
  if(a.abductedFlag)return;
  const colors={cow:'#fff',sheep:'#eee',pig:'#f8bbd0'};
  ctx.fillStyle=colors[a.type];
  ctx.beginPath();ctx.ellipse(a.x,a.y,16,11,0,0,Math.PI*2);ctx.fill();
  if(a.type==='cow'){
    ctx.fillStyle='#3e2723';
    ctx.beginPath();ctx.arc(a.x-6,a.y-3,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(a.x+5,a.y+4,3,0,Math.PI*2);ctx.fill();
  }
  if(a.beamProgress>0){
    ctx.strokeStyle='#ffee58';ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(a.x,a.y,20,-Math.PI/2,-Math.PI/2+Math.PI*2*(a.beamProgress/100));
    ctx.stroke();
  }
}

function drawFarmer(f){
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(f.x-10,f.y-20,20,30);
  ctx.fillStyle='#ffcc80';
  ctx.beginPath();ctx.arc(f.x,f.y-26,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8d6e63';
  ctx.fillRect(f.x-14,f.y-32,28,6);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1b2a');bg.addColorStop(0.4,'#1b3a2a');bg.addColorStop(1,'#43a047');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // field rows
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  for(let y=320;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(!started){
    ctx.fillStyle='#c8e6c9';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('alien_start_hint','Move / Tap to begin abducting'),W/2,H/2);
    drawUfo();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  // movement
  let dx=0,dy=0;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  const len=Math.hypot(dx,dy)||1;
  if(len>0.1){ufo.x+=(dx/len)*ufo.speed*2.2;ufo.y+=(dy/len)*ufo.speed*2.2;}
  ufo.x=Math.max(ufo.r,Math.min(W-ufo.r,ufo.x));
  ufo.y=Math.max(ufo.r,Math.min(280,ufo.y));

  // linger tracking (farmer shows up if UFO stays near same spot too long while beaming)
  if(beaming&&dist(ufo.x,ufo.y,lastX,lastY)<3){
    lingerTimer++;
  } else {
    lingerTimer=Math.max(0,lingerTimer-2);
  }
  lastX=ufo.x;lastY=ufo.y;

  if(lingerTimer>150&&!farmer){
    farmer={x:Math.max(20,Math.min(W-20,ufo.x+(Math.random()<0.5?-80:80))),y:H-20,cd:60};
  }

  if(farmer){
    farmer.cd--;
    if(farmer.cd<=0){
      const dxs=ufo.x-farmer.x,dys=(ufo.y-30)-(farmer.y-20);
      const d=Math.hypot(dxs,dys)||1;
      bullets.push({x:farmer.x,y:farmer.y-30,vx:dxs/d*5,vy:dys/d*5});
      SFX.click();
      farmer.cd=70;
    }
  }

  // spawn new animals occasionally
  spawnTimer++;
  if(spawnTimer>200&&animals.filter(a=>!a.abductedFlag).length<8){
    spawnTimer=0;
    spawnAnimal();
  }

  // beam logic
  let anyBeaming=false;
  animals.forEach(a=>{
    if(a.abductedFlag)return;
    const beamHitX=Math.abs(a.x-ufo.x)<55*((a.y-ufo.y-8)/(H-ufo.y-8));
    const underBeam=beaming&&a.y>ufo.y&&Math.abs(a.x-ufo.x)<55*Math.max(0.15,(a.y-ufo.y)/(H-ufo.y));
    if(underBeam){
      a.beamProgress+=1.2;
      anyBeaming=true;
      if(a.beamProgress>=100){
        a.abductedFlag=true;
        abducted++;
        SFX.powerup();
        if(abducted>hi){hi=abducted;localStorage.setItem('alienabduction_hi',String(hi));}
      }
    } else {
      a.beamProgress=Math.max(0,a.beamProgress-2);
    }
  });
  if(!anyBeaming)lingerTimer=Math.max(0,lingerTimer-1);

  // bullets
  bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  bullets.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(dist(b.x,b.y,ufo.x,ufo.y)<ufo.r){
      b.x=-999;
      lives--;
      SFX.hurt();
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });

  // remove farmer after a while if UFO moves away
  if(farmer&&dist(ufo.x,ufo.y,farmer.x,farmer.y)>300){
    farmer=null;lingerTimer=0;
  }

  // draw
  animals.forEach(drawAnimal);
  if(farmer)drawFarmer(farmer);
  ctx.fillStyle='#e53935';
  bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();});
  drawUfo();

  if(lingerTimer>90&&lingerTimer<=150){
    ctx.fillStyle='#ffca28';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('farmer_warning_msg','Careful — the farmer is coming!'),W/2,30);
  }

  updateHud();
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
