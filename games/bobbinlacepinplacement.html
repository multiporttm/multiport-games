<style>
body{background:#08080f}
#c{background:#f4ecd8;display:block;border-radius:8px;touch-action:none;cursor:crosshair;margin:0 auto}
#hud{color:#5a3e2b;background:#fffaf0;border-radius:10px;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;max-width:600px;margin:0 auto 8px}
.lives{letter-spacing:2px;color:#c0392b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bobbin Lace Pin Placement</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud">
      <span id="roundDisp">Round: 1</span>
      <span id="scoreDisp">Score: 0</span>
      <span id="hiDisp">Hi: 0</span>
      <span class="lives" id="livesDisp">●●●</span>
    </div>
    <canvas id="c" width="600" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>pricking pattern</b> dots glowing on the lace pillow, then click or tap each marked position <b>in order</b> to push a pin in. Use <b>Arrow Keys + Enter</b> or <b>Tap</b>. One pin placed off-target costs a life — patterns grow more intricate each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='bobbinlacepinplacement_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let round=1,score=0,lives=3,gameOver=false,started=false;
let grid,targets,placed,selR,selC,flashTimer=0,flashOk=null,shakeTimer=0;
let margin=50,cell=0,cols=0,rows=0;

function setupRound(){
  cols=Math.min(4+Math.floor((round-1)/1),9);
  rows=Math.min(3+Math.floor((round-1)/2),7);
  cell=Math.min((600-margin*2)/(cols-1),(420-margin*2)/(rows-1));
  const count=Math.min(4+round,cols*rows-1);
  const all=[];
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)all.push([r,col]);
  // shuffle
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  targets=all.slice(0,count);
  placed=[];
  selR=0;selC=0;
  flashTimer=0;flashOk=null;
}

function reset(){round=1;score=0;lives=3;gameOver=false;started=false;setupRound();}
reset();

function cellXY(r,col){return [margin+col*cell, margin+r*cell];}

function nextTargetIndex(){return placed.length;}

function tryPlace(r,col){
  if(gameOver||!started)return;
  const idx=nextTargetIndex();
  if(idx>=targets.length)return;
  const [tr,tc]=targets[idx];
  if(tr===r&&tc===col){
    placed.push([r,col]);
    score+=10;
    flashTimer=16;flashOk=true;
    SFX.click();
    if(placed.length===targets.length){
      score+=30;
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
      SFX.success();
      round++;
      setTimeout(()=>{setupRound();},700);
    }
  } else {
    lives--;
    flashTimer=16;flashOk=false;shakeTimer=14;
    SFX.error();
    if(lives<=0){
      gameOver=true;
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
      SFX.lose();
    }
  }
}

function clickAt(x,y){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  let best=null,bd=1e9;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const [px,py]=cellXY(r,col);
    const d=(px-x)*(px-x)+(py-y)*(py-y);
    if(d<bd){bd=d;best=[r,col];}
  }
  if(best&&bd<(cell*cell*0.4))tryPlace(best[0],best[1]);
}

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(c.width/rect.width);
  const y=(e.clientY-rect.top)*(c.height/rect.height);
  clickAt(x,y);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=(t.clientX-rect.left)*(c.width/rect.width);
  const y=(t.clientY-rect.top)*(c.height/rect.height);
  clickAt(x,y);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();
  if(gameOver){if(e.key==='Enter'||e.key===' ')reset();return;}
  if(!started){if(e.key==='Enter'||e.key===' ')started=true;return;}
  if(e.key==='ArrowUp')selR=Math.max(0,selR-1);
  else if(e.key==='ArrowDown')selR=Math.min(rows-1,selR+1);
  else if(e.key==='ArrowLeft')selC=Math.max(0,selC-1);
  else if(e.key==='ArrowRight')selC=Math.min(cols-1,selC+1);
  else if(e.key==='Enter'||e.key===' ')tryPlace(selR,selC);
});

function isTarget(r,col){return targets.some(([tr,tc])=>tr===r&&tc===col);}
function isPlaced(r,col){return placed.some(([pr,pc])=>pr===r&&pc===col);}

function drawPillow(){
  const grad=ctx.createLinearGradient(0,0,0,420);
  grad.addColorStop(0,'#fbf3e1');grad.addColorStop(1,'#efe1c4');
  ctx.fillStyle=grad;ctx.fillRect(0,0,600,420);
  ctx.strokeStyle='#d8c7a0';ctx.lineWidth=1;
  for(let i=0;i<40;i++){
    ctx.beginPath();
    ctx.moveTo(Math.random()*600,Math.random()*420);
    ctx.lineTo(Math.random()*600,Math.random()*420);
    ctx.globalAlpha=0.04;ctx.stroke();ctx.globalAlpha=1;
  }
}

function draw(){
  let ox=0,oy=0;
  if(shakeTimer>0){ox=(Math.random()-0.5)*8;oy=(Math.random()-0.5)*8;shakeTimer--;}
  ctx.save();
  ctx.translate(ox,oy);
  drawPillow();

  // faint grid of all pricking dots
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const [x,y]=cellXY(r,col);
    ctx.beginPath();ctx.arc(x,y,3,0,7);
    ctx.fillStyle='#c9b48a';ctx.fill();
  }

  // targets glowing (not yet placed)
  const t=performance.now()/300;
  targets.forEach(([r,col],i)=>{
    if(isPlaced(r,col))return;
    const [x,y]=cellXY(r,col);
    const isNext=i===placed.length;
    const glow=isNext?(0.6+0.4*Math.sin(t)):0.35;
    ctx.beginPath();ctx.arc(x,y,isNext?10:7,0,7);
    ctx.fillStyle=isNext?`rgba(214,96,54,${glow})`:`rgba(180,140,90,${glow})`;
    ctx.fill();
    ctx.strokeStyle=isNext?'#d66036':'#b48c5a';ctx.lineWidth=2;ctx.stroke();
    if(isNext){
      ctx.fillStyle='#8a4a1f';ctx.font='bold 11px Arial';ctx.textAlign='center';
      ctx.fillText(String(i+1),x,y-16);
    }
  });

  // placed pins with thread bobbins
  placed.forEach(([r,col],i)=>{
    const [x,y]=cellXY(r,col);
    // pin
    ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x,y);
    ctx.strokeStyle='#8e8e8e';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y-16,4,0,7);
    ctx.fillStyle='#d4af37';ctx.fill();
    ctx.strokeStyle='#8a6d1d';ctx.lineWidth=1;ctx.stroke();
    // two bobbins with thread
    [-10,10].forEach(dx=>{
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+22);
      ctx.strokeStyle='#e8e0cc';ctx.lineWidth=1.3;ctx.stroke();
      ctx.beginPath();ctx.ellipse(x+dx,y+28,5,9,0,0,7);
      ctx.fillStyle='#c48b4a';ctx.fill();
      ctx.strokeStyle='#8a5c28';ctx.lineWidth=1;ctx.stroke();
    });
  });

  // selection cursor (keyboard)
  if(started&&!gameOver){
    const [x,y]=cellXY(selR,selC);
    ctx.beginPath();ctx.arc(x,y,13,0,7);
    ctx.strokeStyle='#3b6b9a';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  }

  if(flashTimer>0){
    ctx.fillStyle=flashOk?'rgba(72,160,80,0.18)':'rgba(190,50,40,0.22)';
    ctx.fillRect(0,0,600,420);
    flashTimer--;
  }

  ctx.restore();

  if(!started){
    ctx.fillStyle='rgba(20,15,5,0.55)';ctx.fillRect(0,0,600,420);
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Press Enter to Start'),300,210);
  }
  if(gameOver){
    ctx.fillStyle='rgba(20,15,5,0.6)';ctx.fillRect(0,0,600,420);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),300,190);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Press Enter to restart'),300,224);
  }

  document.getElementById('roundDisp').textContent=I18N.t('round_label','Round: {r}').replace('{r}',round);
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('hiDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
  document.getElementById('livesDisp').textContent='●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives));

  requestAnimationFrame(draw);
}
draw();
</script></body></html>
