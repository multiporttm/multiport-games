<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#5e35b1,#26c6da);display:block;border-radius:8px;touch-action:none}
#score-display{color:#d1c4e9;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Math Equation Balance</div>
  <div class="game-frame">
    <div id="score-display">Balanced: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="640" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Pick the number that balances the scale with the equation shown — press <b>1</b>-<b>4</b>, or <b>click / tap</b> a choice, before the timer runs out. A correct pick scores a point and brings a harder equation; a wrong pick or timeout costs a life.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=500;
let hi=parseInt(localStorage.getItem('mathequationbalance_hi')||'0',10);
let balanced=0,lives=3,gameOver=false,started=false;
let equationText='',target=0,choices=[],selectedIdx=-1,resultFlash=0,resultGood=false;
let timeLeft=0,timeMax=0,lastTime=null;
let roundActive=false;

function randInt(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}

function genEquation(){
  const level=balanced;
  let a,b,op,val,text;
  const ops=level<3?['+','-']:level<7?['+','-','×']:['+','-','×','÷'];
  op=ops[randInt(0,ops.length-1)];
  const maxN=10+level*3;
  if(op==='+'){
    a=randInt(1,maxN);b=randInt(1,maxN);val=a+b;text=`${a} + ${b}`;
  } else if(op==='-'){
    a=randInt(1,maxN);b=randInt(1,a);val=a-b;text=`${a} - ${b}`;
  } else if(op==='×'){
    a=randInt(1,Math.min(12,6+level));b=randInt(1,Math.min(12,6+level));val=a*b;text=`${a} × ${b}`;
  } else {
    b=randInt(2,Math.min(12,4+level));const q=randInt(1,Math.min(12,4+level));a=b*q;val=q;text=`${a} ÷ ${b}`;
  }
  equationText=text;
  target=val;
  const set=new Set([val]);
  while(set.size<4){
    const delta=randInt(-Math.max(3,Math.floor(val*0.3)+1),Math.max(3,Math.floor(val*0.3)+1));
    const cand=val+delta;
    if(cand!==val && cand>=0 && !set.has(cand))set.add(cand);
  }
  choices=Array.from(set);
  for(let i=choices.length-1;i>0;i--){
    const j=randInt(0,i);
    [choices[i],choices[j]]=[choices[j],choices[i]];
  }
  timeMax=Math.max(4.5,9-level*0.25);
  timeLeft=timeMax;
  selectedIdx=-1;
  roundActive=true;
}

function pick(idx){
  if(!roundActive||gameOver)return;
  if(!started)started=true;
  roundActive=false;
  selectedIdx=idx;
  const val=choices[idx];
  if(val===target){
    balanced++;
    if(balanced>hi){hi=balanced;localStorage.setItem('mathequationbalance_hi',hi);}
    resultGood=true;resultFlash=45;
    SFX.success();
    setTimeout(()=>{ if(!gameOver) genEquation(); },550);
  } else {
    lives--;
    resultGood=false;resultFlash=45;
    SFX.error();
    if(lives<=0){
      gameOver=true;
      SFX.lose();
    } else {
      setTimeout(()=>{ if(!gameOver) genEquation(); },650);
    }
  }
}

function timeoutRound(){
  if(!roundActive||gameOver)return;
  roundActive=false;
  lives--;
  resultGood=false;resultFlash=45;
  SFX.fail();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
  } else {
    setTimeout(()=>{ if(!gameOver) genEquation(); },650);
  }
}

function reset(){
  balanced=0;lives=3;gameOver=false;started=false;lastTime=null;
  genEquation();
  roundActive=false; // wait for start tap
}

const choiceRects=[];

function hitTest(x,y){
  for(let i=0;i<choiceRects.length;i++){
    const r=choiceRects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return i;
  }
  return -1;
}

function canvasXY(clientX,clientY){
  const rect=c.getBoundingClientRect();
  return {x:(clientX-rect.left)*(W/rect.width), y:(clientY-rect.top)*(H/rect.height)};
}

c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  if(!started){started=true;roundActive=true;lastTime=null;return;}
  const {x,y}=canvasXY(e.clientX,e.clientY);
  const idx=hitTest(x,y);
  if(idx>=0)pick(idx);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  if(gameOver){reset();return;}
  if(!started){started=true;roundActive=true;lastTime=null;return;}
  const {x,y}=canvasXY(t.clientX,t.clientY);
  const idx=hitTest(x,y);
  if(idx>=0)pick(idx);
},{passive:false});
document.addEventListener('keydown',e=>{
  if(gameOver && (e.code==='Space'||e.code==='Enter')){reset();return;}
  if(!started && (e.code==='Space'||e.code==='Enter')){started=true;roundActive=true;lastTime=null;return;}
  const numMap={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Numpad1:0,Numpad2:1,Numpad3:2,Numpad4:3};
  if(numMap[e.code]!==undefined && numMap[e.code]<choices.length){
    e.preventDefault();
    pick(numMap[e.code]);
  }
});

function drawScale(tilt){
  const cx=W/2, baseY=210;
  ctx.strokeStyle='#3e2723';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,baseY);ctx.lineTo(cx,baseY+70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-40,baseY+70);ctx.lineTo(cx+40,baseY+70);ctx.stroke();

  ctx.save();
  ctx.translate(cx,baseY);
  ctx.rotate(tilt);
  ctx.strokeStyle='#5d4037';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-170,0);ctx.lineTo(170,0);ctx.stroke();

  // left pan (equation), right pan (player's pick, or ? before choosing)
  drawPan(-170,18,equationText,'#ffca28');
  drawPan(170,18,selectedIdx>=0?String(choices[selectedIdx]):'?','#4fc3f7');
  ctx.restore();
}

function drawPan(offsetX,dropY,label,color){
  ctx.save();
  ctx.translate(offsetX,dropY);
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-45,45);ctx.moveTo(30,0);ctx.lineTo(45,45);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.ellipse(0,50,55,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,0,50);
  ctx.restore();
}

function drawChoices(){
  choiceRects.length=0;
  const n=choices.length;
  const btnW=120,btnH=60,gap=16;
  const totalW=n*btnW+(n-1)*gap;
  let x=(W-totalW)/2;
  const y=390;
  choices.forEach((val,i)=>{
    let fill='#7e57c2';
    if(resultFlash>0 && i===selectedIdx)fill=resultGood?'#43a047':'#e53935';
    ctx.fillStyle=fill;
    roundRect(x,y,btnW,btnH,10);
    ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    roundRect(x,y,btnW,btnH,10);
    ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(val),x+btnW/2,y+btnH/2-6);
    ctx.font='13px Arial';
    ctx.fillText('('+(i+1)+')',x+btnW/2,y+btnH/2+18);
    choiceRects.push({x,y,w:btnW,h:btnH});
    x+=btnW+gap;
  });
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('mathbalance_score_label','Balanced: {b} | Lives: {l} | Best: {h}')
      .replace('{b}',balanced).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#4527a0');bg.addColorStop(1,'#00acc1');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,80);
    drawScale(0);
    drawChoices();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;

  if(gameOver){
    let tilt=0;
    drawScale(tilt);
    drawChoices();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('mathbalance_final_label','Balanced: {b} | Best: {h}').replace('{b}',balanced).replace('{h}',hi),W/2,H/2+10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  if(roundActive){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;timeoutRound();}
  }
  if(resultFlash>0)resultFlash--;

  let tilt=0;
  if(selectedIdx>=0){
    const diff=choices[selectedIdx]-target;
    tilt=Math.max(-0.35,Math.min(0.35,diff*0.03));
  }

  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('mathbalance_prompt','Balance: {eq} = ?').replace('{eq}',equationText),W/2,50);

  // timer bar
  const barW=500,barX=(W-barW)/2,barY=70;
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(barX,barY,barW,14);
  const pct=timeMax>0?Math.max(0,timeLeft/timeMax):0;
  ctx.fillStyle=pct>0.3?'#66bb6a':'#e53935';
  ctx.fillRect(barX,barY,barW*pct,14);

  drawScale(tilt);
  drawChoices();

  updateScore();
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
