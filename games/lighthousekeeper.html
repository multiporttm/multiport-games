<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d1b2e;cursor:pointer}
#ui{color:#b3e5fc;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lighthouse Keeper</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Guided: 0 | Wrecks: 0/3</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap to sweep your lighthouse beam. Keep it shining on approaching ships to steer them safely to harbor — a ship left in the dark too long crashes on the rocks. 3 wrecks and it's game over!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=H-40;
let beamAngle,ships,guided,wrecks,state;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('lighthousekeeper_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('lighthousekeeper_best',v);}

function init(){
  beamAngle=-Math.PI/2;ships=[];guided=0;wrecks=0;state='play';spawnShip();
}
function spawnShip(){
  const ang=rand(-Math.PI*0.9,-Math.PI*0.1);
  ships.push({dist:220,ang,dark:0,speed:0.25+guided*0.01});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  beamAngle=Math.atan2(y-CY,x-CX);
  SFX.click();
});

function inBeam(ship){
  const shipAng=ship.ang;
  let diff=Math.abs(shipAng-beamAngle);
  diff=Math.min(diff,Math.PI*2-diff);
  return diff<0.28;
}

function update(){
  if(state!=='play')return;
  ships.forEach(s=>{
    if(inBeam(s)){s.dist-=1.0;s.dark=0;}
    else{s.dark++;s.dist-=0.15;}
  });
  ships=ships.filter(s=>{
    if(s.dark>90){
      wrecks++;
      SFX.hurt();
      if(wrecks>=3){state='over';SFX.lose();saveBest(guided);}
      return false;
    }
    if(s.dist<=30){
      guided++;
      SFX.success();
      saveBest(guided);
      return false;
    }
    return true;
  });
  if(ships.length<3&&Math.random()<0.02)spawnShip();
  updateUI();
}

function draw(){
  ctx.fillStyle='#0d1b2e';ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(beamAngle);
  const grad=ctx.createLinearGradient(0,0,220,0);
  grad.addColorStop(0,'rgba(255,235,59,.35)');grad.addColorStop(1,'rgba(255,235,59,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,220,-0.28,0.28);ctx.closePath();ctx.fill();
  ctx.restore();

  ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ships.forEach(s=>{
    const x=CX+Math.cos(s.ang)*s.dist,y=CY+Math.sin(s.ang)*s.dist;
    ctx.globalAlpha=s.dark>0?Math.max(0.3,1-s.dark/90):1;
    ctx.fillText('⛴️',x,y);
    ctx.globalAlpha=1;
  });

  ctx.font='30px Arial';
  ctx.fillText('🗼',CX,CY);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#b3e5fc';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('harbor_closed','HARBOR CLOSED'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('guided_best_label','Guided: {n} | Best: {b}').replace('{n}',guided).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_to_retry','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Guided: ${guided} | Wrecks: ${wrecks}/3`;
}

init();draw();
</script></body></html>
