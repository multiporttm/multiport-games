<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#2b1b12;cursor:pointer}
#ui{color:#ffb74d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Mansion Escape</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Rooms: 1/5 | Keys: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap the furniture to search it — some hide a key, some are empty. Find the room's key, then tap the glowing door to move to the next room. Escape all 5 rooms!</div>
</div>
<script>
const W=360,H=360;
let room,keysFound,items,doorUnlocked,state,msg='Search the room for a key';

function loadBest(){return +(localStorage.getItem('mansionescape_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('mansionescape_best',v);}

const FURNITURE=['🛋️','🗄️','🪑','🖼️','🪴','📚','🕰️','🪞'];

function init(){room=1;keysFound=0;state='play';newRoom();}

function newRoom(){
  const n=3+Math.min(3,Math.floor(room/2));
  items=[];
  const keyIdx=Math.floor(Math.random()*n);
  const spots=[];
  for(let i=0;i<n;i++)spots.push(i);
  for(let i=0;i<n;i++){
    const col=i%3,row=Math.floor(i/3);
    items.push({
      x:60+col*120,y:80+row*100,
      emoji:FURNITURE[Math.floor(Math.random()*FURNITURE.length)],
      hasKey:i===keyIdx,searched:false,
    });
  }
  doorUnlocked=false;
  msg='Search the room for a key';
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'||state==='win'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);

  if(doorUnlocked&&y>H-70&&Math.abs(x-W/2)<50){
    room++;
    if(room>5){
      saveBest(5);
      state='win';
    }else{
      newRoom();
    }
    updateUI();
    return;
  }

  for(const it of items){
    if(!it.searched&&Math.hypot(x-it.x,y-it.y)<36){
      it.searched=true;
      if(it.hasKey){
        doorUnlocked=true;keysFound++;
        msg='Found the key! Door unlocked.';
      }else{
        msg='Nothing here...';
      }
      updateUI();
      return;
    }
  }
});

function draw(){
  ctx.fillStyle='#2b1b12';ctx.fillRect(0,0,W,H);

  ctx.font='36px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  items.forEach(it=>{
    ctx.globalAlpha=it.searched?0.35:1;
    ctx.fillText(it.emoji,it.x,it.y);
    if(it.searched&&it.hasKey){
      ctx.font='18px Arial';
      ctx.fillText('🔑',it.x,it.y-30);
      ctx.font='36px Arial';
    }
  });
  ctx.globalAlpha=1;

  ctx.fillStyle=doorUnlocked?'#66bb6a':'#5d4037';
  ctx.fillRect(W/2-50,H-70,100,60);
  ctx.font='30px Arial';
  ctx.fillText(doorUnlocked?'🚪':'🔒',W/2,H-40);

  ctx.fillStyle='#ffb74d';ctx.font='14px Arial';
  ctx.fillText(msg,W/2,H-90);

  if(state==='over'||state==='win'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb74d';ctx.font='bold 24px Arial';
    ctx.fillText(state==='win'?'YOU ESCAPED!':'GAME OVER',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Rooms cleared: ${Math.min(5,room)}/5`,W/2,H/2+12);
    ctx.fillText('Tap to play again',W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Rooms: ${Math.min(5,room)}/5 | Keys: ${keysFound}`;
}

init();draw();
</script></body></html>
