<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#37474f,#90a4ae);border-radius:14px;padding:20px;text-align:center;max-width:560px;margin:0 auto}
#stats{color:#fff;font-weight:800;font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;padding:0 6px}
#carBox{background:#1c2b30;border-radius:12px;padding:16px;margin:10px 0}
#carEmoji{font-size:4rem}
#symptom{color:#ffd54f;font-weight:800;font-size:1.15rem;margin:10px 0;min-height:2.4em}
#timerWrap{background:rgba(0,0,0,.3);border-radius:8px;height:14px;overflow:hidden;margin:8px 0}
#timerBar{height:100%;background:#66bb6a;width:100%;transition:width .1s linear}
#options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.opt{background:#263238;color:#fff;border:2px solid #546e7a;border-radius:10px;padding:14px 8px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
.opt:hover{background:#37474f}
.opt:active{transform:scale(.96)}
.opt.correct{background:#2e7d32;border-color:#66bb6a}
.opt.wrong{background:#b71c1c;border-color:#ef5350}
#msg{color:#fff;min-height:1.6em;font-weight:700;margin-top:8px}
#endScreen{display:none;color:#fff;padding:20px}
#endScreen button{margin-top:14px;padding:10px 26px;background:#ffd54f;color:#222;border:none;border-radius:20px;font-weight:800;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Mechanic Repair</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="stats"><span id="repairedLabel">Repaired: 0</span><span id="livesLabel">Lives: 3</span></div>
      <div id="game">
        <div id="carBox">
          <div id="carEmoji">🚗</div>
          <div id="symptom">Loading...</div>
          <div id="timerWrap"><div id="timerBar"></div></div>
        </div>
        <div id="options"></div>
        <div id="msg"></div>
      </div>
      <div id="endScreen">
        <div style="font-size:1.4rem;font-weight:900" id="endTitle">Shift Over!</div>
        <div id="endStats" style="margin-top:8px"></div>
        <button id="restartBtn">Start New Shift</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the car's <b>symptom</b> and click the correct <b>part or tool</b> to fix it before the timer runs out. Wrong guesses or a missed deadline cost a life!</div>
</div>
<script>
const CASES=[
  {symptom:"Engine won't start, clicking sound",fix:"Battery",options:["Battery","Radiator","Brake Pads","Muffler"]},
  {symptom:"Grinding noise when braking",fix:"Brake Pads",options:["Brake Pads","Spark Plug","Air Filter","Alternator"]},
  {symptom:"Smoke pouring from the hood",fix:"Radiator",options:["Radiator","Tires","Battery","Wiper Blades"]},
  {symptom:"Engine sputters and misfires",fix:"Spark Plug",options:["Spark Plug","Brake Pads","Radiator","Headlight"]},
  {symptom:"Car won't accelerate, engine feels weak",fix:"Air Filter",options:["Air Filter","Battery","Muffler","Tires"]},
  {symptom:"Loud exhaust rumble, gets louder each day",fix:"Muffler",options:["Muffler","Spark Plug","Radiator","Fuel Pump"]},
  {symptom:"Headlights and dashboard lights are dim",fix:"Alternator",options:["Alternator","Brake Pads","Air Filter","Tires"]},
  {symptom:"Steering wheel shakes at highway speed",fix:"Tires",options:["Tires","Battery","Spark Plug","Muffler"]},
  {symptom:"Windshield covered in rain, can't see",fix:"Wiper Blades",options:["Wiper Blades","Radiator","Fuel Pump","Alternator"]},
  {symptom:"Engine sputters, stalls, seems starved of gas",fix:"Fuel Pump",options:["Fuel Pump","Air Filter","Headlight","Battery"]},
  {symptom:"Headlight burned out, driving is unsafe at night",fix:"Headlight",options:["Headlight","Wiper Blades","Muffler","Brake Pads"]}
];
let repaired=0,lives=3,hi=0,cur=null,timeLeft=0,duration=8000,timerId=null,lastTick=null,gameOver=false;
hi=parseInt(localStorage.getItem('mechanicrepair_hi')||'0',10);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function nextCar(){
  cur=CASES[Math.floor(Math.random()*CASES.length)];
  document.getElementById('symptom').textContent=cur.symptom;
  const opts=shuffle(cur.options);
  const optDiv=document.getElementById('options');
  optDiv.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=o;
    btn.onclick=()=>choose(o,btn);
    optDiv.appendChild(btn);
  });
  document.getElementById('msg').textContent='';
  duration=Math.max(4000,8000-repaired*300);
  timeLeft=duration;
  lastTick=performance.now();
  document.querySelectorAll('.opt').forEach(b=>b.disabled=false);
  if(timerId)cancelAnimationFrame(timerId);
  tick();
}

function tick(){
  if(gameOver)return;
  const now=performance.now();
  const dt=now-lastTick;
  lastTick=now;
  timeLeft-=dt;
  const pct=Math.max(0,timeLeft/duration*100);
  const bar=document.getElementById('timerBar');
  bar.style.width=pct+'%';
  bar.style.background=pct>50?'#66bb6a':pct>20?'#ffca28':'#ef5350';
  if(timeLeft<=0){
    timeout();
    return;
  }
  timerId=requestAnimationFrame(tick);
}

function timeout(){
  document.getElementById('msg').textContent=I18N.t('mr_timeout','Too slow! The customer left unhappy.');
  document.getElementById('msg').style.color='#ff8a80';
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  SFX.error();
  loseLife();
}

function choose(o,btn){
  if(gameOver)return;
  cancelAnimationFrame(timerId);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(o===cur.fix){
    btn.classList.add('correct');
    repaired++;
    document.getElementById('repairedLabel').textContent=I18N.t('mr_repaired_label','Repaired: {n}').replace('{n}',repaired);
    document.getElementById('msg').textContent=I18N.t('mr_fixed','Fixed it! Next car is pulling in...');
    document.getElementById('msg').style.color='#a5d6a7';
    SFX.success();
    setTimeout(nextCar,900);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===cur.fix)b.classList.add('correct');});
    document.getElementById('msg').textContent=I18N.t('mr_wrong','Wrong part! That did not fix it.');
    document.getElementById('msg').style.color='#ff8a80';
    SFX.error();
    loseLife();
  }
}

function loseLife(){
  lives--;
  document.getElementById('livesLabel').textContent=I18N.t('mr_lives_label','Lives: {n}').replace('{n}',lives);
  if(lives<=0){
    endShift();
  } else {
    setTimeout(nextCar,1100);
  }
}

function endShift(){
  gameOver=true;
  cancelAnimationFrame(timerId);
  if(repaired>hi){hi=repaired;localStorage.setItem('mechanicrepair_hi',hi);}
  document.getElementById('game').style.display='none';
  document.getElementById('endScreen').style.display='block';
  document.getElementById('endTitle').textContent=I18N.t('mr_shift_over','Shift Over!');
  document.getElementById('endStats').textContent=I18N.t('mr_end_stats','Cars repaired: {n} | Best: {h}').replace('{n}',repaired).replace('{h}',hi);
  SFX.lose();
}

document.getElementById('restartBtn').onclick=()=>{
  repaired=0;lives=3;gameOver=false;
  document.getElementById('repairedLabel').textContent=I18N.t('mr_repaired_label','Repaired: {n}').replace('{n}',repaired);
  document.getElementById('livesLabel').textContent=I18N.t('mr_lives_label','Lives: {n}').replace('{n}',lives);
  document.getElementById('game').style.display='block';
  document.getElementById('endScreen').style.display='none';
  nextCar();
};

nextCar();
</script></body></html>
