<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a0f2e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Saxophone Jam</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Combo: 0 | Hi: 0</div>
    <canvas id="c" width="480" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>D F J K</b> (matching each lane), or <b>tap</b> a lane, exactly when a note bar crosses the hit-line. Accurate hits build your combo; misses break it. The tempo speeds up the longer you play!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=640;
const LANES=4;
const laneW=W/LANES;
const hitY=H-90;
const keys=['D','F','J','K'];
const colors=['#ff7043','#ffd54f','#4fc3f7','#ab47bc'];

let score=0,combo=0,bestCombo=0,hi=0,gameOver=false,started=false,frame=0,lastTime=null;
hi=parseFloat(localStorage.getItem('saxophonejam_hi')||'0');
let notes=[];
let spawnTimer=0,spawnInterval=55,noteSpeed=4.2;
let laneFlash=[0,0,0,0];
let lastJudgement=null,judgeTimer=0;

function reset(){
  score=0;combo=0;bestCombo=0;gameOver=false;started=false;frame=0;lastTime=null;
  notes=[];spawnTimer=0;spawnInterval=55;noteSpeed=4.2;
  laneFlash=[0,0,0,0];lastJudgement=null;judgeTimer=0;
}

function spawnNote(){
  const lane=Math.floor(Math.random()*LANES);
  notes.push({lane,y:-30,hit:false});
}

function judge(diff){
  const ad=Math.abs(diff);
  if(ad<14)return 'perfect';
  if(ad<30)return 'good';
  if(ad<55)return 'ok';
  return null;
}

function hitLane(lane){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  laneFlash[lane]=1;
  // find nearest un-hit note in this lane close to hit line
  let best=null,bestDiff=9999;
  notes.forEach(n=>{
    if(n.hit||n.lane!==lane)return;
    const diff=n.y-hitY;
    if(Math.abs(diff)<bestDiff){bestDiff=Math.abs(diff);best=n;}
  });
  if(best){
    const diff=best.y-hitY;
    const result=judge(diff);
    if(result){
      best.hit=true;
      combo++;
      if(combo>bestCombo)bestCombo=combo;
      const pts=result==='perfect'?100:result==='good'?60:30;
      score+=pts+combo;
      lastJudgement=result.toUpperCase();
      SFX.point();
      if(combo>0&&combo%10===0)SFX.levelup();
    } else {
      combo=0;
      lastJudgement=I18N.t('miss_label','MISS');
      SFX.error();
    }
  } else {
    combo=0;
    lastJudgement=I18N.t('miss_label','MISS');
    SFX.error();
  }
  judgeTimer=40;
  if(score>hi){hi=score;localStorage.setItem('saxophonejam_hi',hi);}
}

document.addEventListener('keydown',e=>{
  const idx=keys.indexOf(e.key.toUpperCase());
  if(idx>=0){e.preventDefault();hitLane(idx);}
});

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const lane=Math.min(LANES-1,Math.max(0,Math.floor(x/laneW)));
  hitLane(lane);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  Array.from(e.changedTouches).forEach(t=>{
    const x=(t.clientX-rect.left)*(W/rect.width);
    const lane=Math.min(LANES-1,Math.max(0,Math.floor(x/laneW)));
    hitLane(lane);
  });
},{passive:false});

function drawLanes(){
  for(let i=0;i<LANES;i++){
    ctx.fillStyle=i%2===0?'#20143a':'#1a0f2e';
    ctx.fillRect(i*laneW,0,laneW,H);
    if(laneFlash[i]>0){
      ctx.fillStyle=`rgba(255,255,255,${laneFlash[i]*0.25})`;
      ctx.fillRect(i*laneW,0,laneW,H);
      laneFlash[i]-=0.06;
      if(laneFlash[i]<0)laneFlash[i]=0;
    }
  }
  // hit line
  ctx.fillStyle='#ffffff33';
  ctx.fillRect(0,hitY-3,W,6);
  for(let i=0;i<LANES;i++){
    ctx.fillStyle=colors[i];
    ctx.font='bold 22px Arial';
    ctx.textAlign='center';
    ctx.fillText(keys[i],i*laneW+laneW/2,hitY+40);
  }
}

function drawNote(n){
  ctx.fillStyle=colors[n.lane];
  ctx.save();
  ctx.globalAlpha=n.hit?0:1;
  const x=n.lane*laneW+8;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x,n.y-16,laneW-16,32,8) : ctx.rect(x,n.y-16,laneW-16,32);
  ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawLanes();

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_combo','Best Combo: {c}').replace('{c}',bestCombo),W/2,H/2+2);
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+32);
    document.getElementById('score-display').textContent=I18N.t('score_combo_hi_label','Score: {s} | Combo: {c} | Hi: {h}').replace('{s}',score).replace('{c}',bestCombo).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffd54f99';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press D F J K or tap to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  noteSpeed=4.2+score/1200;
  spawnInterval=Math.max(24,55-score/400);
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnNote();}

  notes.forEach(n=>{ if(!n.hit) n.y+=noteSpeed*dt; });

  // missed notes past hit line
  notes.forEach(n=>{
    if(!n.hit&&n.y-hitY>55){
      n.hit=true;
      n.missed=true;
      combo=0;
      lastJudgement=I18N.t('miss_label','MISS');
      judgeTimer=40;
      SFX.error();
    }
  });

  notes=notes.filter(n=>n.y<H+40);
  notes.forEach(drawNote);

  if(judgeTimer>0){
    judgeTimer-=dt;
    ctx.globalAlpha=Math.min(1,judgeTimer/20);
    ctx.fillStyle='#fff';
    ctx.font='bold 26px Arial';
    ctx.textAlign='center';
    ctx.fillText(lastJudgement,W/2,H/2);
    ctx.globalAlpha=1;
  }

  ctx.fillStyle='#ffffffcc';
  ctx.font='bold 16px Arial';
  ctx.textAlign='center';
  ctx.fillText(I18N.t('combo_label','Combo x{c}').replace('{c}',combo),W/2,50);

  document.getElementById('score-display').textContent=I18N.t('score_combo_hi_label','Score: {s} | Combo: {c} | Hi: {h}').replace('{s}',score).replace('{c}',bestCombo).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
