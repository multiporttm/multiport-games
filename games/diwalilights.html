<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#board{background:#16213e;border-radius:14px;padding:18px;text-align:center;max-width:520px;margin:0 auto}
#hud{color:#fff;font-weight:800;margin-bottom:10px;font-size:1.05rem}
#status{color:#ffd54f;font-weight:800;min-height:1.6em;margin-bottom:8px}
#grid{display:inline-grid;gap:14px;margin:10px auto}
.diya{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a3d1a,#3d2811);border:3px solid #8a5a2a;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:transform .12s,box-shadow .15s}
.diya.lit{background:radial-gradient(circle at 40% 35%,#ffd54f,#ff8a00);box-shadow:0 0 22px 8px rgba(255,180,50,.85);transform:scale(1.08)}
.diya:active{transform:scale(.92)}
#startBtn{margin-top:14px;padding:9px 22px;border-radius:20px;border:none;background:#e94560;color:#fff;cursor:pointer;font-size:1rem}
@media(max-width:480px){.diya{width:44px;height:44px;font-size:1.2rem}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Diwali Lights</div>
  <div class="game-frame" style="padding:16px">
    <div id="board">
      <div id="hud">Round 1 | Score: 0 | Best: 0</div>
      <div id="status">Watch the pattern...</div>
      <div id="grid"></div>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the diyas light up in sequence, then repeat the pattern by clicking the lamps in the same order. Get it right to advance; a wrong click resets the pattern. Sequences grow longer each round!</div>
</div>
<script>
let round=1,score=0,best=+(localStorage.getItem('diwalilights_best')||0);
let gridSize=3; // NxN, grows
let sequence=[],playerIdx=0,showingPattern=false,acceptInput=false;
let lamps=[];

function updateHud(){
  document.getElementById('hud').textContent=`Round ${round} | Score: ${score} | Best: ${best}`;
}
updateHud();

function buildGrid(){
  gridSize = round<=2?3 : round<=5?4 : 5;
  const grid=document.getElementById('grid');
  grid.style.gridTemplateColumns=`repeat(${gridSize},1fr)`;
  grid.innerHTML='';
  lamps=[];
  for(let i=0;i<gridSize*gridSize;i++){
    const el=document.createElement('div');
    el.className='diya';
    el.textContent='🪔';
    el.dataset.idx=i;
    el.addEventListener('click',()=>handleLampClick(i));
    grid.appendChild(el);
    lamps.push(el);
  }
}

function seqLength(){ return 2+round; }

function genSequence(){
  sequence=[];
  const n=gridSize*gridSize;
  for(let i=0;i<seqLength();i++){
    sequence.push(Math.floor(Math.random()*n));
  }
}

function lightLamp(i,dur){
  return new Promise(res=>{
    lamps[i].classList.add('lit');
    SFX.tick();
    setTimeout(()=>{
      lamps[i].classList.remove('lit');
      setTimeout(res,150);
    },dur);
  });
}

async function playPattern(){
  showingPattern=true;
  acceptInput=false;
  document.getElementById('status').textContent=I18N.t('diwali_watch','Watch the pattern...');
  await new Promise(r=>setTimeout(r,500));
  const dur=Math.max(320,600-round*20);
  for(const idx of sequence){
    await lightLamp(idx,dur);
  }
  showingPattern=false;
  acceptInput=true;
  playerIdx=0;
  document.getElementById('status').textContent=I18N.t('diwali_repeat','Your turn — repeat the pattern!');
}

function handleLampClick(i){
  if(!acceptInput)return;
  const expected=sequence[playerIdx];
  if(i===expected){
    lamps[i].classList.add('lit');
    setTimeout(()=>lamps[i].classList.remove('lit'),250);
    SFX.point();
    playerIdx++;
    if(playerIdx>=sequence.length){
      acceptInput=false;
      completeRound();
    }
  } else {
    acceptInput=false;
    lamps[i].classList.add('lit');
    setTimeout(()=>lamps[i].classList.remove('lit'),300);
    SFX.fail();
    document.getElementById('status').textContent=I18N.t('diwali_wrong','Wrong lamp! Pattern reset — try again.');
    setTimeout(()=>{ playPattern(); },1200);
  }
}

function completeRound(){
  const pts=sequence.length*10;
  score+=pts;
  if(score>best){best=score;localStorage.setItem('diwalilights_best',best);}
  updateHud();
  document.getElementById('status').textContent=I18N.t('diwali_correct','🎉 Pattern complete! +{p} pts').replace('{p}',pts);
  SFX.win();
  setTimeout(()=>{
    round++;
    startRound();
  },1300);
}

function startRound(){
  buildGrid();
  updateHud();
  genSequence();
  playPattern();
}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('startBtn').style.display='none';
  round=1;score=0;
  startRound();
};
buildGrid();
</script></body></html>
