<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Marshmallow Toast</title><meta name="description" content="Play Marshmallow Toast free online — Hold to lower your marshmallow into the campfire and release at golden brown for a perfect toast."><link rel="canonical" href="https://games.multiportllc.com/games/marshmallowtoast"><meta property="og:title" content="Marshmallow Toast - Multiport Games"><meta property="og:description" content="Play Marshmallow Toast free online — Hold to lower your marshmallow into the campfire and release at golden brown for a perfect toast."><meta property="og:url" content="https://games.multiportllc.com/games/marshmallowtoast"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Marshmallow Toast","description":"Play Marshmallow Toast free online instantly. Hold to lower your marshmallow into the campfire and release at golden brown for a perfect toast. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/marshmallowtoast","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1006;display:block;border-radius:8px}
#score-display{color:#ffb74d;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Marshmallow Toast</div>
  <div class="game-frame">
    <div id="score-display">Perfect: 0 | Best streak: 0 | Lives: 3</div>
    <canvas id="c" width="640" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold / click to lower your marshmallow into the fire, release at <b>golden brown</b> for a perfect toast. Too early is raw, too long and it burns — burning costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=440;
let perfectCount=0,bestStreak=parseInt(localStorage.getItem('marshmallowtoast_best')||'0',10);
let streak=0,lives=3,gameOver=false,toasting=false,toastLevel=0,speed=0.9,resultText='',resultTimer=0;

function reset(){perfectCount=0;streak=0;lives=3;gameOver=false;toasting=false;toastLevel=0;speed=0.9;resultText='';resultTimer=0;}

function startToast(){
  if(gameOver){reset();return;}
  toasting=true;
}
function endToast(){
  if(!toasting)return;
  toasting=false;
  judge();
}
function judge(){
  let msg,ok=false;
  if(toastLevel<25){msg=I18N.t('too_raw','RAW — too early!');}
  else if(toastLevel<=70){msg=I18N.t('perfect_toast','PERFECT! 🎉');ok=true;}
  else if(toastLevel<=90){msg=I18N.t('slightly_burnt','A little burnt...');}
  else{msg=I18N.t('burnt_toast','BURNT!');}
  resultText=msg;resultTimer=60;
  if(ok){
    perfectCount++;streak++;
    if(streak>bestStreak){bestStreak=streak;localStorage.setItem('marshmallowtoast_best',bestStreak);}
    SFX.success();
    speed=Math.min(2.6,speed+0.08);
  }else{
    streak=0;
    lives--;
    SFX.error();
    if(lives<=0){gameOver=true;SFX.lose();}
  }
  toastLevel=0;
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();startToast();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')endToast();});
c.addEventListener('mousedown',startToast);
c.addEventListener('mouseup',endToast);
c.addEventListener('mouseleave',endToast);
c.addEventListener('touchstart',e=>{e.preventDefault();startToast();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endToast();},{passive:false});

function marshmallowColor(level){
  if(level<25)return '#fdfaf5';
  if(level<=70){
    const t=(level-25)/45;
    const r=253-t*20, g=250-t*90, b=245-t*180;
    return `rgb(${r|0},${g|0},${b|0})`;
  }
  if(level<=90)return '#5c3a1e';
  return '#1a0f08';
}

function drawFire(){
  ctx.save();
  const fx=W/2,fy=H-70;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    const flick=Math.sin(Date.now()/120+i)*6;
    ctx.moveTo(fx-30+i*20,fy+30);
    ctx.quadraticCurveTo(fx-10+i*20+flick,fy-30,fx+i*20,fy-70);
    ctx.quadraticCurveTo(fx+10+i*20-flick,fy-30,fx+30+i*20,fy+30);
    ctx.closePath();
    ctx.fillStyle=i===1?'#ffca28':'#ff7043';
    ctx.fill();
  }
  ctx.fillStyle='#4e342e';
  ctx.fillRect(fx-60,fy+30,120,14);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0806');sky.addColorStop(1,'#2a1a10');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  drawFire();

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('perfect_best_label','Perfect toasts: {n} | Best streak: {b}').replace('{n}',perfectCount).replace('{b}',bestStreak),W/2,H/2+6);
    ctx.fillText(I18N.t('retry_hint2','Tap or Space to retry'),W/2,H/2+38);
    document.getElementById('score-display').textContent=I18N.t('perfect_streak_lives_label','Perfect: {n} | Best streak: {b} | Lives: {l}').replace('{n}',perfectCount).replace('{b}',bestStreak).replace('{l}',Math.max(0,lives));
    requestAnimationFrame(loop);return;
  }

  if(toasting){
    toastLevel=Math.min(100,toastLevel+speed);
    if(toastLevel>=100){toasting=false;judge();}
  }

  // stick + marshmallow
  const stickX=W/2,stickY=H-100-(toasting?30:0);
  ctx.save();
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(stickX-150,stickY+90);ctx.lineTo(stickX,stickY);ctx.stroke();
  ctx.fillStyle=marshmallowColor(toastLevel);
  ctx.beginPath();ctx.roundRect(stickX-22,stickY-16,44,32,10);ctx.fill();
  ctx.restore();

  // toast meter
  const mx=W/2-150,my=40,mw=300,mh=20;
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle='#8bc34a';ctx.fillRect(mx,my,mw*0.25,mh);
  ctx.fillStyle='#ffca28';ctx.fillRect(mx+mw*0.25,my,mw*0.45,mh);
  ctx.fillStyle='#5c3a1e';ctx.fillRect(mx+mw*0.70,my,mw*0.20,mh);
  ctx.fillStyle='#1a0f08';ctx.fillRect(mx+mw*0.90,my,mw*0.10,mh);
  ctx.fillStyle='#fff';ctx.fillRect(mx+toastLevel/100*mw-2,my-4,4,mh+8);
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.strokeRect(mx,my,mw,mh);

  if(resultTimer>0){
    resultTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(resultText,W/2,H/2-140);
  }else if(!toasting){
    ctx.fillStyle='#ffffffaa';ctx.font='18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hold_toast_hint','Hold to lower into the fire'),W/2,H/2-140);
  }

  document.getElementById('score-display').textContent=I18N.t('perfect_streak_lives_label','Perfect: {n} | Best streak: {b} | Lives: {l}').replace('{n}',perfectCount).replace('{b}',bestStreak).replace('{l}',Math.max(0,lives));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
