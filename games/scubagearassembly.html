<style>
body{background:#08080f}
#c{background:#10263a;display:block;border-radius:8px}
#score-display{color:#5ec8e0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Scuba Gear Assembly</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap the gear parts (or use <b>Number keys</b> or <b>Arrow Keys + Enter</b>) in the correct assembly order — tank valve, regulator, BCD, gauges, then the final safety check — before the timer runs out. Three wrong moves fail the inspection!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=460;
const scoreDisp=document.getElementById('score-display');
const HS_KEY='scubagearassembly_hiscore';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

let score=0,lives=3,round=1,gameOver=false,started=false;
let steps,order,nextIdx,items,sel=0,timeLeft,maxTime,flash,flashTimer,done,doneTimer;

const ALL_STEPS=[
  {key:'valve',label:'Open tank valve (slowly)'},
  {key:'reg',label:'Attach regulator first stage to tank valve'},
  {key:'bcd',label:'Secure BCD / tank band to cylinder'},
  {key:'gauge',label:'Connect pressure gauge & hose'},
  {key:'inflator',label:'Connect BCD low-pressure inflator hose'},
  {key:'purge',label:'Purge and test regulator breathing'},
  {key:'check',label:'Final buddy safety check'},
];

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function startRound(){
  const n=Math.min(ALL_STEPS.length,4+Math.floor(round/2));
  steps=ALL_STEPS.slice(0,n);
  order=steps.map((s,i)=>i); // correct order is always index order (fixed logical sequence)
  // display items shuffled
  items=steps.map((s,i)=>({...s,correctIdx:i}));
  items=shuffle(items);
  nextIdx=0;
  sel=0;
  maxTime=Math.max(10,22-round);
  timeLeft=maxTime;
  flash=null;flashTimer=0;
  done=false;doneTimer=0;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function reset(){
  score=0;lives=3;round=1;gameOver=false;started=false;
  startRound();
}
reset();

function pick(i){
  if(gameOver||done)return;
  if(i<0||i>=items.length)return;
  const it=items[i];
  if(it.taken)return;
  if(it.correctIdx===nextIdx){
    it.taken=true;
    score+=25+round*3;
    SFX.success();
    nextIdx++;
    if(nextIdx>=items.length){
      done=true;doneTimer=70;
      score+=80+round*8;
      SFX.win();
      if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
    }
  } else {
    lives--;
    SFX.error();
    flash='Wrong step! Follow the proper assembly sequence.';
    flashTimer=40;
    if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}}
  }
}

document.addEventListener('keydown',e=>{
  if(gameOver&&e.code==='Space'){reset();return;}
  if(!started){started=true;return;}
  if(done)return;
  const digitMatch=e.code.match(/^Digit([1-9])$/);
  if(digitMatch){pick(parseInt(digitMatch[1],10)-1);return;}
  if(e.code==='ArrowRight'||e.code==='ArrowDown'){sel=(sel+1)%items.length;SFX.click();}
  else if(e.code==='ArrowLeft'||e.code==='ArrowUp'){sel=(sel+items.length-1)%items.length;SFX.click();}
  else if(e.code==='Enter'||e.code==='Space'){pick(sel);}
});

function cardRects(){
  const cols=2,cardW=340,cardH=70,gap=16;
  const startX=(W-(cardW*cols+gap))/2,startY=140;
  return items.map((it,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    return {x:startX+col*(cardW+gap),y:startY+row*(cardH+gap),w:cardW,h:cardH};
  });
}

function pointerAt(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(done)return;
  const p=pointerAt(e);
  const rects=cardRects();
  for(let i=0;i<rects.length;i++){
    const rc=rects[i];
    if(p.x>=rc.x&&p.x<=rc.x+rc.w&&p.y>=rc.y&&p.y<=rc.y+rc.h){pick(i);return;}
  }
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(done)return;
  const p=pointerAt(e);
  const rects=cardRects();
  for(let i=0;i<rects.length;i++){
    const rc=rects[i];
    if(p.x>=rc.x&&p.x<=rc.x+rc.w&&p.y>=rc.y&&p.y<=rc.y+rc.h){pick(i);return;}
  }
},{passive:false});

let lastTime=null;
function loop(t){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a3a52');sky.addColorStop(1,'#0a1a28');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('game_title_canvas','SCUBA GEAR ASSEMBLY'),W/2,120);
    ctx.font='20px Arial';ctx.fillStyle='#9fd8ec';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start assembling'),W/2,165);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('inspection_failed','INSPECTION FAILED'),W/2,150);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),W/2,195);
    ctx.font='18px Arial';ctx.fillStyle='#9fd8ec';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,230);
    scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);
    return;
  }

  const now=t;
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(done){
    doneTimer--;
    if(doneTimer<=0){round++;startRound();}
  } else {
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;lives--;SFX.error();
      flash=I18N.t('time_up_msg','Time ran out on the assembly!');flashTimer=40;
      if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}}
      else {startRound();}
    }
  }
  if(flashTimer>0)flashTimer--;

  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
  ctx.fillText(I18N.t('round_label','Round {r}').replace('{r}',round),20,32);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {l}').replace('{l}',lives),W-20,32);
  ctx.textAlign='center';

  ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';
  if(done){
    ctx.fillText(I18N.t('assembly_complete','Gear assembled and inspection passed!'),W/2,100);
  } else {
    const stepLabel=steps[nextIdx]?steps[nextIdx].label:'';
    ctx.fillText(I18N.t('next_step_prompt','Next step: find & select the "{step}" part').replace('{step}',stepLabel),W/2,100);
  }

  // timer bar
  const barW=500,barX=(W-barW)/2,barY=112;
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(barX,barY,barW,8);
  const frac=Math.max(0,timeLeft/maxTime);
  ctx.fillStyle=frac>0.4?'#5ec8e0':'#ff6b6b';
  ctx.fillRect(barX,barY,barW*frac,8);

  const rects=cardRects();
  items.forEach((it,i)=>{
    const rc=rects[i];
    let fill='rgba(255,255,255,0.1)';
    if(it.taken)fill='rgba(80,200,120,0.3)';
    else if(i===sel)fill='rgba(94,200,224,0.25)';
    ctx.fillStyle=fill;
    ctx.fillRect(rc.x,rc.y,rc.w,rc.h);
    ctx.strokeStyle=(i===sel&&!it.taken)?'#5ec8e0':'rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.strokeRect(rc.x,rc.y,rc.w,rc.h);
    ctx.fillStyle=it.taken?'#9fffb0':'#fff';
    ctx.font='15px Arial';
    ctx.textAlign='center';
    const label=(it.taken?'✓ ':'')+it.label;
    wrapText(label,rc.x+rc.w/2,rc.y+rc.h/2,rc.w-20,16);
  });

  if(flashTimer>0&&flash){
    ctx.fillStyle='rgba(230,80,80,0.35)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
    ctx.fillText(flash,W/2,H-40);
  }

  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}

function wrapText(text,x,y,maxW,lineH){
  const words=text.split(' ');
  let line='',lines=[];
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  const startY=y-((lines.length-1)*lineH)/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,startY+i*lineH+5));
}

requestAnimationFrame(loop);
</script></body></html>
