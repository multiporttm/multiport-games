<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Freeze Tag</title><meta name="description" content="Play Freeze Tag free online — Outrun the taggers chasing you around the arena. Survive as long as possible before you're caught!"><link rel="canonical" href="https://games.multiportllc.com/games/freezetag"><meta property="og:title" content="Freeze Tag - Multiport Games"><meta property="og:description" content="Play Freeze Tag free online — Outrun the taggers chasing you around the arena. Survive as long as possible before you're caught!"><meta property="og:url" content="https://games.multiportllc.com/games/freezetag"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Freeze Tag","description":"Play Freeze Tag free online instantly. Outrun the taggers chasing you around the arena. Survive as long as possible before you're caught! No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/freezetag","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1b5e20}
#ui{color:#aed581;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Freeze Tag</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Survived: 0s | Taggers: 1 | Best: 0s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to run. A new tagger joins the chase every 12 seconds — the longer you last, the more of them there are!</div>
</div>
<script>
const W=360,H=360,SIZE=20;
let player,taggers,keys={},survived,state,best=+(localStorage.getItem('freezetag_best')||0),addTimer;

function loadBest(){return +(localStorage.getItem('freezetag_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('freezetag_best',v);}

function init(){
  player={x:W/2,y:H/2};
  taggers=[{x:30,y:30,speed:1.7}];
  survived=0;state='play';addTimer=12;best=loadBest();
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=3;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  survived+=1/60;
  addTimer-=1/60;
  if(addTimer<=0){
    addTimer=12;
    const edge=Math.floor(Math.random()*4);
    const pos=edge===0?{x:20,y:20}:edge===1?{x:W-20,y:20}:edge===2?{x:20,y:H-20}:{x:W-20,y:H-20};
    taggers.push({...pos,speed:1.7+taggers.length*0.15});
  }

  taggers.forEach(t=>{
    const ang=Math.atan2(player.y-t.y,player.x-t.x);
    t.x+=Math.cos(ang)*t.speed;t.y+=Math.sin(ang)*t.speed;
    if(dist(player,t)<16){
      state='over';
      saveBest(Math.floor(survived));best=loadBest();
    }
  });

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1b5e20';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  taggers.forEach(t=>{
    ctx.fillStyle='#ef5350';
    ctx.beginPath();ctx.arc(t.x,t.y,13,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#aed581';
  ctx.beginPath();ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.fill();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#aed581';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('TAGGED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Survived: ${Math.floor(survived)}s`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Survived: ${Math.floor(survived)}s | Taggers: ${taggers.length} | Best: ${best}s`;
}

init();draw();
</script></body></html>
