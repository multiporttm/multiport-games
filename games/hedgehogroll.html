<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3e2a1e;display:block;border-radius:8px}
#score-display{color:#deb887;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Hedgehog Roll</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="250"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b> or <b>Tap and Hold</b> to curl into a ball and smash through small obstacles. Release to uncurl and press <b>Up Arrow</b> or <b>tap</b> quickly to jump over gaps. Collect acorns and pick the right moment to switch!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let score=0,hi=0,spd=6,frame=0,gameOver=false,started=false;
const ground=200;
const hog={x:80,y:ground,w:40,h:36,vy:0,curled:false,onGround:true};
let obstacles=[],gaps=[],acorns=[];
let lastTime=null,obsTimer=0,gapTimer=0,acornTimer=0;
let holdStart=0,isHolding=false;

hi=parseFloat(localStorage.getItem('hedgehogroll_hi')||'0');

function reset(){
  score=0;spd=6;frame=0;gameOver=false;started=false;
  obstacles=[];gaps=[];acorns=[];
  hog.y=ground;hog.vy=0;hog.curled=false;hog.onGround=true;
  lastTime=null;obsTimer=0;gapTimer=0;acornTimer=0;isHolding=false;
}

function startCurl(){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  isHolding=true;
  if(hog.onGround&&!hog.curled){hog.curled=true;SFX.select();}
}
function endCurl(){
  isHolding=false;
  if(hog.curled&&hog.onGround){hog.curled=false;}
}
function jump(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(!hog.curled&&hog.onGround){hog.vy=-13;hog.onGround=false;SFX.jump();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();startCurl();}
  else if(e.code==='ArrowUp'){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault();endCurl();}
});
c.addEventListener('mousedown',()=>{startCurl();});
c.addEventListener('mouseup',()=>{endCurl();});
c.addEventListener('touchstart',e=>{e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  holdStart=performance.now();
  startCurl();
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();
  const held=performance.now()-holdStart;
  endCurl();
  if(held<180)jump();
},{passive:false});

function spawnObstacle(){
  obstacles.push({x:820,w:24,h:28,y:ground+hog.h-28});
}
function spawnGap(){
  const w=60+Math.random()*40;
  gaps.push({x:820,w});
}
function spawnAcorn(){
  acorns.push({x:820,y:ground-20-Math.random()*60,w:16,h:16,taken:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawHog(){
  ctx.save();
  const cx=hog.x+hog.w/2,cy=hog.curled?ground+hog.h-18:hog.y+hog.h/2;
  if(hog.curled){
    ctx.fillStyle='#6b4a35';
    ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3e2a1e';
    for(let i=0;i<8;i++){
      const a=frame*0.3+i*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*10,cy+Math.sin(a)*10);
      ctx.lineTo(cx+Math.cos(a)*20,cy+Math.sin(a)*20);
      ctx.lineWidth=3;ctx.strokeStyle='#3e2a1e';ctx.stroke();
    }
  } else {
    ctx.fillStyle='#8a5a3c';
    ctx.fillRect(hog.x,hog.y,hog.w,hog.h);
    ctx.fillStyle='#3e2a1e';
    for(let i=0;i<5;i++){
      ctx.fillRect(hog.x+4+i*7,hog.y-6,5,10);
    }
    ctx.fillStyle='#deb887';
    ctx.fillRect(hog.x+hog.w-8,hog.y+hog.h-10,10,10);
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(hog.x+hog.w+2,hog.y+hog.h-16,4,4);
    const legOff=Math.floor(frame/6)%2===0?0:6;
    ctx.fillStyle='#3e2a1e';
    ctx.fillRect(hog.x+5,hog.y+hog.h,8,8+legOff);
    ctx.fillRect(hog.x+hog.w-13,hog.y+hog.h,8,8+(6-legOff));
  }
  ctx.restore();
}

function drawObstacle(o){
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.fillStyle='#4e342e';
  ctx.fillRect(o.x,o.y,o.w,6);
}
function drawGap(g){
  ctx.fillStyle='#08080f';
  ctx.fillRect(g.x,ground+hog.h,g.w,50);
}
function drawAcorn(a){
  ctx.fillStyle='#a1887f';
  ctx.beginPath();ctx.arc(a.x+8,a.y+10,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(a.x+3,a.y,10,6);
}

function loop(){
  ctx.clearRect(0,0,800,250);
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#1b3a24');sky.addColorStop(1,'#3e2a1e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,250);
  ctx.fillStyle='#4a3222';ctx.fillRect(0,ground+hog.h,800,50);
  ctx.fillStyle='#2e1e14';ctx.fillRect(0,ground+hog.h,800,4);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,158);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#deb88799';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),400,120);
    drawHog();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  frame+=dt;
  score+=dt*(hog.curled?1.6:1)*0.3;
  if(score>hi){hi=score;localStorage.setItem('hedgehogroll_hi',hi);}
  spd=(6+score/250)*(hog.curled?1.6:1);

  obsTimer+=dt;
  const obsInterval=Math.max(55,110-score/30);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObstacle();}

  gapTimer+=dt;
  const gapInterval=Math.max(90,160-score/20);
  if(score>60&&gapTimer>=gapInterval){gapTimer-=gapInterval;spawnGap();}

  acornTimer+=dt;
  if(acornTimer>=90){acornTimer-=90;spawnAcorn();}

  // physics
  if(!hog.curled){
    hog.vy+=0.75*dt;
    hog.y+=hog.vy*dt;
    if(hog.y>=ground){hog.y=ground;hog.vy=0;hog.onGround=true; if(isHolding){hog.curled=true;}}
    else hog.onGround=false;
  } else {
    hog.onGround=true;
  }

  const hogBox=hog.curled?
    {x:hog.x+hog.w/2-18,y:ground+hog.h-36,w:36,h:36}:
    {x:hog.x+2,y:hog.y-4,w:hog.w,h:hog.h+4};

  obstacles=obstacles.filter(o=>o.x>-30);
  obstacles.forEach(o=>{o.x-=spd*dt;drawObstacle(o);
    if(rect(hogBox,{x:o.x,y:o.y,w:o.w,h:o.h})){
      if(hog.curled){
        // smash it
        o.x=-999;score+=5;SFX.hit();
      } else if(!gameOver){
        gameOver=true;SFX.lose();
      }
    }
  });

  gaps=gaps.filter(g=>g.x>-100);
  gaps.forEach(g=>{g.x-=spd*dt;drawGap(g);
    const hogFeetX=hog.x+hog.w/2;
    if(hogFeetX>g.x&&hogFeetX<g.x+g.w&&hog.onGround&&!gameOver){
      if(hog.curled){
        // rolling ball falls in gap - can't jump while curled
        gameOver=true;SFX.lose();
      } else if(hog.y>=ground&&hog.vy===0){
        // standing still in a gap with no jump = fall
        gameOver=true;SFX.lose();
      }
    }
  });

  acorns=acorns.filter(a=>a.x>-30&&!a.taken);
  acorns.forEach(a=>{a.x-=spd*dt;drawAcorn(a);
    if(rect(hogBox,{x:a.x,y:a.y,w:a.w,h:a.h})&&!a.taken){
      a.taken=true;score+=3;SFX.coin();
    }
  });

  drawHog();
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
