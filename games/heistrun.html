<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#263238}
#ui{color:#ffca28;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#ctrls{display:flex;gap:10px;justify-content:center;padding:8px}
#ctrls button{width:70px;height:50px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:1.2rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ctrls button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Heist Run</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="320" height="440"></canvas>
    <div id="ctrls">
      <button id="left-btn">⬅️</button>
      <button id="jump-btn">⬆️ Jump</button>
      <button id="right-btn">➡️</button>
    </div>
  </div>
  <div class="game-instructions">A / D or ⬅️➡️ to switch lanes, <b>Space</b> or ⬆️ to jump. Dodge the barricades — the cop car behind you never stops closing in if you slow down!</div>
</div>
<script>
const W=320,H=440,LANES=3,LANE_W=W/LANES;
let laneX,player,obstacles,dist,speed,jumpT,state,best=+(localStorage.getItem('heistrun_best')||0),spawnTimer;

function loadBest(){return +(localStorage.getItem('heistrun_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('heistrun_best',v);}

function init(){
  laneX=1;
  player={x:LANE_W*1.5,jumping:false};
  obstacles=[];
  dist=0;speed=3.2;jumpT=0;state='play';spawnTimer=60;best=loadBest();
}

function moveLane(d){
  laneX=Math.max(0,Math.min(LANES-1,laneX+d));
}
function jump(){
  if(state!=='play'){init();return;}
  if(!player.jumping){player.jumping=true;jumpT=0;}
}
document.addEventListener('keydown',e=>{
  if(e.key==='a'||e.key==='ArrowLeft')moveLane(-1);
  if(e.key==='d'||e.key==='ArrowRight')moveLane(1);
  if(e.code==='Space'){e.preventDefault();jump();}
});
document.getElementById('left-btn').addEventListener('click',()=>moveLane(-1));
document.getElementById('right-btn').addEventListener('click',()=>moveLane(1));
document.getElementById('jump-btn').addEventListener('click',jump);

function spawnObstacle(){
  const lane=Math.floor(Math.random()*LANES);
  obstacles.push({lane,y:-30});
}

function update(){
  if(state!=='play')return;
  player.x+=(laneX*LANE_W+LANE_W/2-player.x)*0.25;
  if(player.jumping){jumpT++;if(jumpT>30){player.jumping=false;}}

  speed=3.2+dist/800;
  dist+=speed/10;
  spawnTimer--;
  if(spawnTimer<=0){spawnObstacle();spawnTimer=Math.max(28,55-dist/20);}

  obstacles.forEach(o=>o.y+=speed);
  obstacles=obstacles.filter(o=>o.y<H+40);

  for(const o of obstacles){
    if(o.y>H-90&&o.y<H-30&&o.lane===laneX&&!(player.jumping&&jumpT>8&&jumpT<24)){
      state='over';
      saveBest(Math.floor(dist));best=loadBest();
    }
  }

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=2;
  for(let i=1;i<LANES;i++){
    ctx.beginPath();ctx.moveTo(i*LANE_W,0);ctx.lineTo(i*LANE_W,H);ctx.stroke();
  }

  obstacles.forEach(o=>{
    ctx.fillStyle='#ef5350';
    ctx.fillRect(o.lane*LANE_W+14,o.y,LANE_W-28,26);
  });

  const py=H-90-(player.jumping?Math.sin(jumpT/30*Math.PI)*50:0);
  ctx.fillStyle='#ffca28';
  ctx.fillRect(player.x-16,py,32,40);
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(player.x-10,py+8,8,8);
  ctx.fillRect(player.x+2,py+8,8,8);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('CAUGHT!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Distance: ${Math.floor(dist)}m`,W/2,H/2+12);
    ctx.fillText('Tap Jump to run again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Best: ${best}m`;
}

init();draw();
</script></body></html>
