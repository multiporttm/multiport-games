<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#060611}
#c{background:#05051a;display:block;border-radius:8px;touch-action:none}
#hud{color:#8fd3ff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
#progress-wrap{max-width:640px;margin:0 auto 6px;background:#0d1b3a;border-radius:8px;height:10px;overflow:hidden}
#progress-bar{height:100%;background:linear-gradient(90deg,#4fc3f7,#7effc1);width:0%;transition:width .15s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Space Debris Avoidance</div>
  <div class="game-frame">
    <div id="hud"><span>Sector: <b id="sectorLabel">1</b></span><span>Hull: <b id="hullLabel">3</b></span><span>Hi Sector: <b id="hiLabel">0</b></span></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <canvas id="c" width="640" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">
    <b>Arrow Keys / A-D</b> or <b>drag / tap-and-hold</b> to burn thrusters left/right and weave through the debris field. Reach full radar range to clear the sector — hit 3 pieces of debris and it's mission over.
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const HI_KEY='spacedebrisavoidance_hi';
let hiSector=parseInt(localStorage.getItem(HI_KEY)||'0',10);
document.getElementById('hiLabel').textContent=hiSector;

let ship,debris,hull,sector,progress,gameOver,started,keys,lastTime,spawnTimer,dragX,stars;

function resetRun(){
  ship={x:W/2,y:H-60,w:34,h:44,vx:0};
  debris=[];
  hull=3;
  sector=1;
  progress=0;
  gameOver=false;
  started=false;
  keys={};
  lastTime=null;
  spawnTimer=0;
  dragX=null;
  stars=[];
  for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.3,s:Math.random()*0.5+0.2});
  updateHud();
}
resetRun();

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;
  if(!started)startRun();
  if(gameOver)resetRun();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function pointerX(ev){
  const r=c.getBoundingClientRect();
  const clientX=ev.touches?ev.touches[0].clientX:ev.clientX;
  return (clientX-r.left)*(W/r.width);
}
c.addEventListener('pointerdown',e=>{
  if(!started)startRun();
  if(gameOver){resetRun();return;}
  dragX=pointerX(e);
});
c.addEventListener('pointermove',e=>{ if(dragX!==null)dragX=pointerX(e); });
window.addEventListener('pointerup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{e.preventDefault(); if(!started)startRun(); if(gameOver){resetRun();return;} dragX=pointerX(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault(); if(dragX!==null)dragX=pointerX(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault(); dragX=null;},{passive:false});

function startRun(){ started=true; }

function updateHud(){
  document.getElementById('sectorLabel').textContent=sector;
  document.getElementById('hullLabel').textContent=hull;
  document.getElementById('hiLabel').textContent=hiSector;
  document.getElementById('progress-bar').style.width=Math.min(100,progress)+'%';
}

function spawnDebris(){
  const type=Math.random()<0.25?'rock':'frag';
  const size=type==='rock'?(22+Math.random()*16):(10+Math.random()*10);
  debris.push({
    x:20+Math.random()*(W-40),
    y:-size,
    w:size,h:size,
    vy:(2+Math.random()*2+sector*0.25),
    rot:Math.random()*Math.PI*2,
    vr:(Math.random()-0.5)*0.12,
    type
  });
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawStars(dt){
  ctx.fillStyle='#0b0f2a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#cfe8ff';
  stars.forEach(s=>{
    s.y+=s.s*dt;
    if(s.y>H)s.y=0;
    ctx.globalAlpha=0.5+Math.random()*0.3;
    ctx.fillRect(s.x,s.y,s.r,s.r);
  });
  ctx.globalAlpha=1;
}

function drawShip(){
  ctx.save();
  ctx.translate(ship.x,ship.y);
  ctx.fillStyle='#8fd3ff';
  ctx.beginPath();
  ctx.moveTo(0,-ship.h/2);
  ctx.lineTo(ship.w/2,ship.h/2);
  ctx.lineTo(0,ship.h/3);
  ctx.lineTo(-ship.w/2,ship.h/2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(-4,-ship.h/2+6,8,10);
  if(Math.abs(ship.vx)>0.5||keys[' ']){
    ctx.fillStyle='#ff9d4f';
    ctx.beginPath();
    ctx.moveTo(-6,ship.h/2);
    ctx.lineTo(0,ship.h/2+8+Math.random()*6);
    ctx.lineTo(6,ship.h/2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawDebris(d){
  ctx.save();
  ctx.translate(d.x+d.w/2,d.y+d.h/2);
  ctx.rotate(d.rot);
  ctx.fillStyle=d.type==='rock'?'#9a8c7a':'#b0b8c4';
  ctx.beginPath();
  const s=d.w/2;
  ctx.moveTo(-s,-s*0.6);ctx.lineTo(-s*0.3,-s);ctx.lineTo(s,-s*0.4);
  ctx.lineTo(s*0.6,s);ctx.lineTo(-s*0.6,s*0.8);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#060611';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
}

function endGame(win){
  gameOver=true;
  if(win){
    SFX.success();
    sector++;
    progress=0;
    debris=[];
    gameOver=false;
    started=true;
    if(sector-1>hiSector){hiSector=sector-1;localStorage.setItem(HI_KEY,hiSector);}
  }else{
    SFX.lose();
    if(sector-1>hiSector){hiSector=sector-1;localStorage.setItem(HI_KEY,hiSector);}
  }
  updateHud();
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawStars(started&&!gameOver?dt*2:0.4);

  if(!started){
    ctx.fillStyle='#8fd3ff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key or tap to launch'),W/2,H/2);
    drawShip();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','HULL BREACH'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to retry'),W/2,H/2+26);
    requestAnimationFrame(loop);return;
  }

  if(keys['ArrowLeft']||keys['a']||keys['A'])ship.vx=-5.5;
  else if(keys['ArrowRight']||keys['d']||keys['D'])ship.vx=5.5;
  else if(dragX!==null)ship.vx=(dragX-ship.x)*0.18;
  else ship.vx*=0.85;

  ship.x+=ship.vx*dt;
  ship.x=Math.max(ship.w/2+4,Math.min(W-ship.w/2-4,ship.x));

  spawnTimer+=dt;
  const interval=Math.max(14,34-sector*2);
  if(spawnTimer>=interval){spawnTimer=0;spawnDebris();}

  progress+=dt*0.45;
  if(progress>=100){endGame(true);drawShip();updateHud();requestAnimationFrame(loop);return;}

  const shipHit={x:ship.x-ship.w/2+6,y:ship.y-ship.h/2+6,w:ship.w-12,h:ship.h-12};
  debris=debris.filter(d=>d.y<H+40);
  debris.forEach(d=>{
    d.y+=d.vy*dt;
    d.rot+=d.vr*dt;
    drawDebris(d);
    if(!gameOver&&rectHit(shipHit,d)){
      d.y=H+999;
      hull--;
      SFX.hit();
      if(hull<=0){endGame(false);}
    }
  });

  drawShip();
  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
