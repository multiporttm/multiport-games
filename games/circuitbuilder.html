<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d1b2e;cursor:pointer}
#ui{color:#ffd54f;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Circuit Builder</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Level: 1 | Moves: 12</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap a wire tile to rotate it 90°. Connect the 🔋 battery to the 💡 bulb through an unbroken path of wires before you run out of moves. The bulb lights up once connected!</div>
</div>
<script>
const W=360,H=360,COLS=5,ROWS=5,CELL=W/COLS;
let grid,level,moves,maxMoves,state,startCell,endCell;

function loadBest(){return +(localStorage.getItem('circuitbuilder_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('circuitbuilder_best',v);}

const TYPES=['straight','curve'];
function randomTile(){
  const type=TYPES[Math.floor(Math.random()*2)];
  const rot=Math.floor(Math.random()*4);
  return {type,rot};
}
function connections(tile){
  const dirs=tile.type==='straight'?[0,2]:[0,1];
  return dirs.map(d=>(d+tile.rot)%4);
}

function init(){level=1;state='play';newLevel();}
function newLevel(){
  grid=[];
  for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push(randomTile());grid.push(row);}
  startCell={r:Math.floor(Math.random()*ROWS),c:0};
  endCell={r:Math.floor(Math.random()*ROWS),c:COLS-1};
  maxMoves=10+level*2;
  moves=maxMoves;
}

function isConnected(){
  const visited=new Set();
  const stack=[startCell];
  const DX=[0,1,0,-1],DY=[-1,0,1,0];
  while(stack.length){
    const cur=stack.pop();
    const key=cur.r+','+cur.c;
    if(visited.has(key))continue;
    visited.add(key);
    const tile=grid[cur.r][cur.c];
    const conns=connections(tile);
    for(const dir of conns){
      const nr=cur.r+DY[dir],nc=cur.c+DX[dir];
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS)continue;
      const ntile=grid[nr][nc];
      const nconns=connections(ntile);
      const opp=(dir+2)%4;
      if(nconns.includes(opp))stack.push({r:nr,c:nc});
    }
  }
  return visited.has(endCell.r+','+endCell.c);
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='win'){level++;newLevel();state='play';return;}
  if(state==='over'){level=1;newLevel();state='play';return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  if(row<0||row>=ROWS||col<0||col>=COLS)return;
  if((row===startCell.r&&col===startCell.c)||(row===endCell.r&&col===endCell.c))return;
  grid[row][col].rot=(grid[row][col].rot+1)%4;
  moves--;
  SFX.tick();
  if(isConnected()){
    state='win';
    SFX.win();
    saveBest(level);
  }else if(moves<=0){
    state='over';
    SFX.lose();
  }
  updateUI();
});

function draw(){
  ctx.fillStyle='#0d1b2e';ctx.fillRect(0,0,W,H);
  const lit=state==='win';

  for(let r=0;r<ROWS;r++){
    for(let c2=0;c2<COLS;c2++){
      const x=c2*CELL,y=r*CELL;
      ctx.strokeStyle='rgba(255,255,255,.1)';
      ctx.strokeRect(x,y,CELL,CELL);
      const tile=grid[r][c2];
      const conns=connections(tile);
      ctx.strokeStyle=lit?'#ffd54f':'#546e7a';
      ctx.lineWidth=6;
      ctx.beginPath();
      conns.forEach(dir=>{
        const cx=x+CELL/2,cy=y+CELL/2;
        const ex=cx+[0,CELL/2,0,-CELL/2][dir],ey=cy+[-CELL/2,0,CELL/2,0][dir];
        ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);
      });
      ctx.stroke();
    }
  }

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🔋',startCell.c*CELL+CELL/2,startCell.r*CELL+CELL/2);
  ctx.fillText(lit?'💡':'⚫',endCell.c*CELL+CELL/2,endCell.r*CELL+CELL/2);

  if(state==='win'||state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 26px Arial';
    ctx.fillText(state==='win'?I18N.t('connected_title','CONNECTED!'):I18N.t('out_of_moves_title','OUT OF MOVES'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('level_best','Level: {n} | Best: {b}').replace('{n}',level).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('continue_hint','Tap to continue'),W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('level_moves','Level: {n} | Moves: {m}').replace('{n}',level).replace('{m}',Math.max(0,moves));
}

init();draw();updateUI();
</script></body></html>
