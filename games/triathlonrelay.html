<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#00838f,#f9a825);display:block;border-radius:8px}
#score-display{color:#fff3c4;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#tri-controls{display:flex;justify-content:center;gap:14px;margin-top:8px}
#tri-controls button{padding:14px 28px;border:none;border-radius:14px;background:#00838f;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer;user-select:none;touch-action:manipulation}
#tri-controls button:active{transform:scale(.92)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Triathlon Relay</div>
  <div class="game-frame">
    <div id="score-display">Stage: Swim | Time: 0.0s | Wins: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="tri-controls">
      <button id="leftBtn">A</button>
      <button id="rightBtn">D</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>A</b> and <b>D</b> (or the on-screen buttons) rhythmically to power through each stage — <b>swim</b>, <b>bike</b>, and <b>run</b> — as fast as possible. Race past the AI competitor and beat your best combined time across all three stages!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const trackLen=650;
let hiTotal=parseFloat(localStorage.getItem('triathlonrelay_hi')||'0');
let wins=parseInt(localStorage.getItem('triathlonrelay_wins')||'0',10);

const STAGES=['swim','bike','run'];
const STAGE_NAMES={swim:'Swim',bike:'Bike',run:'Run'};
let stageIdx=0,phase='ready'; // ready, racing, transition, stagedone, finished
let player,ai,stageTimer=0,transTimer=0,totalTime=0,stageTimes=[],stagesWon=0;
let lastKey=null,started=false,lastTime=null;
let finalResult=null;

function newRace(){
  stageIdx=0;phase='ready';started=false;totalTime=0;stageTimes=[];finalResult=null;stagesWon=0;
  setupStage();
}
function setupStage(){
  player={pos:0,speed:0};
  ai={pos:0,speed:1.15+stageIdx*0.05};
  stageTimer=0;lastKey=null;
  phase='ready';
}

function press(key){
  if(!started){started=true;phase='racing';}
  if(phase==='transition'){ // allow skipping transition by mashing too, but auto-advances anyway
    return;
  }
  if(phase!=='racing')return;
  if(key!==lastKey){
    player.speed=Math.min(player.speed+0.85,7);
    lastKey=key;
    SFX.tick();
  } else {
    player.speed=Math.max(player.speed-0.15,0);
  }
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')press('L');
  else if(k==='d'||k==='arrowright')press('R');
  if(finished_click_ready())restartIfDone();
});
document.getElementById('leftBtn').addEventListener('click',()=>{press('L');restartIfDone();});
document.getElementById('rightBtn').addEventListener('click',()=>{press('R');restartIfDone();});
c.addEventListener('click',()=>{restartIfDone();});

function finished_click_ready(){return phase==='finished';}
function restartIfDone(){ if(phase==='finished') newRace(); }

function drawSwim(t){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#00acc1');bg.addColorStop(1,'#00838f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<W;x+=20){
      ctx.lineTo(x,60+i*40+Math.sin((x+t*2)/30)*6);
    }
    ctx.stroke();
  }
}
function drawBike(t){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#81d4fa');bg.addColorStop(1,'#f9a825');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6d4c41';ctx.fillRect(0,H-40,W,40);
}
function drawRun(t){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#a5d6a7');bg.addColorStop(1,'#f9a825');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,H-40,W,40);
}

function drawRacer(x,laneY,color,bob){
  ctx.save();
  ctx.translate(x,laneY+Math.sin(bob)*3);
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.restore();
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  const stage=STAGES[stageIdx];
  if(stage==='swim')drawSwim(now/16);
  else if(stage==='bike')drawBike(now/16);
  else drawRun(now/16);

  // lanes
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(W,150);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText('FINISH',W-90,60);
  ctx.fillRect(W-95,20,5,90);

  if(phase==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tri_ready_hint','Alternate A / D to start the {stage}!').replace('{stage}',I18N.t('tri_stage_'+stage,STAGE_NAMES[stage])),400,150);
    drawRacer(60,100,'#ffca28',0);
    drawRacer(60,200,'#e57373',0);
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  if(phase==='racing'){
    stageTimer+=dt/60;
    totalTimeLive=totalTime+stageTimer;
    // player decays speed a bit each frame to require continued alternation
    player.speed*=Math.pow(0.965,dt);
    player.pos+=player.speed*dt;
    ai.pos+=ai.speed*dt*(0.9+Math.sin(now/500)*0.15);

    const playerX=60+Math.min(player.pos/trackLen,1)*(W-160);
    const aiX=60+Math.min(ai.pos/trackLen,1)*(W-160);
    drawRacer(playerX,100,'#ffca28',now/100);
    drawRacer(aiX,200,'#e57373',now/90);

    if(player.pos>=trackLen||ai.pos>=trackLen){
      const playerWon=player.pos>=ai.pos;
      stageTimes.push(stageTimer);
      totalTime+=stageTimer;
      SFX[playerWon?'success':'fail']();
      if(playerWon)stagesWon++;
      phase='stagedone';
      transTimer=0;
      lastStageWon=playerWon;
    }
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  if(phase==='stagedone'){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(lastStageWon?I18N.t('tri_stage_win','Stage complete!'):I18N.t('tri_stage_lose','Fell behind...'),400,140);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tri_stage_time','{stage} time: {t}s').replace('{stage}',STAGE_NAMES[stage]).replace('{t}',stageTimer.toFixed(1)),400,172);
    transTimer+=dt/60;
    if(transTimer>1.4){
      stageIdx++;
      if(stageIdx>=STAGES.length){
        finishRace();
      } else {
        SFX.levelup();
        phase='transition';
        transTimer=0;
      }
    }
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  if(phase==='transition'){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tri_transition','Transition! Get ready for the {stage}').replace('{stage}',STAGE_NAMES[STAGES[stageIdx]]),400,150);
    transTimer+=dt/60;
    if(transTimer>1.2){
      setupStage();
      started=false;
      phase='ready';
    }
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  if(phase==='finished'){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tri_finish_title','TRIATHLON COMPLETE!'),400,110);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('tri_total_time','Total time: {t}s').replace('{t}',totalTime.toFixed(1)),400,150);
    ctx.fillText(I18N.t('tri_best_time','Best time: {t}s').replace('{t}',hiTotal>0?hiTotal.toFixed(1):'--'),400,180);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press A/D to race again'),400,214);
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }
}
let lastStageWon=false,totalTimeLive=0;

function finishRace(){
  phase='finished';
  const won=finalWinCheck();
  if(won){wins++;localStorage.setItem('triathlonrelay_wins',String(wins));}
  if(hiTotal===0||totalTime<hiTotal){hiTotal=totalTime;localStorage.setItem('triathlonrelay_hi',String(hiTotal));}
  SFX.win();
}
function finalWinCheck(){
  // won overall if player beat the AI competitor in at least 2 of the 3 stages
  return stagesWon>=2;
}

function updateHUD(){
  const stage=STAGES[Math.min(stageIdx,STAGES.length-1)];
  document.getElementById('score-display').textContent=
    I18N.t('tri_hud_label','Stage: {s} | Time: {t}s | Best: {b} | Races: {w}')
      .replace('{s}',I18N.t('tri_stage_'+stage,STAGE_NAMES[stage]))
      .replace('{t}',(totalTime+(phase==='racing'?stageTimer:0)).toFixed(1))
      .replace('{b}',hiTotal>0?hiTotal.toFixed(1)+'s':'--')
      .replace('{w}',wins);
}

newRace();
loop();
</script></body></html>
