<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Power Duel</title><meta name="description" content="Play Power Duel free online — Punch, block, or unleash your energy blast against the CPU. P = punch · B = block · E = energy blast (costs energy) · or use buttons above"><link rel="canonical" href="https://games.multiportllc.com/games/powerduel"><meta property="og:title" content="Power Duel - Multiport Games"><meta property="og:description" content="Play Power Duel free online — Punch, block, or unleash your energy blast against the CPU. P = punch · B = block · E = energy blast (costs energy) · or use buttons above"><meta property="og:url" content="https://games.multiportllc.com/games/powerduel"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Power Duel","description":"Play Power Duel free online instantly. Punch, block, or unleash your energy blast against the CPU. P = punch, B = block, E = energy blast (costs energy). No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/powerduel","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=6">
<style>body{background:#08080f}#c{display:block;border-radius:8px;margin:0 auto}#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}</style>
</head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Power Duel</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">HP: ❤️❤️❤️❤️❤️ | Round 1</div>
    <canvas id="c" width="500" height="380"></canvas>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;padding:8px">
    <button ontouchstart="playerAttack('punch')" onmousedown="playerAttack('punch')" style="padding:12px 22px;background:rgba(255,204,128,.12);border:1px solid rgba(255,204,128,.3);border-radius:12px;color:#ffcc80;font-size:1rem;font-weight:700;cursor:pointer">👊 Punch</button>
    <button ontouchstart="touchBlock(true)" ontouchend="touchBlock(false)" onmousedown="touchBlock(true)" onmouseup="touchBlock(false)" style="padding:12px 22px;background:rgba(21,101,192,.18);border:1px solid rgba(21,101,192,.4);border-radius:12px;color:#90caf9;font-size:1rem;font-weight:700;cursor:pointer">🛡️ Block</button>
    <button ontouchstart="playerAttack('blast')" onmousedown="playerAttack('blast')" style="padding:12px 22px;background:rgba(255,87,34,.15);border:1px solid rgba(255,87,34,.35);border-radius:12px;color:#ff8a65;font-size:1rem;font-weight:700;cursor:pointer">🔥 Energy Blast</button>
  </div>
  <div class="game-instructions"><b>P</b> = punch · <b>B</b> = block · <b>E</b> = energy blast (costs energy) · or use buttons above</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let player,enemy,frame,state,round,keys={};

function start(){
  player={x:80,y:180,hp:5,energy:5,blocking:false,attacking:false,atkTimer:0,hitFlash:0};
  enemy={x:380,y:180,hp:5,aiTimer:60,action:null,atkTimer:0,hitFlash:0};
  frame=0;state='play';round=1;
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(state!=='play')return;
  if(e.code==='KeyP')playerAttack('punch');
  if(e.code==='KeyE')playerAttack('blast');
  if(e.code==='KeyB')player.blocking=true;
});
document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyB')player.blocking=false;});
c.addEventListener('click',()=>{if(state!=='play')start();});
function touchBlock(on){if(state==='play')player.blocking=on;}

function playerAttack(type){
  if(player.atkTimer>0)return;
  if(type==='blast'&&player.energy<2)return;
  player.attacking=true;player.atkTimer=25+(type==='blast'?10:0);
  if(type==='blast')player.energy-=2;
  const dmg=type==='blast'?2:1;
  setTimeout(()=>{
    if(state!=='play')return;
    if(!enemy.blocking){enemy.hp-=dmg;enemy.hitFlash=15;}
    else{enemy.blocking=false;}
    if(enemy.hp<=0)endRound('win');
  },200);
}

function enemyAI(){
  enemy.aiTimer--;
  if(enemy.aiTimer<=0){
    enemy.aiTimer=40+Math.random()*40;
    const r=Math.random();
    if(r<.4){
      enemy.action='attack';enemy.atkTimer=25;
      setTimeout(()=>{
        if(state!=='play')return;
        if(!player.blocking){player.hp--;player.hitFlash=15;}
        if(player.hp<=0)endRound('lose');
      },220);
    } else if(r<.7){enemy.action='block';enemy.blocking=true;setTimeout(()=>{enemy.blocking=false;enemy.action=null;},400);}
    else enemy.action=null;
  }
}

function endRound(result){
  state=result==='win'?'win':'lose';
  setTimeout(()=>{
    if(result==='win'){round++;if(round>5){state='victory';return;}enemy.hp=5;enemy.aiTimer=30;player.atkTimer=0;state='play';}
    else{state='gameover';}
  },1200);
}

function drawFighter(f,flip,label){
  ctx.save();ctx.translate(f.x,f.y);if(flip)ctx.scale(-1,1);
  if(f.hitFlash>0){ctx.fillStyle=`rgba(255,140,60,${f.hitFlash/15*.5})`;ctx.fillRect(-30,-80,60,120);f.hitFlash--;}
  ctx.fillStyle=f.blocking?'#546e7a':'#37474f';ctx.fillRect(-15,-60,30,60);
  ctx.fillStyle='#ffcc80';ctx.beginPath();ctx.arc(0,-75,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.fillRect(-7,-78,5,5);ctx.fillRect(3,-78,5,5);
  const armAng=f.attacking||f.atkTimer>0?(Math.random()*.4-.8):(f.blocking?-.3:-.5);
  ctx.save();ctx.rotate(armAng);
  if(f.atkTimer>15){ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(34,-80,12+Math.random()*4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#ffcc80';ctx.fillRect(20,-84,16,10);
  ctx.restore();
  if(f.blocking){ctx.fillStyle='#1565c0';ctx.fillRect(-35,-60,20,50);ctx.fillStyle='#1976d2';ctx.fillRect(-32,-55,14,40);}
  ctx.fillStyle='#333';ctx.fillRect(-25,-100,50,8);ctx.fillStyle='#f44336';ctx.fillRect(-25,-100,50*(f.hp/5),8);
  ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(label,0,-88);
  ctx.restore();
}

function loop(){
  const bg=ctx.createLinearGradient(0,0,0,380);
  bg.addColorStop(0,'#1a0f0a');bg.addColorStop(1,'#2e1a0f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,500,380);
  ctx.fillStyle='#3e2723';ctx.fillRect(0,250,500,130);ctx.fillStyle='#4e342e';ctx.fillRect(0,250,500,8);
  [[60,200],[440,200]].forEach(([x,y])=>{ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(x,y,10+Math.sin(frame*.2)*4,0,Math.PI*2);ctx.fill();});

  if(state==='play'){frame++;if(player.atkTimer>0)player.atkTimer--;enemyAI();if(enemy.atkTimer>0)enemy.atkTimer--;}
  drawFighter(player,false,'YOU');drawFighter(enemy,true,'CPU');

  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(10,10,100,14);
  ctx.fillStyle='#ff7043';ctx.fillRect(10,10,player.energy*20,14);
  ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='left';ctx.fillText('Energy',12,22);

  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText('P=Punch  B=Block  E=Energy Blast',250,370);

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,500,380);
    const msg=state==='win'?'Round Clear! 👊':state==='victory'?'CHAMPION! 🏆':state==='gameover'?'DEFEATED! 💀':'...';
    ctx.fillStyle='#ffcc80';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText(msg,250,170);
    ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Click to retry',250,210);
  }

  document.getElementById('ui').textContent=`HP: ${'❤️'.repeat(Math.max(0,player.hp))} | Round ${round}/5`;
  requestAnimationFrame(loop);
}
start();loop();
setInterval(()=>{if(player&&player.energy<5&&state==='play')player.energy=Math.min(5,player.energy+.02);},100);
</script></body></html>
