<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#8d6e63;cursor:pointer}
#ui{color:#fff3e0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Magic Shell Game</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Streak: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Watch which shell hides the ball, then track it as the shells shuffle around. Once they stop, tap the shell you think is hiding the ball. Get it right to keep your streak going — shuffles get faster and trickier each round!</div>
</div>
<script>
const W=360,H=360,Y=180;
let shellX,ballIdx,streak,state,phase,shuffleQueue,shuffleT,revealT;

function loadBest(){return +(localStorage.getItem('shellgame_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('shellgame_best',v);}

function init(){streak=0;state='play';newRound();}
function newRound(){
  shellX=[100,180,260];
  ballIdx=1;
  phase='show';revealT=60;
}

function genShuffles(){
  const n=6+Math.min(10,streak);
  shuffleQueue=[];
  for(let i=0;i<n;i++){
    const a=Math.floor(Math.random()*3);
    let b=Math.floor(Math.random()*3);
    while(b===a)b=Math.floor(Math.random()*3);
    shuffleQueue.push([a,b]);
  }
  shuffleT=0;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  if(phase!=='guess')return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const idx=shellX.findIndex(sx=>Math.abs(sx-x)<35);
  if(idx===-1)return;
  if(idx===ballIdx){
    streak++;
    SFX.success();
    saveBest(streak);
    setTimeout(newRound,900);
  }else{
    state='over';
    SFX.lose();
    saveBest(streak);
  }
  phase='reveal';
  updateUI();
});

function update(){
  if(state!=='play')return;
  if(phase==='show'){
    revealT--;
    if(revealT<=0){phase='shuffle';genShuffles();}
  }else if(phase==='shuffle'){
    shuffleT++;
    const speed=Math.max(6,14-streak);
    if(shuffleT>=speed){
      shuffleT=0;
      if(shuffleQueue.length){
        const [a,b]=shuffleQueue.shift();
        [shellX[a],shellX[b]]=[shellX[b],shellX[a]];
        if(ballIdx===a)ballIdx=b;else if(ballIdx===b)ballIdx=a;
        SFX.tick();
      }else{
        phase='guess';
      }
    }
  }
}

function draw(){
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,0,W,H);

  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  if(phase==='show'){
    ctx.fillText('🔴',shellX[ballIdx],Y);
  }
  [0,1,2].forEach(i=>{
    ctx.fillText('🥥',shellX[i],Y+30);
  });

  ctx.fillStyle='#fff3e0';ctx.font='14px Arial';
  ctx.fillText(phase==='show'?'Watch the ball!':phase==='shuffle'?'Tracking...':phase==='guess'?'Tap the shell!':'',W/2,H-40);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff3e0';ctx.font='bold 26px Arial';
    ctx.fillText('WRONG SHELL!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Streak: ${streak} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Streak: ${streak} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
