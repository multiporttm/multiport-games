<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#3e2723}
#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px}
#btns button{padding:12px 20px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rail Rush</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="jumpBtn">⬆️ Jump</button>
      <button id="duckBtn">⬇️ Duck</button>
    </div>
  </div>
  <div class="game-instructions">Up arrow / Space (or Jump) to leap over low barriers. Down arrow (or Duck) to slide under overhead beams. Time it right — the cart keeps speeding up!</div>
</div>
<script>
const W=360,H=360,TRACK_Y=H-70,CART_X=90;
let obstacles,dist,speed,state,cartState,cartTimer,spawnTimer;

function loadBest(){return +(localStorage.getItem('railrush_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('railrush_best',v);}

function init(){
  obstacles=[];dist=0;speed=3.2;state='play';cartState='run';cartTimer=0;spawnTimer=60;
}

function jump(){
  if(state==='over'){init();return;}
  if(cartState==='run'){cartState='jump';cartTimer=32;SFX.jump();}
}
function duck(){
  if(state==='over'){init();return;}
  if(cartState==='run'){cartState='duck';cartTimer=32;SFX.swoosh();}
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key===' '){e.preventDefault();jump();}
  if(e.key==='ArrowDown'){e.preventDefault();duck();}
});
document.getElementById('jumpBtn').addEventListener('click',jump);
document.getElementById('duckBtn').addEventListener('click',duck);

function spawnObstacle(){
  const type=Math.random()<0.5?'low':'high';
  obstacles.push({x:W+20,type});
}

function update(){
  if(state!=='play')return;
  speed=3.2+dist*0.0018;
  dist+=speed*0.07;

  if(cartTimer>0){cartTimer--;if(cartTimer<=0)cartState='run';}

  spawnTimer--;
  if(spawnTimer<=0){
    spawnObstacle();
    spawnTimer=Math.max(30,70-dist*0.05);
  }

  obstacles.forEach(o=>o.x-=speed);
  obstacles=obstacles.filter(o=>o.x>-30);

  obstacles.forEach(o=>{
    if(Math.abs(o.x-CART_X)<20){
      const dodged=(o.type==='low'&&cartState==='jump')||(o.type==='high'&&cartState==='duck');
      if(!dodged&&!o.hit){
        o.hit=true;
        state='over';
        SFX.lose();
        saveBest(Math.floor(dist));
      }
    }
  });
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#3e2723';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.15)';
  for(let x=0;x<W;x+=30){
    ctx.beginPath();ctx.moveTo((x-dist*3)%W-30,TRACK_Y+20);ctx.lineTo((x-dist*3)%W-30+16,TRACK_Y+20);ctx.stroke();
  }
  ctx.fillStyle='#5d4037';ctx.fillRect(0,TRACK_Y+16,W,6);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  obstacles.forEach(o=>{
    ctx.fillText(o.type==='low'?'🪨':'🪵',o.x,o.type==='low'?TRACK_Y:TRACK_Y-30);
  });

  let cartY=TRACK_Y;
  if(cartState==='jump')cartY-=30;
  ctx.font='26px Arial';
  if(cartState==='duck'){
    ctx.fillText('🛒',CART_X,TRACK_Y+8);
  }else{
    ctx.fillText('🛒',CART_X,cartY);
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcc80';ctx.font='bold 26px Arial';
    ctx.fillText('CRASH!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`,W/2,H/2+12);
    ctx.fillText('Tap Jump/Duck to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`;
}

init();draw();
</script></body></html>
