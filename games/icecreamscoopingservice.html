<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#fff3e0;display:block;border-radius:8px}
#score-display{color:#e08f36;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Cream Scooping Service</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>1-4</b> or <b>tap a tub</b> to pick the flavor the customer ordered, then press <b>Space</b> or <b>tap SCOOP</b> when the needle sits in the green zone to serve the perfect scoop. Wrong flavor or a bad scoop costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const FLAVORS=[
  {name:'Vanilla',color:'#fff3cc',dark:'#e8d9a0'},
  {name:'Chocolate',color:'#6b4423',dark:'#4a2d16'},
  {name:'Strawberry',color:'#ff9bb3',dark:'#e06e8c'},
  {name:'Mint',color:'#8af0c0',dark:'#56c998'}
];
const HS_KEY='hs_icecreamscoopingservice';
let score=0,lives=3,level=1,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let state='picking'; // picking | scooping | serving | over
let order=null,served=0;
let orderTimer=0,orderTimeLimit=9000;
let gauge=0,gaugeDir=1,gaugeSpeed=0.9,zoneW=0.26,zoneCenter=0.5;
let flashMsg='',flashTimer=0,flashColor='#fff';
let started=false;
let lastTime=null;

function newOrder(){
  const idx=Math.floor(Math.random()*FLAVORS.length);
  order=FLAVORS[idx];
  state='picking';
  orderTimer=0;
  orderTimeLimit=Math.max(4200,9000-level*450);
}

function startScoop(){
  state='scooping';
  gauge=Math.random();
  gaugeDir=Math.random()<0.5?-1:1;
  gaugeSpeed=0.55+level*0.12;
  zoneW=Math.max(0.14,0.3-level*0.018);
  zoneCenter=0.5;
}

function pickTub(i){
  if(state!=='picking'||gameOverCheck())return;
  const chosen=FLAVORS[i];
  if(!order)return;
  if(chosen.name===order.name){
    SFX.select();
    startScoop();
  }else{
    SFX.error();
    loseLife(I18N.t('wrong_flavor','Wrong flavor!'));
  }
}

function doScoop(){
  if(state!=='scooping')return;
  const dist=Math.abs(gauge-zoneCenter);
  if(dist<=zoneW/2){
    const precision=1-(dist/(zoneW/2));
    const pts=Math.round(80+precision*70+level*10);
    score+=pts;
    served++;
    flashMsg=I18N.t('nice_scoop','Nice scoop! +')+pts;
    flashColor='#3fae56';
    flashTimer=70;
    SFX.success();
    if(served%5===0)level++;
    state='serving';
    setTimeout(()=>{ if(state==='serving'){newOrder();} },500);
  }else{
    SFX.fail();
    loseLife(I18N.t('bad_scoop','Bad scoop — too '+(gauge<zoneCenter?'hard':'soft')+'!'));
  }
}

function loseLife(msg){
  lives--;
  flashMsg=msg;
  flashColor='#e24c4c';
  flashTimer=70;
  if(lives<=0){
    gameOver();
  }else{
    state='serving';
    setTimeout(()=>{ if(state==='serving'){newOrder();} },500);
  }
}

function gameOverCheck(){return state==='over';}

function gameOver(){
  state='over';
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
}

function reset(){
  score=0;lives=3;level=1;served=0;started=true;
  newOrder();
}

document.addEventListener('keydown',e=>{
  if(!started){ if(e.code==='Space'){reset();} return; }
  if(state==='over'){ if(e.code==='Space'){reset();} return; }
  if(e.code==='Digit1'||e.code==='Numpad1')pickTub(0);
  else if(e.code==='Digit2'||e.code==='Numpad2')pickTub(1);
  else if(e.code==='Digit3'||e.code==='Numpad3')pickTub(2);
  else if(e.code==='Digit4'||e.code==='Numpad4')pickTub(3);
  else if(e.code==='Space'){e.preventDefault();doScoop();}
});

function tubRects(){
  const tw=160,gap=20,total=FLAVORS.length*tw+(FLAVORS.length-1)*gap;
  const startX=(W-total)/2,y=300;
  return FLAVORS.map((f,i)=>({x:startX+i*(tw+gap),y,w:tw,h:90,flavor:f,idx:i}));
}
function scoopRect(){return {x:W/2-110,y:300,w:220,h:90};}

function pointerPos(e,rectEl){
  const r=rectEl.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.h+r.y;}

function handleTap(e){
  e.preventDefault();
  if(!started||state==='over'){reset();return;}
  const p=pointerPos(e,c);
  if(state==='picking'){
    tubRects().forEach(t=>{ if(inRect(p,t))pickTub(t.idx); });
  }else if(state==='scooping'){
    const sr=scoopRect();
    if(inRect(p,sr))doScoop();
  }
}
c.addEventListener('pointerdown',handleTap);
c.addEventListener('touchstart',handleTap,{passive:false});

function drawTub(t){
  ctx.fillStyle=t.flavor.dark;
  ctx.fillRect(t.x,t.y,t.w,t.h);
  ctx.fillStyle=t.flavor.color;
  ctx.fillRect(t.x+6,t.y+6,t.w-12,t.h-18);
  ctx.fillStyle='#2b2b2b';
  ctx.font='bold 15px Arial';ctx.textAlign='center';
  ctx.fillText(t.flavor.name,t.x+t.w/2,t.y+t.h+18);
  ctx.font='12px Arial';ctx.fillStyle='#999';
  ctx.fillText('['+(t.idx+1)+']',t.x+t.w/2,t.y+t.h+34);
  if(order&&order.name===t.flavor.name&&state==='picking'){
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;
    ctx.strokeRect(t.x-2,t.y-2,t.w+4,t.h+4);
  }
}

function drawCounter(){
  ctx.fillStyle='#d9a066';
  ctx.fillRect(0,290,W,20);
  ctx.fillStyle='#b97f4a';
  ctx.fillRect(0,310,W,110);
}

function drawOrder(){
  ctx.fillStyle='#2b2b2b';
  ctx.font='bold 22px Arial';ctx.textAlign='center';
  if(order){
    ctx.fillText(I18N.t('order_label','Order: ')+order.name,W/2,90);
    ctx.fillStyle=order.color;
    ctx.beginPath();ctx.arc(W/2,140,34,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=order.dark;ctx.lineWidth=3;ctx.stroke();
  }
  // order timer bar
  if(state==='picking'){
    const pct=Math.max(0,1-orderTimer/orderTimeLimit);
    ctx.fillStyle='#ccc';ctx.fillRect(W/2-150,185,300,14);
    ctx.fillStyle=pct<0.3?'#e24c4c':'#3fae56';
    ctx.fillRect(W/2-150,185,300*pct,14);
  }
}

function drawGauge(){
  const gx=W/2-220,gy=250,gw=440,gh=28;
  ctx.fillStyle='#e24c4c';ctx.fillRect(gx,gy,gw,gh);
  const zoneX=gx+(zoneCenter-zoneW/2)*gw;
  ctx.fillStyle='#3fae56';ctx.fillRect(zoneX,gy,zoneW*gw,gh);
  const nx=gx+gauge*gw;
  ctx.fillStyle='#222';
  ctx.fillRect(nx-3,gy-8,6,gh+16);
  ctx.fillStyle='#555';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('too_hard','TOO HARD'),gx,gy-14);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('too_soft','TOO SOFT'),gx+gw,gy-14);
}

function drawScoopBtn(){
  const r=scoopRect();
  ctx.fillStyle=state==='scooping'?'#ffd54f':'#d8c27a';
  ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.fillStyle='#2b2b2b';ctx.font='bold 24px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('scoop_btn','SCOOP (Space)'),r.x+r.w/2,r.y+r.h/2+8);
}

function loop(ts){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,290);
  sky.addColorStop(0,'#ffe9c4');sky.addColorStop(1,'#fff3e0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,290);
  drawCounter();

  if(!started){
    ctx.fillStyle='#2b2b2b';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space or Tap to start'),W/2,150);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(state==='over'){
    ctx.fillStyle='#2b2b2b';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,150);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: ')+score,W/2,190);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,224);
  }else{
    if(state==='picking'){
      orderTimer+=dt*16.6667;
      if(orderTimer>=orderTimeLimit){loseLife(I18N.t('too_slow','Too slow — melted away!'));}
      drawOrder();
      tubRects().forEach(drawTub);
    }else if(state==='scooping'){
      gauge+=gaugeDir*gaugeSpeed*0.01*dt;
      if(gauge>1){gauge=1;gaugeDir=-1;}
      if(gauge<0){gauge=0;gaugeDir=1;}
      drawOrder();
      drawGauge();
      drawScoopBtn();
    }else if(state==='serving'){
      drawOrder();
    }
  }

  if(flashTimer>0){
    flashTimer-=dt;
    ctx.fillStyle=flashColor;ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.globalAlpha=Math.min(1,flashTimer/30);
    ctx.fillText(flashMsg,W/2,230);
    ctx.globalAlpha=1;
  }

  if(score>hi)hi=score;
  document.getElementById('score-display').textContent=
    I18N.t('score_lives_hi_label','Score: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
