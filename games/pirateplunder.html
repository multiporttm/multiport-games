<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#c8a86b;cursor:pointer}
#ui{color:#3e2723;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#cashBtn{display:block;margin:6px auto;padding:10px 24px;border-radius:10px;background:#2e7d32;color:#fff;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pirate Plunder</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Pot: 0 | Banked: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <button id="cashBtn">💰 <span data-i18n="cash_out_btn">Cash Out</span></button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap tiles to dig — most hide gold that adds to your pot, but a few hide bombs. Cash out any time to bank your pot for good, or keep digging for more... if you dare! Hit a bomb and you lose the pot.</div>
</div>
<script>
const W=360,H=360,COLS=6,ROWS=6,CELL=W/COLS;
let grid,pot,banked,state,digCount;

function loadBest(){return +(localStorage.getItem('pirateplunder_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('pirateplunder_best',v);}

function init(){
  banked=0;state='play';newBoard();
}
function newBoard(){
  grid=[];
  const bombCount=6;
  const cells=Array.from({length:COLS*ROWS},(_,i)=>i);
  cells.sort(()=>Math.random()-0.5);
  const bombSet=new Set(cells.slice(0,bombCount));
  for(let i=0;i<COLS*ROWS;i++){
    grid.push({dug:false,bomb:bombSet.has(i),gold:5+Math.floor(Math.random()*15)});
  }
  pot=0;digCount=0;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){newBoard();state='play';updateUI();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  const idx=row*COLS+col;
  if(idx<0||idx>=grid.length||grid[idx].dug||state!=='play')return;
  grid[idx].dug=true;
  digCount++;
  if(grid[idx].bomb){
    SFX.lose();
    state='over';
    pot=0;
  }else{
    pot+=grid[idx].gold;
    SFX.coin();
    if(digCount>=COLS*ROWS-6){
      cashOut();
    }
  }
  updateUI();
});

function cashOut(){
  if(state!=='play'||pot<=0)return;
  banked+=pot;
  SFX.success();
  saveBest(banked);
  newBoard();
  updateUI();
}
document.getElementById('cashBtn').addEventListener('click',cashOut);

function draw(){
  ctx.fillStyle='#c8a86b';ctx.fillRect(0,0,W,H);
  ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<ROWS;r++){
    for(let c2=0;c2<COLS;c2++){
      const idx=r*COLS+c2;
      const cell=grid[idx];
      const x=c2*CELL,y=r*CELL;
      if(cell.dug){
        ctx.fillStyle=cell.bomb?'#3e2723':'#a1887f';
        ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        ctx.fillText(cell.bomb?'💣':'✨',x+CELL/2,y+CELL/2);
      }else{
        ctx.fillStyle='#8d6e63';
        ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        ctx.strokeStyle='rgba(0,0,0,.2)';ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
      }
    }
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffab91';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('boom_title','BOOM!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('lost_pot_banked','Lost the pot! Banked: {n}').replace('{n}',banked),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to dig again'),W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('pot_banked_best','Pot: {p} | Banked: {b} | Best: {best}').replace('{p}',pot).replace('{b}',banked).replace('{best}',loadBest());
}

init();draw();updateUI();
</script></body></html>
