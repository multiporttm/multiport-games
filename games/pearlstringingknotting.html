<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#201a2e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#f0e6ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pearl Stringing Knotting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and hold (or <b>Space</b>) to pull the knot snug against the pearl — release in the glowing target zone to tie it perfectly. Too loose or too tight breaks the strand. String every pearl on each increasingly long, tighter-tolerance necklace.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;
const scoreDisplay=document.getElementById('score-display');
const HI_KEY='pearlstringingknotting_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,lives=3,level=1,gameOver=false,won=false,started=false;

let pearlCount,pearlsDone,tension,pulling,targetMin,targetMax,speed,resultFlash,resultTimer;

function newLevel(){
  pearlCount=4+level;
  pearlsDone=0;
  tension=0;
  pulling=false;
  const widthZone=Math.max(0.05,0.22-level*0.012);
  const centerZone=0.55+Math.random()*0.15;
  targetMin=centerZone-widthZone/2;
  targetMax=centerZone+widthZone/2;
  speed=0.55+level*0.045;
  resultFlash=null;resultTimer=0;
}
newLevel();

function startPull(){
  started=true;
  if(gameOver){resetGame();return;}
  if(resultTimer>0)return;
  pulling=true;
}
function endPull(){
  if(!pulling)return;
  pulling=false;
  evaluate();
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();startPull();}
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault();endPull();}
});
c.addEventListener('pointerdown',e=>{e.preventDefault();startPull();});
window.addEventListener('pointerup',()=>endPull());
c.addEventListener('touchstart',e=>{e.preventDefault();startPull();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endPull();},{passive:false});

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;
  newLevel();
}

function loseLife(){
  lives--;
  SFX.hit();
  if(lives<=0){
    gameOver=true;won=false;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  }
}

function evaluate(){
  const good=tension>=targetMin&&tension<=targetMax;
  const centerErr=Math.abs(tension-(targetMin+targetMax)/2);
  if(good){
    const bonus=50+Math.floor((1-centerErr/((targetMax-targetMin)/2+0.001))*50);
    score+=bonus;
    resultFlash='good';
    SFX.success();
    pearlsDone++;
    if(pearlsDone>=pearlCount){
      const clearBonus=100+level*20;
      score+=clearBonus;
      SFX.levelup();
      level++;
      if(level>14){
        gameOver=true;won=true;SFX.win();
        if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      }else{
        newLevel();
      }
    }
  }else{
    resultFlash=tension<targetMin?'loose':'tight';
    SFX.error();
    loseLife();
  }
  tension=0;
  resultTimer=0.6;
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#201a2e');bg.addColorStop(1,'#140f1e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(started&&!gameOver){
    if(resultTimer>0){
      resultTimer-=dt;
      if(resultTimer<=0)resultFlash=null;
    }else if(pulling){
      tension+=speed*dt;
      if(tension>=1.05){
        tension=1.05;
        // held too long past max — snapped
        resultFlash='tight';
        SFX.error();
        pulling=false;
        loseLife();
        tension=0;resultTimer=0.6;
      }
    }
  }

  // strand of pearls so far
  const strandY=140;
  const startX=90,gap=Math.min(62,600/pearlCount);
  ctx.strokeStyle='#cbb892';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(startX-20,strandY);ctx.lineTo(startX+gap*pearlCount+20,strandY);ctx.stroke();
  for(let i=0;i<pearlCount;i++){
    const px=startX+i*gap;
    const done=i<pearlsDone;
    ctx.beginPath();ctx.arc(px,strandY,14,0,Math.PI*2);
    const grad=ctx.createRadialGradient(px-5,strandY-5,2,px,strandY,16);
    if(done){grad.addColorStop(0,'#fff');grad.addColorStop(1,'#e8d9b5');}
    else{grad.addColorStop(0,'#55506a');grad.addColorStop(1,'#33304a');}
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=done?'#fff3d6':'#444';ctx.lineWidth=1.5;ctx.stroke();
    if(i===pearlsDone&&!gameOver){
      ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px,strandY,19,0,Math.PI*2);ctx.stroke();
    }
  }

  // tension gauge
  const gx=150,gy=230,gw=500,gh=36;
  ctx.fillStyle='#2a2438';ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
  // target zone
  ctx.fillStyle='rgba(57,211,83,0.35)';
  ctx.fillRect(gx+targetMin*gw,gy,(targetMax-targetMin)*gw,gh);
  ctx.strokeStyle='#39d353';ctx.lineWidth=2;
  ctx.strokeRect(gx+targetMin*gw,gy,(targetMax-targetMin)*gw,gh);
  // needle
  const needleX=gx+Math.min(1,tension)*gw;
  ctx.fillStyle='#e94560';
  ctx.fillRect(needleX-3,gy-8,6,gh+16);

  ctx.textAlign='center';ctx.font='14px Arial';ctx.fillStyle='#ccc';
  ctx.fillText(I18N.t('tension_label','Hold to pull — release in the green zone'),gx+gw/2,gy-16);

  if(resultFlash){
    ctx.font='bold 22px Arial';
    const msg=resultFlash==='good'?I18N.t('knot_good','Snug Knot!'):resultFlash==='loose'?I18N.t('knot_loose','Too Loose!'):I18N.t('knot_tight','Too Tight!');
    ctx.fillStyle=resultFlash==='good'?'#39d353':'#ff5555';
    ctx.fillText(msg,W/2,290);
  }

  // HUD
  ctx.textAlign='left';ctx.font='16px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('level_label','Necklace {n}').replace('{n}',level),16,24);
  ctx.fillText('❤️'.repeat(Math.max(0,lives)),16,48);
  ctx.textAlign='right';ctx.fillStyle='#ffd54f';
  ctx.fillText(I18N.t('pearls_label','{d}/{t} pearls').replace('{d}',pearlsDone).replace('{t}',pearlCount),W-16,24);

  if(!started){
    ctx.textAlign='center';ctx.fillStyle='#ffd54f';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('start_hint','Hold and release to tie each knot'),W/2,H-16);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.font='bold 36px Arial';
    ctx.fillText(won?I18N.t('win_title','MASTER STRINGER!'):I18N.t('game_over_title','STRAND BROKEN'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+20);
  }

  scoreDisplay.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
