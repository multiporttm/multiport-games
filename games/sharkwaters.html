<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#01579b}
#ui{color:#81d4fa;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Shark Waters</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Survived: 0s | Best: 0s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad) to hop between the floating platforms. Each one starts sinking the moment you land on it — keep moving! Touch the water and the shark gets you.</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,onPlatform,platforms,shark,sharkAngle,survived,state,keys={},best=+(localStorage.getItem('sharkwaters_best')||0),respawnTimer;

function loadBest(){return +(localStorage.getItem('sharkwaters_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('sharkwaters_best',v);}

function rand(min,max){return min+Math.random()*(max-min);}

function init(){
  platforms=[];
  for(let i=0;i<6;i++)spawnPlatform();
  player={x:platforms[0].x,y:platforms[0].y};
  sharkAngle=0;
  survived=0;state='play';best=loadBest();
}

function spawnPlatform(){
  platforms.push({x:rand(30,W-30),y:rand(30,H-30),life:1,r:22});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.6;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  survived+=1/60;
  sharkAngle+=0.02;

  onPlatform=null;
  platforms.forEach(p=>{
    if(dist(player,p)<p.r)onPlatform=p;
  });

  platforms.forEach(p=>{
    if(p===onPlatform){p.life-=1/180;}
    if(p.life<=0){
      p.life=0;
      const idx=platforms.indexOf(p);
      platforms.splice(idx,1);
      spawnPlatform();
    }
  });

  if(!onPlatform){
    state='over';
    SFX.lose();
    saveBest(Math.floor(survived));best=loadBest();
  }

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#01579b';ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    ctx.strokeStyle='rgba(255,255,255,.05)';
    ctx.beginPath();ctx.arc(W/2,H/2,60+i*50+Math.sin(sharkAngle*2+i)*6,0,Math.PI*2);ctx.stroke();
  }

  const sx=W/2+Math.cos(sharkAngle)*130,sy=H/2+Math.sin(sharkAngle)*130;
  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🦈',sx,sy);

  platforms.forEach(p=>{
    ctx.globalAlpha=0.4+p.life*0.6;
    ctx.fillStyle='#8d6e63';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  ctx.font='22px Arial';
  ctx.fillText('🏊',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#81d4fa';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('splash_title','SPLASH!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('survived_label','Survived: {n}s').replace('{n}',Math.floor(survived)),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap a D-pad button to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('survived_label','Survived: {n}s').replace('{n}',Math.floor(survived))+' | '+I18N.t('best_label','Best: {n}s').replace('{n}',best);
}

init();draw();
</script></body></html>
