<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Gem Digger</title><meta name="description" content="Play Gem Digger free online — Use Arrow Keys or WASD (or the on-screen buttons) to move and dig. Collect gems and go deep, but avoid digging red unstable rock!"><link rel="canonical" href="https://games.multiportllc.com/games/gemdigger"><meta property="og:title" content="Gem Digger - Multiport Games"><meta property="og:description" content="Play Gem Digger free online — Use Arrow Keys or WASD (or the on-screen buttons) to move and dig. Collect gems and go deep, but avoid digging red unstable rock!"><meta property="og:url" content="https://games.multiportllc.com/games/gemdigger"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Gem Digger","description":"Play Gem Digger free online instantly. Use Arrow Keys or WASD (or the on-screen buttons) to move and dig. Collect gems and go deep, but avoid digging red unstable rock! No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/gemdigger","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1006;display:block;border-radius:8px;touch-action:none;margin:0 auto}
#score-display{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#pad{display:flex;justify-content:center;gap:10px;margin:10px 0}
.pbtn{width:60px;height:52px;border-radius:10px;background:#5d4037;color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;border:2px solid #ffd54f;touch-action:none}
.pbtn:active{background:#ffd54f;color:#222}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gem Digger</div>
  <div class="game-frame">
    <div id="score-display">Depth: 0 | Gems: 0 | Best Depth: 0</div>
    <canvas id="c" width="720" height="490"></canvas>
    <div id="pad">
      <div class="pbtn" id="btnL">◀</div>
      <div class="pbtn" id="btnDown">⛏</div>
      <div class="pbtn" id="btnR">▶</div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or the on-screen buttons) — Left/Right to dig sideways, Down to dig deeper. Collect yellow gems for points, but never dig a red <b>unstable rock</b> or it's a cave-in!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLS=9,CELL=80,ROWSVIS=6;
const W=COLS*CELL,H=ROWSVIS*CELL+10;
c.width=W;c.height=H;

let cells,player,gems,depth,best=parseInt(localStorage.getItem('gemdigger_best')||'0',10),over=false,moveCd=0;

function keyOf(r,cc){return r+','+cc;}

function genCell(row){
  if(row<=0)return 'empty';
  const rockP=Math.min(0.05+row*0.0025,0.22);
  const gemP=0.13;
  const rnd=Math.random();
  if(rnd<rockP)return 'rock';
  if(rnd<rockP+gemP)return 'gem';
  return 'dirt';
}

function getCell(row,cc){
  if(cc<0||cc>=COLS)return 'wall';
  const k=keyOf(row,cc);
  if(!cells.has(k))cells.set(k,genCell(row));
  return cells.get(k);
}
function setCell(row,cc,v){cells.set(keyOf(row,cc),v);}

function reset(){
  cells=new Map();
  player={row:0,col:Math.floor(COLS/2)};
  gems=0;depth=0;over=false;moveCd=0;
  for(let cc=0;cc<COLS;cc++)setCell(0,cc,'empty');
}
reset();

function tryDig(targetRow,targetCol){
  if(over)return;
  const t=getCell(targetRow,targetCol);
  if(t==='wall')return;
  if(t==='rock'){
    over=true;SFX.lose();return;
  }
  if(t==='gem'){gems++;SFX.coin();}
  else if(t==='dirt'){SFX.hit();}
  setCell(targetRow,targetCol,'empty');
  player.row=targetRow;player.col=targetCol;
  if(player.row>depth){depth=player.row;
    if(depth>best){best=depth;localStorage.setItem('gemdigger_best',best);}
  }
  // gravity: fall through already-empty cells below
  while(getCell(player.row+1,player.col)==='empty'){
    player.row++;
    if(player.row>depth){depth=player.row;if(depth>best){best=depth;localStorage.setItem('gemdigger_best',best);}}
  }
}

function move(dr,dc){
  if(over){reset();return;}
  tryDig(player.row+dr,player.col+dc);
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const map={'arrowleft':[0,-1],'a':[0,-1],'arrowright':[0,1],'d':[0,1],'arrowdown':[1,0],'s':[1,0],' ':[1,0]};
  if(map[k]){e.preventDefault();
    if(moveCd<=0){move(...map[k]);moveCd=8;}
  }
});

function bindBtn(id,dr,dc){
  const el=document.getElementById(id);
  const fire=e=>{e.preventDefault();if(moveCd<=0){move(dr,dc);moveCd=8;}};
  el.addEventListener('touchstart',fire,{passive:false});
  el.addEventListener('mousedown',fire);
}
bindBtn('btnL',0,-1);
bindBtn('btnR',0,1);
bindBtn('btnDown',1,0);

function drawCell(type,x,y){
  if(type==='empty'||type==='wall')return;
  if(type==='dirt'){
    ctx.fillStyle='#6d4c2f';
    ctx.fillRect(x,y,CELL-2,CELL-2);
    ctx.fillStyle='#5a3d24';
    for(let i=0;i<4;i++)ctx.fillRect(x+6+i*17,y+CELL-16,6,6);
  }else if(type==='gem'){
    ctx.fillStyle='#4a3320';
    ctx.fillRect(x,y,CELL-2,CELL-2);
    ctx.save();
    ctx.translate(x+CELL/2,y+CELL/2);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle='#ffd54f';
    ctx.fillRect(-14,-14,28,28);
    ctx.restore();
    ctx.strokeStyle='#fff8e1';ctx.lineWidth=2;
    ctx.strokeRect(x+16,y+16,CELL-34,CELL-34);
  }else if(type==='rock'){
    ctx.fillStyle='#4a3320';
    ctx.fillRect(x,y,CELL-2,CELL-2);
    ctx.fillStyle='#c62828';
    ctx.beginPath();
    ctx.moveTo(x+CELL/2,y+8);
    ctx.lineTo(x+CELL-10,y+CELL/2);
    ctx.lineTo(x+CELL/2,y+CELL-8);
    ctx.lineTo(x+10,y+CELL/2);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ff8a65';ctx.lineWidth=2;ctx.stroke();
  }
}

function loop(){
  if(moveCd>0)moveCd--;
  ctx.clearRect(0,0,W,H);
  // camera centers player, but never above surface row 0
  const topRow=Math.max(0,player.row-2);
  ctx.fillStyle='#1a1006';ctx.fillRect(0,0,W,H);
  for(let vr=0;vr<ROWSVIS+1;vr++){
    const row=topRow+vr;
    for(let cc=0;cc<COLS;cc++){
      const t=getCell(row,cc);
      drawCell(t,cc*CELL,vr*CELL);
    }
  }
  // player
  const px=player.col*CELL,py=(player.row-topRow)*CELL;
  ctx.fillStyle='#ff7043';
  ctx.fillRect(px+16,py+14,CELL-32,CELL-28);
  ctx.fillStyle='#ffe082';
  ctx.fillRect(px+26,py+20,CELL-52,14);
  ctx.fillStyle='#3e2723';
  ctx.fillRect(px+20,py+CELL-14,12,14);
  ctx.fillRect(px+CELL-32,py+CELL-14,12,14);

  if(over){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('cave_in_title','CAVE-IN!'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Press a move key to dig again'),W/2,H/2+24);
  }

  document.getElementById('score-display').textContent=
    I18N.t('depth_gems_label','Depth: {d} | Gems: {g} | Best Depth: {b}')
      .replace('{d}',depth).replace('{g}',gems).replace('{b}',best);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
