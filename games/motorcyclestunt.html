<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#212121,#ff5722);display:block;border-radius:8px}
#score-display{color:#ffab91;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#stunt-controls{display:flex;justify-content:center;gap:10px;margin-top:8px}
#stunt-controls button{padding:10px 22px;border:none;border-radius:20px;background:#ff5722;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
#stunt-controls button:active{transform:scale(.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Motorcycle Stunt</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Best Trick: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="stunt-controls">
      <button id="actionBtn">GO</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b> (or tap <b>GO</b>) to build speed and launch off the ramp. While airborne, press <b>Space</b> again to spin a trick. Time your final press to land cleanly in the green zone on the far ramp — miss it and you'll wipe out or crash!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300,groundY=250;
let hiTrick=parseInt(localStorage.getItem('motorcyclestunt_hi')||'0',10);
let lives=3,score=0,round=0;

// state machine: 'charge' -> 'launch' -> 'air' -> 'landed'/'crash'
let state='charge';
let power=0,powerDir=1;
let bike={x:100,y:groundY,vx:0,vy:0,rot:0,spinVel:0};
let spins=0,trickPoints=0;
let landingZone={cx:0,w:0,shrink:0};
let farRampX=650;
let msg='',msgSub='';
let particles=[];

function reset(){
  lives=3;score=0;round=0;hiTrick=parseInt(localStorage.getItem('motorcyclestunt_hi')||'0',10);
  startRound();
}
function startRound(){
  state='charge';power=0;powerDir=1;
  bike.x=100;bike.y=groundY;bike.vx=0;bike.vy=0;bike.rot=0;bike.spinVel=0;
  spins=0;trickPoints=0;
  msg='';msgSub='';
  particles=[];
  round++;
  farRampX=600+Math.min(round*8,120);
}

function updateHUD(){
  document.getElementById('score-display').textContent=
    I18N.t('mc_score_label','Score: {s} | Best Trick: {b} | Lives: {l}')
      .replace('{s}',Math.floor(score)).replace('{b}',Math.floor(hiTrick)).replace('{l}',lives);
}

function doAction(){
  if(state==='charge'){
    // launch with current power
    state='air';
    const boost=6+power*10;
    bike.vx=boost;
    bike.vy=-(9+power*6);
    SFX.jump();
  } else if(state==='air'){
    if(spins<3){
      spins++;
      bike.spinVel+=0.28;
      trickPoints+=100;
      SFX.point();
    }
  } else if(state==='landed'||state==='crash'){
    if(lives<=0){ // full reset
      reset();
    } else {
      startRound();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();doAction();}
});
document.getElementById('actionBtn').addEventListener('click',doAction);
c.addEventListener('click',doAction);
c.addEventListener('touchstart',e=>{e.preventDefault();doAction();},{passive:false});

function drawRamp(x,dir){
  ctx.fillStyle='#3e2723';
  ctx.beginPath();
  if(dir>0){
    ctx.moveTo(x,groundY);ctx.lineTo(x+70,groundY-55);ctx.lineTo(x+70,groundY);
  } else {
    ctx.moveTo(x,groundY);ctx.lineTo(x-70,groundY-55);ctx.lineTo(x-70,groundY);
  }
  ctx.closePath();ctx.fill();
}

function drawBike(x,y,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.fillStyle='#212121';
  ctx.fillRect(-22,-10,44,14);
  ctx.fillStyle='#ff5722';
  ctx.beginPath();ctx.arc(-18,10,10,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(18,10,10,0,7);ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-18,10,5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(18,10,5,0,7);ctx.fill();
  ctx.fillStyle='#ffab91';
  ctx.fillRect(-6,-24,14,14);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#212121');sky.addColorStop(1,'#ff5722');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,groundY);
  ctx.fillStyle='#4e342e';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#3e2723';ctx.fillRect(0,groundY,W,4);

  drawRamp(300,1);
  drawRamp(farRampX,-1);

  if(state==='charge'){
    power+=0.02*powerDir;
    if(power>=1){power=1;powerDir=-1;}
    if(power<=0){power=0;powerDir=1;}
    // power bar
    ctx.fillStyle='#000a';ctx.fillRect(250,40,300,26);
    ctx.fillStyle='#ffca28';ctx.fillRect(253,43,294*power,20);
    ctx.strokeStyle='#fff';ctx.strokeRect(250,40,300,26);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('mc_charge_hint','Press to launch — time the bar for max speed!'),400,30);
    drawBike(bike.x,bike.y-10,0);
  } else if(state==='air'){
    bike.x+=bike.vx;
    bike.vy+=0.35;
    bike.y+=bike.vy;
    bike.rot+=bike.spinVel;
    bike.spinVel*=0.995;
    // landing zone shrinks over time to add pressure
    landingZone.shrink=Math.min(landingZone.shrink+0.006,0.85);
    const apexReached=bike.vy>0 && bike.y<groundY-40;
    drawBike(bike.x,bike.y-10,bike.rot);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('mc_air_hint','Press again to time your landing!'),400,30);
    ctx.fillText(I18N.t('mc_spins_label','Spins: {n}').replace('{n}',spins),400,54);
    // draw landing zone marker on far ramp
    const zoneW=60*(1-landingZone.shrink)+10;
    ctx.fillStyle='rgba(76,175,80,.7)';
    ctx.fillRect(farRampX-zoneW/2,groundY-58,zoneW,10);

    if(bike.y>=groundY-10 && bike.x>farRampX-90){
      // landing evaluation based on x proximity to ramp center and rotation alignment
      const distToRamp=Math.abs(bike.x-farRampX);
      const rotMod=((bike.rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const rotAligned=Math.min(rotMod,Math.PI*2-rotMod);
      landOutcome(distToRamp,zoneW,rotAligned);
    } else if(bike.y>groundY+20 || bike.x>W+50){
      // fell short / overshot completely -> crash
      crash();
    }
  } else if(state==='landed'||state==='crash'){
    drawBike(bike.x,bike.y-10,bike.rot);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(msg,400,110);
    ctx.font='18px Arial';
    ctx.fillText(msgSub,400,146);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to continue'),400,180);
  }

  updateHUD();
  requestAnimationFrame(loop);
}

function landOutcome(dist,zoneW,rotAligned){
  const clean = dist<zoneW/2 && rotAligned<0.5;
  const okish = dist<zoneW*1.2 && rotAligned<1.1;
  bike.y=groundY-10;bike.vy=0;bike.vx=0;
  if(clean){
    const pts=Math.round((trickPoints+200)*(1+ (0.5-dist/zoneW)));
    score+=pts;
    if(pts>hiTrick){hiTrick=pts;localStorage.setItem('motorcyclestunt_hi',String(hiTrick));}
    msg=I18N.t('mc_clean_land','PERFECT LANDING!');
    msgSub=I18N.t('mc_points_label','+{p} points').replace('{p}',pts);
    SFX.success();
    state='landed';
  } else if(okish){
    const pts=Math.round((trickPoints+60));
    score+=pts;
    if(pts>hiTrick){hiTrick=pts;localStorage.setItem('motorcyclestunt_hi',String(hiTrick));}
    msg=I18N.t('mc_wipeout','WIPEOUT!');
    msgSub=I18N.t('mc_points_label','+{p} points').replace('{p}',pts);
    SFX.hit();
    state='landed';
  } else {
    crash();
  }
}

function crash(){
  lives--;
  msg=I18N.t('mc_crash','CRASH!');
  msgSub=lives>0?I18N.t('mc_lives_left','Lives left: {l}').replace('{l}',lives):I18N.t('game_over_title','GAME OVER');
  SFX.lose();
  state='crash';
  if(lives<=0){
    if(score>0){} // score already tracked as best trick, nothing else needed
  }
}

landingZone.shrink=0;
reset();
loop();
</script></body></html>
