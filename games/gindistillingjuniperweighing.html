<style>
body{background:#101810}
#c{background:#3a5a3a;display:block;border-radius:8px;touch-action:none}
#hud{color:#e6f0d8;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#9ad1d8}
#hud span.hs{color:#f0d060}
#btnRow{display:flex;justify-content:center;gap:8px;padding:6px 10px 2px;flex-wrap:wrap}
#btnRow button{padding:9px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.95rem;color:#fff;background:#4a6b3a}
#btnRow button:active{transform:scale(0.95)}
#confirmRow{display:flex;justify-content:center;gap:10px;padding:4px 10px 12px;flex-wrap:wrap}
#confirmRow button{padding:10px 22px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.05rem;color:#fff;background:#2e7d32}

</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gin Juniper Weighing</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="btnRow"></div>
    <div id="confirmRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap the scoop buttons (or press <b>1-4</b>) to add juniper berries of different sizes onto the scale pan until the needle sits inside the green <b>target window</b>, then hit <b>Weigh In</b> (or <b>Enter</b>) to lock it. <b>Reset</b> clears the pan if you overshoot.</div>
</div>
<script>
(function(){
const HS_KEY='gindistillingjuniperweighing_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const SCOOPS=[
  {key:'pinch',label:'Pinch (+2g)',val:2,emoji:'🫐'},
  {key:'small',label:'Small Scoop (+5g)',val:5,emoji:'🫐'},
  {key:'large',label:'Large Scoop (+15g)',val:15,emoji:'🫐'},
  {key:'heap',label:'Heaping Scoop (+35g)',val:35,emoji:'🫐'}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let load=0,targetLo=0,targetHi=0,targetCenter=0,timeLeft=0,timeLimit=0,locked=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function newRound(){
  load=0;locked=false;
  timeLimit=Math.max(260,480-level*18);
  timeLeft=timeLimit;
  targetCenter=40+Math.floor(Math.random()*(60+level*8));
  const window=Math.max(6,16-Math.floor(level/2));
  targetLo=Math.max(1,targetCenter-window);
  targetHi=targetCenter+window;
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newRound(); }
reset();

function buildButtons(){
  const el=document.getElementById('btnRow');
  el.innerHTML='';
  SCOOPS.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+I18N.t('scoop_'+s.key,s.label);
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); addScoop(i);});
    el.appendChild(btn);
  });
  const cr=document.getElementById('confirmRow');
  cr.innerHTML='';
  const weighBtn=document.createElement('button');
  weighBtn.textContent=I18N.t('weigh_in_btn','Weigh In');
  weighBtn.addEventListener('pointerdown',e=>{e.stopPropagation(); confirmWeigh();});
  const resetBtn=document.createElement('button');
  resetBtn.className='reset';
  resetBtn.textContent=I18N.t('reset_btn','Reset');
  resetBtn.addEventListener('pointerdown',e=>{e.stopPropagation(); resetPan();});
  cr.appendChild(resetBtn);cr.appendChild(weighBtn);
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newRound();
}

function passRound(){
  const diff=Math.abs(load-targetCenter);
  const bonus=Math.max(0,20-diff);
  score+=(60+bonus)*level;
  SFX.success();
  if(score>=level*320)levelUp();
  newRound();
}

function addScoop(i){
  if(!started||gameOver||locked)return;
  load+=SCOOPS[i].val;
  SFX.click();
  if(load>targetHi+40){ SFX.error(); }
}

function resetPan(){
  if(!started||gameOver||locked)return;
  load=0;SFX.swoosh();
}

function confirmWeigh(){
  if(!started||gameOver||locked)return;
  locked=true;
  if(load>=targetLo&&load<=targetHi){
    passRound();
  } else {
    failRound();
  }
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
  document.getElementById('btnRow').innerHTML='';
  document.getElementById('confirmRow').innerHTML='';
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started||gameOver){startGame();}
    return;
  }
  if(e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();return;}
    confirmWeigh();
    return;
  }
  if(!started||gameOver)return;
  const m=e.code.match(/^Digit([1-4])$/);
  if(m){ e.preventDefault(); addScoop(parseInt(m[1],10)-1); }
  else if(e.code==='Backspace'||e.code==='KeyR'){ e.preventDefault(); resetPan(); }
});

function drawScale(){
  const sx=W/2,baseY=250;
  ctx.save();
  ctx.strokeStyle='#1a2a1a';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(sx,baseY);ctx.lineTo(sx,100);ctx.stroke();
  ctx.fillStyle='#1a2a1a';ctx.fillRect(sx-60,baseY,120,10);

  const maxLoad=targetHi+60;
  const frac=Math.min(1,load/maxLoad);
  const tilt=(frac-0.5)*0.5;
  ctx.translate(sx,105);
  ctx.rotate(tilt);
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-160,0);ctx.lineTo(160,0);ctx.stroke();
  ctx.fillStyle='#d9c08a';
  ctx.beginPath();ctx.ellipse(-160,18,55,16,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(160,18,55,16,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-160,0);ctx.lineTo(-160,18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(160,0);ctx.lineTo(160,18);ctx.stroke();
  // berry mound sized by load
  if(load>0){
    ctx.font=Math.min(30,14+load/8)+'px Arial';ctx.textAlign='center';
    ctx.fillText('🫐',160,12);
  }
  ctx.font='16px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('target_weight_label','Target'),-160,-28);
  ctx.restore();

  ctx.font='bold 22px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText(I18N.t('load_label','Load: {g}g').replace('{g}',load),sx,baseY+40);
  ctx.font='16px Arial';ctx.fillStyle='#bfe6a0';
  ctx.fillText(I18N.t('target_range_label','Target: {lo}g – {hi}g').replace('{lo}',targetLo).replace('{hi}',targetHi),sx,baseY+66);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1f331f');bg.addColorStop(1,'#3a5a3a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#e6f0d8';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawScale();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  timeLeft--;
  if(timeLeft<=0 && !locked){ failRound(); }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('weigh_hint','Load juniper to hit the target window'),W/2,24);

  const barW=400,barH=10,barX=W/2-barW/2,barY=38;
  ctx.fillStyle='#152015';ctx.fillRect(barX,barY,barW,barH);
  const frac=Math.max(0,timeLeft/timeLimit);
  ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
  ctx.fillRect(barX,barY,barW*frac,barH);

  drawScale();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
