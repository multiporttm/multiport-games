<script src="../js/i18n.js"></script>
<style>
body{background:#140a1c}
#c{background:#1d1028;display:block;border-radius:8px;touch-action:none}
#hud{color:#d6b8f0;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#f6c453}
#hud span.hs{color:#7ec850}
#btnRow{display:flex;justify-content:center;gap:10px;padding:6px 10px 14px;flex-wrap:wrap}
#btnRow button{padding:10px 24px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.1rem;color:#fff;background:#5a3a7a}
#btnRow button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gin Label Design</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Run: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="btnRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Check the <b>label spec</b> at the top, then slide the tray with <b>Left/Right Arrow</b> (or drag) to catch every badge it calls for as they fall. Catching a wrong or decoy badge costs a life — collect the full spec to finish the print run!</div>
</div>
<script>
(function(){
const HS_KEY='gindistillinglabeldesign_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const BADGES=[
  {key:'abv',label:'ABV Mark',emoji:'🧪',color:'#9a6ac0'},
  {key:'botlist',label:'Botanical List',emoji:'🌿',color:'#6ea060'},
  {key:'batch',label:'Batch Stamp',emoji:'🔖',color:'#c08a4a'},
  {key:'barcode',label:'Barcode',emoji:'📊',color:'#7a7a7a'},
  {key:'brand',label:'Brand Crest',emoji:'🛡️',color:'#c04a6a'}
];
const DECOYS=[
  {key:'discount',label:'Discount Sticker',emoji:'🏷️',color:'#e04040'},
  {key:'wrongabv',label:'Wrong ABV Mark',emoji:'❌',color:'#884444'},
  {key:'expired',label:'Expired Stamp',emoji:'⚠️',color:'#a08020'}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let spec=[],collected=new Set(),falling=[],trayX=W/2,spawnTimer=0,runTimeLeft=0,runTimeLimit=0,resolving=false;
const TRAY_W=90,TRAY_H=16,TRAY_Y=H-28;
let keyLeft=false,keyRight=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildButtons(){
  const el=document.getElementById('btnRow');
  el.innerHTML='';
}

function newRun(){
  const n=Math.min(BADGES.length,2+Math.floor(level/2));
  spec=shuffle(BADGES.slice()).slice(0,n).map(b=>b.key);
  collected=new Set();
  falling=[];
  spawnTimer=0;
  runTimeLimit=Math.max(600,900-level*20);
  runTimeLeft=runTimeLimit;
  resolving=false;
  trayX=W/2;
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newRun(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('run_label','Run: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRun(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newRun();
}

function passRun(){
  score+=60*level;SFX.win();
  if(score>=level*280)levelUp();
  newRun();
}

function spawnBadge(){
  const wantMore=spec.some(k=>!collected.has(k));
  let def;
  if(wantMore&&Math.random()<0.62){
    const needed=spec.filter(k=>!collected.has(k));
    const key=needed[Math.floor(Math.random()*needed.length)];
    def=BADGES.find(b=>b.key===key);
  } else if(Math.random()<0.55){
    def=DECOYS[Math.floor(Math.random()*DECOYS.length)];
  } else {
    def=BADGES[Math.floor(Math.random()*BADGES.length)];
  }
  falling.push({x:40+Math.random()*(W-80),y:-20,vy:1.1+level*0.1+Math.random()*0.5,key:def.key,def});
}

function onCatch(item){
  if(spec.includes(item.key)){
    if(collected.has(item.key)){
      SFX.point();score+=5;
    } else {
      collected.add(item.key);
      SFX.catch();score+=20;
      if(spec.every(k=>collected.has(k))&&!resolving){
        resolving=true;
        setTimeout(passRun,300);
      }
    }
  } else {
    SFX.hurt();
    if(!resolving){ resolving=true; setTimeout(failRun,250); }
  }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',e=>{
  if(!started||gameOver){startGame();return;}
  const r=c.getBoundingClientRect();
  trayX=(e.clientX-r.left)*(W/r.width);
});
c.addEventListener('pointermove',e=>{
  if(!started||gameOver)return;
  if(e.buttons!==1&&e.pointerType!=='touch')return;
  const r=c.getBoundingClientRect();
  trayX=(e.clientX-r.left)*(W/r.width);
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();}
    return;
  }
  if(e.code==='ArrowLeft'){ e.preventDefault(); keyLeft=true; }
  else if(e.code==='ArrowRight'){ e.preventDefault(); keyRight=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'){ keyLeft=false; }
  else if(e.code==='ArrowRight'){ keyRight=false; }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
  document.getElementById('btnRow').innerHTML='';
}

function drawTray(){
  ctx.fillStyle='#9a6ac0';
  ctx.beginPath();ctx.roundRect(trayX-TRAY_W/2,TRAY_Y,TRAY_W,TRAY_H,6);ctx.fill();
  ctx.strokeStyle='#2d1a40';ctx.lineWidth=2;ctx.stroke();
}

function drawBadge(item){
  ctx.save();
  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(item.def.emoji,item.x,item.y);
  ctx.font='11px Arial';ctx.fillStyle=item.def.color;
  ctx.fillText(I18N.t('badge_'+item.def.key,item.def.label),item.x,item.y+18);
  ctx.restore();
}

function drawSpecBar(){
  ctx.font='bold 15px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';
  const names=spec.map(k=>{
    const b=BADGES.find(x=>x.key===k);
    const got=collected.has(k);
    return (got?'✅':b.emoji)+' '+b.label;
  }).join('   ');
  ctx.fillText(I18N.t('spec_label','Label needs: {s}').replace('{s}',names),W/2,24);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#140a1c');bg.addColorStop(1,'#241535');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#d6b8f0';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawSpecBar();drawTray();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(keyLeft)trayX=Math.max(TRAY_W/2,trayX-7);
  if(keyRight)trayX=Math.min(W-TRAY_W/2,trayX+7);
  trayX=Math.max(TRAY_W/2,Math.min(W-TRAY_W/2,trayX));

  if(!resolving){
    runTimeLeft--;
    if(runTimeLeft<=0){ resolving=true; SFX.fail(); setTimeout(failRun,200); }
    spawnTimer--;
    if(spawnTimer<=0){ spawnBadge(); spawnTimer=Math.max(18,46-level*2); }
    for(let i=falling.length-1;i>=0;i--){
      const it=falling[i];
      it.y+=it.vy;
      if(it.y>=TRAY_Y-6&&it.y<=TRAY_Y+TRAY_H&&Math.abs(it.x-trayX)<TRAY_W/2+10){
        falling.splice(i,1);
        onCatch(it);
      } else if(it.y>H+20){
        falling.splice(i,1);
      }
    }
  }

  falling.forEach(drawBadge);
  drawTray();
  drawSpecBar();

  const barW=400,barH=8,barX=W/2-barW/2,barY=42;
  ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
  const frac=Math.max(0,runTimeLeft/runTimeLimit);
  ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
  ctx.fillRect(barX,barY,barW*frac,barH);

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
