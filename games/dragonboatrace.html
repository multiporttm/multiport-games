<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Dragon Boat Race</title><meta name="description" content="Play Dragon Boat Race free online — Tap, click, or press Space in rhythm with the drumbeat to paddle your dragon boat. Time your strokes well to beat the AI boat to the finish line!"><link rel="canonical" href="https://games.multiportllc.com/games/dragonboatrace"><meta property="og:title" content="Dragon Boat Race - Multiport Games"><meta property="og:description" content="Play Dragon Boat Race free online — Tap, click, or press Space in rhythm with the drumbeat to paddle your dragon boat. Time your strokes well to beat the AI boat to the finish line!"><meta property="og:url" content="https://games.multiportllc.com/games/dragonboatrace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Dragon Boat Race","description":"Play Dragon Boat Race free online instantly. Tap, click, or press Space in rhythm with the drumbeat to paddle your dragon boat. Time your strokes well to beat the AI boat to the finish line! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/dragonboatrace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#c62828,#ffb300);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe0b2;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dragon Boat Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: — | Hi Wins: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap, click, or press <b>Space</b> right on the beat of the drum to paddle your dragon boat forward. Perfectly timed strokes give the biggest boost — mistime or miss a beat and the AI boat gains ground. First boat to the finish line wins!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const COURSE=2400; // distance units to finish
const START_X=60,FINISH_X=W-60;

let bpm=100,beatInterval=60000/bpm;
let nextBeatTime=0,beatPulse=0;
let playerDist=0,aiDist=0,gameOver=false,winner=null,started=false;
let raceStartTime=0,finishTime=null,lastTime=null;
let wins=0,hiWins=0,bestTime=null;
let hitFlash=0,missFlash=0;
let aiTimingSkill=0.75; // 0..1, chance-ish quality of ai timing

hiWins=parseInt(localStorage.getItem('dragonboatrace_hiwins')||'0',10);
bestTime=localStorage.getItem('dragonboatrace_best')?parseFloat(localStorage.getItem('dragonboatrace_best')):null;

function reset(){
  bpm=100;beatInterval=60000/bpm;
  playerDist=0;aiDist=0;gameOver=false;winner=null;started=false;
  finishTime=null;lastTime=null;nextBeatTime=0;beatPulse=0;
  hitFlash=0;missFlash=0;
  updateScore();
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('dragon_score_label','Wins: {w} | Best Time: {t} | Hi Wins: {h}')
      .replace('{w}',wins)
      .replace('{t}', bestTime!=null? bestTime.toFixed(1)+'s' : '—')
      .replace('{h}',hiWins);
}

function startRace(){
  started=true;
  raceStartTime=performance.now();
  nextBeatTime=raceStartTime+beatInterval;
}

function paddle(){
  if(!started){startRace();return;}
  if(gameOver){reset();return;}
  const now=performance.now();
  const timeSinceBeat=Math.min(Math.abs(now-nextBeatTime),Math.abs(now-(nextBeatTime-beatInterval)));
  const window=beatInterval*0.22; // timing tolerance
  if(timeSinceBeat<=window){
    const quality=1-(timeSinceBeat/window); // 0..1
    const boost=8+quality*14;
    playerDist+=boost;
    hitFlash=1;
    if(quality>0.75){SFX.coin();}else{SFX.point();}
  }else{
    playerDist+=2; // small credit even off-beat so it's not punishing to try
    missFlash=1;
    SFX.tick();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();paddle();}
});
c.addEventListener('click',paddle);
c.addEventListener('touchstart',e=>{e.preventDefault();paddle();},{passive:false});

function drawBoat(x,laneY,color,label){
  const px=START_X+(x/COURSE)*(FINISH_X-START_X);
  ctx.save();
  ctx.translate(px,laneY);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(-30,0);ctx.quadraticCurveTo(-20,-14,10,-12);ctx.quadraticCurveTo(30,-10,34,0);
  ctx.quadraticCurveTo(30,10,10,12);ctx.quadraticCurveTo(-20,14,-30,0);
  ctx.closePath();ctx.fill();
  // dragon head
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(34,0,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(label,0,-20);
  ctx.restore();
}

function drawRiver(){
  const riverGrad=ctx.createLinearGradient(0,0,0,H);
  riverGrad.addColorStop(0,'#0288d1');riverGrad.addColorStop(1,'#01579b');
  ctx.fillStyle=riverGrad;
  ctx.fillRect(0,60,W,H-100);
  // lane divider
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.setLineDash([10,10]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.setLineDash([]);
  // start/finish lines
  ctx.strokeStyle='#fff';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(START_X,60);ctx.lineTo(START_X,H-40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(FINISH_X,60);ctx.lineTo(FINISH_X,H-40);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('dragon_finish_label','FINISH'),FINISH_X,50);
}

function drawDrum(){
  const cx=W/2,cy=32,r=18+beatPulse*10;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${0.3+beatPulse*0.6})`;
  ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawRiver();

  if(!started){
    drawBoat(playerDist,H/2-60,'#e53935',I18N.t('dragon_you_label','YOU'));
    drawBoat(aiDist,H/2+60,'#43a047',I18N.t('dragon_ai_label','AI'));
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_dragon','Tap or Space to start the race!'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?16.67:Math.min(now-lastTime,50);
  lastTime=now;

  if(!gameOver){
    // beat pulse animation
    beatPulse=Math.max(0,1-((now-(nextBeatTime-beatInterval))/beatInterval));
    if(now>=nextBeatTime){
      nextBeatTime+=beatInterval;
    }

    // AI progresses steadily with some rhythm-based variance, gradually speeds up
    aiDist+=(3.2+Math.sin(now/300)*0.6)*(dt/16.67)*aiTimingSkill*2.1;

    hitFlash=Math.max(0,hitFlash-dt/300);
    missFlash=Math.max(0,missFlash-dt/300);

    if(playerDist>=COURSE||aiDist>=COURSE){
      gameOver=true;
      winner=playerDist>=COURSE&&(playerDist>=aiDist)? 'player':'ai';
      if(winner==='player'){
        const t=(now-raceStartTime)/1000;
        wins++;
        if(wins>hiWins){hiWins=wins;localStorage.setItem('dragonboatrace_hiwins',hiWins);}
        if(bestTime===null||t<bestTime){bestTime=t;localStorage.setItem('dragonboatrace_best',bestTime);}
        finishTime=t;
        SFX.win();
      }else{
        SFX.lose();
      }
      updateScore();
    }
  }

  drawDrum();
  drawBoat(Math.min(playerDist,COURSE),H/2-60,'#e53935',I18N.t('dragon_you_label','YOU'));
  drawBoat(Math.min(aiDist,COURSE),H/2+60,'#43a047',I18N.t('dragon_ai_label','AI'));

  if(hitFlash>0){
    ctx.fillStyle=`rgba(76,175,80,${hitFlash*0.3})`;
    ctx.fillRect(0,0,W,H);
  }
  if(missFlash>0){
    ctx.fillStyle=`rgba(229,57,53,${missFlash*0.25})`;
    ctx.fillRect(0,0,W,H);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    const title=winner==='player'? I18N.t('dragon_win_title','YOU WIN!') : I18N.t('dragon_lose_title','AI WINS!');
    ctx.fillText(title,W/2,H/2-20);
    ctx.font='20px Arial';
    if(winner==='player'&&finishTime!=null){
      ctx.fillText(I18N.t('dragon_finish_time_label','Finish time: {t}s').replace('{t}',finishTime.toFixed(1)),W/2,H/2+14);
    }
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
  }

  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
