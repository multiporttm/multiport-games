<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#241020;display:block;border-radius:8px}
#score-display{color:#e0a3d0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wine Label Design</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>1-4</b> or <b>tap a row</b> to select a category, then <b>Left/Right Arrow</b> or the <b>◀ ▶</b> buttons to cycle options. Match all four to the owner's brief and press <b>Enter</b> / tap <b>Submit</b> before the deadline bar runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const CATS=[
  {key:'vintage',label:'Vintage',opts:['2016','2017','2018','2019','2020']},
  {key:'varietal',label:'Varietal',opts:['Cabernet','Merlot','Chardonnay','Pinot Noir','Riesling']},
  {key:'crest',label:'Region Crest',opts:['🦅','🦁','🍇','⚜️','🌿']},
  {key:'color',label:'Color Scheme',opts:['Burgundy','Gold','Forest','Slate','Ivory']}
];
let choice=[0,0,0,0],target=[0,0,0,0],selected=0;
let score=0,hi=parseInt(localStorage.getItem('hi_winelabeldesign')||'0',10);
let lives=3,level=1,round=0,gameOver=false,started=false;
let deadline=0,deadlineMax=0,lastTime=null,flashTimer=0,flashMsg='',flashGood=true;

function newBrief(){
  for(let i=0;i<4;i++){target[i]=Math.floor(Math.random()*CATS[i].opts.length);choice[i]=Math.floor(Math.random()*CATS[i].opts.length);}
  selected=0;
  deadlineMax=Math.max(260,620-level*28);
  deadline=deadlineMax;
}

function reset(){
  score=0;lives=3;level=1;round=0;gameOver=false;started=false;lastTime=null;
  newBrief();
}
reset();

function flash(msg,good){flashMsg=msg;flashGood=good;flashTimer=60;}

function cycle(dir){
  const n=CATS[selected].opts.length;
  choice[selected]=(choice[selected]+dir+n)%n;
  SFX.tick();
}

function submit(){
  const ok=choice.every((v,i)=>v===target[i]);
  round++;
  if(ok){
    score+=25*level+Math.floor(deadline/10);
    SFX.success();
    flash(I18N.t('label_approved','Label approved!'),true);
    if(round%4===0){level++;SFX.levelup();flash(I18N.t('level_up','Level {n}!').replace('{n}',level),true);}
    newBrief();
  }else{
    lives--;
    SFX.fail();
    flash(I18N.t('label_rejected','Rejected — mismatch!'),false);
    if(lives<=0){endGame();}else{newBrief();}
  }
}

function endGame(){
  gameOver=true;SFX.lose();
  if(score>hi){hi=score;localStorage.setItem('hi_winelabeldesign',String(hi));}
}

document.addEventListener('keydown',e=>{
  if(!started){started=true;if(e.code==='Space')e.preventDefault();return;}
  if(gameOver){if(e.code==='Space'||e.code==='Enter'){reset();}return;}
  if(e.key>='1'&&e.key<='4'){selected=parseInt(e.key,10)-1;SFX.select();}
  else if(e.code==='ArrowLeft'){e.preventDefault();cycle(-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();cycle(1);}
  else if(e.code==='ArrowUp'){e.preventDefault();selected=(selected+3)%4;SFX.select();}
  else if(e.code==='ArrowDown'){e.preventDefault();selected=(selected+1)%4;SFX.select();}
  else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();submit();}
});

function rowRect(i){return {x:80,y:150+i*55,w:640,h:42};}
function arrowRects(i){
  const r=rowRect(i);
  return {left:{x:r.x+260,y:r.y,w:34,h:r.h},right:{x:r.x+r.w-34,y:r.y,w:34,h:r.h}};
}
function submitRect(){return {x:W/2-80,y:370,w:160,h:40};}
function inRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}

function handlePointer(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  for(let i=0;i<4;i++){
    const r=rowRect(i);
    const ar=arrowRects(i);
    if(inRect(x,y,ar.left)){selected=i;cycle(-1);return;}
    if(inRect(x,y,ar.right)){selected=i;cycle(1);return;}
    if(inRect(x,y,r)){selected=i;SFX.select();return;}
  }
  if(inRect(x,y,submitRect())){submit();return;}
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  handlePointer((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];const r=c.getBoundingClientRect();
  handlePointer((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0d18');bg.addColorStop(1,'#241020');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('brief_title','Winery Owner\'s Brief'),W/2,32);
  ctx.font='14px Arial';
  ctx.fillText(I18N.t('lives_level_label','Lives: {l}  Level: {v}').replace('{l}','❤️'.repeat(Math.max(0,lives))).replace('{v}',level),W/2,54);

  if(!started){
    ctx.fillStyle='#e0a3d0';ctx.font='bold 22px Arial';
    ctx.fillText(I18N.t('start_hint3','Press any key or Tap to start'),W/2,H/2);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,216);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  deadline-=dt;
  if(deadline<=0){
    lives--;SFX.error();
    flash(I18N.t('deadline_missed','Deadline missed!'),false);
    if(lives<=0){endGame();}else{newBrief();}
  }

  // deadline bar
  ctx.fillStyle='#1a1a1a';ctx.fillRect(80,66,640,14);
  ctx.fillStyle=deadline/deadlineMax>0.3?'#7ec850':'#e05050';
  ctx.fillRect(80,66,640*Math.max(0,deadline/deadlineMax),14);

  for(let i=0;i<4;i++){
    const r=rowRect(i);
    ctx.fillStyle=i===selected?'rgba(224,163,208,0.15)':'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x,r.y,r.w,r.h);
    if(i===selected){ctx.strokeStyle='#e0a3d0';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);}
    ctx.fillStyle='#ddd';ctx.font='13px Arial';ctx.textAlign='left';
    ctx.fillText(I18N.t('cat_'+CATS[i].key,CATS[i].label)+':',r.x+10,r.y+27);
    ctx.fillStyle='#ffd54f';ctx.font='bold 13px Arial';ctx.textAlign='right';
    ctx.fillText(CATS[i].opts[target[i]],r.x+230,r.y+27);

    const ar=arrowRects(i);
    ctx.fillStyle='#5a3a52';
    ctx.fillRect(ar.left.x,ar.left.y,ar.left.w,ar.left.h);
    ctx.fillRect(ar.right.x,ar.right.y,ar.right.w,ar.right.h);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText('◀',ar.left.x+ar.left.w/2,ar.left.y+27);
    ctx.fillText('▶',ar.right.x+ar.right.w/2,ar.right.y+27);

    ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText(CATS[i].opts[choice[i]],(ar.left.x+ar.left.w+ar.right.x)/2,r.y+27);
  }

  const sr=submitRect();
  ctx.fillStyle='#8a2a6a';ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('submit_btn','Submit'),sr.x+sr.w/2,sr.y+26);

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashGood?'#7ec850':'#e05050';
    ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H-10);
    ctx.globalAlpha=1;
  }

  if(score>hi){hi=score;localStorage.setItem('hi_winelabeldesign',String(hi));}
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
