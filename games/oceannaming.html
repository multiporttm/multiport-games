<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{background:#0d2436;border-radius:14px;padding:16px;text-align:center}
#hud{display:flex;justify-content:space-between;align-items:center;color:#dff3ff;font-weight:700;max-width:560px;margin:0 auto 10px;flex-wrap:wrap;gap:6px}
#hud .stat{background:rgba(255,255,255,.06);padding:5px 12px;border-radius:20px;font-size:.95rem}
#lives{color:#ff6b6b}
#timerBar{max-width:560px;margin:0 auto 12px;height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#timerFill{height:100%;background:linear-gradient(90deg,#4fc3f7,#00e5ff);width:100%;transition:width .1s linear}
#mapWrap{max-width:560px;margin:0 auto;background:#0a1e2e;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
svg{display:block;width:100%;height:auto}
.land{fill:#1c3d2e;stroke:#264a38;stroke-width:.5}
.water-target{fill:#00b0ff;fill-opacity:.55;stroke:#7fe8ff;stroke-width:1.5;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{fill-opacity:.35}50%{fill-opacity:.7}}
#question{color:#fff;font-size:1.05rem;font-weight:700;margin:12px 0 8px}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
@media(max-width:480px){#options{grid-template-columns:1fr}}
.opt{padding:12px 10px;background:#12405c;color:#eaf7ff;border:2px solid #1f6690;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
.opt:hover{background:#175a80}
.opt:active{transform:scale(.97)}
.opt.correct{background:#2e7d32!important;border-color:#66bb6a}
.opt.wrong{background:#c62828!important;border-color:#ef5350}
.opt:disabled{cursor:default}
#msg{min-height:1.6em;color:#ffd54f;font-weight:800;margin-top:10px}
#startBtn{margin-top:14px;padding:12px 28px;background:#00b0ff;border:none;border-radius:24px;color:#00263a;font-weight:900;font-size:1.05rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ocean Naming</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <span class="stat" id="streakStat">Streak: 0</span>
        <span class="stat" id="livesStat">Lives: ❤️❤️❤️</span>
        <span class="stat" id="hiStat">Best: 0</span>
      </div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="mapWrap"><svg id="mapSvg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="question">Click Start to begin</div>
      <div id="options"></div>
      <div id="msg"></div>
      <button id="startBtn">Start Game</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A highlighted body of water appears on the map. Pick its correct name from the options before time runs out. Wrong picks cost a life. Build a streak for a higher score — later rounds bring trickier seas and shorter timers!</div>
</div>
<script>
// ---------- Simplified world landmasses (rough blobs, not geographically precise) ----------
const LAND_PATHS = [
"M40,80 C90,50 160,55 190,80 C210,95 200,130 170,150 C190,190 170,230 130,240 C90,250 60,220 55,180 C30,160 20,120 40,80 Z", // N. America
"M160,250 C190,240 220,260 215,300 C230,340 210,380 180,385 C160,388 150,350 145,320 C130,290 140,265 160,250 Z", // S. America
"M370,60 C420,45 470,55 490,80 C510,70 540,80 545,100 C560,110 550,135 530,140 C540,160 520,175 500,170 C480,190 450,185 440,160 C410,165 380,140 375,110 C360,95 360,75 370,60 Z", // Europe
"M400,170 C450,160 500,165 520,190 C540,220 520,260 480,280 C460,320 420,330 400,300 C370,290 360,250 375,220 C365,195 380,180 400,170 Z", // Africa
"M550,60 C620,40 700,55 730,90 C750,120 720,150 690,160 C700,190 660,210 620,195 C580,210 550,180 555,150 C530,120 530,85 550,60 Z", // Asia
"M620,290 C660,280 700,290 710,310 C720,330 695,345 670,340 C645,350 615,335 615,315 C610,300 615,295 620,290 Z" // Australia
];

// ---------- Question bank: bodies of water with approximate label position + difficulty ----------
// x,y are label anchor positions on the 800x400 svg canvas (open-water areas between landmasses)
const OCEANS = [
  {name:"Pacific Ocean", x:730, y:230, r:70, tier:1},
  {name:"Atlantic Ocean", x:300, y:190, r:60, tier:1},
  {name:"Indian Ocean", x:560, y:290, r:55, tier:1},
  {name:"Arctic Ocean", x:400, y:25, r:40, tier:1},
  {name:"Southern Ocean", x:400, y:390, r:35, tier:1},
  {name:"Mediterranean Sea", x:455, y:130, r:22, tier:2},
  {name:"Caribbean Sea", x:200, y:245, r:24, tier:2},
  {name:"Gulf of Mexico", x:150, y:225, r:20, tier:2},
  {name:"Red Sea", x:490, y:185, r:14, tier:2},
  {name:"Black Sea", x:500, y:110, r:14, tier:2},
  {name:"Caspian Sea", x:535, y:100, r:14, tier:2},
  {name:"South China Sea", x:640, y:200, r:20, tier:2},
  {name:"Sea of Japan", x:690, y:150, r:14, tier:2},
  {name:"Bering Sea", x:770, y:70, r:20, tier:2},
  {name:"Baltic Sea", x:420, y:65, r:14, tier:2},
  {name:"North Sea", x:400, y:75, r:12, tier:2},
  {name:"Bay of Bengal", x:590, y:230, r:18, tier:2},
  {name:"Arabian Sea", x:555, y:220, r:18, tier:2},
  {name:"Persian Gulf", x:520, y:190, r:10, tier:3},
  {name:"Sea of Okhotsk", x:730, y:100, r:16, tier:3},
  {name:"Coral Sea", x:670, y:300, r:18, tier:3},
  {name:"Tasman Sea", x:700, y:330, r:16, tier:3},
  {name:"Java Sea", x:630, y:250, r:12, tier:3},
  {name:"Adriatic Sea", x:465, y:120, r:8, tier:3},
  {name:"Aegean Sea", x:480, y:130, r:8, tier:3},
  {name:"Tyrrhenian Sea", x:450, y:135, r:8, tier:3},
  {name:"Sea of Marmara", x:495, y:105, r:6, tier:3},
  {name:"Yellow Sea", x:655, y:165, r:12, tier:3},
  {name:"Andaman Sea", x:600, y:240, r:10, tier:3},
  {name:"Gulf of Alaska", x:70, y:60, r:14, tier:3},
  {name:"Labrador Sea", x:230, y:70, r:14, tier:3},
  {name:"Norwegian Sea", x:410, y:35, r:12, tier:3},
  {name:"Weddell Sea", x:340, y:390, r:14, tier:3},
  {name:"Ross Sea", x:640, y:390, r:14, tier:3},
  {name:"Timor Sea", x:610, y:280, r:10, tier:3}
];

let hi=parseInt(localStorage.getItem('oceannaming_hi')||'0',10);
let lives=3, streak=0, round=0, started=false, timerId=null, timeLeft=0, timeMax=0, currentAnswer=null, locked=false;

document.getElementById('hiStat').textContent=I18N.t('best_label','Best: {n}').replace('{n}',hi);

function buildMap(){
  const svg=document.getElementById('mapSvg');
  svg.innerHTML='';
  const oceanBg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  oceanBg.setAttribute('x',0);oceanBg.setAttribute('y',0);oceanBg.setAttribute('width',800);oceanBg.setAttribute('height',400);
  oceanBg.setAttribute('fill','#0a1e2e');
  svg.appendChild(oceanBg);
  LAND_PATHS.forEach(d=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);p.setAttribute('class','land');
    svg.appendChild(p);
  });
}

function pickQuestion(){
  const maxTier = round<4?1:(round<10?2:3);
  const pool = OCEANS.filter(o=>o.tier<=maxTier);
  const q = pool[Math.floor(Math.random()*pool.length)];
  return q;
}

function drawHighlight(q){
  const svg=document.getElementById('mapSvg');
  const old=svg.querySelector('.water-target');
  if(old)old.remove();
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);c.setAttribute('r',q.r);
  c.setAttribute('class','water-target');
  svg.appendChild(c);
}

function makeOptions(correct){
  const maxTier = round<4?1:(round<10?2:3);
  let pool = OCEANS.filter(o=>o.name!==correct.name && o.tier<=Math.max(maxTier,correct.tier));
  const opts=[correct];
  while(opts.length<4 && pool.length){
    const idx=Math.floor(Math.random()*pool.length);
    opts.push(pool[idx]);
    pool.splice(idx,1);
  }
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return opts;
}

function nextRound(){
  if(!started)return;
  locked=false;
  round++;
  document.getElementById('msg').textContent='';
  const q=pickQuestion();
  currentAnswer=q;
  drawHighlight(q);
  document.getElementById('question').textContent=I18N.t('question_prompt','Which body of water is highlighted?');
  const opts=makeOptions(q);
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=I18N.t('ocean_'+o.name.replace(/[^a-z0-9]/gi,'_').toLowerCase(),o.name);
    b.onclick=()=>choose(o,b);
    optsEl.appendChild(b);
  });
  timeMax = Math.max(3.5, 8 - round*0.25);
  timeLeft = timeMax;
  updateTimerBar();
  clearInterval(timerId);
  timerId=setInterval(tick,100);
}

function tick(){
  timeLeft-=0.1;
  updateTimerBar();
  if(timeLeft<=0){
    clearInterval(timerId);
    if(!locked)timeoutFail();
  }
}
function updateTimerBar(){
  const pct=Math.max(0,timeLeft/timeMax*100);
  document.getElementById('timerFill').style.width=pct+'%';
}

function timeoutFail(){
  locked=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  SFX.error();
  document.getElementById('msg').textContent=I18N.t('time_up_msg','⏰ Time\'s up! It was {n}.').replace('{n}',currentAnswer.name);
  loseLife();
}

function choose(o,btn){
  if(locked)return;
  locked=true;
  clearInterval(timerId);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(o.name===currentAnswer.name){
    btn.classList.add('correct');
    streak++;
    if(streak>hi){hi=streak;localStorage.setItem('oceannaming_hi',hi);}
    document.getElementById('streakStat').textContent=I18N.t('streak_label','Streak: {n}').replace('{n}',streak);
    document.getElementById('hiStat').textContent=I18N.t('best_label','Best: {n}').replace('{n}',hi);
    document.getElementById('msg').textContent=I18N.t('correct_msg','✅ Correct!');
    SFX.success();
    setTimeout(nextRound,700);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{ if(b.textContent===currentAnswer.name || (I18N.t('ocean_'+currentAnswer.name.replace(/[^a-z0-9]/gi,'_').toLowerCase(),currentAnswer.name)===b.textContent))b.classList.add('correct'); });
    document.getElementById('msg').textContent=I18N.t('wrong_msg','❌ Not quite — it was {n}.').replace('{n}',currentAnswer.name);
    SFX.error();
    loseLife();
  }
}

function loseLife(){
  lives--;
  renderLives();
  if(lives<=0){
    setTimeout(gameOver,900);
  } else {
    setTimeout(nextRound,900);
  }
}

function renderLives(){
  document.getElementById('livesStat').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤️'.repeat(Math.max(0,lives)));
}

function gameOver(){
  started=false;
  clearInterval(timerId);
  document.getElementById('question').textContent=I18N.t('game_over_streak','Game Over! Final streak: {n}').replace('{n}',streak);
  document.getElementById('options').innerHTML='';
  document.getElementById('msg').textContent='';
  SFX.lose();
  const startBtn=document.getElementById('startBtn');
  startBtn.textContent=I18N.t('play_again_btn','Play Again');
  startBtn.style.display='inline-block';
}

function startGame(){
  lives=3;streak=0;round=0;started=true;
  renderLives();
  document.getElementById('streakStat').textContent=I18N.t('streak_label','Streak: {n}').replace('{n}',0);
  document.getElementById('startBtn').style.display='none';
  nextRound();
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(!started)return;
  const idx=parseInt(e.key,10);
  if(idx>=1&&idx<=4){
    const btns=document.querySelectorAll('.opt');
    if(btns[idx-1] && !btns[idx-1].disabled)btns[idx-1].click();
  }
});

buildMap();
</script></body></html>
