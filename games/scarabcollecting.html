<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#c98a3d;display:block;border-radius:8px;touch-action:none}
#score-display{color:#5a3d1f;background:#f2d9a8;font-size:1.1rem;font-weight:800;text-align:center;padding:8px;border-radius:6px 6px 0 0}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Scarab Collecting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b>, <b>A/D</b>, or <b>drag/tap</b> the left and right side of the field to steer your scarab. Roll through bonus dung scraps to grow your ball, dodge <b>sand traps</b> that slow you down, and avoid the <b>predator beetles</b> — one hit pops your ball!</div>
</div>
<script>
const HI_KEY='scarabcollecting_hi';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const scoreEl=document.getElementById('score-display');

let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,gameOver=true,started=false,elapsed=0;
let ballRadius=18;
const player={x:W/2,vx:0};
const groundY=H-40;
let items=[],traps=[],beetles=[];
let itemTimer=0,trapTimer=0,beetleTimer=0,spd=3.2;
let slowTimer=0;
let keys={left:false,right:false};
let dragX=null;

function fmt(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
}

function reset(){
  score=0;gameOver=false;started=true;elapsed=0;
  ballRadius=18;player.x=W/2;player.vx=0;
  items=[];traps=[];beetles=[];itemTimer=0;trapTimer=0;beetleTimer=0;spd=3.2;slowTimer=0;
  fmt();
}

function spawnItem(){items.push({x:40+Math.random()*(W-80),y:-20,r:8});}
function spawnTrap(){traps.push({x:60+Math.random()*(W-120),y:-30,w:60+Math.random()*30,h:24});}
function spawnBeetle(){beetles.push({x:40+Math.random()*(W-80),y:-30,r:16,vx:(Math.random()<0.5?-1:1)*1.2});}

function circleHit(ax,ay,ar,bx,by,br){
  const dx=ax-bx,dy=ay-by;
  return Math.sqrt(dx*dx+dy*dy)<ar+br;
}
function rectHit(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function startOrRestart(){
  if(gameOver){reset();return;}
  started=true;
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;}
  if(e.code==='Space'){e.preventDefault();startOrRestart();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=false;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=false;}
});
c.addEventListener('pointerdown',e=>{
  if(gameOver){startOrRestart();return;}
  const rect=c.getBoundingClientRect();
  dragX=(e.clientX-rect.left)*(W/rect.width);
});
c.addEventListener('pointermove',e=>{
  if(dragX===null)return;
  const rect=c.getBoundingClientRect();
  dragX=(e.clientX-rect.left)*(W/rect.width);
});
window.addEventListener('pointerup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();
  if(gameOver){startOrRestart();return;}
  const rect=c.getBoundingClientRect();
  dragX=(e.touches[0].clientX-rect.left)*(W/rect.width);
},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();
  const rect=c.getBoundingClientRect();
  dragX=(e.touches[0].clientX-rect.left)*(W/rect.width);
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragX=null;},{passive:false});

function drawScarab(){
  ctx.save();
  ctx.translate(player.x,groundY);
  // dung ball
  const grad=ctx.createRadialGradient(-ballRadius*0.3,-ballRadius*0.3,ballRadius*0.2,0,0,ballRadius);
  grad.addColorStop(0,'#6b4a2a');grad.addColorStop(1,'#3b2a17');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(0,-ballRadius,ballRadius,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#241a0e';ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(0,-ballRadius,ballRadius*0.5+i*ballRadius*0.15,0,Math.PI*2);
    ctx.stroke();
  }
  // scarab body behind ball
  ctx.fillStyle='#1a3d1f';
  ctx.beginPath();ctx.ellipse(0,-4,16,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2d5a27';
  ctx.beginPath();ctx.ellipse(-2,-4,10,7,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle='#123016';ctx.lineWidth=3;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.moveTo(-4,-4+i*4);ctx.lineTo(-18,-8+i*6);ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#e8b96b');sky.addColorStop(1,'#c98a3d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#a8712c';ctx.fillRect(0,groundY+2,W,H-groundY);

  if(!started){
    ctx.fillStyle='#3b2a17';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,H/2);
    drawScarab();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawScarab();
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+16);
    requestAnimationFrame(loop);
    return;
  }

  elapsed++;
  score+=0.15*(1+ballRadius/40);
  if(score>hi)hi=score;
  spd=3.2+elapsed/900;
  ballRadius=Math.min(48,18+elapsed/160);

  const moveSpeed=(3+ballRadius*0.03)*(slowTimer>0?0.4:1);
  if(dragX!==null){
    if(dragX<player.x-4)player.x-=moveSpeed;
    else if(dragX>player.x+4)player.x+=moveSpeed;
  } else {
    if(keys.left)player.x-=moveSpeed;
    if(keys.right)player.x+=moveSpeed;
  }
  player.x=Math.max(ballRadius+10,Math.min(W-ballRadius-10,player.x));
  if(slowTimer>0)slowTimer--;

  itemTimer++;trapTimer++;beetleTimer++;
  if(itemTimer>50){itemTimer=0;spawnItem();}
  if(trapTimer>110-Math.min(60,elapsed/40)){trapTimer=0;if(Math.random()<0.8)spawnTrap();}
  if(beetleTimer>170-Math.min(100,elapsed/30)){beetleTimer=0;spawnBeetle();}

  items=items.filter(it=>it.y<H+30);
  items.forEach(it=>{
    it.y+=spd;
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fill();
    if(circleHit(player.x,groundY-ballRadius,ballRadius,it.x,it.y,it.r)){
      it.y=H+999;score+=25;SFX.coin();
    }
  });

  traps=traps.filter(t=>t.y<H+40);
  traps.forEach(t=>{
    t.y+=spd;
    ctx.fillStyle='rgba(210,180,120,0.85)';
    ctx.beginPath();ctx.ellipse(t.x+t.w/2,t.y+t.h/2,t.w/2,t.h/2,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#8a5a2b';ctx.stroke();
    if(rectHit(player.x,groundY-ballRadius*0.3,ballRadius,t.x,t.y,t.w,t.h) && slowTimer<=0){
      slowTimer=90;SFX.hurt();
    }
  });

  beetles=beetles.filter(b=>b.y<H+30);
  beetles.forEach(b=>{
    b.y+=spd*1.1;b.x+=b.vx;
    if(b.x<20||b.x>W-20)b.vx*=-1;
    ctx.fillStyle='#8b1e2b';
    ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*0.7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a0f18';
    ctx.beginPath();ctx.ellipse(b.x,b.y-b.r*0.7,b.r*0.5,b.r*0.4,0,0,Math.PI*2);ctx.fill();
    if(circleHit(player.x,groundY-ballRadius,ballRadius,b.x,b.y,b.r)){
      gameOver=true;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      fmt();
    }
  });

  drawScarab();
  fmt();
  requestAnimationFrame(loop);
}
fmt();
loop();
</script></body></html>
