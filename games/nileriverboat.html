<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#hud{color:#eafcff;font-size:1.05rem;font-weight:800;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#hud span b{color:#ffd54f}
#pcHolder{position:relative;max-width:100%}
canvas#pc{background:#1b5e6b;border-radius:8px;touch-action:none;max-width:100%;display:block}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);border-radius:8px;color:#fff;text-align:center;flex-direction:column;gap:10px}
#overlay.show{display:flex}
#overlay button{padding:10px 24px;background:#e94560;border:none;border-radius:20px;color:#fff;font-size:1rem;cursor:pointer;font-weight:700}
#touchCtrl{display:flex;gap:40px}
.tbtn{width:64px;height:56px;background:#0f3d47;border:2px solid #4fd0e0;border-radius:12px;color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Nile River Boat</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud"><span>Dist: <b id="distLbl">0</b>m</span><span>Time: <b id="timeLbl">0.0</b>s</span><span>Best: <b id="hiLbl">--</b></span></div>
      <div id="pcHolder">
        <canvas id="pc" width="380" height="560"></canvas>
        <div id="overlay">
          <div id="overlayTitle" style="font-size:1.6rem;font-weight:900"></div>
          <div id="overlayMsg"></div>
          <button id="overlayBtn">Play Again</button>
        </div>
      </div>
      <div id="touchCtrl">
        <div class="tbtn" id="btnLeft">◀</div>
        <div class="tbtn" id="btnRight">▶</div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Steer with <b>Arrow Keys</b> or <b>A/D</b>, or drag/tap the on-screen arrows. Dodge rocks, crocodiles, and rival boats. Ride the <b>blue current</b> for a speed boost. Reach the finish town before your boat is wrecked!</div>
</div>
<script>
const canvas=document.getElementById('pc'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle');
const overlayMsg=document.getElementById('overlayMsg');
const overlayBtn=document.getElementById('overlayBtn');
const HI_KEY='nileriverboat_hi';
let hi=parseFloat(localStorage.getItem(HI_KEY)||'0');
document.getElementById('hiLbl').textContent=hi>0?hi.toFixed(1)+'s':'--';

const W=canvas.width,H=canvas.height;
const RIVER_L=30,RIVER_R=W-30;
const FINISH_DIST=2600;
const boat={x:W/2,y:H-90,w:30,h:46,vx:0};
let obstacles,dist,elapsed,gameOver,won,started,lastTime,spawnTimer,current,currentTimer,keys={},reeds;

function reset(){
  boat.x=W/2;boat.vx=0;
  obstacles=[];
  dist=0;elapsed=0;gameOver=false;won=false;started=false;lastTime=null;spawnTimer=0;
  current={x:RIVER_L+ (RIVER_R-RIVER_L)*0.5,w:70};
  currentTimer=0;
  reeds=[];
  for(let i=0;i<10;i++)reeds.push({y:Math.random()*H,side:Math.random()<0.5?0:1});
  updateHud();
}

function updateHud(){
  document.getElementById('distLbl').textContent=Math.floor(dist);
  document.getElementById('timeLbl').textContent=elapsed.toFixed(1);
}

function spawnObstacle(){
  const types=['rock','croc','boat'];
  const type=types[Math.floor(Math.random()*types.length)];
  const w=type==='boat'?36:26;
  const x=RIVER_L+10+Math.random()*(RIVER_R-RIVER_L-20-w);
  obstacles.push({type,x,y:-40,w,h:type==='boat'?46:24,vy:0});
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function startGame(){ if(!started){started=true;} }

function moveLeft(){ startGame(); boat.vx=-4.2; }
function moveRight(){ startGame(); boat.vx=4.2; }
function stopMove(dir){ if((dir==='l'&&boat.vx<0)||(dir==='r'&&boat.vx>0)||dir==='both') boat.vx=0; }

document.addEventListener('keydown',e=>{
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){reset();return;}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=true;moveLeft();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=true;moveRight();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=false;boat.vx=keys.r?4.2:0;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=false;boat.vx=keys.l?-4.2:0;}
});

const btnLeft=document.getElementById('btnLeft'),btnRight=document.getElementById('btnRight');
function bindHold(el,onDown,onUp){
  el.addEventListener('pointerdown',e=>{e.preventDefault();onDown();});
  el.addEventListener('pointerup',e=>{e.preventDefault();onUp();});
  el.addEventListener('pointerleave',e=>{onUp();});
  el.addEventListener('pointercancel',e=>{onUp();});
}
bindHold(btnLeft,()=>{keys.l=true;moveLeft();},()=>{keys.l=false;boat.vx=keys.r?4.2:0;});
bindHold(btnRight,()=>{keys.r=true;moveRight();},()=>{keys.r=false;boat.vx=keys.l?-4.2:0;});

let dragging=false;
canvas.addEventListener('pointerdown',e=>{dragging=true;startGame();dragTo(e);});
canvas.addEventListener('pointermove',e=>{ if(dragging)dragTo(e); });
window.addEventListener('pointerup',()=>{dragging=false;});
function dragTo(e){
  const rect=canvas.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(W/rect.width);
  boat.x=Math.max(RIVER_L+boat.w/2,Math.min(RIVER_R-boat.w/2,px));
}

function winGame(){
  gameOver=true;won=true;
  if(hi===0||elapsed<hi){hi=elapsed;localStorage.setItem(HI_KEY,String(hi));}
  document.getElementById('hiLbl').textContent=hi.toFixed(1)+'s';
  SFX.win();
  overlayTitle.textContent=I18N.t('win_title','TOWN REACHED!');
  overlayMsg.textContent=I18N.t('final_time_label','Time: {t}s').replace('{t}',elapsed.toFixed(1));
  overlay.classList.add('show');
}
function loseGame(){
  gameOver=true;won=false;
  SFX.lose();
  overlayTitle.textContent=I18N.t('lose_title','BOAT WRECKED!');
  overlayMsg.textContent=I18N.t('final_dist_label','Distance: {d}m').replace('{d}',Math.floor(dist));
  overlay.classList.add('show');
}
overlayBtn.addEventListener('click',reset);

function drawBoat(){
  ctx.save();
  ctx.translate(boat.x,boat.y);
  ctx.fillStyle='#c9a24b';
  ctx.beginPath();
  ctx.moveTo(0,-boat.h/2);
  ctx.quadraticCurveTo(boat.w/2,0,0,boat.h/2);
  ctx.quadraticCurveTo(-boat.w/2,0,0,-boat.h/2);
  ctx.fill();
  ctx.strokeStyle='#7a5c2e';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#8a6a3a';
  ctx.fillRect(-3,-boat.h/2-6,6,10);
  ctx.restore();
}

function drawObstacle(o){
  if(o.type==='rock'){
    ctx.fillStyle='#6b6b6b';
    ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a8a8a';
    ctx.beginPath();ctx.ellipse(o.x+o.w/2-4,o.y+o.h/2-4,o.w/4,o.h/4,0,0,Math.PI*2);ctx.fill();
  } else if(o.type==='croc'){
    ctx.fillStyle='#3a6b2e';
    ctx.fillRect(o.x,o.y+6,o.w,o.h-12);
    ctx.beginPath();ctx.moveTo(o.x,o.y+o.h/2);ctx.lineTo(o.x-10,o.y+o.h/2-4);ctx.lineTo(o.x-10,o.y+o.h/2+4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8d34a';
    ctx.fillRect(o.x+o.w-10,o.y+8,4,4);
  } else {
    ctx.fillStyle='#5a4020';
    ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a6a3a';
    ctx.fillRect(o.x+o.w/2-2,o.y+4,4,o.h-8);
  }
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const water=ctx.createLinearGradient(0,0,0,H);
  water.addColorStop(0,'#2a7d8c');water.addColorStop(1,'#164a56');
  ctx.fillStyle=water;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#c9a24b';
  ctx.fillRect(0,0,RIVER_L,H);
  ctx.fillRect(RIVER_R,0,W-RIVER_R,H);

  // current band drifting
  currentTimer+=dt;
  current.x=RIVER_L+40+((RIVER_R-RIVER_L-80)/2)*(1+Math.sin(currentTimer*0.01));
  ctx.fillStyle='rgba(120,210,255,0.35)';
  ctx.fillRect(current.x-current.w/2,0,current.w,H);

  reeds.forEach(r=>{
    r.y+=(started&&!gameOver?2.5:0)*dt;
    if(r.y>H)r.y=-20;
    const x=r.side?RIVER_R+8:RIVER_L-8;
    ctx.fillStyle='#3d8020';
    ctx.fillRect(x,r.y,4,18);
  });

  if(!started){
    ctx.fillStyle='#eafcff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Arrows/A-D or drag to start'),W/2,H/2);
    drawBoat();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawBoat();
    requestAnimationFrame(loop);
    return;
  }

  elapsed+=dt/60;
  boat.x+=boat.vx*dt;
  boat.x=Math.max(RIVER_L+boat.w/2,Math.min(RIVER_R-boat.w/2,boat.x));

  const inCurrent=boat.x>current.x-current.w/2&&boat.x<current.x+current.w/2;
  const baseSpeed=3.4+dist/900;
  const speed=inCurrent?baseSpeed*1.6:baseSpeed;
  dist+=speed*dt*0.35;

  spawnTimer+=dt;
  const interval=Math.max(28,60-dist/60);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle();}

  obstacles=obstacles.filter(o=>o.y<H+60);
  const boatHit={x:boat.x-boat.w/2+4,y:boat.y-boat.h/2+4,w:boat.w-8,h:boat.h-8};
  obstacles.forEach(o=>{
    o.y+=(speed+2)*dt;
    drawObstacle(o);
    if(rectsOverlap(boatHit,o)&&!gameOver){
      gameOver=true;
      SFX.hit();
      setTimeout(loseGame,120);
    }
  });

  drawBoat();

  if(dist>=FINISH_DIST&&!gameOver){
    gameOver=true;
    setTimeout(winGame,80);
  }

  updateHud();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script></body></html>
