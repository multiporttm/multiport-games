<link rel="stylesheet" href="../css/style.css?v=8">

<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b1a10;display:block;border-radius:8px;touch-action:none}
#hud{color:#d9a066;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#e8c39e}
#hud span.hs{color:#7ec850}
#slotBtns{display:flex;justify-content:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
#slotBtns button{padding:8px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.9rem;color:#fff;background:#8b5a2b}
#slotBtns button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wooden Boat Hull Planking</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Level: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="slotBtns"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Steam-bend the glowing plank, then press the matching <b>number key</b> or <b>tap</b> the rib position where it belongs. Always fasten the <b>lowest open rib</b> first — the garboard plank goes on before you work your way up the hull.</div>
</div>
<script>
(function(){
const HS_KEY='woodenboathullplanking_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let totalSlots=6,filled=[],nextSlot=0,choices=[],timeLeft=0,timeLimit=0,resolved=false,bend=0,bendDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildButtons(){
  const el=document.getElementById('slotBtns');
  el.innerHTML='';
  choices.forEach((slot,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+I18N.t('rib_label','Rib {n}').replace('{n}',slot+1);
    btn.dataset.i=i;
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(i);});
    el.appendChild(btn);
  });
}

function newPlank(){
  totalSlots=Math.min(10,5+Math.floor(level/2));
  if(filled.length!==totalSlots){ filled=new Array(totalSlots).fill(false); nextSlot=0; }
  timeLimit=Math.max(190,420-level*20);
  timeLeft=timeLimit;
  bend=0;bendDone=false;resolved=false;
  const open=[];
  for(let i=0;i<totalSlots;i++) if(!filled[i]) open.push(i);
  if(open.length===0){ levelComplete(); return; }
  const correct=nextSlot;
  const decoyCount=Math.min(open.length-1,2+Math.floor(level/2));
  const decoys=shuffle(open.filter(s=>s!==correct)).slice(0,decoyCount);
  choices=shuffle([correct,...decoys]);
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;filled=new Array(5+Math.floor(level/2)).fill(false);nextSlot=0;newPlank(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('level_label','Level: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelComplete(){
  level++;SFX.levelup();
  filled=new Array(Math.min(10,5+Math.floor(level/2))).fill(false);
  nextSlot=0;
  newPlank();
}

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newPlank();
}

function passRound(){
  score+=30*level;SFX.coin();
  filled[nextSlot]=true;
  nextSlot++;
  if(nextSlot>=totalSlots){ levelComplete(); return; }
  newPlank();
}

function onGuess(i){
  if(!started||gameOver)return;
  if(!bendDone||resolved)return;
  resolved=true;
  if(choices[i]===nextSlot){ passRound(); }
  else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m&&started&&!gameOver){ e.preventDefault(); onGuess(parseInt(m[1],10)-1); }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawHull(){
  const baseX=W/2,baseTopY=60,rowH=22;
  ctx.save();
  ctx.translate(baseX,baseTopY);
  for(let i=0;i<totalSlots;i++){
    const y=(totalSlots-1-i)*rowH;
    const curve=Math.sin((i/totalSlots)*Math.PI)*40;
    const w=160+curve;
    ctx.fillStyle=filled[i]?'#8b5a2b':'#3a2415';
    ctx.strokeStyle='#1a0f08';ctx.lineWidth=2;
    ctx.fillRect(-w/2,y,w,rowH-3);
    ctx.strokeRect(-w/2,y,w,rowH-3);
    if(i===nextSlot&&!gameOver){
      ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
      ctx.strokeRect(-w/2-3,y-3,w+6,rowH-3+6);
    }
  }
  ctx.restore();
}

function drawPlankBending(){
  const sx=W/2,sy=250;
  ctx.save();
  const bendAmt=bend*0.6;
  ctx.strokeStyle='#d9a066';ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(sx-150,sy);
  ctx.quadraticCurveTo(sx,sy-bendAmt*40,sx+150,sy);
  ctx.stroke();
  ctx.restore();
  if(bendDone){
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pick_hint','Plank ready — press 1-9 or tap the correct rib'),sx,sy+40);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0f08');bg.addColorStop(1,'#2b1a10');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#d9a066';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawHull();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!bendDone){
    bend+=0.014+level*0.0015;
    if(bend>=1){bend=1;bendDone=true;SFX.swoosh();}
  } else {
    timeLeft--;
    if(timeLeft<=0){ failRound(); }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(bendDone?I18N.t('ready_hint','Choose the next rib to fasten'):I18N.t('bending_hint','Steaming and bending plank...'),W/2,30);

  if(bendDone){
    const barW=400,barH=10,barX=W/2-barW/2,barY=44;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  }

  drawHull();
  drawPlankBending();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
