<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#e8dcc8;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#score-display{color:#7c5cff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#qualitybar-wrap{max-width:400px;margin:4px auto;background:#1a1a2e;border-radius:8px;height:14px;overflow:hidden}
#qualitybar{height:100%;width:100%;background:linear-gradient(90deg,#e53935,#ffca28,#4caf50);transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sewing Machine</div>
  <div class="game-frame">
    <div id="score-display">Seams: 0 | Hi: 0 | Lives: 3</div>
    <div id="qualitybar-wrap"><div id="qualitybar"></div></div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and hold on the needle, then <b>drag</b> along the marked seam line as the fabric feeds forward. Stay close to the line to keep stitch quality high — a botched seam costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
let score=0,hi=parseInt(localStorage.getItem('sewing_hi')||'0',10),lives=3,seams=0,gameOver=false,started=false;
let feedSpeed=0.8,quality=100,pathPoints=[],needle={x:0,y:0},dragging=false,seamLen=0,feedX=0,level=1;

function genPath(lvl){
  // Generate a path as a function y(x) using sum of sine waves with increasing complexity
  const pts=[];
  const amp1=20+Math.min(40,lvl*4);
  const amp2=8+Math.min(20,lvl*2);
  const freq1=0.008+Math.min(0.01,lvl*0.001);
  const freq2=0.02+Math.min(0.02,lvl*0.002);
  const phase=Math.random()*Math.PI*2;
  const baseY=H/2;
  for(let x=0;x<=W+400;x+=4){
    const y=baseY+amp1*Math.sin(x*freq1+phase)+amp2*Math.sin(x*freq2+phase*1.7);
    pts.push({x,y});
  }
  return pts;
}

function pathYAt(x){
  // find y on pathPoints for given x (interpolate)
  if(x<=pathPoints[0].x)return pathPoints[0].y;
  const idx=Math.floor(x/4);
  if(idx>=pathPoints.length-1)return pathPoints[pathPoints.length-1].y;
  const p0=pathPoints[idx],p1=pathPoints[idx+1];
  const t=(x-p0.x)/(p1.x-p0.x||1);
  return p0.y+(p1.y-p0.y)*t;
}

function newSeam(){
  pathPoints=genPath(level);
  feedX=0;
  quality=100;
  needle.x=100;needle.y=pathYAt(100);
  dragging=false;
  seamLen=W+300; // distance fabric must travel
}

function reset(){
  score=0;lives=3;seams=0;level=1;gameOver=false;started=false;
  newSeam();
}
reset();

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

function onDown(e){
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const p=getPos(e);
  // allow grabbing needle if near it
  if(Math.hypot(p.x-needle.x,p.y-needle.y)<40){
    dragging=true;
  }
}
function onMove(e){
  if(!dragging)return;
  e.preventDefault();
  const p=getPos(e);
  needle.y=Math.max(10,Math.min(H-10,p.y));
}
function onUp(){dragging=false;}

c.addEventListener('mousedown',onDown);
c.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
c.addEventListener('touchstart',onDown,{passive:false});
c.addEventListener('touchmove',onMove,{passive:false});
c.addEventListener('touchend',onUp);

function botchSeam(){
  lives--;
  SFX.fail();
  if(lives<=0){gameOver=true;SFX.lose();}
  else newSeam();
}

function completeSeam(){
  const bonus=Math.round(quality);
  score+=bonus;
  seams++;
  if(score>hi){hi=score;localStorage.setItem('sewing_hi',hi);}
  if(quality>=60){SFX.success();}else{SFX.point();}
  level++;
  newSeam();
}

function drawFabric(){
  ctx.fillStyle='#e8dcc8';
  ctx.fillRect(0,0,W,H);
  // fabric weave lines
  ctx.strokeStyle='rgba(0,0,0,0.05)';
  for(let i=0;i<H;i+=10){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
}

function drawSeamLine(){
  ctx.strokeStyle='#7c5cff';
  ctx.lineWidth=3;
  ctx.setLineDash([8,6]);
  ctx.beginPath();
  let first=true;
  for(let x=0;x<=W;x+=4){
    const worldX=x+feedX;
    const y=pathYAt(worldX);
    if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawStitches(){
  // draw completed stitches (small marks) trailing behind needle up to feed position
  ctx.strokeStyle='#333';
  ctx.lineWidth=2;
  for(let x=0;x<needle.x;x+=14){
    const worldX=x+feedX;
    const targetY=pathYAt(worldX);
    ctx.beginPath();
    ctx.moveTo(x,targetY-5);
    ctx.lineTo(x,targetY+5);
    ctx.stroke();
  }
}

function drawNeedle(){
  ctx.fillStyle=dragging?'#e53935':'#333';
  ctx.beginPath();
  ctx.arc(needle.x,needle.y,8,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(needle.x,needle.y-24);
  ctx.lineTo(needle.x,needle.y-8);
  ctx.strokeStyle='#888';ctx.lineWidth=3;
  ctx.stroke();
}

function loop(){
  drawFabric();

  if(!started){
    ctx.fillStyle='#7c5cffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click/Tap to start, then drag the needle'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('seams_completed_label','Seams completed: {n}').replace('{n}',seams),W/2,H/2+5);
    ctx.fillText(I18N.t('restart_hint','Tap or Click to restart'),W/2,H/2+35);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  drawSeamLine();

  // fabric feeds forward automatically
  feedX+=feedSpeed;

  // target y at needle's fixed x column
  const targetY=pathYAt(needle.x+feedX);
  const dist=Math.abs(needle.y-targetY);

  if(dragging){
    if(dist<12){
      quality=Math.min(100,quality+0.4);
    }else if(dist<30){
      quality-=0.3;
    }else{
      quality-=1.2;
    }
  }else{
    quality-=0.6; // not tracking at all
  }
  quality=Math.max(0,quality);

  document.getElementById('qualitybar').style.width=quality+'%';

  drawStitches();
  drawNeedle();

  if(quality<=0){
    botchSeam();
  }else if(feedX>=seamLen){
    completeSeam();
  }

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('seams_hi_lives_label','Seams: {s} | Hi: {h} | Lives: {l}')
      .replace('{s}',seams).replace('{h}',hi).replace('{l}',lives);
}

loop();
</script></body></html>
