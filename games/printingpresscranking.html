<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#20242b;display:block;border-radius:8px;touch-action:none}
#hud{color:#9fd3ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#ffb74d}
#hud span.hs{color:#7ec850}
#crankBtn{display:block;margin:8px auto 0;padding:11px 26px;border:none;border-radius:18px;font-weight:800;cursor:pointer;font-size:1rem;background:#4a4f5c;color:#fff;touch-action:none}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Printing Press Cranking</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <button id="crankBtn">CRANK (Space)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or tap <b>Crank</b> exactly when the needle crosses the marked beat to pull a clean impression. Early or late pulls smudge the page and cost a life. The tempo speeds up every round — keep an even run going as long as you can.</div>
</div>
<script>
(function(){
const HS_KEY='printingpresscranking_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const crankBtn=document.getElementById('crankBtn');

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let angle=0,angleSpeed=0.05,beatAngle=0,hitWindow=0.26;
let pagesPrinted=0,pagesThisRound=0,pagesNeeded=6;
let flash=0,flashGood=false,crankKick=0;
let waitingForBeat=true;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function newBeat(){
  beatAngle=Math.random()*Math.PI*2;
  waitingForBeat=true;
}

function newRound(){
  angleSpeed=0.045+level*0.009;
  hitWindow=Math.max(0.11,0.26-level*0.016);
  pagesNeeded=6+level;
  pagesThisRound=0;
  angle=0;
  newBeat();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;pagesPrinted=0;newRound(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); newRound(); }

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

function diffAngle(a,b){
  let d=Math.abs(a-b)%(Math.PI*2);
  if(d>Math.PI)d=Math.PI*2-d;
  return d;
}

function doCrank(){
  if(!started||gameOver){startGame();return;}
  crankKick=1;
  const d=diffAngle(angle,beatAngle);
  if(d<=hitWindow){
    score+=25*level;SFX.coin();
    pagesThisRound++;pagesPrinted++;
    flash=20;flashGood=true;
    if(pagesThisRound>=pagesNeeded) levelUp(); else newBeat();
  } else {
    lives--;SFX.fail();
    flash=20;flashGood=false;
    if(lives<=0){ endGame(); } else { newBeat(); }
  }
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

crankBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();doCrank();});
c.addEventListener('pointerdown',e=>{e.preventDefault();doCrank();});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doCrank(); }
});

function drawDial(){
  const cx=W/2,cy=170,r=100;
  ctx.strokeStyle='#4a4f5c';ctx.lineWidth=10;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  // beat marker
  const bx=cx+Math.cos(beatAngle)*r,by=cy+Math.sin(beatAngle)*r;
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=14;
  ctx.beginPath();
  ctx.arc(cx,cy,r,beatAngle-hitWindow,beatAngle+hitWindow);
  ctx.stroke();
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();
  // needle
  const nx=cx+Math.cos(angle)*(r-6),ny=cy+Math.sin(angle)*(r-6);
  ctx.strokeStyle='#9fd3ff';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);ctx.stroke();
  ctx.fillStyle='#9fd3ff';ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();
  // crank handle
  const handleLen=24+crankKick*18;
  const hx=cx+Math.cos(angle)*(r+handleLen),hy=cy+Math.sin(angle)*(r+handleLen);
  ctx.strokeStyle='#777';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(hx,hy,9,0,Math.PI*2);ctx.fill();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#15171c');bg.addColorStop(1,'#20242b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#9fd3ff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawDial();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  angle=(angle+angleSpeed)%(Math.PI*2);
  if(crankKick>0)crankKick=Math.max(0,crankKick-0.08);
  if(flash>0)flash--;

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('crank_hint','Crank when the needle hits the yellow beat'),W/2,30);
  ctx.font='13px Arial';
  ctx.fillText(I18N.t('pages_label','Pages this round: {a} / {b}').replace('{a}',pagesThisRound).replace('{b}',pagesNeeded),W/2,52);

  drawDial();

  if(flash>0){
    ctx.fillStyle=flashGood?'rgba(126,200,80,0.35)':'rgba(224,91,74,0.35)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(flashGood?I18N.t('msg_clean','Clean impression!'):I18N.t('msg_smudge','Smudged! Off the beat.'),W/2,H-40);
  }

  ctx.fillStyle='#9fd3ff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('pages_printed_label','Pages printed: {n}').replace('{n}',pagesPrinted),20,H-16);

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
