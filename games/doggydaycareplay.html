<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Doggy Daycare Play</title><meta name="description" content="Play Doggy Daycare Play free online — Sort dogs into the correct play group pen by size and energy level before time runs out."><link rel="canonical" href="https://games.multiportllc.com/games/doggydaycareplay"><meta property="og:title" content="Doggy Daycare Play - Multiport Games"><meta property="og:description" content="Play Doggy Daycare Play free online — Sort dogs into the correct play group pen by size and energy level before time runs out."><meta property="og:url" content="https://games.multiportllc.com/games/doggydaycareplay"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Doggy Daycare Play","description":"Play Doggy Daycare Play free online instantly. Sort dogs into the correct play group pen by size and energy level, moving dogs between groups so everyone has a good match to play with. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/doggydaycareplay","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#274b24;display:block;border-radius:8px}
#score-display{color:#b8e986;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Doggy Daycare Play</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lives: 3 | Level: 1 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">A dog arrives showing its <b>size</b> and <b>energy level</b>. Click, tap, or press number keys <b>1</b>–<b>5</b> to send it to the matching play pen before the timer runs out. Pens and speed increase as you level up!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('score-display');
const HS_KEY='hs_doggydaycareplay';
let score=0,lives=3,level=1,streak=0,hi=0;
let gameOver=false,started=false;
let dog=null,timeLeft=0,timeMax=0,lastTime=null,feedback=null,feedbackTimer=0;
let pens=[];

try{hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0;}catch(e){hi=0;}

const SIZES=[['S','Small'],['M','Medium'],['L','Large']];
const ENERGIES=[[1,'Calm','🟢'],[2,'Playful','🟡'],[3,'Hyper','🔴']];

function rand(n){return Math.floor(Math.random()*n);}

function buildPens(){
  const count=Math.min(3+Math.floor((level-1)/2),5);
  const combos=[];
  for(const s of SIZES)for(const en of ENERGIES)combos.push({size:s[0],sizeName:s[1],energy:en[0],energyName:en[1],dot:en[2]});
  // Shuffle then take `count` unique combos, always including a spread of energies
  for(let i=combos.length-1;i>0;i--){const j=rand(i+1);[combos[i],combos[j]]=[combos[j],combos[i]];}
  pens=combos.slice(0,count);
  const w=760/pens.length;
  pens.forEach((p,i)=>{p.x=20+i*w;p.w=w-10;p.y=330;p.h=90;});
}

function newDog(){
  const p=pens[rand(pens.length)];
  dog={size:p.size,energy:p.energy};
  timeMax=Math.max(2.6,5.5-level*0.3);
  timeLeft=timeMax;
}

function setFeedback(ok,msg){feedback={ok,msg};feedbackTimer=0.9;}

function updateScoreDisplay(){
  scoreDisp.textContent=I18N.t('score_status_label','Score: {s} | Lives: {l} | Level: {lv} | Hi: {h}')
    .replace('{s}',score).replace('{l}',lives).replace('{lv}',level).replace('{h}',hi);
}

function saveHi(){ if(score>hi){hi=score;try{localStorage.setItem(HS_KEY,String(hi));}catch(e){}} }

function resolveChoice(penIndex){
  if(!dog||gameOver)return;
  const p=pens[penIndex];
  const correct=p&&p.size===dog.size&&p.energy===dog.energy;
  if(correct){
    score+=10+level*2;
    streak++;
    SFX.success();
    setFeedback(true,I18N.t('correct_msg','Good match!'));
    if(streak>0&&streak%5===0){level++;SFX.levelup();buildPens();}
  } else {
    lives--;streak=0;SFX.fail();
    setFeedback(false,I18N.t('wrong_msg','Wrong pen!'));
    if(lives<=0){gameOver=true;SFX.lose();saveHi();updateScoreDisplay();return;}
  }
  saveHi();updateScoreDisplay();newDog();
}

function timeExpire(){
  lives--;streak=0;SFX.fail();
  setFeedback(false,I18N.t('time_up_msg','Too slow!'));
  if(lives<=0){gameOver=true;SFX.lose();saveHi();updateScoreDisplay();return;}
  saveHi();updateScoreDisplay();newDog();
}

function reset(){
  score=0;lives=3;level=1;streak=0;gameOver=false;started=true;feedback=null;feedbackTimer=0;lastTime=null;
  buildPens();newDog();updateScoreDisplay();
}

function handleAction(idx){
  if(!started){reset();return;}
  if(gameOver){reset();return;}
  if(idx==null)return;
  resolveChoice(idx);
}

document.addEventListener('keydown',e=>{
  const n=parseInt(e.key,10);
  if(!started||gameOver){
    if(e.key===' '||e.key==='Enter'||(n>=1&&n<=5)){handleAction();}
    return;
  }
  if(n>=1&&n<=pens.length){e.preventDefault();handleAction(n-1);}
});

function getPos(e){
  const rect=c.getBoundingClientRect();
  const t=e.touches&&e.touches.length?e.touches[0]:e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e;
  return {x:(t.clientX-rect.left)*(c.width/rect.width), y:(t.clientY-rect.top)*(c.height/rect.height)};
}
function pointInRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function onPointer(e){
  e.preventDefault();
  if(!started||gameOver){handleAction();return;}
  const p=getPos(e);
  for(let i=0;i<pens.length;i++){
    if(pointInRect(p,pens[i])){handleAction(i);return;}
  }
}
c.addEventListener('click',onPointer);
c.addEventListener('touchstart',onPointer,{passive:false});

function drawPen(p,i){
  ctx.fillStyle='#163a14';
  ctx.strokeStyle='#b8e986';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect?ctx.roundRect(p.x,p.y,p.w,p.h,10):ctx.rect(p.x,p.y,p.w,p.h);
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 14px Arial';
  ctx.fillText(I18N.t('pen_size_'+p.size,p.sizeName),p.x+p.w/2,p.y+28);
  ctx.font='20px Arial';
  ctx.fillText(p.dot,p.x+p.w/2,p.y+52);
  ctx.font='12px Arial';ctx.fillStyle='#cdeeb0';
  ctx.fillText(I18N.t('pen_energy_'+p.energy,p.energyName),p.x+p.w/2,p.y+70);
  ctx.font='bold 13px Arial';ctx.fillStyle='#fff';
  ctx.fillText(String(i+1),p.x+p.w/2,p.y+86);
}

function draw(){
  ctx.clearRect(0,0,800,450);
  const bg=ctx.createLinearGradient(0,0,0,450);
  bg.addColorStop(0,'#1c3a1b');bg.addColorStop(1,'#274b24');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,450);
  ctx.textAlign='center';

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('title_card','Doggy Daycare Play'),400,170);
    ctx.font='20px Arial';ctx.fillStyle='#cdeeb0';
    ctx.fillText(I18N.t('start_hint','Click, tap, or press any key to start'),400,210);
    requestAnimationFrame(draw);return;
  }
  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,170);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,210);
    ctx.fillText(I18N.t('restart_hint','Click, tap, or press any key to restart'),400,240);
    requestAnimationFrame(draw);return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(dog){ timeLeft-=dt; if(timeLeft<=0){timeLeft=0;timeExpire();} }
  if(feedbackTimer>0)feedbackTimer-=dt;

  // Dog card
  ctx.fillStyle='#0f2a0e';
  ctx.fillRect(280,30,240,180);
  ctx.strokeStyle='#3a5';ctx.strokeRect(280,30,240,180);
  ctx.font='64px Arial';ctx.fillText('🐕',400,110);
  const sizeName=SIZES.find(s=>s[0]===dog.size)[1];
  const en=ENERGIES.find(en=>en[0]===dog.energy);
  ctx.font='bold 18px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('dog_size_label','Size: {sz}').replace('{sz}',I18N.t('pen_size_'+dog.size,sizeName)),400,135);
  ctx.fillText(I18N.t('dog_energy_label','Energy: {en} {dot}').replace('{en}',I18N.t('pen_energy_'+dog.energy,en[1])).replace('{dot}',en[2]),400,158);

  const pct=Math.max(0,timeLeft/timeMax);
  ctx.fillStyle='#333';ctx.fillRect(280,220,240,14);
  ctx.fillStyle=pct>0.3?'#6fdc7a':'#ff6b6b';
  ctx.fillRect(280,220,240*pct,14);

  if(feedback&&feedbackTimer>0){
    ctx.font='bold 20px Arial';
    ctx.fillStyle=feedback.ok?'#6fdc7a':'#ff6b6b';
    ctx.fillText(feedback.msg,400,255);
  }

  pens.forEach((p,i)=>drawPen(p,i));

  updateScoreDisplay();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
