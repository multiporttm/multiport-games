ice":"0","priceCurrency":"USD"}}</script>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#14100a}
#c{background:#30261a;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd37a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Croissant Baking Cooling</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each croissant has a schedule clock below it. Click or tap it when the clock needle reaches the green <b>storage window</b> to box it up fresh. Wait too long and it goes stale! More racks cool at once each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
let hi=parseInt(localStorage.getItem('croissantbakingcooling_hi')||'0',10);
let score=0,round=0,trays=[],lost=0,gameOver=false,started=false,lastTime=null;
const MAX_LOST=3;

function slotPositions(n){
  const cols=Math.min(n,4);
  const rows=Math.ceil(n/4);
  const pts=[];
  const cw=W/cols, rh=280/rows;
  for(let i=0;i<n;i++){
    const col=i%cols, row=Math.floor(i/cols);
    pts.push({x:cw*col+cw/2, y:80+rh*row+rh/2});
  }
  return pts;
}

function spawnTrays(n){
  trays=[];
  const pts=slotPositions(n);
  const diff=round;
  for(let i=0;i<n;i++){
    const winLo=0.45+Math.random()*0.12;
    const winHi=Math.min(0.92,winLo+Math.max(0.1,0.22-diff*0.01));
    trays.push({
      clock:0,
      speed:0.0022+Math.random()*0.0009+diff*0.00012,
      winLo,winHi,
      x:pts[i].x,y:pts[i].y,
      state:'cooling', // cooling, done, stale
      flashT:0
    });
  }
}

function newRound(){
  round++;
  const n=Math.min(2+round,9);
  spawnTrays(n);
}

function reset(){
  score=0;round=0;lost=0;gameOver=false;started=false;lastTime=null;
  newRound();
}
reset();

function hiScore(){if(score>hi){hi=score;localStorage.setItem('croissantbakingcooling_hi',String(Math.floor(hi)));}}

function trayAt(px,py){
  for(const t of trays){
    if(t.state!=='cooling')continue;
    const dx=px-t.x,dy=py-t.y;
    if(dx*dx+dy*dy<(70*70))return t;
  }
  return null;
}

function checkRoundComplete(){
  if(trays.every(t=>t.state==='done'||t.state==='stale')){
    SFX.levelup();
    setTimeout(()=>{if(!gameOver)newRound();},500);
  }
}

function handlePick(px,py){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const t=trayAt(px,py);
  if(!t)return;
  if(t.clock>=t.winLo&&t.clock<=t.winHi){
    t.state='done';
    score+=10+Math.round(round*1.5);
    hiScore();
    SFX.success();
    checkRoundComplete();
  } else if(t.clock<t.winLo){
    t.flashT=20;
    SFX.error();
  }
}

function getXY(evt){
  const r=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-r.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-r.top;
  return {x:cx*(W/r.width), y:cy*(H/r.height)};
}
c.addEventListener('mousedown',e=>{const p=getXY(e);handlePick(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getXY(e);handlePick(p.x,p.y);},{passive:false});

let selIdx=0;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started){started=true;return;}
    if(gameOver){reset();return;}
    const cooling=trays.filter(t=>t.state==='cooling');
    if(cooling.length){
      selIdx=((selIdx%cooling.length)+cooling.length)%cooling.length;
      const t=cooling[selIdx];
      handlePick(t.x,t.y);
    }
  } else if(e.code==='ArrowRight'){
    selIdx++;
  } else if(e.code==='ArrowLeft'){
    selIdx--;
  }
});

function drawClock(t){
  const r=30;
  ctx.save();
  ctx.translate(0,60);
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle='#1c130a';ctx.fill();
  ctx.strokeStyle='#5a3a22';ctx.lineWidth=3;ctx.stroke();
  // storage window arc (green)
  ctx.beginPath();
  ctx.arc(0,0,r-4,-Math.PI/2+t.winLo*Math.PI*2,-Math.PI/2+t.winHi*Math.PI*2);
  ctx.strokeStyle='#5aaa30';ctx.lineWidth=6;ctx.stroke();
  // needle
  const ang=-Math.PI/2+t.clock*Math.PI*2;
  ctx.strokeStyle = (t.clock>=t.winLo&&t.clock<=t.winHi)?'#ffd54f':(t.clock>t.winHi?'#e94560':'#88bbee');
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*(r-6),Math.sin(ang)*(r-6));ctx.stroke();
  ctx.fillStyle='#ffd37a';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
  if(t.flashT>0){
    ctx.strokeStyle='#e94560';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.stroke();
    t.flashT--;
  }
  ctx.restore();
}

function drawTray(t){
  ctx.save();
  ctx.translate(t.x,t.y);
  // rack
  ctx.strokeStyle='#5a3a22';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-50,10);ctx.lineTo(50,10);ctx.stroke();
  for(let i=-40;i<=40;i+=16){
    ctx.beginPath();ctx.moveTo(i,10);ctx.lineTo(i,18);ctx.stroke();
  }

  if(t.state==='stale'){
    ctx.save();
    ctx.translate(0,-10);
    ctx.scale(1.4,1.1);
    ctx.fillStyle='#6b5a3a';
    ctx.beginPath();
    ctx.arc(0,0,30,Math.PI*0.15,Math.PI*1.55);
    ctx.arc(7,3,24,Math.PI*1.55,Math.PI*0.15,true);
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle='#aaa';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText(I18N.t('cooling_stale','STALE'),0,22);
    ctx.restore();return;
  }

  ctx.save();
  ctx.translate(0,-10);
  ctx.scale(1.4,1.1);
  let color='#c8863a';
  if(t.state==='done')color='#e0a95c';
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(0,0,30,Math.PI*0.15,Math.PI*1.55);
  ctx.arc(7,3,24,Math.PI*1.55,Math.PI*0.15,true);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,70,20,0.4)';ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.moveTo(-14+i*10,-6);ctx.lineTo(-7+i*10,12);ctx.stroke();
  }
  ctx.restore();

  if(t.state==='cooling'){
    drawClock(t);
  } else if(t.state==='done'){
    ctx.fillStyle='#5aaa30';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(I18N.t('cooling_boxed','BOXED!'),0,80);
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a2014');bg.addColorStop(1,'#16100a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#ffd37a';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('cooling_title','❄️ Cooling Racks'),W/2,30);

  document.getElementById('score-display').textContent=I18N.t('round_score_hi','Round: {r} | Score: {s} | Hi: {h}')
    .replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));

  if(!started){
    ctx.fillStyle='#ffd37acc';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('start_hint_cool','Tap / Click / Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    trays.forEach(drawTray);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-10);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+28);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  trays.forEach(t=>{
    if(t.state==='cooling'){
      t.clock+=t.speed*dt*16.6667;
      if(t.clock>1){
        t.clock=1;
        t.state='stale';
        lost++;
        SFX.fail();
        if(lost>=MAX_LOST){gameOver=true;SFX.lose();}
        checkRoundComplete();
      }
    }
  });

  trays.forEach(drawTray);

  ctx.fillStyle='#e94560';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('cooling_lost_label','Stale: {n}/{m}').replace('{n}',lost).replace('{m}',MAX_LOST),16,H-14);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
