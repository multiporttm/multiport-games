<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>

<style>
body{background:#08080f}
#c{background:#2a1a33;display:block;border-radius:8px;touch-action:none}
#score-display{color:#f49ac2;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Floral Corsage Pinning</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap the marked pin points to place each flower or ribbon piece exactly on target. Press <b>Tab</b> to select the next target and <b>Enter/Space</b> to pin it with the keyboard. Don't miss the mark or prick through the wrong side!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=460;
const HI_KEY='floralcorsagepinning_hi';
let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let lives=3,level=1,gameOver=false,won=false,started=false;
let targets=[],selected=0,msgTimer=0,msgText='';
let base={};

function rand(a,b){return a+Math.random()*(b-a);}

function designForLevel(lv){
  // base is a wristlet (ellipse) or lapel bar (rounded rect), alternating, growing count & tightening tolerance
  const isLapel = lv%2===0;
  base = isLapel
    ? {type:'lapel',x:W/2,y:H/2+10,w:260,h:90}
    : {type:'wrist',x:W/2,y:H/2+10,rx:150,ry:90};
  const count = Math.min(4+lv,11);
  const tol = Math.max(10, 24 - lv*1.3);
  const pts=[];
  for(let i=0;i<count;i++){
    let px,py;
    if(base.type==='lapel'){
      px=base.x-base.w/2+30+(base.w-60)*(i/(count-1||1));
      py=base.y+rand(-base.h/2+16,base.h/2-16);
    } else {
      const ang=(i/count)*Math.PI*2+rand(-0.15,0.15);
      px=base.x+Math.cos(ang)*base.rx*rand(0.45,0.85);
      py=base.y+Math.sin(ang)*base.ry*rand(0.45,0.85);
    }
    const kind = i%3===0?'bloom':(i%3===1?'filler':'ribbon');
    const color = kind==='bloom'?['#ff6fa5','#ffd166','#ef476f'][i%3]:(kind==='filler'?'#bde0a3':'#e8c3f0');
    pts.push({x:px,y:py,r:tol,kind,color,done:false,wrong:false});
  }
  targets=pts;
  selected=0;
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;msgTimer=0;msgText='';
  designForLevel(level);
}
reset();

function flashMsg(t){msgText=t;msgTimer=70;}

function allDone(){return targets.every(t=>t.done);}

function pinAt(mx,my){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  // find nearest undone target within generous click radius, but must be within tolerance to succeed
  let best=null,bestDist=Infinity;
  for(const t of targets){
    if(t.done)continue;
    const d=Math.hypot(mx-t.x,my-t.y);
    if(d<bestDist){bestDist=d;best=t;}
  }
  if(!best)return;
  if(bestDist<=best.r){
    best.done=true;
    score+=10+level;
    SFX.success();
    flashMsg(I18N.t('pin_good','Perfect pin!'));
    if(allDone()){
      level++;
      SFX.levelup();
      if(level>8){
        won=true;gameOver=true;
        if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
        SFX.win();
      } else {
        flashMsg(I18N.t('level_up','Corsage complete! Next design...'));
        designForLevel(level);
      }
    }
  } else {
    lives--;
    SFX.hurt();
    flashMsg(I18N.t('pin_miss','Oops — pricked through! Missed the mark.'));
    if(lives<=0){
      gameOver=true;won=false;
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      SFX.lose();
    }
  }
}

function keyPinSelected(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const undone=targets.filter(t=>!t.done);
  if(undone.length===0)return;
  const t=undone[selected%undone.length];
  pinAt(t.x,t.y);
}

function moveSelect(d){
  const undone=targets.filter(t=>!t.done);
  if(undone.length===0)return;
  selected=(selected+d+undone.length)%undone.length;
  SFX.tick();
}

c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width);
  const my=(e.clientY-r.top)*(H/r.height);
  pinAt(mx,my);
});

document.addEventListener('keydown',e=>{
  if(e.code==='Tab'){e.preventDefault();moveSelect(1);}
  else if(e.code==='ArrowRight'||e.code==='ArrowDown'){e.preventDefault();moveSelect(1);}
  else if(e.code==='ArrowLeft'||e.code==='ArrowUp'){e.preventDefault();moveSelect(-1);}
  else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();keyPinSelected();}
});

function drawBase(){
  ctx.save();
  if(base.type==='lapel'){
    ctx.fillStyle='#4a3b2a';
    const x=base.x-base.w/2,y=base.y-base.h/2;
    roundRect(x,y,base.w,base.h,18);
    ctx.fill();
    ctx.strokeStyle='#2e241a';ctx.lineWidth=3;ctx.stroke();
  } else {
    ctx.fillStyle='#4a3b2a';
    ctx.beginPath();
    ctx.ellipse(base.x,base.y,base.rx,base.ry,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#2e241a';ctx.lineWidth=3;ctx.stroke();
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawTarget(t,isSel){
  ctx.save();
  if(!t.done){
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
    ctx.strokeStyle=isSel?'#ffffff':'#ffffff88';
    ctx.lineWidth=isSel?3:1.5;
    ctx.setLineDash(isSel?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(t.x,t.y,3,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
  } else {
    if(t.kind==='ribbon'){
      ctx.fillStyle=t.color;
      ctx.save();ctx.translate(t.x,t.y);ctx.rotate(0.3);
      ctx.fillRect(-10,-4,20,8);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(t.x,t.y,t.kind==='bloom'?11:7,0,Math.PI*2);
      ctx.fillStyle=t.color;
      ctx.fill();
      ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;ctx.stroke();
    }
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1c1024');bg.addColorStop(1,'#2a1a33');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawBase();
  const undone=targets.filter(t=>!t.done);
  const selTarget=undone[selected%(undone.length||1)];
  targets.forEach(t=>drawTarget(t,t===selTarget));

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Design {n}').replace('{n}',level),16,30);
  ctx.textAlign='right';
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?'#ff6fa5':'#55384a';
    ctx.beginPath();ctx.arc(W-20-i*26,24,9,0,Math.PI*2);ctx.fill();
  }

  if(msgTimer>0){
    msgTimer--;
    ctx.textAlign='center';ctx.font='bold 20px Arial';
    ctx.fillStyle='#ffe3f0';
    ctx.fillText(msgText,W/2,H-20);
  }

  if(!started){
    ctx.fillStyle='#f49ac2';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click a marked point or press Enter to start'),W/2,H/2-120);
  }

  if(gameOver){
    ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('win_title','CORSAGE MASTER!'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Click or press Enter to try again'),W/2,H/2+20);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
