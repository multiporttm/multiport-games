<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#031a2e}
#c{background:#0a4d68;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:18px;color:#a8f0ff;font-size:1.05rem;font-weight:700;padding:8px;flex-wrap:wrap}
#hud span b{color:#ffe082}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Mermaid Lagoon</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="scoreEl">0</b></span><span>Distance: <b id="distEl">0</b>m</span><span>Lives: <b id="livesEl">🧜‍♀️🧜‍♀️🧜‍♀️</b></span><span>Best: <b id="bestEl">0</b></span></div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b>, or <b>drag</b> on touch, to swim. Collect pearls and shells for points, ride the sparkling currents for a speed boost, and avoid jellyfish, sharp coral, and fishing nets. You have 3 lives — how far can you swim?</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const BEST_KEY='mermaidlagoon_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);
document.getElementById('bestEl').textContent=best;

const mermaid={x:150,y:200,w:50,h:36,vy:0,vx:0,invuln:0};
let keys={up:false,down:false,left:false,right:false};
let dragging=false,dragTarget=null;

let items=[],hazards=[],bubbles=[];
let score=0,distance=0,lives=3,gameOver=false,started=false;
let baseSpeed=3,boostTimer=0,frame=0;
let spawnTimer=0,hazardTimer=0,currentTimer=0;
let lastTime=null;

function reset(){
  mermaid.x=150;mermaid.y=200;mermaid.vy=0;mermaid.vx=0;mermaid.invuln=90;
  items=[];hazards=[];bubbles=[];
  score=0;distance=0;lives=3;gameOver=false;started=false;
  baseSpeed=3;boostTimer=0;frame=0;
  spawnTimer=0;hazardTimer=0;currentTimer=0;lastTime=null;
}
reset();

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(!started)started=true;
  if(gameOver&&e.code==='Space')reset();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};
}
c.addEventListener('mousedown',e=>{ if(!started)started=true; if(gameOver){reset();return;} dragging=true;dragTarget=pointerPos(e); });
c.addEventListener('mousemove',e=>{ if(dragging)dragTarget=pointerPos(e); });
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{ e.preventDefault(); if(!started)started=true; if(gameOver){reset();return;} dragging=true;dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(dragging)dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchend',e=>{ e.preventDefault(); dragging=false; },{passive:false});

function spawnItem(){
  const type=Math.random()<0.7?'pearl':'shell';
  const y=40+Math.random()*(H-80);
  items.push({x:W+30,y,r:type==='pearl'?9:12,type,bob:Math.random()*Math.PI*2});
}
function spawnHazard(){
  const roll=Math.random();
  const y=40+Math.random()*(H-80);
  if(roll<0.4)hazards.push({x:W+30,y,type:'jelly',w:34,h:38,bob:Math.random()*Math.PI*2});
  else if(roll<0.75)hazards.push({x:W+30,y,type:'coral',w:36,h:44});
  else hazards.push({x:W+30,y,type:'net',w:70,h:80});
}
function spawnBubble(){
  bubbles.push({x:Math.random()*W,y:H+10,r:2+Math.random()*4,speed:0.5+Math.random()*1});
}

function circleRectHit(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function drawMermaid(){
  ctx.save();
  ctx.translate(mermaid.x,mermaid.y);
  if(mermaid.invuln>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=0.4;
  // tail
  const flick=Math.sin(frame*0.25)*10;
  ctx.fillStyle='#2fbf9f';
  ctx.beginPath();
  ctx.moveTo(-10,0);
  ctx.quadraticCurveTo(-30,flick-8,-40,flick-14);
  ctx.quadraticCurveTo(-30,0,-40,flick+14);
  ctx.quadraticCurveTo(-30,flick+8,-10,0);
  ctx.fill();
  // body
  ctx.fillStyle='#ffd9b3';
  ctx.beginPath();ctx.ellipse(5,0,16,10,0,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle='#ff6f61';
  ctx.beginPath();ctx.ellipse(14,-4,10,8,0,0,Math.PI*2);ctx.fill();
  // face highlight
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(18,-2,1.6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawItem(it){
  ctx.save();
  const yy=it.y+Math.sin(frame*0.08+it.bob)*4;
  if(it.type==='pearl'){
    const g=ctx.createRadialGradient(it.x-3,yy-3,1,it.x,yy,it.r);
    g.addColorStop(0,'#ffffff');g.addColorStop(1,'#c9b8ff');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(it.x,yy,it.r,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#ffb6d9';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      const rr=i%2===0?it.r:it.r*0.6;
      ctx.lineTo(it.x+Math.cos(a)*rr,yy+Math.sin(a)*rr);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff8fc1';ctx.beginPath();ctx.arc(it.x,yy,it.r*0.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawHazard(h){
  const yy=h.type==='jelly'?h.y+Math.sin(frame*0.06+h.bob)*10:h.y;
  if(h.type==='jelly'){
    ctx.fillStyle='rgba(255,120,220,0.75)';
    ctx.beginPath();ctx.arc(h.x,yy,h.w/2,Math.PI,0);ctx.fill();
    ctx.fillRect(h.x-h.w/2,yy,h.w,h.h*0.3);
    ctx.strokeStyle='rgba(255,120,220,0.6)';ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(h.x+i*10,yy+h.h*0.3);
      ctx.quadraticCurveTo(h.x+i*10+Math.sin(frame*0.1+i)*6,yy+h.h*0.6,h.x+i*10,yy+h.h);
      ctx.stroke();
    }
  }else if(h.type==='coral'){
    ctx.fillStyle='#ff5252';
    ctx.beginPath();
    ctx.moveTo(h.x-h.w/2,yy+h.h);
    ctx.lineTo(h.x-h.w/4,yy);
    ctx.lineTo(h.x,yy+h.h*0.5);
    ctx.lineTo(h.x+h.w/4,yy-h.h*0.1);
    ctx.lineTo(h.x+h.w/2,yy+h.h);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#c22';ctx.lineWidth=1.5;ctx.stroke();
  }else{
    ctx.strokeStyle='rgba(200,200,200,0.85)';ctx.lineWidth=2;
    const cols=4,rows=4;
    for(let i=0;i<=cols;i++){
      ctx.beginPath();ctx.moveTo(h.x-h.w/2+i*(h.w/cols),yy-h.h/2);ctx.lineTo(h.x-h.w/2+i*(h.w/cols),yy+h.h/2);ctx.stroke();
    }
    for(let j=0;j<=rows;j++){
      ctx.beginPath();ctx.moveTo(h.x-h.w/2,yy-h.h/2+j*(h.h/rows));ctx.lineTo(h.x+h.w/2,yy-h.h/2+j*(h.h/rows));ctx.stroke();
    }
  }
}

function hazardBox(h){
  const yy=h.type==='jelly'?h.y+Math.sin(frame*0.06+h.bob)*10-h.h*0.15:h.y-h.h/2;
  return {x:h.x-h.w/2,y:h.type==='jelly'?h.y-h.w/2+Math.sin(frame*0.06+h.bob)*10:yy,w:h.w,h:h.h};
}

function loseLife(){
  if(mermaid.invuln>0)return;
  lives--;
  mermaid.invuln=90;
  SFX.hurt();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>best){best=score;localStorage.setItem(BEST_KEY,String(best));}
  }
}

function updateHud(){
  document.getElementById('scoreEl').textContent=Math.floor(score);
  document.getElementById('distEl').textContent=Math.floor(distance);
  document.getElementById('livesEl').textContent='🧜‍♀️'.repeat(Math.max(0,lives));
  document.getElementById('bestEl').textContent=best;
}

function loop(now){
  if(lastTime===null)lastTime=now;
  const dt=Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1e6fa8');sky.addColorStop(1,'#032b40');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#d9a441';ctx.fillRect(0,H-14,W,14);

  bubbles.forEach(b=>{ b.y-=b.speed*dt; ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke(); });
  bubbles=bubbles.filter(b=>b.y>-10);

  if(!started){
    drawMermaid();
    ctx.fillStyle='#a8f0ffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_mermaid','Move / drag to start swimming'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawMermaid();
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-16);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint_mermaid','Tap / click / Space to swim again'),W/2,H/2+18);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(Math.random()<0.05)spawnBubble();

  // movement
  const accel=0.9,maxSp=6,drag=0.85;
  if(dragging&&dragTarget){
    const dx=dragTarget.x-mermaid.x,dy=dragTarget.y-mermaid.y;
    mermaid.vx+=Math.max(-accel,Math.min(accel,dx*0.08))*dt;
    mermaid.vy+=Math.max(-accel,Math.min(accel,dy*0.08))*dt;
  }else{
    if(keys.up)mermaid.vy-=accel*dt;
    if(keys.down)mermaid.vy+=accel*dt;
    if(keys.left)mermaid.vx-=accel*dt;
    if(keys.right)mermaid.vx+=accel*dt;
  }
  mermaid.vx*=Math.pow(drag,dt);mermaid.vy*=Math.pow(drag,dt);
  mermaid.vx=Math.max(-maxSp,Math.min(maxSp,mermaid.vx));
  mermaid.vy=Math.max(-maxSp,Math.min(maxSp,mermaid.vy));
  mermaid.x+=mermaid.vx*dt;mermaid.y+=mermaid.vy*dt;
  mermaid.x=Math.max(30,Math.min(W-100,mermaid.x));
  mermaid.y=Math.max(25,Math.min(H-30,mermaid.y));
  if(mermaid.invuln>0)mermaid.invuln-=dt;

  const speed=baseSpeed+(boostTimer>0?4:0)+distance/800;
  if(boostTimer>0)boostTimer-=dt;
  distance+=speed*dt*0.08;

  // spawns
  spawnTimer+=dt;
  const spawnInterval=Math.max(28,55-distance/20);
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnItem();}
  hazardTimer+=dt;
  const hazardInterval=Math.max(40,80-distance/15);
  if(hazardTimer>=hazardInterval){hazardTimer-=hazardInterval;spawnHazard();}
  currentTimer+=dt;
  if(currentTimer>=260){currentTimer=0;boostTimer=90;SFX.powerup();}

  // items
  items=items.filter(it=>it.x>-30);
  items.forEach(it=>{
    it.x-=speed*dt;
    drawItem(it);
    const dx=mermaid.x+5-it.x,dy=mermaid.y-it.y;
    if(dx*dx+dy*dy<(it.r+16)*(it.r+16)){
      it.x=-999;
      score+=it.type==='pearl'?10:25;
      SFX.coin();
    }
  });

  // hazards
  hazards=hazards.filter(h=>h.x>-80);
  hazards.forEach(h=>{
    h.x-=speed*dt;
    drawHazard(h);
    const box=hazardBox(h);
    if(circleRectHit(mermaid.x+5,mermaid.y,15,box.x,box.y,box.w,box.h)){
      loseLife();
    }
  });

  if(boostTimer>0){
    ctx.fillStyle='rgba(255,255,255,0.15)';
    for(let i=0;i<3;i++)ctx.fillRect(0,H/2-60+i*40,W,6);
  }

  drawMermaid();
  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
