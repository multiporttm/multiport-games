<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4e342e}
#ui{color:#ffe0b2;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px;flex-wrap:wrap}
#btns button{padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Karate Dojo</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Belt: White | Points: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="blockHighBtn">🙆 Block High</button>
      <button id="blockLowBtn">🙇 Block Low</button>
      <button id="strikeBtn">👊 Strike</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch for the strike warning (⬆️ high or ⬇️ low) and block the matching side in time. When your sensei shows "OPEN!", Strike immediately for points. 5 mistakes and the lesson ends!</div>
</div>
<script>
const W=360,H=360;
const BELT_KEYS=['belt_white','belt_yellow','belt_orange','belt_green','belt_blue','belt_brown','belt_black'];
const BELTS=['White','Yellow','Orange','Green','Blue','Brown','Black'];
let points,mistakes,state,windup,windupSide,openT,msg='';

function loadBest(){return +(localStorage.getItem('karatedojo_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('karatedojo_best',v);}

function beltFor(p){const i=Math.min(BELTS.length-1,Math.floor(p/40));return I18N.t(BELT_KEYS[i],BELTS[i]);}

function init(){
  points=0;mistakes=0;state='play';
  windup=0;windupSide=null;openT=0;
}

function tryBlock(side){
  if(state==='over'){init();return;}
  if(windup<=15&&windup>0){
    if(windupSide===side){
      msg=I18N.t('msg_blocked','Blocked!');
      SFX.success();
    }else{
      mistakes++;
      msg=I18N.t('msg_wrong_block','Wrong block!');
      SFX.error();
      checkOver();
    }
    windup=0;windupSide=null;
  }
}

function tryStrike(){
  if(state==='over'){init();return;}
  if(openT>0){
    points+=10;
    msg=I18N.t('msg_counter_landed','Counter landed!');
    SFX.hit();
    saveBest(points);
    openT=0;
  }else{
    mistakes++;
    msg=I18N.t('msg_no_opening','No opening!');
    SFX.error();
    checkOver();
  }
}

function checkOver(){
  if(mistakes>=5){
    state='over';
    SFX.lose();
    saveBest(points);
  }
}

document.getElementById('blockHighBtn').addEventListener('click',()=>tryBlock('high'));
document.getElementById('blockLowBtn').addEventListener('click',()=>tryBlock('low'));
document.getElementById('strikeBtn').addEventListener('click',tryStrike);

function update(){
  if(state!=='play')return;
  if(windup>0){
    windup--;
    if(windup===0){
      if(windupSide){
        mistakes++;
        msg=I18N.t('msg_took_hit','Took a hit!');
        SFX.hurt();
        checkOver();
      }
      windupSide=null;
    }
  }else if(Math.random()<0.014){
    windup=45;windupSide=Math.random()<0.5?'high':'low';
  }

  if(openT>0)openT--;
  else if(windup===0&&Math.random()<0.01){openT=30;}

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#4e342e';ctx.fillRect(0,0,W,H);

  ctx.font='60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🥋',W/2,140);

  if(windup>0){
    ctx.fillStyle='#ffca28';ctx.font='bold 24px Arial';
    ctx.fillText(windupSide==='high'?I18N.t('warn_high','⬆️ HIGH!'):I18N.t('warn_low','⬇️ LOW!'),W/2,80);
  }
  if(openT>0){
    ctx.fillStyle='#66bb6a';ctx.font='bold 22px Arial';
    ctx.fillText(I18N.t('open_label','OPEN!'),W/2,200);
  }

  ctx.fillStyle='#ffe0b2';ctx.font='14px Arial';
  ctx.fillText(msg,W/2,250);
  ctx.font='13px Arial';
  ctx.fillText(I18N.t('mistakes_label','Mistakes: {n}/5').replace('{n}',mistakes),W/2,275);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe0b2';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('lesson_over_title','LESSON OVER'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('points_best','Points: {n} | Best: {b}').replace('{n}',points).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap Strike to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('belt_points','Belt: {belt} | Points: {n}').replace('{belt}',beltFor(points)).replace('{n}',points);
}

init();draw();
</script></body></html>
