<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:radial-gradient(ellipse at 50% 30%,#0b1a33 0%,#05070f 80%);display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#hud{color:#bfe3ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.lives{letter-spacing:2px;color:#ff6b6b}
#meterWrap{max-width:600px;margin:0 auto 8px;background:#0e1a28;border-radius:10px;padding:4px}
#meterBar{height:14px;border-radius:8px;background:linear-gradient(90deg,#2e7d32,#7ed957);width:0%;transition:width .08s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Satellite Antenna Alignment</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud">
      <span id="roundLbl">Round 1</span>
      <span id="scoreLbl">Score: 0</span>
      <span id="hiLbl">Hi: 0</span>
      <span class="lives" id="livesLbl">●●●</span>
    </div>
    <div id="meterWrap"><div id="meterBar"></div></div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b> or <b>drag</b> to steer the dish crosshair onto the glowing target. Hold the lock steady while the signal meter fills to complete the pass. Miss three passes and the mission ends.</div>
</div>
<script>
(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=800,H=440;
const ID='satelliteantennaalignment';
const hiKey=ID+'_hi';

let az=400,el=220; // antenna pointing position in canvas coords
let target={x:400,y:220,r:40,vx:0,vy:0};
let lock=0; // 0..1 signal meter
let lives=3,score=0,round=1,hi=0,gameOver=false,started=false,win=false;
let keys={};
let dragging=false;
let lastTime=null;
let passTimer=0,passLimit=16000; // ms allowed per pass before it's considered missed
let flashT=0;

try{hi=parseFloat(localStorage.getItem(hiKey))||0;}catch(e){hi=0;}

function speedForRound(r){ return 0.4+r*0.18; }
function radiusForRound(r){ return Math.max(14,40-r*2.2); }
function tolForRound(r){ return Math.max(16,46-r*2.4); }

function newTarget(){
  const r=radiusForRound(round);
  const margin=r+30;
  target.x=margin+Math.random()*(W-margin*2);
  target.y=margin+30+Math.random()*(H-margin*2-40);
  const s=speedForRound(round);
  const ang=Math.random()*Math.PI*2;
  target.vx=Math.cos(ang)*s;
  target.vy=Math.sin(ang)*s;
  target.r=r;
  lock=0;
  passTimer=0;
}

function reset(){
  lives=3;score=0;round=1;gameOver=false;win=false;started=false;lastTime=null;
  az=W/2;el=H/2;
  newTarget();
}

function bumpTarget(){
  target.x+=target.vx;target.y+=target.vy;
  const r=target.r;
  if(target.x<r+20||target.x>W-r-20)target.vx*=-1;
  if(target.y<r+50||target.y>H-r-20)target.vy*=-1;
  target.x=Math.max(r+20,Math.min(W-r-20,target.x));
  target.y=Math.max(r+50,Math.min(H-r-20,target.y));
}

function passComplete(){
  score+=100*round;
  if(score>hi){hi=score;try{localStorage.setItem(hiKey,String(hi));}catch(e){}}
  SFX.success();
  round++;
  flashT=20;
  if(round>10){win=true;gameOver=true;SFX.win();}
  else newTarget();
}

function missPass(){
  lives--;
  SFX.hit();
  if(lives<=0){gameOver=true;win=false;SFX.lose();}
  else newTarget();
}

function update(dt){
  if(!started||gameOver)return;
  const moveSpd=5.5*dt;
  if(keys['ArrowLeft']||keys['a'])az-=moveSpd;
  if(keys['ArrowRight']||keys['d'])az+=moveSpd;
  if(keys['ArrowUp']||keys['w'])el-=moveSpd;
  if(keys['ArrowDown']||keys['s'])el+=moveSpd;
  az=Math.max(10,Math.min(W-10,az));
  el=Math.max(40,Math.min(H-10,el));

  bumpTarget();

  const dx=az-target.x,dy=el-target.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const tol=tolForRound(round);
  if(dist<=tol){
    lock+=dt*0.028;
    if(lock>=1){lock=1;passComplete();}
  } else {
    lock-=dt*0.02;
    if(lock<0)lock=0;
  }

  passTimer+=dt*16.6667;
  if(passTimer>=passLimit)missPass();

  if(flashT>0)flashT-=dt;
}

function drawDish(){
  ctx.save();
  ctx.strokeStyle='#4fc3f7';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(az-18,el);ctx.lineTo(az+18,el);ctx.stroke();
  ctx.beginPath();ctx.moveTo(az,el-18);ctx.lineTo(az,el+18);ctx.stroke();
  ctx.beginPath();ctx.arc(az,el,10,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.arc(az,el,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawTarget(){
  ctx.save();
  const pulse=0.7+0.3*Math.sin(performance.now()/180);
  const grad=ctx.createRadialGradient(target.x,target.y,0,target.x,target.y,target.r*1.6);
  grad.addColorStop(0,`rgba(255,209,102,${0.55*pulse})`);
  grad.addColorStop(1,'rgba(255,209,102,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(target.x,target.y,target.r*1.6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffd166';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(target.x,target.y,target.r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(target.x,target.y,tolForRound(round),0,Math.PI*2);
  ctx.strokeStyle='rgba(255,209,102,.35)';
  ctx.stroke();
  ctx.restore();
}

function drawStars(){
  ctx.fillStyle='#ffffff';
  for(let i=0;i<60;i++){
    const x=(i*131)%W, y=(i*97+((i*53)%40))%H;
    ctx.globalAlpha=0.15+((i*17)%10)/40;
    ctx.fillRect(x,y,1.5,1.5);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  document.getElementById('roundLbl').textContent=I18N.t('round_label','Round {r}').replace('{r}',round);
  document.getElementById('scoreLbl').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('hiLbl').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
  document.getElementById('livesLbl').textContent='●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives));
  document.getElementById('meterBar').style.width=(lock*100)+'%';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawStars();

  if(!started){
    ctx.fillStyle='#bfe3ff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press any arrow key or drag to begin'),W/2,H/2);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('antenna_intro','Point the antenna at the target ground station'),W/2,H/2+32);
    drawDish();
    return;
  }

  drawTarget();
  drawDish();

  if(flashT>0){
    ctx.fillStyle=`rgba(126,217,87,${flashT/20*0.3})`;
    ctx.fillRect(0,0,W,H);
  }

  if(gameOver){
    ctx.fillStyle='rgba(5,7,15,.75)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=win?'#7ed957':'#ff6b6b';
    ctx.font='bold 38px Arial';
    ctx.fillText(win?I18N.t('mission_complete','SIGNAL LOCK COMPLETE'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.fillStyle='#bfe3ff';ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: {s}').replace('{s}',score),W/2,H/2+20);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Press any key or tap to restart'),W/2,H/2+52);
  }

  drawHUD();
}

function loop(now){
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startIfNeeded(){
  if(gameOver){reset();return;}
  if(!started){started=true;}
}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code.replace('Key','').replace('Arrow','Arrow'))){}
  const k=e.key;
  keys[e.code.replace('Arrow','Arrow')]=true;
  keys[k]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)||e.code==='Space')e.preventDefault();
  startIfNeeded();
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  keys[e.key]=false;
});

function pointerPos(e){
  const rect=canvas.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*(W/rect.width),y:(clientY-rect.top)*(H/rect.height)};
}

canvas.addEventListener('pointerdown',e=>{
  dragging=true;
  startIfNeeded();
  const p=pointerPos(e);
  az=p.x;el=p.y;
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=pointerPos(e);
  az=Math.max(10,Math.min(W-10,p.x));
  el=Math.max(40,Math.min(H-10,p.y));
});
window.addEventListener('pointerup',()=>{dragging=false;});

reset();
requestAnimationFrame(loop);
})();
</script></body></html>
