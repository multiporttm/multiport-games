<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1f3d;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff8fab;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ride Safety Harness Check</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the pointer sweep the gauge. If it's got a <b>green</b> zone, press <b>Space</b> or tap <b>LOCK</b> while the pointer is inside it. If the gauge is <b>all red</b> with no safe zone, press <b>X</b> or tap <b>FLAG</b> instead — never lock a bad harness!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display');
const HS_KEY='ridesafetyharnesscheck_highscore';
let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let lives=3,level=1,streak=0;
let started=false,gameOver=false;
let rider=null,resultFlash=null,flashTimer=0;

function newRider(){
  const bad=Math.random()<0.4;
  const speed=1.1+level*0.14;
  let zoneStart=0,zoneW=0;
  if(!bad){
    zoneW=Math.max(0.1,0.3-level*0.012);
    zoneStart=0.1+Math.random()*(0.8-zoneW);
  }
  rider={bad,speed,zoneStart,zoneW,pos:0,dir:1,timeLeft:Math.max(3.2,6.5-level*0.25),timeMax:Math.max(3.2,6.5-level*0.25)};
}

function reset(){score=0;lives=3;level=1;streak=0;started=false;gameOver=false;rider=null;resultFlash=null;flashTimer=0;}

function startGame(){
  if(gameOver){reset();return;}
  if(!started){started=true;newRider();}
}

function act(action){ // action: 'lock' or 'flag'
  if(!started||gameOver||!rider)return;
  let correct;
  if(rider.bad){
    correct=(action==='flag');
  } else {
    correct=(action==='lock'&&rider.pos>=rider.zoneStart&&rider.pos<=rider.zoneStart+rider.zoneW);
  }
  if(correct){
    score+=12+level*2;streak++;SFX.success();resultFlash='good';
    if(streak>0&&streak%8===0){level++;SFX.levelup();}
  } else {
    lives--;streak=0;
    if(rider.bad&&action==='lock')SFX.hurt();else SFX.fail();
    resultFlash='bad';
  }
  flashTimer=0.5;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  if(lives<=0){gameOver=true;rider=null;SFX.lose();}
  else newRider();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!started||gameOver)startGame();else act('lock');}
  else if(e.code==='KeyX'){e.preventDefault();if(!started||gameOver)startGame();else act('flag');}
  else if(e.code==='Enter'){e.preventDefault();startGame();}
});

function pointerAction(x){
  if(!started||gameOver){startGame();return;}
  if(x<400)act('lock');else act('flag');
}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();pointerAction((e.clientX-r.left)*(800/r.width));});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();const t=e.touches[0];pointerAction((t.clientX-r.left)*(800/r.width));},{passive:false});

function drawGauge(){
  const gx=150,gy=130,gw=500,gh=40;
  ctx.fillStyle='#c0392b';ctx.fillRect(gx,gy,gw,gh);
  if(!rider.bad){
    ctx.fillStyle='#27ae60';
    ctx.fillRect(gx+rider.zoneStart*gw,gy,rider.zoneW*gw,gh);
  }
  ctx.strokeStyle='#eee';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
  const px=gx+rider.pos*gw;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(px,gy-14);ctx.lineTo(px-10,gy-2);ctx.lineTo(px+10,gy-2);ctx.fill();
  ctx.fillRect(px-3,gy-2,6,gh+4);

  ctx.textAlign='center';ctx.font='bold 18px Arial';ctx.fillStyle='#fff';
  ctx.fillText(rider.bad?I18N.t("harness_bad","HARNESS WON'T LATCH — FLAG IT"):I18N.t('harness_ok','LOCK WHEN POINTER IS IN THE GREEN'),400,96);

  const barW=300,barH=10,bx=400-barW/2,by=190;
  ctx.fillStyle='#222';ctx.fillRect(bx,by,barW,barH);
  const pct=Math.max(0,rider.timeLeft/rider.timeMax);
  ctx.fillStyle=pct>0.4?'#5aaa30':pct>0.18?'#e67e22':'#c0392b';
  ctx.fillRect(bx,by,barW*pct,barH);
  ctx.strokeStyle='#555';ctx.strokeRect(bx,by,barW,barH);
}

function drawHud(){
  ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#ff8fab';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}','❤'.repeat(Math.max(0,lives))),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),780,30);

  ctx.textAlign='left';
  ctx.fillStyle='#27ae60';ctx.fillRect(70,230,140,40);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 16px Arial';
  ctx.fillText(I18N.t('lock_btn','LOCK (Space)'),140,254);

  ctx.fillStyle='#c0392b';ctx.fillRect(590,230,140,40);
  ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('flag_btn','FLAG (X)'),660,254);

  ctx.font='14px Arial';ctx.fillStyle='#bba3d8';
  ctx.fillText(I18N.t('tap_hint','Tap left half = Lock, right half = Flag'),400,290);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  ctx.clearRect(0,0,800,320);
  const sky=ctx.createLinearGradient(0,0,0,320);
  sky.addColorStop(0,'#1a1030');sky.addColorStop(1,'#2a1f3d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,320);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('rs_title','RIDE SAFETY HARNESS CHECK'),400,130);
    ctx.font='18px Arial';ctx.fillStyle='#ff8fab';
    ctx.fillText(I18N.t('start_hint2','Press Space, X, or Tap to begin'),400,170);
  } else if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,158);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,186);
  } else {
    if(rider){
      rider.pos+=rider.dir*rider.speed*dt*0.6;
      if(rider.pos>1){rider.pos=1;rider.dir=-1;}
      if(rider.pos<0){rider.pos=0;rider.dir=1;}
      rider.timeLeft-=dt;
      if(rider.timeLeft<=0){
        rider.timeLeft=0;
        act(rider.bad?'lock':'flag'); // forced wrong call on timeout
      }
    }
    drawGauge();
    drawHud();
    if(flashTimer>0){
      flashTimer-=dt;
      ctx.fillStyle=resultFlash==='good'?'rgba(39,174,96,0.22)':'rgba(192,57,43,0.28)';
      ctx.fillRect(0,0,800,320);
    }
  }
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
