<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#3e1f0d;cursor:pointer}
#ui{color:#ffb74d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pumpkin Carving</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Carved: 0 | Time: 20s</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Numbered dots are scattered on the pumpkin — tap them in order from 1 upward to carve the pattern before time runs out. Finish one and a fresh pattern appears with more dots!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=200,R=110;
let dots,nextNum,carved,timeLeft,state;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('pumpkincarving_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('pumpkincarving_best',v);}

function init(){carved=0;timeLeft=20;state='play';newPattern();}
function newPattern(){
  const n=4+Math.min(4,Math.floor(carved/2));
  dots=[];
  for(let i=0;i<n;i++){
    const ang=rand(0,Math.PI*2),r=rand(20,R-10);
    dots.push({x:CX+Math.cos(ang)*r,y:CY+Math.sin(ang)*r,num:i+1,done:false});
  }
  nextNum=1;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const dot=dots.find(d=>!d.done&&Math.hypot(d.x-x,d.y-y)<20);
  if(dot&&dot.num===nextNum){
    dot.done=true;nextNum++;
    SFX.tick();
    if(dots.every(d=>d.done)){
      carved++;
      SFX.success();
      saveBest(carved);
      newPattern();
    }
  }else if(dot){
    SFX.error();
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(carved);
  }
  updateUI();
}

function draw(){
  ctx.fillStyle='#3e1f0d';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#ef6c00';
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();

  ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  dots.forEach(d=>{
    ctx.fillStyle=d.done?'#4e342e':'#ffca28';
    ctx.beginPath();ctx.arc(d.x,d.y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=d.done?'rgba(255,255,255,.3)':'#3e1f0d';
    ctx.fillText(d.num,d.x,d.y);
  });

  ctx.fillStyle='#ffb74d';ctx.font='14px Arial';
  ctx.fillText(`Next: ${nextNum}`,W/2,320);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb74d';ctx.font='bold 26px Arial';
    ctx.fillText("TIME'S UP!",W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Carved: ${carved} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Carved: ${carved} | Time: ${Math.ceil(timeLeft)}s`;
}

init();draw();
</script></body></html>
