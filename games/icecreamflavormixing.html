<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#16213e;border-radius:14px;padding:18px;text-align:center}
#status{color:#fff;font-size:1.1rem;font-weight:800;margin:6px 0;min-height:1.6em}
#ticket{font-size:1.3rem;font-weight:900;color:#ffd54f;margin:4px 0}
#c{background:#dceeff;display:block;border-radius:10px;margin:10px auto}
#bars{display:flex;justify-content:center;gap:24px;margin:6px 0;color:#ddd;font-size:.9rem}
#controls{margin:12px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#controls button{padding:9px 16px;background:#3f7cac;border:none;border-radius:16px;color:#fff;cursor:pointer;font-size:.95rem}
#controls button.mix{background:#8a5fd1}
#controls button.serve{background:#e94560}
#controls button:disabled{opacity:.35;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Cream Flavor Mixing</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="score-display" style="color:#ffd54f;font-weight:700">Score: 0 | Lives: 3 | Hi: 0</div>
      <div id="ticket">—</div>
      <div id="status">Tap Start to open the counter</div>
      <canvas id="c" width="360" height="360"></canvas>
      <div id="bars"><span id="meltBar">Melt: 100%</span><span id="foldsLeft">Folds left: 0</span></div>
      <div id="controls">
        <button class="mix" id="m1" onclick="pickMixin(0)">1 🍪 Cookie</button>
        <button class="mix" id="m2" onclick="pickMixin(1)">2 🍓 Fruit</button>
        <button class="mix" id="m3" onclick="pickMixin(2)">3 🍬 Candy</button>
        <button class="mix" id="m4" onclick="pickMixin(3)">4 🌀 Swirl</button>
      </div>
      <div id="controls">
        <button id="fv" onclick="fold('v')">Fold ↕ (V)</button>
        <button id="fh" onclick="fold('h')">Fold ↔ (H)</button>
        <button id="fd" onclick="fold('d')">Fold ⤢ (D)</button>
        <button class="serve" id="serveBtn" onclick="serve()">Serve (Enter)</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>1-4</b> to pick the mix-in the customer ordered, then press <b>V</b>, <b>H</b> or <b>D</b> to fold it into the base evenly. When the mixture looks even, press <b>Enter</b> to serve before it melts!</div>
</div>
<script>
const MIXINS=[
  {name:'Cookie',emoji:'🍪',color:'#8a5a33'},
  {name:'Fruit',emoji:'🍓',color:'#e0486b'},
  {name:'Candy',emoji:'🍬',color:'#4fb3e8'},
  {name:'Swirl',emoji:'🌀',color:'#9b59d9'}
];
const N=6;
const HS_KEY='hs_icecreamflavormixing';
let grid=[],score=0,lives=3,level=1,served=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let started=false,gameOverFlag=false;
let order=null,chosen=null,state='await_mixin'; // await_mixin | folding | result
let foldsLeft=0,foldsMax=10,varianceTarget=0.02;
let melt=100,meltRateMs=0,lastTime=null,roundTimeMs=0,roundTimeLimit=22000;

function emptyGrid(){const g=[];for(let r=0;r<N;r++){g.push(new Array(N).fill(0));}return g;}

function newRound(){
  const poolSize=Math.min(MIXINS.length,2+Math.floor((level-1)/2));
  order=MIXINS[Math.floor(Math.random()*poolSize)];
  chosen=null;
  grid=emptyGrid();
  state='await_mixin';
  foldsMax=Math.max(4,10-Math.floor(level/2));
  foldsLeft=foldsMax;
  varianceTarget=Math.max(0.004,0.022-level*0.0016);
  roundTimeMs=0;
  roundTimeLimit=Math.max(10000,22000-level*1200);
  melt=100;
  setStatus(I18N.t('pick_mixin_hint','Customer wants ')+order.name+I18N.t('pick_mixin_hint2',' mixed in — pick it!'));
  updateUI();
  render();
}

function setStatus(t){document.getElementById('status').textContent=t;}

function pickMixin(i){
  if(!started||gameOverFlag)return;
  if(state!=='await_mixin')return;
  const m=MIXINS[i];
  if(m.name===order.name){
    chosen=m;
    grid[Math.floor(N/2)][Math.floor(N/2)]=1;
    grid[Math.floor(N/2)-1][Math.floor(N/2)-1]=0.8;
    state='folding';
    setStatus(I18N.t('fold_hint','Now fold it in evenly, then Serve!'));
    SFX.select();
  }else{
    SFX.error();
    failRound(I18N.t('wrong_mixin','Wrong mix-in! Order lost.'));
  }
  updateUI();render();
}

function variance(){
  let sum=0,sumSq=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){sum+=grid[r][c];sumSq+=grid[r][c]*grid[r][c];}
  const mean=sum/(N*N);
  const v=sumSq/(N*N)-mean*mean;
  return v;
}

function fold(axis){
  if(!started||gameOverFlag)return;
  if(state!=='folding'||foldsLeft<=0)return;
  if(axis==='v'){
    for(let r=0;r<N;r++)for(let c=0;c<N/2;c++){
      const a=grid[r][c],b=grid[r][N-1-c];
      const avg=(a+b)/2;
      grid[r][c]=avg;grid[r][N-1-c]=avg;
    }
  }else if(axis==='h'){
    for(let c=0;c<N;c++)for(let r=0;r<N/2;r++){
      const a=grid[r][c],b=grid[N-1-r][c];
      const avg=(a+b)/2;
      grid[r][c]=avg;grid[N-1-r][c]=avg;
    }
  }else if(axis==='d'){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(c>r){
        const avg=(grid[r][c]+grid[c][r])/2;
        grid[r][c]=avg;grid[c][r]=avg;
      }
    }
  }
  foldsLeft--;
  SFX.click();
  updateUI();render();
}

function serve(){
  if(!started||gameOverFlag)return;
  if(state!=='folding')return;
  const v=variance();
  if(v<=varianceTarget){
    const precision=1-Math.min(1,v/varianceTarget);
    const pts=Math.round(90+precision*90+level*10);
    score+=pts;
    served++;
    setStatus(I18N.t('served_well','Perfectly mixed! +')+pts);
    SFX.success();
    if(served%4===0)level++;
    nextAfterDelay();
  }else{
    SFX.fail();
    failRound(I18N.t('uneven','Too uneven — customer frowns!'));
  }
}

function failRound(msg){
  lives--;
  setStatus(msg);
  if(lives<=0){
    endGame();
  }else{
    state='result';
    nextAfterDelay();
  }
}

function nextAfterDelay(){
  state='result';
  updateUI();
  setTimeout(()=>{ if(!gameOverFlag)newRound(); },700);
}

function endGame(){
  gameOverFlag=true;
  state='result';
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  setStatus(I18N.t('game_over_title','GAME OVER')+' — '+I18N.t('final_score','Final Score: ')+score);
  updateUI();
}

function updateUI(){
  document.getElementById('ticket').textContent= order? (I18N.t('order_label2','Order: ')+order.emoji+' '+order.name) : '—';
  document.getElementById('meltBar').textContent=I18N.t('melt_label','Melt: ')+Math.max(0,Math.round(melt))+'%';
  document.getElementById('foldsLeft').textContent=I18N.t('folds_label','Folds left: ')+Math.max(0,foldsLeft);
  const disableMix=state!=='await_mixin'||!started||gameOverFlag;
  ['m1','m2','m3','m4'].forEach(id=>document.getElementById(id).disabled=disableMix);
  const disableFold=state!=='folding'||foldsLeft<=0||!started||gameOverFlag;
  document.getElementById('fv').disabled=disableFold;
  document.getElementById('fh').disabled=disableFold;
  document.getElementById('fd').disabled=disableFold;
  document.getElementById('serveBtn').disabled=state!=='folding'||!started||gameOverFlag;
  document.getElementById('score-display').textContent=
    I18N.t('score_lives_hi_label','Score: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function render(){
  const ctx=document.getElementById('c').getContext('2d');
  const size=360,cell=size/N;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#dceeff';ctx.fillRect(0,0,size,size);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c];
    ctx.fillStyle=chosen?chosen.color:'#bbb';
    ctx.globalAlpha=0.12+v*0.88;
    ctx.fillRect(c*cell,r*cell,cell-2,cell-2);
    ctx.globalAlpha=1;
  }
  ctx.strokeStyle='#8fb8d8';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,size);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(size,i*cell);ctx.stroke();
  }
}

document.addEventListener('keydown',e=>{
  if(!started){ if(e.code==='Space'){startGame();} return; }
  if(gameOverFlag){ if(e.code==='Space'){startGame();} return; }
  if(e.code==='Digit1')pickMixin(0);
  else if(e.code==='Digit2')pickMixin(1);
  else if(e.code==='Digit3')pickMixin(2);
  else if(e.code==='Digit4')pickMixin(3);
  else if(e.key==='v'||e.key==='V')fold('v');
  else if(e.key==='h'||e.key==='H')fold('h');
  else if(e.key==='d'||e.key==='D')fold('d');
  else if(e.code==='Enter')serve();
});

function startGame(){
  score=0;lives=3;level=1;served=0;started=true;gameOverFlag=false;
  newRound();
}

function tick(){
  const now=performance.now();
  const dt=lastTime===null?16.6667:Math.min(now-lastTime,50);
  lastTime=now;
  if(started&&!gameOverFlag&&state!=='await_mixin'){
    roundTimeMs+=dt;
    melt=Math.max(0,100-(roundTimeMs/roundTimeLimit)*100);
    if(roundTimeMs>=roundTimeLimit&&state==='folding'){
      SFX.fail();
      failRound(I18N.t('melted','It melted before you served it!'));
    }
    updateUI();
  }else if(started&&!gameOverFlag&&state==='await_mixin'){
    roundTimeMs+=dt;
    if(roundTimeMs>=roundTimeLimit){
      SFX.fail();
      failRound(I18N.t('too_slow2','Too slow picking a mix-in!'));
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setStatus(I18N.t('start_hint2','Press Space or tap the counter to start'));
updateUI();
render();
document.getElementById('c').addEventListener('pointerdown',()=>{ if(!started||gameOverFlag)startGame(); });
</script></body></html>
