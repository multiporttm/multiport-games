cript>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a1628;display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff7043;font-size:1rem;font-weight:700;text-align:center;padding:0 0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lighthouse Wick and Fuel Tending</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag the <b>wick slider</b> (or use <b>←/→</b>) to keep the flame length in the green zone, and click/tap <b>Refill</b> (or press <b>Space</b>) when the fuel gauge runs low. Let the light go out or smoke three times and the watch ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const HI_KEY='lighthousewickandfueltending_hi';

let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10),lives=3,gameOver=false,started=false,win=false;
let level=1,levelTime=0,levelTarget=45;
let wick=50; // 0-100, target zone moves
let targetLo=40,targetHi=60;
let fuel=100,fuelDrain=0.12;
let flameHealth=100; // decreases when wick/fuel out of range
let smokeTimer=0;
let dragging=false;
let refillFlashT=0;
let shakeT=0;
let lastTime=null;
let keys={};

function setHi(v){hi=v;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}

function reset(){
  score=0;lives=3;gameOver=false;started=false;win=false;
  level=1;levelTime=0;levelTarget=45;
  wick=50;targetLo=40;targetHi=60;
  fuel=100;fuelDrain=0.12;
  flameHealth=100;smokeTimer=0;lastTime=null;
}
reset();

function newTargetZone(){
  const width=Math.max(10,22-level*1.5);
  const center=20+Math.random()*60;
  targetLo=Math.max(0,center-width/2);
  targetHi=Math.min(100,center+width/2);
}
newTargetZone();

function nextLevel(){
  level++;
  levelTarget=45+level*10;
  levelTime=0;
  fuelDrain=0.12+level*0.03;
  newTargetZone();
  SFX.levelup();
}

function doRefill(){
  if(gameOver){reset();return;}
  if(!started)started=true;
  if(fuel<95){
    fuel=Math.min(100,fuel+45);
    refillFlashT=12;
    SFX.powerup();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();doRefill();}
  if(e.code==='ArrowLeft'){keys.left=true;if(!started)started=true;}
  if(e.code==='ArrowRight'){keys.right=true;if(!started)started=true;}
  if(e.code==='Enter'&&gameOver){reset();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')keys.left=false;
  if(e.code==='ArrowRight')keys.right=false;
});

function sliderRect(){ return {x:150,y:310,w:500,h:30}; }
function refillBtnRect(){ return {x:690,y:300,w:90,h:50}; }

function pointerToWick(px){
  const r=sliderRect();
  let v=((px-r.x)/r.w)*100;
  return Math.max(0,Math.min(100,v));
}

c.addEventListener('pointerdown',e=>{
  if(!started)started=true;
  if(gameOver){reset();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const y=(e.clientY-rect.top)*(H/rect.height);
  const rb=refillBtnRect();
  if(x>=rb.x&&x<=rb.x+rb.w&&y>=rb.y&&y<=rb.y+rb.h){doRefill();return;}
  const sr=sliderRect();
  if(y>=sr.y-15&&y<=sr.y+sr.h+15){dragging=true;wick=pointerToWick(x);}
});
c.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  wick=pointerToWick(x);
});
window.addEventListener('pointerup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});

function inZone(){ return wick>=targetLo&&wick<=targetHi; }

function loseLife(reason){
  lives--;
  shakeT=18;
  SFX.hurt();
  flameHealth=100;
  smokeTimer=0;
  if(lives<=0){
    gameOver=true;win=false;
    SFX.lose();
    if(score>hi)setHi(score);
  }
}

function drawFlame(x,y,sizeMul,smoky){
  ctx.save();
  ctx.translate(x,y);
  const grad=ctx.createRadialGradient(0,0,2,0,-10*sizeMul,30*sizeMul);
  if(smoky){
    grad.addColorStop(0,'#888');grad.addColorStop(1,'rgba(80,80,80,0)');
  } else {
    grad.addColorStop(0,'#fff7cc');grad.addColorStop(0.4,'#ffd54f');grad.addColorStop(1,'rgba(255,100,0,0)');
  }
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,8);
  ctx.quadraticCurveTo(14*sizeMul,-10*sizeMul,0,-38*sizeMul);
  ctx.quadraticCurveTo(-14*sizeMul,-10*sizeMul,0,8);
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-0.5)*6;sy=(Math.random()-0.5)*6;shakeT--;}
  ctx.save();
  ctx.translate(sx,sy);

  // night sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050912');sky.addColorStop(1,'#132238');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#ffffff55';
  for(let i=0;i<40;i++){
    const sxp=(i*53)%W, syp=(i*97)%180;
    ctx.fillRect(sxp,syp,2,2);
  }

  // lamp housing
  ctx.fillStyle='#2a2f3a';
  ctx.fillRect(300,60,200,180);
  ctx.strokeStyle='#4a5568';ctx.lineWidth=4;
  ctx.strokeRect(300,60,200,180);
  // lamp glass
  ctx.fillStyle='rgba(180,210,255,0.08)';
  ctx.fillRect(315,75,170,150);

  const lit=!gameOver&&started;
  const smoky=flameHealth<50&&!inZone();
  if(lit||gameOver){
    const sizeMul=0.6+ (fuel/100)*0.7;
    drawFlame(400,220,Math.max(0.2,sizeMul),smoky&&!gameOver);
  }

  // Wick length indicator inside housing
  ctx.fillStyle='#8d6e63';
  const wickH=10+ (wick/100)*40;
  ctx.fillRect(396,220-wickH,8,wickH);

  // Score / level HUD on canvas top
  ctx.fillStyle='#e0e0e0';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('wft_level_label','Night watch: {n}').replace('{n}',level),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('wft_time_label','Hold steady: {s}s').replace('{s}',Math.max(0,Math.ceil(levelTarget-levelTime))),780,30);

  // Fuel gauge
  ctx.textAlign='left';
  ctx.fillStyle='#ccc';ctx.font='14px Arial';
  ctx.fillText(I18N.t('wft_fuel_label','Fuel'),620,70);
  ctx.strokeStyle='#555';ctx.strokeRect(620,78,110,18);
  ctx.fillStyle= fuel<25?'#e53935':(fuel<55?'#ffb300':'#66bb6a');
  ctx.fillRect(622,80,Math.max(0,106*(fuel/100)),14);

  // Refill button
  const rb=refillBtnRect();
  ctx.fillStyle= refillFlashT>0?'#ffd54f':'#3a4a5e';
  ctx.fillRect(rb.x,rb.y,rb.w,rb.h);
  ctx.strokeStyle='#8899aa';ctx.strokeRect(rb.x,rb.y,rb.w,rb.h);
  ctx.fillStyle=refillFlashT>0?'#222':'#fff';
  ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('wft_refill_btn','REFILL'),rb.x+rb.w/2,rb.y+rb.h/2+5);
  if(refillFlashT>0)refillFlashT--;

  // Wick slider
  const sr=sliderRect();
  ctx.fillStyle='#1b2838';
  ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
  // target zone
  ctx.fillStyle='rgba(102,187,106,0.45)';
  ctx.fillRect(sr.x+sr.w*(targetLo/100),sr.y,sr.w*((targetHi-targetLo)/100),sr.h);
  // handle
  const hx=sr.x+sr.w*(wick/100);
  ctx.fillStyle=inZone()?'#66bb6a':'#ffb300';
  ctx.beginPath();ctx.arc(hx,sr.y+sr.h/2,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ccc';ctx.font='13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('wft_wick_label','WICK TRIM — drag or ←/→'),sr.x+sr.w/2,sr.y-10);

  ctx.restore();

  if(!started&&!gameOver){
    ctx.fillStyle='#ffd54f99';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wft_start_hint','Drag wick into the green zone — Space to refill'),400,180);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(win?I18N.t('wft_win_title','DAWN BREAKS!'):I18N.t('game_over_title','GAME OVER'),400,170);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),400,210);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,245);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(started&&!gameOver){
    if(keys.left)wick=Math.max(0,wick-1.2*dt);
    if(keys.right)wick=Math.min(100,wick+1.2*dt);

    fuel-=fuelDrain*dt;
    if(fuel<=0){
      fuel=0;
      flameHealth-=1.2*dt;
    }

    if(inZone()&&fuel>0){
      flameHealth=Math.min(100,flameHealth+0.5*dt);
      score+=0.08*dt*level;
    } else {
      flameHealth-=0.7*dt;
    }

    if(flameHealth<=0){
      loseLife('out');
    }

    levelTime+=dt/60;
    if(levelTime>=levelTarget){
      nextLevel();
    }
    if(level>6){
      win=true;gameOver=true;SFX.win();
      if(score>hi)setHi(score);
    }
    if(score>hi)hi=score;
  }

  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
