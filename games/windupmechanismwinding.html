<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a140c;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wind-Up Mechanism Winding</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, <b>Up Arrow</b>, or press-and-hold on the key to wind the spring. Release inside the green zone for a perfect run. Release too early and it won't finish its run; hold too long past the red zone and the spring snaps!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisplay=document.getElementById('score-display');
const HS_KEY='hs_windupmechanismwinding';

let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10),lives=3,level=1,toysDone=0;
let tension=0,winding=false,fillSpeed=0.55;
let zoneLo=60,zoneHi=78;
let state='idle'; // idle, wind, result, gameover
let resultTimer=0,resultType='',resultPrecision=0;
let lastTime=null;
let toyAnim=0;

function updateHud(){
  scoreDisplay.textContent=I18N.t('score_hi_lives_label','Score: {s} | Hi: {h} | Lives: {l}')
    .replace('{s}',score).replace('{h}',hi).replace('{l}',Math.max(0,lives));
}
function saveHi(){ if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));} }

function newToy(){
  const width=Math.max(8,22-level*1.4);
  const center=55+Math.random()*25;
  zoneLo=center-width/2;
  zoneHi=center+width/2;
  fillSpeed=0.5+level*0.07;
  tension=0;winding=false;
  state='wind';
}

function startLevel(){ newToy(); }

function draw(){
  ctx.clearRect(0,0,800,400);
  const bg=ctx.createLinearGradient(0,0,0,400);
  bg.addColorStop(0,'#120d07');bg.addColorStop(1,'#241a10');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,400);

  ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('level_toy_label','Level {n} — Toy {k}/3').replace('{n}',level).replace('{k}',Math.min(toysDone+1,3)),400,30);

  // Gauge
  const gx=200,gy=90,gw=400,gh=46;
  ctx.fillStyle='#2a2015';ctx.fillRect(gx,gy,gw,gh);
  // red overshoot zone (100+)
  ctx.fillStyle='#e9456055';ctx.fillRect(gx+gw,gy,0,gh);
  // green target zone
  ctx.fillStyle='#7ec85088';
  ctx.fillRect(gx+gw*(zoneLo/100),gy,gw*((zoneHi-zoneLo)/100),gh);
  // tension fill
  const fillW=Math.min(gw,gw*(tension/100));
  ctx.fillStyle = tension>100?'#e94560':(tension>=zoneLo&&tension<=zoneHi?'#7ec850':'#ffd54f');
  ctx.fillRect(gx,gy,fillW,gh);
  ctx.strokeStyle='#8a6a3a';ctx.lineWidth=3;ctx.strokeRect(gx,gy,gw,gh);
  // snap marker at 100
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx+gw,gy-6);ctx.lineTo(gx+gw,gy+gh+6);ctx.stroke();
  ctx.fillStyle='#e94560';ctx.font='12px Arial';ctx.fillText(I18N.t('snap_label','SNAP'),gx+gw,gy-12);

  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
  ctx.fillText(Math.round(tension)+'%',400,gy+gh+28);

  // key / toy drawing
  ctx.save();
  ctx.translate(400,230);
  ctx.fillStyle='#b5833a';
  ctx.fillRect(-45,-20,90,70);
  ctx.fillStyle='#8a6a3a';
  ctx.fillRect(-10,-55,20,40);
  ctx.save();
  ctx.translate(0,-55);
  ctx.rotate((tension/100)*Math.PI*4);
  ctx.fillStyle='#d4a24c';
  ctx.fillRect(-18,-6,36,12);
  ctx.fillRect(-6,-18,12,36);
  ctx.restore();
  ctx.restore();

  if(state==='wind'){
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hold_hint','Hold to wind, release in the green zone'),400,340);
  }

  if(state==='result'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    let msg;
    if(resultType==='perfect')msg=I18N.t('perfect_wind','Perfect wind! Full run!');
    else if(resultType==='weak')msg=I18N.t('weak_wind','Too loose — the toy barely moves.');
    else msg=I18N.t('snapped_spring','SNAP! The spring over-tightened.');
    ctx.fillText(msg,400,330);
    // toy running animation for perfect
    if(resultType==='perfect'){
      const wx=150+((toyAnim*100)%500);
      ctx.fillStyle='#d4a24c';
      ctx.fillRect(wx,360,36,26);
    }
  }

  if(state==='idle'){
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Hold Space or tap-and-hold to start'),400,230);
  }

  if(state==='gameover'){
    ctx.fillStyle='#0009';ctx.fillRect(0,0,800,400);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',score),400,216);
    ctx.fillText(I18N.t('restart_hint3','Tap or press Enter to restart'),400,244);
  }
}

function resolveWind(){
  winding=false;
  if(tension>100){
    resultType='snap';
    SFX.lose();
    lives--;
  } else if(tension>=zoneLo&&tension<=zoneHi){
    resultType='perfect';
    const mid=(zoneLo+zoneHi)/2;
    const prec=1-Math.abs(tension-mid)/((zoneHi-zoneLo)/2+0.001);
    const pts=Math.round(20+prec*30)*level;
    score+=pts;
    SFX.success();
    toysDone++;
  } else {
    resultType='weak';
    SFX.fail();
    lives--;
  }
  state='result';resultTimer=0;toyAnim=0;
  updateHud();
  saveHi();
  if(lives<=0){
    setTimeout(()=>{ SFX.lose(); state='gameover'; },50);
  }
}

function beginWind(){
  if(state==='idle'){ restartGame(); winding=true; return; }
  if(state==='gameover'){ restartGame(); winding=true; return; }
  if(state!=='wind')return;
  winding=true;
}
function endWind(){
  if(state!=='wind'||!winding)return;
  resolveWind();
}

function loop(now){
  if(lastTime===null)lastTime=now;
  const dt=Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(state==='wind'&&winding){
    tension+=fillSpeed*dt;
    if(tension>100+8){
      resolveWind();
    }
  } else if(state==='result'){
    resultTimer+=dt;
    toyAnim+=dt/60;
    if(resultTimer>70){
      if(state!=='gameover'){
        if(toysDone>=3){ toysDone=0; level++; }
        if(lives>0) newToy();
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function restartGame(){
  score=0;lives=3;level=1;toysDone=0;
  updateHud();
  startLevel();
}

c.addEventListener('mousedown',e=>{ e.preventDefault(); beginWind(); });
window.addEventListener('mouseup',()=>{ endWind(); });
c.addEventListener('touchstart',e=>{ e.preventDefault(); beginWind(); },{passive:false});
c.addEventListener('touchend',e=>{ e.preventDefault(); endWind(); },{passive:false});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state==='idle'||state==='gameover'){ beginWind(); return; }
    beginWind();
  }
  if(e.key==='Enter'&&state==='gameover'){ restartGame(); }
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); endWind(); }
});

state='idle';
updateHud();
draw();
requestAnimationFrame(loop);
</script></body></html>
