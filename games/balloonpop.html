<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#c62828;cursor:crosshair}
#ui{color:#ffcdd2;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Balloon Pop Carnival</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Popped: 0 | Darts: 15</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap a balloon to throw a dart at it — you've got 15 darts total. Gold balloons are worth extra but move faster. Pop as many as you can before you run out!</div>
</div>
<script>
const W=360,H=360;
let balloons,popped,darts,state;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('balloonpop_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('balloonpop_best',v);}

function init(){
  balloons=[];popped=0;darts=15;state='play';
  for(let i=0;i<5;i++)spawnBalloon();
}

function spawnBalloon(){
  const gold=Math.random()<0.2;
  balloons.push({x:rand(30,W-30),y:rand(30,H-30),vx:rand(-1,1)*(gold?1.6:1),vy:rand(-1,1)*(gold?1.6:1),gold,r:16});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  if(darts<=0)return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  darts--;
  const hit=balloons.find(b=>Math.hypot(b.x-x,b.y-y)<b.r);
  if(hit){
    popped++;
    SFX.success();
    saveBest(popped);
    balloons.splice(balloons.indexOf(hit),1);
    spawnBalloon();
  }else{
    SFX.fail();
  }
  if(darts<=0){
    state='over';
    SFX.lose();
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  balloons.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<20||b.x>W-20)b.vx*=-1;
    if(b.y<20||b.y>H-20)b.vy*=-1;
  });
}

function draw(){
  ctx.fillStyle='#c62828';ctx.fillRect(0,0,W,H);

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  balloons.forEach(b=>ctx.fillText(b.gold?'🟡':'🎈',b.x,b.y));

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcdd2';ctx.font='bold 26px Arial';
    ctx.fillText('OUT OF DARTS!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Popped: ${popped} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Popped: ${popped} | Darts: ${Math.max(0,darts)}`;
}

init();draw();
</script></body></html>
