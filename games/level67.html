<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#0a0a0a}
#c{display:block;border-radius:8px}
#ui{color:#00ff64;text-align:center;padding:8px;font-size:1.1rem;font-weight:700;text-shadow:0 0 8px #00ff64}
</style>
</head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title" style="color:#00ff64;text-shadow:0 0 12px #00ff64">Level 67</div>
  <div class="game-frame" style="background:#0a0a0a">
    <div id="ui">0m | Best: 0m</div>
    <canvas id="c" width="600" height="380"></canvas>
  </div>
  <div class="game-instructions">Press <b>Space</b>, click, or tap to jump. Land on platforms, avoid all spikes!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=600,H=380,FLOOR=H-52,CEIL=52,SZ=32,SPK=36;
const SPEED=7.5,GRAV=0.7,JUMP=-14;
let px,py,pvy,angle,camX,spikes,frame,score,state,hi=0,nextSpawn,trail;
let lastTime=null;

function reset(){
  px=90;py=FLOOR-SZ;pvy=0;angle=0;
  camX=0;spikes=[];frame=0;score=0;state='play';nextSpawn=380;
  trail=[];
  lastTime=null;
}

function jump(){
  if(py+SZ>=FLOOR-1){pvy=JUMP;SFX.jump();}
}

function handleInput(){
  if(state!=='play'){reset();}else jump();
}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();handleInput();}});
c.addEventListener('click',handleInput);
c.addEventListener('touchstart',e=>{e.preventDefault();handleInput();},{passive:false});

function spawnPattern(wx){
  const r=Math.random();
  if(r<0.18){// single floor spike
    spikes.push({x:wx,floor:true});
  } else if(r<0.34){// double floor
    spikes.push({x:wx,floor:true});spikes.push({x:wx+SPK,floor:true});
  } else if(r<0.46){// triple floor
    for(let i=0;i<3;i++)spikes.push({x:wx+i*SPK,floor:true});
  } else if(r<0.58){// ceiling spike
    spikes.push({x:wx,floor:false});
  } else if(r<0.70){// floor + ceiling offset
    spikes.push({x:wx,floor:true});spikes.push({x:wx+110,floor:false});
  } else if(r<0.80){// double floor + ceiling above
    spikes.push({x:wx,floor:true});spikes.push({x:wx+SPK,floor:true});
    spikes.push({x:wx+SPK*.5,floor:false});
  } else if(r<0.88){// ceiling pair
    spikes.push({x:wx,floor:false});spikes.push({x:wx+SPK,floor:false});
  } else {// spiky ball — a rounder, wider hazard that needs a cleaner jump
    spikes.push({x:wx,floor:true,type:'ball'});
  }
}

function genSpikes(){
  while(nextSpawn<camX+W+300){
    spawnPattern(nextSpawn);
    nextSpawn+=78+Math.random()*100;
  }
}

function hitTest(){
  for(const s of spikes){
    const sx=s.x-camX;
    if(sx>W+SPK||sx<-SPK)continue;
    const sy=s.floor?FLOOR:CEIL;
    const hx=(s.x-camX)+SPK*.19,hw=SPK*.62;
    const hy=s.floor?(FLOOR-SPK*.82):CEIL,hh=SPK*.82;
    if(px+SZ>hx&&px<hx+hw&&py+SZ>hy&&py<hy+hh)return true;
  }
  return false;
}

function drawSpike(sx,floor){
  ctx.shadowColor='#00ff64';ctx.shadowBlur=12;
  ctx.fillStyle='#00ff64';
  ctx.beginPath();
  if(floor){ctx.moveTo(sx,FLOOR);ctx.lineTo(sx+SPK,FLOOR);ctx.lineTo(sx+SPK/2,FLOOR-SPK);}
  else{ctx.moveTo(sx,CEIL);ctx.lineTo(sx+SPK,CEIL);ctx.lineTo(sx+SPK/2,CEIL+SPK);}
  ctx.closePath();ctx.fill();
  // inner lighter triangle
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();
  if(floor){ctx.moveTo(sx+SPK*.3,FLOOR-4);ctx.lineTo(sx+SPK*.7,FLOOR-4);ctx.lineTo(sx+SPK/2,FLOOR-SPK+8);}
  else{ctx.moveTo(sx+SPK*.3,CEIL+4);ctx.lineTo(sx+SPK*.7,CEIL+4);ctx.lineTo(sx+SPK/2,CEIL+SPK-8);}
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
}

function drawSpikyBall(sx,floor){
  const cx=sx+SPK/2,cy=floor?FLOOR-SPK/2:CEIL+SPK/2,r=SPK/2;
  ctx.shadowColor='#00ff64';ctx.shadowBlur=10;
  ctx.fillStyle='#0a0a0a';
  ctx.beginPath();
  const spikeCount=9;
  for(let i=0;i<spikeCount*2;i++){
    const ang=(i/(spikeCount*2))*Math.PI*2;
    const rad=i%2===0?r*1.35:r*0.8;
    const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy+r*0.18,r*0.32,0,Math.PI);ctx.stroke();
}

function drawTrail(){
  if(trail.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const t=i/trail.length;
    const x1=px+SZ/2-(trail.length-i+1)*7,x2=px+SZ/2-(trail.length-i)*7;
    ctx.strokeStyle='#00ff64';
    ctx.globalAlpha=t*0.4;
    ctx.lineWidth=SZ*0.35*t;
    ctx.beginPath();ctx.moveTo(x1,trail[i-1]);ctx.lineTo(x2,trail[i]);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawZigzagLine(y,amp){
  const wavelen=14;
  const xOff=-(camX%(wavelen*2));
  ctx.beginPath();
  let first=true;
  for(let x=xOff-wavelen*2;x<W+wavelen*2;x+=wavelen){
    const step=Math.round((x-xOff)/wavelen);
    const yy=y+(step%2===0?0:amp);
    if(first){ctx.moveTo(x,yy);first=false;}else ctx.lineTo(x,yy);
  }
  ctx.stroke();
}

function drawChevronBG(){
  const wave=34,amp=16,rowH=26,rows=Math.ceil((FLOOR-CEIL)/rowH)+2;
  ctx.save();
  ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  for(let r=0;r<rows;r++){
    const baseY=CEIL+r*rowH;
    const xOff=-((camX*(0.22+r*0.02))%(wave*2));
    ctx.strokeStyle=r%2===0?'rgba(0,255,100,0.13)':'rgba(0,255,100,0.06)';
    ctx.beginPath();
    let first=true;
    for(let x=xOff-wave*2;x<W+wave*2;x+=wave){
      const step=Math.round((x-xOff)/wave);
      const y=baseY+(step%2===0?0:amp);
      if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer(){
  ctx.save();ctx.translate(px+SZ/2,py+SZ/2);ctx.rotate(angle);
  ctx.shadowColor='#e94560';ctx.shadowBlur=14;
  ctx.fillStyle='#e94560';ctx.fillRect(-SZ/2,-SZ/2,SZ,SZ);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(-SZ/2,-SZ/2,SZ/2,SZ/2);
  ctx.fillStyle='#ff8a80';
  ctx.beginPath();ctx.moveTo(-SZ/4,-SZ/4);ctx.lineTo(SZ/4,-SZ/4);ctx.lineTo(0,SZ/4);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

function loop(){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  drawChevronBG();
  // Grid
  ctx.strokeStyle='rgba(0,255,100,0.06)';ctx.lineWidth=1;
  const gx=60-(camX%60);
  for(let x=gx;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,CEIL);ctx.lineTo(x,FLOOR);ctx.stroke();}
  for(let y=CEIL;y<=FLOOR;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(state==='idle'){
      ctx.shadowColor='#00ff64';ctx.shadowBlur=20;
      ctx.fillStyle='#00ff64';ctx.font='bold 50px Arial';ctx.fillText('LEVEL 67',W/2,H/2-28);
      ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='19px Arial';
      ctx.fillText('Space / Click / Tap to jump',W/2,H/2+20);
    } else {
      ctx.fillStyle='#e94560';ctx.font='bold 44px Arial';ctx.fillText('DEAD',W/2,H/2-45);
      ctx.fillStyle='#fff';ctx.font='24px Arial';ctx.fillText(`${score}m`,W/2,H/2);
      ctx.fillStyle='#aaa';ctx.font='17px Arial';ctx.fillText(`Best: ${hi}m`,W/2,H/2+34);
      ctx.fillText('Space / Click / Tap to retry',W/2,H/2+62);
    }
    requestAnimationFrame(loop);return;
  }

  // Physics
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  pvy+=GRAV*dt;py+=pvy*dt;camX+=SPEED*dt;
  angle+=SPEED*0.045*dt;frame+=dt;
  score=Math.floor(camX/10);if(score>hi)hi=score;

  if(py+SZ>=FLOOR){py=FLOOR-SZ;pvy=0;angle=Math.round(angle/(Math.PI/2))*(Math.PI/2);}
  if(py<=CEIL){state='dead';}

  trail.push(py+SZ/2);
  if(trail.length>14)trail.shift();

  genSpikes();
  spikes=spikes.filter(s=>s.x>camX-SPK*2);

  // Floor/ceiling panels
  ctx.fillStyle='#111';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillRect(0,0,W,CEIL);
  // Zigzag glow lines
  ctx.shadowColor='#00ff64';ctx.shadowBlur=14;
  ctx.strokeStyle='#00ff64';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  drawZigzagLine(FLOOR,-7);
  drawZigzagLine(CEIL,7);
  ctx.shadowBlur=0;

  spikes.forEach(s=>s.type==='ball'?drawSpikyBall(s.x-camX,s.floor):drawSpike(s.x-camX,s.floor));
  drawTrail();
  if(hitTest()&&state==='play'){state='dead';SFX.lose();}
  drawPlayer();

  document.getElementById('ui').textContent=`${score}m | Best: ${hi}m`;
  requestAnimationFrame(loop);
}

state='idle';loop();
</script>
</body></html>
