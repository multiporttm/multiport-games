<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Riddle Room</title><meta name="description" content="Play Riddle Room free online — Read the riddle, pick the correct answer from 4 choices before the timer runs out. Wrong answers or timeouts cost a life!"><link rel="canonical" href="https://games.multiportllc.com/games/riddleroom"><meta property="og:title" content="Riddle Room - Multiport Games"><meta property="og:description" content="Play Riddle Room free online — Read the riddle, pick the correct answer from 4 choices before the timer runs out. Wrong answers or timeouts cost a life!"><meta property="og:url" content="https://games.multiportllc.com/games/riddleroom"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Riddle Room","description":"Play Riddle Room free online instantly. Read each riddle and pick the correct answer from 4 multiple-choice options before the timer runs out. Correct answers score points and load the next riddle; wrong answers or timeouts cost a life. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/riddleroom","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#263238,#6a1b9a);border-radius:14px;padding:20px;text-align:center;max-width:560px;margin:0 auto}
#hud{color:#fff;font-weight:800;font-size:1rem;display:flex;justify-content:space-between;margin-bottom:10px}
#timerBar{background:rgba(0,0,0,.3);border-radius:8px;height:14px;overflow:hidden;margin-bottom:14px}
#timerFill{height:100%;background:linear-gradient(90deg,#69f0ae,#ffd740,#ff5252);width:100%;transition:width .1s linear}
#riddleText{color:#fff;font-size:1.25rem;font-weight:700;min-height:4.5em;display:flex;align-items:center;justify-content:center;padding:0 6px}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{background:#fff;color:#222;border:none;border-radius:10px;padding:14px 10px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
.choice:hover{transform:scale(1.03)}
.choice.correct{background:#69f0ae}
.choice.wrong{background:#ff5252;color:#fff}
.choice:disabled{cursor:default}
#msg{color:#ffd740;font-weight:800;min-height:1.6em;margin-top:10px}
@media(max-width:480px){#choices{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Riddle Room</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="hud"><span id="scoreLabel">Solved: 0</span><span id="livesLabel">Lives: 3</span><span id="bestLabel">Best: 0</span></div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="riddleText">Loading...</div>
      <div id="choices"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the riddle and click the answer you think is correct before the <b>timer</b> runs out. Correct answers score a point and load the next riddle — wrong answers or running out of time cost a <b>life</b>.</div>
</div>
<script>
const RIDDLES=[
  {q:"What has to be broken before you can use it?",a:["An egg","A promise","A window","A rule"],c:0},
  {q:"I speak without a mouth and hear without ears. What am I?",a:["A ghost","An echo","A phone","A shadow"],c:1},
  {q:"The more you take, the more you leave behind. What are they?",a:["Footsteps","Memories","Coins","Photos"],c:0},
  {q:"What has keys but no locks, space but no room, and you can enter but not go inside?",a:["A map","A piano","A keyboard","A house"],c:2},
  {q:"What month of the year has 28 days?",a:["February","All of them","April","June"],c:1},
  {q:"What is full of holes but still holds water?",a:["A net","A sponge","A bucket","A cup"],c:1},
  {q:"What comes down but never goes up?",a:["Rain","A balloon","Smoke","A kite"],c:0},
  {q:"What can travel around the world while staying in a corner?",a:["A ball","A stamp","A coin","A map"],c:1},
  {q:"What has a head, a tail, is brown, and has no legs?",a:["A snake","A coin","A worm","A rope"],c:1},
  {q:"What gets wetter the more it dries?",a:["A towel","A sponge","Rain","A puddle"],c:0},
  {q:"I am tall when I am young, and short when I am old. What am I?",a:["A tree","A candle","A person","A shadow"],c:1},
  {q:"What can you catch but not throw?",a:["A cold","A ball","A fish","A frisbee"],c:0},
  {q:"What has one eye but cannot see?",a:["A needle","A cyclops","A storm","A camera"],c:0},
  {q:"What runs but never walks, has a mouth but never talks?",a:["A car","A river","Wind","Time"],c:1},
  {q:"What has many teeth but cannot bite?",a:["A saw","A comb","A shark","A zipper"],c:1},
  {q:"What goes up but never comes down?",a:["Your age","A balloon","Smoke","A rocket"],c:0},
  {q:"What has a neck but no head?",a:["A shirt","A bottle","A guitar","A giraffe"],c:1},
  {q:"What invention lets you look right through a wall?",a:["Binoculars","A window","X-ray","A telescope"],c:1},
  {q:"What has words but never speaks?",a:["A parrot","A book","A radio","A phone"],c:1},
  {q:"What building has the most stories?",a:["A skyscraper","A library","A castle","A museum"],c:1},
  {q:"What is easy to get into, but hard to get out of?",a:["Trouble","A pool","A car","A maze"],c:0},
  {q:"I have branches but no fruit, trunk, or leaves. What am I?",a:["A river","A bank","A tree stump","A road"],c:1},
  {q:"What has a bed but never sleeps?",a:["A hotel","A river","A hospital","A crib"],c:1},
  {q:"What can fill a room but takes up no space?",a:["Air","Light","Smoke","Sound"],c:1},
  {q:"What five-letter word becomes shorter when you add two letters to it?",a:["Short","Small","Tiny","Brief"],c:0},
  {q:"What has an eye but cannot see, and a bed but never sleeps in it?",a:["A needle and a river","A storm and a house","A hurricane and a river","A potato and a farm"],c:2},
  {q:"What can you break, even if you never pick it up or touch it?",a:["A vase","A record","A promise","A mirror"],c:1},
  {q:"What kind of room has no doors or windows?",a:["A mushroom","A basement","A tent","A cave"],c:0},
  {q:"What goes through cities and fields but never moves?",a:["A road","A river","A train track","A bridge"],c:0},
  {q:"What has hands but cannot clap?",a:["A statue","A clock","A glove","A robot"],c:1},
  {q:"What tastes better than it smells?",a:["A tongue","Chocolate","Perfume","Coffee"],c:0},
  {q:"What can you keep after giving it to someone else?",a:["A gift","Your word","Money","A hug"],c:1},
  {q:"What is so fragile that saying its name breaks it?",a:["Glass","Silence","A promise","A secret"],c:1},
  {q:"What has a thumb and four fingers but is not alive?",a:["A statue","A glove","A hand puppet","A mannequin"],c:1}
];

let deck=[],idx=0,cur=null;
let solved=0,lives=3,best=parseInt(localStorage.getItem('riddleroom_best')||'0');
let timer=null,timeLeft=0,TOTAL=12000,tickStart=null,answered=false;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function newDeck(){deck=shuffle(RIDDLES);idx=0;}

function updateHud(){
  document.getElementById('scoreLabel').textContent=I18N.t('riddle_solved_label','Solved: {s}').replace('{s}',solved);
  document.getElementById('livesLabel').textContent=I18N.t('riddle_lives_label','Lives: {l}').replace('{l}',lives);
  document.getElementById('bestLabel').textContent=I18N.t('riddle_best_label','Best: {b}').replace('{b}',best);
}

function nextRiddle(){
  if(idx>=deck.length){newDeck();}
  cur=deck[idx++];
  answered=false;
  document.getElementById('msg').textContent='';
  document.getElementById('riddleText').textContent=cur.q;
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  cur.a.forEach((choiceText,i)=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=choiceText;
    btn.onclick=()=>pick(i,btn);
    choicesEl.appendChild(btn);
  });
  timeLeft=TOTAL;
  tickStart=performance.now();
  clearInterval(timer);
  timer=setInterval(tick,50);
}

function tick(){
  if(answered)return;
  const elapsed=performance.now()-tickStart;
  timeLeft=Math.max(0,TOTAL-elapsed);
  document.getElementById('timerFill').style.width=(timeLeft/TOTAL*100)+'%';
  if(timeLeft<=0){
    answered=true;
    clearInterval(timer);
    revealAnswer(-1);
    loseLife(I18N.t('riddle_timeout','⏱ Time\'s up!'));
  }
}

function pick(i,btn){
  if(answered)return;
  answered=true;
  clearInterval(timer);
  revealAnswer(i);
  if(i===cur.c){
    solved++;
    SFX.success();
    if(solved>best){best=solved;localStorage.setItem('riddleroom_best',best);}
    document.getElementById('msg').textContent=I18N.t('riddle_correct','✅ Correct!');
    updateHud();
    setTimeout(()=>{if(lives>0)nextRiddle();},1100);
  }else{
    SFX.fail();
    loseLife(I18N.t('riddle_wrong','❌ Not quite!'));
  }
}

function loseLife(msg){
  lives--;
  document.getElementById('msg').textContent=msg;
  updateHud();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(()=>nextRiddle(),1300);
  }
}

function revealAnswer(pickedIdx){
  const btns=document.querySelectorAll('#choices .choice');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===cur.c)b.classList.add('correct');
    else if(i===pickedIdx)b.classList.add('wrong');
  });
}

function endGame(){
  clearInterval(timer);
  document.getElementById('riddleText').textContent=I18N.t('riddle_game_over','GAME OVER — out of lives!');
  document.getElementById('choices').innerHTML='';
  document.getElementById('msg').innerHTML='';
  const btn=document.createElement('button');
  btn.className='choice';
  btn.style.gridColumn='1 / -1';
  btn.textContent=I18N.t('riddle_play_again','Play Again');
  btn.onclick=startGame;
  document.getElementById('choices').appendChild(btn);
  document.getElementById('choices').style.display='grid';
  SFX.lose();
}

function startGame(){
  solved=0;lives=3;
  newDeck();
  updateHud();
  document.getElementById('choices').style.display='grid';
  nextRiddle();
}

startGame();
</script></body></html>
