<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#241c14;display:block;border-radius:8px;touch-action:none;max-width:100%}
#hud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;color:#e8c99a;font-weight:700;padding:6px 0;font-size:.95rem}
#hud span{background:rgba(0,0,0,.35);padding:4px 10px;border-radius:8px}
#status{min-height:1.6em;color:#ffd54f;font-weight:800;text-align:center;margin-top:6px}
#windBtn{display:block;margin:10px auto;padding:12px 28px;background:#a0522d;border:none;border-radius:22px;color:#fff;font-weight:900;font-size:1.05rem;cursor:pointer;user-select:none;touch-action:none}
#windBtn:active{background:#c06a3d}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Siege Catapult Arm Tensioning</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0 | Hi: 0</span>
      <span id="levelDisp">Level 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
    </div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="status">Hold to wind the ropes, release in the green band!</div>
    <button id="windBtn">HOLD TO WIND</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, <b>click</b>, or <b>tap</b> the button to wind the torsion ropes. Release inside the green target band to hit the distance — too loose undershoots, too tight snaps the ropes!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),levelDisp=document.getElementById('levelDisp'),livesDisp=document.getElementById('livesDisp');
const statusEl=document.getElementById('status'),windBtn=document.getElementById('windBtn');
let score=0,hi=parseInt(localStorage.getItem('siegecatapultarmtensioning_hi')||'0',10),level=1,lives=3,hitsThisLevel=0;
let tension=0,winding=false,rate=22,snapAt=100;
let bandLo=40,bandHi=55;
let state='ready'; // ready, winding, result, over
let resultTimer=0;

function updateHud(){
  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  levelDisp.textContent=I18N.t('level_label','Level {n}').replace('{n}',level);
  livesDisp.textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
}

function newRound(){
  tension=0;winding=false;state='ready';
  rate=20+level*2.4;
  const width=Math.max(6,20-level*1.1);
  const center=30+Math.random()*45;
  bandLo=Math.max(5,center-width/2);
  bandHi=Math.min(94,center+width/2);
  statusEl.textContent=I18N.t('cat_ready','Hold to wind — release when the needle is in the green band!');
}

function startWind(){
  if(state!=='ready'&&state!=='winding')return;
  winding=true;state='winding';
  SFX.tick();
}
function stopWind(){
  if(state!=='winding')return;
  winding=false;
  evaluate();
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();
    if(state==='result'||state==='over'){afterResult();return;}
    startWind();
  }
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();stopWind();}});
windBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='result'||state==='over'){afterResult();return;}startWind();});
window.addEventListener('pointerup',()=>{stopWind();});
window.addEventListener('pointercancel',()=>{stopWind();});

function evaluate(){
  if(tension>=bandLo&&tension<=bandHi){
    const center=(bandLo+bandHi)/2;
    const bonus=Math.round((1-Math.abs(tension-center)/((bandHi-bandLo)/2+0.01))*50);
    score+=100+level*10+bonus;
    hitsThisLevel++;
    if(score>hi){hi=score;localStorage.setItem('siegecatapultarmtensioning_hi',String(hi));}
    statusEl.textContent=I18N.t('cat_hit','Perfect tension! Shot flies true. +{p}').replace('{p}',100+level*10+bonus);
    SFX.success();
    if(hitsThisLevel>=3){hitsThisLevel=0;level++;SFX.levelup();}
  } else {
    lives--;
    if(tension<bandLo)statusEl.textContent=I18N.t('cat_loose','Too loose! The shot fell short.');
    else statusEl.textContent=I18N.t('cat_tight','Too tight! You lost power easing off late.');
    SFX.fail();
    if(lives<=0){
      state='over';
      statusEl.textContent=I18N.t('cat_over','GAME OVER — Final Score: {s}. Tap/Space to try again.').replace('{s}',score);
      SFX.lose();
      updateHud();
      return;
    }
  }
  state='result';
  updateHud();
}

function snap(){
  lives--;
  statusEl.textContent=I18N.t('cat_snap','SNAP! The ropes gave out under too much tension!');
  SFX.lose();
  winding=false;
  if(lives<=0){
    state='over';
    statusEl.textContent=I18N.t('cat_over','GAME OVER — Final Score: {s}. Tap/Space to try again.').replace('{s}',score);
  } else {
    state='result';
  }
  updateHud();
}

function afterResult(){
  if(state==='over'){
    score=0;level=1;lives=3;hitsThisLevel=0;
    updateHud();
  }
  newRound();
}

let lastT=null;
function loop(ts){
  if(lastT===null)lastT=ts;
  const dt=Math.min((ts-lastT)/1000,0.05);
  lastT=ts;
  if(state==='winding'&&winding){
    tension+=rate*dt*(1+level*0.02);
    if(tension>=snapAt){tension=snapAt;snap();}
  }
  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,800,300);
  ctx.fillStyle='#1c140e';ctx.fillRect(0,0,800,300);
  // frame base
  ctx.fillStyle='#4a3620';ctx.fillRect(100,230,600,30);

  // tension meter
  const meterX=100,meterY=60,meterW=600,meterH=46;
  ctx.fillStyle='#000';ctx.fillRect(meterX,meterY,meterW,meterH);
  // band
  const bx=meterX+bandLo/100*meterW,bw=(bandHi-bandLo)/100*meterW;
  ctx.fillStyle='rgba(80,220,100,.55)';ctx.fillRect(bx,meterY,bw,meterH);
  // snap zone
  ctx.fillStyle='rgba(220,60,60,.4)';ctx.fillRect(meterX+90/100*meterW,meterY,meterW*0.10,meterH);
  // needle
  const nx=meterX+Math.min(100,tension)/100*meterW;
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(nx,meterY-8);ctx.lineTo(nx,meterY+meterH+8);ctx.stroke();
  ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.strokeRect(meterX,meterY,meterW,meterH);
  ctx.fillStyle='#e8c99a';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('cat_tension_label','Tension: {t}%').replace('{t}',Math.round(tension)),400,meterY-18);

  // catapult visual: torsion ropes twist amount reflects tension
  const baseX=400,baseY=230;
  const twist=tension/100;
  ctx.strokeStyle='#8a6a3a';ctx.lineWidth=6;
  for(let i=-2;i<=2;i++){
    ctx.beginPath();
    ctx.moveTo(baseX+i*16,baseY);
    ctx.quadraticCurveTo(baseX+i*16+Math.sin(twist*10+i)*18*twist,baseY-60,baseX+i*16,baseY-120);
    ctx.stroke();
  }
  const armAngle=-20-twist*70;
  const armRad=armAngle*Math.PI/180;
  const armLen=110;
  ctx.strokeStyle='#caa46b';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(baseX,baseY-120);ctx.lineTo(baseX+Math.cos(armRad)*armLen,baseY-120+Math.sin(armRad)*armLen);ctx.stroke();
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.arc(baseX+Math.cos(armRad)*armLen,baseY-120+Math.sin(armRad)*armLen,10,0,Math.PI*2);ctx.fill();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,800,300);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,150);
  }
}
updateHud();
newRound();
requestAnimationFrame(loop);
</script></body></html>
