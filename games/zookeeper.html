<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#33691e;cursor:pointer}
#ui{color:#aed581;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Zoo Keeper</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Survived: 0s | Best: 0s</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Each pen has a hunger bar that drains over time. Tap a pen to feed that animal and refill its bar. Let any animal's bar hit zero and the zoo shuts down — keep them all fed as long as you can!</div>
</div>
<script>
const W=360,H=360,COLS=2,ROWS=2,CELL_W=W/COLS,CELL_H=H/ROWS;
const ANIMALS=['🦁','🐘','🐒','🦒'];
let pens,survived,state;

function loadBest(){return +(localStorage.getItem('zookeeper_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('zookeeper_best',v);}

function init(){
  pens=ANIMALS.map((a,i)=>({emoji:a,hunger:100,drain:0.25+i*0.05}));
  survived=0;state='play';
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL_W),row=Math.floor(y/CELL_H);
  const idx=row*COLS+col;
  if(idx<0||idx>=pens.length)return;
  pens[idx].hunger=Math.min(100,pens[idx].hunger+35);
  SFX.click();
});

function update(){
  if(state!=='play')return;
  survived+=1/60;
  pens.forEach(p=>{
    p.hunger-=p.drain*(1+survived*0.01);
    if(p.hunger<=0){
      p.hunger=0;
      state='over';
      SFX.lose();
      saveBest(Math.floor(survived));
    }
  });
}

function draw(){
  ctx.fillStyle='#33691e';ctx.fillRect(0,0,W,H);
  pens.forEach((p,i)=>{
    const col=i%COLS,row=Math.floor(i/COLS);
    const x=col*CELL_W,y=row*CELL_H;
    ctx.fillStyle='rgba(255,255,255,.06)';
    ctx.fillRect(x+6,y+6,CELL_W-12,CELL_H-12);

    ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.emoji,x+CELL_W/2,y+CELL_H/2-14);

    const barW=CELL_W-30;
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.fillRect(x+15,y+CELL_H-30,barW,10);
    ctx.fillStyle=p.hunger>40?'#66bb6a':p.hunger>15?'#ffca28':'#ef5350';
    ctx.fillRect(x+15,y+CELL_H-30,barW*(p.hunger/100),10);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#aed581';ctx.font='bold 26px Arial';
    ctx.fillText('ZOO CLOSED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Survived: ${Math.floor(survived)}s | Best: ${loadBest()}s`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){}

init();draw();
setInterval(()=>{document.getElementById('ui').textContent=`Survived: ${Math.floor(survived)}s | Best: ${loadBest()}s`;},200);
</script></body></html>
