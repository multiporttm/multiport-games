<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#37474f,#78909c);display:block;border-radius:8px;touch-action:none}
#score-display{color:#b0bec5;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Storm Chasing</div>
  <div class="game-frame">
    <div id="score-display">Footage: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b> or <b>drag</b> to drive toward the tornado. Get close for more footage points (but not too close!) while dodging flying debris. Getting hit costs a life.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let hi=parseInt(localStorage.getItem('stormchasing_hi')||'0',10);
let score=0,lives=3,gameOver=false,started=false,frame=0;
let level=1;
const SAFE_MIN=70, DANGER=40;
const car={x:120,y:H-80,r:16};
let tornado={x:W-150,y:H/2,r:50,angle:0};
let debris=[];
const keys={};
let targetPos=null,dragging=false;
let hitFlash=0;

function reset(){
  score=0;lives=3;gameOver=false;started=false;frame=0;level=1;
  car.x=120;car.y=H-80;
  tornado.x=W-150;tornado.y=H/2;
  debris=[];
}
reset();

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
  if(!started&&!gameOver)started=true;
  if(gameOver)reset();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};
}
c.addEventListener('mousedown',e=>{dragging=true;if(!started&&!gameOver)started=true;if(gameOver)reset();targetPos=pointerPos(e);});
c.addEventListener('mousemove',e=>{if(dragging)targetPos=pointerPos(e);});
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;if(!started&&!gameOver)started=true;if(gameOver)reset();targetPos=pointerPos(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)targetPos=pointerPos(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});

function rand(a,b){return a+Math.random()*(b-a);}

function spawnDebris(){
  const side=Math.floor(Math.random()*4);
  let x,y,vx,vy;
  if(side===0){x=-20;y=rand(0,H);}
  else if(side===1){x=W+20;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=-20;}
  else{x=rand(0,W);y=H+20;}
  const ang=Math.atan2(tornado.y-y,tornado.x-x)+rand(-0.6,0.6);
  const spd=rand(2,3.5)+level*0.2;
  vx=Math.cos(ang)*spd;vy=Math.sin(ang)*spd;
  debris.push({x,y,vx,vy,r:rand(8,16),rot:0,rotSpd:rand(-0.2,0.2)});
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function updateCar(){
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(dx||dy){
    const len=Math.hypot(dx,dy);
    car.x+=dx/len*3.6;car.y+=dy/len*3.6;
    targetPos=null;
  } else if(targetPos){
    const d=dist(car,targetPos);
    if(d>4){car.x+=(targetPos.x-car.x)/d*3.8;car.y+=(targetPos.y-car.y)/d*3.8;}
  }
  car.x=Math.max(car.r,Math.min(W-car.r,car.x));
  car.y=Math.max(car.r,Math.min(H-car.r,car.y));
}

function drawTornado(){
  ctx.save();
  ctx.translate(tornado.x,tornado.y);
  for(let i=0;i<5;i++){
    const rr=tornado.r*(1-i*0.15);
    ctx.beginPath();
    ctx.ellipse(0,i*10-20,rr,rr*0.4,tornado.angle+i*0.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(150,150,160,${0.5-i*0.06})`;
    ctx.fill();
  }
  ctx.restore();
  // danger ring
  ctx.strokeStyle='rgba(255,80,80,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(tornado.x,tornado.y,SAFE_MIN,0,Math.PI*2);ctx.stroke();
}

function drawCar(){
  ctx.save();
  ctx.translate(car.x,car.y);
  ctx.fillStyle=hitFlash>0?'#ff5252':'#ffca28';
  ctx.fillRect(-16,-10,32,20);
  ctx.fillStyle='#37474f';
  ctx.fillRect(-10,-14,20,8);
  ctx.restore();
}

function drawDebris(d){
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.rotate(d.rot);
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(-d.r/2,-d.r/2,d.r,d.r);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#263238');g.addColorStop(1,'#8d9ba3');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5d4037';ctx.fillRect(0,H-30,W,30);

  if(gameOver){
    drawTornado();
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('chase_over','CHASE OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Move or press a key to chase again'),W/2,H/2+16);
    updateHud();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    drawTornado();drawCar();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Move toward the storm to start!'),W/2,30);
    requestAnimationFrame(loop);
    return;
  }

  frame++;
  tornado.angle+=0.05;
  tornado.x+=Math.sin(frame/150)*0.6;
  tornado.y+=Math.cos(frame/200)*0.3;
  tornado.x=Math.max(200,Math.min(W-80,tornado.x));
  tornado.y=Math.max(80,Math.min(H-80,tornado.y));

  level=1+Math.floor(score/300);
  if(Math.random()<0.02+level*0.004)spawnDebris();

  updateCar();

  debris=debris.filter(d=>d.x>-40&&d.x<W+40&&d.y>-40&&d.y<H+40);
  debris.forEach(d=>{
    d.x+=d.vx;d.y+=d.vy;d.rot+=d.rotSpd;
    drawDebris(d);
    if(dist(car,d)<car.r+d.r/2&&hitFlash<=0){
      lives--;hitFlash=40;SFX.hit();
      if(lives<=0)endGame();
    }
  });

  drawTornado();
  drawCar();
  if(hitFlash>0)hitFlash--;

  const d=dist(car,tornado);
  if(d<DANGER&&hitFlash<=0){
    lives--;hitFlash=40;SFX.error();
    if(lives<=0)endGame();
  } else if(d>=SAFE_MIN-30&&d<=SAFE_MIN+120){
    const closeness=Math.max(0,SAFE_MIN+120-d);
    score+=closeness*0.02;
    if(frame%20===0)SFX.tick();
  }

  if(score>hi){hi=score;localStorage.setItem('stormchasing_hi',Math.floor(hi));}

  updateHud();
  requestAnimationFrame(loop);
}

function endGame(){
  gameOver=true;
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem('stormchasing_hi',Math.floor(hi));}
}

function updateHud(){
  document.getElementById('score-display').textContent =
    I18N.t('stormchasing_hud','Footage: {s} | Hi: {h} | Lives: {l}')
      .replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)).replace('{l}',Math.max(0,lives));
}

loop();
</script></body></html>
