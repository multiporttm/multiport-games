<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3a2d1e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8c07a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Animal Enclosure Cleaning</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Clean the enclosure in the right order before time runs out. Use <b>Arrow Keys</b> + <b>Space/Enter</b>, number keys <b>1-4</b>, or <b>Tap/Click</b> each station. Follow the order shown at the top: scrub, bedding, water, enrichment. 3 mistakes and you're out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HS_KEY='hs_animalenclosurecleaning';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const STATIONS=[
  {key:'scrub',icon:'🧽',label:()=>I18N.t('st_scrub','Scrub')},
  {key:'bedding',icon:'🛏️',label:()=>I18N.t('st_bedding','Bedding')},
  {key:'water',icon:'💧',label:()=>I18N.t('st_water','Water')},
  {key:'enrich',icon:'🎯',label:()=>I18N.t('st_enrich','Enrichment')}
];
const stationBoxes=[];
(function layout(){
  const n=STATIONS.length, gap=20, w=(W-gap*(n+1))/n, h=180, y=190;
  for(let i=0;i<n;i++) stationBoxes.push({x:gap+i*(w+gap),y,w,h});
})();

let level=1,score=0,lives=3,gameOver=false,won=false,started=false;
let order=[],stepIndex=0,sel=0;
let timeLeft=0,timeLimit=0,lastTime=null;
let flashBox=-1,flashColor=null,flashTimer=0;
let animalReturning=false,animalTimer=0;

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newLevel(){
  order=shuffle([0,1,2,3]);
  stepIndex=0;
  timeLimit=Math.max(13,26-level*1.5);
  timeLeft=timeLimit;
  sel=0;
  animalReturning=false;
}

function resetGame(){
  level=1;score=0;lives=3;gameOver=false;won=false;started=false;lastTime=null;
  newLevel();
}
resetGame();

function flash(i,color){flashBox=i;flashColor=color;flashTimer=18;}

function activate(i){
  if(gameOver||!started||animalReturning)return;
  const want=order[stepIndex];
  if(i===want){
    score+=10*level;
    flash(i,'#4caf50');
    SFX.point();
    stepIndex++;
    if(stepIndex>=order.length){
      score+=50*level;
      SFX.levelup();
      animalReturning=true;
      animalTimer=55;
    }
  } else {
    lives--;
    flash(i,'#e94560');
    SFX.error();
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
    }
  }
}

function startGame(){ if(!started){started=true;} }

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','1','2','3','4'].includes(e.key))e.preventDefault();
  if(gameOver){ if(e.key===' '||e.key==='Enter')resetGame(); return; }
  startGame();
  if(e.key==='ArrowLeft'){sel=(sel+3)%4;SFX.select();}
  else if(e.key==='ArrowRight'){sel=(sel+1)%4;SFX.select();}
  else if(e.key===' '||e.key==='Enter'){activate(sel);}
  else if(e.key>='1'&&e.key<='4'){sel=parseInt(e.key,10)-1;activate(sel);}
});

function posFromEvent(evt){
  const r=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-r.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}
function handlePointer(evt){
  evt.preventDefault();
  if(gameOver){resetGame();return;}
  startGame();
  const p=posFromEvent(evt);
  for(let i=0;i<stationBoxes.length;i++){
    const b=stationBoxes[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sel=i;activate(i);return;}
  }
}
c.addEventListener('pointerdown',handlePointer);
c.addEventListener('touchstart',handlePointer,{passive:false});

function drawStation(i){
  const b=stationBoxes[i],st=STATIONS[i];
  ctx.save();
  let bg='#4a3a28';
  if(i===sel)bg='#5c4830';
  if(flashBox===i&&flashTimer>0)bg=flashColor;
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,14):ctx.rect(b.x,b.y,b.w,b.h);ctx.fill();
  if(i===sel){ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;ctx.stroke();}
  ctx.font='64px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(st.icon,b.x+b.w/2,b.y+70);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
  ctx.fillText(st.label(),b.x+b.w/2,b.y+140);
  const orderPos=order.indexOf(i);
  ctx.fillStyle='#ffd54f';ctx.font='bold 22px Arial';
  ctx.fillText(orderPos<stepIndex?'✓':String(orderPos+1),b.x+b.w/2,b.y+165);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#2a1f14');sky.addColorStop(1,'#4a3a28');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),16,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',lives),W-16,30);

  ctx.textAlign='center';
  if(!started&&!gameOver){
    ctx.fillStyle='#e8c07a';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap a station to start'),W/2,100);
  } else if(animalReturning){
    ctx.fillStyle='#4caf50';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('enclosure_clean','Enclosure clean! Animal returning...'),W/2,100);
  } else {
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('order_hint','Follow the numbered order below'),W/2,70);
    // timer bar
    const pct=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle='#222';ctx.fillRect(W/2-200,80,400,16);
    ctx.fillStyle=pct>0.3?'#4caf50':'#e94560';
    ctx.fillRect(W/2-200,80,400*pct,16);
  }

  stationBoxes.forEach((b,i)=>drawStation(i));

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
  }

  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));

  if(flashTimer>0){flashTimer--; if(flashTimer<=0)flashBox=-1;}
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(started&&!gameOver){
    if(animalReturning){
      animalTimer-=dt*60;
      if(animalTimer<=0){level++;newLevel();}
    } else {
      timeLeft-=dt;
      if(timeLeft<=0){
        lives--;
        SFX.hurt();
        if(lives<=0){
          gameOver=true;SFX.lose();
          if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
        } else {
          newLevel();
        }
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
