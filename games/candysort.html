<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4a148c;cursor:pointer}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Candy Sort Factory</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Sorted: 0 | Missed: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Candies slide down 3 lanes. Tap a candy while it's in a lane, then tap the matching color bin at the bottom to sort it — wrong bin or reaching the bottom unsorted counts as a miss.</div>
</div>
<script>
const W=360,H=360,LANES=3,LANE_W=W/LANES;
const COLORS=[{n:'red',c:'#e53935'},{n:'yellow',c:'#fdd835'},{n:'green',c:'#43a047'}];
let candies,selected,sorted,missed,speed,spawnTimer,state;

function loadBest(){return +(localStorage.getItem('candysort_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('candysort_best',v);}

function init(){
  candies=[];sorted=0;missed=0;speed=1.2;spawnTimer=0;selected=null;state='play';
}

function spawnCandy(){
  const lane=Math.floor(Math.random()*LANES);
  const color=Math.floor(Math.random()*COLORS.length);
  candies.push({lane,color,y:-20,id:Math.random()});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
const BIN_Y=H-50;

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);

  if(y>BIN_Y){
    const binIdx=Math.floor(x/(W/COLORS.length));
    if(selected!=null){
      const cand=candies.find(c2=>c2.id===selected);
      if(cand){
        if(cand.color===binIdx){
          sorted++;SFX.success();saveBest(sorted);
        }else{
          missed++;SFX.error();
        }
        candies=candies.filter(c2=>c2.id!==selected);
      }
      selected=null;
      updateUI();
    }
    return;
  }

  const lane=Math.floor(x/LANE_W);
  let closest=null,minDist=9999;
  candies.forEach(cd=>{
    if(cd.lane===lane){
      const d=Math.abs(cd.y-y);
      if(d<minDist){minDist=d;closest=cd;}
    }
  });
  if(closest&&minDist<30){selected=closest.id;SFX.tick();}
});

function update(){
  if(state!=='play')return;
  spawnTimer--;
  if(spawnTimer<=0){
    spawnCandy();
    spawnTimer=Math.max(35,80-sorted*0.8);
  }
  speed=1.2+sorted*0.015;
  candies.forEach(cd=>cd.y+=speed);
  const escaped=candies.filter(cd=>cd.y>BIN_Y);
  if(escaped.length){
    missed+=escaped.length;
    SFX.error();
    candies=candies.filter(cd=>cd.y<=BIN_Y);
    updateUI();
  }
  if(missed>=8){
    state='over';
    SFX.lose();
    saveBest(sorted);
  }
}

function draw(){
  ctx.fillStyle='#4a148c';ctx.fillRect(0,0,W,H);
  for(let l=1;l<LANES;l++){
    ctx.strokeStyle='rgba(255,255,255,.15)';
    ctx.beginPath();ctx.moveTo(l*LANE_W,0);ctx.lineTo(l*LANE_W,BIN_Y);ctx.stroke();
  }

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  candies.forEach(cd=>{
    ctx.fillStyle=COLORS[cd.color].c;
    ctx.beginPath();ctx.arc(cd.lane*LANE_W+LANE_W/2,cd.y,14,0,Math.PI*2);ctx.fill();
    if(cd.id===selected){
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.stroke();
    }
  });

  COLORS.forEach((col,i)=>{
    const x=i*(W/COLORS.length);
    ctx.fillStyle=col.c;
    ctx.fillRect(x+4,BIN_Y,W/COLORS.length-8,50);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ce93d8';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('belt_jammed_title','BELT JAMMED'), W/2, H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('sorted_best_label','Sorted: {n} | Best: {b}').replace('{n}',sorted).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint2','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('sorted_label','Sorted: {n}').replace('{n}',sorted)+' | '+I18N.t('missed_label','Missed: {n}/8').replace('{n}',missed);
}

init();draw();
</script></body></html>
