<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Souffle Baking</title><meta name="description" content="Play Souffle Baking free online — Watch the souffle rise in the oven and click Take Out right at the peak before it collapses for a perfect bake."><link rel="canonical" href="https://games.multiportllc.com/games/soufflebaking"><meta property="og:title" content="Souffle Baking - Multiport Games"><meta property="og:description" content="Play Souffle Baking free online — Watch the souffle rise in the oven and click Take Out right at the peak before it collapses for a perfect bake."><meta property="og:url" content="https://games.multiportllc.com/games/soufflebaking"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Souffle Baking","description":"Play Souffle Baking free online instantly. Watch the souffle rise in the oven and click Take Out right at the peak before it collapses for a perfect bake. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/soufflebaking","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(180deg,#3b1f0e 0%,#1a0e06 100%);display:block;border-radius:8px}
#score-display{color:#ffca28;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#takeout-btn{display:block;margin:10px auto 0;padding:12px 34px;font-size:1.15rem;font-weight:800;border:none;border-radius:24px;background:#ffca28;color:#3b1f0e;cursor:pointer;box-shadow:0 4px 0 #b8860b;transition:transform .08s}
#takeout-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Souffle Baking</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="320"></canvas>
    <button id="takeout-btn">Take Out!</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the souffle rise in the oven, then click <b>Take Out</b> right at the peak — before it collapses — for a perfect bake. Timing is everything!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const btn=document.getElementById('takeout-btn');
let score=0,hi=parseFloat(localStorage.getItem('souffle_hi')||'0'),lives=3,perfectCount=0,batches=0;
let gameOver=false,started=false;
let t=0,peakTime=0,riseDur=0,fallDur=0,phase='rising',height=0,maxHeight=0,resultMsg='',resultTimer=0,resultColor='#fff';
let wobble=0;

function newBatch(){
  batches++;
  // difficulty ramps: peak window gets narrower and randomized
  riseDur=90-Math.min(30,batches*2)+Math.random()*20; // frames to reach peak
  fallDur=70+Math.random()*20;
  peakTime=riseDur;
  t=0;
  phase='rising';
  height=0;
  maxHeight=140+Math.random()*20;
  resultMsg='';
}

function reset(){
  score=0;lives=3;perfectCount=0;batches=0;gameOver=false;started=false;
  newBatch();
}
reset();

function takeOut(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(phase==='collapsed'||resultMsg)return; // already resolved, ignore until next batch draws
  const distFromPeak=Math.abs(t-peakTime);
  let pts=0,msg='',color='#4caf50';
  if(phase==='collapsed_wait'){} // unused
  if(distFromPeak<=4){
    pts=100;msg=I18N.t('perfect_bake','PERFECT SOUFFLE! +100');color='#4caf50';perfectCount++;SFX.success();
  }else if(distFromPeak<=10){
    pts=50;msg=I18N.t('good_bake','Good bake! +50');color='#8bc34a';SFX.point();
  }else if(distFromPeak<=20){
    pts=20;msg=I18N.t('okay_bake','Okay bake +20');color='#ffca28';SFX.coin();
  }else{
    pts=5;msg=I18N.t('meh_bake','Undercooked/overcooked +5');color='#ff9800';SFX.click();
  }
  score+=pts;
  if(score>hi){hi=score;localStorage.setItem('souffle_hi',hi);}
  resultMsg=msg;resultColor=color;resultTimer=70;
  phase='resolved';
}

function collapse(){
  phase='collapsed';
  resultMsg=I18N.t('collapsed_msg','COLLAPSED! Lost a life');
  resultColor='#e53935';
  resultTimer=70;
  lives--;
  SFX.fail();
  if(lives<=0){gameOver=true;SFX.lose();}
}

btn.addEventListener('click',takeOut);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();takeOut();}});
c.addEventListener('click',()=>{if(!started)takeOut();else if(gameOver)reset();});
c.addEventListener('touchstart',e=>{e.preventDefault();if(!started)takeOut();else if(gameOver)reset();},{passive:false});

function drawOven(){
  // oven frame
  ctx.fillStyle='#20120a';
  ctx.fillRect(40,40,720,240);
  ctx.strokeStyle='#5a3a1e';ctx.lineWidth=8;
  ctx.strokeRect(40,40,720,240);
  // dish
  ctx.fillStyle='#cfcfcf';
  ctx.fillRect(340,240,120,20);
  ctx.fillStyle='#9e9e9e';
  ctx.fillRect(330,255,140,14);
}

function drawSouffle(h){
  const baseX=400,baseY=255;
  const w=90+wobble;
  ctx.save();
  // ramekin
  ctx.fillStyle='#e0c9a6';
  ctx.beginPath();
  ctx.moveTo(baseX-55,baseY);
  ctx.lineTo(baseX+55,baseY);
  ctx.lineTo(baseX+48,baseY-h);
  ctx.lineTo(baseX-48,baseY-h);
  ctx.closePath();
  ctx.fill();
  // souffle top puff
  ctx.fillStyle='#f4d58d';
  ctx.beginPath();
  ctx.ellipse(baseX,baseY-h,w/2,26,0,0,Math.PI*2);
  ctx.fill();
  // golden browning gradient near peak/overcook
  if(h>maxHeight*0.85){
    ctx.fillStyle='rgba(139,90,43,0.35)';
    ctx.beginPath();
    ctx.ellipse(baseX,baseY-h,w/2-4,20,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMeterAndZones(){
  const mx=680,my=60,mw=26,mh=200;
  ctx.fillStyle='#2a2a2a';ctx.fillRect(mx,my,mw,mh);
  const progress=Math.min(1,t/(riseDur+fallDur));
  const fillH=mh*Math.min(1,height/maxHeight);
  ctx.fillStyle='#ffca28';
  ctx.fillRect(mx,my+mh-fillH,mw,fillH);
  // peak marker line
  const peakFrac=1; // peak = maxHeight
  ctx.strokeStyle='#4caf50';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(mx-4,my);ctx.lineTo(mx+mw+4,my);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText('PEAK',mx+mw/2,my-8);
}

function loop(){
  ctx.clearRect(0,0,800,320);
  drawOven();

  if(!started){
    ctx.fillStyle='#ffca28cc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to start baking'),400,180);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawSouffle(height);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,800,320);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,140);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('perfect_count_label','Perfect souffles: {n}').replace('{n}',perfectCount),400,175);
    ctx.fillText(I18N.t('restart_hint','Tap or Click to restart'),400,205);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  wobble=Math.sin(t/6)*3;

  if(!resultMsg||phase==='resolved'&&resultTimer>0){
    // continue showing outcome, keep souffle frozen/falling out of view briefly
  }

  if(phase==='rising'){
    t++;
    height=maxHeight*Math.min(1,(t/riseDur));
    // ease
    height=maxHeight*(1-Math.pow(1-Math.min(1,t/riseDur),2));
    if(t>=riseDur){phase='falling';t=riseDur;}
  }else if(phase==='falling'){
    t++;
    const ft=t-riseDur;
    height=maxHeight*(1-Math.pow(ft/fallDur,2));
    if(height<=0){height=0;if(!gameOver)collapse();}
  }else if(phase==='resolved'){
    // slowly fall after taken out, freeze visual near current height then fade
    resultTimer--;
    if(resultTimer<=0){newBatch();}
  }else if(phase==='collapsed'){
    resultTimer--;
    if(resultTimer<=0&&!gameOver){newBatch();}
  }

  drawSouffle(Math.max(0,height));
  drawMeterAndZones();

  if(resultMsg){
    ctx.fillStyle=resultColor;
    ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,400,70);
  }else{
    ctx.fillStyle='#ffca28';
    ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bake_hint','Take it out at the peak!'),400,70);
  }

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('score_hi_lives_label','Score: {s} | Hi: {h} | Lives: {l}')
      .replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)).replace('{l}',lives);
}

loop();
</script></body></html>
