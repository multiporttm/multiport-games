<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4e342e;cursor:pointer}
#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#goBtn{display:block;margin:6px auto;padding:10px 26px;border-radius:10px;background:#ffb300;color:#3e2723;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Domino Rally</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Placed: 0/12 | Round: 1</div>
    <canvas id="c" width="360" height="360"></canvas>
    <button id="goBtn">🁢 TOPPLE!</button>
  </div>
  <div class="game-instructions">Tap the empty slots to place dominoes along the path — you need at least 8 of the 12 placed. Then hit TOPPLE to set off the chain reaction and watch them fall in sequence!</div>
</div>
<script>
const W=360,H=360;
let slots,placed,round,state,toppling,toppleIdx,toppleT;

function loadBest(){return +(localStorage.getItem('dominorally_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('dominorally_best',v);}

function init(){round=1;state='play';newRound();}
function newRound(){
  slots=[];
  const n=12;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    slots.push({
      x:30+t*(W-60)+Math.sin(t*Math.PI*2)*20,
      y:80+t*180,
      placed:false,fallen:false,angle:0
    });
  }
  placed=0;toppling=false;toppleIdx=0;toppleT=0;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  if(toppling)return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const slot=slots.find(s=>!s.placed&&Math.hypot(s.x-x,s.y-y)<22);
  if(slot){
    slot.placed=true;placed++;
    SFX.click();
    updateUI();
  }
});

document.getElementById('goBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(toppling||placed<8)return;
  toppling=true;toppleIdx=0;toppleT=0;
  SFX.swoosh();
});

function update(){
  if(state!=='play'||!toppling)return;
  toppleT++;
  if(toppleT>=8){
    toppleT=0;
    if(toppleIdx<slots.length){
      if(slots[toppleIdx].placed){slots[toppleIdx].fallen=true;SFX.tick();}
      else{
        toppling=false;
        SFX.fail();
        setTimeout(()=>{newRound();},1200);
        return;
      }
      toppleIdx++;
    }else{
      toppling=false;
      round++;
      SFX.win();
      saveBest(round-1);
      setTimeout(newRound,1200);
    }
  }
}

function draw(){
  ctx.fillStyle='#4e342e';ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;
  ctx.beginPath();
  slots.forEach((s,i)=>{if(i===0)ctx.moveTo(s.x,s.y);else ctx.lineTo(s.x,s.y);});
  ctx.stroke();

  slots.forEach(s=>{
    ctx.save();
    ctx.translate(s.x,s.y);
    if(s.fallen)ctx.rotate(Math.PI/2*0.8);
    if(s.placed){
      ctx.fillStyle=s.fallen?'#8d6e63':'#ffcc80';
      ctx.fillRect(-6,-16,12,32);
      ctx.fillStyle='#3e2723';
      ctx.beginPath();ctx.arc(0,-8,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(0,8,2,0,Math.PI*2);ctx.fill();
    }else{
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
      ctx.strokeRect(-8,-8,16,16);
    }
    ctx.restore();
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcc80';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('GAME OVER',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Best round: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Placed: ${placed}/12 | Round: ${round}`;
}

init();draw();
</script></body></html>
