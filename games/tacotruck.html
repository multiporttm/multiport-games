<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{padding:18px;text-align:center;background:linear-gradient(135deg,#e65100,#ffb74d)}
#hud{display:flex;justify-content:space-between;max-width:520px;margin:0 auto 12px;color:#2b1200;font-weight:800;font-size:1.05rem;text-shadow:0 1px 0 rgba(255,255,255,.3)}
#orderCard{background:#fff8ec;border-radius:14px;padding:14px;max-width:460px;margin:0 auto 14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#orderCard h3{margin:0 0 8px;color:#e65100;font-size:1rem}
#orderStack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;min-height:60px}
#orderStack span{background:#ffe0b2;border-radius:8px;padding:4px 12px;font-size:1.4rem;border:2px solid #e65100}
#timerBarOuter{height:10px;background:rgba(0,0,0,.25);border-radius:6px;max-width:460px;margin:0 auto 14px;overflow:hidden}
#timerBar{height:100%;background:#4caf50;width:100%;transition:width .1s linear}
#buildArea{background:#3e2723;border-radius:14px;padding:12px;max-width:460px;margin:0 auto 14px;min-height:70px}
#buildStack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
#buildStack span{background:#ffe0b2;border-radius:8px;padding:4px 12px;font-size:1.4rem;border:2px solid #8d6e63}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px;margin:0 auto 14px}
#tray button{font-size:1.6rem;padding:10px 14px;border-radius:12px;border:none;background:#fff3e0;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .1s}
#tray button:active{transform:scale(.92)}
#actions{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
#actions button{padding:10px 26px;font-size:1.05rem;font-weight:800;border:none;border-radius:20px;cursor:pointer}
#serveBtn{background:#2e7d32;color:#fff}
#clearBtn{background:#c62828;color:#fff}
#msg{min-height:1.6em;font-weight:800;color:#2b1200;margin-bottom:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Taco Truck</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud"><span id="servedDisp">Served: 0</span><span id="hiDisp">Best: 0</span><span id="livesDisp">Lives: 3</span></div>
      <div id="orderCard">
        <h3 id="orderLabel">Order #1</h3>
        <div id="orderStack"></div>
      </div>
      <div id="timerBarOuter"><div id="timerBar"></div></div>
      <div id="buildArea"><div id="buildStack"></div></div>
      <div id="tray"></div>
      <div id="msg"></div>
      <div id="actions">
        <button id="serveBtn">Serve</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the ingredients in the exact order shown on the order card (bottom to top), then click <b>Serve</b> before the timer runs out. A wrong order or a missed timer costs a life!</div>
</div>
<script>
const INGREDIENTS=[
  {id:'tortilla',emoji:'🫓',name:'Tortilla',base:true},
  {id:'beef',emoji:'🥩',name:'Beef'},
  {id:'chicken',emoji:'🍗',name:'Chicken'},
  {id:'lettuce',emoji:'🥬',name:'Lettuce'},
  {id:'tomato',emoji:'🍅',name:'Tomato'},
  {id:'cheese',emoji:'🧀',name:'Cheese'},
  {id:'onion',emoji:'🧅',name:'Onion'},
  {id:'avocado',emoji:'🥑',name:'Avocado'},
  {id:'pepper',emoji:'🌶️',name:'Pepper'},
];
const byId={};INGREDIENTS.forEach(i=>byId[i.id]=i);

let served=0,hi=0,lives=3,order=[],built=[],round=1,timer=0,timerMax=1,timerHandle=null,gameOver=false;

hi=parseInt(localStorage.getItem('tacotruck_hi')||'0',10);

function randToppings(n){
  const pool=INGREDIENTS.filter(i=>!i.base && i.id!=='beef' && i.id!=='chicken');
  const shuffled=pool.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0,n).map(i=>i.id);
}

function newOrder(){
  const meat=Math.random()<0.5?'beef':'chicken';
  const toppingCount=Math.min(2+Math.floor(round/2),6);
  const toppings=randToppings(toppingCount);
  order=['tortilla',meat,...toppings];
  built=[];
  timerMax=Math.max(5,14-round*0.6);
  timer=timerMax;
  document.getElementById('orderLabel').textContent=I18N.t('order_label','Order #{n}').replace('{n}',served+1);
  renderOrder();
  renderBuild();
  setMsg('');
  startTimer();
}

function startTimer(){
  clearInterval(timerHandle);
  const start=performance.now();
  timerHandle=setInterval(()=>{
    const elapsed=(performance.now()-start)/1000;
    timer=timerMax-elapsed;
    const pct=Math.max(0,timer/timerMax)*100;
    document.getElementById('timerBar').style.width=pct+'%';
    document.getElementById('timerBar').style.background=pct>50?'#4caf50':pct>20?'#ffb300':'#e53935';
    if(timer<=0){
      clearInterval(timerHandle);
      failAttempt(I18N.t('time_up','Time\'s up!'));
    }
  },50);
}

function renderOrder(){
  const el=document.getElementById('orderStack');
  el.innerHTML='';
  order.forEach(id=>{
    const s=document.createElement('span');
    s.textContent=byId[id].emoji;
    el.appendChild(s);
  });
}

function renderBuild(){
  const el=document.getElementById('buildStack');
  el.innerHTML='';
  built.forEach(id=>{
    const s=document.createElement('span');
    s.textContent=byId[id].emoji;
    el.appendChild(s);
  });
}

function renderTray(){
  const el=document.getElementById('tray');
  el.innerHTML='';
  INGREDIENTS.forEach(ing=>{
    const b=document.createElement('button');
    b.textContent=ing.emoji;
    b.title=ing.name;
    b.onclick=()=>addIngredient(ing.id);
    el.appendChild(b);
  });
}

function addIngredient(id){
  if(gameOver)return;
  built.push(id);
  renderBuild();
  SFX.click();
}

function setMsg(t){document.getElementById('msg').textContent=t;}

function clearBuild(){
  if(gameOver)return;
  built=[];
  renderBuild();
}

function failAttempt(msg){
  lives--;
  SFX.fail();
  updateHud();
  setMsg(msg+' '+I18N.t('lost_life','Lost a life!'));
  if(lives<=0){
    endGame();
  }else{
    setTimeout(()=>{ if(!gameOver) newOrder(); },1000);
  }
}

function serve(){
  if(gameOver)return;
  clearInterval(timerHandle);
  const correct = built.length===order.length && built.every((v,i)=>v===order[i]);
  if(correct){
    served++;
    round++;
    SFX.success();
    setMsg(I18N.t('order_served','Order served! Nice work.'));
    updateHud();
    if(served>hi){hi=served;localStorage.setItem('tacotruck_hi',hi);}
    setTimeout(()=>{ if(!gameOver) newOrder(); },700);
  }else{
    failAttempt(I18N.t('wrong_order','Wrong order!'));
  }
}

function updateHud(){
  document.getElementById('servedDisp').textContent=I18N.t('served_label','Served: {n}').replace('{n}',served);
  document.getElementById('hiDisp').textContent=I18N.t('best_label','Best: {n}').replace('{n}',hi);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',Math.max(0,lives));
}

function endGame(){
  gameOver=true;
  clearInterval(timerHandle);
  setMsg(I18N.t('game_over_msg','GAME OVER — Tap Clear then Serve is disabled. Refresh-free restart below.'));
  document.getElementById('orderLabel').textContent=I18N.t('game_over_title','GAME OVER');
  const restartBtn=document.createElement('button');
  restartBtn.textContent=I18N.t('restart_btn','Play Again');
  restartBtn.style.cssText='padding:10px 26px;font-size:1.05rem;font-weight:800;border:none;border-radius:20px;cursor:pointer;background:#e65100;color:#fff;margin-top:8px';
  restartBtn.onclick=()=>{ restartBtn.remove(); startGame(); };
  document.getElementById('msg').appendChild(document.createElement('br'));
  document.getElementById('msg').appendChild(restartBtn);
}

function startGame(){
  served=0;lives=3;round=1;gameOver=false;
  updateHud();
  newOrder();
}

document.getElementById('serveBtn').onclick=serve;
document.getElementById('clearBtn').onclick=clearBuild;

renderTray();
startGame();
</script></body></html>
