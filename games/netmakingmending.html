<style>
body{background:#08080f}
#c{background:#0b3d4a;display:block;border-radius:8px;touch-action:none}
#hud{color:#e8d9b5;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#tideBarWrap{max-width:760px;margin:0 auto 6px;background:#042028;border-radius:8px;overflow:hidden;height:10px}
#tideBar{height:10px;background:linear-gradient(90deg,#4fd1c5,#1a936f);width:100%;transition:width .15s linear}
#ctrlRow{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
#ctrlRow button{padding:12px 20px;background:#c9a24b;border:none;border-radius:12px;color:#2a1a08;font-weight:800;font-size:1rem;cursor:pointer;min-width:84px}
#ctrlRow button:active{transform:scale(.92)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Net Making Mending</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreLbl">Score: 0 | Hi: 0</span>
      <span id="levelLbl">Round 1</span>
    </div>
    <div id="tideBarWrap"><div id="tideBar"></div></div>
    <canvas id="c" width="800" height="440"></canvas>
    <div id="ctrlRow">
      <button id="btnPrev">◀ Prev</button>
      <button id="btnTie">Tie Knot</button>
      <button id="btnNext">Next ▶</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>order diagram</b> at the top, then tap/click the torn <b>mesh knots</b> in that exact order (or use <b>Arrow Keys</b> + <b>Space/Enter</b>) to re-tie each hole before the <b>tide timer</b> runs out. Each round brings more holes and trickier tears.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HI_KEY='netmakingmending_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,round=1,lives=3,gameOver=false,started=false;
let knots=[],order=[],nextIdx=0,selected=0,tide=1,tideSpeed=0.0016,flashTimer=0,flashMsg='',roundIntro=true;

function rnd(a,b){return a+Math.random()*(b-a);}

function genRound(){
  const n=Math.min(4+round,10);
  knots=[];
  const cols=Math.min(5,2+Math.ceil(n/2));
  const rows=Math.ceil(n/cols);
  const marginX=90,marginY=130,spanX=(W-2*marginX)/(Math.max(1,cols-1)||1),spanY=(H-marginY-60)/(Math.max(1,rows-1)||1);
  let placed=0;
  for(let r=0;r<rows&&placed<n;r++){
    for(let cc=0;cc<cols&&placed<n;cc++){
      const jitterX=rnd(-14,14),jitterY=rnd(-10,10);
      const x=marginX+cc*spanX+jitterX;
      const y=marginY+r*spanY+jitterY;
      knots.push({x,y,tied:false,id:placed});
      placed++;
    }
  }
  order=knots.map(k=>k.id);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  nextIdx=0;
  selected=0;
  tide=1;
  tideSpeed=0.0014+round*0.00016;
  roundIntro=true;
  flashTimer=90;
  flashMsg=I18N.t('round_label','Round {n}').replace('{n}',round);
}

function reset(){
  score=0;round=1;lives=3;gameOver=false;started=false;
  genRound();
}
reset();

function tieSelected(){
  if(gameOver||!started||roundIntro)return;
  const k=knots[selected];
  if(!k||k.tied)return;
  const wanted=order[nextIdx];
  if(k.id===wanted){
    k.tied=true;
    nextIdx++;
    score+=15+round*2;
    SFX.success();
    if(nextIdx>=order.length){
      score+=40;
      SFX.levelup();
      round++;
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
      genRound();
    } else {
      // advance selection to the next unfinished knot by proximity
      let best=-1,bd=1e9;
      knots.forEach((kk,i)=>{if(!kk.tied){const d=Math.hypot(kk.x-k.x,kk.y-k.y);if(d<bd){bd=d;best=i;}}});
      if(best>=0)selected=best;
    }
  } else {
    lives--;
    SFX.error();
    flashTimer=40;
    flashMsg=I18N.t('wrong_knot','Wrong knot! Follow the diagram order.');
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
    }
  }
}

function moveSelect(dir){
  if(!knots.length)return;
  const untied=knots.map((k,i)=>({k,i})).filter(o=>!o.k.tied);
  if(!untied.length)return;
  let idx=untied.findIndex(o=>o.i===selected);
  if(idx<0)idx=0;
  idx=(idx+dir+untied.length)%untied.length;
  selected=untied[idx].i;
}

function clickAt(px,py){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(roundIntro){roundIntro=false;return;}
  let best=-1,bd=26;
  knots.forEach((k,i)=>{if(k.tied)return;const d=Math.hypot(k.x-px,k.y-py);if(d<bd){bd=d;best=i;}});
  if(best>=0){selected=best;tieSelected();}
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  clickAt((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];const r=c.getBoundingClientRect();
  clickAt((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){if(e.key===' '||e.key==='Enter')reset();return;}
  if(roundIntro){roundIntro=false;return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')moveSelect(-1);
  else if(e.key==='ArrowRight'||e.key==='ArrowDown')moveSelect(1);
  else if(e.key===' '||e.key==='Enter')tieSelected();
});

document.getElementById('btnPrev').addEventListener('click',()=>{SFX.click();moveSelect(-1);});
document.getElementById('btnNext').addEventListener('click',()=>{SFX.click();moveSelect(1);});
document.getElementById('btnTie').addEventListener('click',()=>{if(!started){started=true;return;}if(gameOver){reset();return;}if(roundIntro){roundIntro=false;return;}SFX.click();tieSelected();});

function drawNetBg(){
  ctx.save();
  ctx.strokeStyle='rgba(201,162,75,0.18)';
  ctx.lineWidth=1;
  const step=28;
  for(let x=-40;x<W+40;x+=step){
    ctx.beginPath();
    for(let y=0;y<=H;y+=step){
      ctx.moveTo(x+((y/step)%2?step/2:0),y);
      ctx.lineTo(x+step/2+((y/step)%2?step/2:0),y+step);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawDiagram(){
  const dx=W-170,dy=20,dw=150,dh=90;
  ctx.save();
  ctx.fillStyle='rgba(8,32,40,0.85)';
  ctx.strokeStyle='#c9a24b';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(dx,dy,dw,dh,8):ctx.rect(dx,dy,dw,dh);ctx.fill();ctx.stroke();
  ctx.fillStyle='#e8d9b5';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('order_diagram','ORDER'),dx+dw/2,dy+14);
  // mini layout of knots with numbers showing order
  const minX=Math.min(...knots.map(k=>k.x)),maxX=Math.max(...knots.map(k=>k.x));
  const minY=Math.min(...knots.map(k=>k.y)),maxY=Math.max(...knots.map(k=>k.y));
  const pad=14;
  const sx=(dw-2*pad)/Math.max(1,(maxX-minX)),sy=(dh-2*pad-14)/Math.max(1,(maxY-minY));
  const s=Math.min(sx,sy,1);
  knots.forEach((k)=>{
    const ordPos=order.indexOf(k.id);
    const mx=dx+pad+(k.x-minX)*s;
    const my=dy+22+pad+(k.y-minY)*s*0.6;
    ctx.beginPath();ctx.arc(mx,my,7,0,7);
    ctx.fillStyle=k.tied?'#4fd16a':(ordPos===nextIdx?'#ffd54f':'#355');
    ctx.fill();
    ctx.strokeStyle='#e8d9b5';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#07131a';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(ordPos+1),mx,my+1);
  });
  ctx.textBaseline='alphabetic';
  ctx.restore();
}

function drawKnot(k,i){
  const isTarget=order[nextIdx]===k.id;
  const isSel=i===selected;
  ctx.save();
  ctx.beginPath();
  ctx.arc(k.x,k.y,18,0,Math.PI*2);
  ctx.fillStyle=k.tied?'rgba(79,209,106,0.25)':'rgba(233,69,96,0.22)';
  ctx.fill();
  if(!k.tied){
    // torn hole look: jagged gap
    ctx.strokeStyle='#e9455f';
    ctx.lineWidth=2;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(k.x,k.y,14,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle='#c9a24b';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(k.x-10,k.y-10);ctx.lineTo(k.x+10,k.y+10);ctx.moveTo(k.x+10,k.y-10);ctx.lineTo(k.x-10,k.y+10);ctx.stroke();
    ctx.beginPath();ctx.arc(k.x,k.y,5,0,Math.PI*2);ctx.fillStyle='#c9a24b';ctx.fill();
  }
  if(isSel&&!k.tied){
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(k.x,k.y,20,0,Math.PI*2);ctx.stroke();
  }
  if(isTarget&&!k.tied){
    const pulse=4*Math.sin(Date.now()/150);
    ctx.strokeStyle='rgba(255,213,79,0.7)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(k.x,k.y,23+pulse,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b3d4a');bg.addColorStop(1,'#05222b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawNetBg();

  if(!started){
    ctx.fillStyle='#e8d9b5';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_nm','Tap / Click / Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    knots.forEach((k,i)=>drawKnot(k,i));
    ctx.fillStyle='rgba(5,20,25,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('net_torn_title','NET LOST TO THE TIDE'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
    document.getElementById('scoreLbl').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(roundIntro){
    knots.forEach((k,i)=>drawKnot(k,i));
    drawDiagram();
    ctx.fillStyle='rgba(5,20,25,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H/2-10);
    ctx.fillStyle='#e8d9b5';ctx.font='18px Arial';
    ctx.fillText(I18N.t('memorize_hint','Memorize the knot order, then tap/click to begin'),W/2,H/2+26);
    requestAnimationFrame(loop);return;
  }

  tide-=tideSpeed;
  if(tide<=0){
    tide=0;lives--;SFX.hurt();
    if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}}
    else {tide=1;flashTimer=35;flashMsg=I18N.t('tide_hit','The tide struck! Hurry!');}
  }
  document.getElementById('tideBar').style.width=(tide*100)+'%';

  knots.forEach((k,i)=>drawKnot(k,i));
  drawDiagram();

  if(flashTimer>0){
    flashTimer--;
    ctx.fillStyle='rgba(255,213,79,'+Math.min(0.9,flashTimer/40)+')';
    ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,70);
  }

  ctx.fillStyle='#e8d9b5';ctx.font='14px Arial';ctx.textAlign='left';
  let hearts='';for(let i=0;i<3;i++)hearts+=(i<lives?'❤':'♡');
  ctx.fillText(hearts,16,26);

  document.getElementById('scoreLbl').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('levelLbl').textContent=I18N.t('round_label','Round {n}').replace('{n}',round);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
