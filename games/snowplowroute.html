<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#37474f}
#ui{color:#e0f7fa;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Snowplow Route</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Level: 1 | Fuel: 40</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad) to drive your plow over every snowy tile — each move uses fuel, so plan an efficient route! Clear the whole grid before fuel runs out to advance to the next, bigger level.</div>
</div>
<script>
const W=360,H=360;
let cols,rows,cell,grid,px,py,level,fuel,state,moveT,keys={};

function loadBest(){return +(localStorage.getItem('snowplowroute_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('snowplowroute_best',v);}

function init(){level=1;state='play';newLevel();}
function newLevel(){
  cols=4+Math.min(3,Math.floor(level/2));
  rows=cols;
  cell=W/cols;
  grid=Array.from({length:rows},()=>Array(cols).fill(true));
  px=0;py=0;grid[0][0]=false;
  fuel=cols*rows*2;
  moveT=0;
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over'){level=1;newLevel();state='play';}});
});

function tryMove(dx,dy){
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=cols||ny<0||ny>=rows)return;
  px=nx;py=ny;
  fuel--;
  if(grid[py][px]){grid[py][px]=false;SFX.tick();}
  if(grid.every(row=>row.every(v=>!v))){
    level++;
    SFX.levelup();
    saveBest(level-1);
    newLevel();
  }else if(fuel<=0){
    state='over';
    SFX.lose();
    saveBest(level-1);
  }
  updateUI();
}

function update(){
  if(state!=='play')return;
  moveT++;
  if(moveT<8)return;
  let dx=0,dy=0;
  if(keys['arrowup']||keys['w'])dy=-1;
  else if(keys['arrowdown']||keys['s'])dy=1;
  else if(keys['arrowleft']||keys['a'])dx=-1;
  else if(keys['arrowright']||keys['d'])dx=1;
  if(dx||dy){tryMove(dx,dy);moveT=0;}
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);

  for(let r=0;r<rows;r++){
    for(let cl=0;cl<cols;cl++){
      const x=cl*cell,y=r*cell;
      ctx.fillStyle=grid[r][cl]?'#eceff1':'#455a64';
      ctx.fillRect(x+2,y+2,cell-4,cell-4);
    }
  }

  ctx.font=`${Math.min(28,cell*0.7)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🚜',px*cell+cell/2,py*cell+cell/2);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e0f7fa';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('out_of_fuel','OUT OF FUEL!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('reached_level_best_label','Reached level: {n} | Best: {b}').replace('{n}',level).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_dpad_retry','Tap a D-pad button to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Level: ${level} | Fuel: ${Math.max(0,fuel)}`;
}

init();draw();
</script></body></html>
