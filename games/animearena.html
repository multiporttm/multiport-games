<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Anime Arena</title><meta name="description" content="Play Anime Arena free online — Battle waves of AI opponents with timed attacks, blocks, and special moves in this anime-style fighting arena."><link rel="canonical" href="https://games.multiportllc.com/games/animearena"><meta property="og:title" content="Anime Arena - Multiport Games"><meta property="og:description" content="Play Anime Arena free online — Battle waves of AI opponents with timed attacks, blocks, and special moves in this anime-style fighting arena."><meta property="og:url" content="https://games.multiportllc.com/games/animearena"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Anime Arena","description":"Play Anime Arena free online instantly. Battle waves of AI opponents with timed attacks, blocks, and special moves in this anime-style fighting arena. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/animearena","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a0f2e}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px}
#btns button{padding:12px 18px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Anime Arena</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Wave: 1 | HP: 100</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="atkBtn">⚔️ Attack</button>
      <button id="blkBtn">🛡️ Block</button>
      <button id="spBtn">✨ Special</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Attack to chip the enemy's HP, Block right before their strike lands (watch the "!" warning) to avoid damage, and use Special once its cooldown is ready for a big hit. Defeat each wave to face a tougher foe!</div>
</div>
<script>
const W=360,H=360;
let wave,hp,enemyHp,enemyMax,state,enemyTimer,enemyWindup,blocking,blockT,specialCD,msg='';

function loadBest(){return +(localStorage.getItem('animearena_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('animearena_best',v);}

function init(){wave=1;hp=100;state='play';specialCD=0;newEnemy();}
function newEnemy(){
  enemyMax=40+wave*15;enemyHp=enemyMax;
  enemyTimer=90+Math.random()*60;enemyWindup=0;
}

document.getElementById('atkBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  enemyHp-=8+Math.random()*4;
  msg=I18N.t('msg_strike','You strike!');
  SFX.hit();
  checkEnemyDead();
});
document.getElementById('blkBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  blocking=true;blockT=20;
});
document.getElementById('spBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(specialCD>0||state!=='play')return;
  enemyHp-=25;specialCD=240;
  msg=I18N.t('msg_special','Special attack!');
  SFX.powerup();
  checkEnemyDead();
});

function checkEnemyDead(){
  if(enemyHp<=0){
    wave++;
    SFX.levelup();
    saveBest(wave-1);
    newEnemy();
    msg=I18N.t('msg_wave_begins','Wave {n} begins!').replace('{n}',wave);
  }
}

function update(){
  if(state!=='play')return;
  if(specialCD>0)specialCD--;
  if(blockT>0)blockT--;else blocking=false;

  enemyTimer--;
  if(enemyTimer<=0){
    enemyWindup=30;
    enemyTimer=90+Math.random()*60+wave*3;
  }
  if(enemyWindup>0){
    enemyWindup--;
    if(enemyWindup===0){
      const dmg=8+wave*1.5;
      if(blocking){msg=I18N.t('msg_blocked','Blocked!');SFX.click();}
      else{hp-=dmg;msg=I18N.t('msg_hit','Hit!');SFX.hurt();}
      if(hp<=0){hp=0;state='over';SFX.lose();}
    }
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1a0f2e';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(20,30,W-40,14);
  ctx.fillStyle='#ef5350';
  ctx.fillRect(20,30,(W-40)*Math.max(0,enemyHp/enemyMax),14);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('enemy_label','Enemy'),W/2,24);

  ctx.font='60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(enemyWindup>0?'😡':'🥷',W/2,140);
  if(enemyWindup>0){
    ctx.fillStyle='#ffca28';ctx.font='bold 30px Arial';
    ctx.fillText('!',W/2,90);
  }

  ctx.font='50px Arial';
  ctx.fillText(blocking?'🛡️':'🧑‍🎤',W/2,250);

  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(20,300,W-40,14);
  ctx.fillStyle='#66bb6a';
  ctx.fillRect(20,300,(W-40)*Math.max(0,hp/100),14);
  ctx.fillStyle='#fff';ctx.font='12px Arial';
  ctx.fillText(I18N.t('you_label','You'),W/2,294);

  ctx.fillStyle='#ce93d8';ctx.font='14px Arial';
  ctx.fillText(msg,W/2,325);
  ctx.font='12px Arial';ctx.fillStyle='#90caf9';
  ctx.fillText(specialCD>0?I18N.t('special_cooldown','Special ready in {n}s').replace('{n}',Math.ceil(specialCD/60)):I18N.t('special_ready','Special ready!'),W/2,342);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ce93d8';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('defeated_title','DEFEATED'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('reached_wave_best_label','Reached Wave: {w} | Best: {b}').replace('{w}',wave).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('attack_retry_hint','Tap Attack to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('wave_label','Wave: {n}').replace('{n}',wave)+' | '+I18N.t('hp_label','HP: {n}').replace('{n}',Math.max(0,Math.floor(hp)));
}

init();draw();
</script></body></html>
