<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1f4e6b;display:block;border-radius:8px;touch-action:none}
#hud{color:#ffe08a;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Plank Walking</div>
  <div class="game-frame">
    <div id="hud">Distance: 0% | Hi: 0%</div>
    <canvas id="c" width="800" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Left/Right Arrow</b> (or <b>A/D</b>) — or <b>tap-and-hold</b> the left/right half of the screen — to lean against wind gusts and keep your balance. Let the tilt meter max out either way and you'll fall to the sharks! Reach the end of the plank to win.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=380,waterY=300;
let hi=parseInt(localStorage.getItem('plankwalking_hi')||'0',10);
let tilt=0,progress=0,gust=0,gustTimer=0,shipRock=0,fallen=false,won=false,leftHeld=false,rightHeld=false,sharkPhase=0;
const plankStartX=60,plankEndX=720,plankY=180;

function reset(){tilt=0;progress=0;gust=0;gustTimer=0;fallen=false;won=false;}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){leftHeld=true;e.preventDefault();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){rightHeld=true;e.preventDefault();}
  if((fallen||won)&&(e.code==='Space'||e.code==='Enter')){reset();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')leftHeld=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')rightHeld=false;
});

function pointerSide(evt){
  const rect=c.getBoundingClientRect();
  const x=(evt.touches?evt.touches[0].clientX:evt.clientX)-rect.left;
  return x < rect.width/2 ? 'left':'right';
}
c.addEventListener('pointerdown',e=>{
  if(fallen||won){reset();return;}
  const side=pointerSide(e);
  if(side==='left')leftHeld=true; else rightHeld=true;
  c.setPointerCapture&&e.pointerId!=null&&c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointerup',()=>{leftHeld=false;rightHeld=false;});
c.addEventListener('pointerleave',()=>{leftHeld=false;rightHeld=false;});
c.addEventListener('contextmenu',e=>e.preventDefault());

function plankY_at(frac){ return plankY + Math.sin(shipRock)*6; }

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,waterY);
  sky.addColorStop(0,'#0b2733');sky.addColorStop(1,'#1f4e6b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,waterY);
  ctx.fillStyle='#154a63';ctx.fillRect(0,waterY,W,H-waterY);

  shipRock+=0.025;
  sharkPhase+=0.05;

  // sharks
  for(let i=0;i<3;i++){
    const sx=120+i*230+Math.sin(sharkPhase+i)*40;
    const sy=waterY+20+Math.sin(sharkPhase*1.3+i)*6;
    ctx.fillStyle='#4a5a66';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+30,sy);ctx.lineTo(sx+15,sy-18);ctx.closePath();ctx.fill();
  }

  const py=plankY_at();
  // ship hull (left)
  ctx.fillStyle='#5b3a21';ctx.fillRect(0,py-40,plankStartX+10,90);
  // plank
  ctx.save();
  ctx.translate((plankStartX+plankEndX)/2,py);
  ctx.rotate(Math.sin(shipRock)*0.03);
  ctx.fillStyle='#8a6230';
  ctx.fillRect(-(plankEndX-plankStartX)/2,-6,plankEndX-plankStartX,12);
  ctx.restore();

  if(!fallen&&!won){
    gustTimer++;
    if(gustTimer>70){gustTimer=0;gust=(Math.random()*2-1)*1.4;}
    let accel=gust*0.03 + Math.sin(shipRock)*0.045;
    if(leftHeld)accel-=0.09;
    if(rightHeld)accel+=0.09;
    tilt+=accel;
    tilt*=0.985;
    progress+=0.0035*(1-Math.min(0.6,Math.abs(tilt)/1.6));
    if(Math.abs(tilt)>=1.0){
      fallen=true;SFX.lose();
    } else if(progress>=1){
      progress=1;won=true;SFX.win();
      const pct=100;
      if(pct>hi){hi=pct;localStorage.setItem('plankwalking_hi',hi);}
    }
  }

  // walker position along plank
  const wx=plankStartX+ (plankEndX-plankStartX)*progress;
  const wy=py-6;
  ctx.save();
  ctx.translate(wx,wy);
  ctx.rotate(tilt*0.5);
  ctx.fillStyle='#e0c097';
  ctx.beginPath();ctx.arc(0,-34,10,0,Math.PI*2);ctx.fill(); // head
  ctx.fillStyle='#2e3440';
  ctx.fillRect(-8,-24,16,26); // body
  ctx.fillStyle='#4a2f1a';
  ctx.fillRect(-9,-28,20,8); // hat
  ctx.restore();

  // tilt meter
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(W/2-100,20,200,14);
  ctx.fillStyle=Math.abs(tilt)>0.75?'#e94560':'#7ec850';
  ctx.fillRect(W/2-100+100+tilt*100-6,20,12,14);
  ctx.strokeStyle='#fff';ctx.strokeRect(W/2-100,20,200,14);

  if(fallen||won){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('win_title','YOU MADE IT!'):I18N.t('fall_title','SPLASH! FELL IN!'),W/2,H/2-10);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('plank_restart_hint','Tap or Space to try again'),W/2,H/2+26);
  }

  document.getElementById('hud').textContent=
    I18N.t('plank_hud','Distance: {d}% | Hi: {h}%').replace('{d}',Math.floor(progress*100)).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
