<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Lake Naming</title><meta name="description" content="Play Lake Naming free online — A lake's shape is highlighted on the map. Pick its name before time runs out! Wrong guesses cost a life. Build a streak across increasingly tricky lakes."><link rel="canonical" href="https://games.multiportllc.com/games/lakenaming"><meta property="og:title" content="Lake Naming - Multiport Games"><meta property="og:description" content="Play Lake Naming free online — A lake's shape is highlighted on the map. Pick its name before time runs out! Wrong guesses cost a life. Build a streak across increasingly tricky lakes."><meta property="og:url" content="https://games.multiportllc.com/games/lakenaming"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Lake Naming","description":"Play Lake Naming free online instantly. A lake's shape is highlighted on a simplified map outline. Pick its correct name before time runs out! Wrong guesses cost a life. Build a streak of correct answers across increasingly tricky lakes. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/lakenaming","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{padding:16px;text-align:center}
#hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:#fff;font-weight:700;margin-bottom:10px;font-size:.95rem}
#hud .stat{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 12px}
#lives{color:#ff6b6b}
#timerBar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-bottom:12px}
#timerFill{height:100%;background:linear-gradient(90deg,#4fc3f7,#0288d1);width:100%;transition:width .1s linear}
#mapBox{background:#0a2540;border-radius:14px;padding:10px;position:relative}
#mapSvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.lakeShape{fill:#0a2540;stroke:#3a4a5a;stroke-width:1}
.lakeShape.target{fill:#29b6f6;stroke:#e1f5fe;stroke-width:2.5;filter:drop-shadow(0 0 6px #29b6f6)}
#region{color:#90caf9;font-size:.85rem;margin:8px 0 4px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:14px auto 4px;padding:0 4px}
.opt{padding:14px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s}
.opt:hover{background:rgba(255,255,255,.14)}
.opt.correct{background:#2e7d32;border-color:#66bb6a}
.opt.wrong{background:#c62828;border-color:#ef5350}
.opt:disabled{cursor:default}
#msg{min-height:1.6em;color:#ffd54f;font-weight:800;margin:8px 0}
#overlay{position:absolute;inset:0;background:rgba(4,10,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border-radius:14px;gap:10px;padding:20px;text-align:center}
#overlay h2{margin:0;font-size:1.6rem}
#overlay button{margin-top:8px;padding:12px 28px;border-radius:24px;border:none;background:#29b6f6;color:#04101c;font-weight:800;font-size:1rem;cursor:pointer}
@media(max-width:480px){#options{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lake Naming</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <div class="stat" id="streakStat">Streak: 0</div>
        <div class="stat" id="livesStat">❤️❤️❤️</div>
        <div class="stat" id="hiStat">Best: 0</div>
      </div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="mapBox" style="position:relative">
        <div id="region">World</div>
        <svg id="mapSvg" viewBox="0 0 300 200"></svg>
        <div id="overlay" style="display:none"></div>
      </div>
      <div id="msg"></div>
      <div id="options"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A lake's shape is highlighted on the map outline. Select its correct name before the timer runs out! Wrong guesses cost a <b>life</b>. Build the longest streak — lakes get trickier as you go.</div>
</div>
<script>
const LAKES=[
{n:"Lake Superior",r:"North America",d:1,pts:"20,60 60,50 100,55 130,70 110,90 70,95 30,85"},
{n:"Lake Victoria",r:"Africa",d:1,pts:"150,90 175,80 195,95 190,120 165,125 145,110"},
{n:"Lake Baikal",r:"Asia",d:1,pts:"210,40 218,55 215,90 222,120 214,140 208,110 205,70"},
{n:"Great Bear Lake",r:"North America",d:2,pts:"40,30 70,25 85,40 75,60 50,65 30,50"},
{n:"Lake Michigan",r:"North America",d:1,pts:"90,60 100,55 108,90 112,130 100,140 92,110"},
{n:"Lake Huron",r:"North America",d:2,pts:"110,55 130,50 140,70 132,95 115,90"},
{n:"Lake Tanganyika",r:"Africa",d:2,pts:"160,95 165,100 158,150 152,155 150,110"},
{n:"Lake Malawi",r:"Africa",d:2,pts:"170,130 175,132 170,170 165,172 163,140"},
{n:"Great Slave Lake",r:"North America",d:2,pts:"55,45 80,42 90,55 78,68 58,65"},
{n:"Lake Erie",r:"North America",d:1,pts:"115,95 145,92 150,102 120,108"},
{n:"Lake Winnipeg",r:"North America",d:3,pts:"60,30 68,28 72,55 66,80 60,60"},
{n:"Lake Ontario",r:"North America",d:1,pts:"125,100 155,98 158,108 128,110"},
{n:"Lake Ladoga",r:"Europe",d:2,pts:"235,35 245,33 248,50 238,55"},
{n:"Lake Onega",r:"Europe",d:3,pts:"250,30 260,28 262,48 252,50"},
{n:"Lake Titicaca",r:"South America",d:2,pts:"75,150 85,148 90,158 78,162"},
{n:"Lake Nicaragua",r:"North America",d:3,pts:"65,130 75,128 78,138 66,140"},
{n:"Lake Chad",r:"Africa",d:3,pts:"150,75 158,73 160,82 152,84"},
{n:"Lake Turkana",r:"Africa",d:3,pts:"172,80 178,78 180,95 174,97"},
{n:"Aral Sea",r:"Asia",d:2,pts:"215,55 225,53 227,68 217,70"},
{n:"Caspian Sea",r:"Asia",d:1,pts:"212,60 222,58 226,95 216,110 208,90"},
{n:"Dead Sea",r:"Asia",d:2,pts:"195,85 200,83 202,95 197,97"},
{n:"Lake Geneva",r:"Europe",d:2,pts:"225,60 235,58 237,66 227,68"},
{n:"Lake Constance",r:"Europe",d:3,pts:"228,55 236,53 238,60 230,62"},
{n:"Lake Balaton",r:"Europe",d:3,pts:"240,65 250,64 251,70 241,71"},
{n:"Lake Vanern",r:"Europe",d:3,pts:"230,30 236,29 238,40 231,41"},
{n:"Lake Eyre",r:"Australia",d:2,pts:"245,145 255,143 257,155 246,157"},
{n:"Lake Taupo",r:"Oceania",d:3,pts:"270,150 276,149 278,157 271,158"},
{n:"Lake Vostok",r:"Antarctica",d:3,pts:"180,190 195,188 197,195 182,196"},
{n:"Lake Nasser",r:"Africa",d:3,pts:"165,80 168,78 172,100 168,102"},
{n:"Lake Kariba",r:"Africa",d:3,pts:"165,135 172,133 175,142 166,144"},
{n:"Lake Poopo",r:"South America",d:3,pts:"73,155 80,154 82,161 74,162"},
{n:"Great Salt Lake",r:"North America",d:2,pts:"45,80 53,78 55,88 46,90"},
{n:"Lake Champlain",r:"North America",d:3,pts:"128,80 132,78 134,92 129,94"},
{n:"Lake Okeechobee",r:"North America",d:3,pts:"130,120 136,119 138,126 131,127"},
{n:"Loch Ness",r:"Europe",d:2,pts:"215,25 220,24 221,32 216,33"}
];

const TOTAL_LIVES=3, TIME_MS=10000;
let streak=0,hi=+(localStorage.getItem('lakenaming_hi')||0),lives=TOTAL_LIVES,timerEnd=0,timerRAF=null,current=null,recent=[],locked=false;

const region=document.getElementById('region'),svg=document.getElementById('mapSvg'),msg=document.getElementById('msg'),
optionsEl=document.getElementById('options'),overlay=document.getElementById('overlay'),
streakStat=document.getElementById('streakStat'),livesStat=document.getElementById('livesStat'),hiStat=document.getElementById('hiStat'),
timerFill=document.getElementById('timerFill');

function updateHud(){
  streakStat.textContent=I18N.t('streak_label','Streak: {s}').replace('{s}',streak);
  livesStat.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(TOTAL_LIVES-Math.max(0,lives));
  hiStat.textContent=I18N.t('best_label','Best: {h}').replace('{h}',hi);
}

function pickPool(){
  // difficulty ramps with streak: allow tier up to 1 + floor(streak/4), capped at 3
  const maxD=Math.min(3,1+Math.floor(streak/4));
  return LAKES.filter(l=>l.d<=maxD);
}

function nextRound(){
  locked=false;
  msg.textContent='';
  const pool=pickPool().filter(l=>!recent.includes(l.n));
  const usable=pool.length>=4?pool:pickPool();
  current=usable[Math.floor(Math.random()*usable.length)];
  recent.push(current.n); if(recent.length>6)recent.shift();
  region.textContent=current.r;
  drawMap();
  buildOptions();
  startTimer();
}

function drawMap(){
  svg.innerHTML='';
  LAKES.forEach(l=>{
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',l.pts);
    poly.setAttribute('class','lakeShape'+(l===current?' target':''));
    svg.appendChild(poly);
  });
}

function buildOptions(){
  const wrongPool=LAKES.filter(l=>l.n!==current.n);
  const wrongs=[];
  while(wrongs.length<3&&wrongPool.length){
    const idx=Math.floor(Math.random()*wrongPool.length);
    const cand=wrongPool.splice(idx,1)[0];
    if(!wrongs.some(w=>w.n===cand.n))wrongs.push(cand);
  }
  const choices=[current,...wrongs].sort(()=>Math.random()-0.5);
  optionsEl.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=c.n;
    btn.onclick=()=>answer(c.n===current.n,btn);
    optionsEl.appendChild(btn);
  });
}

function startTimer(){
  cancelAnimationFrame(timerRAF);
  timerEnd=performance.now()+TIME_MS;
  tickTimer();
}
function tickTimer(){
  const remain=timerEnd-performance.now();
  const pct=Math.max(0,remain/TIME_MS);
  timerFill.style.width=(pct*100)+'%';
  timerFill.style.background=pct<0.25?'linear-gradient(90deg,#ff5252,#c62828)':'linear-gradient(90deg,#4fc3f7,#0288d1)';
  if(remain<=0){ if(!locked) answer(false,null); return; }
  timerRAF=requestAnimationFrame(tickTimer);
}

function answer(correct,btn){
  if(locked)return;
  locked=true;
  cancelAnimationFrame(timerRAF);
  [...optionsEl.children].forEach(b=>b.disabled=true);
  if(btn)btn.classList.add(correct?'correct':'wrong');
  if(!btn){
    [...optionsEl.children].forEach(b=>{ if(b.textContent===current.n) b.classList.add('correct'); });
  }
  if(correct){
    streak++;
    if(streak>hi){hi=streak;localStorage.setItem('lakenaming_hi',hi);}
    SFX.success();
    msg.textContent=I18N.t('correct_msg','Correct!');
    msg.style.color='#66bb6a';
  }else{
    lives--;
    SFX.fail();
    [...optionsEl.children].forEach(b=>{ if(b.textContent===current.n) b.classList.add('correct'); });
    msg.textContent=I18N.t('wrong_msg','Wrong! It was {n}').replace('{n}',current.n);
    msg.style.color='#ef5350';
  }
  updateHud();
  setTimeout(()=>{
    if(lives<=0){ gameOver(); } else { nextRound(); }
  },1100);
}

function gameOver(){
  SFX.lose();
  overlay.style.display='flex';
  overlay.innerHTML=`<h2>${I18N.t('game_over_title','GAME OVER')}</h2><div>${I18N.t('final_streak','Final streak: {s}').replace('{s}',streak)}</div><div>${I18N.t('best_label','Best: {h}').replace('{h}',hi)}</div><button id="playAgain">${I18N.t('play_again','Play Again')}</button>`;
  document.getElementById('playAgain').onclick=startGame;
}

function startGame(){
  overlay.style.display='none';
  streak=0;lives=TOTAL_LIVES;recent=[];
  updateHud();
  nextRound();
}

document.addEventListener('keydown',e=>{
  if(locked)return;
  const idx=parseInt(e.key,10)-1;
  if(idx>=0&&idx<optionsEl.children.length){ optionsEl.children[idx].click(); }
});

updateHud();
startGame();
</script></body></html>
