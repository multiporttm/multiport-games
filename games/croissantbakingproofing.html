<style>
body{background:#1a1008}
#c{background:#3a2414;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd37a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Croissant Baking Proofing</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap a tray when its rise gauge reaches the golden <b>ready zone</b> to move it into the oven. Wait too long and it over-proofs and collapses! More trays proof at once each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
let score=0,hi=parseInt(localStorage.getItem('croissantbakingproofing_hi')||'0',10);
let round=1,trays=[],lost=0,gameOver=false,started=false;
let lastTime=null;

const READY_LO=0.68, READY_HI=0.86; // ready zone fraction of rise
const MAX_LOST=3;

function slotPositions(n){
  const cols=Math.min(n,4);
  const rows=Math.ceil(n/4);
  const pts=[];
  const cw=W/cols, rh=260/rows;
  for(let i=0;i<n;i++){
    const col=i%cols, row=Math.floor(i/cols);
    pts.push({x:cw*col+cw/2, y:90+rh*row+rh/2});
  }
  return pts;
}

function newRound(){
  round++;
  const n=Math.min(2+round,9);
  spawnTrays(n);
}

function spawnTrays(n){
  trays=[];
  const pts=slotPositions(n);
  for(let i=0;i<n;i++){
    trays.push({
      rise:0.05+Math.random()*0.05,
      riseRate:0.00028+Math.random()*0.00012,
      x:pts[i].x,y:pts[i].y,
      state:'proofing', // proofing, oven, collapsed, done
      wobble:Math.random()*Math.PI*2,
      flashT:0
    });
  }
}

function reset(){
  score=0;round=0;lost=0;gameOver=false;started=false;lastTime=null;
  newRound();
}
reset();

function hiScore(){if(score>hi){hi=score;localStorage.setItem('croissantbakingproofing_hi',String(Math.floor(hi)));}}

function pointAt(px,py){
  // find tray at point
  for(const t of trays){
    if(t.state!=='proofing')continue;
    const dx=px-t.x,dy=py-t.y;
    if(dx*dx+dy*dy< (70*70)) return t;
  }
  return null;
}

function handlePick(px,py){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const t=pointAt(px,py);
  if(!t)return;
  if(t.rise>=READY_LO&&t.rise<=READY_HI){
    t.state='done';
    score+=10+Math.round(round*1.5);
    hiScore();
    SFX.success();
    checkRoundComplete();
  } else if(t.rise<READY_LO){
    t.flashT=20;
    SFX.error();
  } else {
    // too late already handled by over-proof collapse, but click after collapse ignored
  }
}

function checkRoundComplete(){
  if(trays.every(t=>t.state==='done'||t.state==='collapsed')){
    if(trays.some(t=>t.state==='collapsed')){
      // round continues to next regardless, collapse already counted
    }
    SFX.levelup();
    setTimeout(()=>{ if(!gameOver) newRound(); },500);
  }
}

function getXY(evt){
  const r=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-r.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-r.top;
  return {x:cx*(W/r.width), y:cy*(H/r.height)};
}
c.addEventListener('mousedown',e=>{const p=getXY(e);handlePick(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getXY(e);handlePick(p.x,p.y);},{passive:false});

let selIdx=0;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started){started=true;return;}
    if(gameOver){reset();return;}
    const proofing=trays.filter(t=>t.state==='proofing');
    if(proofing.length){
      selIdx=((selIdx%proofing.length)+proofing.length)%proofing.length;
      const t=proofing[selIdx];
      handlePick(t.x,t.y);
    }
  } else if(e.code==='ArrowRight'){
    selIdx++;
  } else if(e.code==='ArrowLeft'){
    selIdx--;
  }
});

function drawTray(t){
  ctx.save();
  ctx.translate(t.x,t.y);
  // flash feedback
  if(t.flashT>0){t.flashT--;}
  // tray base
  ctx.fillStyle='#5a3a22';
  ctx.beginPath();ctx.ellipse(0,45,65,14,0,0,Math.PI*2);ctx.fill();

  if(t.state==='collapsed'){
    ctx.fillStyle='#8a6a3a';
    ctx.beginPath();ctx.ellipse(0,20,55,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6b4a22';
    ctx.font='28px sans-serif';ctx.textAlign='center';
    ctx.fillText('💨',0,-10);
    ctx.restore();return;
  }

  const rise=t.rise;
  const scale=0.5+rise*0.7;
  const wob=Math.sin(t.wobble)*1.5;
  t.wobble+=0.03;

  // croissant shape (crescent via two arcs)
  ctx.save();
  ctx.translate(0,30-rise*34+wob);
  ctx.scale(scale,scale*0.75);
  let color='#f3d9a0';
  if(t.state==='done')color='#c8863a';
  else if(rise>READY_HI)color='#8a5a2a';
  else if(rise>=READY_LO)color='#e0a95c';
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(0,0,42,Math.PI*0.15,Math.PI*1.55);
  ctx.arc(10,4,34,Math.PI*1.55,Math.PI*0.15,true);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(120,70,20,0.4)';
  ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(-20+i*14,-10);
    ctx.lineTo(-10+i*14,18);
    ctx.stroke();
  }
  ctx.restore();

  if(t.state==='proofing'){
    // gauge
    const gx=-45,gy=55,gw=90,gh=10;
    ctx.fillStyle='#2a1a0d';
    ctx.fillRect(gx,gy,gw,gh);
    ctx.fillStyle='#5aaa30';
    ctx.fillRect(gx+gw*READY_LO,gy,gw*(READY_HI-READY_LO),gh);
    const fillW=Math.min(gw,gw*rise);
    ctx.fillStyle = rise>READY_HI? '#e94560' : (rise>=READY_LO?'#ffd54f':'#88bbee');
    ctx.fillRect(gx,gy,fillW,gh);
    ctx.strokeStyle='#fff3';ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
    if(t.flashT>0){
      ctx.strokeStyle='#e94560';ctx.lineWidth=3;
      ctx.strokeRect(gx-3,gy-3,gw+6,gh+6);
    }
  } else if(t.state==='done'){
    ctx.fillStyle='#5aaa30';
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(I18N.t('proofing_baked','BAKED!'),0,70);
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // background cabinet
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1810');bg.addColorStop(1,'#1a0f08');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd37a11';
  for(let i=0;i<6;i++){ctx.fillRect(0,20+i*70,W,2);}

  ctx.fillStyle='#ffd37a';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('proofing_cabinet_title','🧁 Warm Proofing Cabinet'),W/2,40);

  if(!started){
    ctx.fillStyle='#ffd37acc';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('start_hint_proof','Tap / Click / Space to start'),W/2,H/2);
    document.getElementById('score-display').textContent=I18N.t('round_score_hi','Round: {r} | Score: {s} | Hi: {h}').replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    trays.forEach(drawTray);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-10);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+28);
    document.getElementById('score-display').textContent=I18N.t('round_score_hi','Round: {r} | Score: {s} | Hi: {h}').replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  trays.forEach(t=>{
    if(t.state==='proofing'){
      t.rise+=t.riseRate*dt*16.6667;
      if(t.rise>1){
        t.rise=1;
        t.state='collapsed';
        lost++;
        SFX.fail();
        if(lost>=MAX_LOST){gameOver=true;SFX.lose();}
        checkRoundComplete();
      }
    }
  });

  trays.forEach(drawTray);

  ctx.fillStyle='#e94560';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('proofing_lost_label','Collapsed: {n}/{m}').replace('{n}',lost).replace('{m}',MAX_LOST),16,H-14);

  document.getElementById('score-display').textContent=I18N.t('round_score_hi','Round: {r} | Score: {s} | Hi: {h}').replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
