<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Cat Herder</title><meta name="description" content="Play Cat Herder free online — Use Arrow Keys/WASD or drag to move and gently push nearby cats toward the pen before time runs out."><link rel="canonical" href="https://games.multiportllc.com/games/catherder"><meta property="og:title" content="Cat Herder - Multiport Games"><meta property="og:description" content="Play Cat Herder free online — Use Arrow Keys/WASD or drag to move and gently push nearby cats toward the pen before time runs out."><meta property="og:url" content="https://games.multiportllc.com/games/catherder"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Cat Herder","description":"Play Cat Herder free online instantly. Guide wandering cats into the pen before time runs out — your proximity gently pushes nearby cats toward the gate. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/catherder","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#558b2f,#8d6e63);display:block;border-radius:8px;touch-action:none}
#score-display{color:#c5e1a5;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cat Herder</div>
  <div class="game-frame">
    <div id="score-display">Herded: 0/0 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b> or <b>drag</b> to move your herder. Get close to cats to gently push them toward the pen. Herd all the cats in before time runs out for a big bonus!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let hi=parseInt(localStorage.getItem('catherder_hi')||'0',10);
let round=1,score=0,timeLeft=0,gameOver=false,started=false,herded=0,total=0,lost=0;
const pen={x:W-110,y:H/2-60,w:90,h:120};
const player={x:100,y:H/2,r:16,vx:0,vy:0};
let cats=[];
const keys={};

function rand(a,b){return a+Math.random()*(b-a);}

function spawnCats(n){
  cats=[];
  for(let i=0;i<n;i++){
    cats.push({
      x:rand(150,W-200),y:rand(40,H-40),
      vx:rand(-0.6,0.6),vy:rand(-0.6,0.6),
      r:12,inPen:false,lost:false,
      wanderT:rand(0,100)
    });
  }
}

function startRound(){
  total=3+round;
  herded=0;lost=0;
  timeLeft=28+round*2;
  spawnCats(total);
  gameOver=false;started=false;
  player.x=100;player.y=H/2;
}

function startGame(){
  round=1;score=0;
  startRound();
}
startGame();

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(!started&&!gameOver)started=true;
  if(gameOver){startGame();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

let dragging=false;
function pointerPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};
}
c.addEventListener('mousedown',e=>{dragging=true;if(!started&&!gameOver)started=true; if(gameOver)startGame(); movePlayerTo(pointerPos(e));});
c.addEventListener('mousemove',e=>{if(dragging)movePlayerTo(pointerPos(e));});
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;if(!started&&!gameOver)started=true; if(gameOver)startGame(); movePlayerTo(pointerPos(e));},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)movePlayerTo(pointerPos(e));},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});

let targetPos=null;
function movePlayerTo(p){ targetPos=p; }

function drawPen(){
  ctx.fillStyle='#8d6e6355';
  ctx.fillRect(pen.x,pen.y,pen.w,pen.h);
  ctx.strokeStyle='#5d4037';ctx.lineWidth=4;
  ctx.strokeRect(pen.x,pen.y,pen.w,pen.h);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('pen_label','PEN'),pen.x+pen.w/2,pen.y-8);
}

function drawPlayer(){
  ctx.fillStyle='#ffca28';
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';
  ctx.beginPath();ctx.arc(player.x,player.y-4,4,0,Math.PI*2);ctx.fill();
}

function drawCat(cat){
  ctx.fillStyle=cat.inPen?'#a5d6a7':'#795548';
  ctx.beginPath();ctx.arc(cat.x,cat.y,cat.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3e2723';
  ctx.beginPath();ctx.moveTo(cat.x-8,cat.y-10);ctx.lineTo(cat.x-4,cat.y-18);ctx.lineTo(cat.x,cat.y-10);ctx.fill();
  ctx.beginPath();ctx.moveTo(cat.x+2,cat.y-10);ctx.lineTo(cat.x+6,cat.y-18);ctx.lineTo(cat.x+10,cat.y-10);ctx.fill();
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function updatePlayer(){
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(dx||dy){
    const len=Math.hypot(dx,dy);
    player.x+=dx/len*4.2;
    player.y+=dy/len*4.2;
    targetPos=null;
  } else if(targetPos){
    const d=dist(player,targetPos);
    if(d>3){
      player.x+=(targetPos.x-player.x)/d*4.5;
      player.y+=(targetPos.y-player.y)/d*4.5;
    }
  }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
}

function updateCats(){
  cats.forEach(cat=>{
    if(cat.inPen||cat.lost)return;
    cat.wanderT+=1;
    if(cat.wanderT>60){
      cat.wanderT=0;
      cat.vx+=rand(-0.4,0.4);
      cat.vy+=rand(-0.4,0.4);
      cat.vx=Math.max(-0.9,Math.min(0.9,cat.vx));
      cat.vy=Math.max(-0.9,Math.min(0.9,cat.vy));
    }
    // herding push from player
    const d=dist(player,cat);
    const herdRadius=70;
    if(d<herdRadius){
      const push=(herdRadius-d)/herdRadius*0.9;
      const ang=Math.atan2(cat.y-player.y,cat.x-player.x);
      cat.vx+=Math.cos(ang)*push;
      cat.vy+=Math.sin(ang)*push;
      // slight bias toward pen when being pushed
      const penCx=pen.x+pen.w/2,penCy=pen.y+pen.h/2;
      const angPen=Math.atan2(penCy-cat.y,penCx-cat.x);
      cat.vx+=Math.cos(angPen)*push*0.35;
      cat.vy+=Math.sin(angPen)*push*0.35;
    }
    cat.vx*=0.94;cat.vy*=0.94;
    cat.x+=cat.vx;cat.y+=cat.vy;

    // pen check
    if(cat.x>pen.x+8&&cat.x<pen.x+pen.w-8&&cat.y>pen.y+8&&cat.y<pen.y+pen.h-8){
      cat.inPen=true;
      herded++;
      score+=30;
      SFX.point();
    }
    // off-screen check
    if(cat.x<-30||cat.x>W+30||cat.y<-30||cat.y>H+30){
      cat.lost=true;
      lost++;
    }
  });
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#7cb342');g.addColorStop(1,'#a1887f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawPen();

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap, Click, or press a key to play again'),W/2,H/2+16);
    updateHud();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Move to start herding!'),W/2,40);
    cats.forEach(drawCat);
    drawPlayer();
    requestAnimationFrame(loop);
    return;
  }

  updatePlayer();
  updateCats();
  cats.forEach(cat=>{ if(!cat.lost) drawCat(cat); });
  drawPlayer();

  timeLeft-=1/60;
  if(herded>=total-lost&&herded>0&&cats.every(cat=>cat.inPen||cat.lost)){
    // all remaining cats herded
    score+=100*round;
    SFX.win();
    round++;
    if(score>hi){hi=score;localStorage.setItem('catherder_hi',hi);}
    startRound();
    started=true;
  } else if(timeLeft<=0){
    if(score>hi){hi=score;localStorage.setItem('catherder_hi',hi);}
    gameOver=true;
    SFX.lose();
  }

  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('score-display').textContent =
    I18N.t('catherder_hud','Herded: {h}/{t} | Score: {s} | Hi: {hi} | Time: {time}')
      .replace('{h}',herded).replace('{t}',total).replace('{s}',Math.floor(score))
      .replace('{hi}',Math.floor(hi)).replace('{time}',Math.max(0,Math.ceil(timeLeft)));
}

loop();
</script></body></html>
