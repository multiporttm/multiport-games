<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Harvest Festival</title><meta name="description" content="Play Harvest Festival free online — Harvest the exact crops each customer orders and deliver the basket before the timer runs out."><link rel="canonical" href="https://games.multiportllc.com/games/harvestfestival"><meta property="og:title" content="Harvest Festival - Multiport Games"><meta property="og:description" content="Play Harvest Festival free online — Harvest the exact crops each customer orders and deliver the basket before the timer runs out."><meta property="og:url" content="https://games.multiportllc.com/games/harvestfestival"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Harvest Festival","description":"Play Harvest Festival free online instantly. Harvest the exact crops each customer orders and deliver the basket before the timer runs out. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/harvestfestival","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#harvest-frame{background:#2d4a1e;border-radius:14px;padding:16px;max-width:520px;margin:0 auto;color:#fff;text-align:center}
#harvest-order{background:rgba(255,255,255,0.1);border-radius:10px;padding:10px;margin-bottom:12px;font-size:1.4rem}
#harvest-basket{min-height:40px;font-size:1.4rem;background:rgba(0,0,0,0.25);border-radius:8px;padding:6px;margin-bottom:12px}
#harvest-field{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.harvest-plot{background:#4a7c2f;border-radius:8px;padding:14px 0;font-size:2rem;cursor:pointer;user-select:none}
.harvest-plot:active{transform:scale(0.94)}
#harvest-deliver{background:#ffb703;color:#2d4a1e;border:none;border-radius:8px;padding:10px 22px;font-weight:800;font-size:1rem;cursor:pointer}
#score-display{color:#a3d977;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Harvest Festival</div>
  <div class="game-frame">
    <div id="score-display">Deliveries: 0 | Lives: 3</div>
    <div id="harvest-frame">
      <div id="harvest-order"></div>
      <div id="harvest-basket"></div>
      <div id="harvest-field"></div>
      <button id="harvest-deliver">🚚 Deliver</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the crop plots to harvest the exact crops shown in the order above, then click <b>Deliver</b> before the timer runs out. Wrong crops or a late delivery costs a life!</div>
</div>
<script>
const CROPS=['🌽','🎃','🍅','🍇','🥕'];
let basket=[],order=[],deliveries=0,lives=3,gameOver=false,timer=0,timerMax=0,timerInterval=null;

function newOrder(){
  const n=2+Math.min(3,Math.floor(deliveries/2));
  order=[];
  for(let i=0;i<n;i++)order.push(CROPS[Math.floor(Math.random()*CROPS.length)]);
  basket=[];
  timerMax=Math.max(5,9-deliveries*0.2);
  timer=timerMax;
  renderOrder();renderBasket();
}

function renderOrder(){
  const counts={};
  order.forEach(c=>counts[c]=(counts[c]||0)+1);
  document.getElementById('harvest-order').textContent=I18N.t('order_label2','Order: ')+Object.entries(counts).map(([c,n])=>c+'×'+n).join('  ');
}
function renderBasket(){
  document.getElementById('harvest-basket').textContent=basket.length?basket.join(' '):I18N.t('basket_empty','(basket empty)');
}
function renderField(){
  const field=document.getElementById('harvest-field');
  field.innerHTML='';
  CROPS.forEach(crop=>{
    const plot=document.createElement('div');
    plot.className='harvest-plot';
    plot.textContent=crop;
    plot.onclick=()=>{
      if(gameOver)return;
      basket.push(crop);
      SFX.click();
      renderBasket();
    };
    field.appendChild(plot);
  });
}

function counts(arr){const c={};arr.forEach(x=>c[x]=(c[x]||0)+1);return c;}
function sameOrder(a,b){
  const ca=counts(a),cb=counts(b);
  const keys=new Set([...Object.keys(ca),...Object.keys(cb)]);
  for(const k of keys)if((ca[k]||0)!==(cb[k]||0))return false;
  return true;
}

document.getElementById('harvest-deliver').onclick=()=>{
  if(gameOver)return;
  if(sameOrder(basket,order)){
    deliveries++;
    SFX.success();
    newOrder();
  }else{
    loseLife();
  }
};

function loseLife(){
  lives--;
  SFX.error();
  if(lives<=0){
    endGame();
  }else{
    newOrder();
  }
  updateHUD();
}

function updateHUD(){
  document.getElementById('score-display').textContent=I18N.t('deliveries_lives_label','Deliveries: {n} | Lives: {l}').replace('{n}',deliveries).replace('{l}',Math.max(0,lives));
}

function endGame(){
  gameOver=true;
  clearInterval(timerInterval);
  SFX.lose();
  document.getElementById('harvest-order').textContent=I18N.t('game_over_deliveries','Game Over! Deliveries completed: {n}').replace('{n}',deliveries);
  document.getElementById('harvest-basket').textContent=I18N.t('tap_deliver_retry','Tap Deliver to play again');
  document.getElementById('harvest-deliver').onclick=()=>{
    gameOver=false;deliveries=0;lives=3;
    document.getElementById('harvest-deliver').onclick=deliverHandler;
    startTimer();
    newOrder();
    updateHUD();
  };
}

let deliverHandler;
deliverHandler=document.getElementById('harvest-deliver').onclick;

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(gameOver)return;
    timer-=0.2;
    if(timer<=0){
      loseLife();
    }
  },200);
}

renderField();
newOrder();
updateHUD();
startTimer();
</script></body></html>
