<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0e1420;display:block;border-radius:8px;touch-action:none}
#score-display{color:#bfe8ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#panel{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px auto;max-width:800px}
#panel button{padding:7px 12px;border:none;border-radius:8px;background:#2a3a55;color:#fff;font-weight:700;cursor:pointer;font-size:.85rem}
#panel button:active{transform:scale(.95)}
#clarityRow{display:flex;justify-content:center;gap:6px;margin:4px auto 10px;flex-wrap:wrap}
#clarityRow button{padding:6px 10px;border:none;border-radius:8px;background:#3a2a55;color:#fff;font-weight:700;cursor:pointer;font-size:.8rem}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gemstone Identification Loupe</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="panel"></div>
    <div id="clarityRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move the loupe over the gem (mouse, touch-drag, or <b>Arrow Keys</b>) to inspect its color and inclusions. Pick the correct gemstone and its clarity grade before the timer runs out. Watch out for tricky look-alikes as the catalog grows!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;
const scoreDisplay=document.getElementById('score-display');
const HI_KEY='gemstoneidentificationloupe_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,lives=3,level=1,gameOver=false,won=false,started=false;

const GEMS=[
  {name:'Ruby',color:'#9b1b30',refr:1.76,inclusions:3},
  {name:'Pink Sapphire',color:'#c25277',refr:1.77,inclusions:2},
  {name:'Emerald',color:'#0e7a4a',refr:1.58,inclusions:5},
  {name:'Peridot',color:'#8fae1e',refr:1.65,inclusions:2},
  {name:'Blue Sapphire',color:'#1f4aa8',refr:1.77,inclusions:2},
  {name:'Tanzanite',color:'#3c3a9e',refr:1.69,inclusions:1},
  {name:'Amethyst',color:'#7b42a8',refr:1.55,inclusions:2},
  {name:'Citrine',color:'#d99a1b',refr:1.55,inclusions:1},
  {name:'Topaz',color:'#e8b94a',refr:1.62,inclusions:1},
  {name:'Aquamarine',color:'#5fc6d9',refr:1.58,inclusions:1},
  {name:'Diamond',color:'#eef6ff',refr:2.42,inclusions:2},
  {name:'White Zircon',color:'#dff0f7',refr:1.93,inclusions:1},
  {name:'Garnet',color:'#7a1f2b',refr:1.76,inclusions:4},
  {name:'Spinel (Red)',color:'#a8273a',refr:1.72,inclusions:2},
  {name:'Morganite',color:'#e9b7c0',refr:1.59,inclusions:1},
];
const CLARITY=['FL','VVS','VS','SI','I'];

const panel=document.getElementById('panel');
const clarityRow=document.getElementById('clarityRow');

let gemPool,current,chosenGem,chosenClarity,incPositions,levelTime,timeLeft,loupe,resultMsg,resultTimer;

function poolForLevel(lvl){
  const n=Math.min(GEMS.length,6+Math.floor(lvl*1.1));
  return GEMS.slice(0,n);
}

function newRound(){
  gemPool=poolForLevel(level);
  const trueGem=gemPool[Math.floor(Math.random()*gemPool.length)];
  const trueClarityIdx=Math.max(0,Math.min(CLARITY.length-1,Math.floor(Math.random()*CLARITY.length)));
  current={gem:trueGem,clarityIdx:trueClarityIdx};
  chosenGem=null;chosenClarity=null;
  incPositions=[];
  const incCount=trueGem.inclusions+Math.max(0,4-trueClarityIdx)-2;
  for(let i=0;i<Math.max(0,incCount);i++){
    incPositions.push({x:(Math.random()-0.5)*60,y:(Math.random()-0.5)*60,r:2+Math.random()*2.5});
  }
  levelTime=Math.max(14,26-level*0.7);
  timeLeft=levelTime;
  loupe={x:W/2,y:H/2-20};
  resultMsg=null;resultTimer=0;
  buildButtons();
}

function buildButtons(){
  panel.innerHTML='';
  const options=new Set([current.gem.name]);
  const shuffled=[...gemPool].sort(()=>Math.random()-0.5);
  for(const g of shuffled){
    if(options.size>=Math.min(6,gemPool.length))break;
    options.add(g.name);
  }
  [...options].sort(()=>Math.random()-0.5).forEach(name=>{
    const btn=document.createElement('button');
    btn.textContent=name;
    btn.addEventListener('click',()=>{started=true;chosenGem=name;tryEvaluate();});
    panel.appendChild(btn);
  });
  clarityRow.innerHTML='';
  CLARITY.forEach((cl,idx)=>{
    const btn=document.createElement('button');
    btn.textContent=I18N.t('clarity_'+cl,cl);
    btn.addEventListener('click',()=>{started=true;chosenClarity=idx;tryEvaluate();});
    clarityRow.appendChild(btn);
  });
}

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;
  newRound();
}

function loseLife(){
  lives--;
  SFX.hit();
  if(lives<=0){
    gameOver=true;won=false;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  }else{
    newRound();
  }
}

function tryEvaluate(){
  if(chosenGem==null||chosenClarity==null)return;
  const gemOk=chosenGem===current.gem.name;
  const clarityOk=chosenClarity===current.clarityIdx;
  if(gemOk&&clarityOk){
    const bonus=100+Math.floor(timeLeft*8)+level*5;
    score+=bonus;
    resultMsg='correct';
    SFX.success();
    level++;
    if(level>16){
      gameOver=true;won=true;SFX.win();
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    }else{
      newRound();
    }
  }else{
    resultMsg='wrong';
    SFX.error();
    loseLife();
  }
}

// loupe movement: mouse/touch drag, arrow keys
let keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  started=true;
  if(e.code==='Space'&&gameOver)resetGame();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function toCanvasCoords(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*scaleX,y:(clientY-rect.top)*scaleY};
}
let dragging=false;
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(gameOver){resetGame();return;}
  started=true;dragging=true;
  const p=toCanvasCoords(e);loupe.x=p.x;loupe.y=p.y;
});
c.addEventListener('pointermove',e=>{
  if(!dragging)return;
  e.preventDefault();
  const p=toCanvasCoords(e);loupe.x=p.x;loupe.y=p.y;
});
window.addEventListener('pointerup',()=>dragging=false);
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameOver){resetGame();return;}started=true;dragging=true;const p=toCanvasCoords(e);loupe.x=p.x;loupe.y=p.y;},{passive:false});
c.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();const p=toCanvasCoords(e);loupe.x=p.x;loupe.y=p.y;},{passive:false});
c.addEventListener('touchend',()=>dragging=false);

newRound();

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0e1420';ctx.fillRect(0,0,W,H);

  if(started&&!gameOver){
    if(resultTimer>0){resultTimer-=dt;if(resultTimer<=0)resultMsg=null;}
    timeLeft-=dt;
    if(keys['ArrowUp'])loupe.y-=150*dt;
    if(keys['ArrowDown'])loupe.y+=150*dt;
    if(keys['ArrowLeft'])loupe.x-=150*dt;
    if(keys['ArrowRight'])loupe.x+=150*dt;
    loupe.x=Math.max(60,Math.min(W-60,loupe.x));
    loupe.y=Math.max(60,Math.min(H-100,loupe.y));
    if(timeLeft<=0){
      resultMsg='wrong';
      loseLife();
      timeLeft=0;
    }
  }

  // Gem on velvet tray (small, blurry without loupe)
  const gx=W/2,gy=H/2-20,gr=36;
  ctx.save();
  ctx.fillStyle='#241a30';ctx.fillRect(0,H-60,W,60);
  const grad=ctx.createRadialGradient(gx-10,gy-10,2,gx,gy,gr);
  grad.addColorStop(0,'#ffffff55');
  grad.addColorStop(0.3,current.gem.color);
  grad.addColorStop(1,current.gem.color+'cc');
  ctx.fillStyle=grad;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const r=gr*(0.85+0.15*Math.sin(a*3+level));
    const px=gx+Math.cos(a)*r,py=gy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();

  // Loupe magnifier lens
  const lensR=85;
  const dx=loupe.x-gx,dy=loupe.y-gy;
  const distToGem=Math.hypot(dx,dy);
  const overGem=distToGem<lensR+gr*0.5;

  ctx.save();
  ctx.beginPath();ctx.arc(loupe.x,loupe.y,lensR,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#07090f';ctx.fillRect(loupe.x-lensR,loupe.y-lensR,lensR*2,lensR*2);
  if(overGem){
    // zoomed gem render inside lens, 2.2x
    const zoom=2.2;
    ctx.save();
    ctx.translate(loupe.x,loupe.y);
    ctx.scale(zoom,zoom);
    ctx.translate(-gx,-gy);
    const g2=ctx.createRadialGradient(gx-10,gy-10,2,gx,gy,gr*1.3);
    g2.addColorStop(0,'#ffffff88');
    g2.addColorStop(0.35,current.gem.color);
    g2.addColorStop(1,current.gem.color+'ee');
    ctx.fillStyle=g2;
    ctx.beginPath();ctx.arc(gx,gy,gr*1.3,0,Math.PI*2);ctx.fill();
    // facet lines (refraction hint)
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=0.6;
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2+level*0.1;
      ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.cos(a)*gr*1.3,gy+Math.sin(a)*gr*1.3);ctx.stroke();
    }
    // inclusions
    ctx.fillStyle='rgba(20,20,20,0.6)';
    incPositions.forEach(p=>{
      ctx.beginPath();ctx.arc(gx+p.x,gy+p.y,p.r,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
  ctx.restore();
  ctx.lineWidth=5;ctx.strokeStyle='#8a8a9a';
  ctx.beginPath();ctx.arc(loupe.x,loupe.y,lensR,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='#ffd54f';
  ctx.beginPath();ctx.arc(loupe.x,loupe.y,lensR-4,0,Math.PI*2);ctx.stroke();
  // handle
  ctx.strokeStyle='#5a5a66';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();
  const hx=loupe.x+Math.cos(Math.PI*0.3)*lensR,hy=loupe.y+Math.sin(Math.PI*0.3)*lensR;
  ctx.moveTo(hx,hy);ctx.lineTo(hx+34,hy+34);ctx.stroke();

  ctx.textAlign='left';ctx.font='13px Arial';ctx.fillStyle='#9fd';
  ctx.fillText('n='+current.gem.refr.toFixed(2),12,H-70);
  ctx.fillText(I18N.t('inclusions_hint','Inclusions seen: {n}').replace('{n}',incPositions.length),12,H-52);

  // HUD
  ctx.font='16px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('level_label','Gem {n}').replace('{n}',level),16,24);
  ctx.fillText('❤️'.repeat(Math.max(0,lives)),16,48);
  ctx.textAlign='right';ctx.fillStyle=timeLeft<5?'#ff5555':'#ffd54f';
  ctx.fillText(I18N.t('time_label','Time: {t}s').replace('{t}',Math.max(0,timeLeft).toFixed(1)),W-16,24);

  if(resultMsg){
    ctx.textAlign='center';ctx.font='bold 22px Arial';
    ctx.fillStyle=resultMsg==='correct'?'#39d353':'#ff5555';
    ctx.fillText(resultMsg==='correct'?I18N.t('id_correct','Correct ID!'):I18N.t('id_wrong','Incorrect!'),W/2,70);
  }

  if(!started){
    ctx.textAlign='center';ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';
    ctx.fillText(I18N.t('start_hint','Move the loupe over the gem to inspect it'),W/2,H-16);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.font='bold 34px Arial';
    ctx.fillText(won?I18N.t('win_title','MASTER GEMOLOGIST!'):I18N.t('game_over_title','MISIDENTIFIED'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap canvas or Space to try again'),W/2,H/2+20);
  }

  scoreDisplay.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
