<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Surfboard Waxing</title><meta name="description" content="Play Surfboard Waxing free online — Drag (or arrow keys + Space) to rub wax in overlapping circles. Cover the whole board with base coat, then top coat, before time runs out!"><link rel="canonical" href="https://games.multiportllc.com/games/surfboardwaxing"><meta property="og:title" content="Surfboard Waxing - Multiport Games"><meta property="og:description" content="Play Surfboard Waxing free online — Drag (or arrow keys + Space) to rub wax in overlapping circles. Cover the whole board with base coat, then top coat, before time runs out!"><meta property="og:url" content="https://games.multiportllc.com/games/surfboardwaxing"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Surfboard Waxing","description":"Play Surfboard Waxing free online instantly. Rub wax across the whole standing area of your surfboard in overlapping circular strokes — lay down the base coat, then the top coat, to build proper traction bumps before you head out to the lineup. Boards get stickier to fully cover and the clock gets tighter every level. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/surfboardwaxing","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>

<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1e8fb0;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe29a;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Surfboard Waxing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag across the board (or use <b>Arrow Keys</b> + hold <b>Space</b>) to rub wax in overlapping circles. Cover the whole board with <b>base coat</b>, then <b>top coat</b>, before the timer runs out. You have 3 boards — don't waste them!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;

const board={cx:250,topY:60,botY:540,w:200};
board.r=board.w/2;
const cellSize=14;
let cells=[]; // {cx,cy,base,top}
(function buildCells(){
  for(let y=board.topY;y<=board.botY;y+=cellSize){
    for(let x=board.cx-board.r-cellSize;x<=board.cx+board.r+cellSize;x+=cellSize){
      if(insideBoard(x,y))cells.push({x,y,base:false,top:false});
    }
  }
})();
function insideBoard(px,py){
  const r=board.r;
  if(py<board.topY+r){
    const dx=px-board.cx,dy=py-(board.topY+r);
    return dx*dx+dy*dy<=r*r;
  }
  if(py>board.botY-r){
    const dx=px-board.cx,dy=py-(board.botY-r);
    return dx*dx+dy*dy<=r*r;
  }
  return Math.abs(px-board.cx)<=r;
}

let lives=3,score=0,hi=0,level=1;
try{hi=parseFloat(localStorage.getItem('hs_surfboardwaxing'))||0;}catch(e){hi=0;}

let phase='base'; // 'base' or 'top'
let timeLeft=0,roundTime=0;
let brushR=26;
let cursor={x:board.cx,y:(board.topY+board.botY)/2};
let gameOver=false,started=false,messageTimer=0,message='';
let lastTime=null;

function roundTimeForLevel(lv){ return Math.max(9,26-lv*1.2); }
function brushForLevel(lv){ return Math.max(16,27-lv*0.6); }

function resetBoardCells(){
  cells.forEach(cl=>{cl.base=false;cl.top=false;});
}
function startRound(){
  resetBoardCells();
  phase='base';
  roundTime=roundTimeForLevel(level);
  timeLeft=roundTime;
  brushR=brushForLevel(level);
}
function newGame(){
  lives=3;score=0;level=1;gameOver=false;started=false;message='';messageTimer=0;
  startRound();
}
newGame();

function coveredCount(phaseKey){
  let n=0;cells.forEach(cl=>{if(cl[phaseKey])n++;});
  return n;
}
function coveragePct(phaseKey){
  if(!cells.length)return 1;
  return coveredCount(phaseKey)/cells.length;
}

function paintAt(x,y){
  const r2=brushR*brushR;
  let newly=0;
  cells.forEach(cl=>{
    const dx=cl.x-x,dy=cl.y-y;
    if(dx*dx+dy*dy<=r2){
      if(phase==='base'&&!cl.base){cl.base=true;newly++;}
      else if(phase==='top'&&cl.base&&!cl.top){cl.top=true;newly++;}
    }
  });
  if(newly>0){
    score+=newly;
    if(Math.random()<0.25)SFX.tick();
  }
}

function loseLife(){
  lives--;
  SFX.fail();
  if(lives<=0){
    gameOver=true;
    if(score>hi){hi=score;try{localStorage.setItem('hs_surfboardwaxing',String(hi));}catch(e){}}
    SFX.lose();
  }else{
    message=I18N.t('board_ruined','Board not ready — grab another!');
    messageTimer=90;
    startRound();
  }
}

function completePhase(){
  if(phase==='base'){
    SFX.success();
    phase='top';
    message=I18N.t('base_done','Base coat done — now the top coat!');
    messageTimer=70;
  }else{
    score+=Math.floor(timeLeft*5)+level*15;
    level++;
    SFX.levelup();
    message=I18N.t('level_clear','Nice coat! Heading to the lineup...');
    messageTimer=80;
    startRound();
  }
}

// ---- Input ----
let isDown=false;
function getMousePos(e){const rect=c.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};}
function getTouchPos(e){const rect=c.getBoundingClientRect();const t=e.touches[0]||e.changedTouches[0];return{x:(t.clientX-rect.left)*W/rect.width,y:(t.clientY-rect.top)*H/rect.height};}

function pointerDown(p){
  if(!started){started=true;}
  if(gameOver){newGame();return;}
  isDown=true;
  cursor.x=p.x;cursor.y=p.y;
  paintAt(p.x,p.y);
}
function pointerMove(p){
  if(!isDown)return;
  cursor.x=p.x;cursor.y=p.y;
  paintAt(p.x,p.y);
}
function pointerUp(){isDown=false;}

c.addEventListener('mousedown',e=>{pointerDown(getMousePos(e));});
c.addEventListener('mousemove',e=>{pointerMove(getMousePos(e));});
window.addEventListener('mouseup',pointerUp);
c.addEventListener('touchstart',e=>{e.preventDefault();pointerDown(getTouchPos(e));},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();pointerMove(getTouchPos(e));},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();pointerUp();},{passive:false});
c.addEventListener('touchcancel',e=>{e.preventDefault();pointerUp();},{passive:false});

const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(!started)started=true;
  if(gameOver&&(e.code==='Space'||e.code.startsWith('Arrow'))){newGame();}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function handleKeyboard(dt){
  const spd=3.4*dt;
  let moved=false;
  if(keys.ArrowUp){cursor.y-=spd;moved=true;}
  if(keys.ArrowDown){cursor.y+=spd;moved=true;}
  if(keys.ArrowLeft){cursor.x-=spd;moved=true;}
  if(keys.ArrowRight){cursor.x+=spd;moved=true;}
  cursor.x=Math.max(0,Math.min(W,cursor.x));
  cursor.y=Math.max(0,Math.min(H,cursor.y));
  if(moved||keys.Space)paintAt(cursor.x,cursor.y);
}

// ---- Render ----
function drawBoardPath(){
  const r=board.r;
  ctx.beginPath();
  ctx.moveTo(board.cx-r,board.topY+r);
  ctx.arc(board.cx,board.topY+r,r,Math.PI,2*Math.PI);
  ctx.lineTo(board.cx+r,board.botY-r);
  ctx.arc(board.cx,board.botY-r,r,0,Math.PI);
  ctx.closePath();
}

function render(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0e4d66');sky.addColorStop(1,'#1e8fb0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.save();
  drawBoardPath();
  ctx.clip();
  ctx.fillStyle='#e8c27a';
  ctx.fillRect(board.cx-board.r-5,board.topY-5,board.w+10,board.botY-board.topY+10);
  // stringer line
  ctx.strokeStyle='#c9a35f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(board.cx,board.topY);ctx.lineTo(board.cx,board.botY);ctx.stroke();

  cells.forEach(cl=>{
    if(cl.base){
      ctx.fillStyle='rgba(255,255,255,0.45)';
      ctx.beginPath();ctx.arc(cl.x,cl.y,cellSize*0.62,0,Math.PI*2);ctx.fill();
    }
    if(cl.top){
      ctx.fillStyle='rgba(255,241,189,0.6)';
      ctx.beginPath();ctx.arc(cl.x,cl.y,cellSize*0.45,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.restore();

  ctx.strokeStyle='#a9793a';ctx.lineWidth=4;
  drawBoardPath();ctx.stroke();

  // brush cursor
  if(started&&!gameOver){
    ctx.strokeStyle=phase==='base'?'rgba(255,255,255,0.85)':'rgba(255,224,130,0.9)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cursor.x,cursor.y,brushR,0,Math.PI*2);ctx.stroke();
  }

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_wax','Drag or use Arrow Keys + Space to start waxing'),W/2,H/2);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+16);
  } else if(messageTimer>0){
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(message,W/2,30);
  }

  const pct=Math.floor(coveragePct(phase)*100);
  const label=phase==='base'?I18N.t('phase_base','Base Coat'):I18N.t('phase_top','Top Coat');
  document.getElementById('score-display').textContent=
    I18N.t('wax_status_label','Score: {s} | Hi: {h} | Lv {lv} | {ph}: {p}% | Lives: {lives} | Time: {t}s')
      .replace('{s}',score).replace('{h}',Math.floor(hi)).replace('{lv}',level)
      .replace('{ph}',label).replace('{p}',pct).replace('{lives}',lives).replace('{t}',Math.ceil(timeLeft));
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(started&&!gameOver){
    handleKeyboard(dt);
    if(messageTimer>0)messageTimer-=dt;
    timeLeft-=dt/60;
    if(coveragePct(phase)>=0.97){
      completePhase();
    } else if(timeLeft<=0){
      timeLeft=0;
      loseLife();
    }
  }
  render();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
