<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0288d1;display:block;border-radius:8px;touch-action:none}
#score-display{color:#81d4fa;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Windsurf Rally</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <canvas id="c" width="480" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> (or <b>drag</b> on touch) to steer left and right. Dodge the buoys and rocks, and ride the swirling <b>wind gust</b> zones for a speed boost. How far can you go?</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=600;
let hi=parseFloat(localStorage.getItem('windsurfrally_hi')||'0');
let score=0,distance=0,gameOver=false,started=false;
const board={x:W/2,y:H-100,w:34,h:60,vx:0};
let obstacles=[],gusts=[],wake=[];
let baseSpeed=6,boostTimer=0,frame=0;
let lastTime=null,obsTimer=0,gustTimer=0;
let keys={left:false,right:false};
let dragX=null;

function reset(){
  score=0;distance=0;gameOver=false;started=false;
  board.x=W/2;board.vx=0;
  obstacles=[];gusts=[];wake=[];
  baseSpeed=6;boostTimer=0;frame=0;lastTime=null;obsTimer=0;gustTimer=0;
}

function statusText(){
  document.getElementById('score-display').textContent=
    I18N.t('windsurf_status','Distance: {d}m | Hi: {h}m').replace('{d}',Math.floor(distance)).replace('{h}',Math.floor(hi));
}

function start(){
  if(!started)started=true;
  if(gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;start();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;start();}
  if(e.code==='Space')start();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
c.addEventListener('mousedown',e=>{start();dragX=e.clientX;});
window.addEventListener('mousemove',e=>{
  if(dragX===null)return;
  const rect=c.getBoundingClientRect();
  const scale=W/rect.width;
  const targetX=(e.clientX-rect.left)*scale;
  board.x=targetX;
});
window.addEventListener('mouseup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();start();dragX=1;
  const rect=c.getBoundingClientRect();const scale=W/rect.width;
  board.x=(e.touches[0].clientX-rect.left)*scale;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();const scale=W/rect.width;
  board.x=(e.touches[0].clientX-rect.left)*scale;
},{passive:false});
c.addEventListener('touchend',()=>{dragX=null;});

function spawnObstacle(){
  const type=Math.random()<0.5?'buoy':'rock';
  const x=40+Math.random()*(W-80);
  obstacles.push({x,y:-40,r:type==='buoy'?16:20,type});
}
function spawnGust(){
  const x=60+Math.random()*(W-120);
  gusts.push({x,y:-60,r:44});
}

function circleHit(a,b,ar,br){return Math.hypot(a.x-b.x,a.y-b.y)<ar+br;}

function drawBoard(){
  ctx.save();
  ctx.translate(board.x,board.y);
  ctx.rotate(board.vx*0.03);
  ctx.fillStyle='#ffca28';
  ctx.beginPath();
  ctx.ellipse(0,0,board.w/2,board.h/2,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(-2,-board.h/2-26,4,30);
  ctx.fillStyle=boostTimer>0?'#ff7043':'#e53935';
  ctx.beginPath();
  ctx.moveTo(0,-board.h/2-26);
  ctx.lineTo(20,-board.h/2-10);
  ctx.lineTo(0,-board.h/2+6);
  ctx.fill();
  ctx.restore();
}

function drawObstacle(o){
  if(o.type==='buoy'){
    ctx.fillStyle='#ff5252';
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(o.x,o.y,o.r*0.4,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='#607d8b';
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#455a64';
    ctx.beginPath();ctx.arc(o.x-5,o.y-4,o.r*0.4,0,Math.PI*2);ctx.fill();
  }
}

function drawGust(g,f){
  ctx.save();
  ctx.globalAlpha=0.55;
  ctx.strokeStyle='#e1f5fe';
  ctx.lineWidth=4;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(g.x,g.y,g.r-i*10,f*0.05+i,Math.PI*1.4,false);
    ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const water=ctx.createLinearGradient(0,0,0,H);
  water.addColorStop(0,'#0288d1');water.addColorStop(1,'#01579b');
  ctx.fillStyle=water;ctx.fillRect(0,0,W,H);

  // wake stripes
  frame++;
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  ctx.lineWidth=3;
  for(let i=0;i<6;i++){
    const y=((frame*4+i*100)%(H+100))-50;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y-20);ctx.stroke();
  }

  if(gameOver){
    drawBoard();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+16);
    statusText();
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('windsurf_start_hint','Move / Space / Tap to start'),W/2,H/2);
    drawBoard();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  // steering
  const steerAccel=0.9;
  if(keys.left)board.vx-=steerAccel*dt;
  if(keys.right)board.vx+=steerAccel*dt;
  board.vx*=0.9;
  board.vx=Math.max(-10,Math.min(10,board.vx));
  board.x+=board.vx*dt;
  board.x=Math.max(board.w/2,Math.min(W-board.w/2,board.x));

  if(boostTimer>0)boostTimer-=dt;
  const speed=baseSpeed+(boostTimer>0?5:0);
  distance+=speed*dt*0.12;
  score=distance;
  if(distance>hi)hi=distance;
  baseSpeed=6+distance/400;

  obsTimer+=dt;
  const obsInterval=Math.max(22,55-distance/30);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObstacle();}

  gustTimer+=dt;
  if(gustTimer>=140){gustTimer=0;spawnGust();}

  obstacles=obstacles.filter(o=>o.y<H+50);
  obstacles.forEach(o=>{
    o.y+=speed*dt;
    drawObstacle(o);
    if(circleHit(board,o,board.w/2-4,o.r-4)&&!gameOver){
      gameOver=true;SFX.lose();
      if(hi>parseFloat(localStorage.getItem('windsurfrally_hi')||'0'))localStorage.setItem('windsurfrally_hi',hi);
    }
  });

  gusts=gusts.filter(g=>g.y<H+80);
  gusts.forEach(g=>{
    g.y+=speed*dt;
    drawGust(g,frame);
    if(circleHit(board,g,board.w/2,g.r)&&boostTimer<=0){
      boostTimer=90;
      SFX.powerup();
    }
  });

  drawBoard();

  if(boostTimer>0){
    ctx.fillStyle='#ff7043';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('windsurf_boost','BOOST!'),W/2,40);
  }

  statusText();
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
