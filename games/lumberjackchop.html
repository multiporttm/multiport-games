<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#6d4c41}
#ui{color:#d7ccc8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px}
#btns button{padding:14px 30px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:1.2rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lumberjack Chop</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Chops: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="leftBtn">⬅️ Chop</button>
      <button id="rightBtn">➡️ Chop</button>
    </div>
  </div>
  <div class="game-instructions">Left/Right arrows (or the buttons) to chop that side of the trunk. Each chop pushes the log stack up — but if a branch is on the side you just chopped, it knocks you off. Speed increases the higher you climb!</div>
</div>
<script>
const W=360,H=360,SEG_H=44,SEGS=8;
let logs,playerSide,chops,state,fallY;

function loadBest(){return +(localStorage.getItem('lumberjackchop_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('lumberjackchop_best',v);}

function init(){
  logs=[];
  for(let i=0;i<SEGS;i++)logs.push(branchFor(i));
  playerSide='none';chops=0;state='play';fallY=0;
}

function branchFor(i){
  if(i<3)return 'none';
  const r=Math.random();
  return r<0.35?'left':r<0.7?'right':'none';
}

function chop(side){
  if(state==='over'){init();return;}
  if(state!=='play')return;
  const top=logs[logs.length-1];
  if(top===side){
    state='over';
    SFX.lose();
    saveBest(chops);
    updateUI();
    return;
  }
  logs.push(branchFor(chops));
  logs.shift();
  chops++;
  playerSide=side;
  SFX.hit();
  saveBest(chops);
  updateUI();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')chop('left');
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')chop('right');
});
document.getElementById('leftBtn').addEventListener('click',()=>chop('left'));
document.getElementById('rightBtn').addEventListener('click',()=>chop('right'));

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#6d4c41';ctx.fillRect(0,0,W,H);

  const cx=W/2,baseY=H-30;
  for(let i=0;i<logs.length;i++){
    const y=baseY-i*SEG_H;
    ctx.fillStyle='#8d6e63';
    ctx.fillRect(cx-24,y-SEG_H+4,48,SEG_H-4);
    ctx.strokeStyle='#5d4037';ctx.strokeRect(cx-24,y-SEG_H+4,48,SEG_H-4);
    if(logs[i]==='left'){
      ctx.fillStyle='#4caf50';
      ctx.fillRect(cx-60,y-SEG_H+10,36,14);
    }else if(logs[i]==='right'){
      ctx.fillStyle='#4caf50';
      ctx.fillRect(cx+24,y-SEG_H+10,36,14);
    }
  }

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  const py=baseY-(logs.length)*SEG_H+SEG_H/2;
  ctx.fillText('🪓',playerSide==='right'?cx+40:playerSide==='left'?cx-40:cx-40,py);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d7ccc8';ctx.font='bold 26px Arial';
    ctx.fillText('TIMBER!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Chops: ${chops} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap Chop to retry',W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Chops: ${chops} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
