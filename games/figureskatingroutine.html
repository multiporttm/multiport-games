<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#3a1c5c,#c96bd8);display:block;border-radius:8px}
#hud{color:#f6e6ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Figure Skating Routine</div>
  <div class="game-frame">
    <div id="hud">Move 1/12 | Score: 0 | Combo: 0 | Best Score: 0 | Best Combo: 0</div>
    <canvas id="c" width="800" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> right as the sliding marker enters the highlighted target zone to nail each spin, jump, and glide. Good timing builds your <b>combo</b>; a mistimed move breaks it.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;
const hud=document.getElementById('hud');
const KEY='figureskatingroutine_best';
function loadBest(){try{return JSON.parse(localStorage.getItem(KEY))||{score:0,combo:0};}catch(e){return {score:0,combo:0};}}
function saveBest(b){localStorage.setItem(KEY,JSON.stringify(b));}
let best=loadBest();

const MOVES=[{id:'spin',icon:'🌀',name:'Spin'},{id:'jump',icon:'⛸️',name:'Jump'},{id:'glide',icon:'➡️',name:'Glide'}];
const TOTAL=12;
let seq=[],idx=0,phase='ready',score=0,combo=0,barT=0,barDir=1,resolved=false,lastRating='',lastPts=0,doneScore=0,doneCombo=0;

function newRoutine(){
  seq=[];for(let i=0;i<TOTAL;i++)seq.push(MOVES[Math.floor(Math.random()*MOVES.length)]);
  idx=0;score=0;combo=0;phase='ready';
}
newRoutine();

function startMove(){
  phase='play';barT=0;barDir=1;resolved=false;
}

function act(){
  if(phase==='ready'){startMove();return;}
  if(phase==='result'||phase==='done'){
    if(phase==='done'){newRoutine();return;}
    idx++;
    if(idx>=TOTAL){
      phase='done';doneScore=score;doneCombo=combo>best.combo?combo:best.combo;
      if(score>best.score)best.score=score;
      if(combo>best.combo)best.combo=combo;
      // track max combo achieved this run separately
      saveBest(best);
      SFX.win();
    } else {
      startMove();
    }
    return;
  }
  if(phase==='play'&&!resolved){
    resolved=true;
    const pos=barPos();
    const d=Math.abs(pos-0.5);
    let rating,pts;
    if(d<0.06){rating='PERFECT';pts=100;combo++;SFX.success();}
    else if(d<0.16){rating='GOOD';pts=60;combo++;SFX.point();}
    else{rating='MISS';pts=0;combo=0;SFX.error();}
    const mult=1+Math.min(combo,10)*0.1;
    lastPts=Math.round(pts*mult);
    score+=lastPts;
    lastRating=rating;
    phase='result';
  }
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act();}});
c.addEventListener('click',act);
c.addEventListener('touchstart',e=>{e.preventDefault();act();},{passive:false});

function barPos(){return (Math.sin(barT)+1)/2;}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#3a1c5c');bg.addColorStop(1,'#c96bd8');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // ice rink floor
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(0,H-60,W,60);

  const move=seq[Math.min(idx,TOTAL-1)];
  ctx.fillStyle='#fff';ctx.font='72px serif';ctx.textAlign='center';
  ctx.fillText(move.icon,400,150);
  ctx.font='bold 22px Arial';
  ctx.fillText(I18N.t('fig_move_'+move.id,move.name.toUpperCase()),400,190);

  if(phase==='ready'){
    ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('fig_ready_msg','Tap / Space to start the move'),400,260);
  } else if(phase==='play'){
    barT+=0.11;
    const bx=150,by=280,bw=500,bh=26;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#7ec850';ctx.fillRect(bx+bw*0.44,by,bw*0.12,bh);
    ctx.fillStyle='#ffd54f';ctx.fillRect(bx+bw*0.38,by,bw*0.24,bh/3);
    const pos=barPos();
    ctx.fillStyle='#fff';ctx.fillRect(bx+pos*bw-3,by-6,6,bh+12);
    ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('fig_timing_msg','Tap in the zone!'),400,264);
  } else if(phase==='result'){
    ctx.font='bold 30px Arial';
    ctx.fillStyle=lastRating==='MISS'?'#ff6b6b':'#7ec850';
    ctx.fillText(I18N.t('fig_rating_'+lastRating,lastRating),400,250);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('fig_pts_label','+{p} pts | Combo: {c}').replace('{p}',lastPts).replace('{c}',combo),400,280);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('fig_next_hint','Tap / Space to continue'),400,310);
  } else if(phase==='done'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('fig_routine_over_title','ROUTINE COMPLETE!'),400,150);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('fig_final_score_label','Final Score: {s}').replace('{s}',doneScore),400,190);
    ctx.fillText(I18N.t('fig_best_combo_label','Best Combo: {c}').replace('{c}',doneCombo),400,220);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('fig_restart_hint','Tap / Space for a new routine'),400,260);
  }

  hud.textContent=I18N.t('fig_hud_label','Move {i}/{t} | Score: {s} | Combo: {c} | Best Score: {bs} | Best Combo: {bc}')
    .replace('{i}',Math.min(idx+1,TOTAL)).replace('{t}',TOTAL).replace('{s}',score).replace('{c}',combo)
    .replace('{bs}',best.score).replace('{bc}',best.combo);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
