<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2233;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffb74d;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Metro Escalator Repair</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/Tap each part — <b>Drive Chain</b>, <b>Step Chain</b>, <b>Handrail Motor</b> — to <b>test</b> it (or use number keys <b>1-3</b>), then press <b>Fix</b> (or <b>F</b>) on the part the test reveals is faulty, and <b>Reopen</b> (or <b>Enter</b>) the escalator. 3 wrong fixes and the shift ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HS_KEY='hs_metroescalatorrepair';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const PARTS=[
  {key:'drive',icon:'⚙️',label:()=>I18N.t('pt_drive','Drive Chain')},
  {key:'step',icon:'🪜',label:()=>I18N.t('pt_step','Step Chain')},
  {key:'rail',icon:'🤝',label:()=>I18N.t('pt_rail','Handrail Motor')}
];

let boxes=[];
(function layout(){
  const n=3, gap=40, w=(W-gap*(n+1))/n, h=190, y=150;
  for(let i=0;i<n;i++) boxes.push({x:gap+i*(w+gap),y,w,h});
})();

let score=0,lives=3,round=1,hi2=hi;
let faultyIdx=-1;
let tested=[];
let testResult=null; // {idx, faulty:bool}
let fixedThisRound=false;
let gameState='ready';
let selIndex=0;
let flashMsg='',flashTimer=0,flashColor='#fff';
let reopenAvailable=false;
let timeLeft=0,maxTime=0;

function flash(msg,color){flashMsg=msg;flashColor=color;flashTimer=60;}

function startRound(r){
  faultyIdx=Math.floor(Math.random()*3);
  tested=[false,false,false];
  testResult=null;
  fixedThisRound=false;
  reopenAvailable=false;
  selIndex=0;
  maxTime=Math.max(9,18-r*0.8);
  timeLeft=maxTime;
  gameState='playing';
}

function newGame(){
  score=0;lives=3;round=1;
  startRound(round);
}

function testPart(i){
  if(gameState!=='playing'||fixedThisRound)return;
  tested[i]=true;
  testResult={idx:i,faulty:i===faultyIdx};
  SFX.click();
  flash(testResult.faulty?I18N.t('test_fault','Fault detected!'):I18N.t('test_ok','Working fine'),testResult.faulty?'#e94560':'#7ec850');
}

function fixPart(i){
  if(gameState!=='playing'||fixedThisRound)return;
  if(i===faultyIdx){
    fixedThisRound=true;
    reopenAvailable=true;
    score+=15+round*2;
    SFX.success();
    flash(I18N.t('fix_correct','Fixed correctly!'),'#7ec850');
  } else {
    lives--;
    SFX.error();
    flash(I18N.t('fix_wrong','Wrong part — still broken!'),'#e94560');
    if(lives<=0) endGame();
  }
}

function reopen(){
  if(!reopenAvailable||gameState!=='playing')return;
  SFX.levelup();
  score+=10;
  round++;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  startRound(round);
}

function endGame(){
  gameState='lost';
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
}

function pointerToBox(px,py){
  for(let i=0;i<boxes.length;i++){
    const b=boxes[i];
    if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return i;
  }
  return -1;
}

function pointInRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}

let fixBtn={x:0,y:0,w:0,h:0};
let reopenBtn={x:0,y:0,w:0,h:0};
(function(){
  fixBtn={x:W/2-170,y:360,w:150,h:44};
  reopenBtn={x:W/2+20,y:360,w:150,h:44};
})();

c.addEventListener('pointerdown',e=>{
  if(gameState==='ready'||gameState==='lost'){ newGame(); return; }
  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(W/rect.width);
  const py=(e.clientY-rect.top)*(H/rect.height);
  if(pointInRect(px,py,fixBtn)){ fixPart(selIndex); return; }
  if(pointInRect(px,py,reopenBtn)){ reopen(); return; }
  const i=pointerToBox(px,py);
  if(i>=0){ selIndex=i; testPart(i); }
});

document.addEventListener('keydown',e=>{
  if(gameState==='ready'||gameState==='lost'){
    if(e.code==='Space'||e.code==='Enter'){ newGame(); }
    return;
  }
  if(gameState!=='playing')return;
  if(e.code==='ArrowRight'){ selIndex=(selIndex+1)%3; e.preventDefault(); }
  else if(e.code==='ArrowLeft'){ selIndex=(selIndex-1+3)%3; e.preventDefault(); }
  else if(e.code>='Digit1'&&e.code<='Digit3'){ selIndex=parseInt(e.code.slice(5),10)-1; testPart(selIndex); }
  else if(e.code==='Space'){ testPart(selIndex); e.preventDefault(); }
  else if(e.key==='f'||e.key==='F'){ fixPart(selIndex); }
  else if(e.code==='Enter'){ reopen(); }
});

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#10151f');sky.addColorStop(1,'#1a2233');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#ffb74d';ctx.font='bold 22px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('round_label','Round {r}').replace('{r}',round),16,32);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',lives),W-16,32);

  ctx.textAlign='center';
  ctx.font='bold 16px Arial';
  ctx.fillStyle='#9ecbff';
  ctx.fillText(I18N.t('escalator_instr','Test each part, then Fix the faulty one and Reopen'),W/2,60);

  if(gameState==='playing'&&!fixedThisRound){
    const pct=Math.max(0,timeLeft/maxTime);
    ctx.fillStyle='#222';ctx.fillRect(250,76,300,12);
    ctx.fillStyle=pct>0.3?'#7ec850':'#e94560';
    ctx.fillRect(250,76,300*pct,12);
  }

  boxes.forEach((b,i)=>{
    ctx.save();
    let fillColor='#243247';
    if(testResult&&testResult.idx===i) fillColor=testResult.faulty?'#5a2030':'#204030';
    ctx.fillStyle=fillColor;
    ctx.strokeStyle=i===selIndex?'#ffd54f':'#3a4a5f';
    ctx.lineWidth=i===selIndex?5:2;
    ctx.beginPath();
    ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,12):ctx.rect(b.x,b.y,b.w,b.h);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='54px Arial';ctx.textAlign='center';
    ctx.fillText(PARTS[i].icon,b.x+b.w/2,b.y+80);
    ctx.font='15px Arial';
    ctx.fillStyle='#dde';
    ctx.fillText(PARTS[i].label(),b.x+b.w/2,b.y+112);
    if(tested[i]){
      ctx.font='bold 14px Arial';
      ctx.fillStyle=i===faultyIdx?'#ff6b6b':'#7ec850';
      ctx.fillText(i===faultyIdx?I18N.t('status_faulty','FAULTY'):I18N.t('status_ok','OK'),b.x+b.w/2,b.y+140);
    }
    ctx.restore();
  });

  // Fix button
  ctx.save();
  ctx.fillStyle=tested[selIndex]&&!fixedThisRound?'#e94560':'#555';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(fixBtn.x,fixBtn.y,fixBtn.w,fixBtn.h,10):ctx.rect(fixBtn.x,fixBtn.y,fixBtn.w,fixBtn.h);
  ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('btn_fix','Fix'),fixBtn.x+fixBtn.w/2,fixBtn.y+fixBtn.h/2+6);
  ctx.restore();

  // Reopen button
  ctx.save();
  ctx.fillStyle=reopenAvailable?'#7ec850':'#555';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(reopenBtn.x,reopenBtn.y,reopenBtn.w,reopenBtn.h,10):ctx.rect(reopenBtn.x,reopenBtn.y,reopenBtn.w,reopenBtn.h);
  ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('btn_reopen','Reopen'),reopenBtn.x+reopenBtn.w/2,reopenBtn.y+reopenBtn.h/2+6);
  ctx.restore();

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/30);
    ctx.fillStyle=flashColor;
    ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H-30);
    ctx.globalAlpha=1;
  }

  if(gameState==='ready'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_title','Metro Escalator Repair'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or Press Space to start'),W/2,H/2+20);
  }
  if(gameState==='lost'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SHIFT OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+10);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;
  if(gameState==='playing'&&!fixedThisRound){
    timeLeft-=dt;
    if(timeLeft<=0){
      lives--;
      SFX.error();
      flash(I18N.t('too_slow','Too slow!'),'#e94560');
      if(lives<=0){ endGame(); }
      else { startRound(round); }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
