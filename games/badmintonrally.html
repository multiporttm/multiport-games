<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b5e20;display:block;border-radius:8px;touch-action:none}
#score-display{color:#c8e6c9;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Badminton Rally</div>
  <div class="game-frame">
    <div id="score-display">You: 0 | CPU: 0 | Matches Won: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to move your racket, <b>Space</b> or <b>Up Arrow</b> to swing and hit the shuttlecock. Rally over the net and be first to 11 points to win the match!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400,NET_X=400,GROUND=360;
let wins=0;
try{wins=parseInt(localStorage.getItem('badmintonrally_wins')||'0');}catch(e){}

let playerScore=0,cpuScore=0,matchOver=false,rallyOver=false,serving='player';
const player={x:150,y:300,w:40,h:60,vy:0,swinging:0};
const cpu={x:650,y:300,w:40,h:60,vy:0,swinging:0,targetX:650};
let shuttle={x:150,y:280,vx:0,vy:0,inPlay:false};
let msg='';
let keys={};

function resetPositions(){
  player.x=150;player.y=300;
  cpu.x=650;cpu.y=300;
  player.swinging=0;cpu.swinging=0;
}

function serve(){
  resetPositions();
  rallyOver=false;
  if(serving==='player'){
    shuttle={x:player.x+20,y:280,vx:3,vy:-6,inPlay:true,side:'player'};
  }else{
    shuttle={x:cpu.x-20,y:280,vx:-3,vy:-6,inPlay:true,side:'cpu'};
  }
}

function pointFor(who){
  if(who==='player'){playerScore++;}else{cpuScore++;}
  serving=who;
  SFX.point();
  if(playerScore>=11||cpuScore>=11){
    matchOver=true;
    if(playerScore>=11){wins++;try{localStorage.setItem('badmintonrally_wins',wins);}catch(e){}SFX.win();}
    else SFX.lose();
  }else{
    rallyOver=true;
    setTimeout(()=>{if(!matchOver)serve();},1100);
  }
}

function newMatch(){
  playerScore=0;cpuScore=0;matchOver=false;rallyOver=false;serving='player';
  serve();
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){
    if(matchOver){newMatch();return;}
    if(player.swinging<=0)player.swinging=10;
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let touchStartX=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(matchOver){newMatch();return;}
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  touchStartX=(t.clientX-rect.left)*(W/rect.width);
  if(player.swinging<=0)player.swinging=10;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  const x=(t.clientX-rect.left)*(W/rect.width);
  touchStartX=x;
},{passive:false});
c.addEventListener('click',()=>{ if(matchOver)newMatch(); });

function drawCourt(){
  ctx.fillStyle='#1b5e20';ctx.fillRect(0,0,W,H);
  // floor
  ctx.fillStyle='#154d1b';ctx.fillRect(0,GROUND,W,H-GROUND);
  // center line
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.setLineDash([8,8]);
  ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
  ctx.setLineDash([]);
  // net
  ctx.fillStyle='#eee';
  ctx.fillRect(NET_X-3,GROUND-90,6,90);
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(NET_X-3,GROUND-90+i*10);ctx.lineTo(NET_X+3,GROUND-90+i*10);ctx.stroke();}
}

function drawPlayer(p,color,facingRight){
  ctx.save();
  ctx.fillStyle=color;
  ctx.fillRect(p.x-p.w/2,p.y-p.h,p.w,p.h);
  ctx.fillStyle='#ffd699';
  ctx.beginPath();ctx.arc(p.x,p.y-p.h-10,12,0,7);ctx.fill();
  // racket
  const swingAngle=p.swinging>0?(p.swinging/10)*1.8:0;
  const dir=facingRight?1:-1;
  ctx.strokeStyle='#333';ctx.lineWidth=4;
  const rx=p.x+dir*(20+swingAngle*8);
  const ry=p.y-p.h+10-swingAngle*10;
  ctx.beginPath();ctx.moveTo(p.x+dir*10,p.y-p.h+20);ctx.lineTo(rx,ry);ctx.stroke();
  ctx.strokeStyle='#e94560';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(rx,ry,10,0,7);ctx.stroke();
  ctx.restore();
}

function drawShuttle(){
  if(!shuttle.inPlay)return;
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(shuttle.x,shuttle.y,5,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.moveTo(shuttle.x,shuttle.y);
  ctx.lineTo(shuttle.x-4,shuttle.y-12);
  ctx.lineTo(shuttle.x+4,shuttle.y-12);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function rectHit(px,py,pw,ph,sx,sy){
  return sx>px-pw/2-15&&sx<px+pw/2+15&&sy>py-ph-20&&sy<py-ph+30;
}

function updatePhysics(dt){
  // player movement
  const speed=5*dt;
  if(keys['ArrowLeft']||keys['KeyA'])player.x-=speed;
  if(keys['ArrowRight']||keys['KeyD'])player.x+=speed;
  if(touchStartX!==null)player.x+=(touchStartX-player.x)*0.2;
  player.x=Math.max(40,Math.min(NET_X-30,player.x));
  if(player.swinging>0)player.swinging-=dt;

  // cpu AI: track shuttle when on its side
  if(shuttle.inPlay && shuttle.x>NET_X){
    cpu.targetX=Math.max(NET_X+30,Math.min(W-40,shuttle.x));
  }else{
    cpu.targetX=650;
  }
  cpu.x+=(cpu.targetX-cpu.x)*0.06*dt;
  if(cpu.swinging>0)cpu.swinging-=dt;

  if(!shuttle.inPlay)return;

  // shuttle physics - floaty
  shuttle.vy+=0.16*dt;
  shuttle.vx*=Math.pow(0.998,dt);
  shuttle.x+=shuttle.vx*dt;
  shuttle.y+=shuttle.vy*dt;

  // player hit
  if(shuttle.x<NET_X && shuttle.vy>=0 && player.swinging>7 && rectHit(player.x,player.y,player.w,player.h,shuttle.x,shuttle.y)){
    const power=6+Math.random()*2;
    shuttle.vx=power*(0.7+Math.random()*0.5);
    shuttle.vy=-7-Math.random()*2;
    player.swinging=0;
    SFX.hit();
  }
  // cpu auto-hit
  if(shuttle.x>NET_X && shuttle.vy>=0 && Math.abs(shuttle.x-cpu.x)<45 && shuttle.y>cpu.y-cpu.h-15 && cpu.swinging<=0){
    cpu.swinging=10;
    const power=5.5+Math.random()*2;
    shuttle.vx=-power*(0.7+Math.random()*0.5);
    shuttle.vy=-6.5-Math.random()*1.5;
    SFX.hit();
  }

  // net collision
  if(Math.abs(shuttle.x-NET_X)<6 && shuttle.y>GROUND-90){
    shuttle.vx*=-0.3;
  }

  // ground / out of bounds -> point
  if(shuttle.y>=GROUND){
    if(shuttle.x<NET_X){
      if(!rallyOver)pointFor('cpu');
    }else{
      if(!rallyOver)pointFor('player');
    }
    shuttle.inPlay=false;
  }
  if(shuttle.x<0||shuttle.x>W){
    if(!rallyOver)pointFor(shuttle.x<0?'cpu':'player');
    shuttle.inPlay=false;
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawCourt();

  if(!matchOver)updatePhysics(dt);

  drawPlayer(player,'#42a5f5',true);
  drawPlayer(cpu,'#ef5350',false);
  drawShuttle();

  const label=document.getElementById('score-display');
  label.textContent=I18N.t('badminton_score_label','You: {p} | CPU: {c} | Matches Won: {w}').replace('{p}',playerScore).replace('{c}',cpuScore).replace('{w}',wins);

  ctx.textAlign='center';
  if(matchOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';
    ctx.fillText(playerScore>cpuScore?I18N.t('you_win_title','YOU WIN!'):I18N.t('you_lose_title','YOU LOSE'),W/2,H/2-10);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+28);
  }

  requestAnimationFrame(loop);
}
serve();
loop();
</script></body></html>
