<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b1b2a;display:block;border-radius:8px;touch-action:none}
#hud{color:#eae6f0;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ff8a4f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bowling Shoe Rental Sizing</div>
  <div class="game-frame">
    <div id="hud">
      <span>Served: <b id="roundNum">0</b>/<b id="roundTotal">20</b></span>
      <span>Lives: <b id="lives">3</b></span>
      <span>Score: <b id="score">0</b></span>
      <span>Hi: <b id="hi">0</b></span>
    </div>
    <canvas id="c" width="800" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap the <b>shoe cubby</b> matching the current customer's requested size (or move the cursor with <b>Arrow Keys</b> and press <b>Enter/Space</b>) before their patience bar runs out. Serve customers fast to beat the rush waves!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;
const TOTAL_SERVED=20;
const COLS=6,ROWS=4;
const HI_KEY='bowlingshoerentalsizing_hi';
const SIZES=[5,6,7,8,9,10,11,12,13];

const gridX=60,gridY=30,cellW=112,cellH=58,gap=6;

let score=0,hi=0,lives=3,served=0,wave=1;
let cubbies=[]; // {size,x,y,w,h}
let selected=0;
let needSize=0,patience=0,patienceMax=0;
let upcoming=[];
let started=false,gameOver=false,won=false;
let resultMsg='',resultTimer=0;
let flashIdx=-1,flashTimer=0,flashGood=true;
let lastTime=null;

try{hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0;}catch(e){}

function setHud(){
  document.getElementById('roundNum').textContent=Math.min(served,TOTAL_SERVED);
  document.getElementById('roundTotal').textContent=TOTAL_SERVED;
  document.getElementById('lives').textContent=lives;
  document.getElementById('score').textContent=score;
  document.getElementById('hi').textContent=hi;
}

function buildWall(){
  const pool=[];
  while(pool.length<COLS*ROWS){
    for(const s of SIZES){ pool.push(s); if(pool.length>=COLS*ROWS)break; }
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  cubbies=[];
  let i=0;
  for(let r=0;r<ROWS;r++){
    for(let col=0;col<COLS;col++){
      cubbies.push({size:pool[i++],x:gridX+col*(cellW+gap),y:gridY+r*(cellH+gap),w:cellW,h:cellH});
    }
  }
}

function availableSizes(){return [...new Set(cubbies.map(cb=>cb.size))];}

function newCustomer(){
  const avail=availableSizes();
  needSize=avail[Math.floor(Math.random()*avail.length)];
  patienceMax=Math.max(1.8,6.5-wave*0.45);
  patience=patienceMax;
  upcoming=[];
  const avail2=availableSizes();
  for(let i=0;i<4;i++)upcoming.push(avail2[Math.floor(Math.random()*avail2.length)]);
}

function resetGame(){
  score=0;lives=3;served=0;wave=1;gameOver=false;won=false;started=true;
  buildWall();
  newCustomer();
  selected=0;
  setHud();
}

function handCorrectShoe(idx){
  flashIdx=idx;flashGood=true;flashTimer=22;
  const bonus=Math.round((patience/patienceMax)*60);
  score+=100+bonus;
  if(score>hi){hi=score;try{localStorage.setItem(HI_KEY,String(hi));}catch(e){}}
  SFX.success();
  served++;
  setHud();
  if(served>=TOTAL_SERVED){
    gameOver=true;won=true;resultTimer=99999;
    resultMsg=I18N.t('shift_survived','Shift survived! Everyone got their shoes.');
    SFX.win();
    return;
  }
  if(served%5===0){wave++;}
  buildWall();
  newCustomer();
  selected=0;
}

function wrongShoe(idx){
  flashIdx=idx;flashGood=false;flashTimer=16;
  score=Math.max(0,score-15);
  SFX.error();
  setHud();
}

function patienceExpired(){
  lives--;SFX.lose();
  resultMsg=I18N.t('customer_huffed','That customer huffed off!');
  resultTimer=45;
  setHud();
  if(lives<=0){
    gameOver=true;won=false;resultTimer=99999;
    resultMsg=I18N.t('game_over_title','GAME OVER');
    return;
  }
  buildWall();
  newCustomer();
  selected=0;
}

function cubbyAt(x,y){
  for(let i=0;i<cubbies.length;i++){
    const cb=cubbies[i];
    if(x>=cb.x&&x<=cb.x+cb.w&&y>=cb.y&&y<=cb.y+cb.h)return i;
  }
  return -1;
}

function tryHand(idx){
  if(idx<0)return;
  if(cubbies[idx].size===needSize)handCorrectShoe(idx);
  else wrongShoe(idx);
}

function pointerToCanvas(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

function handleActivate(){
  if(!started){resetGame();return;}
  if(gameOver){resetGame();return;}
}

c.addEventListener('click',e=>{
  const pos=pointerToCanvas(e);
  if(!started||gameOver){handleActivate();return;}
  const idx=cubbyAt(pos.x,pos.y);
  if(idx>=0){selected=idx;tryHand(idx);}
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const pos=pointerToCanvas(e);
  if(!started||gameOver){handleActivate();return;}
  const idx=cubbyAt(pos.x,pos.y);
  if(idx>=0){selected=idx;tryHand(idx);}
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key)||e.code==='Space'){e.preventDefault();}
  if(!started){if(e.code==='Space'||e.key==='Enter')handleActivate();return;}
  if(gameOver){if(e.code==='Space'||e.key==='Enter')handleActivate();return;}
  const col=selected%COLS,row=Math.floor(selected/COLS);
  if(e.key==='ArrowLeft')selected=row*COLS+((col-1+COLS)%COLS);
  else if(e.key==='ArrowRight')selected=row*COLS+((col+1)%COLS);
  else if(e.key==='ArrowUp')selected=((row-1+ROWS)%ROWS)*COLS+col;
  else if(e.key==='ArrowDown')selected=((row+1)%ROWS)*COLS+col;
  else if(e.code==='Space'||e.key==='Enter')tryHand(selected);
});

function drawShoeIcon(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x+6,y+h-10);
  ctx.quadraticCurveTo(x+4,y+h-26,x+16,y+h-28);
  ctx.quadraticCurveTo(x+w*0.55,y+h-30,x+w-14,y+h-20);
  ctx.quadraticCurveTo(x+w-6,y+h-16,x+w-6,y+h-8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#e94560';
  ctx.fillRect(x+w*0.4,y+h-26,10,6);
}

function drawCubby(cb,i){
  const isSel=i===selected&&!gameOver;
  ctx.fillStyle=isSel?'#2a3a4e':'#20202e';
  ctx.fillRect(cb.x,cb.y,cb.w,cb.h);
  ctx.strokeStyle=isSel?'#4fc3f7':'#444';
  ctx.lineWidth=isSel?3:1;
  ctx.strokeRect(cb.x,cb.y,cb.w,cb.h);
  drawShoeIcon(cb.x+8,cb.y+6,cb.w-16,cb.h-10,'#d9c58a');
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='right';
  ctx.fillText(cb.size,cb.x+cb.w-8,cb.y+18);
  if(flashIdx===i&&flashTimer>0){
    ctx.fillStyle=flashGood?'rgba(126,200,80,0.5)':'rgba(233,69,96,0.5)';
    ctx.fillRect(cb.x,cb.y,cb.w,cb.h);
  }
}

function drawCustomerPanel(){
  const px=560,py=30,pw=180,ph=240;
  ctx.fillStyle='#1c1c2a';ctx.fillRect(px,py,pw,ph);
  ctx.strokeStyle='#3a3a55';ctx.strokeRect(px,py,pw,ph);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('now_serving_label','Now Serving'),px+pw/2,py+24);
  ctx.fillStyle='#ffd54f';ctx.font='bold 15px Arial';
  ctx.fillText('👤',px+pw/2,py+64);
  ctx.font='bold 22px Arial';ctx.fillStyle='#ff8a4f';
  ctx.fillText(I18N.t('need_size_label','Size {s}').replace('{s}',needSize),px+pw/2,py+92);
  // patience bar
  const barX=px+14,barY=py+110,barW=pw-28,barH=14;
  ctx.fillStyle='#0a0a12';ctx.fillRect(barX,barY,barW,barH);
  const pct=Math.max(0,patience/patienceMax);
  ctx.fillStyle=pct>0.4?'#7ec850':(pct>0.18?'#ffcc33':'#e94560');
  ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='#ccc';ctx.font='12px Arial';
  ctx.fillText(I18N.t('patience_label','Patience'),px+pw/2,barY-6);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';
  ctx.fillText(I18N.t('wave_label','Rush Wave {w}').replace('{w}',wave),px+pw/2,py+150);
  ctx.font='11px Arial';ctx.fillStyle='#aaa';
  ctx.fillText(I18N.t('up_next_label','Up next:'),px+pw/2,py+176);
  ctx.font='bold 13px Arial';ctx.fillStyle='#4fc3f7';
  ctx.fillText(upcoming.join('  '),px+pw/2,py+198);
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#101018');bg.addColorStop(1,'#1b1b2a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ff8a4f99';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_shoes','Press Space or Tap to open the counter'),W/2,180);
    requestAnimationFrame(loop);
    return;
  }

  cubbies.forEach((cb,i)=>drawCubby(cb,i));
  drawCustomerPanel();

  if(flashTimer>0)flashTimer-=dt;

  if(!gameOver&&resultTimer<=0){
    patience-=dt/60;
    if(patience<=0){patience=0;patienceExpired();}
  }

  if(resultTimer>0){
    resultTimer-=dt;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,180);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,150);
    ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),W/2,188);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,220);
  }

  requestAnimationFrame(loop);
}
setHud();
loop();
</script></body></html>
