<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#4a148c,#ce93d8);display:block;border-radius:8px}
#score-display{color:#ce93d8;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lanceBtn{display:block;margin:10px auto 0;padding:12px 34px;background:#4a148c;color:#fff;border:2px solid #ce93d8;border-radius:24px;font-size:1.1rem;font-weight:800;cursor:pointer}
#lanceBtn:active{transform:scale(.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Knights Joust</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Streak: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
    <button id="lanceBtn">LANCE!</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or tap the <b>LANCE!</b> button at the exact right moment as the knights charge together to land a solid hit. Time it wrong and you'll miss — or get unseated yourself. Best of 5 passes wins the match!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
let wins=0,streak=0,bestStreak=0;
try{bestStreak=parseInt(localStorage.getItem('joust_best')||'0');}catch(e){}

const GROUND=230;
let playerX,aiX,phase,timer,pass,passesToWin=5,playerScore,aiScore;
let zoneStart,zoneEnd,zonePos,zoneActive,zoneResult,resultTimer,matchOver,matchMsg;
let started=false;

function reset(){
  playerX=40;aiX=760;phase='charge';timer=0;pass=1;playerScore=0;aiScore=0;
  zoneActive=false;zoneResult=null;resultTimer=0;matchOver=false;matchMsg='';
  started=true;
  startPass();
}
function startPass(){
  playerX=40;aiX=760;phase='charge';timer=0;zoneActive=false;zoneResult=null;
}

function startTiming(){
  zoneActive=true;
  zonePos=0;
  // Zone shrinks each pass to increase difficulty
  const w=Math.max(0.06,0.22-pass*0.015);
  zoneStart=0.5-w/2;
  zoneEnd=0.5+w/2;
}

function lance(){
  if(!started){reset();return;}
  if(matchOver){reset();return;}
  if(!zoneActive)return;
  const hit=zonePos>=zoneStart&&zonePos<=zoneEnd;
  const dist=Math.abs(zonePos-0.5);
  zoneActive=false;
  if(hit){
    playerScore++;
    zoneResult='hit';
    streak++;
    if(streak>bestStreak){bestStreak=streak;try{localStorage.setItem('joust_best',bestStreak);}catch(e){}}
    SFX.hit();
  }else{
    zoneResult='miss';
    streak=0;
    SFX.fail();
  }
  // AI takes its own chance, slightly worse odds as pass increases favors variability
  const aiHit=Math.random()<Math.max(0.35,0.75-pass*0.08);
  if(aiHit&&!hit)aiScore++;
  resultTimer=60;
  phase='result';
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();lance();}});
document.getElementById('lanceBtn').addEventListener('click',lance);
c.addEventListener('click',()=>{if(!started||matchOver)reset();});
c.addEventListener('touchstart',e=>{e.preventDefault();if(!started||matchOver)reset();},{passive:false});

function drawKnight(x,facingRight,charging){
  ctx.save();
  ctx.translate(x,GROUND);
  const dir=facingRight?1:-1;
  // horse body
  ctx.fillStyle='#5d4037';
  ctx.fillRect(-30*dir,-40,60*dir,30);
  // horse legs
  ctx.fillStyle='#3e2723';
  ctx.fillRect(-20*dir,-10,8*dir,14);
  ctx.fillRect(10*dir,-10,8*dir,14);
  // knight body
  ctx.fillStyle='#9e9e9e';
  ctx.fillRect(-12*dir,-70,24*dir,32);
  // helmet
  ctx.fillStyle='#bdbdbd';
  ctx.fillRect(-8*dir,-84,16*dir,16);
  // lance
  if(charging){
    ctx.strokeStyle='#8d6e63';
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(12*dir,-60);
    ctx.lineTo(70*dir,-66);
    ctx.stroke();
    ctx.fillStyle='#ce93d8';
    ctx.beginPath();ctx.arc(70*dir,-66,5,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawTimingBar(){
  const barX=200,barY=250,barW=400,barH=24;
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='#7ec850';
  ctx.fillRect(barX+zoneStart*barW,barY,(zoneEnd-zoneStart)*barW,barH);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(barX,barY,barW,barH);
  const px=barX+zonePos*barW;
  ctx.fillStyle='#ffeb3b';
  ctx.fillRect(px-2,barY-6,4,barH+12);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<8;i++)ctx.fillRect(i*100,0,2,H);
  ctx.fillStyle='#3e2723';
  ctx.fillRect(0,GROUND,W,H-GROUND);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap LANCE! to start'),W/2,140);
    drawKnight(80,true,false);
    drawKnight(720,false,false);
    requestAnimationFrame(loop);
    return;
  }

  if(matchOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(matchMsg,W/2,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,158);
    requestAnimationFrame(loop);
    return;
  }

  if(phase==='charge'){
    timer++;
    const t=Math.min(1,timer/70);
    playerX=40+t*(400-40-60);
    aiX=760-t*(760-400-60);
    drawKnight(playerX,true,true);
    drawKnight(aiX,false,true);
    if(!zoneActive&&t>0.5)startTiming();
    if(zoneActive){
      zonePos+=0.018;
      if(zonePos>1){
        // missed window entirely -> treated as miss
        zoneActive=false;zoneResult='miss';streak=0;resultTimer=60;phase='result';SFX.fail();
        const aiHit=Math.random()<Math.max(0.35,0.75-pass*0.08);
        if(aiHit)aiScore++;
      }
      drawTimingBar();
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('lance_now','LANCE!'),W/2,215);
    } else {
      ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('brace_hint','Get ready...'),W/2,215);
    }
  } else if(phase==='result'){
    drawKnight(400-60,true,false);
    drawKnight(400+60,false,false);
    ctx.fillStyle=zoneResult==='hit'?'#7ec850':'#e57373';
    ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(zoneResult==='hit'?I18N.t('solid_hit','SOLID HIT!'):I18N.t('missed_it','MISSED!'),W/2,140);
    resultTimer--;
    if(resultTimer<=0){
      if(pass>=passesToWin||playerScore>=Math.ceil(passesToWin/2)+1||aiScore>=Math.ceil(passesToWin/2)+1){
        matchOver=true;
        if(playerScore>aiScore){wins++;matchMsg=I18N.t('you_win','YOU WIN THE JOUST!');SFX.win();}
        else if(playerScore<aiScore){matchMsg=I18N.t('you_lose','THE AI KNIGHT WINS');SFX.lose();}
        else{matchMsg=I18N.t('draw_msg','A DRAW!');SFX.select();}
      } else {
        pass++;
        startPass();
      }
    }
  }

  document.getElementById('score-display').textContent=
    I18N.t('joust_score_label','Pass {p} — You: {y} AI: {a} | Wins: {w} Best Streak: {b}')
      .replace('{p}',pass).replace('{y}',playerScore).replace('{a}',aiScore).replace('{w}',wins).replace('{b}',bestStreak);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
