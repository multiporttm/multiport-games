<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#241a2a;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#score-display{color:#ffb3c6;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Perfume Bottle Design</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Match the brand brief shown at the top by cycling each component — <b>Glass</b>, <b>Cap</b>, <b>Font</b>, and <b>Color</b> — with <b>Arrow keys</b> + <b>Enter</b> or by <b>tapping</b> the arrows. Submit with <b>Space</b> or the <b>APPROVE</b> button before the deadline. You have 3 lives.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
const HISCORE_KEY='perfumebottledesign_hiscore';
let hi=parseInt(localStorage.getItem(HISCORE_KEY)||'0',10);

const OPTIONS={
  glass:['Round','Square','Teardrop','Flask'],
  cap:['Gold Dome','Wood Disc','Crystal Ball','Flat Chrome'],
  font:['Serif','Script','Bold Sans','Deco'],
  color:['Rose','Amber','Midnight','Ivory']
};
const COLOR_HEX={Rose:'#f06292',Amber:'#ffb74d',Midnight:'#3949ab',Ivory:'#f5f1e6'};
const CATS=['glass','cap','font','color'];
const CAT_LABELS={glass:'Glass Shape',cap:'Cap Style',font:'Label Font',color:'Color Scheme'};

let score=0,lives=3,level=1,gameOver=false,started=false;
let brief=null,choice={glass:0,cap:0,font:0,color:0};
let cursor=0;
let roundTime=0,roundMax=0;
let lastTime=null;
let flashTimer=0,flashMsg='',flashGood=false;

function pickBrief(){
  const nFixed=Math.min(4,2+Math.floor(level/2)); // more constraints as level rises
  const cats=[...CATS];
  for(let i=cats.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cats[i],cats[j]]=[cats[j],cats[i]];}
  const fixedCats=cats.slice(0,nFixed);
  const req={};
  fixedCats.forEach(cat=>{ req[cat]=Math.floor(Math.random()*OPTIONS[cat].length); });
  return {req};
}

function newRound(){
  brief=pickBrief();
  choice={glass:0,cap:0,font:0,color:0};
  cursor=0;
  roundMax=Math.max(500,1100-level*45);
  roundTime=roundMax;
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  newRound();
  lastTime=null;
}
reset();

function cycle(cat,dir){
  if(gameOver)return;
  if(!started)started=true;
  const n=OPTIONS[cat].length;
  choice[cat]=(choice[cat]+dir+n)%n;
  SFX.click();
}

function submit(){
  if(gameOver||!started)return;
  const ok=Object.keys(brief.req).every(cat=>choice[cat]===brief.req[cat]);
  if(ok){
    const pts=Math.round(150*(1+level*0.15));
    score+=pts;
    flashMsg=I18N.t('brief_approved','Approved! Brand loves it.');
    flashGood=true;flashTimer=70;SFX.success();
    level++;
    newRound();
  } else {
    lives--;
    flashMsg=I18N.t('brief_rejected','Rejected — doesn\'t match the brief.');
    flashGood=false;flashTimer=70;SFX.fail();
    if(lives<=0){
      gameOver=true;
      if(score>hi){hi=score;localStorage.setItem(HISCORE_KEY,String(hi));}
      SFX.lose();
    } else {
      newRound();
    }
  }
}

function doRestart(){ reset(); }

document.addEventListener('keydown',e=>{
  if(gameOver){ if(e.code==='Enter'||e.code==='Space'){doRestart();} return; }
  if(!started)started=true;
  switch(e.code){
    case 'ArrowUp': e.preventDefault(); cursor=(cursor+3)%4; break;
    case 'ArrowDown': e.preventDefault(); cursor=(cursor+1)%4; break;
    case 'ArrowLeft': e.preventDefault(); cycle(CATS[cursor],-1); break;
    case 'ArrowRight': e.preventDefault(); cycle(CATS[cursor],1); break;
    case 'Enter': e.preventDefault(); break;
    case 'Space': e.preventDefault(); submit(); break;
  }
});

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

const rowY=[150,220,290,360];

function handleTap(e){
  if(gameOver){doRestart();return;}
  const p=getPos(e);
  for(let row=0;row<4;row++){
    const y=rowY[row];
    const leftBtn={x:430,y:y-22,w:40,h:44};
    const rightBtn={x:620,y:y-22,w:40,h:44};
    if(p.x>=leftBtn.x&&p.x<=leftBtn.x+leftBtn.w&&p.y>=leftBtn.y&&p.y<=leftBtn.y+leftBtn.h){cursor=row;cycle(CATS[row],-1);return;}
    if(p.x>=rightBtn.x&&p.x<=rightBtn.x+rightBtn.w&&p.y>=rightBtn.y&&p.y<=rightBtn.y+rightBtn.h){cursor=row;cycle(CATS[row],1);return;}
  }
  const sub={x:300,y:420,w:200,h:50};
  if(p.x>=sub.x&&p.x<=sub.x+sub.w&&p.y>=sub.y&&p.y<=sub.y+sub.h){ submit(); return; }
}
c.addEventListener('click',handleTap);
c.addEventListener('touchstart',e=>{e.preventDefault();handleTap(e);},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('score_hi_level_label','Score: {s} | Hi: {h} | Level: {l}')
      .replace('{s}',score).replace('{h}',hi).replace('{l}',level);
}

function drawRow(row){
  const cat=CATS[row];
  const y=rowY[row];
  const isCursor=cursor===row;
  const required=brief.req.hasOwnProperty(cat);
  ctx.textAlign='left';ctx.font='bold 16px Arial';
  ctx.fillStyle=required?'#ffd54f':'#999';
  ctx.fillText(CAT_LABELS[cat]+(required?' *':''),60,y+5);

  ctx.fillStyle=isCursor?'#e94560':'#8d6e63';
  ctx.fillRect(430,y-22,40,44);
  ctx.fillRect(620,y-22,40,44);
  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText('◀',450,y+7);
  ctx.fillText('▶',640,y+7);

  ctx.fillStyle=isCursor?'#3a2a4a':'#2a1f33';
  ctx.fillRect(480,y-22,140,44);
  if(cat==='color'){
    ctx.fillStyle=COLOR_HEX[OPTIONS.color[choice.color]];
    ctx.fillRect(480,y-22,140,44);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(480,y-22,140,44);
    ctx.fillStyle=(OPTIONS.color[choice.color]==='Ivory')?'#222':'#fff';
  } else {
    ctx.fillStyle='#fff';
  }
  ctx.font='bold 15px Arial';ctx.textAlign='center';
  ctx.fillText(OPTIONS[cat][choice[cat]],550,y+5);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a1020');bg.addColorStop(1,'#241a2a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.textAlign='left';ctx.font='18px Arial';ctx.fillStyle='#fff';
  let s='';for(let i=0;i<3;i++)s+= i<lives?'💎':'💔';
  ctx.fillText(s,20,30);

  ctx.textAlign='center';ctx.font='bold 22px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('bottle_brief_title','BRAND BRIEF')+' — Lv.'+level,400,40);

  ctx.font='15px Arial';ctx.fillStyle='#ffb3c6';
  let reqText=Object.keys(brief.req).map(cat=>CAT_LABELS[cat]+': '+OPTIONS[cat][brief.req[cat]]).join('   ');
  ctx.fillText(reqText,400,70);

  for(let row=0;row<4;row++) drawRow(row);

  ctx.fillStyle='#4caf50';ctx.fillRect(300,420,200,50);
  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('approve_btn','APPROVE'),400,452);

  if(!gameOver&&started){
    ctx.fillStyle='#2a1a33';ctx.fillRect(60,395,680,12);
    const frac=Math.max(0,roundTime/roundMax);
    ctx.fillStyle=frac>0.3?'#ffb3c6':'#e94560';
    ctx.fillRect(60,395,680*frac,12);
  }

  if(flashTimer>0){
    ctx.font='bold 18px Arial';ctx.fillStyle=flashGood?'#7ec850':'#e94560';
    ctx.fillText(flashMsg,400,400);
  }

  if(!gameOver&&started){
    const now=performance.now();
    const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
    lastTime=now;
    roundTime-=dt*16.6667;
    if(flashTimer>0)flashTimer-=dt;
    if(roundTime<=0){
      roundTime=0;
      lives--;
      flashMsg=I18N.t('deadline_missed','Deadline missed!');
      flashGood=false;flashTimer=70;SFX.fail();
      if(lives<=0){
        gameOver=true;
        if(score>hi){hi=score;localStorage.setItem(HISCORE_KEY,String(hi));}
        SFX.lose();
      } else {
        newRound();
      }
    }
  } else {
    lastTime=null;
  }

  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_bottle','Match the brief, then tap/Space APPROVE'),400,250);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,220);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,260);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Enter to restart'),400,300);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
