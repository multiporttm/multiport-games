<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0a0a1a;cursor:crosshair}
#ui{color:#90caf9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Meteor Defense</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Base HP: 100</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Meteors fall from the top of the screen toward your base — tap each one to blast it before it lands. Miss too many and your base HP runs out!</div>
</div>
<script>
const W=360,H=360,BASE_Y=H-20;
let meteors,score,baseHp,state,spawnTimer;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('meteordefense_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('meteordefense_best',v);}

function init(){
  meteors=[];score=0;baseHp=100;state='play';spawnTimer=0;
}

function spawnMeteor(){
  meteors.push({x:rand(20,W-20),y:-20,speed:1+rand(0,1)+score*0.01});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const hit=meteors.find(m=>Math.hypot(m.x-x,m.y-y)<22);
  if(hit){
    meteors.splice(meteors.indexOf(hit),1);
    score++;
    SFX.hit();
    saveBest(score);
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  spawnTimer--;
  if(spawnTimer<=0){
    spawnMeteor();
    spawnTimer=Math.max(18,50-score*0.5);
  }

  meteors.forEach(m=>m.y+=m.speed);
  meteors=meteors.filter(m=>{
    if(m.y>BASE_Y){
      baseHp-=12;
      SFX.hurt();
      return false;
    }
    return true;
  });

  if(baseHp<=0){
    baseHp=0;state='over';
    SFX.lose();
    saveBest(score);
  }
  updateUI();
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#37474f';ctx.fillRect(0,BASE_Y,W,H-BASE_Y);

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  meteors.forEach(m=>ctx.fillText('☄️',m.x,m.y));

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#90caf9';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('base_destroyed_title','BASE DESTROYED!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('score_best','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('score_base_hp','Score: {n} | Base HP: {h}').replace('{n}',score).replace('{h}',Math.max(0,baseHp));
}

init();draw();
</script></body></html>
