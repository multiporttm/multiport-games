<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Laser Maze</title><meta name="description" content="Play Laser Maze free online — Click a mirror tile to rotate it and redirect the laser beam from the emitter to the target receiver. Solve increasingly tricky grids."><link rel="canonical" href="https://games.multiportllc.com/games/lasermaze"><meta property="og:title" content="Laser Maze - Multiport Games"><meta property="og:description" content="Play Laser Maze free online — Click a mirror tile to rotate it and redirect the laser beam from the emitter to the target receiver. Solve increasingly tricky grids."><meta property="og:url" content="https://games.multiportllc.com/games/lasermaze"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Laser Maze","description":"Play Laser Maze free online instantly. Click a mirror tile to rotate it and redirect the laser beam from the emitter to the target receiver. Solve increasingly tricky grids. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/lasermaze","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#1a0a2e;border-radius:14px;padding:18px;text-align:center}
#status{color:#fff;font-size:1.1rem;font-weight:800;margin:6px 0;min-height:1.6em}
#level-display{color:#e63946;font-size:1.1rem;font-weight:700;margin-bottom:8px}
#grid{display:inline-grid;gap:2px;background:#0a0a14;padding:8px;border-radius:10px;margin:10px auto}
.tile{width:52px;height:52px;background:#241442;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.tile.wall{background:#3a1a1a;cursor:default}
.tile.mirror{cursor:pointer}
.tile.emitter{background:#e63946;cursor:default}
.tile.receiver{background:#0a2a1a}
.tile.receiver.lit{background:#2ecc71;box-shadow:0 0 14px #2ecc71}
.tile svg{width:100%;height:100%;position:absolute;top:0;left:0;pointer-events:none}
#controls{margin:12px 0}
#controls button{padding:9px 22px;background:#e63946;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin:0 5px}
@media(max-width:480px){
  .tile{width:38px;height:38px}
}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Laser Maze</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="level-display">Level 1 | Solved: 0</div>
      <div id="status">Rotate the mirrors to guide the beam to the target</div>
      <div id="grid"></div>
      <div id="controls">
        <button id="resetBtn" onclick="loadLevel(curLevel)">Reset Level</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions"><b>Click a mirror tile</b> to rotate it 90°. Guide the red laser beam from the emitter to the green receiver. Solve the level and it auto-advances to the next one!</div>
</div>
<script>
// Grid cell types: '.' empty, '#' wall, 'E<dir>' emitter, 'R' receiver, '/' or '\\' mirror (rotatable)
// dir: 0=right,1=down,2=left,3=up
const LEVELS=[
 {w:5,h:5,emitter:{x:0,y:2,dir:0},receiver:{x:4,y:2},walls:[],mirrors:[{x:2,y:2,type:'/'}]},
 {w:6,h:5,emitter:{x:0,y:0,dir:0},receiver:{x:5,y:4},walls:[{x:3,y:2}],mirrors:[{x:2,y:0,type:'\\'},{x:2,y:4,type:'/'},{x:5,y:0,type:'\\'}]},
 {w:6,h:6,emitter:{x:0,y:0,dir:0},receiver:{x:0,y:5},walls:[{x:3,y:0},{x:3,y:1},{x:3,y:2}],mirrors:[{x:4,y:0,type:'\\'},{x:4,y:5,type:'/'},{x:2,y:5,type:'\\'}]},
 {w:7,h:6,emitter:{x:0,y:3,dir:0},receiver:{x:6,y:0},walls:[{x:3,y:3},{x:3,y:4},{x:2,y:1}],mirrors:[{x:2,y:3,type:'/'},{x:2,y:0,type:'\\'},{x:6,y:3,type:'\\'},{x:5,y:1,type:'/'}]},
 {w:7,h:7,emitter:{x:0,y:0,dir:0},receiver:{x:6,y:6},walls:[{x:3,y:0},{x:3,y:1},{x:3,y:2},{x:3,y:4},{x:3,y:5},{x:3,y:6}],mirrors:[{x:2,y:0,type:'\\'},{x:2,y:6,type:'/'},{x:4,y:6,type:'\\'},{x:4,y:3,type:'/'},{x:6,y:3,type:'\\'}]},
];
let curLevel=0,solved=0,grid,W,H,emitter,receiver,levelComplete=false;

function cellKey(x,y){return x+','+y;}

function loadLevel(idx){
  const L=LEVELS[idx%LEVELS.length];
  W=L.w;H=L.h;
  emitter={x:L.emitter.x,y:L.emitter.y,dir:L.emitter.dir};
  receiver={x:L.receiver.x,y:L.receiver.y};
  grid={};
  L.walls.forEach(w=>grid[cellKey(w.x,w.y)]={type:'wall'});
  L.mirrors.forEach(m=>grid[cellKey(m.x,m.y)]={type:'mirror',shape:m.type});
  levelComplete=false;
  document.getElementById('level-display').textContent=I18N.t('level_solved_label','Level {l} | Solved: {s}').replace('{l}',idx+1).replace('{s}',solved);
  document.getElementById('status').textContent=I18N.t('lasermaze_hint','Rotate the mirrors to guide the beam to the target');
  render();
}

function rotateMirror(x,y){
  if(levelComplete)return;
  const c=grid[cellKey(x,y)];
  if(!c||c.type!=='mirror')return;
  c.shape=c.shape==='/'?'\\':'/';
  SFX.click();
  render();
}

function traceBeam(){
  // returns array of path segments {x,y,dir} and whether it hits receiver
  let x=emitter.x,y=emitter.y,dir=emitter.dir;
  const path=[];
  const seen=new Set();
  for(let steps=0;steps<200;steps++){
    // move
    if(dir===0)x++; else if(dir===1)y++; else if(dir===2)x--; else if(dir===3)y--;
    if(x<0||x>=W||y<0||y>=H)return {path,hit:false};
    const key=cellKey(x,y);
    if(x===receiver.x&&y===receiver.y){path.push({x,y,dir});return {path,hit:true};}
    const c=grid[key];
    if(c&&c.type==='wall')return {path,hit:false};
    if(c&&c.type==='mirror'){
      // reflect
      if(c.shape==='/'){
        dir = dir===0?3 : dir===3?0 : dir===1?2 : 1;
      } else {
        dir = dir===0?1 : dir===1?0 : dir===2?3 : 2;
      }
    }
    path.push({x,y,dir});
    const sk=key+':'+dir;
    if(seen.has(sk))return {path,hit:false};
    seen.add(sk);
  }
  return {path,hit:false};
}

function dirArrow(dir){return ['→','↓','←','↑'][dir];}

function render(){
  const gridEl=document.getElementById('grid');
  gridEl.style.gridTemplateColumns=`repeat(${W},1fr)`;
  gridEl.innerHTML='';
  const {path,hit}=traceBeam();
  const pathSet={};
  path.forEach(p=>{ pathSet[cellKey(p.x,p.y)]=true; });

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const tile=document.createElement('div');
      tile.className='tile';
      const key=cellKey(x,y);
      const c=grid[key];
      if(x===emitter.x&&y===emitter.y){
        tile.classList.add('emitter');
        tile.textContent=dirArrow(emitter.dir);
        tile.style.color='#fff';tile.style.fontWeight='900';
      } else if(x===receiver.x&&y===receiver.y){
        tile.classList.add('receiver');
        if(hit)tile.classList.add('lit');
        tile.textContent='◎';
        tile.style.color='#fff';
      } else if(c&&c.type==='wall'){
        tile.classList.add('wall');
      } else if(c&&c.type==='mirror'){
        tile.classList.add('mirror');
        tile.style.color=pathSet[key]?'#ffd54f':'#8a7fc0';
        tile.style.fontSize='1.6rem';
        tile.style.fontWeight='900';
        tile.textContent=c.shape;
        tile.onclick=()=>rotateMirror(x,y);
      } else {
        if(pathSet[key]){
          tile.style.background='#3a2a5a';
          tile.style.boxShadow='inset 0 0 8px #e63946';
        }
      }
      gridEl.appendChild(tile);
    }
  }

  if(hit&&!levelComplete){
    levelComplete=true;
    solved++;
    document.getElementById('status').textContent=I18N.t('level_solved_msg','Solved! Loading next level...');
    document.getElementById('level-display').textContent=I18N.t('level_solved_label','Level {l} | Solved: {s}').replace('{l}',curLevel+1).replace('{s}',solved);
    SFX.success();
    setTimeout(()=>{
      curLevel++;
      loadLevel(curLevel);
    },900);
  }
}

loadLevel(curLevel);
</script></body></html>
