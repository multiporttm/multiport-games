<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d0221,#7c4dff);display:block;border-radius:8px;touch-action:none}
#score-display{color:#c9a4ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Void Surfing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or <b>drag</b> on touch) to steer your hoverboard through space. Dodge asteroids and debris, collect glowing <b>energy orbs</b>. Speed increases over time — survive as long as you can!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let score=0,hi=parseFloat(localStorage.getItem('voidsurfing_hi')||'0'),dist=0,frame=0,gameOver=false,started=false;
const player={x:120,y:225,w:36,h:20,vy:0,vx:0};
let rocks=[],orbs=[],stars=[],particles=[];
let lastTime=null,rockTimer=0,orbTimer=0,spd=4;
const keys={};
let dragging=false,dragTargetY=null,dragTargetX=null;

function initStars(){
  stars=[];
  for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,spd:Math.random()*1.5+0.5});
}
initStars();

function reset(){
  score=0;dist=0;frame=0;gameOver=false;started=false;spd=4;
  player.x=120;player.y=225;player.vy=0;player.vx=0;
  rocks=[];orbs=[];particles=[];
  lastTime=null;rockTimer=0;orbTimer=0;
}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;}
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space')startOrRestart();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

c.addEventListener('click',()=>startOrRestart());
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  startOrRestart();
  dragging=true;
  const r=c.getBoundingClientRect();
  const t=e.touches[0];
  dragTargetX=(t.clientX-r.left)*(W/r.width);
  dragTargetY=(t.clientY-r.top)*(H/r.height);
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const r=c.getBoundingClientRect();
  const t=e.touches[0];
  dragTargetX=(t.clientX-r.left)*(W/r.width);
  dragTargetY=(t.clientY-r.top)*(H/r.height);
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;dragTargetX=null;dragTargetY=null;},{passive:false});

function spawnRock(){
  const size=20+Math.random()*40;
  const y=Math.random()*(H-size);
  rocks.push({x:W+40,y,r:size/2,vy:(Math.random()-0.5)*1.2,spin:Math.random()*0.1-0.05,ang:0});
}
function spawnOrb(){
  const y=30+Math.random()*(H-60);
  orbs.push({x:W+20,y,r:10,ang:0});
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  const tilt=Math.max(-0.3,Math.min(0.3,player.vy*0.05));
  ctx.rotate(tilt);
  // hoverboard trail
  ctx.fillStyle='rgba(124,77,255,0.5)';
  ctx.beginPath();ctx.ellipse(-24,6,18,5,0,0,Math.PI*2);ctx.fill();
  // board
  ctx.fillStyle='#e0e0ff';
  ctx.beginPath();ctx.ellipse(0,8,22,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7c4dff';
  ctx.beginPath();ctx.ellipse(0,8,22,6,0,0,Math.PI*2);ctx.globalAlpha=0.5;ctx.fill();ctx.globalAlpha=1;
  // rider body
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.ellipse(0,-4,10,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6bd6';
  ctx.beginPath();ctx.arc(6,-14,6,0,Math.PI*2);ctx.fill();
  // glow
  ctx.shadowColor='#7c4dff';ctx.shadowBlur=15;
  ctx.fillStyle='rgba(124,77,255,0.3)';
  ctx.beginPath();ctx.ellipse(0,8,26,8,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawRock(r){
  ctx.save();
  ctx.translate(r.x,r.y);
  ctx.rotate(r.ang);
  ctx.fillStyle='#5a4a42';
  ctx.beginPath();
  const spikes=8;
  for(let i=0;i<spikes;i++){
    const a=(i/spikes)*Math.PI*2;
    const rad=r.r*(0.75+Math.sin(i*37.1)*0.25);
    const px=Math.cos(a)*rad,py=Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a2f2a';
  ctx.beginPath();ctx.arc(-r.r*0.2,-r.r*0.2,r.r*0.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawOrb(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  const pulse=1+Math.sin(o.ang*4)*0.15;
  ctx.shadowColor='#00e5ff';ctx.shadowBlur=18;
  ctx.fillStyle='#00e5ff';
  ctx.beginPath();ctx.arc(0,0,o.r*pulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(0,0,o.r*0.4*pulse,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function circleHit(ax,ay,ar,bx,by,br){
  const dx=ax-bx,dy=ay-by;
  return Math.sqrt(dx*dx+dy*dy)<ar+br;
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30,color});
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // background nebula
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0d0221');g.addColorStop(1,'#3a1a66');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // stars
  stars.forEach(s=>{
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    if(started&&!gameOver)s.x-=s.spd*(spd/4);
    if(s.x<0){s.x=W;s.y=Math.random()*H;}
  });

  if(gameOver){
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+8);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    drawPlayer();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  dist+=spd*dt*0.1;
  score+=dt*0.2;
  spd=4+dist/80;
  if(score>hi){hi=score;localStorage.setItem('voidsurfing_hi',hi);}

  // controls
  const accel=0.6;
  if(dragging&&dragTargetX!=null){
    player.vx+=(dragTargetX-player.x)*0.02;
    player.vy+=(dragTargetY-player.y)*0.02;
    player.vx*=0.8;player.vy*=0.8;
  } else {
    if(keys['ArrowUp']||keys['KeyW'])player.vy-=accel*dt;
    if(keys['ArrowDown']||keys['KeyS'])player.vy+=accel*dt;
    if(keys['ArrowLeft']||keys['KeyA'])player.vx-=accel*dt;
    if(keys['ArrowRight']||keys['KeyD'])player.vx+=accel*dt;
    player.vy*=0.9;player.vx*=0.9;
  }
  player.y+=player.vy*dt;
  player.x+=player.vx*dt;
  player.y=Math.max(20,Math.min(H-20,player.y));
  player.x=Math.max(40,Math.min(W-100,player.x));

  // spawn
  rockTimer+=dt;
  const rockInterval=Math.max(22,55-dist/20);
  if(rockTimer>=rockInterval){rockTimer-=rockInterval;spawnRock();}
  orbTimer+=dt;
  if(orbTimer>=48){orbTimer-=48;spawnOrb();}

  rocks=rocks.filter(r=>r.x>-60);
  rocks.forEach(r=>{
    r.x-=spd*dt*1.4;
    r.y+=r.vy*dt;
    r.ang+=r.spin*dt;
    if(r.y<r.r)r.vy=Math.abs(r.vy);
    if(r.y>H-r.r)r.vy=-Math.abs(r.vy);
    drawRock(r);
    if(circleHit(player.x,player.y,14,r.x,r.y,r.r*0.7)&&!gameOver){
      gameOver=true;SFX.lose();
      spawnParticles(player.x,player.y,'#ff6b35',24);
    }
  });

  orbs=orbs.filter(o=>o.x>-30);
  orbs.forEach(o=>{
    o.x-=spd*dt;
    o.ang+=0.15*dt;
    drawOrb(o);
    if(circleHit(player.x,player.y,14,o.x,o.y,o.r)&&!gameOver){
      score+=25;
      SFX.coin();
      spawnParticles(o.x,o.y,'#00e5ff',10);
      o.x=-999;
    }
  });

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});

  drawPlayer();
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
