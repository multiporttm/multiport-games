<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#7ab648;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#hud{display:flex;justify-content:space-between;max-width:700px;margin:0 auto 8px;color:#eee;font-weight:700;font-size:1rem;flex-wrap:wrap;gap:6px}
#hud span{background:rgba(0,0,0,.3);padding:4px 10px;border-radius:8px}
#msg{text-align:center;color:#ffd54f;font-weight:800;min-height:1.6em;margin-top:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cattle Drive</div>
  <div class="game-frame">
    <div id="hud"><span id="round-display">Round: 1</span><span id="score-display">Penned: 0/0</span><span id="time-display">Time: 45</span></div>
    <canvas id="c" width="700" height="440"></canvas>
    <div id="msg"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use Arrow Keys/WASD or drag on the field to move your cowhand. Cattle scatter away from you — push them toward the pen before time runs out. Don't let them wander off the edges!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=440;
let round=1,penned=0,totalPenned=0,timeLeft=45,gameActive=false;
let best=parseInt(localStorage.getItem('cattledrive_best')||'0',10);

const pen={x:W-110,y:H/2-60,w:90,h:120};
const player={x:80,y:H/2,r:14,speed:3.2};
let keys={};
let cattle=[];
let dragTarget=null;

function spawnCattle(n){
  cattle=[];
  for(let i=0;i<n;i++){
    let x,y;
    do{
      x=60+Math.random()*(W-260);
      y=40+Math.random()*(H-80);
    }while(Math.hypot(x-player.x,y-player.y)<80);
    cattle.push({x,y,vx:0,vy:0,scared:0,penned:false,id:i});
  }
}

function startRound(){
  const n=3+Math.min(round+1,7);
  spawnCattle(n);
  penned=0;
  totalPenned=n;
  timeLeft=Math.max(25,45-round*2);
  player.x=80;player.y=H/2;
  gameActive=true;
  document.getElementById('msg').textContent='';
  updateHud();
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--;
    updateHud();
    if(timeLeft<=0)endRound(false);
  },1000);
}

let timerId=null;
function flashMsg(text,color){
  const m=document.getElementById('msg');
  m.textContent=text;m.style.color=color||'#ffd54f';
  clearTimeout(flashMsg._t);
  flashMsg._t=setTimeout(()=>{m.textContent='';},1600);
}

function endRound(success){
  gameActive=false;
  clearInterval(timerId);
  if(success){
    if(totalPenned>best){}
    SFX.success();
    flashMsg(I18N.t('herd_penned_msg','Herd penned! Moving to the next drive...'),'#7ec850');
    round++;
    setTimeout(startRound,1500);
  }else{
    if(penned>best){best=penned;localStorage.setItem('cattledrive_best',String(best));}
    SFX.fail();
    flashMsg(I18N.t('drive_over_msg','Time\'s up! Total penned across the game: {n}').replace('{n}',penned),'#ff6b6b');
    setTimeout(()=>{round=1;startRound();},2200);
  }
  updateHud();
}

function updateHud(){
  document.getElementById('round-display').textContent=I18N.t('round_label','Round: {r}').replace('{r}',round);
  document.getElementById('score-display').textContent=I18N.t('penned_label','Penned: {p}/{t} (Best: {b})').replace('{p}',penned).replace('{t}',totalPenned).replace('{b}',best);
  document.getElementById('time-display').textContent=I18N.t('time_label','Time: {t}').replace('{t}',timeLeft);
}

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function getPos(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  let clientX,clientY;
  if(e.touches&&e.touches.length){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY;}
  else{clientX=e.clientX;clientY=e.clientY;}
  return {x:(clientX-rect.left)*scaleX,y:(clientY-rect.top)*scaleY};
}
c.addEventListener('mousedown',e=>{dragTarget=getPos(e);});
c.addEventListener('mousemove',e=>{if(dragTarget)dragTarget=getPos(e);});
window.addEventListener('mouseup',()=>{dragTarget=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();dragTarget=getPos(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();dragTarget=getPos(e);},{passive:false});
c.addEventListener('touchend',()=>{dragTarget=null;});

function updatePlayer(){
  let dx=0,dy=0;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(dx||dy){
    const len=Math.hypot(dx,dy);
    player.x+=dx/len*player.speed;
    player.y+=dy/len*player.speed;
  }else if(dragTarget){
    const ddx=dragTarget.x-player.x,ddy=dragTarget.y-player.y;
    const d=Math.hypot(ddx,ddy);
    if(d>4){
      player.x+=ddx/d*player.speed;
      player.y+=ddy/d*player.speed;
    }
  }
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
}

function updateCattle(){
  cattle.forEach(cow=>{
    if(cow.penned)return;
    const d=Math.hypot(cow.x-player.x,cow.y-player.y);
    const fleeRadius=110;
    if(d<fleeRadius){
      const fx=(cow.x-player.x)/d, fy=(cow.y-player.y)/d;
      const force=(fleeRadius-d)/fleeRadius*1.4;
      cow.vx+=fx*force;
      cow.vy+=fy*force;
    }
    // slight random wander + gentle drift back to center of field to avoid corner-camping
    cow.vx+=(Math.random()-0.5)*0.08;
    cow.vy+=(Math.random()-0.5)*0.08;
    // pull them slightly toward pen if very close already, to reduce camping loops
    cow.vx*=0.9;cow.vy*=0.9;
    cow.x+=cow.vx;
    cow.y+=cow.vy;

    // check edges (scatter off map = penalty and remove)
    if(cow.x<10||cow.x>W-10||cow.y<10||cow.y>H-10){
      cow.x=Math.max(12,Math.min(W-12,cow.x));
      cow.y=Math.max(12,Math.min(H-12,cow.y));
      if(!cow.scattered){
        cow.scattered=true;
        SFX.hurt();
        flashMsg(I18N.t('scattered_msg','A cow scattered off the edge!'),'#ff6b6b');
        cattle=cattle.filter(x=>x!==cow);
      }
    }

    // check pen
    if(!cow.penned && cow.x>pen.x+10 && cow.x<pen.x+pen.w-10 && cow.y>pen.y+10 && cow.y<pen.y+pen.h-10){
      cow.penned=true;
      penned++;
      SFX.point();
      updateHud();
    }
  });
  cattle=cattle.filter(cow=>!cow.penned);
}

function drawPen(){
  ctx.fillStyle='rgba(139,94,60,0.4)';
  ctx.fillRect(pen.x,pen.y,pen.w,pen.h);
  ctx.strokeStyle='#5a3a20';ctx.lineWidth=5;
  ctx.strokeRect(pen.x,pen.y,pen.w,pen.h);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('pen_label','PEN'),pen.x+pen.w/2,pen.y-8);
}

function drawCow(cow){
  ctx.fillStyle='#f5f0e6';
  ctx.beginPath();ctx.ellipse(cow.x,cow.y,14,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a2a1a';
  ctx.beginPath();ctx.arc(cow.x-2,cow.y-2,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cow.x+6,cow.y+3,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a2a1a';
  ctx.beginPath();ctx.arc(cow.x+10,cow.y-6,5,0,Math.PI*2);ctx.fill();
}

function drawPlayer(){
  ctx.fillStyle='#7a4a2a';
  ctx.beginPath();ctx.ellipse(player.x,player.y+8,18,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a2a1a';
  ctx.beginPath();ctx.ellipse(player.x,player.y+2,10,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9a86a';
  ctx.beginPath();ctx.arc(player.x,player.y-10,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8b3a2a';
  ctx.beginPath();ctx.moveTo(player.x-10,player.y-14);ctx.lineTo(player.x+10,player.y-14);ctx.lineTo(player.x,player.y-24);ctx.closePath();ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#7ab648';ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){
    ctx.strokeStyle='rgba(0,0,0,0.05)';
    ctx.beginPath();ctx.moveTo(0,i*H/10);ctx.lineTo(W,i*H/10);ctx.stroke();
  }
  drawPen();
  if(gameActive){
    updatePlayer();
    updateCattle();
  }
  cattle.forEach(drawCow);
  drawPlayer();

  if(gameActive&&cattle.length===0){
    endRound(true);
  }
  requestAnimationFrame(draw);
}

startRound();
draw();
</script></body></html>
