<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Vineyard Harvest</title><meta name="description" content="Play Vineyard Harvest free online — Click or tap only the ripe purple grape bunches before time runs out. Avoid unripe green and rotten bunches. Rounds get faster and denser!"><link rel="canonical" href="https://games.multiportllc.com/games/vineyardharvest"><meta property="og:title" content="Vineyard Harvest - Multiport Games"><meta property="og:description" content="Play Vineyard Harvest free online — Click or tap only the ripe purple grape bunches before time runs out. Avoid unripe green and rotten bunches. Rounds get faster and denser!"><meta property="og:url" content="https://games.multiportllc.com/games/vineyardharvest"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Vineyard Harvest","description":"Play Vineyard Harvest free online instantly. Click or tap only the ripe grape bunches across the vineyard row before the harvest timer runs out, avoiding unripe and rotten bunches that cost points and time. Bunch density and speed increase each round. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/vineyardharvest","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#4a2f1a;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:18px;color:#fff2e0;font-size:1.05rem;font-weight:700;padding:8px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
#timewrap{width:260px;height:14px;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin:0 auto 4px;border:1px solid rgba(255,255,255,.3)}
#timebar{height:100%;background:linear-gradient(90deg,#ffb300,#ff7043);width:100%;transition:width .12s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Vineyard Harvest</div>
  <div class="game-frame">
    <div id="timewrap"><div id="timebar"></div></div>
    <div id="hud"><span>Score: <b id="scoreEl">0</b></span><span>Round: <b id="roundEl">1</b></span><span>Best: <b id="bestEl">0</b></span></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap only the <b>ripe purple</b> grape bunches before the harvest timer runs out. Unripe green bunches waste your click and cost time; rotten brown bunches cost points. Each round gets faster and denser — pick fast and pick clean!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const scoreEl=document.getElementById('scoreEl'),roundEl=document.getElementById('roundEl'),bestEl=document.getElementById('bestEl'),timebar=document.getElementById('timebar');
let best=parseInt(localStorage.getItem('vineyardharvest_best')||'0',10);
bestEl.textContent=best;

const ROWS=3,COLS=6;
const cellW=W/COLS,cellH=(H-40)/ROWS;
let bunches=[]; // {r,c,type,alive,pop}
let score=0,round=1,timeLeft=15,roundTime=15,started=false,gameOver=false,lastTime=null;
let flashMsg='',flashTimer=0,flashColor='#fff';

function reset(){
  score=0;round=1;started=false;gameOver=false;lastTime=null;
  startRound();
}

function startRound(){
  roundTime=Math.max(8,15-round*0.6);
  timeLeft=roundTime;
  const density=Math.min(0.85,0.35+round*0.06);
  bunches=[];
  for(let r=0;r<ROWS;r++){
    for(let cc=0;cc<COLS;cc++){
      if(Math.random()<density){
        const roll=Math.random();
        let type='ripe';
        if(roll<0.55)type='ripe';
        else if(roll<0.82)type='unripe';
        else type='rotten';
        bunches.push({r,c:cc,type,alive:true,pop:0,sway:Math.random()*Math.PI*2});
      }
    }
  }
  roundEl.textContent=round;
}
reset();

function cellCenter(r,c){
  return {x:c*cellW+cellW/2, y:40+r*cellH+cellH/2};
}

function bunchAt(px,py){
  for(const b of bunches){
    if(!b.alive)continue;
    const {x,y}=cellCenter(b.r,b.c);
    const dx=px-x,dy=py-y;
    if(Math.sqrt(dx*dx+dy*dy)<28)return b;
  }
  return null;
}

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const cx=e.touches?e.changedTouches[0].clientX:e.clientX;
  const cy=e.touches?e.changedTouches[0].clientY:e.clientY;
  return {x:(cx-rect.left)*(W/rect.width),y:(cy-rect.top)*(H/rect.height)};
}

function handlePick(pos){
  if(!started){started=true;lastTime=null;return;}
  if(gameOver){reset();return;}
  const b=bunchAt(pos.x,pos.y);
  if(!b)return;
  b.alive=false;b.pop=1;
  if(b.type==='ripe'){
    score+=10;SFX.coin();
    flash('+10',1,'#ffd54f');
  } else if(b.type==='unripe'){
    score=Math.max(0,score-5);
    timeLeft=Math.max(0,timeLeft-1.5);
    SFX.error();
    flash('Unripe! -5, -1.5s',1,'#8bc34a');
  } else {
    score=Math.max(0,score-15);
    SFX.hit();
    flash('Rotten! -15',1,'#8d6e63');
  }
}
function flash(t,dur,color){ flashMsg=t;flashTimer=45;flashColor=color; }

c.addEventListener('click',e=>{ handlePick(pointerPos(e)); });
c.addEventListener('touchstart',e=>{ e.preventDefault(); handlePick(pointerPos(e)); },{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(!started){started=true;lastTime=null;} else if(gameOver){reset();} }
});

function drawVine(){
  ctx.fillStyle='#3a2312';
  ctx.fillRect(0,0,W,40);
  ctx.strokeStyle='#6b4423';ctx.lineWidth=6;
  for(let r=0;r<ROWS;r++){
    const y=40+r*cellH+cellH/2;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawBunch(b,frame){
  const {x,y}=cellCenter(b.r,b.c);
  ctx.save();
  const sway=Math.sin(frame/30+b.sway)*2;
  ctx.translate(x+sway,y);
  if(b.pop>0){
    ctx.globalAlpha=Math.max(0,1-b.pop);
    ctx.scale(1+b.pop*0.6,1+b.pop*0.6);
  }
  let color1,color2;
  if(b.type==='ripe'){color1='#7b2d8b';color2='#4a1a5c';}
  else if(b.type==='unripe'){color1='#9ccc65';color2='#689f38';}
  else {color1='#795548';color2='#4e342e';}
  ctx.fillStyle='#4a7c2a';
  ctx.fillRect(-3,-24,6,16);
  const positions=[[-9,-6],[9,-6],[0,-2],[-13,6],[13,6],[-6,12],[6,12],[0,20]];
  positions.forEach(([px,py])=>{
    ctx.fillStyle=color2;
    ctx.beginPath();ctx.arc(px,py+1,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color1;
    ctx.beginPath();ctx.arc(px-1,py,7,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#8bb86a');bg.addColorStop(0.08,'#5a8a3a');bg.addColorStop(1,'#3e2612');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawVine();

  const now=performance.now();
  const dt = (!started||gameOver||lastTime===null)?0:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('vineyard_start','Tap, click, or press Space to start harvesting'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('vineyard_final','Final Score: {s}').replace('{s}',score),W/2,H/2+2);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+30);
    requestAnimationFrame(loop);return;
  }

  bunches.forEach(b=>{
    if(!b.alive&&b.pop>0){b.pop+=0.15*dt;}
    if(b.alive||b.pop<1)drawBunch(b,now/16.6667);
  });

  timeLeft-=dt/60;
  timebar.style.width=Math.max(0,(timeLeft/roundTime)*100)+'%';
  timebar.style.background = timeLeft<3? 'linear-gradient(90deg,#ff5252,#ff1744)' : 'linear-gradient(90deg,#ffb300,#ff7043)';

  const remainingRipe=bunches.some(b=>b.alive&&b.type==='ripe');
  if(timeLeft<=0||!remainingRipe){
    if(timeLeft>0&&!remainingRipe){
      // cleared round early -> bonus and next round
      score+=Math.floor(timeLeft*5);
      round++;
      SFX.levelup();
      startRound();
    } else {
      timeLeft=0;
      gameOver=true;
      if(score>best){best=score;localStorage.setItem('vineyardharvest_best',best);}
      bestEl.textContent=best;
      SFX.lose();
    }
  }

  if(flashTimer>0){
    flashTimer-=dt;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashColor;ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,30);
    ctx.globalAlpha=1;
  }

  scoreEl.textContent=score;
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
