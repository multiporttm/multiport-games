<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Meme Tash</title><meta name="description" content="Play Meme Tash free online — Hold Space, click, or tap to fly upward — release to dive back down. Wider gaps than Level 67, but still dodge them all!"><link rel="canonical" href="https://games.multiportllc.com/games/memetash"><meta property="og:title" content="Meme Tash - Multiport Games"><meta property="og:description" content="Play Meme Tash free online — Hold Space, click, or tap to fly upward — release to dive back down. Wider gaps than Level 67, but still dodge them all!"><meta property="og:url" content="https://games.multiportllc.com/games/memetash"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Meme Tash","description":"Play Meme Tash free online instantly. Press Space, click, or tap to jump. Easier spikes \u2014 but still dodge them all! No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/memetash","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#1a0533}
#c{display:block;border-radius:8px}
#ui{color:#ff79c6;text-align:center;padding:8px;font-size:1.1rem;font-weight:700;text-shadow:0 0 8px #ff79c6}
</style>
</head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title" style="color:#ff79c6;text-shadow:0 0 12px #ff79c6">Meme Tash</div>
  <div class="game-frame" style="background:#1a0533">
    <div id="ui">0m | Best: 0m</div>
    <canvas id="c" width="600" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, click, or tap to fly upward — release to dive back down. Wider gaps than Level 67, but still dodge them all!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=600,H=380,FLOOR=H-52,CEIL=52,SZ=32,SPK=36;
const SPEED=5,WAVE_SPEED=3.4;
const WALL_SPACING=340,WALL_BASE_W=90,GAP_MARGIN=36;
const MEMES=['😎','🤣','💀','🗿','🐸','🤡','😤','🥴','🫡','💅'];
let px,py,camX,walls,frame,score,state,hi=0,nextSpawn,meme,trail,held=false;
let lastTime=null;

function reset(){
  px=90;py=(FLOOR+CEIL)/2-SZ/2;
  camX=0;walls=[];frame=0;score=0;state='play';nextSpawn=420;
  meme=MEMES[Math.floor(Math.random()*MEMES.length)];
  trail=[];
  lastTime=null;
}

function press(){
  try{ if(window.SFX&&SFX.getContext)SFX.getContext(); }catch(e){}
  if(state!=='play'){reset();return;}
  held=true;
}
function release(){held=false;}

document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release();});
c.addEventListener('mousedown',press);
c.addEventListener('mouseup',release);
c.addEventListener('mouseleave',release);
c.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});

// Each "wall" is a matched pair of big spike walls closing in from the floor and
// ceiling, like the valleys in the reference background art — the player has to fly
// through the narrow gap between them. Only ~2 are ever visible on screen at once.
function newWall(wx){
  const maxGapH=155,minGapH=110;
  const gapH=Math.max(minGapH,maxGapH-score*0.25);
  const safeTop=CEIL+GAP_MARGIN+gapH/2,safeBottom=FLOOR-GAP_MARGIN-gapH/2;
  const gapCenter=safeTop+Math.random()*Math.max(10,safeBottom-safeTop);
  const ball=Math.random()<0.3;
  return {x:wx,gapCenter,gapH,ball};
}

function genWalls(){
  while(nextSpawn<camX+W+400){
    walls.push(newWall(nextSpawn));
    nextSpawn+=WALL_SPACING;
  }
}

function hitTest(){
  for(const w of walls){
    const sx=w.x-camX;
    if(sx>W+WALL_BASE_W||sx<-WALL_BASE_W)continue;
    if(px+SZ>sx-WALL_BASE_W/2&&px<sx+WALL_BASE_W/2){
      const gapTop=w.gapCenter-w.gapH/2,gapBottom=w.gapCenter+w.gapH/2;
      if(py<gapTop||py+SZ>gapBottom)return true;
    }
    if(w.ball&&Math.hypot(px+SZ/2-sx,py+SZ/2-w.gapCenter)<20)return true;
  }
  return false;
}

const SPIKE_COLORS=['#ff79c6','#bd93f9','#ff5555','#ffb86c','#50fa7b'];

// A "valley" wall isn't a smooth-edged triangle with decorative teeth stuck on top —
// the whole silhouette is built from jagged spike teeth, so the danger IS the shape.
function drawSpikeWall(sx,tipY,fromFloor,col){
  const baseY=fromFloor?FLOOR:CEIL;
  const x0=sx-WALL_BASE_W/2,x1=sx+WALL_BASE_W/2;
  const teeth=6,toothDepth=13;
  ctx.shadowColor=col;ctx.shadowBlur=14;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x0,baseY);
  for(let i=1;i<teeth;i++){
    const t=i/teeth;
    const bx=x0+(sx-x0)*t,by=baseY+(tipY-baseY)*t;
    ctx.lineTo(bx-(i%2===1?toothDepth:0),by);
  }
  ctx.lineTo(sx,tipY);
  for(let i=teeth-1;i>=1;i--){
    const t=i/teeth;
    const bx=sx+(x1-sx)*t,by=tipY+(baseY-tipY)*t;
    ctx.lineTo(bx+(i%2===1?toothDepth:0),by);
  }
  ctx.lineTo(x1,baseY);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.lineJoin='round';
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.moveTo(x0+12,baseY-(fromFloor?6:-6));
  ctx.lineTo(x1-12,baseY-(fromFloor?6:-6));
  ctx.lineTo(sx,tipY+(fromFloor?12:-12));
  ctx.closePath();ctx.fill();
}

function drawSpikyBall(cx,cy){
  const r=SPK/2;
  ctx.shadowColor='#ff79c6';ctx.shadowBlur=12;
  ctx.fillStyle='#1a0522';
  ctx.beginPath();
  const spikeCount=9;
  for(let i=0;i<spikeCount*2;i++){
    const ang=(i/(spikeCount*2))*Math.PI*2;
    const rad=i%2===0?r*1.35:r*0.8;
    const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy+r*0.18,r*0.32,0,Math.PI);ctx.stroke();
}

function drawTrail(){
  if(trail.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const t=i/trail.length;
    const x1=px+SZ/2-(trail.length-i+1)*7,x2=px+SZ/2-(trail.length-i)*7;
    ctx.strokeStyle='#ff79c6';
    ctx.globalAlpha=t*0.4;
    ctx.lineWidth=SZ*0.35*t;
    ctx.beginPath();ctx.moveTo(x1,trail[i-1]);ctx.lineTo(x2,trail[i]);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawZigzagLine(y,amp){
  const wavelen=14;
  const xOff=-(camX%(wavelen*2));
  ctx.beginPath();
  let first=true;
  for(let x=xOff-wavelen*2;x<W+wavelen*2;x+=wavelen){
    const step=Math.round((x-xOff)/wavelen);
    const yy=y+(step%2===0?0:amp);
    if(first){ctx.moveTo(x,yy);first=false;}else ctx.lineTo(x,yy);
  }
  ctx.stroke();
}

// Nested, filled zigzag bands (not thin outlines) — like stacked chevron stripes
// radiating diagonally across the whole background, matching classic GD level art.
// Big sweeping nested V-chevrons with crisp white edges — like the reference GD art:
// only a couple of large peaks across the whole width, not a fine repeating texture.
function drawChevronBG(){
  const wave=110,amp=50,bandH=34,rows=Math.ceil(((FLOOR-CEIL)+amp)/bandH)+2;
  const xOff=-(camX*0.5%(wave*2));
  const colA='#e91e8c',colB='#6a0f5e';
  // Sample x positions once and reuse for both edges of each band, so the top edge of
  // one band and the bottom edge of the next stay phase-locked (mismatched sampling
  // between a forward and a separately-stepped backward loop caused self-intersecting,
  // gap-riddled polygons here before).
  const xs=[];
  for(let x=xOff-wave*2;x<=W+wave*2;x+=wave)xs.push(x);
  ctx.save();
  for(let r=-1;r<rows;r++){
    const baseY=CEIL-amp+r*bandH;
    ctx.beginPath();
    xs.forEach((x,i)=>{
      const step=Math.round((x-xOff)/wave);
      const y=baseY+(step%2===0?0:amp);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    for(let i=xs.length-1;i>=0;i--){
      const x=xs[i];
      const step=Math.round((x-xOff)/wave);
      const y=baseY+bandH+(step%2===0?0:amp);
      ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=r%2===0?colA:colB;
    ctx.fill();
    ctx.shadowColor='rgba(255,255,255,0.7)';ctx.shadowBlur=6;
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2.5;ctx.lineJoin='round';
    ctx.stroke();
    ctx.shadowBlur=0;

    // dense row of small teeth running the whole length of this band's top edge
    const toothSpacing=16;
    for(let x=xs[0];x<=xs[xs.length-1];x+=toothSpacing){
      const localPhase=((x-xOff)%(wave*2)+wave*2)%(wave*2);
      const risingHalf=localPhase<wave;
      const slopeY=baseY+(risingHalf?(wave-(localPhase%wave))/wave*amp:(localPhase%wave)/wave*amp);
      const tw=7,th=9;
      ctx.beginPath();
      ctx.moveTo(x-tw/2,slopeY-2);ctx.lineTo(x+tw/2,slopeY-2);ctx.lineTo(x,slopeY+th);
      ctx.closePath();
      ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=1.2;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer(){
  ctx.save();ctx.translate(px+SZ/2,py+SZ/2);
  // Glow circle
  const g=ctx.createRadialGradient(0,0,2,0,0,SZ);
  g.addColorStop(0,'rgba(255,121,198,0.3)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,SZ,0,Math.PI*2);ctx.fill();
  // Face circle
  ctx.fillStyle='#ffdd57';ctx.shadowColor='#ffdd57';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(0,0,SZ/2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Emoji
  ctx.font=`${SZ-4}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(meme,0,2);
  ctx.textBaseline='alphabetic';ctx.restore();
}

function loop(){
  ctx.fillStyle='#1a0533';ctx.fillRect(0,0,W,H);
  drawChevronBG();
  // Grid
  ctx.strokeStyle='rgba(255,121,198,0.07)';ctx.lineWidth=1;
  const gx=60-(camX%60);
  for(let x=gx;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,CEIL);ctx.lineTo(x,FLOOR);ctx.stroke();}
  for(let y=CEIL;y<=FLOOR;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(state==='idle'){
      ctx.fillStyle='#ff79c6';ctx.font='bold 48px Arial';
      ctx.shadowColor='#ff79c6';ctx.shadowBlur=18;ctx.fillText(I18N.t('idle_title','MEME TASH'),W/2,H/2-28);
      ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='18px Arial';
      ctx.fillText(I18N.t('idle_hint','Hold Space / Click / Tap to fly up, release to dive'),W/2,H/2+18);
      ctx.fillText(I18N.t('idle_hint2','(easier than Level 67 lol)'),W/2,H/2+44);
    } else {
      ctx.fillStyle='#ff79c6';ctx.font='bold 40px Arial';ctx.fillText(I18N.t('dead_title','💀 REKT 💀'),W/2,H/2-45);
      ctx.fillStyle='#fff';ctx.font='24px Arial';ctx.fillText(`${score}m`,W/2,H/2);
      ctx.fillStyle='#aaa';ctx.font='17px Arial';ctx.fillText(I18N.t('dead_best','Best: {n}m').replace('{n}',hi),W/2,H/2+34);
      ctx.fillText(I18N.t('dead_retry','Space / Click / Tap to retry'),W/2,H/2+62);
    }
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  py+=(held?-WAVE_SPEED:WAVE_SPEED)*dt;
  camX+=SPEED*dt;frame+=dt;
  score=Math.floor(camX/10);if(score>hi)hi=score;

  if((py+SZ>=FLOOR||py<=CEIL)&&state==='play'){state='dead';SFX.lose();}

  trail.push(py+SZ/2);
  if(trail.length>14)trail.shift();

  genWalls();
  walls=walls.filter(w=>w.x>camX-WALL_BASE_W*2);

  ctx.fillStyle='#110222';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillRect(0,0,W,CEIL);
  ctx.shadowColor='#ff79c6';ctx.shadowBlur=14;
  ctx.strokeStyle='#ff79c6';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  drawZigzagLine(FLOOR,-7);
  drawZigzagLine(CEIL,7);
  ctx.shadowBlur=0;

  walls.forEach((w,i)=>{
    const sx=w.x-camX;
    const col=SPIKE_COLORS[i%SPIKE_COLORS.length];
    drawSpikeWall(sx,w.gapCenter-w.gapH/2,false,col);
    drawSpikeWall(sx,w.gapCenter+w.gapH/2,true,col);
    if(w.ball)drawSpikyBall(sx,w.gapCenter);
    // dashed boundary line at the exact edge of the safe gap, so it's clear
    // where the actual hitbox starts even with the jagged tooth silhouette
    ctx.save();
    ctx.setLineDash([6,5]);
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx-WALL_BASE_W/2-6,w.gapCenter-w.gapH/2);ctx.lineTo(sx+WALL_BASE_W/2+6,w.gapCenter-w.gapH/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx-WALL_BASE_W/2-6,w.gapCenter+w.gapH/2);ctx.lineTo(sx+WALL_BASE_W/2+6,w.gapCenter+w.gapH/2);ctx.stroke();
    ctx.restore();
  });
  drawTrail();
  if(hitTest()&&state==='play'){state='dead';SFX.lose();}
  drawPlayer();

  document.getElementById('ui').textContent=`${score}m | Best: ${hi}m`;
  requestAnimationFrame(loop);
}

state='idle';loop();
</script>
</body></html>
