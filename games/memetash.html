<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#1a0533}
#c{display:block;border-radius:8px}
#ui{color:#ff79c6;text-align:center;padding:8px;font-size:1.1rem;font-weight:700;text-shadow:0 0 8px #ff79c6}
</style>
</head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title" style="color:#ff79c6;text-shadow:0 0 12px #ff79c6">Meme Tash</div>
  <div class="game-frame" style="background:#1a0533">
    <div id="ui">0m | Best: 0m</div>
    <canvas id="c" width="600" height="380"></canvas>
  </div>
  <div class="game-instructions">Press <b>Space</b>, click, or tap to jump. Easier spikes — but still dodge them all!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=600,H=380,FLOOR=H-52,CEIL=52,SZ=32,SPK=36;
const SPEED=5,GRAV=0.6,JUMP=-12.5;
const MEMES=['😎','🤣','💀','🗿','🐸','🤡','😤','🥴','🫡','💅'];
let px,py,pvy,camX,spikes,frame,score,state,hi=0,nextSpawn,meme,wobble=0,trail;
let lastTime=null;

function reset(){
  px=90;py=FLOOR-SZ;pvy=0;
  camX=0;spikes=[];frame=0;score=0;state='play';nextSpawn=400;
  meme=MEMES[Math.floor(Math.random()*MEMES.length)];
  trail=[];
  lastTime=null;
}

function jump(){
  if(py+SZ>=FLOOR-1){pvy=JUMP;SFX.jump();}
}
function handleInput(){
  if(state!=='play'){reset();}else jump();
}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();handleInput();}});
c.addEventListener('click',handleInput);
c.addEventListener('touchstart',e=>{e.preventDefault();handleInput();},{passive:false});

function spawnPattern(wx){
  const r=Math.random();
  if(r<0.26){// single floor spike
    spikes.push({x:wx,floor:true});
  } else if(r<0.48){// double floor
    spikes.push({x:wx,floor:true});spikes.push({x:wx+SPK,floor:true});
  } else if(r<0.58){// single ceiling
    spikes.push({x:wx,floor:false});
  } else if(r<0.70){// floor + ceiling far apart
    spikes.push({x:wx,floor:true});spikes.push({x:wx+140,floor:false});
  } else if(r<0.80){// triple floor
    for(let i=0;i<3;i++)spikes.push({x:wx+i*SPK,floor:true});
  } else if(r<0.90){// two ceiling
    spikes.push({x:wx,floor:false});spikes.push({x:wx+SPK,floor:false});
  } else {// spiky ball — a rounder, wider hazard that needs a cleaner jump
    spikes.push({x:wx,floor:true,type:'ball'});
  }
}

function genSpikes(){
  while(nextSpawn<camX+W+300){
    spawnPattern(nextSpawn);
    nextSpawn+=100+Math.random()*150;
  }
}

function hitTest(){
  for(const s of spikes){
    const sx=s.x-camX;
    if(sx>W+SPK||sx<-SPK)continue;
    const hx=(s.x-camX)+SPK*.25,hw=SPK*.50;
    const hy=s.floor?(FLOOR-SPK*.70):CEIL,hh=SPK*.70;
    if(px+SZ>hx&&px<hx+hw&&py+SZ>hy&&py<hy+hh)return true;
  }
  return false;
}

const SPIKE_COLORS=['#ff79c6','#bd93f9','#ff5555','#ffb86c','#50fa7b'];

function drawSpike(sx,floor,col){
  ctx.shadowColor=col;ctx.shadowBlur=14;
  ctx.fillStyle=col;
  ctx.beginPath();
  if(floor){ctx.moveTo(sx,FLOOR);ctx.lineTo(sx+SPK,FLOOR);ctx.lineTo(sx+SPK/2,FLOOR-SPK);}
  else{ctx.moveTo(sx,CEIL);ctx.lineTo(sx+SPK,CEIL);ctx.lineTo(sx+SPK/2,CEIL+SPK);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();
  if(floor){ctx.moveTo(sx+SPK*.3,FLOOR-4);ctx.lineTo(sx+SPK*.7,FLOOR-4);ctx.lineTo(sx+SPK/2,FLOOR-SPK+10);}
  else{ctx.moveTo(sx+SPK*.3,CEIL+4);ctx.lineTo(sx+SPK*.7,CEIL+4);ctx.lineTo(sx+SPK/2,CEIL+SPK-10);}
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
}

function drawSpikyBall(sx,floor){
  const cx=sx+SPK/2,cy=floor?FLOOR-SPK/2:CEIL+SPK/2,r=SPK/2;
  ctx.shadowColor='#ff79c6';ctx.shadowBlur=12;
  ctx.fillStyle='#1a0522';
  ctx.beginPath();
  const spikeCount=9;
  for(let i=0;i<spikeCount*2;i++){
    const ang=(i/(spikeCount*2))*Math.PI*2;
    const rad=i%2===0?r*1.35:r*0.8;
    const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*0.3,cy-r*0.08,r*0.16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy+r*0.18,r*0.32,0,Math.PI);ctx.stroke();
}

function drawTrail(){
  if(trail.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const t=i/trail.length;
    const x1=px+SZ/2-(trail.length-i+1)*7,x2=px+SZ/2-(trail.length-i)*7;
    ctx.strokeStyle='#ff79c6';
    ctx.globalAlpha=t*0.4;
    ctx.lineWidth=SZ*0.35*t;
    ctx.beginPath();ctx.moveTo(x1,trail[i-1]);ctx.lineTo(x2,trail[i]);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawZigzagLine(y,amp){
  const wavelen=14;
  const xOff=-(camX%(wavelen*2));
  ctx.beginPath();
  let first=true;
  for(let x=xOff-wavelen*2;x<W+wavelen*2;x+=wavelen){
    const step=Math.round((x-xOff)/wavelen);
    const yy=y+(step%2===0?0:amp);
    if(first){ctx.moveTo(x,yy);first=false;}else ctx.lineTo(x,yy);
  }
  ctx.stroke();
}

// Nested, filled zigzag bands (not thin outlines) — like stacked chevron stripes
// radiating diagonally across the whole background, matching classic GD level art.
// Big sweeping nested V-chevrons with crisp white edges — like the reference GD art:
// only a couple of large peaks across the whole width, not a fine repeating texture.
function drawChevronBG(){
  const wave=110,amp=50,bandH=34,rows=Math.ceil(((FLOOR-CEIL)+amp)/bandH)+2;
  const xOff=-(camX*0.5%(wave*2));
  const colA='#6a1b6e',colB='#8e24aa';
  // Sample x positions once and reuse for both edges of each band, so the top edge of
  // one band and the bottom edge of the next stay phase-locked (mismatched sampling
  // between a forward and a separately-stepped backward loop caused self-intersecting,
  // gap-riddled polygons here before).
  const xs=[];
  for(let x=xOff-wave*2;x<=W+wave*2;x+=wave)xs.push(x);
  ctx.save();
  for(let r=-1;r<rows;r++){
    const baseY=CEIL-amp+r*bandH;
    ctx.beginPath();
    xs.forEach((x,i)=>{
      const step=Math.round((x-xOff)/wave);
      const y=baseY+(step%2===0?0:amp);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    for(let i=xs.length-1;i>=0;i--){
      const x=xs[i];
      const step=Math.round((x-xOff)/wave);
      const y=baseY+bandH+(step%2===0?0:amp);
      ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=r%2===0?colA:colB;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer(){
  wobble=(pvy<0?-0.15:0.1)*Math.abs(pvy)*.15;
  ctx.save();ctx.translate(px+SZ/2,py+SZ/2);
  // Glow circle
  const g=ctx.createRadialGradient(0,0,2,0,0,SZ);
  g.addColorStop(0,'rgba(255,121,198,0.3)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,SZ,0,Math.PI*2);ctx.fill();
  // Face circle
  ctx.fillStyle='#ffdd57';ctx.shadowColor='#ffdd57';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(0,wobble*10,SZ/2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Emoji
  ctx.font=`${SZ-4}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(meme,0,wobble*10+2);
  ctx.textBaseline='alphabetic';ctx.restore();
}

function loop(){
  ctx.fillStyle='#1a0533';ctx.fillRect(0,0,W,H);
  drawChevronBG();
  // Grid
  ctx.strokeStyle='rgba(255,121,198,0.07)';ctx.lineWidth=1;
  const gx=60-(camX%60);
  for(let x=gx;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,CEIL);ctx.lineTo(x,FLOOR);ctx.stroke();}
  for(let y=CEIL;y<=FLOOR;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(state==='idle'){
      ctx.fillStyle='#ff79c6';ctx.font='bold 48px Arial';
      ctx.shadowColor='#ff79c6';ctx.shadowBlur=18;ctx.fillText('MEME TASH',W/2,H/2-28);
      ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='18px Arial';
      ctx.fillText('Space / Click / Tap to jump',W/2,H/2+18);
      ctx.fillText('(easier than Level 67 lol)',W/2,H/2+44);
    } else {
      ctx.fillStyle='#ff79c6';ctx.font='bold 40px Arial';ctx.fillText('💀 REKT 💀',W/2,H/2-45);
      ctx.fillStyle='#fff';ctx.font='24px Arial';ctx.fillText(`${score}m`,W/2,H/2);
      ctx.fillStyle='#aaa';ctx.font='17px Arial';ctx.fillText(`Best: ${hi}m`,W/2,H/2+34);
      ctx.fillText('Space / Click / Tap to retry',W/2,H/2+62);
    }
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  pvy+=GRAV*dt;py+=pvy*dt;camX+=SPEED*dt;frame+=dt;
  score=Math.floor(camX/10);if(score>hi)hi=score;

  if(py+SZ>=FLOOR){py=FLOOR-SZ;pvy=0;}
  if(py<=CEIL){state='dead';}

  trail.push(py+SZ/2);
  if(trail.length>14)trail.shift();

  genSpikes();
  spikes=spikes.filter(s=>s.x>camX-SPK*2);

  ctx.fillStyle='#110222';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillRect(0,0,W,CEIL);
  ctx.shadowColor='#ff79c6';ctx.shadowBlur=14;
  ctx.strokeStyle='#ff79c6';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  drawZigzagLine(FLOOR,-7);
  drawZigzagLine(CEIL,7);
  ctx.shadowBlur=0;

  spikes.forEach((s,i)=>s.type==='ball'?drawSpikyBall(s.x-camX,s.floor):drawSpike(s.x-camX,s.floor,SPIKE_COLORS[i%SPIKE_COLORS.length]));
  drawTrail();
  if(hitTest()&&state==='play'){state='dead';SFX.lose();}
  drawPlayer();

  document.getElementById('ui').textContent=`${score}m | Best: ${hi}m`;
  requestAnimationFrame(loop);
}

state='idle';loop();
</script>
</body></html>
