<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1510;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffb347;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Escape Room Timer Pressure</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="640" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the tile sequence, then repeat it using <b>1-4 keys</b> or <b>tap the tiles</b>. Next, move the dial with <b>Left/Right Arrows</b> or <b>drag</b> into the glowing ideal zone and press <b>Space</b> or <b>tap Confirm</b> before the countdown hits zero!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLORS=['#ff5e5e','#5ea8ff','#5eff9e','#ffe05e'];
let level=1,score=0,hi=parseInt(localStorage.getItem('escaperoomtimerpressure_hi')||'0',10);
let lives=3,gameOver=false,started=false;
let phase='show'; // show | input | tune | result
let sequence=[],playerIdx=0,showIdx=-1,showTimer=0,showStep=0;
let roomTimer=0,roomTimeMax=0;
let dial=50,idealLo=0,idealHi=0,dialSpeed=0;
let resultMsg='',resultOk=false,resultTimer=0;
let lastTime=null;

function reset(){
  level=1;score=0;lives=3;gameOver=false;started=false;
  startRound();
}

function startRound(){
  const len=Math.min(3+Math.floor(level/2),10);
  sequence=[];
  for(let i=0;i<len;i++)sequence.push(Math.floor(Math.random()*4));
  playerIdx=0;
  roomTimeMax=Math.max(9000,22000-level*700);
  roomTimer=0;
  phase='show';
  showIdx=-1;showTimer=0;showStep=0;
}
reset();

function tileRect(i){
  const w=130,h=130,gap=20;
  const totalW=w*2+gap;
  const x0=(640-totalW)/2;
  const row=Math.floor(i/2),col=i%2;
  return {x:x0+col*(w+gap),y:70+row*(h+gap),w,h};
}

function pressTile(i){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(phase!=='input')return;
  if(sequence[playerIdx]===i){
    SFX.click();
    playerIdx++;
    if(playerIdx>=sequence.length){
      SFX.success();
      startTune();
    }
  } else {
    SFX.error();
    failRound(I18N.t('wrong_sequence','WRONG SEQUENCE!'));
  }
}

function startTune(){
  phase='tune';
  dial=50;
  const zoneW=Math.max(10,24-level);
  const center=20+Math.random()*60;
  idealLo=Math.max(0,center-zoneW/2);
  idealHi=Math.min(100,center+zoneW/2);
  dialSpeed=0;
}

function confirmTune(){
  if(phase!=='tune')return;
  if(dial>=idealLo&&dial<=idealHi){
    SFX.success();
    const timeLeft=Math.max(0,roomTimeMax-roomTimer);
    score+=level*12+Math.round(timeLeft/200);
    if(score>hi){hi=score;localStorage.setItem('escaperoomtimerpressure_hi',String(hi));}
    level++;
    resultMsg=I18N.t('room_balanced','ROOM BALANCED!');
    resultOk=true;
    phase='result';resultTimer=0;
  } else {
    failRound(I18N.t('bad_tuning','POORLY TUNED — TOO EASY OR TOO HARD'));
  }
}

function failRound(msg){
  SFX.fail();
  lives--;
  resultMsg=msg;
  resultOk=false;
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    resultMsg=I18N.t('game_over_title','GAME OVER');
  }
  phase='result';resultTimer=0;
}

function handleCanvasClick(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(phase==='input'){
    for(let i=0;i<4;i++){
      const r=tileRect(i);
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){pressTile(i);return;}
    }
  } else if(phase==='tune'){
    if(y>=300&&y<=340){
      dial=Math.max(0,Math.min(100,((x-70)/500)*100));
    }
    if(y>=350&&y<=390&&x>=270&&x<=370){confirmTune();}
  }
}

c.addEventListener('pointerdown',e=>{
  const rect=c.getBoundingClientRect();
  const sx=c.width/rect.width,sy=c.height/rect.height;
  handleCanvasClick((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const sx=c.width/rect.width,sy=c.height/rect.height;
  const t=e.touches[0];
  handleCanvasClick((t.clientX-rect.left)*sx,(t.clientY-rect.top)*sy);
},{passive:false});
let dragTune=false;
c.addEventListener('pointermove',e=>{
  if(phase!=='tune')return;
  if(e.buttons!==1&&!dragTune)return;
  const rect=c.getBoundingClientRect();
  const sx=c.width/rect.width;
  const x=(e.clientX-rect.left)*sx;
  dial=Math.max(0,Math.min(100,((x-70)/500)*100));
});
c.addEventListener('pointerdown',()=>{dragTune=true;});
window.addEventListener('pointerup',()=>{dragTune=false;});

document.addEventListener('keydown',e=>{
  if(!started){started=true;return;}
  if(gameOver){if(e.code==='Space'||e.code==='Enter')reset();return;}
  if(phase==='input'){
    if(e.key>='1'&&e.key<='4'){pressTile(parseInt(e.key,10)-1);}
  } else if(phase==='tune'){
    if(e.code==='ArrowLeft'){e.preventDefault();dial=Math.max(0,dial-2.5);}
    else if(e.code==='ArrowRight'){e.preventDefault();dial=Math.min(100,dial+2.5);}
    else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();confirmTune();}
  }
});

function drawTiles(highlightIdx){
  for(let i=0;i<4;i++){
    const r=tileRect(i);
    ctx.fillStyle=COLORS[i];
    ctx.globalAlpha=(highlightIdx===i)?1:0.55;
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.globalAlpha=1;
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle='#1a1510';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(String(i+1),r.x+r.w/2,r.y+r.h/2+8);
  }
}

function drawDial(){
  ctx.fillStyle='#2a2318';ctx.fillRect(70,300,500,40);
  const loX=70+idealLo*5,hiX=70+idealHi*5;
  ctx.fillStyle='rgba(110,230,120,0.5)';
  ctx.fillRect(loX,300,hiX-loX,40);
  const knobX=70+dial*5;
  ctx.fillStyle='#ffe05e';
  ctx.fillRect(knobX-5,294,10,52);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(70,300,500,40);
  ctx.fillStyle='#ffe05e';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('confirm_btn_label','CONFIRM (Space)'),320,375);
  ctx.strokeStyle='#ffe05e';ctx.lineWidth=2;
  ctx.strokeRect(270,350,100,40);
}

function loop(){
  ctx.clearRect(0,0,640,400);
  ctx.fillStyle='#120e0a';ctx.fillRect(0,0,640,400);

  if(!started){
    ctx.fillStyle='#ffb347';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press any key / Tap to start'),320,30);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),320,190);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),320,225);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  if(phase==='show'){
    showTimer+=dt*16.6667;
    const stepDur=Math.max(260,480-level*12);
    if(showTimer>=stepDur){
      showTimer=0;showStep++;
      if(showStep>sequence.length*2){phase='input';showIdx=-1;}
    }
    showIdx=(showStep%2===0 && showStep/2<sequence.length)?sequence[showStep/2]:-1;
    drawTiles(showIdx);
    ctx.fillStyle='#ddd';ctx.font='18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('watch_hint','Watch the sequence...'),320,30);
  } else if(phase==='input'){
    roomTimer+=dt*16.6667;
    drawTiles(-1);
    ctx.fillStyle='#ddd';ctx.font='18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('repeat_hint','Repeat the sequence ({a}/{b})').replace('{a}',playerIdx).replace('{b}',sequence.length),320,30);
    if(roomTimer>=roomTimeMax){failRound(I18N.t('time_out','TIME RAN OUT!'));}
  } else if(phase==='tune'){
    roomTimer+=dt*16.6667;
    drawDial();
    ctx.fillStyle='#ddd';ctx.font='18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tune_hint','Tune difficulty into the green zone'),320,30);
    if(roomTimer>=roomTimeMax){failRound(I18N.t('time_out','TIME RAN OUT!'));}
  } else if(phase==='result'){
    resultTimer+=dt*16.6667;
    ctx.fillStyle=resultOk?'#6ee87a':'#ff8a8a';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,320,200);
    if(resultTimer>=1300 && !gameOver){startRound();}
  }

  if(phase!=='result'){
    const remain=Math.max(0,roomTimeMax-roomTimer);
    ctx.fillStyle=remain<3000?'#ff6b6b':'#9bd1ff';ctx.font='bold 18px Arial';ctx.textAlign='left';
    ctx.fillText(I18N.t('time_left_label','Time: {t}s').replace('{t}',(remain/1000).toFixed(1)),10,395);
  }
  ctx.fillStyle='#ddd';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {l}').replace('{l}',level),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}','❤'.repeat(Math.max(0,lives))),630,20);

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
