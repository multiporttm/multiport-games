<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a1628;display:block;border-radius:8px;cursor:crosshair}
#score-display{color:#80deea;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff7043;font-size:1rem;font-weight:700;text-align:center;padding:0 0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lighthouse Fresnel Lens Polishing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and drag (or use <b>Arrow Keys + Space</b>) over the hazy glass panels to polish them clean. Stay inside each panel while polishing — crossing onto a clean panel scratches it! Clear every panel before the clock runs out.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const HI_KEY='lighthousefresnellenspolishing_hi';

let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10),lives=3,gameOver=false,started=false,win=false;
let level=1,timeLeft=0,timeTotal=0;
let cols=3,rows=2,panels=[];
let cursor={x:400,y:210};
let polishing=false;
let lastTime=null;
let keyMove={up:false,down:false,left:false,right:false};
let shakeT=0;

function setHi(v){hi=v;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}

function panelLayout(){
  const pad=40;
  const gridW=W-pad*2, gridH=300;
  const pw=gridW/cols, ph=gridH/rows;
  panels=[];
  for(let r=0;r<rows;r++){
    for(let cc=0;cc<cols;cc++){
      panels.push({
        x:pad+cc*pw,y:60+r*ph,w:pw,h:ph,
        haze:1, // 1 = fully hazy, 0 = clean
        scratched:false,
        id:r*cols+cc
      });
    }
  }
}

function buildLevel(){
  cols=2+Math.min(3,Math.floor((level-1)/1));
  rows=2+Math.min(2,Math.floor((level-1)/2));
  if(level===1){cols=2;rows=2;}
  else if(level===2){cols=3;rows=2;}
  else if(level===3){cols=3;rows=3;}
  else if(level===4){cols=4;rows=3;}
  else {cols=4;rows=4;}
  panelLayout();
  timeTotal=18+panels.length*4;
  timeLeft=timeTotal;
}

function reset(){
  score=0;lives=3;gameOver=false;started=false;win=false;level=1;
  buildLevel();
  lastTime=null;
}
reset();

function allClean(){ return panels.every(p=>p.haze<=0.001); }

function nextLevel(){
  level++;
  if(level>6){win=true;gameOver=true;SFX.win();if(score>hi)setHi(score);return;}
  buildLevel();
  SFX.levelup();
}

function loseLife(){
  lives--;
  shakeT=18;
  SFX.hurt();
  if(lives<=0){
    gameOver=true;win=false;SFX.lose();
    if(score>hi)setHi(score);
  } else {
    // minor penalty: re-haze a random clean panel a bit
    const cleaned=panels.filter(p=>p.haze<0.3);
    if(cleaned.length){
      const p=cleaned[Math.floor(Math.random()*cleaned.length)];
      p.haze=Math.min(1,p.haze+0.4);
    }
  }
}

function panelAt(x,y){
  return panels.find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);
}

function applyPolish(x,y,dt){
  const p=panelAt(x,y);
  if(!p){ return; }
  if(p.scratched)return;
  if(p.haze<=0.001){
    // already clean — moving across it while polishing scratches it
    p.scratched=true;
    loseLife();
    return;
  }
  p.haze=Math.max(0,p.haze-0.03*dt);
  if(p.haze<=0.001){
    score+=15*level;
    SFX.point();
  }
}

function setCursorFromEvent(e){
  const rect=c.getBoundingClientRect();
  cursor.x=(e.clientX-rect.left)*(W/rect.width);
  cursor.y=(e.clientY-rect.top)*(H/rect.height);
}

c.addEventListener('pointerdown',e=>{
  if(!started)started=true;
  if(gameOver){reset();return;}
  setCursorFromEvent(e);
  polishing=true;
});
c.addEventListener('pointermove',e=>{ setCursorFromEvent(e); });
window.addEventListener('pointerup',()=>{polishing=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});

document.addEventListener('keydown',e=>{
  if(!started)started=true;
  if(gameOver&&(e.code==='Enter'||e.code==='Space')){reset();return;}
  if(e.code==='Space'){e.preventDefault();polishing=true;}
  if(e.code==='ArrowUp'){e.preventDefault();keyMove.up=true;}
  if(e.code==='ArrowDown'){e.preventDefault();keyMove.down=true;}
  if(e.code==='ArrowLeft'){e.preventDefault();keyMove.left=true;}
  if(e.code==='ArrowRight'){e.preventDefault();keyMove.right=true;}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space')polishing=false;
  if(e.code==='ArrowUp')keyMove.up=false;
  if(e.code==='ArrowDown')keyMove.down=false;
  if(e.code==='ArrowLeft')keyMove.left=false;
  if(e.code==='ArrowRight')keyMove.right=false;
});

function drawPanel(p){
  ctx.save();
  // glass base
  const grad=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y+p.h);
  grad.addColorStop(0,'#4fc3f7');grad.addColorStop(1,'#0288d1');
  ctx.fillStyle=grad;
  ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4);
  // prism ridges
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=1;
  for(let i=1;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(p.x+2,p.y+(p.h/4)*i);
    ctx.lineTo(p.x+p.w-2,p.y+(p.h/4)*i);
    ctx.stroke();
  }
  // haze overlay
  if(p.scratched){
    ctx.fillStyle='rgba(180,40,40,0.55)';
    ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4);
    ctx.strokeStyle='#ff5252';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x+6,p.y+6);ctx.lineTo(p.x+p.w-6,p.y+p.h-6);
    ctx.moveTo(p.x+p.w-6,p.y+6);ctx.lineTo(p.x+6,p.y+p.h-6);
    ctx.stroke();
  } else if(p.haze>0.001){
    ctx.fillStyle=`rgba(220,220,210,${0.15+p.haze*0.65})`;
    ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4);
  }
  ctx.strokeStyle='#263238';ctx.lineWidth=3;
  ctx.strokeRect(p.x,p.y,p.w,p.h);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-0.5)*6;sy=(Math.random()-0.5)*6;shakeT--;}
  ctx.save();ctx.translate(sx,sy);

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#071726');sky.addColorStop(1,'#123049');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  panels.forEach(drawPanel);

  ctx.fillStyle='#e0f7fa';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('lens_level_label','Lens array: {n}').replace('{n}',level),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lens_time_label','Time: {s}s').replace('{s}',Math.max(0,Math.ceil(timeLeft))),780,30);

  // progress
  const cleanCount=panels.filter(p=>p.haze<=0.001&&!p.scratched).length;
  ctx.textAlign='center';
  ctx.fillText(I18N.t('lens_progress_label','Clean: {c}/{t}').replace('{c}',cleanCount).replace('{t}',panels.length),400,30);

  // cursor / cloth
  ctx.fillStyle=polishing?'rgba(255,235,59,0.9)':'rgba(255,255,255,0.75)';
  ctx.beginPath();ctx.arc(cursor.x,cursor.y,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();

  ctx.restore();

  if(!started&&!gameOver){
    ctx.fillStyle='#80deea99';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lens_start_hint','Drag over the glass to polish it clean'),400,380);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(win?I18N.t('lens_win_title','LENS GLEAMING!'):I18N.t('game_over_title','GAME OVER'),400,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),400,220);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,255);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(started&&!gameOver){
    const spd=4*dt;
    if(keyMove.up)cursor.y=Math.max(60,cursor.y-spd);
    if(keyMove.down)cursor.y=Math.min(H-20,cursor.y+spd);
    if(keyMove.left)cursor.x=Math.max(20,cursor.x-spd);
    if(keyMove.right)cursor.x=Math.min(W-20,cursor.x+spd);

    if(polishing){
      applyPolish(cursor.x,cursor.y,dt);
    }

    timeLeft-=dt/60;
    if(allClean()&&!gameOver){
      nextLevel();
    } else if(timeLeft<=0&&!gameOver){
      loseLife();
      if(!gameOver){
        buildLevel();
      }
    }
    if(score>hi)hi=score;
  }

  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
