<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Javelin Throw</title><meta name="description" content="Play Javelin Throw free online — Alternate the Left and Right Arrow keys (or tap) to sprint down the runway, then press Space at the right moment to release the javelin for maximum distance. Don't cross the foul line!"><link rel="canonical" href="https://games.multiportllc.com/games/javelinthrow"><meta property="og:title" content="Javelin Throw - Multiport Games"><meta property="og:description" content="Play Javelin Throw free online — Alternate the Left and Right Arrow keys (or tap) to sprint down the runway, then press Space at the right moment to release the javelin for maximum distance. Don't cross the foul line!"><meta property="og:url" content="https://games.multiportllc.com/games/javelinthrow"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Javelin Throw","description":"Play Javelin Throw free online instantly. Alternate the Left and Right Arrow keys (or tap) to sprint down the runway, then press Space at the right moment to release the javelin for maximum distance. Release timing and approach speed both affect the physics-based arc — but cross the foul line before releasing and it's a scoreless foul! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/javelinthrow","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1565c0,#8bc34a);display:block;border-radius:8px;touch-action:none}
#score-display{color:#1b5e20;background:#e8f5e9;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
#touch-controls{display:flex;justify-content:center;gap:16px;margin-top:10px}
#touch-controls button{width:110px;height:56px;font-size:1.05rem;font-weight:900;border:none;border-radius:10px;background:#2e7d32;color:#fff;cursor:pointer}
#touch-controls button:active{background:#1b5e20}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Javelin Throw</div>
  <div class="game-frame">
    <div id="score-display">Attempt 1/3 | Best: 0.0 m</div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="touch-controls">
      <button id="btnRun">RUN</button>
      <button id="btnThrow">THROW</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b>/<b>Right Arrow</b> (or tap <b>RUN</b>) rapidly to build up approach speed, then press <b>Space</b> (or tap <b>THROW</b>) to release the javelin. Time it well for a big arc, but don't cross the <b>foul line</b> before releasing!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const GROUND=250;
const FOUL_X=560;
let hiDist=parseFloat(localStorage.getItem('javelin_hidist')||'0')||0;

let attempt,speed,lastKey,phase,runnerX,jav,best,camX,foul;

function newRound(){
  attempt=1;
  best=0;
  startAttempt();
}
function startAttempt(){
  speed=0;
  lastKey=null;
  runnerX=40;
  phase='run'; // run -> flight -> result
  jav=null;
  foul=false;
  camX=0;
  resultDist=0;
}
newRound();

function tap(){
  if(phase==='result'){
    if(attempt>=3){newRound();}
    else{attempt++;startAttempt();}
    return;
  }
  if(phase==='run'){
    speed=Math.min(speed+1.2,18);
    SFX.click();
  }
}
function throwJav(){
  if(phase!=='run')return;
  if(runnerX>=FOUL_X){
    foul=true;
    phase='flight';
    jav={x:runnerX,y:GROUND-20,vx:0,vy:0,dist:0};
    SFX.error();
    return;
  }
  const power=speed/18; // 0..1
  const angle=38*Math.PI/180;
  const launchSpeed=10+power*22;
  jav={
    x:runnerX,y:GROUND-20,
    vx:Math.cos(angle)*launchSpeed,
    vy:-Math.sin(angle)*launchSpeed,
    startX:runnerX
  };
  phase='flight';
  SFX.swoosh();
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();tap();}
  else if(e.code==='Space'){e.preventDefault();if(phase==='result')tap();else throwJav();}
});
document.getElementById('btnRun').addEventListener('touchstart',e=>{e.preventDefault();tap();},{passive:false});
document.getElementById('btnRun').addEventListener('mousedown',()=>tap());
document.getElementById('btnThrow').addEventListener('touchstart',e=>{e.preventDefault();if(phase==='result')tap();else throwJav();},{passive:false});
document.getElementById('btnThrow').addEventListener('mousedown',()=>{if(phase==='result')tap();else throwJav();});
c.addEventListener('click',()=>{ if(phase==='result')tap(); });

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('jav_score_label','Attempt {a}/3 | Best: {b} m')
      .replace('{a}',Math.min(attempt,3))
      .replace('{b}',best.toFixed(1));
}

function drawRunway(){
  ctx.fillStyle='#8bc34a';ctx.fillRect(0,GROUND,W,50);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  for(let i=0;i<W;i+=40){
    ctx.beginPath();ctx.moveTo(i-camX%40,GROUND);ctx.lineTo(i-camX%40,GROUND+50);ctx.stroke();
  }
  // foul line
  const foulSx=FOUL_X-camX;
  if(foulSx>-10&&foulSx<W+10){
    ctx.strokeStyle='#e53935';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(foulSx,GROUND-10);ctx.lineTo(foulSx,GROUND+50);ctx.stroke();
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#64b5f6');sky.addColorStop(1,'#bbdefb');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  drawRunway();

  if(phase==='run'){
    runnerX+=speed*0.25;
    camX=Math.max(0,runnerX-200);
    speed=Math.max(0,speed-0.05); // decay, must keep tapping
    const rs=runnerX-camX;
    ctx.fillStyle='#ffca28';
    ctx.fillRect(rs-10,GROUND-40,20,40);
    ctx.fillStyle='#3e2723';ctx.beginPath();ctx.arc(rs,GROUND-48,10,0,Math.PI*2);ctx.fill();
    // javelin held
    ctx.strokeStyle='#795548';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(rs,GROUND-30);ctx.lineTo(rs+40,GROUND-40);ctx.stroke();

    ctx.fillStyle='#1b5e20';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('jav_run_hint','Alternate keys to build speed, then Space to throw!'),W/2,30);

    // speed meter
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(300,45,200,16);
    ctx.fillStyle='#ff9800';ctx.fillRect(300,45,200*(speed/18),16);
    ctx.strokeStyle='#fff';ctx.strokeRect(300,45,200,16);

    if(runnerX>=FOUL_X+40){
      // auto-foul if they run past without throwing
      foul=true;
      phase='flight';
      jav={x:runnerX,y:GROUND-20,vx:0,vy:0};
      SFX.error();
    }
  }else if(phase==='flight'){
    if(!foul){
      jav.x+=jav.vx*2;
      jav.y+=jav.vy*2;
      jav.vy+=0.5;
      camX=Math.max(0,jav.x-300);
      if(jav.y>=GROUND-10){
        jav.y=GROUND-10;
        phase='result';
        resultDist=(jav.x-jav.startX)/8; // scale to meters
        if(resultDist>best){best=resultDist;}
        if(resultDist>hiDist){hiDist=resultDist;localStorage.setItem('javelin_hidist',hiDist);}
        SFX.land();
      }
    }else{
      phase='result';
      resultDist=0;
      camX=Math.max(0,runnerX-200);
    }
    const js=jav.x-camX;
    ctx.save();
    ctx.translate(js,jav.y);
    const ang=Math.atan2(jav.vy||0.3,jav.vx||1);
    ctx.rotate(ang);
    ctx.strokeStyle='#795548';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();
    ctx.fillStyle='#bdbdbd';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(12,-3);ctx.lineTo(12,3);ctx.fill();
    ctx.restore();
  }else if(phase==='result'){
    ctx.fillStyle='#1b5e20';ctx.font='bold 32px Arial';ctx.textAlign='center';
    if(foul){
      ctx.fillText(I18N.t('jav_foul','FOUL!'),W/2,110);
      ctx.font='18px Arial';
      ctx.fillText(I18N.t('jav_foul_hint','You crossed the line before releasing.'),W/2,145);
    }else{
      ctx.fillText(I18N.t('jav_dist_label','{d} m').replace('{d}',resultDist.toFixed(1)),W/2,110);
      ctx.font='18px Arial';
      ctx.fillText(I18N.t('jav_result_hint','Nice throw!'),W/2,145);
    }
    ctx.font='16px Arial';
    ctx.fillText(attempt>=3?I18N.t('jav_new_round','Tap to start a new round'):I18N.t('jav_next_attempt','Tap for next attempt'),W/2,175);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
