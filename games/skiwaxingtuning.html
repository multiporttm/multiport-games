<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#eef3f8;display:block;border-radius:8px;touch-action:none}
#hud{color:#1e3a5f;font-size:1.02rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
#controls2{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
#controls2 button{padding:12px 28px;background:#2b6ca3;border:none;border-radius:16px;color:#fff;cursor:pointer;font-size:1rem;font-weight:700}
#controls2 button:active{transform:scale(.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ski Waxing Tuning</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreDisp">Score: 0 | Hi: 0</span><span id="levelDisp">Level 1</span><span id="livesDisp">♥ ♥ ♥</span></div>
    <canvas id="c" width="800" height="420"></canvas>
    <div id="controls2">
      <button id="btnTune">🔧 Tune</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or tap <b>Tune</b> the instant the moving dial crosses the glowing zone to iron wax evenly, scrape off the excess, and bevel the edges to the angle the snow conditions call for. Miss and you lose a life — three misses and the shift ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),levelDisp=document.getElementById('levelDisp'),livesDisp=document.getElementById('livesDisp');
const W=800,H=420;
let score=0,hi=parseInt(localStorage.getItem('skiwaxingtuning_hi')||'0',10);
let level=1,lives=3,gameOver=false,started=false;
let stationIdx=0,skisDone=0,skisPerLevel=3;
let angle=0,lastTime=null;
let msg='',msgTimer=0,flashTimer=0,flashOk=false;

const STATIONS=[
  {key:'wax',label:()=>I18N.t('station_wax','Iron the Wax')},
  {key:'scrape',label:()=>I18N.t('station_scrape','Scrape the Excess')},
  {key:'edge',label:()=>I18N.t('station_edge','Bevel the Edge')}
];
const CONDITIONS=['powder','packed','icy','slush'];
function condLabel(k){
  return {
    powder:I18N.t('cond_powder','Fresh Powder'),
    packed:I18N.t('cond_packed','Packed Powder'),
    icy:I18N.t('cond_icy','Icy & Hard'),
    slush:I18N.t('cond_slush','Spring Slush')
  }[k];
}
let condition='powder',zoneCenter=50,zoneHalf=18;

function rand(lo,hi){ return lo+Math.random()*(hi-lo); }

function edgeCenterFor(cond){
  return {powder:25,packed:45,icy:75,slush:55}[cond];
}

function newStationZone(){
  const shrink=Math.max(6,18-(level-1)*1.1);
  zoneHalf=shrink;
  if(STATIONS[stationIdx].key==='edge'){
    zoneCenter=edgeCenterFor(condition)+rand(-4,4);
  } else {
    zoneCenter=rand(28,72);
  }
  zoneCenter=Math.max(zoneHalf+2,Math.min(98-zoneHalf,zoneCenter));
}

function newSki(){
  stationIdx=0;
  condition=CONDITIONS[Math.floor(Math.random()*CONDITIONS.length)];
  newStationZone();
}

function resetGame(){
  score=0;level=1;lives=3;gameOver=false;started=false;skisDone=0;skisPerLevel=3;
  newSki();
}
resetGame();

function flash(t,ok){ msg=t;msgTimer=70;flashTimer=30;flashOk=ok; }

function pointerVal(){
  const amp=40;
  return 50+amp*Math.sin(angle);
}

function startIfNeeded(){ if(!started&&!gameOver) started=true; }

function doTune(){
  if(gameOver){ resetGame(); return; }
  startIfNeeded();
  const v=pointerVal();
  const lo=zoneCenter-zoneHalf,hiz=zoneCenter+zoneHalf;
  if(v>=lo&&v<=hiz){
    const perfect=Math.abs(v-zoneCenter)<=zoneHalf*0.35;
    score+=perfect?30+level*3:15+level*2;
    SFX.point();
    stationIdx++;
    if(stationIdx>=STATIONS.length){
      skisDone++;
      score+=80+level*8;
      SFX.success();
      flash(I18N.t('ski_done','Pair tuned and ready!'),true);
      if(skisDone%skisPerLevel===0){
        level++;
        SFX.levelup();
        flash(I18N.t('level_up','Shift speeds up! Level '+level),true);
      }
      newSki();
    } else {
      flash(I18N.t('station_hit','Nice! Next step...'),true);
      newStationZone();
    }
  } else {
    lives--;
    SFX.error();
    flash(I18N.t('station_miss','Missed the zone!'),false);
    if(lives<=0) endGame();
  }
}

function endGame(){
  gameOver=true;
  SFX.lose();
  if(score>hi){ hi=score; localStorage.setItem('skiwaxingtuning_hi',String(hi)); }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); doTune(); }
});
c.addEventListener('pointerdown',e=>{ e.preventDefault(); doTune(); });
document.getElementById('btnTune').addEventListener('click',doTune);

function drawBar(){
  const bx=80,by=220,bw=W-160,bh=26;
  ctx.fillStyle='#d7e3ee';
  ctx.fillRect(bx,by,bw,bh);
  const lo=zoneCenter-zoneHalf,hiz=zoneCenter+zoneHalf;
  ctx.fillStyle='rgba(126,200,80,0.55)';
  ctx.fillRect(bx+bw*(lo/100),by,bw*((hiz-lo)/100),bh);
  const perfLo=zoneCenter-zoneHalf*0.35,perfHi=zoneCenter+zoneHalf*0.35;
  ctx.fillStyle='rgba(126,200,80,0.95)';
  ctx.fillRect(bx+bw*(perfLo/100),by,bw*((perfHi-perfLo)/100),bh);
  const v=pointerVal();
  const px=bx+bw*(v/100);
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.moveTo(px,by-10);ctx.lineTo(px-9,by-28);ctx.lineTo(px+9,by-28);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#1e3a5f';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
}

function drawSki(){
  ctx.save();
  ctx.translate(W/2,320);
  ctx.fillStyle='#3b6ea5';
  ctx.fillRect(-260,-10,520,20);
  ctx.fillStyle='#9fd8ff';
  ctx.fillRect(-260,-10,520,6);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#f6f9fc');bg.addColorStop(1,'#cdd9e3');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#1e3a5f';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(STATIONS[stationIdx]?STATIONS[stationIdx].label():'',W/2,90);
  ctx.font='16px Arial';
  ctx.fillText(I18N.t('condition_label','Requested snow: {c}').replace('{c}',condLabel(condition)),W/2,120);

  drawSki();
  drawBar();

  if(flashTimer>0){
    flashTimer--;
    ctx.fillStyle=flashOk?'rgba(126,200,80,0.18)':'rgba(233,69,96,0.22)';
    ctx.fillRect(0,0,W,H);
  }

  if(!started&&!gameOver){
    ctx.fillStyle='rgba(30,58,95,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap Tune or press Space to start'),W/2,H/2);
  }

  if(started&&!gameOver){
    const now=performance.now();
    const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
    lastTime=now;
    const speed=0.045+(level-1)*0.006;
    angle+=speed*dt;
  } else {
    lastTime=null;
  }

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#1e3a5f';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,H-26);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SHIFT OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: {s}').replace('{s}',score),W/2,H/2+6);
    ctx.fillText(I18N.t('restart_hint2','Tap or press Space to restart'),W/2,H/2+36);
  }

  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  levelDisp.textContent=I18N.t('level_label','Level {l}').replace('{l}',level);
  livesDisp.textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
