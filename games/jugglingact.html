<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Juggling Act</title><meta name="description" content="Play Juggling Act free online — Click or tap a ball when it falls into the catch zone at the bottom to toss it back up. Don't let a ball drop or you lose a life!"><link rel="canonical" href="https://games.multiportllc.com/games/jugglingact"><meta property="og:title" content="Juggling Act - Multiport Games"><meta property="og:description" content="Play Juggling Act free online — Click or tap a ball when it falls into the catch zone at the bottom to toss it back up. Don't let a ball drop or you lose a life!"><meta property="og:url" content="https://games.multiportllc.com/games/jugglingact"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Juggling Act","description":"Play Juggling Act free online instantly. Click or tap a ball when it falls into the catch zone at the bottom to toss it back up into the air. Miss a catch and you lose a life; more balls join the act as your score climbs. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/jugglingact","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a237e,#00bcd4);display:block;border-radius:8px;touch-action:none}
#score-display{color:#00e5ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Juggling Act</div>
  <div class="game-frame">
    <div id="score-display">Catches: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="480" height="520"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap a ball when it falls into the glowing <b>catch zone</b> near the bottom to toss it back up. Miss and it drops, costing a life — more balls join in as you go!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=520;
const GROUND=H-60;
const CATCH_Y_LO=GROUND-70,CATCH_Y_HI=GROUND-10;
const GRAV=0.45;
const colors=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff8a65','#ba68c8'];

let best=parseInt(localStorage.getItem('jugglingact_best')||'0');
let balls=[],catches=0,lives=3,gameOver=false,started=false;
let nextBallTimer=0,lastTime=null;

function spawnBall(x){
  const vy=-11-Math.random()*2;
  balls.push({
    x:x!=null?x:80+Math.random()*(W-160),
    y:CATCH_Y_LO,
    vy,
    r:22,
    color:colors[Math.floor(Math.random()*colors.length)],
    dropped:false,
    dead:false,
    caughtFlash:0
  });
}

function reset(){
  balls=[];catches=0;lives=3;gameOver=false;started=false;nextBallTimer=0;lastTime=null;
  spawnBall(W*0.3);spawnBall(W*0.5);spawnBall(W*0.7);
}
reset();

function start(){
  if(!started){started=true;lastTime=performance.now();}
}

function tryCatch(px,py){
  if(!started){start();return;}
  if(gameOver){reset();return;}
  let best_=null,bestDist=9999;
  for(const b of balls){
    if(b.dead)continue;
    const d=Math.hypot(b.x-px,b.y-py);
    if(d<b.r+30 && d<bestDist){bestDist=d;best_=b;}
  }
  if(best_ && best_.y>=CATCH_Y_LO-10 && best_.y<=CATCH_Y_HI+20 && best_.vy>0){
    best_.vy=-11-Math.random()*2-Math.min(4,catches*0.05);
    best_.caughtFlash=8;
    catches++;
    SFX.catch();
    if(catches>best){best=catches;localStorage.setItem('jugglingact_best',best);}
    // increase difficulty: add a ball every 8 catches, up to 6
    if(catches%8===0 && balls.filter(b=>!b.dead).length<6){
      spawnBall();
    }
  }else{
    SFX.click();
  }
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  tryCatch((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  tryCatch((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function drawBall(b){
  ctx.save();
  if(b.caughtFlash>0){
    ctx.shadowColor='#fff';ctx.shadowBlur=20;
  }
  ctx.fillStyle=b.color;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.arc(b.x-6,b.y-6,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1a237e');bg.addColorStop(1,'#00bcd4');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // ground
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,GROUND,W,H-GROUND);
  // catch zone glow
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.fillRect(0,CATCH_Y_LO-20,W,CATCH_Y_HI-CATCH_Y_LO+40);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(0,CATCH_Y_LO);ctx.lineTo(W,CATCH_Y_LO);ctx.stroke();
  ctx.setLineDash([]);

  if(!started){
    balls.forEach(drawBall);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Click / Tap to start juggling'),W/2,H/2);
    document.getElementById('score-display').textContent=I18N.t('juggle_status_label','Catches: {c} | Lives: {l} | Best: {b}').replace('{c}','0').replace('{l}','3').replace('{b}',best);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    balls.forEach(drawBall);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('act_over_title','ACT OVER!'),W/2,200);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint3','Click or Tap to try again'),W/2,235);
    document.getElementById('score-display').textContent=I18N.t('juggle_status_label','Catches: {c} | Lives: {l} | Best: {b}').replace('{c}',catches).replace('{l}','0').replace('{b}',best);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  balls.forEach(b=>{
    if(b.dead)return;
    b.vy+=GRAV*dt;
    b.y+=b.vy*dt;
    if(b.caughtFlash>0)b.caughtFlash--;
    if(b.y>GROUND+30 && b.vy>0){
      lives--;
      SFX.hit();
      if(lives<=0){
        gameOver=true;
        SFX.lose();
      }else{
        // respawn this ball back into the act
        b.y=CATCH_Y_LO;
        b.vy=-11-Math.random()*2;
        b.color=colors[Math.floor(Math.random()*colors.length)];
      }
    }
    drawBall(b);
  });

  document.getElementById('score-display').textContent=I18N.t('juggle_status_label','Catches: {c} | Lives: {l} | Best: {b}').replace('{c}',catches).replace('{l}',lives).replace('{b}',best);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
