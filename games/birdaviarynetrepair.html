<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#14271f;display:block;border-radius:8px;touch-action:none}
#hud{color:#d9f5e6;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#ffb74d}
#hud span.hs{color:#52b788}
#actions{display:flex;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}
#actions button{padding:9px 16px;background:#2d6a4f;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1.1rem;font-weight:700;min-width:48px}
#actions button:active{transform:scale(.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bird Aviary Net Repair</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="actions">
      <button id="upBtn" data-dir="U">↑</button>
      <button id="leftBtn" data-dir="L">←</button>
      <button id="downBtn" data-dir="D">↓</button>
      <button id="rightBtn" data-dir="R">→</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap a torn hole in the net to select it, then weave it shut by pressing the <b>arrow keys</b> (or the on-screen arrows) in the exact sequence shown above the hole. Finish every tear before its timer runs out or a bird escapes! 3 lives.</div>
</div>
<script>
(function(){
const HS_KEY='birdaviarynetrepair_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const DIRS=['U','D','L','R'];
const ARROW={U:'↑',D:'↓',L:'←',R:'→'};

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let holes=[],selected=0,spawnTimer=0,flashMsg='',flashT=0,flashOk=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function maxConcurrent(){ return Math.min(5,2+Math.floor(level/2)); }
function seqLen(){ return Math.min(6,3+Math.floor(level/2)); }
function holeLife(){ return Math.max(150,420-level*22); }
function spawnInterval(){ return Math.max(40,110-level*6); }

function randPos(){
  let x,y,ok;
  for(let tries=0;tries<20;tries++){
    x=60+Math.random()*(W-120);
    y=60+Math.random()*(H-120);
    ok=true;
    for(const h of holes){ if(Math.hypot(h.x-x,h.y-y)<70){ ok=false;break; } }
    if(ok)break;
  }
  return {x,y};
}

function spawnHole(){
  const p=randPos();
  const n=seqLen();
  const seq=[];
  for(let i=0;i<n;i++) seq.push(DIRS[Math.floor(Math.random()*DIRS.length)]);
  holes.push({x:p.x,y:p.y,r:30,seq,progress:0,timeLeft:holeLife(),maxTime:holeLife()});
}

function flash(msg,ok){ flashMsg=msg; flashOk=ok; flashT=55; }

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  holes=[];selected=0;spawnTimer=0;
}
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

function nearestHoleIdx(x,y){
  let best=-1,bestD=Infinity;
  holes.forEach((h,i)=>{ const d=Math.hypot(h.x-x,h.y-y); if(d<bestD){bestD=d;best=i;} });
  return best;
}

function pressDir(dir){
  if(!started||gameOver){ startGame(); return; }
  if(holes.length===0) return;
  if(selected>=holes.length) selected=0;
  const h=holes[selected];
  if(!h) return;
  if(h.seq[h.progress]===dir){
    h.progress++;
    SFX.click();
    if(h.progress>=h.seq.length){
      score+=15*level;
      SFX.success();
      flash(I18N.t('hole_patched','Patched!'),true);
      holes.splice(selected,1);
      if(selected>=holes.length) selected=Math.max(0,holes.length-1);
      if(score>=level*120){ level++; SFX.levelup(); flash(I18N.t('round_up','Round up!'),true); }
    }
  } else {
    h.progress=0;
    SFX.error();
    flash(I18N.t('wrong_weave','Wrong weave — restart that knot!'),false);
  }
}

document.addEventListener('keydown',e=>{
  let dir=null;
  if(e.code==='ArrowUp')dir='U';
  else if(e.code==='ArrowDown')dir='D';
  else if(e.code==='ArrowLeft')dir='L';
  else if(e.code==='ArrowRight')dir='R';
  else if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  if(dir){ e.preventDefault(); pressDir(dir); }
});

['upBtn','downBtn','leftBtn','rightBtn'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); pressDir(el.dataset.dir); });
});

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!started||gameOver){ startGame(); return; }
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width);
  const y=(e.clientY-rect.top)*(H/rect.height);
  const idx=nearestHoleIdx(x,y);
  if(idx>=0) selected=idx;
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function birdEscaped(){
  lives--;
  SFX.lose();
  flash(I18N.t('bird_escaped','A bird slipped through!'),false);
  if(lives<=0){ endGame(); }
}

function drawNet(){
  ctx.strokeStyle='rgba(200,230,210,0.18)';
  ctx.lineWidth=1;
  for(let x=0;x<=W;x+=24){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<=H;y+=24){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
}

function drawHole(h,idx){
  const frac=h.timeLeft/h.maxTime;
  ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);
  ctx.fillStyle='#08130d';ctx.fill();
  ctx.lineWidth=5;
  ctx.strokeStyle=frac<0.3?'#e74c3c':(frac<0.6?'#ffd54f':'#52b788');
  ctx.beginPath();ctx.arc(h.x,h.y,h.r,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
  ctx.stroke();
  if(idx===selected){
    ctx.lineWidth=2;ctx.strokeStyle='#fff';
    ctx.beginPath();ctx.arc(h.x,h.y,h.r+5,0,Math.PI*2);ctx.stroke();
  }
  // sequence icons
  const n=h.seq.length;
  const startX=h.x-(n*16)/2+8;
  ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<n;i++){
    ctx.fillStyle=i<h.progress?'#52b788':(i===h.progress?'#ffd54f':'#888');
    ctx.fillText(ARROW[h.seq[i]],startX+i*16,h.y-h.r-14);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1a13');bg.addColorStop(1,'#14271f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawNet();

  if(!started){
    ctx.fillStyle='#d9f5e6';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  spawnTimer++;
  if(spawnTimer>=spawnInterval()&&holes.length<maxConcurrent()){
    spawnTimer=0;
    spawnHole();
  }

  for(let i=holes.length-1;i>=0;i--){
    const h=holes[i];
    h.timeLeft--;
    if(h.timeLeft<=0){
      holes.splice(i,1);
      if(selected>=holes.length) selected=Math.max(0,holes.length-1);
      birdEscaped();
      if(gameOver) break;
    }
  }

  if(!gameOver){
    holes.forEach((h,i)=>drawHole(h,i));
  }

  if(flashT>0){
    ctx.fillStyle=flashOk?'#52b788':'#e74c3c';
    ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,30);
    flashT--;
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
