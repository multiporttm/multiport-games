<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1565c0}
#ui{color:#bbdefb;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Superhero Flight</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Stars: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to fly freely. Dodge the buildings scrolling in from the right and grab ⭐ stars along the way. Crash into a building and it's game over!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,buildings,stars,dist,starCount,speed,state,keys={},spawnTimer;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('superheroflight_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('superheroflight_best',v);}

function init(){
  player={x:60,y:H/2};
  buildings=[];stars=[];dist=0;starCount=0;speed=3;state='play';spawnTimer=0;
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.6;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  speed=3+dist*0.0015;
  dist+=speed*0.08;

  spawnTimer--;
  if(spawnTimer<=0){
    const h=rand(50,150);
    buildings.push({x:W+20,y:Math.random()<0.5?0:H-h,w:36,h});
    if(Math.random()<0.6)stars.push({x:W+20,y:rand(30,H-30)});
    spawnTimer=Math.max(35,60-dist*0.03);
  }

  buildings.forEach(b=>b.x-=speed);
  buildings=buildings.filter(b=>b.x>-50);
  stars.forEach(s=>s.x-=speed);
  stars=stars.filter(s=>s.x>-20);

  buildings.forEach(b=>{
    if(player.x+SIZE/2>b.x&&player.x-SIZE/2<b.x+b.w&&player.y+SIZE/2>b.y&&player.y-SIZE/2<b.y+b.h){
      state='over';
      SFX.lose();
      saveBest(starCount);
    }
  });

  stars=stars.filter(s=>{
    if(dist2(s,player)<20){starCount++;SFX.coin();return false;}
    return true;
  });

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1565c0';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#0d47a1';
  buildings.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  stars.forEach(s=>ctx.fillText('⭐',s.x,s.y));

  ctx.font='24px Arial';
  ctx.fillText('🦸',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#bbdefb';ctx.font='bold 26px Arial';
    ctx.fillText('CRASHED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Distance: ${Math.floor(dist)}m | Stars: ${starCount}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Stars: ${starCount}`;
}

init();draw();
</script></body></html>
