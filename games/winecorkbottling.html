<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#3b1f1f;display:block;border-radius:8px}
#score-display{color:#e8b64a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wine Cork Bottling</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Click</b>, or <b>Tap</b> when the moving marker is inside the green zone to catch, cork, label, and crate each bottle. Miss and the bottle breaks! The line speeds up and the zones shrink every level.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const STAGES=['catch','cork','label','crate'];
let score=0,hi=parseInt(localStorage.getItem('hi_winecorkbottling')||'0',10);
let lives=3,level=1,crated=0,gameOver=false,started=false;
let stageIdx=0,marker=0,markerDir=1,markerSpeed=2.2,targetStart=40,targetW=70;
let barW=320,flashTimer=0,flashMsg='',flashGood=false;
let brokenAnim=0;

function barMetrics(){
  return {speed:markerSpeed+ (level-1)*0.55, w:Math.max(26,targetW-(level-1)*4)};
}

function newRound(){
  stageIdx=0;marker=0;markerDir=1;
  const m=barMetrics();
  targetW=m.w;
  targetStart=Math.random()*(barW-targetW);
}

function nextStage(){
  stageIdx++;
  marker=0;markerDir=1;
  const m=barMetrics();
  targetW=m.w;
  targetStart=Math.random()*(barW-targetW);
  if(stageIdx>=STAGES.length){
    crated++;
    score+=20*level;
    flash(I18N.t('crate_done','Crated!'),true);
    SFX.coin();
    if(crated%5===0){level++;SFX.levelup();flash(I18N.t('level_up','Level {n}!').replace('{n}',level),true);}
    newRound();
  }
}

function flash(msg,good){flashMsg=msg;flashGood=good;flashTimer=55;}

function reset(){
  score=0;lives=3;level=1;crated=0;gameOver=false;started=false;
  newRound();
}
reset();

function action(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const m=barMetrics();
  const inZone=marker>=targetStart&&marker<=targetStart+targetW;
  if(inZone){
    const stage=STAGES[stageIdx];
    if(stage==='catch'){SFX.catch();}
    else if(stage==='cork'){SFX.click();}
    else if(stage==='label'){SFX.point();}
    nextStage();
  }else{
    lives--;
    SFX.fail();
    brokenAnim=30;
    flash(I18N.t('bottle_broke','Bottle broke!'),false);
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      if(score>hi){hi=score;localStorage.setItem('hi_winecorkbottling',String(hi));}
    }else{
      newRound();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();action();}});
c.addEventListener('click',action);
c.addEventListener('touchstart',e=>{e.preventDefault();action();},{passive:false});

function drawBottle(x,y,stageDone){
  ctx.save();
  ctx.fillStyle=stageDone>=3?'#2d7d46':'#3a8f52';
  ctx.fillRect(x-14,y-10,28,50);
  ctx.fillStyle='#2d7d46';
  ctx.fillRect(x-6,y-34,12,26);
  if(stageDone>=1){ctx.fillStyle='#8b5a2b';ctx.fillRect(x-7,y-38,14,8);}
  if(stageDone>=2){ctx.fillStyle='#f4e4c1';ctx.fillRect(x-12,y+2,24,16);ctx.fillStyle='#333';ctx.font='8px Arial';ctx.textAlign='center';ctx.fillText('WINE',x,y+13);}
  ctx.restore();
}

function drawCrate(x,y,filled){
  ctx.save();
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=4;
  ctx.strokeRect(x-40,y-10,80,45);
  ctx.beginPath();ctx.moveTo(x-40,y-10);ctx.lineTo(x+40,y+35);ctx.moveTo(x+40,y-10);ctx.lineTo(x-40,y+35);ctx.stroke();
  if(filled>0){
    ctx.fillStyle='#2d7d46';
    for(let i=0;i<filled;i++){
      ctx.fillRect(x-32+i*22,y-4,14,30);
    }
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#2a1414');sky.addColorStop(1,'#3b1f1f');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // conveyor
  ctx.fillStyle='#5a3a2a';ctx.fillRect(0,230,W,16);
  ctx.fillStyle='#4a2d20';
  for(let i=0;i<W;i+=30){ctx.fillRect((i+ (Date.now()/10)%30)%W,234,16,8);}

  if(!started){
    ctx.fillStyle='#e8b64a';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,100);
    drawBottle(W/2,180,0);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,130);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,168);
    ctx.font='16px Arial';ctx.fillText(I18N.t('crated_count','Bottles crated: {n}').replace('{n}',crated),W/2,198);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);
    return;
  }

  const m=barMetrics();
  marker+=markerDir*m.speed;
  if(marker>=barW){marker=barW;markerDir=-1;}
  if(marker<=0){marker=0;markerDir=1;}

  const stage=STAGES[Math.min(stageIdx,STAGES.length-1)];
  const stationX=W/2,stationY=170;
  if(brokenAnim>0){
    brokenAnim--;
    ctx.fillStyle='#8a2222';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText('💥',stationX,stationY+10);
  }else{
    drawBottle(stationX,stationY,stageIdx);
  }
  drawCrate(680,220,Math.min(crated%5,5));

  // bar UI
  const barX=W/2-barW/2,barY=270;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(barX,barY,barW,22);
  ctx.fillStyle='#2e8b3d';ctx.fillRect(barX+targetStart,barY,targetW,22);
  ctx.fillStyle='#ffd54f';ctx.fillRect(barX+marker-3,barY-4,6,30);

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('stage_'+stage,stage.toUpperCase()),W/2,70);
  ctx.font='14px Arial';ctx.fillText(I18N.t('lives_level_label','Lives: {l}  Level: {v}').replace('{l}','❤️'.repeat(Math.max(0,lives))).replace('{v}',level),W/2,30);

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashGood?'#7ec850':'#e05050';
    ctx.font='bold 22px Arial';
    ctx.fillText(flashMsg,W/2,110);
    ctx.globalAlpha=1;
  }

  if(score>hi){hi=score;localStorage.setItem('hi_winecorkbottling',String(hi));}
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
