<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;touch-action:none;background:#1a1a2e}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:1rem;padding:6px 10px;max-width:480px;margin:0 auto}
#hud span{color:#ffb703}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Racquetball</div>
  <div class="game-frame" style="padding:10px">
    <div id="hud"><div>You: <span id="pVal">0</span></div><div>Game <span id="gVal">1</span></div><div>CPU: <span id="cVal">0</span></div></div>
    <canvas id="c" width="480" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move with <b>Arrow keys/WASD</b> or drag. <b>Click/Tap</b> to swing when the ball is in reach. This court is fully enclosed — the ball caroms unpredictably off all four walls <b>and the ceiling</b>, so anticipate the angles! First to <b>11</b> points wins the game.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,MID=H/2;
const BALL_R=8,REACH=80,TARGET=11;
const KEY='racquetball_best';
let best=parseInt(localStorage.getItem(KEY)||'0',10);

let pScore=0,cScore=0,gameNum=1,level=1,state='idle';
let player={x:W/2,y:H-80};
let ai={x:W/2,y:80};
let ball={x:W/2,y:MID,vx:4,vy:5};
let rallyHits=0,bounceCount=0;
let keys={};
let pointer={active:false,x:player.x,y:player.y};
let swingFlashP=0,swingFlashA=0;
let lastTime=null;

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function serve(dir){
  ball={x:W/2+(Math.random()-0.5)*120,y:MID,vx:(Math.random()-0.5)*4,vy:4.2*dir};
  rallyHits=0;bounceCount=0;
}
function startMatch(){
  pScore=0;cScore=0;gameNum=1;level=1;state='play';
  player={x:W/2,y:H-80};ai={x:W/2,y:80};
  serve(Math.random()<0.5?1:-1);
}
function nextGame(){
  gameNum++;level++;pScore=0;cScore=0;
  serve(Math.random()<0.5?1:-1);
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='idle')startMatch();
    else if(state==='gamewon'){nextGame();state='play';}
    else if(state==='gamelost')startMatch();
    else swing();
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function getPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
let dragStart=null,dragMoved=false;
function pdown(e){
  e.preventDefault();
  if(state==='idle'){startMatch();return;}
  if(state==='gamewon'){nextGame();state='play';return;}
  if(state==='gamelost'){startMatch();return;}
  const p=getPos(e);
  dragStart=p;dragMoved=false;
  pointer.active=true;pointer.x=p.x;pointer.y=p.y;
}
function pmove(e){
  if(!pointer.active)return;
  e.preventDefault();
  const p=getPos(e);
  if(dragStart&&Math.hypot(p.x-dragStart.x,p.y-dragStart.y)>6)dragMoved=true;
  pointer.x=p.x;pointer.y=p.y;
}
function pup(){
  if(state==='play'&&!dragMoved)swing();
  pointer.active=false;dragStart=null;
}
c.addEventListener('mousedown',pdown);
c.addEventListener('mousemove',pmove);
window.addEventListener('mouseup',pup);
c.addEventListener('touchstart',pdown,{passive:false});
c.addEventListener('touchmove',pmove,{passive:false});
c.addEventListener('touchend',pup);
c.addEventListener('touchcancel',()=>{pointer.active=false;});

function swing(){
  swingFlashP=10;
  const d=Math.hypot(ball.x-player.x,ball.y-player.y);
  if(d<=REACH&&ball.y>MID-40){
    hitBall(player,'player');
  } else {
    SFX.swoosh();
  }
}

function hitBall(paddle,who){
  rallyHits++;
  const speed=Math.min(12,5.5+rallyHits*0.4);
  const aimX=(ball.x-paddle.x)/REACH;
  ball.vx=clamp(aimX*7+(Math.random()-0.5)*2,-8,8);
  ball.vy=(who==='player'?-1:1)*speed;
  bounceCount=0;
  SFX.hit();
}

function endPoint(winner){
  if(winner==='player'){pScore++;SFX.point();} else {cScore++;SFX.tick();}
  if(pScore>=TARGET||cScore>=TARGET){
    if(pScore>cScore){
      SFX.win();
      if(pScore>best){best=pScore;localStorage.setItem(KEY,String(best));}
      state='gamewon';
    } else {
      SFX.lose();
      state='gamelost';
    }
  } else {
    serve(winner==='player'?1:-1);
  }
}

function update(dt){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['ArrowUp']||keys['KeyW'])dy-=1;
  if(keys['ArrowDown']||keys['KeyS'])dy+=1;
  if(dx||dy){
    const len=Math.hypot(dx,dy)||1;
    player.x+=(dx/len)*4.8*dt; player.y+=(dy/len)*4.8*dt;
  } else if(pointer.active){
    player.x+=(pointer.x-player.x)*0.25*dt;
    player.y+=(pointer.y-player.y)*0.25*dt;
  }
  player.x=clamp(player.x,20,W-20);
  player.y=clamp(player.y,MID+15,H-20);

  const aiSpeed=3.1+level*0.4;
  const targetX=ball.y<MID? ball.x : W/2;
  ai.x+=clamp(targetX-ai.x,-aiSpeed*dt,aiSpeed*dt);
  ai.y=clamp(ai.y+clamp((ball.y<MID?75:80)-ai.y,-2.2*dt,2.2*dt),20,MID-15);
  const dAi=Math.hypot(ball.x-ai.x,ball.y-ai.y);
  if(ball.y<MID+40&&ball.vy<0&&dAi<REACH+level*4){
    const missChance=Math.max(0.03,0.26-level*0.03);
    if(Math.random()>missChance){
      swingFlashA=10;
      hitBall(ai,'ai');
    }
  }

  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;

  // left/right walls — unpredictable carom: random small angle jitter on hit
  if(ball.x-BALL_R<10){
    ball.x=10+BALL_R;ball.vx=Math.abs(ball.vx)+Math.random()*1.2;
    ball.vy+=(Math.random()-0.5)*1.6;
    SFX.tick();
  }
  if(ball.x+BALL_R>W-10){
    ball.x=W-10-BALL_R;ball.vx=-(Math.abs(ball.vx)+Math.random()*1.2);
    ball.vy+=(Math.random()-0.5)*1.6;
    SFX.tick();
  }
  // "ceiling" (back wall behind ai) and floor/back wall behind player — always bounce (enclosed court),
  // but each bounce not followed by a return counts toward a fault, just like a real racquetball rally.
  if(ball.y-BALL_R<10){
    ball.y=10+BALL_R;ball.vy=Math.abs(ball.vy)+Math.random()*0.8;
    ball.vx+=(Math.random()-0.5)*1.4;
    bounceCount++;
    SFX.tick();
    if(bounceCount>=2){endPoint('player');return;}
  }
  if(ball.y+BALL_R>H-10){
    ball.y=H-10-BALL_R;ball.vy=-(Math.abs(ball.vy)+Math.random()*0.8);
    ball.vx+=(Math.random()-0.5)*1.4;
    bounceCount++;
    SFX.tick();
    if(bounceCount>=2){endPoint('cpu');return;}
  }
  // clamp speed
  const sp=Math.hypot(ball.vx,ball.vy);
  const maxSp=13;
  if(sp>maxSp){ball.vx=ball.vx/sp*maxSp;ball.vy=ball.vy/sp*maxSp;}

  if(swingFlashP>0)swingFlashP-=dt;
  if(swingFlashA>0)swingFlashA-=dt;
}

function drawCourt(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  // ceiling tint (top wall) to show fully enclosed 4-wall + ceiling court
  const g=ctx.createLinearGradient(0,10,0,60);
  g.addColorStop(0,'rgba(102,192,244,.25)');g.addColorStop(1,'rgba(102,192,244,0)');
  ctx.fillStyle=g;ctx.fillRect(10,10,W-20,50);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=6;
  ctx.strokeRect(3,3,W-6,H-6);
  ctx.setLineDash([10,8]);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(10,MID);ctx.lineTo(W-10,MID);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('rq_ceiling_label','CEILING WALL'),W/2,26);
}
function drawPaddle(p,color,flash){
  ctx.beginPath();ctx.arc(p.x,p.y,flash>0?24:18,0,Math.PI*2);
  ctx.fillStyle=flash>0?'#fff':color;ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
}
function drawBall(){
  ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
  ctx.fillStyle='#ffb703';ctx.fill();
  ctx.strokeStyle='#8a5500';ctx.lineWidth=1.5;ctx.stroke();
}
function drawOverlay(title,sub){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffb703';ctx.font='bold 30px Arial';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-16);
  ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.fillText(sub,W/2,H/2+20);
}
function render(){
  drawCourt();
  drawPaddle(ai,'#e94560',swingFlashA);
  drawPaddle(player,'#66c0f4',swingFlashP);
  drawBall();
  document.getElementById('pVal').textContent=pScore;
  document.getElementById('cVal').textContent=cScore;
  document.getElementById('gVal').textContent=gameNum;

  if(state==='idle'){
    drawOverlay(I18N.t('rq_title','RACQUETBALL'),I18N.t('rq_start_hint','Tap / Space to start'));
  } else if(state==='gamewon'){
    drawOverlay(I18N.t('rq_won','GAME WON!'),I18N.t('rq_next_hint','Tap for tougher CPU next game'));
  } else if(state==='gamelost'){
    drawOverlay(I18N.t('rq_lost','GAME LOST'),I18N.t('rq_final','Best: {b} — Tap to retry').replace('{b}',best));
  }
}
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(state==='play')update(dt);
  render();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
