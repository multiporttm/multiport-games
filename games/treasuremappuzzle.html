<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#c8a86b;cursor:pointer}
#ui{color:#3e2723;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Treasure Map Puzzle</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Maps found: 0 | Torches: 5</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap a map piece to rotate it 90°. Get every piece facing the right way (upright) to complete the map — but each wrong guess when you check burns a torch!</div>
</div>
<script>
const W=360,H=360,COLS=3,ROWS=3,CELL=W/COLS;
let pieces,found,torches,state,mapTime;

function loadBest(){return +(localStorage.getItem('treasuremappuzzle_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('treasuremappuzzle_best',v);}

function init(){found=0;torches=5;state='play';newMap();}
function newMap(){
  pieces=[];
  for(let i=0;i<COLS*ROWS;i++)pieces.push({rot:Math.floor(1+Math.random()*3)});
  mapTime=25+found*2;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  const idx=row*COLS+col;
  if(idx<0||idx>=pieces.length)return;
  pieces[idx].rot=(pieces[idx].rot+1)%4;
  SFX.tick();
  if(pieces.every(p=>p.rot===0)){
    found++;
    SFX.success();
    saveBest(found);
    setTimeout(newMap,700);
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  mapTime-=1/60;
  if(mapTime<=0){
    torches--;
    SFX.fail();
    if(torches<=0){
      state='over';
      SFX.lose();
      saveBest(found);
    }else{
      newMap();
    }
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#c8a86b';ctx.fillRect(0,0,W,H);

  for(let r=0;r<ROWS;r++){
    for(let cl=0;cl<COLS;cl++){
      const idx=r*COLS+cl;
      const p=pieces[idx];
      const x=cl*CELL+CELL/2,y=r*CELL+CELL/2;
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(p.rot*Math.PI/2);
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;
      ctx.strokeRect(-CELL/2+4,-CELL/2+4,CELL-8,CELL-8);
      ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🧭',0,0);
      ctx.restore();
    }
  }

  ctx.fillStyle='rgba(62,39,35,.7)';
  ctx.fillRect(20,20,W-40,10);
  ctx.fillStyle='#ff7043';
  ctx.fillRect(20,20,(W-40)*Math.max(0,mapTime/(25+found*2)),10);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3e2723';ctx.fillRect(80,150,200,60);
    ctx.fillStyle='#ffcc80';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('out_of_torches','OUT OF TORCHES'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('maps_best_label','Maps found: {n} | Best: {b}').replace('{n}',found).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_to_retry','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Maps found: ${found} | Torches: ${torches}`;
}

init();draw();
</script></body></html>
