<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0f2027,#00c6a2);display:block;border-radius:8px;touch-action:none}
#score-display{color:#00e6b8;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#matchBtn{display:block;margin:12px auto;padding:16px 40px;font-size:1.3rem;font-weight:900;color:#0f2027;background:#00e6b8;border:none;border-radius:40px;cursor:pointer}
#matchBtn:active{transform:scale(.95)}
#matchBtn.drop{background:#ff477e;color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">DJ Mixing</div>
  <div class="game-frame">
    <div id="score-display">Energy: 0 | Combo: 0 | Best: 0</div>
    <canvas id="c" width="800" height="260"></canvas>
    <button id="matchBtn">BEAT MATCH</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap <b>BEAT MATCH</b> (or press <b>Space</b>) exactly when the beat markers cross the line to keep the crowd's energy rising and build a combo. Watch for <b>DROP THE BASS</b> prompts — nail them for a big score bonus!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=260,LINE_X=650;
let bpmInterval=55,beatTimer=0,elapsed=0,lastTime=null,started=false,gameOver=false;
let energy=50,score=0,combo=0,bestCombo=0,bestScore=parseFloat(localStorage.getItem('djmixing_hi')||'0');
let markers=[]; // {x, isDrop}
let dropChance=0.15;
let feedback='',feedbackTimer=0;
let phase1=0,phase2=0;

function reset(){
  bpmInterval=55;beatTimer=0;elapsed=0;lastTime=null;started=false;gameOver=false;
  energy=50;score=0;combo=0;markers=[];feedback='';feedbackTimer=0;
}

function spawnMarker(){
  const isDrop=Math.random()<dropChance;
  markers.push({x:-20,isDrop,hit:false});
}

function tryHit(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  // find nearest unhit marker close to line
  let best=null,bestDist=999;
  for(const m of markers){
    if(m.hit)continue;
    const d=Math.abs(m.x-LINE_X);
    if(d<bestDist){bestDist=d;best=m;}
  }
  const tol=best&&best.isDrop?35:40;
  if(best&&bestDist<tol){
    best.hit=true;
    combo++;
    if(combo>bestCombo)bestCombo=combo;
    if(best.isDrop){
      const bonus=bestDist<15?150:80;
      score+=bonus;
      energy=Math.min(100,energy+25);
      feedback=I18N.t('bass_dropped_label','BASS DROPPED! +{n}').replace('{n}',bonus);
      SFX.levelup();
    } else {
      const pts=bestDist<15?15:8;
      score+=pts;
      energy=Math.min(100,energy+8);
      feedback=bestDist<15?I18N.t('perfect_label','PERFECT!'):I18N.t('good_label','GOOD!');
      SFX.point();
    }
    feedbackTimer=30;
  } else {
    combo=0;
    energy=Math.max(0,energy-15);
    feedback=I18N.t('miss_label','MISS');
    feedbackTimer=30;
    SFX.error();
    document.getElementById('matchBtn').classList.remove('drop');
  }
}

document.getElementById('matchBtn').addEventListener('click',tryHit);
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();tryHit();} });

function drawWave(baseY,color,phase,amp){
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=0;x<=W;x+=8){
    const y=baseY+Math.sin((x*0.03)+phase)*amp;
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function drawMarker(m){
  ctx.fillStyle=m.isDrop?'#ff477e':'#fff';
  ctx.beginPath();
  ctx.arc(m.x,H/2,m.isDrop?16:11,0,Math.PI*2);
  ctx.fill();
  if(m.isDrop){
    ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('B',m.x,H/2);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0f2027');bg.addColorStop(1,'#00c6a2');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  phase1+=0.05;phase2+=0.08;
  drawWave(90,'rgba(255,255,255,.35)',phase1,20+energy/6);
  drawWave(170,'rgba(255,71,126,.35)',phase2,20+energy/6);

  // hit line
  ctx.strokeStyle='rgba(255,255,255,.7)';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(LINE_X,20);ctx.lineTo(LINE_X,H-20);ctx.stroke();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap BEAT MATCH to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap BEAT MATCH to restart'),W/2,H/2+20);
    document.getElementById('score-display').textContent=I18N.t('dj_score_label','Energy: {e} | Score: {s} | Best: {b}').replace('{e}',Math.round(energy)).replace('{s}',Math.floor(score)).replace('{b}',Math.floor(bestScore));
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  elapsed+=dt;

  const speed=4+elapsed/300;
  beatTimer+=dt;
  const interval=Math.max(35,bpmInterval-elapsed/20);
  if(beatTimer>=interval){beatTimer-=interval;spawnMarker();}

  // upcoming drop button visual cue
  const upcomingDrop=markers.some(m=>!m.hit&&m.isDrop&&m.x>LINE_X-150&&m.x<LINE_X+20);
  document.getElementById('matchBtn').classList.toggle('drop',upcomingDrop);

  markers.forEach(m=>{
    m.x+=speed*dt;
    drawMarker(m);
    if(!m.hit&&m.x>LINE_X+45){
      m.hit=true; // consumed as missed
      combo=0;
      energy=Math.max(0,energy-10);
    }
  });
  markers=markers.filter(m=>m.x<W+30);

  // slow energy decay to keep pressure
  energy=Math.max(0,energy-0.03*dt);

  if(feedbackTimer>0){
    feedbackTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(feedback,W/2,50);
  }

  if(score>bestScore)bestScore=score;

  document.getElementById('score-display').textContent=I18N.t('dj_score_label','Energy: {e} | Score: {s} | Best: {b}').replace('{e}',Math.round(energy)).replace('{s}',Math.floor(score)).replace('{b}',Math.floor(bestScore));

  if(energy<=0){
    gameOver=true;
    if(score>bestScore){bestScore=score;localStorage.setItem('djmixing_hi',bestScore);}
    localStorage.setItem('djmixing_bestcombo',Math.max(bestCombo,parseFloat(localStorage.getItem('djmixing_bestcombo')||'0')));
    SFX.lose();
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
