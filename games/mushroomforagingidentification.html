<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2d1f14;display:block;border-radius:8px;touch-action:none}
#hud{color:#d9c08a;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#f2a541}
#basketBtns{display:flex;justify-content:center;gap:14px;margin:10px 0;flex-wrap:wrap}
#basketBtns button{padding:10px 20px;border:none;border-radius:20px;font-size:1rem;font-weight:800;cursor:pointer}
#pickBtn{background:#5aaa30;color:#fff}
#leaveBtn{background:#a33b3b;color:#fff}
#basketBtns button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Mushroom Foraging Identification</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="scoreDisp">0</b></span><span>Level: <b id="levelDisp">1</b></span><span>Lives: <b id="livesDisp">❤❤❤</b></span><span>Hi: <b id="hiDisp">0</b></span></div>
    <canvas id="c" width="800" height="380"></canvas>
    <div id="basketBtns">
      <button id="pickBtn">🧺 Pick (P / →)</button>
      <button id="leaveBtn">🚫 Leave (L / ←)</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study each mushroom's <b>cap shape</b>, <b>gill pattern</b> and <b>stem</b>. Press <b>P</b> or tap <b>Pick</b> for safe edible species, <b>L</b> or tap <b>Leave</b> for poisonous lookalikes. Three wrong calls and your basket trip ends. Correctly identify more each level!</div>
</div>
<script>
(function(){
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),levelDisp=document.getElementById('levelDisp'),livesDisp=document.getElementById('livesDisp'),hiDisp=document.getElementById('hiDisp');
const pickBtn=document.getElementById('pickBtn'),leaveBtn=document.getElementById('leaveBtn');
const HS_KEY='mushroomforagingidentification_hi';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
hiDisp.textContent=hi;

const SPECIES=[
  {name:'Golden Chanterelle',edible:true,cap:'funnel',color:'#f2a541',gill:'ridged',stem:'tapered',spots:0},
  {name:'Field Mushroom',edible:true,cap:'round',color:'#e8d9b8',gill:'pink',stem:'smooth',spots:0},
  {name:'Morel',edible:true,cap:'honeycomb',color:'#8a6d3b',gill:'none',stem:'hollow',spots:0},
  {name:'Oyster Mushroom',edible:true,cap:'fan',color:'#e3e3d8',gill:'white',stem:'short',spots:0},
  {name:'Death Cap',edible:false,cap:'round',color:'#d8d6a0',gill:'white',stem:'bulbous',spots:0},
  {name:'Fly Agaric',edible:false,cap:'round',color:'#c0392b',gill:'white',stem:'ringed',spots:1},
  {name:'False Morel',edible:false,cap:'brain',color:'#7a4a2b',gill:'none',stem:'twisted',spots:0},
  {name:'Destroying Angel',edible:false,cap:'round',color:'#f0ece0',gill:'white',stem:'bulbous',spots:0},
  {name:'Panther Cap',edible:false,cap:'round',color:'#9b7653',gill:'white',stem:'ringed',spots:1},
  {name:'Jack-O-Lantern',edible:false,cap:'funnel',color:'#e07b1a',gill:'ridged',stem:'tapered',spots:0}
];

let score=0,level=1,lives=3,gameOver=false,round=0,roundsThisLevel=5,current=null,decided=false,feedback='',feedbackTimer=0,feedbackColor='#fff',started=false;

function pickSpecies(){
  const pool = level<=2 ? SPECIES.filter(s=>s.edible || Math.random()<0.5) : SPECIES;
  return pool[Math.floor(Math.random()*pool.length)];
}

function newRound(){
  decided=false;
  current=pickSpecies();
  roundsThisLevel=5+level;
  round++;
}

function reset(){
  score=0;level=1;lives=3;gameOver=false;round=0;started=false;
  newRound();
  updateHud();
}

function updateHud(){
  scoreDisp.textContent=Math.floor(score);
  levelDisp.textContent=level;
  livesDisp.textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
  hiDisp.textContent=hi;
}

function drawCap(s,cx,cy){
  ctx.fillStyle=s.color;
  ctx.strokeStyle='#1a1008';ctx.lineWidth=2;
  ctx.beginPath();
  if(s.cap==='round'){
    ctx.arc(cx,cy,60,Math.PI,0);
  } else if(s.cap==='funnel'){
    ctx.moveTo(cx-55,cy);ctx.quadraticCurveTo(cx,cy-70,cx+55,cy);ctx.quadraticCurveTo(cx,cy-20,cx-55,cy);
  } else if(s.cap==='fan'){
    ctx.moveTo(cx-60,cy+10);ctx.quadraticCurveTo(cx-40,cy-60,cx+10,cy-40);ctx.quadraticCurveTo(cx+60,cy-20,cx+55,cy+10);
  } else if(s.cap==='honeycomb'){
    ctx.ellipse(cx,cy-20,45,55,0,0,Math.PI*2);
  } else if(s.cap==='brain'){
    ctx.ellipse(cx,cy-15,50,40,0,0,Math.PI*2);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  if(s.cap==='honeycomb'){
    ctx.strokeStyle='#4a3620';ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      ctx.beginPath();
      ctx.arc(cx-30+((i%3)*30),cy-40+Math.floor(i/3)*30,10,0,Math.PI*2);
      ctx.stroke();
    }
  }
  if(s.spots){
    ctx.fillStyle='#fff';
    for(let i=0;i<7;i++){
      const ang=i*0.9,r=25+((i*13)%25);
      ctx.beginPath();ctx.arc(cx+Math.cos(ang)*r*0.7,cy-20-Math.sin(ang)*r*0.4,5,0,Math.PI*2);ctx.fill();
    }
  }
}
function drawGill(s,cx,cy){
  if(s.gill==='none')return;
  const colors={pink:'#e8a0b8',white:'#efefe6',ridged:'#d98a2a'};
  ctx.strokeStyle=colors[s.gill]||'#ccc';ctx.lineWidth=2;
  for(let i=-50;i<=50;i+=8){
    ctx.beginPath();ctx.moveTo(cx+i,cy-2);ctx.lineTo(cx+i*0.3,cy+10);ctx.stroke();
  }
}
function drawStem(s,cx,cy){
  ctx.fillStyle='#efe6cf';ctx.strokeStyle='#1a1008';ctx.lineWidth=2;
  let w=18;
  if(s.stem==='bulbous')w=26;
  if(s.stem==='tapered')w=14;
  if(s.stem==='short')return;
  ctx.beginPath();
  ctx.moveTo(cx-w/2,cy+10);ctx.lineTo(cx-w/2+(s.stem==='bulbous'?-6:0),cy+90);
  ctx.lineTo(cx+w/2+(s.stem==='bulbous'?6:0),cy+90);ctx.lineTo(cx+w/2,cy+10);
  ctx.closePath();ctx.fill();ctx.stroke();
  if(s.stem==='ringed'){
    ctx.strokeStyle='#b08a3a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(cx-w/2-4,cy+40);ctx.lineTo(cx+w/2+4,cy+40);ctx.stroke();
  }
  if(s.stem==='hollow'){
    ctx.strokeStyle='#4a3620';
    ctx.beginPath();ctx.moveTo(cx,cy+15);ctx.lineTo(cx,cy+85);ctx.stroke();
  }
}

function drawScene(){
  ctx.clearRect(0,0,800,380);
  const g=ctx.createLinearGradient(0,0,0,380);
  g.addColorStop(0,'#1c2a16');g.addColorStop(1,'#3b2a1a');
  ctx.fillStyle=g;ctx.fillRect(0,0,800,380);
  ctx.fillStyle='#2d2013';ctx.fillRect(0,300,800,80);
  for(let i=0;i<30;i++){
    ctx.fillStyle=i%2===0?'#4a3b22':'#3a2e18';
    ctx.beginPath();ctx.ellipse(40+i*27%780,310+((i*17)%60),10,4,0,0,Math.PI*2);ctx.fill();
  }

  if(!started){
    ctx.fillStyle='#f2a541';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press P/L or tap a button to start'),400,180);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','BASKET TRIP OVER'),400,160);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',Math.floor(score)),400,200);
    ctx.fillText(I18N.t('restart_hint','Tap or press P/L to restart'),400,232);
    return;
  }

  const cx=400,cy=220;
  drawGill(current,cx,cy);
  drawCap(current,cx,cy);
  drawStem(current,cx,cy);

  ctx.fillStyle='#ffe9b0';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('mushroom_name_label','Mushroom: {n}').replace('{n}',current.name),400,60);
  ctx.font='14px Arial';ctx.fillStyle='#c9bfa0';
  ctx.fillText(I18N.t('mushroom_hint_label','Cap: {c}  |  Gills: {g}  |  Stem: {s}')
    .replace('{c}',current.cap).replace('{g}',current.gill).replace('{s}',current.stem),400,85);

  if(feedbackTimer>0){
    ctx.fillStyle=feedbackColor;ctx.font='bold 24px Arial';
    ctx.fillText(feedback,400,340);
  }
}

function judge(pickedIt){
  if(decided||gameOver)return;
  if(!started){started=true;drawScene();return;}
  decided=true;
  const correct=(pickedIt&&current.edible)||(!pickedIt&&!current.edible);
  if(correct){
    score+=10*level;
    feedback=I18N.t('correct_label','✔ Correct identification!');
    feedbackColor='#7ec850';
    SFX.success();
    if(round>=roundsThisLevel){
      level++;
      SFX.levelup();
    }
  } else {
    lives--;
    feedback=current.edible?I18N.t('wrong_left_edible','✘ That was safe to pick!'):I18N.t('wrong_picked_toxic','✘ That was poisonous!');
    feedbackColor='#e74c3c';
    SFX.fail();
  }
  feedbackTimer=60;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(Math.floor(hi)));}
  updateHud();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(Math.floor(hi)));}
    updateHud();
    return;
  }
  setTimeout(()=>{ if(!gameOver){ newRound(); } },700);
}

function handleAction(isPick){
  if(gameOver){reset();return;}
  judge(isPick);
}

document.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='ArrowRight'){e.preventDefault();handleAction(true);}
  else if(e.code==='KeyL'||e.code==='ArrowLeft'){e.preventDefault();handleAction(false);}
});
pickBtn.addEventListener('click',()=>handleAction(true));
leaveBtn.addEventListener('click',()=>handleAction(false));
c.addEventListener('pointerdown',()=>{ if(!started)handleAction(true); });

reset();
function loop(){
  drawScene();
  if(feedbackTimer>0)feedbackTimer--;
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
