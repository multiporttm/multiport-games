<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4fc3f7}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Kite Runner Sky</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Ribbons: 0 | Time: 30s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad) to steer your kite through the sky. Collect 🎀 ribbons for points and dodge the 🐦 birds — colliding with one costs you ribbons!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let kite,ribbons,birds,collected,timeLeft,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('kiterunner_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('kiterunner_best',v);}

function init(){
  kite={x:W/2,y:H/2};
  ribbons=[];birds=[];collected=0;timeLeft=30;state='play';
  for(let i=0;i<6;i++)spawnRibbon();
  for(let i=0;i<3;i++)spawnBird();
}
function spawnRibbon(){ribbons.push({x:rand(20,W-20),y:rand(20,H-20)});}
function spawnBird(){birds.push({x:rand(20,W-20),y:rand(20,H-20),vx:rand(-1,1),vy:rand(-1,1),cooldown:0});}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.3;
  if(keys['arrowup']||keys['w'])kite.y-=spd;
  if(keys['arrowdown']||keys['s'])kite.y+=spd;
  if(keys['arrowleft']||keys['a'])kite.x-=spd;
  if(keys['arrowright']||keys['d'])kite.x+=spd;
  kite.x=Math.max(SIZE/2,Math.min(W-SIZE/2,kite.x));
  kite.y=Math.max(SIZE/2,Math.min(H-SIZE/2,kite.y));

  birds.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<20||b.x>W-20)b.vx*=-1;
    if(b.y<20||b.y>H-20)b.vy*=-1;
    if(b.cooldown>0)b.cooldown--;
  });

  ribbons=ribbons.filter(r=>{
    if(dist(r,kite)<20){collected++;SFX.coin();spawnRibbon();return false;}
    return true;
  });

  birds.forEach(b=>{
    if(dist(b,kite)<18&&b.cooldown===0){
      collected=Math.max(0,collected-2);
      b.cooldown=45;
      SFX.hurt();
    }
  });

  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(collected);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#4fc3f7';ctx.fillRect(0,0,W,H);

  ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ribbons.forEach(r=>ctx.fillText('🎀',r.x,r.y));

  ctx.font='20px Arial';
  birds.forEach(b=>ctx.fillText('🐦',b.x,b.y));

  ctx.font='24px Arial';
  ctx.fillText('🪁',kite.x,kite.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('times_up_title',"TIME'S UP!"),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('ribbons_best','Ribbons: {n} | Best: {b}').replace('{n}',collected).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap a D-pad button to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('ribbons_time','Ribbons: {n} | Time: {t}s').replace('{n}',collected).replace('{t}',Math.ceil(timeLeft));
}

init();draw();
</script></body></html>
