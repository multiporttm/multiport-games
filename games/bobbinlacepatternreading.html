<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#fbf6ea;display:block;border-radius:8px;touch-action:none;cursor:pointer;margin:0 auto}
#hud{color:#5a3e2b;background:#fffaf0;border-radius:10px;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;max-width:600px;margin:0 auto 8px}
#timerWrap{max-width:600px;margin:0 auto 8px;background:#e7dbc0;border-radius:10px;padding:4px}
#timerBar{height:12px;border-radius:7px;background:linear-gradient(90deg,#d66036,#f0a35a);width:100%;transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bobbin Lace Pattern Reading</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud">
      <span id="roundDisp">Chart: 1</span>
      <span id="scoreDisp">Score: 0</span>
      <span id="hiDisp">Hi: 0</span>
      <span id="livesDisp">Lives: ●●●</span>
    </div>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <canvas id="c" width="600" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the <b>pricking chart</b>: a glowing symbol marks the <b>next pin position</b>. Click or tap that exact grid cell — use <b>Arrow Keys + Enter</b> on keyboard — before the timer runs out. Charts grow larger and trickier each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='bobbinlacepatternreading_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let round=1,score=0,lives=3,gameOver=false,started=false;
let cols,rows,margin=50,cell=0,targetR,targetC,selR=0,selC=0;
let timeLeft=0,timeMax=0,flashTimer=0,flashOk=null,shakeTimer=0;
let distractors=[];

function setupRound(){
  cols=Math.min(4+Math.floor((round-1)/1),10);
  rows=Math.min(4+Math.floor((round-1)/2),8);
  cell=Math.min((600-margin*2)/(cols-1),(420-margin*2)/(rows-1));
  targetR=Math.floor(Math.random()*rows);
  targetC=Math.floor(Math.random()*cols);
  distractors=[];
  const nd=Math.min(1+Math.floor(round/2),5);
  while(distractors.length<nd){
    const r=Math.floor(Math.random()*rows),cc=Math.floor(Math.random()*cols);
    if((r===targetR&&cc===targetC))continue;
    if(distractors.some(d=>d[0]===r&&d[1]===cc))continue;
    distractors.push([r,cc]);
  }
  timeMax=Math.max(2.2,5.5-round*0.22);
  timeLeft=timeMax;
  selR=0;selC=0;
}
function reset(){round=1;score=0;lives=3;gameOver=false;started=false;setupRound();}
reset();

function cellXY(r,col){return [margin+col*cell, margin+r*cell];}

function onMiss(){
  lives--;flashTimer=16;flashOk=false;shakeTimer=14;
  SFX.error();
  if(lives<=0){
    gameOver=true;
    if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    SFX.lose();
  } else {
    setTimeout(()=>setupRound(),500);
  }
}
function onHit(){
  score+=Math.max(5,Math.round(timeLeft*8));
  flashTimer=16;flashOk=true;
  SFX.point();
  if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
  round++;
  setTimeout(()=>setupRound(),400);
}

function selectCell(r,col){
  if(gameOver||!started)return;
  if(r===targetR&&col===targetC)onHit();
  else onMiss();
}

function clickAt(x,y){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  let best=null,bd=1e9;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const [px,py]=cellXY(r,col);
    const d=(px-x)*(px-x)+(py-y)*(py-y);
    if(d<bd){bd=d;best=[r,col];}
  }
  if(best&&bd<(cell*cell*0.4))selectCell(best[0],best[1]);
}

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(c.width/rect.width);
  const y=(e.clientY-rect.top)*(c.height/rect.height);
  clickAt(x,y);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const rect=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=(t.clientX-rect.left)*(c.width/rect.width);
  const y=(t.clientY-rect.top)*(c.height/rect.height);
  clickAt(x,y);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))e.preventDefault();
  if(gameOver){if(e.key==='Enter'||e.key===' ')reset();return;}
  if(!started){if(e.key==='Enter'||e.key===' ')started=true;return;}
  if(e.key==='ArrowUp')selR=Math.max(0,selR-1);
  else if(e.key==='ArrowDown')selR=Math.min(rows-1,selR+1);
  else if(e.key==='ArrowLeft')selC=Math.max(0,selC-1);
  else if(e.key==='ArrowRight')selC=Math.min(cols-1,selC+1);
  else if(e.key==='Enter'||e.key===' ')selectCell(selR,selC);
});

let lastTime=null;
function draw(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(started&&!gameOver){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;onMiss();}
  }

  let ox=0;
  if(shakeTimer>0){ox=(Math.random()-0.5)*8;shakeTimer--;}
  ctx.clearRect(0,0,600,420);
  const grad=ctx.createLinearGradient(0,0,0,420);
  grad.addColorStop(0,'#fdf8ec');grad.addColorStop(1,'#efe3c5');
  ctx.fillStyle=grad;ctx.fillRect(0,0,600,420);

  ctx.save();ctx.translate(ox,0);

  // grid dots
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    const [x,y]=cellXY(r,col);
    ctx.beginPath();ctx.arc(x,y,3,0,7);
    ctx.fillStyle='#c9b48a';ctx.fill();
  }
  // distractor symbols
  distractors.forEach(([r,col])=>{
    const [x,y]=cellXY(r,col);
    ctx.beginPath();ctx.arc(x,y,7,0,7);
    ctx.strokeStyle='#9c8558';ctx.lineWidth=2;ctx.stroke();
  });
  // target symbol glowing star
  if(started&&!gameOver){
    const [x,y]=cellXY(targetR,targetC);
    const t=now/250;
    const glow=0.55+0.45*Math.sin(t);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(t*0.3);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i*2*Math.PI/5)-Math.PI/2;
      const a2=a+Math.PI/5;
      ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);
      ctx.lineTo(Math.cos(a2)*4.5,Math.sin(a2)*4.5);
    }
    ctx.closePath();
    ctx.fillStyle=`rgba(214,96,54,${glow})`;
    ctx.fill();
    ctx.strokeStyle='#8a4a1f';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }
  // selection cursor
  if(started&&!gameOver){
    const [x,y]=cellXY(selR,selC);
    ctx.beginPath();ctx.arc(x,y,13,0,7);
    ctx.strokeStyle='#3b6b9a';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  }

  if(flashTimer>0){
    ctx.fillStyle=flashOk?'rgba(72,160,80,0.2)':'rgba(190,50,40,0.25)';
    ctx.fillRect(0,0,600,420);
    flashTimer--;
  }
  ctx.restore();

  if(!started){
    ctx.fillStyle='rgba(20,15,5,0.55)';ctx.fillRect(0,0,600,420);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Press Enter to Start'),300,210);
  }
  if(gameOver){
    ctx.fillStyle='rgba(20,15,5,0.6)';ctx.fillRect(0,0,600,420);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),300,190);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Press Enter to restart'),300,224);
  }

  document.getElementById('roundDisp').textContent=I18N.t('chart_label','Chart: {r}').replace('{r}',round);
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('hiDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives)));
  document.getElementById('timerBar').style.width=(started&&!gameOver?Math.max(0,timeLeft/timeMax*100):100)+'%';

  requestAnimationFrame(draw);
}
draw();
</script></body></html>
