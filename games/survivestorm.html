<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#263a4d}
#ui{color:#81d4fa;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Survive the Storm</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Disaster: Rockfall | Survived: 0s | Best: 0s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to move. A new disaster starts every 15 seconds — rockfall, lightning strikes, then rising water. Survive as long as you can!</div>
</div>
<script>
const W=360,H=360,SIZE=20;
const DISASTERS=['Rockfall','Lightning','Rising Water'];
let player,hazards,keys={},survived,state,best=+(localStorage.getItem('survivestorm_best')||0),spawnTimer,disasterIdx,disasterTimer,waterLevel;

function loadBest(){return +(localStorage.getItem('survivestorm_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('survivestorm_best',v);}

function init(){
  player={x:W/2,y:H/2};
  hazards=[];
  survived=0;state='play';spawnTimer=0;disasterIdx=0;disasterTimer=0;waterLevel=H;best=loadBest();
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over')init();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.8;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  survived+=1/60;
  disasterTimer+=1/60;
  if(disasterTimer>15){disasterTimer=0;disasterIdx=(disasterIdx+1)%DISASTERS.length;hazards=[];if(disasterIdx===2)waterLevel=H;SFX.levelup();}

  const disaster=DISASTERS[disasterIdx];
  spawnTimer--;
  if(spawnTimer<=0){
    if(disaster==='Rockfall'){hazards.push({x:Math.random()*W,y:-20,vy:3+Math.random()*2,r:14});spawnTimer=20;}
    else if(disaster==='Lightning'){const x=Math.random()*W;hazards.push({x,y:0,warnT:40,r:16});spawnTimer=45;}
    else {spawnTimer=999;}
  }

  if(disaster==='Rockfall'){
    hazards.forEach(h=>h.y+=h.vy);
    hazards=hazards.filter(h=>h.y<H+30);
    hazards.forEach(h=>{if(dist(player,h)<h.r)die();});
  } else if(disaster==='Lightning'){
    hazards.forEach(h=>{if(h.warnT>0)h.warnT--;});
    hazards.forEach(h=>{
      if(h.warnT===0&&!h.struck){h.struck=true;h.strikeFrame=8;}
      if(h.struck&&h.strikeFrame>0){h.strikeFrame--;if(Math.abs(player.x-h.x)<h.r)die();}
    });
    hazards=hazards.filter(h=>!h.struck||h.strikeFrame>-10);
  } else {
    waterLevel-=0.15;
    if(player.y>waterLevel)die();
  }

  updateUI();
}

function die(){
  state='over';
  SFX.lose();
  saveBest(Math.floor(survived));best=loadBest();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#263a4d';ctx.fillRect(0,0,W,H);
  const disaster=DISASTERS[disasterIdx];

  if(disaster==='Rockfall'){
    hazards.forEach(h=>{ctx.fillStyle='#8d6e63';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();});
  } else if(disaster==='Lightning'){
    hazards.forEach(h=>{
      if(h.warnT>0){
        ctx.fillStyle='rgba(255,235,59,.25)';
        ctx.fillRect(h.x-h.r,0,h.r*2,H);
      } else if(h.struck&&h.strikeFrame>0){
        ctx.fillStyle='#ffeb3b';
        ctx.fillRect(h.x-h.r,0,h.r*2,H);
      }
    });
  } else {
    ctx.fillStyle='rgba(33,150,243,.4)';
    ctx.fillRect(0,waterLevel,W,H-waterLevel);
  }

  ctx.fillStyle='#81d4fa';
  ctx.beginPath();ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='13px Arial';ctx.textAlign='center';
  ctx.fillText(disaster.toUpperCase(),W/2,20);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#81d4fa';ctx.font='bold 24px Arial';
    ctx.fillText('CAUGHT IN THE STORM!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Survived: ${Math.floor(survived)}s`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Disaster: ${DISASTERS[disasterIdx]} | Survived: ${Math.floor(survived)}s | Best: ${best}s`;
}

init();draw();
</script></body></html>
