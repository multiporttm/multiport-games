<link rel="stylesheet" href="../css/style.css?v=8">

<style>
body{background:#08080f}
#c{background:#1a2420;display:block;border-radius:8px;touch-action:none}
#score-display{color:#9fd8b0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff8a8a;text-align:center;font-size:1rem;margin-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Macrame Curtain Weaving</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the beat pulse and press <b>Space</b> (or tap) exactly on the beat to tie each knot across the row, keeping spacing and tightness consistent all the way across. Rows get wider and the tempo climbs each level.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display'),livesEl=document.getElementById('lives-display');
const W=800,H=420;
const rowAreaTop=90,rowAreaBottom=360;

let state='start';
let score=0,hi=parseInt(localStorage.getItem('macramecurtainweaving_hi')||'0',10);
let lives=3,level=1;
const WIN_LEVEL=7;

let knotsPerRow=6,rowsNeeded=3,rowsDone=0;
let bpmInterval=70; // frames per beat (approx)
let beatTimer=0,beatPhase=0; // 0..1 within beat
let tightness=[]; // per-knot deviation for current row (0=perfect)
let currentRow=[]; // bool tied
let currentKnotIdx=0;
let rows=[]; // array of row knot-tightness arrays, for drawing finished rows
let flashMsg='',flashTimer=0,flashColor='#fff';
let shakeT=0;
let windowTol=0.22; // fraction of beat considered "hit window" half-width

function setupLevel(){
  knotsPerRow=Math.min(14,5+level);
  rowsNeeded=Math.min(6,3+Math.floor(level/2));
  bpmInterval=Math.max(30,62-level*3);
  windowTol=Math.max(0.1,0.22-level*0.012);
  rowsDone=0;
  rows=[];
  startRow();
  state='play';
}

function startRow(){
  currentRow=new Array(knotsPerRow).fill(false);
  tightness=new Array(knotsPerRow).fill(null);
  currentKnotIdx=0;
  beatTimer=0;
}

function startGame(){
  score=0;lives=3;level=1;
  setupLevel();
}

function flashText(t,color){flashMsg=t;flashColor=color;flashTimer=40;}

function attemptKnot(){
  if(state!=='play')return;
  if(currentKnotIdx>=knotsPerRow)return;
  // beatPhase 0..1, perfect at 0 (or 1). distance to nearest beat boundary
  const dist=Math.min(beatPhase,1-beatPhase);
  if(dist<=windowTol){
    const quality=1-(dist/windowTol); // 1=perfect
    tightness[currentKnotIdx]=quality;
    currentRow[currentKnotIdx]=true;
    currentKnotIdx++;
    const gain=Math.round(8+quality*20+level);
    score+=gain;
    if(score>hi){hi=score;localStorage.setItem('macramecurtainweaving_hi',String(hi));}
    if(quality>0.75){SFX.point();flashText(I18N.t('tight','Tight & even!'),'#ffd54f');}
    else {SFX.click();flashText(I18N.t('ok','OK'),'#4fc3f7');}
    if(currentKnotIdx>=knotsPerRow){
      finishRow();
    }
  } else {
    mistake();
  }
}

function finishRow(){
  rows.push(tightness.slice());
  rowsDone++;
  SFX.success();
  if(rowsDone>=rowsNeeded){
    state='levelclear';
    SFX.levelup();
    setTimeout(()=>{
      if(level>=WIN_LEVEL){state='win';SFX.win();}
      else{level++;setupLevel();}
    },1000);
  } else {
    startRow();
  }
}

function mistake(){
  lives--;
  SFX.hurt();
  shakeT=14;
  flashText(I18N.t('loose','Off-beat! Loose knot.'),'#e94560');
  if(lives<=0){
    state='gameover';
    SFX.lose();
  }
}

document.addEventListener('keydown',e=>{
  if(state==='start'||state==='gameover'||state==='win'){
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();}
    return;
  }
  if(e.code==='Space'){e.preventDefault();attemptKnot();}
});

c.addEventListener('pointerdown',()=>{
  if(state==='start'||state==='gameover'||state==='win'){startGame();return;}
  attemptKnot();
});

function knotX(i,n){
  const margin=60;
  if(n<=1)return W/2;
  return margin+i*((W-2*margin)/(n-1));
}

function drawMetronome(){
  const cx=W/2,cy=50,r=26;
  ctx.strokeStyle='#355';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  const dist=Math.min(beatPhase,1-beatPhase);
  const inWindow=dist<=windowTol;
  ctx.fillStyle=inWindow?'#ffd54f':'#2d5a27';
  const ang=beatPhase*Math.PI*2-Math.PI/2;
  ctx.beginPath();ctx.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9fd8b0';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('cw_beat_hint','Tap on the beat'),cx,cy+48);
}

function drawRow(rowTightness,y,finished){
  const n=rowTightness.length;
  for(let i=0;i<n;i++){
    const x=knotX(i,n);
    const q=rowTightness[i];
    if(q==null){
      ctx.strokeStyle='#355';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.stroke();
    } else {
      const col=q>0.75?'#7ec850':(q>0.4?'#ffd54f':'#e94560');
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(x,y,9+q*3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.stroke();
    }
    if(i===currentKnotIdx&&!finished){
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.stroke();
    }
  }
}

function update(dt){
  if(shakeT>0)shakeT-=dt;
  if(flashTimer>0)flashTimer-=dt;
  if(state!=='play')return;
  beatTimer+=dt;
  beatPhase=(beatTimer%bpmInterval)/bpmInterval;
}

function draw(){
  ctx.save();
  const sx=shakeT>0?(Math.random()-0.5)*shakeT*0.6:0;
  ctx.translate(sx,0);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#223129');bg.addColorStop(1,'#1a2420');
  ctx.fillStyle=bg;ctx.fillRect(-20,0,W+40,H);

  // curtain rod
  ctx.fillStyle='#8a6a3a';ctx.fillRect(40,78,W-80,8);

  drawMetronome();

  const totalRows=rowsNeeded;
  const startY=rowAreaTop+20;
  const rowGap=Math.min(60,(rowAreaBottom-startY)/Math.max(1,totalRows));
  rows.forEach((r,i)=>drawRow(r,startY+i*rowGap,true));
  if(state==='play')drawRow(currentRow.map((v,i)=>v?tightness[i]:null),startY+rows.length*rowGap,false);

  ctx.textAlign='center';
  if(flashTimer>0){
    ctx.globalAlpha=Math.min(1,flashTimer/40);
    ctx.fillStyle=flashColor;ctx.font='bold 18px Arial';
    ctx.fillText(flashMsg,W/2,rowAreaBottom+30);
    ctx.globalAlpha=1;
  }

  if(state==='start'){
    ctx.fillStyle='#9fd8b0';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('cw_title','Macrame Curtain Weaving'),W/2,200);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or press Space to start'),W/2,236);
  } else if(state==='play'){
    ctx.fillStyle='#fff9';ctx.font='14px Arial';
    ctx.fillText(I18N.t('cw_row_label','Row {d}/{n}').replace('{d}',rowsDone+1).replace('{n}',rowsNeeded),W/2,380);
  } else if(state==='levelclear'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('cw_level_clear','Panel woven evenly! Level {l} complete').replace('{l}',level),W/2,200);
  } else if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,200);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,234);
  } else if(state==='win'){
    ctx.fillStyle='#7ec850';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('cw_win','The whole curtain panel is woven!'),W/2,200);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,234);
  }
  ctx.restore();
}

let last=null;
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/16.6667,3);
  last=ts;
  update(dt);
  draw();
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
  requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);
</script></body></html>
