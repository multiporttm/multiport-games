<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#panel{background:linear-gradient(135deg,#5d4037,#a1887f);border-radius:14px;padding:18px;text-align:center;max-width:640px;margin:0 auto}
#stats{color:#fff;font-weight:800;font-size:1.05rem;margin-bottom:6px;display:flex;justify-content:space-between;max-width:520px;margin:0 auto 8px}
#desc{background:rgba(0,0,0,.3);color:#ffe082;font-weight:700;border-radius:10px;padding:12px 16px;margin:10px auto;max-width:520px;min-height:2.2em}
#timerBar{height:10px;background:rgba(0,0,0,.35);border-radius:6px;max-width:520px;margin:0 auto 12px;overflow:hidden}
#timerFill{height:100%;background:#ffca28;width:100%;transition:width .1s linear}
#rocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:14px;max-width:560px;margin:0 auto}
.rock{background:#2d2320;border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .1s;border:3px solid transparent}
.rock:hover{transform:scale(1.05)}
.rock canvas{border-radius:50%}
.rock.correct{border-color:#4caf50;background:#1b3a1e}
.rock.wrong{border-color:#e53935;background:#3a1b1b}
#msg{color:#fff;font-weight:800;min-height:1.6em;margin-top:10px}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;color:#fff;text-align:center;gap:8px}
.game-frame{position:relative}
button.playbtn{padding:10px 24px;background:#ffca28;border:none;border-radius:20px;color:#2d2320;font-weight:800;cursor:pointer;font-size:1rem;margin-top:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rock Collecting</div>
  <div class="game-frame" style="padding:16px">
    <div id="panel">
      <div id="stats"><span id="identifiedLbl">Identified: 0</span><span id="livesLbl">Lives: 3</span></div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="desc">Loading…</div>
      <div id="rocks"></div>
      <div id="msg"></div>
    </div>
    <div id="overlay" hidden>
      <div id="overTitle" style="font-size:1.6rem;font-weight:900"></div>
      <div id="overSub"></div>
      <button class="playbtn" id="playBtn">Play Again</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the target rock's <b>description</b> and click the sample that matches it before the timer runs out. A wrong click or timeout costs a <b>life</b> — three strikes and it's over.</div>
</div>
<script>
const identifiedLbl=document.getElementById('identifiedLbl'),livesLbl=document.getElementById('livesLbl');
const descEl=document.getElementById('desc'),rocksEl=document.getElementById('rocks'),msgEl=document.getElementById('msg');
const timerFill=document.getElementById('timerFill');
const overlay=document.getElementById('overlay'),overTitle=document.getElementById('overTitle'),overSub=document.getElementById('overSub');
let identified=0,lives=3,hi=parseInt(localStorage.getItem('rockcollecting_hi')||'0',10);
let roundTimer=null,timeLeft=0,timeTotal=0,locked=false;

const ROCKS=[
  {name:'Granite',color:'#b0a89c',speckle:'#6d6560',desc:'A light gray rock with dark speckles and a coarse, sparkly texture.'},
  {name:'Obsidian',color:'#161616',speckle:'#3a3a3a',desc:'A glassy, jet-black rock with smooth, sharp-edged surfaces.'},
  {name:'Rose Quartz',color:'#e6a3b0',speckle:'#f2c9d2',desc:'A translucent pink crystal with a soft, milky glow.'},
  {name:'Basalt',color:'#3d3d3d',speckle:'#565656',desc:'A dense, dark gray rock with tiny air-bubble pits.'},
  {name:'Amethyst',color:'#7e57c2',speckle:'#9575cd',desc:'A deep purple crystal with jagged, pointed facets.'},
  {name:'Sandstone',color:'#d9b872',speckle:'#c9a55c',desc:'A gritty tan rock made of tightly packed sand grains.'},
  {name:'Malachite',color:'#2e7d4f',speckle:'#4caf7d',desc:'A banded green stone with swirling light and dark stripes.'},
  {name:'Pyrite',color:'#d4af37',speckle:'#f0d060',desc:'A metallic gold rock with sharp cubic crystal faces (fool\'s gold).'},
  {name:'Slate',color:'#4a5a63',speckle:'#5f7078',desc:'A flat gray rock that splits into smooth, thin layers.'},
  {name:'Turquoise',color:'#2fb5a3',speckle:'#59d6c4',desc:'A bright blue-green stone with fine dark veining.'},
  {name:'Limestone',color:'#e8e0c9',speckle:'#d6cba9',desc:'A pale, chalky rock with tiny fossil fragments.'},
  {name:'Hematite',color:'#5a4a48',speckle:'#7a6260',desc:'A heavy, dull reddish-brown rock with a metallic sheen.'}
];

function drawRock(canvas,rock,seed){
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=rock.color;
  ctx.beginPath();
  const cx=w/2,cy=h/2,r=w/2-4;
  const pts=9;
  let rnd=seed;
  function rand(){rnd=(rnd*9301+49297)%233280;return rnd/233280;}
  for(let i=0;i<pts;i++){
    const ang=(i/pts)*Math.PI*2;
    const rad=r*(0.75+rand()*0.3);
    const x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle=rock.speckle;
  for(let i=0;i<14;i++){
    const x=cx+(rand()-0.5)*r*1.4,y=cy+(rand()-0.5)*r*1.4;
    if(Math.hypot(x-cx,y-cy)<r*0.85){
      ctx.beginPath();ctx.arc(x,y,1.5+rand()*2.5,0,Math.PI*2);ctx.fill();
    }
  }
}

function pickRound(){
  const numDecoys=Math.min(2+Math.floor(identified/3),7);
  const pool=ROCKS.slice();
  const targetIdx=Math.floor(Math.random()*pool.length);
  const target=pool.splice(targetIdx,1)[0];
  const decoyCount=Math.min(numDecoys,pool.length);
  const decoys=[];
  for(let i=0;i<decoyCount;i++){
    const idx=Math.floor(Math.random()*pool.length);
    decoys.push(pool.splice(idx,1)[0]);
  }
  const options=[target,...decoys];
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  return {target,options};
}

let current=null;

function startRound(){
  locked=false;
  msgEl.textContent='';
  current=pickRound();
  descEl.textContent=current.target.desc;
  rocksEl.innerHTML='';
  current.options.forEach((rock,i)=>{
    const div=document.createElement('div');
    div.className='rock';
    const cnv=document.createElement('canvas');
    cnv.width=76;cnv.height=76;
    drawRock(cnv,rock,(i+1)*1234+identified*7+Math.floor(Math.random()*999));
    div.appendChild(cnv);
    const label=document.createElement('div');
    label.style.color='#fff';label.style.fontSize='.7rem';label.style.marginTop='4px';
    label.textContent='?';
    div.appendChild(label);
    div.onclick=()=>chooseRock(rock,div);
    rocksEl.appendChild(div);
  });
  timeTotal=Math.max(4000,7000-identified*150);
  timeLeft=timeTotal;
  clearInterval(roundTimer);
  roundTimer=setInterval(tick,50);
}

function tick(){
  if(locked)return;
  timeLeft-=50;
  timerFill.style.width=Math.max(0,(timeLeft/timeTotal*100))+'%';
  if(timeLeft<=0){
    clearInterval(roundTimer);
    loseLife(I18N.t('rock_timeout','Time\'s up!'));
  }
}

function chooseRock(rock,el){
  if(locked)return;
  locked=true;
  clearInterval(roundTimer);
  if(rock.name===current.target.name){
    el.classList.add('correct');
    SFX.success();
    identified++;
    if(identified>hi){hi=identified;localStorage.setItem('rockcollecting_hi',hi);}
    msgEl.textContent=I18N.t('rock_correct','Correct! That\'s {n}.').replace('{n}',rock.name);
    identifiedLbl.textContent=I18N.t('rock_identified_label','Identified: {n}').replace('{n}',identified);
    setTimeout(startRound,700);
  }else{
    el.classList.add('wrong');
    loseLife(I18N.t('rock_wrong','Wrong rock! That was {n}.').replace('{n}',rock.name));
  }
}

function loseLife(reason){
  SFX.error();
  lives--;
  livesLbl.textContent=I18N.t('rock_lives_label','Lives: {n}').replace('{n}',Math.max(0,lives));
  msgEl.textContent=reason;
  if(lives<=0){
    setTimeout(gameOver,600);
  }else{
    setTimeout(startRound,900);
  }
}

function gameOver(){
  clearInterval(roundTimer);
  overlay.hidden=false;
  overTitle.textContent=I18N.t('game_over_title','GAME OVER');
  overSub.innerHTML=I18N.t('rock_final_score','Rocks identified: {n} | Best: {h}').replace('{n}',identified).replace('{h}',hi);
  SFX.lose();
}

document.getElementById('playBtn').onclick=()=>{
  identified=0;lives=3;
  identifiedLbl.textContent=I18N.t('rock_identified_label','Identified: {n}').replace('{n}',0);
  livesLbl.textContent=I18N.t('rock_lives_label','Lives: {n}').replace('{n}',3);
  overlay.hidden=true;
  startRound();
};

startRound();
</script></body></html>
