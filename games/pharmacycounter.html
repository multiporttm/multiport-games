<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#05050f}
#wrap{background:#eef3f8;border-radius:14px;padding:14px;max-width:720px;margin:0 auto}
#hud{display:flex;justify-content:center;gap:18px;color:#1a2233;font-size:1.02rem;font-weight:800;padding:4px 0 10px;flex-wrap:wrap}
#hud span b{color:#1565c0}
#customers{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;min-height:132px}
.customer{flex:0 0 auto;width:150px;background:#fff;border-radius:10px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.12);border:3px solid transparent;cursor:pointer}
.customer.active{border-color:#1565c0}
.customer .face{font-size:1.8rem;text-align:center}
.customer .slip{background:#fffde7;border-radius:6px;padding:6px;font-size:.72rem;margin-top:4px;color:#333;min-height:56px}
.customer .patience{height:6px;background:#ddd;border-radius:3px;margin-top:6px;overflow:hidden}
.customer .patience-fill{height:100%;background:#4caf50;width:100%}
.customer .bag-btn{width:100%;margin-top:6px;padding:5px;border:none;border-radius:6px;background:#1565c0;color:#fff;font-weight:700;font-size:.75rem;cursor:pointer}
.customer .bag-btn:disabled{background:#aaa;cursor:not-allowed}
.slip-item{display:flex;justify-content:space-between}
.slip-item.got{color:#2e7d32;text-decoration:line-through}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;background:#d7ccc8;border-radius:10px;padding:12px}
.bottle{background:#fff;border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;border:2px solid #bbb;user-select:none;transition:transform .08s}
.bottle:active{transform:scale(.94)}
.bottle .icon{font-size:1.6rem}
.bottle .name{font-size:.62rem;font-weight:700;color:#333;margin-top:2px;line-height:1.1}
#msg{text-align:center;min-height:1.4em;color:#c62828;font-weight:800;margin-top:6px}
@media(max-width:480px){ .customer{width:120px} }
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pharmacy Counter</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <span id="score-display">Score: <b>0</b></span>
        <span id="hi-display">Best: <b>0</b></span>
        <span id="round-display">Round: <b>1</b></span>
      </div>
      <div id="customers"></div>
      <div id="shelf"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read each customer's prescription slip, click the matching medication bottles on the shelf in order, then click the bag button to fulfill the order before their patience runs out. Wrong bottles cost points, and more customers queue up as you go!</div>
</div>
<script>
const BEST_KEY='pharmacycounter_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);

const MEDS=[
  {id:'aspirin',icon:'💊',name:'Aspirin'},
  {id:'coughsyrup',icon:'🧴',name:'Cough Syrup'},
  {id:'vitamins',icon:'🟠',name:'Vitamins'},
  {id:'antibiotic',icon:'🔵',name:'Antibiotic'},
  {id:'eyedrops',icon:'💧',name:'Eye Drops'},
  {id:'bandages',icon:'🩹',name:'Bandages'},
  {id:'inhaler',icon:'🫧',name:'Inhaler'},
  {id:'allergy',icon:'🟢',name:'Allergy Pills'},
  {id:'painrelief',icon:'⚪',name:'Pain Relief'},
  {id:'thermometer',icon:'🌡️',name:'Thermometer'}
];
const FACES=['🧑','👩','👴','👵','🧔','👨','👩‍🦱','🧑‍🦳'];

let score=0,round=1,gameOver=false,customers=[],activeId=null,custIdSeq=0,shelfMeds=[];

function reset(){
  score=0;round=1;gameOver=false;customers=[];activeId=null;
  updateHud();buildShelf();spawnLoop();
}
function updateHud(){
  document.getElementById('score-display').innerHTML=I18N.t('score_label','Score: <b>{s}</b>').replace('{s}',score);
  document.getElementById('hi-display').innerHTML=I18N.t('best_label','Best: <b>{h}</b>').replace('{h}',best);
  document.getElementById('round-display').innerHTML=I18N.t('pc_round','Round: <b>{r}</b>').replace('{r}',round);
}
function setMsg(t){document.getElementById('msg').textContent=t;}

function buildShelf(){
  shelfMeds=MEDS.slice();
  const shelf=document.getElementById('shelf');
  shelf.innerHTML='';
  shelfMeds.forEach(m=>{
    const el=document.createElement('div');
    el.className='bottle';
    el.innerHTML=`<div class="icon">${m.icon}</div><div class="name">${m.name}</div>`;
    el.onclick=()=>pickMed(m);
    shelf.appendChild(el);
  });
}

function randMeds(n){
  const pool=MEDS.slice().sort(()=>Math.random()-0.5);
  return pool.slice(0,n);
}

let spawnTimer=null;
function spawnLoop(){
  clearInterval(spawnTimer);
  maybeSpawn();
  spawnTimer=setInterval(()=>{ if(!gameOver) maybeSpawn(); },2600);
}

function maybeSpawn(){
  const maxCustomers=Math.min(2+Math.floor(round/2),6);
  if(customers.length>=maxCustomers)return;
  const itemCount=2+Math.floor(Math.random()*3); // 2-4
  const needed=randMeds(itemCount);
  const patienceMs=13000+Math.random()*3000-round*250;
  customers.push({
    id:custIdSeq++,
    face:FACES[Math.floor(Math.random()*FACES.length)],
    needed,
    collected:[],
    wrongCount:0,
    patience:Math.max(6000,patienceMs),
    maxPatience:Math.max(6000,patienceMs),
    spawnedAt:performance.now()
  });
  if(activeId===null)activeId=customers[customers.length-1].id;
  renderCustomers();
}

function pickMed(med){
  if(gameOver)return;
  const cust=customers.find(c=>c.id===activeId);
  if(!cust){setMsg(I18N.t('pc_pick_customer','Select a customer first!'));return;}
  const nextNeeded=cust.needed.find(m=>!cust.collected.includes(m.id));
  if(!nextNeeded){setMsg(I18N.t('pc_bag_ready','All items collected — click Bag It!'));return;}
  if(med.id===nextNeeded.id){
    cust.collected.push(med.id);
    SFX.click();
    setMsg('');
  }else{
    cust.wrongCount++;
    score=Math.max(0,score-5);
    SFX.error();
    setMsg(I18N.t('pc_wrong','Wrong item! -5 points'));
  }
  updateHud();
  renderCustomers();
}

function bagIt(custId){
  const cust=customers.find(c=>c.id===custId);
  if(!cust)return;
  if(cust.collected.length<cust.needed.length){
    setMsg(I18N.t('pc_incomplete','Order incomplete!'));
    return;
  }
  const gained=Math.max(5,20-cust.wrongCount*5);
  score+=gained;
  if(score>best){best=score;localStorage.setItem(BEST_KEY,String(best));}
  SFX.success();
  customers=customers.filter(c=>c.id!==custId);
  if(customers.length%4===0)round++;
  if(activeId===custId)activeId=customers.length?customers[0].id:null;
  updateHud();
  renderCustomers();
}

function renderCustomers(){
  const wrap=document.getElementById('customers');
  wrap.innerHTML='';
  customers.forEach(cust=>{
    const el=document.createElement('div');
    el.className='customer'+(cust.id===activeId?' active':'');
    const pct=Math.max(0,cust.patience/cust.maxPatience*100);
    const slipHtml=cust.needed.map(m=>{
      const got=cust.collected.includes(m.id);
      return `<div class="slip-item ${got?'got':''}"><span>${m.icon} ${m.name}</span></div>`;
    }).join('');
    const ready=cust.collected.length>=cust.needed.length;
    el.innerHTML=`<div class="face">${cust.face}</div>
      <div class="slip">${slipHtml}</div>
      <div class="patience"><div class="patience-fill" style="width:${pct}%;background:${pct<30?'#e53935':'#4caf50'}"></div></div>
      <button class="bag-btn" ${ready?'':'disabled'}>${I18N.t('pc_bag_it','Bag It!')}</button>`;
    el.querySelector('.bag-btn').onclick=(e)=>{e.stopPropagation();bagIt(cust.id);};
    el.onclick=()=>{activeId=cust.id;renderCustomers();};
    wrap.appendChild(el);
  });
}

let lastTick=null;
function tick(){
  const now=performance.now();
  const dt=lastTick===null?16:now-lastTick;
  lastTick=now;
  if(!gameOver){
    let lost=false;
    customers.forEach(c=>{ c.patience-=dt; });
    const expired=customers.filter(c=>c.patience<=0);
    if(expired.length){
      expired.forEach(()=>{ score=Math.max(0,score-10); });
      customers=customers.filter(c=>c.patience>0);
      if(activeId!==null && !customers.find(c=>c.id===activeId)){
        activeId=customers.length?customers[0].id:null;
      }
      SFX.lose();
      setMsg(I18N.t('pc_left','A customer left angry! -10 points'));
      updateHud();
    }
    renderCustomers();
    if(score<=-9999)gameOver=true; // score never truly game-overs; endless mode
  }
  requestAnimationFrame(tick);
}

reset();
requestAnimationFrame(tick);
</script></body></html>
