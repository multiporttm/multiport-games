<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Water Balloon Fight</title><meta name="description" content="Play Water Balloon Fight free online — Drag from your character and release to lob a water balloon along an arc; longer drags throw further. Lead your moving targets, dodge with Arrow Keys/WASD, and don't get soaked!"><link rel="canonical" href="https://games.multiportllc.com/games/waterballoonfight"><meta property="og:title" content="Water Balloon Fight - Multiport Games"><meta property="og:description" content="Play Water Balloon Fight free online — Drag from your character and release to lob a water balloon along an arc; longer drags throw further. Lead your moving targets, dodge with Arrow Keys/WASD, and don't get soaked!"><meta property="og:url" content="https://games.multiportllc.com/games/waterballoonfight"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Water Balloon Fight","description":"Play Water Balloon Fight free online instantly. Throw water balloons at moving AI opponents using a drag-to-aim arc trajectory system — lead your moving targets to land a hit — while dodging incoming balloons thrown back at you. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/waterballoonfight","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#04121a}
#c{background:#6ec6ff;display:block;border-radius:8px;touch-action:none;max-width:100%;height:auto}
#hud{display:flex;justify-content:space-between;align-items:center;color:#eaffff;font-size:1rem;font-weight:700;padding:6px 10px;flex-wrap:wrap;gap:6px}
#healthBar{width:110px;height:12px;background:#0a2333;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
#healthFill{height:100%;background:linear-gradient(90deg,#4dd0e1,#00acc1);width:100%}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Water Balloon Fight</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Hits: 0 | Hi: 0</span>
      <span>HP <span id="healthBar"><span id="healthFill"></span></span></span>
    </div>
    <canvas id="c" width="800" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move with <b>WASD/Arrows</b> to dodge. <b>Click/tap and drag</b> from your character then release to lob a water balloon along an arc — pull further back for more power. Lead your moving opponents to land a splash and watch out for balloons flying back at you!</div>
</div>
<script>
const HS_KEY='waterballoonfight_hi';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=480;
const GROUND=H-40;
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const MAX_HP=100;
let player,bots,balloons,particles;
let score=0,hp=MAX_HP,started=false,gameOver=false,lastTime=null;
let keys={};
let dragging=false,dragStart=null,dragCur=null;

function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}

function spawnBot(){
  let x,y,tries=0;
  do{x=450+Math.random()*(W-500);tries++;}while(tries<20&&Math.abs(x-player.x)<200);
  bots.push({x,y:GROUND,r:16,dir:Math.random()<0.5?1:-1,speed:1+Math.random()*1.2,throwCd:80+Math.random()*60,color:['#ff5577','#ffb74d','#a5d6a7'][Math.floor(Math.random()*3)]});
}

function reset(){
  player={x:100,y:GROUND,r:16,hurtCd:0};
  bots=[];balloons=[];particles=[];
  for(let i=0;i<3;i++)spawnBot();
  score=0;hp=MAX_HP;gameOver=false;started=false;lastTime=null;
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  SFX.lose();
}

function throwBalloon(from,tx,ty,fromPlayer){
  // arc: choose time-of-flight based on horizontal distance, solve vx,vy
  const dx=tx-from.x;
  const g=0.55;
  const flightTime=Math.max(28,Math.min(70,Math.abs(dx)/6+20));
  const vx=dx/flightTime;
  const dy=ty-(from.y-24);
  const vy=(dy-0.5*g*flightTime*flightTime)/flightTime;
  balloons.push({x:from.x,y:from.y-24,vx,vy,fromPlayer,life:200,trail:[]});
  SFX.swoosh();
}

function endGameCheckHit(b){
  // splash radius check against targets
  if(b.fromPlayer){
    for(const bot of bots){
      if(dist(b.x,b.y,bot.x,bot.y-16)<bot.r+14){
        bots=bots.filter(o=>o!==bot);
        score+=10;SFX.point();
        spawnSplash(b.x,b.y,'#4dd0e1');
        spawnBot();
        return true;
      }
    }
  }else{
    if(player.hurtCd<=0&&dist(b.x,b.y,player.x,player.y-16)<player.r+14){
      hp=Math.max(0,hp-18);
      player.hurtCd=45;
      SFX.hurt();
      spawnSplash(b.x,b.y,'#ff8a80');
      if(hp<=0)endGame();
      return true;
    }
  }
  return false;
}

function spawnSplash(x,y,color){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:26,color});
  }
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!started)started=true;
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){reset();started=true;}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function canvasPos(e){
  const rect=c.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*(W/rect.width),y:(e.clientY-rect.top)*(H/rect.height)};
}

function startDrag(p){
  if(gameOver){reset();started=true;return;}
  if(!started){started=true;return;}
  dragging=true;dragStart=p;dragCur=p;
}
function moveDrag(p){ if(dragging)dragCur=p; }
function endDrag(){
  if(dragging&&dragStart&&dragCur){
    const ddx=dragStart.x-dragCur.x, ddy=dragStart.y-dragCur.y;
    const dragDist=Math.hypot(ddx,ddy);
    if(dragDist>10){
      const power=Math.min(1,dragDist/220);
      const tx=player.x+ddx*2.2*power*2.2/Math.max(0.4,power);
      // simpler: target point mirrors drag direction from player, scaled
      const targetX=player.x+ddx*3;
      const targetY=Math.max(40,player.y-Math.abs(ddy)*2-60);
      throwBalloon(player,targetX,targetY,true);
    }
  }
  dragging=false;dragStart=null;dragCur=null;
}

c.addEventListener('mousedown',e=>{ startDrag(canvasPos(e)); });
c.addEventListener('mousemove',e=>{ moveDrag(canvasPos(e)); });
document.addEventListener('mouseup',()=>{ endDrag(); });

c.addEventListener('touchstart',e=>{ e.preventDefault(); startDrag(canvasPos(e.changedTouches[0])); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); moveDrag(canvasPos(e.changedTouches[0])); },{passive:false});
c.addEventListener('touchend',e=>{ e.preventDefault(); endDrag(); },{passive:false});

function drawScene(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#a5e6ff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#7ec850';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#5aaa30';ctx.fillRect(0,GROUND,W,4);
}

function drawCharacter(x,y,color,hurt){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=hurt?'#ffb3b3':color;
  ctx.beginPath();ctx.arc(0,-16,16,0,Math.PI*2);ctx.fill(); // head/body blob
  ctx.fillRect(-10,-4,20,20);
  ctx.restore();
}

function drawBalloon(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.fillStyle=b.fromPlayer?'#4dd0e1':'#ff8a80';
  ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();ctx.arc(-3,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawScene();

  if(!started){
    ctx.fillStyle='#08323f';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Move or Drag to start'),W/2,H/2);
    drawCharacter(player.x,player.y,'#ffd54f',false);
    bots.forEach(b=>drawCharacter(b.x,b.y,b.color,false));
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    bots.forEach(b=>drawCharacter(b.x,b.y,b.color,false));
    drawCharacter(player.x,player.y,'#ffd54f',false);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_hi_label','Hits: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Space to restart'),W/2,H/2+48);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  let dx=0;
  if(keys['KeyA']||keys['ArrowLeft'])dx-=1;
  if(keys['KeyD']||keys['ArrowRight'])dx+=1;
  player.x=Math.max(24,Math.min(400,player.x+dx*3.6*dt));
  if(player.hurtCd>0)player.hurtCd-=dt;

  bots.forEach(b=>{
    b.x+=b.dir*b.speed*dt;
    if(b.x<440||b.x>W-24){b.dir*=-1;}
    b.throwCd-=dt;
    if(b.throwCd<=0){
      // lead the player's current velocity roughly
      const leadX=player.x+dx*20;
      throwBalloon(b,leadX,player.y-16,false);
      b.throwCd=90+Math.random()*70;
    }
  });
  while(bots.length<3)spawnBot();

  const g=0.55;
  balloons=balloons.filter(b=>b.life>0&&b.y<H+40);
  balloons.forEach(b=>{
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>6)b.trail.shift();
    b.x+=b.vx*dt;b.vy+=g*dt*0.5;b.y+=b.vy*dt;b.life-=dt;
    ctx.strokeStyle=b.fromPlayer?'rgba(77,208,225,0.5)':'rgba(255,138,128,0.5)';
    ctx.lineWidth=3;
    ctx.beginPath();
    b.trail.forEach((p,i)=>{ if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    if(b.y>=GROUND-4){
      spawnSplash(b.x,GROUND,b.fromPlayer?'#4dd0e1':'#ff8a80');
      b.life=0;
      return;
    }
    if(endGameCheckHit(b))b.life=0;
  });
  balloons.forEach(drawBalloon);

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.15*dt;
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/26);
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  bots.forEach(b=>drawCharacter(b.x,b.y,b.color,false));
  drawCharacter(player.x,player.y,'#ffd54f',player.hurtCd>0);

  if(dragging&&dragStart&&dragCur){
    ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(player.x,player.y-16);ctx.lineTo(dragCur.x,dragCur.y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(dragCur.x,dragCur.y,6,0,Math.PI*2);ctx.fill();
  }

  document.getElementById('scoreDisp').textContent=I18N.t('score_hi_label','Hits: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('healthFill').style.width=Math.max(0,hp)+'%';

  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
