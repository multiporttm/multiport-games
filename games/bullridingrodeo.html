<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#d7ccc8}
#ui{color:#4e342e;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,80px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.15);border-radius:12px;color:#3e2723;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:56px}
#dpad button:active{background:rgba(0,0,0,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bull Riding Rodeo</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Time: 0.0s | Best: 0.0s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️ <span data-i18n="lean">Lean</span></button>
      <button class="right"><span data-i18n="lean">Lean</span> ➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">The bull bucks left and right — hold the Lean button on the opposite side to counter-balance and stay on. Let your balance meter hit either edge and you're thrown!</div>
</div>
<script>
const W=360,H=360;
let balance,bullForce,time,best,state,keys={};

function loadBest(){return +(localStorage.getItem('bullridingrodeo_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('bullridingrodeo_best',v);}

function init(){best=loadBest();state='play';balance=0;bullForce=0;time=0;}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(state==='over'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))init();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const leftBtn=document.querySelector('#dpad .left'),rightBtn=document.querySelector('#dpad .right');
leftBtn.addEventListener('mousedown',()=>{if(state==='over')init();else keys['arrowleft']=true;});
leftBtn.addEventListener('mouseup',()=>keys['arrowleft']=false);
leftBtn.addEventListener('touchstart',e=>{e.preventDefault();if(state==='over')init();else keys['arrowleft']=true;},{passive:false});
leftBtn.addEventListener('touchend',e=>{e.preventDefault();keys['arrowleft']=false;},{passive:false});
rightBtn.addEventListener('mousedown',()=>{if(state==='over')init();else keys['arrowright']=true;});
rightBtn.addEventListener('mouseup',()=>keys['arrowright']=false);
rightBtn.addEventListener('touchstart',e=>{e.preventDefault();if(state==='over')init();else keys['arrowright']=true;},{passive:false});
rightBtn.addEventListener('touchend',e=>{e.preventDefault();keys['arrowright']=false;},{passive:false});

function update(){
  if(state!=='play')return;
  time+=1/60;
  bullForce+=(Math.random()-0.5)*(0.5+time*0.02);
  bullForce=Math.max(-3,Math.min(3,bullForce));
  balance+=bullForce*0.1;
  if(keys['arrowleft'])balance-=0.35;
  if(keys['arrowright'])balance+=0.35;
  balance*=0.97;

  if(Math.abs(balance)>=10){
    state='over';
    SFX.lose();
    saveBest(time);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#d7ccc8';ctx.fillRect(0,0,W,H);

  const barW=W-60;
  ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(30,60,barW,20);
  ctx.fillStyle='#8d6e63';ctx.fillRect(30+barW/2-3,55,6,30);
  const markerX=30+barW/2+balance*barW/22;
  ctx.fillStyle='#d84315';
  ctx.fillRect(Math.max(30,Math.min(30+barW-6,markerX-3)),55,6,30);

  ctx.font='50px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();
  ctx.translate(W/2,180);
  ctx.rotate(balance*0.03);
  ctx.fillText('🐂',0,0);
  ctx.font='30px Arial';
  ctx.fillText('🤠',10,-30);
  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4e342e';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('thrown_off','THROWN OFF!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('time_best_label','Time: {n}s | Best: {b}s').replace('{n}',time.toFixed(1)).replace('{b}',loadBest().toFixed(1)),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_lean_retry','Tap Lean to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Time: ${time.toFixed(1)}s | Best: ${loadBest().toFixed(1)}s`;
}

init();draw();
</script></body></html>
