<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#8d6e63,#ffca28);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe082;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Excavator Dig</div>
  <div class="game-frame">
    <div id="score-display">Sites Cleared: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="640" height="520"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> (or <b>tap</b> a cell) to move the excavator bucket and <b>Space</b> (or tap again) to dig. Dig out every highlighted target cell to clear the site — avoid the ⚠ marked hazard cells (buried pipes) or you'll lose a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=520;
const gridTop=40;
let hi=parseInt(localStorage.getItem('excavatordig_hi')||'0',10);
let lives=3,sitesCleared=0,gameOver=false;
let cols,rows,cellSize;
let grid; // 'target','hazard','plain'
let dug; // boolean grid
let cursor={r:0,c:0};
let flashCells=[]; // {r,c,color,t}

function newSite(){
  cols=Math.min(10,6+Math.floor(sitesCleared/2));
  rows=Math.min(8,5+Math.floor(sitesCleared/3));
  cellSize=Math.floor(Math.min(W/cols,(H-gridTop)/rows));
  grid=[];dug=[];
  for(let r=0;r<rows;r++){
    const gRow=[],dRow=[];
    for(let cc=0;cc<cols;cc++){gRow.push('plain');dRow.push(false);}
    grid.push(gRow);dug.push(dRow);
  }
  // carve a target shape: a connected blob
  const targetCount=Math.min(rows*cols-4,8+sitesCleared*2);
  let sr=Math.floor(Math.random()*rows), sc=Math.floor(Math.random()*cols);
  const targets=new Set();
  const key=(r,cc)=>r+','+cc;
  const frontier=[[sr,sc]];
  targets.add(key(sr,sc));
  while(targets.size<targetCount && frontier.length){
    const idx=Math.floor(Math.random()*frontier.length);
    const [r,cc]=frontier[idx];
    const dirs=[[r-1,cc],[r+1,cc],[r,cc-1],[r,cc+1]].filter(([nr,nc])=>nr>=0&&nr<rows&&nc>=0&&nc<cols&&!targets.has(key(nr,nc)));
    if(dirs.length===0){frontier.splice(idx,1);continue;}
    const [nr,nc]=dirs[Math.floor(Math.random()*dirs.length)];
    targets.add(key(nr,nc));
    frontier.push([nr,nc]);
  }
  targets.forEach(k=>{
    const [r,cc]=k.split(',').map(Number);
    grid[r][cc]='target';
  });
  // hazards: place on non-target cells
  const hazardCount=Math.min(5,1+Math.floor(sitesCleared/2));
  let placed=0,tries=0;
  while(placed<hazardCount && tries<200){
    tries++;
    const r=Math.floor(Math.random()*rows), cc=Math.floor(Math.random()*cols);
    if(grid[r][cc]==='plain'){grid[r][cc]='hazard';placed++;}
  }
  cursor={r:0,c:0};
}

function targetsRemaining(){
  let n=0;
  for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++)if(grid[r][cc]==='target'&&!dug[r][cc])n++;
  return n;
}

function digCell(r,cc){
  if(gameOver)return;
  if(r<0||r>=rows||cc<0||cc>=cols)return;
  if(dug[r][cc])return;
  dug[r][cc]=true;
  if(grid[r][cc]==='hazard'){
    lives--;
    SFX.error();
    flashCells.push({r,c:cc,color:'#e53935',t:20});
    if(lives<=0){
      gameOver=true;
      SFX.lose();
    }
  } else if(grid[r][cc]==='target'){
    SFX.point();
    flashCells.push({r,c:cc,color:'#66bb6a',t:14});
    if(targetsRemaining()===0){
      sitesCleared++;
      if(sitesCleared>hi){hi=sitesCleared;localStorage.setItem('excavatordig_hi',hi);}
      SFX.success();
      setTimeout(()=>{ if(!gameOver) newSite(); },400);
    }
  } else {
    SFX.click();
    flashCells.push({r,c:cc,color:'#8d6e63',t:10});
  }
}

function moveCursor(dr,dc){
  cursor.r=Math.max(0,Math.min(rows-1,cursor.r+dr));
  cursor.c=Math.max(0,Math.min(cols-1,cursor.c+dc));
}

document.addEventListener('keydown',e=>{
  if(gameOver && (e.code==='Space'||e.code==='Enter')){reset();return;}
  if(e.code==='ArrowUp'){e.preventDefault();moveCursor(-1,0);}
  else if(e.code==='ArrowDown'){e.preventDefault();moveCursor(1,0);}
  else if(e.code==='ArrowLeft'){e.preventDefault();moveCursor(0,-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();moveCursor(0,1);}
  else if(e.code==='Space'){e.preventDefault();digCell(cursor.r,cursor.c);}
});

function canvasCellAt(clientX,clientY){
  const rect=c.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  const y=(clientY-rect.top)*(H/rect.height)-gridTop;
  const cc=Math.floor(x/cellSize), r=Math.floor(y/cellSize);
  return {r,c:cc};
}

c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  const {r,c:cc}=canvasCellAt(e.clientX,e.clientY);
  if(r<0||r>=rows||cc<0||cc>=cols)return;
  if(cursor.r===r&&cursor.c===cc){digCell(r,cc);}
  else{cursor={r,c:cc};}
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  if(gameOver){reset();return;}
  const {r,c:cc}=canvasCellAt(t.clientX,t.clientY);
  if(r<0||r>=rows||cc<0||cc>=cols)return;
  if(cursor.r===r&&cursor.c===cc){digCell(r,cc);}
  else{cursor={r,c:cc};}
},{passive:false});

function reset(){
  lives=3;sitesCleared=0;gameOver=false;flashCells=[];
  newSite();
}

function drawGrid(){
  for(let r=0;r<rows;r++){
    for(let cc=0;cc<cols;cc++){
      const x=cc*cellSize, y=gridTop+r*cellSize;
      const isDug=dug[r][cc];
      const type=grid[r][cc];
      if(isDug){
        ctx.fillStyle='#3e2723';
      } else if(type==='target'){
        ctx.fillStyle='#a1887f';
      } else {
        ctx.fillStyle='#6d4c41';
      }
      ctx.fillRect(x+1,y+1,cellSize-2,cellSize-2);
      if(!isDug && type==='target'){
        ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
        ctx.strokeRect(x+3,y+3,cellSize-6,cellSize-6);
      }
      if(!isDug && type==='hazard'){
        ctx.font=(cellSize*0.5)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#ffeb3b';
        ctx.fillText('⚠',x+cellSize/2,y+cellSize/2);
      }
      if(isDug && type==='hazard'){
        ctx.font=(cellSize*0.5)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#ff5252';
        ctx.fillText('🔧',x+cellSize/2,y+cellSize/2);
      }
    }
  }
  // cursor
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.strokeRect(cursor.c*cellSize+2,gridTop+cursor.r*cellSize+2,cellSize-4,cellSize-4);

  // flashes
  flashCells=flashCells.filter(f=>f.t>0);
  flashCells.forEach(f=>{
    ctx.globalAlpha=f.t/20;
    ctx.fillStyle=f.color;
    ctx.fillRect(f.c*cellSize,gridTop+f.r*cellSize,cellSize,cellSize);
    ctx.globalAlpha=1;
    f.t--;
  });
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('excavator_score_label','Sites Cleared: {s} | Lives: {l} | Best: {h}')
      .replace('{s}',sitesCleared).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#5d4037');bg.addColorStop(1,'#8d6e63');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#37474f';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillStyle='#fff8e1';
  ctx.fillText(I18N.t('excavator_target_hint','Dig the yellow-outlined cells. Avoid ⚠ pipes!'),10,24);

  drawGrid();

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('excavator_final_label','Sites Cleared: {s} | Best: {h}').replace('{s}',sitesCleared).replace('{h}',hi),W/2,H/2+10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
  }

  updateScore();
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
