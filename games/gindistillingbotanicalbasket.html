<style>
body{background:#0c140c}
#c{background:#2f5233;display:block;border-radius:8px;touch-action:none}
#hud{color:#dff0d8;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#aee571}
#hud span.hs{color:#f0d060}
#btnRow{display:flex;justify-content:center;gap:10px;padding:6px 10px 12px;flex-wrap:wrap}
#btnRow button{padding:10px 22px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.1rem;color:#fff;background:#2f5233}

</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gin Botanical Basket</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="360"></canvas>
    <div id="btnRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the current <b>gin recipe</b> botanical at the top, then slide your basket with <b>Left/Right Arrow</b> (or drag/tap) to catch only that botanical as it falls. Catching the wrong one or missing the right one costs a life!</div>
</div>
<script>
(function(){
const HS_KEY='gindistillingbotanicalbasket_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;

const BOTANICALS=[
  {key:'juniper',label:'Juniper Berries',emoji:'🫐',color:'#3a5a3a'},
  {key:'coriander',label:'Coriander Seed',emoji:'🌾',color:'#c9a85c'},
  {key:'citrus',label:'Citrus Peel',emoji:'🍋',color:'#e8c84a'},
  {key:'angelica',label:'Angelica Root',emoji:'🌿',color:'#6b9b5e'},
  {key:'orris',label:'Orris Root',emoji:'🌸',color:'#d8a8c8'},
  {key:'cardamom',label:'Cardamom Pod',emoji:'🫘',color:'#8a6a3a'},
  {key:'licorice',label:'Licorice Root',emoji:'🪵',color:'#5a3a2a'}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let target=null,drops=[],spawnTimer=0,basketX=W/2,caught=0,needed=5;
let keyLeft=false,keyRight=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function pickTarget(){
  target=BOTANICALS[Math.floor(Math.random()*BOTANICALS.length)];
  caught=0;
  needed=4+Math.floor(level/2);
}

function newRound(){
  drops=[];spawnTimer=0;
  pickTarget();
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;basketX=W/2;newRound(); }
reset();

function buildButtons(){
  const el=document.getElementById('btnRow');
  el.innerHTML='';
  const l=document.createElement('button');
  l.textContent='◀';
  l.addEventListener('pointerdown',e=>{e.stopPropagation(); keyLeft=true;});
  l.addEventListener('pointerup',e=>{e.stopPropagation(); keyLeft=false;});
  l.addEventListener('pointerleave',()=>{keyLeft=false;});
  const r=document.createElement('button');
  r.textContent='▶';
  r.addEventListener('pointerdown',e=>{e.stopPropagation(); keyRight=true;});
  r.addEventListener('pointerup',e=>{e.stopPropagation(); keyRight=false;});
  r.addEventListener('pointerleave',()=>{keyRight=false;});
  el.appendChild(l);el.appendChild(r);
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function spawnDrop(){
  const isTarget=Math.random()<0.45;
  const b=isTarget?target:BOTANICALS[Math.floor(Math.random()*BOTANICALS.length)];
  drops.push({b,x:40+Math.random()*(W-80),y:-20,speed:1.6+level*0.18+Math.random()*0.6,isTarget:b.key===target.key});
}

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
  document.getElementById('btnRow').innerHTML='';
}

function missTargetPenalty(){
  lives--;SFX.hurt();
  if(lives<=0){ endGame(); return; }
}

function catchDrop(d){
  if(d.isTarget){
    caught++;score+=20*level;SFX.coin();
    if(caught>=needed){
      score+=60*level;SFX.success();
      if(score>=level*300)levelUp();
      newRound();
    }
  } else {
    missTargetPenalty();
  }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',(e)=>{
  if(!started||gameOver){startGame();return;}
  const rect=c.getBoundingClientRect();
  basketX=(e.clientX-rect.left)*(W/rect.width);
});
c.addEventListener('pointermove',(e)=>{
  if(!started||gameOver)return;
  if(e.pressure===0&&e.pointerType==='mouse')return;
  const rect=c.getBoundingClientRect();
  basketX=(e.clientX-rect.left)*(W/rect.width);
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();}
    return;
  }
  if(e.code==='ArrowLeft'){ e.preventDefault(); keyLeft=true; }
  else if(e.code==='ArrowRight'){ e.preventDefault(); keyRight=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'){ keyLeft=false; }
  else if(e.code==='ArrowRight'){ keyRight=false; }
});

function drawBasket(){
  const by=H-30;
  ctx.save();
  ctx.translate(basketX,by);
  ctx.fillStyle='#8a5a2b';
  ctx.beginPath();
  ctx.moveTo(-45,0);ctx.lineTo(45,0);ctx.lineTo(36,26);ctx.lineTo(-36,26);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=3;ctx.stroke();
  for(let i=-30;i<=30;i+=15){ ctx.beginPath();ctx.moveTo(i,2);ctx.lineTo(i*0.8,24);ctx.stroke(); }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a3020');bg.addColorStop(1,'#2f5233');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#dff0d8';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawBasket();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(keyLeft)basketX=Math.max(40,basketX-7);
  if(keyRight)basketX=Math.min(W-40,basketX+7);

  spawnTimer--;
  if(spawnTimer<=0){ spawnDrop(); spawnTimer=Math.max(22,50-level*3); }

  const by=H-30;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.y+=d.speed;
    if(d.y>=by-10&&d.y<=by+10&&Math.abs(d.x-basketX)<42){
      catchDrop(d);
      drops.splice(i,1);
      continue;
    }
    if(d.y>H+20){
      if(d.isTarget) missTargetPenalty();
      drops.splice(i,1);
    }
  }

  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('recipe_calls_for','Recipe needs: {e} {n}').replace('{e}',target.emoji).replace('{n}',I18N.t('bot_'+target.key,target.label)),W/2,30);
  ctx.font='15px Arial';ctx.fillStyle='#c8e0b8';
  ctx.fillText(I18N.t('caught_label','Caught: {c} / {n}').replace('{c}',caught).replace('{n}',needed),W/2,52);

  drops.forEach(d=>{
    ctx.font='28px Arial';ctx.textAlign='center';
    ctx.fillText(d.b.emoji,d.x,d.y);
  });

  drawBasket();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
