<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#16213e;border-radius:14px;padding:18px;text-align:center}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:6px 0;min-height:1.6em}
#stats{color:#ffd54f;font-size:.95rem;margin-bottom:8px}
#grid{display:inline-grid;gap:6px;background:#0b0b1a;padding:12px;border-radius:12px;margin:10px auto}
.light{width:56px;height:56px;border-radius:8px;cursor:pointer;border:2px solid #2a2a44;transition:background .15s,box-shadow .15s,transform .08s;background:#1c1c30}
.light.on{background:#ffd54f;box-shadow:0 0 18px 4px #ffd54f99;border-color:#ffe285}
.light:active{transform:scale(.92)}
#controls{margin:12px 0}
#controls button{padding:9px 22px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin:0 5px}
@media(max-width:480px){
  .light{width:44px;height:44px}
}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lights Out</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="status">Turn all the lights off!</div>
      <div id="stats">Moves: 0 | Best: — | Solved: 0</div>
      <div id="grid"></div>
      <div id="controls">
        <button id="newBtn" onclick="newPuzzle()">New Puzzle</button>
        <button id="resetBtn" onclick="resetPuzzle()">Reset</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click any light to toggle it and its up/down/left/right neighbors <b>on/off</b>. Turn every light off to solve the puzzle in as few moves as possible.</div>
</div>
<script>
const SIZE=5;
let grid,startGrid,moves,solvedCount,bestMoves;

function key(){return 'lightsout_solved';}
function bestKey(){return 'lightsout_best';}

solvedCount=parseInt(localStorage.getItem(key())||'0',10);
bestMoves=parseInt(localStorage.getItem(bestKey())||'0',10)||null;

function emptyGrid(){
  return Array.from({length:SIZE},()=>Array(SIZE).fill(false));
}

function toggle(g,r,c){
  const cells=[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
  cells.forEach(([rr,cc])=>{
    if(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE)g[rr][cc]=!g[rr][cc];
  });
}

function generate(){
  const g=emptyGrid();
  // apply a random sequence of valid toggles from all-off, guarantees solvability
  const numMoves=12+Math.floor(Math.random()*10);
  const used=new Set();
  for(let i=0;i<numMoves;i++){
    const r=Math.floor(Math.random()*SIZE),c=Math.floor(Math.random()*SIZE);
    toggle(g,r,c);
  }
  // avoid a trivially already-solved puzzle
  if(g.every(row=>row.every(v=>!v)))return generate();
  return g;
}

function newPuzzle(){
  grid=generate();
  startGrid=grid.map(row=>row.slice());
  moves=0;
  updateStats();
  setStatus(I18N.t('lo_new_puzzle','New puzzle! Turn all the lights off.'));
  render();
}

function resetPuzzle(){
  grid=startGrid.map(row=>row.slice());
  moves=0;
  updateStats();
  setStatus(I18N.t('lo_reset','Puzzle reset.'));
  render();
}

function setStatus(t){document.getElementById('status').textContent=t;}

function updateStats(){
  document.getElementById('stats').textContent=
    I18N.t('lo_stats','Moves: {m} | Best: {b} | Solved: {s}')
      .replace('{m}',moves)
      .replace('{b}',bestMoves==null?'—':bestMoves)
      .replace('{s}',solvedCount);
}

function isSolved(){return grid.every(row=>row.every(v=>!v));}

function click(r,c){
  toggle(grid,r,c);
  moves++;
  SFX.click();
  render();
  if(isSolved()){
    solvedCount++;
    localStorage.setItem(key(),solvedCount);
    if(bestMoves==null||moves<bestMoves){
      bestMoves=moves;
      localStorage.setItem(bestKey(),bestMoves);
    }
    updateStats();
    setStatus(I18N.t('lo_solved','Solved in {m} moves! Nice work.').replace('{m}',moves));
    SFX.win();
    setTimeout(newPuzzle,1400);
    return;
  }
  updateStats();
}

function render(){
  const cols=SIZE*56+(SIZE-1)*6+24;
  const gridEl=document.getElementById('grid');
  gridEl.style.gridTemplateColumns=`repeat(${SIZE},56px)`;
  gridEl.innerHTML='';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell=document.createElement('div');
      cell.className='light'+(grid[r][c]?' on':'');
      cell.onclick=()=>click(r,c);
      gridEl.appendChild(cell);
    }
  }
}

newPuzzle();
</script></body></html>
