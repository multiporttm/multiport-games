<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Wind Chime Maker</title><meta name="description" content="Play Wind Chime Maker free online — Watch the chime tubes light up in a melody, then click them in the same order before time runs out. Each round adds a note!"><link rel="canonical" href="https://games.multiportllc.com/games/windchimemaker"><meta property="og:title" content="Wind Chime Maker - Multiport Games"><meta property="og:description" content="Play Wind Chime Maker free online — Watch the chime tubes light up in a melody, then click them in the same order before time runs out. Each round adds a note!"><meta property="og:url" content="https://games.multiportllc.com/games/windchimemaker"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Wind Chime Maker","description":"Play Wind Chime Maker free online instantly. A short melody plays as chime tubes light up in sequence. Click the tubes in the same order to reproduce the melody before the timer runs out. Correct sequences score points and the next melody gains a note; a wrong click costs a life. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/windchimemaker","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#0d3b4f,#8fd9c4);border-radius:14px;padding:20px;text-align:center}
#statsRow{display:flex;justify-content:center;gap:18px;color:#fff;font-weight:800;margin-bottom:6px;text-shadow:0 1px 2px #0006}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:4px 0;min-height:1.5em;text-shadow:0 1px 2px #0006}
#timerBarWrap{width:100%;max-width:420px;height:12px;background:#00000033;border-radius:6px;margin:8px auto;overflow:hidden}
#timerBar{height:100%;background:#ffd54f;width:100%;transition:width .1s linear}
#rack{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:24px auto;height:180px;max-width:480px}
.chime{width:44px;border-radius:8px 8px 4px 4px;cursor:pointer;transition:filter .1s,transform .1s;box-shadow:0 4px 0 #0003;position:relative}
.chime.lit{filter:brightness(1.9);transform:translateY(-8px)}
.chime:active{transform:translateY(2px)}
#startBtn{margin-top:6px;padding:10px 28px;background:#ffd54f;color:#0d3b4f;border:none;border-radius:22px;font-weight:900;font-size:1.05rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wind Chime Maker</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="statsRow"><span id="scoreLbl">Melodies: 0</span><span id="livesLbl">Lives: 3</span><span id="hiLbl">Hi: 0</span></div>
      <div id="status">Watch the melody, then repeat it!</div>
      <div id="timerBarWrap"><div id="timerBar"></div></div>
      <div id="rack"></div>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the <b>chime tubes</b> light up and play a short melody, then <b>click them in the same order</b> before the timer runs out. Get it right to score and hear a longer melody next round; a wrong click costs a life.</div>
</div>
<script>
const N=6;
const HUES=[0,60,120,180,240,300];
const FREQS=[261.6,329.6,392.0,440.0,523.3,659.3]; // pentatonic-ish scale

let score=0,lives=3,hi=0,round=1,sequence=[],playerIdx=0,accepting=false,gameOver=false,started=false,timerId,timeLeft,timerMax;
hi=parseFloat(localStorage.getItem('windchimemaker_hi')||'0');

function buildRack(){
  const rack=document.getElementById('rack');
  rack.innerHTML='';
  for(let i=0;i<N;i++){
    const el=document.createElement('div');
    el.className='chime';
    const h=HUES[i];
    el.style.background=`hsl(${h},70%,55%)`;
    el.style.height=(90+i*14)+'px';
    el.dataset.i=i;
    el.onclick=()=>playerClick(i);
    rack.appendChild(el);
  }
}
buildRack();

function tone(i){
  playChimeVisual(i);
  const f=FREQS[i];
  const ac=SFX.getContext&&SFX.getContext();
  if(ac&&!SFX.isMuted()){
    const osc=ac.createOscillator(),gain=ac.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(f,ac.currentTime);
    gain.gain.setValueAtTime(0.001,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.2,ac.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.9);
    osc.connect(gain);gain.connect(ac.destination);
    osc.start();osc.stop(ac.currentTime+0.95);
  }
}

function playChimeVisual(i){
  const el=document.querySelector(`.chime[data-i="${i}"]`);
  if(!el)return;
  el.classList.add('lit');
  setTimeout(()=>el.classList.remove('lit'),350);
}

function setStatus(t){document.getElementById('status').textContent=t;}
function updateStats(){
  document.getElementById('scoreLbl').textContent=I18N.t('wc_melodies_label','Melodies: {s}').replace('{s}',score);
  document.getElementById('livesLbl').textContent=I18N.t('wc_lives_label','Lives: {l}').replace('{l}',lives);
  document.getElementById('hiLbl').textContent=I18N.t('wc_hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function newSequence(){
  const len=2+round;
  sequence=[];
  for(let i=0;i<len;i++)sequence.push(Math.floor(Math.random()*N));
}

function playSequence(){
  accepting=false;
  playerIdx=0;
  setStatus(I18N.t('wc_listen','Listen carefully...'));
  document.getElementById('timerBar').style.width='100%';
  let i=0;
  const step=()=>{
    if(i>=sequence.length){
      accepting=true;
      playerIdx=0;
      setStatus(I18N.t('wc_your_turn','Your turn! Repeat the melody.'));
      startTimer();
      return;
    }
    tone(sequence[i]);
    i++;
    setTimeout(step,550);
  };
  setTimeout(step,500);
}

function startTimer(){
  timerMax=Math.max(6,4+sequence.length*1.6);
  timeLeft=timerMax;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!accepting)return;
    timeLeft-=0.1;
    const pct=Math.max(0,timeLeft/timerMax*100);
    document.getElementById('timerBar').style.width=pct+'%';
    document.getElementById('timerBar').style.background=pct<25?'#e94560':'#ffd54f';
    if(timeLeft<=0){
      clearInterval(timerId);
      failRound(I18N.t('wc_timeout','Time\'s up!'));
    }
  },100);
}

function playerClick(i){
  if(!accepting||gameOver)return;
  tone(i);
  if(sequence[playerIdx]===i){
    playerIdx++;
    if(playerIdx>=sequence.length){
      accepting=false;
      clearInterval(timerId);
      score++;
      SFX.success();
      if(score>hi){hi=score;localStorage.setItem('windchimemaker_hi',hi);}
      round++;
      updateStats();
      setStatus(I18N.t('wc_success','Beautiful! Next melody...'));
      setTimeout(()=>{ if(!gameOver){newSequence();playSequence();} },1000);
    }
  }else{
    failRound(I18N.t('wc_wrong','Wrong note!'));
  }
}

function failRound(msg){
  accepting=false;
  clearInterval(timerId);
  lives--;
  SFX.error();
  setStatus(msg);
  updateStats();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(()=>{ if(!gameOver)playSequence(); },1100);
  }
}

function endGame(){
  gameOver=true;
  SFX.lose();
  setStatus(I18N.t('game_over_title','GAME OVER')+' — '+I18N.t('wc_restart_hint','Click Start to play again'));
  document.getElementById('startBtn').textContent=I18N.t('wc_restart_btn','Start Again');
  document.getElementById('startBtn').style.display='inline-block';
}

document.getElementById('startBtn').addEventListener('click',()=>{
  started=true;gameOver=false;score=0;lives=3;round=1;
  updateStats();
  document.getElementById('startBtn').style.display='none';
  newSequence();
  playSequence();
});

updateStats();
</script></body></html>
