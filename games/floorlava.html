<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a1a2e}
#ui{color:#ff8a65;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Floor Is Lava</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
  </div>
  <div class="game-instructions">Left/Right (or the D-pad) to move, Space/Up to jump. Hop up the furniture platforms and stay ahead of the rising lava below!</div>
</div>
<script>
const W=360,H=360,SIZE=16,GRAVITY=0.5;
let player,vy,platforms,lavaY,height,best,state,keys={},camY=0;

function loadBest(){return +(localStorage.getItem('floorlava_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('floorlava_best',v);}

function init(){
  platforms=[{x:150,y:H-30,w:60}];
  let y=H-30;
  for(let i=0;i<20;i++){
    y-=40+Math.random()*20;
    platforms.push({x:20+Math.random()*(W-80),w:60+Math.random()*30,y});
  }
  player={x:180,y:H-60,vx:0};
  vy=0;lavaY=H+20;height=0;best=loadBest();state='play';camY=0;
}

function jump(){if(player.onGround){vy=-9.5;player.onGround=false;SFX.jump();}}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if((e.key===' '||e.key==='ArrowUp')){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelector('#dpad .left').addEventListener('mousedown',()=>keys['arrowleft']=true);
document.querySelector('#dpad .left').addEventListener('mouseup',()=>keys['arrowleft']=false);
document.querySelector('#dpad .left').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowleft']=true;},{passive:false});
document.querySelector('#dpad .left').addEventListener('touchend',e=>{e.preventDefault();keys['arrowleft']=false;},{passive:false});
document.querySelector('#dpad .right').addEventListener('mousedown',()=>keys['arrowright']=true);
document.querySelector('#dpad .right').addEventListener('mouseup',()=>keys['arrowright']=false);
document.querySelector('#dpad .right').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowright']=true;},{passive:false});
document.querySelector('#dpad .right').addEventListener('touchend',e=>{e.preventDefault();keys['arrowright']=false;},{passive:false});

function update(){
  if(state!=='play'){
    if(state==='over'&&(keys['arrowleft']||keys['arrowright']))init();
    return;
  }
  const spd=2.3;
  if(keys['arrowleft'])player.x-=spd;
  if(keys['arrowright'])player.x+=spd;
  player.x=Math.max(0,Math.min(W-SIZE,player.x));

  vy+=GRAVITY;
  player.y+=vy;
  player.onGround=false;
  platforms.forEach(p=>{
    if(player.x+SIZE>p.x&&player.x<p.x+p.w&&player.y+SIZE>=p.y&&player.y+SIZE<=p.y+14&&vy>=0){
      player.y=p.y-SIZE;vy=0;player.onGround=true;
    }
  });

  const targetCam=Math.min(camY,player.y-200);
  camY+=(targetCam-camY)*0.1;

  height=Math.max(height,Math.floor((H-30-player.y)/10));
  lavaY-=0.5+height*0.002;

  while(platforms[platforms.length-1].y>camY-40){
    const last=platforms[platforms.length-1];
    platforms.push({x:20+Math.random()*(W-80),w:60+Math.random()*30,y:last.y-(40+Math.random()*20)});
  }

  if(player.y+SIZE>lavaY){
    state='over';
    SFX.lose();
    saveBest(height);
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.save();
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.translate(0,-camY);

  ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  platforms.forEach(p=>{
    ctx.fillStyle='#8d6e63';
    ctx.fillRect(p.x,p.y,p.w,10);
  });

  ctx.fillStyle='#ff5722';
  ctx.fillRect(0,lavaY,W,600);
  ctx.font='20px Arial';
  ctx.fillText('🔥',W/2,lavaY+10);

  ctx.font='22px Arial';
  ctx.fillText('🏃',player.x+SIZE/2,player.y+SIZE/2);
  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff8a65';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('LAVA!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Height: ${height} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Press Left/Right to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Height: ${height} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
