<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#33691e;cursor:pointer}
#ui{color:#aed581;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Dino Tamer</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Tamed: 0 | Food: 10</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to walk near a dinosaur, then tap it to toss food. Feed each one 3 times to tame it. Run out of food before taming enough and it's game over — collect 🍖 pickups to restock!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,dinos,pickups,food,tamed,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('dinotamer_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('dinotamer_best',v);}

const DINO_EMOJI=['🦖','🦕','🐊'];

function init(){
  player={x:W/2,y:H/2};
  dinos=[];pickups=[];food=10;tamed=0;state='play';
  for(let i=0;i<5;i++)spawnDino();
  for(let i=0;i<2;i++)spawnPickup();
}

function spawnDino(){
  dinos.push({x:rand(30,W-30),y:rand(30,H-30),emoji:DINO_EMOJI[Math.floor(Math.random()*DINO_EMOJI.length)],feeds:0,vx:rand(-0.4,0.4),vy:rand(-0.4,0.4)});
}
function spawnPickup(){
  pickups.push({x:rand(30,W-30),y:rand(30,H-30)});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  for(const d of dinos){
    if(Math.hypot(x-d.x,y-d.y)<26&&Math.hypot(player.x-d.x,player.y-d.y)<70){
      if(food<=0)return;
      food--;d.feeds++;
      if(d.feeds>=3){
        tamed++;
        dinos.splice(dinos.indexOf(d),1);
        saveBest(tamed);
        spawnDino();
      }
      updateUI();
      return;
    }
  }
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.2;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  dinos.forEach(d=>{
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<20||d.x>W-20)d.vx*=-1;
    if(d.y<20||d.y>H-20)d.vy*=-1;
  });

  pickups=pickups.filter(p=>{
    if(dist(p,player)<20){food+=3;updateUI();return false;}
    return true;
  });
  if(pickups.length<1&&Math.random()<0.01)spawnPickup();

  if(food<=0&&dinos.every(d=>d.feeds===0)){
    state='over';
    saveBest(tamed);
  }
}

function draw(){
  ctx.fillStyle='#33691e';ctx.fillRect(0,0,W,H);

  ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  pickups.forEach(p=>ctx.fillText('🍖',p.x,p.y));

  ctx.font='26px Arial';
  dinos.forEach(d=>{
    ctx.fillText(d.emoji,d.x,d.y);
    if(d.feeds>0){
      ctx.font='11px Arial';ctx.fillStyle='#ffca28';
      ctx.fillText('❤️'.repeat(d.feeds),d.x,d.y-24);
      ctx.font='26px Arial';ctx.fillStyle='#000';
    }
  });

  ctx.font='22px Arial';
  ctx.fillText('🧑‍🌾',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#aed581';ctx.font='bold 26px Arial';
    ctx.fillText('OUT OF FOOD!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Tamed: ${tamed} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Tamed: ${tamed} | Food: ${food}`;
}

init();draw();
</script></body></html>
