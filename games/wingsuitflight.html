<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Wingsuit Flight</title><meta name="description" content="Play Wingsuit Flight free online — Use Arrow Keys/WASD or drag on touch to steer your wingsuit flyer up and down through a canyon of rocks and narrow gaps. Fly as far as you can as the speed keeps climbing!"><link rel="canonical" href="https://games.multiportllc.com/games/wingsuitflight"><meta property="og:title" content="Wingsuit Flight - Multiport Games"><meta property="og:description" content="Play Wingsuit Flight free online — Use Arrow Keys/WASD or drag on touch to steer your wingsuit flyer up and down through a canyon of rocks and narrow gaps. Fly as far as you can as the speed keeps climbing!"><meta property="og:url" content="https://games.multiportllc.com/games/wingsuitflight"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Wingsuit Flight","description":"Play Wingsuit Flight free online instantly. Use Arrow Keys/WASD or drag on touch to steer your wingsuit flyer up and down through a canyon of rocks and narrow gaps. Fly as far as you can as the speed keeps climbing! No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/wingsuitflight","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#4a6fa5,#cbe8ff);display:block;border-radius:8px;touch-action:none}
#score-display{color:#dff3ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wingsuit Flight</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b>/<b>WASD</b> (or <b>drag</b> on touch) to steer up and down through the canyon. Dive and climb to slip through the gaps between rock walls — crashing ends your flight. Fly as far as you can; the wind speed increases the longer you survive!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let flyer={x:150,y:H/2,vy:0,angle:0};
let dist=0,best=parseFloat(localStorage.getItem('wingsuitflight_best')||'0');
let gameOver=false,started=false,spd=5;
let rocks=[]; // {x, topH, gapY, gapH, w, passed}
let particles=[];
let lastTime=null,rockTimer=0;
let keys={up:false,down:false};
let touchTargetY=null;

function reset(){
  flyer.x=150;flyer.y=H/2;flyer.vy=0;flyer.angle=0;
  dist=0;gameOver=false;started=false;spd=5;
  rocks=[];particles=[];lastTime=null;rockTimer=0;touchTargetY=null;
  for(let i=0;i<3;i++)spawnRock(700+i*260);
}

function spawnRock(x){
  const gapH=Math.max(110,190-dist/25);
  const gapY=60+Math.random()*(H-120-gapH);
  rocks.push({x,gapY,gapH,w:60,passed:false});
}

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('wingsuit_dist_label','Distance: {d}m | Best: {b}m').replace('{d}',Math.floor(dist)).replace('{b}',Math.floor(best));
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','KeyW'].includes(e.code)){keys.up=true;e.preventDefault();}
  if(['ArrowDown','KeyS'].includes(e.code)){keys.down=true;e.preventDefault();}
  if(e.code==='Space'){ if(!started){started=true;} else if(gameOver){reset();} e.preventDefault(); }
});
document.addEventListener('keyup',e=>{
  if(['ArrowUp','KeyW'].includes(e.code))keys.up=false;
  if(['ArrowDown','KeyS'].includes(e.code))keys.down=false;
});
function pointerY(e){
  const r=c.getBoundingClientRect();
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return (cy-r.top)/r.height*H;
}
c.addEventListener('pointerdown',e=>{
  if(!started){started=true;lastTime=null;}
  if(gameOver){reset();return;}
  touchTargetY=pointerY(e);
});
c.addEventListener('pointermove',e=>{
  if(touchTargetY!==null)touchTargetY=pointerY(e);
});
c.addEventListener('pointerup',()=>{touchTargetY=null;});
c.addEventListener('pointerleave',()=>{touchTargetY=null;});

function drawFlyer(){
  ctx.save();
  ctx.translate(flyer.x,flyer.y);
  ctx.rotate(flyer.angle);
  ctx.fillStyle='#e94560';
  ctx.beginPath();
  ctx.moveTo(-26,0);ctx.lineTo(18,-14);ctx.lineTo(6,0);ctx.lineTo(18,14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd6a5';
  ctx.beginPath();ctx.arc(20,0,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawRock(r){
  ctx.fillStyle='#6b5847';
  ctx.fillRect(r.x,0,r.w,r.gapY);
  ctx.fillRect(r.x,r.gapY+r.gapH,r.w,H-(r.gapY+r.gapH));
  ctx.fillStyle='#503f31';
  ctx.fillRect(r.x,r.gapY-6,r.w,6);
  ctx.fillRect(r.x,r.gapY+r.gapH,r.w,6);
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4a6fa5');sky.addColorStop(1,'#cbe8ff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(!started){
    rocks.forEach(drawRock);
    drawFlyer();
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wingsuit_start_hint','Press a key / tap-drag to start flying'),W/2,60);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    rocks.forEach(drawRock);
    drawFlyer();
    ctx.fillStyle='rgba(10,20,40,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,190);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('wingsuit_final_dist','You flew {d}m').replace('{d}',Math.floor(dist)),W/2,225);
    ctx.fillText(I18N.t('restart_hint2','Tap or key to restart'),W/2,258);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  spd=5+dist/200;
  dist+=spd*0.12*dt;
  if(dist>best)best=dist;

  // steering
  if(touchTargetY!==null){
    const diff=touchTargetY-flyer.y;
    flyer.vy+=diff*0.01*dt;
    flyer.vy*=0.9;
  } else {
    if(keys.up)flyer.vy-=0.6*dt;
    if(keys.down)flyer.vy+=0.6*dt;
    flyer.vy*=0.96;
    flyer.vy+=0.05*dt; // slight gravity pull
  }
  flyer.y+=flyer.vy*dt;
  flyer.angle=Math.max(-0.5,Math.min(0.5,flyer.vy*0.08));

  if(flyer.y<20){flyer.y=20;flyer.vy=0;}
  if(flyer.y>H-20){flyer.y=H-20;flyer.vy=0;}

  rockTimer+=dt;
  if(rockTimer>=1){
    rockTimer=0;
  }
  rocks.forEach(r=>r.x-=spd*dt);
  rocks=rocks.filter(r=>r.x>-80);
  if(rocks.length===0||rocks[rocks.length-1].x<W-260)spawnRock(W+40);

  const flyerHit={x:flyer.x-20,y:flyer.y-10,w:40,h:20};
  rocks.forEach(r=>{
    drawRock(r);
    const top={x:r.x,y:0,w:r.w,h:r.gapY};
    const bot={x:r.x,y:r.gapY+r.gapH,w:r.w,h:H-(r.gapY+r.gapH)};
    if(!gameOver&&(rectsOverlap(flyerHit,top)||rectsOverlap(flyerHit,bot))){
      gameOver=true;
      if(dist>best){best=dist;}
      localStorage.setItem('wingsuitflight_best',String(best));
      SFX.lose();
      for(let i=0;i<16;i++)particles.push({x:flyer.x,y:flyer.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30});
    }
    if(!r.passed && r.x+r.w<flyer.x){
      r.passed=true;
      SFX.point();
    }
  });

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.fillStyle='rgba(255,200,150,'+(p.life/30)+')';ctx.fillRect(p.x,p.y,4,4);});

  drawFlyer();
  updateHud();
  requestAnimationFrame(loop);
}
reset();
updateHud();
loop();
</script></body></html>
