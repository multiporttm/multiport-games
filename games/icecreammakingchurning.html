<style>
body{background:#2a1a2e}
#c{background:#ffe9f2;display:block;border-radius:8px;margin:0 auto}
#score-display{color:#ff8fb3;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#churnBtn{display:block;margin:10px auto 0;padding:14px 40px;font-size:1.1rem;font-weight:800;border:none;border-radius:30px;background:#ff6fa5;color:#fff;cursor:pointer;box-shadow:0 4px 0 #c44b7f;user-select:none;touch-action:none}

<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Cream Making Churning</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
    <button id="churnBtn">🍦 HOLD TO CRANK</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and hold <b>Space</b>, <b>click</b>, or <b>hold the crank button</b> to turn the churn. Keep the speed needle inside the green safe zone until the batch is done — crank too fast and it turns grainy, too slow and it stays soupy. Batches get bigger each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const HI_KEY='icecreammakingchurning_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,speed=0,target=0,fillGoal=0,fillProgress=0,grainy=0,soupy=0,life=100,gameOver=false,win=false,holding=false,shake=0,particles=[];
const SAFE_HALF=14;

function newRound(){
  target=45+Math.random()*10; // safe center
  fillGoal=60+round*22;
  fillProgress=0;
  grainy=0;soupy=0;life=100;speed=0;gameOver=false;win=false;shake=0;particles=[];
}
newRound();

function resetGame(){round=1;hi=Math.max(hi,0);newRound();}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();holding=true;if(gameOver)restart();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
const btn=document.getElementById('churnBtn');
function press(e){e.preventDefault();holding=true;if(gameOver)restart();}
function release(e){e.preventDefault();holding=false;}
btn.addEventListener('mousedown',press);btn.addEventListener('mouseup',release);btn.addEventListener('mouseleave',release);
btn.addEventListener('touchstart',press,{passive:false});btn.addEventListener('touchend',release,{passive:false});
c.addEventListener('mousedown',press);c.addEventListener('mouseup',release);
c.addEventListener('touchstart',press,{passive:false});c.addEventListener('touchend',release,{passive:false});

function restart(){
  if(win){round++;}
  else {round=1;}
  newRound();
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=I18N.t('round_hi_label','Round: {r} | Hi: {h}').replace('{r}',round).replace('{h}',hi);
}

let lastT=null;
function loop(t){
  if(lastT===null)lastT=t;
  const dt=Math.min((t-lastT)/16.6667,3);
  lastT=t;

  if(!gameOver){
    // speed physics: holding accelerates, releasing decays
    if(holding)speed+=1.1*dt;else speed-=1.6*dt;
    speed=Math.max(0,Math.min(100,speed));

    const diff=speed-target;
    if(Math.abs(diff)<=SAFE_HALF){
      fillProgress+=0.55*dt;
      if(Math.random()<0.1)particles.push({x:400+(Math.random()-0.5)*120,y:160,vy:-1.5-Math.random(),life:30});
    } else if(diff>SAFE_HALF){
      grainy+=0.35*dt*(diff-SAFE_HALF)/10;
      life-=0.25*dt*(diff-SAFE_HALF)/10;
    } else {
      soupy+=0.25*dt*(SAFE_HALF-diff)/10;
      life-=0.15*dt*(SAFE_HALF-diff)/10;
    }
    if(life<0)life=0;
    if(life<=0){gameOver=true;win=false;shake=12;SFX.fail();}
    if(fillProgress>=fillGoal){
      gameOver=true;win=true;shake=8;SFX.success();
      if(round>hi){hi=round;localStorage.setItem(HI_KEY,String(hi));}
    }
    particles.forEach(p=>{p.y+=p.vy*dt;p.life-=dt;});
    particles=particles.filter(p=>p.life>0);
  }

  draw();
  updateScoreDisplay();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.9;if(shake<0.5)shake=0;}
  // background
  const g=ctx.createLinearGradient(0,0,0,300);
  g.addColorStop(0,'#ffd6e8');g.addColorStop(1,'#ffc1dd');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,840,340);

  // churn machine body
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#e0a0bf';ctx.lineWidth=4;
  roundRect(260,70,280,160,20);ctx.fill();ctx.stroke();
  // ice cream fill level inside drum
  const drumX=280,drumY=90,drumW=240,drumH=110;
  ctx.save();
  ctx.beginPath();ctx.rect(drumX,drumY,drumW,drumH);ctx.clip();
  ctx.fillStyle='#fff3e0';
  const pct=Math.min(1,fillProgress/fillGoal);
  const fillH=drumH*pct;
  const grainMix=Math.min(1,grainy/20),soupMix=Math.min(1,soupy/20);
  ctx.fillStyle=mixColor(grainMix,soupMix);
  ctx.fillRect(drumX,drumY+drumH-fillH,drumW,fillH);
  // churn paddle spin visual
  ctx.save();
  ctx.translate(drumX+drumW/2,drumY+drumH/2);
  ctx.rotate((speed*0.08)%(Math.PI*2)*(holding?1:0.3));
  ctx.strokeStyle='#c77aa0';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-60,0);ctx.lineTo(60,0);ctx.moveTo(0,-60);ctx.lineTo(0,60);ctx.stroke();
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle='#e0a0bf';ctx.lineWidth=3;ctx.strokeRect(drumX,drumY,drumW,drumH);

  particles.forEach(p=>{ctx.fillStyle='rgba(255,255,255,'+(p.life/30)+')';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});

  // crank handle visual
  ctx.strokeStyle='#8a5a6a';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(540,150);ctx.lineTo(560+Math.sin(speed*0.3)*18,150+Math.cos(speed*0.3)*18);ctx.stroke();
  ctx.fillStyle='#ff6fa5';ctx.beginPath();ctx.arc(560+Math.sin(speed*0.3)*18,150+Math.cos(speed*0.3)*18,10,0,7);ctx.fill();

  // speed gauge
  drawGauge();

  // life bar
  ctx.fillStyle='#444';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('quality_label','Batch Quality'),40,250);
  ctx.fillStyle='#ddd';ctx.fillRect(40,258,200,16);
  const lc=life>50?'#5ccb5f':life>20?'#ffb84d':'#ff5c5c';
  ctx.fillStyle=lc;ctx.fillRect(40,258,200*(life/100),16);
  ctx.strokeStyle='#999';ctx.strokeRect(40,258,200,16);

  // fill progress bar
  ctx.fillStyle='#444';ctx.fillText(I18N.t('batch_label','Batch Fill'),560,250);
  ctx.fillStyle='#ddd';ctx.fillRect(560,258,200,16);
  ctx.fillStyle='#8fd3ff';ctx.fillRect(560,258,200*Math.min(1,fillProgress/fillGoal),16);
  ctx.strokeStyle='#999';ctx.strokeRect(560,258,200,16);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-20,-20,840,340);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    if(win){
      ctx.fillText(I18N.t('round_complete','Round Complete!'),400,130);
      ctx.font='18px Arial';ctx.fillText(I18N.t('next_round_hint','Tap / Space / Click to start next round'),400,165);
    } else {
      ctx.fillText(I18N.t('batch_ruined','Batch Ruined!'),400,130);
      ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint2','Tap / Space / Click to try again'),400,165);
    }
  }
  ctx.restore();
}

function mixColor(grainMix,soupMix){
  // base creamy white, shift toward yellowish-grainy or watery-soupy
  const r=255-soupMix*30;
  const g=243-grainMix*40-soupMix*10;
  const b=224-grainMix*90+soupMix*15;
  return 'rgb('+Math.max(0,Math.min(255,r))+','+Math.max(0,Math.min(255,g))+','+Math.max(0,Math.min(255,b))+')';
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawGauge(){
  const cx=120,cy=190,r=70;
  ctx.save();
  ctx.translate(cx,cy);
  // arc background 180 deg (-180 to 0 mapped to speed 0-100)
  ctx.lineWidth=16;
  ctx.strokeStyle='#eee';
  ctx.beginPath();ctx.arc(0,0,r,Math.PI,2*Math.PI);ctx.stroke();
  // safe zone
  const a0=Math.PI+Math.PI*((target-SAFE_HALF)/100);
  const a1=Math.PI+Math.PI*((target+SAFE_HALF)/100);
  ctx.strokeStyle='#7fe08a';
  ctx.beginPath();ctx.arc(0,0,r,a0,a1);ctx.stroke();
  // needle
  const na=Math.PI+Math.PI*(speed/100);
  ctx.strokeStyle='#ff6fa5';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(na)*r*0.85,Math.sin(na)*r*0.85);ctx.stroke();
  ctx.fillStyle='#8a5a6a';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#444';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('speed_label','SPEED'),120,270);
}

requestAnimationFrame(loop);
</script></body></html>
