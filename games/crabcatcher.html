<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#f4d35e,#0496ff);display:block;border-radius:8px;touch-action:none}
#score-display{color:#f4d35e;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Crab Catcher</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Time: 45</div>
    <canvas id="c" width="800" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or <b>tap</b> crabs the instant they pop out of the sand holes before they scuttle sideways and duck back down. Watch for the rare fast <b>golden crab</b> worth bonus points! You have <b>45 seconds</b>.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=480;
let hi=parseInt(localStorage.getItem('crabcatcher_hi')||'0',10);
let score=0,timeLeft=45,gameOver=false,started=false;

const COLS=5,ROWS=3;
const marginX=90,marginY=110,cellW=(W-marginX*2)/(COLS-1),cellH=(H-marginY*2-40)/(ROWS-1);
const holes=[];
for(let r=0;r<ROWS;r++){
  for(let cIdx=0;cIdx<COLS;cIdx++){
    holes.push({x:marginX+cIdx*cellW,y:marginY+r*cellH,idx:r*COLS+cIdx});
  }
}

// crab state per hole: null or {phase:'rising'|'up'|'moving'|'ducking', t, dur, sideOffset, golden, caught}
let crabs=new Array(holes.length).fill(null);
let spawnTimer=0;
let lastTime=null;

function reset(){
  score=0;timeLeft=45;gameOver=false;started=false;crabs=new Array(holes.length).fill(null);spawnTimer=0;lastTime=null;
}

function spawnCrab(){
  const freeIdx=[];
  crabs.forEach((cr,i)=>{if(!cr)freeIdx.push(i);});
  if(freeIdx.length===0)return;
  const idx=freeIdx[Math.floor(Math.random()*freeIdx.length)];
  const golden=Math.random()<0.12;
  crabs[idx]={
    phase:'rising',t:0,dur:0.25,
    sideOffset:0,
    sideTarget:(Math.random()<0.5?-1:1)*(20+Math.random()*20),
    upDur: golden? 0.55+Math.random()*0.3 : 0.9+Math.random()*0.9,
    golden,
    caught:false
  };
}

function catchAt(x,y){
  if(!started||gameOver){ if(gameOver){reset();started=true;} return; }
  for(let i=0;i<holes.length;i++){
    const cr=crabs[i];
    if(!cr||cr.caught)continue;
    if(cr.phase==='rising'||cr.phase==='up'||cr.phase==='moving'){
      const h=holes[i];
      const cx=h.x+cr.sideOffset, cy=h.y-18;
      const dx=x-cx, dy=y-cy;
      if(dx*dx+dy*dy < 40*40){
        cr.caught=true;
        cr.phase='caught';
        cr.t=0;
        const pts=cr.golden?25:10;
        score+=pts;
        if(cr.golden){SFX.coin();}else{SFX.catch();}
        return;
      }
    }
  }
}

function getPos(e){
  const rect=c.getBoundingClientRect();
  const sx=W/rect.width, sy=H/rect.height;
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*sx,y:cy*sy};
}

c.addEventListener('mousedown',e=>{
  if(!started){started=true;lastTime=null;return;}
  const p=getPos(e);catchAt(p.x,p.y);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;lastTime=null;return;}
  const p=getPos(e);catchAt(p.x,p.y);
},{passive:false});

function drawSand(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#f4d35e');g.addColorStop(1,'#e8b95e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // waterline
  ctx.fillStyle='rgba(4,150,255,0.35)';
  ctx.fillRect(0,0,W,50);
}

function drawHole(h){
  ctx.beginPath();
  ctx.ellipse(h.x,h.y,32,14,0,0,Math.PI*2);
  ctx.fillStyle='#5a3d1e';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(h.x,h.y,24,9,0,0,Math.PI*2);
  ctx.fillStyle='#3d2712';
  ctx.fill();
}

function drawCrab(h,cr,riseAmt){
  const x=h.x+cr.sideOffset;
  const y=h.y-18*riseAmt;
  ctx.save();
  ctx.translate(x,y);
  const body=cr.golden?'#ffd700':'#e94560';
  const dark=cr.golden?'#c9a600':'#a52d43';
  // legs
  ctx.strokeStyle=dark;ctx.lineWidth=3;
  for(let i=-2;i<=2;i++){
    if(i===0)continue;
    ctx.beginPath();ctx.moveTo(i*6,4);ctx.lineTo(i*9,14);ctx.stroke();
  }
  // body
  ctx.fillStyle=body;
  ctx.beginPath();ctx.ellipse(0,0,20,13,0,0,Math.PI*2);ctx.fill();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-8,-10,4,0,Math.PI*2);ctx.arc(8,-10,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-8,-10,2,0,Math.PI*2);ctx.arc(8,-10,2,0,Math.PI*2);ctx.fill();
  // claws
  ctx.fillStyle=body;
  ctx.beginPath();ctx.ellipse(-20,-2,7,5,0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(20,-2,7,5,-0.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function updateScore(){
  document.getElementById('score-display').textContent =
    I18N.t('crab_score_label','Score: {s} | Hi: {h} | Time: {t}').replace('{s}',score).replace('{h}',hi).replace('{t}',Math.ceil(timeLeft));
}
updateScore();

function loop(){
  ctx.clearRect(0,0,W,H);
  drawSand();
  holes.forEach(drawHole);

  if(!started){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('crab_start_hint','Tap / Click to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('time_up_title',"TIME'S UP!"),W/2,H/2-30);
    ctx.font='24px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),W/2,H/2+10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint3','Tap / Click to play again'),W/2,H/2+48);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1/60:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  timeLeft-=dt;
  if(timeLeft<=0){
    timeLeft=0;gameOver=true;
    if(score>hi){hi=score;localStorage.setItem('crabcatcher_hi',hi);}
    SFX.lose();
  }

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnCrab();
    spawnTimer=0.5+Math.random()*0.6;
  }

  for(let i=0;i<crabs.length;i++){
    const cr=crabs[i];
    if(!cr)continue;
    cr.t+=dt;
    if(cr.phase==='rising'){
      const p=Math.min(1,cr.t/cr.dur);
      drawCrab(holes[i],cr,p);
      if(p>=1){cr.phase='up';cr.t=0;}
    } else if(cr.phase==='up'){
      drawCrab(holes[i],cr,1);
      if(cr.t>cr.upDur*0.3){cr.phase='moving';cr.t=0;}
    } else if(cr.phase==='moving'){
      const p=Math.min(1,cr.t/(cr.upDur*0.4));
      cr.sideOffset=cr.sideTarget*p;
      drawCrab(holes[i],cr,1);
      if(p>=1){cr.phase='ducking';cr.t=0;}
    } else if(cr.phase==='ducking'){
      const p=Math.min(1,cr.t/0.25);
      drawCrab(holes[i],cr,1-p);
      if(p>=1){crabs[i]=null;}
    } else if(cr.phase==='caught'){
      const p=Math.min(1,cr.t/0.25);
      ctx.save();ctx.globalAlpha=1-p;
      drawCrab(holes[i],cr,1-p*0.5);
      ctx.restore();
      if(p>=1){crabs[i]=null;}
    }
  }

  updateScore();
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
