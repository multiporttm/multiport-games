<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a237e,#5c6bc0);display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8eaf6;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#duckBtn{display:block;margin:6px auto 0;padding:10px 26px;background:#ff7043;border:none;border-radius:20px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;user-select:none;touch-action:none}
#duckBtn:active{background:#e64a19}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Coaster Ride</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Combo: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
    <button id="duckBtn">DUCK</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap the track or press <b>Space</b> when you see <b>HANDS UP!</b> for bonus points. Hold <b>Down Arrow</b> or the <b>DUCK</b> button to dodge the low bars. Miss a prompt and lose your combo — hit a bar and lose a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let hi=parseInt(localStorage.getItem('coasterride_hi')||'0',10);
let score=0,combo=0,lives=3,gameOver=false,started=false;
let worldX=0,speed=4,lastTime=null;
let ducking=false;
let events=[],nextEventX=300;
let flashMsg='',flashTimer=0,flashColor='#fff';

function trackY(x){
  return 210+Math.sin(x/230)*70+Math.sin(x/85)*22;
}

function reset(){
  score=0;combo=0;lives=3;gameOver=false;started=false;worldX=0;speed=4;lastTime=null;ducking=false;events=[];nextEventX=300;flashMsg='';flashTimer=0;
}

function genEventsAhead(){
  while(nextEventX<worldX+W+400){
    const type=Math.random()<0.62?'drop':'obstacle';
    events.push({x:nextEventX,type,resolved:false,missed:false,active:false});
    nextEventX+=320+Math.random()*220;
  }
}

function flash(msg,color){flashMsg=msg;flashColor=color;flashTimer=40;}

function handAction(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const cartWorldX=worldX+150;
  let hit=false;
  for(const ev of events){
    if(ev.type!=='drop'||ev.resolved)continue;
    if(Math.abs(ev.x-cartWorldX)<55){
      ev.resolved=true;hit=true;
      combo++;
      score+=20+combo*3;
      SFX.point();
      flash(I18N.t('coaster_nice','NICE!'),'#ffeb3b');
      break;
    }
  }
  if(!hit)SFX.click&&SFX.click();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();handAction();}
  if(e.code==='ArrowDown'){e.preventDefault();ducking=true;}
});
document.addEventListener('keyup',e=>{if(e.code==='ArrowDown')ducking=false;});

c.addEventListener('mousedown',handAction);
c.addEventListener('touchstart',e=>{e.preventDefault();handAction();},{passive:false});

const duckBtn=document.getElementById('duckBtn');
function duckOn(e){e.preventDefault();ducking=true;}
function duckOff(e){e.preventDefault();ducking=false;}
duckBtn.addEventListener('mousedown',duckOn);
duckBtn.addEventListener('mouseup',duckOff);
duckBtn.addEventListener('mouseleave',duckOff);
duckBtn.addEventListener('touchstart',duckOn,{passive:false});
duckBtn.addEventListener('touchend',duckOff,{passive:false});

function drawTrack(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a237e');grad.addColorStop(1,'#5c6bc0');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ffca28';ctx.lineWidth=4;ctx.beginPath();
  for(let sx=0;sx<=W;sx+=8){
    const wx=worldX+sx;
    const y=trackY(wx);
    if(sx===0)ctx.moveTo(sx,y);else ctx.lineTo(sx,y);
  }
  ctx.stroke();
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=10;ctx.globalAlpha=0.5;
  ctx.beginPath();
  for(let sx=0;sx<=W;sx+=8){
    const wx=worldX+sx;
    const y=trackY(wx)+8;
    if(sx===0)ctx.moveTo(sx,y);else ctx.lineTo(sx,y);
  }
  ctx.stroke();ctx.globalAlpha=1;
}

function drawCart(){
  const cartWorldX=worldX+150;
  const y=trackY(cartWorldX);
  const h=ducking?16:28;
  ctx.save();
  ctx.translate(150,y-h);
  ctx.fillStyle='#e53935';
  ctx.fillRect(-22,0,44,h);
  ctx.fillStyle='#263238';
  ctx.beginPath();ctx.arc(-14,h,7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(14,h,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc80';
  ctx.beginPath();ctx.arc(0,-8,10,0,Math.PI*2);ctx.fill();
  if(!ducking){
    ctx.strokeStyle='#ffcc80';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-4,-16);ctx.lineTo(-10,-30);ctx.moveTo(4,-16);ctx.lineTo(10,-30);ctx.stroke();
  }
  ctx.restore();
  return {x:150,y:y-h,w:44,h:h};
}

function drawEvents(cartBox){
  const cartWorldX=worldX+150;
  events.forEach(ev=>{
    const sx=ev.x-worldX;
    if(sx<-80||sx>W+80)return;
    if(ev.type==='drop'){
      const y=trackY(ev.x)-70;
      ctx.fillStyle=ev.resolved?'#ffffff55':'#ffeb3b';
      ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('coaster_handsup','HANDS UP!'),sx,y);
      if(!ev.resolved&&Math.abs(ev.x-cartWorldX)<55)ev.active=true;
      if(!ev.resolved&&ev.active&&ev.x-cartWorldX<-55){
        ev.resolved=true;ev.missed=true;
        combo=0;
        flash(I18N.t('coaster_missed','MISSED!'),'#ef5350');
        SFX.error();
      }
    } else {
      const barY=trackY(ev.x)-46;
      ctx.fillStyle='#8d6e63';
      ctx.fillRect(sx-30,barY-8,60,14);
      ctx.fillStyle='#5d4037';
      ctx.fillRect(sx-34,barY-14,8,26);
      ctx.fillRect(sx+26,barY-14,8,26);
      if(!ev.resolved&&Math.abs(ev.x-cartWorldX)<26){
        const barBox={x:sx-30,y:barY-8,w:60,h:14};
        const overlap=cartBox.x<barBox.x+barBox.w&&cartBox.x+cartBox.w>barBox.x&&cartBox.y<barBox.y+barBox.h&&cartBox.y+cartBox.h>barBox.y;
        if(overlap&&!ducking){
          ev.resolved=true;lives--;combo=0;
          flash(I18N.t('coaster_ouch','OUCH!'),'#ef5350');
          SFX.hit();
          if(lives<=0){gameOver=true;SFX.lose();}
        } else if(ev.x-cartWorldX<-26&&!ev.resolved){
          ev.resolved=true;
          if(ducking){score+=15;combo++;flash(I18N.t('coaster_ducked','DUCKED!'),'#66bb6a');SFX.point();}
        }
      }
    }
  });
  events=events.filter(ev=>ev.x-cartWorldX>-500);
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('coaster_status','Score: {s} | Combo: {c} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{c}',combo).replace('{l}',lives).replace('{h}',hi);
}

function loop(){
  if(!started){
    drawTrack();drawCart();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('coaster_start','Tap or Space to board'),W/2,60);
    updateScoreDisplay();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawTrack();drawCart();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('coaster_final','Final Score: {s}').replace('{s}',score),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
    updateScoreDisplay();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  speed=4+score/250;
  worldX+=speed*dt;
  if(score>hi){hi=score;localStorage.setItem('coasterride_hi',String(hi));}

  genEventsAhead();
  drawTrack();
  const cartBox=drawCart();
  drawEvents(cartBox);

  if(flashTimer>0){
    flashTimer-=dt;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashColor;ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,80);
    ctx.globalAlpha=1;
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
