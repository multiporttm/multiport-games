<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b2a38;display:block;border-radius:8px;cursor:crosshair}
#hud{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#9fd8ff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px}
#hud span.lives{color:#ff6b6b}
#hud span.lvl{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Submarine Hull Inspection</div>
  <div class="game-frame">
    <div id="hud">
      <span id="score-display">Score: 0 | Hi: 0</span>
      <span class="lvl" id="lvl-display">Section: 1</span>
      <span class="lives" id="lives-display">Lives: ●●●</span>
      <span id="time-display">Time: 45</span>
    </div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap the hull panel to scan it for stress cracks and corrosion. Find every defect before the dry-dock clock runs out. Wrong scans cost a life — later hull sections are larger with subtler damage.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const scoreEl=document.getElementById('score-display');
const lvlEl=document.getElementById('lvl-display');
const livesEl=document.getElementById('lives-display');
const timeEl=document.getElementById('time-display');

let score=0,hi=0,lives=3,level=1,timeLeft=45,found=0,defects=[],gameOver=false,won=false,started=false,lastTime=null,flashUntil=0,flashMsg='',rivets=[];

try{hi=parseInt(localStorage.getItem('submarinehullinspection_hi')||'0',10)||0;}catch(e){}

function saveHi(){
  if(score>hi){hi=score;try{localStorage.setItem('submarinehullinspection_hi',String(Math.floor(hi)));}catch(e){}}
}

function plateDims(){
  const cols=3+Math.min(3,Math.floor((level-1)/1));
  const rows=2+Math.min(2,Math.floor((level-1)/2));
  return {cols:Math.min(6,cols),rows:Math.min(4,rows)};
}

function genRivets(){
  rivets=[];
  const {cols,rows}=plateDims();
  const pw=W/cols,ph=H/rows;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    rivets.push({x:col*pw+10,y:r*ph+10});
    rivets.push({x:col*pw+pw-10,y:r*ph+10});
    rivets.push({x:col*pw+10,y:r*ph+ph-10});
    rivets.push({x:col*pw+pw-10,y:r*ph+ph-10});
  }
}

function genDefects(){
  defects=[];
  const n=Math.min(10,3+level);
  const sizeMul=Math.max(0.45,1-level*0.07);
  for(let i=0;i<n;i++){
    let x,y,tries=0;
    do{
      x=30+Math.random()*(W-60);
      y=30+Math.random()*(H-60);
      tries++;
    }while(defects.some(d=>Math.hypot(d.x-x,d.y-y)<60)&&tries<50);
    const type=Math.random()<0.5?'crack':'corrosion';
    defects.push({x,y,type,r:(10+Math.random()*8)*sizeMul,found:false,rot:Math.random()*Math.PI*2,seed:Math.random()*1000});
  }
}

function newLevel(){
  found=0;
  genRivets();
  genDefects();
  timeLeft=Math.max(20,45-level*2);
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;lastTime=null;
  newLevel();
}
reset();

function flash(msg,ms){flashMsg=msg;flashUntil=performance.now()+ (ms||700);}

function drawHullBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#223a4d');g.addColorStop(1,'#152433');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const {cols,rows}=plateDims();
  const pw=W/cols,ph=H/rows;
  ctx.strokeStyle='rgba(150,200,230,0.25)';ctx.lineWidth=2;
  for(let col=1;col<cols;col++){ctx.beginPath();ctx.moveTo(col*pw,0);ctx.lineTo(col*pw,H);ctx.stroke();}
  for(let r=1;r<rows;r++){ctx.beginPath();ctx.moveTo(0,r*ph);ctx.lineTo(W,r*ph);ctx.stroke();}
  ctx.fillStyle='#8aa8bc';
  rivets.forEach(rv=>{ctx.beginPath();ctx.arc(rv.x,rv.y,3.5,0,Math.PI*2);ctx.fill();});
  // subtle plate sheen streaks
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
  for(let i=0;i<20;i++){
    ctx.beginPath();
    const yy=(i*37)%H;
    ctx.moveTo(0,yy);ctx.lineTo(W,yy+10);
    ctx.stroke();
  }
}

function drawCrack(d){
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.rotate(d.rot);
  ctx.strokeStyle=d.found?'rgba(80,220,120,0.95)':'rgba(10,12,14,0.85)';
  ctx.lineWidth=d.found?3:2;
  ctx.beginPath();
  let cx=0,cy=0;
  ctx.moveTo(cx,cy);
  const segs=5;
  for(let i=0;i<segs;i++){
    const ang=(Math.random()-0.5)*1.2+ (i%2===0?0.3:-0.3);
    const len=d.r*0.5;
    cx+=Math.cos(ang)*len*0.5;
    cy+=Math.sin(ang)*len;
    ctx.lineTo(cx,cy);
  }
  ctx.stroke();
  if(d.found){
    ctx.strokeStyle='rgba(80,220,120,0.5)';
    ctx.lineWidth=8;
    ctx.beginPath();ctx.arc(0,0,d.r+6,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawCorrosion(d){
  ctx.save();
  ctx.translate(d.x,d.y);
  const grad=ctx.createRadialGradient(0,0,1,0,0,d.r);
  if(d.found){
    grad.addColorStop(0,'rgba(80,220,120,0.9)');
    grad.addColorStop(1,'rgba(80,220,120,0)');
  }else{
    grad.addColorStop(0,'rgba(150,100,40,0.55)');
    grad.addColorStop(0.6,'rgba(110,70,30,0.35)');
    grad.addColorStop(1,'rgba(110,70,30,0)');
  }
  ctx.fillStyle=grad;
  ctx.beginPath();
  for(let a=0;a<Math.PI*2;a+=0.5){
    const rr=d.r*(0.7+0.3*Math.sin(a*3+d.seed));
    const px=Math.cos(a)*rr,py=Math.sin(a)*rr;
    if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawDefects(){
  defects.forEach(d=>{ d.type==='crack'?drawCrack(d):drawCorrosion(d); });
}

function allFound(){return defects.every(d=>d.found);}

function handleHit(x,y){
  if(gameOver)return;
  if(!started){started=true;lastTime=performance.now();requestAnimationFrame(loop);}
  let hit=null;
  for(const d of defects){
    if(!d.found&&Math.hypot(d.x-x,d.y-y)<=d.r+8){hit=d;break;}
  }
  if(hit){
    hit.found=true;found++;
    score+=Math.max(5,20-level);
    SFX.success();
    flash(I18N.t('defect_found','DEFECT MARKED'),500);
    if(allFound()){
      SFX.levelup();
      score+=30;
      saveHi();
      level++;
      flash(I18N.t('section_clear','SECTION CLEAR!'),900);
      setTimeout(()=>{ if(!gameOver) newLevel(); },500);
    }
  }else{
    lives--;
    SFX.error();
    flash(I18N.t('miss_label','MISS'),500);
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      saveHi();
    }
  }
}

function pos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  const p=pos(e);handleHit(p.x,p.y);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver){reset();return;}
  const p=pos(e);handleHit(p.x,p.y);
},{passive:false});

let kbX=W/2,kbY=H/2;
document.addEventListener('keydown',e=>{
  if(gameOver&&e.code==='Space'){e.preventDefault();reset();return;}
  const step=24;
  if(e.code==='ArrowLeft'){kbX=Math.max(0,kbX-step);e.preventDefault();}
  else if(e.code==='ArrowRight'){kbX=Math.min(W,kbX+step);e.preventDefault();}
  else if(e.code==='ArrowUp'){kbY=Math.max(0,kbY-step);e.preventDefault();}
  else if(e.code==='ArrowDown'){kbY=Math.min(H,kbY+step);e.preventDefault();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!started){started=true;lastTime=performance.now();requestAnimationFrame(loop);}handleHit(kbX,kbY);}
});

function updateHud(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(Math.max(hi,score)));
  lvlEl.textContent=I18N.t('section_label','Section: {n}').replace('{n}',level);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives)));
  timeEl.textContent=I18N.t('time_label','Time: {t}').replace('{t}',Math.ceil(Math.max(0,timeLeft)));
}

function loop(now){
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;
  ctx.clearRect(0,0,W,H);
  drawHullBg();
  drawDefects();

  if(started&&!gameOver){
    timeLeft-=dt;
    if(timeLeft<=0){
      gameOver=true;
      SFX.lose();
      saveHi();
    }
  }

  // crosshair for keyboard
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(kbX-10,kbY);ctx.lineTo(kbX+10,kbY);ctx.moveTo(kbX,kbY-10);ctx.lineTo(kbX,kbY+10);ctx.stroke();
  ctx.restore();

  if(performance.now()<flashUntil){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,50);
  }

  if(!started){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#9fd8ff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to begin inspection'),W/2,H/2);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','INSPECTION FAILED'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Space to restart'),W/2,H/2+20);
  }

  updateHud();
  requestAnimationFrame(loop);
}
updateHud();
drawHullBg();
drawDefects();
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#9fd8ff';ctx.font='bold 26px Arial';ctx.textAlign='center';
ctx.fillText(I18N.t('start_hint','Click / Tap / Space to begin inspection'),W/2,H/2);
</script></body></html>
