<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8ecae6;display:block;border-radius:8px}
#score-display{color:#219ebc;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wind Turbine Repair</div>
  <div class="game-frame">
    <div id="score-display">Repaired: 0 | Lives: 3</div>
    <canvas id="c" width="500" height="560"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b> or touch-drag to climb the turbine tower before the damage meter maxes out. At the top, hold to tighten the bolt in the <b>timing zone</b> to complete the repair!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=560;
let repaired=0,lives=3,gameOver=false,started=false;
let towerHeight,climberY,climberX,damage,damageRate,phase,tighten,tightenDir,tightenHold,keys;

function reset(){
  towerHeight=400+repaired*40;
  climberY=H-40;
  climberX=W/2;
  damage=0;
  damageRate=0.12+repaired*0.01;
  phase='climb';
  tighten=0;tightenDir=1;tightenHold=false;
  keys={};
}
reset();

function updateHUD(){
  document.getElementById('score-display').textContent=I18N.t('repaired_lives_label','Repaired: {n} | Lives: {l}').replace('{n}',repaired).replace('{l}',Math.max(0,lives));
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.code==='Space'){e.preventDefault(); if(!started)started=true; if(gameOver)restart(); if(phase==='repair')tightenHold=true;}
});
document.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.code==='Space')tightenHold=false;
});
c.addEventListener('pointerdown',e=>{
  if(!started){started=true;return;}
  if(gameOver){restart();return;}
  if(phase==='repair')tightenHold=true;
});
c.addEventListener('pointerup',()=>{tightenHold=false;});
let dragStartX=null;
c.addEventListener('pointermove',e=>{
  if(phase!=='climb'||!started||gameOver)return;
  if(dragStartX===null){dragStartX=e.offsetX;return;}
  climberX+=(e.offsetX-dragStartX)*0.6;
  dragStartX=e.offsetX;
});
c.addEventListener('pointerleave',()=>{dragStartX=null;});

function restart(){
  gameOver=false;repaired=0;lives=3;started=true;
  reset();
  updateHUD();
}

function loseLife(){
  lives--;
  SFX.error();
  updateHUD();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
  }else{
    reset();
  }
}

function drawTower(scrollY){
  ctx.save();
  const baseX=W/2;
  ctx.fillStyle='#8d99ae';
  ctx.fillRect(baseX-18,H-scrollY,36,towerHeight);
  ctx.fillStyle='#edf2f4';
  for(let i=0;i<towerHeight;i+=40){
    ctx.fillRect(baseX-18,H-scrollY-i,36,4);
  }
  // nacelle + blades at top
  const topY=H-scrollY-towerHeight;
  ctx.fillStyle='#edf2f4';
  ctx.fillRect(baseX-30,topY-14,60,20);
  ctx.strokeStyle='#fff';ctx.lineWidth=8;
  const bladeAngle=Date.now()/500;
  for(let i=0;i<3;i++){
    const a=bladeAngle+(i*Math.PI*2/3);
    ctx.beginPath();
    ctx.moveTo(baseX+40,topY-4);
    ctx.lineTo(baseX+40+Math.cos(a)*50,topY-4+Math.sin(a)*50);
    ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#219ebc');sky.addColorStop(1,'#8ecae6');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('repaired_best_label','Turbines repaired: {n}').replace('{n}',repaired),W/2,H/2+16);
    ctx.fillText(I18N.t('retry_hint2','Tap or Space to retry'),W/2,H/2+48);
    updateHUD();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint5','Tap, click, or press Space to start climbing'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  const scrollY=Math.min(climberY===H-40?0:H-40-climberY,towerHeight-40);

  if(phase==='climb'){
    damage+=damageRate;
    if(keys['ArrowLeft']||keys['a']||keys['A'])climberX-=3.2;
    if(keys['ArrowRight']||keys['d']||keys['D'])climberX+=3.2;
    if(keys['ArrowUp']||keys['w']||keys['W'])climberY-=2.4;
    if(keys['ArrowDown']||keys['s']||keys['S'])climberY+=2.4;
    climberX=Math.max(W/2-60,Math.min(W/2+60,climberX));
    climberY=Math.max(H-40-towerHeight,Math.min(H-40,climberY));

    if(climberX<W/2-40||climberX>W/2+40){
      // fell off tower
      loseLife();
    }
    if(damage>=100){
      loseLife();
    }
    if(H-40-climberY>=towerHeight-6){
      phase='repair';
      SFX.click();
    }
  }else if(phase==='repair'){
    tighten+=tightenDir*(1.6+repaired*0.1);
    if(tighten>=100){tighten=100;tightenDir=-1;}
    if(tighten<=0){tighten=0;tightenDir=1;}
    if(tightenHold){
      if(tighten>=42&&tighten<=58){
        repaired++;
        SFX.success();
        reset();
        started=true;
        updateHUD();
      }else{
        loseLife();
      }
    }
  }

  drawTower(scrollY);

  // damage meter
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(20,20,W-40,18);
  ctx.fillStyle=damage>70?'#e63946':'#ffb703';
  ctx.fillRect(20,20,(W-40)*(damage/100),18);
  ctx.strokeStyle='#fff';ctx.strokeRect(20,20,W-40,18);
  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('damage_label','Damage'),24,34);

  if(phase==='climb'){
    // draw climber near fixed screen position
    ctx.fillStyle='#e63946';
    ctx.beginPath();ctx.arc(climberX,H-40,12,0,Math.PI*2);ctx.fill();
  }else if(phase==='repair'){
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hold_tighten_hint','Hold to tighten in the green zone!'),W/2,H-140);
    const mx=W/2-150,my=H-110,mw=300,mh=24;
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(mx,my,mw,mh);
    ctx.fillStyle='#43aa8b';ctx.fillRect(mx+mw*0.42,my,mw*0.16,mh);
    ctx.fillStyle='#e63946';ctx.fillRect(mx+tighten/100*mw-3,my-6,6,mh+12);
    ctx.strokeStyle='#fff';ctx.strokeRect(mx,my,mw,mh);
  }

  updateHUD();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
