<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Real Estate Flip</title><meta name="description" content="Play Real Estate Flip free online — Each house has problem areas. Click a problem to fix it (cost is deducted, value is added) — click again to undo. Stay within budget and click Sell House when ready. Maximize your profit across houses!"><link rel="canonical" href="https://games.multiportllc.com/games/realestateflip"><meta property="og:title" content="Real Estate Flip - Multiport Games"><meta property="og:description" content="Play Real Estate Flip free online — Each house has problem areas. Click a problem to fix it (cost is deducted, value is added) — click again to undo. Stay within budget and click Sell House when ready. Maximize your profit across houses!"><meta property="og:url" content="https://games.multiportllc.com/games/realestateflip"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Real Estate Flip","description":"Play Real Estate Flip free online instantly. Each house has problem areas. Click a problem to fix it (cost is deducted, value is added) — click again to undo. Stay within budget and click Sell House when ready. Maximize your profit across houses! No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/realestateflip","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#0b0f14}
#wrap{max-width:640px;margin:0 auto;padding:10px}
#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#eee;font-weight:800;background:#16213e;border-radius:12px;padding:12px 16px;margin-bottom:12px}
#hud span{color:#ffd54f}
#house{background:linear-gradient(#87ceeb,#c7e8f7);border-radius:14px;padding:16px;text-align:center;position:relative}
#roundLabel{color:#1a1a2e;font-weight:900;font-size:1.15rem;margin-bottom:8px}
#problems{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.problem{background:#fff;border:3px solid #ddd;border-radius:12px;padding:10px 8px;cursor:pointer;transition:transform .12s,border-color .12s;user-select:none}
.problem:hover{transform:translateY(-2px)}
.problem.fixed{border-color:#4caf50;background:#eaffea}
.problem .icon{font-size:2rem}
.problem .name{font-weight:800;color:#222;font-size:.92rem;margin-top:4px}
.problem .cost{color:#e94560;font-weight:700;font-size:.85rem}
.problem .val{color:#2e7d32;font-weight:700;font-size:.85rem}
#budgetBar{background:#0003;border-radius:8px;height:22px;margin:10px 0;overflow:hidden;position:relative}
#budgetFill{background:linear-gradient(90deg,#4caf50,#8bc34a);height:100%;transition:width .2s}
#budgetFill.over{background:linear-gradient(90deg,#e94560,#ff6b35)}
#budgetText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1a1a2e;font-size:.85rem}
#sellBtn{background:#4caf50;color:#fff;border:none;padding:12px 28px;border-radius:24px;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:10px}
#sellBtn:disabled{opacity:.5;cursor:not-allowed}
#resultBox{background:#16213e;border-radius:12px;padding:16px;color:#fff;text-align:center;margin-top:12px}
#resultBox h3{color:#ffd54f;margin:0 0 6px}
#nextBtn{background:#e94560;color:#fff;border:none;padding:10px 24px;border-radius:20px;font-weight:800;cursor:pointer;margin-top:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Real Estate Flip</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <div>Round <span id="roundNum">1</span>/<span id="roundTotal">6</span></div>
        <div>Total Profit: <span id="totalProfit">$0</span></div>
        <div>Best: <span id="bestProfit">$0</span></div>
      </div>
      <div id="house">
        <div id="roundLabel">House Purchase Price: $0</div>
        <div id="problems"></div>
        <div id="budgetBar"><div id="budgetFill" style="width:0%"></div><div id="budgetText">$0 / $0</div></div>
        <button id="sellBtn">Sell House</button>
      </div>
      <div id="resultBox" style="display:none">
        <h3 id="resultTitle"></h3>
        <div id="resultDetail"></div>
        <button id="nextBtn">Next House</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each house has problem areas. Click a problem to fix it (cost is deducted, value is added) — click again to undo. Stay within budget and click <b>Sell House</b> when ready. Maximize your profit across houses!</div>
</div>
<script>
const PROBLEM_TYPES=[
 {icon:'🏚️',name:'Broken Roof'},
 {icon:'🍳',name:'Old Kitchen'},
 {icon:'🎨',name:'Bad Paint'},
 {icon:'🚿',name:'Leaky Plumbing'},
 {icon:'🔌',name:'Bad Wiring'},
 {icon:'🌿',name:'Overgrown Yard'},
 {icon:'🪟',name:'Cracked Windows'},
 {icon:'🧱',name:'Cracked Foundation'},
 {icon:'🛁',name:'Old Bathroom'},
 {icon:'🚪',name:'Broken Door'}
];
const TOTAL_ROUNDS=6;
let round=0,totalProfit=0,best=parseInt(localStorage.getItem('realestateflip_best')||'0',10);
let house,budget,spent,fixed;

document.getElementById('bestProfit').textContent='$'+best;
document.getElementById('roundTotal').textContent=TOTAL_ROUNDS;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function genHouse(r){
  const n=4+Math.min(3,Math.floor(r/2));
  const types=shuffle([...PROBLEM_TYPES]).slice(0,n);
  const difficulty=1+r*0.18;
  const problems=types.map(t=>{
    const cost=Math.round((300+Math.random()*900)*difficulty/10)*10;
    const roiFactor=0.6+Math.random()*1.3; // some good deals, some bad
    const value=Math.round(cost*roiFactor/10)*10;
    return {...t,cost,value,fixedFlag:false};
  });
  const purchase=Math.round((8000+r*2500+Math.random()*2000)/100)*100;
  const bud=Math.round((1500+r*450+Math.random()*600)/50)*50;
  return {purchase,problems,budget:bud};
}

function startRound(){
  house=genHouse(round);
  budget=house.budget;
  spent=0;
  document.getElementById('resultBox').style.display='none';
  document.getElementById('house').style.display='';
  document.getElementById('roundNum').textContent=(round+1);
  document.getElementById('roundLabel').textContent=`House Purchase Price: $${house.purchase.toLocaleString()}`;
  document.getElementById('sellBtn').disabled=false;
  renderProblems();
  updateBudget();
}

function renderProblems(){
  const el=document.getElementById('problems');
  el.innerHTML='';
  house.problems.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='problem'+(p.fixedFlag?' fixed':'');
    d.innerHTML=`<div class="icon">${p.icon}</div><div class="name">${I18N.t('problem_'+p.name.replace(/\s+/g,'_').toLowerCase(),p.name)}</div><div class="cost">-$${p.cost}</div><div class="val">+$${p.value} value</div>`;
    d.onclick=()=>toggleFix(i);
    el.appendChild(d);
  });
}

function toggleFix(i){
  const p=house.problems[i];
  if(!p.fixedFlag){
    if(spent+p.cost>budget){SFX.error();flashOver();return;}
    p.fixedFlag=true;spent+=p.cost;SFX.click();
  } else {
    p.fixedFlag=false;spent-=p.cost;SFX.click();
  }
  renderProblems();
  updateBudget();
}

function flashOver(){
  const bar=document.getElementById('budgetFill');
  bar.classList.add('over');
  setTimeout(()=>bar.classList.remove('over'),350);
}

function updateBudget(){
  const pct=Math.min(100,(spent/budget)*100);
  const fill=document.getElementById('budgetFill');
  fill.style.width=pct+'%';
  document.getElementById('budgetText').textContent=`$${spent} / $${budget}`;
}

document.getElementById('sellBtn').addEventListener('click',sellHouse);
function sellHouse(){
  const addedValue=house.problems.filter(p=>p.fixedFlag).reduce((s,p)=>s+p.value,0);
  const saleValue=house.purchase+addedValue;
  const profit=saleValue-house.purchase-spent;
  totalProfit+=profit;
  document.getElementById('totalProfit').textContent='$'+totalProfit;
  document.getElementById('sellBtn').disabled=true;
  document.getElementById('house').style.display='none';
  document.getElementById('resultBox').style.display='';
  const good=profit>0;
  if(good)SFX.success();else SFX.fail();
  document.getElementById('resultTitle').textContent=good?I18N.t('flip_profit','💰 Flipped for a profit!'):I18N.t('flip_loss','📉 That flip lost money.');
  document.getElementById('resultDetail').innerHTML=
    `${I18N.t('sale_value','Sale Value')}: $${saleValue.toLocaleString()}<br>`+
    `${I18N.t('spent_on_repairs','Spent on Repairs')}: $${spent.toLocaleString()}<br>`+
    `<b>${I18N.t('profit_label','Profit')}: ${profit>=0?'+':''}$${profit.toLocaleString()}</b>`;
  round++;
  document.getElementById('nextBtn').textContent=round>=TOTAL_ROUNDS?I18N.t('see_final','See Final Results'):I18N.t('next_house','Next House');
}

document.getElementById('nextBtn').addEventListener('click',()=>{
  if(round>=TOTAL_ROUNDS){
    if(totalProfit>best){best=totalProfit;localStorage.setItem('realestateflip_best',best);SFX.win();}
    document.getElementById('bestProfit').textContent='$'+best;
    document.getElementById('resultTitle').textContent=I18N.t('game_complete','🏁 Game Complete!');
    document.getElementById('resultDetail').innerHTML=`${I18N.t('final_profit','Total Profit')}: $${totalProfit.toLocaleString()}<br>${I18N.t('best_profit','Best Ever')}: $${best.toLocaleString()}`;
    document.getElementById('nextBtn').textContent=I18N.t('play_again','Play Again');
    round=0;totalProfit=0;
    document.getElementById('totalProfit').textContent='$0';
    document.getElementById('nextBtn').onclick=()=>{startRound();document.getElementById('nextBtn').onclick=defaultNext;};
    return;
  }
  startRound();
});
function defaultNext(){
  document.getElementById('nextBtn').removeEventListener;
}

startRound();
</script></body></html>
