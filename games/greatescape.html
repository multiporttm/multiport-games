<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#212121}
#ui{color:#e0e0e0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Great Escape</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Level: 1 | Escapes: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to sneak. Stay out of the guards' yellow vision cones and reach the green exit — get spotted and you're sent back to the start!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,guards,level,escapes,exitPos,state,keys={};

function init(){
  level=1;escapes=0;
  newLevel();
}

function newLevel(){
  player={x:20,y:H-20};
  exitPos={x:W-24,y:24};
  const guardCount=1+Math.floor(level/2);
  guards=[];
  for(let i=0;i<guardCount;i++){
    guards.push({
      x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),
      ang:Math.random()*Math.PI*2,turnSpeed:(Math.random()<0.5?1:-1)*0.012,
      coneLen:90+level*4,coneWidth:0.55,
    });
  }
  state='play';
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='caught')newLevel();});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function spotted(){
  for(const g of guards){
    const d=dist(player,g);
    if(d>g.coneLen)continue;
    const angToPlayer=Math.atan2(player.y-g.y,player.x-g.x);
    let diff=Math.abs(angToPlayer-g.ang);
    diff=Math.min(diff,Math.PI*2-diff);
    if(diff<g.coneWidth)return true;
  }
  return false;
}

function update(){
  if(state!=='play')return;
  const spd=2.4;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  guards.forEach(g=>{g.ang+=g.turnSpeed;});

  if(spotted()){
    state='caught';
    return;
  }

  if(dist(player,exitPos)<20){
    escapes++;level++;
    updateUI();
    newLevel();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#212121';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#66bb6a';
  ctx.fillRect(exitPos.x-14,exitPos.y-14,28,28);

  guards.forEach(g=>{
    ctx.save();
    ctx.translate(g.x,g.y);
    ctx.rotate(g.ang);
    ctx.fillStyle='rgba(255,235,59,.18)';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,g.coneLen,-g.coneWidth,g.coneWidth);
    ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle='#ffca28';
    ctx.beginPath();ctx.arc(g.x,g.y,11,0,Math.PI*2);ctx.fill();
  });

  ctx.fillStyle='#e0e0e0';
  ctx.beginPath();ctx.arc(player.x,player.y,10,0,Math.PI*2);ctx.fill();

  if(state==='caught'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('SPOTTED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Escapes: ${escapes}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Level: ${level} | Escapes: ${escapes}`;
}

init();draw();
</script></body></html>
