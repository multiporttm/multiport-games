<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Coin Runner</title><meta name="description" content="Play Coin Runner free online — Press Space or Up to jump, Down or S to slide. Dodge obstacles, collect coins, and beat your high score in this endless runner."><link rel="canonical" href="https://games.multiportllc.com/games/coinrunner"><meta property="og:title" content="Coin Runner - Multiport Games"><meta property="og:description" content="Play Coin Runner free online — Press Space or Up to jump, Down or S to slide. Dodge obstacles, collect coins, and beat your high score in this endless runner."><meta property="og:url" content="https://games.multiportllc.com/games/coinrunner"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Coin Runner","description":"Play Coin Runner free online instantly. Press Space or Up to jump, Down or S to slide. Dodge obstacles, collect coins, and beat your high score in this endless runner. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/coinrunner","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a3a5a;display:block;border-radius:8px;margin:0 auto}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Coin Runner</div>
  <div class="game-frame">
    <div id="score-display">Coins: 0 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="260"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>/<b>Up Arrow</b> or <b>Tap</b> to jump, <b>Down Arrow</b>/<b>S</b> or <b>swipe down</b> to slide. Dodge the obstacles and collect coins for extra points!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=260,ground=200;
let coins=0,score=0,hi=parseInt(localStorage.getItem('coinrunner_hi')||'0'),spd=6,frame=0,gameOver=false,started=false;
const runner={x:80,y:ground,w:36,h:50,vy:0,jumping:false,sliding:false,slideTimer:0};
let obs=[],coinItems=[];
let lastTime=null,obsTimer=0,coinTimer=0;

function reset(){
  coins=0;score=0;spd=6;frame=0;gameOver=false;started=false;obs=[];coinItems=[];
  runner.y=ground;runner.vy=0;runner.jumping=false;runner.sliding=false;runner.slideTimer=0;
  lastTime=null;obsTimer=0;coinTimer=0;
}

function jump(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(!runner.jumping&&!runner.sliding){runner.vy=-13.5;runner.jumping=true;SFX.jump();}
}
function slide(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(!runner.jumping&&!runner.sliding){runner.sliding=true;runner.slideTimer=32;SFX.swoosh();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();slide();}
});
c.addEventListener('click',jump);
let touchStartY=null;
c.addEventListener('touchstart',e=>{e.preventDefault();touchStartY=e.touches[0].clientY;},{passive:false});
c.addEventListener('touchend',e=>{
  e.preventDefault();
  if(touchStartY!==null){
    const dy=(e.changedTouches[0].clientY-touchStartY);
    if(dy>30)slide(); else jump();
  }
  touchStartY=null;
},{passive:false});

function curH(){return runner.sliding?26:runner.h;}
function curY(){return runner.sliding?ground+runner.h-26:runner.y;}

function spawnObs(){
  const type=Math.random()<0.5?'ground':'air';
  if(type==='ground'){
    obs.push({x:820,w:26,h:40,y:ground+runner.h-40,type});
  } else {
    obs.push({x:820,w:44,h:24,y:ground+runner.h-70,type});
  }
}
function spawnCoin(){
  const y=ground+runner.h-40-Math.random()*60;
  coinItems.push({x:820,y,r:10,taken:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawRunner(){
  ctx.save();
  const y=curY(),h=curH();
  ctx.fillStyle='#4dd0e1';
  ctx.fillRect(runner.x,y,runner.w,h);
  ctx.fillStyle='#26a6b8';
  ctx.fillRect(runner.x+4,y-14,20,18);
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(runner.x+16,y-10,5,5);
  const legOff=Math.floor(frame/6)%2===0?0:8;
  ctx.fillStyle='#1e8a99';
  if(!runner.sliding){
    ctx.fillRect(runner.x+4,y+h,8,10+legOff);
    ctx.fillRect(runner.x+runner.w-12,y+h,8,10+(8-legOff));
  }
  ctx.restore();
}

function drawObs(o){
  ctx.fillStyle=o.type==='ground'?'#e94560':'#ffb703';
  ctx.fillRect(o.x,o.y,o.w,o.h);
}

function drawCoin(o){
  ctx.save();
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c99700';
  ctx.beginPath();ctx.arc(o.x,o.y,o.r-4,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,ground+runner.h);
  sky.addColorStop(0,'#16213e');sky.addColorStop(1,'#2a3a5a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3d5580';ctx.fillRect(0,ground+runner.h,W,H-(ground+runner.h));
  ctx.fillStyle='#ffd54f';ctx.fillRect(0,ground+runner.h,W,3);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,110);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,146);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#4dd0e199';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,110);
    drawRunner();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  score+=dt;
  if(score>hi){hi=score;localStorage.setItem('coinrunner_hi',String(Math.floor(hi)));}
  spd=6+score/280;

  obsTimer+=dt;
  const obsInterval=Math.max(40,100-score/45);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObs();}
  coinTimer+=dt;
  if(coinTimer>=70){coinTimer-=70;if(Math.random()<0.7)spawnCoin();}

  if(runner.sliding){
    runner.slideTimer-=dt;
    if(runner.slideTimer<=0)runner.sliding=false;
  }
  if(runner.jumping){
    runner.vy+=0.68*dt;
    runner.y+=runner.vy*dt;
    if(runner.y>=ground){runner.y=ground;runner.vy=0;runner.jumping=false;}
  }

  const rY=curY(),rH=curH();
  const runnerHit={x:runner.x+4,y:rY-2,w:runner.w-4,h:rH+2};

  obs=obs.filter(o=>o.x>-40);
  obs.forEach(o=>{
    o.x-=spd*dt;drawObs(o);
    if(rect(runnerHit,{x:o.x,y:o.y,w:o.w,h:o.h})&&!gameOver){gameOver=true;SFX.lose();}
  });

  coinItems=coinItems.filter(o=>o.x>-30);
  coinItems.forEach(o=>{
    o.x-=spd*dt;
    if(!o.taken){
      drawCoin(o);
      if(rect(runnerHit,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})){
        o.taken=true;coins++;score+=25;SFX.coin();
      }
    }
  });
  coinItems=coinItems.filter(o=>!o.taken);

  drawRunner();
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('coinrunner_score_label','Coins: {c} | Score: {s} | Hi: {h}')
      .replace('{c}',coins).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
}

loop();
</script></body></html>
