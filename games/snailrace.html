<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Snail Race</title><meta name="description" content="Play Snail Race free online — Tap rapidly to boost your snail past three rivals to the finish line. Timing beats pure speed!"><link rel="canonical" href="https://games.multiportllc.com/games/snailrace"><meta property="og:title" content="Snail Race - Multiport Games"><meta property="og:description" content="Play Snail Race free online — Tap rapidly to boost your snail past three rivals to the finish line. Timing beats pure speed!"><meta property="og:url" content="https://games.multiportllc.com/games/snailrace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Snail Race","description":"Play Snail Race free online instantly. Tap rapidly to boost your snail past three rivals to the finish line. Timing beats pure speed! No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/snailrace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#8d6e63;cursor:pointer}
#ui{color:#d7ccc8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Snail Race</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Wins: 0 | Races: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap as fast and steadily as you can — each tap gives your snail a burst of speed, but tapping too fast in a row gives smaller boosts (snails get tired!). Beat the 3 rivals to the finish.</div>
</div>
<script>
const W=360,H=360,FINISH=W-30,START=30;
let racers,wins,races,state,lastTap;

function loadBest(){return +(localStorage.getItem('snailrace_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('snailrace_best',v);}

function init(){wins=0;races=0;state='play';newRace();}
function newRace(){
  racers=[
    {x:START,lane:0,color:'#8d6e63',player:true,fatigue:0},
    {x:START,lane:1,color:'#66bb6a',speed:1.4+Math.random()*0.6},
    {x:START,lane:2,color:'#42a5f5',speed:1.4+Math.random()*0.6},
    {x:START,lane:3,color:'#ef5350',speed:1.4+Math.random()*0.6},
  ];
  lastTap=0;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  const player=racers[0];
  const now=performance.now();
  const gap=now-lastTap;
  lastTap=now;
  const boost=gap<80?2:gap<200?6:4;
  player.x+=boost;
  SFX.tick();
});

function update(){
  if(state!=='play')return;
  for(let i=1;i<racers.length;i++){
    racers[i].x+=racers[i].speed*(0.7+Math.random()*0.6);
  }
  const finisher=racers.find(r=>r.x>=FINISH);
  if(finisher){
    races++;
    if(finisher.player){wins++;SFX.win();saveBest(wins);}
    else SFX.lose();
    state='over';
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(FINISH,20);ctx.lineTo(FINISH,H-20);ctx.stroke();
  ctx.setLineDash([]);

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  racers.forEach(r=>{
    const y=60+r.lane*80;
    ctx.fillText('🐌',Math.min(FINISH,r.x),y);
  });

  if(state==='over'){
    const finisher=racers.find(r=>r.x>=FINISH);
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d7ccc8';ctx.font='bold 26px Arial';
    ctx.fillText(finisher&&finisher.player?'YOU WIN!':'YOU LOSE',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Wins: ${wins}/${races} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to race again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Wins: ${wins} | Races: ${races}`;
}

init();draw();
</script></body></html>
