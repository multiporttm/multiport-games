<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{background:#1a1230;border-radius:14px;padding:16px;text-align:center}
#hud{display:flex;justify-content:space-between;align-items:center;color:#f0e8ff;font-weight:700;max-width:520px;margin:0 auto 10px;flex-wrap:wrap;gap:6px}
#hud .stat{background:rgba(255,255,255,.07);padding:5px 12px;border-radius:20px;font-size:.95rem}
#timerBar{max-width:520px;margin:0 auto 14px;height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#timerFill{height:100%;background:linear-gradient(90deg,#ba68c8,#ff80ab);width:100%;transition:width .1s linear}
#flagCard{max-width:280px;margin:0 auto 8px;background:#241a3d;border-radius:14px;padding:20px 10px;border:2px solid rgba(255,255,255,.08)}
#flagEmoji{font-size:5rem;line-height:1}
#countryName{color:#fff;font-size:1.4rem;font-weight:900;margin-top:6px}
#question{color:#e0d0ff;font-size:1rem;font-weight:700;margin:10px 0 8px}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
@media(max-width:480px){#options{grid-template-columns:1fr}}
.opt{padding:12px 10px;background:#3a2360;color:#f5ecff;border:2px solid #6a3fa0;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
.opt:hover{background:#4c2f7d}
.opt:active{transform:scale(.97)}
.opt.correct{background:#2e7d32!important;border-color:#66bb6a}
.opt.wrong{background:#c62828!important;border-color:#ef5350}
.opt:disabled{cursor:default}
#msg{min-height:1.6em;color:#ffd54f;font-weight:800;margin-top:10px}
#startBtn{margin-top:14px;padding:12px 28px;background:#ba68c8;border:none;border-radius:24px;color:#20102e;font-weight:900;font-size:1.05rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Continent Quiz</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud">
        <span class="stat" id="streakStat">Streak: 0</span>
        <span class="stat" id="livesStat">Lives: ❤️❤️❤️</span>
        <span class="stat" id="hiStat">Best: 0</span>
      </div>
      <div id="timerBar"><div id="timerFill"></div></div>
      <div id="flagCard">
        <div id="flagEmoji">🏳️</div>
        <div id="countryName">—</div>
      </div>
      <div id="question">Click Start to begin</div>
      <div id="options"></div>
      <div id="msg"></div>
      <button id="startBtn">Start Game</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A country's flag and name appear. Pick the correct continent it belongs to before time runs out. Wrong picks cost a life. Build a streak for a higher score — later rounds bring trickier countries and shorter timers!</div>
</div>
<script>
// ---------- Question bank: countries with flag emoji + continent + difficulty tier ----------
const COUNTRIES = [
  {name:"France", flag:"🇫🇷", continent:"Europe", tier:1},
  {name:"Germany", flag:"🇩🇪", continent:"Europe", tier:1},
  {name:"Brazil", flag:"🇧🇷", continent:"South America", tier:1},
  {name:"Egypt", flag:"🇪🇬", continent:"Africa", tier:1},
  {name:"Japan", flag:"🇯🇵", continent:"Asia", tier:1},
  {name:"Australia", flag:"🇦🇺", continent:"Oceania", tier:1},
  {name:"Canada", flag:"🇨🇦", continent:"North America", tier:1},
  {name:"India", flag:"🇮🇳", continent:"Asia", tier:1},
  {name:"Mexico", flag:"🇲🇽", continent:"North America", tier:1},
  {name:"United Kingdom", flag:"🇬🇧", continent:"Europe", tier:1},
  {name:"China", flag:"🇨🇳", continent:"Asia", tier:1},
  {name:"South Africa", flag:"🇿🇦", continent:"Africa", tier:1},
  {name:"Argentina", flag:"🇦🇷", continent:"South America", tier:1},
  {name:"Italy", flag:"🇮🇹", continent:"Europe", tier:1},
  {name:"Kenya", flag:"🇰🇪", continent:"Africa", tier:2},
  {name:"Peru", flag:"🇵🇪", continent:"South America", tier:2},
  {name:"Thailand", flag:"🇹🇭", continent:"Asia", tier:2},
  {name:"New Zealand", flag:"🇳🇿", continent:"Oceania", tier:2},
  {name:"Sweden", flag:"🇸🇪", continent:"Europe", tier:2},
  {name:"Morocco", flag:"🇲🇦", continent:"Africa", tier:2},
  {name:"Vietnam", flag:"🇻🇳", continent:"Asia", tier:2},
  {name:"Colombia", flag:"🇨🇴", continent:"South America", tier:2},
  {name:"Poland", flag:"🇵🇱", continent:"Europe", tier:2},
  {name:"Nigeria", flag:"🇳🇬", continent:"Africa", tier:2},
  {name:"Turkey", flag:"🇹🇷", continent:"Asia", tier:2},
  {name:"Fiji", flag:"🇫🇯", continent:"Oceania", tier:2},
  {name:"Chile", flag:"🇨🇱", continent:"South America", tier:2},
  {name:"Portugal", flag:"🇵🇹", continent:"Europe", tier:2},
  {name:"Kazakhstan", flag:"🇰🇿", continent:"Asia", tier:3},
  {name:"Mongolia", flag:"🇲🇳", continent:"Asia", tier:3},
  {name:"Uruguay", flag:"🇺🇾", continent:"South America", tier:3},
  {name:"Madagascar", flag:"🇲🇬", continent:"Africa", tier:3},
  {name:"Papua New Guinea", flag:"🇵🇬", continent:"Oceania", tier:3},
  {name:"Georgia", flag:"🇬🇪", continent:"Asia", tier:3},
  {name:"Suriname", flag:"🇸🇷", continent:"South America", tier:3},
  {name:"Djibouti", flag:"🇩🇯", continent:"Africa", tier:3},
  {name:"Vanuatu", flag:"🇻🇺", continent:"Oceania", tier:3},
  {name:"Belarus", flag:"🇧🇾", continent:"Europe", tier:3},
  {name:"Bhutan", flag:"🇧🇹", continent:"Asia", tier:3},
  {name:"Panama", flag:"🇵🇦", continent:"North America", tier:2},
  {name:"Jamaica", flag:"🇯🇲", continent:"North America", tier:2},
  {name:"Guatemala", flag:"🇬🇹", continent:"North America", tier:2},
  {name:"Iceland", flag:"🇮🇸", continent:"Europe", tier:2},
  {name:"Tunisia", flag:"🇹🇳", continent:"Africa", tier:2},
  {name:"Cyprus", flag:"🇨🇾", continent:"Asia", tier:3}
];
const ALL_CONTINENTS = ["Africa","Asia","Europe","North America","South America","Oceania"];

let hi=parseInt(localStorage.getItem('continentquiz_hi')||'0',10);
let lives=3, streak=0, round=0, started=false, timerId=null, timeLeft=0, timeMax=0, currentAnswer=null, locked=false;
let usedRecent=[];

document.getElementById('hiStat').textContent=I18N.t('best_label','Best: {n}').replace('{n}',hi);

function pickQuestion(){
  const maxTier = round<5?1:(round<12?2:3);
  let pool = COUNTRIES.filter(c=>c.tier<=maxTier && !usedRecent.includes(c.name));
  if(pool.length===0){ usedRecent=[]; pool = COUNTRIES.filter(c=>c.tier<=maxTier); }
  const q = pool[Math.floor(Math.random()*pool.length)];
  usedRecent.push(q.name);
  if(usedRecent.length>8)usedRecent.shift();
  return q;
}

function contKey(c){return 'cont_'+c.replace(/[^a-z0-9]/gi,'_').toLowerCase();}

function makeOptions(correct){
  const opts=[correct.continent];
  const others=ALL_CONTINENTS.filter(c=>c!==correct.continent);
  for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  opts.push(...others.slice(0,3));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return opts;
}

function nextRound(){
  if(!started)return;
  locked=false;
  round++;
  document.getElementById('msg').textContent='';
  const q=pickQuestion();
  currentAnswer=q;
  document.getElementById('flagEmoji').textContent=q.flag;
  document.getElementById('countryName').textContent=I18N.t('country_'+q.name.replace(/[^a-z0-9]/gi,'_').toLowerCase(),q.name);
  document.getElementById('question').textContent=I18N.t('question_prompt2','Which continent is this country in?');
  const opts=makeOptions(q);
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  opts.forEach(c=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=I18N.t(contKey(c),c);
    b.onclick=()=>choose(c,b);
    optsEl.appendChild(b);
  });
  timeMax = Math.max(3.5, 8 - round*0.22);
  timeLeft = timeMax;
  updateTimerBar();
  clearInterval(timerId);
  timerId=setInterval(tick,100);
}

function tick(){
  timeLeft-=0.1;
  updateTimerBar();
  if(timeLeft<=0){
    clearInterval(timerId);
    if(!locked)timeoutFail();
  }
}
function updateTimerBar(){
  const pct=Math.max(0,timeLeft/timeMax*100);
  document.getElementById('timerFill').style.width=pct+'%';
}

function timeoutFail(){
  locked=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  SFX.error();
  document.getElementById('msg').textContent=I18N.t('time_up_msg2','⏰ Time\'s up! It was {n}.').replace('{n}',I18N.t(contKey(currentAnswer.continent),currentAnswer.continent));
  loseLife();
}

function choose(c,btn){
  if(locked)return;
  locked=true;
  clearInterval(timerId);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(c===currentAnswer.continent){
    btn.classList.add('correct');
    streak++;
    if(streak>hi){hi=streak;localStorage.setItem('continentquiz_hi',hi);}
    document.getElementById('streakStat').textContent=I18N.t('streak_label','Streak: {n}').replace('{n}',streak);
    document.getElementById('hiStat').textContent=I18N.t('best_label','Best: {n}').replace('{n}',hi);
    document.getElementById('msg').textContent=I18N.t('correct_msg','✅ Correct!');
    SFX.success();
    setTimeout(nextRound,700);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{ if(b.textContent===I18N.t(contKey(currentAnswer.continent),currentAnswer.continent))b.classList.add('correct'); });
    document.getElementById('msg').textContent=I18N.t('wrong_msg2','❌ Not quite — {c} is in {n}.').replace('{c}',currentAnswer.name).replace('{n}',I18N.t(contKey(currentAnswer.continent),currentAnswer.continent));
    SFX.error();
    loseLife();
  }
}

function loseLife(){
  lives--;
  renderLives();
  if(lives<=0){
    setTimeout(gameOver,900);
  } else {
    setTimeout(nextRound,900);
  }
}

function renderLives(){
  document.getElementById('livesStat').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤️'.repeat(Math.max(0,lives)));
}

function gameOver(){
  started=false;
  clearInterval(timerId);
  document.getElementById('question').textContent=I18N.t('game_over_streak','Game Over! Final streak: {n}').replace('{n}',streak);
  document.getElementById('options').innerHTML='';
  document.getElementById('msg').textContent='';
  SFX.lose();
  const startBtn=document.getElementById('startBtn');
  startBtn.textContent=I18N.t('play_again_btn','Play Again');
  startBtn.style.display='inline-block';
}

function startGame(){
  lives=3;streak=0;round=0;started=true;usedRecent=[];
  renderLives();
  document.getElementById('streakStat').textContent=I18N.t('streak_label','Streak: {n}').replace('{n}',0);
  document.getElementById('startBtn').style.display='none';
  nextRound();
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(!started)return;
  const idx=parseInt(e.key,10);
  if(idx>=1&&idx<=4){
    const btns=document.querySelectorAll('.opt');
    if(btns[idx-1] && !btns[idx-1].disabled)btns[idx-1].click();
  }
});
</script></body></html>
