<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1976a8;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#8ee8ff;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Kayak Rapids</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to steer, or <b>drag</b> on mobile. Dodge the rocks and logs in the rapids, and ride the lighter <b>boost currents</b> for extra speed!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let distance=0,hiDist=parseInt(localStorage.getItem('kayakrapids_hi')||'0'),spd=5,frame=0,gameOver=false,started=false;
const player={x:W/2,y:H-100,w:30,h:50,vx:0};
let obstacles=[],lanes=[];
let lastTime=null,obsTimer=0,laneTimer=0;
let keys={left:false,right:false};
let dragX=null;
let inBoost=false;

function reset(){
  distance=0;spd=5;frame=0;gameOver=false;started=false;
  player.x=W/2;player.vx=0;
  obstacles=[];lanes=[];lastTime=null;obsTimer=0;laneTimer=0;inBoost=false;
}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;startOrRestart();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;startOrRestart();}
  else if(e.code==='Space'){startOrRestart();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
c.addEventListener('click',startOrRestart);
c.addEventListener('touchstart',e=>{e.preventDefault();startOrRestart();dragX=e.touches[0].clientX;},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragX!==null){
    const dx=e.touches[0].clientX-dragX;
    player.x+=dx*1.3;
    dragX=e.touches[0].clientX;
  }
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragX=null;},{passive:false});

function spawnObstacle(){
  const type=Math.random()<0.55?'rock':'log';
  const x=30+Math.random()*(W-60);
  obstacles.push({x,y:-40,w:type==='rock'?32:60,h:type==='rock'?32:20,type});
}
function spawnLane(){
  const x=40+Math.random()*(W-80);
  const w=70+Math.random()*40;
  lanes.push({x,y:-80,w,h:220,taken:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.vx*0.02);
  ctx.fillStyle='#ffb300';
  ctx.beginPath();
  ctx.ellipse(0,0,player.w/2,player.h/2,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#e65100';
  ctx.beginPath();
  ctx.ellipse(0,0,player.w/2-6,player.h/2-8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#3e2723';
  ctx.fillRect(-player.w/2-14,-3,player.w+28,6);
  ctx.restore();
}

function drawRock(o){
  ctx.fillStyle='#6b6259';
  ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8f867a';
  ctx.beginPath();ctx.ellipse(o.x-5,o.y-5,o.w/4,o.h/4,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.globalAlpha=0.5;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2+4,o.h/2+4,0,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawLog(o){
  ctx.fillStyle='#6d4c2b';
  ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);
  ctx.fillStyle='#8a6035';
  ctx.fillRect(o.x-o.w/2,o.y-o.h/2+4,o.w,4);
  ctx.fillStyle='#4a3319';
  ctx.beginPath();ctx.ellipse(o.x-o.w/2+6,o.y,5,o.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(o.x+o.w/2-6,o.y,5,o.h/2,0,0,Math.PI*2);ctx.fill();
}
function drawLane(o){
  ctx.save();
  ctx.globalAlpha=0.28;
  ctx.fillStyle='#bdf2ff';
  ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);
  ctx.restore();
}

let bgOffset=0;
function drawBg(dt){
  bgOffset=(bgOffset+spd*dt)%40;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b93c4');g.addColorStop(1,'#0e5a7f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  ctx.lineWidth=2;
  for(let y=-40;y<H+40;y+=40){
    ctx.beginPath();ctx.moveTo(0,y+bgOffset);ctx.lineTo(W,y+bgOffset);ctx.stroke();
  }
}

function loop(){
  if(gameOver){
    drawBg(0);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Key to restart'),W/2,H/2+14);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    drawBg(0);
    drawPlayer();
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('kayak_start_hint','Press a Key or Tap to start'),W/2,80);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  if(keys.left)player.vx=Math.max(player.vx-0.6*dt,-7);
  else if(keys.right)player.vx=Math.min(player.vx+0.6*dt,7);
  else player.vx*=0.85;
  player.x+=player.vx*dt;
  if(player.x<player.w/2+14)player.x=player.w/2+14;
  if(player.x>W-player.w/2-14)player.x=W-player.w/2-14;

  drawBg(dt);

  laneTimer+=dt;
  if(laneTimer>=220){laneTimer-=220;if(Math.random()<0.85)spawnLane();}
  lanes=lanes.filter(o=>o.y-o.h/2<H+50);
  inBoost=false;
  lanes.forEach(o=>{
    o.y+=(spd)*dt;
    drawLane(o);
    if(rect({x:player.x-2,y:player.y-2,w:4,h:4},{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})){
      inBoost=true;
    }
  });

  const curSpd=spd*(inBoost?1.9:1);
  distance+=dt*(curSpd/5);
  if(distance>hiDist){hiDist=distance;localStorage.setItem('kayakrapids_hi',String(Math.floor(hiDist)));}
  spd=5+distance/260;

  obsTimer+=dt;
  const obsInterval=Math.max(22,52-distance/32);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObstacle();}

  const playerHit={x:player.x-player.w/2+5,y:player.y-player.h/2+6,w:player.w-10,h:player.h-12};

  obstacles=obstacles.filter(o=>o.y<H+50);
  obstacles.forEach(o=>{
    o.y+=(curSpd+2)*dt;
    if(o.type==='rock')drawRock(o); else drawLog(o);
    if(rect(playerHit,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})&&!gameOver){gameOver=true;SFX.lose();}
  });

  drawPlayer();
  if(inBoost){
    ctx.fillStyle='#fffde7';
    ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.globalAlpha=0.85;
    ctx.fillText(I18N.t('kayak_boost','BOOST!'),player.x,player.y-40);
    ctx.globalAlpha=1;
  }
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('kayak_score_label','Distance: {d}m | Hi: {h}m')
      .replace('{d}',Math.floor(distance)).replace('{h}',Math.floor(hiDist));
}

loop();
</script></body></html>
