<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#1a0a1f}
#wrap{background:#241230;border-radius:14px;padding:16px;text-align:center}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:800;max-width:420px;margin:0 auto 8px;font-size:1rem}
#combo{color:#ffd54f}
#stage{position:relative;width:360px;height:420px;margin:0 auto;background:linear-gradient(#2d1538,#17091f);border-radius:10px;overflow:hidden;touch-action:none}
.lane{position:absolute;top:0;bottom:0;width:90px;border-right:1px solid rgba(255,255,255,.08)}
.lane:last-child{border-right:none}
.targetline{position:absolute;left:0;right:0;top:350px;height:48px;border-top:3px solid #ff6ec7;border-bottom:3px solid #ff6ec7;background:rgba(255,110,199,.08)}
.note{position:absolute;width:70px;height:34px;left:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1a0a1f;font-size:1.3rem}
.lanebtn{position:absolute;bottom:0;left:0;width:90px;height:60px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4rem;color:#fff;background:rgba(255,255,255,.05);border-top:2px solid rgba(255,255,255,.15);transition:background .08s}
.lanebtn.flash{background:rgba(255,110,199,.5)}
#banner{position:absolute;top:40%;left:0;right:0;text-align:center;font-weight:900;font-size:1.5rem;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
#rating{position:absolute;top:30%;left:0;right:0;text-align:center;font-weight:900;font-size:1.1rem;pointer-events:none}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wedding Dance Routine</div>
  <div class="game-frame">
    <div id="wrap">
      <div id="hud"><span id="scoreTxt">Score: 0</span><span id="combo">Combo x0</span><span id="hiTxt">Hi: 0</span></div>
      <div id="stage">
        <div class="lane" style="left:0"></div>
        <div class="lane" style="left:90px"></div>
        <div class="lane" style="left:180px"></div>
        <div class="lane" style="left:270px"></div>
        <div class="targetline"></div>
        <div id="banner"></div>
        <div id="rating"></div>
        <div class="lanebtn" data-lane="0" style="left:0">D</div>
        <div class="lanebtn" data-lane="1" style="left:90px">F</div>
        <div class="lanebtn" data-lane="2" style="left:180px">J</div>
        <div class="lanebtn" data-lane="3" style="left:270px">K</div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>D, F, J, K</b> (or tap the matching lane) as each dance-move note crosses the pink target line. Perfect timing builds your <b>combo</b> and wows the crowd through the whole routine — miss three times and the routine ends!</div>
</div>
<script>
const LANES=4, LANE_W=90, LANE_COLORS=['#ff6ec7','#7ec8ff','#ffd54f','#9eff7e'];
const LANE_LABELS=['D','F','J','K'];
const stage=document.getElementById('stage');
const scoreTxt=document.getElementById('scoreTxt'), comboTxt=document.getElementById('combo'), hiTxt=document.getElementById('hiTxt');
const banner=document.getElementById('banner'), ratingEl=document.getElementById('rating');
const HI_KEY='weddingdanceroutine_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0;
let score=0,combo=0,maxCombo=0,misses=0,notes=[],noteEls=[],spawnTimer=0,speed=2.1,running=false,ended=false,totalNotes=0,hitNotes=0,lastTime=null,endless=false,routineLen=40;

function updateHud(){
  scoreTxt.textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  comboTxt.textContent=I18N.t('combo_label','Combo x{c}').replace('{c}',combo);
  hiTxt.textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
}
function showBanner(t){banner.textContent=t;banner.style.opacity=1;clearTimeout(banner._t);banner._t=setTimeout(()=>banner.style.opacity=0,900);}
function showRating(t,color){ratingEl.textContent=t;ratingEl.style.color=color;ratingEl.style.opacity=1;clearTimeout(ratingEl._t);ratingEl._t=setTimeout(()=>ratingEl.style.opacity=0,350);}

function reset(){
  score=0;combo=0;maxCombo=0;misses=0;notes.forEach(n=>n.el&&n.el.remove());notes=[];spawnTimer=0;speed=2.1;running=false;ended=false;totalNotes=0;hitNotes=0;lastTime=null;routineLen=40;
  updateHud();
  showBanner(I18N.t('start_hint','Tap / press any key to start the routine'));
}

function start(){
  if(running||ended)return;
  running=true;
  showBanner(I18N.t('go_txt','Let\'s dance!'));
}

function spawnNote(){
  const lane=Math.floor(Math.random()*LANES);
  const el=document.createElement('div');
  el.className='note';
  el.style.background=LANE_COLORS[lane];
  el.style.left=(lane*LANE_W+10)+'px';
  el.textContent=LANE_LABELS[lane];
  el.style.top='-34px';
  stage.appendChild(el);
  const n={lane,y:-34,el,judged:false};
  notes.push(n);
  totalNotes++;
}

function endRoutine(win){
  running=false;ended=true;
  if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  updateHud();
  if(win){SFX.win();showBanner(I18N.t('routine_complete','Routine complete! Crowd goes wild!'));}
  else{SFX.lose();showBanner(I18N.t('routine_failed','Missed too many cues — routine over'));}
}

function hitLane(lane){
  flashLane(lane);
  if(!running){start();return;}
  if(ended){reset();return;}
  // find closest unjudged note in this lane near target line (300-398 window center ~350)
  let best=null,bestDist=9999;
  notes.forEach(n=>{
    if(n.judged||n.lane!==lane)return;
    const dist=Math.abs(n.y-350);
    if(dist<bestDist){bestDist=dist;best=n;}
  });
  if(!best||bestDist>80){
    // nothing to hit - miss tap
    misses++;combo=0;SFX.error();showRating(I18N.t('rate_miss','MISS'),'#ff5566');
    if(misses>=5)endRoutine(false);
    updateHud();
    return;
  }
  best.judged=true;
  best.el.style.opacity='0';
  setTimeout(()=>best.el.remove(),50);
  let gain=0,label='';
  if(bestDist<16){gain=100;label=I18N.t('rate_perfect','PERFECT');SFX.success();}
  else if(bestDist<40){gain=60;label=I18N.t('rate_good','GOOD');SFX.point();}
  else{gain=20;label=I18N.t('rate_ok','OK');SFX.click();}
  combo++;if(combo>maxCombo)maxCombo=combo;
  score+=gain+combo*2;
  hitNotes++;
  showRating(label,'#9eff7e');
  updateHud();
  if(hitNotes>=routineLen)endRoutine(true);
}

function flashLane(lane){
  const btn=stage.querySelector(`.lanebtn[data-lane="${lane}"]`);
  if(!btn)return;
  btn.classList.add('flash');
  setTimeout(()=>btn.classList.remove('flash'),120);
}

const KEYMAP={'d':0,'f':1,'j':2,'k':3};
document.addEventListener('keydown',e=>{
  const l=KEYMAP[e.key.toLowerCase()];
  if(l!==undefined){e.preventDefault();hitLane(l);}
});
stage.querySelectorAll('.lanebtn').forEach(btn=>{
  const lane=parseInt(btn.dataset.lane,10);
  btn.addEventListener('pointerdown',e=>{e.preventDefault();hitLane(lane);});
});

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;
  if(running){
    spawnTimer+=dt;
    const interval=Math.max(26,46-score/300);
    if(spawnTimer>=interval&&totalNotes<routineLen+6){spawnTimer-=interval;spawnNote();}
    notes.forEach(n=>{
      if(n.judged)return;
      n.y+=speed*dt*2.2;
      n.el.style.top=n.y+'px';
      if(n.y>430){
        n.judged=true;n.el.remove();
        misses++;combo=0;SFX.error();showRating(I18N.t('rate_miss','MISS'),'#ff5566');
        updateHud();
        if(misses>=5)endRoutine(false);
      }
    });
    notes=notes.filter(n=>n.y<450);
    speed=2.1+score/1800;
  }
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script></body></html>
