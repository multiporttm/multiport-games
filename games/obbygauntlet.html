<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d1b2e}
#ui{color:#90caf9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Obby Gauntlet</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Checkpoint: 1/8 | Lives: 3</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad) to move, Space to jump. Hop across the moving platforms and dodge the spinning blades to reach each checkpoint flag. Fall off or touch a blade and you lose a life!</div>
</div>
<script>
const W=360,H=360,SIZE=16,GRAVITY=0.5,GROUND=H-20,TOTAL_STAGES=8;
let player,vy,platforms,blades,checkpoint,lives,state,keys={},spawnX,spawnY;

function loadBest(){return +(localStorage.getItem('obbygauntlet_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('obbygauntlet_best',v);}

function buildLevel(cp){
  const baseY=GROUND-40;
  platforms=[{x:10,y:baseY,w:60,h:12,moving:false}];
  blades=[];
  const n=3+cp;
  let x=90;
  for(let i=0;i<n;i++){
    const w=40+Math.random()*20;
    const moving=Math.random()<0.35+cp*0.04;
    const crumble=!moving&&cp>=3&&Math.random()<0.25+cp*0.02;
    const bouncy=!moving&&!crumble&&cp>=2&&Math.random()<0.18+cp*0.02;
    platforms.push({
      x,y:baseY-Math.sin(i*1.3)*30,w,h:12,moving,crumble,bouncy,
      baseX:x,range:30+cp*4,speed:(0.6+cp*0.15)*(Math.random()<0.5?1:-1),t:Math.random()*10,
      crumbleT:0,gone:false
    });
    if(Math.random()<0.45+cp*0.04){
      blades.push({x:x+w/2,y:baseY-Math.sin(i*1.3)*30-24,ang:0});
    }
    x+=w+50+Math.random()*20;
  }
  platforms.push({x,y:baseY,w:60,h:12,moving:false,flag:true});
  spawnX=20;spawnY=baseY-SIZE-2;
}

function init(){checkpoint=1;lives=3;state='play';reset();}
function reset(){buildLevel(checkpoint);player={x:spawnX,y:spawnY};vy=0;}

function jump(){if(player.onGround){vy=-9.2;player.onGround=false;SFX.jump();}}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;if(key==='arrowup')jump();};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='over'){checkpoint=1;lives=3;state='play';reset();}});
});

function update(){
  if(state!=='play')return;
  const spd=2.2;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(0,Math.min(W-SIZE,player.x));

  platforms.forEach(p=>{
    if(p.moving){p.t+=0.03;p.x=p.baseX+Math.sin(p.t*p.speed)*p.range;}
    if(p.crumble&&p.crumbleT>0){
      p.crumbleT+=1;
      if(p.crumbleT>28)p.gone=true;
    }
  });
  blades.forEach(b=>b.ang+=0.12);

  vy+=GRAVITY;
  player.y+=vy;
  player.onGround=false;
  platforms.forEach(p=>{
    if(p.gone)return;
    if(player.x+SIZE>p.x&&player.x<p.x+p.w&&player.y+SIZE>=p.y&&player.y+SIZE<=p.y+16&&vy>=0){
      player.y=p.y-SIZE;vy=0;player.onGround=true;
      if(p.crumble&&p.crumbleT===0)p.crumbleT=1;
      if(p.bouncy){vy=-13.5;player.onGround=false;SFX.powerup();}
      if(p.flag){
        checkpoint++;
        if(checkpoint>TOTAL_STAGES){
          saveBest(TOTAL_STAGES);
          state='win';
          SFX.win();
        }else{
          SFX.success();
          reset();
        }
      }
    }
  });

  blades.forEach(b=>{
    if(Math.hypot(player.x+SIZE/2-b.x,player.y+SIZE/2-b.y)<20)hurt();
  });

  if(player.y>H){hurt();}
  updateUI();
}

function hurt(){
  lives--;
  SFX.hurt();
  if(lives<=0){
    state='over';
    SFX.lose();
    saveBest(checkpoint-1);
  }else{
    reset();
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function drawPlatform(p){
  if(p.gone)return;
  let shake=0;
  if(p.crumble&&p.crumbleT>0)shake=Math.sin(p.crumbleT*1.4)*(p.crumbleT/28)*3;
  const x=p.x+shake,y=p.y;
  let top='#546e7a',side='#37474f';
  if(p.flag){top='#66bb6a';side='#388e3c';}
  else if(p.bouncy){top='#ffca28';side='#f57f17';}
  else if(p.crumble){
    const fade=1-Math.min(1,p.crumbleT/28);
    top=`rgba(141,110,99,${fade})`;side=`rgba(78,52,46,${fade})`;
  }
  // beveled block look — lighter top face, darker side face for a chunky Roblox-ish feel
  ctx.fillStyle=side;ctx.fillRect(x,y+4,p.w,p.h-4);
  ctx.fillStyle=top;ctx.fillRect(x,y,p.w,6);
  if(p.flag){
    ctx.font='18px Arial';ctx.textAlign='center';
    ctx.fillText('🚩',x+p.w/2,y-12);
  }
  if(p.bouncy){
    ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText('⬆️',x+p.w/2,y-8);
  }
}

function drawPlayer(){
  const cx=player.x+SIZE/2,cy=player.y+SIZE/2;
  ctx.fillStyle='#ffca28';ctx.fillRect(cx-6,cy-2,12,10); // torso
  ctx.fillStyle='#1e88e5';ctx.fillRect(cx-6,cy+3,5,7);ctx.fillRect(cx+1,cy+3,5,7); // legs
  ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(cx,cy-7,5,0,Math.PI*2);ctx.fill(); // head
}

function draw(){
  const voidGrad=ctx.createLinearGradient(0,H-40,0,H);
  voidGrad.addColorStop(0,'#0d1b2e');voidGrad.addColorStop(1,'#3e1a08');
  ctx.fillStyle=voidGrad;ctx.fillRect(0,0,W,H);

  platforms.forEach(drawPlatform);

  ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  blades.forEach(b=>{
    ctx.save();
    ctx.translate(b.x,b.y);ctx.rotate(b.ang);
    ctx.fillText('⚔️',0,0);
    ctx.restore();
  });

  drawPlayer();

  if(state==='over'||state==='win'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#90caf9';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(state==='win'?I18N.t('win_title','GAUNTLET CLEARED!'):I18N.t('lose_title','OUT OF LIVES'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('checkpoint_label','Checkpoint: {n}/{total}').replace('{n}',Math.min(TOTAL_STAGES,checkpoint)).replace('{total}',TOTAL_STAGES),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap a D-pad button to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Checkpoint: ${Math.min(TOTAL_STAGES,checkpoint)}/${TOTAL_STAGES} | Lives: ${lives}`;
}

init();draw();
</script></body></html>
