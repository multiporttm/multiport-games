<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Cartography Map Projection</title><meta name="description" content="Play Cartography Map Projection free online — Read the mapping brief, then pick the projection that fits before time runs out. Choose wrong or too slow and you lose a life."><link rel="canonical" href="https://games.multiportllc.com/games/cartographymapprojection"><meta property="og:title" content="Cartography Map Projection - Multiport Games"><meta property="og:description" content="Play Cartography Map Projection free online — Read the mapping brief, then pick the projection that fits before time runs out. Choose wrong or too slow and you lose a life."><meta property="og:url" content="https://games.multiportllc.com/games/cartographymapprojection"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Cartography Map Projection","description":"Play Cartography Map Projection free online instantly. Read each mapping brief and transform the globe onto the flat map using the projection that actually fits the use case — Mercator for straight compass bearings, conic for mid-latitude land masses, azimuthal for polar routes, Robinson for balanced world atlases. Rounds get trickier and the clock gets shorter as you climb levels. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/cartographymapprojection","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0c2d3d;display:block;border-radius:8px}
#score-display{color:#7ec8e3;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff6b6b;font-size:1rem;font-weight:700;text-align:center;padding:0 8px 8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cartography Map Projection</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the mapping brief at the top, then click (or press <b>1-4</b>) the projection that fits the use case before the timer runs out. A wrong pick or a stalled timer costs a life — survive and climb through trickier regions and distortions.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display'),livesEl=document.getElementById('lives-display');
const KEY='cartographymapprojection_hi';
let score=0,hi=parseInt(localStorage.getItem(KEY)||'0',10),lives=3,level=1,round=0,roundsPerLevel=3;
let state='start'; // start, playing, correct, wrong, gameover, win
let timer=0,timeLimit=9000,lastTime=null;
let current=null,options=[],selected=-1,flashT=0;
const WIN_LEVEL=5;

const PROJECTIONS=[
  {id:'mercator',name:'Mercator',shape:'rect',desc:'Ship navigation across open ocean using straight compass bearings'},
  {id:'conic',name:'Conic',shape:'conic',desc:'A mid-latitude country like France mapped for accurate area and shape'},
  {id:'azimuthal',name:'Azimuthal',shape:'circle',desc:'Flight routes over the North Pole shown with true direction from center'},
  {id:'robinson',name:'Robinson',shape:'oval',desc:'A general world atlas map balancing shape and area distortion'},
  {id:'mollweide',name:'Mollweide',shape:'lens',desc:'A world population density map where equal land area must stay equal'},
  {id:'gnomonic',name:'Gnomonic',shape:'flatTri',desc:'Plotting the single shortest great-circle route between two distant ports'},
];
const USE_CASES={
  mercator:['Ship navigation across open ocean using straight compass bearings','A harbor chart where sailors plot a constant-bearing course'],
  conic:['A mid-latitude country like France mapped for accurate area and shape','A regional atlas page covering the continental United States'],
  azimuthal:['Flight routes over the North Pole shown with true direction from center','A map centered on Antarctica for polar research logistics'],
  robinson:['A general world atlas map balancing shape and area distortion','A classroom wall map meant to look reasonably correct everywhere'],
  mollweide:['A world population density map where equal land area must stay equal','A global map comparing countries by true surface area'],
  gnomonic:['Plotting the single shortest great-circle route between two distant ports','A navigation chart where every straight line is a great circle'],
};

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function newRound(){
  const poolSize=Math.min(PROJECTIONS.length,3+level);
  const pool=PROJECTIONS.slice(0,poolSize);
  current=pick(pool);
  const useCase=pick(USE_CASES[current.id]);
  current=Object.assign({},current,{useCase});
  const distractors=pool.filter(p=>p.id!==current.id);
  for(let i=distractors.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[distractors[i],distractors[j]]=[distractors[j],distractors[i]];}
  const numOpts=Math.min(4,distractors.length+1);
  options=[current,...distractors.slice(0,numOpts-1)];
  for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
  selected=-1;
  timeLimit=Math.max(4000,9000-level*700);
  timer=timeLimit;
  state='playing';
}

function startGame(){score=0;lives=3;level=1;round=0;state='playing';newRound();}

function choose(idx){
  if(state!=='playing'||idx<0||idx>=options.length)return;
  selected=idx;
  if(options[idx].id===current.id){
    score+=Math.max(10,Math.round(10+timer/100));
    if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    SFX.success();
    state='correct';flashT=700;
  } else {
    lives--;SFX.fail();
    state='wrong';flashT=800;
  }
}

function afterFlash(){
  if(lives<=0){state='gameover';SFX.lose();return;}
  round++;
  if(round>=roundsPerLevel){
    round=0;level++;
    if(level>WIN_LEVEL){state='win';SFX.win();return;}
  }
  newRound();
}

function drawShape(shape,x,y,w,h,col){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col+'33';ctx.lineWidth=3;
  ctx.beginPath();
  if(shape==='rect'){ctx.rect(x-w/2,y-h/2,w,h);}
  else if(shape==='circle'){ctx.arc(x,y,w/2,0,Math.PI*2);}
  else if(shape==='oval'){ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);}
  else if(shape==='conic'){ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();}
  else if(shape==='lens'){ctx.ellipse(x,y,w/2,h/2.6,0,0,Math.PI*2);}
  else if(shape==='flatTri'){ctx.moveTo(x-w/2,y+h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x,y-h/2);ctx.closePath();}
  ctx.fill();ctx.stroke();ctx.restore();
}

function drawGlobe(x,y,r,t){
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle='#1a4a66';ctx.fill();ctx.strokeStyle='#7ec8e3';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.clip();
  for(let i=-3;i<=3;i++){
    const mx=i*(r/3.2);
    ctx.beginPath();ctx.ellipse(mx,0,Math.max(2,r*0.18-Math.abs(mx)*0.08),r,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(126,200,227,.5)';ctx.stroke();
  }
  for(let j=-2;j<=2;j++){
    const my=j*(r/3);
    ctx.beginPath();ctx.ellipse(0,my,r,Math.max(2,r*0.22-Math.abs(my)*0.1),0,0,Math.PI*2);
    ctx.strokeStyle='rgba(126,200,227,.5)';ctx.stroke();
  }
  ctx.restore();
  ctx.rotate(t*0.0004);
  ctx.beginPath();ctx.ellipse(-r*0.1,-r*0.1,r*0.4,r*0.25,0.3,0,Math.PI*2);
  ctx.fillStyle='rgba(126,200,100,.55)';ctx.fill();
  ctx.restore();
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(' ');let line='';let yy=y;
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line,x,yy);line=w+' ';yy+=lh;}
    else line=test;
  }
  ctx.fillText(line,x,yy);
  return yy;
}

function drawHud(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
}

function layoutOptions(){
  const n=options.length;const w=800/n;
  return options.map((o,i)=>({o,x:i*w,y:330,w,h:70}));
}

c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const sx=(e.clientX-rect.left)*(800/rect.width),sy=(e.clientY-rect.top)*(420/rect.height);
  if(state==='start'||state==='gameover'||state==='win'){startGame();return;}
  if(state!=='playing')return;
  layoutOptions().forEach((b,i)=>{if(sx>=b.x&&sx<b.x+b.w&&sy>=b.y&&sy<b.y+b.h)choose(i);});
});
c.addEventListener('touchstart',e=>{e.preventDefault();
  const t=e.touches[0];const rect=c.getBoundingClientRect();
  const sx=(t.clientX-rect.left)*(800/rect.width),sy=(t.clientY-rect.top)*(420/rect.height);
  if(state==='start'||state==='gameover'||state==='win'){startGame();return;}
  if(state!=='playing')return;
  layoutOptions().forEach((b,i)=>{if(sx>=b.x&&sx<b.x+b.w&&sy>=b.y&&sy<b.y+b.h)choose(i);});
},{passive:false});
document.addEventListener('keydown',e=>{
  if(state==='start'||state==='gameover'||state==='win'){if(e.code==='Space'||e.code==='Enter'){startGame();}return;}
  if(state!=='playing')return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=options.length)choose(n-1);
});

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  ctx.clearRect(0,0,800,420);
  const bg=ctx.createLinearGradient(0,0,0,420);
  bg.addColorStop(0,'#071c28');bg.addColorStop(1,'#0c2d3d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,420);

  if(state==='start'){
    ctx.fillStyle='#7ec8e3';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('mp_title','MAP PROJECTION'),400,150);
    ctx.font='18px Arial';ctx.fillStyle='#cfe';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to start'),400,200);
    drawGlobe(400,290,55,ts);
    requestAnimationFrame(loop);return;
  }
  if(state==='gameover'||state==='win'){
    ctx.fillStyle=state==='win'?'#7ec850':'#ff6b6b';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t(state==='win'?'win_title':'game_over_title',state==='win'?'ATLAS COMPLETE!':'GAME OVER'),400,170);
    ctx.font='20px Arial';ctx.fillStyle='#fff';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,210);
    ctx.font='16px Arial';ctx.fillStyle='#cfe';
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Space to restart'),400,245);
    drawHud();
    requestAnimationFrame(loop);return;
  }

  timer-=dt;
  if(timer<=0&&state==='playing'){timer=0;lives--;SFX.fail();state='wrong';flashT=800;}

  // Brief
  ctx.textAlign='center';ctx.fillStyle='#ffd54f';ctx.font='bold 16px Arial';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),400,26);
  ctx.fillStyle='#fff';ctx.font='17px Arial';ctx.textAlign='left';
  wrapText(I18N.t('brief_label','Use case: ')+(current?current.useCase:''),40,56,720,22);

  // timer bar
  const pct=Math.max(0,timer/timeLimit);
  ctx.fillStyle='#132f3d';ctx.fillRect(40,98,720,10);
  ctx.fillStyle=pct<0.3?'#ff6b6b':'#4fc3f7';ctx.fillRect(40,98,720*pct,10);

  // globe
  drawGlobe(400,185,52,ts);

  // options
  const boxes=layoutOptions();
  boxes.forEach((b,i)=>{
    let col='#2a6f8f';
    if(state!=='playing'&&i===selected)col=(options[i].id===current.id)?'#4caf50':'#e94560';
    else if(state!=='playing'&&options[i].id===current.id)col='#4caf50';
    ctx.fillStyle=col;ctx.fillRect(b.x+6,b.y,b.w-12,b.h);
    drawShape(options[i].shape,b.x+b.w/2,b.y+30,b.w*0.5,32,'#fff');
    ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText((i+1)+'. '+I18N.t('proj_'+options[i].id,options[i].name),b.x+b.w/2,b.y+58);
  });

  drawHud();

  if(state==='correct'||state==='wrong'){
    flashT-=dt;
    ctx.fillStyle=state==='correct'?'rgba(76,175,80,.18)':'rgba(233,69,96,.22)';
    ctx.fillRect(0,0,800,420);
    if(flashT<=0)afterFlash();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
