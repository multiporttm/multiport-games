<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Ride Tycoon</title><meta name="description" content="Play Ride Tycoon free online — Build and upgrade theme park rides, collect ticket income, and grow your park empire."><link rel="canonical" href="https://games.multiportllc.com/games/ridetycoon"><meta property="og:title" content="Ride Tycoon - Multiport Games"><meta property="og:description" content="Play Ride Tycoon free online — Build and upgrade theme park rides, collect ticket income, and grow your park empire."><meta property="og:url" content="https://games.multiportllc.com/games/ridetycoon"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Ride Tycoon","description":"Play Ride Tycoon free online instantly. Build and upgrade theme park rides, collect ticket income, and grow your park empire. No download or signup required.","genre":"Casual","url":"https://games.multiportllc.com/games/ridetycoon","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0f3d2e;cursor:pointer}
#ui{color:#a5d6a7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ride Tycoon</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Tickets: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap a ride slot to collect its earned tickets, or tap an empty/upgradeable slot to build or upgrade it (cost shown). Higher-level rides earn tickets faster automatically over time.</div>
</div>
<script>
const W=360,H=360,COLS=3,ROWS=3,CELL=W/COLS;
let rides,tickets,state;

function loadBest(){return +(localStorage.getItem('ridetycoon_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('ridetycoon_best',v);}

function costFor(level){return Math.floor(20*Math.pow(1.6,level));}
function rateFor(level){return level*0.15;}
const EMOJIS=['🎡','🎢','🎠','🚂','🛞','🎪','🏰','⛲','🎯'];

function init(){
  rides=[];
  for(let i=0;i<COLS*ROWS;i++)rides.push({level:0,banked:0,emoji:EMOJIS[i]});
  tickets=0;state='play';
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  const idx=row*COLS+col;
  if(idx<0||idx>=rides.length)return;
  const r=rides[idx];
  if(r.banked>0.5){
    tickets+=Math.floor(r.banked);
    r.banked=0;
    SFX.coin();
  }else{
    const cost=costFor(r.level);
    if(tickets>=cost){
      tickets-=cost;r.level++;
      SFX.powerup();
      saveBest(tickets);
    }else{
      SFX.error();
    }
  }
  updateUI();
});

let last=performance.now();
function update(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  rides.forEach(r=>{
    if(r.level>0)r.banked+=rateFor(r.level)*dt;
  });
}

function draw(now){
  ctx.fillStyle='#0f3d2e';ctx.fillRect(0,0,W,H);
  rides.forEach((r,i)=>{
    const col=i%COLS,row=Math.floor(i/COLS);
    const x=col*CELL,y=row*CELL;
    ctx.fillStyle=r.level>0?'#1b5e20':'#263238';
    ctx.fillRect(x+4,y+4,CELL-8,CELL-8);
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.strokeRect(x+4,y+4,CELL-8,CELL-8);

    ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=r.level>0?1:0.3;
    ctx.fillText(r.emoji,x+CELL/2,y+CELL/2-14);
    ctx.globalAlpha=1;

    ctx.font='12px Arial';ctx.fillStyle='#fff';
    ctx.fillText(`Lv${r.level}`,x+CELL/2,y+CELL/2+14);
    if(r.banked>0.5){
      ctx.fillStyle='#ffd54f';
      ctx.fillText(`+${Math.floor(r.banked)} 🎫`,x+CELL/2,y+CELL/2+30);
    }else{
      ctx.fillStyle='#90caf9';
      ctx.fillText(`Build: ${costFor(r.level)}🎫`,x+CELL/2,y+CELL/2+30);
    }
  });

  update(now);
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Tickets: ${tickets}`;
}

init();
requestAnimationFrame(draw);
setInterval(updateUI,300);
</script></body></html>
