<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d1b3e,#1a2a6c);display:block;border-radius:8px;margin:0 auto}
#stats{color:#cfd8ff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
#msg{color:#ffd54f;text-align:center;font-weight:800;min-height:1.6em}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Planet Alignment</div>
  <div class="game-frame">
    <div id="stats"><span id="alignedLbl">Alignments: 0</span><span id="bestLbl">Best time: --</span><span id="levelLbl">Planets: 4</span></div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="msg"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click two planets to <b>swap</b> their positions. Arrange them in order from <b>smallest to largest</b> — the round completes automatically once the order is correct. Each round adds another planet.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const alignedLbl=document.getElementById('alignedLbl'),bestLbl=document.getElementById('bestLbl'),levelLbl=document.getElementById('levelLbl'),msgEl=document.getElementById('msg');
let aligned=0,best=parseFloat(localStorage.getItem('planetalignment_best')||'0')||0;
let level=4;
const PALETTE=[
  {name:'Mercury',color:'#b5a89a'},
  {name:'Mars',color:'#c1440e'},
  {name:'Venus',color:'#e8c27e'},
  {name:'Earth',color:'#3b82c4'},
  {name:'Neptune',color:'#3457d5'},
  {name:'Uranus',color:'#7fdbe0'},
  {name:'Saturn',color:'#e0c16c'},
  {name:'Jupiter',color:'#d9a066'}
];
let planets=[],order=[],selected=-1,startTime=0,solved=false;

if(best>0)bestLbl.textContent=I18N.t('planet_best_label','Best time: {t}s').replace('{t}',best.toFixed(1));

function setup(){
  solved=false;selected=-1;
  msgEl.textContent='';
  const n=level;
  const chosen=PALETTE.slice(0,n).map((p,i)=>({...p,radius:14+i*7,correctIndex:i}));
  // shuffle positions
  const shuffled=chosen.slice();
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  // ensure not already solved
  let tries=0;
  while(isSorted(shuffled)&&tries<20){
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    tries++;
  }
  planets=shuffled;
  levelLbl.textContent=I18N.t('planet_level_label','Planets: {n}').replace('{n}',n);
  startTime=performance.now();
  draw();
}

function isSorted(arr){
  for(let i=1;i<arr.length;i++)if(arr[i].correctIndex<arr[i-1].correctIndex)return false;
  return true;
}

function slotX(i){
  const n=planets.length;
  const margin=70;
  const usable=800-margin*2;
  return margin+usable*(i/(n-1||1));
}

function draw(){
  ctx.clearRect(0,0,800,300);
  // sun
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(40,150,26,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffecb3';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(70,150);ctx.lineTo(760,150);ctx.stroke();
  planets.forEach((p,i)=>{
    const x=slotX(i),y=150;
    ctx.beginPath();
    ctx.arc(x,y,p.radius,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    if(i===selected){
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,p.radius+6,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle='#e8eaf6';ctx.font='12px Arial';ctx.textAlign='center';
    ctx.fillText(p.name,x,y+p.radius+18);
  });
}

function posToIndex(x,y){
  for(let i=0;i<planets.length;i++){
    const px=slotX(i),py=150,r=planets[i].radius;
    if(Math.hypot(x-px,y-py)<=r+8)return i;
  }
  return -1;
}

function handleClick(clientX,clientY){
  if(solved)return;
  const rect=c.getBoundingClientRect();
  const x=(clientX-rect.left)*(800/rect.width);
  const y=(clientY-rect.top)*(300/rect.height);
  const idx=posToIndex(x,y);
  if(idx<0)return;
  if(selected<0){
    selected=idx;
    SFX.select();
  }else if(selected===idx){
    selected=-1;
  }else{
    [planets[selected],planets[idx]]=[planets[idx],planets[selected]];
    selected=-1;
    SFX.click();
    if(isSorted(planets)){
      solved=true;
      const t=(performance.now()-startTime)/1000;
      aligned++;
      alignedLbl.textContent=I18N.t('planet_aligned_label','Alignments: {n}').replace('{n}',aligned);
      if(best===0||t<best){
        best=t;
        localStorage.setItem('planetalignment_best',best.toFixed(2));
        bestLbl.textContent=I18N.t('planet_best_label','Best time: {t}s').replace('{t}',best.toFixed(1));
      }
      msgEl.textContent=I18N.t('planet_solved','Aligned in {t}s! Next round…').replace('{t}',t.toFixed(1));
      SFX.win();
      level=Math.min(level+1,8);
      setTimeout(setup,1300);
    }
  }
  draw();
}

c.addEventListener('click',e=>handleClick(e.clientX,e.clientY));
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];handleClick(t.clientX,t.clientY);},{passive:false});

setup();
</script></body></html>
