<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d1b3e,#5e0d3e);display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#launchBtn{display:block;margin:10px auto 0;padding:12px 34px;background:#ffd54f;border:none;border-radius:26px;color:#221;font-weight:900;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #b8952e}
#launchBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8952e}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">New Year's Countdown</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
    <button id="launchBtn">🎆 Launch Firework</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">
    Watch the beat marks tick down and press <b>Space</b> or tap <b>Launch Firework</b> right as the marker crosses each cue for a big, colorful burst. Miss the timing and you'll get a weak fizzling dud. Land every cue through midnight for a huge finale bonus!
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let hi=parseFloat(localStorage.getItem('nyc_hi')||'0');
let score=0,fireworks=[],particles=[];
let cues=[],cueIndex=0,started=false,finished=false;
let barPos=0,barSpeed=0,cueWindow=90; // px window considered "on time"
const CUE_COUNT=10;
let hitCount=0,totalCue=0,accSum=0;
let resultShown=false;

function reset(){
  score=0;fireworks=[];particles=[];cueIndex=0;started=false;finished=false;
  barPos=0;barSpeed=2.6;hitCount=0;totalCue=0;accSum=0;resultShown=false;
  cues=[];
  const spacing=(680-120)/(CUE_COUNT-1);
  for(let i=0;i<CUE_COUNT;i++){
    cues.push({x:120+i*spacing+ (Math.random()*16-8)});
  }
}
reset();

function startGame(){
  if(started||finished)return;
  started=true;
}

function launch(){
  if(finished){ SFX.click(); reset(); return; }
  if(!started){ started=true; }
  if(cueIndex>=cues.length)return;
  const cue=cues[cueIndex];
  const dist=Math.abs(barPos-cue.x);
  totalCue++;
  let quality;
  if(dist<18){quality=1;}
  else if(dist<45){quality=0.6;}
  else if(dist<cueWindow){quality=0.3;}
  else {quality=0.05;}
  accSum+=quality;
  if(quality>=0.6)hitCount++;
  const pts=Math.round(quality*100);
  score+=pts;
  spawnFirework(quality);
  if(quality>=0.6)SFX.success(); else SFX.fail();
  cueIndex++;
  if(cueIndex>=cues.length){
    finished=true;
    const acc=accSum/totalCue;
    const bonus=Math.round(acc*500);
    score+=bonus;
    if(score>hi){hi=score;localStorage.setItem('nyc_hi',String(hi));}
    SFX.win();
  }
}

document.getElementById('launchBtn').addEventListener('click',launch);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();launch();}});
c.addEventListener('click',launch);
c.addEventListener('touchstart',e=>{e.preventDefault();launch();},{passive:false});

function spawnFirework(quality){
  const colors=quality>=1?['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb']:quality>=0.6?['#ffd740','#69f0ae']:['#888','#555'];
  const count=Math.round(20+quality*60);
  const x=100+Math.random()*600, y=100+Math.random()*150;
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=(1+Math.random()*3)*(0.4+quality);
    particles.push({
      x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:40+Math.random()*30,age:0,
      color:colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<40;i++){
    const sx=(i*53)%W, sy=(i*97)%180;
    ctx.fillRect(sx,sy,2,2);
  }

  // particles
  particles=particles.filter(p=>p.age<p.life);
  particles.forEach(p=>{
    p.age++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;
    const alpha=1-p.age/p.life;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // track / cue bar
  const trackY=320;
  ctx.strokeStyle='rgba(255,255,255,.3)';
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(60,trackY);ctx.lineTo(740,trackY);ctx.stroke();

  cues.forEach((cue,i)=>{
    ctx.fillStyle= i<cueIndex ? 'rgba(255,255,255,.25)' : '#ffd54f';
    ctx.beginPath();ctx.arc(cue.x,trackY,10,0,Math.PI*2);ctx.fill();
  });

  if(started&&!finished){
    barPos+=barSpeed;
    // auto-miss any cue the bar has fully passed without a launch
    while(cueIndex<cues.length && barPos-cues[cueIndex].x>cueWindow){
      totalCue++;accSum+=0.05;
      cueIndex++;
      SFX.error();
    }
    if(cueIndex>=cues.length&&!finished){
      finished=true;
      const acc=accSum/totalCue;
      const bonus=Math.round(acc*500);
      score+=bonus;
      if(score>hi){hi=score;localStorage.setItem('nyc_hi',String(hi));}
      SFX.win();
    }
    if(barPos>760)barPos=760;
  }
  // moving marker
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(barPos,trackY-24);ctx.lineTo(barPos-9,trackY-6);ctx.lineTo(barPos+9,trackY-6);ctx.closePath();ctx.fill();

  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  if(!started){
    ctx.fillText(I18N.t('nyc_start','Tap Launch Firework or press Space to begin!'),400,60);
  } else if(!finished){
    ctx.fillText(I18N.t('nyc_cue','Cue ')+(cueIndex+1)+' / '+cues.length,400,60);
  } else {
    ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('nyc_happy','🎉 HAPPY NEW YEAR! 🎉'),400,50);
    ctx.font='20px Arial';
    const acc=Math.round((accSum/totalCue)*100);
    ctx.fillText(I18N.t('nyc_final','Accuracy: {a}% | Final Score: {s}').replace('{a}',acc).replace('{s}',Math.round(score)),400,85);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('nyc_replay','Tap Launch Firework to play again'),400,115);
  }

  document.getElementById('score-display').textContent=I18N.t('nyc_score_hi','Score: {s} | Hi: {h}').replace('{s}',Math.round(score)).replace('{h}',Math.round(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
