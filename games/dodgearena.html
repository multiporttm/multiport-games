<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#12081a}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#deflect-btn{display:block;margin:10px auto;padding:14px 40px;background:rgba(233,69,96,.2);border:1px solid rgba(233,69,96,.4);border-radius:50px;color:#ff8fa3;font-family:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
#deflect-btn:active{background:rgba(233,69,96,.4)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dodge Arena</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">Streak: 0 | Best: 0</div>
    <canvas id="c" width="320" height="320"></canvas>
    <button id="deflect-btn">⚡ DEFLECT</button>
  </div>
  <div class="game-instructions">A ball is flying toward you — the ring shrinks as it closes in. Tap <b>DEFLECT</b> (or press Space) right when it's inside the golden zone. Too early or too late and you're hit!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=320,H=320,CX=W/2,CY=H/2,MAXR=140,ZONE_R=[55,80];
let radius,shrinking,speed,streak,best=+(localStorage.getItem('dodgearena_best')||0),state,roundActive;

function loadBest(){return +(localStorage.getItem('dodgearena_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('dodgearena_best',v);}

function init(){
  streak=0;best=loadBest();
  state='ready';
  nextRound();
}

function nextRound(){
  radius=MAXR;
  speed=1.6+streak*0.12;
  roundActive=true;
  state='play';
}

function attempt(){
  if(state==='over'){init();return;}
  if(!roundActive)return;
  roundActive=false;
  if(radius>=ZONE_R[0]&&radius<=ZONE_R[1]){
    streak++;
    if(streak>best){best=streak;saveBest(best);}
    setTimeout(nextRound,400);
  } else {
    state='over';
  }
  updateUI();
}

document.getElementById('deflect-btn').addEventListener('click',attempt);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();attempt();}});

function update(){
  if(state!=='play'||!roundActive)return;
  radius-=speed;
  if(radius<=0){
    state='over';
    roundActive=false;
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#12081a';ctx.fillRect(0,0,W,H);

  // Zone ring
  ctx.strokeStyle='rgba(255,193,7,.5)';
  ctx.lineWidth=(ZONE_R[1]-ZONE_R[0]);
  ctx.beginPath();ctx.arc(CX,CY,(ZONE_R[0]+ZONE_R[1])/2,0,Math.PI*2);ctx.stroke();

  // Center target
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.arc(CX,CY,18,0,Math.PI*2);ctx.fill();

  // Incoming ball ring
  if(state==='play'){
    ctx.strokeStyle='#ce93d8';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(CX,CY,Math.max(0,radius),0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#ce93d8';
    const bx=CX+Math.max(0,radius),by=CY;
    ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff8fa3';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('HIT!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Streak: ${streak}`,W/2,H/2+12);
    ctx.fillText('Tap DEFLECT to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Streak: ${streak} | Best: ${best}`;
}

init();updateUI();draw();
</script></body></html>
