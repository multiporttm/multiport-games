<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1a3a;display:block;border-radius:8px}
#score-display{color:#ffb6c1;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#controls{margin:10px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#controls button{padding:10px 14px;background:#7a4ea3;border:none;border-radius:14px;color:#fff;cursor:pointer;font-size:1rem}
#controls button:disabled{opacity:.35;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sundae Topping Assembly</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
    <div id="controls">
      <button id="b1" onclick="addLayer(0)">1 🍨 Scoop</button>
      <button id="b2" onclick="addLayer(1)">2 🍫 Sauce</button>
      <button id="b3" onclick="addLayer(2)">3 🍦 Whip</button>
      <button id="b4" onclick="addLayer(3)">4 🥜 Nuts</button>
      <button id="b5" onclick="addLayer(4)">5 🍒 Cherry</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the order ticket and add toppings in the exact order shown using keys <b>1-5</b> or the buttons: Scoop, Sauce, Whip, Nuts, Cherry. Finish the whole sundae before the melt timer runs out. A wrong topping or a melt costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const ITEMS=[
  {name:'Scoop',emoji:'🍨',color:'#f5deb3'},
  {name:'Sauce',emoji:'🍫',color:'#5c3317'},
  {name:'Whip',emoji:'🍦',color:'#fffaf0'},
  {name:'Nuts',emoji:'🥜',color:'#c19a6b'},
  {name:'Cherry',emoji:'🍒',color:'#c41e3a'}
];
const HS_KEY='hs_sundaetoppingassembly';
let score=0,lives=3,level=1,served=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let started=false,gameOverFlag=false;
let ticket=[],progress=0,glass=[];
let roundTime=0,roundLimit=18000;
let flashMsg='',flashTimer=0,flashColor='#fff';
let lastTime=null;

function genTicket(){
  const len=Math.min(8,3+Math.floor(level/1.3));
  const seq=[0]; // always start with a scoop
  const extraScoopChance=0.3;
  for(let i=1;i<len-(Math.random()<0.6+level*0.03?1:0);i++){
    let pool=[0,1,2,3];
    seq.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  if(Math.random()<0.55+level*0.03)seq.push(4); // cherry on top, sometimes
  return seq;
}

function newTicket(){
  ticket=genTicket();
  progress=0;
  glass=[];
  roundTime=0;
  roundLimit=Math.max(8000,18000-level*900);
  updateUI();
}

function addLayer(i){
  if(!started||gameOverFlag)return;
  const expected=ticket[progress];
  if(i===expected){
    glass.push(ITEMS[i]);
    progress++;
    SFX.point();
    if(progress>=ticket.length){
      const timeBonus=Math.round(Math.max(0,(roundLimit-roundTime)/roundLimit)*60);
      const pts=ticket.length*20+timeBonus+level*5;
      score+=pts;
      served++;
      flashMsg=I18N.t('sundae_done','Sundae complete! +')+pts;
      flashColor='#3fae56';flashTimer=70;
      SFX.success();
      if(served%3===0)level++;
      setTimeout(()=>{ if(!gameOverFlag)newTicket(); },700);
    }
  }else{
    SFX.error();
    loseLife(I18N.t('wrong_topping','Wrong topping! Sundae ruined.'));
  }
  updateUI();
}

function loseLife(msg){
  lives--;
  flashMsg=msg;flashColor='#e24c4c';flashTimer=70;
  if(lives<=0){
    endGame();
  }else{
    setTimeout(()=>{ if(!gameOverFlag)newTicket(); },700);
  }
}

function endGame(){
  gameOverFlag=true;
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
}

function startGame(){
  score=0;lives=3;level=1;served=0;started=true;gameOverFlag=false;
  newTicket();
}

function updateUI(){
  const disable=!started||gameOverFlag;
  ['b1','b2','b3','b4','b5'].forEach(id=>document.getElementById(id).disabled=disable);
  document.getElementById('score-display').textContent=
    I18N.t('score_lives_hi_label','Score: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

document.addEventListener('keydown',e=>{
  if(!started||gameOverFlag){ if(e.code==='Space'){startGame();} return; }
  if(e.code==='Digit1')addLayer(0);
  else if(e.code==='Digit2')addLayer(1);
  else if(e.code==='Digit3')addLayer(2);
  else if(e.code==='Digit4')addLayer(3);
  else if(e.code==='Digit5')addLayer(4);
});
c.addEventListener('pointerdown',()=>{ if(!started||gameOverFlag)startGame(); });
c.addEventListener('touchstart',e=>{ e.preventDefault(); if(!started||gameOverFlag)startGame(); },{passive:false});

function drawTicket(){
  ctx.fillStyle='#fff';
  ctx.fillRect(40,20,280,150);
  ctx.strokeStyle='#ccc';ctx.strokeRect(40,20,280,150);
  ctx.fillStyle='#222';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('ticket_label','ORDER TICKET'),52,42);
  ticket.forEach((idx,i)=>{
    const item=ITEMS[idx];
    const done=i<progress;
    ctx.fillStyle=done?'#9bd99b':'#333';
    ctx.font=(done?'italic ':'')+'15px Arial';
    ctx.fillText((i+1)+'. '+item.emoji+' '+item.name+(done?' ✓':''),52,64+i*16);
  });
}

function drawGlass(){
  const gx=460,gw=260,gBottom=360;
  ctx.strokeStyle='#ddd';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(gx,60);ctx.lineTo(gx+40,gBottom);ctx.lineTo(gx+gw-40,gBottom);ctx.lineTo(gx+gw,60);
  ctx.stroke();
  let y=gBottom-10;
  glass.forEach(item=>{
    const h=28;
    ctx.fillStyle=item.color;
    ctx.beginPath();
    ctx.ellipse(gx+gw/2,y,70,16,0,0,Math.PI*2);
    ctx.fill();
    ctx.font='20px Arial';ctx.textAlign='center';
    ctx.fillText(item.emoji,gx+gw/2,y+6);
    y-=h;
  });
}

function drawTimer(){
  const pct=Math.max(0,1-roundTime/roundLimit);
  ctx.fillStyle='#555';ctx.fillRect(40,200,280,16);
  ctx.fillStyle=pct<0.3?'#e24c4c':'#3fae56';
  ctx.fillRect(40,200,280*pct,16);
  ctx.fillStyle='#ccc';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('melt_timer_label','Melt timer'),40,196);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3a2050');bg.addColorStop(1,'#2a1a3a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space or Tap to start'),W/2,200);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?16.6667:Math.min(now-lastTime,50);
  lastTime=now;

  if(gameOverFlag){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,150);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: ')+score,W/2,190);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,224);
  }else{
    roundTime+=dt;
    if(roundTime>=roundLimit){
      SFX.fail();
      loseLife(I18N.t('melted2','The sundae melted!'));
      roundTime=0;
    }
    drawTicket();
    drawGlass();
    drawTimer();
    if(flashTimer>0){
      flashTimer-=dt/16.6667;
      ctx.fillStyle=flashColor;ctx.font='bold 20px Arial';ctx.textAlign='center';
      ctx.globalAlpha=Math.min(1,flashTimer/30);
      ctx.fillText(flashMsg,W/2,340);
      ctx.globalAlpha=1;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
updateUI();
</script></body></html>
