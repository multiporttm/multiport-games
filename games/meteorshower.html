<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#050512;display:block;border-radius:8px;touch-action:none}
#score-display{color:#8fd3ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Meteor Shower</div>
  <div class="game-frame">
    <div id="score-display">Stardust: 0 | Time: 0s | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or <b>drag/touch</b> on mobile) to fly your ship. The screen wraps at every edge — fly off one side and reappear on the other. Dodge meteors and collect glowing <b>stardust</b> for score!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
let stardust=0,elapsed=0,hi=parseFloat(localStorage.getItem('meteorshower_hi')||'0');
let gameOver=false,started=false;
const ship={x:W/2,y:H/2,vx:0,vy:0,angle:0,r:11};
const keys={};
let meteors=[],dust=[];
let lastTime=null,meteorTimer=0,dustTimer=0,meteorInterval=900;
let pointerTarget=null;

function wrap(o){
  if(o.x<0)o.x+=W; if(o.x>W)o.x-=W;
  if(o.y<0)o.y+=H; if(o.y>H)o.y-=H;
}

function reset(){
  stardust=0;elapsed=0;gameOver=false;started=false;
  ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.angle=0;
  meteors=[];dust=[];lastTime=null;meteorTimer=0;dustTimer=0;meteorInterval=900;
}
reset();

function spawnMeteor(){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-20;}
  else if(edge===1){x=W+20;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}
  const angle=Math.random()*Math.PI*2;
  const speed=1+Math.random()*1.8+elapsed/6000;
  const size=14+Math.random()*22;
  meteors.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:size,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.05});
}

function spawnDust(){
  dust.push({x:Math.random()*W,y:Math.random()*H,r:6,phase:Math.random()*Math.PI*2});
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function startOrRestart(){
  if(gameOver){reset();return;}
  started=true;
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space')startOrRestart();
  if(!started&&!gameOver)startOrRestart();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

c.addEventListener('click',()=>{startOrRestart();});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  startOrRestart();
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  pointerTarget={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  pointerTarget={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
},{passive:false});
c.addEventListener('touchend',()=>{pointerTarget=null;});

function drawShip(){
  ctx.save();
  ctx.translate(ship.x,ship.y);
  ctx.rotate(ship.angle);
  ctx.fillStyle='#8fd3ff';
  ctx.beginPath();
  ctx.moveTo(14,0);
  ctx.lineTo(-10,8);
  ctx.lineTo(-6,0);
  ctx.lineTo(-10,-8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#ff9f43';
  ctx.beginPath();
  ctx.moveTo(-6,0);ctx.lineTo(-14,4);ctx.lineTo(-14,-4);ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMeteor(m){
  ctx.save();
  ctx.translate(m.x,m.y);
  ctx.rotate(m.rot);
  ctx.fillStyle='#7a6a58';
  ctx.beginPath();
  const pts=8;
  for(let i=0;i<pts;i++){
    const a=(i/pts)*Math.PI*2;
    const rr=m.r*(0.8+0.2*Math.sin(i*2.1));
    ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#4d4136';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function drawDust(d,t){
  const glow=0.5+0.5*Math.sin(t/200+d.phase);
  ctx.save();
  ctx.globalAlpha=0.6+0.4*glow;
  ctx.fillStyle='#fff59d';
  ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.2*glow;
  ctx.beginPath();ctx.arc(d.x,d.y,d.r*2.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(ts){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#050512');bg.addColorStop(1,'#0e1030');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // starfield
  ctx.fillStyle='#ffffff22';
  for(let i=0;i<40;i++){
    const sx=(i*97)%W, sy=(i*53+((ts||0)*0.01))%H;
    ctx.fillRect(sx,sy,2,2);
  }

  if(!started&&!gameOver){
    ctx.fillStyle='#8fd3ffcc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_meteor','Press any key / Tap to start'),W/2,H/2);
    drawShip();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    document.getElementById('score-display').textContent=I18N.t('stardust_time_hi_label','Stardust: {s} | Time: {t}s | Hi: {h}').replace('{s}',stardust).replace('{t}',Math.floor(elapsed/1000)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);
    return;
  }

  if(lastTime===null)lastTime=ts;
  const dt=Math.min(ts-lastTime,50);
  lastTime=ts;
  elapsed+=dt;
  if(elapsed>hi){hi=elapsed;}

  // controls
  const thrust=0.22;
  let ax=0,ay=0;
  if(keys['ArrowUp']||keys['KeyW'])ay-=thrust;
  if(keys['ArrowDown']||keys['KeyS'])ay+=thrust;
  if(keys['ArrowLeft']||keys['KeyA'])ax-=thrust;
  if(keys['ArrowRight']||keys['KeyD'])ax+=thrust;
  if(pointerTarget){
    const ddx=pointerTarget.x-ship.x, ddy=pointerTarget.y-ship.y;
    const dd=Math.hypot(ddx,ddy)||1;
    ax+=(ddx/dd)*thrust*1.6;
    ay+=(ddy/dd)*thrust*1.6;
  }
  ship.vx=(ship.vx+ax*dt*0.1)*0.96;
  ship.vy=(ship.vy+ay*dt*0.1)*0.96;
  ship.x+=ship.vx*dt*0.1;
  ship.y+=ship.vy*dt*0.1;
  if(Math.hypot(ship.vx,ship.vy)>0.3)ship.angle=Math.atan2(ship.vy,ship.vx);
  wrap(ship);

  // spawn
  meteorTimer+=dt;
  meteorInterval=Math.max(280,900-elapsed/40);
  if(meteorTimer>=meteorInterval){meteorTimer=0;spawnMeteor();}
  dustTimer+=dt;
  if(dustTimer>=1400){dustTimer=0;if(dust.length<6)spawnDust();}

  // update meteors
  meteors.forEach(m=>{
    m.x+=m.vx*dt*0.1;m.y+=m.vy*dt*0.1;m.rot+=m.rotSpeed*dt*0.1;
    wrap(m);
    drawMeteor(m);
    if(dist(ship,m)<ship.r+m.r*0.65){
      gameOver=true;
      SFX.lose();
      if(stardust>0 || elapsed>0){
        localStorage.setItem('meteorshower_hi',String(Math.max(hi,elapsed)));
      }
    }
  });

  // update dust
  dust=dust.filter(d=>{
    drawDust(d,ts);
    if(dist(ship,d)<ship.r+d.r){
      stardust++;
      SFX.coin();
      return false;
    }
    return true;
  });

  drawShip();

  document.getElementById('score-display').textContent=I18N.t('stardust_time_hi_label','Stardust: {s} | Time: {t}s | Hi: {h}').replace('{s}',stardust).replace('{t}',Math.floor(elapsed/1000)).replace('{h}',Math.floor(hi/1000));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
