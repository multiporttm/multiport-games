<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#16213e;border-radius:14px;padding:18px;text-align:center;max-width:560px;margin:0 auto}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:6px 0;min-height:1.6em}
#stats{color:#ffd54f;font-weight:700;margin-bottom:8px}
#order{background:#0b3d2e;border-radius:12px;padding:14px;margin:10px auto;min-height:60px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.orderIcon{font-size:2rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#08281d;border-radius:8px}
#timerBarWrap{background:#333;border-radius:8px;height:12px;margin:8px auto;overflow:hidden;max-width:400px}
#timerBar{background:#4caf50;height:100%;width:100%;transition:width .1s linear}
#progress{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:50px;margin:10px 0}
.slot{width:40px;height:40px;border:2px dashed #666;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:#1a1a2e}
.slot.filled{border-style:solid;border-color:#e94560;background:#08281d}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.ingredient{font-size:2rem;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#fdfdfd;border-radius:10px;cursor:pointer;transition:transform .1s}
.ingredient:active{transform:scale(.9)}
#rollBtn{padding:10px 28px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1.05rem;font-weight:800;margin-top:8px}
#rollBtn:disabled{opacity:.4;cursor:not-allowed}
#lives{color:#ff6b6b;font-size:1.2rem;margin-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sushi Roll</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="lives">Lives: ❤️❤️❤️</div>
      <div id="stats">Rolls Made: 0 | Best: 0</div>
      <div id="status">Watch the order, then click ingredients in order!</div>
      <div id="order"></div>
      <div id="timerBarWrap"><div id="timerBar"></div></div>
      <div id="progress"></div>
      <div id="tray"></div>
      <button id="rollBtn" onclick="tryRoll()">🍣 Roll</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>order card</b>, then click the ingredients from the tray in the <b>exact order</b> shown, and click <b>Roll</b> before the timer runs out. A wrong ingredient or a late roll costs a life!</div>
</div>
<script>
const ING=[
  {k:'rice',e:'🍚'},{k:'fish',e:'🐟'},{k:'seaweed',e:'🟢'},{k:'avocado',e:'🥑'},
  {k:'cucumber',e:'🥒'},{k:'shrimp',e:'🍤'},{k:'egg',e:'🍳'},{k:'roe',e:'🟠'}
];
let order=[],picked=[],rolls=0,best=0,lives=3,timer=0,timerMax=0,timerInt=null,locked=false;

best=parseInt(localStorage.getItem('sushiroll_best')||'0',10);

function renderTray(){
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  ING.forEach(ing=>{
    const d=document.createElement('div');
    d.className='ingredient';
    d.textContent=ing.e;
    d.title=ing.k;
    d.onclick=()=>pick(ing);
    tray.appendChild(d);
  });
}

function newOrder(){
  const len=Math.min(3+Math.floor(rolls/2),8);
  order=[];
  for(let i=0;i<len;i++) order.push(ING[Math.floor(Math.random()*ING.length)]);
  picked=[];
  locked=false;
  document.getElementById('rollBtn').disabled=false;
  const orderEl=document.getElementById('order');
  orderEl.innerHTML='';
  order.forEach(ing=>{
    const d=document.createElement('div');
    d.className='orderIcon';
    d.textContent=ing.e;
    orderEl.appendChild(d);
  });
  renderProgress();
  timerMax=2200+len*900;
  timer=timerMax;
  clearInterval(timerInt);
  timerInt=setInterval(tick,50);
  setStatus(I18N.t('sushi_new_order','New order! Click the ingredients in order.'));
}

function renderProgress(){
  const p=document.getElementById('progress');
  p.innerHTML='';
  for(let i=0;i<order.length;i++){
    const s=document.createElement('div');
    s.className='slot'+(i<picked.length?' filled':'');
    s.textContent=i<picked.length?picked[i].e:'';
    p.appendChild(s);
  }
}

function setStatus(t){document.getElementById('status').textContent=t;}

function tick(){
  if(locked)return;
  timer-=50;
  const pct=Math.max(0,timer/timerMax*100);
  document.getElementById('timerBar').style.width=pct+'%';
  document.getElementById('timerBar').style.background=pct<25?'#e94560':(pct<55?'#ffb300':'#4caf50');
  if(timer<=0){
    clearInterval(timerInt);
    loseLife(I18N.t('sushi_timeout','Out of time! The order was missed.'));
  }
}

function pick(ing){
  if(locked||order.length===0)return;
  const idx=picked.length;
  picked.push(ing);
  renderProgress();
  if(ing.k!==order[idx].k){
    SFX.error();
    loseLife(I18N.t('sushi_wrong','Wrong ingredient! Order failed.'));
    return;
  }
  SFX.select();
  if(picked.length===order.length){
    setStatus(I18N.t('sushi_ready','All ingredients placed — click Roll!'));
  }
}

function tryRoll(){
  if(locked||order.length===0)return;
  if(picked.length!==order.length){
    SFX.error();
    loseLife(I18N.t('sushi_incomplete','Rolled too early — order incomplete!'));
    return;
  }
  clearInterval(timerInt);
  locked=true;
  document.getElementById('rollBtn').disabled=true;
  SFX.success();
  rolls++;
  if(rolls>best){best=rolls;localStorage.setItem('sushiroll_best',best);}
  updateStats();
  setStatus(I18N.t('sushi_success','Roll complete! Great job!'));
  setTimeout(newOrder,900);
}

function loseLife(msg){
  locked=true;
  lives--;
  document.getElementById('rollBtn').disabled=true;
  updateLives();
  setStatus(msg);
  SFX.fail();
  if(lives<=0){
    setTimeout(()=>{
      setStatus(I18N.t('sushi_gameover','Game Over! Final rolls: {n}. Click below to restart.').replace('{n}',rolls));
      document.getElementById('order').innerHTML='<button id="rollBtn" onclick="restart()" style="padding:10px 24px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;font-weight:800">Play Again</button>';
      document.getElementById('progress').innerHTML='';
      document.getElementById('timerBar').style.width='0%';
    },700);
  } else {
    setTimeout(newOrder,1100);
  }
}

function updateLives(){
  document.getElementById('lives').textContent='Lives: '+'❤️'.repeat(Math.max(0,lives));
}
function updateStats(){
  document.getElementById('stats').textContent=I18N.t('sushi_stats','Rolls Made: {r} | Best: {b}').replace('{r}',rolls).replace('{b}',best);
}

function restart(){
  rolls=0;lives=3;
  updateLives();updateStats();
  renderTray();
  document.getElementById('rollBtn').outerHTML='<button id="rollBtn" onclick="tryRoll()">🍣 Roll</button>';
  newOrder();
}

renderTray();
updateLives();
updateStats();
newOrder();
</script></body></html>
