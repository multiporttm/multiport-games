<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#141225;display:block;border-radius:8px;touch-action:none}
#score-display{color:#b57bff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#uvBtn{display:block;margin:8px auto 0;padding:10px 26px;background:#6a1fb3;border:none;border-radius:22px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
#uvBtn:hover{background:#7e2bd1}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Escape Room Black Light Clue</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="640" height="340"></canvas>
    <button id="uvBtn">Shine UV Light (U)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Memorize the hidden symbol while it glows, then paint matching cells with UV ink using the <b>mouse/touch</b> or <b>Arrow Keys + Space</b>. Press <b>U</b> or tap <b>Shine UV Light</b> before time runs out to reveal and check your work. Be accurate — wasted ink costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLS=8,ROWS=5,CELL=80;
const GX=40,GY=40;
let level=1,score=0,hi=parseInt(localStorage.getItem('escaperoomblacklightclue_hi')||'0',10);
let lives=3,gameOver=false,started=false;
let target=new Set(),painted=new Set();
let phase='preview'; // preview | paint | result
let phaseTimer=0,previewDur=0,paintDur=0,resultTimer=0,resultMsg='',resultOk=false;
let cursorR=2,cursorC=4;
let lastTime=null;
let flashAlpha=0;

function key(r,c){return r+','+c;}

function genTarget(n){
  const s=new Set();
  while(s.size<n){
    const r=Math.floor(Math.random()*ROWS);
    const col=Math.floor(Math.random()*COLS);
    s.add(key(r,col));
  }
  return s;
}

function startRound(){
  const n=Math.min(3+level,16);
  target=genTarget(n);
  painted=new Set();
  previewDur=Math.max(1200,3000-level*140);
  paintDur=Math.max(6500,12000-level*350);
  phase='preview';
  phaseTimer=0;
}

function reset(){
  level=1;score=0;lives=3;gameOver=false;started=false;
  startRound();
}
reset();

function paintCell(r,c){
  if(r<0||c<0||r>=ROWS||c>=COLS)return;
  painted.add(key(r,c));
}

function pointerToCell(x,y){
  const col=Math.floor((x-GX)/CELL);
  const row=Math.floor((y-GY)/CELL);
  return {row,col};
}

let dragging=false;
function handlePointer(e,isDown){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  if(phase!=='paint')return;
  const rect=c.getBoundingClientRect();
  const sx=c.width/rect.width,sy=c.height/rect.height;
  const cx=((e.touches?e.touches[0].clientX:e.clientX)-rect.left)*sx;
  const cy=((e.touches?e.touches[0].clientY:e.clientY)-rect.top)*sy;
  const {row,col}=pointerToCell(cx,cy);
  if(row>=0&&row<ROWS&&col>=0&&col<COLS){
    paintCell(row,col);
    cursorR=row;cursorC=col;
  }
}

c.addEventListener('pointerdown',e=>{dragging=true;handlePointer(e,true);});
c.addEventListener('pointermove',e=>{if(dragging)handlePointer(e,false);});
window.addEventListener('pointerup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;handlePointer(e,true);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)handlePointer(e,false);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});

function doReveal(){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(phase!=='paint')return;
  let correct=0,wrong=0;
  painted.forEach(k=>{ if(target.has(k))correct++; else wrong++; });
  const acc=correct/target.size;
  const allowance=Math.max(1,Math.floor(target.size*0.3));
  resultOk = acc>=0.8 && wrong<=allowance;
  if(resultOk){
    SFX.success();
    const timeLeft=Math.max(0,paintDur-phaseTimer);
    score += level*15 + Math.round(timeLeft/150);
    if(score>hi){hi=score;localStorage.setItem('escaperoomblacklightclue_hi',String(hi));}
    level++;
    resultMsg=I18N.t('clue_correct','CLUE REVEALED!');
  } else {
    SFX.fail();
    lives--;
    resultMsg=I18N.t('clue_wrong','WRONG SPOT — INK WASTED');
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      resultMsg=I18N.t('game_over_title','GAME OVER');
    }
  }
  phase='result';
  resultTimer=0;
}

document.getElementById('uvBtn').addEventListener('click',doReveal);

document.addEventListener('keydown',e=>{
  if(!started && !gameOver){started=true;}
  if(gameOver && (e.code==='Space'||e.code==='Enter')){reset();return;}
  if(phase!=='paint')return;
  if(e.code==='ArrowUp'){e.preventDefault();cursorR=Math.max(0,cursorR-1);}
  else if(e.code==='ArrowDown'){e.preventDefault();cursorR=Math.min(ROWS-1,cursorR+1);}
  else if(e.code==='ArrowLeft'){e.preventDefault();cursorC=Math.max(0,cursorC-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();cursorC=Math.min(COLS-1,cursorC+1);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();paintCell(cursorR,cursorC);SFX.click();}
  else if(e.key==='u'||e.key==='U'){e.preventDefault();doReveal();}
});

function drawGrid(showTarget,showResult){
  for(let r=0;r<ROWS;r++){
    for(let col=0;col<COLS;col++){
      const x=GX+col*CELL,y=GY+r*CELL;
      const k=key(r,col);
      ctx.fillStyle='#1c1933';
      ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      ctx.strokeStyle='#2e2a52';
      ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
      if(showTarget && target.has(k)){
        ctx.fillStyle=`rgba(180,110,255,${0.55+0.25*Math.sin(flashAlpha)})`;
        ctx.fillRect(x+8,y+8,CELL-16,CELL-16);
      }
      if(!showResult && painted.has(k) && phase==='paint'){
        ctx.fillStyle='rgba(255,255,255,0.14)';
        ctx.fillRect(x+10,y+10,CELL-20,CELL-20);
      }
      if(showResult){
        const inTarget=target.has(k),isPainted=painted.has(k);
        if(inTarget&&isPainted){ctx.fillStyle='rgba(70,230,120,0.85)';ctx.fillRect(x+6,y+6,CELL-12,CELL-12);}
        else if(inTarget&&!isPainted){ctx.fillStyle='rgba(255,210,60,0.7)';ctx.fillRect(x+6,y+6,CELL-12,CELL-12);}
        else if(!inTarget&&isPainted){ctx.fillStyle='rgba(230,70,90,0.8)';ctx.fillRect(x+6,y+6,CELL-12,CELL-12);}
      }
      if(phase==='paint' && r===cursorR && col===cursorC){
        ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
        ctx.strokeRect(x+3,y+3,CELL-6,CELL-6);
        ctx.lineWidth=1;
      }
    }
  }
}

function loop(){
  ctx.clearRect(0,0,640,340);
  ctx.fillStyle='#0d0b1a';ctx.fillRect(0,0,640,340);

  if(!started){
    ctx.fillStyle='#b57bff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press any key / Tap to start'),320,20);
    drawGrid(false,false);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  flashAlpha+=0.12*dt;

  if(gameOver){
    drawGrid(false,true);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),320,180);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),320,215);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  phaseTimer+=dt*16.6667;

  if(phase==='preview'){
    drawGrid(true,false);
    const remain=Math.max(0,previewDur-phaseTimer);
    ctx.fillStyle='#ddd';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('memorize_hint','Memorize the glowing pattern...'),320,20);
    if(phaseTimer>=previewDur){phase='paint';phaseTimer=0;}
  } else if(phase==='paint'){
    drawGrid(false,false);
    const remain=Math.max(0,paintDur-phaseTimer);
    ctx.fillStyle=remain<2000?'#ff6b6b':'#9bd1ff';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('time_left_label','Time: {t}s').replace('{t}',(remain/1000).toFixed(1)),320,20);
    if(phaseTimer>=paintDur){doReveal();}
  } else if(phase==='result'){
    drawGrid(true,true);
    resultTimer+=dt*16.6667;
    ctx.fillStyle=resultOk?'#6ee87a':'#ff8a8a';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,320,20);
    if(resultTimer>=1400 && !gameOver){startRound();}
  }

  ctx.fillStyle='#ddd';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {l}').replace('{l}',level),10,320);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}','❤'.repeat(Math.max(0,lives))),630,320);

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
