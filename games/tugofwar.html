<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Tug of War</title><meta name="description" content="Play Tug of War free online — Mash Space or tap rapidly to pull the rope marker to your side. Win 3 rounds before the AI team to take the match."><link rel="canonical" href="https://games.multiportllc.com/games/tugofwar"><meta property="og:title" content="Tug of War - Multiport Games"><meta property="og:description" content="Play Tug of War free online — Mash Space or tap rapidly to pull the rope marker to your side. Win 3 rounds before the AI team to take the match."><meta property="og:url" content="https://games.multiportllc.com/games/tugofwar"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Tug of War","description":"Play Tug of War free online instantly. Mash Space or tap rapidly to pull the rope marker to your side. Win 3 rounds before the AI team to take the match. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/tugofwar","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#5d4037,#a1887f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe0b2;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Tug of War</div>
  <div class="game-frame">
    <div id="score-display">Rounds: 0 - 0 | Matches Won: 0</div>
    <canvas id="c" width="800" height="250"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Mash <b>Space</b> or <b>Click/Tap</b> as fast as you can to pull the rope marker to your side. First to win 3 rounds takes the match!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=250;
let hiMatches=parseInt(localStorage.getItem('tugofwar_hi')||'0',10);

let pos,playerForce,aiForce,aiPhase,roundWinsP,roundWinsA,matchOver,roundOver,started,resultTimer,lastTime;

function resetRound(){
  pos=0.5;playerForce=0;aiForce=0;aiPhase=Math.random()*10;roundOver=false;resultTimer=0;
}
function resetMatch(){
  roundWinsP=0;roundWinsA=0;matchOver=false;started=false;lastTime=null;
  resetRound();
}
resetMatch();

function pull(){
  if(matchOver){resetMatch();return;}
  if(!started){started=true;lastTime=null;}
  if(roundOver)return;
  playerForce=Math.min(2.2,playerForce+0.55);
  SFX.click();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)pull();}
});
c.addEventListener('mousedown',pull);
c.addEventListener('touchstart',e=>{e.preventDefault();pull();},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('tug_score_label','Rounds: {p} - {a} | Matches Won: {m}')
      .replace('{p}',roundWinsP).replace('{a}',roundWinsA).replace('{m}',hiMatches);
}

function drawScene(){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#5d4037');grad.addColorStop(1,'#a1887f');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // ground line
  ctx.fillStyle='#3e2723';ctx.fillRect(0,H-30,W,30);

  // rope
  const ropeY=H/2;
  const markerX=100+pos*(W-200);
  ctx.strokeStyle='#4e342e';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(60,ropeY);ctx.lineTo(W-60,ropeY);ctx.stroke();

  // center line
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(W/2,ropeY-40);ctx.lineTo(W/2,ropeY+40);ctx.stroke();
  ctx.setLineDash([]);

  // win zones
  ctx.fillStyle='rgba(255,235,59,0.15)';ctx.fillRect(60,ropeY-50,60,100);
  ctx.fillRect(W-120,ropeY-50,60,100);

  // marker (knot)
  ctx.fillStyle='#ffca28';
  ctx.beginPath();ctx.arc(markerX,ropeY,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e65100';ctx.lineWidth=3;ctx.stroke();

  // player team (left)
  ctx.fillStyle='#42a5f5';
  for(let i=0;i<3;i++){
    ctx.fillRect(20+i*14,ropeY+10,10,40);
    ctx.beginPath();ctx.arc(25+i*14,ropeY+4,8,0,Math.PI*2);ctx.fill();
  }
  // ai team (right)
  ctx.fillStyle='#ef5350';
  for(let i=0;i<3;i++){
    ctx.fillRect(W-30-i*14,ropeY+10,10,40);
    ctx.beginPath();ctx.arc(W-25-i*14,ropeY+4,8,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('tug_you_label','YOU'),20,ropeY-30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('tug_ai_label','AI TEAM'),W-20,ropeY-30);
  ctx.textAlign='center';
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  drawScene();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tug_start_hint','Mash Space / Tap to start pulling!'),W/2,40);
    requestAnimationFrame(loop);return;
  }

  if(matchOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(roundWinsP>roundWinsA?I18N.t('tug_match_win','MATCH WON!'):I18N.t('tug_match_lose','MATCH LOST'),W/2,40);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,70);
    requestAnimationFrame(loop);return;
  }

  if(roundOver){
    resultTimer+=dt;
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(pos<=0?I18N.t('tug_ai_scores','AI Team Scores!'):I18N.t('tug_you_score','You Score!'),W/2,40);
    if(resultTimer>60){
      resetRound();
    }
    updateScoreDisplay();
    requestAnimationFrame(loop);return;
  }

  // AI dynamic force: fluctuating rhythm with random bursts
  aiPhase+=0.05*dt;
  aiForce=1.1+Math.sin(aiPhase)*0.5+Math.random()*0.6;

  // Player force decays over time (need to keep mashing)
  playerForce=Math.max(0,playerForce-0.035*dt);

  const net=(playerForce-aiForce)*0.0022*dt;
  pos+=net;
  pos=Math.max(0,Math.min(1,pos));

  if(pos<=0.001||pos>=0.999){
    roundOver=true;
    if(pos<=0.001){roundWinsA++;SFX.hit();}else{roundWinsP++;SFX.point();}
    if(roundWinsP>=3||roundWinsA>=3){
      matchOver=true;
      if(roundWinsP>roundWinsA){
        hiMatches++;
        localStorage.setItem('tugofwar_hi',hiMatches);
        SFX.win();
      }else{
        SFX.lose();
      }
    }
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
