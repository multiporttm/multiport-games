<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1a2e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e0e0ff;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#switchBtn{display:block;margin:6px auto 0;padding:8px 20px;border-radius:20px;border:none;font-weight:800;cursor:pointer;font-size:.95rem;background:#fff;color:#222}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Color Switch</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="420" height="640"></canvas>
    <button id="switchBtn">Switch Color</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap, click, or press <b>Space</b> to hop the ball upward against gravity. Press <b>Shift</b> or the <b>Switch Color</b> button to cycle the ball's color. Only pass through a ring segment that matches your <b>current color</b> — hit the wrong color and it's game over.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=420,H=640;
const COLORS=[
  {name:'red',hex:'#ff5252'},
  {name:'blue',hex:'#448aff'},
  {name:'green',hex:'#69f0ae'},
  {name:'yellow',hex:'#ffd740'}
];
let hi=parseInt(localStorage.getItem('colorswitch_hi')||'0');
let score=0,gameOver=false,started=false;
const ball={x:W/2,y:H-100,r:14,vy:0,colorIdx:0};
let rings=[],cameraY=0,nextRingY=0;
let lastTime=null;

function reset(){
  score=0;gameOver=false;started=false;
  ball.y=H-100;ball.vy=0;ball.colorIdx=0;
  cameraY=0;
  rings=[];
  nextRingY=H-260;
  for(let i=0;i<6;i++){spawnRing(nextRingY);nextRingY-=170;}
  lastTime=null;
}

function spawnRing(y){
  // 4 segments each 90deg, random rotation & color arrangement, one gap segment sometimes
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  rings.push({
    y,
    rot:Math.random()*Math.PI*2,
    spin:(Math.random()<0.5?1:-1)*(0.006+Math.random()*0.01),
    segColors:order,
    r:70,
    passed:false
  });
}

function statusText(){
  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
}

function flap(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  ball.vy=-8.2;
  SFX.jump();
}
function switchColor(){
  if(gameOver||!started)return;
  ball.colorIdx=(ball.colorIdx+1)%COLORS.length;
  SFX.select();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();flap();}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'){e.preventDefault();switchColor();}
});
c.addEventListener('mousedown',flap);
c.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
document.getElementById('switchBtn').addEventListener('click',switchColor);

function drawBall(){
  ctx.fillStyle=COLORS[ball.colorIdx].hex;
  ctx.beginPath();
  ctx.arc(ball.x,ball.y-cameraY,ball.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.stroke();
}

function drawRing(ring){
  const cx=W/2,cy=ring.y-cameraY;
  if(cy<-100||cy>H+100)return;
  const rOuter=ring.r,rInner=ring.r-18;
  for(let i=0;i<4;i++){
    const colorIdx=ring.segColors[i];
    const a0=ring.rot+i*(Math.PI/2);
    const a1=a0+Math.PI/2-0.12; // small gap between segments
    ctx.fillStyle=COLORS[colorIdx].hex;
    ctx.beginPath();
    ctx.arc(cx,cy,rOuter,a0,a1);
    ctx.arc(cx,cy,rInner,a1,a0,true);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(cx,cy,rInner-2,0,Math.PI*2);ctx.fill();
}

function ringSegmentAt(ring,angle){
  // normalize angle relative to ring rotation
  let a=angle-ring.rot;
  a=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const segF=a/(Math.PI/2);
  const seg=Math.floor(segF)%4;
  const within=segF-Math.floor(segF); // 0..1 across the gapped segment span (segment occupies 0..~0.92)
  if(within>0.92)return null; // in the visual gap between colors
  return ring.segColors[seg];
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0f0c29');bg.addColorStop(1,'#302b63');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    rings.forEach(drawRing);
    drawBall();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('colorswitch_start_hint','Tap / Space to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    rings.forEach(drawRing);
    drawBall();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint_tap','Tap to restart'),W/2,H/2+16);
    statusText();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ball.vy+=0.32*dt;
  ball.y+=ball.vy*dt;

  // camera follows ball upward only
  const targetCam=ball.y-H*0.6;
  if(targetCam<cameraY)cameraY=targetCam;

  rings.forEach(r=>{r.rot+=r.spin*dt;});

  // collision: check rings near ball
  rings.forEach(ring=>{
    const dx=ball.x-W/2,dy=ball.y-ring.y;
    const dist=Math.hypot(dx,dy);
    if(dist>ring.r-20-ball.r&&dist<ring.r+ball.r){
      const angle=Math.atan2(dy,dx);
      const seg=ringSegmentAt(ring,angle);
      if(seg===null){
        // safe gap, passes through freely
      } else if(seg!==ball.colorIdx){
        gameOver=true;
        SFX.lose();
        if(score>hi){hi=score;localStorage.setItem('colorswitch_hi',hi);}
      }
    }
    if(!ring.passed&&ball.y<ring.y-ring.r){
      ring.passed=true;
      score++;
      if(score>hi){hi=score;localStorage.setItem('colorswitch_hi',hi);}
      SFX.point();
    }
  });

  // recycle rings that fell far below view, spawn new ones above
  rings=rings.filter(r=>r.y-cameraY<H+150);
  while(rings.length<7){
    spawnRing(nextRingY);
    nextRingY-=170;
  }

  // fell off bottom of camera view = death
  if(ball.y-cameraY>H+40){
    gameOver=true;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem('colorswitch_hi',hi);}
  }

  rings.forEach(drawRing);
  drawBall();
  statusText();
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
