<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#ui{color:#f48fb1;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#preview{text-align:center;font-size:3.5rem;padding:14px;min-height:80px}
#slots{display:flex;justify-content:center;gap:10px;padding:10px}
.slot{width:60px;height:60px;border-radius:12px;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer}
.slot.filled{border-style:solid;border-color:#f48fb1;background:rgba(244,143,177,.15)}
#racks{display:flex;flex-direction:column;gap:8px;padding:10px}
.rack{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rack-item{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer}
.rack-item:hover{background:rgba(255,255,255,.12)}
#msg{text-align:center;font-weight:700;min-height:24px}
#confirm-btn{display:block;margin:10px auto;padding:10px 24px;background:rgba(244,143,177,.2);border:1px solid rgba(244,143,177,.4);border-radius:50px;color:#f8bbd0;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
#confirm-btn:disabled{opacity:.4;cursor:default}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Style Studio</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">Round: 1 | Score: 0</div>
    <div id="preview"></div>
    <div id="slots"></div>
    <div id="racks"></div>
    <button id="confirm-btn" disabled>✅ Confirm Outfit</button>
    <div id="msg"></div>
  </div>
  <div class="game-instructions">Study the outfit for a few seconds — it'll disappear! Then pick the matching hat, top, and shoes from the racks below to recreate it from memory, and confirm.</div>
</div>
<script>
const CATEGORIES=[
  ['🎩','🧢','👒','⛑️'],
  ['👕','👔','🥼','🦺'],
  ['👟','🥾','👞','🩴'],
];
let target,chosen,round,score,showing;

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

function init(){
  round=1;score=0;
  nextRound();
}

function nextRound(){
  target=CATEGORIES.map(cat=>rand(cat));
  chosen=[null,null,null];
  showing=true;
  document.getElementById('msg').textContent='';
  document.getElementById('preview').textContent=target.join(' ');
  renderSlots();
  renderRacks();
  document.getElementById('confirm-btn').disabled=true;
  const studyTime=Math.max(1200,2800-round*100);
  setTimeout(()=>{
    showing=false;
    document.getElementById('preview').textContent='❓ ❓ ❓';
  },studyTime);
}

function pick(catIdx,item){
  if(showing)return;
  chosen[catIdx]=item;
  SFX.click();
  renderSlots();
  document.getElementById('confirm-btn').disabled=chosen.includes(null);
}

function renderSlots(){
  const el=document.getElementById('slots');
  el.innerHTML='';
  chosen.forEach(c=>{
    const d=document.createElement('div');
    d.className='slot'+(c?' filled':'');
    d.textContent=c||'?';
    el.appendChild(d);
  });
}

function renderRacks(){
  const el=document.getElementById('racks');
  el.innerHTML='';
  CATEGORIES.forEach((cat,ci)=>{
    const row=document.createElement('div');
    row.className='rack';
    cat.forEach(item=>{
      const b=document.createElement('div');
      b.className='rack-item';
      b.textContent=item;
      b.onclick=()=>pick(ci,item);
      row.appendChild(b);
    });
    el.appendChild(row);
  });
}

document.getElementById('confirm-btn').addEventListener('click',()=>{
  const correct=chosen.every((c,i)=>c===target[i]);
  const msg=document.getElementById('msg');
  if(correct){
    score+=Math.max(10,30-round);
    msg.textContent='✨ Perfect match!';
    msg.style.color='#69f0ae';
    SFX.success();
  } else {
    msg.textContent=`Not quite — it was ${target.join(' ')}`;
    msg.style.color='#ff8a80';
    SFX.fail();
  }
  round++;
  updateUI();
  setTimeout(nextRound,1400);
});

function updateUI(){
  document.getElementById('ui').textContent=`Round: ${round} | Score: ${score}`;
}

init();updateUI();
</script></body></html>
