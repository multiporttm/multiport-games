<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0b2447;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#hud{display:flex;justify-content:center;gap:18px;color:#fff;font-size:.95rem;padding:0 8px 6px;flex-wrap:wrap}
#hud span{background:rgba(255,255,255,.08);border-radius:10px;padding:4px 12px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Solar Panel Angle Tilting</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="hud"><span id="day-label">Day 1</span><span id="lives-label">Lives: 3</span></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag the panel, use <b>Up/Down Arrows</b> (or <b>W/S</b>), or tap the <b>+/-</b> buttons to tilt the solar panel so it tracks the sun as it crosses the sky. Keep your energy capture high all day to pass each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const scoreEl=document.getElementById('score-display');
const dayEl=document.getElementById('day-label');
const livesEl=document.getElementById('lives-label');
const HI_KEY='solarpanelangletilting_hi';

let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0;
let score=0,lives=3,round=1,state='ready'; // ready, playing, roundend, gameover, win
let tilt=45; // 0..90 degrees from horizontal
let dayT=0,dayDuration=18; // seconds per round
let seasonMax=55; // peak sun altitude this round
let tolerance=22; // degrees of slack for full-ish efficiency
let targetEnergy=0,energyThisRound=0;
let msg='',msgTimer=0;
let dragging=false;
const PANEL_X=W/2,PANEL_Y=330,PANEL_LEN=150;

function resetRound(n){
  round=n;
  dayDuration=Math.max(9,18-(n-1)*1.1);
  seasonMax=Math.min(80,40+n*5);
  tolerance=Math.max(8,22-(n-1)*1.8);
  dayT=0;energyThisRound=0;
  targetEnergy=dayDuration*0.55; // need decent average efficiency to pass
  state='playing';
  dayEl.textContent=I18N.t('day_label','Day {n}').replace('{n}',n);
}

function startGame(){
  score=0;lives=3;tilt=45;msg='';msgTimer=0;
  resetRound(1);
}

function setMsg(t,dur){msg=t;msgTimer=dur||1.6;}

function sunAltitude(frac){ // frac 0..1 across the day -> altitude degrees (0 at edges, peak mid-day)
  return Math.sin(Math.PI*frac)*seasonMax;
}
function idealTilt(alt){ return Math.max(0,Math.min(90,90-alt)); }

function clampTilt(){ if(tilt<0)tilt=0; if(tilt>90)tilt=90; }

function adjustTilt(d){ tilt+=d; clampTilt(); }

document.addEventListener('keydown',e=>{
  if(state==='ready'){ if(e.code==='Space'||e.code==='Enter'){ startGame(); } return; }
  if(state==='gameover'||state==='win'){ if(e.code==='Space'||e.code==='Enter'){ startGame(); } return; }
  if(state!=='playing')return;
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();adjustTilt(2);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();adjustTilt(-2);}
});

function panelAngleRad(){ return (tilt)*Math.PI/180; }

function pointerToTilt(my){
  // dragging vertically near panel maps to tilt: top=90(steep), bottom=0(flat)
  const top=180,bottom=380;
  let f=(bottom-my)/(bottom-top);
  f=Math.max(0,Math.min(1,f));
  return f*90;
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  if(state==='ready'||state==='gameover'||state==='win'){startGame();return;}
  const p=getPos(e);
  if(p.x>W-70&&p.y>H-70){adjustTilt(5);return;}
  if(p.x<70&&p.y>H-70){adjustTilt(-5);return;}
  dragging=true; tilt=pointerToTilt(p.y); clampTilt();
});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=getPos(e);
  tilt=pointerToTilt(p.y); clampTilt();
});
window.addEventListener('pointerup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});

function drawSky(frac){
  const g=ctx.createLinearGradient(0,0,0,H-60);
  if(frac<0.15||frac>0.85){g.addColorStop(0,'#1a1040');g.addColorStop(1,'#4a2d6b');}
  else {g.addColorStop(0,'#0b2447');g.addColorStop(1,'#19568c');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H-60);
  ctx.fillStyle='#17304a';ctx.fillRect(0,H-60,W,60);
  ctx.fillStyle='#0f2032';ctx.fillRect(0,H-60,W,4);
}

function drawSun(frac,alt){
  const x=40+frac*(W-80);
  const y=(H-70)-(alt/90)*(H-140);
  ctx.save();
  ctx.shadowColor='#ffd54f';ctx.shadowBlur=30;
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();
  ctx.restore();
  return {x,y};
}

function drawPanel(){
  const a=panelAngleRad();
  const dx=Math.cos(a)*PANEL_LEN/2, dy=-Math.sin(a)*PANEL_LEN/2;
  const x1=PANEL_X-dx,y1=PANEL_Y-dy,x2=PANEL_X+dx,y2=PANEL_Y+dy;
  // stand
  ctx.strokeStyle='#555';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(PANEL_X,PANEL_Y);ctx.lineTo(PANEL_X,H-56);ctx.stroke();
  // panel
  ctx.save();
  ctx.lineWidth=14;ctx.strokeStyle='#1b3b6b';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.lineWidth=10;ctx.strokeStyle='#2d6cb5';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  // grid lines on panel
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;
  for(let i=1;i<4;i++){
    const t=i/4;
    const px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    ctx.beginPath();ctx.moveTo(px-4*Math.sin(a),py-4*Math.cos(a));ctx.lineTo(px+4*Math.sin(a),py+4*Math.cos(a));ctx.stroke();
  }
  ctx.restore();
  // base
  ctx.fillStyle='#333';ctx.fillRect(PANEL_X-20,H-60,40,10);
  return {x1,y1,x2,y2,a};
}

function drawButtons(){
  ctx.save();ctx.textAlign='center';ctx.font='bold 26px Arial';
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath();ctx.arc(W-40,H-40,28,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(40,H-40,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillText('+',W-40,H-31);
  ctx.fillText('-',40,H-31);
  ctx.restore();
}

function drawEnergyBar(eff){
  const bw=400,bh=18,bx=W/2-bw/2,by=70;
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=eff>0.75?'#4caf50':eff>0.4?'#ffd54f':'#e94560';
  ctx.fillRect(bx,by,bw*eff,bh);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff';ctx.font='13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('efficiency_label','Capture: {p}%').replace('{p}',Math.round(eff*100)),W/2,by-8);
  // day progress
  const pw=600,px=W/2-pw/2,py=42;
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(px,py,pw,8);
  ctx.fillStyle='#ffd54f';ctx.fillRect(px,py,pw*(dayT/dayDuration),8);
}

function drawCenterText(lines,sub){
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
  ctx.fillText(lines,W/2,H/2-10);
  if(sub){ctx.font='18px Arial';ctx.fillStyle='#ffd54f';ctx.fillText(sub,W/2,H/2+26);}
  ctx.restore();
}

function updateHud(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  livesEl.textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',lives);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  const frac=state==='playing'?Math.min(1,dayT/dayDuration):0.5;
  drawSky(frac);
  const alt=sunAltitude(frac);
  drawSun(frac,alt);
  drawPanel();
  drawButtons();

  if(state==='ready'){
    drawCenterText(I18N.t('tap_to_start','Tap / Space to Start'),I18N.t('tilt_hint','Tilt the panel to face the sun all day'));
  } else if(state==='playing'){
    const target=idealTilt(alt);
    let diff=Math.abs(tilt-target);
    let eff=Math.max(0,1-diff/ (tolerance*2.2));
    eff=Math.min(1,eff);
    dayT+=dt;
    energyThisRound+=eff*dt;
    score+=eff*dt*12;
    if(score>hi){hi=score;}
    drawEnergyBar(eff);
    if(dayT>=dayDuration){
      if(energyThisRound>=targetEnergy){
        SFX.success();
        setMsg(I18N.t('day_passed','Day {n} complete!').replace('{n}',round),1.6);
        state='roundend';
      } else {
        lives--;
        SFX.fail();
        updateHud();
        if(lives<=0){
          state='gameover';
          if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
          SFX.lose();
        } else {
          setMsg(I18N.t('day_failed','Not enough energy captured! Lost a life.'),1.6);
          state='roundend';
        }
      }
    }
  } else if(state==='roundend'){
    msgTimer-=dt;
    drawCenterText(msg);
    if(msgTimer<=0){
      if(round>=8 && lives>0 && msg.indexOf('complete')>=0){
        state='win';
        if(score>hi){hi=score;}
        localStorage.setItem(HI_KEY,String(Math.floor(hi)));
        SFX.win();
      } else {
        resetRound(round+1);
      }
    }
  } else if(state==='gameover'){
    drawCenterText(I18N.t('game_over_title','GAME OVER'),I18N.t('restart_hint','Tap or Space to restart'));
  } else if(state==='win'){
    drawCenterText(I18N.t('you_win_title','YOU WIN! Solar Master!'),I18N.t('restart_hint','Tap or Space to restart'));
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
