<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>body{background:#08080f}#c{display:block;border-radius:8px}</style>
</head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cube Runner</div>
  <div class="game-frame"><canvas id="c" width="480" height="380"></canvas></div>
  <div class="game-instructions">Press <b>Space</b>, click, or tap the canvas to jump. Land on platforms, dodge the spikes, and tap again near a glowing orb for a second jump mid-air! Clear the progress bar at the top to complete each level — levels get faster and trickier as you go.<br><a href="https://www.geometrydash.com/" target="_blank" rel="noopener noreferrer" style="color:#e94560;font-weight:600;text-decoration:none">🎮 Play the original Geometry Dash →</a></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=380,GND=H-60,CUBE=28;

// ── State ──────────────────────────────────────────────
let state='idle',score=0,hi=+(localStorage.getItem('geo_hi')||0),frame=0,speed=4;
let lastTime=null,spawnTimer=0;
let cube={x:80,y:GND-CUBE,vy:0,rot:0,dead:false,jumped:false};
let obstacles=[],platforms=[],particles=[],orbs=[];
let attempts=0,level=1,levelLength=100,levelTimer=0;
const GRAV=0.55,JUMP=-11.5,ORB_JUMP=-12.5;

// ── Colour palette ────────────────────────────────────
const COLORS=['#e94560','#5e72eb','#00d2c6','#f7c948','#a855f7','#22c55e'];
let cubeColor='#e94560';

// ── Background stars ──────────────────────────────────
const stars=Array.from({length:60},()=>({
  x:Math.random()*W,y:Math.random()*(H-60),
  r:Math.random()*1.4+0.3,a:Math.random()
}));

function reset(){
  attempts++;
  level=1;levelLength=100;
  score=0;frame=0;speed=4;spawnTimer=0;lastTime=null;
  cube={x:80,y:GND-CUBE,vy:0,rot:0,dead:false,jumped:false};
  cubeColor=COLORS[Math.floor(Math.random()*COLORS.length)];
  obstacles=[];platforms=[];particles=[];orbs=[];
  state='play';
  startMusic();
}

function nextLevel(){
  level++;
  levelLength=100+level*30;
  score=0;spawnTimer=0;
  obstacles=[];platforms=[];orbs=[];
  state='play';
  startMusic();
}

function jump(){
  // Unlock/resume AudioContext synchronously within this user gesture — must never block gameplay input.
  try{ if(window.SFX&&SFX.getContext)SFX.getContext(); }catch(e){}
  if(state==='idle'||state==='dead'){reset();return;}
  if(state!=='play')return;
  const orb=orbs.find(o=>!o.used&&Math.hypot(cube.x+CUBE/2-o.x,cube.y+CUBE/2-o.y)<26);
  if(orb){
    orb.used=true;
    cube.vy=ORB_JUMP;cube.jumped=true;
    SFX.powerup();
    return;
  }
  if(cube.y>=GND-CUBE-2){cube.vy=JUMP;cube.jumped=true;SFX.jump();}
}

// ── Background music — an original, fast arpeggiated synth loop (respects the mute toggle) ──
let musicTimer=null,musicStep=0;
const STEP_MS=105; // ~16th notes at ~143bpm — driving, energetic arcade feel
// Four-chord progression (Am - F - C - G), each held for one bar of 8 steps.
const MUSIC_CHORDS=[
  [220.00,261.63,329.63,440.00],   // A minor
  [174.61,220.00,261.63,349.23],   // F major
  [130.81,164.81,196.00,261.63],   // C major
  [196.00,246.94,293.66,392.00],   // G major
];
const ARP_PATTERN=[0,1,2,3,2,1,2,3]; // up-down arpeggio shape within each chord
function playMusicStep(){
  if(!window.SFX||SFX.isMuted())return;
  const actx=SFX.getContext();
  if(!actx)return;
  const t0=actx.currentTime;
  const barLen=ARP_PATTERN.length;
  const chord=MUSIC_CHORDS[Math.floor(musicStep/barLen)%MUSIC_CHORDS.length];
  const stepInBar=musicStep%barLen;

  // Driving bass pulse on the root — kept in a mid range so phone speakers can actually reproduce it
  const bo=actx.createOscillator(),bg=actx.createGain();
  bo.type='triangle';bo.frequency.setValueAtTime(chord[0],t0);
  bg.gain.setValueAtTime(0.16,t0);bg.gain.exponentialRampToValueAtTime(0.0001,t0+STEP_MS/1000*1.4);
  bo.connect(bg);bg.connect(actx.destination);bo.start(t0);bo.stop(t0+STEP_MS/1000*1.5);

  // Fast arpeggiated lead, accented on the first step of each bar
  const lead=chord[ARP_PATTERN[stepInBar]];
  const accent=stepInBar===0;
  const lo=actx.createOscillator(),lg=actx.createGain();
  lo.type='square';lo.frequency.setValueAtTime(lead*2,t0);
  lg.gain.setValueAtTime(accent?0.13:0.09,t0);lg.gain.exponentialRampToValueAtTime(0.0001,t0+STEP_MS/1000*1.1);
  lo.connect(lg);lg.connect(actx.destination);lo.start(t0);lo.stop(t0+STEP_MS/1000*1.2);

  musicStep++;
}
function startMusic(){
  if(musicTimer)return;
  playMusicStep(); // play the first beat immediately instead of waiting for the first interval tick
  musicTimer=setInterval(playMusicStep,STEP_MS);
}
function stopMusic(){
  clearInterval(musicTimer);musicTimer=null;musicStep=0;
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
c.addEventListener('click',jump);
c.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

// ── Obstacle patterns ─────────────────────────────────
// Each pattern: array of {type, ox, oy} relative to spawn x
// type: 'spike' | 'platform' (platform just blocks) | 'spike_tall'
const PATTERNS=[
  // single spike
  [{type:'spike',ox:0,oy:0}],
  // double spike
  [{type:'spike',ox:0,oy:0},{type:'spike',ox:36,oy:0}],
  // triple spike
  [{type:'spike',ox:0,oy:0},{type:'spike',ox:36,oy:0},{type:'spike',ox:72,oy:0}],
  // tall spike
  [{type:'spike_tall',ox:0,oy:0}],
  // tall + spike
  [{type:'spike_tall',ox:0,oy:0},{type:'spike',ox:50,oy:0}],
  // platform above ground + spike after
  [{type:'platform',ox:0,oy:-70,pw:80,ph:14},{type:'spike',ox:100,oy:0}],
  // double platform staircase
  [{type:'platform',ox:0,oy:-60,pw:60,ph:14},{type:'platform',ox:80,oy:-110,pw:60,ph:14}],
  // floating spike on platform
  [{type:'platform',ox:0,oy:-80,pw:100,ph:14},{type:'spike',ox:30,oy:-80,sOnPlat:true}],
  // gap hint — just a spike in the middle
  [{type:'spike',ox:0,oy:0},{type:'spike',ox:100,oy:0}],
  // orb-assisted double-tall gap — tap the orb mid-air for a second jump
  [{type:'spike_tall',ox:0,oy:0},{type:'orb',ox:50,oy:-75},{type:'spike_tall',ox:110,oy:0}],
  // orb lifting onto a high platform
  [{type:'orb',ox:10,oy:-70},{type:'platform',ox:40,oy:-130,pw:70,ph:14}],
];

function spawnPattern(){
  const pat=PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
  const baseX=W+20;
  pat.forEach(item=>{
    if(item.type==='spike'||item.type==='spike_tall'){
      const tall=item.type==='spike_tall';
      obstacles.push({x:baseX+item.ox,y:GND,tall,scored:false,color:COLORS[Math.floor(Math.random()*COLORS.length)]});
    } else if(item.type==='platform'){
      platforms.push({x:baseX+item.ox,y:GND+item.oy,w:item.pw,h:item.ph,scored:false});
      // spike on platform?
      if(item.sOnPlat){
        obstacles.push({x:baseX+item.ox+30,y:GND+item.oy,tall:false,scored:false,onPlatform:true,
          color:COLORS[Math.floor(Math.random()*COLORS.length)]});
      }
    } else if(item.type==='orb'){
      orbs.push({x:baseX+item.ox,y:GND+item.oy,used:false});
    }
  });
}

// ── Collision helpers ─────────────────────────────────
function spikeVerts(sp){
  const h=sp.tall?60:32,bw=sp.tall?30:28;
  const bx=sp.x-bw/2,by=sp.y-(sp.onPlatform?sp.y:sp.y); // anchor at ground or platform top
  // re-derive y
  let baseY=sp.y; // GND for normal
  // We'll use spike tip y as baseY-h, base corners baseY
  return {tip:{x:sp.x,y:baseY-h},l:{x:sp.x-bw/2,y:baseY},r:{x:sp.x+bw/2,y:baseY},h,bw};
}

function pointInTriangle(px,py,ax,ay,bx,by,cx,cy){
  const d1=(px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d2=(px-cx)*(by-cy)-(bx-cx)*(py-cy);
  const d3=(px-ax)*(cy-ay)-(cx-ax)*(py-ay);
  const hasN=(d1<0)||(d2<0)||(d3<0),hasP=(d1>0)||(d2>0)||(d3>0);
  return !(hasN&&hasP);
}

function cubeHitsSpike(sp){
  const v=spikeVerts(sp);
  // test cube corners against triangle
  const cx0=cube.x,cy0=cube.y;
  const corners=[[cx0,cy0],[cx0+CUBE,cy0],[cx0,cy0+CUBE],[cx0+CUBE,cy0+CUBE]];
  for(const [px,py] of corners){
    if(pointInTriangle(px,py,v.tip.x,v.tip.y,v.l.x,v.l.y,v.r.x,v.r.y))return true;
  }
  // also test spike tip inside cube AABB
  if(v.tip.x>cx0&&v.tip.x<cx0+CUBE&&v.tip.y>cy0&&v.tip.y<cy0+CUBE)return true;
  return false;
}

function cubeOnPlatform(plat){
  const cl=cube.x+4,cr=cube.x+CUBE-4;
  const cb=cube.y+CUBE;
  const pl=plat.x,pr=plat.x+plat.w,pt=plat.y;
  return cr>pl&&cl<pr&&cb>=pt-2&&cb<=pt+speed+4&&cube.vy>=0;
}

// ── Particles ─────────────────────────────────────────
function burst(x,y,col){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col});
  }
}

// ── Drawing ───────────────────────────────────────────
function drawBG(){
  // gradient sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0a1a');sky.addColorStop(1,'#12082a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  stars.forEach(s=>{
    s.a+=0.008;
    ctx.globalAlpha=0.4+0.3*Math.sin(s.a);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // ground
  const ggrad=ctx.createLinearGradient(0,GND,0,H);
  ggrad.addColorStop(0,'#1e1040');ggrad.addColorStop(1,'#0d0820');
  ctx.fillStyle=ggrad;ctx.fillRect(0,GND,W,H-GND);
  // ground line glow
  ctx.strokeStyle='#5e72eb';ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor='#5e72eb';
  ctx.beginPath();ctx.moveTo(0,GND);ctx.lineTo(W,GND);ctx.stroke();
  ctx.shadowBlur=0;
  // ground grid lines
  ctx.strokeStyle='rgba(94,114,235,0.15)';ctx.lineWidth=1;
  const off=(frame*speed)%40;
  for(let x=W-off;x>-40;x-=40){
    ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x,H);ctx.stroke();
  }
}

function drawCube(){
  const cx=cube.x+CUBE/2,cy=cube.y+CUBE/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(cube.rot*Math.PI/180);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(-CUBE/2+2,CUBE/2-4,CUBE,6);
  // body
  ctx.fillStyle=cubeColor;
  ctx.shadowBlur=16;ctx.shadowColor=cubeColor;
  ctx.fillRect(-CUBE/2,-CUBE/2,CUBE,CUBE);
  ctx.shadowBlur=0;
  // inner face shine
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(-CUBE/2+3,-CUBE/2+3,CUBE/2,CUBE/2);
  // border
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;
  ctx.strokeRect(-CUBE/2,-CUBE/2,CUBE,CUBE);
  // eye
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath();ctx.arc(4,-4,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(5,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSpike(sp){
  const v=spikeVerts(sp);
  ctx.save();
  ctx.shadowBlur=10;ctx.shadowColor=sp.color;
  ctx.fillStyle=sp.color;
  ctx.beginPath();
  ctx.moveTo(v.tip.x,v.tip.y);
  ctx.lineTo(v.l.x,v.l.y);
  ctx.lineTo(v.r.x,v.r.y);
  ctx.closePath();ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(v.tip.x,v.tip.y);
  ctx.lineTo(v.l.x,v.l.y);
  ctx.lineTo(v.tip.x-4,v.tip.y+v.h*0.5);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawOrb(o){
  if(o.used)return;
  ctx.save();
  const pulse=1+0.15*Math.sin(frame*0.15);
  ctx.shadowBlur=16;ctx.shadowColor='#f7c948';
  ctx.strokeStyle='#f7c948';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(o.x,o.y,13*pulse,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(247,201,72,0.35)';
  ctx.beginPath();ctx.arc(o.x,o.y,8*pulse,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawPlatform(plat){
  ctx.save();
  const g=ctx.createLinearGradient(plat.x,plat.y,plat.x,plat.y+plat.h);
  g.addColorStop(0,'#5e72eb');g.addColorStop(1,'#3b4db8');
  ctx.fillStyle=g;
  ctx.shadowBlur=8;ctx.shadowColor='#5e72eb';
  ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(plat.x,plat.y,plat.w,4);
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawHUD(){
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.font='bold 22px Arial';ctx.textAlign='left';
  ctx.fillText(score,14,32);
  ctx.font='13px Arial';ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('BEST '+hi,14,50);
  ctx.textAlign='right';
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('LEVEL '+level,W-10,32);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText('Attempt '+attempts,W-10,50);
  ctx.textAlign='left';

  // Level progress bar (Geometry-Dash-style % across the top)
  const pct=Math.min(1,score/levelLength);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(0,0,W,5);
  const pg=ctx.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,'#5e72eb');pg.addColorStop(1,'#f7c948');
  ctx.fillStyle=pg;
  ctx.fillRect(0,0,W*pct,5);
}

function drawOverlay(title,sub1,sub2){
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(80,120,320,140);
  ctx.strokeStyle='rgba(94,114,235,0.5)';ctx.lineWidth=1.5;
  ctx.strokeRect(80,120,320,140);
  ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
  ctx.fillText(title,W/2,168);
  ctx.font='16px Arial';ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText(sub1,W/2,200);
  ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText(sub2,W/2,228);
}

// ── Main loop ─────────────────────────────────────────
function loop(){
  drawBG();

  if(state==='idle'){
    drawCube();
    drawOverlay('CUBE RUNNER','Dodge spikes, grab orbs for a 2nd jump!','Space / Tap to start');
    requestAnimationFrame(loop);return;
  }

  if(state==='dead'){
    platforms.forEach(drawPlatform);
    obstacles.forEach(drawSpike);
    orbs.forEach(drawOrb);
    drawParticles();
    drawCube();
    drawHUD();
    drawOverlay('DEAD','Level '+level+' · Score: '+score+'   Best: '+hi,'Tap or Space to retry · Attempt '+attempts);
    requestAnimationFrame(loop);return;
  }

  if(state==='levelcomplete'){
    platforms.forEach(drawPlatform);
    drawParticles();
    drawCube();
    drawHUD();
    drawOverlay('LEVEL '+(level-1)+' COMPLETE!','Score: '+hi,'Next level starting...');
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  frame+=dt;
  // speed ramp
  speed=4+Math.floor(score/5)*0.4;

  // physics
  cube.vy+=GRAV*dt;
  cube.y+=cube.vy*dt;

  // platform collision
  let onPlat=false;
  platforms.forEach(plat=>{
    if(cubeOnPlatform(plat)){
      cube.y=plat.y-CUBE;
      cube.vy=0;
      onPlat=true;
    }
  });

  // ground
  if(cube.y+CUBE>=GND){
    cube.y=GND-CUBE;
    cube.vy=0;
    onPlat=true;
  }

  // ceiling death
  if(cube.y<0){state='dead';stopMusic();SFX.lose();burst(cube.x+CUBE/2,cube.y,cubeColor);}

  // rotation
  if(onPlat){
    cube.rot=Math.round(cube.rot/90)*90; // snap to 90°
  } else {
    cube.rot+=speed*1.8*dt;
  }

  // spawn pattern every ~90 "frames" of real time (accumulator, not raw rAF call count)
  const spawnInterval=Math.max(55,90-score*2);
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnPattern();}

  // move & cull obstacles
  obstacles=obstacles.filter(sp=>{
    sp.x-=speed*dt;
    if(!sp.scored&&sp.x+20<cube.x){
      sp.scored=true;score++;SFX.point();
      if(score>hi){hi=score;localStorage.setItem('geo_hi',hi);}
      if(score>=levelLength&&state==='play'){
        state='levelcomplete';
        stopMusic();
        SFX.win();
        setTimeout(nextLevel,1600);
      }
    }
    return sp.x>-60;
  });
  platforms=platforms.filter(plat=>{
    plat.x-=speed*dt;
    return plat.x>-200;
  });
  orbs=orbs.filter(o=>{
    o.x-=speed*dt;
    return o.x>-40;
  });

  // update particles
  particles=particles.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.1*dt;p.life-=0.04*dt;return p.life>0;
  });

  // collision check
  obstacles.forEach(sp=>{
    if(cubeHitsSpike(sp)&&state!=='dead'){
      state='dead';
      stopMusic();
      SFX.lose();
      burst(cube.x+CUBE/2,cube.y+CUBE/2,cubeColor);
      burst(cube.x+CUBE/2,cube.y+CUBE/2,sp.color);
    }
  });

  // draw
  platforms.forEach(drawPlatform);
  orbs.forEach(drawOrb);
  obstacles.forEach(drawSpike);
  drawParticles();
  if(state!=='dead')drawCube();
  drawHUD();

  // speed indicator bar
  const pct=Math.min((speed-4)/8,1);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(W-100,H-28,90,8);
  const barG=ctx.createLinearGradient(W-100,0,W-10,0);
  barG.addColorStop(0,'#22c55e');barG.addColorStop(0.6,'#f7c948');barG.addColorStop(1,'#e94560');
  ctx.fillStyle=barG;ctx.fillRect(W-100,H-28,90*pct,8);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='10px Arial';ctx.textAlign='right';
  ctx.fillText('SPEED',W-10,H-14);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
