<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Lemonade Stand</title><meta name="description" content="Play Lemonade Stand free online — Set your price and ingredients each day, watch the weather, and grow your profit over 14 days running the stand."><link rel="canonical" href="https://games.multiportllc.com/games/lemonadestand"><meta property="og:title" content="Lemonade Stand - Multiport Games"><meta property="og:description" content="Play Lemonade Stand free online — Set your price and ingredients each day, watch the weather, and grow your profit over 14 days running the stand."><meta property="og:url" content="https://games.multiportllc.com/games/lemonadestand"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Lemonade Stand","description":"Play Lemonade Stand free online instantly. Set your price and ingredients each day, watch the weather, and grow your profit over 14 days running the stand. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/lemonadestand","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#lemon-frame{background:#fff9e6;color:#3a2c00;border-radius:14px;padding:20px;max-width:480px;margin:0 auto;text-align:center}
#lemon-frame h3{margin:4px 0 12px}
.lemon-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-weight:600}
.lemon-row button{width:32px;height:32px;border-radius:50%;border:none;background:#ffb703;color:#3a2c00;font-weight:800;font-size:1.1rem;cursor:pointer}
#lemon-weather{font-size:2rem;margin:8px 0}
#lemon-start-btn,#lemon-next-btn{background:#ffb703;color:#3a2c00;border:none;border-radius:8px;padding:10px 22px;font-weight:800;font-size:1rem;cursor:pointer;margin-top:14px}
#lemon-summary{white-space:pre-line;font-weight:600;margin:10px 0}
#score-display{color:#ffd166;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lemonade Stand</div>
  <div class="game-frame">
    <div id="score-display">Day: 1/14 | Profit: $0</div>
    <div id="lemon-frame">
      <div id="lemon-weather">☀️</div>
      <h3 id="lemon-day-title">Day 1</h3>
      <div class="lemon-row"><span data-i18n="price_label">Price per cup: $<span id="lemon-price">0.50</span></span><span><button id="price-down">−</button> <button id="price-up">+</button></span></div>
      <div class="lemon-row"><span data-i18n="sugar_label">Sugar quality: <span id="lemon-sugar">2</span></span><span><button id="sugar-down">−</button> <button id="sugar-up">+</button></span></div>
      <div class="lemon-row"><span data-i18n="cups_label">Cups made: <span id="lemon-cups">20</span></span><span><button id="cups-down">−</button> <button id="cups-up">+</button></span></div>
      <div id="lemon-summary"></div>
      <button id="lemon-start-btn">Start Day</button>
      <button id="lemon-next-btn" style="display:none">Next Day →</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Set your <b>price</b>, <b>sugar quality</b>, and how many <b>cups</b> to make each day, then start the day to see how the weather affects your sales. Run the stand for 14 days and maximize your profit!</div>
</div>
<script>
const WEATHER_TYPES=[
  {icon:'☀️',key:'weather_hot',label:'Hot',mult:1.5},
  {icon:'⛅',key:'weather_mild',label:'Mild',mult:1.0},
  {icon:'🌧️',key:'weather_rainy',label:'Rainy',mult:0.4},
];
let day=1,profit=0,bestProfit=parseFloat(localStorage.getItem('lemonadestand_best')||'0');
let price=0.5,sugar=2,cups=20;
let dayStarted=false;
const TOTAL_DAYS=14;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function updateUI(){
  document.getElementById('lemon-day-title').textContent=I18N.t('day_label','Day {n}').replace('{n}',day);
  document.getElementById('lemon-price').textContent=price.toFixed(2);
  document.getElementById('lemon-sugar').textContent=sugar;
  document.getElementById('lemon-cups').textContent=cups;
  document.getElementById('score-display').textContent=I18N.t('day_profit_label','Day: {d}/{t} | Profit: ${p}').replace('{d}',day).replace('{t}',TOTAL_DAYS).replace('{p}',profit.toFixed(2));
}

document.getElementById('price-up').onclick=()=>{price=clamp(price+0.1,0.1,3);updateUI();};
document.getElementById('price-down').onclick=()=>{price=clamp(price-0.1,0.1,3);updateUI();};
document.getElementById('sugar-up').onclick=()=>{sugar=clamp(sugar+1,1,5);updateUI();};
document.getElementById('sugar-down').onclick=()=>{sugar=clamp(sugar-1,1,5);updateUI();};
document.getElementById('cups-up').onclick=()=>{cups=clamp(cups+5,5,80);updateUI();};
document.getElementById('cups-down').onclick=()=>{cups=clamp(cups-5,5,80);updateUI();};

document.getElementById('lemon-start-btn').onclick=()=>{
  if(dayStarted)return;
  dayStarted=true;
  const weather=WEATHER_TYPES[Math.floor(Math.random()*WEATHER_TYPES.length)];
  document.getElementById('lemon-weather').textContent=weather.icon;
  // Demand model: cheaper price + better sugar + hot weather = more thirsty customers
  const baseDemand=30+sugar*6;
  const priceFactor=Math.max(0.2,1.6-price*0.9);
  const demand=Math.round(baseDemand*priceFactor*weather.mult*(0.85+Math.random()*0.3));
  const sold=Math.min(cups,demand);
  const revenue=sold*price;
  const cost=cups*(0.08+sugar*0.05);
  const dayProfit=revenue-cost;
  profit+=dayProfit;
  if(profit>bestProfit){bestProfit=profit;localStorage.setItem('lemonadestand_best',bestProfit);}
  const summary=I18N.t('day_summary','{w} weather — sold {s}/{c} cups for ${r}, costs ${co}, profit ${p}')
    .replace('{w}',I18N.t(weather.key,weather.label))
    .replace('{s}',sold).replace('{c}',cups)
    .replace('{r}',revenue.toFixed(2)).replace('{co}',cost.toFixed(2))
    .replace('{p}',dayProfit.toFixed(2));
  document.getElementById('lemon-summary').textContent=summary;
  if(dayProfit>=0)SFX.coin(); else SFX.error();
  document.getElementById('lemon-start-btn').style.display='none';
  if(day>=TOTAL_DAYS){
    document.getElementById('lemon-next-btn').textContent=I18N.t('see_results_btn','See Final Results');
  }
  document.getElementById('lemon-next-btn').style.display='inline-block';
  updateUI();
};

document.getElementById('lemon-next-btn').onclick=()=>{
  if(day>=TOTAL_DAYS){
    document.getElementById('lemon-summary').textContent=I18N.t('final_summary','Stand closed after {n} days! Total profit: ${p} (Best ever: ${b})').replace('{n}',TOTAL_DAYS).replace('{p}',profit.toFixed(2)).replace('{b}',bestProfit.toFixed(2));
    document.getElementById('lemon-next-btn').style.display='none';
    SFX.win();
    day=1;profit=0;dayStarted=false;
    document.getElementById('lemon-start-btn').textContent=I18N.t('new_game_btn','New Game');
    document.getElementById('lemon-start-btn').style.display='inline-block';
    updateUI();
    return;
  }
  day++;
  dayStarted=false;
  document.getElementById('lemon-summary').textContent='';
  document.getElementById('lemon-start-btn').style.display='inline-block';
  document.getElementById('lemon-next-btn').style.display='none';
  updateUI();
};

updateUI();
</script></body></html>
