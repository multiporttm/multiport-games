<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(180deg,#0d3b5c,#8d6e63);display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pirate Ship Battle</div>
  <div class="game-frame">
    <div id="score-display">HP: 100 | Enemy: 100 | Battles Won: 0 | Best: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b> or <b>drag</b> to move your ship up and down the waves, and press <b>Space</b> or <b>Tap</b> to fire your cannons. Lead your shot to account for wave bob and distance — sink the enemy ship before it sinks you!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400,waterY=260;
let hi=parseInt(localStorage.getItem('psb_hi')||'0',10);
let battlesWon=0;
let gameOver=false,started=false,frame=0,lastTime=null;
let msg='';

const player={x:100,y:0,hp:100,vy:0,cool:0};
const enemy={x:680,y:0,hp:100,vy:0,cool:0,dir:1};
let balls=[]; // {x,y,vx,vy,from}
let splashes=[];

function reset(){
  player.hp=100;player.y=0;player.vy=0;player.cool=0;
  enemy.hp=100;enemy.y=0;enemy.vy=0;enemy.cool=90+Math.random()*60;
  balls=[];splashes=[];gameOver=false;frame=0;msg='';
}
reset();

function waveOffset(x,t){
  return Math.sin(t/40+x/90)*14 + Math.sin(t/23+x/50)*6;
}

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(!started)started=true;
  if(e.code==='Space')fire();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let dragging=false;
c.addEventListener('mousedown',e=>{if(!started)started=true;dragging=true;handleDrag(e);});
c.addEventListener('mousemove',e=>{if(dragging)handleDrag(e);});
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{e.preventDefault();if(!started)started=true;dragging=true;handleDrag(e.touches[0]);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)handleDrag(e.touches[0]);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;fire();},{passive:false});
c.addEventListener('click',()=>{if(!dragging)fire();});

function handleDrag(e){
  const r=c.getBoundingClientRect();
  const scale=H/r.height;
  const my=(e.clientY-r.top)*scale;
  player.targetY=Math.max(-60,Math.min(60,my-160));
}

function fire(){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(player.cool>0)return;
  player.cool=45;
  const py=waterY+player.y-20;
  balls.push({x:player.x+50,y:py,vx:8,vy:-6,from:'player'});
  SFX.click();
}

function enemyFire(){
  const ey=waterY+enemy.y-20;
  balls.push({x:enemy.x-10,y:ey,vx:-7.5,vy:-6,from:'enemy'});
}

function rectHit(bx,by,tx,ty){
  return Math.abs(bx-tx)<34 && Math.abs(by-ty)<26;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // sky
  const sky=ctx.createLinearGradient(0,0,0,waterY);
  sky.addColorStop(0,'#0d3b5c');sky.addColorStop(1,'#4a7a9c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,waterY);
  // sun
  ctx.fillStyle='#ffe082';ctx.beginPath();ctx.arc(650,60,30,0,Math.PI*2);ctx.fill();
  // water
  const water=ctx.createLinearGradient(0,waterY,0,H);
  water.addColorStop(0,'#1a5c8a');water.addColorStop(1,'#0d3b5c');
  ctx.fillStyle=water;ctx.fillRect(0,waterY,W,H-waterY);

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_pirate','Arrow Keys/Drag to move, Space/Tap to fire'),W/2,H/2);
    drawShip(player.x,waterY+waveOffset(player.x,frame)*0.4+player.y,1,'#8d4a2f');
    drawShip(enemy.x,waterY+waveOffset(enemy.x,frame)*0.4+enemy.y,-1,'#5a3d2f');
    requestAnimationFrame(loop);
    return;
  }

  frame+=dt;

  // wave lines
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;
  for(let row=0;row<3;row++){
    ctx.beginPath();
    for(let x=0;x<=W;x+=10){
      const y=waterY+20+row*40+waveOffset(x,frame*0.7);
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  if(gameOver){
    drawShip(player.x,waterY+player.y,1,'#8d4a2f');
    drawShip(enemy.x,waterY+enemy.y,-1,'#5a3d2f');
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,150);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,185);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  // player movement via keys
  const targetVy = (keys['ArrowUp']||keys['KeyW']) ? -3 : (keys['ArrowDown']||keys['KeyS']) ? 3 : 0;
  if(player.targetY!==undefined){
    player.y += (player.targetY-player.y)*0.15*dt;
  } else {
    player.y += targetVy*dt;
  }
  player.y=Math.max(-60,Math.min(60,player.y));

  if(player.cool>0)player.cool-=dt;
  enemy.cool-=dt;
  if(enemy.cool<=0){
    enemyFire();
    enemy.cool=90+Math.random()*70;
  }
  // enemy bobs with AI drift
  enemy.y += Math.sin(frame/50)*0.6*dt;
  enemy.y=Math.max(-50,Math.min(50,enemy.y));

  const playerShipY=waterY+player.y;
  const enemyShipY=waterY+enemy.y;

  // update balls
  balls.forEach(b=>{
    b.x+=b.vx*dt;
    b.vy+=0.28*dt;
    b.y+=b.vy*dt;
  });
  balls=balls.filter(b=>{
    if(b.from==='player' && rectHit(b.x,b.y,enemy.x,enemyShipY-20)){
      enemy.hp-=15;splashes.push({x:b.x,y:b.y,life:20});SFX.hit();
      return false;
    }
    if(b.from==='enemy' && rectHit(b.x,b.y,player.x,playerShipY-20)){
      player.hp-=12;splashes.push({x:b.x,y:b.y,life:20});SFX.hit();
      return false;
    }
    if(b.y>waterY+40){splashes.push({x:b.x,y:waterY+10,life:18});return false;}
    return b.x>-30&&b.x<W+30;
  });

  drawShip(player.x,playerShipY,1,'#8d4a2f');
  drawShip(enemy.x,enemyShipY,-1,'#5a3d2f');

  balls.forEach(b=>{
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
  });

  splashes.forEach(s=>{
    ctx.strokeStyle=`rgba(255,255,255,${s.life/20})`;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(s.x,s.y,20-s.life,0,Math.PI*2);ctx.stroke();
    s.life-=1*dt;
  });
  splashes=splashes.filter(s=>s.life>0);

  // HP bars
  drawBar(60,20,player.hp,'#4caf50');
  drawBar(W-260,20,enemy.hp,'#e94560');
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='left';
  ctx.fillText('YOU',60,16);
  ctx.textAlign='right';
  ctx.fillText('ENEMY',W-60,16);

  if(enemy.hp<=0){
    gameOver=true;battlesWon++;
    msg=I18N.t('victory_msg','VICTORY! Ship Sunk!');
    if(battlesWon>hi){hi=battlesWon;localStorage.setItem('psb_hi',hi);}
    SFX.win();
  } else if(player.hp<=0){
    gameOver=true;
    msg=I18N.t('defeat_msg','YOUR SHIP SANK!');
    if(battlesWon>hi){hi=battlesWon;localStorage.setItem('psb_hi',hi);}
    SFX.lose();
  }

  updateScore();
  requestAnimationFrame(loop);
}

function drawBar(x,y,hp,color){
  ctx.fillStyle='#00000066';ctx.fillRect(x,y,200,10);
  ctx.fillStyle=color;ctx.fillRect(x,y,200*Math.max(0,hp)/100,10);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,200,10);
}

function drawShip(x,y,dir,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(dir,1);
  // hull
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(-45,0);ctx.lineTo(45,0);ctx.lineTo(35,20);ctx.lineTo(-35,20);ctx.closePath();
  ctx.fill();
  // mast
  ctx.strokeStyle='#3d2817';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-55);ctx.stroke();
  // sail
  ctx.fillStyle='#e8dcc8';
  ctx.beginPath();
  ctx.moveTo(0,-50);ctx.lineTo(30,-30);ctx.lineTo(0,-10);ctx.closePath();
  ctx.fill();
  // flag
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(0,-55,15,8);
  ctx.restore();
}

function updateScore(){
  document.getElementById('score-display').textContent =
    I18N.t('psb_score_label','HP: {p} | Enemy: {e} | Battles Won: {b} | Best: {h}')
      .replace('{p}',Math.max(0,Math.floor(player.hp)))
      .replace('{e}',Math.max(0,Math.floor(enemy.hp)))
      .replace('{b}',battlesWon)
      .replace('{h}',hi);
}

loop();
</script></body></html>
