<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1a2e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#5bc0eb;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Roller Coaster Brake Calibration</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="340"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right</b> (or tap a zone) to select a brake zone and <b>Up/Down</b> (or tap +/-) to set its strength. Heavier trains need stronger braking. Press <b>Space</b> / tap <b>LAUNCH</b> to run the train and see where it stops!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display');
const HS_KEY='rollercoasterbrakecalibration_highscore';
let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let lives=3,level=1,streak=0;
let started=false,gameOver=false,running=false;

let numZones=3,brakes=[],selected=0,weight=1,tolerance=26;
let train={x:0,vx:0},stopOffset=null,resultFlash=null,flashTimer=0;
const TRACK_X0=40,TRACK_X1=760,STATION_X=700;

function newRound(){
  numZones=level<3?3:(level<6?4:5);
  brakes=new Array(numZones).fill(0).map(()=>Math.floor(1+Math.random()*2));
  selected=0;
  weight=1+Math.random()*(1+level*0.35);
  tolerance=Math.max(10,26-level*1.4);
  train={x:TRACK_X0,vx:3.4+weight*0.9};
  stopOffset=null;
  running=false;
}

function reset(){score=0;lives=3;level=1;streak=0;started=false;gameOver=false;running=false;newRound();}
reset();

function startGame(){
  if(gameOver){reset();return;}
  if(!started){started=true;}
}

function zoneBounds(i){
  const zoneW=(STATION_X-TRACK_X0-60)/numZones;
  const x0=TRACK_X0+60+i*zoneW;
  return {x0,x1:x0+zoneW};
}

function adjust(delta){
  if(!started||gameOver||running)return;
  brakes[selected]=Math.max(0,Math.min(10,brakes[selected]+delta));
  SFX.click();
}
function selectZone(i){
  if(i<0||i>=numZones)return;
  selected=i;SFX.select();
}

function launch(){
  if(!started||gameOver||running)return;
  running=true;
  SFX.swoosh();
}

function finishRun(){
  running=false;
  const offset=train.x-STATION_X;
  stopOffset=offset;
  const abs=Math.abs(offset);
  const correct=abs<=tolerance;
  if(correct){
    const bonus=Math.round((1-abs/Math.max(1,tolerance))*15);
    score+=20+level*3+bonus;
    streak++;
    SFX.win();
    resultFlash='good';
    if(streak>0&&streak%4===0){level++;SFX.levelup();}
  } else {
    lives--;streak=0;
    SFX.fail();
    resultFlash='bad';
  }
  flashTimer=0.8;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  if(lives<=0){gameOver=true;started=false;SFX.lose();}
  else newRound();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!started||gameOver)startGame();else launch();}
  else if(e.code==='ArrowLeft'){e.preventDefault();if(!started||gameOver)startGame();else selectZone(selected-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();if(!started||gameOver)startGame();else selectZone(selected+1);}
  else if(e.code==='ArrowUp'){e.preventDefault();adjust(1);}
  else if(e.code==='ArrowDown'){e.preventDefault();adjust(-1);}
});

function pointerAction(x,y){
  if(!started||gameOver){startGame();return;}
  if(running)return;
  // Launch button area
  if(y>270&&y<310&&x>330&&x<470){launch();return;}
  for(let i=0;i<numZones;i++){
    const b=zoneBounds(i);
    if(x>=b.x0&&x<=b.x1){
      if(y<150){selectZone(i);adjust(1);}
      else {selectZone(i);adjust(-1);}
      return;
    }
  }
}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();pointerAction((e.clientX-r.left)*(800/r.width),(e.clientY-r.top)*(340/r.height));});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();const t=e.touches[0];pointerAction((t.clientX-r.left)*(800/r.width),(t.clientY-r.top)*(340/r.height));},{passive:false});

function drawTrack(){
  ctx.strokeStyle='#555';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(TRACK_X0,220);ctx.lineTo(TRACK_X1,220);ctx.stroke();

  // Station + target tolerance band
  ctx.fillStyle='#2b3a55';ctx.fillRect(STATION_X-30,195,90,55);
  ctx.strokeStyle='#5bc0eb';ctx.lineWidth=2;ctx.strokeRect(STATION_X-30,195,90,55);
  ctx.fillStyle='rgba(91,192,235,0.25)';
  ctx.fillRect(STATION_X-tolerance,210,tolerance*2,20);
  ctx.strokeStyle='#5bc0eb';ctx.beginPath();ctx.moveTo(STATION_X,195);ctx.lineTo(STATION_X,250);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('station_label','STATION'),STATION_X,190);

  for(let i=0;i<numZones;i++){
    const b=zoneBounds(i);
    const sel=i===selected;
    ctx.fillStyle=sel?'rgba(91,192,235,0.3)':'rgba(255,255,255,0.08)';
    ctx.fillRect(b.x0,160,b.x1-b.x0-6,120);
    ctx.strokeStyle=sel?'#5bc0eb':'#444';ctx.lineWidth=sel?3:1;
    ctx.strokeRect(b.x0,160,b.x1-b.x0-6,120);
    ctx.fillStyle='#fff';ctx.font='bold 13px Arial';
    ctx.fillText(I18N.t('zone_label','Zone {n}').replace('{n}',i+1),(b.x0+b.x1-6)/2,178);
    ctx.font='bold 22px Arial';ctx.fillStyle='#ffd54f';
    ctx.fillText(brakes[i],(b.x0+b.x1-6)/2,218);
    ctx.font='12px Arial';ctx.fillStyle='#9fb3c8';
    ctx.fillText('+ / -',(b.x0+b.x1-6)/2,250);
  }

  // Train
  ctx.fillStyle='#e94560';
  ctx.fillRect(train.x-20,195,40,25);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(train.x-14,200,10,8);
  ctx.fillRect(train.x+4,200,10,8);

  ctx.textAlign='left';ctx.font='14px Arial';ctx.fillStyle='#9fb3c8';
  ctx.fillText(I18N.t('weight_label','Riders weight: {w}x').replace('{w}',weight.toFixed(1)),40,140);
}

function drawLaunchBtn(){
  const disabled=running;
  ctx.fillStyle=disabled?'#555':'#27ae60';
  ctx.fillRect(330,270,140,40);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('launch_btn','LAUNCH (Space)'),400,294);
}

function drawHud(){
  ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#5bc0eb';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}','❤'.repeat(Math.max(0,lives))),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),780,30);
  if(stopOffset!=null&&!running){
    ctx.textAlign='center';ctx.font='14px Arial';
    ctx.fillStyle=Math.abs(stopOffset)<=tolerance?'#7ee787':'#e94560';
    const txt=stopOffset>0?I18N.t('overshoot_label','Overshot by {n}px').replace('{n}',Math.round(stopOffset)):I18N.t('undershoot_label','Stopped {n}px short').replace('{n}',Math.round(-stopOffset));
    ctx.fillText(txt,400,320);
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  ctx.clearRect(0,0,800,340);
  const sky=ctx.createLinearGradient(0,0,0,340);
  sky.addColorStop(0,'#0d0d1a');sky.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,340);

  if(!started&&!gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bc_title','ROLLER COASTER BRAKE CALIBRATION'),400,130);
    ctx.font='18px Arial';ctx.fillStyle='#5bc0eb';
    ctx.fillText(I18N.t('start_hint2','Press Space or Tap to begin'),400,170);
  } else if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,158);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,186);
  } else {
    if(running){
      // Decelerate train through each zone based on brake strength & weight.
      const zoneW=(STATION_X-TRACK_X0-60)/numZones;
      let zoneIdx=Math.floor((train.x-(TRACK_X0+60))/zoneW);
      if(zoneIdx>=0&&zoneIdx<numZones){
        const decel=(brakes[zoneIdx]*0.9)/weight;
        train.vx=Math.max(0,train.vx-decel*dt*4);
      }
      train.x+=train.vx*dt*30;
      if(train.vx<=0.02||train.x>TRACK_X1){
        train.x=Math.min(train.x,TRACK_X1);
        finishRun();
      }
    }
    drawTrack();
    drawLaunchBtn();
    drawHud();
    if(flashTimer>0){
      flashTimer-=dt;
      ctx.fillStyle=resultFlash==='good'?'rgba(39,174,96,0.2)':'rgba(233,69,96,0.22)';
      ctx.fillRect(0,0,800,340);
    }
  }
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
