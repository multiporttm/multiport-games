<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a1a1a;cursor:pointer}
#ui{color:#eeeeee;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ninja Reflex</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Lives: 3</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">3x3 grid of targets — one flashes gold at a time. Tap it before it fades! Tap the wrong target or miss the window and you lose a life. Gets faster as your score climbs.</div>
</div>
<script>
const W=360,H=360,COLS=3,ROWS=3,CELL=W/COLS;
let score,lives,state,activeIdx,flashTimer,flashDuration;

function loadBest(){return +(localStorage.getItem('ninjareflex_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('ninjareflex_best',v);}

function init(){score=0;lives=3;state='play';newTarget();}
function newTarget(){
  activeIdx=Math.floor(Math.random()*9);
  flashDuration=Math.max(28,70-score*2);
  flashTimer=flashDuration;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  const idx=row*COLS+col;
  if(idx===activeIdx&&flashTimer>0){
    score++;
    SFX.success();
    saveBest(score);
    newTarget();
  }else{
    loseLife();
  }
  updateUI();
});

function loseLife(){
  lives--;
  SFX.error();
  if(lives<=0){
    state='over';
    SFX.lose();
    saveBest(score);
  }else{
    newTarget();
  }
}

function update(){
  if(state!=='play')return;
  flashTimer--;
  if(flashTimer<=0){
    loseLife();
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    for(let c2=0;c2<COLS;c2++){
      const idx=r*COLS+c2;
      const x=c2*CELL,y=r*CELL;
      const isActive=idx===activeIdx&&state==='play';
      ctx.fillStyle=isActive?'#ffca28':'#333';
      ctx.fillRect(x+6,y+6,CELL-12,CELL-12);
      if(isActive){
        ctx.globalAlpha=Math.max(0.3,flashTimer/flashDuration);
        ctx.fillStyle='#fff59d';
        ctx.fillRect(x+6,y+6,CELL-12,CELL-12);
        ctx.globalAlpha=1;
      }
    }
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#eeeeee';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('out_of_lives_title','OUT OF LIVES'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('score_best','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('score_lives','Score: {n} | Lives: {l}').replace('{n}',score).replace('{l}',Math.max(0,lives));
}

init();draw();
</script></body></html>
