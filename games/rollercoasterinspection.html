<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b2a3a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Roller Coaster Inspection</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Inspect each bolt, wheel assembly, and restraint before the ride opens. Press <b>F</b> or tap the <b>left</b> side to <b>flag</b> a faulty part, or <b>P</b> / tap the <b>right</b> side to <b>pass</b> a safe one. Three wrong calls and the inspection fails!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display');
const HS_KEY='rollercoasterinspection_highscore';
let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);
let lives=3,level=1,streak=0;
let started=false,gameOver=false;
let item=null,timeLeft=0,timeMax=0,resultFlash=null,flashTimer=0;
const TYPES=['bolt','wheel','restraint'];

function newItem(){
  const type=TYPES[Math.floor(Math.random()*TYPES.length)];
  // Higher level => subtler tell and less time.
  const faulty=Math.random()<0.45;
  timeMax=Math.max(1.6,4.2-level*0.18);
  timeLeft=timeMax;
  item={type,faulty,wobble:0};
}

function reset(){
  score=0;lives=3;level=1;streak=0;started=false;gameOver=false;item=null;resultFlash=null;flashTimer=0;
}

function startGame(){
  if(gameOver){reset();return;}
  if(!started){started=true;newItem();}
}

function judge(flagged){
  if(!started||gameOver||!item)return;
  const correct=(flagged===item.faulty);
  if(correct){
    score+=10+level*2;
    streak++;
    SFX.success();
    resultFlash='good';
    if(streak>0&&streak%10===0){level++;SFX.levelup();}
  } else {
    lives--;
    streak=0;
    SFX.fail();
    resultFlash='bad';
  }
  flashTimer=0.5;
  if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  if(lives<=0){
    gameOver=true;
    item=null;
    SFX.lose();
  } else {
    newItem();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='KeyF'){e.preventDefault();if(!started||gameOver){startGame();}else{judge(true);}}
  else if(e.code==='KeyP'){e.preventDefault();if(!started||gameOver){startGame();}else{judge(false);}}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();}
});

function pointerAction(x){
  if(!started||gameOver){startGame();return;}
  if(x<400)judge(true);else judge(false);
}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();pointerAction((e.clientX-r.left)*(800/r.width));});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();const t=e.touches[0];pointerAction((t.clientX-r.left)*(800/r.width));},{passive:false});

function drawBolt(x,y,faulty,wobble){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=faulty?'#c0392b':'#8d99ae';
  ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=faulty?'#e74c3c':'#b8c4d9';
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+(faulty?wobble*0.4:0);
    ctx.fillRect(Math.cos(a)*18-4,Math.sin(a)*18-4,8,8);
  }
  if(faulty){
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-10,-20);ctx.lineTo(4,0);ctx.lineTo(-6,2);ctx.lineTo(12,22);ctx.stroke();
  }
  ctx.restore();
}
function drawWheel(x,y,faulty,wobble){
  ctx.save();ctx.translate(x+(faulty?Math.sin(wobble*6)*5:0),y);
  ctx.fillStyle='#2b2b36';
  ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=faulty?'#e67e22':'#5aaa30';
  ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+wobble;
    ctx.strokeStyle='#777';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);ctx.stroke();
  }
  ctx.restore();
}
function drawRestraint(x,y,faulty,wobble){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#34495e';
  ctx.fillRect(-36,-10,72,20);
  const gap=faulty?10+Math.sin(wobble*5)*3:0;
  ctx.fillStyle=faulty?'#c0392b':'#27ae60';
  ctx.fillRect(-30,-24,24,18);
  ctx.fillRect(6+gap,-24,24,18);
  ctx.restore();
}

function drawItem(){
  if(!item)return;
  const cx=400,cy=150;
  if(item.type==='bolt')drawBolt(cx,cy,item.faulty,item.wobble);
  else if(item.type==='wheel')drawWheel(cx,cy,item.faulty,item.wobble);
  else drawRestraint(cx,cy,item.faulty,item.wobble);
  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  const label=item.type==='bolt'?I18N.t('label_bolt','BOLT'):item.type==='wheel'?I18N.t('label_wheel','WHEEL ASSEMBLY'):I18N.t('label_restraint','RESTRAINT MECHANISM');
  ctx.fillText(label,cx,cy+70);
}

function drawBars(){
  const barW=300,barH=16,bx=400-barW/2,by=220;
  ctx.fillStyle='#222';ctx.fillRect(bx,by,barW,barH);
  const pct=Math.max(0,timeLeft/timeMax);
  ctx.fillStyle=pct>0.4?'#5aaa30':pct>0.18?'#e67e22':'#c0392b';
  ctx.fillRect(bx,by,barW*pct,barH);
  ctx.strokeStyle='#555';ctx.strokeRect(bx,by,barW,barH);

  ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#ffd54f';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}','❤'.repeat(Math.max(0,lives))),20,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),780,30);

  ctx.textAlign='center';ctx.font='15px Arial';ctx.fillStyle='#9fb3c8';
  ctx.fillText(I18N.t('flag_pass_hint','F = Flag Faulty   |   P = Pass Safe'),400,270);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  ctx.clearRect(0,0,800,320);
  const sky=ctx.createLinearGradient(0,0,0,320);
  sky.addColorStop(0,'#0d1b2a');sky.addColorStop(1,'#1b2a3a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,320);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ri_title','ROLLER COASTER INSPECTION'),400,130);
    ctx.font='18px Arial';ctx.fillStyle='#ffd54f';
    ctx.fillText(I18N.t('start_hint2','Press Space, F, or Tap to begin'),400,170);
  } else if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,158);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,186);
  } else {
    if(item){
      item.wobble+=dt*4;
      timeLeft-=dt;
      if(timeLeft<=0){
        timeLeft=0;
        judge(!item.faulty); // forced wrong call on timeout
      }
    }
    drawItem();
    drawBars();
    if(flashTimer>0){
      flashTimer-=dt;
      ctx.fillStyle=resultFlash==='good'?'rgba(90,170,48,0.25)':'rgba(192,57,43,0.3)';
      ctx.fillRect(0,0,800,320);
    }
  }
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
