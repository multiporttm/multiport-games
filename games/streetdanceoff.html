<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#6a1b9a,#ff477e);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff477e;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center;margin:10px auto}
#pad button{border:none;border-radius:10px;background:#2a0a3a;color:#fff;font-size:1.5rem;font-weight:900;cursor:pointer}
#pad button:active{background:#ff477e}
#pu{grid-column:2;grid-row:1}#pl{grid-column:1;grid-row:2}#pd{grid-column:2;grid-row:2}#pr{grid-column:3;grid-row:2}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Street Dance Off</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Combo: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="pad">
      <button id="pu">↑</button>
      <button id="pl">←</button>
      <button id="pd">↓</button>
      <button id="pr">→</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press the <b>Arrow Keys</b> (or tap the on-screen arrows) exactly when each prompt reaches the hit zone to land your dance moves. Build a <b>combo</b> for a higher score — the beat speeds up as you go!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300,ZONE_X=120,LANES={ArrowUp:0,ArrowLeft:1,ArrowDown:2,ArrowRight:3};
const DIR_NAMES=['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];
const ARROWS=['↑','←','↓','→'];
const LANE_Y=[60,130,200,270];
let score=0,combo=0,bestCombo=0,hi=parseFloat(localStorage.getItem('streetdanceoff_hi')||'0');
let bestComboSaved=parseFloat(localStorage.getItem('streetdanceoff_bestcombo')||'0');
bestCombo=bestComboSaved;
let notes=[]; // {lane, x, hit:false, missed:false}
let beatInterval=70,spawnTimer=0,speed=6,started=false,gameOver=false,lastTime=null,elapsed=0;
let feedback='',feedbackTimer=0;

function reset(){
  score=0;combo=0;notes=[];spawnTimer=0;speed=6;beatInterval=70;started=false;gameOver=false;lastTime=null;elapsed=0;feedback='';feedbackTimer=0;
}

function spawnNote(){
  const lane=Math.floor(Math.random()*4);
  notes.push({lane,x:W+20,hit:false,missed:false});
}

function judge(lane){
  // find closest un-hit note in this lane within tolerance
  let best=null,bestDist=999;
  for(const n of notes){
    if(n.hit||n.missed||n.lane!==lane)continue;
    const d=Math.abs(n.x-ZONE_X);
    if(d<bestDist){bestDist=d;best=n;}
  }
  if(best&&bestDist<45){
    best.hit=true;
    if(bestDist<18){score+=20;feedback=I18N.t('perfect_label','PERFECT!');SFX.success();}
    else{score+=10;feedback=I18N.t('good_label','GOOD!');SFX.point();}
    combo++;
    if(combo>bestCombo)bestCombo=combo;
    feedbackTimer=30;
  } else {
    combo=0;
    feedback=I18N.t('miss_label','MISS');
    feedbackTimer=30;
    SFX.error();
  }
}

function handleKey(dir){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  judge(LANES[dir]);
}

document.addEventListener('keydown',e=>{
  if(DIR_NAMES.includes(e.code)||['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const dir = DIR_NAMES.includes(e.code) ? e.code : e.key;
    handleKey(dir);
  }
});
document.getElementById('pu').addEventListener('click',()=>handleKey('ArrowUp'));
document.getElementById('pl').addEventListener('click',()=>handleKey('ArrowLeft'));
document.getElementById('pd').addEventListener('click',()=>handleKey('ArrowDown'));
document.getElementById('pr').addEventListener('click',()=>handleKey('ArrowRight'));
c.addEventListener('click',()=>{ if(!started)started=true; else if(gameOver)reset(); });
c.addEventListener('touchstart',e=>{e.preventDefault(); if(!started)started=true; else if(gameOver)reset();},{passive:false});

function drawZone(){
  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.lineWidth=3;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(ZONE_X,LANE_Y[i],26,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawLanes(){
  ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<4;i++){
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillText(ARROWS[i],ZONE_X,LANE_Y[i]);
  }
}

function drawNote(n){
  ctx.fillStyle=n.hit?'rgba(255,255,255,.15)':'#fff';
  ctx.beginPath();
  ctx.arc(n.x,LANE_Y[n.lane],20,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle=n.hit?'rgba(0,0,0,.1)':'#2a0a3a';
  ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ARROWS[n.lane],n.x,LANE_Y[n.lane]);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#6a1b9a');g.addColorStop(1,'#ff477e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  drawZone();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press an Arrow / Tap to start'),W/2,H/2);
    drawLanes();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawLanes();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press Arrow to restart'),W/2,H/2+20);
    document.getElementById('score-display').textContent=I18N.t('dance_score_label','Score: {s} | Combo: {c} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{c}',bestCombo).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  elapsed+=dt;

  speed=6+elapsed/240;
  spawnTimer+=dt;
  const interval=Math.max(38,beatInterval-elapsed/12);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnNote();}

  drawLanes();

  notes.forEach(n=>{
    n.x-=speed*dt;
    drawNote(n);
    if(!n.hit&&!n.missed&&n.x<ZONE_X-45){
      n.missed=true;
      combo=0;
      missStreak++;
      feedback=I18N.t('miss_label','MISS');
      feedbackTimer=30;
      SFX.error();
      checkEnd();
    }
  });
  notes=notes.filter(n=>n.x>-30);

  if(feedbackTimer>0){
    feedbackTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(feedback,W/2,50);
  }

  score+=0; // score only from hits
  if(score>hi)hi=score;
  document.getElementById('score-display').textContent=I18N.t('dance_score_label','Score: {s} | Combo: {c} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{c}',bestCombo).replace('{h}',Math.floor(hi));

  requestAnimationFrame(loop);
}

let missStreak=0;

// Track consecutive misses to end the run
const origJudge=judge;
judge=function(lane){
  const before=combo;
  origJudge(lane);
  if(combo===0&&before>0){missStreak++;}else if(combo>0){missStreak=0;}
  checkEnd();
};

function checkEnd(){
  if(missStreak>=6){
    gameOver=true;
    if(score>hi)hi=score;
    if(bestCombo>bestComboSaved)bestComboSaved=bestCombo;
    localStorage.setItem('streetdanceoff_hi',hi);
    localStorage.setItem('streetdanceoff_bestcombo',bestComboSaved);
    SFX.lose();
  }
}

loop();
</script></body></html>
