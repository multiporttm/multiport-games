<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#ff9800,#37474f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffcc80;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Construction Crane</div>
  <div class="game-frame">
    <div id="score-display">Height: 0 | Best: 0 | Stability: 100%</div>
    <canvas id="c" width="640" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Click</b>, or <b>Tap</b> to grab a swinging block, then press again when the hook swings over the tower to drop it. Center each block to keep the tower stable — miss too badly and it topples!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=600;
let hi=parseInt(localStorage.getItem('constructioncrane_hi')||'0',10);

const craneY=60;
const pivotX=W/2;
let armLen=180;
let angle=0,angleDir=1,angleSpeed=0.022;
let hook={holding:false,x:0,y:0};
let block=null; // falling/held block
let stack=[]; // placed blocks {x,y,w,h}
let stability=100;
let gameOver=false,started=false;
let score=0; // tower height count
let blockW=70,blockH=30;
const groundY=560;

function reset(){
  angle=0;angleDir=1;angleSpeed=0.022;armLen=180;
  hook={holding:false,x:0,y:0};
  block=null;stack=[];stability=100;gameOver=false;started=false;score=0;blockW=70;
  spawnHeldBlockAtHook();
}

function spawnHeldBlockAtHook(){
  block={x:pivotX,y:craneY+armLen,w:blockW,h:blockH,vy:0,falling:false,carried:true};
}

function pivotPos(){
  return {x:pivotX+Math.sin(angle)*armLen, y:craneY+Math.cos(angle)*armLen};
}

function action(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(block && block.carried){
    // release: block starts falling from current hook position
    block.carried=false;
    block.falling=true;
    block.vy=0;
    SFX.click();
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();action();}});
c.addEventListener('click',action);
c.addEventListener('touchstart',e=>{e.preventDefault();action();},{passive:false});

function topOfStack(){
  if(stack.length===0)return groundY;
  return stack[stack.length-1].y;
}

function settleBlock(){
  // find landing x = block.x, landing on top of stack or ground
  const landY=topOfStack()-blockH;
  const baseX = stack.length? stack[stack.length-1].x + stack[stack.length-1].w/2 : pivotX;
  const baseW = stack.length? stack[stack.length-1].w : 200;
  const centerOffset=Math.abs((block.x+block.w/2)-baseX);
  const maxOffset=baseW/2+block.w/2;
  const accuracy=Math.max(0,1-centerOffset/(baseW*0.6+1));
  // stability impact
  const penalty=(1-accuracy)*35;
  stability-=penalty;
  const placed={x:block.x,y:landY,w:block.w,h:blockH,accuracy};
  stack.push(placed);
  score=stack.length;
  if(score>hi){hi=score;localStorage.setItem('constructioncrane_hi',hi);}
  if(accuracy>0.85){SFX.success();}else if(accuracy>0.5){SFX.point();}else{SFX.error();}
  block=null;
  if(stability<=0){
    stability=0;
    gameOver=true;
    SFX.lose();
    return;
  }
  // narrow blocks slightly as tower grows, speed up swing
  blockW=Math.max(36,70-score*2);
  angleSpeed=Math.min(0.05,0.022+score*0.0012);
  spawnHeldBlockAtHook();
}

function drawArm(){
  const hp=pivotPos();
  ctx.strokeStyle='#212121';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(pivotX,craneY);ctx.lineTo(hp.x,hp.y);ctx.stroke();
  ctx.fillStyle='#616161';
  ctx.beginPath();ctx.arc(pivotX,craneY,10,0,Math.PI*2);ctx.fill();
  // hook
  ctx.strokeStyle='#9e9e9e';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(hp.x,hp.y+8,8,0,Math.PI*2);ctx.stroke();
  return hp;
}

function drawTowerBase(){
  ctx.fillStyle='#455a64';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#546e7a';
  ctx.fillRect(pivotX-100,groundY-6,200,6);
}

function drawBlock(b,color){
  ctx.fillStyle=color||'#d84315';
  ctx.fillRect(b.x-b.w/2,b.y,b.w,b.h);
  ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
  ctx.strokeRect(b.x-b.w/2,b.y,b.w,b.h);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // sky
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#78909c');sky.addColorStop(1,'#cfd8dc');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,groundY);

  drawTowerBase();
  stack.forEach(b=>drawBlock(b,'#e64a19'));

  if(!started){
    ctx.fillStyle='#212121';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tower_toppled_title','TOWER TOPPLED!'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_height_label','Height: {s} | Best: {h}').replace('{s}',score).replace('{h}',hi),W/2,H/2+10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap / Click / Space to try again'),W/2,H/2+44);
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  angle+=angleSpeed*angleDir;
  if(angle>1.1){angle=1.1;angleDir=-1;}
  if(angle<-1.1){angle=-1.1;angleDir=1;}

  const hp=drawArm();

  if(block){
    if(block.carried){
      block.x=hp.x;block.y=hp.y+8;
      drawBlock(block,'#ff9800');
    } else if(block.falling){
      block.vy+=0.55;
      block.y+=block.vy;
      const landY=topOfStack()-blockH;
      if(block.y>=landY){
        block.y=landY;
        settleBlock();
      } else {
        drawBlock(block,'#ff9800');
      }
    }
  }

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('crane_score_label','Height: {s} | Best: {h} | Stability: {st}%')
      .replace('{s}',score).replace('{h}',hi).replace('{st}',Math.max(0,Math.round(stability)));
}

reset();
loop();
</script></body></html>
