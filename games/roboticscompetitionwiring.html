<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#0a0704}
#c{background:#120d08;display:block;border-radius:8px;touch-action:none}
#hud{color:#ffc266;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#fff}
.lives{color:#ff5a5a}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Robotics Competition Wiring</div>
  <div class="game-frame">
    <div id="hud">
      <span data-i18n="hud_level">Level: <b id="lvl">1</b></span>
      <span data-i18n="hud_score">Score: <b id="scr">0</b></span>
      <span data-i18n="hud_hi">Hi: <b id="hi">0</b></span>
      <span class="lives" id="livesDisp">●●●</span>
    </div>
    <canvas id="c" width="700" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap a <b>motor or sensor</b> on the left, then click/tap the <b>controller port</b> on the right with the matching color. Arrow keys + <b>Tab</b> + <b>Enter</b> work too. A mismatched connection costs a life — wiring looms get denser every round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='roboticscompetitionwiring_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
document.getElementById('hi').textContent=hi;

const PALETTE=[
  {hex:'#ff5a5a',name:'Red'},{hex:'#ffb347',name:'Orange'},{hex:'#ffe066',name:'Yellow'},
  {hex:'#7ee081',name:'Green'},{hex:'#66c7ff',name:'Blue'},{hex:'#b48aff',name:'Purple'},
  {hex:'#66fff0',name:'Cyan'},{hex:'#ff8ad8',name:'Pink'}
];

let level=1,score=0,lives=3;
let sources=[],ports=[],connections=[],roundTimer=0,roundLimit=0,phase='play';
let selectedSource=null,selSide='left',focusL=0,focusR=0;
let flashLine=null,flashT=0,message='',messageT=0;

function genLevel(){
  const n=Math.min(PALETTE.length,3+level);
  const idx=[...Array(PALETTE.length).keys()];
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const chosen=idx.slice(0,n);
  sources=chosen.map((ci,i)=>({color:PALETTE[ci],x:95,y:70+i*(320/Math.max(1,n-1||1)),connected:false}));
  if(n===1)sources[0].y=230;
  const order=[...chosen];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  ports=order.map((ci,i)=>({color:PALETTE[ci],x:605,y:70+i*(320/Math.max(1,n-1||1)),connected:false}));
  if(n===1)ports[0].y=230;
  connections=[];selectedSource=null;focusL=0;focusR=0;selSide='left';
  roundLimit=Math.max(360,n*85-level*4);
  roundTimer=roundLimit;
  message=I18N.t('match_wires','Match every wire to its port!');messageT=80;
}

function unconnectedIdx(list){return list.map((o,i)=>i).filter(i=>!list[i].connected);}

function attemptConnect(si,pi){
  if(sources[si].connected||ports[pi].connected)return;
  if(sources[si].color.hex===ports[pi].color.hex){
    connections.push({si,pi});
    sources[si].connected=true;ports[pi].connected=true;
    SFX.click();
    if(connections.length>=sources.length)completeLevel();
  } else {
    flashLine={si,pi};flashT=24;
    loseLife(I18N.t('wrong_wire','Mismatched wire!'));
  }
  selectedSource=null;
}

function loseLife(reason){
  lives--;SFX.error();
  message=reason;messageT=70;
  document.getElementById('livesDisp').textContent='●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives));
  if(lives<=0){phase='over';SFX.lose();if(score>hi){hi=score;localStorage.setItem(KEY,hi);}return;}
}

function completeLevel(){
  score+=sources.length*12+level*5;
  SFX.success();
  level++;
  document.getElementById('lvl').textContent=level;
  document.getElementById('scr').textContent=score;
  message=I18N.t('loom_done','Loom wired correctly!');messageT=70;
  genLevel();
}

function restart(){level=1;score=0;lives=3;document.getElementById('livesDisp').textContent='●●●';document.getElementById('lvl').textContent=1;document.getElementById('scr').textContent=0;genLevel();}

function hitNode(mx,my,list){
  for(let i=0;i<list.length;i++){
    if(Math.hypot(mx-list[i].x,my-list[i].y)<22)return i;
  }
  return -1;
}

function handlePick(mx,my){
  const si=hitNode(mx,my,sources);
  if(si>=0&&!sources[si].connected){selectedSource=si;selSide='right';return;}
  const pi=hitNode(mx,my,ports);
  if(pi>=0&&!ports[pi].connected){
    if(selectedSource!=null)attemptConnect(selectedSource,pi);
    return;
  }
}

c.addEventListener('click',e=>{
  if(phase==='over'){restart();return;}
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(700/r.width),my=(e.clientY-r.top)*(460/r.height);
  handlePick(mx,my);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(phase==='over'){restart();return;}
  const t=e.touches[0];const r=c.getBoundingClientRect();
  const mx=(t.clientX-r.left)*(700/r.width),my=(t.clientY-r.top)*(460/r.height);
  handlePick(mx,my);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','Tab','Enter','Escape'].includes(e.key))e.preventDefault();
  if(phase==='over'){if(e.key==='Enter')restart();return;}
  if(e.key==='Escape'){selectedSource=null;selSide='left';return;}
  if(e.key==='Tab'){selSide=selSide==='left'?'right':'left';return;}
  const uL=unconnectedIdx(sources),uR=unconnectedIdx(ports);
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    const d=e.key==='ArrowDown'?1:-1;
    if(selSide==='left'&&uL.length){const p=uL.indexOf(focusL);focusL=uL[(p<0?0:(p+d+uL.length)%uL.length)];}
    else if(selSide==='right'&&uR.length){const p=uR.indexOf(focusR);focusR=uR[(p<0?0:(p+d+uR.length)%uR.length)];}
  } else if(e.key==='Enter'){
    if(selSide==='left'&&uL.length){selectedSource=focusL;selSide='right';}
    else if(selSide==='right'&&selectedSource!=null&&uR.length){attemptConnect(selectedSource,focusR);}
  }
});

function draw(){
  ctx.clearRect(0,0,700,460);
  const g=ctx.createLinearGradient(0,0,700,460);
  g.addColorStop(0,'#120d08');g.addColorStop(1,'#1b140a');
  ctx.fillStyle=g;ctx.fillRect(0,0,700,460);

  ctx.fillStyle='#2a1f12';ctx.fillRect(40,40,110,380);ctx.fillRect(550,40,110,380);
  ctx.strokeStyle='#4a3a20';ctx.lineWidth=2;ctx.strokeRect(40,40,110,380);ctx.strokeRect(550,40,110,380);
  ctx.fillStyle='#ffc266';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('motors_label','MOTORS / SENSORS'),95,30);
  ctx.fillText(I18N.t('ports_label','CONTROLLER PORTS'),605,30);

  connections.forEach(cn=>{
    ctx.strokeStyle=sources[cn.si].color.hex;ctx.lineWidth=4;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.moveTo(sources[cn.si].x,sources[cn.si].y);ctx.lineTo(ports[cn.pi].x,ports[cn.pi].y);ctx.stroke();
    ctx.globalAlpha=1;
  });

  if(flashLine&&flashT>0){
    ctx.strokeStyle='#ff5a5a';ctx.lineWidth=3;ctx.globalAlpha=flashT/24;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(sources[flashLine.si].x,sources[flashLine.si].y);ctx.lineTo(ports[flashLine.pi].x,ports[flashLine.pi].y);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;flashT--;
  }

  if(selectedSource!=null){
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(sources[selectedSource].x,sources[selectedSource].y);ctx.lineTo(mouseX||sources[selectedSource].x,mouseY||sources[selectedSource].y);ctx.stroke();
    ctx.setLineDash([]);
  }

  sources.forEach((s,i)=>{
    ctx.beginPath();ctx.arc(s.x,s.y,16,0,7);
    ctx.fillStyle=s.connected?'#333':s.color.hex;ctx.fill();
    ctx.lineWidth=(selSide==='left'&&focusL===i&&!s.connected)?3:1.5;
    ctx.strokeStyle=(selectedSource===i)?'#fff':'#000a';ctx.stroke();
  });
  ports.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);
    ctx.fillStyle=p.connected?'#333':'#0f0b06';ctx.fill();
    ctx.lineWidth=(selSide==='right'&&focusR===i&&!p.connected)?3:2;
    ctx.strokeStyle=p.connected?'#555':p.color.hex;ctx.stroke();
  });

  if(phase==='play'){
    roundTimer--;
    if(roundTimer<=0){loseLife(I18N.t('time_up','Out of time!'));if(phase!=='over')genLevel();}
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,700,26);
    ctx.fillStyle=roundTimer<120?'#ff5a5a':'#ffc266';ctx.font='bold 15px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('time_label','TIME: ')+Math.ceil(roundTimer/60)+'s   ['+connections.length+'/'+sources.length+']',350,18);
  } else if(phase==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,700,460);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),350,200);
    ctx.font='18px Arial';ctx.fillText(I18N.t('final_score','Final Score: ')+score,350,236);
    ctx.fillText(I18N.t('restart_hint2','Tap / Click / Enter to rebuild'),350,268);
  }

  if(messageT>0){
    messageT--;
    ctx.fillStyle='#ffe066';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.globalAlpha=Math.min(1,messageT/20);
    ctx.fillText(message,350,445);
    ctx.globalAlpha=1;
  }

  requestAnimationFrame(draw);
}

let mouseX=null,mouseY=null;
c.addEventListener('mousemove',e=>{
  const r=c.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(700/r.width);mouseY=(e.clientY-r.top)*(460/r.height);
});

genLevel();
draw();
</script></body></html>
