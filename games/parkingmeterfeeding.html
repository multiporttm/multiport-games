<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Parking Meter Feeding - Multiport Games</title><meta name="description" content="Play Parking Meter Feeding free online — Click a meter to select it, then click Nickel/Dime/Quarter (or press 1-5 to select and A/S/D to pay) to feed it before time runs out."><link rel="canonical" href="https://games.multiportllc.com/games/parkingmeterfeeding"><meta property="og:title" content="Parking Meter Feeding - Multiport Games"><meta property="og:description" content="Play Parking Meter Feeding free online — Click a meter to select it, then click Nickel/Dime/Quarter (or press 1-5 to select and A/S/D to pay) to feed it before time runs out."><meta property="og:url" content="https://games.multiportllc.com/games/parkingmeterfeeding"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Parking Meter Feeding","description":"Play Parking Meter Feeding free online instantly. Run down a row of parking meters, dropping in the right coins before each one expires. Juggle several countdowns at once to keep every car ticket-free. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/parkingmeterfeeding","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2634;display:block;border-radius:8px;touch-action:manipulation}
#hud{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#coinRow{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
#coinRow button{padding:10px 18px;border:none;border-radius:20px;background:#e94560;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
#coinRow button:active{transform:scale(.95)}
#coinRow button.nickel{background:#607d8b}
#coinRow button.dime{background:#9c27b0}
#coinRow button.quarter{background:#e94560}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Parking Meter Feeding</div>
  <div class="game-frame">
    <div id="hud">Score: 0 | Hi: 0 | Tickets: 0/3</div>
    <canvas id="c" width="800" height="260"></canvas>
    <div id="coinRow">
      <button class="nickel" onclick="pay(5)">Nickel (5¢) [A]</button>
      <button class="dime" onclick="pay(10)">Dime (10¢) [S]</button>
      <button class="quarter" onclick="pay(25)">Quarter (25¢) [D]</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap a meter to select it (or press <b>1-5</b>), then feed it coins with the buttons or <b>A</b> (nickel) / <b>S</b> (dime) / <b>D</b> (quarter) until it's paid in full before it hits zero. Miss 3 meters and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const N=5;
const METER_X=[70,230,390,550,710];
let meters=[],selected=0,score=0,hi=0,tickets=0,lives=3,gameOver=false,started=false,lastTime=null,difficulty=0;

hi=parseInt(localStorage.getItem('parkingmeterfeeding_hi')||'0',10);

function randReq(){
  const opts=[10,15,25,30,40,50,65,75];
  return opts[Math.floor(Math.random()*Math.min(opts.length,3+Math.floor(difficulty/2)))];
}
function randTime(){
  return Math.max(9,18-difficulty*0.8);
}

function newMeter(){
  return {req:randReq(),balance:0,timeLeft:randTime(),maxTime:randTime(),flash:0,justPaid:0};
}

function reset(){
  meters=[];
  for(let i=0;i<N;i++)meters.push(newMeter());
  score=0;tickets=0;lives=3;gameOver=false;started=false;selected=0;difficulty=0;lastTime=null;
}
reset();

function pay(cents){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  const m=meters[selected];
  if(!m||m.paidCooldown>0)return;
  m.balance+=cents;
  SFX.coin();
  if(m.balance>=m.req){
    score+=10+Math.floor(m.timeLeft);
    if(score>hi){hi=score;localStorage.setItem('parkingmeterfeeding_hi',String(hi));}
    m.justPaid=1;
    SFX.success();
    difficulty+=0.15;
    Object.assign(m,newMeter());
    m.paidCooldown=0.4;
  }
}
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='5'){selected=parseInt(e.key,10)-1;SFX.select();}
  else if(e.key==='a'||e.key==='A')pay(5);
  else if(e.key==='s'||e.key==='S')pay(10);
  else if(e.key==='d'||e.key==='D')pay(25);
  else if(e.key===' '&&gameOver){e.preventDefault();reset();}
});

function pickMeter(mx){
  let best=0,bd=1e9;
  for(let i=0;i<N;i++){const d=Math.abs(METER_X[i]-mx);if(d<bd){bd=d;best=i;}}
  return best;
}
function pointerXY(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return cx*(c.width/r.width);
}
c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  if(!started)started=true;
  selected=pickMeter(pointerXY(e));
  SFX.select();
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver){reset();return;}
  if(!started)started=true;
  selected=pickMeter(pointerXY(e));
  SFX.select();
},{passive:false});

function drawMeter(m,i,x){
  const sel=i===selected;
  ctx.save();
  ctx.translate(x,0);
  // post
  ctx.fillStyle='#555';
  ctx.fillRect(-6,120,12,110);
  // head
  ctx.fillStyle=sel?'#ffd54f':'#8899aa';
  ctx.beginPath();ctx.arc(0,110,38,Math.PI,0);ctx.fill();
  ctx.fillRect(-38,110,76,40);
  // dial
  ctx.fillStyle='#1a2634';
  ctx.beginPath();ctx.arc(0,128,24,0,Math.PI*2);ctx.fill();
  const pct=Math.max(0,m.timeLeft/m.maxTime);
  const color=pct>0.5?'#4caf50':pct>0.2?'#ffb300':'#e94560';
  ctx.strokeStyle=color;ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(0,128,20,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(Math.ceil(m.timeLeft)+'s',0,132);
  // amount owed
  ctx.fillStyle='#fff';ctx.font='bold 15px Arial';
  const owed=Math.max(0,m.req-m.balance);
  ctx.fillText('$'+(owed/100).toFixed(2),0,182);
  ctx.font='11px Arial';ctx.fillStyle='#bbb';
  ctx.fillText('of $'+(m.req/100).toFixed(2),0,196);
  if(m.flash>0){
    ctx.fillStyle=`rgba(233,69,96,${m.flash})`;
    ctx.beginPath();ctx.arc(0,128,26,0,Math.PI*2);ctx.fill();
  }
  if(m.justPaid>0){
    ctx.fillStyle=`rgba(76,175,80,${m.justPaid})`;
    ctx.font='bold 14px Arial';
    ctx.fillText(I18N.t('paid_label','PAID!'),0,90);
  }
  ctx.restore();
  // car
  ctx.save();
  ctx.translate(x,0);
  const carY=190+30;
  ctx.fillStyle=m.timeLeft<=0?'#e94560':'#3d7dca';
  ctx.fillRect(-45,carY,90,26);
  ctx.fillRect(-28,carY-14,56,16);
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(-25,carY+26,8,0,Math.PI*2);ctx.arc(25,carY+26,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,800,260);
  const sky=ctx.createLinearGradient(0,0,0,260);
  sky.addColorStop(0,'#26364a');sky.addColorStop(1,'#1a2634');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,260);
  ctx.fillStyle='#33465c';ctx.fillRect(0,220,800,10);

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_meter','Select a meter and feed it coins to start'),400,60);
  }

  if(gameOver){
    for(let i=0;i<N;i++)drawMeter(meters[i],i,METER_X[i]);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press Space to restart'),400,150);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  if(started){
    for(let i=0;i<N;i++){
      const m=meters[i];
      if(m.paidCooldown>0){m.paidCooldown-=dt;}
      if(m.justPaid>0)m.justPaid=Math.max(0,m.justPaid-dt*2);
      if(m.flash>0)m.flash=Math.max(0,m.flash-dt*2);
      if(m.timeLeft>0){
        m.timeLeft-=dt;
        if(m.timeLeft<=0){
          m.timeLeft=0;
          tickets++;
          lives--;
          m.flash=1;
          SFX.hurt();
          if(lives<=0){
            gameOver=true;
            SFX.lose();
            if(score>hi){hi=score;localStorage.setItem('parkingmeterfeeding_hi',String(hi));}
          } else {
            difficulty+=0.3;
            Object.assign(m,newMeter());
          }
        }
      }
    }
  }

  for(let i=0;i<N;i++)drawMeter(meters[i],i,METER_X[i]);
  updateHud();
  requestAnimationFrame(loop);
}
function updateHud(){
  document.getElementById('hud').textContent=
    I18N.t('meter_hud','Score: {s} | Hi: {h} | Tickets: {t}/3')
      .replace('{s}',score).replace('{h}',hi).replace('{t}',tickets);
}
loop();
</script></body></html>
