<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#hud{display:flex;justify-content:space-between;gap:10px;color:#ffe0a3;font-weight:800;padding:6px 10px;font-size:1rem;flex-wrap:wrap}
#c{background:#7a5230;display:block;border-radius:8px;margin:0 auto;touch-action:none;cursor:crosshair}
#msg{text-align:center;color:#ffd54f;font-weight:800;min-height:1.4em;margin-top:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Autumn Leaf Rake</div>
  <div class="game-frame">
    <div id="hud">
      <span id="round-display">Round: 1</span>
      <span id="score-display">Piled: 0/0</span>
      <span id="time-display">Time: 30</span>
      <span id="best-display">Best: 0</span>
    </div>
    <canvas id="c" width="800" height="450"></canvas>
    <div id="msg"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag your rake across the yard (mouse, finger, or arrow keys) to push fallen leaves into the pile marked on the ground. Watch out for wind gusts that scatter your pile — rake fast before time runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const BEST_KEY='autumnleafrake_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);

let round=1,timeLeft=30,leaves=[],pile={x:400,y:380,r:55,count:0},goal=14;
let rake={x:400,y:200,w:70,h:14};
let running=false,gameOver=false,lastTime=null,windTimer=0,gustFlash=0;
const leafColors=['#e07a1f','#d94b2b','#c9a227','#a33d1e','#e8b04b'];

function rand(a,b){return a+Math.random()*(b-a);}

function spawnLeaves(n){
  for(let i=0;i<n;i++){
    let x,y;
    do{x=rand(30,W-30);y=rand(30,H-100);}while(Math.hypot(x-pile.x,y-pile.y)<pile.r+20);
    leaves.push({x,y,color:leafColors[Math.floor(Math.random()*leafColors.length)],piled:false,rot:rand(0,Math.PI*2),vx:0,vy:0});
  }
}

function startRound(){
  timeLeft=30+round*2;
  leaves=[];
  pile.count=0;
  goal=10+round*4;
  spawnLeaves(goal+Math.floor(round*1.5));
  windTimer=0;
  running=true;
  gameOver=false;
  lastTime=null;
  setMsg(I18N.t('rake_start_msg','Rake the leaves into the pile!'));
  update();
}

function setMsg(t){document.getElementById('msg').textContent=t;}

function updateHud(){
  document.getElementById('round-display').textContent=I18N.t('round_label','Round: {r}').replace('{r}',round);
  document.getElementById('score-display').textContent=I18N.t('piled_label','Piled: {p}/{g}').replace('{p}',pile.count).replace('{g}',goal);
  document.getElementById('time-display').textContent=I18N.t('time_label','Time: {t}').replace('{t}',Math.ceil(timeLeft));
  document.getElementById('best-display').textContent=I18N.t('best_label','Best: {b}').replace('{b}',best);
}

function moveRakeTo(x,y){
  rake.x=Math.max(rake.w/2,Math.min(W-rake.w/2,x));
  rake.y=Math.max(rake.h/2,Math.min(H-20,y));
}

// pointer control
let dragging=false;
function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)};
}
c.addEventListener('mousedown',e=>{dragging=true;const p=getPos(e);moveRakeTo(p.x,p.y);});
window.addEventListener('mousemove',e=>{if(dragging){const p=getPos(e);moveRakeTo(p.x,p.y);}});
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;const p=getPos(e);moveRakeTo(p.x,p.y);if(!running&&!gameOver)startGame();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const p=getPos(e);moveRakeTo(p.x,p.y);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});
c.addEventListener('click',()=>{if(!running&&!gameOver)startGame();else if(gameOver)startGame();});

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;
  if(e.key===' '&&(!running)){startGame();}
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function startGame(){
  round=1;
  cumulativeScore=0;
  best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);
  startRound();
}

function endRound(success){
  running=false;
  const totalScore=totalPiledScore();
  if(totalScore>best){best=totalScore;localStorage.setItem(BEST_KEY,String(best));}
  if(success){
    SFX.success();
    cumulativeScore+=pile.count;
    setMsg(I18N.t('round_clear_msg','Yard cleared! Next round...'));
    round++;
    setTimeout(()=>{ if(!gameOver) startRound(); },1400);
  } else {
    gameOver=true;
    SFX.fail();
    setMsg(I18N.t('game_over_msg','Time up! Final round {r} — piled {p}/{g}. Tap or press Space to try again.').replace('{r}',round).replace('{p}',pile.count).replace('{g}',goal));
  }
  updateHud();
}

let cumulativeScore=0;
function totalPiledScore(){ return cumulativeScore+pile.count; }

function checkRake(){
  const rx1=rake.x-rake.w/2, rx2=rake.x+rake.w/2, ry1=rake.y-rake.h/2, ry2=rake.y+rake.h/2;
  leaves.forEach(l=>{
    if(l.piled)return;
    if(l.x>rx1-10&&l.x<rx2+10&&l.y>ry1-10&&l.y<ry2+10){
      const dx=l.x-pile.x, dy=l.y-pile.y;
      const dist=Math.hypot(dx,dy)||1;
      // push leaf away from rake center, generally toward being nudged
      const pdx=l.x-rake.x, pdy=l.y-rake.y;
      const pd=Math.hypot(pdx,pdy)||1;
      l.x+=(pdx/pd)*4;
      l.y+=(pdy/pd)*4;
      l.x=Math.max(15,Math.min(W-15,l.x));
      l.y=Math.max(15,Math.min(H-15,l.y));
    }
  });
}

function checkPile(){
  leaves.forEach(l=>{
    if(l.piled)return;
    if(Math.hypot(l.x-pile.x,l.y-pile.y)<pile.r*0.6){
      l.piled=true;
      pile.count++;
      SFX.point();
    }
  });
}

function gust(){
  const unpiled=leaves.filter(l=>!l.piled);
  const repiled=leaves.filter(l=>l.piled&&Math.random()<0.35);
  repiled.forEach(l=>{
    l.piled=false;
    pile.count--;
    l.x=Math.max(20,Math.min(W-20,l.x+rand(-160,160)));
    l.y=Math.max(20,Math.min(H-90,l.y+rand(-120,120)));
  });
  gustFlash=18;
  SFX.swoosh();
}

function drawRake(){
  ctx.save();
  ctx.strokeStyle='#5b3a1e';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(rake.x,rake.y+rake.h/2+40);ctx.lineTo(rake.x,rake.y);ctx.stroke();
  ctx.fillStyle='#8a5a2b';
  ctx.fillRect(rake.x-rake.w/2,rake.y-rake.h/2,rake.w,rake.h);
  ctx.fillStyle='#5b3a1e';
  for(let i=0;i<6;i++){
    const tx=rake.x-rake.w/2+6+i*((rake.w-12)/5);
    ctx.fillRect(tx,rake.y+rake.h/2,4,14);
  }
  ctx.restore();
}

function drawLeaf(l){
  ctx.save();
  ctx.translate(l.x,l.y);
  ctx.rotate(l.rot);
  ctx.fillStyle=l.color;
  ctx.beginPath();
  ctx.moveTo(0,-8);
  ctx.quadraticCurveTo(8,0,0,8);
  ctx.quadraticCurveTo(-8,0,0,-8);
  ctx.fill();
  ctx.restore();
}

function drawPile(){
  ctx.save();
  ctx.strokeStyle='rgba(255,213,79,0.7)';
  ctx.setLineDash([6,6]);
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(pile.x,pile.y,pile.r,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  const n=pile.count;
  const layers=Math.min(6,Math.ceil(n/3));
  for(let i=0;i<layers;i++){
    const r=pile.r*0.35+(i*6);
    ctx.fillStyle=leafColors[i%leafColors.length];
    ctx.beginPath();ctx.ellipse(pile.x,pile.y+ (6-i*3),r,r*0.55,0,0,Math.PI*2);ctx.fill();
  }
}

function update(){
  ctx.clearRect(0,0,W,H);
  const grass=ctx.createLinearGradient(0,0,0,H);
  grass.addColorStop(0,'#8a6a3a');grass.addColorStop(1,'#5f4321');
  ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<8;i++)ctx.fillRect(0,i*(H/8),W,2);

  if(gustFlash>0){
    ctx.fillStyle='rgba(255,255,255,'+(gustFlash/18*0.15)+')';
    ctx.fillRect(0,0,W,H);
    gustFlash--;
  }

  drawPile();
  leaves.forEach(l=>{ if(!l.piled) drawLeaf(l); });
  drawRake();

  if(!running){
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    if(!gameOver) ctx.fillText(I18N.t('rake_start_hint','Tap, Click, or Space to start raking!'),W/2,H/2);
    updateHud();
    requestAnimationFrame(update);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  // keyboard movement
  const spd=6*dt;
  if(keys['ArrowLeft'])rake.x-=spd;
  if(keys['ArrowRight'])rake.x+=spd;
  if(keys['ArrowUp'])rake.y-=spd;
  if(keys['ArrowDown'])rake.y+=spd;
  rake.x=Math.max(rake.w/2,Math.min(W-rake.w/2,rake.x));
  rake.y=Math.max(rake.h/2,Math.min(H-20,rake.y));

  checkRake();
  checkPile();

  windTimer+=dt;
  const windInterval=Math.max(90,220-round*10);
  if(windTimer>=windInterval){windTimer=0;if(leaves.some(l=>l.piled))gust();}

  timeLeft-=dt/60;
  if(timeLeft<=0){timeLeft=0;endRound(pile.count>=goal);}
  else if(pile.count>=goal){cumulativeScore+=pile.count;endRound(true);}

  updateHud();
  requestAnimationFrame(update);
}
updateHud();
update();
</script></body></html>
