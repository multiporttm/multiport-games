<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a0e1a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ecfff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Shortwave Radio Scanning</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right Arrows</b> or <b>A/D</b>, or drag with mouse/touch, to sweep the dial. Hold near a fading station while the <b>LOCK</b> meter fills to log it. Let 3 stations fade out unlogged and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const DIAL_Y=180,DIAL_H=60,DIAL_X=40,DIAL_W=W-80;
const FREQ_MIN=0,FREQ_MAX=1000;

let freq=500,score=0,lives=3,hi=0,gameOver=false,started=false;
let stations=[],lockProgress=0,spawnTimer=0,time=0,msg='',msgTimer=0;
let keyLeft=false,keyRight=false,dragging=false;

try{hi=parseInt(localStorage.getItem('shortwave_hi')||'0',10)||0;}catch(e){}

function level(){ return 1+Math.floor(score/400); }

function reset(){
  freq=500;score=0;lives=3;gameOver=false;started=false;stations=[];lockProgress=0;
  spawnTimer=0;time=0;msg='';msgTimer=0;
}
reset();

function flash(t){msg=t;msgTimer=100;}

function spawnStation(){
  const lvl=level();
  const f=FREQ_MIN+40+Math.random()*(FREQ_MAX-FREQ_MIN-80);
  const activeDuration=Math.max(220,500-lvl*18); // frames (~fps60)
  stations.push({freq:f,life:activeDuration,maxLife:activeDuration,caught:false,missed:false,name:'STN-'+Math.floor(Math.random()*900+100)});
}

function xForFreq(f){ return DIAL_X+((f-FREQ_MIN)/(FREQ_MAX-FREQ_MIN))*DIAL_W; }

function tolerance(){ return Math.max(12,30-level()*1.2); }
function lockNeeded(){ return 60+level()*8; } // frames to hold lock

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keyLeft=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keyRight=true;
  if(!started){started=true;}
  else if(gameOver&&(e.code==='Space'||e.code==='Enter')){reset();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keyLeft=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keyRight=false;
});

function setFreqFromClientX(clientX){
  const r=c.getBoundingClientRect();
  const mx=(clientX-r.left)*(W/r.width);
  freq=Math.max(FREQ_MIN,Math.min(FREQ_MAX,((mx-DIAL_X)/DIAL_W)*(FREQ_MAX-FREQ_MIN)+FREQ_MIN));
}

c.addEventListener('mousedown',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  dragging=true;setFreqFromClientX(e.clientX);
});
window.addEventListener('mousemove',e=>{ if(dragging)setFreqFromClientX(e.clientX); });
window.addEventListener('mouseup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  dragging=true;setFreqFromClientX(e.touches[0].clientX);
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragging)setFreqFromClientX(e.touches[0].clientX);
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});

function nearestActiveStation(){
  let best=null,bestD=Infinity;
  stations.forEach(s=>{
    if(s.caught||s.missed)return;
    const d=Math.abs(s.freq-freq);
    if(d<bestD){bestD=d;best=s;}
  });
  return {station:best,dist:bestD};
}

function drawStatic(){
  for(let i=0;i<120;i++){
    const x=Math.random()*W,y=DIAL_Y+Math.random()*DIAL_H;
    ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.04)+')';
    ctx.fillRect(x,y,2,2);
  }
}

function update(dt){
  if(keyLeft)freq-=4.2*dt;
  if(keyRight)freq+=4.2*dt;
  freq=Math.max(FREQ_MIN,Math.min(FREQ_MAX,freq));

  time+=dt;
  spawnTimer+=dt;
  const spawnInterval=Math.max(70,150-level()*4);
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnStation();}

  const {station,dist}=nearestActiveStation();
  const tol=tolerance();
  if(station&&dist<tol){
    lockProgress+=dt;
    if(lockProgress>=lockNeeded()){
      station.caught=true;
      score+=40+level()*5;
      if(score>hi){hi=score;try{localStorage.setItem('shortwave_hi',String(hi));}catch(e){}}
      lockProgress=0;
      SFX.success();
      flash(I18N.t('sw_logged','Logged: '+station.name+'!'));
    }
  } else {
    lockProgress=Math.max(0,lockProgress-dt*2.5);
  }

  stations.forEach(s=>{
    if(s.caught||s.missed)return;
    s.life-=dt;
    if(s.life<=0){
      s.missed=true;
      lives--;
      SFX.fail();
      flash(I18N.t('sw_faded','Signal faded: '+s.name+' lost.'));
      if(lives<=0){
        gameOver=true;
        SFX.lose();
        if(score>hi){hi=score;try{localStorage.setItem('shortwave_hi',String(hi));}catch(e){}}
      }
    }
  });
  stations=stations.filter(s=>!(s.caught&&s.life<-60)&&!(s.missed&&s.life<-60));
  if(msgTimer>0)msgTimer-=dt;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#030410');sky.addColorStop(1,'#101830');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#8fd3ff';ctx.font='bold 18px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('sw_level_label','Night Scan — Level '+level()),20,30);

  // dial track
  ctx.fillStyle='#111a2e';
  ctx.fillRect(DIAL_X,DIAL_Y,DIAL_W,DIAL_H);
  ctx.strokeStyle='#3a5a8a';ctx.strokeRect(DIAL_X,DIAL_Y,DIAL_W,DIAL_H);
  ctx.save();ctx.beginPath();ctx.rect(DIAL_X,DIAL_Y,DIAL_W,DIAL_H);ctx.clip();
  drawStatic();
  ctx.restore();

  // stations as glow bands (strength falls off from center = bell curve look)
  stations.forEach(s=>{
    if(s.caught||s.missed)return;
    const x=xForFreq(s.freq);
    const fade=Math.max(0,Math.min(1,s.life/s.maxLife));
    const grad=ctx.createLinearGradient(x-26,0,x+26,0);
    grad.addColorStop(0,'rgba(126,207,255,0)');
    grad.addColorStop(0.5,'rgba(126,207,255,'+(0.55*fade)+')');
    grad.addColorStop(1,'rgba(126,207,255,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(x-26,DIAL_Y,52,DIAL_H);
    ctx.fillStyle='rgba(255,255,255,'+(0.8*fade)+')';
    ctx.font='11px Arial';ctx.textAlign='center';
    ctx.fillText(s.name,x,DIAL_Y-6);
  });

  // needle
  const nx=xForFreq(freq);
  ctx.strokeStyle='#ff5252';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(nx,DIAL_Y-14);ctx.lineTo(nx,DIAL_Y+DIAL_H+14);ctx.stroke();
  ctx.fillStyle='#ff5252';ctx.beginPath();ctx.moveTo(nx-7,DIAL_Y-14);ctx.lineTo(nx+7,DIAL_Y-14);ctx.lineTo(nx,DIAL_Y-2);ctx.fill();

  // lock meter
  const lockW=240,lockX=W/2-lockW/2,lockY=260;
  ctx.fillStyle='#1a2740';ctx.fillRect(lockX,lockY,lockW,16);
  ctx.fillStyle='#ffd54f';ctx.fillRect(lockX,lockY,lockW*Math.min(1,lockProgress/lockNeeded()),16);
  ctx.strokeStyle='#556';ctx.strokeRect(lockX,lockY,lockW,16);
  ctx.fillStyle='#cfe8ff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('sw_lock_label','LOCK'),W/2,lockY-4);

  if(msgTimer>0){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,40,W,26);
    ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,58);
  }

  if(!started){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sw_start_hint','Drag the dial / Arrow keys / Tap to start'),W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap / Click / Space to restart'),W/2,H/2+20);
  }

  document.getElementById('score-display').textContent=
    I18N.t('sw_status_label','Score: {s} | Lives: {l} | Hi: {h}')
      .replace('{s}',Math.floor(score)).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(started&&!gameOver)update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
