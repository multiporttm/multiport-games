<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#eaf3ff;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;color:#2c3e5a;font-size:1rem;font-weight:700;padding:8px 14px;font-variant-numeric:tabular-nums}
#near{color:#e0743d;text-align:center;font-weight:800;min-height:1.3em}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sled Riding</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Distance: 0 | Hi: 0</span><span id="nearcount-display">Near-misses: 0</span></div>
    <div id="near">&nbsp;</div>
    <canvas id="c" width="480" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Lean with <b>Arrow Keys</b> / <b>A-D</b>, or drag/tap the hill. Cruise down the neighborhood hill with your friends, dodge <b>snowmen</b> and <b>fences</b>, and squeeze past close calls for near-miss bonus points. Just a fun, relaxed ride — until you crash!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const trackL=30,trackR=W-30;
let score=0,hi=parseFloat(localStorage.getItem('sledriding_hi')||'0');
let nearMisses=0;
let started=false,gameOver=false,lastTime=null;
let scroll=0;
let nearFlash=0;

const sled={x:W/2,y:H-110,w:44,h:26,lean:0};
let steerDir=0;
let dragging=false;

const friends=[
  {offset:-0.62,phase:0,color:'#ffb703'},
  {offset:0.62,phase:2.1,color:'#8ecae6'}
];

let obstacles=[],spawnTimer=0;

function reset(){
  score=0;nearMisses=0;started=false;gameOver=false;lastTime=null;scroll=0;nearFlash=0;
  sled.x=W/2;sled.lean=0;
  obstacles=[];spawnTimer=0;
}
function start(){ if(!started){started=true;} else if(gameOver){reset();} }

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){steerDir=-1;start();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){steerDir=1;start();}
  else if(e.code==='Space'){e.preventDefault();start();}
});
document.addEventListener('keyup',e=>{
  if((e.code==='ArrowLeft'||e.code==='KeyA')&&steerDir===-1)steerDir=0;
  if((e.code==='ArrowRight'||e.code==='KeyD')&&steerDir===1)steerDir=0;
});
function pointerToX(clientX){
  const rect=c.getBoundingClientRect();
  return (clientX-rect.left)*(W/rect.width);
}
let targetX=W/2;
c.addEventListener('pointerdown',e=>{dragging=true;targetX=pointerToX(e.clientX);start();});
c.addEventListener('pointermove',e=>{if(dragging)targetX=pointerToX(e.clientX);});
window.addEventListener('pointerup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;targetX=pointerToX(e.touches[0].clientX);start();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)targetX=pointerToX(e.touches[0].clientX);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;if(gameOver)start();},{passive:false});

function spawnObstacle(){
  const r=Math.random();
  const type = r<0.55 ? 'snowman' : 'fence';
  const x=trackL+30+Math.random()*(trackR-trackL-60);
  const w = type==='fence' ? 60 : 26;
  obstacles.push({type,x,y:-40,w,h:type==='fence'?24:34,passed:false});
}

function drawBg(){
  ctx.fillStyle='#eaf3ff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#dcebfa';
  ctx.fillRect(0,0,trackL,H);
  ctx.fillRect(trackR,0,W-trackR,H);
  // houses in far background, gently scrolling for neighborhood feel
  for(let i=0;i<4;i++){
    const hx=((i*160)+ (scroll*0.15))%(W+160)-80;
    ctx.fillStyle='#f6d9b0';
    ctx.fillRect(hx,40,70,50);
    ctx.fillStyle='#c65b3f';
    ctx.beginPath();ctx.moveTo(hx-8,40);ctx.lineTo(hx+35,14);ctx.lineTo(hx+78,40);ctx.fill();
    ctx.fillStyle='#fffbe6';ctx.fillRect(hx+12,55,14,14);ctx.fillRect(hx+44,55,14,14);
  }
  // sparkle texture on the slope
  ctx.strokeStyle='rgba(180,205,235,0.5)';ctx.lineWidth=2;
  for(let i=-1;i<8;i++){
    const y=((scroll*0.5)+(i*90))%(H+90)-90;
    ctx.beginPath();ctx.moveTo(trackL+10,y);ctx.lineTo(trackR-10,y+30);ctx.stroke();
  }
}

function drawFriend(f){
  const fx = W/2 + f.offset*(W/2-trackL-30);
  const fy = sled.y + Math.sin((scroll*0.05)+f.phase)*10;
  ctx.save();ctx.translate(fx,fy);ctx.globalAlpha=0.85;
  ctx.fillStyle='#7a5230';ctx.fillRect(-20,4,40,10);
  ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(0,-6,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd9b3';ctx.beginPath();ctx.arc(0,-18,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSled(){
  ctx.save();
  ctx.translate(sled.x,sled.y);
  ctx.rotate(sled.lean*0.28);
  // sled rails
  ctx.fillStyle='#7a5230';
  ctx.fillRect(-sled.w/2,4,sled.w,10);
  ctx.strokeStyle='#4a3016';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-sled.w/2-6,16);ctx.lineTo(-sled.w/2+6,4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sled.w/2+6,16);ctx.lineTo(sled.w/2-6,4);ctx.stroke();
  // rider seated
  ctx.fillStyle='#d1495b';
  ctx.beginPath();ctx.arc(0,-6,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd9b3';
  ctx.beginPath();ctx.arc(0,-20,7.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2c3e5a';
  ctx.beginPath();ctx.arc(0,-24,6,Math.PI,0);ctx.fill();
  ctx.restore();
}

function drawObstacle(o){
  ctx.save();ctx.translate(o.x,o.y);
  if(o.type==='snowman'){
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,10,14,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-10,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8a3d';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(10,-8);ctx.lineTo(0,-6);ctx.fill();
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-3,-13,1.5,0,Math.PI*2);ctx.arc(4,-13,1.5,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#c8935a';
    for(let i=-1;i<=1;i++){ctx.fillRect(i*22-3,-14,6,28);}
    ctx.fillRect(-o.w/2,-4,o.w,6);
  }
  ctx.restore();
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function loop(ts){
  const dt=lastTime===null?1:Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;
  drawBg();
  friends.forEach(drawFriend);

  if(!started){
    ctx.fillStyle='#2c3e5a';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Lean or drag to start'),W/2,H/2);
    drawSled();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    obstacles.forEach(drawObstacle);
    drawSled();
    ctx.fillStyle='rgba(40,50,70,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('crash_title','Oof, wipeout!'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap / press a key to ride again'),W/2,H/2+16);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  const spd=(3.4+score/500)*dt;
  scroll+=spd;
  score+=spd*0.18;
  if(score>hi){hi=score;localStorage.setItem('sledriding_hi',hi);}

  if(steerDir!==0){ targetX+=steerDir*5*dt; dragging=false; }
  targetX=Math.max(trackL+sled.w/2,Math.min(trackR-sled.w/2,targetX));
  const dx=targetX-sled.x;
  sled.x+=dx*0.1*dt;
  sled.lean=Math.max(-1,Math.min(1,dx/40));

  if(nearFlash>0)nearFlash-=dt*16.6667;

  spawnTimer+=dt;
  const interval=Math.max(38,70-score/30);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle();}

  const sledBox={x:sled.x-sled.w/2+6,y:sled.y-22,w:sled.w-12,h:34};
  obstacles=obstacles.filter(o=>o.y<H+60);
  obstacles.forEach(o=>{
    o.y+=spd;
    drawObstacle(o);
    const obox={x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h};
    if(rectHit(sledBox,obox)){
      gameOver=true;SFX.lose();return;
    }
    if(!o.passed && o.y>sled.y){
      o.passed=true;
      const gap=Math.abs(o.x-sled.x)-(o.w/2+sled.w/2);
      if(gap<26){
        nearMisses++;
        score+=15;
        nearFlash=900;
        SFX.point();
      }
    }
  });

  drawSled();

  document.getElementById('near').textContent = nearFlash>0 ? I18N.t('near_miss_label','Close one! +15') : ' ';
  document.getElementById('nearcount-display').textContent = I18N.t('nearmiss_count_label','Near-misses: {n}').replace('{n}',nearMisses);
  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('score-display').textContent = I18N.t('distance_hi_label','Distance: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
}

reset();
requestAnimationFrame(loop);
</script></body></html>
