<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4e342e;cursor:pointer}
#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bakery Bliss</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Baked: 0 | Streak: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap to put a batch in the oven, then tap again the moment it turns golden brown to pull it out perfectly. Pull too early (pale) or too late (burnt) and your streak resets!</div>
</div>
<script>
const W=360,H=360;
let phase,bakeT,goldStart,goldLen,baked,streak,best,state;

function loadBest(){return +(localStorage.getItem('bakerybliss_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('bakerybliss_best',v);}

function init(){baked=0;streak=0;best=loadBest();state='play';phase='ready';}

function startBake(){
  phase='baking';bakeT=0;
  goldLen=Math.max(8,22-streak*0.8);
  goldStart=40+Math.random()*30;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state!=='play')return;
  if(phase==='ready'){
    startBake();
    SFX.click();
  }else if(phase==='baking'){
    if(bakeT>=goldStart&&bakeT<=goldStart+goldLen){
      baked++;streak++;
      SFX.success();
      saveBest(baked);best=loadBest();
    }else{
      streak=0;
      SFX.fail();
    }
    phase='ready';
    updateUI();
  }
});

function update(){
  if(state!=='play'||phase!=='baking')return;
  bakeT++;
  if(bakeT>90){
    streak=0;phase='ready';SFX.fail();updateUI();
  }
}

function colorFor(t){
  if(t<goldStart)return '#e8c39e';
  if(t<=goldStart+goldLen)return '#c58940';
  return '#5d4037';
}

function draw(){
  ctx.fillStyle='#4e342e';ctx.fillRect(0,0,W,H);

  ctx.font='60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🔥',W/2,140);

  if(phase==='baking'){
    ctx.fillStyle=colorFor(bakeT);
    ctx.beginPath();ctx.arc(W/2,220,40,0,Math.PI*2);ctx.fill();
    const barW=W-60;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(30,280,barW,16);
    ctx.fillStyle='#ffb300';ctx.fillRect(30+goldStart,280,goldLen,16);
    ctx.fillStyle='#fff';ctx.fillRect(30+Math.min(barW,bakeT)-2,276,4,24);
  }else{
    ctx.fillStyle='#3e2723';
    ctx.beginPath();ctx.arc(W/2,220,40,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='#ffcc80';ctx.font='14px Arial';
  ctx.fillText(phase==='ready'?'Tap to start baking':'Tap when golden brown!',W/2,320);

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Baked: ${baked} | Streak: ${streak} | Best: ${best}`;
}

init();draw();
</script></body></html>
