<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#03030a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e1bee7;background:#1a0d2e;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Black Hole Escape</div>
  <div class="game-frame">
    <div id="score-display">Crystals: 0 | Time: 0s | Best: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b> (or drag on touch) to steer your ship. Collect the glowing crystals for points while fighting the black hole's ever-growing pull — touch its event horizon and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
const cx=W/2,cy=H/2;
let hi=parseInt(localStorage.getItem('blackholeescape_hi')||'0',10);
let crystals=0,timeSurvived=0,gameOver=false,started=false,lastTime=null;
let holeRadius=30,holeStrength=900,growTime=0;
let ship={x:cx-200,y:cy,vx:0,vy:0,angle:0};
let items=[],particles=[];
const keys={};
let dragging=false,dragTX=null,dragTY=null;

function reset(){
  crystals=0;timeSurvived=0;gameOver=false;started=false;lastTime=null;
  holeRadius=30;holeStrength=900;growTime=0;
  ship={x:cx-200,y:cy,vx:0,vy:0,angle:0};
  items=[];particles=[];
  for(let i=0;i<8;i++)spawnItem();
}

function spawnItem(){
  let x,y,d;
  do{
    x=40+Math.random()*(W-80);
    y=40+Math.random()*(H-80);
    d=Math.hypot(x-cx,y-cy);
  }while(d<120);
  items.push({x,y,r:8,spin:Math.random()*Math.PI*2});
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!started){started=true;}
  else if(gameOver){reset();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function pointerStart(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  dragging=true;dragTX=x;dragTY=y;
}
c.addEventListener('mousedown',e=>{const r=c.getBoundingClientRect();pointerStart((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const r=c.getBoundingClientRect();
  dragTX=(e.clientX-r.left)*W/r.width;dragTY=(e.clientY-r.top)*H/r.height;
});
window.addEventListener('mouseup',()=>{dragging=false;dragTX=null;dragTY=null;});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();const t=e.touches[0];
  pointerStart((t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height);
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const r=c.getBoundingClientRect();const t=e.touches[0];
  dragTX=(t.clientX-r.left)*W/r.width;dragTY=(t.clientY-r.top)*H/r.height;
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;dragTX=null;dragTY=null;},{passive:false});

function drawShip(){
  ctx.save();
  ctx.translate(ship.x,ship.y);
  ctx.rotate(ship.angle);
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();
  ctx.moveTo(14,0);ctx.lineTo(-10,-8);ctx.lineTo(-6,0);ctx.lineTo(-10,8);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-14,-4);ctx.lineTo(-14,4);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawHole(){
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,holeRadius*3.2);
  grad.addColorStop(0,'#000000');
  grad.addColorStop(0.32,'#000000');
  grad.addColorStop(0.5,'#5e35b155');
  grad.addColorStop(1,'#00000000');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(cx,cy,holeRadius*3.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ba68c8';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,holeRadius,0,Math.PI*2);ctx.stroke();
}

function drawItem(it){
  ctx.save();
  ctx.translate(it.x,it.y);
  ctx.rotate(it.spin);
  ctx.fillStyle='#ffee58';
  ctx.beginPath();
  ctx.moveTo(0,-it.r);ctx.lineTo(it.r*0.7,0);ctx.lineTo(0,it.r);ctx.lineTo(-it.r*0.7,0);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#03030a';ctx.fillRect(0,0,W,H);
  // starfield
  for(let i=0;i<60;i++){
    const sx=(i*97)%W, sy=(i*53+frameStar)%H;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(sx,sy,1,1);
  }

  if(!started){
    drawHole();drawShip();
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bh_start_hint','Press a key or click/tap to start'),cx,40);
    updateDisplay();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    items.forEach(drawItem);drawHole();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),cx,cy-140);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),cx,cy-105);
    updateDisplay();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  timeSurvived+=dt/60;
  growTime+=dt;
  holeRadius=30+timeSurvived*1.4;
  holeStrength=900+timeSurvived*60;

  // controls
  const thrust=0.4;
  if(keys['ArrowUp']||keys['KeyW'])ship.vy-=thrust*dt;
  if(keys['ArrowDown']||keys['KeyS'])ship.vy+=thrust*dt;
  if(keys['ArrowLeft']||keys['KeyA'])ship.vx-=thrust*dt;
  if(keys['ArrowRight']||keys['KeyD'])ship.vx+=thrust*dt;
  if(dragging&&dragTX!==null){
    const dx=dragTX-ship.x,dy=dragTY-ship.y;
    const d=Math.hypot(dx,dy)||1;
    ship.vx+=(dx/d)*thrust*1.8*dt;
    ship.vy+=(dy/d)*thrust*1.8*dt;
  }

  // gravity pull toward center
  const gdx=cx-ship.x,gdy=cy-ship.y;
  const gd=Math.max(20,Math.hypot(gdx,gdy));
  const pull=holeStrength/(gd*gd);
  ship.vx+=(gdx/gd)*pull*dt;
  ship.vy+=(gdy/gd)*pull*dt;

  // drag/friction
  ship.vx*=0.985;ship.vy*=0.985;
  const speed=Math.hypot(ship.vx,ship.vy);
  const maxSpeed=9;
  if(speed>maxSpeed){ship.vx=ship.vx/speed*maxSpeed;ship.vy=ship.vy/speed*maxSpeed;}

  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
  ship.x=Math.max(10,Math.min(W-10,ship.x));
  ship.y=Math.max(10,Math.min(H-10,ship.y));
  if(speed>0.2)ship.angle=Math.atan2(ship.vy,ship.vx);

  // items
  items.forEach(it=>{it.spin+=0.05*dt;});
  items=items.filter(it=>{
    const d=Math.hypot(it.x-ship.x,it.y-ship.y);
    if(d<16){
      crystals++;SFX.coin();
      spawnItem();
      return false;
    }
    return true;
  });
  while(items.length<8)spawnItem();

  drawHole();
  items.forEach(drawItem);
  drawShip();

  const distToCenter=Math.hypot(ship.x-cx,ship.y-cy);
  if(distToCenter<holeRadius){
    gameOver=true;SFX.lose();
    const finalScore=crystals*10+Math.floor(timeSurvived);
    if(finalScore>hi){hi=finalScore;localStorage.setItem('blackholeescape_hi',hi);}
  }

  updateDisplay();
  requestAnimationFrame(loop);
}
let frameStar=0;
function tickStars(){frameStar=(frameStar+1)%1000;}
setInterval(tickStars,50);

function updateDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('bh_score_label','Crystals: {c} | Time: {t}s | Best: {b}')
      .replace('{c}',crystals).replace('{t}',Math.floor(timeSurvived)).replace('{b}',hi);
}

reset();
updateDisplay();
requestAnimationFrame(loop);
</script></body></html>
