<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#cfe8ff;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#cfe8ff;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Avalanche Escape</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to steer, or <b>drag</b> on mobile. Dodge rocks and trees while an <b>avalanche</b> chases you from behind — if it fills the whole screen, you're buried! Grab <b>pinecones</b> for a burst of speed to widen your lead.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let distance=0,hiDist=parseInt(localStorage.getItem('avalancheescape_hi')||'0');
let spd=5,frame=0,gameOver=false,started=false;
const player={x:W/2,y:H-110,w:34,h:44,vx:0};
let obstacles=[],pinecones=[];
let lastTime=null,obsTimer=0,coneTimer=0;
let keys={left:false,right:false};
let dragX=null;
const MAX_GAP=340;
let gap=MAX_GAP,boostTimer=0;

function reset(){
  distance=0;spd=5;frame=0;gameOver=false;started=false;
  player.x=W/2;player.vx=0;
  obstacles=[];pinecones=[];lastTime=null;obsTimer=0;coneTimer=0;
  gap=MAX_GAP;boostTimer=0;
}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;startOrRestart();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;startOrRestart();}
  else if(e.code==='Space'){startOrRestart();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
c.addEventListener('click',startOrRestart);
c.addEventListener('touchstart',e=>{e.preventDefault();startOrRestart();dragX=e.touches[0].clientX;},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragX!==null){
    const dx=e.touches[0].clientX-dragX;
    player.x+=dx*1.3;
    dragX=e.touches[0].clientX;
  }
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragX=null;},{passive:false});

function spawnObstacle(){
  const type=Math.random()<0.5?'rock':'tree';
  const x=30+Math.random()*(W-60);
  obstacles.push({x,y:-40,w:type==='rock'?34:28,h:type==='rock'?28:44,type});
}
function spawnPinecone(){
  const x=30+Math.random()*(W-60);
  pinecones.push({x,y:-20,r:10,taken:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.vx*0.02);
  ctx.fillStyle=boostTimer>0?'#ff9800':'#e63946';
  ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-player.h/2-8,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(-4,-player.h/2-11,3,3);
  ctx.fillRect(2,-player.h/2-11,3,3);
  ctx.restore();
}

function drawRock(o){
  ctx.fillStyle='#6b7a8f';
  ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a97a8';
  ctx.beginPath();ctx.ellipse(o.x-5,o.y-5,o.w/4,o.h/4,0,0,Math.PI*2);ctx.fill();
}
function drawTree(o){
  ctx.fillStyle='#5a3a24';
  ctx.fillRect(o.x-4,o.y+o.h/2-8,8,10);
  ctx.fillStyle='#1e6b3a';
  ctx.beginPath();
  ctx.moveTo(o.x,o.y-o.h/2);
  ctx.lineTo(o.x-o.w/2,o.y+o.h/2-6);
  ctx.lineTo(o.x+o.w/2,o.y+o.h/2-6);
  ctx.closePath();ctx.fill();
}
function drawPinecone(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.fillStyle='#8d5524';
  ctx.beginPath();ctx.moveTo(0,-o.r);ctx.lineTo(o.r*0.7,o.r);ctx.lineTo(-o.r*0.7,o.r);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c68642';ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-o.r*0.6,i*o.r*0.5);ctx.lineTo(o.r*0.6,i*o.r*0.5);ctx.stroke();}
  ctx.restore();
}

let bgOffset=0;
function drawBg(dt){
  bgOffset=(bgOffset+spd*dt)%40;
  ctx.fillStyle='#eaf7ff';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c9ecff';
  ctx.lineWidth=2;
  for(let y=-40;y<H+40;y+=40){
    ctx.beginPath();ctx.moveTo(0,y+bgOffset);ctx.lineTo(W,y+bgOffset);ctx.stroke();
  }
}

function drawAvalanche(){
  const fillH=(1-Math.max(0,gap)/MAX_GAP)*H;
  if(fillH<=0)return;
  ctx.save();
  const grad=ctx.createLinearGradient(0,0,0,fillH);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(1,'rgba(220,240,255,0.75)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(W,0);
  ctx.lineTo(W,fillH);
  const teeth=14;
  for(let i=teeth;i>=0;i--){
    const tx=W*(i/teeth);
    const ty=fillH+Math.sin((i*1.7)+frame*0.05)*10;
    ctx.lineTo(tx,ty);
  }
  ctx.lineTo(0,fillH);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if(gap<MAX_GAP*0.3){
    ctx.fillStyle=`rgba(255,255,255,${0.15+0.15*Math.sin(frame*0.2)})`;
    ctx.fillRect(0,0,W,H);
  }
}

function loop(){
  if(gameOver){
    drawBg(0);
    drawAvalanche();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('avalanche_over_title','BURIED!'),W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Key to restart'),W/2,H/2+14);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    drawBg(0);
    drawPlayer();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('avalanche_start_hint','Press a Key or Tap to start — run!'),W/2,80);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  distance+=dt*(spd/5);
  if(distance>hiDist){hiDist=distance;localStorage.setItem('avalancheescape_hi',String(Math.floor(hiDist)));}
  spd=5+distance/220;

  if(keys.left)player.vx=Math.max(player.vx-0.6*dt,-7);
  else if(keys.right)player.vx=Math.min(player.vx+0.6*dt,7);
  else player.vx*=0.85;
  player.x+=player.vx*dt;
  if(player.x<player.w/2)player.x=player.w/2;
  if(player.x>W-player.w/2)player.x=W-player.w/2;

  drawBg(dt);

  // avalanche catch-up
  const catchRate=0.5+distance/3500;
  gap-=catchRate*dt;
  if(boostTimer>0){boostTimer-=dt;gap=Math.min(MAX_GAP,gap+1.1*dt);}
  if(gap<=0){gap=0;gameOver=true;SFX.lose();}

  obsTimer+=dt;
  const obsInterval=Math.max(24,55-distance/30);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObstacle();}
  coneTimer+=dt;
  if(coneTimer>=50){coneTimer-=50;if(Math.random()<0.75)spawnPinecone();}

  const playerHit={x:player.x-player.w/2+4,y:player.y-player.h/2+4,w:player.w-8,h:player.h-8};

  obstacles=obstacles.filter(o=>o.y<H+50);
  obstacles.forEach(o=>{
    o.y+=(spd+2)*dt;
    if(o.type==='rock')drawRock(o); else drawTree(o);
    if(!o.hitFlag&&rect(playerHit,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})&&!gameOver){
      o.hitFlag=true;
      gap-=70;SFX.hit();
      if(gap<=0){gap=0;gameOver=true;SFX.lose();}
    }
  });

  pinecones=pinecones.filter(o=>o.y<H+30&&!o.taken);
  pinecones.forEach(o=>{
    o.y+=(spd+1.5)*dt;
    drawPinecone(o);
    if(rect(playerHit,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})){
      o.taken=true;gap=Math.min(MAX_GAP,gap+45);boostTimer=90;SFX.powerup();
    }
  });

  drawAvalanche();
  drawPlayer();
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('avalanche_score_label','Distance: {d}m | Hi: {h}m')
      .replace('{d}',Math.floor(distance)).replace('{h}',Math.floor(hiDist));
}

loop();
</script></body></html>
