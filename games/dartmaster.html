<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Dart Master</title><meta name="description" content="Play Dart Master free online — Time your throw as the aim ring shrinks toward the dartboard. Score 301 or bust across your darts!"><link rel="canonical" href="https://games.multiportllc.com/games/dartmaster"><meta property="og:title" content="Dart Master - Multiport Games"><meta property="og:description" content="Play Dart Master free online — Time your throw as the aim ring shrinks toward the dartboard. Score 301 or bust across your darts!"><meta property="og:url" content="https://games.multiportllc.com/games/dartmaster"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Dart Master","description":"Play Dart Master free online instantly. Time your throw as the aim ring shrinks toward the dartboard. Score 301 or bust across your darts! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/dartmaster","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#3e2723;cursor:pointer}
#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dart Master</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 301 | Darts left: 12</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">A ring shrinks toward the board — tap when it's tightest around the bullseye for max points. Start at 301 and count down; land exactly on 0 to win, go below and it's a bust for that dart!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=180,R0=120;
let ring,darts,total,state,shrinking;

function loadBest(){return +(localStorage.getItem('dartmaster_best')||99);}
function saveBest(v){if(v<loadBest())localStorage.setItem('dartmaster_best',v);}

function init(){total=301;darts=12;state='play';newThrow();}
function newThrow(){ring=R0;shrinking=true;}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(!shrinking)return;
  shrinking=false;
  darts--;
  let pts=0;
  if(ring<8)pts=50;else if(ring<20)pts=25;else if(ring<40)pts=15;else if(ring<65)pts=8;else if(ring<90)pts=3;
  if(pts>total){SFX.error();}
  else{
    total-=pts;
    if(pts>=25)SFX.success();else if(pts>0)SFX.point();else SFX.fail();
  }
  if(total===0){state='over';SFX.win();saveBest(12-darts);}
  else if(darts<=0){state='over';SFX.lose();}
  else setTimeout(newThrow,500);
  updateUI();
});

function update(){
  if(state!=='play'||!shrinking)return;
  ring-=1.6;
  if(ring<=0){
    shrinking=false;darts--;
    SFX.fail();
    if(darts<=0){state='over';SFX.lose();}
    else setTimeout(newThrow,500);
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#3e2723';ctx.fillRect(0,0,W,H);

  const zones=[[R0,'#212121'],[95,'#fafafa'],[65,'#212121'],[40,'#e53935'],[20,'#fafafa'],[8,'#ffd54f']];
  zones.forEach(([r,col])=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.fill();});

  if(shrinking){
    ctx.strokeStyle='#4fc3f7';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(CX,CY,Math.max(0,ring),0,Math.PI*2);ctx.stroke();
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcc80';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(total===0?'CHECKED OUT!':'OUT OF DARTS',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Remaining: ${total} | Best darts: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to play again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${total} | Darts left: ${Math.max(0,darts)}`;
}

init();draw();
</script></body></html>
