<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#8a5a2b,#f2c14e);display:block;border-radius:8px;touch-action:none}
#score-display{color:#3a2a10;background:#f2c14e;font-size:1.2rem;font-weight:700;text-align:center;padding:8px;border-radius:6px 6px 0 0}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Shot Put</div>
  <div class="game-frame">
    <div id="score-display">Throw 1/3 | Best: 0.00m</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> when the moving marker is inside the power zone to lock in power, then press again to set your release angle. Nail both for a huge throw! You get <b>3 attempts</b> to set your best distance.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const GROUND=340;
let bestEver=parseFloat(localStorage.getItem('shotput_best')||'0');
let attempt=1,totalAttempts=3,roundBest=0;
let state='power'; // power, angle, flying, result, over
let powerMarker=0,powerDir=1,powerVal=0;
let angleMarker=0,angleDir=1,angleVal=45;
let shot={x:120,y:GROUND,vx:0,vy:0};
let flightDist=0;
let resultTimer=0;
let trail=[];

function reset(){
  attempt=1;roundBest=0;
  startThrow();
}
function startThrow(){
  state='power';
  powerMarker=0;powerDir=1;
  angleMarker=0;angleDir=1;
  shot.x=120;shot.y=GROUND;shot.vx=0;shot.vy=0;
  trail=[];
}

function lockPower(){
  // power zone is 70-100 for best result, but any position gives proportional power
  powerVal=powerMarker; // 0..100
  SFX.click();
  state='angle';
}
function lockAngle(){
  angleVal=angleMarker; // maps to 20-70 degrees
  SFX.swoosh();
  launch();
}

function launch(){
  state='flying';
  const angleDeg=20+ (angleVal/100)*50; // 20 to 70
  const rad=angleDeg*Math.PI/180;
  const speed=6+(powerVal/100)*13;
  shot.vx=Math.cos(rad)*speed;
  shot.vy=-Math.sin(rad)*speed;
}

function onAction(){
  if(state==='power')lockPower();
  else if(state==='angle')lockAngle();
  else if(state==='result'){
    resultTimer=0;
    nextOrEnd();
  } else if(state==='over'){
    reset();
  }
}
function nextOrEnd(){
  if(attempt>=totalAttempts){
    state='over';
    if(roundBest>bestEver){bestEver=roundBest;localStorage.setItem('shotput_best',bestEver.toFixed(2));}
  } else {
    attempt++;
    startThrow();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();onAction();}
});
c.addEventListener('click',onAction);
c.addEventListener('touchstart',e=>{e.preventDefault();onAction();},{passive:false});

function drawField(){
  ctx.fillStyle='#f2c14e';ctx.fillRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#8fd3f4');sky.addColorStop(1,'#c9e8fa');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#7cb342';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  for(let i=1;i<=8;i++){
    const dist=i*10;
    const px=120+dist*10;
    if(px>W)break;
    ctx.beginPath();ctx.moveTo(px,GROUND);ctx.lineTo(px,GROUND+10);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';
    ctx.fillText(dist+'m',px,GROUND+24);
  }
  // circle
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(120,GROUND,26,Math.PI,Math.PI*2);ctx.stroke();
}

function drawBar(x,y,w,h,marker,zoneLo,zoneHi,label,color){
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(76,175,80,0.6)';
  ctx.fillRect(x+w*zoneLo/100,y,w*(zoneHi-zoneLo)/100,h);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  const mx=x+w*marker/100;
  ctx.fillStyle=color;
  ctx.fillRect(mx-3,y-6,6,h+12);
  ctx.fillStyle='#3a2a10';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y-14);
}

function drawShot(x,y){
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';
  ctx.beginPath();ctx.arc(x-3,y-3,3,0,Math.PI*2);ctx.fill();
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?1:Math.min((t-lastTime)/16.6667,3);
  lastTime=t;
  ctx.clearRect(0,0,W,H);
  drawField();

  if(state==='power'){
    powerMarker+=powerDir*2.6*dt;
    if(powerMarker>=100){powerMarker=100;powerDir=-1;}
    if(powerMarker<=0){powerMarker=0;powerDir=1;}
    drawBar(200,80,400,26,powerMarker,68,96,I18N.t('sp_power_label','POWER — Tap in the green zone!'),'#ffca28');
    drawShot(120,GROUND-26);
  } else if(state==='angle'){
    angleMarker+=angleDir*2.2*dt;
    if(angleMarker>=100){angleMarker=100;angleDir=-1;}
    if(angleMarker<=0){angleMarker=0;angleDir=1;}
    drawBar(200,80,400,26,angleMarker,55,85,I18N.t('sp_angle_label','ANGLE — Tap in the green zone!'),'#42a5f5');
    drawShot(120,GROUND-26);
  } else if(state==='flying'){
    shot.vy+=0.35*dt;
    shot.x+=shot.vx*dt*2;
    shot.y+=shot.vy*dt*2;
    trail.push({x:shot.x,y:shot.y});
    if(trail.length>60)trail.shift();
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=3;
    ctx.beginPath();
    trail.forEach((p,i)=>{ if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    drawShot(shot.x,shot.y);
    if(shot.y>=GROUND-10){
      shot.y=GROUND-10;
      flightDist=(shot.x-120)/10;
      if(flightDist<0)flightDist=0;
      if(flightDist>roundBest)roundBest=flightDist;
      state='result';
      resultTimer=0;
      SFX.point();
    }
  } else if(state==='result'){
    drawShot(shot.x,GROUND-10);
    ctx.fillStyle='#1a1a2e';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sp_distance_label','Distance: {d}m').replace('{d}',flightDist.toFixed(2)),W/2,150);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('sp_tap_continue','Tap to continue'),W/2,190);
  } else if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-40);
    ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('sp_round_best','Round Best: {d}m').replace('{d}',roundBest.toFixed(2)),W/2,H/2);
    ctx.fillText(I18N.t('sp_alltime_best','All-Time Best: {d}m').replace('{d}',bestEver.toFixed(2)),W/2,H/2+34);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or click to play again'),W/2,H/2+72);
  }

  document.getElementById('score-display').textContent=
    state==='over'
    ? I18N.t('sp_final_label','Round Best: {r}m | All-Time Best: {b}m').replace('{r}',roundBest.toFixed(2)).replace('{b}',bestEver.toFixed(2))
    : I18N.t('sp_progress_label','Throw {a}/{n} | Best: {b}m').replace('{a}',attempt).replace('{n}',totalAttempts).replace('{b}',bestEver.toFixed(2));

  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script></body></html>
