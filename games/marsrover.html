<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#b5502e,#3a1a0f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff9966;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#battery-wrap{max-width:800px;margin:0 auto 8px;background:#2a1510;border-radius:8px;height:14px;overflow:hidden}
#battery-bar{height:100%;background:#4caf50;width:100%;transition:width .1s linear}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Mars Rover</div>
  <div class="game-frame">
    <div id="score-display">Samples: 0 | Best: 0</div>
    <div id="battery-wrap"><div id="battery-bar"></div></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b> or <b>touch-drag</b> to drive the rover. Collect glowing samples for points, avoid rocks, and steer clear of dark craters. Standing still conserves battery — moving drains it. Don't run out of power!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let samples=0,best=0,battery=100,gameOver=false,started=false;
best=parseInt(localStorage.getItem('marsrover_best')||'0',10);

const rover={x:W/2,y:H/2,angle:0,speed:0};
let rocks=[],craters=[],sampleItems=[];
let keys={};
let dragTarget=null;

function rand(a,b){return a+Math.random()*(b-a);}

function spawnField(){
  rocks=[];craters=[];sampleItems=[];
  for(let i=0;i<10;i++)rocks.push({x:rand(30,W-30),y:rand(30,H-30),r:rand(12,24)});
  for(let i=0;i<5;i++)craters.push({x:rand(40,W-40),y:rand(40,H-40),r:rand(20,36)});
  for(let i=0;i<12;i++)sampleItems.push({x:rand(20,W-20),y:rand(20,H-20),collected:false,glow:Math.random()*Math.PI*2});
}

function tooClose(x,y,list,pad){
  return list.some(o=>{const dx=x-o.x,dy=y-o.y;return Math.sqrt(dx*dx+dy*dy)<(o.r||0)+pad;});
}

function reset(){
  samples=0;battery=100;gameOver=false;started=false;
  rover.x=W/2;rover.y=H/2;rover.angle=0;rover.speed=0;
  spawnField();
}
reset();

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('marsrover_score_label','Samples: {s} | Best: {b}')
      .replace('{s}',samples).replace('{b}',best);
  document.getElementById('battery-bar').style.width=Math.max(0,battery)+'%';
  document.getElementById('battery-bar').style.background=battery>30?'#4caf50':'#e94560';
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(!started){started=true;}
  if(gameOver && (e.key===' '||e.key==='Enter')){reset();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}
c.addEventListener('mousedown',e=>{started=true;if(gameOver){reset();return;}dragTarget=pointerPos(e);});
c.addEventListener('mousemove',e=>{if(dragTarget)dragTarget=pointerPos(e);});
window.addEventListener('mouseup',()=>{dragTarget=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();started=true;if(gameOver){reset();return;}dragTarget=pointerPos(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();dragTarget=pointerPos(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragTarget=null;},{passive:false});

function drawRover(){
  ctx.save();
  ctx.translate(rover.x,rover.y);
  ctx.rotate(rover.angle);
  ctx.fillStyle='#c0c0c0';
  ctx.fillRect(-14,-10,28,20);
  ctx.fillStyle='#888';
  ctx.fillRect(-16,-13,6,6);ctx.fillRect(10,-13,6,6);
  ctx.fillRect(-16,7,6,6);ctx.fillRect(10,7,6,6);
  ctx.fillStyle='#4caf50';
  ctx.fillRect(-4,-16,8,6); // antenna panel
  ctx.strokeStyle='#eee';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(22,0);ctx.stroke();
  ctx.restore();
}

function drawRock(r){
  ctx.fillStyle='#5a4a3a';
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#786450';
  ctx.beginPath();ctx.arc(r.x-r.r*0.3,r.y-r.r*0.3,r.r*0.5,0,Math.PI*2);ctx.fill();
}

function drawCrater(cr){
  const grad=ctx.createRadialGradient(cr.x,cr.y,2,cr.x,cr.y,cr.r);
  grad.addColorStop(0,'#1a0a05');grad.addColorStop(1,'#4a2515');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(cr.x,cr.y,cr.r,0,Math.PI*2);ctx.fill();
}

function drawSample(s){
  if(s.collected)return;
  s.glow+=0.08;
  const g=0.5+0.5*Math.sin(s.glow);
  ctx.fillStyle=`rgba(255,214,84,${0.6+0.4*g})`;
  ctx.beginPath();ctx.arc(s.x,s.y,6+2*g,0,Math.PI*2);ctx.fill();
}

function circleHit(x,y,r,x2,y2,r2){
  const dx=x-x2,dy=y-y2;
  return Math.sqrt(dx*dx+dy*dy)<r+r2;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // surface texture
  ctx.fillStyle='#8a3f22';
  for(let i=0;i<40;i++){
    const px=(i*137)%W, py=(i*97+Math.floor(Date.now()/5000)*0)%H;
  }
  craters.forEach(drawCrater);
  rocks.forEach(drawRock);
  sampleItems.forEach(drawSample);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Drive to start — Arrows/WASD or drag'),W/2,H/2);
    drawRover();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('mission_over_title','MISSION OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Click/Tap or Space to restart'),W/2,H/2+18);
    drawRover();
    requestAnimationFrame(loop);
    return;
  }

  // controls
  let moving=false;
  let turn=0,thrust=0;
  if(keys['arrowup']||keys['w']){thrust=1;moving=true;}
  if(keys['arrowdown']||keys['s']){thrust=-1;moving=true;}
  if(keys['arrowleft']||keys['a']){turn=-1;moving=true;}
  if(keys['arrowright']||keys['d']){turn=1;moving=true;}

  if(dragTarget){
    const dx=dragTarget.x-rover.x, dy=dragTarget.y-rover.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>6){
      const targetAngle=Math.atan2(dy,dx);
      let diff=targetAngle-rover.angle;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      rover.angle+=diff*0.15;
      thrust=1;
      moving=true;
    }
  } else {
    rover.angle+=turn*0.045;
  }

  rover.speed+=thrust*0.15;
  rover.speed*=0.92;
  rover.speed=Math.max(-2.2,Math.min(3,rover.speed));

  const nx=rover.x+Math.cos(rover.angle)*rover.speed;
  const ny=rover.y+Math.sin(rover.angle)*rover.speed;

  // rock collision blocks movement
  let blocked=false;
  for(const r of rocks){
    if(circleHit(nx,ny,14,r.x,r.y,r.r)){blocked=true;break;}
  }
  if(!blocked){
    rover.x=Math.max(14,Math.min(W-14,nx));
    rover.y=Math.max(14,Math.min(H-14,ny));
  } else {
    rover.speed*=-0.3;
  }

  // crater = death
  for(const cr of craters){
    if(circleHit(rover.x,rover.y,10,cr.x,cr.y,cr.r*0.7)){
      gameOver=true;SFX.lose();
      break;
    }
  }

  // battery drain
  if(Math.abs(rover.speed)>0.05 || moving){
    battery-=0.12;
  } else {
    battery-=0.01;
  }
  if(battery<=0){battery=0;gameOver=true;SFX.lose();}

  // sample collection
  sampleItems.forEach(s=>{
    if(!s.collected && circleHit(rover.x,rover.y,14,s.x,s.y,6)){
      s.collected=true;samples++;SFX.coin();
      if(samples>best){best=samples;localStorage.setItem('marsrover_best',best);}
    }
  });
  if(sampleItems.every(s=>s.collected)){
    battery=Math.min(100,battery+15);
    spawnField();
    SFX.levelup();
  }

  drawRover();
  updateScore();
  requestAnimationFrame(loop);
}
updateScore();
loop();
</script></body></html>
