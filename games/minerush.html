<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a1108;cursor:pointer}
#ui{color:#ffca28;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Mine Rush</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Coins: 0 | Stamina: 100 | Depth: 1</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap/click blocks to mine them. Ore blocks pay coins, plain rock costs a little stamina, and red cave-in blocks explode — avoid them! Reach 0 stamina and it's game over.</div>
</div>
<script>
const W=360,H=360,COLS=6,ROWS=6,CELL=W/COLS;
let grid,coins,stamina,depth,state,shakeT=0;

function rand(min,max){return min+Math.random()*(max-min);}

function newGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      const roll=Math.random();
      let type='rock';
      if(roll<0.18+depth*0.01)type='ore';
      else if(roll<0.28)type='cave';
      row.push({type,mined:false});
    }
    grid.push(row);
  }
}

function init(){
  coins=0;stamina=100;depth=1;state='play';
  newGrid();
  updateUI();
}

function loadBest(){return +(localStorage.getItem('minerush_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('minerush_best',v);}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function cellAt(x,y){
  const col=Math.floor(x/CELL),row=Math.floor(y/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS)return null;
  return {row,col};
}

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const pos=cellAt(x,y);
  if(!pos)return;
  mine(pos.row,pos.col);
});

function mine(row,col){
  const cell=grid[row][col];
  if(cell.mined||state!=='play')return;
  cell.mined=true;
  if(cell.type==='ore'){
    coins+=10+depth*2;
    SFX.coin();
  }else if(cell.type==='cave'){
    stamina-=25;shakeT=10;
    SFX.hurt();
  }else{
    stamina-=4;
  }
  let allMined=true;
  for(const r of grid)for(const cl of r)if(!cl.mined)allMined=false;
  if(allMined){depth++;newGrid();}
  if(stamina<=0){
    stamina=0;state='over';
    SFX.lose();
    saveBest(coins);
  }
  updateUI();
}

function draw(){
  ctx.save();
  if(shakeT>0){
    ctx.translate(rand(-4,4),rand(-4,4));
    shakeT--;
  }
  ctx.fillStyle='#1a1108';ctx.fillRect(-8,-8,W+16,H+16);
  for(let r=0;r<ROWS;r++){
    for(let cl=0;cl<COLS;cl++){
      const cell=grid[r][cl];
      const x=cl*CELL,y=r*CELL;
      if(cell.mined){
        ctx.fillStyle='#0d0805';
        ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      }else{
        ctx.fillStyle=cell.type==='ore'?'#8d6e63':cell.type==='cave'?'#5d4037':'#4e342e';
        ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        if(cell.type==='ore'){
          ctx.fillStyle='#ffd54f';
          ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,10,0,Math.PI*2);ctx.fill();
        }else if(cell.type==='cave'){
          ctx.fillStyle='#ef5350';
          ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('⚠️',x+CELL/2,y+CELL/2);
        }
      }
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeRect(x,y,CELL,CELL);
    }
  }
  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('OUT OF STAMINA!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Coins: ${coins} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to restart',W/2,H/2+38);
  }

  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Coins: ${coins} | Stamina: ${Math.max(0,stamina)} | Depth: ${depth}`;
}

init();draw();
</script></body></html>
