<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Biathlon Race</title><meta name="description" content="Play Biathlon Race free online — Alternate Left/Right Arrow keys to ski cross-country, then aim with Arrow Keys and fire with Space at the shooting range. Missed targets cost penalty loops!"><link rel="canonical" href="https://games.multiportllc.com/games/biathlonrace"><meta property="og:title" content="Biathlon Race - Multiport Games"><meta property="og:description" content="Play Biathlon Race free online — Alternate Left/Right Arrow keys to ski cross-country, then aim with Arrow Keys and fire with Space at the shooting range. Missed targets cost penalty loops!"><meta property="og:url" content="https://games.multiportllc.com/games/biathlonrace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Biathlon Race","description":"Play Biathlon Race free online instantly. Alternate Left/Right Arrow keys to ski cross-country, then aim with Arrow Keys and fire with Space at the shooting range. Missed targets cost penalty loops! Beat two AI competitors to the finish. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/biathlonrace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d47a1,#e3f2fd);display:block;border-radius:8px;touch-action:none}
#score-display{color:#0d47a1;background:#e3f2fd;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Biathlon Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b> and <b>Right Arrow</b> (or tap left/right side) to ski. At each shooting stop, move your aim with <b>Arrow Keys</b> and press <b>Space</b> (or tap) to fire at the 5 targets — misses add a penalty loop. Beat the two rivals to the finish!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const LOOP_LEN=1200; // meters per ski loop
const NUM_LOOPS=2;
const PENALTY_LOOP=300;
let hiTime=parseFloat(localStorage.getItem('biathlonrace_hi')||'0')||null;
let wins=parseInt(localStorage.getItem('biathlonrace_wins')||'0',10);

let racers,lastKey,started,finished,raceTime,lastTime,camX,flashTimer,flashMsg;
let mode; // 'ski' or 'shoot'
let shoot; // {targets:[{x,hit}], aimX, shotsLeft}

function makeRacers(){
  return [
    {x:0,color:'#ffca28',isPlayer:true,hopPhase:0,loopsToGo:NUM_LOOPS,shotStopsLeft:NUM_LOOPS,finishTime:null,totalDist:0},
    {x:0,color:'#ef5350',isPlayer:false,aiRhythm:36+Math.random()*10,aiTimer:0,loopsToGo:NUM_LOOPS,shotStopsLeft:NUM_LOOPS,finishTime:null,totalDist:0,aiAcc:0.55+Math.random()*0.3},
    {x:0,color:'#66bb6a',isPlayer:false,aiRhythm:34+Math.random()*12,aiTimer:0,loopsToGo:NUM_LOOPS,shotStopsLeft:NUM_LOOPS,finishTime:null,totalDist:0,aiAcc:0.5+Math.random()*0.35},
  ];
}

function reset(){
  racers=makeRacers();
  lastKey=null;started=false;finished=false;raceTime=0;lastTime=null;camX=0;flashTimer=0;flashMsg='';
  mode='ski';
  shoot=null;
}
reset();

function startShooting(){
  mode='shoot';
  shoot={targets:[0,1,2,3,4].map(()=>({hit:false})),aimIdx:2,shotsLeft:5};
  flashMsg=I18N.t('bi_shoot_hint','Aim with Arrows, fire with Space/Tap!');
  flashTimer=90;
}

function endShooting(){
  const p=racers[0];
  const missed=shoot.targets.filter(t=>!t.hit).length;
  p.penaltyDist=(p.penaltyDist||0)+missed*PENALTY_LOOP;
  p.shotStopsLeft--;
  mode='ski';
  lastKey=null;
  if(missed>0){SFX.error();flashMsg=I18N.t('bi_missed','{n} missed! +{p}m penalty').replace('{n}',missed).replace('{p}',missed*PENALTY_LOOP);}
  else{SFX.success();flashMsg=I18N.t('bi_clean','Clean round!');}
  flashTimer=70;
}

function fire(){
  if(mode!=='shoot')return;
  const t=shoot.targets[shoot.aimIdx];
  if(shoot.shotsLeft<=0)return;
  shoot.shotsLeft--;
  if(!t.hit){
    // hit chance depends on aim precision — simple: always hit the aimed target
    t.hit=true;
    SFX.hit();
  }
  if(shoot.shotsLeft<=0){
    endShooting();
  }
}

function aim(dir){
  if(mode!=='shoot')return;
  shoot.aimIdx=Math.max(0,Math.min(4,shoot.aimIdx+dir));
  SFX.tick();
}

function ski(side){
  if(finished){reset();return;}
  if(mode!=='ski')return;
  if(!started){started=true;lastTime=null;}
  const p=racers[0];
  if(side===lastKey){
    SFX.error();
    return;
  }
  lastKey=side;
  p.x+=38+Math.random()*6;
  p.hopPhase=1;
  SFX.jump();
}

document.addEventListener('keydown',e=>{
  if(mode==='shoot'){
    if(e.code==='ArrowUp'){e.preventDefault();aim(-1);}
    else if(e.code==='ArrowDown'){e.preventDefault();aim(1);}
    else if(e.code==='Space'){e.preventDefault();fire();}
    return;
  }
  if(e.code==='ArrowLeft'){e.preventDefault();ski('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();ski('R');}
  else if(e.code==='Space'&&finished){e.preventDefault();reset();}
});
c.addEventListener('mousedown',e=>{
  if(finished){reset();return;}
  if(mode==='shoot'){fire();return;}
  const r=c.getBoundingClientRect();
  const x=e.clientX-r.left;
  ski(x<r.width/2?'L':'R');
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(finished){reset();return;}
  if(mode==='shoot'){fire();return;}
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-r.left;
  ski(x<r.width/2?'L':'R');
},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('bi_score_label','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',hiTime?hiTime.toFixed(1)+'s':'--');
}

function drawRacer(r,laneY,label){
  const sx=r.x-camX+80;
  if(sx<-40||sx>W+40)return;
  const bob=r.hopPhase>0?Math.sin(r.hopPhase*Math.PI)*10:0;
  ctx.fillStyle='#455a64';
  ctx.fillRect(sx-3,laneY-bob-6,6,26);
  ctx.fillStyle=r.color;
  ctx.beginPath();ctx.arc(sx,laneY-bob-16,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(label,sx,laneY-bob-32);
}

function drawShootingRange(){
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillRect(150,60,500,180);
  ctx.fillStyle='#0d47a1';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('bi_range_title','SHOOTING RANGE'),400,50);
  const spacing=90;
  const startX=400-2*spacing;
  for(let i=0;i<5;i++){
    const tx=startX+i*spacing;
    const ty=150;
    const hit=shoot.targets[i].hit;
    ctx.beginPath();ctx.arc(tx,ty,26,0,Math.PI*2);
    ctx.fillStyle=hit?'#9e9e9e':'#212121';ctx.fill();
    ctx.beginPath();ctx.arc(tx,ty,17,0,Math.PI*2);
    ctx.fillStyle=hit?'#bdbdbd':'#fff';ctx.fill();
    ctx.beginPath();ctx.arc(tx,ty,8,0,Math.PI*2);
    ctx.fillStyle=hit?'#e0e0e0':'#212121';ctx.fill();
    if(i===shoot.aimIdx){
      ctx.strokeStyle='#e53935';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(tx-40,ty);ctx.lineTo(tx+40,ty);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx,ty-40);ctx.lineTo(tx,ty+40);ctx.stroke();
    }
  }
  ctx.fillStyle='#0d47a1';ctx.font='bold 16px Arial';
  ctx.fillText(I18N.t('bi_shots_left','Shots left: {n}').replace('{n}',shoot.shotsLeft),400,260);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#90caf9');grad.addColorStop(1,'#e3f2fd');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#0d47a1';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bi_start_hint','Alternate L/R to start skiing!'),W/2,40);
    const lanes=[100,170,240];
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(0,80,W,180);
    racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('bi_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  if(finished){
    ctx.fillStyle='#0d47a1';ctx.font='bold 30px Arial';ctx.textAlign='center';
    const won=racers[0].finishTime!==null&&racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    ctx.fillText(won?I18N.t('bi_win','YOU WIN!'):I18N.t('bi_lose','YOU LOSE'),W/2,40);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,66);
    const lanes=[100,170,240];
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(0,80,W,180);
    racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('bi_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  raceTime+=dt/60;
  if(flashTimer>0)flashTimer-=dt;

  if(mode==='ski'){
    const lanes=[100,170,240];
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(0,80,W,180);
    for(let i=1;i<3;i++){
      ctx.strokeStyle='rgba(13,71,161,0.3)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
      ctx.beginPath();ctx.moveTo(0,80+i*60);ctx.lineTo(W,80+i*60);ctx.stroke();
    }
    ctx.setLineDash([]);

    // AI skiing + auto shooting at loop markers
    racers.forEach((r,i)=>{
      if(i===0)return;
      if(r.finishTime!==null)return;
      r.aiTimer+=dt;
      if(r.aiTimer>=r.aiRhythm){
        r.aiTimer=0;
        r.x+=36+Math.random()*8;
      }
      // AI shooting stop simulated instantly at loop boundaries
      const loopIdx=Math.floor(r.x/LOOP_LEN);
      if(loopIdx>(r.lastLoopIdx||0)&&r.shotStopsLeft>0){
        r.lastLoopIdx=loopIdx;
        r.shotStopsLeft--;
        let misses=0;
        for(let s=0;s<5;s++) if(Math.random()>r.aiAcc) misses++;
        r.penaltyDist=(r.penaltyDist||0)+misses*PENALTY_LOOP;
      }
    });

    racers.forEach(r=>{
      if(r.hopPhase>0){r.hopPhase-=0.06*dt;if(r.hopPhase<0)r.hopPhase=0;}
    });

    camX=Math.max(0,racers[0].x-200);

    // finish/shoot-stop check for player
    const p=racers[0];
    const loopIdx=Math.floor(p.x/LOOP_LEN);
    if(loopIdx>(p.lastLoopIdx||0)){
      p.lastLoopIdx=loopIdx;
      if(loopIdx<NUM_LOOPS){
        startShooting();
      }
    }

    // apply penalty as extra distance requirement
    racers.forEach(r=>{
      const required=NUM_LOOPS*LOOP_LEN+(r.penaltyDist||0);
      if(r.finishTime===null&&r.x>=required){
        r.finishTime=raceTime;
      }
    });

    const finishSx=(NUM_LOOPS*LOOP_LEN+(racers[0].penaltyDist||0))-camX+80;
    if(finishSx>-20&&finishSx<W+20){
      for(let i=0;i<180;i+=20){
        ctx.fillStyle=((i/20)%2===0)?'#222':'#fff';
        ctx.fillRect(finishSx,80+i,10,20);
      }
    }

    racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('bi_you_label','YOU'):'CPU'));

    if(flashTimer>0){
      ctx.fillStyle='rgba(200,0,0,0.7)';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText(flashMsg,W/2,110);
    }

    if(racers[0].finishTime!==null&&!finished){
      finished=true;
      const won=racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
      if(won){
        wins++;
        localStorage.setItem('biathlonrace_wins',wins);
        if(hiTime===null||raceTime<hiTime){hiTime=raceTime;localStorage.setItem('biathlonrace_hi',hiTime);}
        SFX.win();
      }else{SFX.lose();}
    } else if(!finished && racers.some((r,i)=>i>0&&r.finishTime!==null)){
      finished=true;
      SFX.lose();
    }
  } else {
    // shooting mode
    drawShootingRange();
    if(flashTimer>0){
      ctx.fillStyle='#0d47a1';ctx.font='bold 16px Arial';ctx.textAlign='center';
      ctx.fillText(flashMsg,W/2,285);
    }
  }

  ctx.fillStyle='#0d47a1';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('bi_time_label','Time: {t}s').replace('{t}',raceTime.toFixed(1)),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('bi_progress_label','Loop {l}/{n}').replace('{l}',Math.min(NUM_LOOPS,Math.floor(racers[0].x/LOOP_LEN)+1)).replace('{n}',NUM_LOOPS),W-10,20);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
