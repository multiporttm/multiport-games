<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#stage{display:block;margin:0 auto}
#score-display{color:#ffd54f;font-size:1.15rem;font-weight:700;text-align:center;padding:10px}
#lives-display{color:#ff6b6b;font-size:1rem;font-weight:700;text-align:center;padding:0 10px 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Plate Spinning</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap a <b>wobbling plate</b> to re-spin it before it falls. More sticks join the act over time — keep them all spinning! <b>3 lives</b> per act.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
let score=0,hi=parseInt(localStorage.getItem('platespinning_hi')||'0'),lives=3,gameOver=false,started=false,t=0,lastTime=null;
let plates=[],addTimer=0,nextAddAt=9,elapsed=0;

const SLOTS=[
  {x:100,groundY:400,h:190},{x:250,groundY:400,h:230},{x:400,groundY:400,h:170},
  {x:550,groundY:400,h:230},{x:700,groundY:400,h:190},
  {x:175,groundY:400,h:270},{x:325,groundY:400,h:250},{x:475,groundY:400,h:270},{x:625,groundY:400,h:250}
];

function reset(){
  score=0;lives=3;gameOver=false;started=false;t=0;addTimer=0;nextAddAt=9;elapsed=0;lastTime=null;
  plates=[];
  addPlate();addPlate();
}

function addPlate(){
  if(plates.length>=SLOTS.length)return;
  const used=plates.map(p=>p.slot);
  let idx=0;
  for(let i=0;i<SLOTS.length;i++){if(!used.includes(i)){idx=i;break;}}
  const s=SLOTS[idx];
  plates.push({
    slot:idx,x:s.x,stickTop:s.groundY-s.h,groundY:s.groundY,
    spin:1,wobble:0,fallen:false,hue:Math.floor(Math.random()*360)
  });
}

function decayRate(){return 0.05+Math.min(0.16,score*0.004);}

function respin(p){
  p.spin=1;p.wobble=0;
  SFX.click();
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const sx=c.width/r.width, sy=c.height/r.height;
  let cx,cy;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}

function handleClick(mx,my){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  for(const p of plates){
    if(p.fallen)continue;
    const py=p.stickTop-20;
    const dx=mx-p.x,dy=my-py;
    if(dx*dx+dy*dy<48*48){
      respin(p);
      score++;
      if(score>hi){hi=score;localStorage.setItem('platespinning_hi',hi);}
      return;
    }
  }
}
c.addEventListener('click',e=>{const p=getPos(e);handleClick(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);handleClick(p.x,p.y);},{passive:false});

function drawStick(p){
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(p.x,p.groundY);ctx.lineTo(p.x,p.stickTop);ctx.stroke();
}

function drawPlate(p){
  if(p.fallen)return;
  const py=p.stickTop-20;
  const tiltMax=0.9;
  const tilt=p.wobble*tiltMax;
  ctx.save();
  ctx.translate(p.x,py);
  ctx.rotate(Math.sin(t*3+p.hue)*tilt*0.3);
  const ry=18-p.wobble*10;
  ctx.fillStyle=`hsl(${p.hue},70%,${75-p.wobble*20}%)`;
  ctx.beginPath();ctx.ellipse(0,0,42,Math.max(4,ry),0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,42,Math.max(4,ry),0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,28,Math.max(3,ry*0.65),0,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  // spin/wobble meter
  const bw=64,bh=7;
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.fillRect(p.x-bw/2,py-46,bw,bh);
  const pct=1-p.wobble;
  ctx.fillStyle=p.wobble>0.65?'#ff3b3b':(p.wobble>0.35?'#ffd54f':'#4caf50');
  ctx.fillRect(p.x-bw/2,py-46,bw*pct,bh);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.strokeRect(p.x-bw/2,py-46,bw,bh);
}

function livesStr(){
  let s='';
  for(let i=0;i<3;i++)s+= i<lives?'♥':'♡';
  return s;
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.1);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#2b1055');bg.addColorStop(1,'#7597de');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4a2a12';ctx.fillRect(0,H-40,W,40);

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',livesStr());

  if(!started){
    plates.forEach(p=>{drawStick(p);drawPlate(p);});
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_plate','Tap to start the act'),W/2,60);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    plates.forEach(p=>{drawStick(p);drawPlate(p);});
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('act_over_title','ACT OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('plates_final_label','Plates kept spinning: {s}').replace('{s}',score),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    requestAnimationFrame(loop);return;
  }

  t+=dt;
  elapsed+=dt;
  addTimer+=dt;
  if(addTimer>=nextAddAt&&plates.length<SLOTS.length){
    addTimer=0;nextAddAt=Math.max(6,11-elapsed*0.1);
    addPlate();
    SFX.point();
  }

  plates.forEach(p=>{
    if(p.fallen)return;
    p.wobble+=decayRate()*dt;
    if(p.wobble>=1){
      p.wobble=1;p.fallen=true;
      lives--;
      SFX.hit();
      setTimeout(()=>{ // respawn a fresh plate on the same stick after a short beat
        if(!gameOver){p.fallen=false;p.wobble=0;p.spin=1;}
      },900);
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });

  plates.forEach(p=>{drawStick(p);});
  plates.forEach(p=>{
    if(p.fallen){
      // draw a shattered plate on the ground
      ctx.save();
      ctx.translate(p.x,p.groundY-6);
      ctx.fillStyle=`hsl(${p.hue},60%,60%)`;
      for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo(Math.cos(i*1.3)*20,Math.sin(i*1.3)*6);
        ctx.lineTo(Math.cos(i*1.3+0.5)*30,Math.sin(i*1.3+0.5)*8);
        ctx.lineTo(Math.cos(i*1.3+0.2)*10,Math.sin(i*1.3+0.2)*3);
        ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }else{
      drawPlate(p);
    }
  });

  requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started)started=true;
    else if(gameOver)reset();
  }
});

reset();
requestAnimationFrame(loop);
</script></body></html>
