<style>
body{background:#0c0806}
#c{background:#1a0f08;display:block;border-radius:8px;cursor:none;touch-action:none}
#score-display{color:#ff9d42;font-size:1.2rem;font-weight:700;text-align:center;padding:8px;text-shadow:0 0 8px rgba(255,120,30,.5)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lost-Wax Casting Surface Finishing</div>
  <div class="game-frame">
    <div id="score-display">Round 1 | Time: 60 | Hi: 0</div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move the grinder (mouse, touch, or <b>Arrow keys</b>) over every rough grey patch to smooth it before time runs out. Don't hold it on one spot too long once smoothed — you'll gouge the detail. Larger, busier pieces appear each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=460;
const HI_KEY='lostwaxcastingsurfacefinishing_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,timeLeft=60,gameOver=false,started=false,score=0;
let tool={x:W/2,y:H/2};
let patches=[]; // {x,y,r,smooth:0..1,gouged}
let keys={};
let lastTime=null;
let curFig;

function figureSilhouette(r){
  return {cx:W/2,cy:H/2+10,rx:110+r*6,ry:160+r*4};
}

function buildRound(){
  curFig=figureSilhouette(round);
  const n=5+round*2;
  patches=[];
  let tries=0;
  while(patches.length<n && tries<500){
    tries++;
    const a=Math.random()*Math.PI*2;
    const rr=Math.random();
    const px=curFig.cx+Math.cos(a)*curFig.rx*rr*0.85;
    const py=curFig.cy+Math.sin(a)*curFig.ry*rr*0.85;
    const rad=14+Math.random()*10;
    // avoid overlap
    if(patches.some(p=>Math.hypot(p.x-px,p.y-py)<rad+p.r+6))continue;
    patches.push({x:px,y:py,r:rad,smooth:0,gouged:false,overheat:0});
  }
  timeLeft=Math.max(30,60-round*2);
}

function reset(){
  score=0;round=1;gameOver=false;started=false;
  buildRound();
}

function startGame(){
  if(gameOver){reset();started=true;lastTime=null;return;}
  started=true;
}

function allDone(){return patches.every(p=>p.smooth>=1&&!p.gouged);}
function anyGouged(){return patches.some(p=>p.gouged);}

function moveTool(nx,ny){
  tool.x=Math.max(10,Math.min(W-10,nx));
  tool.y=Math.max(10,Math.min(H-10,ny));
}

const rectOf=()=>c.getBoundingClientRect();
function toCanvas(clientX,clientY){
  const r=rectOf();
  return {x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}
c.addEventListener('mousedown',e=>{startGame();const p=toCanvas(e.clientX,e.clientY);moveTool(p.x,p.y);});
c.addEventListener('mousemove',e=>{const p=toCanvas(e.clientX,e.clientY);moveTool(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();startGame();const t=e.touches[0];const p=toCanvas(t.clientX,t.clientY);moveTool(p.x,p.y);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const p=toCanvas(t.clientX,t.clientY);moveTool(p.x,p.y);},{passive:false});
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key===' '){startGame();return;}
  keys[e.key]=true;
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function drawFigure(){
  const g=ctx.createRadialGradient(curFig.cx-20,curFig.cy-40,10,curFig.cx,curFig.cy,curFig.ry+40);
  g.addColorStop(0,'#caa06a');
  g.addColorStop(0.5,'#8a5a2e');
  g.addColorStop(1,'#4a2f17');
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(curFig.cx,curFig.cy,curFig.rx,curFig.ry,0,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#2b1a0a';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.ellipse(curFig.cx,curFig.cy-curFig.ry*0.82,curFig.rx*0.32,curFig.ry*0.2,0,0,Math.PI*2);
  ctx.fillStyle='#9c6a38';ctx.fill();ctx.stroke();
}

function drawPatches(){
  patches.forEach(p=>{
    ctx.save();
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    if(p.gouged){
      ctx.fillStyle='#2b1a0a';
      ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
    } else {
      const shade=120-Math.floor(60*p.smooth);
      ctx.fillStyle=`rgb(${shade+60},${shade+40},${shade+20})`;
      ctx.fill();
      if(p.smooth<1){
        ctx.strokeStyle='rgba(180,180,180,0.6)';
        ctx.lineWidth=1.5;
        for(let i=0;i<4;i++){
          ctx.beginPath();
          const ang=i*1.6+p.x*0.01;
          ctx.moveTo(p.x+Math.cos(ang)*p.r*0.3,p.y+Math.sin(ang)*p.r*0.3);
          ctx.lineTo(p.x+Math.cos(ang)*p.r*0.9,p.y+Math.sin(ang)*p.r*0.9);
          ctx.stroke();
        }
      } else {
        ctx.strokeStyle='rgba(255,210,150,0.8)';
        ctx.lineWidth=1;
        ctx.stroke();
      }
    }
    ctx.restore();
  });
}

function drawTool(){
  ctx.save();
  ctx.translate(tool.x,tool.y);
  const spin=performance.now()/30;
  ctx.rotate(spin);
  ctx.fillStyle='#d9d9d9';
  ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.stroke();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);
    ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();
  // sparks when grinding
}

function updateHUD(){
  document.getElementById('score-display').textContent=
    I18N.t('round_time_hi_label','Round {r} | Time: {t} | Hi: {h}')
      .replace('{r}',round).replace('{t}',Math.ceil(timeLeft)).replace('{h}',Math.floor(hi));
}

function update(dt){
  if(!started||gameOver)return;
  const spd=5*dt;
  let nx=tool.x,ny=tool.y;
  if(keys['ArrowUp'])ny-=spd;
  if(keys['ArrowDown'])ny+=spd;
  if(keys['ArrowLeft'])nx-=spd;
  if(keys['ArrowRight'])nx+=spd;
  if(nx!==tool.x||ny!==tool.y)moveTool(nx,ny);

  timeLeft-=dt/60;
  if(timeLeft<=0){
    timeLeft=0;gameOver=true;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    return;
  }

  patches.forEach(p=>{
    if(p.gouged)return;
    const d=Math.hypot(tool.x-p.x,tool.y-p.y);
    if(d<p.r+8){
      if(p.smooth<1){
        p.smooth=Math.min(1,p.smooth+0.018*dt);
        p.overheat=0;
        if(p.smooth>=1){score+=20;SFX.point();}
      } else {
        p.overheat+=0.02*dt;
        if(p.overheat>=1){
          p.gouged=true;SFX.hit();
        }
      }
    } else {
      p.overheat=Math.max(0,p.overheat-0.02*dt);
    }
  });

  if(anyGouged()){
    gameOver=true;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    return;
  }
  if(allDone()){
    score+=50*round;
    SFX.win();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    round++;
    buildRound();
    started=false;
  }
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0f08');bg.addColorStop(1,'#2a1a0c');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.globalAlpha=0.15+0.05*Math.sin(ts/600);
  ctx.fillStyle='#ff6a1a';
  ctx.beginPath();ctx.ellipse(W*0.12,H*0.88,120,60,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(W*0.9,H*0.08,100,50,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  drawFigure();
  drawPatches();

  update(dt);

  if(!started && !gameOver){
    ctx.fillStyle='#ffcf9a';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_grind','Move/Click/Tap/Space to start grinding'),W/2,60);
  } else if(!gameOver){
    drawTool();
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    const reason=anyGouged()?I18N.t('gouged_msg','Gouged the detail!'):I18N.t('time_up_msg','Time ran out!');
    ctx.fillText(reason,W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint_grind','Click/Tap/Space to try again'),W/2,H/2+20);
  }

  updateHUD();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script></body></html>
