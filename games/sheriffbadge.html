<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#2b1d10;border-radius:14px;padding:18px;max-width:760px;margin:0 auto}
#poster{background:#f3e2b3;color:#2b1d10;border:4px double #6b4a26;border-radius:8px;padding:14px 18px;margin:0 auto 16px;max-width:520px;font-family:Georgia,serif;text-align:center}
#poster h2{letter-spacing:4px;margin:0 0 6px;color:#7a1f1f}
#clues{list-style:none;text-align:left;margin:10px auto 0;max-width:420px;font-size:.95rem;line-height:1.5}
#clues li{margin:2px 0}
#statusRow{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;margin-bottom:10px;flex-wrap:wrap;gap:6px}
#lives{color:#ffd54f}
#lineup{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin-top:6px}
.suspect{background:#3a2a18;border:2px solid #6b4a26;border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s}
.suspect:hover{transform:translateY(-3px);border-color:#ffd54f}
.suspect.wrong{border-color:#e94560;animation:shake .3s}
.suspect.correct{border-color:#4caf50}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.face{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.hat{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:60px;height:20px;border-radius:8px 8px 0 0}
.hat.none{display:none}
.facialhair{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:34px;height:8px;border-radius:4px;background:#3a2a18}
.facialhair.clean{display:none}
.facialhair.beard{width:44px;height:22px;bottom:0;border-radius:0 0 20px 20px}
.suspect .name{font-size:.72rem;color:#e0c9a0}
.suspect .attrs{font-size:.62rem;color:#b89a6e;margin-top:4px;line-height:1.3}
#msg{min-height:1.4em;color:#ffd54f;font-weight:700;text-align:center;margin-top:12px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sheriff Badge</div>
  <div class="game-frame">
    <div id="table">
      <div id="statusRow">
        <span id="scoreLine">Score: 0 | Hi: 0</span>
        <span id="lives">❤❤❤</span>
      </div>
      <div id="poster">
        <h2 data-i18n="wanted_title">WANTED</h2>
        <ul id="clues"></ul>
      </div>
      <div id="lineup"></div>
      <div id="msg"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the <b>wanted poster's</b> clues, then <b>click</b> the outlaw in the lineup below whose hat, hair, facial hair, height and shirt match <b>every</b> clue. Wrong guesses cost a life — get it right to move to a tougher lineup!</div>
</div>
<script>
const HAIR=['Black','Brown','Blonde','Gray','Red'];
const HAIRCOL={Black:'#2b2b2b',Brown:'#6b4423',Blonde:'#d9b45a',Gray:'#b7b7b7',Red:'#a83c2e'};
const HATS=['None','Black Hat','Brown Hat','Bandana'];
const HATCOL={'None':null,'Black Hat':'#1c1c1c','Brown Hat':'#6b4423','Bandana':'#8a1f2d'};
const FACIAL=['Clean-shaven','Mustache','Beard','Stubble'];
const HEIGHT=['Short','Average','Tall'];
const SHIRT=['Red','Blue','Green','Yellow','Purple'];
const SHIRTCOL={Red:'#c0392b',Blue:'#2e6da4',Green:'#3d8b40',Yellow:'#d4ac0d',Purple:'#7d3c98'};
const NAMES=['Cole','Wyatt','Jesse','Butch','Doc','Reed','Frank','Zeke','Roy','Slim','Duke','Cody','Hank','Rusty','Clay'];

let score=0,hi=parseInt(localStorage.getItem('sheriffbadge_hi')||'0',10),lives=3,level=1,outlaw=null,suspects=[],locked=false;

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

function genSuspect(id){
  return {id,name:rand(NAMES)+' #'+id,hair:rand(HAIR),hat:rand(HATS),facial:rand(FACIAL),height:rand(HEIGHT),shirt:rand(SHIRT)};
}

function suspectsEqual(a,b){
  return a.hair===b.hair&&a.hat===b.hat&&a.facial===b.facial&&a.height===b.height&&a.shirt===b.shirt;
}

function newRound(){
  locked=false;
  const count=Math.min(4+level,10);
  const clueCount=Math.min(2+Math.floor(level/2),5);
  suspects=[];
  let tries=0;
  while(suspects.length<count&&tries<400){
    tries++;
    const s=genSuspect(suspects.length+1);
    if(!suspects.some(x=>suspectsEqual(x,s)))suspects.push(s);
  }
  outlaw=rand(suspects);
  const attrKeys=['hair','hat','facial','height','shirt'];
  // shuffle attrKeys, take clueCount, but ensure uniqueness of outlaw among suspects using chosen clues
  let chosen;
  for(let attempt=0;attempt<30;attempt++){
    const shuffled=[...attrKeys].sort(()=>Math.random()-0.5);
    chosen=shuffled.slice(0,clueCount);
    const others=suspects.filter(s=>s!==outlaw);
    const unique=others.every(o=>chosen.some(k=>o[k]!==outlaw[k]));
    if(unique)break;
  }
  const labels={hair:'Hair',hat:'Headwear',facial:'Facial hair',height:'Height',shirt:'Shirt color'};
  const clues=chosen.map(k=>I18N.t('clue_'+k,labels[k]+': {v}').replace('{v}',outlaw[k]));
  const clueList=document.getElementById('clues');
  clueList.innerHTML='';
  clues.forEach(c=>{const li=document.createElement('li');li.textContent='• '+c;clueList.appendChild(li);});
  renderLineup();
  document.getElementById('msg').textContent='';
  updateStatus();
}

function renderLineup(){
  const wrap=document.getElementById('lineup');
  wrap.innerHTML='';
  suspects.forEach(s=>{
    const card=document.createElement('div');
    card.className='suspect';
    card.dataset.id=s.id;
    const face=document.createElement('div');
    face.className='face';
    face.style.background='#e8c39e';
    const hat=document.createElement('div');
    hat.className='hat'+(s.hat==='None'?' none':'');
    if(HATCOL[s.hat])hat.style.background=HATCOL[s.hat];
    face.appendChild(hat);
    const hairDiv=document.createElement('div');
    hairDiv.style.cssText='position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:52px;height:14px;border-radius:26px 26px 0 0;background:'+HAIRCOL[s.hair];
    face.appendChild(hairDiv);
    const fh=document.createElement('div');
    fh.className='facialhair'+(s.facial==='Clean-shaven'?' clean':'')+(s.facial==='Beard'?' beard':'');
    face.appendChild(fh);
    card.appendChild(face);
    const name=document.createElement('div');
    name.className='name';
    name.textContent=s.name+(s.height==='Tall'?' ▲':s.height==='Short'?' ▼':'');
    card.appendChild(name);
    const attrs=document.createElement('div');
    attrs.className='attrs';
    attrs.textContent=s.shirt+' shirt';
    card.appendChild(attrs);
    card.addEventListener('click',()=>guess(s,card));
    wrap.appendChild(card);
  });
}

function updateStatus(){
  document.getElementById('scoreLine').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives').textContent='❤'.repeat(Math.max(lives,0))+'♡'.repeat(3-Math.max(lives,0));
}

function guess(s,card){
  if(locked)return;
  if(s.id===outlaw.id){
    locked=true;
    card.classList.add('correct');
    score+=10*level;
    if(score>hi){hi=score;localStorage.setItem('sheriffbadge_hi',hi);}
    SFX.success();
    document.getElementById('msg').textContent=I18N.t('caught_msg','Outlaw caught! Nice work, Sheriff.');
    level++;
    updateStatus();
    setTimeout(newRound,1100);
  }else{
    card.classList.add('wrong');
    SFX.error();
    lives--;
    updateStatus();
    if(lives<=0){
      SFX.lose();
      document.getElementById('msg').textContent=I18N.t('game_over_msg','Game over — the outlaw got away! Click any suspect to restart.');
      locked=true;
      score=0;lives=3;level=1;
      document.querySelectorAll('.suspect').forEach(el=>{
        el.addEventListener('click',restartOnce,{once:true});
      });
    }else{
      document.getElementById('msg').textContent=I18N.t('wrong_msg','Not a match — check the clues again.');
      setTimeout(()=>card.classList.remove('wrong'),300);
    }
  }
}

function restartOnce(){
  updateStatus();
  newRound();
}

document.addEventListener('keydown',e=>{
  if(locked)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=suspects.length){
    const card=document.querySelector('.suspect[data-id="'+n+'"]');
    if(card)guess(suspects.find(s=>s.id===n),card);
  }
});

updateStatus();
newRound();
</script></body></html>
