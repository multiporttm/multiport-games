<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2e7d32;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffe082;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rugby Tackle</div>
  <div class="game-frame">
    <div id="score-display">Tries: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Up/Down Arrows</b> or <b>touch-drag</b> to juke sideways and dodge defenders as you sprint toward the try line. Getting tackled costs a life — 0 lives ends the game. Each new run starts a bit tougher!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const LANES=[60,100,140,180,220,260]; // y positions (6 lanes)
const PLAYER_X=120;

let tries=0,lives=3,best=0,gameOver=false,started=false;
try{best=parseInt(localStorage.getItem('rugbytackle_best')||'0');}catch(e){}

let runner={lane:2.5,y:0,vy:0};
let defenders=[];
let distance=0,tryDistance=2600,spd=4;
let frame=0;
let flashTimer=0;

function laneY(l){ return LANES[0]+(LANES[LANES.length-1]-LANES[0])*(l/(LANES.length-1)); }

function reset(){
  tries=0;lives=3;gameOver=false;started=false;
  startRun();
}
function startRun(){
  runner.lane=2.5;
  defenders=[];
  distance=0;
  tryDistance=Math.max(1400,2600-tries*120);
  spd=4+tries*0.35;
  spawnTimer=0;
}
let spawnTimer=0;

function spawnDefender(){
  const lane=Math.random()*(LANES.length-1);
  defenders.push({x:W+40,lane,speed:spd*0.9+Math.random()*1.5});
}

function juke(dir){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  runner.lane=Math.max(0,Math.min(LANES.length-1,runner.lane+dir));
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowUp'){e.preventDefault();juke(-1);}
  if(e.code==='ArrowDown'){e.preventDefault();juke(1);}
  if(e.code==='Space'&&(gameOver||!started)){e.preventDefault();if(!started)started=true;else if(gameOver)reset();}
});

let touchY=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  touchY=e.touches[0].clientY;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(touchY===null)return;
  const y=e.touches[0].clientY;
  const dy=y-touchY;
  if(Math.abs(dy)>28){
    juke(dy>0?1:-1);
    touchY=y;
  }
},{passive:false});
c.addEventListener('touchend',()=>{touchY=null;});
c.addEventListener('click',()=>{ if(!started)started=true; else if(gameOver)reset(); });

function drawField(){
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,W,H);
  // yard lines scroll
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=2;
  const lineSpacing=80;
  const offset=(distance*2)%lineSpacing;
  for(let x=-offset;x<W;x+=lineSpacing){
    ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,H-20);ctx.stroke();
  }
  // try line indicator (approaches as distance nears tryDistance)
  const remaining=tryDistance-distance;
  if(remaining<W){
    const lineX=W-remaining+PLAYER_X;
    ctx.strokeStyle='#ffeb3b';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(lineX,15);ctx.lineTo(lineX,H-15);ctx.stroke();
  }
}

function drawRunner(){
  const y=laneY(runner.lane);
  ctx.fillStyle='#1565c0';
  ctx.fillRect(PLAYER_X-12,y-18,24,32);
  ctx.fillStyle='#ffd699';
  ctx.beginPath();ctx.arc(PLAYER_X,y-26,10,0,7);ctx.fill();
  // ball
  ctx.fillStyle='#6d4c1e';
  ctx.beginPath();ctx.ellipse(PLAYER_X+14,y-4,7,4,0,0,7);ctx.fill();
}

function drawDefender(d){
  const y=laneY(d.lane);
  ctx.fillStyle='#c62828';
  ctx.fillRect(d.x-12,y-18,24,32);
  ctx.fillStyle='#ffd699';
  ctx.beginPath();ctx.arc(d.x,y-26,10,0,7);ctx.fill();
}

function scoreTry(){
  tries++;
  if(tries>best){best=tries;try{localStorage.setItem('rugbytackle_best',best);}catch(e){}}
  SFX.success();
  flashTimer=40;
  startRun();
}

function tackled(){
  lives--;
  SFX.hit();
  if(lives<=0){
    gameOver=true;
    if(tries>best){best=tries;try{localStorage.setItem('rugbytackle_best',best);}catch(e){}}
    SFX.lose();
  }else{
    startRun();
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawField();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('rugby_start_hint','Space / Tap to start your run'),W/2,H/2);
    drawRunner();
  }else if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('tries_scored_label','Tries scored: {t}').replace('{t}',tries),W/2,H/2+14);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+46);
  }else{
    frame+=dt;
    distance+=spd*dt;

    spawnTimer+=dt;
    const interval=Math.max(28,55-tries*2);
    if(spawnTimer>=interval){spawnTimer-=interval;spawnDefender();}

    const runnerY=laneY(runner.lane);
    defenders=defenders.filter(d=>d.x>-40);
    let tackledNow=false;
    defenders.forEach(d=>{
      d.x-=d.speed*dt;
      drawDefender(d);
      const dy=laneY(d.lane)-runnerY;
      if(Math.abs(d.x-PLAYER_X)<24 && Math.abs(dy)<26){
        tackledNow=true;
      }
    });

    drawRunner();

    if(flashTimer>0){
      flashTimer-=dt;
      ctx.fillStyle='rgba(255,235,59,0.25)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('try_scored_msg','TRY!'),W/2,80);
    }

    if(tackledNow){
      tackled();
    }else if(distance>=tryDistance){
      scoreTry();
    }
  }

  document.getElementById('score-display').textContent=I18N.t('rugby_score_label','Tries: {t} | Lives: {l} | Best: {b}').replace('{t}',tries).replace('{l}',lives).replace('{b}',best);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
