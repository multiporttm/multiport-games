<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#0d3b5c,#4fb8e8);display:block;border-radius:8px;touch-action:none}
#score-display{color:#bfe9ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Hockey Shootout</div>
  <div class="game-frame">
    <div id="score-display">Shot 1/10 | Goals: 0 | Best: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and drag back from the puck to aim, then release to shoot. The farther you drag, the harder the shot. Beat the goalie for <b>10 shots</b> and score as many goals as you can!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const puckStart={x:400,y:380};
const goal={x:300,y:60,w:200,h:16};
let hi=parseInt(localStorage.getItem('icehockeyshootout_hi')||'0',10);
let shotsTaken=0,goals=0,totalShots=10;
let state='aim'; // aim, flying, result
let puck={x:puckStart.x,y:puckStart.y,vx:0,vy:0,r:10};
let goalie={x:400,y:110,w:70,h:60,vx:0,diveDir:0,diving:false,diveTimer:0};
let dragging=false,dragStart=null,dragCur=null;
let resultTimer=0,resultMsg='';
let particles=[];

function resetPuck(){
  puck.x=puckStart.x;puck.y=puckStart.y;puck.vx=0;puck.vy=0;
  goalie.x=400+((Math.random()*2-1)*40);
  goalie.diving=false;goalie.diveTimer=0;goalie.vx=(Math.random()<0.5?-1:1)*(1+Math.random());
  state='aim';
}

function endGame(){
  if(goals>hi){hi=goals;localStorage.setItem('icehockeyshootout_hi',hi);}
  state='over';
}

function shoot(dx,dy){
  // dx,dy is drag vector from puck to release point; shoot opposite direction
  const power=Math.min(Math.hypot(dx,dy)/4,22);
  if(power<3)return;
  const ang=Math.atan2(-dy,-dx);
  puck.vx=Math.cos(ang)*power;
  puck.vy=Math.sin(ang)*power;
  state='flying';
  SFX.swoosh();
  // decide goalie dive: somewhat unpredictable but with a slight bias toward puck direction
  const decideAt=250+Math.random()*150; // ms
  setTimeout(()=>{
    if(state!=='flying')return;
    goalie.diving=true;
    let dir;
    if(Math.random()<0.55){
      dir = puck.vx<0?-1: (puck.vx>0?1:(Math.random()<0.5?-1:1));
    } else {
      dir = Math.random()<0.5?-1:1;
    }
    goalie.diveDir=dir;
    goalie.diveTimer=0;
  },decideAt);
}

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
}

function onDown(e){
  e.preventDefault();
  if(state==='over'){resetGame();return;}
  if(state!=='aim')return;
  const p=pointerPos(e);
  if(Math.hypot(p.x-puck.x,p.y-puck.y)<60){
    dragging=true;dragStart={x:puck.x,y:puck.y};dragCur=p;
  }
}
function onMove(e){
  if(!dragging)return;
  e.preventDefault();
  dragCur=pointerPos(e);
}
function onUp(e){
  if(!dragging)return;
  e.preventDefault();
  dragging=false;
  const dx=dragCur.x-puck.x,dy=dragCur.y-puck.y;
  shoot(dx,dy);
  dragCur=null;
}

c.addEventListener('mousedown',onDown);
c.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
c.addEventListener('touchstart',onDown,{passive:false});
c.addEventListener('touchmove',onMove,{passive:false});
c.addEventListener('touchend',onUp,{passive:false});

function resetGame(){
  shotsTaken=0;goals=0;particles=[];
  resetPuck();
}

function drawRink(){
  ctx.fillStyle='#e8f6ff';
  ctx.fillRect(20,20,W-40,H-40);
  ctx.strokeStyle='#c33';ctx.lineWidth=3;
  ctx.strokeRect(20,20,W-40,H-40);
  // center line
  ctx.beginPath();ctx.moveTo(20,300);ctx.lineTo(W-20,300);ctx.strokeStyle='#c33';ctx.stroke();
  // goal crease
  ctx.fillStyle='#bcdfff';
  ctx.beginPath();ctx.arc(400,76,90,0,Math.PI,false);ctx.fill();
  // goal
  ctx.fillStyle='#222';
  ctx.fillRect(goal.x,goal.y-10,goal.w,10);
  ctx.strokeStyle='#c33';ctx.lineWidth=6;
  ctx.strokeRect(goal.x,goal.y-10,goal.w,goal.h+10);
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<8;i++){
    ctx.fillRect(goal.x+i*(goal.w/8)+2,goal.y-8,2,goal.h+6);
  }
}

function drawGoalie(){
  ctx.save();
  ctx.fillStyle='#1e3a8a';
  ctx.fillRect(goalie.x-goalie.w/2,goalie.y-goalie.h/2,goalie.w,goalie.h);
  ctx.fillStyle='#facc15';
  ctx.fillRect(goalie.x-14,goalie.y-goalie.h/2-16,28,20);
  ctx.restore();
}

function drawPuck(){
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2);ctx.fill();
}

function drawAimLine(){
  if(!dragging||!dragCur)return;
  const dx=dragCur.x-puck.x,dy=dragCur.y-puck.y;
  const power=Math.min(Math.hypot(dx,dy)/4,22);
  ctx.save();
  ctx.strokeStyle='#ffd54f';
  ctx.lineWidth=3;
  ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(puck.x,puck.y);
  ctx.lineTo(puck.x-dx,puck.y-dy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ffd54f';
  ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText('Power: '+Math.round(power/22*100)+'%',puck.x,puck.y+40);
  ctx.restore();
}

function updateGoalie(dt){
  if(goalie.diving){
    goalie.diveTimer+=dt;
    goalie.x+=goalie.diveDir*6*dt;
    goalie.x=Math.max(310,Math.min(490,goalie.x));
  } else {
    goalie.x+=goalie.vx*dt;
    if(goalie.x<330||goalie.x>470)goalie.vx*=-1;
  }
}

function checkGoalieCollision(){
  const gx1=goalie.x-goalie.w/2,gx2=goalie.x+goalie.w/2;
  const gy1=goalie.y-goalie.h/2,gy2=goalie.y+goalie.h/2;
  if(puck.x+puck.r>gx1&&puck.x-puck.r<gx2&&puck.y+puck.r>gy1&&puck.y-puck.r<gy2){
    return true;
  }
  return false;
}

function shotResult(msg,isGoal){
  resultMsg=msg;
  resultTimer=1400;
  shotsTaken++;
  if(isGoal){goals++;SFX.success();}
  else SFX.fail();
  state='result';
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?1:Math.min((t-lastTime)/16.6667,3);
  lastTime=t;
  ctx.clearRect(0,0,W,H);
  drawRink();

  if(state==='aim'){
    updateGoalie(dt*0.6);
    drawGoalie();
    drawPuck();
    drawAimLine();
  } else if(state==='flying'){
    updateGoalie(dt);
    puck.x+=puck.vx*dt;
    puck.y+=puck.vy*dt;
    drawGoalie();
    drawPuck();
    // wall bounce
    if(puck.x-puck.r<22||puck.x+puck.r>W-22)puck.vx*=-0.6;
    puck.x=Math.max(22+puck.r,Math.min(W-22-puck.r,puck.x));

    if(checkGoalieCollision()){
      shotResult(I18N.t('shot_saved','SAVED!'),false);
    } else if(puck.y<=goal.y+goal.h&&puck.x>goal.x&&puck.x<goal.x+goal.w&&puck.y>goal.y-10){
      shotResult(I18N.t('shot_goal','GOAL!'),true);
    } else if(puck.y< -20 || puck.y>H+20){
      shotResult(I18N.t('shot_miss','MISSED!'),false);
    } else if(Math.abs(puck.vx)<0.15&&Math.abs(puck.vy)<0.15){
      shotResult(I18N.t('shot_miss','MISSED!'),false);
    }
  } else if(state==='result'){
    drawGoalie();
    drawPuck();
    ctx.fillStyle=resultMsg===I18N.t('shot_goal','GOAL!')?'#4caf50':'#ff5252';
    ctx.font='bold 48px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,H/2);
    resultTimer-=16.6667*dt;
    if(resultTimer<=0){
      if(shotsTaken>=totalShots){endGame();}
      else{resetPuck();}
    }
  } else if(state==='over'){
    drawGoalie();
    drawPuck();
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('final_goals','Goals: {g} / {n}').replace('{g}',goals).replace('{n}',totalShots),W/2,H/2+10);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap or click to play again'),W/2,H/2+50);
  }

  const label = state==='over'
    ? I18N.t('score_final_label','Goals: {g}/{n} | Best: {h}').replace('{g}',goals).replace('{n}',totalShots).replace('{h}',hi)
    : I18N.t('shot_progress_label','Shot {s}/{n} | Goals: {g} | Best: {h}').replace('{s}',Math.min(shotsTaken+1,totalShots)).replace('{n}',totalShots).replace('{g}',goals).replace('{h}',hi);
  document.getElementById('score-display').textContent=label;

  requestAnimationFrame(loop);
}
resetPuck();
requestAnimationFrame(loop);
</script></body></html>
