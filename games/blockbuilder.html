<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#ui{color:#ffb300;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#boards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:10px}
.board-label{text-align:center;color:rgba(255,255,255,.5);font-size:.78rem;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;gap:3px}
.gcell{width:32px;height:32px;border-radius:5px}
.blueprint .gcell{background:rgba(255,255,255,.05)}
.blueprint .gcell.on{background:rgba(255,179,0,.35);border:1px solid rgba(255,179,0,.6)}
.build .gcell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.build .gcell.on{background:#ffb300}
#msg{text-align:center;font-weight:700;min-height:24px;padding-top:8px}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Block Builder</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">Blueprint: 1 | Score: 0</div>
    <div id="boards">
      <div><div class="board-label">Blueprint</div><div class="grid blueprint" id="blueprint"></div></div>
      <div><div class="board-label">Your Build</div><div class="grid build" id="build"></div></div>
    </div>
    <div id="msg"></div>
  </div>
  <div class="game-instructions">Tap the cells on "Your Build" to match the highlighted blueprint pattern exactly. It checks automatically once every cell matches!</div>
</div>
<script>
let size,blueprint,build,level,score;

function init(){
  level=1;score=0;
  nextLevel();
}

function nextLevel(){
  size=Math.min(6,3+Math.floor(level/2));
  blueprint=Array.from({length:size*size},()=>Math.random()<0.45);
  if(!blueprint.includes(true))blueprint[0]=true;
  build=Array(size*size).fill(false);
  render();
  document.getElementById('msg').textContent='';
}

function toggle(i){
  build[i]=!build[i];
  render();
  if(build.every((v,idx)=>v===blueprint[idx])){
    score+=size*5;
    level++;
    document.getElementById('msg').textContent='🎉 Blueprint matched!';
    document.getElementById('msg').style.color='#69f0ae';
    updateUI();
    setTimeout(nextLevel,1000);
  }
}

function render(){
  const bp=document.getElementById('blueprint');
  const bd=document.getElementById('build');
  bp.style.gridTemplateColumns=`repeat(${size},32px)`;
  bd.style.gridTemplateColumns=`repeat(${size},32px)`;
  bp.innerHTML='';bd.innerHTML='';
  blueprint.forEach(v=>{
    const d=document.createElement('div');
    d.className='gcell'+(v?' on':'');
    bp.appendChild(d);
  });
  build.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='gcell'+(v?' on':'');
    d.onclick=()=>toggle(i);
    bd.appendChild(d);
  });
  updateUI();
}

function updateUI(){
  document.getElementById('ui').textContent=`Blueprint: ${level} | Score: ${score}`;
}

init();
</script></body></html>
