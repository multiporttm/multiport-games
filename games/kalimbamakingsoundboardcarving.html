<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>__NAME__ - Multiport Games</title>
<meta name="description" content="__DESC__">
<link rel="canonical" href="https://multiportgames.com/games/__ID__.html">
<meta property="og:title" content="__NAME__ - Multiport Games">
<meta property="og:description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:url" content="https://multiportgames.com/games/__ID__.html">
<meta property="og:image" content="../thumbs/__ID__.jpg">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"__NAME__","description":"__DESC__","applicationCategory":"GameApplication","operatingSystem":"Any"}</script>
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">

<script src="../js/i18n.js"></script>
<style>
body{background:__C2__}
#gc{display:block;border-radius:10px;margin:0 auto;touch-action:manipulation;max-width:100%;height:auto}
#ui{color:#f0e6c8;text-align:center;padding:6px;font-size:1.05rem;font-weight:700}
</style>
</head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">&larr; Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">__EMOJI__ __NAME__</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 &nbsp;|&nbsp; Best: 0</div>
    <canvas id="gc" width="360" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">__INSTR__</div>
</div>
<script>
(function(){
'use strict';
var ID='__ID__', NAME='__NAME__', EMOJI='__EMOJI__', C1='__C1__', C2='__C2__', THEME='__THEME__';
var ACTION='__ACTION__', UNIT='__UNIT__', KEY='__ID___highscore';
var W=360,H=640;
var cv=document.getElementById('gc'), ctx=cv.getContext('2d');
var uiEl=document.getElementById('ui');

var highscore=0;
try{ highscore=parseInt(localStorage.getItem(KEY),10)||0; }catch(e){ highscore=0; }

var state='start'; // start | play | over
var score=0, round=0, hitsTotal=0, quality=100;
var barX=40, barY=300, barW=280, barH=30;
var zoneWidth=78, zoneStart=0;
var markerX=barX, dir=1, speed=1.6;
var flashT=0, flashColor=null;
var shakeT=0;
var lastTs=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function newZone(){
  zoneStart = barX + Math.random()*(barW-zoneWidth);
}

function resetGame(){
  score=0; round=0; hitsTotal=0; quality=100;
  zoneWidth=78; speed=1.6; dir=1; markerX=barX;
  newZone();
}

function startGame(){
  resetGame();
  state='play';
  SFX.select();
}

function endGame(){
  state='over';
  SFX.lose();
  if(score>highscore){
    highscore=score;
    try{ localStorage.setItem(KEY, String(highscore)); }catch(e){}
  }
}

function attempt(){
  if(state!=='play'){ startGame(); return; }
  var inZone = markerX>=zoneStart && markerX<=zoneStart+zoneWidth;
  if(inZone){
    var center=zoneStart+zoneWidth/2;
    var dist=Math.abs(markerX-center)/(zoneWidth/2); // 0 = perfect
    var bonus = dist<0.35 ? 1.5 : 1;
    score += Math.round(10*bonus*(1+round*0.05));
    hitsTotal++; round++;
    quality=clamp(quality+6,0,100);
    SFX.coin();
    flashColor='#7ee787'; flashT=10;
    if(hitsTotal%5===0){
      speed+=0.22;
      zoneWidth=clamp(zoneWidth-4,30,78);
    }
    newZone();
  } else {
    quality-=22;
    SFX.hurt();
    flashColor='#ff6b6b'; flashT=10;
    shakeT=8;
    newZone();
    if(quality<=0){ quality=0; endGame(); }
  }
}

cv.addEventListener('click', function(){ attempt(); });
cv.addEventListener('touchstart', function(e){ e.preventDefault(); attempt(); }, {passive:false});
window.addEventListener('keydown', function(e){
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); attempt(); }
});

// ---- Themed background art ----
function drawBackdrop(t){
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,C1); g.addColorStop(1,C2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha=0.5;
  if(THEME==='rim'){
    ctx.strokeStyle='rgba(255,220,160,0.25)';
    ctx.lineWidth=3;
    for(var i=0;i<6;i++){
      ctx.beginPath();
      ctx.arc(W/2, 150, 40+i*14, Math.PI*0.15, Math.PI*0.85);
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(120,80,40,0.35)';
    ctx.lineWidth=10;
    ctx.beginPath();
    ctx.arc(W/2,150,110,0,Math.PI*2);
    ctx.stroke();
  } else if(THEME==='head'){
    ctx.strokeStyle='rgba(255,230,180,0.3)';
    ctx.fillStyle='rgba(255,245,220,0.08)';
    ctx.beginPath();
    ctx.arc(W/2,150,100,0,Math.PI*2);
    ctx.fill();
    ctx.lineWidth=3;
    for(var h=0;h<12;h++){
      var ang=(h/12)*Math.PI*2 + t*0.0003;
      var hx=W/2+Math.cos(ang)*100, hy=150+Math.sin(ang)*100;
      ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(W/2,150,100,0,Math.PI*2); ctx.stroke();
  } else if(THEME==='neck'){
    ctx.strokeStyle='rgba(255,220,180,0.25)';
    ctx.lineWidth=2;
    for(var n=0;n<10;n++){
      ctx.beginPath();
      ctx.moveTo(30, 60+n*22);
      ctx.quadraticCurveTo(W/2, 55+n*22+Math.sin(n+t*0.0005)*4, W-30, 60+n*22);
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(90,50,20,0.4)';
    ctx.lineWidth=14;
    ctx.beginPath();
    ctx.moveTo(60,40); ctx.quadraticCurveTo(W/2,260,60,260);
    ctx.stroke();
  } else if(THEME==='fret'){
    ctx.strokeStyle='rgba(220,220,230,0.25)';
    ctx.lineWidth=4;
    for(var f=0;f<9;f++){
      var fy=40+f*24;
      ctx.beginPath(); ctx.moveTo(40,fy); ctx.lineTo(W-40,fy); ctx.stroke();
    }
    ctx.strokeStyle='rgba(180,180,190,0.35)';
    ctx.lineWidth=1;
    for(var s=0;s<4;s++){
      ctx.beginPath(); ctx.moveTo(55+s*70,30); ctx.lineTo(55+s*70,250); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMeter(){
  ctx.save();
  ctx.translate(0, shakeT>0 ? (Math.random()-0.5)*shakeT : 0);
  // quality bar
  var mx=30,my=20,mw=W-60,mh=14;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,7); ctx.fill();
  var qcol = quality>55?'#7ee787':(quality>25?'#ffd166':'#ff6b6b');
  ctx.fillStyle=qcol;
  ctx.beginPath(); ctx.roundRect(mx,my,mw*(quality/100),mh,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,7); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
  ctx.fillText(I18N.t('quality_label','QUALITY'), W/2, my+mh+12);
  ctx.restore();
}

function drawBar(t){
  ctx.save();
  ctx.translate(0, shakeT>0 ? (Math.random()-0.5)*shakeT : 0);
  // bar background
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,8); ctx.stroke();
  // zone
  ctx.fillStyle='rgba(126,231,135,0.85)';
  ctx.beginPath(); ctx.roundRect(zoneStart,barY,zoneWidth,barH,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillRect(zoneStart+zoneWidth/2-1, barY, 2, barH);
  // marker
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#222'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(markerX, barY-8);
  ctx.lineTo(markerX-8, barY-20);
  ctx.lineTo(markerX+8, barY-20);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(markerX-2,barY-2,4,barH+4);

  if(flashT>0){
    ctx.globalAlpha=flashT/10*0.5;
    ctx.fillStyle=flashColor;
    ctx.beginPath(); ctx.roundRect(barX-6,barY-6,barW+12,barH+12,10); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.0)';
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.font='bold 15px Arial';
  ctx.fillText(EMOJI+' '+NAME, W/2, 380);
  ctx.font='13px Arial';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText(I18N.t('round_label','Round {n}').replace('{n}',round), W/2, 405);
  ctx.font='bold 12px Arial';
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText(I18N.t('action_hint','Press SPACE / Tap when the marker is in the green zone!'), W/2, 440);
  ctx.fillText(I18N.t('action_name','{action} the {unit}!').replace('{action}',ACTION).replace('{unit}',UNIT), W/2, 460);
}

function drawOverlay(title, sub1, sub2){
  ctx.fillStyle='rgba(0,0,0,0.62)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd166';
  ctx.font='bold 26px Arial';
  ctx.fillText(title, W/2, H/2-70);
  ctx.fillStyle='#fff';
  ctx.font='bold 18px Arial';
  ctx.fillText(sub1, W/2, H/2-30);
  ctx.font='14px Arial';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText(sub2, W/2, H/2-4);

  // big play button
  var bx=W/2-90, by=H/2+30, bw=180, bh=54;
  ctx.fillStyle='#4caf50';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,14); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,14); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 20px Arial';
  ctx.fillText(state==='start'?I18N.t('start_btn','START'):I18N.t('again_btn','PLAY AGAIN'), W/2, by+bh/2+7);

  ctx.font='12px Arial'; ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.fillText(I18N.t('tap_hint','Tap anywhere, or press SPACE'), W/2, by+bh+26);
}

function loop(ts){
  if(!lastTs) lastTs=ts;
  var dt=ts-lastTs; lastTs=ts;
  if(flashT>0) flashT-=1;
  if(shakeT>0) shakeT-=1;

  drawBackdrop(ts);

  if(state==='play'){
    markerX += dir*speed*(dt/16.67);
    if(markerX>barX+barW){ markerX=barX+barW; dir=-1; }
    if(markerX<barX){ markerX=barX; dir=1; }
    drawMeter();
    drawBar(ts);
    drawHUD();
  } else if(state==='start'){
    drawMeter(); drawBar(ts); drawHUD();
    drawOverlay(NAME, I18N.t('best_label','Best: {n}').replace('{n}',highscore), I18N.t('start_sub','Craft a perfect banjo, one careful step at a time.'));
  } else if(state==='over'){
    drawMeter(); drawBar(ts); drawHUD();
    drawOverlay(I18N.t('gameover_title','ROUND OVER'),
      I18N.t('score_label','Score: {n}').replace('{n}',score),
      I18N.t('best_label','Best: {n}').replace('{n}',highscore));
  }

  uiEl.textContent = I18N.t('score_label','Score: {n}').replace('{n}',score) + '   |   ' + I18N.t('best_label','Best: {n}').replace('{n}',highscore);

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
})();
</script>
</body></html>
