<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Monster Truck Rally</title><meta name="description" content="Play Monster Truck Rally free online — Time your gas and brake to launch off the ramp and land the longest jump without flipping."><link rel="canonical" href="https://games.multiportllc.com/games/monstertruckrally"><meta property="og:title" content="Monster Truck Rally - Multiport Games"><meta property="og:description" content="Play Monster Truck Rally free online — Time your gas and brake to launch off the ramp and land the longest jump without flipping."><meta property="og:url" content="https://games.multiportllc.com/games/monstertruckrally"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Monster Truck Rally","description":"Play Monster Truck Rally free online instantly. Time your gas and brake to launch off the ramp and land the longest jump without flipping. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/monstertruckrally","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#8d6e63}
#ui{color:#fff3e0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px}
#btns button{padding:14px 26px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Monster Truck Rally</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Best jump: 0m | Attempt: 1</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="gasBtn">⛽ Gas</button>
      <button id="tiltBtn">🔄 Tilt</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold Gas to build speed before the ramp — more speed means a longer jump. Once airborne, tap Tilt to level the truck out; land nose-down or tail-down and you'll flip!</div>
</div>
<script>
const W=360,H=360,GROUND=H-60,RAMP_X=100;
let truckX,speed,phase,angle,vy,attempt,bestJump,jumpDist,state,holding;

function loadBest(){return +(localStorage.getItem('monstertruckrally_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('monstertruckrally_best',v);}

function init(){attempt=1;bestJump=loadBest();state='play';newAttempt();}
function newAttempt(){truckX=20;speed=0;phase='charge';angle=0;vy=0;holding=false;}

document.getElementById('gasBtn').addEventListener('mousedown',()=>holding=true);
document.getElementById('gasBtn').addEventListener('mouseup',()=>holding=false);
document.getElementById('gasBtn').addEventListener('mouseleave',()=>holding=false);
document.getElementById('gasBtn').addEventListener('touchstart',e=>{e.preventDefault();holding=true;},{passive:false});
document.getElementById('gasBtn').addEventListener('touchend',e=>{e.preventDefault();holding=false;},{passive:false});
document.getElementById('tiltBtn').addEventListener('click',()=>{
  if(state==='over'){attempt=1;bestJump=loadBest();state='play';newAttempt();return;}
  if(phase==='air'){angle+=angle<0?8:-8;SFX.tick();}
});

function update(){
  if(state!=='play')return;
  if(phase==='charge'){
    if(holding){speed=Math.min(9,speed+0.15);}
    truckX+=speed*0.3;
    if(truckX>=RAMP_X){
      phase='air';vy=-speed*0.9;angle=-15;jumpDist=0;
      SFX.jump();
    }
  }else if(phase==='air'){
    vy+=0.35;
    jumpDist+=speed*0.5;
    truckX+=speed*0.5;
    angle+=(Math.random()-0.5)*0.6;
    if(vy>=0&&truckX>RAMP_X+40){
      const landed=Math.abs(angle)<25;
      phase='landed';
      if(landed){
        SFX.success();
        if(jumpDist>bestJump){bestJump=Math.floor(jumpDist);saveBest(bestJump);SFX.levelup();}
      }else{
        SFX.hurt();
      }
      setTimeout(()=>{
        attempt++;
        if(attempt>5){state='over';SFX.win();}
        else newAttempt();
        updateUI();
      },1200);
    }
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5d4037';ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle='#6d4c41';
  ctx.beginPath();ctx.moveTo(RAMP_X-20,GROUND);ctx.lineTo(RAMP_X+20,GROUND);ctx.lineTo(RAMP_X+20,GROUND-40);ctx.fill();

  const y=phase==='air'||phase==='landed'?GROUND-Math.max(0,-((-speed*0.9)*2-vy*10)):GROUND;
  ctx.save();
  ctx.translate(Math.min(W-20,truckX),phase==='charge'?GROUND-14:Math.max(GROUND-90,GROUND-14-Math.abs(vy)*4));
  ctx.rotate(angle*Math.PI/180);
  ctx.font='34px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🚚',0,0);
  ctx.restore();

  ctx.fillStyle='#fff3e0';ctx.font='14px Arial';ctx.textAlign='center';
  if(phase==='charge')ctx.fillText(I18N.t('charge_hint','Hold GAS to speed up!'),W/2,30);
  else if(phase==='air')ctx.fillText(I18N.t('air_hint','Tap TILT to level out!'),W/2,30);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff3e0';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('rally_done_title','RALLY DONE!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('best_jump_label','Best jump: {n}m').replace('{n}',bestJump),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap Tilt to try again'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('best_jump_attempt','Best jump: {n}m | Attempt: {a}/5').replace('{n}',bestJump).replace('{a}',Math.min(5,attempt));
}

init();draw();
</script></body></html>
