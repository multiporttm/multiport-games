<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Teacher's Classroom</title><meta name="description" content="Play Teacher's Classroom free online — Click the disruptive students before their patience timer runs out. More students act up as time goes on — survive with 3 lives!"><link rel="canonical" href="https://games.multiportllc.com/games/teacherclassroom"><meta property="og:title" content="Teacher's Classroom - Multiport Games"><meta property="og:description" content="Play Teacher's Classroom free online — Click the disruptive students before their patience timer runs out. More students act up as time goes on — survive with 3 lives!"><meta property="og:url" content="https://games.multiportllc.com/games/teacherclassroom"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Teacher's Classroom","description":"Play Teacher's Classroom free online instantly. Click the disruptive students before their patience timer runs out. More students act up simultaneously as time goes on — lose a life for each one that runs out, and 0 lives ends the class period. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/teacherclassroom","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#6a1b9a,#ffca28);display:block;border-radius:8px;touch-action:none;cursor:pointer}
#score-display{color:#4a148c;background:#f3e5f5;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Teacher's Classroom</div>
  <div class="game-frame">
    <div id="score-display">Managed: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click or tap a student showing a <b>💬 distraction icon</b> to quiet them down before their patience bar empties. More students get disruptive at once as class goes on — let one go too long and you lose a life. Survive with 0 lives left and class is over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const ROWS=3,COLS=5;
let managed=parseInt(localStorage.getItem('teacherclassroom_managed')||'0',10);
let bestManaged=parseInt(localStorage.getItem('teacherclassroom_best')||'0',10);

let students,lives,gameOver,started,sessionManaged,spawnTimer,spawnInterval,elapsed,lastTime;

function makeStudents(){
  const arr=[];
  const cellW=W/COLS,cellH=(H-40)/ROWS;
  for(let r=0;r<ROWS;r++){
    for(let col=0;col<COLS;col++){
      arr.push({
        x:col*cellW+cellW/2,
        y:40+r*cellH+cellH/2,
        disruptive:false,
        patience:0,
        maxPatience:1,
        faceSeed:Math.random()
      });
    }
  }
  return arr;
}

function reset(){
  students=makeStudents();
  lives=3;gameOver=false;started=false;sessionManaged=0;
  spawnTimer=0;spawnInterval=90;elapsed=0;lastTime=null;
}
reset();

function quiet(sx,sy){
  if(gameOver){reset();return;}
  if(!started){started=true;lastTime=null;}
  let hitIdx=-1,hitDist=Infinity;
  students.forEach((s,i)=>{
    if(!s.disruptive)return;
    const d=Math.hypot(sx-s.x,sy-s.y);
    if(d<34&&d<hitDist){hitDist=d;hitIdx=i;}
  });
  if(hitIdx>=0){
    const s=students[hitIdx];
    s.disruptive=false;
    sessionManaged++;
    managed++;
    localStorage.setItem('teacherclassroom_managed',managed);
    SFX.success();
  }
}

c.addEventListener('mousedown',e=>{
  const r=c.getBoundingClientRect();
  const scaleX=W/r.width,scaleY=H/r.height;
  quiet((e.clientX-r.left)*scaleX,(e.clientY-r.top)*scaleY);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const scaleX=W/r.width,scaleY=H/r.height;
  quiet((t.clientX-r.left)*scaleX,(t.clientY-r.top)*scaleY);
},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('tc_score_label','Managed: {m} | Lives: {l}')
      .replace('{m}',sessionManaged)
      .replace('{l}',Math.max(0,lives));
}

function drawStudent(s){
  ctx.save();
  ctx.fillStyle='#8d6e63';
  ctx.fillRect(s.x-38,s.y+18,76,20); // desk
  ctx.fillStyle=s.disruptive?'#ffab91':'#fff3e0';
  ctx.beginPath();ctx.arc(s.x,s.y,24,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=s.disruptive?'#e53935':'#8d6e63';
  ctx.lineWidth=s.disruptive?3:1.5;
  ctx.stroke();
  // face
  ctx.fillStyle='#3e2723';
  ctx.beginPath();ctx.arc(s.x-8,s.y-4,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s.x+8,s.y-4,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();
  if(s.disruptive)ctx.arc(s.x,s.y+8,6,0,Math.PI,false);
  else ctx.arc(s.x,s.y+10,6,Math.PI,0,false);
  ctx.stroke();
  if(s.disruptive){
    // patience bar
    const w=48;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(s.x-w/2,s.y-46,w,7);
    const pct=Math.max(0,1-s.patience/s.maxPatience);
    ctx.fillStyle=pct>0.5?'#66bb6a':pct>0.25?'#ffca28':'#e53935';
    ctx.fillRect(s.x-w/2,s.y-46,w*pct,7);
    // distraction icon
    ctx.font='22px Arial';ctx.textAlign='center';
    ctx.fillText('💬',s.x,s.y-52);
  }
  ctx.restore();
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#ede7f6');grad.addColorStop(1,'#fff3e0');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4527a0';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('tc_board_label','Classroom'),10,20);

  if(!started){
    ctx.fillStyle='#4a148c';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tc_start_hint','Click any student to start class!'),W/2,H/2);
    students.forEach(drawStudent);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    students.forEach(drawStudent);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tc_over_title','CLASS DISMISSED'),W/2,H/2-30);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tc_managed_result','Students managed: {n}').replace('{n}',sessionManaged),W/2,H/2+6);
    ctx.fillText(I18N.t('restart_hint','Tap or click to restart'),W/2,H/2+34);
    requestAnimationFrame(loop);return;
  }

  elapsed+=dt/60;

  // difficulty ramps: spawn interval shrinks, patience shrinks
  spawnInterval=Math.max(24,90-elapsed*2.2);

  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    const idle=students.filter(s=>!s.disruptive);
    if(idle.length>0){
      const s=idle[Math.floor(Math.random()*idle.length)];
      s.disruptive=true;
      s.patience=0;
      s.maxPatience=Math.max(2.2,4.5-elapsed*0.03);
      SFX.tick();
    }
  }

  students.forEach(s=>{
    if(!s.disruptive)return;
    s.patience+=dt/60;
    if(s.patience>=s.maxPatience){
      s.disruptive=false;
      lives--;
      SFX.error();
      if(lives<=0){
        gameOver=true;
        if(sessionManaged>bestManaged){
          bestManaged=sessionManaged;
          localStorage.setItem('teacherclassroom_best',bestManaged);
        }
        SFX.lose();
      }
    }
  });

  students.forEach(drawStudent);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
