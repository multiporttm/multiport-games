<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Perfume Aging Room</title><meta name="description" content="Play Perfume Aging Room free online — Track each perfume batch's weeks of maceration and pull it for bottling at exactly its ideal maturation point."><link rel="canonical" href="https://games.multiportllc.com/games/perfumeagingroom"><meta property="og:title" content="Perfume Aging Room - Multiport Games"><meta property="og:description" content="Play Perfume Aging Room free online — Track each perfume batch's weeks of maceration and pull it for bottling at exactly its ideal maturation point."><meta property="og:url" content="https://games.multiportllc.com/games/perfumeagingroom"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Perfume Aging Room","description":"Play Perfume Aging Room free online instantly. Manage a maceration room full of perfume batches aging in dark bottles. Track each batch's weeks-since-blending and periodically check scent development, pulling each batch for bottling at exactly its ideal maturation point. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/perfumeagingroom","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1008;display:block;border-radius:8px;touch-action:none}
#hud{color:#d9a66c;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#ffcc80}
#hud span.hs{color:#7ec850}
#bottleBtns{display:flex;justify-content:center;gap:10px;padding:6px 0;flex-wrap:wrap}
#bottleBtns button{padding:10px 26px;border:none;border-radius:18px;font-weight:800;cursor:pointer;font-size:1rem;color:#fff;background:#8d5a2b}
#bottleBtns button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Perfume Aging Room</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="bottleBtns"><button id="bottleBtn">Bottle Now (Space)</button></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the dark bottle age week by week and read its scent check-in. Press <b>Space</b> / tap <b>Bottle Now</b> the moment it reads balanced and ready — too early is raw, too late is oxidized, and either costs a life.</div>
</div>
<script>
(function(){
const HS_KEY='perfumeagingroom_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const FAMILIES=[
  {key:'citrus',label:'Citrus Cologne',color:'#ffb74d',min:2,max:3},
  {key:'floral',label:'Floral Eau de Parfum',color:'#f06292',min:4,max:6},
  {key:'woody',label:'Woody Extrait',color:'#6d4c41',min:8,max:10},
  {key:'oriental',label:'Oriental Amber',color:'#8e24aa',min:10,max:14}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let batch=null,weeks=0,resolved=false,speed=0.02;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function newBatch(){
  const f=FAMILIES[Math.floor(Math.random()*FAMILIES.length)];
  batch={f};
  weeks=0;resolved=false;
  speed=0.02+level*0.0025;
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newBatch(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newBatch();
}

function passRound(){
  const mid=(batch.f.min+batch.f.max)/2;
  const span=(batch.f.max-batch.f.min)/2;
  const dist=Math.abs(weeks-mid);
  const precision=Math.max(0,1-dist/span);
  score+=Math.round((20+60*precision)*level);
  SFX.coin();
  if(score>=level*260)levelUp();
  newBatch();
}

function stageHint(){
  if(weeks<batch.f.min)return I18N.t('stage_raw','Still sharp and raw — not ready');
  if(weeks<=batch.f.max)return I18N.t('stage_ready','Rounded and balanced — ready!');
  return I18N.t('stage_over','Flat, oxidized notes — past peak');
}

function doBottle(){
  if(!started||gameOver||!batch||resolved)return;
  resolved=true;
  if(weeks>=batch.f.min&&weeks<=batch.f.max){ passRound(); }
  else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

document.getElementById('bottleBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();
  if(!started||gameOver){startGame();return;}
  doBottle();
});
c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();return;}
    doBottle();
  }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawBottle(){
  const sx=W/2,sy=170;
  ctx.save();
  ctx.fillStyle='#4e342e';
  ctx.fillRect(sx-50,sy-100,100,200);
  const fillH=Math.min(1,weeks/(batch.f.max+2))*170;
  ctx.fillStyle=batch.f.color+'aa';
  ctx.fillRect(sx-38,sy+88-fillH,76,fillH);
  ctx.strokeStyle='#2b1b14';ctx.lineWidth=3;
  ctx.strokeRect(sx-50,sy-100,100,200);
  ctx.fillStyle='#2b1b14';
  ctx.fillRect(sx-15,sy-120,30,22);
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('family_'+batch.f.key,batch.f.label),sx,sy-140);
  ctx.font='16px Arial';ctx.fillStyle='#ffe0b2';
  ctx.fillText(I18N.t('weeks_label','Weeks since blending: {w}').replace('{w}',weeks.toFixed(1)),sx,sy+130);
  ctx.font='bold 16px Arial';ctx.fillStyle='#c5e1a5';
  ctx.fillText(stageHint(),sx,sy+158);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0702');bg.addColorStop(1,'#1a1008');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#d9a66c';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    if(batch)drawBottle();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!resolved){
    weeks+=speed;
    if(weeks>batch.f.max+2.5){ failRound(); }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('watch_hint','Watch the batch — bottle it at its peak'),W/2,30);

  const barW=400,barH=10,barX=W/2-barW/2,barY=44;
  ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
  const frac=Math.max(0,1-weeks/(batch.f.max+2.5));
  ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
  ctx.fillRect(barX,barY,barW*frac,barH);

  if(batch)drawBottle();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
