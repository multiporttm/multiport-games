<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#333}
#ui{color:#69f0ae;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Racing Rally</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Left/Right arrows or A/D (or the D-pad) to switch lanes. Dodge oncoming traffic — the highway speeds up the further you go!</div>
</div>
<script>
const W=360,H=360,LANES=3,LANE_W=W/LANES;
let player,cars,dist,speed,state,keys={},spawnTimer,roadOffset=0;

function loadBest(){return +(localStorage.getItem('racingrally_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('racingrally_best',v);}

function init(){
  player={lane:1,x:LANE_W*1.5};
  cars=[];dist=0;speed=3;state='play';spawnTimer=0;
}

function laneX(l){return LANE_W*l+LANE_W/2;}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(state==='over'){init();return;}
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')moveLane(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')moveLane(1);
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function moveLane(dir){
  player.lane=Math.max(0,Math.min(LANES-1,player.lane+dir));
  SFX.swoosh();
}

document.querySelector('#dpad .left').addEventListener('click',()=>{if(state==='over')init();else moveLane(-1);});
document.querySelector('#dpad .right').addEventListener('click',()=>{if(state==='over')init();else moveLane(1);});

function spawnCar(){
  const lane=Math.floor(Math.random()*LANES);
  cars.push({lane,y:-40});
}

function update(){
  if(state!=='play')return;
  speed=3+dist*0.002;
  dist+=speed*0.08;
  roadOffset=(roadOffset+speed)%40;
  player.x+=(laneX(player.lane)-player.x)*0.25;

  spawnTimer--;
  if(spawnTimer<=0){
    spawnCar();
    spawnTimer=Math.max(18,40-dist*0.03);
  }

  cars.forEach(c=>c.y+=speed);
  cars=cars.filter(c=>c.y<H+40);

  cars.forEach(c=>{
    if(c.lane===player.lane&&c.y>H-70&&c.y<H-20&&state==='play'){
      state='over';
      SFX.lose();
      saveBest(Math.floor(dist));
    }
  });
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#333';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let l=1;l<LANES;l++){
    for(let y=-40;y<H;y+=40){
      ctx.fillRect(l*LANE_W-2,y+roadOffset,4,20);
    }
  }

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  cars.forEach(car=>ctx.fillText('🚙',laneX(car.lane),car.y));
  ctx.fillText('🏎️',player.x,H-45);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#69f0ae';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('crash','CRASH!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('distance_best_m_label','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('press_lane_retry','Press a lane key to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`;
}

init();draw();
</script></body></html>
