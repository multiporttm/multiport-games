<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0288d1}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Surf's Up</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Left/Right (or the D-pad) to weave freely across the wave. Dodge the 🪨 rocks and grab 💨 boosts for a burst of speed. Hit a rock and your run ends!</div>
</div>
<script>
const W=360,H=360;
let playerX,items,dist,speed,state,boostT,spawnTimer;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('surfsup_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('surfsup_best',v);}

function init(){
  playerX=W/2;items=[];dist=0;speed=3;state='play';boostT=0;spawnTimer=0;
}

document.addEventListener('keydown',e=>{
  if(state==='over'){init();return;}
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')playerX-=26;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')playerX+=26;
});
document.querySelector('#dpad .left').addEventListener('click',()=>{if(state==='over')init();else playerX-=30;});
document.querySelector('#dpad .right').addEventListener('click',()=>{if(state==='over')init();else playerX+=30;});

function spawnItem(){
  const type=Math.random()<0.25?'boost':'rock';
  items.push({x:rand(30,W-30),y:-30,type});
}

function update(){
  if(state!=='play')return;
  playerX=Math.max(20,Math.min(W-20,playerX));
  const boosted=boostT>0;
  if(boosted)boostT--;
  speed=(boosted?6:3)+dist*0.0015;
  dist+=speed*0.08;

  spawnTimer--;
  if(spawnTimer<=0){
    spawnItem();
    spawnTimer=Math.max(16,36-dist*0.02);
  }

  items.forEach(it=>it.y+=speed);
  items=items.filter(it=>it.y<H+30);

  items.forEach(it=>{
    if(!it.hit&&Math.abs(it.x-playerX)<22&&it.y>H-70&&it.y<H-20){
      it.hit=true;
      if(it.type==='boost'){boostT=50;SFX.powerup();}
      else{state='over';SFX.lose();saveBest(Math.floor(dist));}
    }
  });
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#0288d1';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.2)';
  for(let i=0;i<4;i++){
    ctx.beginPath();ctx.moveTo(0,i*90+(dist*3)%90);ctx.lineTo(W,i*90+(dist*3)%90);ctx.stroke();
  }

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  items.forEach(it=>{
    if(it.hit&&it.type==='rock')return;
    ctx.fillText(it.type==='boost'?'💨':'🪨',it.x,it.y);
  });
  ctx.fillText(boostT>0?'💥':'🏄',playerX,H-45);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('wipeout_title','WIPEOUT!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('distance_best','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Press a lane key to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('distance_best','Distance: {n}m | Best: {b}m').replace('{n}',Math.floor(dist)).replace('{b}',loadBest());
}

init();draw();
</script></body></html>
