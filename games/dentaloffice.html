<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#3fa7a0 0%,#eaf6f6 100%);display:block;border-radius:8px;cursor:crosshair;touch-action:none}
#score-display{color:#3fa7a0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dental Office</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="700" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and hold to pick up the <b>drill</b>, then drag it and keep it over the highlighted <b>cavity spot</b> until the precision meter fills. Drifting off-target too long costs a life — clean every tooth to advance to a trickier patient!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=440;
let score=0,hi=parseInt(localStorage.getItem('dentaloffice_hi')||'0'),lives=3,gameOver=false;
let toothIndex=0,teethTreated=0;
let drilling=false;
let drillPos={x:W/2,y:H/2};
let progress=0; // 0..100
let painTimer=0;
let toast={text:'',t:0};
let spot={};
let toothShapes=[];

function rand(a,b){return a+Math.random()*(b-a);}

function newTooth(){
  const difficulty=Math.min(teethTreated,10);
  const r=Math.max(14,32-difficulty*1.4);
  spot={
    x: W/2 + rand(-40,40),
    y: 190 + rand(-20,20),
    r: r,
    driftDx: rand(-0.4,0.4)*(difficulty>3?1:0),
    driftDy: rand(-0.4,0.4)*(difficulty>3?1:0)
  };
  progress=0;
  drilling=false;
}

function reset(){
  score=0;lives=3;gameOver=false;toothIndex=0;teethTreated=0;painTimer=0;toast={text:'',t:0};
  newTooth();
}
reset();

function getPos(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  let cx,cy;
  if(e.touches&&e.touches.length){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
  else { cx=e.clientX; cy=e.clientY; }
  return {x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY};
}

function startDrill(e){
  if(gameOver){reset();return;}
  drilling=true;
  drillPos=getPos(e);
  SFX.click();
}
function moveDrill(e){
  if(!drilling)return;
  drillPos=getPos(e);
}
function endDrill(){ drilling=false; }

c.addEventListener('mousedown',startDrill);
window.addEventListener('mousemove',moveDrill);
window.addEventListener('mouseup',endDrill);
c.addEventListener('touchstart',e=>{e.preventDefault();startDrill(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();moveDrill(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endDrill();},{passive:false});
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&gameOver)reset(); });

function drawMouth(){
  ctx.save();
  ctx.fillStyle='#7a3b3b';
  ctx.fillRect(0,260,W,H-260);
  ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){
    const tx=60+i*80;
    ctx.fillStyle='#fdfdf5';
    ctx.beginPath();
    ctx.moveTo(tx,260);
    ctx.lineTo(tx+50,260);
    ctx.lineTo(tx+42,320);
    ctx.lineTo(tx+8,320);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#ddd';ctx.stroke();
  }
  ctx.restore();
}

function drawTargetTooth(){
  ctx.save();
  ctx.fillStyle='#fdfdf5';
  ctx.beginPath();
  ctx.ellipse(W/2,190,90,80,0,0,7);
  ctx.fill();
  ctx.strokeStyle='#e0e0d0';ctx.lineWidth=3;ctx.stroke();

  // cavity spot
  const pulse=1+0.08*Math.sin(Date.now()/150);
  ctx.fillStyle='rgba(139,58,42,0.85)';
  ctx.beginPath();
  ctx.arc(spot.x,spot.y,spot.r*pulse,0,7);
  ctx.fill();
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(spot.x,spot.y,spot.r*pulse+6,0,7);
  ctx.stroke();
  ctx.restore();
}

function drawDrill(){
  ctx.save();
  ctx.translate(drillPos.x,drillPos.y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle='#aaa';
  ctx.fillRect(-6,-4,50,8);
  ctx.fillStyle= drilling? '#ffd54f':'#eee';
  ctx.beginPath();
  ctx.arc(-6,0,7,0,7);
  ctx.fill();
  if(drilling){
    // spinning bit sparkle
    ctx.strokeStyle='rgba(255,255,255,0.8)';
    const spin=Date.now()/30;
    for(let i=0;i<3;i++){
      const a=spin+i*(Math.PI*2/3);
      ctx.beginPath();
      ctx.moveTo(44,0);
      ctx.lineTo(44+Math.cos(a)*6,Math.sin(a)*6);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMeters(){
  // precision bar
  ctx.fillStyle='#222';ctx.fillRect(30,20,W-60,16);
  ctx.fillStyle='#4caf50';ctx.fillRect(30,20,(W-60)*(progress/100),16);
  ctx.strokeStyle='#fff';ctx.strokeRect(30,20,W-60,16);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('precision_label','Precision'),30,14);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#3fa7a0');bg.addColorStop(1,'#eaf6f6');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  document.getElementById('score-display').textContent=
    I18N.t('dental_status','Score: {s} | Hi: {h} | Lives: {l}').replace('{s}',score).replace('{h}',hi).replace('{l}',Math.max(0,lives));

  ctx.fillStyle='#083b3b';ctx.font='bold 15px Arial';ctx.textAlign='right';
  ctx.fillText(I18N.t('teeth_treated_label','Teeth treated: {n}').replace('{n}',teethTreated),W-20,44);

  drawMouth();
  drawTargetTooth();
  drawMeters();

  if(gameOver){
    drawDrill();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,190);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',score),W/2,226);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,258);
    requestAnimationFrame(loop);
    return;
  }

  // drift spot at higher difficulty
  spot.x+=spot.driftDx; spot.y+=spot.driftDy;
  if(spot.x<W/2-60||spot.x>W/2+60)spot.driftDx*=-1;
  if(spot.y<140||spot.y>240)spot.driftDy*=-1;

  if(drilling){
    const d=Math.hypot(drillPos.x-spot.x,drillPos.y-spot.y);
    if(d<spot.r){
      progress+=0.9;
      painTimer=0;
      if(Math.floor(progress)%10===0)SFX.tick();
    } else {
      painTimer++;
      if(painTimer>20){
        score=Math.max(0,score-1);
        if(painTimer%20===0){
          lives--;
          SFX.error();
          toast={text:I18N.t('ouch_label','Ouch!'),t:40};
          if(lives<=0){
            gameOver=true;
            if(score>hi){hi=score;localStorage.setItem('dentaloffice_hi',hi);}
            SFX.lose();
          }
        }
      }
    }
  } else {
    painTimer=0;
  }

  if(progress>=100){
    teethTreated++;
    const pts=60+teethTreated*5;
    score+=pts;
    if(score>hi){hi=score;localStorage.setItem('dentaloffice_hi',hi);}
    toast={text:`+${pts} ${I18N.t('tooth_clean_label','Tooth clean!')}`,t:70};
    SFX.success();
    newTooth();
  }

  drawDrill();

  if(toast.t>0){
    toast.t--;
    ctx.fillStyle='#083b3b';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(toast.text,W/2,90);
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
