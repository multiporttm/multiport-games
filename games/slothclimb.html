<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2f1a;display:block;border-radius:8px;touch-action:none}
#hud{color:#e6ffd8;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sloth Climb</div>
  <div class="game-frame">
    <div id="hud"><span>Height: <b id="heightDisp">0</b>m</span><span>Tree: <b id="treeDisp">1</b></span><span>Best: <b id="bestDisp">0</b>m</span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left/Right Arrow</b> keys (or A/D) or tap the <b>left/right side</b> of the screen to reach with each arm. Time each reach as the branch highlights — too early or too late and your sloth slips!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const BEST_KEY='slothclimb_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);
document.getElementById('bestDisp').textContent=best;

// The sloth stays vertically centered on screen; the "camera" (branchOffset) scrolls
// down as branches are climbed, giving the illusion of climbing upward forever across trees.
let height,treeNum,nextArm,branches,armState,armTimer,readyWindowStart,readyWindowEnd,gameOver,started,lastTime,slipShake,sway,climbAnim,particles,branchSpacingBase;

function reset(){
  height=0;
  treeNum=1;
  nextArm='right'; // which arm should reach next
  branches=[];
  branchSpacingBase=90;
  let y=H-80;
  for(let i=0;i<8;i++){
    branches.push({y});
    y-=branchSpacingBase+Math.random()*20;
  }
  armState={left:'idle',right:'idle'}; // idle | reaching | grabbed
  armTimer=0;
  gameOver=false;
  started=false;
  lastTime=null;
  slipShake=0;
  sway=0;
  climbAnim=0;
  particles=[];
  scheduleReachWindow();
}

let windowTimer,windowDuration,windowActive,windowResult;
function scheduleReachWindow(){
  // window gets slightly tighter (but still deliberately slow) as height increases, capped
  windowDuration=Math.max(38,70-Math.floor(height/8));
  windowTimer=0;
  windowActive=false;
  // delay before the window opens, giving player time to prepare (sloths are slow!)
  reachDelay=55+Math.random()*20;
}
let reachDelay=60;

reset();

function attemptReach(side){
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;return;}
  if(side!==nextArm)return; // wrong arm entirely, ignored (must alternate correctly)
  if(!windowActive){
    // too early
    slip('early');
    return;
  }
  const t=windowTimer/windowDuration;
  // perfect window is the middle 55%
  if(t>0.22 && t<0.85){
    succeedReach();
  } else {
    slip('late');
  }
}

function succeedReach(){
  height+=1;
  climbAnim=10;
  SFX.point();
  for(let i=0;i<6;i++)particles.push({x:400,y:H-120,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:20});
  branches.shift();
  let topY=branches.length?branches[branches.length-1].y:H-80;
  branches.push({y:topY-branchSpacingBase-Math.random()*(20+treeNum*4)});
  nextArm=nextArm==='right'?'left':'right';
  if(height>0 && height%15===0){
    treeNum++;
    SFX.levelup();
  }
  if(height>best){best=height;localStorage.setItem(BEST_KEY,String(best));}
  scheduleReachWindow();
}

function slip(reason){
  slipShake=20;
  SFX.hurt();
  gameOver=true;
  started=false;
  SFX.lose();
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){e.preventDefault();attemptReach('left');}
  else if(k==='arrowright'||k==='d'){e.preventDefault();attemptReach('right');}
  else if(!started){started=true;}
  else if(gameOver){reset();started=true;}
});

c.addEventListener('pointerdown',e=>{
  const rect=c.getBoundingClientRect();
  const scale=W/rect.width;
  const mx=(e.clientX-rect.left)*scale;
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;return;}
  attemptReach(mx<W/2?'left':'right');
});

function update(dt){
  sway+=dt*0.03;
  if(climbAnim>0)climbAnim-=dt;
  if(slipShake>0)slipShake-=dt;
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});

  if(reachDelay>0){
    reachDelay-=dt;
    return;
  }
  if(!windowActive){
    windowActive=true;
    windowTimer=0;
  } else {
    windowTimer+=dt;
    if(windowTimer>=windowDuration){
      // missed the window entirely -> slip
      slip('missed');
    }
  }
}

function drawSloth(){
  const cx=400,cy=H-140+Math.sin(sway)*3-climbAnim;
  ctx.save();
  ctx.translate(cx,cy);
  // arms
  const leftUp=nextArm==='left';
  const rightUp=nextArm==='right';
  ctx.strokeStyle='#8a6a4a';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-14,-6);ctx.lineTo(leftUp?-40:-26,leftUp?-46:-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(rightUp?40:26,rightUp?-46:-2);ctx.stroke();
  // body
  ctx.fillStyle='#a5825b';
  ctx.beginPath();ctx.ellipse(0,10,26,32,0,0,Math.PI*2);ctx.fill();
  // face patch
  ctx.fillStyle='#e8dcc8';
  ctx.beginPath();ctx.ellipse(0,-14,16,14,0,0,Math.PI*2);ctx.fill();
  // eye patches
  ctx.fillStyle='#5a4632';
  ctx.beginPath();ctx.ellipse(-7,-14,5,7,0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(7,-14,5,7,-0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(-7,-13,2,0,Math.PI*2);ctx.arc(7,-13,2,0,Math.PI*2);ctx.fill();
  // smile
  ctx.strokeStyle='#5a4632';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-8,5,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  // legs
  ctx.strokeStyle='#8a6a4a';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(-10,34);ctx.lineTo(-16,54);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,34);ctx.lineTo(16,54);ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.save();
  if(slipShake>0)ctx.translate((Math.random()-0.5)*slipShake,(Math.random()-0.5)*slipShake);
  ctx.clearRect(-15,-15,W+30,H+30);
  const bg=ctx.createLinearGradient(0,0,0,H);
  const hue1=[135,206,235],hue2=[70,140,80];
  const mix=Math.min(1,treeNum/8);
  bg.addColorStop(0,`rgb(${lerp(hue1[0],40,mix)},${lerp(hue1[1],60,mix)},${lerp(hue1[2],90,mix)})`);
  bg.addColorStop(1,'#1a2f1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // tree trunk
  ctx.fillStyle='#4a3624';
  ctx.fillRect(370,-20,60,H+40);
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(370,-20,10,H+40);

  // branches, offset so climbing feels like moving up: we keep sloth fixed and move branch list downward as they scroll
  const camY=H-140; // sloth screen y anchor
  branches.forEach((b,i)=>{
    const y=b.y;
    ctx.fillStyle='#5a4530';
    const left=i%2===0;
    if(left){ctx.fillRect(300,y-8,80,16);}else{ctx.fillRect(420,y-8,80,16);}
    ctx.fillStyle='#3f8a3f';
    ctx.beginPath();ctx.arc(left?300:500,y,18,0,Math.PI*2);ctx.fill();
  });

  drawSloth();

  particles.forEach(p=>{
    ctx.fillStyle=`rgba(255,213,79,${Math.max(0,p.life/20)})`;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });

  // reach timing meter
  if(started&&!gameOver){
    const barX=W/2-100,barY=40,barW=200,barH=18;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(barX,barY,barW,barH);
    if(reachDelay>0){
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.font='16px Arial';ctx.textAlign='center';
      ctx.fillText(I18N.t('sloth_getready','Get ready...'),W/2,barY-8);
    } else {
      const t=Math.min(1,windowTimer/windowDuration);
      // sweet spot indicator
      ctx.fillStyle='rgba(80,220,80,0.5)';
      ctx.fillRect(barX+barW*0.22,barY,barW*(0.85-0.22),barH);
      ctx.fillStyle='#ffd54f';
      ctx.fillRect(barX+barW*t-2,barY-4,4,barH+8);
      ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
      ctx.fillText(nextArm==='left'?I18N.t('sloth_left','Press LEFT'):I18N.t('sloth_right','Press RIGHT'),W/2,barY-8);
    }
  }

  if(!started&&!gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sloth_start','Press a key or tap to begin climbing'),W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sloth_fell','YOU SLIPPED!'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+10);
  }
  ctx.restore();

  document.getElementById('heightDisp').textContent=height;
  document.getElementById('treeDisp').textContent=treeNum;
  document.getElementById('bestDisp').textContent=best;
}

function lerp(a,b,t){return Math.round(a+(b-a)*t);}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(started&&!gameOver)update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
