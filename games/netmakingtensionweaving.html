<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#20384a;display:block;border-radius:8px}
#score-display{color:#e8c99a;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Net Making Tension Weaving</div>
  <div class="game-frame">
    <div id="score-display">Rows: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, <b>Click</b>, or <b>Tap</b> to pull the twine tighter, release to ease it. Keep the tension gauge inside the safe zone while weaving each row — too loose and the mesh sags, too tight and it puckers. Nets grow larger every round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
let round=1,row=0,rowsNeeded=4,score=0,hi=0;
let tension=0.5,target=0.5,pulling=false;
let safeLo=0.4,safeWidth=0.22;
let progress=0,rowSpeed=0.0028;
let state='ready';
let weavePx=[];
let flashTimer=0,flashColor='';
let shakeTimer=0;
let holdOutside=0;
let lastTime=null;

try{hi=parseFloat(localStorage.getItem('netmakingtensionweaving_hi'))||0;}catch(e){hi=0;}

function initRound(){
  rowsNeeded=3+round;
  row=0;
  startRow();
}
function startRow(){
  tension=0.5;
  progress=0;
  rowSpeed=0.0022+round*0.00035+row*0.00015;
  safeWidth=Math.max(0.16,0.42-round*0.02-row*0.01);
  safeLo=Math.random()*(1-safeWidth-0.1)+0.05;
  holdOutside=0;
  weavePx=[];
  state='playing';
}
function resetGame(){round=1;score=0;initRound();state='playing';}

function setPulling(v){
  if(state==='gameover'||state==='ready'){ if(v){resetGame();SFX.click();} return;}
  pulling=v;
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPulling(true);}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();setPulling(false);}});
c.addEventListener('mousedown',()=>setPulling(true));
c.addEventListener('mouseup',()=>setPulling(false));
c.addEventListener('mouseleave',()=>setPulling(false));
c.addEventListener('touchstart',e=>{e.preventDefault();setPulling(true);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();setPulling(false);},{passive:false});

function drawFrame(){
  ctx.fillStyle='#5a4631';
  ctx.fillRect(20,40,14,H-150);
  ctx.fillRect(W-34,40,14,H-150);
  ctx.fillRect(20,40,W-54,10);
}

function drawNetRows(){
  for(let r=0;r<row;r++){
    const ry=70+r*26;
    ctx.strokeStyle='#8fb4c7';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=40;x<=W-40;x+=20){
      ctx.moveTo(x,ry);
      ctx.lineTo(x+10,ry+12);
      ctx.lineTo(x+20,ry);
    }
    ctx.stroke();
  }
}

function drawCurrentWeave(){
  const ry=70+row*26;
  const px=40+(W-80)*progress;
  ctx.strokeStyle='#e8c99a';
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let x=40;x<px;x+=20){
    const amp=6+(tension-0.5)*10;
    ctx.moveTo(x,ry);
    ctx.lineTo(Math.min(x+10,px),ry+amp);
    ctx.lineTo(Math.min(x+20,px),ry);
  }
  ctx.stroke();
  // needle/shuttle marker
  ctx.save();
  ctx.translate(px,ry);
  ctx.fillStyle='#d9d9e0';
  ctx.fillRect(-4,-14,8,28);
  ctx.restore();
}

function drawGauge(){
  const gx=60,gy=H-70,gw=W-120,gh=28;
  ctx.fillStyle='#0f2430';
  ctx.fillRect(gx,gy,gw,gh);
  // safe zone
  ctx.fillStyle='rgba(111,224,138,0.35)';
  ctx.fillRect(gx+safeLo*gw,gy,safeWidth*gw,gh);
  ctx.strokeStyle='#6fe08a';
  ctx.strokeRect(gx+safeLo*gw,gy,safeWidth*gw,gh);
  // needle
  const nx=gx+tension*gw;
  const inSafe=tension>=safeLo&&tension<=safeLo+safeWidth;
  ctx.fillStyle=inSafe?'#6fe08a':'#e94560';
  ctx.fillRect(nx-3,gy-8,6,gh+16);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
  ctx.fillStyle='#ccc';ctx.font='13px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('tension_loose','SLACK'),gx,gy-12);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('tension_tight','TAUT'),gx+gw,gy-12);
}

function draw(){
  let ox=0,oy=0;
  if(shakeTimer>0){ox=(Math.random()-0.5)*8;oy=(Math.random()-0.5)*8;shakeTimer--;}
  ctx.save();
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#142c3c');bg.addColorStop(1,'#20384a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.translate(ox,oy);

  drawFrame();
  drawNetRows();
  if(state==='playing'||state==='rowclear')drawCurrentWeave();
  if(state!=='ready')drawGauge();

  if(flashTimer>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flashTimer/28*0.35;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    flashTimer--;
  }

  ctx.textAlign='center';
  if(state==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('tension_start_hint','Hold Space / Click / Tap to pull the twine taut'),W/2,H/2);
  }
  if(state==='rowclear'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('tension_row_clear','Row woven!'),W/2,H/2);
  }
  if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('tension_failed','MESH RUINED!'),W/2,H/2-14);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tension_restart','Tap / Space to try again'),W/2,H/2+22);
  }
  ctx.restore();

  document.getElementById('score-display').textContent=
    I18N.t('tension_score_label','Rows: {s} | Round: {r} | Hi: {h}')
      .replace('{s}',score).replace('{r}',round).replace('{h}',Math.floor(hi));
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;
  if(state==='playing'){
    tension+=(pulling?0.012:-0.010)*dt;
    tension=Math.max(0,Math.min(1,tension));
    progress+=rowSpeed*dt;
    const inSafe=tension>=safeLo&&tension<=safeLo+safeWidth;
    if(!inSafe){
      holdOutside+=dt;
      if(holdOutside>42){
        flashTimer=16;flashColor='#e94560';shakeTimer=14;SFX.hurt();
        state='slipped';
        setTimeout(()=>{
          if(score>hi){hi=score;try{localStorage.setItem('netmakingtensionweaving_hi',String(hi));}catch(e){}}
          state='gameover';SFX.lose();
        },500);
      }
    } else {
      holdOutside=Math.max(0,holdOutside-dt*1.5);
    }
    if(progress>=1&&state==='playing'){
      row++;score++;
      flashTimer=24;flashColor='#6fe08a';SFX.point();
      state='rowclear';
      setTimeout(()=>{
        if(row>=rowsNeeded){round++;SFX.levelup();initRound();}
        else startRow();
      },550);
    }
  }
  draw();
  requestAnimationFrame(loop);
}
state='ready';
draw();
requestAnimationFrame(loop);
</script></body></html>
