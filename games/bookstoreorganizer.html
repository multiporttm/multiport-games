<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:#3b2a1e;border-radius:14px;padding:16px;text-align:center;max-width:640px;margin:0 auto}
#status{color:#fff;font-size:1rem;font-weight:700;margin:4px 0;min-height:1.5em}
#shelves{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.shelf{background:#5a3d28;border:3px solid #7a5838;border-radius:8px;padding:10px 4px;color:#fff;font-weight:800;font-size:.85rem;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .15s}
.shelf:hover{transform:translateY(-2px)}
.shelf.flash-correct{box-shadow:0 0 0 4px #4caf50}
.shelf.flash-wrong{box-shadow:0 0 0 4px #e94560}
#cart{background:#2a1c12;border-radius:10px;padding:12px;min-height:100px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.book{width:44px;height:60px;border-radius:4px 4px 2px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;font-weight:900;box-shadow:2px 2px 4px rgba(0,0,0,.4);transition:transform .1s;border:2px solid rgba(255,255,255,.25)}
.book:hover{transform:translateY(-4px)}
.book.selected{outline:3px solid #ffd54f;transform:translateY(-6px)}
#stats{color:#e8d9c5;font-size:1rem;font-weight:700;margin:8px 0}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bookstore Organizer</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="stats">Shelved: 0 | Misses: 0/8 | Best: 0</div>
      <div id="status">Click a book, then click its matching shelf</div>
      <div id="shelves"></div>
      <div id="cart"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click a <b>book</b> on the cart, then click the <b>shelf</b> with the matching genre label to shelve it correctly. Wrong shelf or an overflowing cart counts as a miss — <b>8 misses</b> ends the game!</div>
</div>
<script>
const GENRES=[
  {id:'mystery',label:'Mystery',color:'#3a3a6e'},
  {id:'romance',label:'Romance',color:'#a13d63'},
  {id:'scifi',label:'Sci-Fi',color:'#1f6f5c'},
  {id:'fantasy',label:'Fantasy',color:'#5e3aa1'},
  {id:'history',label:'History',color:'#8a5a2e'},
  {id:'horror',label:'Horror',color:'#2b2b2b'},
];
const SHELF_COUNT=4;

let cart=[],selectedIdx=null,shelved=0,misses=0,best=parseInt(localStorage.getItem('bookstoreorganizer_best')||'0',10);
let gameOver=false,activeGenres=[],cartMax=6,spawnTimer=null;

function pickActiveGenres(){
  const shuffled=[...GENRES].sort(()=>Math.random()-0.5);
  activeGenres=shuffled.slice(0,SHELF_COUNT);
}

function renderShelves(){
  const el=document.getElementById('shelves');
  el.innerHTML='';
  activeGenres.forEach(g=>{
    const d=document.createElement('div');
    d.className='shelf';
    d.style.background=g.color;
    d.textContent=g.label;
    d.dataset.genre=g.id;
    d.onclick=()=>onShelfClick(g.id,d);
    el.appendChild(d);
  });
}

function spawnBook(){
  if(gameOver)return;
  const g=activeGenres[Math.floor(Math.random()*activeGenres.length)];
  cart.push({genre:g.id,color:g.color,label:g.label[0]});
  if(cart.length>cartMax){
    // overflow
    cart.shift();
    registerMiss(I18N.t('bo_overflow','Cart overflowed!'));
  }
  renderCart();
}

function renderCart(){
  const el=document.getElementById('cart');
  el.innerHTML='';
  cart.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='book'+(i===selectedIdx?' selected':'');
    d.style.background=b.color;
    d.textContent=b.label;
    d.onclick=()=>onBookClick(i);
    el.appendChild(d);
  });
}

function onBookClick(i){
  if(gameOver)return;
  selectedIdx=(selectedIdx===i)?null:i;
  renderCart();
}

function onShelfClick(genreId,el){
  if(gameOver)return;
  if(selectedIdx===null){
    setStatus(I18N.t('bo_pick_book','Pick a book from the cart first!'));
    return;
  }
  const book=cart[selectedIdx];
  if(book.genre===genreId){
    cart.splice(selectedIdx,1);
    selectedIdx=null;
    shelved++;
    SFX.point();
    flashShelf(el,true);
    setStatus(I18N.t('bo_correct','Shelved correctly!'));
    if(shelved>0 && shelved%5===0){
      cartMax=Math.min(10,cartMax+1);
    }
  }else{
    registerMiss(I18N.t('bo_wrong','Wrong shelf!'));
    flashShelf(el,false);
    selectedIdx=null;
  }
  renderCart();
  updateStats();
}

function flashShelf(el,correct){
  el.classList.add(correct?'flash-correct':'flash-wrong');
  setTimeout(()=>el.classList.remove(correct?'flash-correct':'flash-wrong'),300);
}

function registerMiss(msg){
  misses++;
  SFX.error();
  setStatus(msg);
  updateStats();
  if(misses>=8)endGame();
}

function setStatus(t){document.getElementById('status').textContent=t;}

function updateStats(){
  document.getElementById('stats').textContent=
    I18N.t('bo_stats_label','Shelved: {s} | Misses: {m}/8 | Best: {b}')
      .replace('{s}',shelved).replace('{m}',misses).replace('{b}',best);
}

function endGame(){
  gameOver=true;
  clearInterval(spawnTimer);
  if(shelved>best){best=shelved;localStorage.setItem('bookstoreorganizer_best',best);}
  setStatus(I18N.t('bo_game_over','Game Over! Click New Game to try again.'));
  SFX.lose();
  const newBtnWrap=document.getElementById('cart');
  newBtnWrap.innerHTML='';
  const btn=document.createElement('button');
  btn.textContent=I18N.t('bo_new_game','New Game');
  btn.style.cssText='padding:10px 24px;background:#e94560;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem';
  btn.onclick=startGame;
  newBtnWrap.appendChild(btn);
  updateStats();
}

let spawnInterval=2600;

function tickSpawn(){
  clearInterval(spawnTimer);
  spawnTimer=setInterval(()=>{
    if(gameOver)return;
    spawnBook();
    spawnInterval=Math.max(900,spawnInterval-40);
    tickSpawn();
  },spawnInterval);
}

function startGame(){
  pickActiveGenres();
  cart=[];selectedIdx=null;shelved=0;misses=0;gameOver=false;cartMax=6;spawnInterval=2600;
  renderShelves();
  renderCart();
  updateStats();
  setStatus(I18N.t('bo_intro','Click a book, then click its matching shelf'));
  clearInterval(spawnTimer);
  tickSpawn();
  spawnBook();
}

startGame();
</script></body></html>
