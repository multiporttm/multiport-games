<style>
body{background:#08080f}
#c{background:#3a2418;display:block;border-radius:8px}
#score-display{color:#e8b873;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wig Making Wefting</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> each time the sliding needle enters the green <b>safe zone</b> on the stitch gauge to sew a stitch. Land every stitch in the zone with even rhythm to finish the weft without bunches or gaps. Longer, trickier wefts await each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const HI_KEY='wigmakingwefting_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,score=0,gameOver=false,started=false,won=false;

// Track/gauge mechanics
let trackLen, stitchesNeeded, stitchesDone, stitchSpacing=[];
let needleX, needleSpeed, needleDir=1;
let safeZoneCenter, safeZoneHalf;
let misses=0, maxMisses=3;
let flashTimer=0, flashColor='';
let wefts=[]; // completed hair stitches drawn on the track (x position, quality)
let message='', messageTimer=0;
let particles=[];

function setupRound(){
  trackLen=Math.min(560,220+round*40);
  stitchesNeeded=Math.min(14,5+round);
  stitchesDone=0;
  stitchSpacing=[];
  wefts=[];
  needleX=0;
  needleSpeed=2.2+round*0.18;
  needleDir=1;
  safeZoneHalf=Math.max(14,34-round*2);
  safeZoneCenter=W/2;
  misses=0;
  message=I18N.t('round_start','Round {r} — sew a longer weft!').replace('{r}',round);
  messageTimer=90;
}

function reset(){
  round=1;score=0;gameOver=false;started=false;won=false;
  setupRound();
}
reset();

function fireStitch(){
  if(!started){started=true;return;}
  if(gameOver){ reset(); return; }
  const dist=Math.abs(needleX-safeZoneCenter);
  stitchesDone++;
  if(dist<=safeZoneHalf){
    const quality=1-(dist/safeZoneHalf);
    score+=Math.round(10+quality*15);
    wefts.push({pos:stitchesDone/stitchesNeeded, quality});
    SFX.success();
    flashColor='#8be38b';flashTimer=12;
    spawnParticles(true);
  } else {
    misses++;
    wefts.push({pos:stitchesDone/stitchesNeeded, quality:0});
    SFX.error();
    flashColor='#e36b6b';flashTimer=12;
    spawnParticles(false);
    if(misses>=maxMisses){
      gameOver=true;
      SFX.lose();
      message=I18N.t('too_many_misses','Too many misses — weft ruined!');
      messageTimer=200;
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      return;
    }
  }
  if(stitchesDone>=stitchesNeeded){
    SFX.levelup();
    score+=40;
    message=I18N.t('weft_complete','Weft complete! Next round...');
    messageTimer=90;
    round++;
    setTimeout(()=>{ if(!gameOver) setupRound(); },800);
  }
  // randomize zone a bit for next stitch, keep within margins
  safeZoneCenter=120+Math.random()*(W-240);
}

function spawnParticles(good){
  for(let i=0;i<10;i++){
    particles.push({
      x:needleX,y:150,
      vx:(Math.random()-0.5)*4,
      vy:-2-Math.random()*3,
      life:30,
      color: good? '#f0c987' : '#555'
    });
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fireStitch();}});
c.addEventListener('mousedown',fireStitch);
c.addEventListener('touchstart',e=>{e.preventDefault();fireStitch();},{passive:false});

function drawGauge(){
  const gy=150;
  // rail
  ctx.fillStyle='#5a3b26';
  ctx.fillRect(60,gy-6,W-120,12);
  // safe zone
  ctx.fillStyle='rgba(120,220,130,0.35)';
  ctx.fillRect(safeZoneCenter-safeZoneHalf,gy-16,safeZoneHalf*2,32);
  ctx.strokeStyle='#8be38b';ctx.lineWidth=2;
  ctx.strokeRect(safeZoneCenter-safeZoneHalf,gy-16,safeZoneHalf*2,32);
  // needle
  ctx.save();
  ctx.translate(needleX,gy);
  ctx.fillStyle='#d8d8e0';
  ctx.beginPath();
  ctx.moveTo(0,-30);ctx.lineTo(4,20);ctx.lineTo(-4,20);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ccc';
  ctx.beginPath();ctx.arc(0,-32,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawWeftTrack(){
  const ty=220, tx0=100, tx1=W-100;
  ctx.strokeStyle='#8a5a37';
  ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(tx0,ty);ctx.lineTo(tx1,ty);ctx.stroke();
  for(let i=0;i<wefts.length;i++){
    const wf=wefts[i];
    const x=tx0+wf.pos*(tx1-tx0);
    const len=10+wf.quality*20;
    const hue = wf.quality>0 ? `hsl(${28+wf.quality*10},${55+wf.quality*20}%,${35+wf.quality*25}%)` : '#333';
    ctx.strokeStyle=hue;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x,ty-len/2);
    ctx.lineTo(x,ty+len/2);
    ctx.stroke();
  }
}

function drawBench(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1810');bg.addColorStop(1,'#4a2f1c');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<W;i+=40)ctx.fillRect(i,0,1,H);
}

function drawParticles(dt){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.15*dt;p.life-=dt;
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  });
  ctx.globalAlpha=1;
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('wefting_status','Round: {r} | Score: {s} | Hi: {h}')
      .replace('{r}',round).replace('{s}',score).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  ctx.clearRect(0,0,W,H);
  drawBench();

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!started){
    drawGauge();
    drawWeftTrack();
    ctx.fillStyle='#f0c987';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_weft','Tap / Space to begin sewing'),W/2,70);
    requestAnimationFrame(loop);
    return;
  }

  if(!gameOver){
    needleX+=needleSpeed*needleDir*dt;
    if(needleX>W-80){needleX=W-80;needleDir=-1;}
    if(needleX<80){needleX=80;needleDir=1;}
  }

  drawGauge();
  drawWeftTrack();
  drawParticles(dt);

  // progress bar
  ctx.fillStyle='#222';ctx.fillRect(100,255,W-200,14);
  ctx.fillStyle='#e8b873';ctx.fillRect(100,255,(W-200)*(stitchesDone/stitchesNeeded),14);
  ctx.strokeStyle='#8a5a37';ctx.strokeRect(100,255,W-200,14);

  // misses indicator
  ctx.textAlign='left';ctx.font='16px Arial';ctx.fillStyle='#e36b6b';
  ctx.fillText(I18N.t('misses_label','Misses: {m}/{x}').replace('{m}',misses).replace('{x}',maxMisses),20,280);

  if(flashTimer>0){
    flashTimer-=dt;
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=0.15*(flashTimer/12);
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  if(messageTimer>0){
    messageTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(message,W/2,45);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,130);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,168);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
