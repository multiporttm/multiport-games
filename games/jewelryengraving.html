<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1c1c24;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#score-display{color:#cfd8ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Jewelry Engraving</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and drag (or use <b>Arrow Keys</b>) to move the engraving burin along the glowing pattern line. Stay on the line — slipping off costs a life. Reach the end of each design to advance; the patterns get more intricate each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=360;
const scoreDisplay=document.getElementById('score-display');
const HI_KEY='jewelryengraving_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,lives=3,level=1,gameOver=false,won=false,started=false;

function genPath(lvl){
  // Build a smooth curved monogram-like path using layered sine curves; complexity scales with level.
  const pts=[];
  const n=220+lvl*10;
  const cx=W/2,cy=H/2;
  const baseR=90+ (lvl%3)*10;
  const waves=2+Math.floor(lvl/2);
  const wobble=6+Math.min(26,lvl*2);
  for(let i=0;i<=n;i++){
    const t=i/n*Math.PI*2;
    const r=baseR+Math.sin(t*waves)*wobble+Math.cos(t*(waves+1)+lvl)*wobble*0.5;
    pts.push({x:cx+Math.cos(t)*r,y:cy+Math.sin(t)*r*0.72});
  }
  return pts;
}

let path,pathIdx,tolerance,cursor,progress,levelTime,timeLeft;
function newLevel(){
  path=genPath(level);
  pathIdx=0;
  tolerance=Math.max(9,24-level*1.2);
  cursor={x:path[0].x,y:path[0].y};
  progress=0;
  levelTime=Math.max(16,30-level);
  timeLeft=levelTime;
}
newLevel();

let keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  started=true;
  if(e.code==='Space'&&gameOver)resetGame();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

let dragging=false;
function toCanvasCoords(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*scaleX,y:(clientY-rect.top)*scaleY};
}
function pointerDown(e){
  e.preventDefault();
  if(gameOver){resetGame();return;}
  started=true;dragging=true;
  const p=toCanvasCoords(e);cursor.x=p.x;cursor.y=p.y;
}
function pointerMove(e){
  if(!dragging)return;
  e.preventDefault();
  const p=toCanvasCoords(e);cursor.x=p.x;cursor.y=p.y;
}
function pointerUp(){dragging=false;}
c.addEventListener('pointerdown',pointerDown);
c.addEventListener('pointermove',pointerMove);
window.addEventListener('pointerup',pointerUp);
c.addEventListener('touchstart',pointerDown,{passive:false});
c.addEventListener('touchmove',pointerMove,{passive:false});
c.addEventListener('touchend',pointerUp);

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;
  newLevel();
}

function loseLife(){
  lives--;
  SFX.hit();
  if(lives<=0){
    gameOver=true;won=false;SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  }else{
    // restart same level attempt
    pathIdx=0;progress=0;cursor={x:path[0].x,y:path[0].y};
    timeLeft=levelTime;
  }
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1c1c24';ctx.fillRect(0,0,W,H);

  // Ring/metal plate backdrop
  ctx.save();
  ctx.translate(W/2,H/2);
  const grad=ctx.createRadialGradient(0,0,10,0,0,170);
  grad.addColorStop(0,'#3a3a44');grad.addColorStop(1,'#15151a');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(0,0,165,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(started&&!gameOver){
    timeLeft-=dt;
    if(keys['ArrowUp'])cursor.y-=160*dt;
    if(keys['ArrowDown'])cursor.y+=160*dt;
    if(keys['ArrowLeft'])cursor.x-=160*dt;
    if(keys['ArrowRight'])cursor.x+=160*dt;

    // advance pathIdx to the closest point ahead within reach, enforcing forward progress
    let advanced=false;
    for(let look=pathIdx;look<Math.min(path.length,pathIdx+10);look++){
      if(dist(cursor,path[look])<=tolerance){pathIdx=look;advanced=true;}
    }
    if(!advanced&&dist(cursor,path[pathIdx])>tolerance*1.8){
      loseLife();
    }
    progress=pathIdx/(path.length-1);

    if(timeLeft<=0){
      loseLife();
    } else if(pathIdx>=path.length-1){
      const bonus=Math.floor(timeLeft*15)+150+level*10;
      score+=bonus;
      SFX.success();
      level++;
      if(level>12){
        gameOver=true;won=true;SFX.win();
        if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      }else{
        newLevel();
      }
    }
  }

  // draw path: engraved groove with tolerance band
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(255,215,120,0.18)';
  ctx.lineWidth=tolerance*2;
  ctx.beginPath();
  path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
  ctx.stroke();

  // completed portion glows gold, remaining is dim silver
  ctx.lineWidth=4;
  ctx.strokeStyle='#777';
  ctx.beginPath();
  path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
  ctx.stroke();
  ctx.strokeStyle='#ffd54f';
  ctx.shadowColor='#ffd54f';ctx.shadowBlur=8;
  ctx.beginPath();
  for(let i=0;i<=pathIdx;i++){const p=path[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
  ctx.stroke();
  ctx.shadowBlur=0;

  // burin cursor
  ctx.fillStyle=dist(cursor,path[Math.min(pathIdx,path.length-1)])<=tolerance?'#39d353':'#e94560';
  ctx.beginPath();ctx.arc(cursor.x,cursor.y,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

  // HUD
  ctx.textAlign='left';ctx.font='16px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('level_label','Design {n}').replace('{n}',level),16,24);
  ctx.fillText('❤️'.repeat(Math.max(0,lives)),16,48);
  ctx.fillStyle=timeLeft<5?'#ff5555':'#fff';
  ctx.fillText(I18N.t('time_label','Time: {t}s').replace('{t}',Math.max(0,timeLeft).toFixed(1)),16,72);
  ctx.textAlign='right';ctx.fillStyle='#ffd54f';
  ctx.fillText(Math.floor(progress*100)+'%',W-16,24);

  if(!started){
    ctx.textAlign='center';ctx.fillStyle='#ffd54f';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('start_hint','Drag or use arrow keys to trace the line'),W/2,H-16);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.font='bold 36px Arial';
    ctx.fillText(won?I18N.t('win_title','MASTER ENGRAVER!'):I18N.t('game_over_title','SLIPPED!'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+20);
  }

  scoreDisplay.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
