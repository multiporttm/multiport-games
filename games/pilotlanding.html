<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Pilot Landing</title><meta name="description" content="Play Pilot Landing free online — Guide your plane onto the runway, matching altitude, angle and speed for a smooth touchdown before you run out of fuel or lives."><link rel="canonical" href="https://games.multiportllc.com/games/pilotlanding"><meta property="og:title" content="Pilot Landing - Multiport Games"><meta property="og:description" content="Play Pilot Landing free online — Guide your plane onto the runway, matching altitude, angle and speed for a smooth touchdown before you run out of fuel or lives."><meta property="og:url" content="https://games.multiportllc.com/games/pilotlanding"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Pilot Landing","description":"Play Pilot Landing free online instantly. Guide your plane onto the runway, matching altitude, angle and speed for a smooth touchdown before you run out of fuel or lives. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/pilotlanding","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2a4a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ecbff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pilot Landing</div>
  <div class="game-frame">
    <div id="score-display">Landings: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>W/S</b> (or <b>touch-drag</b>) to adjust altitude and glide angle. Line up with the runway and land smooth, centered and at the right speed. A bad landing costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const groundY=340;
const runway={x:500,w:220};
let landings=0,lives=3,hi=0,gameOver=false,started=false,crashed=false,justLanded=false;
hi=parseInt(localStorage.getItem('pilotlanding_hi')||'0',10);

let plane,wind,resultMsg='',resultColor='#fff';

function resetPlane(){
  plane={
    x:80,y:120+Math.random()*40,
    vx:3.2,vy:0.3,
    angle:2, // degrees, glide angle (positive = descending)
  };
  wind=(Math.random()-0.5)*0.02;
  crashed=false;justLanded=false;resultMsg='';
}

function newAttempt(){
  resetPlane();
}

let keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS'].includes(e.code))e.preventDefault();
  if(!started){started=true;}
  if((crashed||justLanded)&&(e.code==='Space'||e.code==='Enter')){newAttempt();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let touchStartY=null,touchActive=false;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;}
  if(crashed||justLanded){newAttempt();return;}
  touchStartY=e.touches[0].clientY;touchActive=true;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!touchActive||touchStartY==null)return;
  const dy=e.touches[0].clientY-touchStartY;
  plane.angle+=dy*0.01;
  touchStartY=e.touches[0].clientY;
},{passive:false});
c.addEventListener('touchend',e=>{touchActive=false;touchStartY=null;});
c.addEventListener('click',()=>{
  if(!started){started=true;}
  if(crashed||justLanded)newAttempt();
});

function drawRunway(){
  ctx.fillStyle='#2f3b2f';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#555';
  ctx.fillRect(runway.x,groundY,runway.w,H-groundY);
  // stripes
  ctx.fillStyle='#fff';
  for(let i=0;i<7;i++){
    ctx.fillRect(runway.x+15+i*30,groundY+6,16,5);
  }
  // markers
  ctx.strokeStyle='#ffca28';
  ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(runway.x,groundY);ctx.lineTo(runway.x,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(runway.x+runway.w,groundY);ctx.lineTo(runway.x+runway.w,0);ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlane(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle*Math.PI/180);
  ctx.fillStyle='#e0e0e0';
  ctx.beginPath();
  ctx.moveTo(30,0);ctx.lineTo(-25,-8);ctx.lineTo(-15,0);ctx.lineTo(-25,8);
  ctx.closePath();ctx.fill();
  // wings
  ctx.fillStyle='#90a4ae';
  ctx.fillRect(-8,-18,14,36);
  // tail
  ctx.fillStyle='#78909c';
  ctx.beginPath();
  ctx.moveTo(-15,-2);ctx.lineTo(-28,-14);ctx.lineTo(-20,-2);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawHud(){
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font='13px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('pl_alt','Alt: {a}').replace('{a}',Math.max(0,Math.round(groundY-plane.y))),10,20);
  ctx.fillText(I18N.t('pl_speed','Speed: {s}').replace('{s}',plane.vx.toFixed(1)),10,38);
  ctx.fillText(I18N.t('pl_angle','Angle: {g}°').replace('{g}',plane.angle.toFixed(1)),10,56);
}

function evaluateLanding(){
  const centerX=runway.x+runway.w/2;
  const offCenter=Math.abs(plane.x-centerX);
  const speedOk=Math.abs(plane.vx-3.0);
  const angleAbs=Math.abs(plane.angle);
  const onRunway=plane.x>runway.x-10&&plane.x<runway.x+runway.w+10;
  const vyAbs=Math.abs(plane.vy);

  if(!onRunway||angleAbs>18||vyAbs>3.2||plane.vx>6.5){
    return {ok:false};
  }
  // scoring: smooth = low vy, centered, angle small, speed near 3
  let score=100;
  score-=offCenter*0.4;
  score-=angleAbs*2.5;
  score-=vyAbs*8;
  score-=speedOk*6;
  score=Math.max(0,Math.round(score));
  let grade;
  if(score>=80)grade='perfect';
  else if(score>=55)grade='good';
  else if(score>=30)grade='rough';
  else return {ok:false};
  return {ok:true,score,grade};
}

function crash(){
  crashed=true;
  lives--;
  resultMsg=I18N.t('pl_crash','CRASH! Landing failed.');
  resultColor='#ff6b6b';
  SFX.lose();
  if(lives<=0){gameOver=true;}
}

function land(res){
  justLanded=true;
  landings++;
  if(landings>hi){hi=landings;localStorage.setItem('pilotlanding_hi',hi);}
  if(res.grade==='perfect'){resultMsg=I18N.t('pl_perfect','Perfect landing! +{s}').replace('{s}',res.score);resultColor='#69f0ae';SFX.win();}
  else if(res.grade==='good'){resultMsg=I18N.t('pl_good','Good landing! +{s}').replace('{s}',res.score);resultColor='#a5d6a7';SFX.success();}
  else {resultMsg=I18N.t('pl_rough','Rough landing. +{s}').replace('{s}',res.score);resultColor='#ffd54f';SFX.land();}
}

function update(dt){
  if(!started||crashed||justLanded||gameOver)return;
  if(keys['ArrowUp']||keys['KeyW'])plane.angle-=0.9*dt;
  if(keys['ArrowDown']||keys['KeyS'])plane.angle+=0.9*dt;
  if(keys['ArrowLeft'])plane.vx=Math.max(1,plane.vx-0.04*dt);
  if(keys['ArrowRight'])plane.vx=Math.min(6,plane.vx+0.04*dt);

  plane.angle=Math.max(-30,Math.min(30,plane.angle));
  plane.vy=plane.angle*0.045+wind;
  plane.x+=plane.vx*dt;
  plane.y+=plane.vy*dt;

  if(plane.x>W+40){ // flew off screen without landing
    crash();
    return;
  }

  if(plane.y>=groundY-10){
    plane.y=groundY-10;
    const res=evaluateLanding();
    if(res.ok)land(res);
    else crash();
  }
}

let lastTime=null;
function loop(t){
  if(lastTime===null)lastTime=t;
  const dt=Math.min((t-lastTime)/16.6667,3);
  lastTime=t;

  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#0d1f3c');sky.addColorStop(1,'#3a6ea5');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,groundY);
  drawRunway();

  update(dt);
  drawPlane(plane);
  drawHud();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('pl_start_hint','Press a key or tap to begin final approach'),W/2,100);
  }

  if(crashed||justLanded){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=resultColor;ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,H/2-10);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    if(gameOver){
      ctx.fillText(I18N.t('pl_game_over','GAME OVER — Tap or Space to fly again'),W/2,H/2+26);
    } else {
      ctx.fillText(I18N.t('pl_next_hint','Tap or Space for next approach'),W/2,H/2+26);
    }
  }

  document.getElementById('score-display').textContent=I18N.t('pl_stats','Landings: {n} | Lives: {l} | Best: {h}').replace('{n}',landings).replace('{l}',Math.max(0,lives)).replace('{h}',hi);

  requestAnimationFrame(loop);
}

function fullReset(){
  landings=0;lives=3;gameOver=false;started=false;
  newAttempt();
}

document.addEventListener('keydown',e=>{
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){fullReset();}
});
c.addEventListener('click',()=>{ if(gameOver){fullReset();} });
c.addEventListener('touchstart',()=>{ if(gameOver){fullReset();} });

newAttempt();
requestAnimationFrame(loop);
</script></body></html>
