<style>
body{background:#07120f}
#c{background:#0d1f1a;display:block;border-radius:8px;touch-action:none}
#hud{color:#8be0c6;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#f6c453}
#hud span.hs{color:#7ec850}
#btnRow{display:flex;justify-content:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
#btnRow button{padding:8px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.9rem;color:#fff;background:#1f6b5a}
#btnRow button:active{transform:scale(0.95)}
#waterRow{display:flex;justify-content:center;gap:10px;padding:4px 10px 12px;flex-wrap:wrap}
#waterRow button{padding:10px 20px;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:1.1rem;color:#fff;background:#1a4d5a}
#waterRow button.go{background:#50a090}
#waterRow button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Gin Bottle Proofing</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Batch: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="btnRow"></div>
    <div id="waterRow"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the target <b>gin style</b> and pick its correct <b>bottling proof</b> range (number keys or tap), then use <b>Up/Down Arrow</b> (or the water buttons) to dilute the cask-strength spirit down to the right <b>%ABV</b> before confirming with <b>Bottle!</b>.</div>
</div>
<script>
(function(){
const HS_KEY='gindistillingbottleproofing_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const STYLES=[
  {key:'london-dry',label:'London Dry Gin',spec:'Bottled at 40–47% ABV',range:'40-47',lo:40,hi:47},
  {key:'navy-strength',label:'Navy Strength Gin',spec:'Bottled at 57–58% ABV',range:'57-58',lo:57,hi:58},
  {key:'old-tom',label:'Old Tom Gin',spec:'Bottled at 40–45% ABV',range:'40-45',lo:40,hi:45},
  {key:'sloe-gin',label:'Sloe Gin',spec:'Bottled at 25–30% ABV',range:'25-30',lo:25,hi:30},
  {key:'export-strength',label:'Export Strength Gin',spec:'Bottled at 47–50% ABV',range:'47-50',lo:47,hi:50}
];
const RANGE_POOL=['40-47','57-58','40-45','25-30','47-50','34-36','52-54'];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let style=null,choices=[],resolved=false,phase='pick';
let timeLeft=0,timeLimit=0;
let abv=0,targetLo=0,targetHi=0;
let pickDone=false,waterDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildPickButtons(){
  const el=document.getElementById('btnRow');
  el.innerHTML='';
  document.getElementById('waterRow').innerHTML='';
  choices.forEach((r,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+r+'%';
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onPickGuess(i);});
    el.appendChild(btn);
  });
}

function buildWaterButtons(){
  document.getElementById('btnRow').innerHTML='';
  const el=document.getElementById('waterRow');
  el.innerHTML='';
  const down=document.createElement('button');
  down.textContent=I18N.t('add_water_btn','+ Water');
  down.addEventListener('pointerdown',e=>{e.stopPropagation(); adjustAbv(-1);});
  const up=document.createElement('button');
  up.textContent=I18N.t('add_spirit_btn','+ Spirit');
  up.addEventListener('pointerdown',e=>{e.stopPropagation(); adjustAbv(1);});
  const confirm=document.createElement('button');
  confirm.className='go';
  confirm.textContent=I18N.t('bottle_btn','Bottle!');
  confirm.addEventListener('pointerdown',e=>{e.stopPropagation(); confirmAbv();});
  el.appendChild(down);el.appendChild(confirm);el.appendChild(up);
}

function newRound(){
  timeLimit=Math.max(260,500-level*18);
  timeLeft=timeLimit;
  phase='pick';
  resolved=false;pickDone=false;waterDone=false;
  style=STYLES[Math.floor(Math.random()*STYLES.length)];
  const count=Math.min(RANGE_POOL.length,3+Math.floor(level/2));
  const pool=shuffle(RANGE_POOL.filter(r=>r!==style.range)).slice(0,count-1);
  choices=shuffle([style.range,...pool]);
  abv=60+Math.floor(Math.random()*15);
  targetLo=style.lo;targetHi=style.hi;
  buildPickButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newRound(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('batch_label','Batch: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newRound();
}

function passRound(){
  score+=30*level;SFX.coin();
  if(score>=level*280)levelUp();
  newRound();
}

function onPickGuess(i){
  if(!started||gameOver||phase!=='pick'||resolved)return;
  resolved=true;
  if(choices[i]===style.range){
    SFX.success();
    phase='water';
    resolved=false;
    buildWaterButtons();
  } else {
    failRound();
  }
}

function adjustAbv(dir){
  if(!started||gameOver||phase!=='water'||waterDone)return;
  abv=Math.max(5,Math.min(96,abv+dir*1));
  SFX.click();
}

function confirmAbv(){
  if(!started||gameOver||phase!=='water'||waterDone)return;
  waterDone=true;
  if(abv>=targetLo&&abv<=targetHi){
    SFX.powerup();
    passRound();
  } else {
    failRound();
  }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!started||gameOver){startGame();return;}
    if(phase==='water'&&!waterDone){confirmAbv();}
    return;
  }
  if(!started||gameOver)return;
  if(phase==='pick'){
    const m=e.code.match(/^Digit([1-9])$/);
    if(m){ e.preventDefault(); onPickGuess(parseInt(m[1],10)-1); }
  } else if(phase==='water'){
    if(e.code==='ArrowDown'){ e.preventDefault(); adjustAbv(-1); }
    else if(e.code==='ArrowUp'){ e.preventDefault(); adjustAbv(1); }
  }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
  document.getElementById('btnRow').innerHTML='';
  document.getElementById('waterRow').innerHTML='';
}

function drawBottle(){
  const sx=W/2,sy=190;
  ctx.save();
  ctx.fillStyle='#0d2c23';
  ctx.beginPath();ctx.roundRect(sx-40,sy-100,80,180,14);ctx.fill();
  ctx.strokeStyle='#07120f';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#0a1e18';
  ctx.beginPath();ctx.roundRect(sx-16,sy-140,32,46,6);ctx.fill();
  ctx.restore();
  if(style){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('style_'+style.key,style.label),sx,sy-150);
    ctx.font='15px Arial';ctx.fillStyle='#bfe8d9';
    ctx.fillText(I18N.t('spec_'+style.key,style.spec),sx,sy-170);
  }
  if(phase==='water'){
    ctx.font='16px Arial';ctx.fillStyle='#ffd27d';
    ctx.fillText(I18N.t('target_abv_label','Target: {lo}%–{hi}% ABV').replace('{lo}',targetLo).replace('{hi}',targetHi),sx,sy+100);
    const tx=sx,ty=sy+40;
    ctx.strokeStyle='#ddd';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(tx-150,ty);ctx.lineTo(tx+150,ty);ctx.stroke();
    const px=tx-150+((abv-5)/91)*300;
    ctx.fillStyle='#e94560';
    ctx.beginPath();ctx.arc(px,ty,9,0,Math.PI*2);ctx.fill();
    const loX=tx-150+((targetLo-5)/91)*300;
    const hiX=tx-150+((targetHi-5)/91)*300;
    ctx.fillStyle='rgba(46,204,113,0.5)';
    ctx.fillRect(loX,ty-6,hiX-loX,12);
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';
    ctx.fillText(abv+'% ABV',tx,ty-20);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#07120f');bg.addColorStop(1,'#0d1f1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#8be0c6';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawBottle();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  timeLeft--;
  if(timeLeft<=0){ failRound(); }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(phase==='pick'?I18N.t('pick_style_hint','Pick the matching bottling proof range'):I18N.t('pick_water_hint','Dial in the bottling ABV, then Bottle!'),W/2,30);

  const barW=400,barH=10,barX=W/2-barW/2,barY=44;
  ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
  const frac=Math.max(0,timeLeft/timeLimit);
  ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
  ctx.fillRect(barX,barY,barW*frac,barH);

  drawBottle();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
