<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#4a148c,#ffd54f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Genie Lamp</div>
  <div class="game-frame">
    <div id="score-display">Genies: 0 | Best Precision: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your <b>Mouse</b> or <b>Finger</b> back and forth across the lamp to rub it and build the summon meter. <b>Click/Release</b> when the meter is inside the glowing target zone to summon the genie — too little or too much and it fizzles!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let genies=0,bestPrecision=0;
try{bestPrecision=parseFloat(localStorage.getItem('genielamp_best')||'0');}catch(e){}

const lamp={x:W/2,y:290,w:220,h:110};
let meter=0; // 0-100
let lastX=null,lastDir=0,dirChanges=0;
let targetLo=40,targetHi=60,round=1;
let fizzle=0; // frames of fizzle flash
let summonFlash=0;
let gameOver=false,message='';
let started=false;
let particles=[];

function newTarget(){
  const width=Math.max(8,26-round*1.5);
  const center=20+Math.random()*60;
  targetLo=Math.max(2,center-width/2);
  targetHi=Math.min(98,center+width/2);
}
newTarget();

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return cx*(W/r.width);
}

function isOverLamp(px){
  return px>lamp.x-lamp.w/2-40 && px<lamp.x+lamp.w/2+40;
}

function onMove(e){
  if(gameOver)return;
  started=true;
  const px=pointerPos(e);
  if(lastX!==null && isOverLamp(px)){
    const dx=px-lastX;
    if(Math.abs(dx)>3){
      const dir=dx>0?1:-1;
      if(lastDir!==0 && dir!==lastDir){
        dirChanges++;
        meter+=3.2;
        SFX.tick();
        for(let i=0;i<4;i++)particles.push({x:px,y:lamp.y-40,vx:(Math.random()-0.5)*3,vy:-Math.random()*3-1,life:20});
      }
      lastDir=dir;
    }
  }
  lastX=px;
}

function release(){
  if(gameOver||!started)return;
  if(meter<5){return;} // barely touched, ignore
  if(meter>=targetLo && meter<=targetHi){
    // success — precision score: closeness to center
    const center=(targetLo+targetHi)/2;
    const width=targetHi-targetLo;
    const precision=Math.round(100-Math.abs(meter-center)/(width/2)*40);
    genies++;
    if(precision>bestPrecision){bestPrecision=precision;try{localStorage.setItem('genielamp_best',bestPrecision);}catch(e){}}
    SFX.success();
    message=I18N.t('genie_summoned','Genie summoned! +'+precision);
    summonFlash=40;
    round++;
    newTarget();
  } else {
    SFX.fail();
    message=meter<targetLo?I18N.t('too_little','Not enough rubbing — fizzle!'):I18N.t('too_much','Overfilled — fizzle!');
    fizzle=30;
    round=Math.max(1,round-1);
    newTarget();
  }
  meter=0;dirChanges=0;lastDir=0;lastX=null;
}

c.addEventListener('mousemove',onMove);
c.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
c.addEventListener('mouseup',release);
c.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
c.addEventListener('mousedown',e=>{started=true;});
c.addEventListener('touchstart',e=>{e.preventDefault();started=true;},{passive:false});

function drawLamp(){
  ctx.save();
  ctx.translate(lamp.x,lamp.y);
  // glow if meter building
  if(meter>0){
    const g=ctx.createRadialGradient(0,-30,10,0,-30,120);
    g.addColorStop(0,'rgba(255,213,79,'+Math.min(0.5,meter/150)+')');
    g.addColorStop(1,'rgba(255,213,79,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,-30,120,0,Math.PI*2);ctx.fill();
  }
  // body
  ctx.fillStyle='#c9a227';
  ctx.beginPath();
  ctx.ellipse(0,20,110,45,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#e8c34a';
  ctx.beginPath();
  ctx.ellipse(-20,0,70,35,0,0,Math.PI*2);
  ctx.fill();
  // spout
  ctx.fillStyle='#c9a227';
  ctx.beginPath();
  ctx.moveTo(60,10);ctx.lineTo(130,-15);ctx.lineTo(120,5);ctx.lineTo(65,25);
  ctx.closePath();ctx.fill();
  // lid
  ctx.fillStyle='#e8c34a';
  ctx.beginPath();ctx.arc(-40,-32,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9a227';
  ctx.fillRect(-46,-45,12,10);
  ctx.restore();
}

function drawSmoke(){
  if(summonFlash>0){
    ctx.save();
    ctx.globalAlpha=Math.min(1,summonFlash/40);
    for(let i=0;i<3;i++){
      const g=ctx.createRadialGradient(lamp.x-40,lamp.y-60-i*30,5,lamp.x-40,lamp.y-60-i*30,50);
      g.addColorStop(0,'rgba(180,120,255,0.8)');
      g.addColorStop(1,'rgba(180,120,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(lamp.x-40,lamp.y-60-i*30,50,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

function drawMeter(){
  const mx=60,my=40,mw=W-120,mh=34;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(mx,my,mw,mh);
  // target zone
  ctx.fillStyle='rgba(76,175,80,0.55)';
  ctx.fillRect(mx+mw*(targetLo/100),my,mw*((targetHi-targetLo)/100),mh);
  // meter fill
  const fillColor=meter>targetHi?'#ff5252':'#ffd54f';
  ctx.fillStyle=fillColor;
  ctx.fillRect(mx,my,mw*(Math.min(100,meter)/100),mh);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(mx,my,mw,mh);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('meter_label','Summon Meter'),W/2,my-8);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#2d0a4e');bg.addColorStop(1,'#7a5a12');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawMeter();
  drawSmoke();
  drawLamp();

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.fillStyle='rgba(255,255,255,'+(p.life/20)+')';
    ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
  });

  if(fizzle>0){
    fizzle--;
    ctx.fillStyle='rgba(255,0,0,'+(fizzle/60)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(summonFlash>0)summonFlash--;

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_lamp','Rub the lamp with your mouse or finger!'),W/2,H-30);
  } else if(message){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(message,W/2,H-30);
  }

  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('round_label','Round {r}').replace('{r}',round),20,30);

  document.getElementById('score-display').textContent=
    I18N.t('genie_score_label','Genies: {g} | Best Precision: {b}').replace('{g}',genies).replace('{b}',Math.floor(bestPrecision));

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
