<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#263238;cursor:pointer}
#ui{color:#fff59d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:6px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
#dropBtn{display:block;margin:6px auto;padding:10px 26px;border-radius:10px;background:#fbc02d;color:#212121;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Claw Machine Prize</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Prizes: 0 | Tries left: 5</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
    </div>
    <button id="dropBtn">🎯 DROP</button>
  </div>
  <div class="game-instructions">Left/Right (or the D-pad) to slide the claw. Tap DROP right when it's lined up over a prize — the closer to dead-center, the better your odds of grabbing it. 5 tries per game!</div>
</div>
<script>
const W=360,H=360;
let clawX,prizes,tries,won,state,dropping,dropY;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('clawmachine_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('clawmachine_best',v);}

function init(){
  clawX=W/2;tries=5;won=0;state='play';dropping=false;
  prizes=[];
  for(let i=0;i<5;i++)prizes.push({x:40+i*65,y:H-50,emoji:['🧸','🎁','🚗','⚽','🍩'][i],taken:false});
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')clawX-=20;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')clawX+=20;
});
document.querySelector('#dpad .left').addEventListener('click',()=>clawX-=30);
document.querySelector('#dpad .right').addEventListener('click',()=>clawX+=30);

document.getElementById('dropBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(dropping||tries<=0)return;
  dropping=true;dropY=40;
  SFX.swoosh();
});

function update(){
  if(state!=='play')return;
  clawX=Math.max(30,Math.min(W-30,clawX));

  if(dropping){
    dropY+=6;
    if(dropY>=H-60){
      dropping=false;
      tries--;
      const target=prizes.find(p=>!p.taken&&Math.abs(p.x-clawX)<28);
      if(target){
        target.taken=true;won++;
        SFX.success();
        saveBest(won);
      }else{
        SFX.fail();
      }
      if(tries<=0||prizes.every(p=>p.taken)){
        state='over';
        if(prizes.every(p=>p.taken))SFX.win();
        else SFX.lose();
      }
      updateUI();
    }
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  prizes.forEach(p=>{if(!p.taken)ctx.fillText(p.emoji,p.x,p.y);});

  const cy=dropping?dropY:40;
  ctx.strokeStyle='#90a4ae';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(clawX,0);ctx.lineTo(clawX,cy);ctx.stroke();
  ctx.font='26px Arial';
  ctx.fillText('🦾',clawX,cy);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff59d';ctx.font='bold 26px Arial';
    ctx.fillText(prizes.every(p=>p.taken)?'ALL WON!':'OUT OF TRIES',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Prizes: ${won} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap DROP to play again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Prizes: ${won} | Tries left: ${Math.max(0,tries)}`;
}

init();draw();
</script></body></html>
