<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#4e342e,#a1887f);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffab91;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Earthquake Escape</div>
  <div class="game-frame">
    <div id="score-display">Buildings escaped: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or drag on touch) to move through the shaking building. Dodge falling debris and cracks, then reach the glowing exit before your lives run out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let buildings=0,lives=3,gameOver=false,started=false,frame=0;
const player={x:60,y:H/2,r:14,vx:0,vy:0};
let debris=[],cracks=[],exit={x:W-60,y:H/2,r:26};
let shakeX=0,shakeY=0;
let debrisTimer=0,crackTimer=0,difficulty=1;
let keys={};

function resetPlayer(){player.x=60;player.y=H/2;player.vx=0;player.vy=0;}

function newBuilding(){
  debris=[];cracks=[];
  resetPlayer();
  exit.x=W-60;exit.y=60+Math.random()*(H-120);
  difficulty=1+buildings*0.18;
  debrisTimer=0;crackTimer=0;
}

function reset(){
  buildings=0;lives=3;gameOver=false;started=false;frame=0;
  newBuilding();
}
reset();

function spawnDebris(){
  const size=14+Math.random()*22;
  debris.push({x:100+Math.random()*(W-200),y:-size,w:size,h:size,vy:2.5+Math.random()*2.5*difficulty,rot:Math.random()*Math.PI});
}
function spawnCrack(){
  cracks.push({x:120+Math.random()*(W-240),y:H-40+Math.random()*20,w:40+Math.random()*50,life:260,warn:60});
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!started){started=true;}
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){reset();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let dragging=false,dragStart=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started)started=true;
  if(gameOver){reset();return;}
  dragging=true;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  dragStart={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  const cx=(t.clientX-rect.left)*(W/rect.width);
  const cy=(t.clientY-rect.top)*(H/rect.height);
  const dx=cx-dragStart.x,dy=cy-dragStart.y;
  player.vx=Math.max(-5,Math.min(5,dx/12));
  player.vy=Math.max(-5,Math.min(5,dy/12));
  dragStart={x:cx,y:cy};
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;player.vx=0;player.vy=0;},{passive:false});
c.addEventListener('click',()=>{ if(!started)started=true; if(gameOver)reset(); });

function rectCircle(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.fillStyle='#ffeb3b';
  ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(4,-4,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawDebris(d){
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.rotate(d.rot);
  ctx.fillStyle='#5d4037';
  ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
  ctx.strokeRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.restore();
}

function drawCrack(cr){
  const t=cr.life/260;
  if(cr.life>260-cr.warn){
    ctx.strokeStyle='rgba(255,80,0,'+(0.4+0.4*Math.sin(frame/4))+')';
  } else {
    ctx.strokeStyle='rgba(20,10,5,'+(0.5+0.5*t)+')';
  }
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(cr.x-cr.w/2,H-40);
  ctx.lineTo(cr.x,H-10);
  ctx.lineTo(cr.x+cr.w/2,H-40);
  ctx.stroke();
}

function drawExit(){
  ctx.save();
  const pulse=6+Math.sin(frame/8)*4;
  ctx.shadowColor='#4caf50';ctx.shadowBlur=20+pulse;
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.arc(exit.x,exit.y,exit.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#e8f5e9';
  ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText('EXIT',exit.x,exit.y+4);
  ctx.restore();
}

function loop(){
  frame++;
  shakeX=(Math.random()-0.5)*4*difficulty;
  shakeY=(Math.random()-0.5)*4*difficulty;

  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(shakeX,shakeY);

  // background walls
  ctx.fillStyle='#3e2723';
  ctx.fillRect(-10,0,W+20,20);
  ctx.fillRect(-10,H-20,W+20,20);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key / tap to start'),W/2,H/2);
    drawPlayer();
    ctx.restore();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+18);
    ctx.restore();
    document.getElementById('score-display').textContent=I18N.t('buildings_lives_label','Buildings escaped: {s} | Lives: {h}').replace('{s}',buildings).replace('{h}',Math.max(0,lives));
    requestAnimationFrame(loop);
    return;
  }

  // keyboard movement
  let ax=0,ay=0;
  if(keys['ArrowLeft']||keys['KeyA'])ax-=1;
  if(keys['ArrowRight']||keys['KeyD'])ax+=1;
  if(keys['ArrowUp']||keys['KeyW'])ay-=1;
  if(keys['ArrowDown']||keys['KeyS'])ay+=1;
  if(ax||ay){
    const len=Math.hypot(ax,ay);
    player.vx=(ax/len)*4.2;
    player.vy=(ay/len)*4.2;
  } else if(!dragging){
    player.vx*=0.8;player.vy*=0.8;
  }
  player.x+=player.vx;
  player.y+=player.vy;
  player.x=Math.max(player.r+22,Math.min(W-player.r-22,player.x));
  player.y=Math.max(player.r+22,Math.min(H-player.r-22,player.y));

  // spawn
  debrisTimer++;
  const debrisInterval=Math.max(18,50-difficulty*8);
  if(debrisTimer>=debrisInterval){debrisTimer=0;spawnDebris();}
  crackTimer++;
  if(crackTimer>=90){crackTimer=0;spawnCrack();}

  // update/draw debris
  debris=debris.filter(d=>d.y<H+40);
  debris.forEach(d=>{
    d.y+=d.vy;d.rot+=0.08;
    drawDebris(d);
    if(!gameOver&&rectCircle(d.x-d.w/2,d.y-d.h/2,d.w,d.h,player.x,player.y,player.r)){
      lives--;
      SFX.hit();
      debris=debris.filter(x=>x!==d);
      resetPlayer();
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });

  // update/draw cracks
  cracks=cracks.filter(cr=>cr.life>0);
  cracks.forEach(cr=>{
    cr.life--;
    drawCrack(cr);
    const active=cr.life<=260-cr.warn;
    if(active&&!gameOver&&Math.abs(player.x-cr.x)<cr.w/2&&player.y>H-60){
      lives--;
      SFX.hit();
      cracks=cracks.filter(x=>x!==cr);
      resetPlayer();
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });

  drawExit();
  drawPlayer();

  if(!gameOver&&Math.hypot(player.x-exit.x,player.y-exit.y)<exit.r){
    buildings++;
    SFX.success();
    newBuilding();
  }

  ctx.restore();
  document.getElementById('score-display').textContent=I18N.t('buildings_lives_label','Buildings escaped: {s} | Lives: {h}').replace('{s}',buildings).replace('{h}',Math.max(0,lives));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
