<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1e14;display:block;border-radius:8px;touch-action:none}
#score-display{color:#d9a35c;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff6b6b;font-size:1rem;text-align:center;padding:2px 0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Knife Sheath Stitching</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ❤️❤️❤️</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the needle swing back and forth over each marked hole. Press <b>Space</b> or <b>click/tap</b> right when it lines up with the hole to pull a tight, even stitch. Stitch every hole along the sheath to finish — three bad pulls and the thread snaps!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
let score=0,hi=parseInt(localStorage.getItem('knifesheathstitching_hi')||'0',10);
let lives=3,level=1,gameOver=false,started=false,won=false;
let holes=[],holeIndex=0,stitched=[];
let needleT=0,needleSpeed=0.018,needleDir=1;
let flashMsg='',flashTimer=0;
const MAX_LEVEL=6;

function shapeFor(level){
  // generates a path of holes along a simple sheath silhouette, more holes & tighter tolerance each level
  const n=6+level*2;
  const pts=[];
  const topY=90,botY=330;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const x=120+t*560;
    const wobble=Math.sin(t*Math.PI)*0; // straight stitch line along the edge
    const y=topY+ (botY-topY)*0.0 ; // will be set by edge curve below
    pts.push({x,y:0,t});
  }
  // edge curve: sheath tapers to a point at the right (blade tip)
  pts.forEach(p=>{
    const edgeY = topY + (botY-topY)*(0.15+0.0);
    p.y = 210 + Math.sin(p.t*Math.PI*0.9)* (110 - level*4);
  });
  return pts;
}

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {hearts}').replace('{hearts}','❤️'.repeat(Math.max(0,lives)));
}

function setupLevel(){
  holes=shapeFor(level);
  holeIndex=0;
  stitched=new Array(holes.length).fill(false);
  needleSpeed=0.016+level*0.0035;
  needleT=0;needleDir=1;
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;won=false;
  setupLevel();
  updateHud();
}
reset();

function flash(msg){flashMsg=msg;flashTimer=60;}

function currentHole(){ return holes[holeIndex]; }

function tolerance(){ return Math.max(0.06,0.17-level*0.012); }

function attemptStitch(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const dist=Math.abs(((needleT%1)+1)%1-0.5)*2; // 0 at center swing, used below differently
  // needleT drives a back-and-forth 0..1..0 pattern already; proximity check:
  const phase=Math.abs(needlePos()-0.5)*2; // 0 means at center (over hole)
  if(phase<=tolerance()){
    stitched[holeIndex]=true;
    score+=15+level*2;
    SFX.success();
    flash(I18N.t('stitch_good','Even stitch!'));
    holeIndex++;
    if(holeIndex>=holes.length){
      score+=40*level;
      SFX.levelup();
      level++;
      if(level>MAX_LEVEL){
        won=true;gameOver=true;
        if(score>hi){hi=score;localStorage.setItem('knifesheathstitching_hi',String(Math.floor(hi)));}
        SFX.win();
      } else {
        flash(I18N.t('level_clear','Sheath section complete!'));
        setupLevel();
      }
    } else {
      needleT=0;needleDir=1;
    }
  } else {
    lives--;
    SFX.hit();
    flash(I18N.t('stitch_bad','Loose stitch — tension uneven!'));
    if(lives<=0){
      gameOver=true;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem('knifesheathstitching_hi',String(Math.floor(hi)));}
    } else {
      needleT=0;needleDir=1;
    }
  }
  updateHud();
}

function needlePos(){
  // triangular wave 0->1->0
  return needleT<0.5?needleT*2:(1-needleT)*2;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();attemptStitch();}
});
c.addEventListener('pointerdown',e=>{attemptStitch();});

function drawSheath(){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(holes[0].x,holes[0].y-40);
  holes.forEach(h=>ctx.lineTo(h.x,h.y-40));
  ctx.lineTo(holes[holes.length-1].x+20,holes[holes.length-1].y);
  holes.slice().reverse().forEach(h=>ctx.lineTo(h.x,h.y+40));
  ctx.closePath();
  ctx.fillStyle='#7a4a2a';
  ctx.fill();
  ctx.strokeStyle='#5a3418';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();

  holes.forEach((h,i)=>{
    ctx.beginPath();
    ctx.arc(h.x,h.y,6,0,Math.PI*2);
    ctx.fillStyle=stitched[i]?'#f2d9a8':(i===holeIndex?'#ffdd55':'#3a2414');
    ctx.fill();
    ctx.strokeStyle='#1a0f08';ctx.lineWidth=1.5;ctx.stroke();
    if(stitched[i]){
      ctx.strokeStyle='#e8c878';ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(h.x-5,h.y-5);ctx.lineTo(h.x+5,h.y+5);
      ctx.moveTo(h.x+5,h.y-5);ctx.lineTo(h.x-5,h.y+5);
      ctx.stroke();
    }
  });
}

function drawNeedleGauge(){
  const h=currentHole();
  if(!h)return;
  const gx=h.x,gy=60;
  // vertical gauge bar above the current hole showing swing position + tolerance zone
  const barW=16,barH=160,bx=gx-barW/2,by=gy;
  ctx.fillStyle='#1a1008';ctx.fillRect(bx,by,barW,barH);
  const tol=tolerance();
  const zoneCenter=0.5;
  const zoneH=tol*barH;
  ctx.fillStyle='rgba(126,200,80,0.6)';
  ctx.fillRect(bx,by+barH*(zoneCenter-tol),barW,zoneH*2>barH?barH:zoneH*2);
  const pos=needlePos();
  const ny=by+barH*pos;
  ctx.beginPath();
  ctx.moveTo(bx-10,ny);ctx.lineTo(bx+barW+10,ny);
  ctx.strokeStyle='#ffdd55';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(bx+barW/2,ny,5,0,Math.PI*2);ctx.fillStyle='#ffdd55';ctx.fill();
  ctx.strokeStyle='#665';ctx.lineWidth=2;ctx.strokeRect(bx,by,barW,barH);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#2a1e14';ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#d9a35c';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start stitching'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawSheath();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('win_title','MASTER STITCHER!'):I18N.t('game_over_title','THREAD SNAPPED'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+26);
    requestAnimationFrame(loop);return;
  }

  needleT+=needleSpeed*needleDir;
  if(needleT>=1){needleT=1;needleDir=-1;}
  if(needleT<=0){needleT=0;needleDir=1;}

  drawSheath();
  drawNeedleGauge();

  if(flashTimer>0){
    flashTimer--;
    ctx.fillStyle=`rgba(255,221,85,${Math.min(1,flashTimer/30)})`;
    ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,30);
  }

  ctx.fillStyle='#ccc';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_progress','Level {l} — Hole {h}/{t}').replace('{l}',level).replace('{h}',holeIndex+1).replace('{t}',holes.length),16,20);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
