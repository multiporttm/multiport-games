<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Sack Race</title><meta name="description" content="Play Sack Race free online — Alternate the Left and Right Arrow keys (or tap the left/right side of the screen) to hop forward and race to the finish line."><link rel="canonical" href="https://games.multiportllc.com/games/sackrace"><meta property="og:title" content="Sack Race - Multiport Games"><meta property="og:description" content="Play Sack Race free online — Alternate the Left and Right Arrow keys (or tap the left/right side of the screen) to hop forward and race to the finish line."><meta property="og:url" content="https://games.multiportllc.com/games/sackrace"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Sack Race","description":"Play Sack Race free online instantly. Alternate the Left and Right Arrow keys (or tap the left/right side of the screen) to hop forward and race to the finish line. Hop too irregularly and you'll stumble! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/sackrace","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#ffca28,#fb8c00);display:block;border-radius:8px;touch-action:none}
#score-display{color:#4e342e;background:#fff3e0;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sack Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="280"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b> and <b>Right Arrow</b> (or tap the left/right side of the screen) to hop forward. Keep an even rhythm — hopping the same side twice in a row makes you stumble!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280;
const TRACK_LEN=2600;
let hiTime=parseFloat(localStorage.getItem('sackrace_hi')||'0')||null;
let wins=parseInt(localStorage.getItem('sackrace_wins')||'0',10);

let racers,lastKey,started,finished,raceTime,stumbleTimer,camX,lastTime,bumps;

function makeRacers(){
  return [
    {x:0,color:'#42a5f5',isPlayer:true,speed:0,hopPhase:0,finishTime:null},
    {x:0,color:'#ef5350',isPlayer:false,aiRhythm:38+Math.random()*14,aiTimer:0,finishTime:null},
    {x:0,color:'#66bb6a',isPlayer:false,aiRhythm:34+Math.random()*18,aiTimer:0,finishTime:null},
  ];
}

function reset(){
  racers=makeRacers();
  lastKey=null;started=false;finished=false;raceTime=0;stumbleTimer=0;camX=0;lastTime=null;
}
reset();

function hop(side){
  if(finished){reset();return;}
  if(!started){started=true;lastTime=null;}
  const p=racers[0];
  if(stumbleTimer>0)return;
  if(side===lastKey){
    // irregular - stumble
    stumbleTimer=40;
    lastKey=null;
    SFX.error();
    return;
  }
  lastKey=side;
  p.x+=42+Math.random()*6;
  p.hopPhase=1;
  SFX.jump();
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();hop('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();hop('R');}
});
c.addEventListener('mousedown',e=>{
  const r=c.getBoundingClientRect();
  const x=e.clientX-r.left;
  hop(x<r.width/2?'L':'R');
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-r.left;
  hop(x<r.width/2?'L':'R');
},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('sack_score_label','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',hiTime?hiTime.toFixed(1)+'s':'--');
}

function drawRacer(r,laneY,label){
  const sx=r.x-camX+80;
  if(sx<-40||sx>W+40)return;
  const bob=r.hopPhase>0?Math.sin(r.hopPhase*Math.PI)*14:0;
  ctx.fillStyle='#6d4c41';
  ctx.beginPath();
  ctx.ellipse(sx,laneY-bob,16,22,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle=r.color;
  ctx.fillRect(sx-14,laneY-20-bob,28,26);
  ctx.fillStyle='#3e2723';
  ctx.beginPath();ctx.arc(sx,laneY-32-bob,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';
  ctx.fillText(label,sx,laneY-48-bob);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#87ceeb');grad.addColorStop(1,'#ffca28');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // lanes
  const lanes=[100,170,240];
  ctx.fillStyle='#e0a458';
  ctx.fillRect(0,80,W,180);
  for(let i=1;i<3;i++){
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(0,80+i*60);ctx.lineTo(W,80+i*60);ctx.stroke();
  }
  ctx.setLineDash([]);

  if(!started){
    ctx.fillStyle='#3e2723';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sack_start_hint','Alternate L/R or tap sides to start!'),W/2,40);
    racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('sack_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  if(finished){
    ctx.fillStyle='#3e2723';ctx.font='bold 30px Arial';ctx.textAlign='center';
    const won=racers[0].finishTime!==null&&racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    ctx.fillText(won?I18N.t('sack_win','YOU WIN!'):I18N.t('sack_lose','YOU LOSE'),W/2,40);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,66);
    racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('sack_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  raceTime+=dt/60;

  if(stumbleTimer>0){stumbleTimer-=dt;}

  // AI hopping
  racers.forEach((r,i)=>{
    if(i===0)return;
    r.aiTimer+=dt;
    if(r.aiTimer>=r.aiRhythm){
      r.aiTimer=0;
      r.x+=40+Math.random()*8;
      r.hopPhase=1;
      if(Math.random()<0.08)r.aiTimer=-20; // occasional AI stumble
    }
  });

  racers.forEach(r=>{
    if(r.hopPhase>0){r.hopPhase-=0.06*dt;if(r.hopPhase<0)r.hopPhase=0;}
    if(r.finishTime===null&&r.x>=TRACK_LEN){r.finishTime=raceTime;}
  });

  camX=Math.max(0,racers[0].x-200);

  // finish line
  const finishSx=TRACK_LEN-camX+80;
  if(finishSx>-20&&finishSx<W+20){
    ctx.fillStyle='#fff';
    for(let i=0;i<180;i+=20){
      ctx.fillStyle=((i/20)%2===0)?'#222':'#fff';
      ctx.fillRect(finishSx,80+i,10,20);
    }
  }

  racers.forEach((r,i)=>drawRacer(r,80+i*60+40,i===0?I18N.t('sack_you_label','YOU'):'CPU'));

  if(stumbleTimer>0){
    ctx.fillStyle='rgba(255,0,0,0.5)';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sack_stumble','STUMBLE!'),W/2,110);
  }

  if(racers[0].finishTime!==null&&!finished){
    finished=true;
    const won=racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    if(won){
      wins++;
      localStorage.setItem('sackrace_wins',wins);
      if(hiTime===null||raceTime<hiTime){
        hiTime=raceTime;
        localStorage.setItem('sackrace_hi',hiTime);
      }
      SFX.win();
    }else{
      SFX.lose();
    }
  } else if(!finished && racers.some((r,i)=>i>0&&r.finishTime!==null)){
    // an AI finished before player
    finished=true;
    SFX.lose();
  }

  ctx.fillStyle='#3e2723';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('sack_time_label','Time: {t}s').replace('{t}',raceTime.toFixed(1)),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('sack_progress_label','{p}%').replace('{p}',Math.min(100,Math.floor(racers[0].x/TRACK_LEN*100))),W-10,20);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
