<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>

<style>
body{background:#08080f}
#c{background:#2a1a33;display:block;border-radius:8px;touch-action:none}
#score-display{color:#f49ac2;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Floral Pressing Drying</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="460"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag or use <b>Arrow keys</b> to lay each flower flat with even spacing between the papers, press <b>Space</b> to apply the weight, then wait and press <b>Enter</b> to check it at just the right moment. Don't peek too early or let it dry too long!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=460;
const HI_KEY='floralpressingdrying_hi';
let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let lives=3,level=1,gameOver=false,won=false,started=false;
let msgTimer=0,msgText='';

// Phases per flower: 'place' (position within row slot, even spacing),
// 'weight' (apply weight, hold briefly), 'dry' (wait out dryTime, check within window)
let flowers=[],cur=0,phase='place',dragX=0,weightHeld=0,dryElapsed=0,windowFlash=0;
const SLOT_W=90;

function rand(a,b){return a+Math.random()*(b-a);}

function designForLevel(lv){
  const count=Math.min(3+Math.floor(lv/2),7);
  const names=['Pansy','Violet','Daisy','Fern Leaf','Rose Petal','Buttercup','Lavender'];
  const colors=['#e8a0d8','#8aa6e8','#fff1a8','#8fd98f','#ff9fb0','#ffe08a','#c3a8f0'];
  flowers=[];
  const startX=W/2-((count-1)*SLOT_W)/2;
  const tol=Math.max(10,22-lv*1.1);
  for(let i=0;i<count;i++){
    const dryTime=Math.round(rand(90,160))-lv*2;
    flowers.push({
      slotX:startX+i*SLOT_W,
      slotY:H/2+10,
      name:names[i%names.length],
      color:colors[i%colors.length],
      placed:false,placeX:0,
      weighted:false,
      checked:false,
      failed:false,
      dryTime:Math.max(50,dryTime),
      tol,
      dried:false
    });
  }
  cur=0;phase='place';dragX=flowers[0].slotX;weightHeld=0;dryElapsed=0;
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;msgTimer=0;msgText='';
  designForLevel(level);
}
reset();

function flashMsg(t){msgText=t;msgTimer=70;}

function currentFlower(){return flowers[cur];}

function advance(){
  cur++;
  if(cur>=flowers.length){
    level++;
    SFX.levelup();
    if(level>8){
      won=true;gameOver=true;
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      SFX.win();
    } else {
      flashMsg(I18N.t('level_up','Pressed and dried! Next batch...'));
      designForLevel(level);
    }
  } else {
    phase='place';dragX=flowers[cur].slotX;weightHeld=0;dryElapsed=0;
  }
}

function failFlower(msg){
  lives--;
  SFX.hurt();
  flashMsg(msg);
  if(lives<=0){
    gameOver=true;won=false;
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    SFX.lose();
  } else {
    advance();
  }
}

function doAction(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const f=currentFlower();
  if(!f)return;
  if(phase==='place'){
    const d=Math.abs(dragX-f.slotX);
    if(d<=f.tol){
      f.placed=true;f.placeX=f.slotX;
      score+=5+level;
      SFX.success();
      flashMsg(I18N.t('place_good','Laid flat and even!'));
      phase='weight';weightHeld=0;
    } else {
      failFlower(I18N.t('place_bad','Uneven — not lying flat!'));
    }
  } else if(phase==='weight'){
    weightHeld+=10;
    if(weightHeld>=30){
      f.weighted=true;
      score+=5+level;
      SFX.point();
      flashMsg(I18N.t('weight_good','Weight applied evenly.'));
      phase='dry';dryElapsed=0;
    }
  } else if(phase==='dry'){
    const target=f.dryTime;
    const diff=dryElapsed-target;
    if(Math.abs(diff)<=10){
      f.dried=true;
      score+=15+level*2;
      SFX.win();
      flashMsg(I18N.t('dry_perfect','Perfectly pressed and dry!'));
      advance();
    } else if(diff<0){
      failFlower(I18N.t('dry_early','Peeked too early — still damp!'));
    } else {
      failFlower(I18N.t('dry_late','Left too long — over-dried!'));
    }
  }
}

c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width);
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(phase==='place'){dragX=mx;}
  else {doAction();}
});
c.addEventListener('pointermove',e=>{
  if(phase!=='place'||!started||gameOver)return;
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width);
  dragX=mx;
});

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();if(started&&!gameOver&&phase==='place'){dragX-=6;SFX.tick();}}
  else if(e.code==='ArrowRight'){e.preventDefault();if(started&&!gameOver&&phase==='place'){dragX+=6;SFX.tick();}}
  else if(e.code==='Space'){e.preventDefault();doAction();}
  else if(e.code==='Enter'){e.preventDefault();doAction();}
});

function drawPapers(){
  ctx.save();
  ctx.fillStyle='#f2e6d0';
  const w=flowers.length*SLOT_W+80;
  const x=W/2-w/2,y=H/2-70;
  roundRect(x,y,w,140,10);
  ctx.fill();
  ctx.strokeStyle='#cbb98f';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawFlower(f,i){
  ctx.save();
  if(i<cur||f.dried){
    ctx.globalAlpha=f.dried?1:0.9;
    ctx.beginPath();
    ctx.ellipse(f.slotX,f.slotY,20,10,0,0,Math.PI*2);
    ctx.fillStyle=f.dried?f.color:'#999';
    ctx.fill();
    ctx.strokeStyle='#5a4a3a';ctx.lineWidth=1.5;ctx.stroke();
  } else if(i===cur){
    if(phase==='place'){
      ctx.beginPath();
      ctx.strokeStyle='#ffffff88';ctx.setLineDash([4,4]);ctx.lineWidth=2;
      ctx.ellipse(f.slotX,f.slotY,f.tol+20,f.tol*0.6+10,0,0,Math.PI*2);
      ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();
      ctx.ellipse(dragX,f.slotY,20,10,0,0,Math.PI*2);
      ctx.fillStyle=f.color;
      ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    } else if(phase==='weight'){
      ctx.beginPath();
      ctx.ellipse(f.slotX,f.slotY,20,10,0,0,Math.PI*2);
      ctx.fillStyle=f.color;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#777';
      ctx.fillRect(f.slotX-26,f.slotY-26-Math.min(weightHeld,20),52,16);
    } else if(phase==='dry'){
      ctx.beginPath();
      ctx.ellipse(f.slotX,f.slotY,20,10,0,0,Math.PI*2);
      ctx.fillStyle=f.color;ctx.globalAlpha=0.55;ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    }
  } else {
    ctx.globalAlpha=0.3;
    ctx.beginPath();
    ctx.ellipse(f.slotX,f.slotY,16,8,0,0,Math.PI*2);
    ctx.fillStyle='#555';ctx.fill();
  }
  ctx.restore();
}

function drawDryBar(){
  const f=currentFlower();
  if(!f||phase!=='dry')return;
  const barW=400,barX=W/2-barW/2,barY=H-120;
  ctx.save();
  ctx.fillStyle='#ffffff22';
  roundRect(barX,barY,barW,18,9);ctx.fill();
  const target=f.dryTime,tolPx=(10/200)*barW;
  const targetX=barX+Math.min(1,target/200)*barW;
  ctx.fillStyle='#8fd98f55';
  ctx.fillRect(targetX-tolPx,barY,tolPx*2,18);
  const prog=Math.min(1,dryElapsed/200)*barW;
  ctx.fillStyle='#f49ac2';
  ctx.fillRect(barX,barY,prog,18);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,18);
  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('dry_hint','Press Enter when it feels just right'),W/2,barY-10);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1c1024');bg.addColorStop(1,'#2a1a33');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawPapers();
  flowers.forEach((f,i)=>drawFlower(f,i));
  drawDryBar();

  if(started&&!gameOver){
    ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';
    const f=currentFlower();
    if(f){
      let hint='';
      if(phase==='place')hint=I18N.t('phase_place','{n}: lay it flat and centered, then press Enter').replace('{n}',f.name);
      else if(phase==='weight')hint=I18N.t('phase_weight','{n}: press Space to apply even weight').replace('{n}',f.name);
      else hint=I18N.t('phase_dry','{n}: waiting to dry...').replace('{n}',f.name);
      ctx.fillText(hint,W/2,H/2+90);
    }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Batch {n}').replace('{n}',level),16,30);
  ctx.textAlign='right';
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<lives?'#ff6fa5':'#55384a';
    ctx.beginPath();ctx.arc(W-20-i*26,24,9,0,Math.PI*2);ctx.fill();
  }

  if(msgTimer>0){
    msgTimer--;
    ctx.textAlign='center';ctx.font='bold 20px Arial';
    ctx.fillStyle='#ffe3f0';
    ctx.fillText(msgText,W/2,H-20);
  }

  if(!started){
    ctx.fillStyle='#f49ac2';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click or press Enter to start'),W/2,H/2-120);
  }

  if(gameOver){
    ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('win_title','PRESSING MASTER!'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Click or press Enter to try again'),W/2,H/2+20);
  }

  if(started&&!gameOver&&phase==='dry')dryElapsed++;

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
