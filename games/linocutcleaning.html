<style>
body{background:#08080f}
#c{background:#7a6a52;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#hud{color:#f3ecd9;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#timeWrap{max-width:600px;margin:0 auto 8px;background:#2e2518;border-radius:10px;padding:4px}
#timeBar{height:14px;border-radius:8px;background:linear-gradient(90deg,#c0392b,#e67e22);width:100%;transition:width .1s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Linocut Cleaning</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreLbl">Score: 0 | Hi: 0</span>
      <span id="cleanLbl">Clean: 0%</span>
      <span id="levelLbl">Block 1</span>
    </div>
    <div id="timeWrap"><div id="timeBar"></div></div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag your mouse, finger, or the <b>Arrow keys</b> to sweep the solvent rag across the linoleum block. Wipe every inked recess clean (reach 100%) before the timer dries up. Larger, more detailed blocks appear each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const KEY="linocutcleaning_hi";
let score=0,hi=parseInt(localStorage.getItem(KEY)||"0",10),block=1,gameOver=false,won=false;
let cellSize=14,cols=0,rows=0,grid=[]; // grid[r][c] = 0 ink remains, 1 clean (only inked cells count)
let inkedMask=[]; // true where carving has ink (recesses)
let rag={x:W/2,y:H/2,r:30};
let dragging=false;
let timeLeft=0,timeTotal=0;
let lastTime=null;
let totalInked=0,cleanedCount=0;

function rand(a,b){return a+Math.random()*(b-a);}

function genBlock(){
  cols=16+block*3;
  rows=Math.floor((cols)*0.6);
  cellSize=Math.min( (W-40)/cols, (H-120)/rows );
  grid=[];inkedMask=[];
  // generate carved pattern: noise-based blobs representing carved (clean) vs raised (inked) areas
  const freq=0.18+Math.random()*0.08;
  const ox=rand(0,1000),oy=rand(0,1000);
  totalInked=0;
  for(let r=0;r<rows;r++){
    const rowG=[],rowM=[];
    for(let cc=0;cc<cols;cc++){
      const v=Math.sin((cc+ox)*freq)*Math.cos((r+oy)*freq*1.3)+Math.sin((cc*0.5+r*0.7+ox)*0.3);
      const inked=v>0.15; // "raised" area that holds ink
      rowM.push(inked);
      rowG.push(inked?0:1); // non-inked cells start as already clean (1), inked cells need wiping (0)
      if(inked)totalInked++;
    }
    grid.push(rowG);
    inkedMask.push(rowM);
  }
  cleanedCount=0;
  timeTotal=Math.max(14, 20 - block*0.6)+Math.sqrt(cols*rows)/3;
  timeLeft=timeTotal;
  won=false;
  rag.x=W/2;rag.y=H/2+30;
  lastTime=null;
  updateHud();
}

function updateHud(){
  const pct=totalInked>0?Math.floor(100*cleanedCount/totalInked):100;
  document.getElementById('scoreLbl').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('cleanLbl').textContent=I18N.t('clean_label','Clean: {p}%').replace('{p}',pct);
  document.getElementById('levelLbl').textContent=I18N.t('block_label','Block {n}').replace('{n}',block);
  document.getElementById('timeBar').style.width=Math.max(0,100*timeLeft/timeTotal)+'%';
}

function wipeAt(x,y){
  const gx0=Math.max(0,Math.floor((x-rag.r-20)/cellSize));
  const gx1=Math.min(cols-1,Math.floor((x+rag.r-20)/cellSize));
  const gy0=Math.max(0,Math.floor((y-rag.r-70)/cellSize));
  const gy1=Math.min(rows-1,Math.floor((y+rag.r-70)/cellSize));
  for(let r=gy0;r<=gy1;r++){
    for(let cc=gx0;cc<=gx1;cc++){
      if(!inkedMask[r][cc]||grid[r][cc]===1)continue;
      const cx=20+cc*cellSize+cellSize/2;
      const cy=70+r*cellSize+cellSize/2;
      if(Math.hypot(cx-x,cy-y)<=rag.r){
        grid[r][cc]=1;
        cleanedCount++;
      }
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#7a6a52';ctx.fillRect(0,0,W,H);
  const gw=cols*cellSize,gh=rows*cellSize;
  const ox=20,oy=70;
  for(let r=0;r<rows;r++){
    for(let cc=0;cc<cols;cc++){
      const x=ox+cc*cellSize,y=oy+r*cellSize;
      if(inkedMask[r][cc]){
        if(grid[r][cc]===0){
          ctx.fillStyle='#1a1410';
          ctx.fillRect(x,y,cellSize,cellSize);
        } else {
          ctx.fillStyle='#d9cdb0';
          ctx.fillRect(x,y,cellSize,cellSize);
        }
      } else {
        ctx.fillStyle='#8f7d60';
        ctx.fillRect(x,y,cellSize,cellSize);
      }
    }
  }
  ctx.strokeStyle='#5c4a3399';ctx.lineWidth=3;
  ctx.strokeRect(ox,oy,gw,gh);

  // rag
  ctx.save();
  ctx.globalAlpha=0.85;
  const grad=ctx.createRadialGradient(rag.x,rag.y,2,rag.x,rag.y,rag.r);
  grad.addColorStop(0,'#eaf6ff');grad.addColorStop(1,'#a9d6e5');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(rag.x,rag.y,rag.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4a90a4';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();

  if(gameOver){
    ctx.fillStyle='rgba(20,10,5,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f3ecd9';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('block_clean_title','BLOCK CLEAN!'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
  }
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};
}

function moveRag(x,y){
  rag.x=Math.max(0,Math.min(W,x));
  rag.y=Math.max(0,Math.min(H,y));
  wipeAt(rag.x,rag.y);
}

c.addEventListener('mousedown',e=>{if(gameOver){reset();return;}dragging=true;const p=getPos(e);moveRag(p.x,p.y);});
window.addEventListener('mousemove',e=>{if(!dragging)return;const p=getPos(e);moveRag(p.x,p.y);});
window.addEventListener('mouseup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameOver){reset();return;}dragging=true;const p=getPos(e);moveRag(p.x,p.y);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!dragging)return;const p=getPos(e);moveRag(p.x,p.y);},{passive:false});
c.addEventListener('touchend',()=>{dragging=false;},{passive:false});

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='Enter'){if(gameOver)reset();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function reset(){
  score=0;block=1;gameOver=false;
  genBlock();
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(!gameOver){
    const spd=6;
    if(keys['ArrowLeft'])moveRag(rag.x-spd*dt,rag.y);
    if(keys['ArrowRight'])moveRag(rag.x+spd*dt,rag.y);
    if(keys['ArrowUp'])moveRag(rag.x,rag.y-spd*dt);
    if(keys['ArrowDown'])moveRag(rag.x,rag.y+spd*dt);

    timeLeft-=dt/60;
    if(cleanedCount>=totalInked&&!won){
      won=true;
      const bonus=Math.max(0,Math.floor(timeLeft*10));
      score+=100*block+bonus;
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
      SFX.success();
      block++;
      setTimeout(()=>{ if(!gameOver) genBlock(); },1000);
    } else if(timeLeft<=0&&!won){
      timeLeft=0;
      gameOver=true;
      SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    }
    updateHud();
  }
  draw();
  requestAnimationFrame(loop);
}
genBlock();
loop();
</script></body></html>
