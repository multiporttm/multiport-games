<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Taekwondo Kick</title><meta name="description" content="Play Taekwondo Kick free online — Hold to charge your kick power, then release right as the marker lines up with the target board to break it. Too weak or mistimed kicks fail!"><link rel="canonical" href="https://games.multiportllc.com/games/taekwondokick"><meta property="og:title" content="Taekwondo Kick - Multiport Games"><meta property="og:description" content="Play Taekwondo Kick free online — Hold to charge your kick power, then release right as the marker lines up with the target board to break it. Too weak or mistimed kicks fail!"><meta property="og:url" content="https://games.multiportllc.com/games/taekwondokick"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Taekwondo Kick","description":"Play Taekwondo Kick free online instantly. A target board appears at varying heights and distances. Hold the key or button to charge power, then release right as the sweeping marker lines up with the target's sweet spot to break it. Too weak or mistimed kicks fail. Score is based on boards broken cleanly across increasingly difficult target placements. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/taekwondokick","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0e1a2b;display:block;border-radius:8px;touch-action:none;user-select:none}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:700;padding:6px 4px;font-size:1rem}
#hud .lbl{color:#ffd54f}
#kickBtn{display:block;margin:12px auto 0;padding:16px 40px;background:#e94560;border:none;border-radius:30px;color:#fff;font-weight:900;font-size:1.2rem;cursor:pointer;transition:transform .1s}
#kickBtn:active{transform:scale(.94)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Taekwondo Kick</div>
  <div class="game-frame">
    <div id="hud"><span><span class="lbl">Boards Broken:</span> <span id="brokenLbl">0</span></span><span><span class="lbl">Round:</span> <span id="roundLbl">1</span></span><span><span class="lbl">Best:</span> <span id="bestLbl">0</span></span></div>
    <canvas id="c" width="800" height="320"></canvas>
    <button id="kickBtn">HOLD to Charge, RELEASE to Kick</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, click, or tap-and-hold the button to charge your kick power. Release right as the sweeping marker lines up with the target board's sweet spot to break it. Too weak or mistimed kicks fail — boards get harder to break each round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const brokenLbl=document.getElementById('brokenLbl'),roundLbl=document.getElementById('roundLbl'),bestLbl=document.getElementById('bestLbl'),kickBtn=document.getElementById('kickBtn');
let best=parseInt(localStorage.getItem('taekwondokick_best')||'0',10);
bestLbl.textContent=best;

let round,broken,charging,power,marker,markerDir,markerSpeed,targetY,sweetLo,sweetHi,neededPower,state,resultTimer,resultText,failCount,shakeT;

function newGame(){
  round=1;broken=0;failCount=0;
  updateHud();
  startRound();
}

function startRound(){
  charging=false;power=0;
  markerSpeed=2.0+round*0.22;
  markerDir=1;marker=0;
  targetY=70+Math.random()*140;
  const sweetWidth=Math.max(8,26-round*1.5);
  const center=30+Math.random()*40;
  sweetLo=center-sweetWidth/2;sweetHi=center+sweetWidth/2;
  neededPower=Math.min(85,40+round*3);
  state='aiming';resultTimer=0;resultText='';
}

function updateHud(){
  brokenLbl.textContent=broken;roundLbl.textContent=round;
  if(broken>best){best=broken;localStorage.setItem('taekwondokick_best',best);}
  bestLbl.textContent=best;
}

function startCharge(){
  if(state!=='aiming')return;
  charging=true;
}
function releaseKick(){
  if(!charging||state!=='aiming')return;
  charging=false;
  const inSweet=marker>=sweetLo&&marker<=sweetHi;
  const enoughPower=power>=neededPower;
  if(inSweet&&enoughPower){
    broken++;round++;
    SFX.success();
    state='result';resultTimer=50;resultText=I18N.t('board_broken','💥 BOARD BROKEN!');
  } else if(!enoughPower){
    failCount++;
    SFX.fail();
    state='result';resultTimer=50;resultText=I18N.t('too_weak','Too weak! The board held.');
  } else {
    failCount++;
    SFX.error();
    shakeT=12;
    state='result';resultTimer=50;resultText=I18N.t('mistimed','Mistimed! Kick missed the board.');
  }
  power=0;
  updateHud();
}

document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); if(state==='gameover'){newGame();return;} startCharge();} });
document.addEventListener('keyup',e=>{ if(e.code==='Space'){e.preventDefault(); releaseKick();} });
kickBtn.addEventListener('mousedown',()=>{ if(state==='gameover'){newGame();return;} startCharge(); });
document.addEventListener('mouseup',releaseKick);
kickBtn.addEventListener('touchstart',e=>{e.preventDefault(); if(state==='gameover'){newGame();return;} startCharge();},{passive:false});
kickBtn.addEventListener('touchend',e=>{e.preventDefault(); releaseKick();},{passive:false});
c.addEventListener('mousedown',()=>{ if(state==='gameover'){newGame();return;} startCharge(); });
c.addEventListener('touchstart',e=>{e.preventDefault(); if(state==='gameover'){newGame();return;} startCharge();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault(); releaseKick();},{passive:false});

function drawBoard(){
  const bx=580,by=targetY;
  ctx.save();
  ctx.translate(bx,by);
  ctx.fillStyle='#c8a165';
  ctx.fillRect(-60,-10,120,20);
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=2;ctx.strokeRect(-60,-10,120,20);
  if(state==='result'&&resultText.indexOf('BROKEN')>=0){
    ctx.strokeStyle='#3a2410';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-40,-10);ctx.lineTo(10,10);ctx.moveTo(20,-10);ctx.lineTo(-20,10);ctx.stroke();
  }
  ctx.restore();
  // stand
  ctx.fillStyle='#555';
  ctx.fillRect(bx-6,by+10,12,300-by-10);
}

function loop(){
  const sx=shakeT>0?(Math.random()-0.5)*6:0;
  shakeT=Math.max(0,shakeT-1);
  ctx.save();ctx.translate(sx,0);
  ctx.clearRect(-10,0,820,320);
  const sky=ctx.createLinearGradient(0,0,0,300);
  sky.addColorStop(0,'#1b2b4a');sky.addColorStop(1,'#0e1a2b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,300);
  ctx.fillStyle='#33261a';ctx.fillRect(0,290,800,10);

  drawBoard();

  // fighter silhouette
  ctx.fillStyle='#7ec850';
  ctx.fillRect(180,240-power*1.3,30,60);
  ctx.beginPath();ctx.arc(195,235-power*1.3-14,14,0,Math.PI*2);ctx.fill();

  if(state==='aiming'){
    if(charging){power=Math.min(100,power+1.6);SFX.tick&&null;}
    marker+=markerDir*markerSpeed;
    if(marker>100){marker=100;markerDir=-1;}
    if(marker<0){marker=0;markerDir=1;}

    // power meter
    ctx.fillStyle='#333';ctx.fillRect(40,260,160,18);
    ctx.fillStyle=power>=neededPower?'#7ec850':'#ffd54f';
    ctx.fillRect(40,260,160*(power/100),18);
    ctx.strokeStyle='#fff';ctx.strokeRect(40,260,160,18);
    ctx.fillStyle='#fff';ctx.fillText(power>=neededPower?'★':'',44+160*(neededPower/100),256);
    ctx.strokeStyle='#7ec850';ctx.beginPath();ctx.moveTo(40+160*(neededPower/100),258);ctx.lineTo(40+160*(neededPower/100),280);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='left';
    ctx.fillText(I18N.t('power_label','POWER (need {n}%)').replace('{n}',neededPower),40,252);

    // timing bar (vertical, aligned to board height area)
    const barX=460,barTop=30,barH=180;
    ctx.fillStyle='#222';ctx.fillRect(barX,barTop,20,barH);
    ctx.fillStyle='#ffd54f88';
    ctx.fillRect(barX,barTop+barH*(1-sweetHi/100),20,barH*((sweetHi-sweetLo)/100));
    const my=barTop+barH*(1-marker/100);
    ctx.fillStyle='#fff';ctx.fillRect(barX-6,my-3,32,6);
    ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('timing_label','TIMING'),barX+10,barTop-8);
  } else if(state==='result'){
    resultTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(resultText,400,50);
    if(resultTimer<=0){
      if(resultText.indexOf('BROKEN')<0 && failCount>=3){
        state='gameover';
      } else {
        startRound();
      }
    }
  } else if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('boards_final','Boards broken: {n}').replace('{n}',broken),400,155);
    ctx.fillText(I18N.t('restart_hint2','Hold & release to try again'),400,190);
    if(charging){ // allow restart via hold without weird state
    }
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script></body></html>
