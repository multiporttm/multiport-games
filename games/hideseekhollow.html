<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#2e7d32}
#ui{color:#c8e6c9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Hide & Seek Hollow</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Survived: 0s | Round: 1</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to sneak between the 🌳 hiding spots. Standing near one hides you from the seeker's vision cone. Survive 20 seconds per round to advance!</div>
</div>
<script>
const W=360,H=360,SIZE=18,ROUND_TIME=20;
let player,seeker,spots,survived,round,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}

function init(){round=1;newRound();}

function newRound(){
  player={x:30,y:H-30};
  seeker={x:W/2,y:40,ang:0,turnSpeed:0.014+round*0.002,coneLen:100+round*6,coneWidth:0.5};
  spots=[];
  const n=5+round;
  for(let i=0;i<n;i++)spots.push({x:rand(30,W-30),y:rand(60,H-30)});
  survived=0;state='play';
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='caught'){round=1;newRound();}});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function nearHidingSpot(){
  return spots.some(s=>dist(player,s)<26);
}

function spotted(){
  if(nearHidingSpot())return false;
  const d=dist(player,seeker);
  if(d>seeker.coneLen)return false;
  const angToPlayer=Math.atan2(player.y-seeker.y,player.x-seeker.x);
  let diff=Math.abs(angToPlayer-seeker.ang);
  diff=Math.min(diff,Math.PI*2-diff);
  return diff<seeker.coneWidth;
}

function update(){
  if(state!=='play')return;
  const spd=2.3;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  seeker.ang+=seeker.turnSpeed*(Math.sin(survived*0.3)>0?1:-1);

  survived+=1/60;

  if(spotted()){
    state='caught';
    return;
  }

  if(survived>=ROUND_TIME){
    round++;newRound();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,W,H);

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  spots.forEach(s=>ctx.fillText('🌳',s.x,s.y));

  ctx.save();
  ctx.translate(seeker.x,seeker.y);
  ctx.rotate(seeker.ang);
  ctx.fillStyle='rgba(255,235,59,.2)';
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,seeker.coneLen,-seeker.coneWidth,seeker.coneWidth);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.font='22px Arial';
  ctx.fillText('🙎',seeker.x,seeker.y);

  const hidden=nearHidingSpot();
  ctx.globalAlpha=hidden?0.5:1;
  ctx.fillText('🙂',player.x,player.y);
  ctx.globalAlpha=1;

  if(state==='caught'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';
    ctx.fillText('FOUND YOU!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Reached Round: ${round}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Survived: ${Math.floor(survived)}s | Round: ${round}`;
}

init();draw();
</script></body></html>
