<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#dff3ff;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#7fd8ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Slide</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Snowflakes: 0 | Hi: 0m</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> to steer, or <b>drag</b> on mobile. Dodge the rocks and trees while sliding down the icy slope, and grab <b>snowflakes</b> for bonus points!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let distance=0,hiDist=parseInt(localStorage.getItem('iceslide_hi')||'0'),flakes=0,spd=5,frame=0,gameOver=false,started=false;
const player={x:W/2,y:H-100,w:34,h:44,vx:0};
let obstacles=[],snowflakes=[];
let lastTime=null,obsTimer=0,flakeTimer=0;
let keys={left:false,right:false};
let dragX=null;

function reset(){
  distance=0;flakes=0;spd=5;frame=0;gameOver=false;started=false;
  player.x=W/2;player.vx=0;
  obstacles=[];snowflakes=[];lastTime=null;obsTimer=0;flakeTimer=0;
}

function startOrRestart(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;startOrRestart();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;startOrRestart();}
  else if(e.code==='Space'){startOrRestart();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
c.addEventListener('click',startOrRestart);
c.addEventListener('touchstart',e=>{e.preventDefault();startOrRestart();dragX=e.touches[0].clientX;},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragX!==null){
    const dx=e.touches[0].clientX-dragX;
    player.x+=dx*1.3;
    dragX=e.touches[0].clientX;
  }
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragX=null;},{passive:false});

function spawnObstacle(){
  const type=Math.random()<0.5?'rock':'tree';
  const x=30+Math.random()*(W-60);
  obstacles.push({x,y:-40,w:type==='rock'?34:28,h:type==='rock'?28:44,type});
}
function spawnSnowflake(){
  const x=30+Math.random()*(W-60);
  snowflakes.push({x,y:-20,r:9,taken:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.vx*0.02);
  ctx.fillStyle='#e63946';
  ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-player.h/2-8,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(-4,-player.h/2-11,3,3);
  ctx.fillRect(2,-player.h/2-11,3,3);
  ctx.restore();
}

function drawRock(o){
  ctx.fillStyle='#6b7a8f';
  ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a97a8';
  ctx.beginPath();ctx.ellipse(o.x-5,o.y-5,o.w/4,o.h/4,0,0,Math.PI*2);ctx.fill();
}
function drawTree(o){
  ctx.fillStyle='#5a3a24';
  ctx.fillRect(o.x-4,o.y+o.h/2-8,8,10);
  ctx.fillStyle='#1e6b3a';
  ctx.beginPath();
  ctx.moveTo(o.x,o.y-o.h/2);
  ctx.lineTo(o.x-o.w/2,o.y+o.h/2-6);
  ctx.lineTo(o.x+o.w/2,o.y+o.h/2-6);
  ctx.closePath();ctx.fill();
}
function drawFlake(o){
  ctx.save();
  ctx.strokeStyle='#4fb8e8';ctx.lineWidth=2;
  ctx.translate(o.x,o.y);
  for(let i=0;i<3;i++){
    ctx.save();ctx.rotate(i*Math.PI/3);
    ctx.beginPath();ctx.moveTo(-o.r,0);ctx.lineTo(o.r,0);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

let bgOffset=0;
function drawBg(dt){
  bgOffset=(bgOffset+spd*dt)%40;
  ctx.fillStyle='#eaf7ff';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c9ecff';
  ctx.lineWidth=2;
  for(let y=-40;y<H+40;y+=40){
    ctx.beginPath();ctx.moveTo(0,y+bgOffset);ctx.lineTo(W,y+bgOffset);ctx.stroke();
  }
}

function loop(){
  if(gameOver){
    drawBg(0);
    ctx.fillStyle='#1a1a2e';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Key to restart'),W/2,H/2+14);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    drawBg(0);
    drawPlayer();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_slide','Press a Key or Tap to start'),W/2,80);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  distance+=dt*(spd/5);
  if(distance>hiDist){hiDist=distance;localStorage.setItem('iceslide_hi',String(Math.floor(hiDist)));}
  spd=5+distance/250;

  if(keys.left)player.vx=Math.max(player.vx-0.6*dt,-7);
  else if(keys.right)player.vx=Math.min(player.vx+0.6*dt,7);
  else player.vx*=0.85;
  player.x+=player.vx*dt;
  if(player.x<player.w/2)player.x=player.w/2;
  if(player.x>W-player.w/2)player.x=W-player.w/2;

  drawBg(dt);

  obsTimer+=dt;
  const obsInterval=Math.max(24,55-distance/30);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObstacle();}
  flakeTimer+=dt;
  if(flakeTimer>=45){flakeTimer-=45;if(Math.random()<0.8)spawnSnowflake();}

  const playerHit={x:player.x-player.w/2+4,y:player.y-player.h/2+4,w:player.w-8,h:player.h-8};

  obstacles=obstacles.filter(o=>o.y<H+50);
  obstacles.forEach(o=>{
    o.y+=(spd+2)*dt;
    if(o.type==='rock')drawRock(o); else drawTree(o);
    if(rect(playerHit,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})&&!gameOver){gameOver=true;SFX.lose();}
  });

  snowflakes=snowflakes.filter(o=>o.y<H+30&&!o.taken);
  snowflakes.forEach(o=>{
    o.y+=(spd+1.5)*dt;
    drawFlake(o);
    if(rect(playerHit,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})){
      o.taken=true;flakes++;distance+=8;SFX.point();
    }
  });

  drawPlayer();
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('iceslide_score_label','Distance: {d}m | Snowflakes: {f} | Hi: {h}m')
      .replace('{d}',Math.floor(distance)).replace('{f}',flakes).replace('{h}',Math.floor(hiDist));
}

loop();
</script></body></html>
