<style>
body{background:#1c130c}
#c{background:#2e1f14;display:block;border-radius:8px;touch-action:none}
#hud{color:#f3d9b1;font-size:1.05rem;font-weight:700;text-align:center;padding:6px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffcf7a}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Papier-Mâché Mold Shaping</div>
  <div class="game-frame">
    <div id="hud"><span>🏺 <span id="round">1</span></span><span>❤️ <span id="lives">3</span></span><span>⭐ <b id="score">0</b></span><span>Hi: <b id="hi">0</b></span><span>⏱ <span id="timer">40</span></span></div>
    <canvas id="c" width="520" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag your finger or mouse (or use <b>Arrow Keys</b>) to sweep the smoothing tool along the glowing target contour. Keep moving steadily — lingering too long in one spot presses too hard and dents the form. Trace the whole shape before the timer ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=520,H=420,cx=W/2,cy=200;
let round=1,lives=3,score=0,hi=+(localStorage.getItem('papiermachemoldshaping_hi')||0);
document.getElementById('hi').textContent=hi;

const N=240;
let harmonics=[],baseR=100,tol=16,time=40;
let traced=[],dentAt=[],toolAngle=0,toolR=100,dents=0,maxDents=4;
let started=false,gameOver=false,roundWin=false,winTimer=0;
let lastAngle=0,stillFrames=0,totalProgress=0;

function radiusAt(angle){
  let r=baseR;
  for(const h of harmonics)r+=h.amp*Math.sin(h.freq*angle+h.phase);
  return r;
}

function setupRound(){
  const hc=1+Math.min(4,Math.floor(round/1));
  harmonics=[];
  for(let i=0;i<hc;i++){
    harmonics.push({freq:2+i*2+Math.floor(Math.random()*2),amp:(10+round*2.2)/(i+1),phase:Math.random()*Math.PI*2});
  }
  baseR=95+Math.min(20,round);
  tol=Math.max(9,17-round*0.6);
  time=Math.max(20,44-round*1.2);
  traced=new Array(N).fill(false);
  dentAt=new Array(N).fill(0);
  dents=0;
  toolAngle=0;toolR=radiusAt(0);
  roundWin=false;winTimer=0;
  totalProgress=0;
  lastAngle=0;stillFrames=0;
}
setupRound();

function angleIndex(a){
  let norm=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  return Math.floor(norm/(Math.PI*2)*N);
}

function updateTool(px,py){
  const dx=px-cx,dy=py-cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const ang=Math.atan2(dy,dx);
  toolAngle=ang;toolR=dist;
  processTool();
}

function processTool(){
  const target=radiusAt(toolAngle);
  const idx=angleIndex(toolAngle);
  const onPath=Math.abs(toolR-target)<=tol;
  let dAngle=Math.atan2(Math.sin(toolAngle-lastAngle),Math.cos(toolAngle-lastAngle));
  if(onPath){
    if(Math.abs(dAngle)>0.01){
      if(!traced[idx]){traced[idx]=true;totalProgress++;}
      stillFrames=0;
    } else {
      stillFrames++;
      if(stillFrames>26){
        dentAt[idx]=Math.min(1,dentAt[idx]+0.4);
        if(dentAt[idx]>=1&&traced[idx]){traced[idx]=false;totalProgress=Math.max(0,totalProgress-1);dents++;SFX.hit();}
        stillFrames=0;
      }
    }
  }
  lastAngle=toolAngle;
}

function rectFromClient(e){
  const r=c.getBoundingClientRect();
  const sx=W/r.width,sy=H/r.height;
  const cxp=(e.clientX!==undefined?e.clientX:e.touches[0].clientX);
  const cyp=(e.clientY!==undefined?e.clientY:e.touches[0].clientY);
  return {x:(cxp-r.left)*sx,y:(cyp-r.top)*sy};
}

let dragging=false;
function beginInput(){ if(!started){started=true;} else if(gameOver){ reset(); } }
function reset(){ lives=3;score=0;round=1;gameOver=false;started=true;setupRound(); }

c.addEventListener('mousedown',e=>{ beginInput(); dragging=true; });
c.addEventListener('mousemove',e=>{ if(!started||gameOver||roundWin)return; const p=rectFromClient(e); updateTool(p.x,p.y); });
window.addEventListener('mouseup',()=>dragging=false);
c.addEventListener('touchstart',e=>{ e.preventDefault(); beginInput(); const p=rectFromClient(e); if(started&&!gameOver&&!roundWin)updateTool(p.x,p.y); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(!started||gameOver||roundWin)return; const p=rectFromClient(e); updateTool(p.x,p.y); },{passive:false});

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.key)||e.code==='Space')e.preventDefault();
  if(!started||gameOver){ if(e.code==='Space'||e.code==='Enter')beginInput(); return; }
  if(roundWin)return;
  if(e.code==='ArrowLeft'){toolAngle-=0.14;updateAngleOnly();}
  else if(e.code==='ArrowRight'){toolAngle+=0.14;updateAngleOnly();}
  else if(e.code==='ArrowUp'){toolR-=4;processTool();}
  else if(e.code==='ArrowDown'){toolR+=4;processTool();}
});
function updateAngleOnly(){ processTool(); }

function loop(){
  ctx.clearRect(0,0,W,H);
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#241a10');bgGrad.addColorStop(1,'#140d08');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  // target contour glow
  ctx.save();
  ctx.shadowColor='#4fd1c5';ctx.shadowBlur=14;
  ctx.strokeStyle='#4fd1c5';ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=(i/N)*Math.PI*2;
    const r=radiusAt(a);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();

  // traced overlay
  ctx.lineWidth=5;
  for(let i=0;i<N;i++){
    if(!traced[i]&&dentAt[i]<=0)continue;
    const a0=(i/N)*Math.PI*2,a1=((i+1)/N)*Math.PI*2;
    const r0=radiusAt(a0);
    ctx.strokeStyle = dentAt[i]>0 ? `rgba(255,90,90,${0.4+dentAt[i]*0.5})` : '#8bffb0';
    ctx.beginPath();
    ctx.arc(cx,cy,r0,a0,a1);
    ctx.stroke();
  }

  // form fill (wet clay look)
  ctx.save();
  ctx.globalAlpha=0.18;
  ctx.fillStyle='#caa06a';
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=(i/N)*Math.PI*2;
    const r=radiusAt(a);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();

  // tool cursor
  const tx=cx+Math.cos(toolAngle)*toolR,ty=cy+Math.sin(toolAngle)*toolR;
  ctx.fillStyle='#ffcf7a';
  ctx.beginPath();ctx.arc(tx,ty,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

  ctx.font='12px Arial';ctx.textAlign='left';ctx.fillStyle='#f3d9b1';
  ctx.fillText(I18N.t('progress_label','Traced: {p}%').replace('{p}',Math.round(totalProgress/N*100)),20,380);
  ctx.fillText(I18N.t('dents_label','Dents: {d}/{m}').replace('{d}',dents).replace('{m}',maxDents),250,380);

  if(!started){
    ctx.fillStyle='#f3d9b188';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Drag or press Space to start shaping'),W/2,80);
    requestAnimationFrame(loop);return;
  }
  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,80);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,110);
    requestAnimationFrame(loop);return;
  }
  if(roundWin){
    winTimer++;
    ctx.fillStyle='#8bffb0';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('shape_complete_label','SHAPE COMPLETE!'),W/2,80);
    if(winTimer>70){ round++; setupRound(); }
    requestAnimationFrame(loop);return;
  }

  time-=1/60;
  if(time<=0){
    time=0;lives--;SFX.fail();
    if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=score;localStorage.setItem('papiermachemoldshaping_hi',hi);}}
    else setupRound();
  }
  if(dents>=maxDents){
    lives--;SFX.fail();
    if(lives<=0){gameOver=true;SFX.lose();if(score>hi){hi=score;localStorage.setItem('papiermachemoldshaping_hi',hi);}}
    else setupRound();
  } else if(totalProgress>=N*0.96){
    roundWin=true;winTimer=0;
    score+=150+round*30;
    if(score>hi){hi=score;localStorage.setItem('papiermachemoldshaping_hi',hi);}
    SFX.success();
  }

  document.getElementById('round').textContent=round;
  document.getElementById('lives').textContent=lives;
  document.getElementById('score').textContent=score;
  document.getElementById('hi').textContent=hi;
  document.getElementById('timer').textContent=Math.ceil(time);

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
