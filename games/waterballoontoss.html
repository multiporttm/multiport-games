<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Water Balloon Toss</title><meta name="description" content="Play Water Balloon Toss free online — Click or tap the moment the balloon arrives to catch it. Each catch sends the tossers a step further apart!"><link rel="canonical" href="https://games.multiportllc.com/games/waterballoontoss"><meta property="og:title" content="Water Balloon Toss - Multiport Games"><meta property="og:description" content="Play Water Balloon Toss free online — Click or tap the moment the balloon arrives to catch it. Each catch sends the tossers a step further apart!"><meta property="og:url" content="https://games.multiportllc.com/games/waterballoontoss"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Water Balloon Toss","description":"Play Water Balloon Toss free online instantly. Click or tap the moment the balloon arrives at the catch zone to catch it. Every successful catch sends the two tossers a step further apart, making the next throw longer and harder to time. Miss the timing window and the balloon pops! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/waterballoontoss","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#26c6da,#0288d1);display:block;border-radius:8px;touch-action:none;cursor:pointer}
#score-display{color:#e0f7fa;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Water Balloon Toss</div>
  <div class="game-frame">
    <div id="score-display">Streak: 0 | Best: 0</div>
    <canvas id="c" width="800" height="280"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the balloon arc across — <b>Click</b> or <b>Tap</b> the instant it reaches the catch zone to catch it. Every successful catch pushes the tossers further apart, so stay sharp! Catch too early, too late, or not at all and the balloon pops.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280;
let hiStreak=parseInt(localStorage.getItem('waterballoontoss_hi')||'0',10);

let streak,started,popped,progress,duration,leftX,rightX,throwToRight,windowStart,windowEnd,lastTime,resultTimer,caught,level;
const groundY=H-40;

function computePositions(lv){
  const gap=Math.min(300,120+lv*22);
  leftX=W/2-gap/2;
  rightX=W/2+gap/2;
}

function reset(){
  streak=0;level=0;started=false;popped=false;resultTimer=0;lastTime=null;
  computePositions(level);
  startThrow(true);
}

function startThrow(toRight){
  throwToRight=toRight;
  progress=0;
  duration=Math.max(38,80-level*2.2);
  const winSize=Math.max(0.07,0.22-level*0.008);
  windowEnd=1;
  windowStart=1-winSize;
  caught=false;
}

function beginGame(){
  if(popped){reset();return;}
  if(!started){started=true;lastTime=null;}
}

function attemptCatch(){
  if(!started){beginGame();return;}
  if(popped){reset();return;}
  if(caught)return;
  if(progress>=windowStart&&progress<=windowEnd){
    caught=true;
    streak++;
    level++;
    if(streak>hiStreak){hiStreak=streak;localStorage.setItem('waterballoontoss_hi',hiStreak);}
    SFX.catch();
    computePositions(level);
    setTimeout(()=>{ if(!popped) startThrow(!throwToRight); },200);
  } else {
    popped=true;
    SFX.fail();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();attemptCatch();}
});
c.addEventListener('mousedown',attemptCatch);
c.addEventListener('touchstart',e=>{e.preventDefault();attemptCatch();},{passive:false});

reset();

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('wbt_score_label','Streak: {s} | Best: {b}')
      .replace('{s}',streak).replace('{b}',hiStreak);
}

function drawPerson(x,label){
  ctx.fillStyle='#ffccbc';
  ctx.beginPath();ctx.arc(x,groundY-70,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5c6bc0';
  ctx.fillRect(x-14,groundY-58,28,44);
  ctx.fillStyle='#37474f';
  ctx.fillRect(x-12,groundY-14,10,20);
  ctx.fillRect(x+2,groundY-14,10,20);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(label,x,groundY-92);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#26c6da');grad.addColorStop(1,'#0288d1');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4caf50';ctx.fillRect(0,groundY,W,H-groundY);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wbt_start_hint','Click / Tap / Space to start!'),W/2,40);
    drawPerson(leftX,I18N.t('wbt_you_label','YOU'));
    drawPerson(rightX,I18N.t('wbt_partner_label','PARTNER'));
    requestAnimationFrame(loop);return;
  }

  if(popped){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wbt_pop','SPLASH! Balloon Popped'),W/2,40);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('wbt_final_streak','Final Streak: {s}').replace('{s}',streak),W/2,70);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,96);
    drawPerson(leftX,I18N.t('wbt_you_label','YOU'));
    drawPerson(rightX,I18N.t('wbt_partner_label','PARTNER'));
    requestAnimationFrame(loop);return;
  }

  progress+=dt/duration;
  if(progress>1)progress=1;

  const fromX=throwToRight?leftX:rightX;
  const toX=throwToRight?rightX:leftX;
  const bx=fromX+(toX-fromX)*progress;
  const arcHeight=70+level*4;
  const by=groundY-70-Math.sin(progress*Math.PI)*arcHeight;

  drawPerson(leftX,I18N.t('wbt_you_label','YOU'));
  drawPerson(rightX,I18N.t('wbt_partner_label','PARTNER'));

  // catch zone indicator on receiving side
  const catchX=toX;
  ctx.strokeStyle= (progress>=windowStart&&progress<=windowEnd) ? '#ffeb3b' : 'rgba(255,255,255,0.4)';
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(catchX,groundY-75,26,0,Math.PI*2);ctx.stroke();

  // balloon
  ctx.fillStyle='#42a5f5';
  ctx.beginPath();ctx.ellipse(bx,by,12,15,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1565c0';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(bx-4,by-5,3,0,Math.PI*2);ctx.fill();

  if(progress>=1&&!caught){
    popped=true;
    SFX.fail();
  }

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('wbt_level_label','Toss #{n}').replace('{n}',level+1),10,20);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
