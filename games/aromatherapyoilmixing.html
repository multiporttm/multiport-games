<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0c2f2a;display:block;border-radius:8px;touch-action:none}
#hud{color:#43cea2;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#80deea}
#hud span.hs{color:#7ec850}
#ratioBtns{display:flex;justify-content:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
#ratioBtns button{padding:8px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.9rem;color:#fff;background:#185a9d}
#ratioBtns button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Aromatherapy Oil Mixing</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="ratioBtns"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the client's request and pick the <b>safe dilution ratio</b> for their essential oil blend. Press the matching <b>number key</b> or <b>tap</b> a ratio button before the client's patience runs out — too strong or too weak fails the order.</div>
</div>
<script>
(function(){
const HS_KEY='aromatherapyoilmixing_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const PURPOSES=[
  {key:'relax',label:'Relaxation Blend',oil:'Lavender + Chamomile',ideal:3},
  {key:'energy',label:'Energy Blend',oil:'Citrus + Peppermint',ideal:4},
  {key:'focus',label:'Focus Blend',oil:'Rosemary + Lemon',ideal:3},
  {key:'sleep',label:'Sleep Blend',oil:'Lavender + Vetiver',ideal:2}
];
const CLIENTS=[
  {key:'adult',label:'Adult client',max:5},
  {key:'sensitive',label:'Pregnant / sensitive-skin client',max:2},
  {key:'child',label:'Child client',max:1}
];
const RATIOS=[0.5,1,2,3,4,5];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let order=null,choices=[],timeLeft=0,timeLimit=0,resolved=false,mixing=0,mixDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function correctRatio(p,cl){ return Math.min(p.ideal,cl.max); }

function buildButtons(){
  const el=document.getElementById('ratioBtns');
  el.innerHTML='';
  choices.forEach((r,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+r+'%';
    btn.dataset.i=i;
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(i);});
    el.appendChild(btn);
  });
}

function newOrder(){
  timeLimit=Math.max(220,480-level*22);
  timeLeft=timeLimit;
  mixing=0;mixDone=false;resolved=false;
  const p=PURPOSES[Math.floor(Math.random()*PURPOSES.length)];
  const cl=CLIENTS[Math.floor(Math.random()*CLIENTS.length)];
  const correct=correctRatio(p,cl);
  const count=Math.min(RATIOS.length,3+Math.floor(level/2));
  const pool=shuffle(RATIOS.filter(r=>r!==correct)).slice(0,count-1);
  choices=shuffle([correct,...pool]);
  order={p,cl,correct};
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newOrder(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newOrder();
}

function passRound(){
  score+=25*level;SFX.coin();
  if(score>=level*260)levelUp();
  newOrder();
}

function onGuess(i){
  if(!started||gameOver)return;
  if(!mixDone||resolved)return;
  resolved=true;
  if(choices[i]===order.correct){ passRound(); }
  else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m&&started&&!gameOver){ e.preventDefault(); onGuess(parseInt(m[1],10)-1); }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawBottles(){
  const sx=W/2,sy=170;
  ctx.save();
  ctx.fillStyle='#e0f7fa';
  ctx.fillRect(sx-130,sy-40,60,100);
  ctx.fillRect(sx+70,sy-40,60,100);
  const fill=Math.min(1,mixing*1.3);
  ctx.fillStyle='#43cea2';
  ctx.fillRect(sx-130,sy+60-fill*90,60,fill*90);
  ctx.fillStyle='#ffb74d';
  ctx.fillRect(sx+70,sy+60-fill*90,60,fill*90);
  ctx.strokeStyle='#004d40';ctx.lineWidth=2;
  ctx.strokeRect(sx-130,sy-40,60,100);
  ctx.strokeRect(sx+70,sy-40,60,100);
  ctx.restore();
  if(mixDone){
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('order_'+order.p.key,order.p.label),sx,sy-70);
    ctx.font='15px Arial';ctx.fillStyle='#b2dfdb';
    ctx.fillText(I18N.t('oil_'+order.p.key,order.p.oil),sx,sy+90);
    ctx.font='16px Arial';ctx.fillStyle='#ffe082';
    ctx.fillText(I18N.t('client_'+order.cl.key,order.cl.label),sx,sy+118);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#06201c');bg.addColorStop(1,'#0c2f2a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#43cea2';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    if(order)drawBottles();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!mixDone){
    mixing+=0.012+level*0.0012;
    if(mixing>=1){mixing=1;mixDone=true;SFX.swoosh();}
  } else {
    timeLeft--;
    if(timeLeft<=0){ failRound(); }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(mixDone?I18N.t('pick_hint','Pick the safe dilution — press 1-9 or tap below'):I18N.t('mixing_hint','Measuring oils...'),W/2,30);

  if(mixDone){
    const barW=400,barH=10,barX=W/2-barW/2,barY=44;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  }

  if(order)drawBottles();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
