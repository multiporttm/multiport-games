<style>
body{background:#08080f}
#c{background:#0e0e18;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff6b6b;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Subway Emergency Braking</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> / <b>Down Arrow</b> or <b>Tap</b> to brake the instant a hazard or red signal appears ahead. Stop in the safe zone — too early causes delays, too late means a collision. 3 mistakes ends your shift!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const HS_KEY='hs_subwayemergencybraking';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const trackY=200;
let trainX=80;
let speed=0;
let baseSpeed=5.5;
let braking=false;
let brakeStrength=0.28;
let lives=3;
let score=0;
let round=0;
let hazard=null; // {x, type, triggered}
let safeZone=null; // {x1,x2}
let gameState='ready'; // ready, running, resultgood, resultbad, lost
let resultTimer=0;
let resultMsg='',resultColor='#fff';
let distanceToStopAtBrake=0;
let roundActive=false;

function reset(){
  lives=3;score=0;round=0;
  trainX=80;speed=baseSpeed;braking=false;
  gameState='ready';
  hazard=null;safeZone=null;
}
reset();

function spawnRound(){
  round++;
  trainX=80;
  speed=Math.min(10,baseSpeed+round*0.3);
  braking=false;
  const hazardX=550+Math.random()*180;
  const types=['obstruction','signal'];
  hazard={x:hazardX,type:types[Math.floor(Math.random()*types.length)],visible:false,appearAt:hazardX-250-Math.random()*120};
  // safe zone: train must stop with front within [hazard.x-70, hazard.x-15]
  safeZone={x1:hazard.x-70,x2:hazard.x-15};
  roundActive=true;
  gameState='running';
}

function brake(){
  if(gameState==='ready'){ gameState='running'; spawnRound(); return; }
  if(gameState==='resultgood'||gameState==='resultbad'||gameState==='lost'){
    if(gameState==='lost'){ reset(); return; }
    spawnRound();
    return;
  }
  if(gameState!=='running'||!roundActive)return;
  if(!braking){
    braking=true;
    SFX.hit();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowDown'){ e.preventDefault(); brake(); }
});
c.addEventListener('pointerdown',e=>{ brake(); });

function endRound(success,msg,color){
  roundActive=false;
  resultMsg=msg;resultColor=color;resultTimer=70;
  if(success){
    score+=20+round*3;
    SFX.success();
    gameState='resultgood';
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  } else {
    lives--;
    SFX.fail();
    gameState='resultbad';
    if(lives<=0){
      setTimeout(()=>{ gameState='lost'; SFX.lose(); },800);
    }
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
  }
}

function update(dt){
  if(gameState!=='running'||!roundActive)return;
  if(hazard && !hazard.visible && trainX>=hazard.appearAt) hazard.visible=true;

  if(braking){
    speed=Math.max(0,speed-brakeStrength*dt);
  }
  trainX+=speed*dt;

  if(braking && speed<=0.05){
    // stopped — evaluate
    speed=0;
    if(trainX>=safeZone.x1 && trainX<=safeZone.x2){
      endRound(true,I18N.t('safe_stop','Safe stop!'),'#7ec850');
    } else if(trainX<safeZone.x1){
      endRound(false,I18N.t('too_early','Braked too early — delay!'),'#ffb74d');
    } else {
      endRound(false,I18N.t('collision','Collision!'),'#e94560');
    }
    return;
  }

  if(trainX>=hazard.x-8){
    // collided without stopping in time
    endRound(false,I18N.t('collision','Collision!'),'#e94560');
  }
}

function drawTrain(x,y){
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(x,y-40,70,40);
  ctx.fillStyle='#1a2233';
  ctx.fillRect(x+8,y-32,16,14);
  ctx.fillRect(x+30,y-32,16,14);
  ctx.fillRect(x+52,y-32,12,14);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(x+60,y-10,8,6);
}

function drawHazard(h){
  ctx.save();
  ctx.font='40px Arial';ctx.textAlign='center';
  if(h.type==='obstruction'){
    ctx.fillText('🪨',h.x,trackY-5);
  } else {
    ctx.fillText('🚦',h.x,trackY-5);
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0a14');sky.addColorStop(1,'#141420');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // track
  ctx.fillStyle='#2a2a3a';ctx.fillRect(0,trackY,W,8);
  for(let i=0;i<W;i+=40) ctx.fillRect(i,trackY+8,24,6,'#555');

  ctx.textAlign='left';ctx.font='bold 20px Arial';ctx.fillStyle='#ff6b6b';
  ctx.fillText(I18N.t('round_label','Round {r}').replace('{r}',round),16,30);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',lives),W-16,30);

  if(gameState==='running'&&roundActive){
    if(hazard.visible) drawHazard(hazard);
    // safe zone marker
    ctx.fillStyle='rgba(126,200,80,0.25)';
    ctx.fillRect(safeZone.x1,trackY-50,safeZone.x2-safeZone.x1,50);
    drawTrain(trainX,trackY);
    ctx.fillStyle='#9ecbff';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('speed_label','Speed: {v}').replace('{v}',speed.toFixed(1)),W/2,30);
  }

  if(resultTimer>0){
    resultTimer--;
    ctx.globalAlpha=Math.min(1,resultTimer/30);
    ctx.fillStyle=resultColor;ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,H/2);
    ctx.globalAlpha=1;
  }

  if(gameState==='resultgood'||gameState==='resultbad'){
    ctx.fillStyle='#ccc';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tap_continue','Tap or Space to continue'),W/2,H-24);
  }

  if(gameState==='ready'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_title','Subway Emergency Braking'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or Press Space to start'),W/2,H/2+16);
  }
  if(gameState==='lost'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SHIFT OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+16);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
