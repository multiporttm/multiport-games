<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#1a1030,#0a0a18);display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:22px;color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;flex-wrap:wrap}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Popcorn Pop</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="lives-display">Misses: 0/5</span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your bucket with <b>Arrow Keys</b>, <b>A/D</b>, or by <b>dragging</b> to catch popping kernels. Avoid the burnt black kernels! Miss too much good popcorn or catch too many burnt kernels and it's game over. Speed and pop rate increase the longer you last.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const groundY=H-30;
const popperX=W/2,popperY=groundY;

let score=0,hi=parseFloat(localStorage.getItem('popcornpop_best')||'0');
let misses=0,burntCaught=0;
const MAX_MISSES=5,MAX_BURNT=3;
let gameOver=false,started=false;
let bucket={x:W/2-45,w:90,y:groundY-10,h:26,speed:9};
let kernels=[]; // {x,y,vx,vy,burnt,r}
let popTimer=0,popInterval=55,elapsed=0;
let keys={};
let dragActive=false;

function reset(){
  score=0;misses=0;burntCaught=0;gameOver=false;started=false;kernels=[];popTimer=0;popInterval=55;elapsed=0;
  bucket.x=W/2-45;
}
reset();

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('misses_label','Misses: {m}/{max}').replace('{m}',misses).replace('{max}',MAX_MISSES);
}

function start(){
  if(!started){started=true;return;}
  if(gameOver){
    if(score>hi){hi=score;localStorage.setItem('popcornpop_best',String(hi));}
    reset();
  }
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright','a','d',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(!started||gameOver)start();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerToBucket(clientX){
  const rect=c.getBoundingClientRect();
  const scale=W/rect.width;
  const x=(clientX-rect.left)*scale;
  bucket.x=Math.max(0,Math.min(W-bucket.w,x-bucket.w/2));
}
c.addEventListener('pointerdown',e=>{
  if(!started||gameOver){start();return;}
  dragActive=true;pointerToBucket(e.clientX);
});
c.addEventListener('pointermove',e=>{if(dragActive)pointerToBucket(e.clientX);});
window.addEventListener('pointerup',()=>{dragActive=false;});

function spawnKernel(){
  const burnt=Math.random()<Math.min(0.12+elapsed/6000,0.32);
  const angle=(Math.random()-0.5)*1.1; // spread
  const power=8.5+Math.random()*3.5+Math.min(elapsed/4000,3);
  kernels.push({
    x:popperX+(Math.random()-0.5)*30,
    y:popperY,
    vx:Math.sin(angle)*3.5,
    vy:-power,
    burnt,r:12
  });
}

function drawPopper(){
  ctx.fillStyle='#c94b4b';
  ctx.fillRect(popperX-45,popperY-10,90,50);
  ctx.fillStyle='#e8e8e8';
  ctx.fillRect(popperX-40,popperY-40,80,32);
  ctx.strokeStyle='#333';ctx.lineWidth=3;
  ctx.strokeRect(popperX-45,popperY-10,90,50);
  ctx.strokeRect(popperX-40,popperY-40,80,32);
}

function drawBucket(){
  ctx.save();
  ctx.fillStyle='#e94560';
  ctx.beginPath();
  ctx.moveTo(bucket.x,bucket.y);
  ctx.lineTo(bucket.x+bucket.w,bucket.y);
  ctx.lineTo(bucket.x+bucket.w-8,bucket.y+bucket.h);
  ctx.lineTo(bucket.x+8,bucket.y+bucket.h);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
  for(let i=0;i<3;i++){
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.moveTo(bucket.x+10+i*(bucket.w-20)/2,bucket.y+3);
    ctx.lineTo(bucket.x+6+i*(bucket.w-12)/2,bucket.y+bucket.h-3);ctx.stroke();
  }
  ctx.restore();
}

function drawKernel(k){
  ctx.beginPath();
  ctx.fillStyle=k.burnt?'#2b2119':'#fff3c4';
  ctx.arc(k.x,k.y,k.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=k.burnt?'#1a140f':'#e9c46a';
  ctx.beginPath();ctx.arc(k.x-4,k.y-4,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(k.x+5,k.y+3,3,0,Math.PI*2);ctx.fill();
}

function rectCircle(rect,cx,cy,r){
  const closestX=Math.max(rect.x,Math.min(cx,rect.x+rect.w));
  const closestY=Math.max(rect.y,Math.min(cy,rect.y+rect.h));
  const dx=cx-closestX,dy=cy-closestY;
  return dx*dx+dy*dy<r*r;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1030');sky.addColorStop(1,'#0a0a18');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a1f3f';ctx.fillRect(0,groundY+16,W,H-groundY-16);

  drawPopper();

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint2','Move / Tap / Space to start catching!'),W/2,120);
    drawBucket();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final score: {s}').replace('{s}',Math.floor(score)),W/2,225);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint3','Tap / Space to try again'),W/2,260);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  elapsed++;
  if(keys['arrowleft']||keys['a'])bucket.x-=bucket.speed;
  if(keys['arrowright']||keys['d'])bucket.x+=bucket.speed;
  bucket.x=Math.max(0,Math.min(W-bucket.w,bucket.x));

  popInterval=Math.max(16,55-elapsed/50);
  popTimer++;
  if(popTimer>=popInterval){popTimer=0;spawnKernel();}

  const gravity=0.28;
  kernels=kernels.filter(k=>{
    k.vy+=gravity;
    k.x+=k.vx;k.y+=k.vy;
    drawKernel(k);
    const bucketRect={x:bucket.x,y:bucket.y,w:bucket.w,h:bucket.h};
    if(k.vy>0&&rectCircle(bucketRect,k.x,k.y,k.r)){
      if(k.burnt){
        burntCaught++;
        SFX.error();
        if(burntCaught>=MAX_BURNT){gameOver=true;SFX.lose();}
      }else{
        score+=10;
        if(score>hi)hi=score;
        SFX.catch();
      }
      return false;
    }
    if(k.y>H+20){
      if(!k.burnt){
        misses++;
        SFX.hit();
        if(misses>=MAX_MISSES){gameOver=true;SFX.lose();}
      }
      return false;
    }
    return true;
  });

  drawBucket();
  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
