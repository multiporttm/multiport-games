<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#7a1e1e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lunar New Year Parade</div>
  <div class="game-frame">
    <div id="score-display">Envelopes: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b>, or <b>drag</b> on mobile, to move the dragon dance team up and down the parade route. Collect red envelopes for points and <b>jump (Space / Up)</b> over firecrackers and obstacles. Speed increases the longer you survive!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const LANES=[80,140,200]; // y positions, top/mid/bottom lane centers (ground lanes)
let envelopes=0,lives=3,hi=+(localStorage.getItem('lunarnewyearparade_best')||0);
let spd=5,frame=0,gameOver=false,started=false;
const dragon={x:100,laneIdx:1,y:200,vy:0,jumping:false,w:60,h:44,invuln:0};
let items=[]; // envelopes and obstacles
let lastTime=null,spawnTimer=0;
let dragStartY=null;

function reset(){
  envelopes=0;lives=3;spd=5;frame=0;gameOver=false;started=false;
  dragon.laneIdx=1;dragon.y=LANES[1];dragon.vy=0;dragon.jumping=false;dragon.invuln=0;
  items=[];lastTime=null;spawnTimer=0;
}

function moveLane(dir){
  if(!started)started=true;
  if(gameOver){reset();return;}
  dragon.laneIdx=Math.max(0,Math.min(2,dragon.laneIdx+dir));
}
function jump(){
  if(!started)started=true;
  if(gameOver){reset();return;}
  if(!dragon.jumping){dragon.jumping=true;dragon.vy=-11;SFX.jump();}
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','KeyW','Space'].includes(e.code)){e.preventDefault();jump();}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();moveLane(1);}
  else if(e.code==='ArrowLeft'||e.code==='KeyA'){/* no-op, could slow */}
});

c.addEventListener('pointerdown',e=>{
  const rect=c.getBoundingClientRect();
  dragStartY=(e.clientY-rect.top)*(H/rect.height);
  if(!started){started=true;}
});
c.addEventListener('pointerup',e=>{
  if(dragStartY===null)return;
  const rect=c.getBoundingClientRect();
  const endY=(e.clientY-rect.top)*(H/rect.height);
  const dy=endY-dragStartY;
  if(gameOver){reset();dragStartY=null;return;}
  if(Math.abs(dy)<18){ jump(); }
  else if(dy<0){ moveLane(-1); }
  else { moveLane(1); }
  dragStartY=null;
});

function spawnItem(){
  const isObstacle=Math.random()<0.42;
  const laneIdx=Math.floor(Math.random()*3);
  if(isObstacle){
    items.push({x:820,laneIdx,type:'obstacle',w:34,h:26});
  } else {
    items.push({x:820,laneIdx,type:'envelope',w:26,h:32});
  }
}

function laneY(idx){ return LANES[idx]; }

function drawDragonHead(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#e94560';
  ctx.beginPath();
  ctx.ellipse(0,0,26,20,0,0,7);
  ctx.fill();
  // horns
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.moveTo(-10,-16);ctx.lineTo(-16,-30);ctx.lineTo(-2,-18);ctx.fill();
  ctx.beginPath();ctx.moveTo(6,-16);ctx.lineTo(12,-30);ctx.lineTo(0,-18);ctx.fill();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(10,-4,6,0,7);ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(12,-4,3,0,7);ctx.fill();
  // mouth
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(20,6);ctx.lineTo(30,2);ctx.stroke();
  ctx.restore();
}

function drawDragon(){
  const x=dragon.x,y=dragon.y;
  // body segments (dancers under cloth) trailing behind
  ctx.fillStyle='#ff6b6b';
  for(let i=0;i<4;i++){
    const segX=x-40-i*32;
    const bob=Math.sin(frame*0.25+i)*4;
    ctx.beginPath();
    ctx.ellipse(segX,y+bob,20,14,0,0,7);
    ctx.fill();
    ctx.fillStyle=i%2===0?'#ff6b6b':'#ffb400';
  }
  ctx.fillStyle='#e94560';
  ctx.fillRect(x-40,y-6,120,10);
  drawDragonHead(x,y);
}

function drawObstacle(o){
  const y=laneY(o.laneIdx);
  ctx.save();
  ctx.translate(o.x,y);
  ctx.fillStyle='#ff3b3b';
  ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(-o.w/2,-o.h/2,o.w,4);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,-o.h/2-6);ctx.lineTo(4,-o.h/2-14);ctx.stroke();
  ctx.restore();
}

function drawEnvelope(o){
  const y=laneY(o.laneIdx);
  ctx.save();
  ctx.translate(o.x,y);
  ctx.fillStyle='#e94560';
  ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
  ctx.strokeRect(-o.w/2+2,-o.h/2+2,o.w-4,o.h-4);
  ctx.restore();
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4a0f0f');sky.addColorStop(1,'#7a1e1e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // lane guides
  LANES.forEach(ly=>{
    ctx.strokeStyle='rgba(255,213,79,.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,ly+22);ctx.lineTo(W,ly+22);ctx.stroke();
  });
  // lanterns decoration
  for(let i=0;i<8;i++){
    const lx=((i*110)-((frame*1.2)%110)+W)%W;
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.ellipse(lx,30,10,14,0,0,7);ctx.fill();
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint2','Tap or Space to restart'),W/2,158);
    updateScore();
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lny_start','Press a key / Tap to start'),W/2,120);
    dragon.y=laneY(dragon.laneIdx);
    drawDragon();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  spd=5+envelopes/25;

  // smooth lane movement
  const targetY=laneY(dragon.laneIdx);
  dragon.y+=(targetY-dragon.y)*0.25*dt;

  // jump physics (affects visual bounce via vy on top of lane y)
  let jumpOffset=0;
  if(dragon.jumping){
    dragon.vy+=0.7*dt;
    dragon.jumpY=(dragon.jumpY||0)+dragon.vy*dt;
    jumpOffset=dragon.jumpY;
    if(dragon.jumpY>=0){dragon.jumping=false;dragon.jumpY=0;dragon.vy=0;jumpOffset=0;}
  }
  const drawY=dragon.y+jumpOffset;

  spawnTimer+=dt;
  const interval=Math.max(35,80-envelopes/6);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnItem();}

  if(dragon.invuln>0)dragon.invuln-=dt;

  items=items.filter(o=>o.x>-40);
  items.forEach(o=>{
    o.x-=spd*dt;
    if(o.type==='obstacle')drawObstacle(o); else drawEnvelope(o);
    const oy=laneY(o.laneIdx);
    const dragonBox={x:dragon.x-30,y:drawY-20,w:70,h:40};
    const itemBox={x:o.x-o.w/2,y:oy-o.h/2,w:o.w,h:o.h};
    if(rectsOverlap(dragonBox,itemBox)&&!o.hit){
      if(o.type==='envelope'){
        o.hit=true;o.x=-999;
        envelopes+=10;
        SFX.coin();
      } else {
        // obstacle: only hurts if not jumping high enough
        const airborne=jumpOffset<-14;
        if(!airborne&&dragon.invuln<=0){
          o.hit=true;
          lives--;
          dragon.invuln=60;
          SFX.hit();
          if(lives<=0){
            gameOver=true;
            if(envelopes>hi){hi=envelopes;localStorage.setItem('lunarnewyearparade_best',hi);}
            SFX.lose();
          }
        }
      }
    }
  });

  ctx.save();
  ctx.translate(0,jumpOffset);
  const savedY=dragon.y;
  dragon.y=drawY;
  if(dragon.invuln>0&&Math.floor(frame/4)%2===0){ctx.globalAlpha=0.4;}
  drawDragon();
  ctx.globalAlpha=1;
  dragon.y=savedY;
  ctx.restore();

  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('lny_score_label','Envelopes: {e} | Lives: {l} | Hi: {h}')
      .replace('{e}',envelopes).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

loop();
</script></body></html>
