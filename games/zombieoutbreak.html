<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1b1b1b}
#ui{color:#a5d6a7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
#swingBtn{display:block;margin:4px auto;padding:10px 22px;border-radius:10px;background:#c62828;color:#fff;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Zombie Outbreak</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Wave: 1 | HP: 100 | Kills: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
    <button id="swingBtn">🔪 Swing (Space)</button>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to move. Space or the Swing button to attack zombies within range. Survive as many waves as you can!</div>
</div>
<script>
const W=360,H=360,SIZE=20;
let player,zombies,wave,hp,kills,state,keys={},swingT=0,spawnTimer,waveCount;

function rand(min,max){return min+Math.random()*(max-min);}

function init(){
  player={x:W/2,y:H/2};
  wave=1;hp=100;kills=0;state='play';
  zombies=[];waveCount=0;
  startWave();
}

function startWave(){
  waveCount=3+wave*2;
  spawnTimer=0;
}

function spawnZombie(){
  const side=Math.floor(rand(0,4));
  let x,y;
  if(side===0){x=rand(0,W);y=-20;}
  else if(side===1){x=W+20;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=H+20;}
  else{x=-20;y=rand(0,H);}
  zombies.push({x,y,hp:2+Math.floor(wave/3)});
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();swing();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});
document.getElementById('swingBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  swing();
});

function swing(){
  if(state!=='play'||swingT>0)return;
  swingT=14;
  zombies.forEach(z=>{
    if(Math.hypot(z.x-player.x,z.y-player.y)<45)z.hp-=1;
  });
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.4;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  if(swingT>0)swingT--;

  spawnTimer--;
  if(spawnTimer<=0&&waveCount>0){
    spawnZombie();waveCount--;spawnTimer=40;
  }

  zombies.forEach(z=>{
    const d=dist(z,player)||1;
    const zspd=0.9+wave*0.05;
    z.x+=(player.x-z.x)/d*zspd;
    z.y+=(player.y-z.y)/d*zspd;
    if(d<16){hp-=0.4;}
  });

  const dead=zombies.filter(z=>z.hp<=0);
  kills+=dead.length;
  zombies=zombies.filter(z=>z.hp>0);

  if(waveCount<=0&&zombies.length===0){
    wave++;startWave();
  }

  if(hp<=0){
    hp=0;state='over';
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1b1b1b';ctx.fillRect(0,0,W,H);

  if(swingT>0){
    ctx.strokeStyle='rgba(255,235,59,.5)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(player.x,player.y,45,0,Math.PI*2);ctx.stroke();
  }

  ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  zombies.forEach(z=>ctx.fillText('🧟',z.x,z.y));

  ctx.font='22px Arial';
  ctx.fillText('🧑',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ef5350';ctx.font='bold 26px Arial';
    ctx.fillText('OVERRUN!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Wave: ${wave} | Kills: ${kills}`,W/2,H/2+12);
    ctx.fillText('Tap Swing to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Wave: ${wave} | HP: ${Math.max(0,Math.floor(hp))} | Kills: ${kills}`;
}

init();draw();
</script></body></html>
