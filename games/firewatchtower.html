<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1b3a1f;display:block;border-radius:8px;cursor:crosshair}
#score-display{color:#ffcc80;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Fire Watch Tower</div>
  <div class="game-frame">
    <div id="score-display">Fires: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Scan the forest and <b>Click</b> or <b>Tap</b> the hidden wildfire (🔥) before the timer runs out. Watch out for decoys — clouds, birds, and sunlit clearings look similar at a glance!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=480;
let fires=0,lives=3,hi=parseInt(localStorage.getItem('firewatchtower_hi')||'0'),round=0;
let started=false,gameOver=false,roundResult=null,resultTimer=0;
let icons=[],timeLeft=0,timeLimit=0;
let lastTime=null;

function rand(a,b){return a+Math.random()*(b-a);}

function newRound(){
  round++;
  const count=Math.min(38, 8+round*3);
  timeLimit=Math.max(3.2, 9-round*0.35);
  timeLeft=timeLimit;
  icons=[];
  const fireIdx=Math.floor(Math.random()*count);
  const types=['cloud','bird','clearing'];
  let tries=0;
  while(icons.length<count && tries<2000){
    tries++;
    const x=rand(40,W-40), y=rand(50,H-30);
    let bad=false;
    for(const it of icons){ if(Math.hypot(x-it.x,y-it.y)<34){bad=true;break;} }
    if(bad)continue;
    icons.push({x,y,type: icons.length===fireIdx? 'fire' : types[Math.floor(Math.random()*types.length)], size: rand(20,30)});
  }
  roundResult=null;
  resultTimer=0;
  lastTime=null;
}

function reset(){
  fires=0;lives=3;round=0;gameOver=false;started=false;
  newRound();
}

function canvasPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
}

function handleClick(e){
  e.preventDefault();
  if(!started){started=true;lastTime=null;return;}
  if(gameOver){reset();return;}
  if(roundResult)return;
  const p=canvasPos(e);
  let hitIcon=null,minD=Infinity;
  for(const it of icons){
    const d=Math.hypot(p.x-it.x,p.y-it.y);
    if(d<it.size+6 && d<minD){minD=d;hitIcon=it;}
  }
  if(hitIcon && hitIcon.type==='fire'){
    fires++;
    if(fires>hi){hi=fires;localStorage.setItem('firewatchtower_hi',hi);}
    SFX.success();
    roundResult='correct';
  } else {
    lives--;
    SFX.error();
    roundResult='wrong';
    if(lives<=0){ SFX.lose(); }
  }
}
c.addEventListener('mousedown',handleClick);
c.addEventListener('touchstart',handleClick,{passive:false});

function drawIcon(it){
  ctx.save();
  ctx.translate(it.x,it.y);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(it.type==='fire'){
    ctx.font=it.size+'px serif';
    ctx.fillText('🔥',0,0);
  } else if(it.type==='bird'){
    ctx.font=it.size*0.85+'px serif';
    ctx.fillText('🐦',0,0);
  } else if(it.type==='cloud'){
    ctx.font=it.size+'px serif';
    ctx.fillText('☁️',0,0);
  } else {
    ctx.fillStyle='rgba(255,224,130,0.85)';
    ctx.beginPath();ctx.ellipse(0,0,it.size*0.7,it.size*0.45,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawForestBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#274d2e');g.addColorStop(1,'#12280f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let i=0;i<40;i++){
    const x=(i*197)%W, y=(i*131)%H, r=20+((i*53)%30);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
}

function loop(){
  drawForestBg();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or click to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('fires_spotted_label','Fires spotted: {n}').replace('{n}',fires),W/2,H/2+8);
    ctx.fillText(I18N.t('restart_hint','Tap or click to restart'),W/2,H/2+40);
    requestAnimationFrame(loop);return;
  }

  icons.forEach(drawIcon);

  if(roundResult){
    resultTimer++;
    ctx.fillStyle=roundResult==='correct'?'rgba(102,187,106,0.25)':'rgba(239,83,80,0.25)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(roundResult==='correct'? I18N.t('spotted_it','Spotted it!') : I18N.t('missed_it','Missed! That was a decoy.'),W/2,50);
    if(resultTimer>50){
      if(lives<=0){ gameOver=true; }
      else { newRound(); }
    }
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;
  timeLeft-=dt;
  if(timeLeft<=0){
    timeLeft=0;
    lives--;
    SFX.error();
    roundResult='wrong';
    if(lives<=0)SFX.lose();
  }

  // timer bar
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(20,16,220,18);
  ctx.fillStyle=timeLeft/timeLimit>0.3?'#ffca28':'#ef5350';
  ctx.fillRect(20,16,220*(timeLeft/timeLimit),18);
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(20,16,220,18);

  document.getElementById('score-display').textContent =
    I18N.t('firewatch_status','Fires: {f} | Lives: {l} | Hi: {h}')
      .replace('{f}',fires).replace('{l}',lives).replace('{h}',hi);

  requestAnimationFrame(loop);
}
newRound();
loop();
</script></body></html>
