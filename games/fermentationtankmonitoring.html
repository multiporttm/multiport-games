<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#14202b;display:block;border-radius:8px}
#score-display{color:#6fc7e0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Fermentation Tank Monitoring</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>1-4</b> or <b>tap a tank</b> to select it, then press <b>C</b> / tap <b>Cool</b> to run the cooling jacket, or <b>P</b> / tap <b>Punch</b> to punch down the cap. Keep temperature and cap pressure inside the green safe zone — tanks that overflow spoil the batch!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const N=4;
let tanks=[],selected=0,lives=3,score=0,hi=parseInt(localStorage.getItem('hi_fermentationtankmonitoring')||'0',10);
let level=1,gameOver=false,started=false,lastTime=null,levelTimer=0,flashTimer=0,flashMsg='',flashGood=true;
let coolCooldown=[0,0,0,0],punchCooldown=[0,0,0,0];

function makeTank(){
  return {temp:68+Math.random()*6,cap:20+Math.random()*10,spoilT:0};
}

function reset(){
  tanks=[];for(let i=0;i<N;i++)tanks.push(makeTank());
  selected=0;lives=3;score=0;level=1;gameOver=false;started=false;lastTime=null;levelTimer=0;
  coolCooldown=[0,0,0,0];punchCooldown=[0,0,0,0];
}
reset();

function flash(msg,good){flashMsg=msg;flashGood=good;flashTimer=60;}

function driftRate(){return 0.045+(level-1)*0.018;}

function doCool(i){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(coolCooldown[i]>0)return;
  tanks[i].temp-=9;
  coolCooldown[i]=50;
  SFX.swoosh();
}
function doPunch(i){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  if(punchCooldown[i]>0)return;
  tanks[i].cap-=22;
  punchCooldown[i]=70;
  SFX.hit();
}

document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='4'){selected=parseInt(e.key,10)-1;SFX.select();}
  else if(e.key==='c'||e.key==='C')doCool(selected);
  else if(e.key==='p'||e.key==='P')doPunch(selected);
  else if(e.code==='Space'){if(!started){started=true;}else if(gameOver){reset();}}
});

function tankRect(i){
  const tw=150,gap=30,totalW=N*tw+(N-1)*gap,startX=(W-totalW)/2;
  return {x:startX+i*(tw+gap),y:70,w:tw,h:230};
}
function buttonRects(i){
  const tr=tankRect(i);
  return {
    cool:{x:tr.x,y:tr.y+tr.h+10,w:tr.w/2-4,h:34},
    punch:{x:tr.x+tr.w/2+4,y:tr.y+tr.h+10,w:tr.w/2-4,h:34}
  };
}
function inRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}

function handlePointer(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  for(let i=0;i<N;i++){
    const tr=tankRect(i);
    if(inRect(x,y,tr)){selected=i;SFX.select();return;}
    const br=buttonRects(i);
    if(inRect(x,y,br.cool)){selected=i;doCool(i);return;}
    if(inRect(x,y,br.punch)){selected=i;doPunch(i);return;}
  }
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  handlePointer((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];const r=c.getBoundingClientRect();
  handlePointer((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function drawGauge(x,y,w,h,val,min,max,safeLo,safeHi,color,label){
  ctx.fillStyle='#0b1620';ctx.fillRect(x,y,w,h);
  const pct=(v)=>h-h*Math.max(0,Math.min(1,(v-min)/(max-min)));
  // safe band
  ctx.fillStyle='rgba(90,200,120,0.3)';
  const syTop=pct(safeHi),syBot=pct(safeLo);
  ctx.fillRect(x,y+syTop,w,syBot-syTop);
  // value fill
  ctx.fillStyle=color;
  const vy=pct(val);
  ctx.fillRect(x,y+vy,w,h-vy);
  ctx.strokeStyle='#345';ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='#cfe';ctx.font='10px Arial';ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y-4);
  ctx.fillText(Math.round(val),x+w/2,y+h+12);
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0c1620');bg.addColorStop(1,'#14202b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('cellar_title','Fermentation Cellar'),W/2,32);
  ctx.font='14px Arial';
  ctx.fillText(I18N.t('lives_level_label','Lives: {l}  Level: {v}').replace('{l}','❤️'.repeat(Math.max(0,lives))).replace('{v}',level),W/2,54);

  if(!started){
    ctx.fillStyle='#6fc7e0';ctx.font='bold 22px Arial';
    ctx.fillText(I18N.t('start_hint2','Press any key or Tap a tank to start'),W/2,H/2);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,216);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  levelTimer+=dt;
  if(levelTimer>2700){levelTimer=0;level++;SFX.levelup();flash(I18N.t('level_up','Level {n}!').replace('{n}',level),true);}

  for(let i=0;i<N;i++){
    const tk=tanks[i];
    const dr=driftRate();
    tk.temp+=dr*dt*(0.6+Math.random()*0.8);
    tk.cap+=dr*1.1*dt*(0.6+Math.random()*0.8);
    if(coolCooldown[i]>0)coolCooldown[i]-=dt;
    if(punchCooldown[i]>0)punchCooldown[i]-=dt;

    const unsafe=tk.temp>88||tk.temp<58||tk.cap>95;
    if(unsafe){
      tk.spoilT+=dt;
      if(tk.spoilT>110){
        lives--;SFX.hurt();
        flash(I18N.t('tank_spoiled','Tank {n} spoiled!').replace('{n}',i+1),false);
        tanks[i]=makeTank();
        if(lives<=0){
          gameOver=true;SFX.lose();
          if(score>hi){hi=score;localStorage.setItem('hi_fermentationtankmonitoring',String(hi));}
        }
      }
    }else{
      tk.spoilT=Math.max(0,tk.spoilT-dt*2);
      score+=0.02*dt;
    }
  }

  for(let i=0;i<N;i++){
    const tr=tankRect(i);
    ctx.fillStyle=i===selected?'rgba(111,199,224,0.15)':'rgba(255,255,255,0.03)';
    ctx.fillRect(tr.x-6,tr.y-20,tr.w+12,tr.h+70);
    if(i===selected){ctx.strokeStyle='#6fc7e0';ctx.lineWidth=2;ctx.strokeRect(tr.x-6,tr.y-20,tr.w+12,tr.h+70);}
    ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText('Tank '+(i+1),tr.x+tr.w/2,tr.y-24);

    drawGauge(tr.x+10,tr.y,55,tr.h,tanks[i].temp,40,100,60,85,'#ff6b35',I18N.t('temp_label','TEMP'));
    drawGauge(tr.x+tr.w-65,tr.y,55,tr.h,tanks[i].cap,0,110,0,90,'#ffd54f',I18N.t('cap_label','CAP'));

    if(tanks[i].spoilT>0){
      ctx.fillStyle='rgba(224,80,80,'+Math.min(0.6,tanks[i].spoilT/110)+')';
      ctx.fillRect(tr.x-6,tr.y-20,tr.w+12,tr.h+70);
    }

    const br=buttonRects(i);
    ctx.fillStyle=coolCooldown[i]>0?'#355':'#2a7fa0';
    ctx.fillRect(br.cool.x,br.cool.y,br.cool.w,br.cool.h);
    ctx.fillStyle=punchCooldown[i]>0?'#553':'#b08a2a';
    ctx.fillRect(br.punch.x,br.punch.y,br.punch.w,br.punch.h);
    ctx.fillStyle='#fff';ctx.font='12px Arial';
    ctx.fillText(I18N.t('cool_btn','Cool'),br.cool.x+br.cool.w/2,br.cool.y+22);
    ctx.fillText(I18N.t('punch_btn','Punch'),br.punch.x+br.punch.w/2,br.punch.y+22);
  }

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashGood?'#7ec850':'#e05050';
    ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H-20);
    ctx.globalAlpha=1;
  }

  if(score>hi){hi=score;localStorage.setItem('hi_fermentationtankmonitoring',String(Math.floor(hi)));}
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
