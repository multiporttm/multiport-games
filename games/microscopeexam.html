<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#0b3d2e,#38ef7d);border-radius:14px;padding:20px;text-align:center;max-width:640px;margin:0 auto}
#stats{color:#fff;font-weight:800;font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;padding:0 6px}
#target{background:#0d1f17;color:#c8f7dc;border-radius:10px;padding:12px;margin:8px 0}
#targetName{color:#ffd54f;font-weight:900;font-size:1.15rem;margin-bottom:4px}
#targetDesc{font-size:.92rem}
#timerWrap{background:rgba(0,0,0,.3);border-radius:8px;height:14px;overflow:hidden;margin:8px 0}
#timerBar{height:100%;background:#66bb6a;width:100%;transition:width .1s linear}
#specimens{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.spec{background:#03150c;border:3px solid #1b5e20;border-radius:12px;cursor:pointer;padding:6px;transition:transform .1s,border-color .15s}
.spec:hover{transform:scale(1.03)}
.spec canvas{display:block;width:100%;height:auto;border-radius:8px}
.spec.correct{border-color:#66bb6a;box-shadow:0 0 12px #66bb6a}
.spec.wrong{border-color:#ef5350;box-shadow:0 0 12px #ef5350}
#msg{color:#fff;min-height:1.6em;font-weight:700;margin-top:8px}
#endScreen{display:none;color:#fff;padding:20px}
#endScreen button{margin-top:14px;padding:10px 26px;background:#ffd54f;color:#222;border:none;border-radius:20px;font-weight:800;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Microscope Exam</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="stats"><span id="idLabel">Identified: 0</span><span id="livesLabel">Lives: 3</span></div>
      <div id="game">
        <div id="target">
          <div id="targetName">Loading...</div>
          <div id="targetDesc"></div>
        </div>
        <div id="timerWrap"><div id="timerBar"></div></div>
        <div id="specimens"></div>
        <div id="msg"></div>
      </div>
      <div id="endScreen">
        <div style="font-size:1.4rem;font-weight:900" id="endTitle">Exam Over!</div>
        <div id="endStats" style="margin-top:8px"></div>
        <button id="restartBtn">Retake Exam</button>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the description and click the <b>specimen under the microscope</b> that matches it before the timer runs out. Watch out for similar-looking decoys!</div>
</div>
<script>
const SPECIES=[
  {name:"Red Blood Cell",desc:"Smooth, round, biconcave disc with no nucleus, uniform pale red.",shape:"disc",color:"#e57373",nucleus:false,texture:"smooth"},
  {name:"White Blood Cell",desc:"Round cell with a large, lobed dark nucleus filling most of the cell.",shape:"round",color:"#e3f2fd",nucleus:true,nucleusShape:"lobed",texture:"smooth"},
  {name:"Bacterium (Cocci)",desc:"Tiny perfect sphere, no nucleus, often found in clusters.",shape:"round",color:"#81c784",nucleus:false,texture:"smooth",small:true},
  {name:"Bacterium (Bacilli)",desc:"Small rod-shaped organism, no nucleus, elongated capsule form.",shape:"rod",color:"#4db6ac",nucleus:false,texture:"smooth",small:true},
  {name:"Plant Cell",desc:"Rigid rectangular shape with a thick cell wall and a visible round nucleus.",shape:"rect",color:"#aed581",nucleus:true,nucleusShape:"round",texture:"wall"},
  {name:"Yeast Cell",desc:"Oval cell, often budding a smaller oval off one side, single round nucleus.",shape:"oval",color:"#ffd54f",nucleus:true,nucleusShape:"round",texture:"bud"},
  {name:"Amoeba",desc:"Irregular blob shape with finger-like extensions, one round nucleus.",shape:"blob",color:"#ba68c8",nucleus:true,nucleusShape:"round",texture:"smooth"},
  {name:"Paramecium",desc:"Slipper-shaped cell covered in tiny hair-like cilia, oval nucleus.",shape:"slipper",color:"#4fc3f7",nucleus:true,nucleusShape:"oval",texture:"cilia"},
  {name:"Spirochete Bacterium",desc:"Long thin spiral-shaped organism, no nucleus.",shape:"spiral",color:"#f06292",nucleus:false,texture:"smooth",small:true},
  {name:"Fat Cell",desc:"Large round cell that looks nearly empty, with a thin nucleus pushed to the edge.",shape:"round",color:"#fff176",nucleus:true,nucleusShape:"crescent",texture:"hollow"}
];

let identified=0,lives=3,hi=0,gameOver=false,busy=false,timeLeft=0,duration=9000,timerId=null,lastTick=null,current=null,options=[];
hi=parseInt(localStorage.getItem('microscopeexam_hi')||'0',10);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(n,exclude){
  const pool=SPECIES.filter(s=>s!==exclude);
  return shuffle(pool).slice(0,n);
}
function jitter(base,amt){return base+(Math.random()*2-1)*amt;}

function drawSpecimen(canvas,species,seed){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  // background circle (microscope field)
  const grad=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,W/2);
  grad.addColorStop(0,'#0d2318');grad.addColorStop(1,'#020a06');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(W/2,H/2,W/2-2,0,Math.PI*2);ctx.fill();

  const cx=W/2+jitter(0,6),cy=H/2+jitter(0,6);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle=species.color;
  ctx.strokeStyle='rgba(0,0,0,.3)';
  ctx.lineWidth=2;

  const sz=species.small?18:32;
  switch(species.shape){
    case 'disc':
      ctx.beginPath();ctx.ellipse(0,0,sz,sz*0.85,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.15)';
      ctx.beginPath();ctx.ellipse(0,0,sz*0.45,sz*0.38,0,0,Math.PI*2);ctx.fill();
      break;
    case 'round':
      ctx.beginPath();ctx.arc(0,0,sz,0,Math.PI*2);ctx.fill();ctx.stroke();
      break;
    case 'rod':
      ctx.beginPath();ctx.roundRect?ctx.roundRect(-sz,-sz*0.35,sz*2,sz*0.7,sz*0.35):ctx.rect(-sz,-sz*0.35,sz*2,sz*0.7);ctx.fill();ctx.stroke();
      break;
    case 'rect':
      ctx.beginPath();ctx.rect(-sz,-sz*0.8,sz*2,sz*1.6);ctx.fill();ctx.stroke();
      break;
    case 'oval':
      ctx.beginPath();ctx.ellipse(0,0,sz*0.8,sz,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      if(species.texture==='bud'){
        ctx.beginPath();ctx.ellipse(sz*0.8,sz*0.4,sz*0.35,sz*0.4,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      }
      break;
    case 'blob':
      ctx.beginPath();
      const pts=8;
      for(let i=0;i<pts;i++){
        const ang=i/pts*Math.PI*2;
        const r=sz*(0.7+0.4*Math.sin(seed+i*1.7));
        const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fill();ctx.stroke();
      break;
    case 'slipper':
      ctx.beginPath();
      ctx.ellipse(0,0,sz,sz*0.55,0.3,0,Math.PI*2);
      ctx.fill();ctx.stroke();
      if(species.texture==='cilia'){
        ctx.strokeStyle=species.color;ctx.lineWidth=1;
        for(let i=0;i<16;i++){
          const ang=i/16*Math.PI*2;
          const x1=Math.cos(ang)*sz*0.9,y1=Math.sin(ang)*sz*0.5;
          const x2=Math.cos(ang)*(sz*0.9+6),y2=Math.sin(ang)*(sz*0.5+6);
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        }
      }
      break;
    case 'spiral':
      ctx.strokeStyle=species.color;ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();
      for(let i=0;i<=40;i++){
        const t=i/40*Math.PI*4;
        const x=t*3-sz*1.2,y=Math.sin(t)*8;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
      break;
  }

  if(species.nucleus){
    ctx.fillStyle='rgba(20,10,40,.75)';
    ctx.strokeStyle='rgba(0,0,0,.4)';
    const nsz=sz*0.32;
    if(species.nucleusShape==='lobed'){
      for(let i=0;i<3;i++){
        const ang=i/3*Math.PI*2;
        ctx.beginPath();ctx.arc(Math.cos(ang)*nsz*0.6,Math.sin(ang)*nsz*0.6,nsz*0.6,0,Math.PI*2);ctx.fill();
      }
    } else if(species.nucleusShape==='crescent'){
      ctx.beginPath();ctx.arc(sz*0.5,0,nsz*0.8,Math.PI*0.3,Math.PI*1.7);ctx.fill();
    } else if(species.nucleusShape==='oval'){
      ctx.beginPath();ctx.ellipse(0,0,nsz*0.7,nsz,0,0,Math.PI*2);ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,nsz,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function nextRound(){
  busy=false;
  const numDecoys=Math.min(5,2+Math.floor(identified/2));
  const decoys=pick(numDecoys,null);
  current=decoys[0];
  // ensure current isn't accidentally duplicated among decoys
  options=shuffle([current,...decoys.slice(1,numDecoys)].filter((v,i,arr)=>arr.indexOf(v)===i));
  if(options.length<2){ // fallback safety
    options=shuffle(pick(3,null));
    current=options[0];
  }
  document.getElementById('targetName').textContent=current.name;
  document.getElementById('targetDesc').textContent=current.desc;
  const wrap=document.getElementById('specimens');
  wrap.innerHTML='';
  options.forEach((sp,i)=>{
    const div=document.createElement('div');
    div.className='spec';
    const canvas=document.createElement('canvas');
    canvas.width=140;canvas.height=140;
    div.appendChild(canvas);
    drawSpecimen(canvas,sp,Math.random()*10);
    div.onclick=()=>choose(sp,div);
    wrap.appendChild(div);
  });
  document.getElementById('msg').textContent='';
  duration=Math.max(4500,9000-identified*350);
  timeLeft=duration;
  lastTick=performance.now();
  if(timerId)cancelAnimationFrame(timerId);
  tick();
}

function tick(){
  if(gameOver||busy)return;
  const now=performance.now();
  const dt=now-lastTick;
  lastTick=now;
  timeLeft-=dt;
  const pct=Math.max(0,timeLeft/duration*100);
  const bar=document.getElementById('timerBar');
  bar.style.width=pct+'%';
  bar.style.background=pct>50?'#66bb6a':pct>20?'#ffca28':'#ef5350';
  if(timeLeft<=0){
    timeout();
    return;
  }
  timerId=requestAnimationFrame(tick);
}

function timeout(){
  busy=true;
  document.getElementById('msg').textContent=I18N.t('me_timeout','Time\'s up! Specimen went unidentified.');
  document.getElementById('msg').style.color='#ff8a80';
  document.querySelectorAll('.spec').forEach((d,i)=>{if(options[i]===current)d.classList.add('correct');});
  SFX.error();
  loseLife();
}

function choose(sp,div){
  if(busy||gameOver)return;
  busy=true;
  cancelAnimationFrame(timerId);
  if(sp===current){
    div.classList.add('correct');
    identified++;
    document.getElementById('idLabel').textContent=I18N.t('me_id_label','Identified: {n}').replace('{n}',identified);
    document.getElementById('msg').textContent=I18N.t('me_correct','Correct identification!');
    document.getElementById('msg').style.color='#a5d6a7';
    SFX.success();
    setTimeout(nextRound,900);
  } else {
    div.classList.add('wrong');
    document.querySelectorAll('.spec').forEach((d,i)=>{if(options[i]===current)d.classList.add('correct');});
    document.getElementById('msg').textContent=I18N.t('me_wrong','Wrong specimen! That\'s not a match.');
    document.getElementById('msg').style.color='#ff8a80';
    SFX.error();
    loseLife();
  }
}

function loseLife(){
  lives--;
  document.getElementById('livesLabel').textContent=I18N.t('me_lives_label','Lives: {n}').replace('{n}',lives);
  if(lives<=0){
    endExam();
  } else {
    setTimeout(nextRound,1100);
  }
}

function endExam(){
  gameOver=true;
  cancelAnimationFrame(timerId);
  if(identified>hi){hi=identified;localStorage.setItem('microscopeexam_hi',hi);}
  document.getElementById('game').style.display='none';
  document.getElementById('endScreen').style.display='block';
  document.getElementById('endTitle').textContent=I18N.t('me_exam_over','Exam Over!');
  document.getElementById('endStats').textContent=I18N.t('me_end_stats','Specimens identified: {n} | Best: {h}').replace('{n}',identified).replace('{h}',hi);
  SFX.lose();
}

document.getElementById('restartBtn').onclick=()=>{
  identified=0;lives=3;gameOver=false;
  document.getElementById('idLabel').textContent=I18N.t('me_id_label','Identified: {n}').replace('{n}',identified);
  document.getElementById('livesLabel').textContent=I18N.t('me_lives_label','Lives: {n}').replace('{n}',lives);
  document.getElementById('game').style.display='block';
  document.getElementById('endScreen').style.display='none';
  nextRound();
};

nextRound();
</script></body></html>
