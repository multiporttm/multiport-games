<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#1a1a2e,#3e2723);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffab40;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Moth to the Flame</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Guide your moth with <b>Arrow Keys</b>, <b>WASD</b>, or <b>Touch-drag</b>. Hovering near the flame scores points, but get too close and you'll get burned. Dodge the drifting spiderwebs and bats. You have <b>3 lives</b>!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const CX=W/2,CY=H/2;
let hi=parseInt(localStorage.getItem('mothflame_hi')||'0');
let score=0,lives=3,gameOver=false,started=false,lastTime=null,invuln=0;
const moth={x:150,y:150,vx:0,vy:0};
const keys={};
let hazards=[];
let particles=[];
let flameFlicker=0;
let spawnTimer=0;

function reset(){
  score=0;lives=3;gameOver=false;started=false;lastTime=null;invuln=0;
  moth.x=150;moth.y=150;moth.vx=0;moth.vy=0;
  hazards=[];particles=[];spawnTimer=0;
}
reset();

function spawnHazard(){
  const type=Math.random()<0.5?'web':'bat';
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*W;y=-20;}
  else if(edge===1){x=W+20;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}
  const ang=Math.atan2(CY-y,CX-x)+ (Math.random()-0.5)*1.2;
  hazards.push({type,x,y,vx:Math.cos(ang)*(type==='bat'?2.2:1.1),vy:Math.sin(ang)*(type==='bat'?2.2:1.1),spin:0});
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    e.preventDefault();keys[e.code]=true;
    if(!started){started=true;}
    if(gameOver){reset();}
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}
let dragging=false;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameOver){reset();return;}
  started=true;dragging=true;
  const p=pointerPos(e);moth.x=p.x;moth.y=p.y;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const p=pointerPos(e);moth.x=p.x;moth.y=p.y;
},{passive:false});
c.addEventListener('touchend',e=>{dragging=false;});
c.addEventListener('click',()=>{ if(gameOver)reset(); if(!started)started=true; });

function drawFlame(){
  flameFlicker+=0.3;
  const flick=Math.sin(flameFlicker)*3+Math.sin(flameFlicker*2.7)*2;
  ctx.save();
  ctx.translate(CX,CY);
  const grad=ctx.createRadialGradient(0,0,5,0,0,90);
  grad.addColorStop(0,'rgba(255,220,120,0.5)');
  grad.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(0,0,90,0,Math.PI*2);ctx.fill();
  // candle body
  ctx.fillStyle='#e8dcc0';
  ctx.fillRect(-14,20,28,60);
  // flame
  ctx.beginPath();
  ctx.moveTo(0,-4);
  ctx.quadraticCurveTo(14+flick,-20,0,-46-flick);
  ctx.quadraticCurveTo(-14-flick,-20,0,-4);
  const fg=ctx.createLinearGradient(0,-46,0,0);
  fg.addColorStop(0,'#fff9c4');fg.addColorStop(0.5,'#ffb300');fg.addColorStop(1,'#e65100');
  ctx.fillStyle=fg;ctx.fill();
  ctx.restore();
}

function drawMoth(){
  ctx.save();
  ctx.translate(moth.x,moth.y);
  const ang=Math.atan2(moth.vy,moth.vx);
  ctx.rotate(ang+Math.PI/2);
  const flap=Math.sin(performance.now()/60)*0.6;
  ctx.fillStyle= invuln>0 && Math.floor(invuln/4)%2===0 ? '#ff8a80' : '#bdb2a7';
  ctx.save();ctx.rotate(flap*0.3);
  ctx.beginPath();ctx.ellipse(-10,-2,11,7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.rotate(-flap*0.3);
  ctx.beginPath();ctx.ellipse(10,-2,11,7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#5d4037';
  ctx.fillRect(-2,-10,4,18);
  ctx.restore();
}

function drawHazard(h){
  ctx.save();
  ctx.translate(h.x,h.y);
  if(h.type==='web'){
    h.spin+=0.02;
    ctx.rotate(h.spin);
    ctx.strokeStyle='rgba(230,230,230,0.85)';ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      ctx.save();ctx.rotate(i*Math.PI/3);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.stroke();
      ctx.restore();
    }
    for(let r=6;r<=18;r+=6){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();}
  } else {
    const flap=Math.sin(performance.now()/50)*8;
    ctx.fillStyle='#3d2b56';
    ctx.beginPath();ctx.ellipse(0,0,6,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-18,-6+flap);ctx.lineTo(-4,4);ctx.fill();
    ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(18,-6-flap);ctx.lineTo(4,4);ctx.fill();
  }
  ctx.restore();
}

function loseLife(){
  if(invuln>0)return;
  lives--;
  invuln=90;
  SFX.hurt();
  for(let i=0;i<14;i++)particles.push({x:moth.x,y:moth.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:30,color:'#ff7043'});
  if(lives<=0){gameOver=true;SFX.lose();}
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1a1a2e');bg.addColorStop(1,'#3e2723');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(gameOver){
    if(score>hi){hi=Math.floor(score);localStorage.setItem('mothflame_hi',hi);}
    drawFlame();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),CX,120);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Press a key or Tap to restart'),CX,158);
    document.getElementById('score-display').textContent=I18N.t('mf_status','Score: {s} | Hi: {h} | Lives: {l}').replace('{s}',Math.floor(score)).replace('{h}',hi).replace('{l}',0);
    requestAnimationFrame(loop);return;
  }

  if(!started){
    drawFlame();drawMoth();
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('mf_start','Move to start'),CX,H-30);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  const acc=0.5;
  if(keys.ArrowUp||keys.KeyW)moth.vy-=acc*dt;
  if(keys.ArrowDown||keys.KeyS)moth.vy+=acc*dt;
  if(keys.ArrowLeft||keys.KeyA)moth.vx-=acc*dt;
  if(keys.ArrowRight||keys.KeyD)moth.vx+=acc*dt;
  moth.vx*=0.92;moth.vy*=0.92;
  if(!dragging){
    moth.x+=moth.vx*dt;moth.y+=moth.vy*dt;
  }
  moth.x=Math.max(10,Math.min(W-10,moth.x));
  moth.y=Math.max(10,Math.min(H-10,moth.y));

  spawnTimer+=dt;
  const interval=Math.max(60,150-score/10);
  if(spawnTimer>=interval){spawnTimer=0;spawnHazard();}

  const distToFlame=Math.hypot(moth.x-CX,moth.y-CY);
  if(distToFlame<28){
    loseLife();
  } else if(distToFlame<70){
    const bonus=(70-distToFlame)/70;
    score+=bonus*0.5*dt;
  } else {
    score+=0.05*dt;
  }
  if(score>hi)hi=score;

  if(invuln>0)invuln-=dt;

  hazards=hazards.filter(h=>h.x>-40&&h.x<W+40&&h.y>-40&&h.y<H+40);
  hazards.forEach(h=>{
    h.x+=h.vx*dt;h.y+=h.vy*dt;
    drawHazard(h);
    const d=Math.hypot(h.x-moth.x,h.y-moth.y);
    if(d<16)loseLife();
  });

  drawFlame();
  drawMoth();

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  document.getElementById('score-display').textContent=I18N.t('mf_status','Score: {s} | Hi: {h} | Lives: {l}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)).replace('{l}',lives);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
