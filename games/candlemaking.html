<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4e342e;cursor:pointer}
#ui{color:#ffe0b2;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Candle Making</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Layers: 0/10 | Quality: 100%</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap to dip the wick into the wax vat, then tap again to pull it out — the marker needs to be inside the golden zone for a clean layer. Build up to 10 even layers for a perfect candle!</div>
</div>
<script>
const W=360,H=360;
let dipping,marker,dir,zoneStart,zoneLen,layers,quality,state;

function loadBest(){return +(localStorage.getItem('candlemaking_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('candlemaking_best',v);}

function init(){layers=0;quality=100;state='play';dipping=false;marker=0;dir=1;newZone();}
function newZone(){
  zoneLen=Math.max(12,28-layers);
  zoneStart=20+Math.random()*50;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(!dipping){
    dipping=true;marker=0;dir=1;
    SFX.click();
  }else{
    dipping=false;
    if(marker>=zoneStart&&marker<=zoneStart+zoneLen){
      layers++;
      SFX.success();
      saveBest(layers);
    }else{
      quality-=15;
      SFX.fail();
      if(quality<=0){state='over';SFX.lose();saveBest(layers);}
    }
    newZone();
    if(layers>=10){state='over';SFX.win();saveBest(layers);}
    updateUI();
  }
});

function update(){
  if(state!=='play'||!dipping)return;
  marker+=dir*2.4;
  if(marker>100||marker<0)dir*=-1;
}

function draw(){
  ctx.fillStyle='#4e342e';ctx.fillRect(0,0,W,H);

  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🕯️',W/2,120);

  const barW=W-60;
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(30,180,barW,20);
  ctx.fillStyle='#ffca28';ctx.fillRect(30+zoneStart*barW/100,180,zoneLen*barW/100,20);
  if(dipping){
    ctx.fillStyle='#fff';ctx.fillRect(30+marker*barW/100-2,175,4,30);
  }

  ctx.fillStyle='#8d6e63';
  for(let i=0;i<layers;i++){
    ctx.fillRect(W/2-20,240-i*8,40,8);
  }

  ctx.fillStyle='#ffe0b2';ctx.font='13px Arial';
  ctx.fillText(dipping?I18N.t('tap_pull_out','Tap to pull out'):I18N.t('tap_to_dip','Tap to dip'),W/2,260);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe0b2';ctx.font='bold 24px Arial';
    ctx.fillText(layers>=10?I18N.t('perfect_candle','PERFECT CANDLE!'):I18N.t('candle_ruined','CANDLE RUINED'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('layers_best_label','Layers: {n}/10 | Best: {b}').replace('{n}',layers).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_new_candle','Tap to start a new candle'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Layers: ${layers}/10 | Quality: ${Math.max(0,quality)}%`;
}

init();draw();
</script></body></html>
