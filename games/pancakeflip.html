<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#3a2a1e,#1c130d);display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:22px;color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;flex-wrap:wrap}
#hud span b{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pancake Flip</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="stack-display">Stack: 0</span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the browning bar fill as your pancake cooks. Click, tap, or press <b>Space</b> right when the bar is in the golden green zone to flip it high into the air and catch it back in the pan. Stack up perfect pancakes to score big!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const panX=400,panY=340,panRX=140,panRY=32;

let score=0,hi=parseFloat(localStorage.getItem('pancakeflip_best')||'0'),stack=0,gameOver=false,started=false;
let state='cooking'; // cooking, flying, burnt, missed
let brown=0; // 0..1
let cookRate=0;
let flyT=0,flyDur=0,flyStartY=panY,flyPeak=0,flyRot=0,flyRotSpeed=0;
let pancakeColor='#e9c46a';
let shakeT=0;
let round=0;
let particles=[];
let stackPancakes=[]; // colors of stacked pancakes for drawing

const GOOD_LO=0.42,GOOD_HI=0.62; // green zone
const OK_LO=0.30,OK_HI=0.75; // wider okay zone
const BURN_AT=0.92;

function reset(){
  score=0;stack=0;gameOver=false;started=false;state='cooking';brown=0;round=0;stackPancakes=[];particles=[];
  cookRate=0.0032;
}
reset();

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('stack-display').textContent=I18N.t('stack_label','Stack: {n}').replace('{n}',stack);
}

function newPancake(){
  state='cooking';
  brown=0;
  round++;
  cookRate=0.0028+round*0.00012;
  if(cookRate>0.009)cookRate=0.009;
}

function doFlip(){
  if(!started){started=true;newPancake();return;}
  if(gameOver){
    if(score>hi){hi=score;localStorage.setItem('pancakeflip_best',String(hi));}
    reset();return;
  }
  if(state!=='cooking')return;
  // Judge quality
  let quality,pts;
  if(brown>=GOOD_LO&&brown<=GOOD_HI){quality='perfect';pts=100+stack*5;}
  else if(brown>=OK_LO&&brown<=OK_HI){quality='ok';pts=40+stack*2;}
  else{quality='bad';pts=10;}
  pancakeColor=brownToColor(brown);
  state='flying';
  flyT=0;
  flyDur=quality==='perfect'?58:quality==='ok'?50:44;
  flyPeak=quality==='bad'?90:150;
  flyRotSpeed=quality==='bad'?(0.28+Math.random()*0.15):0.22;
  window._flipQuality=quality;
  window._flipPts=pts;
  SFX.jump();
}

function brownToColor(b){
  // interpolate from pale to dark brown to black(burnt)
  if(b<0.85){
    const t=Math.min(1,b/0.85);
    const r=Math.round(245-(245-140)*t);
    const g=Math.round(222-(222-90)*t);
    const bl=Math.round(170-(170-40)*t);
    return `rgb(${r},${g},${bl})`;
  }else{
    const t=Math.min(1,(b-0.85)/0.25);
    const r=Math.round(140-(140-40)*t);
    const g=Math.round(90-(90-25)*t);
    const bl=Math.round(40-(40-20)*t);
    return `rgb(${r},${g},${bl})`;
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();doFlip();}});
c.addEventListener('pointerdown',e=>{e.preventDefault();doFlip();});

function spawnBits(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*4-1,life:30,color});
  }
}

function drawPan(){
  ctx.save();
  ctx.fillStyle='#22262b';
  ctx.beginPath();ctx.ellipse(panX,panY,panRX+18,panRY+8,0,0,Math.PI*2);ctx.fill();
  const g=ctx.createRadialGradient(panX,panY-10,10,panX,panY,panRX);
  g.addColorStop(0,'#4b4f55');g.addColorStop(1,'#2c2f33');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(panX,panY,panRX,panRY,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.stroke();
  // handle
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(panX+panRX+10,panY-10,90,20);
  ctx.restore();
}

function drawPancake(x,y,scale,color,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot||0);
  ctx.scale(scale,scale*0.55);
  ctx.beginPath();ctx.arc(0,0,55,0,Math.PI*2);
  ctx.fillStyle=color;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=4;ctx.stroke();
  // bubbles/texture
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.beginPath();ctx.arc(-15,-10,8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(18,5,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(2,18,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawStack(){
  for(let i=0;i<stackPancakes.length;i++){
    const y=panY-16-i*14;
    if(y<40)continue;
    drawPancake(panX-160,y,0.9,stackPancakes[i],0);
  }
}

function drawBar(){
  const bx=250,by=40,bw=300,bh=26;
  ctx.fillStyle='#111';
  ctx.fillRect(bx-4,by-4,bw+8,bh+8);
  // zone backgrounds
  function zoneRect(lo,hi,color){
    ctx.fillStyle=color;
    ctx.fillRect(bx+lo*bw,by,(hi-lo)*bw,bh);
  }
  zoneRect(0,1,'#4a3520');
  zoneRect(OK_LO,OK_HI,'#c9a227');
  zoneRect(GOOD_LO,GOOD_HI,'#4caf50');
  zoneRect(BURN_AT,1,'#8a1e1e');
  // fill pointer
  const fx=bx+Math.min(brown,1)*bw;
  ctx.fillStyle='#fff';
  ctx.fillRect(fx-2,by-8,4,bh+16);
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('browning_label','Browning'),bx+bw/2,by-14);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // background kitchen
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#3a2a1e');sky.addColorStop(1,'#1c130d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<6;i++)ctx.fillRect(i*140,0,2,H);

  drawStack();
  drawPan();

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Click / Space to start cooking'),W/2,120);
    drawPancake(panX,panY-10,1,'#f2dca0',0);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_stack_label','Final stack: {n}').replace('{n}',stack),W/2,225);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint2','Tap / Space to try again'),W/2,260);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(state==='cooking'){
    brown+=cookRate;
    drawPancake(panX,panY-6,1,brownToColor(brown),0);
    drawBar();
    if(brown>=1){
      // burnt beyond bar - game over
      spawnBits(panX,panY,'#111',18);
      SFX.fail();
      gameOver=true;
    }
  } else if(state==='flying'){
    flyT++;
    const t=flyT/flyDur;
    const y=panY-6-Math.sin(Math.min(t,1)*Math.PI)*flyPeak;
    const x=panX+Math.sin(t*Math.PI)*10;
    flyRot+=flyRotSpeed;
    const scale=1+Math.sin(Math.min(t,1)*Math.PI)*0.15;
    drawPancake(x,y,scale,pancakeColor,flyRot);
    drawBar();
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    if(t>=1){
      const quality=window._flipQuality,pts=window._flipPts;
      if(quality==='bad'){
        // missed the pan - drop and end run
        SFX.fail();
        spawnBits(panX,panY,pancakeColor,14);
        gameOver=true;
      }else{
        score+=pts;
        stack++;
        stackPancakes.push(pancakeColor);
        SFX.catch();
        if(quality==='perfect')SFX.coin();
        newPancake();
      }
    }
  }

  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1;
  });

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
