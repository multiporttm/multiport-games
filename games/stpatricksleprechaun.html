<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#field{position:relative;width:100%;max-width:560px;aspect-ratio:7/5;margin:0 auto;background:linear-gradient(180deg,#0d3b1e,#1a5c30);border-radius:14px;overflow:hidden;touch-action:manipulation;user-select:none}
.clover{position:absolute;font-size:1.6rem;opacity:.5;transform:translate(-50%,-50%);pointer-events:none}
.spot{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:2.6rem;cursor:pointer;transition:transform .08s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.spot.pop{animation:pop .15s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
#hud{display:flex;justify-content:space-between;max-width:560px;margin:0 auto 10px;color:#ffd54f;font-weight:800;font-size:1.05rem}
#msg{text-align:center;color:#a3e6b0;min-height:1.4em;margin-top:8px;font-weight:700}
#startBtn{display:block;margin:14px auto 0;padding:10px 26px;background:#e94560;border:none;border-radius:22px;color:#fff;font-size:1rem;font-weight:800;cursor:pointer}
#startBtn:disabled{opacity:.4}
@media(max-width:480px){#hud{font-size:.9rem}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">St. Patrick's Leprechaun</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud"><span id="goldDisplay">Gold: 0</span><span id="timeDisplay">Time: 30</span><span id="bestDisplay">Best: 0</span></div>
    <div id="field"></div>
    <div id="msg">Click Start, then catch him when he stops!</div>
    <button id="startBtn">Start</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the field of clovers. When the leprechaun stops and flashes a <b>pot of gold</b>, click or tap him fast before he hops away! Hop speed increases and stop windows get shorter as your gold pile grows.</div>
</div>
<script>
const field=document.getElementById('field');
const goldDisplay=document.getElementById('goldDisplay');
const timeDisplay=document.getElementById('timeDisplay');
const bestDisplay=document.getElementById('bestDisplay');
const msg=document.getElementById('msg');
const startBtn=document.getElementById('startBtn');
const BEST_KEY='stpatricksleprechaun_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);
bestDisplay.textContent=I18N.t('best_label','Best: {b}').replace('{b}',best);

let gold=0,timeLeft=30,running=false,timerId=null,hopTimeout=null,readyToCatch=false,round=0;
let spotEl=null;

function placeClovers(){
  field.querySelectorAll('.clover').forEach(c=>c.remove());
  for(let i=0;i<16;i++){
    const c=document.createElement('div');
    c.className='clover';
    c.textContent='☘️';
    c.style.left=(6+Math.random()*88)+'%';
    c.style.top=(6+Math.random()*88)+'%';
    field.appendChild(c);
  }
}
placeClovers();

function randomPos(){
  return {x:12+Math.random()*76,y:12+Math.random()*76};
}

function spawnLeprechaun(){
  if(!running)return;
  if(spotEl)spotEl.remove();
  readyToCatch=false;
  const pos=randomPos();
  spotEl=document.createElement('div');
  spotEl.className='spot';
  spotEl.textContent='🧙';
  spotEl.style.left=pos.x+'%';
  spotEl.style.top=pos.y+'%';
  spotEl.addEventListener('click',catchLeprechaun);
  spotEl.addEventListener('touchstart',e=>{e.preventDefault();catchLeprechaun();},{passive:false});
  field.appendChild(spotEl);

  const hopDelay=Math.max(250,700-round*15);
  hopTimeout=setTimeout(()=>{
    if(!running)return;
    readyToCatch=true;
    spotEl.textContent='💰';
    spotEl.classList.add('pop');
    SFX.tick();
    const stopWindow=Math.max(350,1200-round*25);
    hopTimeout=setTimeout(()=>{
      if(!running)return;
      if(readyToCatch){
        readyToCatch=false;
        round++;
        spawnLeprechaun();
      }
    },stopWindow);
  },hopDelay);
}

function catchLeprechaun(){
  if(!running||!readyToCatch)return;
  readyToCatch=false;
  gold++;
  round++;
  goldDisplay.textContent=I18N.t('gold_label','Gold: {g}').replace('{g}',gold);
  msg.textContent=I18N.t('nice_catch','Nice catch!');
  SFX.coin();
  clearTimeout(hopTimeout);
  spawnLeprechaun();
}

function tick(){
  timeLeft--;
  timeDisplay.textContent=I18N.t('time_label','Time: {t}').replace('{t}',timeLeft);
  if(timeLeft<=0)endGame();
}

function startGame(){
  gold=0;round=0;timeLeft=30;running=true;
  goldDisplay.textContent=I18N.t('gold_label','Gold: {g}').replace('{g}',gold);
  timeDisplay.textContent=I18N.t('time_label','Time: {t}').replace('{t}',timeLeft);
  msg.textContent=I18N.t('go_catch','Go! Catch the gold!');
  startBtn.disabled=true;
  placeClovers();
  spawnLeprechaun();
  timerId=setInterval(tick,1000);
}

function endGame(){
  running=false;
  clearInterval(timerId);
  clearTimeout(hopTimeout);
  if(spotEl){spotEl.remove();spotEl=null;}
  startBtn.disabled=false;
  if(gold>best){
    best=gold;
    localStorage.setItem(BEST_KEY,String(best));
    bestDisplay.textContent=I18N.t('best_label','Best: {b}').replace('{b}',best);
    msg.textContent=I18N.t('new_best','New best! {g} gold coins!').replace('{g}',gold);
    SFX.win();
  } else {
    msg.textContent=I18N.t('time_up','Time\'s up! You caught {g} gold coins.').replace('{g}',gold);
    SFX.success();
  }
}

startBtn.addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!running)startGame();
    else catchLeprechaun();
  }
});
</script></body></html>
