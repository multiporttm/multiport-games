<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#263238}
#ui{color:#ffca28;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cell Block Break</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Level: 1 | Breakouts: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad) to move. Sweeping searchlights scan the yard — duck behind a 🧱 crate when one nears you. Getting caught in the light sends you back to the start!</div>
</div>
<script>
const W=360,H=360,SIZE=18;
let player,lights,cover,exitPos,level,breakouts,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}

function init(){level=1;breakouts=0;newLevel();}

function newLevel(){
  player={x:20,y:H-20};
  exitPos={x:W-24,y:24};
  const n=1+Math.floor(level/2);
  lights=[];
  for(let i=0;i<n;i++){
    lights.push({
      x:rand(60,W-60),axis:Math.random()<0.5?'h':'v',
      pos:Math.random()*W,speed:(1.2+level*0.15)*(Math.random()<0.5?1:-1),
      w:36+level*2,
    });
  }
  cover=[];
  for(let i=0;i<4+Math.floor(level/2);i++)cover.push({x:rand(30,W-30),y:rand(60,H-30)});
  state='play';
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='caught'){level=1;breakouts=0;newLevel();}});
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function nearCover(){return cover.some(c=>dist(player,c)<26);}

function inLight(l){
  if(l.axis==='h')return Math.abs(player.y-l.pos)<l.w/2;
  return Math.abs(player.x-l.pos)<l.w/2;
}

function update(){
  if(state!=='play')return;
  const spd=2.3;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  lights.forEach(l=>{
    l.pos+=l.speed;
    if(l.pos<0||l.pos>H)l.speed*=-1;
  });

  if(!nearCover()){
    for(const l of lights){
      if(inLight(l)){state='caught';SFX.lose();return;}
    }
  }

  if(dist(player,exitPos)<20){
    breakouts++;level++;
    SFX.levelup();
    newLevel();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);

  lights.forEach(l=>{
    ctx.fillStyle='rgba(255,235,59,.22)';
    if(l.axis==='h')ctx.fillRect(0,l.pos-l.w/2,W,l.w);
    else ctx.fillRect(l.pos-l.w/2,0,l.w,H);
  });

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  cover.forEach(c2=>ctx.fillText('🧱',c2.x,c2.y));

  ctx.fillStyle='#66bb6a';
  ctx.fillRect(exitPos.x-14,exitPos.y-14,28,28);

  const hidden=nearCover();
  ctx.globalAlpha=hidden?0.5:1;
  ctx.font='20px Arial';
  ctx.fillText('🧍',player.x,player.y);
  ctx.globalAlpha=1;

  if(state==='caught'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('caught_title','CAUGHT!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('breakouts_label','Breakouts: {n}').replace('{n}',breakouts),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap a D-pad button to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('level_label','Level: {n}').replace('{n}',level)+' | '+I18N.t('breakouts_label','Breakouts: {n}').replace('{n}',breakouts);
}

init();draw();
</script></body></html>
