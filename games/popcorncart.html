<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1810;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;color:#ffd54f;font-weight:700;font-size:1rem;flex-wrap:wrap;gap:6px}
#hud span{white-space:nowrap}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Popcorn Cart</div>
  <div class="game-frame">
    <div id="hud"><span id="order-display">Order: —</span><span id="score-display">Score: 0 | Hi: 0</span><span id="lives-display">Lives: 3</span></div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, click, or touch the popper to run it — kernels pop and pile into the bag. Release before the level passes the order's fill line! Undershoot or overflow costs a life, and letting the kettle run too hot burns the batch.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const orderDisp=document.getElementById('order-display'),scoreDisp=document.getElementById('score-display'),livesDisp=document.getElementById('lives-display');
const HI_KEY='popcorncart_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

const SIZES=[
  {id:'small',label:'Small',target:0.30,tol:0.05,color:'#ffe066'},
  {id:'medium',label:'Medium',target:0.55,tol:0.045,color:'#ffd54f'},
  {id:'large',label:'Large',target:0.78,tol:0.04,color:'#ffc94a'},
  {id:'tub',label:'Tub',target:0.97,tol:0.035,color:'#ffb300'},
];

let score=0,lives=3,gameOver=false,started=false;
let order=null,fill=0,popping=false,heat=0,burnt=false,resultTimer=0,resultMsg='',resultGood=false;
let kernels=[]; // visual particles
const BAG_X=340,BAG_Y=340,BAG_W=140,BAG_H=170;

function pickOrder(){
  const s=SIZES[Math.floor(Math.random()*SIZES.length)];
  order=s;
  fill=0;heat=0;burnt=false;popping=false;kernels=[];
  orderDisp.textContent=I18N.t('order_label','Order: {s}').replace('{s}',I18N.t('size_'+s.id,s.label));
}

function reset(){
  score=0;lives=3;gameOver=false;started=false;resultTimer=0;
  pickOrder();
  updateHud();
}

function updateHud(){
  scoreDisp.textContent=I18N.t('score_hi_label2','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesDisp.textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',lives);
}

function startPop(){
  if(!started){started=true;}
  if(gameOver){reset();return;}
  popping=true;
}
function stopPop(){
  if(!popping)return;
  popping=false;
  judge();
}

function judge(){
  const diff=fill-order.target;
  if(burnt){
    resultGood=false;resultMsg=I18N.t('result_burnt','Burnt! -1 life');
    lives--;SFX.fail();
  } else if(Math.abs(diff)<=order.tol){
    const bonus=Math.round(100*(1-Math.abs(diff)/order.tol));
    score+=100+bonus;
    resultGood=true;resultMsg=I18N.t('result_perfect','Perfect fill! +{n}').replace('{n}',100+bonus);
    SFX.success();
  } else if(diff>order.tol){
    resultGood=false;resultMsg=I18N.t('result_overflow','Overflowed the bag! -1 life');
    lives--;SFX.fail();
  } else {
    resultGood=false;resultMsg=I18N.t('result_short','Not enough popcorn! -1 life');
    lives--;SFX.fail();
  }
  updateHud();
  if(hi<score){hi=score;localStorage.setItem(HI_KEY,String(hi));}
  resultTimer=70;
  if(lives<=0){
    gameOver=true;SFX.lose();
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();startPop();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();stopPop();}});
c.addEventListener('mousedown',e=>{e.preventDefault();startPop();});
window.addEventListener('mouseup',()=>{stopPop();});
c.addEventListener('touchstart',e=>{e.preventDefault();startPop();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();stopPop();},{passive:false});
c.addEventListener('touchcancel',e=>{e.preventDefault();stopPop();},{passive:false});

function spawnKernel(){
  kernels.push({x:BAG_X+BAG_W/2+(Math.random()-0.5)*30,y:80,vy:2+Math.random()*1.5,r:4+Math.random()*3,settled:false,sx:BAG_X+20+Math.random()*(BAG_W-40)});
}
let popTimer=0;

function drawKettle(){
  ctx.save();
  ctx.fillStyle=heat>0.7?'#e05a2b':'#555';
  ctx.fillRect(120,60,140,90);
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.ellipse(190,60,70,14,0,0,Math.PI*2);ctx.fill();
  // heat gauge
  ctx.fillStyle='#222';ctx.fillRect(120,160,140,16);
  const heatColor=heat>0.85?'#ff3b30':heat>0.6?'#ff9500':'#4caf50';
  ctx.fillStyle=heatColor;ctx.fillRect(120,160,140*Math.min(1,heat),16);
  ctx.strokeStyle='#000';ctx.strokeRect(120,160,140,16);
  ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('heat_label','HEAT'),190,172);
  ctx.restore();
}

function drawBag(){
  ctx.save();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.strokeRect(BAG_X,BAG_Y,BAG_W,BAG_H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  ctx.fillRect(BAG_X,BAG_Y,BAG_W,BAG_H);
  // fill line for target
  if(order){
    const lineY=BAG_Y+BAG_H-(order.target*BAG_H);
    ctx.strokeStyle='#4caf50';ctx.setLineDash([6,4]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(BAG_X-8,lineY);ctx.lineTo(BAG_X+BAG_W+8,lineY);ctx.stroke();
    ctx.setLineDash([]);
    // tolerance band
    const tolTopY=BAG_Y+BAG_H-((order.target+order.tol)*BAG_H);
    const tolBotY=BAG_Y+BAG_H-((order.target-order.tol)*BAG_H);
    ctx.fillStyle='rgba(76,175,80,0.15)';
    ctx.fillRect(BAG_X,tolTopY,BAG_W,tolBotY-tolTopY);
  }
  // current fill
  const fh=Math.min(1,fill)*BAG_H;
  ctx.fillStyle=order?order.color:'#ffd54f';
  ctx.fillRect(BAG_X+3,BAG_Y+BAG_H-fh,BAG_W-6,fh);
  if(fill>1){
    ctx.fillStyle='rgba(255,60,40,0.5)';
    ctx.fillRect(BAG_X-6,BAG_Y-20,BAG_W+12,20);
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,800,400);
  const bg=ctx.createLinearGradient(0,0,0,400);
  bg.addColorStop(0,'#3d2418');bg.addColorStop(1,'#2a1810');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,400);

  drawKettle();
  drawBag();

  ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='left';
  if(order)ctx.fillText(I18N.t('order_label','Order: {s}').replace('{s}',I18N.t('size_'+order.id,order.label)),480,90);
  ctx.font='13px Arial';ctx.fillStyle='#ccc';
  ctx.fillText(I18N.t('pop_hint','Hold to pop, release to stop'),480,115);

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint2','Hold Space / Tap to start popping'),400,220);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,220);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,258);
    requestAnimationFrame(loop);return;
  }

  if(popping&&!burnt){
    heat=Math.min(1.15,heat+0.006);
    popTimer++;
    if(popTimer%3===0){
      fill+=0.012;
      spawnKernel();
      SFX.tick();
    }
    if(heat>=1){
      burnt=true;
      SFX.error();
    }
  } else {
    heat=Math.max(0,heat-0.01);
  }

  kernels=kernels.filter(k=>k.y<BAG_Y+BAG_H-4);
  kernels.forEach(k=>{
    k.y+=k.vy;
    ctx.fillStyle=burnt?'#5a3a1a':'#fff3c4';
    ctx.beginPath();ctx.arc(k.sx,Math.min(k.y,BAG_Y+BAG_H-10),k.r,0,Math.PI*2);ctx.fill();
  });

  if(resultTimer>0){
    resultTimer--;
    ctx.fillStyle=resultGood?'#4caf50':'#ff5252';
    ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,400,340);
    if(resultTimer===0&&!gameOver){pickOrder();}
  }

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
