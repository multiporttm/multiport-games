<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Boxing Bout</title><meta name="description" content="Play Boxing Bout free online — Punch when the opening flashes and dodge the counter to knock out each opponent."><link rel="canonical" href="https://games.multiportllc.com/games/boxingbout"><meta property="og:title" content="Boxing Bout - Multiport Games"><meta property="og:description" content="Play Boxing Bout free online — Punch when the opening flashes and dodge the counter to knock out each opponent."><meta property="og:url" content="https://games.multiportllc.com/games/boxingbout"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Boxing Bout","description":"Play Boxing Bout free online instantly. Punch when the opening flashes and dodge the counter to knock out each opponent. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/boxingbout","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#212121}
#ui{color:#ef9a9a;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#btns{display:flex;gap:8px;justify-content:center;margin:10px auto 4px}
#btns button{padding:12px 20px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(255,255,255,.25)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Boxing Bout</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Round: 1 | HP: 100</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="btns">
      <button id="punchBtn">🥊 Punch</button>
      <button id="dodgeBtn">💨 Dodge</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Punch the instant you see "OPEN!" for big damage. When you see the "!" warning above the opponent, Dodge before they swing or you'll take a hit. Knock out each opponent to advance!</div>
</div>
<script>
const W=360,H=360;
let round,hp,oppHp,oppMax,state,openT,windupT,msg='';

function loadBest(){return +(localStorage.getItem('boxingbout_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('boxingbout_best',v);}

function init(){round=1;hp=100;state='play';newOpp();}
function newOpp(){
  oppMax=50+round*12;oppHp=oppMax;
  openT=0;windupT=60+Math.random()*60;
}

document.getElementById('punchBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  if(openT>0){
    oppHp-=18;
    msg=I18N.t('msg_solid_hit','Solid hit!');
    SFX.hit();
    openT=0;
  }else{
    msg=I18N.t('msg_swung_air','Swung at air...');
    SFX.error();
  }
  checkOpp();
});
document.getElementById('dodgeBtn').addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(windupT<=15&&windupT>0){
    msg=I18N.t('msg_dodged','Dodged!');
    SFX.success();
    windupT=60+Math.random()*40;
  }
});

function checkOpp(){
  if(oppHp<=0){
    round++;
    SFX.win();
    saveBest(round-1);
    newOpp();
    msg=I18N.t('msg_round_n','Round {n}!').replace('{n}',round);
  }
}

function update(){
  if(state!=='play')return;
  if(openT>0)openT--;
  else if(Math.random()<0.012){openT=25;}

  windupT--;
  if(windupT<=0){
    hp-=10+round;
    SFX.hurt();
    msg=I18N.t('msg_took_hit','Took a hit!');
    windupT=60+Math.random()*60;
    if(hp<=0){hp=0;state='over';SFX.lose();}
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#212121';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(20,30,W-40,14);
  ctx.fillStyle='#ef5350';ctx.fillRect(20,30,(W-40)*Math.max(0,oppHp/oppMax),14);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('opponent_label','Opponent'),W/2,24);

  ctx.font='60px Arial';ctx.textBaseline='middle';
  ctx.fillText(windupT<=15?'😤':'🥊',W/2,130);
  if(windupT<=15){
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';
    ctx.fillText('!',W/2,85);
  }
  if(openT>0){
    ctx.fillStyle='#66bb6a';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('open_label','OPEN!'),W/2,175);
  }

  ctx.font='50px Arial';
  ctx.fillText('🧑',W/2,250);

  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(20,300,W-40,14);
  ctx.fillStyle='#66bb6a';ctx.fillRect(20,300,(W-40)*Math.max(0,hp/100),14);
  ctx.fillStyle='#fff';ctx.font='12px Arial';
  ctx.fillText(I18N.t('you_label','You'),W/2,294);

  ctx.fillStyle='#ef9a9a';ctx.font='13px Arial';
  ctx.fillText(msg,W/2,325);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ef9a9a';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('knocked_out_title2','KNOCKED OUT'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('reached_round_best_label','Reached Round: {n} | Best: {b}').replace('{n}',round).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('punch_retry_hint','Tap Punch to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('round_label','Round: {n}').replace('{n}',round)+' | '+I18N.t('hp_label','HP: {n}').replace('{n}',Math.max(0,Math.floor(hp)));
}

init();draw();
</script></body></html>
