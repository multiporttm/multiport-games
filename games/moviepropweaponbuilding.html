<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a2420;display:block;border-radius:8px}
#score-display{color:#e0b84c;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Movie Prop Weapon Building</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>blueprint</b>, then click/tap the parts bin in the exact order shown — <b>handle</b>, then <b>blade/barrel</b>, then <b>trim</b> — before the timer runs out. You have <b>3 lives</b>; a wrong pick costs one. Designs get more detailed as you level up.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const GAME_ID='moviepropweaponbuilding';
const W=800,H=400;

let score=0,hi=Number(localStorage.getItem(GAME_ID+'_hi')||0);
let lives=3,level=1,gameOver=false,won=false,started=false;
let seqIndex=0,sequence=[],bins=[],timeLeft=0,maxTime=0,lastTime=null,flashTimer=0,flashColor=null,shakeTimer=0;

// Part categories, each with a growing pool of named variants to make higher levels more "detailed".
const PART_POOLS={
  handle:['Grip','Hilt','Stock','Pommel','Wrapped Grip'],
  blade:['Short Blade','Long Blade','Barrel','Curved Blade','Dual Barrel'],
  trim:['Guard','Band','Rivets','Engraving','Jewel Inlay']
};
const COLORS={handle:'#8a5a30',blade:'#b9c3cc',trim:'#e0b84c'};

function buildLevel(){
  const partsPerWeapon=Math.min(3+Math.floor((level-1)/2),5); // more detail at higher levels, but sequence itself stays 3 categories deep conceptually
  sequence=['handle','blade','trim'];
  // Add extra trim/blade detail steps as levels rise, to represent "more detailed weapon designs"
  if(level>=3)sequence.push('trim');
  if(level>=5)sequence.push('blade');
  if(level>=7)sequence.push('handle');
  seqIndex=0;
  // Build a shuffled bin of candidate parts: the correct next few categories plus decoys
  const cats=Object.keys(PART_POOLS);
  const numBins=Math.min(5+Math.floor(level/2),9);
  bins=[];
  for(let i=0;i<numBins;i++){
    const cat=cats[Math.floor(Math.random()*cats.length)];
    const pool=PART_POOLS[cat];
    const label=pool[Math.floor(Math.random()*pool.length)];
    bins.push({cat,label,x:0,y:0,w:0,h:0,hit:false});
  }
  layoutBins();
  maxTime=Math.max(6,13-level*0.6);
  timeLeft=maxTime;
}

function layoutBins(){
  const cols=3,rows=Math.ceil(bins.length/cols);
  const bw=180,bh=70,gap=14;
  const startX=(W-(cols*bw+(cols-1)*gap))/2;
  const startY=230;
  bins.forEach((b,i)=>{
    const r=Math.floor(i/cols),cc=i%cols;
    b.x=startX+cc*(bw+gap);b.y=startY+r*(bh+gap);b.w=bw;b.h=bh;
  });
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;won=false;started=false;flashTimer=0;shakeTimer=0;lastTime=null;
  buildLevel();
}
reset();

function pointInBin(px,py,b){return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h;}

function handlePick(px,py){
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  for(const b of bins){
    if(b.hit)continue;
    if(pointInBin(px,py,b)){
      const wantCat=sequence[seqIndex];
      if(b.cat===wantCat){
        b.hit=true;
        seqIndex++;
        score+=20+level*2;
        SFX.coin();
        flashTimer=14;flashColor='#4caf50';
        if(seqIndex>=sequence.length){
          // weapon complete
          SFX.levelup();
          score+=50;
          level++;
          if(level>8){won=true;gameOver=true;SFX.win();finish();return;}
          buildLevel();
        }
      }else{
        lives--;
        SFX.error();
        flashTimer=14;flashColor='#e94560';
        shakeTimer=10;
        if(lives<=0){gameOver=true;won=false;SFX.lose();finish();}
      }
      return;
    }
  }
}

function finish(){
  if(score>hi){hi=score;localStorage.setItem(GAME_ID+'_hi',String(hi));}
}

function canvasPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

c.addEventListener('click',e=>{const p=canvasPos(e);handlePick(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=canvasPos(e);handlePick(p.x,p.y);},{passive:false});

let kbIndex=0;
document.addEventListener('keydown',e=>{
  if(e.code==='Enter'||e.code==='Space'){
    e.preventDefault();
    if(gameOver){reset();return;}
    if(!started){started=true;return;}
  }
  if(!started||gameOver)return;
  if(e.code==='ArrowRight'){kbIndex=(kbIndex+1)%bins.length;e.preventDefault();}
  if(e.code==='ArrowLeft'){kbIndex=(kbIndex-1+bins.length)%bins.length;e.preventDefault();}
  if(e.code==='ArrowDown'){kbIndex=Math.min(kbIndex+3,bins.length-1);e.preventDefault();}
  if(e.code==='ArrowUp'){kbIndex=Math.max(kbIndex-3,0);e.preventDefault();}
  if(e.code==='KeyZ'||e.code==='Enter'){
    const b=bins[kbIndex];
    if(b)handlePick(b.x+b.w/2,b.y+b.h/2);
  }
});

function drawBlueprint(){
  ctx.save();
  ctx.strokeStyle='#5577aa';ctx.lineWidth=2;
  ctx.strokeRect(40,40,720,150);
  ctx.fillStyle='#1a2a44';ctx.fillRect(40,40,720,150);
  ctx.fillStyle='#bcd4f0';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('blueprint_label','BLUEPRINT — Build in order:'),56,64);
  const stepW=700/Math.max(sequence.length,1);
  sequence.forEach((cat,i)=>{
    const x=56+i*stepW;
    const done=i<seqIndex;
    const current=i===seqIndex;
    ctx.fillStyle=done?'#4caf50':current?'#e0b84c':'#334';
    ctx.fillRect(x,80,stepW-10,90);
    ctx.fillStyle='#0b1220';
    ctx.font='bold 13px Arial';ctx.textAlign='center';
    const label=I18N.t('part_'+cat,cat.charAt(0).toUpperCase()+cat.slice(1));
    ctx.fillText(label,x+(stepW-10)/2,130);
    if(current){
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.strokeRect(x,80,stepW-10,90);
    }
  });
  ctx.restore();
}

function drawBins(){
  bins.forEach(b=>{
    ctx.save();
    ctx.fillStyle=b.hit?'#2e3b2e':(COLORS[b.cat]||'#555');
    ctx.globalAlpha=b.hit?0.35:1;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='#111';ctx.font='bold 14px Arial';ctx.textAlign='center';
    ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+5);
    ctx.restore();
  });
}

function loop(){
  ctx.save();
  if(shakeTimer>0){
    ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);
    shakeTimer--;
  }
  ctx.clearRect(-10,-10,W+20,H+20);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1c1812');sky.addColorStop(1,'#2a2420');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {l}').replace('{l}',level),20,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',Math.max(lives,0)),W-20,20);

  if(!started){
    ctx.fillStyle='#e0b84c';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Enter to start'),W/2,H/2);
    ctx.restore();requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawBlueprint();drawBins();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('you_win_title','PROP MASTER!'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Enter to restart'),W/2,H/2+20);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
    ctx.restore();requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;
  timeLeft-=dt;
  if(timeLeft<=0){
    lives--;SFX.error();flashTimer=14;flashColor='#e94560';
    if(lives<=0){gameOver=true;won=false;SFX.lose();finish();}
    else{buildLevel();}
  }

  drawBlueprint();
  drawBins();

  // timer bar
  const pct=Math.max(0,timeLeft/maxTime);
  ctx.fillStyle='#333';ctx.fillRect(40,370,720,14);
  ctx.fillStyle=pct<0.3?'#e94560':'#4caf50';ctx.fillRect(40,370,720*pct,14);

  if(flashTimer>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flashTimer/14*0.3;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    flashTimer--;
  }

  if(score>hi)hi=score;
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
