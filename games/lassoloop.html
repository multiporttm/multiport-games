<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#795548,#ffb300);display:block;border-radius:8px;margin:0 auto;touch-action:none;cursor:pointer}
#score-display{color:#ffe082;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lasso Loop</div>
  <div class="game-frame">
    <div id="score-display">Catches: 0 | Best Streak: 0</div>
    <canvas id="c" width="480" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Mouse / Space / Tap</b> to twirl your lasso and build the loop, then release right as the running target lines up under the <b>throw zone</b> to catch it. Each catch makes the next target faster and trickier!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=360;
const groundY=290, zoneCX=W/2, zoneW=70;
let hi=parseInt(localStorage.getItem('lasso_hi')||'0',10);
let catches=0, streak=0, bestStreak=hi;
let target={x:60,dir:1,speed:2.2};
let holding=false, loopPower=0, throwAnim=null, gameOver=false, started=false;
let msg='', msgTimer=0, misses=0, level=1;

function resetTarget(){
  target.x = Math.random()<0.5?40:W-40;
  target.dir = target.x<W/2?1:-1;
  target.speed=2+level*0.4+Math.random()*0.6;
}

function reset(){
  catches=0;streak=0;level=1;misses=0;gameOver=false;started=false;
  resetTarget();holding=false;loopPower=0;throwAnim=null;msg='';msgTimer=0;
}
reset();

function startHold(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(throwAnim)return;
  holding=true;
}
function releaseThrow(){
  if(!holding)return;
  holding=false;
  const inZone=Math.abs(target.x-zoneCX)<=zoneW/2;
  const power=loopPower;
  throwAnim={t:0,hit:inZone&&power>0.25};
  loopPower=0;
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();startHold();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();releaseThrow();}});
c.addEventListener('mousedown',startHold);
window.addEventListener('mouseup',releaseThrow);
c.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();releaseThrow();},{passive:false});

function drawTarget(){
  ctx.save();
  ctx.translate(target.x,groundY);
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(-14,-40,28,40);
  ctx.fillStyle='#4e342e';
  ctx.beginPath();ctx.arc(0,-48,14,0,Math.PI*2);ctx.fill();
  const legOff=Math.floor(Date.now()/100)%2===0?4:-4;
  ctx.fillStyle='#3e2723';
  ctx.fillRect(-10,0,6,14+legOff);
  ctx.fillRect(4,0,6,14-legOff);
  ctx.restore();
}

function drawLasso(){
  ctx.save();
  const cx=zoneCX, cy=groundY-70;
  if(holding){
    loopPower=Math.min(1,loopPower+0.025);
    const spin=Date.now()/120;
    const r=18+loopPower*22;
    ctx.strokeStyle='#8d6e63';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(cx,cy,r,r*0.5,spin,0,Math.PI*2);ctx.stroke();
  } else if(!throwAnim){
    ctx.strokeStyle='rgba(141,110,99,.6)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(cx,cy,18,10,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#795548');g.addColorStop(1,'#ffb300');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#a1887f';ctx.fillRect(0,groundY,W,H-groundY);

  // throw zone
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.fillRect(zoneCX-zoneW/2,groundY-90,zoneW,90);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.strokeRect(zoneCX-zoneW/2,groundY-90,zoneW,90);

  if(!started){
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lasso_start','Hold Space / Click / Tap to twirl'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(!gameOver && !throwAnim){
    target.x+=target.dir*target.speed;
    if(target.x<30){target.x=30;target.dir=1;}
    if(target.x>W-30){target.x=W-30;target.dir=-1;}
  }

  drawTarget();
  drawLasso();

  if(throwAnim){
    throwAnim.t+=0.08;
    if(throwAnim.t>=1){
      if(throwAnim.hit){
        catches++;streak++;
        if(streak>bestStreak){bestStreak=streak;localStorage.setItem('lasso_hi',bestStreak);}
        SFX.catch();
        msg=I18N.t('lasso_caught','🤠 Caught it! Streak: {s}').replace('{s}',streak);
        msgTimer=70;
        level++;
      } else {
        streak=0;misses++;
        SFX.fail();
        msg=I18N.t('lasso_missed','Missed the loop!');
        msgTimer=70;
        if(misses>=5){gameOver=true;SFX.lose();}
      }
      throwAnim=null;
      if(!gameOver)resetTarget();
    } else {
      ctx.strokeStyle='#5d4037';ctx.lineWidth=3;
      const cx=zoneCX, cy=groundY-70;
      const rr=20+30*throwAnim.t;
      ctx.beginPath();ctx.ellipse(target.x,groundY-40,rr*0.6,rr*0.4,0,0,Math.PI*2);ctx.stroke();
    }
  }

  if(holding){
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(20,H-24,W-40,14);
    ctx.fillStyle=loopPower>0.25?'#66bb6a':'#e94560';
    ctx.fillRect(20,H-24,(W-40)*loopPower,14);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(20,H-24,W-40,14);
  }

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,50);
  }

  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('misses_label2','Misses: {n}/5').replace('{n}',misses),10,20);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe082';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('lasso_final','Catches: {c} | Best Streak: {b}').replace('{c}',catches).replace('{b}',bestStreak),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+44);
  }

  document.getElementById('score-display').textContent=I18N.t('lasso_score_label','Catches: {c} | Best Streak: {b}').replace('{c}',catches).replace('{b}',bestStreak);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
