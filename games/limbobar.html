<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1b3d;display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Limbo Bar</div>
  <div class="game-frame">
    <div id="score-display">Passes: 0 | Best bar: 170</div>
    <canvas id="c" width="800" height="280"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, <b>Down Arrow</b>, or <b>press and hold</b> on the game to lean back and duck under the limbo bar as you walk forward — release to stand up straight again. Touch the bar and you're out. The bar drops lower with every successful pass!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280,groundY=240;
let bestHeight=parseInt(localStorage.getItem('limbo_best_height')||'170')||170;
let passes=0,gameOver=false,started=false;
let barHeight=170; // distance from ground to bar (higher number = higher bar = easier)
let barX=W+40;
let spd=4;
let lean=0; // 0 = standing, 1 = fully leaning
let leaning=false;
let lastTime=null;
let playerX=140;
let wobble=0;

function reset(){
  passes=0;gameOver=false;started=false;barHeight=170;barX=W+40;spd=4;lean=0;lastTime=null;wobble=0;
}

function setLean(v){
  leaning=v;
  if(!started){started=true;}
  if(gameOver && v){reset();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();setLean(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();setLean(false);}
});
c.addEventListener('mousedown',()=>setLean(true));
c.addEventListener('mouseup',()=>setLean(false));
c.addEventListener('mouseleave',()=>setLean(false));
c.addEventListener('touchstart',e=>{e.preventDefault();setLean(true);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();setLean(false);},{passive:false});

function playerTopY(){
  // standing player top is groundY - 90; fully leaned brings top down to groundY - 45
  return groundY - 90 + lean*45;
}

function drawPlayer(){
  const topY=playerTopY();
  const bodyH=groundY-10-topY;
  ctx.save();
  ctx.fillStyle='#8ec6ff';
  // leaning back: tilt visual via skew using transform
  ctx.translate(playerX,groundY-10);
  ctx.rotate(-lean*0.55);
  ctx.fillRect(-14,-bodyH,28,bodyH);
  ctx.beginPath();ctx.arc(0,-bodyH-14,14,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,groundY);
  bg.addColorStop(0,'#1a0f2e');bg.addColorStop(1,'#2a1b3d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4a2f6b';ctx.fillRect(0,groundY+10,W,40);
  ctx.fillStyle='#3a2354';ctx.fillRect(0,groundY+10,W,4);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,110);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('limbo_final','You cleared {n} passes!').replace('{n}',passes),W/2,145);
    ctx.fillText(I18N.t('restart_hint','Hold to try again'),W/2,175);
    document.getElementById('score-display').textContent=I18N.t('limbo_score_label','Passes: {n} | Best bar: {b}').replace('{n}',passes).replace('{b}',Math.round(bestHeight));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffd54f99';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('limbo_start_hint','Hold Space / Tap to lean and start'),W/2,90);
    drawPlayer();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  lean += (leaning?1:-1)*0.09*dt;
  lean = Math.max(0,Math.min(1,lean));

  barX -= spd*dt;

  const barY = groundY - barHeight;
  // draw bar posts
  ctx.fillStyle='#c9a24b';
  ctx.fillRect(barX-4,barY,8,groundY-barY+10);
  ctx.fillRect(barX+56,barY,8,groundY-barY+10);
  // bar
  ctx.fillStyle='#ff6b35';
  ctx.fillRect(barX-10,barY-6,86,12);
  ctx.fillStyle='#ffb347';
  ctx.fillRect(barX-10,barY-6,86,4);

  // collision: player occupies playerX-14..playerX+14 horizontally at ground area
  const px0=playerX-14,px1=playerX+14;
  const barLeft=barX-10,barRight=barX+76;
  const topY=playerTopY();
  if(px1>barLeft && px0<barRight){
    // horizontally overlapping the bar zone: check vertical clearance
    if(topY < barY){ // player's head is above the bar height -> collision
      gameOver=true;SFX.lose();
      wobble=10;
    }
  }

  if(barX+76<playerX-14 && !gameOver){
    // fully passed
    passes++;
    if(barHeight<bestHeight){bestHeight=barHeight;localStorage.setItem('limbo_best_height',String(bestHeight));}
    barHeight=Math.max(60,barHeight-8);
    SFX.success();
    spd=Math.min(9,spd+0.25);
    barX=W+40+Math.random()*60;
  }

  drawPlayer();

  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('limbo_bar_height','Bar height: {h}').replace('{h}',Math.round(barHeight)),16,26);

  document.getElementById('score-display').textContent=I18N.t('limbo_score_label','Passes: {n} | Best bar: {b}').replace('{n}',passes).replace('{b}',Math.round(bestHeight));
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
