<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#5a3c1f;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Anthill Run</div>
  <div class="game-frame">
    <div id="score-display">Ants: 1 | Hi: 1</div>
    <canvas id="c" width="600" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or drag/touch on mobile) to guide your ant trail. Collect food crumbs to grow your train, and avoid <b>puddles</b> and the wandering <b>anteater</b> — one touch and it's over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=600,H=400,STEP=14;
let hi=parseInt(localStorage.getItem('anthill_hi')||'1',10);

let leader,dir,nextDir,trail,segLen,food,puddles,anteater,survival,gameOver,started,frame;
let moveTimer=0;
const MOVE_INTERVAL=7; // frames between grid steps

function reset(){
  leader={x:W/2,y:H/2};
  dir={x:1,y:0};
  nextDir={x:1,y:0};
  trail=[{x:leader.x,y:leader.y}];
  segLen=1;
  food=[];
  puddles=[];
  for(let i=0;i<4;i++)spawnPuddle();
  for(let i=0;i<3;i++)spawnFood();
  anteater={x:60,y:60,vx:0,vy:0,speed:1.6};
  survival=0;
  gameOver=false;
  started=false;
  frame=0;
  moveTimer=0;
}

function rnd(n){return Math.random()*n;}

function spawnFood(){
  food.push({x:20+rnd(W-40),y:20+rnd(H-40)});
}
function spawnPuddle(){
  puddles.push({x:20+rnd(W-40),y:20+rnd(H-40),r:18+rnd(14)});
}

function setDir(dx,dy){
  if(!started)started=true;
  if(gameOver){reset();return;}
  // prevent reversing directly into itself
  if(dx===-dir.x&&dy===-dir.y)return;
  nextDir={x:dx,y:dy};
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D',' '].includes(k))e.preventDefault();
  if(k==='ArrowUp'||k==='w'||k==='W')setDir(0,-1);
  else if(k==='ArrowDown'||k==='s'||k==='S')setDir(0,1);
  else if(k==='ArrowLeft'||k==='a'||k==='A')setDir(-1,0);
  else if(k==='ArrowRight'||k==='d'||k==='D')setDir(1,0);
  else if(k===' '&&gameOver)reset();
});

// touch drag control
let touchStart=null;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  touchStart={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
  if(!started)started=true;
  if(gameOver){reset();}
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!touchStart)return;
  const t=e.touches[0];
  const rect=c.getBoundingClientRect();
  const cur={x:(t.clientX-rect.left)*(W/rect.width),y:(t.clientY-rect.top)*(H/rect.height)};
  const dx=cur.x-touchStart.x,dy=cur.y-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)){
    if(Math.abs(dx)>10)setDir(dx>0?1:-1,0);
  } else {
    if(Math.abs(dy)>10)setDir(0,dy>0?1:-1);
  }
  touchStart=cur;
},{passive:false});
c.addEventListener('click',()=>{ if(!started)started=true; if(gameOver)reset(); });

function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}

function drawAnt(x,y,leaderFlag){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=leaderFlag?'#ffd54f':'#1a1a1a';
  ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(-6,0,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6,0,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPuddle(p){
  ctx.fillStyle='#3d6fa3aa';
  ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*0.65,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7ec8ff88';ctx.lineWidth=2;ctx.stroke();
}

function drawFood(f){
  ctx.fillStyle='#c9a24b';
  ctx.beginPath();ctx.arc(f.x,f.y,5,0,Math.PI*2);ctx.fill();
}

function drawAnteater(a){
  ctx.save();
  ctx.translate(a.x,a.y);
  const ang=Math.atan2(a.vy,a.vx||0.001);
  ctx.rotate(ang);
  ctx.fillStyle='#6b4a2f';
  ctx.beginPath();ctx.ellipse(0,0,16,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a6642';
  ctx.beginPath();ctx.ellipse(18,0,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#5a3c1f';ctx.fillRect(0,0,W,H);
  // dirt texture dots
  ctx.fillStyle='#4a2f18';
  for(let i=0;i<40;i++){
    const seedX=(i*97)%W, seedY=(i*53)%H;
    ctx.fillRect(seedX,seedY,2,2);
  }

  if(gameOver){
    puddles.forEach(drawPuddle);
    food.forEach(drawFood);
    trail.forEach((seg,i)=>drawAnt(seg.x,seg.y,i===0));
    drawAnteater(anteater);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,150,W,100);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ah_game_over','GAME OVER'),W/2,195);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('ah_restart_hint','Tap or press a direction key to restart'),W/2,225);
    ctx.textAlign='left';
    updateScore();
    requestAnimationFrame(loop);
    return;
  }

  if(!started){
    puddles.forEach(drawPuddle);
    food.forEach(drawFood);
    trail.forEach((seg,i)=>drawAnt(seg.x,seg.y,i===0));
    drawAnteater(anteater);
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ah_start_hint','Press an arrow key to start'),W/2,H/2);
    ctx.textAlign='left';
    requestAnimationFrame(loop);
    return;
  }

  frame++;
  survival++;
  moveTimer++;

  if(moveTimer>=MOVE_INTERVAL){
    moveTimer=0;
    dir=nextDir;
    const newHead={x:leader.x+dir.x*STEP,y:leader.y+dir.y*STEP};
    // wrap around edges
    if(newHead.x<0)newHead.x=W;
    if(newHead.x>W)newHead.x=0;
    if(newHead.y<0)newHead.y=H;
    if(newHead.y>H)newHead.y=0;
    leader=newHead;
    trail.unshift({x:leader.x,y:leader.y});
    while(trail.length>segLen)trail.pop();
  }

  // anteater chases the leader
  const dx=leader.x-anteater.x,dy=leader.y-anteater.y;
  const d=Math.hypot(dx,dy)||1;
  anteater.vx=(dx/d)*anteater.speed;
  anteater.vy=(dy/d)*anteater.speed;
  anteater.x+=anteater.vx;
  anteater.y+=anteater.vy;
  anteater.speed=Math.min(3.2,1.6+survival/1800);

  // food collection
  for(let i=food.length-1;i>=0;i--){
    if(dist(leader.x,leader.y,food[i].x,food[i].y)<14){
      food.splice(i,1);
      segLen++;
      SFX.coin();
      spawnFood();
      if(Math.random()<0.35)spawnPuddle();
    }
  }

  // puddle collision (leader only needs to avoid, but any segment near counts as hazard for challenge -> use leader)
  for(const p of puddles){
    if(dist(leader.x,leader.y,p.x,p.y)<p.r*0.7){
      gameOver=true;SFX.lose();
    }
  }

  // anteater collision with any segment
  for(const seg of trail){
    if(dist(seg.x,seg.y,anteater.x,anteater.y)<14){
      gameOver=true;SFX.lose();
    }
  }

  if(segLen>hi){hi=segLen;localStorage.setItem('anthill_hi',hi);}

  puddles.forEach(drawPuddle);
  food.forEach(drawFood);
  trail.forEach((seg,i)=>drawAnt(seg.x,seg.y,i===0));
  drawAnteater(anteater);
  updateScore();
  requestAnimationFrame(loop);
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('ah_score_label','Ants: {a} | Hi: {h} | Time: {t}s')
      .replace('{a}',segLen).replace('{h}',hi).replace('{t}',Math.floor(survival/60));
}

reset();
loop();
</script></body></html>
