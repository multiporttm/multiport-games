<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0d2b4e;display:block;border-radius:8px;touch-action:none}
#score-display{color:#9fd3ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sea Ice Cracking</div>
  <div class="game-frame">
    <div id="score-display">Steps: 0 | Hi: 0</div>
    <canvas id="c" width="440" height="560"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> (or <b>tap</b> an adjacent tile) to step forward/left/right. Cracked tiles (dark lines) are about to give way — avoid stepping on a tile that's already fully cracked. Reach the far shore before the ice beneath you collapses!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLS=5,ROWS=14,TILE=88,W=COLS*TILE,H=ROWS*TILE;
c.width=W;c.height=H;
const HI_KEY='mp_hi_seaicecracking';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

let grid,player,steps,gameOver,won,started,tickTimer,camY;

function newGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let cI=0;cI<COLS;cI++){
      // row 0 (start, bottom) and last row (shore) always solid & uncracked
      row.push({crack:0,fallen:false,solid:true});
    }
    grid.push(row);
  }
}

function reset(){
  newGrid();
  player={col:2,row:0};
  steps=0;gameOver=false;won=false;tickTimer=0;camY=0;
}
function startGame(){started=true;reset();}
reset();

function crackNeighbors(r,c){
  // spread cracking influence to tiles around a stepped tile
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const rr=r+dr,cc=c+dc;
    if(rr<0||rr>=ROWS||cc<0||cc>=COLS)continue;
    if(rr===0)continue; // starting row never cracks
    const t=grid[rr][cc];
    if(!t.fallen)t.crack=Math.min(100,t.crack+(dr===0&&dc===0?55:18)+Math.random()*15);
  }
}

function tryMove(dr,dc){
  if(!started){startGame();return;}
  if(gameOver||won){reset();return;}
  const nr=player.row+dr,nc=player.col+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
  const t=grid[nr][nc];
  if(t.fallen)return;
  player.row=nr;player.col=nc;
  steps=Math.max(steps,player.row);
  crackNeighbors(player.row,player.col);
  SFX.click();
  if(t.crack>35)SFX.hit();
  if(player.row===ROWS-1){
    won=true;SFX.win();
    if(steps>hi){hi=steps;localStorage.setItem(HI_KEY,String(hi));}
  }
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]};
  const k=map[e.key]||map[e.key.toLowerCase()];
  if(k){e.preventDefault();tryMove(k[0],k[1]);}
  else if(!started&&(e.key===' '||e.key==='Enter')){startGame();}
});

function canvasPt(clientX,clientY){
  const r=c.getBoundingClientRect();
  return {x:(clientX-r.left)*(W/r.width), y:(clientY-r.top)*(H/r.height)};
}
function handleTap(x,y){
  if(!started){startGame();return;}
  if(gameOver||won){reset();return;}
  const col=Math.floor(x/TILE);
  const screenRow=Math.floor(y/TILE);
  const row=(ROWS-1)-screenRow+camRowOffset();
  const dr=row-player.row,dc=col-player.col;
  if(Math.abs(dr)+Math.abs(dc)===1)tryMove(dr,dc);
}
function camRowOffset(){ return Math.max(0, player.row-(ROWS-1)); } // kept 0 since we render full board without scroll offset complexity
c.addEventListener('click',e=>{const p=canvasPt(e.clientX,e.clientY);handleTap(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const p=canvasPt(t.clientX,t.clientY);handleTap(p.x,p.y);},{passive:false});

function loop(){
  ctx.clearRect(0,0,W,H);
  const sea=ctx.createLinearGradient(0,0,0,H);
  sea.addColorStop(0,'#123a63');sea.addColorStop(1,'#061a30');
  ctx.fillStyle=sea;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#9fd3ff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press an Arrow Key / Tap a tile to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  // slow ambient cracking of tiles near player even without stepping (urgency)
  tickTimer++;
  if(!gameOver&&!won&&tickTimer%40===0){
    for(let r=0;r<ROWS;r++)for(let cI=0;cI<COLS;cI++){
      const t=grid[r][cI];
      if(r===0||t.fallen)continue;
      if(t.crack>0&&t.crack<100)t.crack=Math.min(100,t.crack+2);
      if(t.crack>=100&&!t.fallen){
        t.fallen=true;
        if(r===player.row&&cI===player.col&&!gameOver&&!won){gameOver=true;SFX.lose();}
      }
    }
  }

  // draw rows bottom(row0) at bottom of screen going up
  for(let r=0;r<ROWS;r++){
    const screenRow=(ROWS-1)-r;
    for(let cI=0;cI<COLS;cI++){
      const t=grid[r][cI];
      const x=cI*TILE,y=screenRow*TILE;
      if(t.fallen){
        ctx.fillStyle='#061a30';
        ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
        continue;
      }
      let base = r===0 ? '#cfe9ff' : (r===ROWS-1 ? '#eafff0' : '#dff0ff');
      ctx.fillStyle=base;
      ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
      if(t.crack>0){
        ctx.save();
        ctx.strokeStyle=`rgba(40,70,110,${Math.min(0.9,0.25+t.crack/120)})`;
        ctx.lineWidth=2+t.crack/40;
        ctx.beginPath();
        const cx=x+TILE/2,cy=y+TILE/2;
        const seed=(r*31+cI*7)%7;
        ctx.moveTo(cx-TILE/2+6,cy-TILE/2+6+seed);
        ctx.lineTo(cx,cy);
        ctx.lineTo(cx+TILE/2-6,cy+TILE/2-6-seed);
        ctx.moveTo(cx-TILE/2+10,cy+TILE/2-8);
        ctx.lineTo(cx+2,cy);
        ctx.stroke();
        ctx.restore();
        if(t.crack>70){
          ctx.fillStyle='rgba(200,40,40,0.18)';
          ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
        }
      }
      ctx.strokeStyle='rgba(255,255,255,0.4)';
      ctx.strokeRect(x+2,y+2,TILE-4,TILE-4);
    }
  }

  // shore marker
  ctx.fillStyle='#2e7d32';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('shore_label','SHORE'),W/2,10);

  // player
  const pScreenRow=(ROWS-1)-player.row;
  const px=player.col*TILE+TILE/2, py=pScreenRow*TILE+TILE/2;
  ctx.save();
  ctx.translate(px,py);
  ctx.fillStyle='#ffcc66';
  ctx.beginPath();ctx.arc(0,-6,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2b4a7a';
  ctx.fillRect(-10,4,20,22);
  ctx.restore();

  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Steps: {s} | Hi: {h}').replace('{s}',steps).replace('{h}',hi);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','ICE GAVE WAY!'),W/2,H/2-10);
    ctx.font='16px Arial';ctx.fillText(I18N.t('restart_hint','Tap or press a key to try again'),W/2,H/2+20);
  } else if(won){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8fffa0';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('win_title','REACHED SHORE!'),W/2,H/2-10);
    ctx.font='16px Arial';ctx.fillText(I18N.t('restart_hint2','Tap or press a key to play again'),W/2,H/2+20);
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
