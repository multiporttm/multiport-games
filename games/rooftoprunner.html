<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a2332;cursor:pointer}
#ui{color:#ffb74d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Rooftop Runner</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap, click, or press Space to jump. Roofs scroll by automatically and get further apart the longer you last — time your jumps to not fall through the gaps!</div>
</div>
<script>
const W=360,H=360,GROUND=H-40;
let player,roofs,speed,dist,state,vy=0;

function loadBest(){return +(localStorage.getItem('rooftoprunner_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('rooftoprunner_best',v);}

function init(){
  player={x:70,y:GROUND-60,w:24,h:24,onRoof:true};
  roofs=[{x:0,w:160,y:GROUND-60},{x:200,w:140,y:GROUND-60}];
  speed=2.6;dist=0;state='play';vy=0;
}

function jump(){
  if(state==='over'){init();return;}
  if(player.onRoof){vy=-8.6;player.onRoof=false;SFX.jump();}
}

document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();jump();}});
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('mousedown',jump);
c.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

function update(){
  if(state!=='play')return;
  speed=2.6+dist*0.0015;
  dist+=speed*0.06;

  roofs.forEach(r=>r.x-=speed);
  if(roofs[roofs.length-1].x+roofs[roofs.length-1].w<W+60){
    const last=roofs[roofs.length-1];
    const gap=50+Math.random()*Math.min(70,30+dist*0.08);
    const w=90+Math.random()*70;
    roofs.push({x:last.x+last.w+gap,w,y:GROUND-60+ (Math.random()<0.3?Math.random()*30-15:0)});
  }
  roofs=roofs.filter(r=>r.x+r.w>-20);

  vy+=0.5;
  player.y+=vy;

  let landed=false;
  for(const r of roofs){
    if(player.x+player.w>r.x&&player.x<r.x+r.w&&player.y+player.h>=r.y&&player.y+player.h<=r.y+16&&vy>=0){
      player.y=r.y-player.h;vy=0;player.onRoof=true;landed=true;
    }
  }
  if(!landed)player.onRoof=false;

  if(player.y>H){
    state='over';
    SFX.lose();
    saveBest(Math.floor(dist));
  }
  updateUI();
}

function draw(){
  ctx.fillStyle='#1a2332';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.04)';
  for(let i=0;i<6;i++)ctx.fillRect((i*70-dist*2)%W,0,2,H);

  roofs.forEach(r=>{
    ctx.fillStyle='#455a64';
    ctx.fillRect(r.x,r.y,r.w,H-r.y);
    ctx.fillStyle='#607d8b';
    ctx.fillRect(r.x,r.y,r.w,8);
  });

  ctx.font='24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🏃',player.x+player.w/2,player.y+player.h/2);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb74d';ctx.font='bold 26px Arial';
    ctx.fillText('YOU FELL!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Distance: ${Math.floor(dist)}m | Best: ${loadBest()}m`;
}

init();draw();
</script></body></html>
