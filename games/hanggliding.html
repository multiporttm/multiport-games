<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(180deg,#4fc3f7,#e1f5fe);display:block;border-radius:8px;touch-action:none}
#score-display{color:#81d4fa;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Hang Gliding</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Best: 0m</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b> or drag to tilt your glider. Fly through rising thermal columns to gain altitude, and dodge rocky outcroppings and birds. Touching the ground ends the flight!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let dist=0,best=parseFloat(localStorage.getItem('hanggliding_best')||'0'),gameOver=false,started=false,frame=0;
const glider={x:180,y:150,vy:0,angle:0,vx:0};
let thermals=[],rocks=[],birds=[];
let camX=0;
let thermalTimer=0,rockTimer=0,birdTimer=0;
let keys={};
let lastTime=null;
const groundY=H-30;

function reset(){
  dist=0;gameOver=false;started=false;frame=0;
  glider.x=180;glider.y=150;glider.vy=0;glider.angle=0;glider.vx=3.2;
  thermals=[];rocks=[];birds=[];camX=0;
  thermalTimer=0;rockTimer=0;birdTimer=0;lastTime=null;
}
reset();

function spawnThermal(){
  thermals.push({x:camX+W+50,y0:groundY-30,w:60+Math.random()*40,strength:1.8+Math.random()*1.2});
}
function spawnRock(){
  const h=40+Math.random()*90;
  rocks.push({x:camX+W+50,w:34,h,fromTop:Math.random()<0.5});
}
function spawnBird(){
  const y=60+Math.random()*(groundY-160);
  birds.push({x:camX+W+50,y,w:30,h:16,frame:Math.random()*100});
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!started)started=true;
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){reset();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let dragging=false,dragStartY=0;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  dragging=true;
  dragStartY=e.touches[0].clientY;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const dy=e.touches[0].clientY-dragStartY;
  glider.angle=Math.max(-0.6,Math.min(0.6,dy/80));
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});
c.addEventListener('click',()=>{ if(!started)started=true; else if(gameOver)reset(); });

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function drawGlider(){
  ctx.save();
  ctx.translate(glider.x-camX,glider.y);
  ctx.rotate(glider.angle*0.6);
  ctx.fillStyle='#e64a19';
  ctx.beginPath();
  ctx.moveTo(-40,0);ctx.lineTo(0,-14);ctx.lineTo(40,0);ctx.lineTo(0,10);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#bf360c';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#3e2723';
  ctx.fillRect(-3,6,6,16);
  ctx.beginPath();ctx.arc(0,26,6,0,Math.PI*2);ctx.fillStyle='#ffab91';ctx.fill();
  ctx.restore();
}

function drawThermal(t){
  const sx=t.x-camX;
  ctx.save();
  ctx.globalAlpha=0.25;
  const grad=ctx.createLinearGradient(0,0,0,groundY);
  grad.addColorStop(0,'#fff59d');
  grad.addColorStop(1,'#ffe08200');
  ctx.fillStyle=grad;
  ctx.fillRect(sx-t.w/2,0,t.w,groundY);
  ctx.globalAlpha=0.5;
  ctx.strokeStyle='#fff9c4';
  for(let i=0;i<3;i++){
    const yy=((frame*2+i*60)%groundY);
    ctx.beginPath();
    ctx.moveTo(sx-t.w/2+6,groundY-yy);
    ctx.lineTo(sx+t.w/2-6,groundY-yy);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRock(r){
  const sx=r.x-camX;
  ctx.fillStyle='#6d4c41';
  if(r.fromTop){
    ctx.beginPath();ctx.moveTo(sx-r.w/2,0);ctx.lineTo(sx+r.w/2,0);ctx.lineTo(sx,r.h);ctx.closePath();ctx.fill();
  } else {
    ctx.beginPath();ctx.moveTo(sx-r.w/2,groundY);ctx.lineTo(sx+r.w/2,groundY);ctx.lineTo(sx,groundY-r.h);ctx.closePath();ctx.fill();
  }
}

function drawBird(b){
  const sx=b.x-camX;
  ctx.strokeStyle='#37474f';ctx.lineWidth=2;
  const wing=Math.sin(b.frame/8)*8;
  ctx.beginPath();
  ctx.moveTo(sx-b.w/2,b.y+wing);
  ctx.quadraticCurveTo(sx,b.y-8,sx+b.w/2,b.y+wing);
  ctx.stroke();
}

function rockHitbox(r){
  const sx=r.x;
  if(r.fromTop)return {x:sx-r.w/2,y:0,w:r.w,h:r.h};
  return {x:sx-r.w/2,y:groundY-r.h,w:r.w,h:r.h};
}

function loop(){
  ctx.clearRect(0,0,W,H);

  // parallax mountains
  ctx.fillStyle='#90a4ae';
  for(let i=0;i<6;i++){
    const bx=(i*220-camX*0.3)%(220*6)-220;
    ctx.beginPath();
    ctx.moveTo(bx,groundY);
    ctx.lineTo(bx+110,groundY-120-((i*37)%60));
    ctx.lineTo(bx+220,groundY);
    ctx.closePath();ctx.fill();
  }

  if(!started){
    ctx.fillStyle='#01579b';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key / tap to start'),W/2,H/2);
    ctx.fillStyle='#8d6e63';ctx.fillRect(0,groundY,W,H-groundY);
    drawGlider();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#8d6e63';ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle='#01579b';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+18);
    document.getElementById('score-display').textContent=I18N.t('dist_best_label','Distance: {s}m | Best: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(best));
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  // controls: tilt angle
  let tilt=0;
  if(keys['ArrowUp']||keys['KeyW'])tilt-=1;
  if(keys['ArrowDown']||keys['KeyS'])tilt+=1;
  if(!dragging)glider.angle+=(tilt*0.35-glider.angle)*0.12*dt;
  if(keys['ArrowLeft']||keys['KeyA'])glider.vx=Math.max(1.5,glider.vx-0.08*dt);
  if(keys['ArrowRight']||keys['KeyD'])glider.vx=Math.min(6,glider.vx+0.08*dt);
  if(!keys['ArrowLeft']&&!keys['ArrowRight']&&!keys['KeyA']&&!keys['KeyD'])glider.vx+=(3.4-glider.vx)*0.02*dt;

  // gravity vs pitch: nose-up (angle<0) climbs & slows, nose-down dives & speeds
  glider.vy+=(0.09+glider.angle*0.5)*dt;
  glider.vy=Math.max(-4,Math.min(5,glider.vy));
  glider.y+=glider.vy*dt;
  glider.x+=glider.vx*dt;
  camX=glider.x-180;
  dist=Math.max(dist,camX/10);

  glider.y=Math.max(20,glider.y);

  // spawns
  thermalTimer+=dt;
  if(thermalTimer>=110){thermalTimer=0;spawnThermal();}
  rockTimer+=dt;
  if(rockTimer>=95){rockTimer=0;spawnRock();}
  birdTimer+=dt;
  if(birdTimer>=150){birdTimer=0;spawnBird();}

  thermals=thermals.filter(t=>t.x-camX>-100);
  thermals.forEach(t=>{
    drawThermal(t);
    if(Math.abs((glider.x)-t.x)<t.w/2){
      glider.vy-=t.strength*0.06*dt;
    }
  });

  rocks=rocks.filter(r=>r.x-camX>-100);
  rocks.forEach(r=>{
    drawRock(r);
    const hb=rockHitbox(r);
    if(!gameOver&&rectsOverlap(glider.x-30,glider.y-10,60,24,hb.x,hb.y,hb.w,hb.h)){
      gameOver=true;SFX.lose();
      if(dist>best){best=dist;localStorage.setItem('hanggliding_best',best);}
    }
  });

  birds=birds.filter(b=>b.x-camX>-100);
  birds.forEach(b=>{
    b.frame+=dt;
    drawBird(b);
    if(!gameOver&&rectsOverlap(glider.x-30,glider.y-10,60,24,b.x-b.w/2,b.y-b.h/2,b.w,b.h)){
      gameOver=true;SFX.lose();
      if(dist>best){best=dist;localStorage.setItem('hanggliding_best',best);}
    }
  });

  // ground
  ctx.fillStyle='#8d6e63';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#6d4c41';
  ctx.fillRect(0,groundY,W,4);

  drawGlider();

  if(!gameOver&&glider.y>=groundY-10){
    gameOver=true;SFX.lose();
    if(dist>best){best=dist;localStorage.setItem('hanggliding_best',best);}
  }

  document.getElementById('score-display').textContent=I18N.t('dist_best_label','Distance: {s}m | Best: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(best));
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
