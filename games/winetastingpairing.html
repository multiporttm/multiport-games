<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#hall{background:#1a1222;border-radius:14px;padding:18px;text-align:center;max-width:620px;margin:0 auto}
#hud{color:#f4e4c1;font-weight:800;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:4px 0 10px;font-size:.95rem}
#hud b{color:#ffd54f}
#courseBar{width:100%;height:12px;background:#120a16;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15);margin-bottom:12px}
#courseFill{height:100%;width:100%;background:linear-gradient(90deg,#7ec850,#ffd54f,#e94560);transition:width .1s linear}
#wineCard{background:#3a1f3a;border-radius:10px;padding:14px;margin-bottom:12px}
#wineCard h3{color:#e9b8f0;margin:0 0 8px;font-size:1.25rem}
.bars{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.barWrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.barWrap .lbl{color:#cdb0d8;font-size:.75rem;font-weight:700}
.barOuter{width:18px;height:48px;background:#120a16;border-radius:4px;overflow:hidden;display:flex;align-items:flex-end}
.barInner{width:100%;background:linear-gradient(0deg,#e94560,#ffd54f)}
#menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.foodBtn{padding:11px 14px;background:#4a2a4a;border:2px solid #6a3a6a;border-radius:12px;color:#f4e4c1;cursor:pointer;font-size:.95rem;text-align:left}
.foodBtn b{color:#ffd54f;margin-right:6px}
.foodBtn:disabled{opacity:.5;cursor:not-allowed}
.foodBtn.correct{background:#2e6b2e;border-color:#7ec850}
.foodBtn.wrong{background:#6b2e2e;border-color:#e94560}
#status{color:#fff;min-height:1.6em;font-weight:700;margin-top:10px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wine Tasting Pairing</div>
  <div class="game-frame" style="padding:16px">
    <div id="hall">
      <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="level-display">Level 1</span><span id="lives-display">❤❤❤</span></div>
      <div id="courseBar"><div id="courseFill"></div></div>
      <div id="wineCard">
        <h3 id="wineName">Bold Red</h3>
        <div class="bars" id="barsRow"></div>
      </div>
      <div id="menu"></div>
      <div id="status">Pick the best food pairing for this wine's notes.</div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the poured wine's <b>tannin, acidity, sweetness</b> and <b>body</b> bars, then click/tap the menu item (or press <b>1-4</b>) that pairs best with it before the next course arrives.</div>
</div>
<script>
const WINES=[
  {name:'Bold Red',notes:{tannin:90,acidity:40,sweetness:10,body:85},pairing:'Grilled Ribeye Steak'},
  {name:'Light Red',notes:{tannin:35,acidity:55,sweetness:15,body:35},pairing:'Roast Duck & Mushrooms'},
  {name:'Crisp White',notes:{tannin:5,acidity:85,sweetness:10,body:25},pairing:'Grilled Lemon Fish'},
  {name:'Sweet White',notes:{tannin:5,acidity:30,sweetness:80,body:30},pairing:'Spicy Thai Curry'},
  {name:'Rosé',notes:{tannin:15,acidity:60,sweetness:35,body:30},pairing:'Fresh Garden Salad'},
  {name:'Sparkling',notes:{tannin:5,acidity:70,sweetness:40,body:20},pairing:'Fried Chicken & Oysters'},
  {name:'Full-Bodied White',notes:{tannin:10,acidity:35,sweetness:20,body:75},pairing:'Creamy Lobster Risotto'},
  {name:'Dessert Wine',notes:{tannin:5,acidity:25,sweetness:95,body:55},pairing:'Dark Chocolate Tart'},
];
const DISTRACTORS=['Plain White Rice','Dry Crackers','Steamed Broccoli','House Side Salad','Garlic Bread','Vanilla Ice Cream','Mild Soup','Buttered Toast','Cheese Platter','Fruit Bowl'];

let score=0,hi=0,lives=3,level=1,course=100,gameOver=false,started=true,lastTime=null;
let wine=null,options=[],locked=false;
const hiKey='winetastingpairing_hi';
hi=parseFloat(localStorage.getItem(hiKey))||0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newWine(){
  wine=WINES[Math.floor(Math.random()*WINES.length)];
  const pool=shuffle(DISTRACTORS.filter(d=>d!==wine.pairing)).slice(0,3);
  options=shuffle([wine.pairing,...pool]);
  course=100;locked=false;
  renderWine();
  renderMenu();
  setStatus(I18N.t('choose_pairing','Pick the best food pairing for this wine\'s notes.'));
}

function renderWine(){
  document.getElementById('wineName').textContent=wine.name;
  const row=document.getElementById('barsRow');row.innerHTML='';
  ['tannin','acidity','sweetness','body'].forEach(k=>{
    const wrap=document.createElement('div');wrap.className='barWrap';
    const lbl=document.createElement('div');lbl.className='lbl';lbl.textContent=k[0].toUpperCase()+k.slice(1);
    const outer=document.createElement('div');outer.className='barOuter';
    const inner=document.createElement('div');inner.className='barInner';inner.style.height=wine.notes[k]+'%';
    outer.appendChild(inner);
    wrap.appendChild(outer);wrap.appendChild(lbl);
    row.appendChild(wrap);
  });
}

function renderMenu(){
  const menu=document.getElementById('menu');menu.innerHTML='';
  options.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='foodBtn';
    btn.innerHTML='<b>'+(i+1)+'.</b> '+opt;
    btn.onclick=()=>choose(i);
    menu.appendChild(btn);
  });
}

function choose(i){
  if(gameOver||locked)return;
  locked=true;
  const btns=document.querySelectorAll('.foodBtn');
  const correctIdx=options.indexOf(wine.pairing);
  if(options[i]===wine.pairing){
    score+=15+level*2;
    if(score>hi){hi=score;localStorage.setItem(hiKey,String(hi));}
    SFX.success();
    btns[i].classList.add('correct');
    setStatus(I18N.t('correct_pairing','Perfect pairing! The guest is delighted.'));
    level=1+Math.floor(score/90);
    setTimeout(()=>{if(!gameOver)newWine();},550);
  } else {
    lives--;
    SFX.error();
    btns[i].classList.add('wrong');
    btns[correctIdx].classList.add('correct');
    setStatus(I18N.t('wrong_pairing','Not the best match for these notes — a life lost.'));
    if(lives<=0){
      setTimeout(endGame,550);
    } else {
      setTimeout(()=>{if(!gameOver)newWine();},700);
    }
  }
  btns.forEach(b=>b.disabled=true);
  updateHud();
}

function endGame(){
  gameOver=true;
  SFX.lose();
  setStatus(I18N.t('game_over_msg','GAME OVER — out of lives! Press Enter/Tap to restart.'));
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;lastTime=null;
  newWine();
  updateHud();
}

function updateHud(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('level-display').textContent=I18N.t('level_label','Level {l}').replace('{l}',level);
  document.getElementById('lives-display').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
  document.getElementById('courseFill').style.width=Math.max(0,course)+'%';
}

function setStatus(t){document.getElementById('status').textContent=t;}

document.addEventListener('keydown',e=>{
  if(gameOver&&e.key==='Enter'){reset();return;}
  if(locked||gameOver)return;
  if(['1','2','3','4'].includes(e.key)){
    const idx=parseInt(e.key,10)-1;
    if(idx<options.length)choose(idx);
  }
});

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(started&&!gameOver&&!locked){
    course-=0.12*dt*(1+level*0.08);
    if(course<=0){
      course=0;
      lives--;
      SFX.error();
      locked=true;
      if(lives<=0){endGame();}
      else{setStatus(I18N.t('course_msg','The next course arrived — a life lost!'));setTimeout(()=>{if(!gameOver)newWine();},500);}
      updateHud();
    } else {
      updateHud();
    }
  }
  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
