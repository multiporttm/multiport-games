<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Campground Tents</title><meta name="description" content="Play Campground Tents free online — Tap each hammer-strike indicator at the right moment to drive all 4 tent stakes in and pitch your tent perfectly."><link rel="canonical" href="https://games.multiportllc.com/games/campgroundtents"><meta property="og:title" content="Campground Tents - Multiport Games"><meta property="og:description" content="Play Campground Tents free online — Tap each hammer-strike indicator at the right moment to drive all 4 tent stakes in and pitch your tent perfectly."><meta property="og:url" content="https://games.multiportllc.com/games/campgroundtents"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Campground Tents","description":"Play Campground Tents free online instantly. Tap each hammer-strike indicator at the right moment to drive all 4 tent stakes in and pitch your tent perfectly. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/campgroundtents","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2d4a2e;display:block;border-radius:8px}
#score-display{color:#a3d977;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Campground Tents</div>
  <div class="game-frame">
    <div id="score-display">Tents: 0 | Best streak: 0</div>
    <canvas id="c" width="640" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap or click when the hammer indicator is inside the <b>green zone</b> to drive each stake in cleanly. Land all 4 stakes to pitch the tent — the zones get tighter with every round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=480;
let bestStreak=parseInt(localStorage.getItem('campgroundtents_best')||'0',10);

const stakePositions=[{x:180,y:340},{x:460,y:340},{x:180,y:150},{x:460,y:150}];
let tentsPitched,stakeIndex,stakes,zoneWidth,markerPos,markerDir,markerSpeed,retries,gameOver,started,strike;

function newRound(){
  stakeIndex=0;
  stakes=[false,false,false,false];
  zoneWidth=Math.max(0.14,0.34-tentsPitched*0.02);
  retries=2;
  nextStake();
}
function nextStake(){
  markerPos=0;
  markerDir=1;
  markerSpeed=0.014+tentsPitched*0.001;
  strike=null;
}
function reset(){
  tentsPitched=0;gameOver=false;started=false;
  newRound();
}
reset();

function attemptStrike(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const zoneStart=0.5-zoneWidth/2, zoneEnd=0.5+zoneWidth/2;
  if(markerPos>=zoneStart&&markerPos<=zoneEnd){
    stakes[stakeIndex]=true;
    stakeIndex++;
    SFX.hit();
    if(stakeIndex>=4){
      tentsPitched++;
      if(tentsPitched>bestStreak){bestStreak=tentsPitched;localStorage.setItem('campgroundtents_best',bestStreak);}
      SFX.success();
      newRound();
    }else{
      nextStake();
    }
  }else{
    retries--;
    SFX.error();
    if(retries<0){
      gameOver=true;
      SFX.lose();
      if(tentsPitched>bestStreak){bestStreak=tentsPitched;localStorage.setItem('campgroundtents_best',bestStreak);}
    }else{
      nextStake();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();attemptStrike();}});
c.addEventListener('click',attemptStrike);
c.addEventListener('touchstart',e=>{e.preventDefault();attemptStrike();},{passive:false});

function drawTentOutline(){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(stakePositions[0].x,stakePositions[0].y);
  ctx.lineTo(320,80);
  ctx.lineTo(stakePositions[1].x,stakePositions[1].y);
  ctx.moveTo(stakePositions[2].x,stakePositions[2].y);
  ctx.lineTo(320,80);
  ctx.lineTo(stakePositions[3].x,stakePositions[3].y);
  ctx.moveTo(stakePositions[0].x,stakePositions[0].y);
  ctx.lineTo(stakePositions[2].x,stakePositions[2].y);
  ctx.moveTo(stakePositions[1].x,stakePositions[1].y);
  ctx.lineTo(stakePositions[3].x,stakePositions[3].y);
  ctx.stroke();
  ctx.restore();
}
function drawStakes(){
  stakePositions.forEach((p,i)=>{
    ctx.save();
    ctx.fillStyle=stakes[i]?'#ffd54f':'rgba(255,255,255,0.5)';
    ctx.fillRect(p.x-4,p.y-2,8,20);
    if(i===stakeIndex&&!gameOver){
      ctx.strokeStyle='#ff477e';ctx.lineWidth=2;
      ctx.strokeRect(p.x-10,p.y-8,20,32);
    }
    ctx.restore();
  });
}
function drawMeter(){
  const mx=W/2-150,my=H-70,mw=300,mh=26;
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(mx,my,mw,mh);
  const zoneStart=0.5-zoneWidth/2, zoneEnd=0.5+zoneWidth/2;
  ctx.fillStyle='#4caf50';
  ctx.fillRect(mx+zoneStart*mw,my,(zoneEnd-zoneStart)*mw,mh);
  ctx.fillStyle='#ff477e';
  ctx.fillRect(mx+markerPos*mw-2,my-6,4,mh+12);
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.strokeRect(mx,my,mw,mh);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#173d1a');sky.addColorStop(1,'#2d4a2e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  drawTentOutline();
  drawStakes();

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tent_collapsed_title','TENT COLLAPSED!'),W/2,H/2-40);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('tents_pitched_label','Tents pitched: {n}').replace('{n}',tentsPitched),W/2,H/2);
    ctx.fillText(I18N.t('retry_hint2','Tap or Space to retry'),W/2,H/2+34);
    document.getElementById('score-display').textContent=I18N.t('tents_best_label','Tents: {n} | Best streak: {b}').replace('{n}',tentsPitched).replace('{b}',bestStreak);
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#ffffffaa';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Tap or Space to start hammering'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  markerPos+=markerDir*markerSpeed;
  if(markerPos>=1){markerPos=1;markerDir=-1;}
  if(markerPos<=0){markerPos=0;markerDir=1;}

  drawMeter();

  document.getElementById('score-display').textContent=I18N.t('tents_best_label','Tents: {n} | Best streak: {b}').replace('{n}',tentsPitched).replace('{b}',bestStreak);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
