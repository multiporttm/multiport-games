<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1a30;display:block;border-radius:8px;touch-action:none}
#hud{color:#ff9a9e;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#c9a4ff}
#hud span.hs{color:#7ec850}
#vialBtns{display:flex;justify-content:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
#vialBtns button{padding:8px 14px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.85rem;color:#fff;background:#6a4c93}
#vialBtns button:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Perfume Testing Strip</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="vialBtns"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Dip the strip and watch the fragrance develop through its <b>opening</b>, <b>heart</b>, and <b>dry-down</b> phases. Press the matching <b>number key</b> or <b>tap</b> the vial that fragrance came from before the customer's patience runs out.</div>
</div>
<script>
(function(){
const HS_KEY='perfumetestingstrip_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

const SCENTS=[
  {key:'citrus',label:'Citrus Bloom',color:'#ffd54f',opening:'Sharp zesty citrus burst',heart:'Bright orange blossom sweetness',dry:'Faint lemony musk lingers'},
  {key:'rose',label:'Rose Garden',color:'#e91e8c',opening:'Delicate fresh rose petals',heart:'Deep velvety rose bouquet',dry:'Soft powdery rose base'},
  {key:'woody',label:'Woody Amber',color:'#8d6e63',opening:'Warm spicy cedar hint',heart:'Rich amber and sandalwood',dry:'Smoky resinous woods settle'},
  {key:'vanilla',label:'Vanilla Musk',color:'#d7a86e',opening:'Sweet creamy vanilla top',heart:'Warm musky vanilla cream',dry:'Soft skin-warm musk base'},
  {key:'lavender',label:'Lavender Fields',color:'#9575cd',opening:'Crisp herbal lavender burst',heart:'Soothing floral lavender heart',dry:'Calm herbal lavender fades softly'},
  {key:'ocean',label:'Oceanic Breeze',color:'#4fc3f7',opening:'Cool salty sea air',heart:'Fresh aquatic marine heart',dry:'Light mineral breeze lingers'}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let strip=null,choices=[],timeLeft=0,timeLimit=0,resolved=false,dipping=0,dipDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildButtons(){
  const el=document.getElementById('vialBtns');
  el.innerHTML='';
  choices.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+I18N.t('scent_'+s.key,s.label);
    btn.dataset.i=i;
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(i);});
    el.appendChild(btn);
  });
}

function newStrip(){
  timeLimit=Math.max(220,480-level*22);
  timeLeft=timeLimit;
  dipping=0;dipDone=false;resolved=false;
  const target=SCENTS[Math.floor(Math.random()*SCENTS.length)];
  const count=Math.min(SCENTS.length,3+Math.floor(level/2));
  const pool=shuffle(SCENTS.filter(s=>s.key!==target.key)).slice(0,count-1);
  choices=shuffle([target,...pool]);
  strip={target};
  buildButtons();
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newStrip(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newStrip();
}

function passRound(){
  score+=25*level;SFX.coin();
  if(score>=level*260)levelUp();
  newStrip();
}

function onGuess(i){
  if(!started||gameOver)return;
  if(!dipDone||resolved)return;
  resolved=true;
  if(choices[i].key===strip.target.key){ passRound(); }
  else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m&&started&&!gameOver){ e.preventDefault(); onGuess(parseInt(m[1],10)-1); }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function currentHint(){
  const frac=dipping;
  if(frac<0.34)return strip.target.opening;
  if(frac<0.7)return strip.target.heart;
  return strip.target.dry;
}

function phaseLabel(){
  const frac=dipping;
  if(frac<0.34)return I18N.t('phase_opening','Opening');
  if(frac<0.7)return I18N.t('phase_heart','Heart');
  return I18N.t('phase_dry','Dry-down');
}

function drawStrip(){
  const sx=W/2,sy=170;
  const col=strip.target.color;
  ctx.save();
  ctx.fillStyle='#f5ecd9';
  ctx.fillRect(sx-14,sy-110,28,220);
  const soak=Math.min(1,dipping*1.4)*150;
  ctx.fillStyle=col+'cc';
  ctx.fillRect(sx-14,sy+110-soak,28,soak);
  ctx.strokeStyle='#bba877';ctx.lineWidth=2;
  ctx.strokeRect(sx-14,sy-110,28,220);
  ctx.restore();
  if(dipDone){
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(phaseLabel(),sx,sy-140);
    ctx.font='15px Arial';ctx.fillStyle='#e6d6ff';
    ctx.fillText(I18N.t('hint_'+strip.target.key+'_'+(dipping<0.34?'opening':(dipping<0.7?'heart':'dry')),currentHint()),sx,sy+140);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0f1f');bg.addColorStop(1,'#2a1a30');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ff9a9e';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    if(strip)drawStrip();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!dipDone){
    dipping+=0.012+level*0.0012;
    if(dipping>=1){dipping=1;dipDone=true;SFX.swoosh();}
  } else {
    timeLeft--;
    if(timeLeft<=0){ failRound(); }
  }

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(dipDone?I18N.t('match_hint','Which vial? Press 1-9 or tap below'):I18N.t('dipping_hint','Dipping strip...'),W/2,30);

  if(dipDone){
    const barW=400,barH=10,barX=W/2-barW/2,barY=44;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  }

  if(strip)drawStrip();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
