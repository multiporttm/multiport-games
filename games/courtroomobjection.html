<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#courtroom{background:linear-gradient(135deg,#3e2723,#8d6e63);border-radius:14px;padding:22px 18px;text-align:center;max-width:560px;margin:0 auto}
#lives{font-size:1.3rem;margin-bottom:6px}
#scoreRow{color:#ffe0b2;font-weight:800;font-size:1.05rem;margin-bottom:10px}
#witnessBox{background:rgba(0,0,0,.28);border-radius:12px;padding:20px 16px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#statement{color:#fff;font-size:1.15rem;font-weight:600;line-height:1.4}
#timerWrap{width:100%;height:10px;background:rgba(0,0,0,.3);border-radius:6px;margin-top:14px;overflow:hidden}
#timerBar{height:100%;background:#ffca28;width:100%;transition:width .05s linear}
#btnRow{margin-top:18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#btnRow button{padding:14px 24px;border:none;border-radius:24px;font-weight:900;font-size:1.05rem;cursor:pointer}
#objBtn{background:#e53935;color:#fff}
#passBtn{background:#43a047;color:#fff}
#btnRow button:disabled{opacity:.4;cursor:not-allowed}
#feedback{min-height:1.6em;color:#fff9c4;font-weight:700;margin-top:12px}
#verdict{color:#fff;font-weight:900;font-size:1.4rem;margin-top:10px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Courtroom Objection</div>
  <div class="game-frame" style="padding:16px">
    <div id="courtroom">
      <div id="lives">❤️❤️❤️</div>
      <div id="scoreRow">Correct calls: 0 | Best: 0</div>
      <div id="witnessBox">
        <div id="statement">Click Start Trial to begin</div>
      </div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="btnRow">
        <button id="objBtn">Objection!</button>
        <button id="passBtn">Let It Pass</button>
      </div>
      <div id="feedback"></div>
      <div id="verdict"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click <b>Objection!</b> quickly if a statement is objectionable (leading question, hearsay, speculation), or click <b>Let It Pass</b> for legitimate statements — react before the timer runs out!</div>
</div>
<script>
const OBJECTIONABLE=[
  {t:'Isn’t it true you were the one who slashed the tires that night?',r:'leading question'},
  {t:'My neighbor told me she heard the defendant confess.',r:'hearsay'},
  {t:'I think he probably planned the whole thing in advance.',r:'speculation'},
  {t:'You hated the victim, didn’t you, and wanted him gone?',r:'leading question'},
  {t:'A guy at the bar said the defendant bragged about it.',r:'hearsay'},
  {t:'She must have known the gun was loaded, right?',r:'speculation'},
  {t:'Isn’t it obvious you were jealous of your business partner?',r:'leading question'},
  {t:'My cousin heard from a friend that the alibi was fake.',r:'hearsay'},
  {t:'I guess he could have been lying about the whole thing.',r:'speculation'},
  {t:'You knew the brakes were faulty and drove anyway, correct?',r:'leading question'},
];
const LEGIT=[
  {t:'What time did you arrive at the office that morning?'},
  {t:'I personally saw the defendant leave through the back door.'},
  {t:'Can you describe the color of the car you witnessed?'},
  {t:'I was standing right there when the accident occurred.'},
  {t:'How long have you known the defendant?'},
  {t:'The security footage shows the entrance at 9:04 PM.'},
  {t:'What is your relationship to the plaintiff?'},
  {t:'I heard the alarm go off with my own ears at that moment.'},
  {t:'Please state your occupation for the record.'},
  {t:'I examined the documents myself and verified the signatures.'},
];

let lives=3,correct=0,best=0,round=0,current=null,timerId=null,timeLeft=0,totalTime=0,running=false,ended=false;
best=parseInt(localStorage.getItem('courtroomobjection_best')||'0',10);

const statementEl=document.getElementById('statement');
const feedbackEl=document.getElementById('feedback');
const verdictEl=document.getElementById('verdict');
const timerBar=document.getElementById('timerBar');
const objBtn=document.getElementById('objBtn');
const passBtn=document.getElementById('passBtn');

function updateHUD(){
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
  document.getElementById('scoreRow').textContent=I18N.t('score_hi_label','Correct calls: {s} | Best: {h}').replace('{s}',correct).replace('{h}',best);
}

function pickStatement(){
  const isObjectionable=Math.random()<0.55;
  const pool=isObjectionable?OBJECTIONABLE:LEGIT;
  const item=pool[Math.floor(Math.random()*pool.length)];
  return {text:item.t,objectionable:isObjectionable,reason:item.r};
}

function nextRound(){
  if(ended)return;
  round++;
  current=pickStatement();
  statementEl.textContent=current.text;
  feedbackEl.textContent='';
  totalTime=Math.max(2200,4200-round*80);
  timeLeft=totalTime;
  timerBar.style.width='100%';
  timerBar.style.background='#ffca28';
  objBtn.disabled=false;passBtn.disabled=false;
  running=true;
  clearInterval(timerId);
  const tickMs=30;
  timerId=setInterval(()=>{
    timeLeft-=tickMs;
    timerBar.style.width=Math.max(0,(timeLeft/totalTime)*100)+'%';
    if(timeLeft<=totalTime*0.25)timerBar.style.background='#e53935';
    if(timeLeft<=0){
      clearInterval(timerId);
      running=false;
      // Time ran out: counts as "not objecting" (a miss if statement was objectionable)
      resolveRound(false,true);
    }
  },tickMs);
}

function resolveRound(playerObjected,timedOut){
  if(!running&&!timedOut)return;
  running=false;
  clearInterval(timerId);
  objBtn.disabled=true;passBtn.disabled=true;
  const wasObjectionable=current.objectionable;
  const correctCall=(playerObjected&&wasObjectionable)||(!playerObjected&&!wasObjectionable);
  if(correctCall){
    correct++;
    if(correct>best){best=correct;localStorage.setItem('courtroomobjection_best',best);}
    SFX.success();
    feedbackEl.textContent=wasObjectionable?I18N.t('sustained','Sustained! Good catch: '+current.reason):I18N.t('overruled_ok','Correctly allowed to stand.');
  }else{
    lives--;
    SFX.error();
    if(wasObjectionable){
      feedbackEl.textContent=I18N.t('missed_objection','Overruled — that was '+current.reason+'!');
    }else{
      feedbackEl.textContent=I18N.t('bad_objection','Objection denied — that statement was legitimate.');
    }
  }
  updateHUD();
  if(lives<=0){
    endTrial();
  }else{
    setTimeout(nextRound,1000);
  }
}

function endTrial(){
  ended=true;
  clearInterval(timerId);
  objBtn.disabled=true;passBtn.disabled=true;
  verdictEl.textContent=I18N.t('trial_over','Trial over! Correct calls: {s}').replace('{s}',correct);
  feedbackEl.textContent=I18N.t('restart_hint2','Click Objection or Let It Pass to start a new trial');
  SFX.lose();
}

function startTrial(){
  lives=3;correct=0;round=0;ended=false;
  verdictEl.textContent='';
  updateHUD();
  nextRound();
}

objBtn.addEventListener('click',()=>{
  if(ended){startTrial();return;}
  if(!running)return;
  resolveRound(true,false);
});
passBtn.addEventListener('click',()=>{
  if(ended){startTrial();return;}
  if(!running)return;
  resolveRound(false,false);
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();objBtn.click();}
  else if(e.code==='Enter'){e.preventDefault();passBtn.click();}
});

updateHUD();
</script></body></html>
