<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#4fc3f7}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
#pushBtn{display:block;margin:4px auto;padding:10px 22px;border-radius:10px;background:#ff7043;color:#fff;border:none;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sky Battle Arena</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Round: 1 | Wins: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
    <button id="pushBtn">💥 Push (Space)</button>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to move on the floating platform. Get close to a bot and Push (Space or the button) to knock it back — send it off the edge to eliminate it. Watch out, they can push you too!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=H/2,R=140,SIZE=16;
let player,bots,round,wins,state,keys={},pushCD=0;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('skybattlearena_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('skybattlearena_best',v);}

function init(){round=1;wins=0;state='play';newRound();}

function newRound(){
  player={x:CX,y:CY+60,vx:0,vy:0,alive:true};
  bots=[];
  const n=1+Math.floor(round/2);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2;
    bots.push({x:CX+Math.cos(ang)*70,y:CY+Math.sin(ang)*70,vx:0,vy:0,alive:true});
  }
  pushCD=0;
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();push();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});
document.getElementById('pushBtn').addEventListener('click',()=>{
  if(state==='over'){round=1;wins=0;state='play';newRound();return;}
  push();
});

function push(){
  if(state!=='play'||pushCD>0)return;
  pushCD=20;
  SFX.hit();
  bots.forEach(b=>{
    if(!b.alive)return;
    const d=Math.hypot(b.x-player.x,b.y-player.y);
    if(d<50){
      const ang=Math.atan2(b.y-player.y,b.x-player.x);
      b.vx+=Math.cos(ang)*7;b.vy+=Math.sin(ang)*7;
    }
  });
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  if(pushCD>0)pushCD--;

  const spd=2;
  if(keys['arrowup']||keys['w'])player.vy-=0.4;
  if(keys['arrowdown']||keys['s'])player.vy+=0.4;
  if(keys['arrowleft']||keys['a'])player.vx-=0.4;
  if(keys['arrowright']||keys['d'])player.vx+=0.4;
  player.vx*=0.9;player.vy*=0.9;
  player.x+=player.vx;player.y+=player.vy;

  bots.forEach(b=>{
    if(!b.alive)return;
    const ang=Math.atan2(player.y-b.y,player.x-b.x);
    b.vx+=Math.cos(ang)*0.05;b.vy+=Math.sin(ang)*0.05;
    b.vx*=0.92;b.vy*=0.92;
    b.x+=b.vx;b.y+=b.vy;
    if(dist(b,player)<40&&Math.random()<0.02){
      const pushAng=Math.atan2(player.y-b.y,player.x-b.x);
      player.vx+=Math.cos(pushAng)*5;player.vy+=Math.sin(pushAng)*5;
    }
    if(dist(b,{x:CX,y:CY})>R){b.alive=false;}
  });

  if(dist(player,{x:CX,y:CY})>R&&player.alive){
    player.alive=false;
    state='over';
    SFX.lose();
  }

  bots=bots.filter(b=>b.alive);
  if(bots.length===0&&player.alive){
    wins++;round++;
    SFX.win();
    saveBest(wins);
    newRound();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#4fc3f7';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#90a4ae';
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#546e7a';ctx.lineWidth=4;ctx.stroke();

  ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  bots.forEach(b=>ctx.fillText('🤖',b.x,b.y));
  if(player.alive)ctx.fillText('🧑',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 26px Arial';
    ctx.fillText('KNOCKED OFF!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Wins: ${wins} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap Push to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Round: ${round} | Wins: ${wins}`;
}

init();draw();
</script></body></html>
