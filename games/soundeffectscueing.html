<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#10141f;display:block;border-radius:8px;margin:0 auto}
#hud{color:#ffd54f;font-size:1.1rem;font-weight:800;text-align:center;padding:8px}
#padbtns{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
#padbtns button{padding:12px 16px;border:none;border-radius:10px;font-weight:800;font-size:.9rem;cursor:pointer;color:#fff;min-width:100px}
#padbtns button:active{transform:scale(.92)}
#padbtns button[data-type="0"]{background:#78909c}
#padbtns button[data-type="1"]{background:#4fc3f7}
#padbtns button[data-type="2"]{background:#e94560}
#padbtns button[data-type="3"]{background:#a1887f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sound Effect Cueing</div>
  <div class="game-frame">
    <div id="hud">Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="420" height="420"></canvas>
    <div id="padbtns">
      <button data-type="0">Q · Thunder</button>
      <button data-type="1">W · Doorbell</button>
      <button data-type="2">E · Gunshot</button>
      <button data-type="3">R · Footsteps</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Cue cards fall down the board toward the <b>hit zone</b>. Press <b>Q/W/E/R</b> or tap the matching pad — Thunder, Doorbell, Gunshot, Footsteps — the instant the falling cue reaches the zone. Trigger the wrong sound or miss the timing and you lose a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const hudEl=document.getElementById('hud');
const HS_KEY='hs_soundeffectscueing';
const TYPES=[
  {label:'THUNDER',color:'#78909c'},
  {label:'DOORBELL',color:'#4fc3f7'},
  {label:'GUNSHOT',color:'#e94560'},
  {label:'FOOTSTEPS',color:'#a1887f'}
];
const KEYMAP={'q':0,'w':1,'e':2,'r':3};
const ZONE_Y=360,ZONE_H=42,TOL=24;

let score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10),lives=3,combo=0;
let cues=[],spawnTimer=0,speed=2.2,elapsed=0,gameOver=false,started=false,lastTime=null;
let flashType=-1,flashTimer=0,flashOk=false;

function reset(){score=0;lives=3;combo=0;cues=[];spawnTimer=0;speed=2.2;elapsed=0;gameOver=false;started=false;lastTime=null;}

function spawnCue(){
  const type=Math.floor(Math.random()*4);
  const x=60+Math.floor(Math.random()*3)*150;
  cues.push({type,x,y:-30,hit:false});
}

function trigger(type){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  let found=null;
  for(const q of cues){
    if(q.hit)continue;
    if(q.type===type&&Math.abs(q.y-ZONE_Y)<=TOL){found=q;break;}
  }
  if(found){
    found.hit=true;
    combo++;
    score+=10+Math.min(combo,10);
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(Math.floor(hi)));}
    SFX.success();
    flashType=type;flashOk=true;flashTimer=14;
  } else {
    combo=0;
    lives--;
    SFX.error();
    flashType=type;flashOk=false;flashTimer=14;
    if(lives<=0){gameOver=true;SFX.lose();}
  }
}

document.addEventListener('keydown',e=>{
  const k=KEYMAP[e.key.toLowerCase()];
  if(k!==undefined){e.preventDefault();trigger(k);}
  if(e.code==='Space'&&!started){e.preventDefault();started=true;}
});
document.querySelectorAll('#padbtns button').forEach(btn=>{
  const type=parseInt(btn.dataset.type,10);
  btn.addEventListener('click',()=>trigger(type));
  btn.addEventListener('touchstart',e=>{e.preventDefault();trigger(type);},{passive:false});
});
c.addEventListener('click',()=>{if(!started)started=true;else if(gameOver)reset();});
c.addEventListener('touchstart',e=>{e.preventDefault();if(!started)started=true;else if(gameOver)reset();},{passive:false});

function drawCue(q){
  ctx.fillStyle=TYPES[q.type].color;
  ctx.fillRect(q.x-45,q.y-18,90,36);
  ctx.fillStyle='#fff';
  ctx.font='bold 11px Arial';
  ctx.textAlign='center';
  ctx.fillText(TYPES[q.type].label,q.x,q.y+4);
}

function updateHud(){
  hudEl.textContent=I18N.t('se_hud','Score: {s} | Hi: {h} | Lives: {l}')
    .replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)).replace('{l}',lives);
}

function loop(){
  ctx.clearRect(0,0,420,420);
  ctx.fillStyle='#10141f';ctx.fillRect(0,0,420,420);

  // hit zone
  ctx.fillStyle='rgba(255,213,79,0.18)';
  ctx.fillRect(0,ZONE_Y-ZONE_H/2,420,ZONE_H);
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
  ctx.strokeRect(0,ZONE_Y-ZONE_H/2,420,ZONE_H);
  ctx.fillStyle='#ffd54f';ctx.font='bold 12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('hit_zone_label','HIT ZONE'),8,ZONE_Y-ZONE_H/2-6);

  if(flashTimer>0){
    ctx.fillStyle=flashOk?'rgba(102,187,106,0.25)':'rgba(233,69,96,0.3)';
    ctx.fillRect(0,0,420,420);
    flashTimer--;
  } else { flashType=-1; }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),210,190);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press Q/W/E/R to restart'),210,220);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Q/W/E/R / Tap to start'),210,190);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  elapsed+=dt;
  speed=2.2+elapsed/280;

  spawnTimer+=dt;
  const interval=Math.max(38,82-elapsed/15);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnCue();}

  for(const q of cues){
    if(q.hit)continue;
    q.y+=speed*dt;
    if(q.y>ZONE_Y+TOL+20){
      q.hit=true;
      combo=0;
      lives--;
      SFX.fail();
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  }
  cues=cues.filter(q=>!q.hit);
  cues.forEach(drawCue);

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
