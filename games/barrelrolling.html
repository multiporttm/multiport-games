<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Barrel Rolling</title><meta name="description" content="Play Barrel Rolling free online — Press Space or Tap to release a barrel down the cargo ramp. Time it to land in the moving dock cart and fill the quota before time runs out."><link rel="canonical" href="https://games.multiportllc.com/games/barrelrolling"><meta property="og:title" content="Barrel Rolling - Multiport Games"><meta property="og:description" content="Play Barrel Rolling free online — Press Space or Tap to release a barrel down the cargo ramp. Time it to land in the moving dock cart and fill the quota before time runs out."><meta property="og:url" content="https://games.multiportllc.com/games/barrelrolling"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Barrel Rolling","description":"Play Barrel Rolling free online instantly. Press Space or Tap to release a barrel down the ship's cargo ramp and time it to land in the moving dock cart below. Fill the cart's quota before time runs out, without missing too many barrels. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/barrelrolling","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a5d8f;display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Barrel Rolling</div>
  <div class="game-frame">
    <div id="score-display">Caught: 0/0 | Hi: 0</div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to release a barrel down the cargo ramp. Time it to land in the <b>moving cart</b> on the dock below — fill the quota before time runs out. Miss too many and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const dropX=400, holderY=40, catchY=252;
const groundY=265;

let caught=0,missed=0,quota=0,round=1,timeLeft=0,maxMisses=5;
let cart={x:350,w:90,h:34,dir:1,speed:3};
let barrel={active:false,x:dropX,y:holderY,vy:0};
let ready=true,cooldown=0;
let gameOver=false,win=false,started=false,lastTime=null;
let hi=parseInt(localStorage.getItem('hiscore_barrelrolling')||'0',10);

function startRound(){
  quota=10+Math.floor((round-1)*3);
  timeLeft=50+round*5;
  cart.speed=2.6+round*0.35;
  caught=0;missed=0;
  barrel.active=false;ready=true;cooldown=0;
}

function reset(){
  round=1;gameOver=false;win=false;started=false;lastTime=null;
  cart.x=350;cart.dir=1;
  startRound();
}
reset();

function drop(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(ready&&!barrel.active){
    barrel.active=true;barrel.x=dropX;barrel.y=holderY;barrel.vy=1.5;
    ready=false;
    SFX.swoosh();
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop();}});
c.addEventListener('click',drop);
c.addEventListener('touchstart',e=>{e.preventDefault();drop();},{passive:false});

function drawRamp(){
  ctx.save();
  ctx.strokeStyle='#6b4423';ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(30,10);ctx.lineTo(dropX-6,holderY+10);ctx.stroke();
  ctx.fillStyle='#8a5a2e';
  ctx.fillRect(dropX-26,holderY-14,52,28);
  ctx.restore();
}

function drawBarrel(x,y){
  ctx.save();
  ctx.fillStyle='#a0611f';
  ctx.beginPath();ctx.ellipse(x,y,18,16,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4a2a0a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-18,y-6);ctx.lineTo(x+18,y-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-18,y+6);ctx.lineTo(x+18,y+6);ctx.stroke();
  ctx.restore();
}

function drawCart(){
  ctx.save();
  ctx.fillStyle='#5a3b1f';
  ctx.fillRect(cart.x,groundY-cart.h,cart.w,cart.h);
  ctx.fillStyle='#2e1d0f';
  ctx.fillRect(cart.x,groundY-cart.h,cart.w,8);
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(cart.x+14,groundY+6,10,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cart.x+cart.w-14,groundY+6,10,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawDock(){
  ctx.fillStyle='#8a6a3a';ctx.fillRect(0,groundY,W,35);
  ctx.strokeStyle='#5a4322';ctx.lineWidth=2;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,groundY);ctx.lineTo(x,groundY+35);ctx.stroke();}
}

function fmtScore(){
  document.getElementById('score-display').textContent=
    I18N.t('score_label','Caught: {c}/{q} | Hi: {h}').replace('{c}',caught).replace('{q}',quota).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#123a5e');sky.addColorStop(1,'#2a5d8f');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,groundY);
  drawDock();
  drawRamp();
  drawCart();

  if(!barrel.active&&ready)drawBarrel(dropX,holderY);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(win?I18N.t('round_clear_title','QUOTA FILLED!'):I18N.t('game_over_title','GAME OVER'),400,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,175);
    fmtScore();
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),400,140);
    fmtScore();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  cart.x+=cart.dir*cart.speed*dt;
  if(cart.x<=10){cart.x=10;cart.dir=1;}
  if(cart.x>=W-10-cart.w){cart.x=W-10-cart.w;cart.dir=-1;}

  if(!ready&&!barrel.active){
    cooldown-=dt;
    if(cooldown<=0)ready=true;
  }

  if(barrel.active){
    barrel.vy+=0.25*dt;
    barrel.y+=barrel.vy*dt;
    drawBarrel(barrel.x,barrel.y);
    if(barrel.y>=catchY){
      barrel.active=false;
      cooldown=14;ready=false;
      if(dropX>=cart.x&&dropX<=cart.x+cart.w){
        caught++;SFX.catch();
      }else{
        missed++;SFX.error();
      }
      if(caught>hi){hi=caught;localStorage.setItem('hiscore_barrelrolling',hi);}
      if(caught>=quota){
        if(round>=1&&caught===quota){
          win=true;gameOver=true;SFX.win();
        }
      }else if(missed>=maxMisses){
        win=false;gameOver=true;SFX.lose();
      }else if(timeLeft<=0){
        win=false;gameOver=true;SFX.lose();
      }
    }
  }

  timeLeft-=dt/60;
  if(timeLeft<=0&&!barrel.active&&caught<quota){
    win=false;gameOver=true;SFX.lose();
  }

  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('time_label','Time: {t}s').replace('{t}',Math.max(0,Math.ceil(timeLeft))),16,24);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('missed_label','Missed: {m}/{mm}').replace('{m}',missed).replace('{mm}',maxMisses),W-16,24);

  fmtScore();
  requestAnimationFrame(loop);
}

loop();
</script></body></html>
