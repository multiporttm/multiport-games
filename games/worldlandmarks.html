<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#0f2027,#2c9c8d);border-radius:14px;padding:22px;text-align:center;max-width:560px;margin:0 auto}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:.95rem;margin-bottom:10px}
#hud span{background:rgba(0,0,0,.3);padding:4px 10px;border-radius:8px}
#timerWrap{height:8px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;margin-bottom:16px}
#timerBar{height:100%;background:#ffd54f;width:100%;transition:width .1s linear}
#clue{font-size:1.25rem;font-weight:700;color:#fff;margin:24px 10px;min-height:4.4rem;display:flex;align-items:center;justify-content:center}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:#fff;color:#222;border:none;border-radius:10px;padding:14px 8px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt.correct{background:#4caf50;color:#fff}
.opt.wrong{background:#e94560;color:#fff}
#msg{color:#fff;font-weight:800;min-height:1.6em;margin-top:12px}
#overlay{color:#fff;font-weight:900;font-size:1.3rem;margin-top:14px}
#overlay button{margin-top:10px;padding:10px 26px;border:none;border-radius:20px;background:#ffd54f;color:#222;font-weight:800;cursor:pointer;font-size:1rem}
@media(max-width:480px){#clue{font-size:1.05rem}#options{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">World Landmarks</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="hud"><span id="scoreDisp">Score: 0</span><span id="streakDisp">Streak: 0</span><span id="livesDisp">Lives: 3</span></div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="clue">🌍</div>
      <div id="options"></div>
      <div id="msg"></div>
      <div id="overlay" style="display:none"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the landmark description and click the matching landmark from the 4 choices before the <b>timer</b> runs out. Correct guesses score points and build a <b>streak</b> bonus; a wrong answer or timeout costs a <b>life</b>.</div>
</div>
<script>
const LANDMARKS=[
["Eiffel Tower","A wrought-iron tower in the heart of Paris, France."],
["Leaning Tower of Pisa","A leaning bell tower in Italy."],
["Great Wall of China","An ancient fortified wall stretching thousands of miles across northern China."],
["Statue of Liberty","A copper statue of a robed woman holding a torch, standing on an island in New York Harbor."],
["Taj Mahal","A white marble mausoleum built by a Mughal emperor in Agra, India."],
["Colosseum","A giant ancient amphitheater in Rome used for gladiator contests."],
["Big Ben","A famous clock tower attached to the Houses of Parliament in London."],
["Sydney Opera House","A performing arts center with distinctive sail-shaped shells on Sydney Harbour."],
["Christ the Redeemer","A giant statue of Jesus with outstretched arms overlooking Rio de Janeiro."],
["Machu Picchu","An ancient Incan citadel set high in the Andes Mountains of Peru."],
["Pyramids of Giza","Ancient stone pyramids and the Sphinx on the outskirts of Cairo, Egypt."],
["Golden Gate Bridge","A famous orange suspension bridge spanning the entrance to San Francisco Bay."],
["Mount Rushmore","A mountainside sculpture of four U.S. presidents' faces in South Dakota."],
["Stonehenge","A prehistoric ring of massive standing stones on Salisbury Plain in England."],
["Burj Khalifa","The tallest building in the world, located in Dubai."],
["Neuschwanstein Castle","A fairy-tale castle in the Bavarian Alps of Germany."],
["Petra","An ancient city carved directly into rose-colored rock cliffs in Jordan."],
["Acropolis of Athens","An ancient citadel with the Parthenon temple perched above Athens, Greece."],
["Angkor Wat","A vast temple complex in the jungles of Cambodia."],
["Niagara Falls","A group of massive waterfalls on the border of the U.S. and Canada."],
["Mount Fuji","Japan's tallest and most famous volcanic mountain."],
["Table Mountain","A flat-topped mountain overlooking Cape Town, South Africa."],
["Notre-Dame Cathedral","A medieval Gothic cathedral on an island in the Seine River in Paris."],
["Sagrada Familia","A still-unfinished basilica with striking spires designed by Gaudí in Barcelona."],
["Alcatraz Island","A former federal prison on a rocky island in San Francisco Bay."],
["Chichen Itza","A large Mayan step-pyramid complex in Mexico's Yucatán Peninsula."],
["Hagia Sophia","A domed former cathedral and mosque in Istanbul, Turkey."],
["Mont Saint-Michel","A tidal island topped by a medieval abbey off the coast of Normandy, France."],
["Uluru","A massive sandstone rock formation sacred to Aboriginal Australians."],
["Brandenburg Gate","An 18th-century neoclassical monument in Berlin, Germany."]
];
let deck=[],round=null,score=0,streak=0,lives=3,timeLeft=0,timerId=null,over=false;
const ROUND_MS=9000;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newDeck(){deck=shuffle(LANDMARKS.slice());}

function nextRound(){
  if(over)return;
  if(!deck.length)newDeck();
  const pick=deck.pop();
  const wrongPool=shuffle(LANDMARKS.filter(m=>m[0]!==pick[0])).slice(0,3);
  const opts=shuffle([pick,...wrongPool]);
  round={answer:pick[0],desc:pick[1],opts:opts.map(o=>o[0])};
  document.getElementById('clue').textContent=round.desc;
  const optWrap=document.getElementById('options');
  optWrap.innerHTML='';
  round.opts.forEach(title=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=title;
    b.onclick=()=>choose(title,b);
    optWrap.appendChild(b);
  });
  document.getElementById('msg').textContent='';
  startTimer();
}

function startTimer(){
  clearInterval(timerId);
  timeLeft=ROUND_MS;
  document.getElementById('timerBar').style.width='100%';
  const t0=performance.now();
  timerId=setInterval(()=>{
    const elapsed=performance.now()-t0;
    const pct=Math.max(0,1-elapsed/ROUND_MS);
    document.getElementById('timerBar').style.width=(pct*100)+'%';
    if(pct<=0){
      clearInterval(timerId);
      timeout();
    }
  },50);
}

function timeout(){
  if(over)return;
  streak=0;
  loseLife(I18N.t('time_up_msg','⏰ Time\'s up! It was "{a}"').replace('{a}',round.answer));
}

function choose(title,btn){
  if(over||!round)return;
  clearInterval(timerId);
  const buttons=[...document.querySelectorAll('.opt')];
  buttons.forEach(b=>{b.disabled=true;if(b.textContent===round.answer)b.classList.add('correct');});
  if(title===round.answer){
    streak++;
    const bonus=10+Math.min(streak,10)*5;
    score+=bonus;
    SFX.success();
    document.getElementById('msg').textContent=I18N.t('correct_msg','✅ Correct! +{b} (streak {s})').replace('{b}',bonus).replace('{s}',streak);
    updateHud();
    setTimeout(nextRound,900);
  }else{
    btn.classList.add('wrong');
    SFX.error();
    streak=0;
    loseLife(I18N.t('wrong_msg','❌ Wrong! It was "{a}"').replace('{a}',round.answer));
  }
}

function loseLife(msg){
  lives--;
  document.getElementById('msg').textContent=msg;
  updateHud();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(nextRound,1100);
  }
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('streakDisp').textContent=I18N.t('streak_label','Streak: {s}').replace('{s}',streak);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',Math.max(0,lives));
}

function endGame(){
  over=true;
  clearInterval(timerId);
  const hi=Math.max(score,parseInt(localStorage.getItem('worldlandmarks_hi')||'0',10));
  localStorage.setItem('worldlandmarks_hi',hi);
  SFX.lose();
  document.getElementById('options').innerHTML='';
  document.getElementById('clue').textContent='🌍';
  document.getElementById('msg').textContent='';
  const ov=document.getElementById('overlay');
  ov.style.display='block';
  ov.innerHTML=`${I18N.t('game_over_title','GAME OVER')}<br>${I18N.t('final_score_label','Final Score: {s}').replace('{s}',score)}<br>${I18N.t('high_score_label','High Score: {h}').replace('{h}',hi)}<br><button id="restartBtn">${I18N.t('play_again_btn','Play Again')}</button>`;
  document.getElementById('restartBtn').onclick=restart;
}

function restart(){
  score=0;streak=0;lives=3;over=false;
  document.getElementById('overlay').style.display='none';
  updateHud();
  newDeck();
  nextRound();
}

updateHud();
newDeck();
nextRound();
</script></body></html>
