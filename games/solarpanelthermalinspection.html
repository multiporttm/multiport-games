<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a0a14;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff7043;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#hud{display:flex;justify-content:center;gap:14px;color:#fff;font-size:.92rem;padding:0 8px 6px;flex-wrap:wrap}
#hud span{background:rgba(255,255,255,.08);border-radius:10px;padding:4px 12px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Solar Panel Thermal Inspection</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="hud"><span id="array-label">Array 1</span><span id="found-label">Found: 0/0</span><span id="lives-label">Lives: 3</span><span id="time-label">Time: 0s</span></div>
    <canvas id="c" width="760" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Scan the thermal-imaging grid and <b>click, tap</b>, or use <b>Arrow Keys + Enter</b> to flag every overheating panel before time runs out. Watch for subtle hot spots hiding in larger and larger arrays!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=760,H=500;
const scoreEl=document.getElementById('score-display');
const arrayEl=document.getElementById('array-label');
const foundEl=document.getElementById('found-label');
const livesEl=document.getElementById('lives-label');
const timeEl=document.getElementById('time-label');
const HI_KEY='solarpanelthermalinspection_hi';

const HEADER_H=46,MARGIN=14;

let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0;
let score=0,lives=3,level=1,state='ready'; // ready, playing, roundend, gameover, win
let cols=4,rows=4,cell=40,panels=[],defectTotal=0,foundCount=0,cursorR=0,cursorC=0;
let timeLeft=0,timeLimit=20,hotDelta=55;
let msg='',msgTimer=0;

function colorForTemp(t){
  // t: 0(cold/blue) .. 100(hot/red), thermal palette
  const stops=[[0,10,30,110],[25,10,90,170],[50,60,170,60],[75,230,200,40],[100,230,60,30]];
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i][0]&&t<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;}
  }
  const span=(b[0]-a[0])||1;
  const f=Math.max(0,Math.min(1,(t-a[0])/span));
  const r=Math.round(a[1]+(b[1]-a[1])*f);
  const g=Math.round(a[2]+(b[2]-a[2])*f);
  const bl=Math.round(a[3]+(b[3]-a[3])*f);
  return `rgb(${r},${g},${bl})`;
}

function genArray(n){
  level=n;
  cols=Math.min(9,3+Math.floor((n+1)/2));
  rows=Math.min(7,3+Math.floor(n/2));
  hotDelta=Math.max(14,55-(n-1)*5);
  defectTotal=Math.min(cols*rows-2,2+Math.floor(n/2));
  timeLimit=Math.max(12,24-(n-1)*1.1);
  const gw=W-2*MARGIN,gh=H-HEADER_H-2*MARGIN;
  cell=Math.floor(Math.min(gw/cols,gh/rows));
  panels=[];
  const total=cols*rows;
  const defectIdx=new Set();
  while(defectIdx.size<defectTotal){ defectIdx.add(Math.floor(Math.random()*total)); }
  for(let i=0;i<total;i++){
    const isDefect=defectIdx.has(i);
    const base=38+Math.random()*8;
    panels.push({temp:isDefect?Math.min(100,base+hotDelta+Math.random()*6-3):base,defect:isDefect,found:false,wrong:0});
  }
  foundCount=0;
  cursorR=0;cursorC=0;
  timeLeft=timeLimit;
  state='playing';
  arrayEl.textContent=I18N.t('array_label','Array {n}').replace('{n}',n);
}

function startGame(){
  score=0;lives=3;msg='';msgTimer=0;
  genArray(1);
}

function setMsg(t,dur){msg=t;msgTimer=dur||1.3;}

function idxOf(r,col){return r*cols+col;}

function flag(r,col){
  if(state!=='playing')return;
  if(r<0||r>=rows||col<0||col>=cols)return;
  const p=panels[idxOf(r,col)];
  if(p.found)return;
  if(p.defect){
    p.found=true;
    foundCount++;
    const speedBonus=Math.max(0,timeLeft/timeLimit);
    score+=Math.round(60+speedBonus*40);
    if(score>hi)hi=score;
    SFX.success();
  } else {
    p.wrong=0.5;
    lives--;
    SFX.error();
    if(lives<=0){
      state='gameover';
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
      SFX.lose();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(state==='ready'){ if(e.code==='Space'||e.code==='Enter'){startGame();} return; }
  if(state==='gameover'||state==='win'){ if(e.code==='Space'||e.code==='Enter'){startGame();} return; }
  if(state!=='playing')return;
  if(e.code==='ArrowUp'){e.preventDefault();cursorR=Math.max(0,cursorR-1);}
  else if(e.code==='ArrowDown'){e.preventDefault();cursorR=Math.min(rows-1,cursorR+1);}
  else if(e.code==='ArrowLeft'){e.preventDefault();cursorC=Math.max(0,cursorC-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();cursorC=Math.min(cols-1,cursorC+1);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();flag(cursorR,cursorC);}
});

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  if(state==='ready'||state==='gameover'||state==='win'){startGame();return;}
  if(state!=='playing')return;
  const p=getPos(e);
  const gx=(W-cols*cell)/2,gy=HEADER_H+MARGIN;
  const col=Math.floor((p.x-gx)/cell);
  const r=Math.floor((p.y-gy)/cell);
  if(r>=0&&r<rows&&col>=0&&col<cols){cursorR=r;cursorC=col;flag(r,col);}
});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});

function drawHeader(){
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 18px Arial';
  ctx.fillText(I18N.t('scan_hint','Find {n} overheating panel(s)').replace('{n}',defectTotal),W/2,28);
}

function drawGrid(dt){
  const gx=(W-cols*cell)/2,gy=HEADER_H+MARGIN;
  for(let r=0;r<rows;r++){
    for(let col=0;col<cols;col++){
      const p=panels[idxOf(r,col)];
      const x=gx+col*cell,y=gy+r*cell;
      ctx.fillStyle=colorForTemp(p.temp);
      ctx.fillRect(x+2,y+2,cell-4,cell-4);
      ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;
      ctx.strokeRect(x+2,y+2,cell-4,cell-4);
      if(p.found){
        ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x+2,y+2,cell-4,cell-4);
        ctx.strokeStyle='#4caf50';ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x+cell*0.28,y+cell*0.52);
        ctx.lineTo(x+cell*0.44,y+cell*0.70);
        ctx.lineTo(x+cell*0.74,y+cell*0.32);
        ctx.stroke();
      }
      if(p.wrong>0){
        ctx.fillStyle=`rgba(233,69,96,${p.wrong})`;
        ctx.fillRect(x+2,y+2,cell-4,cell-4);
        p.wrong-=dt*1.8; if(p.wrong<0)p.wrong=0;
      }
      if(r===cursorR&&col===cursorC&&state==='playing'){
        ctx.strokeStyle='#fff';ctx.lineWidth=2;
        ctx.strokeRect(x+4,y+4,cell-8,cell-8);
      }
    }
  }
}

function drawCenterText(lines,sub){
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
  ctx.fillText(lines,W/2,H/2-10);
  if(sub){ctx.font='17px Arial';ctx.fillStyle='#ff9e6d';ctx.fillText(sub,W/2,H/2+26);}
  ctx.restore();
}

function updateHud(){
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  livesEl.textContent=I18N.t('lives_label','Lives: {n}').replace('{n}',lives);
  foundEl.textContent=I18N.t('found_label','Found: {a}/{b}').replace('{a}',foundCount).replace('{b}',defectTotal);
  timeEl.textContent=I18N.t('time_label','Time: {t}s').replace('{t}',Math.ceil(Math.max(0,timeLeft)));
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);

  if(state==='ready'){
    drawCenterText(I18N.t('tap_to_start','Tap / Space to Start'),I18N.t('thermal_hint','Spot every overheating panel on the thermal scan'));
  } else if(state==='playing'){
    drawHeader();
    drawGrid(dt);
    timeLeft-=dt;
    if(foundCount>=defectTotal){
      SFX.levelup();
      setMsg(I18N.t('array_passed','Array {n} fully inspected!').replace('{n}',level),1.3);
      state='roundend';
    } else if(timeLeft<=0){
      lives--;
      SFX.fail();
      if(lives<=0){
        state='gameover';
        if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}
        SFX.lose();
      } else {
        setMsg(I18N.t('time_up_defects','Time is up with hot spots still missed!'),1.3);
        state='roundend';
      }
    }
  } else if(state==='roundend'){
    drawHeader();
    drawGrid(dt);
    msgTimer-=dt;
    drawCenterText(msg);
    if(msgTimer<=0){
      if(level>=8 && msg.indexOf('fully')>=0){
        state='win';
        if(score>hi)hi=score;
        localStorage.setItem(HI_KEY,String(Math.floor(hi)));
        SFX.win();
      } else if(msg.indexOf('fully')>=0){
        genArray(level+1);
      } else {
        genArray(level);
      }
    }
  } else if(state==='gameover'){
    drawCenterText(I18N.t('game_over_title','GAME OVER'),I18N.t('restart_hint','Tap or Space to restart'));
  } else if(state==='win'){
    drawCenterText(I18N.t('you_win_title','YOU WIN! Thermal Inspector Pro!'),I18N.t('restart_hint','Tap or Space to restart'));
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
