<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Witness Sketching - Multiport Games</title><meta name="description" content="Play Witness Sketching free online — Read the witness's clues, then click or tap the matching eyes, nose, hair and jaw to build the composite sketch. Nail every feature to get a positive ID."><link rel="canonical" href="https://games.multiportllc.com/games/witnesssketching"><meta property="og:title" content="Witness Sketching - Multiport Games"><meta property="og:description" content="Play Witness Sketching free online — Read the witness's clues, then click or tap the matching eyes, nose, hair and jaw to build the composite sketch. Nail every feature to get a positive ID."><meta property="og:url" content="https://games.multiportllc.com/games/witnesssketching"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Witness Sketching","description":"Play Witness Sketching free online instantly. Interview a witness and build a composite sketch of a suspect by selecting the correct facial features — eyes, nose, hair and jaw — one at a time based on the witness's verbal description clues, refining the sketch until it matches their memory well enough for a positive ID. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/witnesssketching","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:10px}
#sketchPane{background:#efe6d0;border-radius:10px;padding:14px;text-align:center}
#c{background:#f6f1e3;display:block;border-radius:6px;margin:0 auto}
#clueBox{background:rgba(0,0,0,0.3);border-radius:10px;padding:12px 16px;max-width:300px;color:#f3e9d2;font-size:.95rem;min-height:70px}
#clueBox b{color:#ffd54f}
#panel{display:flex;flex-direction:column;gap:10px;min-width:280px}
.featRow{background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 10px}
.featRow .label{color:#f3e9d2;font-weight:800;font-size:.85rem;margin-bottom:6px}
.optRow{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:6px 10px;border-radius:14px;background:#5a4328;color:#f3e9d2;font-size:.8rem;cursor:pointer;border:2px solid transparent}
.opt.chosen{border-color:#ffd54f;background:#8a6a3a}
#status{color:#f3e9d2;font-weight:800;min-height:1.4em;text-align:center;margin-top:6px}
#idBtn,#nextBtn{padding:9px 20px;background:#e94560;border:none;border-radius:18px;color:#fff;font-weight:700;cursor:pointer;margin-top:6px}
#hi-display{color:#f3e9d2;font-size:.85rem;text-align:center;margin-top:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Witness Sketching</div>
  <div class="game-frame" style="padding:14px">
    <div id="wrap">
      <div id="sketchPane">
        <canvas id="c" width="260" height="300"></canvas>
        <div id="hi-display">Best: —</div>
      </div>
      <div id="panel">
        <div id="clueBox">Interviewing the witness…</div>
        <div id="featRows"></div>
        <div style="text-align:center">
          <button id="idBtn">Submit for ID</button>
          <button id="nextBtn" style="display:none">New Witness</button>
        </div>
        <div id="status"></div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read each <b>witness clue</b>, then click the matching option for <b>Eyes</b>, <b>Nose</b>, <b>Hair</b> and <b>Jaw</b> to build the composite sketch. When all four features are chosen, click <b>Submit for ID</b> — match every feature correctly to get a positive ID!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');

const FEATURES={
  eyes:{
    label:'Eyes',
    options:[
      {id:'narrow',name:'Narrow & sharp',clue:'"His eyes were narrow, always squinting like he was sizing you up."'},
      {id:'wide',name:'Wide & round',clue:'"Big round eyes — almost looked surprised the whole time."'},
      {id:'hooded',name:'Heavy-lidded',clue:'"Tired, heavy-lidded eyes, like he hadn’t slept in days."'},
      {id:'close',name:'Close-set',clue:'"His eyes sat close together, right over the nose."'},
    ]
  },
  nose:{
    label:'Nose',
    options:[
      {id:'straight',name:'Straight & thin',clue:'"A thin, straight nose — nothing remarkable about it."'},
      {id:'hooked',name:'Hooked',clue:'"His nose hooked down sharp, like a bird’s beak."'},
      {id:'broad',name:'Broad & flat',clue:'"Broad, flat nose — looked like it’d been broken once or twice."'},
      {id:'upturned',name:'Upturned',clue:'"Small nose, turned up a little at the tip."'},
    ]
  },
  hair:{
    label:'Hair',
    options:[
      {id:'slicked',name:'Slicked back',clue:'"Dark hair, slicked straight back with oil."'},
      {id:'bald',name:'Balding',clue:'"Hardly any hair left up top — just a fringe round the sides."'},
      {id:'curly',name:'Curly mop',clue:'"A curly mess of hair, unkempt, sticking out under his hat."'},
      {id:'hat',name:'Hidden under hat',clue:'"Couldn’t see his hair at all — fedora pulled down low."'},
    ]
  },
  jaw:{
    label:'Jaw',
    options:[
      {id:'square',name:'Square & strong',clue:'"A hard square jaw, like he could take a punch."'},
      {id:'round',name:'Round & soft',clue:'"Soft, round jawline — almost baby-faced."'},
      {id:'pointed',name:'Pointed chin',clue:'"Sharp pointed chin, kind of narrow face."'},
      {id:'stubble',name:'Stubbled & scarred',clue:'"Stubble covering a jaw with an old scar on it."'},
    ]
  },
};
const KEYS=['eyes','nose','hair','jaw'];

let solution,chosen,attempts,hi,solved;
hi=localStorage.getItem('witnesssketching_hi');

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function newWitness(){
  solution={};
  KEYS.forEach(k=>{solution[k]=pick(FEATURES[k].options).id;});
  chosen={};
  attempts=0;
  solved=false;
  document.getElementById('status').textContent='';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('idBtn').disabled=false;
  renderClue();
  renderOptions();
  draw();
}

function currentUnsetKey(){
  return KEYS.find(k=>!chosen[k]);
}

function renderClue(){
  const key=currentUnsetKey();
  const box=document.getElementById('clueBox');
  if(!key){
    box.innerHTML='<b>'+I18N.t('ws_all_clues','All features noted.')+'</b> '+I18N.t('ws_submit_hint','Review your sketch, then submit for ID.');
    return;
  }
  const opt=FEATURES[key].options.find(o=>o.id===solution[key]);
  box.innerHTML='<b>'+I18N.t('ws_clue_'+key,FEATURES[key].label+':')+'</b><br>'+I18N.t('ws_clue_text_'+key+'_'+opt.id,opt.clue);
}

function renderOptions(){
  const rows=document.getElementById('featRows');
  rows.innerHTML='';
  KEYS.forEach(k=>{
    const row=document.createElement('div');row.className='featRow';
    const lab=document.createElement('div');lab.className='label';
    lab.textContent=I18N.t('ws_feat_'+k,FEATURES[k].label);
    row.appendChild(lab);
    const optRow=document.createElement('div');optRow.className='optRow';
    FEATURES[k].options.forEach(o=>{
      const btn=document.createElement('div');
      btn.className='opt'+(chosen[k]===o.id?' chosen':'');
      btn.textContent=I18N.t('ws_opt_'+k+'_'+o.id,o.name);
      btn.onclick=()=>{
        chosen[k]=o.id;
        SFX.select();
        renderClue();
        renderOptions();
        draw();
      };
      optRow.appendChild(btn);
    });
    row.appendChild(optRow);
    rows.appendChild(row);
  });
}

function drawFace(){
  ctx.clearRect(0,0,260,300);
  ctx.fillStyle='#f6f1e3';ctx.fillRect(0,0,260,300);
  // head base
  ctx.strokeStyle='#2a2015';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(130,160,70,90,0,0,Math.PI*2);ctx.stroke();

  const hair=chosen.hair;
  if(hair==='slicked'){
    ctx.fillStyle='#2a2015';ctx.beginPath();ctx.ellipse(130,95,66,34,0,Math.PI,Math.PI*2);ctx.fill();
  } else if(hair==='bald'){
    ctx.beginPath();ctx.arc(130,95,10,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(130,110,68,20,0,0,Math.PI);ctx.stroke();
  } else if(hair==='curly'){
    ctx.fillStyle='#3a2a18';
    for(let i=0;i<14;i++){
      const ang=Math.PI+(i/13)*Math.PI;
      ctx.beginPath();ctx.arc(130+Math.cos(ang)*66,95+Math.sin(ang)*34,11,0,Math.PI*2);ctx.fill();
    }
  } else if(hair==='hat'){
    ctx.fillStyle='#3a3a40';
    ctx.fillRect(58,70,144,22);
    ctx.fillRect(40,86,180,14);
  }

  // eyes
  const eyeY=150, eyeGap=chosen.eyes==='close'?16:30;
  ctx.strokeStyle='#2a2015';ctx.lineWidth=2.2;
  [-1,1].forEach(side=>{
    const ex=130+side*eyeGap;
    ctx.beginPath();
    if(chosen.eyes==='narrow')ctx.ellipse(ex,eyeY,11,3,0,0,Math.PI*2);
    else if(chosen.eyes==='wide')ctx.ellipse(ex,eyeY,12,9,0,0,Math.PI*2);
    else if(chosen.eyes==='hooded'){ctx.ellipse(ex,eyeY,11,6,0,0,Math.PI*2);ctx.moveTo(ex-12,eyeY-6);ctx.lineTo(ex+12,eyeY-6);}
    else ctx.ellipse(ex,eyeY,10,6,0,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle='#2a2015';ctx.beginPath();ctx.arc(ex,eyeY,2.5,0,Math.PI*2);ctx.fill();
  });

  // nose
  ctx.beginPath();
  const nose=chosen.nose;
  if(nose==='straight'){ctx.moveTo(130,165);ctx.lineTo(130,195);ctx.lineTo(122,200);}
  else if(nose==='hooked'){ctx.moveTo(130,165);ctx.quadraticCurveTo(145,190,122,202);}
  else if(nose==='broad'){ctx.moveTo(125,165);ctx.lineTo(118,200);ctx.lineTo(142,200);ctx.lineTo(135,165);}
  else if(nose==='upturned'){ctx.moveTo(130,170);ctx.quadraticCurveTo(118,195,135,192);}
  else {ctx.moveTo(130,165);ctx.lineTo(125,195);}
  ctx.stroke();

  // jaw / chin overlay
  ctx.beginPath();
  const jaw=chosen.jaw;
  if(jaw==='square'){ctx.moveTo(80,210);ctx.lineTo(80,235);ctx.lineTo(180,235);ctx.lineTo(180,210);}
  else if(jaw==='round'){ctx.moveTo(85,215);ctx.quadraticCurveTo(130,255,175,215);}
  else if(jaw==='pointed'){ctx.moveTo(95,210);ctx.lineTo(130,250);ctx.lineTo(165,210);}
  else {ctx.moveTo(85,215);ctx.quadraticCurveTo(130,245,175,215);
    ctx.stroke();ctx.beginPath();
    for(let i=0;i<40;i++)ctx.fillRect(90+((i*7)%150),218+((i*13)%26),1.5,1.5);
    ctx.beginPath();ctx.moveTo(140,205);ctx.lineTo(150,218);ctx.stroke();
  }
  ctx.stroke();

  // mouth
  ctx.beginPath();ctx.moveTo(112,200);ctx.lineTo(148,200);ctx.stroke();

  KEYS.forEach(k=>{
    if(!chosen[k]){
      // nothing extra; placeholders already implied by base head
    }
  });
}

function draw(){ drawFace(); }

document.getElementById('idBtn').addEventListener('click',()=>{
  if(KEYS.some(k=>!chosen[k])){
    document.getElementById('status').textContent=I18N.t('ws_incomplete','Choose all four features before submitting.');
    SFX.error();
    return;
  }
  attempts++;
  const matches=KEYS.filter(k=>chosen[k]===solution[k]).length;
  if(matches===4){
    solved=true;
    const score=Math.max(0,Math.round(500-((attempts-1)*80)));
    if(!hi||score>Number(hi)){hi=score;localStorage.setItem('witnesssketching_hi',hi);}
    document.getElementById('status').textContent=I18N.t('ws_id_made','Positive ID! The witness confirms the sketch.');
    document.getElementById('idBtn').disabled=true;
    document.getElementById('nextBtn').style.display='inline-block';
    SFX.win();
  } else {
    document.getElementById('status').textContent=
      I18N.t('ws_close','Not quite — {n} of 4 features match. Ask the witness again.').replace('{n}',matches);
    SFX.fail();
  }
  updateHi();
});

document.getElementById('nextBtn').addEventListener('click',newWitness);

function updateHi(){
  document.getElementById('hi-display').textContent=
    I18N.t('best_label','Best: {h}').replace('{h}',hi!=null?hi:I18N.t('none_yet','—'));
}

newWitness();
updateHi();
</script></body></html>
