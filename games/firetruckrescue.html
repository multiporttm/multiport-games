<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#building{background:linear-gradient(135deg,#37474f,#78909c);border-radius:10px;padding:16px;max-width:560px;margin:0 auto}
#hud{color:#fff;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
#hud span.lives{color:#ff5252}
#hud span.score{color:#ffd54f}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.window{position:relative;background:#263238;border:3px solid #455a64;border-radius:6px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;overflow:hidden;user-select:none;touch-action:manipulation}
.window.on-fire{background:#4e2a1a;border-color:#ff7043;animation:flicker .3s infinite alternate}
.window .bar{position:absolute;bottom:0;left:0;height:4px;background:#ffca28;width:100%}
@keyframes flicker{from{box-shadow:inset 0 0 12px #ff5722}to{box-shadow:inset 0 0 24px #ff9800}}
#msg{color:#fff;text-align:center;font-weight:800;font-size:1.3rem;min-height:1.6em;margin-top:10px}
@media(max-width:480px){#building{padding:10px}#grid{gap:5px}.window{font-size:1.4rem}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Firetruck Rescue</div>
  <div class="game-frame" style="padding:16px">
    <div id="hud"><span class="score" id="scoreEl">Extinguished: 0 | Hi: 0</span><span class="lives" id="livesEl">Lives: 3</span></div>
    <div id="building">
      <div id="grid"></div>
    </div>
    <div id="msg"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap or click a <b>burning window</b> (🔥) before its timer bar runs out to extinguish it. Letting a fire burn out costs you a <b>life</b>. Fires start appearing faster the longer you survive — run out of lives and it's game over.</div>
</div>
<script>
const ROWS=5,COLS=5,TOTAL=ROWS*COLS;
let hi=parseInt(localStorage.getItem('firetruckrescue_hi')||'0');
let score=0,lives=3,gameOver=false,spawnInterval=2200,elapsed=0,lastTs=null;
let fires={}; // index -> {duration, remaining}
let cells=[];

const gridEl=document.getElementById('grid');
function buildGrid(){
  gridEl.innerHTML='';
  cells=[];
  for(let i=0;i<TOTAL;i++){
    const div=document.createElement('div');
    div.className='window';
    const bar=document.createElement('div');
    bar.className='bar';
    div.appendChild(bar);
    div.addEventListener('click',()=>extinguish(i));
    div.addEventListener('touchstart',(e)=>{e.preventDefault();extinguish(i);},{passive:false});
    gridEl.appendChild(div);
    cells.push(div);
  }
}
buildGrid();

function updateHud(){
  document.getElementById('scoreEl').textContent=I18N.t('firetruck_score','Extinguished: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('livesEl').textContent=I18N.t('firetruck_lives','Lives: {l}').replace('{l}',lives);
}

function setMsg(t){document.getElementById('msg').textContent=t;}

function reset(){
  score=0;lives=3;gameOver=false;spawnInterval=2200;elapsed=0;lastTs=null;
  fires={};
  cells.forEach(c=>{c.classList.remove('on-fire');c.textContent='';c.querySelector('.bar').style.width='100%';});
  setMsg('');
  updateHud();
}

function spawnFire(){
  const free=[];
  for(let i=0;i<TOTAL;i++)if(!fires[i])free.push(i);
  if(free.length===0)return;
  const idx=free[Math.floor(Math.random()*free.length)];
  const duration=Math.max(1400,3200-elapsed/1000*40);
  fires[idx]={duration,remaining:duration};
  const cell=cells[idx];
  cell.classList.add('on-fire');
  cell.textContent='🔥';
  cell.querySelector('.bar').style.width='100%';
}

function extinguish(idx){
  if(gameOver){reset();return;}
  const f=fires[idx];
  if(!f)return;
  delete fires[idx];
  score++;
  if(score>hi){hi=score;localStorage.setItem('firetruckrescue_hi',hi);}
  const cell=cells[idx];
  cell.classList.remove('on-fire');
  cell.textContent='💧';
  SFX.success();
  updateHud();
  setTimeout(()=>{if(cell.textContent==='💧')cell.textContent='';},260);
}

function burnOut(idx){
  delete fires[idx];
  const cell=cells[idx];
  cell.classList.remove('on-fire');
  cell.textContent='💀';
  lives--;
  SFX.hurt();
  updateHud();
  setTimeout(()=>{if(cell.textContent==='💀')cell.textContent='';},400);
  if(lives<=0){
    endGame();
  }
}

function endGame(){
  gameOver=true;
  SFX.lose();
  setMsg(I18N.t('game_over_tap','GAME OVER — Tap any window to restart'));
}

let rafId;
function loop(ts){
  if(!gameOver){
    if(lastTs===null)lastTs=ts;
    const dt=ts-lastTs;
    lastTs=ts;
    elapsed+=dt;

    // spawn timer
    spawnInterval=Math.max(500,2200-elapsed/1000*30);
    spawnAcc+=dt;
    if(spawnAcc>=spawnInterval){
      spawnAcc=0;
      spawnFire();
    }

    // update fire timers
    for(const idx in fires){
      const f=fires[idx];
      f.remaining-=dt;
      const pct=Math.max(0,f.remaining/f.duration*100);
      cells[idx].querySelector('.bar').style.width=pct+'%';
      if(f.remaining<=0){
        burnOut(idx);
      }
    }
  }
  rafId=requestAnimationFrame(loop);
}
let spawnAcc=0;
reset();
requestAnimationFrame(loop);
</script></body></html>
