<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Car Wash Tycoon</title><meta name="description" content="Play Car Wash Tycoon free online — Scrub, rinse, and dry each car in order before it drives off for the best tip."><link rel="canonical" href="https://games.multiportllc.com/games/carwashtycoon"><meta property="og:title" content="Car Wash Tycoon - Multiport Games"><meta property="og:description" content="Play Car Wash Tycoon free online — Scrub, rinse, and dry each car in order before it drives off for the best tip."><meta property="og:url" content="https://games.multiportllc.com/games/carwashtycoon"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Car Wash Tycoon","description":"Play Car Wash Tycoon free online instantly. Scrub, rinse, and dry each car in order before it drives off for the best tip. No download or signup required.","genre":"Casual","url":"https://games.multiportllc.com/games/carwashtycoon","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0288d1;cursor:pointer}
#ui{color:#b3e5fc;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Car Wash Tycoon</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Tips: $0 | Cars: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Each car needs Soap 🧼, Rinse 💧, and Dry 🌬️ in that order — tap the matching button at the bottom before the patience bar runs out. Bigger tips for faster service!</div>
</div>
<script>
const W=360,H=360;
const STEPS=[{e:'🧼',c:'#e1f5fe'},{e:'💧',c:'#4fc3f7'},{e:'🌬️',c:'#b3e5fc'}];
let step,cars,tips,timeLeft,maxTime,state;

function loadBest(){return +(localStorage.getItem('carwashtycoon_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('carwashtycoon_best',v);}

function init(){cars=0;tips=0;state='play';newCar();}

function newCar(){
  step=0;
  maxTime=6-Math.min(3,cars*0.08);
  timeLeft=maxTime;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
const BTN_Y=H-90,BTN_W=W/STEPS.length;

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  if(y<BTN_Y)return;
  const idx=Math.floor(x/BTN_W);
  if(idx!==step)return;
  step++;
  SFX.tick();
  if(step>=STEPS.length){
    cars++;
    const tip=Math.max(1,Math.round(timeLeft));
    tips+=tip;
    SFX.coin();
    saveBest(tips);
    newCar();
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  timeLeft-=1/60;
  if(timeLeft<=0){
    SFX.fail();
    newCar();
  }
}

function draw(){
  ctx.fillStyle='#0288d1';ctx.fillRect(0,0,W,H);

  ctx.font='60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🚗',W/2,140);

  ctx.font='14px Arial';ctx.fillStyle='#fff';
  ctx.fillText(`Next: ${STEPS[step].e}`,W/2,200);

  ctx.fillStyle='#ddd';ctx.fillRect(20,220,W-40,14);
  ctx.fillStyle='#4fc3f7';ctx.fillRect(20,220,(W-40)*Math.max(0,timeLeft/maxTime),14);

  STEPS.forEach((s,i)=>{
    const x=i*BTN_W;
    ctx.fillStyle=i===step?'#fff':'rgba(255,255,255,.4)';
    ctx.fillRect(x+4,BTN_Y,BTN_W-8,70);
    ctx.font='32px Arial';
    ctx.fillText(s.e,x+BTN_W/2,BTN_Y+38);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#b3e5fc';ctx.font='bold 26px Arial';
    ctx.fillText('CLOSED UP',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Tips: $${tips} | Best: $${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Tips: $${tips} | Cars: ${cars}`;
}

init();draw();
</script></body></html>
