<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#6a1b9a,#ffd54f);display:block;border-radius:8px}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Trapeze Swing</div>
  <div class="game-frame">
    <div id="score-display">Catches: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click, Tap, or press <b>Space</b> at the peak of your swing to let go and fly toward the next bar. Time it right to grab the catcher's hands — miss and fall into the net!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let catches=0,hi=0,lives=3,gameOver=false,started=false;
hi=parseInt(localStorage.getItem('trapezeswing_hi')||'0',10);

// Bar 1 pivot (fixed, left side)
const pivot1={x:180,y:60};
let ropeLen=220;
let angle=0,angVel=0;// pendulum
const gravity=0.0022;
const damping=0.9995;

// State machine: 'swing' (on bar1), 'flying' (in air), 'result' (post catch/miss)
let state='swing';
let performer={x:0,y:0,vx:0,vy:0};
let targetBar={x:0,y:0,dist:0}; // bar2 pivot
let resultTimer=0;
let netFlash=0;
let attemptDifficulty=0;

function setupTarget(){
  attemptDifficulty=catches; // increases over time
  const dist=380+Math.min(attemptDifficulty*14,220)+Math.random()*40;
  targetBar={x:pivot1.x+dist,y:60+Math.random()*30-15,len:200+Math.random()*40};
  if(targetBar.x>W-100)targetBar.x=W-100;
}
setupTarget();

function resetSwing(){
  angle=-1.0; angVel=0;
  state='swing';
}
function resetGame(){
  catches=0;lives=3;gameOver=false;started=false;
  resetSwing();
  setupTarget();
}
resetSwing();

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('trapeze_score_label','Catches: {c} | Lives: {l} | Hi: {h}')
      .replace('{c}',catches).replace('{l}',lives).replace('{h}',hi);
}
updateScore();

function letGo(){
  if(!started){started=true;return;}
  if(gameOver){resetGame();updateScore();return;}
  if(state!=='swing')return;
  // release: convert pendulum motion into velocity
  const bx=pivot1.x+Math.sin(angle)*ropeLen;
  const by=pivot1.y+Math.cos(angle)*ropeLen;
  const speed=angVel*ropeLen;
  performer.x=bx;performer.y=by;
  performer.vx=Math.cos(angle)*speed*1.0;
  performer.vy=-Math.sin(angle)*speed*1.0;
  // also add slight forward boost toward target
  state='flying';
  SFX.jump();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();letGo();}});
c.addEventListener('click',letGo);
c.addEventListener('touchstart',e=>{e.preventDefault();letGo();},{passive:false});

function drawBar(px,py,len,swingAngle){
  ctx.strokeStyle='#3a2a10';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,py);ctx.stroke();
  const bx=px+Math.sin(swingAngle)*len, by=py+Math.cos(swingAngle)*len;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(bx,by);ctx.stroke();
  ctx.fillStyle='#8d6e33';ctx.fillRect(bx-22,by-4,44,8);
  return {x:bx,y:by};
}

function drawPerformer(x,y,vx){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.arc(0,-10,10,0,Math.PI*2);ctx.fill(); // head
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(-6,0,12,22); // body
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(-16,-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(16,-6);ctx.stroke();
  ctx.restore();
}

function drawNet(flash){
  ctx.fillStyle=flash>0?'rgba(233,69,96,0.5)':'rgba(255,255,255,0.15)';
  ctx.fillRect(0,H-50,W,50);
  ctx.strokeStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<W;i+=20){ctx.beginPath();ctx.moveTo(i,H-50);ctx.lineTo(i,H);ctx.stroke();}
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // background circus tent stripes
  for(let i=0;i<10;i++){
    ctx.fillStyle=i%2===0?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';
    ctx.fillRect(i*W/10,0,W/10,H-50);
  }
  drawNet(netFlash);
  if(netFlash>0)netFlash--;

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Space to start swinging'),W/2,H/2);
    drawBar(pivot1.x,pivot1.y,ropeLen,angle);
    const cur={x:pivot1.x+Math.sin(angle)*ropeLen,y:pivot1.y+Math.cos(angle)*ropeLen};
    drawPerformer(cur.x,cur.y,0);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    requestAnimationFrame(loop);return;
  }

  const barPivot2={x:targetBar.x,y:targetBar.y};

  if(state==='swing'){
    angVel+=-Math.sin(angle)*gravity*40;
    angVel*=damping;
    angle+=angVel;
    if(angle>1.05){angle=1.05;angVel*=-0.6;}
    if(angle<-1.05){angle=-1.05;angVel*=-0.6;}
    drawBar(pivot1.x,pivot1.y,ropeLen,angle);
    const cur={x:pivot1.x+Math.sin(angle)*ropeLen,y:pivot1.y+Math.cos(angle)*ropeLen};
    drawPerformer(cur.x,cur.y,angVel);
    // draw target bar swinging gently (idle) for preview
    drawBar(barPivot2.x,barPivot2.y,targetBar.len,Math.sin(Date.now()/700)*0.5);
  } else if(state==='flying'){
    performer.vy+=0.35;
    performer.x+=performer.vx;
    performer.y+=performer.vy;
    drawBar(pivot1.x,pivot1.y,ropeLen,angle);
    const catcherAngle=Math.sin(Date.now()/700)*0.5;
    const catcherPos=drawBar(barPivot2.x,barPivot2.y,targetBar.len,catcherAngle);
    drawPerformer(performer.x,performer.y,performer.vx);
    // catch check
    const dx=performer.x-catcherPos.x, dy=performer.y-catcherPos.y;
    if(Math.sqrt(dx*dx+dy*dy)<30){
      catches++;
      if(catches>hi){hi=catches;localStorage.setItem('trapezeswing_hi',hi);}
      SFX.catch();
      // set up new pivot as new bar1
      pivot1.x=barPivot2.x;
      ropeLen=targetBar.len;
      angle=catcherAngle;
      angVel=performer.vx/ropeLen*0.6;
      state='swing';
      setupTarget();
      updateScore();
    } else if(performer.y>H-55 || performer.x>W+40 || performer.x<-40){
      lives--;
      netFlash=20;
      SFX.fail();
      updateScore();
      if(lives<=0){gameOver=true;SFX.lose();}
      else{
        // reset to a fresh bar1 swing
        pivot1.x=180;ropeLen=220;resetSwing();setupTarget();
      }
    }
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
