<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#5d4037,#e65100);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffcc80;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cowboy Quick Draw</div>
  <div class="game-frame">
    <div id="score-display">Streak: 0 | Best: — ms</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Wait for <b>DRAW!</b> to appear, then click, tap, or press <b>Space</b> as fast as you can. Drawing before the signal is a false start and you lose the round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let hiTime=parseFloat(localStorage.getItem('cowboyquickdraw_hi')||'0')||null;
let streak=0;
let state='idle'; // idle, waiting, drawmoment, result
let waitStart=0,drawSignalTime=0,outlawReactTime=0,playerReactTime=null;
let resultMsg='',resultColor='#fff',resultTimer=0;
let outlawSpeed=550; // ms, gets faster each round
let timeoutHandle=null;

function fmt(v){return v==null?'—':Math.round(v);}

function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('streak_best_label','Streak: {s} | Best: {b} ms').replace('{s}',streak).replace('{b}',fmt(hiTime));
}

function startRound(){
  clearTimeout(timeoutHandle);
  state='waiting';
  resultMsg='';
  const delay=1200+Math.random()*2800;
  waitStart=performance.now();
  timeoutHandle=setTimeout(()=>{
    state='drawmoment';
    drawSignalTime=performance.now();
    playerReactTime=null;
    // outlaw reacts after outlawSpeed ms
    timeoutHandle=setTimeout(()=>{
      if(state==='drawmoment'){
        // outlaw drew first
        endRound(false,null);
      }
    },outlawSpeed);
  },delay);
}

function endRound(playerWon,reactMs){
  clearTimeout(timeoutHandle);
  state='result';
  resultTimer=performance.now();
  if(playerWon){
    streak++;
    if(hiTime===null||reactMs<hiTime){
      hiTime=reactMs;
      localStorage.setItem('cowboyquickdraw_hi',String(hiTime));
    }
    resultMsg=I18N.t('you_win_msg','YOU WIN! {r} ms').replace('{r}',Math.round(reactMs));
    resultColor='#7ec850';
    SFX.win();
    outlawSpeed=Math.max(180,outlawSpeed-15);
  } else {
    streak=0;
    if(reactMs===null){
      resultMsg=I18N.t('outlaw_faster_msg','The outlaw was faster!');
    } else {
      resultMsg=I18N.t('too_slow_msg','Too slow! {r} ms').replace('{r}',Math.round(reactMs));
    }
    resultColor='#e74c3c';
    SFX.lose();
  }
  updateHud();
}

function falseStart(){
  clearTimeout(timeoutHandle);
  state='result';
  streak=0;
  resultMsg=I18N.t('false_start_msg','FALSE START! You drew too early.');
  resultColor='#e74c3c';
  SFX.error();
  updateHud();
}

function draw(){
  if(state==='waiting')falseStart();
  else if(state==='drawmoment'){
    const rt=performance.now()-drawSignalTime;
    endRound(true,rt);
  } else if(state==='result'){
    startRound();
  } else if(state==='idle'){
    startRound();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();draw();}
});
c.addEventListener('click',draw);
c.addEventListener('touchstart',e=>{e.preventDefault();draw();},{passive:false});

function loop(){
  ctx.clearRect(0,0,W,H);
  // background
  const sky=ctx.createLinearGradient(0,0,W,H);
  sky.addColorStop(0,'#5d4037');sky.addColorStop(1,'#e65100');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // ground
  ctx.fillStyle='#3e2723';ctx.fillRect(0,300,W,100);
  ctx.fillStyle='#4e342e';ctx.fillRect(0,300,W,6);

  // player cowboy
  ctx.fillStyle='#2c2c2c';
  ctx.fillRect(120,220,50,80);
  ctx.beginPath();ctx.arc(145,205,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3e2723';ctx.fillRect(105,180,80,14);

  // outlaw
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(630,220,50,80);
  ctx.beginPath();ctx.arc(655,205,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.fillRect(615,180,80,14);

  ctx.textAlign='center';
  if(state==='idle'){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('draw_start_hint','Click / Tap / Space to start the duel'),W/2,90);
  } else if(state==='waiting'){
    ctx.fillStyle='#ffe0b2';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('get_ready_msg','Get ready...'),W/2,90);
  } else if(state==='drawmoment'){
    ctx.fillStyle='#fff700';ctx.font='bold 60px Arial';
    ctx.fillText(I18N.t('draw_signal_text','DRAW!'),W/2,110);
  } else if(state==='result'){
    ctx.fillStyle=resultColor;ctx.font='bold 34px Arial';
    ctx.fillText(resultMsg,W/2,90);
    ctx.fillStyle='#fff';ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Click / Tap / Space for next round'),W/2,130);
  }
  requestAnimationFrame(loop);
}
updateHud();
loop();
</script></body></html>
