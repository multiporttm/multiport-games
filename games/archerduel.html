<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b3a67;display:block;border-radius:8px;margin:0 auto;touch-action:none;cursor:crosshair}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Archer Duel</div>
  <div class="game-frame">
    <div id="score-display">Round 1 | You: 0 | CPU: 0 | Wins: 0</div>
    <canvas id="c" width="700" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click/tap and <b>drag back</b> from your bow to aim angle and power, then <b>release</b> to fire. Watch the <b>wind indicator</b> — it pushes your arrow sideways. Best of 5 rounds against the AI archer wins the duel!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=380,GROUND=H-40;
const playerPos={x:70,y:GROUND};
const cpuPos={x:W-70,y:GROUND};
const TOTAL_ROUNDS=5;
let duelWins=parseInt(localStorage.getItem('archerduel_wins')||'0');

let playerScore,cpuScore,round,wind,arrow,drag,dragStart,state,msg,msgTimer,gameOver,winner,cpuTargetX;

function newWind(){ wind=(Math.random()*2-1)*0.06; }

function newRound(){
  round=(round||0)+1;
  newWind();
  cpuTargetX=cpuPos.x-30+Math.random()*20;
  arrow=null;
  state='aim';
  msg=I18N.t('round_n','Round {n}').replace('{n}',round);
  msgTimer=60;
}

function startMatch(){
  playerScore=0;cpuScore=0;round=0;gameOver=false;winner=null;
  newRound();
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};
}

function pointerDown(e){
  e.preventDefault();
  if(gameOver){startMatch();return;}
  if(state!=='aim')return;
  const p=getPos(e);
  drag=p;dragStart={x:playerPos.x,y:playerPos.y-40};
}
function pointerMove(e){
  if(!drag)return;
  e.preventDefault();
  drag=getPos(e);
}
function pointerUp(e){
  if(!drag)return;
  e.preventDefault();
  const dx=dragStart.x-drag.x, dy=dragStart.y-drag.y;
  const dist=Math.hypot(dx,dy);
  drag=null;
  if(dist<10||state!=='aim')return;
  const power=Math.min(dist,150)/150;
  const angle=Math.atan2(dy,dx);
  fireArrow('player',playerPos.x,playerPos.y-40,angle,power);
}
c.addEventListener('mousedown',pointerDown);
c.addEventListener('mousemove',pointerMove);
window.addEventListener('mouseup',pointerUp);
c.addEventListener('touchstart',pointerDown,{passive:false});
c.addEventListener('touchmove',pointerMove,{passive:false});
c.addEventListener('touchend',pointerUp,{passive:false});

function fireArrow(who,x,y,angle,power){
  state='flying';
  const speed=9+power*10;
  arrow={
    x,y,
    vx:Math.cos(angle)*speed*(who==='player'?1:-1),
    vy:Math.sin(angle)*speed,
    who,trail:[]
  };
  SFX.swoosh();
}

function cpuFire(){
  // AI aims at player position with some error, roughly compensating for wind
  const dx=playerPos.x-cpuPos.x;
  const dist=Math.abs(dx);
  let power=Math.min(1,0.45+dist/500);
  let angle=Math.PI-(0.5+power*0.5); // aim up-left-ish; will refine using simple ballistic guess
  // simple heuristic angle based on distance
  angle=Math.PI-(0.45+ (dist/700)*0.35);
  // wind compensation + inaccuracy
  const err=(Math.random()*0.14-0.07) - wind*2;
  angle+=err;
  fireArrow('cpu',cpuPos.x,cpuPos.y-40,angle,power+ (Math.random()*0.1-0.05));
}

function drawBow(pos,color,flip){
  ctx.save();
  ctx.translate(pos.x,pos.y-24);
  ctx.scale(flip?-1:1,1);
  ctx.fillStyle=color;
  ctx.fillRect(-6,-40,12,40);
  ctx.beginPath();ctx.arc(0,-50,12,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(6,-20,26,-1.3,1.3);ctx.stroke();
  ctx.restore();
}

function drawTarget(pos){
  ctx.save();
  ctx.translate(pos.x,pos.y-24);
  const colors=['#c62828','#fff','#c62828','#fff'];
  for(let i=0;i<4;i++){
    ctx.fillStyle=colors[i];
    ctx.beginPath();ctx.arc(0,0,26-i*6,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawArrowShape(a){
  ctx.save();
  ctx.translate(a.x,a.y);
  const ang=Math.atan2(a.vy,a.vx);
  ctx.rotate(ang);
  ctx.strokeStyle=a.who==='player'?'#ffd54f':'#4fc3f7';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(6,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-2,-4);ctx.lineTo(-2,4);ctx.closePath();
  ctx.fillStyle=ctx.strokeStyle;ctx.fill();
  ctx.restore();
}

function updateArrow(dt){
  if(!arrow)return;
  arrow.trail.push({x:arrow.x,y:arrow.y});
  if(arrow.trail.length>12)arrow.trail.shift();
  arrow.vy+=0.28*dt;
  arrow.vx+=wind*dt;
  arrow.x+=arrow.vx*dt;
  arrow.y+=arrow.vy*dt;

  const targetPos=arrow.who==='player'?cpuPos:playerPos;
  const tx=arrow.who==='player'?targetPos.x:cpuTargetXHitX();
  const dist=Math.hypot(arrow.x-targetPos.x,(arrow.y)-(targetPos.y-24));
  const hitRadius=26;

  if(dist<hitRadius){
    resolveHit(arrow.who,true);
    return;
  }
  if(arrow.y>GROUND+10||arrow.x<-20||arrow.x>W+20){
    resolveHit(arrow.who,false);
  }
}
function cpuTargetXHitX(){return playerPos.x;}

function resolveHit(who,hit){
  arrow=null;
  state='result';
  if(hit){
    if(who==='player'){playerScore++;msg=I18N.t('you_hit','You hit the target!');SFX.success();}
    else {cpuScore++;msg=I18N.t('cpu_hit','CPU hit the target!');SFX.hit();}
  } else {
    msg=who==='player'?I18N.t('you_missed','You missed!'):I18N.t('cpu_missed','CPU missed!');
    SFX.error();
  }
  msgTimer=70;
  setTimeout(()=>{
    if(round>=TOTAL_ROUNDS || (round>=3 && Math.abs(playerScore-cpuScore)>(TOTAL_ROUNDS-round))){
      endMatch();
    } else if(who==='player'){
      state='cpu-turn';
      setTimeout(cpuFire,700);
    } else {
      newRound();
    }
  },900);
}

function endMatch(){
  gameOver=true;
  winner=playerScore>cpuScore?'player':(cpuScore>playerScore?'cpu':'tie');
  if(winner==='player'){duelWins++;localStorage.setItem('archerduel_wins',String(duelWins));SFX.win();}
  else if(winner==='cpu')SFX.lose();
}

function drawWindIndicator(){
  ctx.save();
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('wind_label','WIND'),W/2,26);
  const wx=W/2, wy=40;
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
  const len=Math.min(60,Math.abs(wind)*500);
  const dir=wind>=0?1:-1;
  ctx.beginPath();ctx.moveTo(wx-dir*len/2,wy);ctx.lineTo(wx+dir*len/2,wy);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(wx+dir*len/2,wy);
  ctx.lineTo(wx+dir*len/2-dir*8,wy-5);
  ctx.lineTo(wx+dir*len/2-dir*8,wy+5);
  ctx.closePath();ctx.fillStyle='#ffd54f';ctx.fill();
  ctx.restore();
}

function drawScene(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#2b3a67');sky.addColorStop(1,'#5c7a9e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#4a7c3f';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='rgba(255,255,255,.15)';
  for(let i=0;i<40;i++){
    const gx=(i*53)%W, gy=GROUND+((i*17)%(H-GROUND));
    ctx.fillRect(gx,gy,2,6);
  }
}

let lastTime=null;
function loop(){
  drawScene();
  drawWindIndicator();
  drawTarget(playerPos);
  drawTarget(cpuPos);
  drawBow(playerPos,'#ffd54f',false);
  drawBow(cpuPos,'#4fc3f7',true);

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(state==='flying')updateArrow(dt);
  if(arrow){
    arrow.trail.forEach((t,i)=>{
      ctx.fillStyle=`rgba(255,255,255,${0.05*i})`;
      ctx.beginPath();ctx.arc(t.x,t.y,2,0,Math.PI*2);ctx.fill();
    });
    drawArrowShape(arrow);
  }

  if(drag&&dragStart&&state==='aim'){
    ctx.strokeStyle='rgba(255,213,79,.8)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(dragStart.x,dragStart.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();
    ctx.setLineDash([]);
    const dist=Math.min(Math.hypot(drag.x-dragStart.x,drag.y-dragStart.y),150);
    const pct=dist/150;
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W/2-60,H-22,120,12);
    ctx.fillStyle=pct>0.85?'#e94560':'#66bb6a';
    ctx.fillRect(W/2-60,H-22,120*pct,12);
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.strokeRect(W/2-60,H-22,120,12);
  } else if(state==='aim'){
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='13px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('aim_hint_archer','Drag back from your bow and release to fire'),W/2,H-8);
  }

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,70);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(winner==='player'?I18N.t('you_win_duel','You win the duel!'):winner==='cpu'?I18N.t('cpu_wins_duel','CPU wins the duel'):I18N.t('duel_tied','Duel tied!'),W/2,H/2-14);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_score_archer','Final: You {p} — CPU {c}').replace('{p}',playerScore).replace('{c}',cpuScore),W/2,H/2+18);
    ctx.fillText(I18N.t('retry_hint','Click / tap to play again'),W/2,H/2+46);
  }

  document.getElementById('score-display').textContent=
    I18N.t('archer_score_label','Round {r} | You: {p} | CPU: {c} | Wins: {w}')
      .replace('{r}',Math.min(round,TOTAL_ROUNDS)).replace('{p}',playerScore).replace('{c}',cpuScore).replace('{w}',duelWins);

  requestAnimationFrame(loop);
}
startMatch();
loop();
</script></body></html>
