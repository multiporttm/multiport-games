<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Speed Dash</title><meta name="description" content="Play Speed Dash free online — Race through a maze to the exit as fast as you can, then try to beat your own ghost run!"><link rel="canonical" href="https://games.multiportllc.com/games/speeddash"><meta property="og:title" content="Speed Dash - Multiport Games"><meta property="og:description" content="Play Speed Dash free online — Race through a maze to the exit as fast as you can, then try to beat your own ghost run!"><meta property="og:url" content="https://games.multiportllc.com/games/speeddash"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Speed Dash","description":"Play Speed Dash free online instantly. Race through a maze to the exit as fast as you can, then try to beat your own ghost run! No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/speeddash","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d0d1a}
#ui{color:#69f0ae;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Speed Dash</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Time: 0.0s | Best: —</div>
    <canvas id="c" width="340" height="340"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to race through the maze to the golden exit. Your fastest run appears as a translucent ghost on future attempts — try to beat it!</div>
</div>
<script>
const COLS=11,ROWS=11,CELL=30;
const W=COLS*CELL,H=ROWS*CELL;
let maze,player,startTime,elapsed,state,best=+(localStorage.getItem('speeddash_best')||99999),ghostPath,currentPath,keys={};

function loadBest(){const v=localStorage.getItem('speeddash_best');return v?+v:null;}
function loadGhost(){try{return JSON.parse(localStorage.getItem('speeddash_ghost')||'null');}catch{return null;}}
function saveRun(time,path){
  const b=loadBest();
  if(b===null||time<b){
    localStorage.setItem('speeddash_best',time);
    localStorage.setItem('speeddash_ghost',JSON.stringify(path));
  }
}

function genMaze(){
  const grid=Array.from({length:ROWS},()=>Array(COLS).fill(1));
  function carve(r,c){
    grid[r][c]=0;
    const dirs=[[0,2],[0,-2],[2,0],[-2,0]].sort(()=>Math.random()-0.5);
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&grid[nr][nc]===1){
        grid[r+dr/2][c+dc/2]=0;
        carve(nr,nc);
      }
    }
  }
  carve(1,1);
  grid[ROWS-2][COLS-2]=0;
  return grid;
}

function init(){
  maze=genMaze();
  player={x:1,y:1};
  currentPath=[{x:1,y:1}];
  ghostPath=loadGhost();
  best=loadBest();
  startTime=Date.now();
  state='play';
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
  btn.addEventListener('click',()=>{if(state==='won')init();});
});

let moveTimer=0;
function update(){
  if(state!=='play')return;
  elapsed=(Date.now()-startTime)/1000;
  moveTimer--;
  if(moveTimer<=0){
    let dx=0,dy=0;
    if(keys['arrowup']||keys['w'])dy=-1;
    else if(keys['arrowdown']||keys['s'])dy=1;
    else if(keys['arrowleft']||keys['a'])dx=-1;
    else if(keys['arrowright']||keys['d'])dx=1;
    if(dx||dy){
      const nx=player.x+dx,ny=player.y+dy;
      if(maze[ny] && maze[ny][nx]===0){
        player.x=nx;player.y=ny;
        currentPath.push({x:nx,y:ny,t:elapsed});
        moveTimer=6;
      }
    }
  }
  if(player.x===COLS-2&&player.y===ROWS-2){
    state='won';
    saveRun(elapsed,currentPath);
    best=loadBest();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){
    if(maze[r][col]===1){
      ctx.fillStyle='#37474f';
      ctx.fillRect(col*CELL,r*CELL,CELL,CELL);
    }
  }
  ctx.fillStyle='#ffd54f';
  ctx.fillRect((COLS-2)*CELL+4,(ROWS-2)*CELL+4,CELL-8,CELL-8);

  if(ghostPath&&state==='play'){
    const g=ghostPath.filter(p=>p.t===undefined||p.t<=elapsed);
    const last=g[g.length-1]||ghostPath[0];
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath();ctx.arc(last.x*CELL+CELL/2,last.y*CELL+CELL/2,10,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='#69f0ae';
  ctx.beginPath();ctx.arc(player.x*CELL+CELL/2,player.y*CELL+CELL/2,10,0,Math.PI*2);ctx.fill();

  if(state==='won'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#69f0ae';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('FINISH!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Time: ${elapsed.toFixed(1)}s | Best: ${best?best.toFixed(1):'—'}s`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button for a new maze',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Time: ${(elapsed||0).toFixed(1)}s | Best: ${best?best.toFixed(1)+'s':'—'}`;
}

init();draw();
</script></body></html>
