<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a0e1a;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#score-display{color:#8fd3ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Graveyard Shift</div>
  <div class="game-frame">
    <div id="score-display">Banished: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="640" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Ghosts rise from the graves — <b>Click</b> or <b>Tap</b> each ghost before its glowing meter fills all the way and it jump-scares you. It gets faster and busier as your shift goes on!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=440;
const COLS=4,ROWS=3;
const MARGIN_X=70,MARGIN_TOP=90,MARGIN_BOTTOM=60;
const cellW=(W-MARGIN_X*2)/COLS,cellH=(H-MARGIN_TOP-MARGIN_BOTTOM)/ROWS;

let graves=[];
for(let r=0;r<ROWS;r++){
  for(let g=0;g<COLS;g++){
    graves.push({x:MARGIN_X+g*cellW+cellW/2,y:MARGIN_TOP+r*cellH+cellH/2,ghost:null});
  }
}

let lives=3,banished=0,hi=0,gameOver=false,started=false;
let spawnTimer=0,spawnInterval=1500,elapsed=0;
let lastTime=null;
let flashMsg='',flashUntil=0,flashColor='#fff';

hi=parseInt(localStorage.getItem('graveyardshift_hi')||'0',10);

function reset(){
  lives=3;banished=0;gameOver=false;started=false;spawnTimer=0;spawnInterval=1500;elapsed=0;
  graves.forEach(g=>g.ghost=null);
  lastTime=null;
}
reset();

function spawnGhost(){
  const free=graves.filter(g=>!g.ghost);
  if(free.length===0)return;
  const g=free[Math.floor(Math.random()*free.length)];
  const growTime=Math.max(1100,2800-elapsed/1000*40);
  g.ghost={progress:0,growTime,banishedAnim:0};
}

function hitTest(px,py){
  for(const g of graves){
    if(!g.ghost)continue;
    const d=Math.hypot(px-g.x,py-(g.y-30*g.ghost.progress));
    if(d<40)return g;
  }
  return null;
}

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.changedTouches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.changedTouches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

function onTap(e){
  e.preventDefault&&e.preventDefault();
  if(gameOver){reset();return;}
  if(!started){started=true;return;}
  const p=pointerPos(e);
  const g=hitTest(p.x,p.y);
  if(g){
    banished++;
    if(banished>hi){hi=banished;localStorage.setItem('graveyardshift_hi',String(hi));}
    SFX.success();
    g.ghost=null;
    flashMsg=I18N.t('banished_msg','Banished!');flashColor='#7ee787';flashUntil=performance.now()+500;
  }
}

c.addEventListener('mousedown',onTap);
c.addEventListener('touchstart',onTap,{passive:false});

function drawGrave(g){
  ctx.fillStyle='#3a3f52';
  ctx.beginPath();
  ctx.moveTo(g.x-22,g.y+22);
  ctx.lineTo(g.x-22,g.y-6);
  ctx.quadraticCurveTo(g.x-22,g.y-26,g.x,g.y-26);
  ctx.quadraticCurveTo(g.x+22,g.y-26,g.x+22,g.y-6);
  ctx.lineTo(g.x+22,g.y+22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#22283a';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#5a6076';
  ctx.fillRect(g.x-14,g.y-6,28,3);
}

function drawGhost(g){
  const gh=g.ghost;
  if(!gh)return;
  const rise=30*gh.progress;
  const gy=g.y-rise;
  const alpha=Math.min(1,gh.progress*1.4);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#eaf6ff';
  ctx.beginPath();
  ctx.arc(g.x,gy-14,16,Math.PI,0,false);
  ctx.lineTo(g.x+16,gy+14);
  for(let i=0;i<4;i++){
    const wx=g.x+16-i*8;
    ctx.quadraticCurveTo(wx-4,gy+22,wx-8,gy+14);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(g.x-6,gy-14,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(g.x+6,gy-14,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // manifest meter
  const barW=44;
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(g.x-barW/2,g.y+30,barW,6);
  ctx.fillStyle=gh.progress>0.7?'#ff6b6b':'#ffd54f';
  ctx.fillRect(g.x-barW/2,g.y+30,barW*gh.progress,6);
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('banished_lives_hi','Banished: {b} | Lives: {l} | Hi: {h}')
      .replace('{b}',banished).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0e1a');sky.addColorStop(1,'#141b2e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // moon
  ctx.fillStyle='#ffe9a8';
  ctx.beginPath();ctx.arc(W-60,50,26,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#0d1420';
  ctx.fillRect(0,H-30,W,30);

  graves.forEach(drawGrave);

  if(!started){
    ctx.fillStyle='#8fd3ffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint3','Tap to begin your shift'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    graves.forEach(drawGhost);
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('shift_over','SHIFT OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('ghosts_banished_final','Ghosts banished: {b}').replace('{b}',banished),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint2','Tap to try again'),W/2,H/2+44);
    updateScoreDisplay();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?16:Math.min(now-lastTime,50);
  lastTime=now;
  elapsed+=dt;

  spawnInterval=Math.max(500,1500-elapsed/1000*25);
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){spawnTimer=0;spawnGhost();}

  graves.forEach(g=>{
    if(!g.ghost)return;
    g.ghost.progress+=dt/g.ghost.growTime;
    if(g.ghost.progress>=1){
      g.ghost=null;
      lives--;
      SFX.hit();
      flashMsg=I18N.t('jump_scare','Jump Scare!');flashColor='#ff6b6b';flashUntil=performance.now()+600;
      if(lives<=0){gameOver=true;SFX.lose();}
    }
  });

  graves.forEach(drawGhost);

  if(performance.now()<flashUntil){
    ctx.fillStyle=flashColor;ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,50);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
