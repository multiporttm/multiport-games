<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a2a1a;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#score-display{color:#a8e063;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Fragrance Note Selection</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the client's brief, then pick one <b>Top</b>, one <b>Heart</b>, and one <b>Base</b> note from the palette that match the requested mood. Use <b>Arrow keys</b> + <b>Enter</b> or <b>tap</b> the ingredients, then tap/press <b>Enter</b> on <b>SUBMIT</b> before the deadline runs out. You have 3 lives.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
const HISCORE_KEY='fragrancenoteselection_hiscore';
let hi=parseInt(localStorage.getItem(HISCORE_KEY)||'0',10);

const INGREDIENTS={
  top:[
    {name:'Bergamot',fam:'citrus',mood:['fresh','summer','energetic']},
    {name:'Lemon Zest',fam:'citrus',mood:['fresh','summer','clean']},
    {name:'Pink Pepper',fam:'spicy',mood:['energetic','bold']},
    {name:'Lavender',fam:'floral',mood:['calm','clean']},
  ],
  heart:[
    {name:'Rose',fam:'floral',mood:['romantic','elegant']},
    {name:'Jasmine',fam:'floral',mood:['romantic','summer','elegant']},
    {name:'Geranium',fam:'floral',mood:['fresh','clean']},
    {name:'Cedar Leaf',fam:'woody',mood:['calm','bold']},
  ],
  base:[
    {name:'Musk',fam:'musk',mood:['romantic','elegant','bold']},
    {name:'Sandalwood',fam:'woody',mood:['calm','elegant','bold']},
    {name:'Vetiver',fam:'woody',mood:['fresh','energetic']},
    {name:'Amber',fam:'musk',mood:['romantic','calm']},
  ]
};
const MOODS=['fresh','summer','romantic','calm','energetic','elegant','bold','clean'];

let score=0,lives=3,level=1,gameOver=false,started=false;
let brief=null;
let selection={top:-1,heart:-1,base:-1};
let cursorRow=0,cursorCol=0;
let roundTime=0,roundMax=0;
let lastTime=null;
let flashTimer=0,flashMsg='',flashGood=false;

function pickBrief(){
  const mood=MOODS[Math.floor(Math.random()*MOODS.length)];
  // Determine correct answer indices: must have mood in their mood list
  function validIdx(cat){
    const arr=[];
    INGREDIENTS[cat].forEach((ing,i)=>{ if(ing.mood.includes(mood)) arr.push(i); });
    return arr.length? arr[Math.floor(Math.random()*arr.length)] : Math.floor(Math.random()*INGREDIENTS[cat].length);
  }
  return {mood,correct:{top:validIdx('top'),heart:validIdx('heart'),base:validIdx('base')}};
}

function newRound(){
  brief=pickBrief();
  selection={top:-1,heart:-1,base:-1};
  cursorRow=0;cursorCol=0;
  roundMax=Math.max(500,1100-level*45);
  roundTime=roundMax;
}

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  newRound();
  lastTime=null;
}
reset();

const CATS=['top','heart','base'];

function selectCell(row,col){
  if(gameOver)return;
  if(!started)started=true;
  selection[CATS[row]]=col;
  SFX.select();
}

function submit(){
  if(gameOver||!started)return;
  if(selection.top<0||selection.heart<0||selection.base<0){
    flashMsg=I18N.t('pick_all_notes','Pick a note from each row first!');
    flashGood=false;flashTimer=60;SFX.error();
    return;
  }
  const correct = selection.top===brief.correct.top && selection.heart===brief.correct.heart && selection.base===brief.correct.base;
  if(correct){
    const pts=Math.round(150*(1+level*0.15));
    score+=pts;
    flashMsg=I18N.t('brief_matched','Perfect match! Client delighted.');
    flashGood=true;flashTimer=70;SFX.success();
    level++;
    newRound();
  } else {
    lives--;
    flashMsg=I18N.t('brief_missed','Not quite the right notes.');
    flashGood=false;flashTimer=70;SFX.fail();
    if(lives<=0){
      gameOver=true;
      if(score>hi){hi=score;localStorage.setItem(HISCORE_KEY,String(hi));}
      SFX.lose();
    } else {
      newRound();
    }
  }
}

function doRestart(){ reset(); }

document.addEventListener('keydown',e=>{
  if(gameOver){ if(e.code==='Enter'||e.code==='Space'){doRestart();} return; }
  if(!started)started=true;
  switch(e.code){
    case 'ArrowUp': e.preventDefault(); cursorRow=(cursorRow+2)%3; break;
    case 'ArrowDown': e.preventDefault(); cursorRow=(cursorRow+1)%3; break;
    case 'ArrowLeft': e.preventDefault(); cursorCol=(cursorCol+3)%4; break;
    case 'ArrowRight': e.preventDefault(); cursorCol=(cursorCol+1)%4; break;
    case 'Enter': e.preventDefault(); selectCell(cursorRow,cursorCol); break;
    case 'Space': e.preventDefault(); submit(); break;
  }
});

function getPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}

const rowY=[140,230,320];
const colX=[100,290,480,670];
const cellW=170,cellH=70;

function handleTap(e){
  if(gameOver){doRestart();return;}
  const p=getPos(e);
  for(let row=0;row<3;row++){
    for(let col=0;col<4;col++){
      const x=colX[col]-cellW/2, y=rowY[row]-cellH/2;
      if(p.x>=x&&p.x<=x+cellW&&p.y>=y&&p.y<=y+cellH){ cursorRow=row;cursorCol=col; selectCell(row,col); return; }
    }
  }
  const sub={x:300,y:420,w:200,h:50};
  if(p.x>=sub.x&&p.x<=sub.x+sub.w&&p.y>=sub.y&&p.y<=sub.y+sub.h){ submit(); return; }
}
c.addEventListener('click',handleTap);
c.addEventListener('touchstart',e=>{e.preventDefault();handleTap(e);},{passive:false});

const FAM_COLOR={citrus:'#ffb74d',floral:'#f06292',woody:'#8d6e63',musk:'#9575cd',spicy:'#e57373'};

function drawCell(row,col){
  const ing=INGREDIENTS[CATS[row]][col];
  const x=colX[col]-cellW/2, y=rowY[row]-cellH/2;
  const isSel=selection[CATS[row]]===col;
  const isCursor=cursorRow===row&&cursorCol===col;
  ctx.fillStyle=isSel?'#ffd54f':(FAM_COLOR[ing.fam]||'#777');
  ctx.fillRect(x,y,cellW,cellH);
  if(isCursor){ ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,cellW-3,cellH-3); }
  ctx.fillStyle=isSel?'#1a1a1a':'#fff';
  ctx.font='bold 15px Arial';ctx.textAlign='center';
  ctx.fillText(ing.name,x+cellW/2,y+cellH/2+5);
}

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('score_hi_level_label','Score: {s} | Hi: {h} | Level: {l}')
      .replace('{s}',score).replace('{h}',hi).replace('{l}',level);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d2a0d');bg.addColorStop(1,'#1a2a1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='18px Arial';ctx.textAlign='left';
  let s='';for(let i=0;i<3;i++)s+= i<lives?'🌸':'🥀';
  ctx.fillText(s,20,30);

  ctx.textAlign='center';ctx.font='bold 22px Arial';
  ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('brief_title','CLIENT BRIEF')+' — Lv.'+level,400,34);
  ctx.font='bold 26px Arial';ctx.fillStyle='#a8e063';
  ctx.fillText(I18N.t('brief_mood_label','Mood: {m}').replace('{m}',brief.mood.toUpperCase()),400,70);

  const labels=[I18N.t('note_top','TOP'),I18N.t('note_heart','HEART'),I18N.t('note_base','BASE')];
  for(let row=0;row<3;row++){
    ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#fff';
    ctx.fillText(labels[row],20,rowY[row]+5);
    for(let col=0;col<4;col++) drawCell(row,col);
  }

  ctx.fillStyle='#4caf50';ctx.fillRect(300,420,200,50);
  ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('submit_btn','SUBMIT'),400,452);

  if(!gameOver&&started){
    ctx.fillStyle='#143014';ctx.fillRect(100,395,600,12);
    const frac=Math.max(0,roundTime/roundMax);
    ctx.fillStyle=frac>0.3?'#a8e063':'#e94560';
    ctx.fillRect(100,395,600*frac,12);
  }

  if(flashTimer>0){
    ctx.font='bold 20px Arial';ctx.fillStyle=flashGood?'#7ec850':'#e94560';
    ctx.fillText(flashMsg,400,400);
  }

  if(!gameOver&&started){
    const now=performance.now();
    const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
    lastTime=now;
    roundTime-=dt*16.6667;
    if(flashTimer>0)flashTimer-=dt;
    if(roundTime<=0){
      roundTime=0;
      lives--;
      flashMsg=I18N.t('deadline_missed','Deadline missed!');
      flashGood=false;flashTimer=70;SFX.fail();
      if(lives<=0){
        gameOver=true;
        if(score>hi){hi=score;localStorage.setItem(HISCORE_KEY,String(hi));}
        SFX.lose();
      } else {
        newRound();
      }
    }
  } else {
    lastTime=null;
  }

  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_notes','Pick notes, tap/Enter on SUBMIT'),400,250);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,220);
    ctx.font='22px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),400,260);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Enter to restart'),400,300);
  }

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
