<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Dust Storm Survival</title><meta name="description" content="Play Dust Storm Survival free online — Use Arrow Keys/A-D or drag to steer the wagon through the storm. Tap or press Space for a brief lightning flash of visibility. Reach shelter before your stamina runs out."><link rel="canonical" href="https://games.multiportllc.com/games/duststormsurvival"><meta property="og:title" content="Dust Storm Survival - Multiport Games"><meta property="og:description" content="Play Dust Storm Survival free online — Use Arrow Keys/A-D or drag to steer the wagon through the storm. Tap or press Space for a brief lightning flash of visibility. Reach shelter before your stamina runs out."><meta property="og:url" content="https://games.multiportllc.com/games/duststormsurvival"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Dust Storm Survival","description":"Play Dust Storm Survival free online instantly. Steer a wagon and family through a raging desert dust storm with near-zero visibility, using brief lightning-style flashes to spot rocks, ravines and other wagons before your stamina runs out. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/duststormsurvival","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#7a6650;display:block;border-radius:8px;touch-action:none}
#hud{color:#f4e3c1;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffcf6b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dust Storm Survival</div>
  <div class="game-frame">
    <div id="hud"><span>Distance: <b id="distNum">0</b>m</span><span>Stamina: <b id="stamNum">100</b></span><span>Hi: <b id="hiNum">0</b>m</span></div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions"><b>Steer:</b> Arrow Keys / A-D, or drag left-right. <b>Flash:</b> press <b>Space</b> or tap the storm to briefly light up hazards ahead. Dodge rocks, ravines and stray wagons, and reach shelter before your stamina (used by flashing and drifting) runs out!</div>
</div>
<script>
const HI_KEY='duststormsurvival_hi';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
document.getElementById('hiNum').textContent=hi;

const wagon={x:W/2,w:46,h:34,vx:0};
const laneY=H-70;
let dist=0,stamina=100,gameOver=false,started=false,won=false;
let hazards=[];
let flashT=0; // remaining flash time
let spawnTimer=0;
let speed=3.4;
let shakeT=0;
let keys={left:false,right:false};
let dragActive=false,dragStartX=0,dragStartWagonX=0;
let particles=[];

function reset(){
  dist=0;stamina=100;gameOver=false;started=false;won=false;
  hazards=[];flashT=0;spawnTimer=0;speed=3.4;shakeT=0;wagon.x=W/2;wagon.vx=0;particles=[];
}

function spawnHazard(){
  const types=['rock','ravine','wagon'];
  const type=types[Math.floor(Math.random()*types.length)];
  const x=60+Math.random()*(W-120);
  let w=40,h=40;
  if(type==='rock'){w=34+Math.random()*22;h=w*0.7;}
  else if(type==='ravine'){w=90+Math.random()*60;h=26;}
  else{w=44;h=30;}
  hazards.push({type,x,y:-60,w,h,passed:false});
}

function doFlash(){
  if(gameOver||!started)return;
  if(flashT<=0&&stamina>=8){
    flashT=55; // frames of visibility
    stamina-=8;
    SFX.powerup();
  }
}

function startGame(){
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!started||gameOver)startGame();else doFlash();}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;if(!started)startGame();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;if(!started)startGame();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});

c.addEventListener('pointerdown',e=>{
  if(!started||gameOver){startGame();return;}
  dragActive=true;
  const r=c.getBoundingClientRect();
  dragStartX=(e.clientX-r.left)*(W/r.width);
  dragStartWagonX=wagon.x;
  doFlash();
});
c.addEventListener('pointermove',e=>{
  if(!dragActive)return;
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  wagon.x=Math.max(wagon.w/2,Math.min(W-wagon.w/2,dragStartWagonX+(x-dragStartX)));
});
window.addEventListener('pointerup',()=>{dragActive=false;});

function rectOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawWagon(){
  ctx.save();
  ctx.translate(wagon.x,laneY);
  ctx.fillStyle='#5b4630';
  ctx.fillRect(-wagon.w/2,-wagon.h/2,wagon.w,wagon.h);
  ctx.fillStyle='#c9a15a';
  ctx.beginPath();
  ctx.arc(0,-wagon.h/2-10,16,Math.PI,0);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.beginPath();ctx.arc(-wagon.w/2+8,wagon.h/2,7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(wagon.w/2-8,wagon.h/2,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawHazard(hz){
  ctx.save();
  if(hz.type==='rock'){
    ctx.fillStyle='#4a4038';
    ctx.beginPath();ctx.ellipse(hz.x,hz.y,hz.w/2,hz.h/2,0,0,Math.PI*2);ctx.fill();
  }else if(hz.type==='ravine'){
    ctx.fillStyle='#1a1108';
    ctx.fillRect(hz.x-hz.w/2,hz.y-hz.h/2,hz.w,hz.h);
    ctx.fillStyle='#3a2a18';
    ctx.fillRect(hz.x-hz.w/2,hz.y-hz.h/2,hz.w,4);
  }else{
    ctx.fillStyle='#6b5236';
    ctx.fillRect(hz.x-hz.w/2,hz.y-hz.h/2,hz.w,hz.h);
    ctx.fillStyle='#9c7a45';
    ctx.beginPath();ctx.arc(hz.x,hz.y-hz.h/2-8,10,Math.PI,0);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function updateParticles(dt){
  if(Math.random()<0.9)particles.push({x:Math.random()*W,y:-5,vx:(-2-Math.random()*3),vy:2+Math.random()*3,life:60+Math.random()*40});
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});
}
function drawParticles(alpha){
  ctx.fillStyle=`rgba(210,190,150,${alpha})`;
  particles.forEach(p=>{ctx.fillRect(p.x,p.y,3,10);});
}

function loop(ts){
  const dt=1;
  ctx.save();
  if(shakeT>0){ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);shakeT-=dt;}

  // base storm background
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#8a7256');grad.addColorStop(1,'#5c4a35');
  ctx.fillStyle=grad;ctx.fillRect(-10,-10,W+20,H+20);

  if(!started){
    updateParticles(dt);drawParticles(0.5);
    drawWagon();
    ctx.fillStyle='#fff3d8';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,H/2-20);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('ds_desc','Steer through the storm. Flash to see ahead!'),W/2,H/2+14);
    ctx.restore();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    updateParticles(dt);drawParticles(0.6);
    hazards.forEach(drawHazard);
    drawWagon();
    ctx.fillStyle='rgba(20,14,8,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('shelter_title','SHELTER REACHED!'):I18N.t('game_over_title','GAME OVER'),W/2,H/2-16);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
    ctx.restore();
    requestAnimationFrame(loop);return;
  }

  // wagon steering
  const accel=0.5;
  if(keys.left)wagon.vx-=accel;
  if(keys.right)wagon.vx+=accel;
  wagon.vx*=0.85;
  wagon.x+=wagon.vx*dt;
  wagon.x=Math.max(wagon.w/2,Math.min(W-wagon.w/2,wagon.x));

  dist+=speed*0.12*dt;
  speed=Math.min(7,3.4+dist/220);
  if(dist>hi){/* preview only, saved on end */}

  // stamina drains slowly, drifting drains more
  stamina-=0.045*dt;
  if(Math.abs(wagon.vx)>3)stamina-=0.02*dt;
  if(flashT>0)flashT-=dt;

  spawnTimer+=dt;
  const interval=Math.max(28,55-dist/25);
  if(spawnTimer>=interval){spawnTimer=0;spawnHazard();}

  hazards.forEach(hz=>{hz.y+=speed*dt*2.2;});
  hazards=hazards.filter(hz=>hz.y<H+80);

  const wagonBox={x:wagon.x-wagon.w/2,y:laneY-wagon.h/2,w:wagon.w,h:wagon.h};
  hazards.forEach(hz=>{
    const hb={x:hz.x-hz.w/2,y:hz.y-hz.h/2,w:hz.w,h:hz.h};
    if(rectOverlap(wagonBox,hb)&&!gameOver){
      gameOver=true;SFX.lose();shakeT=20;
      if(Math.floor(dist)>hi){hi=Math.floor(dist);localStorage.setItem(HI_KEY,hi);}
    }
  });

  if(stamina<=0&&!gameOver){
    stamina=0;gameOver=true;SFX.fail();
    if(Math.floor(dist)>hi){hi=Math.floor(dist);localStorage.setItem(HI_KEY,hi);}
  }
  if(dist>=1500&&!gameOver){
    gameOver=true;won=true;SFX.win();
    if(Math.floor(dist)>hi){hi=Math.floor(dist);localStorage.setItem(HI_KEY,hi);}
  }

  // Visibility: darkness except during flash / near-wagon radius
  updateParticles(dt);

  hazards.forEach(drawHazard);
  drawWagon();
  drawParticles(0.55);

  // darkness overlay creates near-zero visibility, punctured by flash
  const visRadius=flashT>0?520:90;
  const fog=ctx.createRadialGradient(wagon.x,laneY,visRadius*0.15,wagon.x,laneY,visRadius);
  fog.addColorStop(0,'rgba(20,14,8,0)');
  fog.addColorStop(1,flashT>0?'rgba(20,14,8,0.15)':'rgba(20,14,8,0.97)');
  ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);

  if(flashT>0){
    ctx.fillStyle=`rgba(255,255,240,${Math.min(0.18,flashT/300)})`;
    ctx.fillRect(0,0,W,H);
  }

  document.getElementById('distNum').textContent=Math.floor(dist);
  document.getElementById('stamNum').textContent=Math.max(0,Math.floor(stamina));
  document.getElementById('hiNum').textContent=hi;

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
