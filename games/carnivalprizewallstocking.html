<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Carnival Prize Wall Stocking</title><meta name="description" content="Play Carnival Prize Wall Stocking free online — Drag each incoming prize onto the shelf hook matching its tier before the shipment timer runs out."><link rel="canonical" href="https://games.multiportllc.com/games/carnivalprizewallstocking"><meta property="og:title" content="Carnival Prize Wall Stocking - Multiport Games"><meta property="og:description" content="Play Carnival Prize Wall Stocking free online — Drag each incoming prize onto the shelf hook matching its tier before the shipment timer runs out."><meta property="og:url" content="https://games.multiportllc.com/games/carnivalprizewallstocking"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Carnival Prize Wall Stocking","description":"Play Carnival Prize Wall Stocking free online instantly. Restock a carnival booth's prize wall between rushes by sorting new prize shipments onto the correct shelf row for their tier — small, medium, large, or jumbo — before the next rush of players arrives. Shipments speed up and crowd the belt more with every round. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/carnivalprizewallstocking","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1a3d;display:block;border-radius:8px;touch-action:none;cursor:grab}
#hud{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.lives{letter-spacing:2px;color:#ff6b6b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Carnival Prize Wall Stocking</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisplay">Score: 0</span>
      <span id="hiDisplay">Hi: 0</span>
      <span id="roundDisplay">Round: 1</span>
      <span class="lives" id="livesDisplay">♥♥♥</span>
    </div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag (or use <b>Arrow Keys</b> + <b>Enter</b>, or <b>1-4</b>) to put each prize box on the shelf row matching its tier — <b>small, medium, large, jumbo</b> — before it reaches the end of the belt. Three misses and the booth closes!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const TIERS=[
  {name:'small',label:()=>I18N.t('tier_small','SMALL'),color:'#7ec850',size:18},
  {name:'medium',label:()=>I18N.t('tier_medium','MEDIUM'),color:'#4ecdc4',size:26},
  {name:'large',label:()=>I18N.t('tier_large','LARGE'),color:'#ffd54f',size:34},
  {name:'jumbo',label:()=>I18N.t('tier_jumbo','JUMBO'),color:'#ff6b6b',size:44}
];
const SHELF_X=620, SHELF_W=160, SHELF_TOP=60, SHELF_H=320;
const ROW_H=SHELF_H/4;

let score=0,hi=parseInt(localStorage.getItem('carnivalprizewallstocking_hi')||'0',10);
let lives=3,round=1,gameOver=false,started=false;
let belt=[],beltSpeed=0.9,spawnTimer=0,spawnInterval=130;
let selected=null,selIndex=0,frame=0;
let msg='',msgTimer=0;

function reset(){
  score=0;lives=3;round=1;gameOver=false;started=false;
  belt=[];beltSpeed=0.9;spawnTimer=0;spawnInterval=130;selected=null;selIndex=0;frame=0;msg='';msgTimer=0;
}

function spawnPrize(){
  const tierIdx=Math.floor(Math.random()*TIERS.length);
  belt.push({tier:tierIdx,x:-40,y:200,picked:false,id:Math.random()});
}

function livesStr(){return '♥'.repeat(lives)+'♡'.repeat(3-lives);}

function updateHud(){
  document.getElementById('scoreDisplay').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('hiDisplay').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',hi);
  document.getElementById('roundDisplay').textContent=I18N.t('round_label','Round: {r}').replace('{r}',round);
  document.getElementById('livesDisplay').textContent=livesStr();
}

function setMsg(t,dur){msg=t;msgTimer=dur||60;}

function placePrize(prize,rowIdx){
  if(rowIdx===prize.tier){
    score+=10+round*2;
    SFX.success();
    setMsg(I18N.t('msg_correct','Perfect shelf!'),40);
  }else{
    lives--;
    SFX.error();
    setMsg(I18N.t('msg_wrong','Wrong shelf!'),40);
    if(lives<=0){endGame();return;}
  }
  if(score>hi){hi=score;localStorage.setItem('carnivalprizewallstocking_hi',hi);}
  belt=belt.filter(p=>p.id!==prize.id);
  if(score>0&&score%60===0){round++;beltSpeed+=0.25;spawnInterval=Math.max(55,spawnInterval-10);SFX.levelup();setMsg(I18N.t('msg_round','Rush incoming! Round '+round),50);}
  updateHud();
}

function endGame(){
  gameOver=true;
  SFX.lose();
  if(score>hi){hi=score;localStorage.setItem('carnivalprizewallstocking_hi',hi);}
  updateHud();
}

function startGame(){started=true;spawnPrize();}

function hitTest(px,py,prize){
  const s=TIERS[prize.tier].size;
  return px>=prize.x-s/2&&px<=prize.x+s/2&&py>=prize.y-s/2&&py<=prize.y+s/2;
}

function pointerDown(x,y){
  if(gameOver){reset();return;}
  if(!started){startGame();return;}
  for(let i=belt.length-1;i>=0;i--){
    if(hitTest(x,y,belt[i])){selected=belt[i];return;}
  }
}
function pointerMove(x,y){
  if(selected){selected.dragX=x;selected.dragY=y;}
}
function pointerUp(x,y){
  if(!selected)return;
  if(x>=SHELF_X&&x<=SHELF_X+SHELF_W&&y>=SHELF_TOP&&y<=SHELF_TOP+SHELF_H){
    const rowIdx=Math.min(3,Math.max(0,Math.floor((y-SHELF_TOP)/ROW_H)));
    placePrize(selected,rowIdx);
  }
  selected.dragX=null;selected.dragY=null;
  selected=null;
}

function toCanvasCoords(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}
c.addEventListener('mousedown',e=>{const p=toCanvasCoords(e);pointerDown(p.x,p.y);});
c.addEventListener('mousemove',e=>{const p=toCanvasCoords(e);pointerMove(p.x,p.y);});
window.addEventListener('mouseup',e=>{const p=toCanvasCoords(e);pointerUp(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=toCanvasCoords(e);pointerDown(p.x,p.y);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const p=toCanvasCoords(e);pointerMove(p.x,p.y);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();
  let p;
  if(selected)p={x:selected.dragX,y:selected.dragY};
  else p={x:0,y:0};
  pointerUp(p.x,p.y);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(gameOver&&(e.code==='Enter'||e.code==='Space')){reset();return;}
  if(!started&&(e.code==='Enter'||e.code==='Space')){startGame();return;}
  if(!belt.length)return;
  if(e.code==='ArrowLeft'){selIndex=Math.max(0,selIndex-1);e.preventDefault();}
  else if(e.code==='ArrowRight'){selIndex=Math.min(belt.length-1,selIndex+1);e.preventDefault();}
  else if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'||e.code==='Digit4'){
    const rowIdx=parseInt(e.code.slice(-1),10)-1;
    const prize=belt[selIndex];
    if(prize)placePrize(prize,rowIdx);
    selIndex=0;
  }
});

function drawShelf(){
  ctx.fillStyle='#1a0f26';
  ctx.fillRect(SHELF_X-10,SHELF_TOP-10,SHELF_W+20,SHELF_H+20);
  for(let i=0;i<4;i++){
    const y=SHELF_TOP+i*ROW_H;
    ctx.fillStyle=TIERS[i].color+'33';
    ctx.fillRect(SHELF_X,y,SHELF_W,ROW_H-6);
    ctx.strokeStyle=TIERS[i].color;
    ctx.lineWidth=2;
    ctx.strokeRect(SHELF_X,y,SHELF_W,ROW_H-6);
    ctx.fillStyle=TIERS[i].color;
    ctx.font='bold 13px Arial';
    ctx.textAlign='center';
    ctx.fillText(TIERS[i].label(),SHELF_X+SHELF_W/2,y+ROW_H/2+4);
  }
}

function drawPrize(p,highlight){
  const s=TIERS[p.tier].size;
  const x=p.dragX!=null?p.dragX:p.x;
  const y=p.dragY!=null?p.dragY:p.y;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=TIERS[p.tier].color;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=highlight?3:1.5;
  ctx.beginPath();
  ctx.roundRect(-s/2,-s/2,s,s,6);
  ctx.fill();ctx.stroke();
  ctx.restore();
}

function loop(){
  frame++;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a3d');bg.addColorStop(1,'#1a0f26');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // belt
  ctx.fillStyle='#3d2850';
  ctx.fillRect(0,170,SHELF_X-20,60);
  ctx.strokeStyle='#5a3d70';
  for(let i=0;i<20;i++){
    const bx=(frame*0.5+i*40)%(SHELF_X-20);
    ctx.beginPath();ctx.moveTo(bx,170);ctx.lineTo(bx,230);ctx.stroke();
  }

  drawShelf();

  if(!started&&!gameOver){
    ctx.fillStyle='#ffd54f';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start restocking'),W/2-60,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','BOOTH CLOSED'),W/2-60,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Enter to restart'),W/2-60,H/2+24);
    requestAnimationFrame(loop);
    return;
  }

  spawnTimer++;
  if(spawnTimer>=spawnInterval){spawnTimer=0;spawnPrize();}

  belt.forEach(p=>{
    if(p!==selected){
      p.x+=beltSpeed*(1+round*0.05);
      if(p.x>SHELF_X-30){
        lives--;SFX.error();setMsg(I18N.t('msg_missed','Missed one!'),40);
        belt=belt.filter(b=>b.id!==p.id);
        if(lives<=0)endGame();
        updateHud();
      }
    }
  });

  belt.forEach((p,i)=>drawPrize(p,i===selIndex&&belt.length>0));

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='rgba(255,255,255,'+Math.min(1,msgTimer/20)+')';
    ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(msg,SHELF_X/2,40);
  }

  requestAnimationFrame(loop);
}
updateHud();
loop();
</script></body></html>
