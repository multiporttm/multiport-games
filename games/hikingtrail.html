<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#4a7c3c;display:block;border-radius:8px;touch-action:none}
#score-display{color:#a3d977;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#duck-btn{display:inline-block;margin-top:6px;padding:10px 26px;background:#3d5c2e;border:none;border-radius:20px;color:#fff;font-weight:700;cursor:pointer;font-size:1rem;user-select:none}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Hiking Trail</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Hi: 0m</div>
    <canvas id="c" width="800" height="250"></canvas>
    <div style="text-align:center"><button id="duck-btn">Duck ▼</button></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Up Arrow</b> or <b>Tap</b> to jump over rocks and logs. Press <b>Down Arrow</b> or hold the <b>Duck</b> button to duck under low branches. Collect <b>trail badges</b> for bonus points. Colliding with an obstacle ends the hike!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=250;
let dist=0,hi=0,spd=5,frame=0,gameOver=false,started=false;
try{hi=parseFloat(localStorage.getItem('hikingtrail_hi')||'0');}catch(e){}

const ground=200;
const hiker={x:80,y:ground,w:36,h:50,vy:0,jumps:0,ducking:false};
let obstacles=[],badges=[];
let lastTime=null,obsTimer=0,badgeTimer=0;
let bonus=0;

function reset(){
  dist=0;spd=5;frame=0;gameOver=false;started=false;
  obstacles=[];badges=[];bonus=0;
  hiker.y=ground;hiker.vy=0;hiker.jumps=0;hiker.ducking=false;
  lastTime=null;obsTimer=0;badgeTimer=0;
}

function jump(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(hiker.ducking)return;
  if(hiker.jumps<2){hiker.vy=-13+hiker.jumps*2;hiker.jumps++;SFX.jump();}
}
function setDuck(v){
  if(!started||gameOver)return;
  hiker.ducking=v && hiker.jumps===0;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  if(e.code==='ArrowDown'){e.preventDefault();setDuck(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowDown'){setDuck(false);}
});
c.addEventListener('click',jump);
c.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

const duckBtn=document.getElementById('duck-btn');
duckBtn.addEventListener('mousedown',()=>setDuck(true));
duckBtn.addEventListener('mouseup',()=>setDuck(false));
duckBtn.addEventListener('mouseleave',()=>setDuck(false));
duckBtn.addEventListener('touchstart',e=>{e.preventDefault();setDuck(true);},{passive:false});
duckBtn.addEventListener('touchend',e=>{e.preventDefault();setDuck(false);},{passive:false});

function spawnObs(){
  const kind=Math.random()<0.55?'rock':'branch';
  if(kind==='rock'){
    const h=28+Math.random()*30;
    obstacles.push({type:'rock',x:820,w:26,h,y:ground+hiker.h-h});
  } else {
    obstacles.push({type:'branch',x:820,w:44,h:18,y:ground-14});
  }
}
function spawnBadge(){
  const y=Math.random()<0.5?ground-70:ground-10;
  badges.push({x:820,y,r:12,collected:false});
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawHiker(){
  ctx.save();
  const h=hiker.ducking?hiker.h*0.55:hiker.h;
  const yOff=hiker.ducking?hiker.h-h:0;
  ctx.fillStyle='#d98e4c';
  ctx.fillRect(hiker.x,hiker.y+yOff,hiker.w,h);
  ctx.fillStyle='#8b4a2b';
  ctx.fillRect(hiker.x+hiker.w-8,hiker.y+yOff-14,16,16);
  // legs
  if(!hiker.ducking){
    const legOff=Math.floor(frame/6)%2===0?0:8;
    ctx.fillStyle='#5c3a21';
    ctx.fillRect(hiker.x+4,hiker.y+hiker.h,8,10+legOff);
    ctx.fillRect(hiker.x+hiker.w-12,hiker.y+hiker.h,8,10+(8-legOff));
  }
  ctx.restore();
}

function drawObstacle(o){
  if(o.type==='rock'){
    ctx.fillStyle='#8a8a8a';
    ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6b6b6b';
    ctx.beginPath();ctx.moveTo(o.x+o.w*0.3,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y+o.h*0.4);ctx.lineTo(o.x+o.w*0.7,o.y+o.h);ctx.closePath();ctx.fill();
  } else {
    ctx.fillStyle='#5c3a21';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#3f2916';
    for(let i=0;i<3;i++)ctx.fillRect(o.x+i*15,o.y-6,4,10);
  }
}

function drawBadge(b){
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#c9a227';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText('★',b.x,b.y+4);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#3e7bb0');sky.addColorStop(1,'#a3c9e0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,200);
  ctx.fillStyle='#6b9950';ctx.fillRect(0,ground+hiker.h,W,50);
  ctx.fillStyle='#4a7c3c';ctx.fillRect(0,ground+hiker.h,W,5);

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,120);
    ctx.font='20px Arial';ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,158);
    document.getElementById('score-display').textContent=
      I18N.t('dist_hi_label','Distance: {s}m | Hi: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(hi));
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_hike','Press Space / Tap to start hiking'),W/2,120);
    drawHiker();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  frame+=dt;
  dist+=dt*0.15;
  if(dist>hi)hi=dist;
  spd=6+dist/40;

  obsTimer+=dt;
  const obsInterval=Math.max(40,100-dist/3);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObs();}

  badgeTimer+=dt;
  if(badgeTimer>=90){badgeTimer-=90;spawnBadge();}

  hiker.vy+=0.7*dt;
  hiker.y+=hiker.vy*dt;
  if(hiker.y>=ground){hiker.y=ground;hiker.vy=0;hiker.jumps=0;}
  if(hiker.jumps>0)hiker.ducking=false;

  const duckH=hiker.ducking?hiker.h*0.55:hiker.h;
  const duckYOff=hiker.ducking?hiker.h-duckH:0;
  const hikerHit={x:hiker.x+4,y:hiker.y+duckYOff-10,w:hiker.w+4,h:duckH+10};

  obstacles=obstacles.filter(o=>o.x>-40);
  obstacles.forEach(o=>{
    o.x-=spd*dt;
    drawObstacle(o);
    if(rect(hikerHit,{x:o.x,y:o.y,w:o.w,h:o.h})&&!gameOver){gameOver=true;SFX.lose();
      try{localStorage.setItem('hikingtrail_hi',hi);}catch(e){}
    }
  });

  badges=badges.filter(b=>b.x>-30 && !b.collected);
  badges.forEach(b=>{
    b.x-=spd*dt;
    drawBadge(b);
    if(!b.collected && rect(hikerHit,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){
      b.collected=true;bonus+=10;dist+=5;SFX.coin();
    }
  });

  drawHiker();

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('bonus_label','Badges bonus: {b}').replace('{b}',bonus),16,24);

  document.getElementById('score-display').textContent=
    I18N.t('dist_hi_label','Distance: {s}m | Hi: {h}m').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(hi));

  if(gameOver){try{localStorage.setItem('hikingtrail_hi',hi);}catch(e){}}
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
