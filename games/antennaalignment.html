<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0c1322;display:block;border-radius:8px;touch-action:none}
#score-display{color:#9ee6a8;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Antenna Alignment</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lives: 3 | Hi: 0 | Round: 1</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Left/Right Arrows</b> or drag with mouse/touch to rotate the antenna. Watch the signal meter and press <b>Space/Enter</b> (or tap <b>LOCK</b>) at the strongest bearing before the timer runs out. 3 bad locks or timeouts and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const CX=W/2,CY=200,RADIUS=120;
const LOCK_BTN={x:W/2-70,y:360,w:140,h:40};

let round=1,score=0,lives=3,hi=0,gameOver=false,started=false;
let bearing=0,target=0,timer=0,timeLimit=0,msg='',msgTimer=0;
let keyLeft=false,keyRight=false,dragging=false,lastDragAngle=0;

try{hi=parseInt(localStorage.getItem('antenna_hi')||'0',10)||0;}catch(e){}

function tolerance(){ return Math.max(4,16-round*0.8); }
function timeForRound(){ return Math.max(240,600-round*25); } // frames

function newRound(){
  target=Math.random()*360;
  bearing=(target+120+Math.random()*120)%360;
  timeLimit=timeForRound();
  timer=timeLimit;
}

function reset(){
  round=1;score=0;lives=3;gameOver=false;started=false;msg='';msgTimer=0;
  newRound();
}
reset();

function flash(t){msg=t;msgTimer=100;}

function signalStrength(){
  let diff=Math.abs(bearing-target)%360;
  if(diff>180)diff=360-diff;
  const sigma=18;
  let s=Math.exp(-(diff*diff)/(2*sigma*sigma));
  s+=(Math.random()-0.5)*0.03; // slight noise
  return Math.max(0,Math.min(1,s));
}

function attemptLock(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  let diff=Math.abs(bearing-target)%360;
  if(diff>180)diff=360-diff;
  if(diff<=tolerance()){
    const precisionBonus=Math.round((1-diff/tolerance())*40);
    score+=60+round*8+precisionBonus;
    if(score>hi){hi=score;try{localStorage.setItem('antenna_hi',String(hi));}catch(e){}}
    SFX.success();
    flash(I18N.t('ant_locked','Signal locked! Clear reception.'));
    round++;
    setTimeout(()=>{ if(!gameOver) newRound(); },500);
  } else {
    loseLife(I18N.t('ant_miss','Off bearing — signal too weak.'));
  }
}

function loseLife(t){
  lives--;flash(t);
  SFX.fail();
  if(lives<=0){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;try{localStorage.setItem('antenna_hi',String(hi));}catch(e){}}
  } else {
    setTimeout(()=>{ if(!gameOver) newRound(); },500);
  }
}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){ if(e.code==='Space'||e.code==='Enter')reset(); return;}
  if(e.code==='ArrowLeft')keyLeft=true;
  if(e.code==='ArrowRight')keyRight=true;
  if(e.code==='Space'||e.code==='Enter')attemptLock();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')keyLeft=false;
  if(e.code==='ArrowRight')keyRight=false;
});

function pointInRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}
function clientToCanvas(clientX,clientY){
  const r=c.getBoundingClientRect();
  return {x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}

c.addEventListener('mousedown',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const p=clientToCanvas(e.clientX,e.clientY);
  if(pointInRect(p.x,p.y,LOCK_BTN)){attemptLock();return;}
  dragging=true;
  lastDragAngle=Math.atan2(p.y-CY,p.x-CX);
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const p=clientToCanvas(e.clientX,e.clientY);
  const ang=Math.atan2(p.y-CY,p.x-CX);
  let delta=(ang-lastDragAngle)*180/Math.PI;
  bearing=(bearing+delta+360)%360;
  lastDragAngle=ang;
});
window.addEventListener('mouseup',()=>{dragging=false;});

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const t=e.touches[0];
  const p=clientToCanvas(t.clientX,t.clientY);
  if(pointInRect(p.x,p.y,LOCK_BTN)){attemptLock();return;}
  dragging=true;
  lastDragAngle=Math.atan2(p.y-CY,p.x-CX);
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const t=e.touches[0];
  const p=clientToCanvas(t.clientX,t.clientY);
  const ang=Math.atan2(p.y-CY,p.x-CX);
  let delta=(ang-lastDragAngle)*180/Math.PI;
  bearing=(bearing+delta+360)%360;
  lastDragAngle=ang;
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;},{passive:false});

function update(dt){
  if(keyLeft)bearing=(bearing-1.6*dt+360)%360;
  if(keyRight)bearing=(bearing+1.6*dt)%360;
  timer-=dt;
  if(timer<=0){
    loseLife(I18N.t('ant_timeout','Time ran out on this bearing.'));
    timer=timeLimit;
  }
  if(msgTimer>0)msgTimer-=dt;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#071022');sky.addColorStop(1,'#132238');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#9ee6a8';ctx.font='bold 18px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('ant_round_label','Round '+round),20,28);

  // compass dial
  ctx.save();
  ctx.strokeStyle='#2e4a6b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(CX,CY,RADIUS,0,Math.PI*2);ctx.stroke();
  for(let a=0;a<360;a+=30){
    const rad=a*Math.PI/180;
    const x1=CX+Math.cos(rad)*(RADIUS-8),y1=CY+Math.sin(rad)*(RADIUS-8);
    const x2=CX+Math.cos(rad)*RADIUS,y2=CY+Math.sin(rad)*RADIUS;
    ctx.strokeStyle='#44607f';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  // tower (target) marker
  const trad=target*Math.PI/180;
  const tx=CX+Math.cos(trad)*(RADIUS+22),ty=CY+Math.sin(trad)*(RADIUS+22);
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.moveTo(tx,ty-10);ctx.lineTo(tx-8,ty+8);ctx.lineTo(tx+8,ty+8);ctx.fill();

  // antenna needle
  const brad=bearing*Math.PI/180;
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(brad)*RADIUS,CY+Math.sin(brad)*RADIUS);ctx.stroke();
  ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(CX,CY,8,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // signal meter
  const sig=signalStrength();
  const meterX=W/2-150,meterY=310,meterW=300,meterH=20;
  ctx.fillStyle='#1a2740';ctx.fillRect(meterX,meterY,meterW,meterH);
  const grad=ctx.createLinearGradient(meterX,0,meterX+meterW,0);
  grad.addColorStop(0,'#e94560');grad.addColorStop(0.6,'#ffd54f');grad.addColorStop(1,'#7ec850');
  ctx.fillStyle=grad;
  ctx.fillRect(meterX,meterY,meterW*sig,meterH);
  ctx.strokeStyle='#556';ctx.strokeRect(meterX,meterY,meterW,meterH);
  ctx.fillStyle='#cfe8ff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('ant_signal_label','SIGNAL'),W/2,meterY-6);

  // timer bar
  const tbX=W/2-150,tbY=340,tbW=300,tbH=10;
  ctx.fillStyle='#1a2740';ctx.fillRect(tbX,tbY,tbW,tbH);
  ctx.fillStyle='#7ecfff';ctx.fillRect(tbX,tbY,tbW*Math.max(0,timer/timeLimit),tbH);

  // lock button
  ctx.fillStyle='#e94560';
  ctx.fillRect(LOCK_BTN.x,LOCK_BTN.y,LOCK_BTN.w,LOCK_BTN.h);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('ant_lock_btn','LOCK'),LOCK_BTN.x+LOCK_BTN.w/2,LOCK_BTN.y+LOCK_BTN.h/2+5);

  if(msgTimer>0){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,40,W,26);
    ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText(msg,W/2,58);
  }

  if(!started){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('ant_start_hint','Drag / Arrow keys to rotate — tap to start'),W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap / Click / Space to restart'),W/2,H/2+20);
  }

  document.getElementById('score-display').textContent=
    I18N.t('ant_status_label','Score: {s} | Lives: {l} | Hi: {h} | Round: {r}')
      .replace('{s}',Math.floor(score)).replace('{l}',Math.max(0,lives)).replace('{h}',hi).replace('{r}',round);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  if(started&&!gameOver)update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
