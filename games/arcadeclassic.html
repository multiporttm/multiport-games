<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0b0f24;display:block;border-radius:8px;touch-action:none}
#hud{color:#ffd54f;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Arcade Classic</div>
  <div class="game-frame">
    <div id="hud"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🧱 <b id="level">1</b></span><span>🏆 <b id="hi">0</b></span></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move the paddle with <b>Arrow Keys</b>, <b>A/D</b>, or drag on touch. Bounce the ball to break every brick and clear the level. Catch falling power-ups for a wider paddle or multi-ball. Don't let the ball fall!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
let hi=parseInt(localStorage.getItem('arcadeclassic_best')||'0',10);
document.getElementById('hi').textContent=hi;

const PADDLE_Y=H-30;
let paddle={x:W/2-50,w:100,h:14,speed:8};
let balls=[];
let bricks=[];
let powerups=[];
let score=0,lives=3,level=1,gameOver=false,started=false;
const keys={};
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(['arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k===' '){ if(!started){started=true;} else if(gameOver){resetGame();} else launchBalls(); }
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerXToPaddle(clientX){
  const rect=c.getBoundingClientRect();
  const scale=W/rect.width;
  const x=(clientX-rect.left)*scale;
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
}
c.addEventListener('pointerdown',e=>{
  if(!started){started=true;}
  else if(gameOver){resetGame();return;}
  pointerXToPaddle(e.clientX);
  launchBalls();
});
c.addEventListener('pointermove',e=>{ if(e.buttons>0 || e.pointerType==='touch') pointerXToPaddle(e.clientX); });
let dragging=false;
c.addEventListener('pointerdown',()=>dragging=true);
window.addEventListener('pointerup',()=>dragging=false);
c.addEventListener('pointermove',e=>{ if(dragging) pointerXToPaddle(e.clientX); });

function makeBrickLayout(lvl){
  const rows=Math.min(4+Math.floor(lvl/2),8);
  const cols=10;
  const bw=W/cols,bh=22;
  const list=[];
  const colors=['#e94560','#ff9a5a','#ffd54f','#7ec850','#4fc3f7','#7c4dff','#ff6bd6','#a3d977'];
  for(let r=0;r<rows;r++){
    for(let col=0;col<cols;col++){
      if(lvl>1 && Math.random()<0.08)continue; // occasional gaps at higher levels
      const hp=1+(r<Math.floor(rows/3)?1:0)+(lvl>3&&r===0?1:0);
      list.push({x:col*bw+2,y:r*bh+40,w:bw-4,h:bh-4,hp,maxHp:hp,color:colors[r%colors.length],alive:true});
    }
  }
  return list;
}

function newBall(vx,vy){
  return {x:W/2,y:PADDLE_Y-10,vx:vx!=null?vx:(Math.random()<0.5?-1:1)*3.2,vy:vy!=null?vy:-4.2,r:7,stuck:!vx&&!vy};
}

function resetLevel(keepScore){
  bricks=makeBrickLayout(level);
  balls=[newBall(0,0)];
  balls[0].stuck=true;
  powerups=[];
  paddle.w=100;paddle.x=W/2-50;
}

function resetGame(){
  score=0;lives=3;level=1;gameOver=false;started=false;
  resetLevel();
}

function launchBalls(){
  balls.forEach(b=>{
    if(b.stuck){
      b.stuck=false;
      b.vx=(Math.random()<0.5?-1:1)*3.2;
      b.vy=-4.4;
      SFX.swoosh();
    }
  });
}

function spawnPowerup(x,y){
  if(Math.random()<0.22){
    const type=Math.random()<0.5?'wide':'multi';
    powerups.push({x,y,w:26,h:16,vy:2.2,type});
  }
}

function update(dt){
  if(!started||gameOver)return;
  let mv=0;
  if(keys['arrowleft']||keys['a'])mv=-1;
  if(keys['arrowright']||keys['d'])mv=1;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+mv*paddle.speed*dt));

  balls.forEach(b=>{
    if(b.stuck){ b.x=paddle.x+paddle.w/2; b.y=PADDLE_Y-10; return; }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-b.r<0){b.x=b.r;b.vx*=-1;SFX.tick();}
    if(b.x+b.r>W){b.x=W-b.r;b.vx*=-1;SFX.tick();}
    if(b.y-b.r<0){b.y=b.r;b.vy*=-1;SFX.tick();}
    // paddle collision
    if(b.vy>0 && b.y+b.r>=PADDLE_Y && b.y+b.r<=PADDLE_Y+paddle.h+8 && b.x>=paddle.x-b.r && b.x<=paddle.x+paddle.w+b.r){
      const hitPos=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      b.vx=hitPos*5;
      b.vy=-Math.abs(b.vy);
      b.y=PADDLE_Y-b.r;
      SFX.hit();
    }
    // bricks
    for(const br of bricks){
      if(!br.alive)continue;
      if(b.x+b.r>br.x && b.x-b.r<br.x+br.w && b.y+b.r>br.y && b.y-b.r<br.y+br.h){
        br.hp--;
        if(br.hp<=0){br.alive=false;score+=10*level;spawnPowerup(br.x+br.w/2,br.y);SFX.coin();}
        else SFX.hit();
        // reflect based on side
        const overlapX=Math.min(b.x+b.r-br.x,br.x+br.w-(b.x-b.r));
        const overlapY=Math.min(b.y+b.r-br.y,br.y+br.h-(b.y-b.r));
        if(overlapX<overlapY)b.vx*=-1; else b.vy*=-1;
        break;
      }
    }
  });
  balls=balls.filter(b=>b.y-b.r<H+20);
  if(balls.length===0){
    lives--;SFX.hurt();
    if(lives<=0){
      gameOver=true;SFX.lose();
      if(score>hi){hi=score;localStorage.setItem('arcadeclassic_best',hi);}
    } else {
      balls=[newBall(0,0)];balls[0].stuck=true;
    }
  }

  powerups.forEach(p=>{p.y+=p.vy*dt;});
  powerups=powerups.filter(p=>{
    if(p.y>H)return false;
    if(p.y+p.h>=PADDLE_Y && p.x+p.w>paddle.x && p.x<paddle.x+paddle.w){
      if(p.type==='wide'){paddle.w=Math.min(200,paddle.w+40);}
      else if(p.type==='multi'){
        const extra=[];
        balls.forEach(b=>{ if(!b.stuck) extra.push({x:b.x,y:b.y,vx:-b.vx||3,vy:b.vy,r:7,stuck:false}); });
        balls.push(...extra.slice(0,2));
      }
      SFX.powerup();
      return false;
    }
    return true;
  });

  if(bricks.every(br=>!br.alive)){
    level++;SFX.levelup();resetLevel();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b0f24');bg.addColorStop(1,'#191c3a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  bricks.forEach(br=>{
    if(!br.alive)return;
    ctx.fillStyle=br.color;
    ctx.globalAlpha=br.hp<br.maxHp?0.6:1;
    ctx.fillRect(br.x,br.y,br.w,br.h);
    ctx.globalAlpha=1;
  });

  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(paddle.x,PADDLE_Y,paddle.w,paddle.h);

  balls.forEach(b=>{
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  });

  powerups.forEach(p=>{
    ctx.fillStyle=p.type==='wide'?'#7ec850':'#ff6bd6';
    ctx.fillRect(p.x-p.w/2,p.y,p.w,p.h);
    ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';
    ctx.fillText(p.type==='wide'?'W':'M',p.x,p.y+11);
  });

  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent=lives;
  document.getElementById('level').textContent=level;
  document.getElementById('hi').textContent=hi;

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Space to start'),W/2,H/2);
  } else if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+22);
  } else if(balls.some(b=>b.stuck)){
    ctx.fillStyle='#ffffffaa';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('launch_hint','Tap or Space to launch'),W/2,H/2-60);
  }
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?1:Math.min((t-lastTime)/16.6667,3);
  lastTime=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script></body></html>
