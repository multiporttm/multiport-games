<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0d1b2e}
#ui{color:#90caf9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#ctrls{display:flex;gap:10px;justify-content:center;padding:8px}
#ctrls button{width:60px;height:50px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ctrls button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Sky Tower</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0m | Best: 0m</div>
    <canvas id="c" width="340" height="480"></canvas>
    <div id="ctrls">
      <button id="left-btn">⬅️</button>
      <button id="jump-btn">⬆️</button>
      <button id="right-btn">➡️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / A D to move, <b>Space</b> or the ⬆️ button to jump. Climb from platform to platform — fall off the bottom of the screen and it's game over!</div>
</div>
<script>
const W=340,H=480;
let player,platforms,camY,best=+(localStorage.getItem('skytower_best')||0),state,keys={},topY;

function loadBest(){return +(localStorage.getItem('skytower_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('skytower_best',v);}

function init(){
  player={x:W/2,y:H-60,vy:0,vx:0,onGround:true};
  platforms=[{x:W/2-40,y:H-30,w:80}];
  topY=H-30;
  for(let i=0;i<12;i++)addPlatform();
  camY=0;
  state='play';
  best=loadBest();
}

function addPlatform(){
  topY-=55+Math.random()*30;
  const w=50+Math.random()*30;
  const x=20+Math.random()*(W-40-w);
  platforms.push({x,y:topY,w});
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==='Space'){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function jump(){
  if(state!=='play'){init();return;}
  if(player.onGround){player.vy=-11;player.onGround=false;}
}
document.getElementById('jump-btn').addEventListener('click',jump);
function heldBtn(id,key){
  const btn=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;};
  const off=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',on,{passive:false});
  btn.addEventListener('touchend',off,{passive:false});
  btn.addEventListener('mousedown',on);
  btn.addEventListener('mouseup',off);
  btn.addEventListener('mouseleave',off);
}
heldBtn('left-btn','a');
heldBtn('right-btn','d');

const c=document.getElementById('c'),ctx=c.getContext('2d');

function update(){
  if(state!=='play')return;
  if(keys['a']||keys['arrowleft'])player.x-=3.2;
  if(keys['d']||keys['arrowright'])player.x+=3.2;
  player.x=Math.max(12,Math.min(W-12,player.x));

  player.vy+=0.5;
  player.y+=player.vy;

  player.onGround=false;
  for(const p of platforms){
    if(player.vy>0&&player.x>p.x-10&&player.x<p.x+p.w+10&&player.y+14>=p.y&&player.y+14<=p.y+16){
      player.y=p.y-14;player.vy=0;player.onGround=true;
    }
  }

  const targetCamY=player.y-H*0.6;
  if(targetCamY<camY)camY=targetCamY;

  const height=Math.max(0,Math.floor((H-60-(player.y))/10));
  document.getElementById('ui').textContent=`Height: ${height}m | Best: ${Math.max(best,height)}m`;

  while(platforms[platforms.length-1].y>camY-100){
    topY=platforms[platforms.length-1].y;
    addPlatform();
  }

  if(player.y-camY>H+40){
    state='over';
    saveBest(height);best=loadBest();
  }
}

function draw(){
  ctx.fillStyle='#0d1b2e';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(144,202,249,.06)';
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  platforms.forEach(p=>{
    const py=p.y-camY;
    if(py<-20||py>H+20)return;
    ctx.fillStyle='#42a5f5';
    ctx.fillRect(p.x,py,p.w,10);
    ctx.fillStyle='#90caf9';
    ctx.fillRect(p.x,py,p.w,3);
  });

  ctx.fillStyle='#ff8a65';
  ctx.beginPath();ctx.arc(player.x,player.y-camY,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(player.x-6,player.y-camY-4,4,4);
  ctx.fillRect(player.x+2,player.y-camY-4,4,4);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#90caf9';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText('FELL!',W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText('Tap Jump to climb again',W/2,H/2+16);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
init();loop();
</script></body></html>
