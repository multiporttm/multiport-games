<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1a28;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e8d9a0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px;font-family:Georgia,serif}
#touch-row{display:flex;justify-content:center;gap:14px;margin-top:8px}
#touch-row button{padding:10px 26px;background:#3a3a50;border:1px solid #5a5a78;border-radius:10px;color:#e8d9a0;font-weight:700;font-size:1rem;cursor:pointer}
#touch-row button:active{background:#55557a}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Noir City Run</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="280"></canvas>
    <div id="touch-row">
      <button id="jumpBtn">⬆ Jump</button>
      <button id="slideBtn">⬇ Slide</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> / <b>Up Arrow</b> / <b>Tap Jump</b> to leap gaps, and <b>Down Arrow</b> / swipe down / <b>Tap Slide</b> to duck under pipes. The chase gets faster the longer you survive — catch the suspect's trail!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280,ground=200;
let dist=0,hi=parseInt(localStorage.getItem('noircityrun_hi')||'0',10),spd=5.5,frame=0,gameOver=false,started=false;
const det={x:80,y:ground,w:34,h:50,vy:0,jumps:0,sliding:false,slideTimer:0};
let obs=[],gaps=[],rain=[];
let lastTime=null,obsTimer=0,gapTimer=0;
for(let i=0;i<80;i++)rain.push({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*10,s:4+Math.random()*4});

function reset(){
  dist=0;spd=5.5;frame=0;gameOver=false;started=false;obs=[];gaps=[];
  det.y=ground;det.vy=0;det.jumps=0;det.sliding=false;det.slideTimer=0;
  lastTime=null;obsTimer=0;gapTimer=0;
}

function jump(){
  if(!started)started=true;
  if(gameOver){reset();return;}
  if(det.sliding)return;
  if(det.jumps<2){det.vy=-13.5+det.jumps*2;det.jumps++;SFX.jump();}
}
function slide(){
  if(!started)started=true;
  if(gameOver){reset();return;}
  if(det.jumps>0)return;
  det.sliding=true;det.slideTimer=28;SFX.swoosh();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='ArrowDown'){e.preventDefault();slide();}
});
document.getElementById('jumpBtn').addEventListener('click',jump);
document.getElementById('slideBtn').addEventListener('click',slide);
let touchStartY=null;
c.addEventListener('touchstart',e=>{e.preventDefault();touchStartY=e.touches[0].clientY;},{passive:false});
c.addEventListener('touchend',e=>{
  e.preventDefault();
  if(touchStartY==null){jump();return;}
  const dy=(e.changedTouches[0].clientY-touchStartY);
  if(dy>35)slide(); else jump();
  touchStartY=null;
},{passive:false});
c.addEventListener('click',jump);

function spawnObs(){
  const h=28+Math.random()*34;
  obs.push({x:W+20,w:22,h,y:ground+det.h-h,type:'pipe'});
}
function spawnGap(){
  const w=70+Math.random()*50;
  gaps.push({x:W+20,w});
}

function drawDet(){
  ctx.save();
  const baseH=det.sliding?26:det.h;
  const y=det.sliding?det.y+det.h-baseH:det.y;
  // coat
  ctx.fillStyle='#3a3a4e';
  ctx.fillRect(det.x,y,det.w,baseH);
  // hat
  if(!det.sliding){
    ctx.fillStyle='#22222e';
    ctx.fillRect(det.x-2,y-10,det.w+4,8);
    ctx.fillRect(det.x+4,y-16,det.w-8,8);
  }
  // legs run cycle
  if(!det.sliding){
    const legOff=Math.floor(frame/5)%2===0?0:8;
    ctx.fillStyle='#22222e';
    ctx.fillRect(det.x+5,y+baseH,9,10+legOff);
    ctx.fillRect(det.x+det.w-14,y+baseH,9,10+(8-legOff));
  }
  ctx.restore();
}

function drawObs(o){
  ctx.fillStyle='#5a5a66';
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.fillStyle='#7a7a88';
  ctx.fillRect(o.x,o.y,o.w,6);
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function drawRooftop(){
  const sky=ctx.createLinearGradient(0,0,0,ground);
  sky.addColorStop(0,'#0c0c1e');sky.addColorStop(1,'#27273f');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,ground+70);
  // distant skyline silhouettes
  ctx.fillStyle='#1a1a2e';
  for(let i=0;i<10;i++){
    const bw=40+((i*53)%60), bx=((i*110)-((frame*0.3)%110))%(W+120)-60;
    ctx.fillRect(bx,ground-50-((i*37)%70),bw,200);
  }
  // rooftop surface
  ctx.fillStyle='#44445c';ctx.fillRect(0,ground+det.h,W,70);
  ctx.fillStyle='#33334a';ctx.fillRect(0,ground+det.h,W,4);
  // rain
  ctx.strokeStyle='rgba(180,200,255,0.35)';ctx.lineWidth=1;
  rain.forEach(r=>{
    ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.l);ctx.stroke();
  });
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawRooftop();

  if(gameOver){
    ctx.fillStyle='#e8d9a0';ctx.font='bold 34px Georgia';ctx.textAlign='center';
    ctx.fillText(I18N.t('nr_lost_title','THE TRAIL IS LOST'),W/2,118);
    ctx.font='18px Georgia';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,152);
    updateScore();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#e8d9a099';ctx.font='bold 22px Georgia';ctx.textAlign='center';
    ctx.fillText(I18N.t('nr_start_hint','Press Space / Tap to start the chase'),W/2,118);
    drawDet();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  frame+=dt;
  dist+=dt*0.3;
  if(dist>hi){hi=dist;}
  spd=5.5+dist/60;

  rain.forEach(r=>{r.y+=r.s*dt;r.x-=1*dt;if(r.y>H){r.y=-10;r.x=Math.random()*W;}});

  obsTimer+=dt;
  const obsInterval=Math.max(48,100-dist/2);
  if(obsTimer>=obsInterval){obsTimer-=obsInterval;spawnObs();}
  gapTimer+=dt;
  const gapInterval=Math.max(90,170-dist/1.5);
  if(dist>20&&gapTimer>=gapInterval){gapTimer-=gapInterval;spawnGap();}

  // slide timer
  if(det.sliding){det.slideTimer-=dt;if(det.slideTimer<=0)det.sliding=false;}

  // physics
  det.vy+=0.68*dt;
  det.y+=det.vy*dt;
  if(det.y>=ground){det.y=ground;det.vy=0;det.jumps=0;}

  const hitH=det.sliding?26:det.h+16;
  const hitY=det.sliding?det.y+det.h-26:det.y-16;
  const detHit={x:det.x+4,y:hitY,w:det.w,h:hitH};

  obs=obs.filter(o=>o.x>-30);
  obs.forEach(o=>{o.x-=spd*dt;drawObs(o);
    if(rect(detHit,{x:o.x,y:o.y,w:o.w,h:o.h})&&!gameOver){gameOver=true;SFX.lose();}
  });

  gaps=gaps.filter(g=>g.x>-120);
  gaps.forEach(g=>{
    g.x-=spd*dt;
    ctx.fillStyle='#0c0c1e';ctx.fillRect(g.x,ground+det.h,g.w,70);
    const detBottom=det.y+(det.sliding?26:det.h);
    const overGap=det.x+det.w>g.x+6&&det.x<g.x+g.w-6;
    if(overGap&&detBottom>=ground+det.h-4&&det.vy>=0&&!gameOver){gameOver=true;SFX.lose();}
  });

  drawDet();
  updateScore();
  requestAnimationFrame(loop);
}
function updateScore(){
  localStorage.setItem('noircityrun_hi',Math.floor(hi));
  document.getElementById('score-display').textContent=
    I18N.t('nr_score_label','Distance: {s} | Hi: {h}').replace('{s}',Math.floor(dist)).replace('{h}',Math.floor(hi));
}
loop();
</script></body></html>
