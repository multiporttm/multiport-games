<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#263238;cursor:pointer}
#ui{color:#90caf9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Robot Repair</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Robots fixed: 0 | Best: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Watch the colored wires flash in sequence, then tap them back in the same order to complete the repair. Each robot fixed adds one more wire to memorize — how many can you handle?</div>
</div>
<script>
const W=360,H=360;
const WIRE_COLORS=['#ef5350','#42a5f5','#66bb6a','#ffca28','#ab47bc'];
let wires,sequence,showIdx,playerIdx,fixed,state,flashT,flashCell;

function loadBest(){return +(localStorage.getItem('robotrepair_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('robotrepair_best',v);}

function init(){fixed=0;state='play';newRobot();}
function newRobot(){
  const n=Math.min(WIRE_COLORS.length,3+fixed);
  wires=[];
  for(let i=0;i<n;i++)wires.push({angle:(i/n)*Math.PI*2,color:WIRE_COLORS[i]});
  sequence=[...Array(n).keys()].sort(()=>Math.random()-0.5);
  showIdx=0;playerIdx=0;flashCell=-1;flashT=30;state='show';
}

const CX=W/2,CY=170,R=100;
function wirePos(w){return {x:CX+Math.cos(w.angle)*R,y:CY+Math.sin(w.angle)*R};}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  const idx=wires.findIndex(w=>{const p=wirePos(w);return Math.hypot(p.x-x,p.y-y)<22;});
  if(idx===-1)return;
  flashCell=idx;flashT=8;
  if(idx===sequence[playerIdx]){
    SFX.tick();
    playerIdx++;
    if(playerIdx>=sequence.length){
      fixed++;
      SFX.success();
      saveBest(fixed);
      setTimeout(newRobot,700);
      state='wait';
    }
  }else{
    state='over';
    SFX.lose();
    saveBest(fixed);
  }
});

function update(){
  if(state==='show'){
    flashT--;
    if(flashT<=0){
      if(flashCell>=0){flashCell=-1;flashT=10;}
      else if(showIdx<sequence.length){
        flashCell=sequence[showIdx];showIdx++;flashT=22;
        SFX.tick();
      }else{
        state='play';
      }
    }
  }
}

function draw(){
  ctx.fillStyle='#263238';ctx.fillRect(0,0,W,H);

  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🤖',CX,CY);

  wires.forEach((w,i)=>{
    const p=wirePos(w);
    ctx.strokeStyle=i===flashCell?'#fff':w.color;
    ctx.lineWidth=i===flashCell?6:4;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.fillStyle=w.color;
    ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.fill();
    if(i===flashCell){
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);ctx.stroke();
    }
  });

  ctx.fillStyle='#90caf9';ctx.font='14px Arial';
  ctx.fillText(state==='show'?'Watch the sequence...':state==='play'?'Repeat it back!':'',W/2,H-20);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#90caf9';ctx.font='bold 26px Arial';
    ctx.fillText('SHORT CIRCUIT!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Robots fixed: ${fixed} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){}
init();draw();
setInterval(()=>{document.getElementById('ui').textContent=`Robots fixed: ${fixed} | Best: ${loadBest()}`;},200);
</script></body></html>
