<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a0f14;display:block;border-radius:8px;margin:0 auto;touch-action:manipulation}
#hud{color:#ffd54f;font-size:1.1rem;font-weight:800;text-align:center;padding:8px}
#callbtn{display:block;margin:12px auto;padding:14px 34px;border:none;border-radius:14px;background:#e94560;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer}
#callbtn:active{transform:scale(.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Curtain Call Timing</div>
  <div class="game-frame">
    <div id="hud">Round: 0 | Score: 0 | Hi: 0 | Lives: 3</div>
    <canvas id="c" width="420" height="320"></canvas>
    <button id="callbtn">CALL CURTAIN</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">The curtain bar sweeps up and down the track. Press <b>Space</b>, click, or tap <b>CALL CURTAIN</b> the instant the bar lands inside the glowing <b>mark</b>. Each round the mark shrinks and the sweep gets faster — miss three times and the show stops.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const hudEl=document.getElementById('hud');
const HS_KEY='hs_curtaincalltiming';
const TRACK_TOP=30,TRACK_BOT=290;

let round=0,score=0,hi=parseInt(localStorage.getItem(HS_KEY)||'0',10),lives=3;
let pos=0,dir=1,speed=0.012,zoneLo=0.4,zoneHi=0.6,gameOver=false,started=false;
let flashTimer=0,flashOk=false,resultTimer=0;

function newRound(){
  round++;
  const size=Math.max(0.07,0.26-round*0.014);
  const center=0.15+Math.random()*0.7;
  zoneLo=Math.max(0.02,center-size/2);
  zoneHi=Math.min(0.98,center+size/2);
  speed=0.011+round*0.0016;
  pos=0;dir=1;
}

function reset(){
  round=0;score=0;lives=3;gameOver=false;started=false;flashTimer=0;resultTimer=0;
  newRound();
}
reset();

function callCurtain(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(resultTimer>0)return;
  if(pos>=zoneLo&&pos<=zoneHi){
    score+=Math.round(50+ (1-(zoneHi-zoneLo))*100);
    if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(Math.floor(hi)));}
    SFX.success();
    flashOk=true;
  } else {
    lives--;
    SFX.fail();
    flashOk=false;
    if(lives<=0){gameOver=true;SFX.lose();}
  }
  flashTimer=20;resultTimer=26;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();callCurtain();}
});
document.getElementById('callbtn').addEventListener('click',callCurtain);
document.getElementById('callbtn').addEventListener('touchstart',e=>{e.preventDefault();callCurtain();},{passive:false});
c.addEventListener('click',callCurtain);
c.addEventListener('touchstart',e=>{e.preventDefault();callCurtain();},{passive:false});

function updateHud(){
  hudEl.textContent=I18N.t('cc_hud','Round: {r} | Score: {s} | Hi: {h} | Lives: {l}')
    .replace('{r}',round).replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)).replace('{l}',lives);
}

function loop(){
  ctx.clearRect(0,0,420,320);
  ctx.fillStyle='#1a0f14';ctx.fillRect(0,0,420,320);

  // track
  ctx.fillStyle='#2b1a22';ctx.fillRect(190,TRACK_TOP,40,TRACK_BOT-TRACK_TOP);

  // zone
  const zy1=TRACK_TOP+(TRACK_BOT-TRACK_TOP)*zoneLo;
  const zy2=TRACK_TOP+(TRACK_BOT-TRACK_TOP)*zoneHi;
  ctx.fillStyle='rgba(255,213,79,0.55)';
  ctx.fillRect(190,zy1,40,zy2-zy1);
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;
  ctx.strokeRect(190,zy1,40,zy2-zy1);

  // curtain fabric above current pos (closed portion)
  const py=TRACK_TOP+(TRACK_BOT-TRACK_TOP)*pos;
  ctx.fillStyle='#b23a52';
  for(let i=0;i<6;i++){
    ctx.fillStyle=i%2===0?'#c23a55':'#a3304a';
    ctx.fillRect(140+i*23,0,23,py);
  }
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(140,py-3,138,6);

  if(flashTimer>0){
    ctx.fillStyle=flashOk?'rgba(102,187,106,0.3)':'rgba(233,69,96,0.3)';
    ctx.fillRect(0,0,420,320);
    flashTimer--;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),210,150);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press Space to restart'),210,180);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),210,160);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(resultTimer>0){
    resultTimer--;
    if(resultTimer===0)newRound();
  } else {
    pos+=dir*speed;
    if(pos>=1){pos=1;dir=-1;}
    if(pos<=0){pos=0;dir=1;}
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
