<style>
body{background:#08080f}
#c{background:#1d1420;display:block;border-radius:8px;touch-action:none}
#score-display{color:#f08fc0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff8a8a;text-align:center;font-size:1rem;margin-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Macrame Bracelet Braiding</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">As each cord reaches the hit line, press the matching side (<b>Left</b> for an under-cross, <b>Right</b> for an over-cross, or tap the matching half of the screen) to braid it into the pattern. Patterns grow longer and faster each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score-display'),livesEl=document.getElementById('lives-display');
const W=800,H=420,HITY=320;
const COLORS=['#e94560','#4fc3f7','#ffd54f','#7ec850','#b388ff'];

let state='start';
let score=0,hi=parseInt(localStorage.getItem('macramebraceletbraiding_hi')||'0',10);
let lives=3,round=1;
const WIN_ROUND=8;

let pattern=[]; // array of 0 (under/left) or 1 (over/right)
let notes=[]; // {idx, y, type, color, hit:false, judged:false}
let speed=2.2;
let spawnGap=70;
let nextSpawn=0;
let completed=[]; // braided colors for the finished strip
let patternIdx=0;
let combo=0,bestCombo=0;
let flashMsg='',flashTimer=0,flashColor='#fff';
let shakeT=0;

function setupRound(){
  const len=Math.min(16,5+round);
  pattern=[];
  for(let i=0;i<len;i++)pattern.push(Math.random()<0.5?0:1);
  notes=[];
  completed=[];
  patternIdx=0;
  speed=2.2+round*0.25;
  spawnGap=Math.max(32,68-round*4);
  nextSpawn=0;
  combo=0;
  state='play';
}

function startGame(){
  score=0;lives=3;round=1;bestCombo=0;
  setupRound();
}

function spawnNote(){
  if(patternIdx+notes.length>=pattern.length)return;
  const t=pattern[patternIdx+notes.length];
  notes.push({y:-20,type:t,color:COLORS[(patternIdx+notes.length)%COLORS.length],judged:false});
}

function flashText(t,color){flashMsg=t;flashColor=color;flashTimer=40;}

function judge(side){
  // side: 0=left/under, 1=right/over. Find lowest unjudged note near hit line.
  if(state!=='play')return;
  let best=null,bd=1e9;
  notes.forEach(n=>{
    if(n.judged)return;
    const d=Math.abs(n.y-HITY);
    if(d<bd){bd=d;best=n;}
  });
  if(!best){ mistake(); return; }
  if(best.type!==side){
    best.judged=true;
    mistake();
    return;
  }
  best.judged=true;
  let gain;
  if(bd<14){gain=30;flashText(I18N.t('perfect','PERFECT!'),'#ffd54f');}
  else if(bd<32){gain=18;flashText(I18N.t('good','Good'),'#7ec850');}
  else {gain=8;flashText(I18N.t('ok','OK'),'#4fc3f7');}
  combo++;
  bestCombo=Math.max(bestCombo,combo);
  score+=gain+combo;
  if(score>hi){hi=score;localStorage.setItem('macramebraceletbraiding_hi',String(hi));}
  SFX.point();
  completed.push(best.color);
  patternIdx++;
  if(patternIdx>=pattern.length){
    SFX.levelup();
    state='roundclear';
    setTimeout(()=>{
      if(round>=WIN_ROUND){state='win';SFX.win();}
      else{round++;setupRound();}
    },1000);
  }
}

function mistake(){
  combo=0;
  lives--;
  SFX.hurt();
  shakeT=14;
  if(lives<=0){
    state='gameover';
    SFX.lose();
  }
}

document.addEventListener('keydown',e=>{
  if(state==='start'||state==='gameover'||state==='win'){
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();}
    return;
  }
  if(e.code==='ArrowLeft'){e.preventDefault();judge(0);}
  else if(e.code==='ArrowRight'){e.preventDefault();judge(1);}
});

c.addEventListener('pointerdown',e=>{
  if(state==='start'||state==='gameover'||state==='win'){startGame();return;}
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  judge(x<W/2?0:1);
});

function drawLanes(){
  ctx.strokeStyle='#352a3d';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,HITY+40);ctx.stroke();
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(40,HITY);ctx.lineTo(W-40,HITY);ctx.stroke();
  ctx.fillStyle='#bdbdbd';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('under_label','UNDER ←'),W/4,HITY+30);
  ctx.fillText(I18N.t('over_label','→ OVER'),3*W/4,HITY+30);
}

function drawNote(n){
  const x=n.type===0?W/4:3*W/4;
  ctx.fillStyle=n.color;
  ctx.beginPath();ctx.arc(x,n.y,16,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff3';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#1d1420';ctx.font='bold 14px Arial';ctx.textAlign='center';
  ctx.fillText(n.type===0?'U':'O',x,n.y+5);
}

function drawCompleted(){
  const startX=40,y=30,s=14;
  for(let i=0;i<completed.length;i++){
    ctx.fillStyle=completed[i];
    ctx.beginPath();ctx.arc(startX+i*(s+4),y,s/1.6,0,Math.PI*2);ctx.fill();
  }
}

function update(dt){
  if(shakeT>0)shakeT-=dt;
  if(flashTimer>0)flashTimer-=dt;
  if(state!=='play')return;
  nextSpawn-=dt;
  if(nextSpawn<=0&&patternIdx+notes.length<pattern.length){
    spawnNote();
    nextSpawn=spawnGap;
  }
  notes.forEach(n=>{ n.y+=speed*dt; });
  // missed notes
  notes.forEach(n=>{
    if(!n.judged&&n.y>HITY+40){
      n.judged=true;
      mistake();
    }
  });
  notes=notes.filter(n=>n.y<H+30);
}

function draw(){
  ctx.save();
  const sx=shakeT>0?(Math.random()-0.5)*shakeT*0.6:0;
  ctx.translate(sx,0);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#241a2c');bg.addColorStop(1,'#1d1420');
  ctx.fillStyle=bg;ctx.fillRect(-20,0,W+40,H);

  drawLanes();
  notes.forEach(drawNote);
  drawCompleted();

  ctx.textAlign='center';
  if(flashTimer>0){
    ctx.globalAlpha=Math.min(1,flashTimer/40);
    ctx.fillStyle=flashColor;ctx.font='bold 22px Arial';
    ctx.fillText(flashMsg,W/2,HITY-50);
    ctx.globalAlpha=1;
  }

  if(state==='start'){
    ctx.fillStyle='#f08fc0';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('bb_title','Friendship Bracelet Braiding'),W/2,150);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or press Space to start'),W/2,190);
  } else if(state==='roundclear'){
    ctx.fillStyle='#ffd54f';ctx.font='bold 24px Arial';
    ctx.fillText(I18N.t('bb_round_clear','Pattern braided! Round {r} complete').replace('{r}',round),W/2,150);
  } else if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,160);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,194);
  } else if(state==='win'){
    ctx.fillStyle='#7ec850';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('bb_win','Bracelet finished — beautiful work!'),W/2,160);
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,194);
  } else if(state==='play'){
    ctx.fillStyle='#fff9';ctx.font='14px Arial';
    ctx.fillText(I18N.t('bb_combo','Combo: {c}').replace('{c}',combo),W/2,60);
  }
  ctx.restore();
}

let last=null;
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/16.6667,3);
  last=ts;
  update(dt);
  draw();
  scoreEl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesEl.textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
  requestAnimationFrame(loop);
}
draw();
requestAnimationFrame(loop);
</script></body></html>
