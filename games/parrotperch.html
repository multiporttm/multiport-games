<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Parrot Perch</title><meta name="description" content="Play Parrot Perch free online — Guide your pirate parrot's flight with the arrow keys or on-screen buttons to fetch the called-out item from the ship deck and return to your shoulder before patience runs out."><link rel="canonical" href="https://games.multiportllc.com/games/parrotperch"><meta property="og:title" content="Parrot Perch - Multiport Games"><meta property="og:description" content="Play Parrot Perch free online — Guide your pirate parrot's flight with the arrow keys or on-screen buttons to fetch the called-out item from the ship deck and return to your shoulder before patience runs out."><meta property="og:url" content="https://games.multiportllc.com/games/parrotperch"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Parrot Perch","description":"Play Parrot Perch free online instantly. Direct your pirate parrot's flight path with the arrow keys, WASD or on-screen directional buttons to fetch the specific item called out (coin, key or letter) from around the ship deck, then return it to your shoulder before the patience timer runs out. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/parrotperch","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#7a5a33;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px;justify-content:center;margin:12px auto}
#pad button{background:#16213e;color:#fff;border:2px solid #e94560;border-radius:10px;font-size:1.3rem;cursor:pointer;touch-action:none;user-select:none}
#pad button:active,#pad button.active{background:#e94560}
#pu{grid-column:2;grid-row:1}
#pl{grid-column:1;grid-row:2}
#pr{grid-column:3;grid-row:2}
#pd{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Parrot Perch</div>
  <div class="game-frame">
    <div id="score-display">Fetches: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="pad">
      <button id="pu">↑</button>
      <button id="pl">←</button>
      <button id="pr">→</button>
      <button id="pd">↓</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> / <b>WASD</b> or the <b>on-screen buttons</b> to steer your parrot's flight. Fetch the called-out item, then fly back to your shoulder before the patience timer runs out. Three misses and training ends!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;
const home={x:60,y:290};
const ITEM_TYPES=[
  {k:'coin',e:'🪙',label:'coin'},
  {k:'key',e:'🔑',label:'key'},
  {k:'letter',e:'✉️',label:'letter'},
  {k:'ring',e:'💍',label:'ring'},
  {k:'bell',e:'🔔',label:'bell'}
];

let parrot={x:home.x,y:home.y,vx:0,vy:0};
const speed=3.4;
let dirs={up:false,down:false,left:false,right:false};
let items=[],target=null,carrying=null;
let score=0,lives=3,patience=0,patienceMax=0;
let gameOver=false,started=false,milestoneShown=false,lastTime=null;
let hi=parseInt(localStorage.getItem('hiscore_parrotperch')||'0',10);
let msg='';

function rand(a,b){return a+Math.random()*(b-a);}

function spawnItems(){
  items=[];
  const count=5+Math.min(3,Math.floor(score/3));
  const pool=ITEM_TYPES.slice();
  for(let i=0;i<count;i++){
    const type=pool[i%pool.length];
    let x,y,tries=0;
    do{x=rand(160,W-60);y=rand(60,H-60);tries++;}while(tries<20&&items.some(it=>Math.hypot(it.x-x,it.y-y)<55));
    items.push({x,y,type,id:i});
  }
  target=items[Math.floor(Math.random()*items.length)].type;
  carrying=null;
  patienceMax=Math.max(7,12-score*0.3);
  patience=patienceMax;
}

function reset(){
  score=0;lives=3;gameOver=false;started=false;milestoneShown=false;lastTime=null;
  parrot.x=home.x;parrot.y=home.y;parrot.vx=0;parrot.vy=0;
  spawnItems();
}
reset();

function setDir(name,val){
  dirs[name]=val;
  const btn=document.getElementById({up:'pu',down:'pd',left:'pl',right:'pr'}[name]);
  if(btn)btn.classList.toggle('active',val);
}

window.addEventListener('keydown',e=>{
  if(!started)started=true;
  if(gameOver){if(e.code==='Space'){reset();}return;}
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){setDir('up',true);e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){setDir('down',true);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){setDir('left',true);e.preventDefault();}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){setDir('right',true);e.preventDefault();}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')setDir('up',false);
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')setDir('down',false);
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')setDir('left',false);
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')setDir('right',false);
});

function bindBtn(id,name){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(!started)started=true;if(gameOver){reset();return;}setDir(name,true);};
  const off=e=>{e.preventDefault();setDir(name,false);};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
}
bindBtn('pu','up');bindBtn('pd','down');bindBtn('pl','left');bindBtn('pr','right');

c.addEventListener('click',()=>{if(!started)started=true;if(gameOver)reset();});

function missRound(){
  lives--;SFX.fail();
  if(lives<=0){gameOver=true;SFX.lose();}
  else{spawnItems();}
}

function drawDeck(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8a6a3a');g.addColorStop(1,'#6b5028');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#5a4322';ctx.lineWidth=2;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
}

function fmtScore(){
  document.getElementById('score-display').textContent=
    I18N.t('score_label','Fetches: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
}

function loop(){
  drawDeck();

  // home perch
  ctx.fillStyle='#3a2a1a';ctx.fillRect(home.x-28,home.y-10,56,20);
  ctx.font='26px Arial';ctx.textAlign='center';ctx.fillText('🏴‍☠️',home.x,home.y+14);

  items.forEach(it=>{
    ctx.font='30px Arial';ctx.fillText(it.type.e,it.x,it.y+10);
  });

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','TRAINING OVER'),400,150);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,185);
    fmtScore();
    requestAnimationFrame(loop);return;
  }

  if(!started){
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Use arrows / tap buttons to begin'),400,150);
    ctx.font='26px Arial';ctx.fillText('🦜',parrot.x,parrot.y+8);
    fmtScore();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  let vx=0,vy=0;
  if(dirs.up)vy-=1; if(dirs.down)vy+=1;
  if(dirs.left)vx-=1; if(dirs.right)vx+=1;
  const len=Math.hypot(vx,vy);
  if(len>0){vx/=len;vy/=len;}
  parrot.x+=vx*speed*dt;parrot.y+=vy*speed*dt;
  parrot.x=Math.max(20,Math.min(W-20,parrot.x));
  parrot.y=Math.max(20,Math.min(H-20,parrot.y));

  if(!carrying){
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(Math.hypot(it.x-parrot.x,it.y-parrot.y)<26){
        if(it.type.k===target.k){
          carrying=it.type;
          items.splice(i,1);
          SFX.coin();
          msg=I18N.t('return_hint','Got it! Fly home!');
        }
        break;
      }
    }
  }else{
    if(Math.hypot(home.x-parrot.x,home.y-parrot.y)<30){
      score++;SFX.success();
      if(score>hi){hi=score;localStorage.setItem('hiscore_parrotperch',hi);}
      if(score>=10&&!milestoneShown){milestoneShown=true;SFX.levelup();}
      spawnItems();
    }
  }

  patience-=dt/60;
  if(patience<=0){
    missRound();
  }

  // draw parrot (carrying indicator)
  ctx.font='28px Arial';ctx.textAlign='center';ctx.fillText('🦜',parrot.x,parrot.y+10);
  if(carrying){ctx.font='18px Arial';ctx.fillText(carrying.e,parrot.x,parrot.y-18);}

  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 16px Arial';
  const targetLabel=I18N.t('target_'+target.k,target.label);
  ctx.fillText(I18N.t('fetch_label','Fetch: {t} {e}').replace('{t}',targetLabel).replace('{e}',target.e),16,26);
  ctx.fillText(I18N.t('lives_label','Lives: {l}').replace('{l}','❤️'.repeat(Math.max(0,lives))),16,48);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('patience_label','Patience: {p}s').replace('{p}',Math.max(0,Math.ceil(patience))),W-16,26);

  // patience bar
  const barW=200,pct=Math.max(0,patience/patienceMax);
  ctx.fillStyle='#00000055';ctx.fillRect(W-16-barW,34,barW,10);
  ctx.fillStyle=pct>0.3?'#7ec850':'#e94560';
  ctx.fillRect(W-16-barW,34,barW*pct,10);

  if(milestoneShown&&score===10){
    ctx.fillStyle='#ffd54f';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('milestone_text','🏆 Great training!'),400,70);
  }

  fmtScore();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
