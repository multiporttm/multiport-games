<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Farm Tractor Plow</title><meta name="description" content="Play Farm Tractor Plow free online — Use Arrow Keys/WASD or drag to drive your tractor and plow the highlighted target rows before your fuel runs out."><link rel="canonical" href="https://games.multiportllc.com/games/farmtractorplow"><meta property="og:title" content="Farm Tractor Plow - Multiport Games"><meta property="og:description" content="Play Farm Tractor Plow free online — Use Arrow Keys/WASD or drag to drive your tractor and plow the highlighted target rows before your fuel runs out."><meta property="og:url" content="https://games.multiportllc.com/games/farmtractorplow"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Farm Tractor Plow","description":"Play Farm Tractor Plow free online instantly. Use Arrow Keys/WASD or drag to drive your tractor across the field and plow the highlighted target rows before your fuel runs out. Plowing efficiently (few wrong rows) scores more points. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/farmtractorplow","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8d6e3a;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Farm Tractor Plow</div>
  <div class="game-frame">
    <div id="score-display">Fields: 0 | Best Efficiency: —</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys/WASD</b> or <b>touch-drag</b> to drive the tractor. Drive over the <b>highlighted rows</b> to plow the target pattern using as little <b>fuel</b> as possible — avoid plowing extra rows. Finish the pattern before fuel runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const COLS=10,ROWS=8;
const W=800,H=450;
const cellW=W/COLS,cellH=(H-30)/ROWS,topY=30;

let tractor,target,plowed,fuel,maxFuel,fieldsCompleted,bestEff,score,gameOver,fieldWon,started,level;
let keys={};
let dragTarget=null;

function loadStats(){
  fieldsCompleted=parseInt(localStorage.getItem('tractor_fields')||'0');
  bestEff=localStorage.getItem('tractor_best');
  bestEff=bestEff?parseFloat(bestEff):null;
}
function saveStats(){
  localStorage.setItem('tractor_fields',fieldsCompleted);
  if(bestEff!=null)localStorage.setItem('tractor_best',bestEff.toFixed(0));
}

function genTarget(lvl){
  const count=Math.min(3+Math.floor(lvl/2),ROWS-1);
  const rows=new Set();
  while(rows.size<count)rows.add(Math.floor(Math.random()*ROWS));
  return Array.from(rows);
}

function newField(){
  level=(level||0)+1;
  target=genTarget(level);
  plowed=new Array(ROWS).fill(0).map(()=>new Array(COLS).fill(false));
  maxFuel=200+target.length*40;
  fuel=maxFuel;
  tractor={x:W/2,y:H/2,angle:0,speed:0};
  gameOver=false;
  fieldWon=false;
  started=true;
}

function reset(){
  loadStats();
  score=0;
  level=0;
  newField();
}

function cellAt(px,py){
  const col=Math.floor(px/cellW);
  const row=Math.floor((py-topY)/cellH);
  if(row<0||row>=ROWS||col<0||col>=COLS)return null;
  return {row,col};
}

function plowedAllTarget(){
  return target.every(r=>plowed[r].every(v=>v));
}

function wrongPlowedCount(){
  let wrong=0;
  for(let r=0;r<ROWS;r++){
    if(target.includes(r))continue;
    for(let c2=0;c2<COLS;c2++)if(plowed[r][c2])wrong++;
  }
  return wrong;
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'&&(gameOver||fieldWon)){reset();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clientX-rect.left)*(W/rect.width),y:(clientY-rect.top)*(H/rect.height)};
}
c.addEventListener('mousedown',e=>{ if(gameOver||fieldWon){reset();return;} dragTarget=pointerPos(e); });
c.addEventListener('mousemove',e=>{ if(dragTarget)dragTarget=pointerPos(e); });
window.addEventListener('mouseup',()=>{dragTarget=null;});
c.addEventListener('touchstart',e=>{ e.preventDefault(); if(gameOver||fieldWon){reset();return;} dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(dragTarget)dragTarget=pointerPos(e); },{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragTarget=null;},{passive:false});

function drawField(){
  ctx.fillStyle='#8d6e3a';
  ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    const y=topY+r*cellH;
    const isTarget=target.includes(r);
    ctx.fillStyle=isTarget?'rgba(255,213,79,0.18)':'rgba(0,0,0,0.06)';
    ctx.fillRect(0,y,W,cellH);
    for(let cc=0;cc<COLS;cc++){
      const x=cc*cellW;
      if(plowed[r][cc]){
        ctx.fillStyle='#5c4425';
        ctx.fillRect(x+1,y+1,cellW-2,cellH-2);
        ctx.strokeStyle='#3d2e18';
        ctx.lineWidth=1;
        for(let li=0;li<3;li++){
          ctx.beginPath();
          ctx.moveTo(x+2,y+3+li*(cellH-6)/3);
          ctx.lineTo(x+cellW-2,y+3+li*(cellH-6)/3);
          ctx.stroke();
        }
      }
    }
    if(isTarget){
      ctx.strokeStyle='#ffd54f';
      ctx.lineWidth=2;
      ctx.strokeRect(1,y+1,W-2,cellH-2);
    }
  }
}

function drawTractor(){
  ctx.save();
  ctx.translate(tractor.x,tractor.y);
  ctx.rotate(tractor.angle);
  ctx.fillStyle='#2e7d32';
  ctx.fillRect(-14,-10,28,20);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(6,-8,10,16);
  ctx.fillStyle='#212121';
  ctx.beginPath();ctx.arc(-8,-11,5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-8,11,5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(10,-9,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(10,9,4,0,7);ctx.fill();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawField();

  if(!gameOver&&!fieldWon){
    let vx=0,vy=0;
    if(keys['ArrowUp']||keys['KeyW'])vy-=1;
    if(keys['ArrowDown']||keys['KeyS'])vy+=1;
    if(keys['ArrowLeft']||keys['KeyA'])vx-=1;
    if(keys['ArrowRight']||keys['KeyD'])vx+=1;
    if(dragTarget){
      const dx=dragTarget.x-tractor.x,dy=dragTarget.y-tractor.y;
      const dist=Math.hypot(dx,dy);
      if(dist>4){vx=dx/dist;vy=dy/dist;}
    }
    const mag=Math.hypot(vx,vy);
    if(mag>0.01){
      vx/=mag;vy/=mag;
      const spd=3.2;
      tractor.x+=vx*spd;
      tractor.y+=vy*spd;
      tractor.angle=Math.atan2(vy,vx);
      fuel-=0.5;
      if(Math.random()<0.3)SFX.tick();
    }
    tractor.x=Math.max(14,Math.min(W-14,tractor.x));
    tractor.y=Math.max(topY+10,Math.min(H-10,tractor.y));

    const cell=cellAt(tractor.x,tractor.y);
    if(cell&&!plowed[cell.row][cell.col]){
      plowed[cell.row][cell.col]=true;
      SFX.click();
    }

    if(plowedAllTarget()){
      fieldWon=true;
      const wrong=wrongPlowedCount();
      const efficiency=Math.max(0,1000-wrong*40-((maxFuel-fuel)|0));
      score+=Math.max(50,efficiency);
      fieldsCompleted++;
      if(bestEff==null||efficiency>bestEff)bestEff=efficiency;
      saveStats();
      SFX.win();
    } else if(fuel<=0){
      fuel=0;
      gameOver=true;
      const wrong=wrongPlowedCount();
      const doneCount=target.filter(r=>plowed[r].every(v=>v)).length;
      score+=doneCount*30-wrong*10;
      SFX.lose();
    }
  }

  drawTractor();

  // fuel bar
  ctx.fillStyle='#222';
  ctx.fillRect(10,H-16,W-20,8);
  const fuelPct=Math.max(0,fuel/maxFuel);
  ctx.fillStyle=fuelPct>0.3?'#4caf50':'#e53935';
  ctx.fillRect(10,H-16,(W-20)*fuelPct,8);

  if(fieldWon){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tractor_field_done','FIELD PLOWED!'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tractor_next_hint','Space or Tap to plow next field'),W/2,H/2+26);
  } else if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('tractor_out_of_fuel','OUT OF FUEL'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('tractor_restart_hint','Space or Tap to try again'),W/2,H/2+26);
  }

  document.getElementById('score-display').textContent=I18N.t('tractor_score_label','Fields: {f} | Score: {s} | Best Efficiency: {b}').replace('{f}',fieldsCompleted).replace('{s}',Math.floor(score)).replace('{b}',bestEff==null?'—':Math.floor(bestEff));
  requestAnimationFrame(loop);
}

loadStats();
score=0;
level=0;
newField();
loop();
</script></body></html>
