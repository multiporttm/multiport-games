<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8fd3f4;display:block;border-radius:8px;touch-action:none}
#score-display{color:#c2185b;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#e91e63;font-size:1rem;text-align:center;padding-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ladybug Flight</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">♥ ♥ ♥</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys / WASD</b>, or <b>drag</b> with your finger/mouse, to fly the ladybug. Collect pollen and nectar drops for points, avoid sticky spider webs and swooping birds. You have 3 lives — survive and fly as far as you can!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const KEY='ladybugflight_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let score=0,lives=3,distance=0,gameOver=false,started=false,frame=0;
const bug={x:120,y:200,w:34,h:26,vy:0,vx:0};
let items=[],webs=[],birds=[],flowers=[];
let itemTimer=0,webTimer=0,birdTimer=0,invuln=0;
let lastTime=null;
let keys={up:false,down:false,left:false,right:false};
let dragTarget=null;

function reset(){
  score=0;lives=3;distance=0;gameOver=false;started=false;frame=0;
  bug.x=120;bug.y=200;bug.vy=0;bug.vx=0;
  items=[];webs=[];birds=[];flowers=[];
  itemTimer=0;webTimer=0;birdTimer=0;invuln=0;lastTime=null;
  for(let i=0;i<6;i++)flowers.push({x:Math.random()*W,y:H-20-Math.random()*10,hue:Math.floor(Math.random()*360)});
}

function startGame(){ if(!started){started=true;} if(gameOver){reset();started=true;} }

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keys.down=true;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  startGame();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keys.down=false;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};
}
c.addEventListener('pointerdown',e=>{startGame();dragTarget=pointerPos(e);});
c.addEventListener('pointermove',e=>{ if(dragTarget!==null) dragTarget=pointerPos(e); });
window.addEventListener('pointerup',()=>{dragTarget=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();startGame();dragTarget=pointerPos(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragTarget!==null)dragTarget=pointerPos(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragTarget=null;},{passive:false});

function spawnItem(){
  const kind=Math.random()<0.5?'pollen':'nectar';
  items.push({x:W+20,y:40+Math.random()*(H-100),r:kind==='pollen'?8:10,kind,bob:Math.random()*Math.PI*2});
}
function spawnWeb(){
  const y=40+Math.random()*(H-140);
  webs.push({x:W+20,y,w:46,h:46});
}
function spawnBird(){
  const y=30+Math.random()*(H-160);
  birds.push({x:W+40,y,w:44,h:28,phase:Math.random()*Math.PI*2});
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}

function drawBug(){
  ctx.save();
  ctx.translate(bug.x+bug.w/2,bug.y+bug.h/2);
  const tilt=Math.max(-0.3,Math.min(0.3,bug.vy*0.03));
  ctx.rotate(tilt);
  // wings
  const wingFlap=Math.sin(frame*0.6)*6;
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath();ctx.ellipse(-2,-14-wingFlap*0.2,14,7,0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-2,14+wingFlap*0.2,14,7,-0.4,0,Math.PI*2);ctx.fill();
  // body (red shell)
  ctx.fillStyle='#e02424';
  ctx.beginPath();ctx.ellipse(0,0,17,13,0,0,Math.PI*2);ctx.fill();
  // center line
  ctx.strokeStyle='#8a0000';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(0,13);ctx.stroke();
  // spots
  ctx.fillStyle='#1a1a2e';
  [[-8,-5],[-8,5],[8,-5],[8,5],[0,0]].forEach(([dx,dy])=>{
    ctx.beginPath();ctx.arc(dx,dy,3,0,Math.PI*2);ctx.fill();
  });
  // head
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(16,0,6,0,Math.PI*2);ctx.fill();
  // antennae
  ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(19,-4);ctx.lineTo(25,-10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(19,4);ctx.lineTo(25,10);ctx.stroke();
  ctx.restore();
}

function drawItem(it){
  ctx.save();
  const by=it.y+Math.sin(frame*0.1+it.bob)*4;
  if(it.kind==='pollen'){
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(it.x,by,it.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffb300';
    for(let i=0;i<5;i++){
      const ang=i/5*Math.PI*2;
      ctx.beginPath();ctx.arc(it.x+Math.cos(ang)*it.r*1.4,by+Math.sin(ang)*it.r*1.4,3,0,Math.PI*2);ctx.fill();
    }
  }else{
    ctx.fillStyle='#ff8f00';
    ctx.beginPath();ctx.ellipse(it.x,by,it.r*0.7,it.r,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff59d';
    ctx.beginPath();ctx.ellipse(it.x-2,by-3,3,4,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawWeb(w){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.85)';
  ctx.lineWidth=1.4;
  const cx=w.x+w.w/2,cy=w.y+w.h/2,r=w.w/2;
  for(let i=0;i<8;i++){
    const ang=i/8*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r);ctx.stroke();
  }
  for(let ring=1;ring<=3;ring++){
    ctx.beginPath();
    for(let i=0;i<=8;i++){
      const ang=i/8*Math.PI*2;
      const rr=r*ring/3;
      const px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawBird(b){
  ctx.save();
  ctx.fillStyle='#5d4037';
  ctx.beginPath();ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();
  const wf=Math.sin(frame*0.4+b.phase)*10;
  ctx.strokeStyle='#3e2723';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(b.x-6,b.y);ctx.lineTo(b.x-24,b.y-wf);ctx.stroke();
  ctx.beginPath();ctx.moveTo(b.x+6,b.y);ctx.lineTo(b.x+24,b.y-wf);ctx.stroke();
  ctx.fillStyle='#ffb300';
  ctx.beginPath();ctx.moveTo(b.x-b.w/2-2,b.y);ctx.lineTo(b.x-b.w/2-12,b.y-3);ctx.lineTo(b.x-b.w/2-12,b.y+3);ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.arc(b.x-b.w/4,b.y-3,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawFlowers(){
  flowers.forEach(f=>{
    ctx.save();
    ctx.strokeStyle='#2e7d32';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(f.x,H);ctx.lineTo(f.x,f.y);ctx.stroke();
    ctx.fillStyle=`hsl(${f.hue},80%,65%)`;
    for(let i=0;i<5;i++){
      const ang=i/5*Math.PI*2;
      ctx.beginPath();ctx.ellipse(f.x+Math.cos(ang)*7,f.y+Math.sin(ang)*7,5,4,ang,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#fff59d';
    ctx.beginPath();ctx.arc(f.x,f.y,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function updateHUD(){
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=Array(3).fill(0).map((_,i)=>i<lives?'♥':'♡').join(' ');
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#7ec8f7');sky.addColorStop(1,'#c8f0c0');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<3;i++){
    const cx=((frame*0.2+i*260)%(W+140))-70;
    ctx.beginPath();ctx.ellipse(cx,60+i*40,40,18,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+30,55+i*40,30,15,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#5aaa30';ctx.fillRect(0,H-16,W,16);
  drawFlowers();

  if(!started&&!gameOver){
    drawBug();
    ctx.fillStyle='#1a1a2e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_bug','Move / Tap-drag to start flying'),W/2,H/2);
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawBug();
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-16);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
    updateHUD();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;
  distance+=dt*0.5;
  score=Math.floor(distance);
  if(invuln>0)invuln-=dt;

  const spd=4+distance/400;
  flowers.forEach(f=>{f.x-=spd*0.6*dt; if(f.x<-20){f.x=W+20;f.hue=Math.floor(Math.random()*360);}});

  // control
  if(dragTarget){
    bug.x+=(dragTarget.x-bug.w/2-bug.x)*0.2*dt;
    bug.y+=(dragTarget.y-bug.h/2-bug.y)*0.2*dt;
    bug.vy=(dragTarget.y-bug.h/2-bug.y)*0.1;
  }else{
    let ay=0,ax=0;
    if(keys.up)ay-=0.6;
    if(keys.down)ay+=0.6;
    if(keys.left)ax-=0.6;
    if(keys.right)ax+=0.6;
    bug.vy+=ay*dt;bug.vx+=ax*dt;
    bug.vy*=0.9;bug.vx*=0.9;
    bug.x+=bug.vx*dt*3;bug.y+=bug.vy*dt*3;
  }
  bug.x=Math.max(10,Math.min(W-bug.w-10,bug.x));
  bug.y=Math.max(10,Math.min(H-30-bug.h,bug.y));

  itemTimer+=dt;
  if(itemTimer>=55){itemTimer=0;spawnItem();}
  webTimer+=dt;
  if(webTimer>=90){webTimer=0;spawnWeb();}
  birdTimer+=dt;
  if(distance>60&&birdTimer>=130){birdTimer=0;spawnBird();}

  const bugCX=bug.x+bug.w/2,bugCY=bug.y+bug.h/2,bugR=13;

  items=items.filter(it=>it.x>-30);
  items.forEach(it=>{
    it.x-=spd*dt;
    drawItem(it);
    const dx=it.x-bugCX,dy=(it.y+Math.sin(frame*0.1+it.bob)*4)-bugCY;
    if(dx*dx+dy*dy<(bugR+it.r)*(bugR+it.r)){
      it.x=-999;
      score+=it.kind==='pollen'?5:10;
      distance+=it.kind==='pollen'?5:10;
      SFX.coin();
    }
  });

  webs=webs.filter(w=>w.x>-60);
  webs.forEach(w=>{
    w.x-=spd*dt;
    drawWeb(w);
    if(invuln<=0&&circleRect(bugCX,bugCY,bugR,w.x,w.y,w.w,w.h)){
      lives--;invuln=90;SFX.hurt();
      w.x=-999;
      if(lives<=0){endGame();}
    }
  });

  birds=birds.filter(b=>b.x>-70);
  birds.forEach(b=>{
    b.x-=(spd+2)*dt;
    b.y+=Math.sin(frame*0.05+b.phase)*0.6;
    drawBird(b);
    if(invuln<=0&&circleRect(bugCX,bugCY,bugR,b.x-b.w/2,b.y-b.h/2,b.w,b.h)){
      lives--;invuln=90;SFX.hit();
      b.x=-999;
      if(lives<=0){endGame();}
    }
  });

  if(invuln>0&&Math.floor(frame/4)%2===0){/* blink */}
  else drawBug();

  if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
  updateHUD();
  requestAnimationFrame(loop);
}

function endGame(){
  gameOver=true;started=false;SFX.lose();
  if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
}

reset();
requestAnimationFrame(loop);
</script></body></html>
