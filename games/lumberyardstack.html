<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#4e342e,#a1887f);display:block;border-radius:8px}
#score-display{color:#ffcc80;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#stability-wrap{width:min(92vw,400px);height:14px;background:rgba(0,0,0,.35);border-radius:7px;margin:0 auto 8px;overflow:hidden}
#stability-fill{height:100%;background:#66bb6a;width:100%;transition:width .15s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lumberyard Stack</div>
  <div class="game-frame">
    <div id="score-display">Height: 0 | Best: 0</div>
    <div id="stability-wrap"><div id="stability-fill"></div></div>
    <canvas id="c" width="400" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>Tap</b> to drop the swinging log onto the stack. Land it <b>centered</b> to keep the stack stable and build it as high as possible — sloppy drops weaken stability and can topple the whole pile!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=400,H=600;
const stabilityFill=document.getElementById('stability-fill');
const scoreDisplay=document.getElementById('score-display');

let hi=parseInt(localStorage.getItem('lumberyardstack_hi')||'0',10);
let score=0,stability=100,gameOver=true,started=false;
let stack=[]; // {x,w,y}
let swing={x:W/2,ang:0,dir:1,len:80,pivotX:W/2,pivotY:60};
let logW=90,dropping=false,fallingLog=null;
let baseY=H-40;

function reset(){
  score=0;stability=100;gameOver=false;started=true;dropping=false;fallingLog=null;
  logW=90;
  stack=[{x:W/2-logW/2,w:logW,y:baseY}];
  swing.pivotX=W/2;swing.pivotY=60;swing.len=80;swing.ang=0;swing.dir=1;
  updateHUD();
}

function updateHUD(){
  scoreDisplay.textContent=I18N.t('height_hi_label','Height: {s} | Best: {h}').replace('{s}',score).replace('{h}',hi);
  stabilityFill.style.width=Math.max(0,stability)+'%';
  stabilityFill.style.background=stability>60?'#66bb6a':stability>30?'#ffca28':'#ef5350';
}

function currentLogX(){
  return swing.pivotX+Math.sin(swing.ang)*swing.len;
}

function drop(){
  if(!started||gameOver){reset();return;}
  if(dropping)return;
  dropping=true;
  const x=currentLogX();
  fallingLog={x:x-logW/2,y:swing.pivotY,w:logW,vy:2};
  SFX.click();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop();}});
c.addEventListener('click',drop);
c.addEventListener('touchstart',e=>{e.preventDefault();drop();},{passive:false});

function topOfStack(){
  return stack[stack.length-1];
}

function land(){
  const top=topOfStack();
  const logCenter=fallingLog.x+fallingLog.w/2;
  const topCenter=top.x+top.w/2;
  const offset=Math.abs(logCenter-topCenter);
  const maxOffset=fallingLog.w/2+top.w/2;
  const offsetRatio=offset/maxOffset;

  if(offsetRatio>0.95){
    // total miss
    stability-=40;
    SFX.fail();
  }else{
    const newW=Math.max(20,fallingLog.w-offset);
    const penalty=offset*0.6;
    stability-=penalty;
    if(offset<6){
      score+=3;
      stability=Math.min(100,stability+4);
      SFX.success();
    }else{
      score+=1;
      SFX.point();
    }
    const newX=(logCenter+topCenter)/2-newW/2;
    const newY=top.y-30;
    stack.push({x:newX,w:newW,y:newY});
    logW=Math.max(24,newW-1.5);
    if(newY<160){
      // scroll stack down (camera follows up) by shifting all bricks
      const shift=160-newY;
      stack.forEach(b=>b.y+=shift);
      swing.pivotY+=0; // pivot stays fixed near top
    }
  }
  fallingLog=null;
  dropping=false;
  updateHUD();
  if(stability<=0){
    gameOver=true;
    if(score>hi){hi=score;localStorage.setItem('lumberyardstack_hi',hi);}
    SFX.lose();
  }
}

function drawLog(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,6);
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)';
  ctx.lineWidth=2;
  ctx.stroke();
  // wood grain rings on the ends
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.arc(x+8,y+h/2,h/2-3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+w-8,y+h/2,h/2-3,0,Math.PI*2);ctx.fill();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3e2723');bg.addColorStop(1,'#6d4c41');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4e342e';ctx.fillRect(0,H-20,W,20);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Space to start'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    stack.forEach(b=>drawLog(b.x,b.y,b.w,26,'#8d6e63'));
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+14);
    requestAnimationFrame(loop);return;
  }

  // swing pendulum
  if(!dropping){
    swing.ang+=0.045*swing.dir;
    if(swing.ang>1.1){swing.ang=1.1;swing.dir=-1;}
    if(swing.ang<-1.1){swing.ang=-1.1;swing.dir=1;}
  }

  // draw stack
  stack.forEach(b=>drawLog(b.x,b.y,b.w,26,'#8d6e63'));

  // draw pivot beam
  ctx.strokeStyle='#3e2723';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(swing.pivotX-40,30);ctx.lineTo(swing.pivotX+40,30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(swing.pivotX,30);ctx.lineTo(swing.pivotX,swing.pivotY);ctx.stroke();

  if(dropping&&fallingLog){
    fallingLog.y+=fallingLog.vy;
    fallingLog.vy+=0.5;
    const top=topOfStack();
    if(fallingLog.y+26>=top.y){
      fallingLog.y=top.y-26;
      drawLog(fallingLog.x,fallingLog.y,fallingLog.w,26,'#a1887f');
      land();
    }else{
      drawLog(fallingLog.x,fallingLog.y,fallingLog.w,26,'#a1887f');
    }
  }else{
    const x=currentLogX();
    // chain
    ctx.strokeStyle='#5d4037';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(swing.pivotX,swing.pivotY);ctx.lineTo(x,swing.pivotY);ctx.stroke();
    drawLog(x-logW/2,swing.pivotY,logW,26,'#a1887f');
  }

  updateHUD();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
