<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1d140a;display:block;border-radius:8px}
#score-display{color:#e8c77e;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff6b6b;text-align:center;font-size:1rem;padding-bottom:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sake Rice Polishing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">♥ ♥ ♥</div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b>, click, or <b>tap and hold</b> to grind the rice down. Watch the gauge and <b>release</b> inside the highlighted target band — the required <i>seimai-buai</i> (polishing ratio) for that sake grade. Grind too far past it and the batch is wasted!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;
const MAXLEVEL=8;
let score=0,hi=Number(localStorage.getItem('sakericepolishing_hi')||0);
let lives=3,level=1,gameOver=false,won=false,started=false;
let grinding=false,ratio=100,target=60,tol=6,speed=9,stoneAngle=0;
let msg='',msgTimer=0,lastTime=null;
let shakeT=0;

function newRound(){
  target=Math.round((40+Math.random()*35)/5)*5; // 40..75 step5
  tol=Math.max(1.6,6-(level-1)*0.55);
  speed=9+(level-1)*1.6;
  ratio=100;grinding=false;
}
function reset(){score=0;lives=3;level=1;gameOver=false;won=false;started=false;newRound();lastTime=null;}
reset();

function flash(t){msg=t;msgTimer=90;}

function startGrind(){
  if(!started){started=true;return;}
  if(gameOver||won){reset();return;}
  grinding=true;
}
function stopGrind(){
  if(!grinding)return;
  grinding=false;
  const dev=Math.abs(ratio-target);
  if(dev<=tol){
    const bonus=Math.round((tol-dev)*22)+level*12;
    score+=100+bonus;
    if(score>hi){hi=score;localStorage.setItem('sakericepolishing_hi',String(hi));}
    SFX.success();
    flash(I18N.t('nice_polish',"Perfect polish! +"+(100+bonus)));
    level++;
    if(level>MAXLEVEL){won=true;SFX.win();}
    else newRound();
  } else {
    flash(I18N.t('released_early',"Not enough — grind more next time"));
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!grinding)startGrind();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault();stopGrind();}
});
c.addEventListener('pointerdown',e=>{e.preventDefault();startGrind();});
window.addEventListener('pointerup',()=>{stopGrind();});
c.addEventListener('touchstart',e=>{e.preventDefault();startGrind();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();stopGrind();},{passive:false});

function loseLife(){
  lives--;
  shakeT=18;
  SFX.hurt();
  flash(I18N.t('over_polished',"Over-polished! Batch wasted."));
  if(lives<=0){gameOver=true;SFX.lose();}
  else newRound();
}

function drawStone(cx,cy,r){
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(stoneAngle);
  const g=ctx.createRadialGradient(0,0,4,0,0,r);
  g.addColorStop(0,'#8a7050');g.addColorStop(1,'#4a3826');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2c2015';ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(i*Math.PI/4)*r,Math.sin(i*Math.PI/4)*r);
    ctx.stroke();
  }
  ctx.fillStyle='#d8c39a';
  ctx.beginPath();ctx.arc(0,0,r*0.22,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawGauge(){
  const gx=580,gy=40,gw=120,gh=240;
  ctx.fillStyle='#2a2015';ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle='#5a4830';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
  // target band (ratio 100 at top -> 0 at bottom)
  const yFor=p=>gy+gh*(1-p/100);
  const bandTop=yFor(Math.min(100,target+tol));
  const bandBot=yFor(Math.max(0,target-tol));
  ctx.fillStyle='rgba(126,200,80,0.45)';
  ctx.fillRect(gx,bandTop,gw,bandBot-bandTop);
  ctx.strokeStyle='#7ec850';ctx.lineWidth=1.5;
  ctx.strokeRect(gx,bandTop,gw,bandBot-bandTop);
  // current fill
  const curY=yFor(ratio);
  ctx.fillStyle=grinding?'#e8c77e':'#c9a24b';
  ctx.fillRect(gx,curY,gw,gy+gh-curY);
  // needle
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx-8,curY);ctx.lineTo(gx+gw+8,curY);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(Math.round(ratio)+'%',gx+gw/2,gy-10);
  ctx.font='12px Arial';ctx.fillStyle='#bbb';
  ctx.fillText(I18N.t('target_label','Target')+': '+target+'% ±'+tol.toFixed(1),gx+gw/2,gy+gh+20);
}

function loop(ts){
  let sx=0,sy=0;
  if(shakeT>0){shakeT--;sx=(Math.random()-0.5)*8;sy=(Math.random()-0.5)*8;}
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(sx,sy);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#241a10');sky.addColorStop(1,'#120d08');
  ctx.fillStyle=sky;ctx.fillRect(-20,-20,W+40,H+40);

  ctx.fillStyle='#f0e6d0';ctx.font='bold 20px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level')+' '+level+' / '+MAXLEVEL,20,32);

  drawStone(220,170,90);
  drawGauge();

  if(!started){
    ctx.fillStyle='#e8c77e';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_rice','Hold Space / Tap to start grinding'),300,290);
  } else if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score')+': '+score,W/2,180);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,215);
  } else if(won){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('win_title_rice','TOJI MASTER!'),W/2,140);
    ctx.font='20px Arial';ctx.fillStyle='#fff';
    ctx.fillText(I18N.t('final_score','Final Score')+': '+score,W/2,180);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,215);
  } else {
    if(grinding){
      stoneAngle+=0.18;
      const dt=lastTime===null?1:Math.min((ts-lastTime)/16.6667,3);
      ratio-=speed/60*dt;
      if(ratio<0)ratio=0;
      if(ratio<target-tol){loseLife();}
    }
    if(msgTimer>0){
      msgTimer--;
      ctx.fillStyle='rgba(0,0,0,0.0)';
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.globalAlpha=Math.min(1,msgTimer/30);
      ctx.fillText(msg,420,280);
      ctx.globalAlpha=1;
    }
  }
  lastTime=ts;
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  document.getElementById('lives-display').textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
