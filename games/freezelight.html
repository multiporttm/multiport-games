<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#37474f}
#ui{color:#e0e0e0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#moveBtn{display:block;margin:10px auto;padding:14px 30px;border-radius:12px;background:#66bb6a;color:#fff;border:none;font-weight:700;font-size:1.1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#moveBtn:active{background:#4caf50}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Freeze Light</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Progress: 0% | Wins: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <button id="moveBtn">HOLD TO MOVE (Space)</button>
  </div>
  <div class="game-instructions">Hold the button (or Space) to walk forward — but only while the light is GREEN. When it flips to RED, let go instantly and freeze. The watcher checks for movement on red; get caught moving and you're eliminated!</div>
</div>
<script>
const W=360,H=360,FINISH_Y=30,START_Y=H-30;
let progress,light,lightTimer,holding,state,wins,caughtFlash=0;

function loadBest(){return +(localStorage.getItem('freezelight_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('freezelight_best',v);}

function init(){wins=0;state='play';newRound();}
function newRound(){
  progress=0;light='green';lightTimer=90+Math.random()*60;holding=false;
}

const btn=document.getElementById('moveBtn');
function press(e){e.preventDefault();if(state==='caught'){newRound();state='play';return;}holding=true;}
function release(e){e.preventDefault();holding=false;}
btn.addEventListener('mousedown',press);
btn.addEventListener('mouseup',release);
btn.addEventListener('mouseleave',release);
btn.addEventListener('touchstart',press,{passive:false});
btn.addEventListener('touchend',release,{passive:false});
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();press(e);}});
document.addEventListener('keyup',e=>{if(e.key===' '){e.preventDefault();release(e);}});

function update(){
  if(state!=='play')return;
  lightTimer--;
  if(lightTimer<=0){
    light=light==='green'?'red':'green';
    lightTimer=light==='green'?(70+Math.random()*70):(50+Math.random()*50);
    SFX.tick();
  }

  if(light==='red'&&holding){
    state='caught';caughtFlash=20;
    SFX.lose();
    saveBest(wins);
    return;
  }

  if(holding&&light==='green'){
    progress+=0.6;
  }

  if(progress>=100){
    wins++;
    SFX.win();
    saveBest(wins);
    newRound();
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);

  ctx.fillStyle=light==='green'?'#66bb6a':'#ef5350';
  ctx.beginPath();ctx.arc(W-40,50,22,0,Math.PI*2);ctx.fill();
  ctx.font='20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(light==='green'?'🟢':'🔴',W-40,50);

  ctx.strokeStyle='#66bb6a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,FINISH_Y);ctx.lineTo(W,FINISH_Y);ctx.stroke();

  const y=START_Y-(START_Y-FINISH_Y)*(progress/100);
  ctx.font='26px Arial';
  ctx.fillText('🏃',W/2,y);

  ctx.font='13px Arial';ctx.fillStyle='#ffca28';
  ctx.fillText(holding?'MOVING':'still',W/2,y+22);

  if(caughtFlash>0){
    ctx.fillStyle=`rgba(239,83,80,${caughtFlash/20*0.4})`;
    ctx.fillRect(0,0,W,H);
    caughtFlash--;
  }

  if(state==='caught'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ef5350';ctx.font='bold 26px Arial';
    ctx.fillText('ELIMINATED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Wins: ${wins} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Hold the button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Progress: ${Math.min(100,Math.floor(progress))}% | Wins: ${wins}`;
}

init();draw();
</script></body></html>
