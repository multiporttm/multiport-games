<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a1a1a}
#ui{color:#ce93d8;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(2,64px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent;height:52px}
#dpad button:active{background:rgba(255,255,255,.2)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Cave Explorer</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Gems: 0 | Distance: 0m</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Up/Down (or the D-pad) to move vertically while you auto-scroll forward. Collect 💎 gems, dodge 🦇 bats and jagged wall spikes — touch either and it's over.</div>
</div>
<script>
const W=360,H=360,SIZE=16;
let player,gems,bats,walls,dist,gemCount,speed,state,keys={},spawnTimer;

function rand(min,max){return min+Math.random()*(max-min);}
function loadBest(){return +(localStorage.getItem('caveexplorer_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('caveexplorer_best',v);}

function init(){
  player={x:70,y:H/2};
  gems=[];bats=[];walls=[];dist=0;gemCount=0;speed=2.8;state='play';spawnTimer=0;
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelector('#dpad .up').addEventListener('mousedown',()=>keys['arrowup']=true);
document.querySelector('#dpad .up').addEventListener('mouseup',()=>keys['arrowup']=false);
document.querySelector('#dpad .up').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowup']=true;},{passive:false});
document.querySelector('#dpad .up').addEventListener('touchend',e=>{e.preventDefault();keys['arrowup']=false;},{passive:false});
document.querySelector('#dpad .down').addEventListener('mousedown',()=>keys['arrowdown']=true);
document.querySelector('#dpad .down').addEventListener('mouseup',()=>keys['arrowdown']=false);
document.querySelector('#dpad .down').addEventListener('touchstart',e=>{e.preventDefault();keys['arrowdown']=true;},{passive:false});
document.querySelector('#dpad .down').addEventListener('touchend',e=>{e.preventDefault();keys['arrowdown']=false;},{passive:false});

function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play'){
    if(state==='over'&&(keys['arrowup']||keys['arrowdown']))init();
    return;
  }
  const spd=2.6;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  speed=2.8+dist*0.0012;
  dist+=speed*0.08;

  spawnTimer--;
  if(spawnTimer<=0){
    const r=Math.random();
    if(r<0.35)gems.push({x:W+20,y:rand(30,H-30)});
    else if(r<0.65)bats.push({x:W+20,y:rand(30,H-30),vy:rand(-0.8,0.8)});
    else walls.push({x:W+20,y:Math.random()<0.5?0:H-40,h:40});
    spawnTimer=Math.max(24,45-dist*0.02);
  }

  gems.forEach(g=>g.x-=speed);
  gems=gems.filter(g=>{
    if(dist2(g,player)<20){gemCount++;SFX.coin();return false;}
    return g.x>-20;
  });

  bats.forEach(b=>{b.x-=speed;b.y+=b.vy;if(b.y<20||b.y>H-20)b.vy*=-1;});
  bats=bats.filter(b=>b.x>-20);
  bats.forEach(b=>{if(dist2(b,player)<18){state='over';SFX.lose();saveBest(gemCount);}});

  walls.forEach(w=>w.x-=speed);
  walls=walls.filter(w=>w.x>-30);
  walls.forEach(w=>{
    if(Math.abs(w.x-player.x)<18){
      if(w.y===0&&player.y-SIZE/2<w.h){state='over';SFX.lose();saveBest(gemCount);}
      if(w.y>0&&player.y+SIZE/2>w.y){state='over';SFX.lose();saveBest(gemCount);}
    }
  });

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#3e2723';
  walls.forEach(w=>{
    if(w.y===0)ctx.fillRect(w.x-14,0,28,w.h);
    else ctx.fillRect(w.x-14,w.y,28,H-w.y);
  });

  ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  gems.forEach(g=>ctx.fillText('💎',g.x,g.y));
  bats.forEach(b=>ctx.fillText('🦇',b.x,b.y));

  ctx.font='22px Arial';
  ctx.fillText('🧑‍🚀',player.x,player.y);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ce93d8';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('cave_in_title','CAVE-IN!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('gems_best','Gems: {n} | Best: {b}').replace('{n}',gemCount).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Press Up/Down to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('gems_distance','Gems: {n} | Distance: {d}m').replace('{n}',gemCount).replace('{d}',Math.floor(dist));
}

init();draw();
</script></body></html>
