<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Drone Delivery</title><meta name="description" content="Play Drone Delivery free online — Fly your drone through obstacles and drop packages on the marked houses."><link rel="canonical" href="https://games.multiportllc.com/games/dronedelivery"><meta property="og:title" content="Drone Delivery - Multiport Games"><meta property="og:description" content="Play Drone Delivery free online — Fly your drone through obstacles and drop packages on the marked houses."><meta property="og:url" content="https://games.multiportllc.com/games/dronedelivery"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Drone Delivery","description":"Play Drone Delivery free online instantly. Fly your drone through obstacles and drop packages on the marked houses. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/dronedelivery","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:linear-gradient(#90caf9,#e1f5fe);cursor:pointer}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Drone Delivery</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Delivered: 0 | Best: 0</div>
    <canvas id="c" width="360" height="480"></canvas>
  </div>
  <div class="game-instructions">Tap or press Space to boost your drone upward — release to let gravity pull it down. Weave through the birds and clouds, then fly over a house with a package icon to auto-drop it. Miss the ground or a bird and it's game over!</div>
</div>
<script>
const W=360,H=480;
const GRAV=0.32,BOOST=-0.55,MAXV=6;
let drone,obstacles,houses,carrying,delivered,spawnT,houseT,state,best,scrollSpeed;

function loadBest(){return +(localStorage.getItem('dronedelivery_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('dronedelivery_best',v);}

function init(){
  drone={x:80,y:H/2,vy:0};
  obstacles=[];houses=[];
  carrying=true;delivered=0;spawnT=0;houseT=60;state='play';best=loadBest();
  scrollSpeed=2.4;
  updateUI();
}

let boosting=false;
function press(){boosting=true;}
function release(){boosting=false;}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('mousedown',()=>{if(state==='over'){init();return;}press();});
c.addEventListener('mouseup',release);
c.addEventListener('mouseleave',release);
c.addEventListener('touchstart',e=>{e.preventDefault();if(state==='over'){init();return;}press();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(state==='over'){init();return;}press();}});
document.addEventListener('keyup',e=>{if(e.key===' ')release();});

function spawnObstacle(){
  const type=Math.random()<0.5?'bird':'cloud';
  obstacles.push({x:W+30,y:60+Math.random()*(H-220),type,r:type==='bird'?14:26,wob:Math.random()*Math.PI*2});
}
function spawnHouse(){
  houses.push({x:W+40,y:H-50,w:60,delivered:false});
}

function update(){
  if(state!=='play')return;
  drone.vy+=boosting?BOOST:GRAV;
  drone.vy=Math.max(-MAXV,Math.min(MAXV,drone.vy));
  drone.y+=drone.vy;

  if(drone.y<20||drone.y>H-40){
    state='over';SFX.lose();saveBest(delivered);updateUI();return;
  }

  spawnT++;
  if(spawnT>70){spawnT=0;spawnObstacle();}
  houseT++;
  if(houseT>190){houseT=0;spawnHouse();}

  for(const o of obstacles)o.x-=scrollSpeed;
  for(const h of houses)h.x-=scrollSpeed;
  obstacles=obstacles.filter(o=>o.x>-40);
  houses=houses.filter(h=>h.x>-80);

  for(const o of obstacles){
    if(o.type==='bird')o.y+=Math.sin(o.wob+=0.08)*0.6;
    if(Math.hypot(drone.x-o.x,drone.y-o.y)<o.r+14){
      state='over';SFX.hurt();SFX.lose();saveBest(delivered);updateUI();return;
    }
  }

  if(carrying){
    for(const h of houses){
      if(!h.delivered&&Math.abs(drone.x-h.x)<h.w/2&&drone.y>H-140){
        h.delivered=true;carrying=false;delivered++;
        SFX.success();
        updateUI();
        setTimeout(()=>{if(state==='play')carrying=true;},900);
        break;
      }
    }
  }

  scrollSpeed=Math.min(4.2,scrollSpeed+0.0015);
}

function draw(){
  ctx.fillStyle='#90caf9';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,H-24,W,24);

  for(const h of houses){
    ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🏠',h.x,H-38);
    if(!h.delivered){
      ctx.font='16px Arial';
      ctx.fillText('📦',h.x,H-64);
    }else{
      ctx.font='16px Arial';
      ctx.fillText('✅',h.x,H-64);
    }
  }

  for(const o of obstacles){
    ctx.font=`${o.r*1.8}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(o.type==='bird'?'🐦':'☁️',o.x,o.y);
  }

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(carrying?'🚁':'🚁',drone.x,drone.y);
  if(carrying){
    ctx.font='14px Arial';
    ctx.fillText('📦',drone.x,drone.y+18);
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e1f5fe';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('DRONE CRASHED!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Delivered: ${delivered} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to fly again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Delivered: ${delivered} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
