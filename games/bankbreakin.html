<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#212121;cursor:pointer}
#ui{color:#ffca28;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bank Break-In</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Safes cracked: 0 | Time: 15.0s</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag around the dial to find the hidden combination — the ring glows warmer the closer you are. Tap the center to confirm once it's fully red-hot. Crack safes before time runs out!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=170,R=100;
let target,angle,dragging,timeLeft,cracked,state,bestStreak=+(localStorage.getItem('bankbreakin_best')||0);

function loadBest(){return +(localStorage.getItem('bankbreakin_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('bankbreakin_best',v);}

function init(){
  cracked=0;timeLeft=15;state='play';
  newSafe();
}

function newSafe(){
  target=Math.random()*Math.PI*2;
  angle=Math.random()*Math.PI*2;
}

function angDiff(a,b){
  let d=Math.abs(a-b)%(Math.PI*2);
  return d>Math.PI?Math.PI*2-d:d;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');

function pointerAngle(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.clientX-rect.left)*(W/rect.width),cy=(e.clientY-rect.top)*(H/rect.height);
  return Math.atan2(cy-CY,cx-CX);
}

function start(e){
  if(state==='over'){init();return;}
  const p=e.touches?e.touches[0]:e;
  const rect=c.getBoundingClientRect();
  const x=(p.clientX-rect.left)*(W/rect.width),y=(p.clientY-rect.top)*(H/rect.height);
  if(Math.hypot(x-CX,y-CY)<30){
    if(angDiff(angle,target)<0.12){
      cracked++;timeLeft=Math.min(15,timeLeft+3);
      SFX.success();
      saveBest(cracked);
      newSafe();
      updateUI();
    }
    return;
  }
  dragging=true;
}
function move(e){
  if(!dragging||state!=='play')return;
  e.preventDefault();
  const p=e.touches?e.touches[0]:e;
  angle=pointerAngle(p);
}
function end(){dragging=false;}

c.addEventListener('mousedown',start);
c.addEventListener('mousemove',move);
c.addEventListener('mouseup',end);
c.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});
c.addEventListener('touchmove',move,{passive:false});
c.addEventListener('touchend',end);

function update(){
  if(state!=='play')return;
  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(cracked);
  }
  updateUI();
}

function draw(){
  ctx.fillStyle='#212121';ctx.fillRect(0,0,W,H);

  const d=angDiff(angle,target);
  const heat=Math.max(0,1-d/Math.PI);
  const r=Math.floor(60+heat*195),g=Math.floor(150-heat*130),b=60;
  ctx.strokeStyle=`rgb(${r},${g},${b})`;
  ctx.lineWidth=14;
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();

  ctx.strokeStyle='#fff';ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(CX,CY);
  ctx.lineTo(CX+Math.cos(angle)*R,CY+Math.sin(angle)*R);
  ctx.stroke();

  ctx.fillStyle=d<0.12?'#ef5350':'#616161';
  ctx.beginPath();ctx.arc(CX,CY,30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🔓',CX,CY);

  ctx.fillStyle='#ffca28';ctx.font='16px Arial';
  ctx.fillText(I18N.t('drag_ring_hint','Drag ring · Tap center to confirm'),W/2,300);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffca28';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('times_up','TIME\'S UP!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('safes_best_label','Safes cracked: {n} | Best: {b}').replace('{n}',cracked).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_to_retry','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Safes cracked: ${cracked} | Time: ${timeLeft.toFixed(1)}s`;
}

init();draw();
</script></body></html>
