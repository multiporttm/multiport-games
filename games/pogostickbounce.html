<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#87ceeb;display:block;border-radius:8px;touch-action:manipulation}
#hud{display:flex;justify-content:center;gap:22px;color:#ffd54f;font-size:1.05rem;font-weight:700;padding:8px;flex-wrap:wrap}
#hud span b{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pogo Stick Bounce</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="scoreEl">0</b></span><span>Combo: <b id="comboEl">0</b></span><span>Best: <b id="bestEl">0</b></span></div>
    <canvas id="c" width="760" height="380"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>tap</b> right as you touch the ground to spring higher and keep your combo alive. Bounce through rings for bonus points and clear obstacles. Mistime it, or drop too low, and it's game over!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=760,H=380;
const GROUND=310;
const MIN_HEIGHT_FAIL=GROUND-18; // if peak height on a bounce doesn't clear this, game over after grace bounces
const GRAVITY=0.55;

let pogo,score,combo,best,scrollX,obstacles,rings,obsTimer,ringTimer,running,gameOver,lastTime,frame,
    shake,floatTexts,groundHitReady,lowBounceCount;

best=parseInt(localStorage.getItem('pogostickbounce_best')||'0',10);
document.getElementById('bestEl').textContent=best;

function reset(){
  pogo={y:GROUND,vy:0,x:150,onGround:true,squash:0,tilt:0};
  score=0;combo=0;scrollX=0;obstacles=[];rings=[];obsTimer=0;ringTimer=0;
  running=false;gameOver=false;lastTime=null;frame=0;shake=0;floatTexts=[];
  groundHitReady=true;lowBounceCount=0;
  updateHud();
}

function updateHud(){
  document.getElementById('scoreEl').textContent=Math.floor(score);
  document.getElementById('comboEl').textContent=combo;
}

function addFloat(text,x,y,color){
  floatTexts.push({text,x,y,life:40,color:color||'#fff'});
}

function press(){
  if(gameOver){reset();return;}
  if(!running){running=true;pogo.vy=-13;pogo.onGround=false;SFX.jump();return;}
  if(pogo.onGround&&groundHitReady){
    // timing window relative to when it landed
    const timing=performance.now()-pogo.landAt;
    let power;
    if(timing<90){ power=15.5; combo++; SFX.powerup(); addFloat('PERFECT!',pogo.x,pogo.y-70,'#ffd54f'); score+=15; }
    else if(timing<220){ power=13; combo++; SFX.jump(); addFloat('Good',pogo.x,pogo.y-70,'#8bc34a'); score+=8; }
    else { power=9; combo=0; SFX.tick(); addFloat('Late',pogo.x,pogo.y-70,'#ff9800'); score+=2; }
    pogo.vy=-power;
    pogo.onGround=false;
    groundHitReady=false;
    updateHud();
  } else if(!pogo.onGround){
    // pressed mid-air too early - small penalty, doesn't change flight but breaks combo streak potential
  }
}

document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();press();} });
c.addEventListener('mousedown',press);
c.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});

function spawnObstacle(){
  obstacles.push({x:scrollX+W+80,w:26,h:34+Math.random()*20,passed:false});
}
function spawnRing(){
  rings.push({x:scrollX+W+80,y:GROUND-90-Math.random()*90,r:26,passed:false});
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function loop(now){
  if(lastTime===null)lastTime=now;
  const dt=Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; }

  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#4fa3d1');sky.addColorStop(1,'#bde6f5');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND+70);

  // clouds
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(let i=0;i<4;i++){
    const cx=((i*260 - scrollX*0.2)%(W+200)+W+200)%(W+200)-100;
    ctx.beginPath();ctx.ellipse(cx,60+i*20,40,18,0,0,Math.PI*2);ctx.fill();
  }

  if(running&&!gameOver){
    frame+=dt;
    const worldSpeed=4.2+Math.min(4,score/300);
    scrollX+=worldSpeed*dt;
    score+=0.05*dt;

    // physics
    pogo.vy+=GRAVITY*dt;
    pogo.y+=pogo.vy*dt;
    if(pogo.y>=GROUND){
      const peakDrop = pogo.peakY!=null ? (GROUND-pogo.peakY) : 0;
      pogo.y=GROUND;
      if(!pogo.onGround){
        pogo.onGround=true;
        pogo.landAt=performance.now();
        pogo.squash=8;
        groundHitReady=true;
        SFX.land();
        if(peakDrop<40){
          lowBounceCount++;
          if(lowBounceCount>=3){ endGame(); }
        } else lowBounceCount=0;
      }
      pogo.vy=0;
      pogo.peakY=GROUND;
    } else {
      pogo.onGround=false;
      if(pogo.peakY==null||pogo.y<pogo.peakY)pogo.peakY=pogo.y;
    }
    if(pogo.squash>0)pogo.squash-=dt*0.8;

    // spawn
    obsTimer+=dt;
    if(obsTimer>60){obsTimer=0;if(Math.random()<0.7)spawnObstacle();}
    ringTimer+=dt;
    if(ringTimer>50){ringTimer=0;if(Math.random()<0.8)spawnRing();}

    // world-space hitbox for pogo (screen x fixed at pogo.x)
    const pogoScreenBox={x:pogo.x-14,y:pogo.y-46,w:28,h:46};

    obstacles=obstacles.filter(o=>o.x-scrollX>-60);
    obstacles.forEach(o=>{
      const sx=o.x-scrollX;
      const box={x:sx,y:GROUND-o.h,w:o.w,h:o.h};
      if(!o.passed&&sx<pogo.x){o.passed=true;score+=5;}
      if(rectsOverlap(pogoScreenBox,box)){
        endGame();
      }
    });

    rings=rings.filter(r=>r.x-scrollX>-60);
    rings.forEach(r=>{
      const sx=r.x-scrollX;
      if(!r.passed){
        const dx=pogo.x-sx,dy=(pogo.y-40)-r.y;
        if(Math.sqrt(dx*dx+dy*dy)<r.r){
          r.passed=true;score+=20;combo++;SFX.coin();
          addFloat('+20 RING',pogo.x,pogo.y-90,'#4fc3f7');
          updateHud();
        }
      }
    });

    updateHud();
  }

  // ground
  ctx.fillStyle='#7ec850';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#5aaa30';ctx.fillRect(0,GROUND,W,6);
  for(let i=0;i<20;i++){
    const gx=((i*80 - scrollX)%(W+80)+W+80)%(W+80)-40;
    ctx.fillStyle='#6bbf3d';
    ctx.fillRect(gx,GROUND+10,30,4);
  }

  // obstacles
  obstacles.forEach(o=>{
    const sx=o.x-scrollX;
    ctx.fillStyle='#8d6e63';
    ctx.fillRect(sx,GROUND-o.h,o.w,o.h);
    ctx.fillStyle='#6d4c41';
    ctx.fillRect(sx,GROUND-o.h,o.w,6);
  });

  // rings
  rings.forEach(r=>{
    if(r.passed)return;
    const sx=r.x-scrollX;
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(sx,r.y,r.r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#ff9800';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,r.y,r.r-6,0,Math.PI*2);ctx.stroke();
  });

  // pogo character
  ctx.save();
  ctx.translate(pogo.x,pogo.y);
  const squashY=1+(pogo.squash>0?pogo.squash/8*0.25:0);
  const stretchY=pogo.onGround?1:Math.max(0.85,1-Math.abs(pogo.vy)*0.01);
  ctx.scale(1/squashY,squashY*stretchY);
  // stick
  ctx.strokeStyle='#5d4037';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,20);ctx.stroke();
  // foot bar
  ctx.strokeStyle='#3e2723';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-14,18);ctx.lineTo(14,18);ctx.stroke();
  // spring coil
  ctx.strokeStyle='#9e9e9e';ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<4;i++){ ctx.moveTo(-8, -6+i*7); ctx.lineTo(8,-2+i*7); }
  ctx.stroke();
  // body
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.ellipse(0,-24,12,14,0,0,Math.PI*2);ctx.fill();
  // head
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-46,10,0,Math.PI*2);ctx.fill();
  // arms holding handle
  ctx.strokeStyle='#e94560';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-2,-40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-30);ctx.lineTo(2,-40);ctx.stroke();
  ctx.restore();

  // float texts
  floatTexts=floatTexts.filter(f=>f.life>0);
  floatTexts.forEach(f=>{
    ctx.globalAlpha=Math.max(0,f.life/40);
    ctx.fillStyle=f.color;ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(f.text,f.x,f.y-(40-f.life));
    ctx.globalAlpha=1;
    f.life-=dt;
  });

  ctx.restore(); // shake

  ctx.textAlign='center';
  if(!running&&!gameOver){
    ctx.fillStyle='#1a1a2e';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('pogo_start','Press Space or Tap to start bouncing'),W/2,140);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,150);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_pogo','Final Score: {s}').replace('{s}',Math.floor(score)),W/2,186);
    ctx.fillText(I18N.t('restart_hint_pogo','Tap or Space to bounce again'),W/2,216);
  }

  requestAnimationFrame(loop);
}

function endGame(){
  if(gameOver)return;
  gameOver=true;running=false;shake=12;
  SFX.hit();SFX.lose();
  if(score>best){best=Math.floor(score);localStorage.setItem('pogostickbounce_best',best);document.getElementById('bestEl').textContent=best;}
}

reset();
requestAnimationFrame(loop);
</script></body></html>
