<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#4a148c,#e1bee7);display:block;border-radius:8px;touch-action:none;margin:0 auto}
#score-display{color:#e1bee7;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#controls{text-align:center;margin:10px 0}
#controls button{padding:9px 22px;background:#7b1fa2;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1rem;margin:0 5px}
#controls button:disabled{opacity:.4;cursor:not-allowed}
#palette{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.3)}
.swatch.active{border-color:#fff;transform:scale(1.15)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Kaleidoscope</div>
  <div class="game-frame">
    <div id="score-display">Patterns: 0 | Best Time: — | Hi: 0</div>
    <canvas id="c" width="600" height="480"></canvas>
    <div id="palette"></div>
    <div id="controls">
      <button id="submitBtn" onclick="submitPattern()">Submit</button>
      <button id="clearBtn" onclick="clearWork()">Clear</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study the <b>target pattern</b> at top, pick a color from the palette, then click wedges in the <b>editable circle</b> below to match every position. Click <b>Submit</b> when ready — a perfect match scores a point and gives you a new, trickier pattern!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=600,H=480;
const TARGET_CX=300,TARGET_CY=110,TARGET_R=90;
const WORK_CX=300,WORK_CY=340,WORK_R=130;

const COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#00acc1','#ec407a'];

let wedgeCount=6,paletteSize=3;
let target=[],work=[];
let activeColor=COLORS[0];
let patterns=0,hi=0,bestTime=null,gameOver=false,startTime=null,elapsed=0;

hi=parseInt(localStorage.getItem('kaleidoscope_hi')||'0',10);
bestTime=localStorage.getItem('kaleidoscope_best')? parseFloat(localStorage.getItem('kaleidoscope_best')) : null;

function buildPalette(){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  for(let i=0;i<paletteSize;i++){
    const sw=document.createElement('div');
    sw.className='swatch'+(COLORS[i]===activeColor?' active':'');
    sw.style.background=COLORS[i];
    sw.onclick=()=>{activeColor=COLORS[i];buildPalette();};
    pal.appendChild(sw);
  }
}

function newPattern(){
  wedgeCount=Math.min(12,4+Math.floor(patterns/2));
  paletteSize=Math.min(COLORS.length,3+Math.floor(patterns/3));
  target=[];
  for(let i=0;i<wedgeCount;i++)target.push(COLORS[Math.floor(Math.random()*paletteSize)]);
  work=new Array(wedgeCount).fill(null);
  activeColor=COLORS[0];
  buildPalette();
  startTime=performance.now();
}

function updateScore(){
  document.getElementById('score-display').textContent=
    I18N.t('kaleido_score_label','Patterns: {p} | Best Time: {t} | Hi: {h}')
      .replace('{p}',patterns)
      .replace('{t}', bestTime!=null? bestTime.toFixed(1)+'s' : '—')
      .replace('{h}',hi);
}

function drawWedgeRing(cx,cy,r,arr,innerR){
  const n=arr.length;
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*2*Math.PI/n;
    const a1=-Math.PI/2+(i+1)*2*Math.PI/n;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
    ctx.closePath();
    ctx.fillStyle=arr[i]||'#2a2a3a';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('kaleido_target_label','TARGET'),TARGET_CX,TARGET_CY-TARGET_R-14);
  drawWedgeRing(TARGET_CX,TARGET_CY,TARGET_R,target);
  ctx.fillText(I18N.t('kaleido_work_label','YOUR PATTERN — click a wedge'),WORK_CX,WORK_CY-WORK_R-14);
  drawWedgeRing(WORK_CX,WORK_CY,WORK_R,work);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+16);
  }
}

function getPos(e){
  const rect=c.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  let cx,cy;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*scaleX,y:(cy-rect.top)*scaleY};
}

function wedgeAt(px,py,cx,cy,r,n){
  const dx=px-cx,dy=py-cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>r)return -1;
  let ang=Math.atan2(dy,dx)+Math.PI/2;
  if(ang<0)ang+=Math.PI*2;
  return Math.floor(ang/(2*Math.PI/n))%n;
}

function handlePointer(px,py){
  if(gameOver){reset();return;}
  const idx=wedgeAt(px,py,WORK_CX,WORK_CY,WORK_R,wedgeCount);
  if(idx>=0){
    work[idx]=activeColor;
    SFX.click();
    draw();
  }
}

c.addEventListener('click',e=>{const p=getPos(e);handlePointer(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);handlePointer(p.x,p.y);},{passive:false});

function clearWork(){
  if(gameOver)return;
  work=new Array(wedgeCount).fill(null);
  SFX.click();
  draw();
}

function submitPattern(){
  if(gameOver)return;
  const match=target.every((col,i)=>work[i]===col);
  if(match){
    const t=(performance.now()-startTime)/1000;
    elapsed=t;
    if(bestTime===null||t<bestTime){bestTime=t;localStorage.setItem('kaleidoscope_best',bestTime);}
    patterns++;
    if(patterns>hi){hi=patterns;localStorage.setItem('kaleidoscope_hi',hi);}
    SFX.win();
    updateScore();
    newPattern();
    draw();
  }else{
    SFX.error();
    flashWrong();
  }
}

function flashWrong(){
  const canvas=document.getElementById('c');
  canvas.style.filter='brightness(1.6)';
  setTimeout(()=>{canvas.style.filter='';},150);
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(gameOver)reset(); else submitPattern();}
  if(e.code==='KeyC'){clearWork();}
});

function reset(){
  gameOver=false;
  patterns=0;
  newPattern();
  updateScore();
  draw();
}

reset();
</script></body></html>
