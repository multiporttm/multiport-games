<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:linear-gradient(#87ceeb,#b3e5fc);cursor:pointer}
#ui{color:#e1f5fe;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Balloon Pop Frenzy</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="360" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap balloons before they float off the top of the screen! Colorful balloons score points, but tap a bomb and you'll lose a life. Miss too many balloons and it's game over.</div>
</div>
<script>
const W=360,H=480;
let balloons,score,lives,spawnT,state,best,speedMul;

function loadBest(){return +(localStorage.getItem('balloonpopfrenzy_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('balloonpopfrenzy_best',v);}

const COLORS=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00'];

function spawnBalloon(){
  const isBomb=Math.random()<0.16;
  balloons.push({
    x:30+Math.random()*(W-60),
    y:H+20,
    r:22+Math.random()*8,
    vy:0.7+Math.random()*0.6+speedMul,
    color:isBomb?'#212121':COLORS[Math.floor(Math.random()*COLORS.length)],
    bomb:isBomb,
    wob:Math.random()*Math.PI*2,
    popped:false,popT:0
  });
}

function init(){
  balloons=[];score=0;lives=3;spawnT=0;state='play';speedMul=0;best=loadBest();
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  for(const b of balloons){
    if(b.popped)continue;
    if(Math.hypot(mx-b.x,my-b.y)<b.r+6){
      b.popped=true;b.popT=0;
      if(b.bomb){
        lives--;
        SFX.hurt();
        if(lives<=0){
          state='over';SFX.lose();saveBest(score);
        }
      }else{
        score+=10;
        SFX.point();
      }
      updateUI();
      break;
    }
  }
});

function update(){
  if(state!=='play')return;
  spawnT++;
  const interval=Math.max(22,50-Math.floor(score/50));
  if(spawnT>=interval){spawnT=0;spawnBalloon();speedMul=Math.min(1.5,speedMul+0.02);}
  for(const b of balloons){
    if(b.popped){b.popT++;continue;}
    b.y-=b.vy;
    b.wob+=0.05;
    b.x+=Math.sin(b.wob)*0.6;
    if(b.y< -30){
      if(!b.bomb){
        lives--;
        SFX.hit();
        if(lives<=0){state='over';SFX.lose();saveBest(score);}
      }
      b.popped=true;b.popT=999;
      updateUI();
    }
  }
  balloons=balloons.filter(b=>!(b.popped&&b.popT>10));
}

function draw(){
  ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,W,H);
  for(const b of balloons){
    if(b.popped){
      ctx.globalAlpha=Math.max(0,1-b.popT/10);
      ctx.font=`${b.r*1.5}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.bomb?'💥':'✨',b.x,b.y);
      ctx.globalAlpha=1;
      continue;
    }
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.r*0.85,b.r,0,0,Math.PI*2);
    ctx.fillStyle=b.bomb?'#212121':b.color;
    ctx.fill();
    if(b.bomb){
      ctx.strokeStyle='#ff7043';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(b.x,b.y-b.r);ctx.lineTo(b.x+4,b.y-b.r-8);ctx.stroke();
    }else{
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,b.r*0.35,0.4,0,Math.PI*2);ctx.stroke();
    }
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.x,b.y+b.r);ctx.lineTo(b.x,b.y+b.r+16);ctx.stroke();
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff3e0';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('out_of_lives','OUT OF LIVES!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('score_best_label','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('tap_play_again','Tap to play again'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${score} | Lives: ${Math.max(0,lives)} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
