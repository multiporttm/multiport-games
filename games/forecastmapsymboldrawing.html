<link rel="stylesheet" href="../css/style.css?v=8">

<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0c1c14;display:block;border-radius:8px}
#score-display{color:#9be37b;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#prompt-display{color:#ffd54f;font-size:1.1rem;font-weight:800;text-align:center;min-height:1.6em;padding:0 10px}
#palette{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
#palette button{padding:8px 14px;background:#1b3a2a;border:2px solid #2e5c42;border-radius:10px;color:#eafff0;font-weight:800;cursor:pointer;font-size:0.95rem}
#palette button.active{background:#4caf50;border-color:#7ee68a;color:#06220f}
#palette button:disabled{opacity:.35;cursor:not-allowed}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Forecast Map Symbol Drawing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Lv: 1 | Lives: 3 | Hi: 0</div>
    <div id="prompt-display">&nbsp;</div>
    <canvas id="c" width="800" height="400" tabindex="0"></canvas>
    <div id="palette"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each flashing slot on the map needs a symbol. Pick the correct symbol below (or press <b>1-5</b>) then <b>click/tap</b> the slot (or press <b>Enter</b> on the selected slot — use <b>Arrow Keys</b> to change slot) to place it before time runs out.</div>
</div>
<script>
const HI_KEY='mp_hi_forecastmapsymboldrawing';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;

const SYMS=[
  {id:'high',label:()=>I18N.t('sym_high','High (H)')},
  {id:'low',label:()=>I18N.t('sym_low','Low (L)')},
  {id:'cold',label:()=>I18N.t('sym_cold','Cold Front')},
  {id:'warm',label:()=>I18N.t('sym_warm','Warm Front')},
  {id:'isobar',label:()=>I18N.t('sym_isobar','Isobar')}
];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let slots=[],focusIdx=0,chosenSym=null;
let timeLeft=0,timeMax=0,roundActive=false,msgTimer=0,msgText='',flashGood=null;

function loadHi(){hi=parseInt(localStorage.getItem(HI_KEY)||'0');}
function saveHi(){if(score>hi){hi=score;localStorage.setItem(HI_KEY,hi);}}
loadHi();

function rand(a,b){return a+Math.random()*(b-a);}
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}

function buildPalette(){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  SYMS.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+'. '+s.label();
    btn.onclick=()=>selectSym(s.id);
    btn.id='sym-'+s.id;
    pal.appendChild(btn);
  });
}

function selectSym(id){
  if(!roundActive)return;
  chosenSym=id;
  document.querySelectorAll('#palette button').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('sym-'+id);
  if(el)el.classList.add('active');
  SFX.select();
}

function buildRound(){
  const count=Math.min(2+Math.floor(level/2),5);
  slots=[];
  for(let i=0;i<count;i++){
    let x,y,tries=0;
    do{x=rand(90,W-90);y=rand(70,H-70);tries++;}
    while(slots.some(s=>dist(s.x,s.y,x,y)<110)&&tries<40);
    const sym=SYMS[Math.floor(Math.random()*SYMS.length)].id;
    slots.push({x,y,sym,filled:false});
  }
  focusIdx=0;chosenSym=null;
  document.querySelectorAll('#palette button').forEach(b=>b.classList.remove('active'));
  timeMax=Math.max(6,13-level*0.5);
  timeLeft=timeMax;
  roundActive=true;
  updatePrompt();
}

function updatePrompt(){
  const remaining=slots.filter(s=>!s.filled).length;
  document.getElementById('prompt-display').textContent=
    I18N.t('slots_left_label','Slots remaining: {n}').replace('{n}',remaining);
}

function symName(id){const s=SYMS.find(s=>s.id===id);return s?s.label():id;}

function drawSymbol(sym,x,y,dim){
  ctx.save();
  ctx.globalAlpha=dim?0.9:1;
  if(sym==='high'){
    ctx.fillStyle='#4fa3ff';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('H',x,y);
  }else if(sym==='low'){
    ctx.fillStyle='#ff6b6b';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('L',x,y);
  }else if(sym==='cold'){
    ctx.strokeStyle='#4fa3ff';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x+30,y);ctx.stroke();
    ctx.fillStyle='#4fa3ff';
    for(let i=-2;i<=1;i++){
      ctx.beginPath();ctx.moveTo(x+i*15,y);ctx.lineTo(x+i*15+8,y-10);ctx.lineTo(x+i*15+16,y);ctx.closePath();ctx.fill();
    }
  }else if(sym==='warm'){
    ctx.strokeStyle='#ff914d';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x+30,y);ctx.stroke();
    ctx.fillStyle='#ff914d';
    for(let i=-2;i<=1;i++){
      ctx.beginPath();ctx.arc(x+i*15+8,y-2,7,Math.PI,0);ctx.fill();
    }
  }else if(sym==='isobar'){
    ctx.strokeStyle='#9be37b';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(x,y,34,20,0.3,0,7);ctx.stroke();
  }
  ctx.restore();
}

function drawSlot(s,i){
  const isFocus=i===focusIdx&&roundActive;
  ctx.save();
  if(!s.filled){
    const pulse=1+0.15*Math.sin(performance.now()/180);
    ctx.strokeStyle=isFocus?'#ffd54f':'#9be37b';
    ctx.lineWidth=isFocus?4:2;
    ctx.beginPath();ctx.arc(s.x,s.y,24*pulse,0,7);ctx.stroke();
    ctx.fillStyle='rgba(155,227,123,0.5)';ctx.font='12px Arial';ctx.textAlign='center';
    ctx.fillText('?',s.x,s.y+4);
  }else{
    drawSymbol(s.sym,s.x,s.y,true);
  }
  ctx.restore();
}

function slotHit(s,x,y){return dist(s.x,s.y,x,y)<30;}

function placeAt(slot){
  if(!roundActive||slot.filled)return;
  if(!chosenSym){
    msgText=I18N.t('choose_first_msg','Choose a symbol first!');
    msgTimer=0.6;flashGood=false;SFX.error();
    return;
  }
  if(chosenSym===slot.sym){
    slot.filled=true;
    score+=8*level;
    SFX.point();
    updatePrompt();
    if(slots.every(s=>s.filled))finishRound(true);
  }else{
    lives--;
    SFX.error();
    msgText=I18N.t('wrong_symbol_msg','Wrong symbol!');
    msgTimer=0.6;flashGood=false;
    if(lives<=0)finishRound(false);
  }
}

function finishRound(success){
  roundActive=false;
  if(success){
    msgText=I18N.t('map_complete_msg','Map complete!');
    flashGood=true;SFX.success();
    if(score%40<8*level)SFX.levelup();
    level=1+Math.floor(score/60);
  }else{
    msgText=I18N.t('ran_out_msg',"Time's up / out of lives!");
    flashGood=false;SFX.fail();
  }
  msgTimer=1.1;
  saveHi();
  if(lives<=0){gameOver=true;SFX.lose();}
}

function pointerToCanvas(e){
  const rect=c.getBoundingClientRect();
  return [(e.clientX-rect.left)*(W/rect.width),(e.clientY-rect.top)*(H/rect.height)];
}

function handleStart(){
  if(gameOver){reset();return;}
  if(!started){started=true;buildPalette();buildRound();}
}

c.addEventListener('click',e=>{
  if(!started||gameOver){handleStart();return;}
  if(!roundActive)return;
  const [x,y]=pointerToCanvas(e);
  const s=slots.find(s=>slotHit(s,x,y));
  if(s)placeAt(s);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started||gameOver){handleStart();return;}
  if(!roundActive)return;
  const t=e.touches[0];
  const [x,y]=pointerToCanvas(t);
  const s=slots.find(s=>slotHit(s,x,y));
  if(s)placeAt(s);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(['1','2','3','4','5','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))e.preventDefault();
  if(!started||gameOver){
    if(e.key==='Enter'||e.key===' ')handleStart();
    return;
  }
  if(!roundActive)return;
  if(['1','2','3','4','5'].includes(e.key)){
    const idx=parseInt(e.key,10)-1;
    if(SYMS[idx])selectSym(SYMS[idx].id);
  }else if(e.key==='ArrowRight'||e.key==='ArrowDown'){
    focusIdx=(focusIdx+1)%slots.length;SFX.tick();
  }else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
    focusIdx=(focusIdx-1+slots.length)%slots.length;SFX.tick();
  }else if(e.key==='Enter'||e.key===' '){
    placeAt(slots[focusIdx]);
  }
});

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;roundActive=false;slots=[];chosenSym=null;msgText='';msgTimer=0;
  document.getElementById('prompt-display').textContent='';
}

function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('hud_label','Score: {s} | Lv: {l} | Lives: {v} | Hi: {h}')
      .replace('{s}',score).replace('{l}',level).replace('{v}',lives).replace('{h}',hi);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0b2418');sky.addColorStop(1,'#163827');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(155,227,123,0.15)';ctx.lineWidth=1;
  for(let gx=0;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(let gy=0;gy<H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

  if(!started){
    ctx.fillStyle='#9be37b';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Click / Tap / Enter to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','OFF AIR'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('final_score_label','Final Score: {s}').replace('{s}',score),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Click / Tap / Enter to try again'),W/2,H/2+44);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  slots.forEach((s,i)=>drawSlot(s,i));

  if(roundActive){
    timeLeft-=1/60;
    const pct=Math.max(0,timeLeft/timeMax);
    ctx.fillStyle='#0f2a1c';ctx.fillRect(20,H-28,W-40,10);
    ctx.fillStyle=pct<0.3?'#ff6b6b':'#9be37b';
    ctx.fillRect(20,H-28,(W-40)*pct,10);
    if(timeLeft<=0)finishRound(false);
  }else if(msgTimer>0){
    msgTimer-=1/60;
    ctx.fillStyle=flashGood?'#7ec850':'#ff6b6b';
    ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(msgText,W/2,H/2);
    if(msgTimer<=0&&!gameOver)buildRound();
  }

  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
