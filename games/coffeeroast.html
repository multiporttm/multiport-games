<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b1a12;display:block;border-radius:8px;touch-action:none}
#score-display{color:#d7a86e;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Coffee Roast</div>
  <div class="game-frame">
    <div id="score-display">Perfect: 0 | Lives: 3 | Best: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and hold <b>Space</b>, <b>Click</b>, or <b>Touch</b> to keep the heat on the drum. Release inside the <b>Light</b>, <b>Medium</b>, or <b>Dark</b> roast zone to score. Go too far and the beans burn — that costs a life!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;

// Roast meter goes 0 (green/raw) to 100 (burnt/black)
const ZONES=[
  {name:'light',lo:30,hi:42,color:'#c9995a',pts:10},
  {name:'medium',lo:50,hi:62,color:'#8a5a34',pts:20},
  {name:'dark',lo:70,hi:80,color:'#4a2f1c',pts:30},
];
const BURNT=92;

let heat=0,heating=false,round=1,speed=0.35,perfect=0,lives=3,hi=0,gameOver=false,resultMsg='',resultTimer=0,drumAngle=0;

hi=parseInt(localStorage.getItem('coffeeroast_hi')||'0',10);

function reset(){
  heat=0;heating=false;round=1;speed=0.35;perfect=0;lives=3;gameOver=false;resultMsg='';resultTimer=0;
}
reset();

function colorForHeat(h){
  // interpolate green -> yellow -> tan -> brown -> dark brown -> black
  const stops=[
    {p:0,c:[46,92,58]},
    {p:20,c:[168,181,60]},
    {p:40,c:[201,153,90]},
    {p:60,c:[138,90,52]},
    {p:80,c:[74,47,28]},
    {p:100,c:[15,10,8]},
  ];
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    if(h>=a.p&&h<=b.p){
      const t=(h-a.p)/(b.p-a.p);
      const r=Math.round(a.c[0]+(b.c[0]-a.c[0])*t);
      const g=Math.round(a.c[1]+(b.c[1]-a.c[1])*t);
      const bl=Math.round(a.c[2]+(b.c[2]-a.c[2])*t);
      return `rgb(${r},${g},${bl})`;
    }
  }
  return 'rgb(15,10,8)';
}

function beginHeat(){
  if(gameOver){startGame();return;}
  heating=true;
}
function endHeat(){
  if(!heating||gameOver)return;
  heating=false;
  evaluateRelease();
}

function evaluateRelease(){
  let zone=null;
  for(const z of ZONES){ if(heat>=z.lo&&heat<=z.hi){zone=z;break;} }
  if(heat>=BURNT){
    // shouldn't normally reach here since burn auto-fails, but just in case
    fail('burnt');
    return;
  }
  if(zone){
    perfect+=1;
    if(perfect>hi){hi=perfect;localStorage.setItem('coffeeroast_hi',hi);}
    SFX.success();
    resultMsg=I18N.t('roast_success','{z} roast! +{p}').replace('{z}',zone.name.charAt(0).toUpperCase()+zone.name.slice(1)).replace('{p}',zone.pts);
    resultTimer=90;
    round++;
    speed=0.35+round*0.05;
    heat=0;
  }else{
    fail('offzone');
  }
}

function fail(reason){
  lives--;
  SFX.fail();
  resultMsg = reason==='burnt' ? I18N.t('burnt_msg','Burnt! Lost a life.') : I18N.t('offzone_msg','Not in a roast zone. Lost a life.');
  resultTimer=90;
  heat=0;
  if(lives<=0){
    gameOver=true;
    SFX.lose();
  }else{
    round++;
    speed=0.35+round*0.05;
  }
}

function startGame(){
  reset();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!heating) beginHeat();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault(); endHeat();}
});
c.addEventListener('mousedown',beginHeat);
c.addEventListener('mouseup',endHeat);
c.addEventListener('mouseleave',endHeat);
c.addEventListener('touchstart',e=>{e.preventDefault();beginHeat();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();endHeat();},{passive:false});

function drawZoneBar(){
  const barX=60,barY=340,barW=680,barH=34;
  ctx.fillStyle='#1a1008';
  ctx.fillRect(barX,barY,barW,barH);
  // gradient across full 0-100
  const grad=ctx.createLinearGradient(barX,0,barX+barW,0);
  grad.addColorStop(0,'#2e5c3a');
  grad.addColorStop(0.2,'#a8b53c');
  grad.addColorStop(0.4,'#c9995a');
  grad.addColorStop(0.6,'#8a5a34');
  grad.addColorStop(0.8,'#4a2f1c');
  grad.addColorStop(0.92,'#150a08');
  grad.addColorStop(1,'#000');
  ctx.fillStyle=grad;
  ctx.fillRect(barX,barY,barW,barH);
  // zone outlines
  ZONES.forEach(z=>{
    const x1=barX+barW*(z.lo/100), x2=barX+barW*(z.hi/100);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.strokeRect(x1,barY,x2-x1,barH);
    ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText(z.name.toUpperCase(),(x1+x2)/2,barY-6);
  });
  // burnt zone marker
  const bx=barX+barW*(BURNT/100);
  ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx,barY-2);ctx.lineTo(bx,barY+barH+2);ctx.stroke();
  // needle
  const nx=barX+barW*(Math.min(100,heat)/100);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(nx,barY-14);
  ctx.lineTo(nx-8,barY-2);
  ctx.lineTo(nx+8,barY-2);
  ctx.closePath();ctx.fill();
}

function drawDrum(){
  const cx=400,cy=180,r=110;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(drumAngle);
  // drum body colored by heat
  ctx.fillStyle=colorForHeat(Math.min(100,heat));
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5a3a24';ctx.lineWidth=6;ctx.stroke();
  // bean specks
  ctx.fillStyle='rgba(0,0,0,0.25)';
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*r*0.55,Math.sin(a)*r*0.55,10,6,a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  // flame indicator if heating
  if(heating&&!gameOver){
    ctx.fillStyle='#ff7043';
    ctx.beginPath();
    ctx.moveTo(cx-20,cy+r+20);
    ctx.quadraticCurveTo(cx,cy+r-10,cx+20,cy+r+20);
    ctx.quadraticCurveTo(cx,cy+r+40,cx-20,cy+r+20);
    ctx.fill();
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();
    ctx.moveTo(cx-10,cy+r+22);
    ctx.quadraticCurveTo(cx,cy+r+8,cx+10,cy+r+22);
    ctx.quadraticCurveTo(cx,cy+r+32,cx-10,cy+r+22);
    ctx.fill();
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0f08');bg.addColorStop(1,'#2b1a12');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(gameOver){
    drawDrum();
    drawZoneBar();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,90);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,120);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(heating){
    heat+=speed;
    drumAngle+=0.15;
    if(heat>=100){
      heat=100;
      fail('burnt');
      heating=false;
    }
  }

  drawDrum();
  drawZoneBar();

  if(resultTimer>0){
    resultTimer--;
    ctx.fillStyle='#ffd54f';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,400,50);
  } else {
    ctx.fillStyle='#d7a86e';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('roast_hint','Hold to heat — release in a colored zone!'),400,50);
  }

  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('roast_hud','Perfect: {p} | Lives: {l} | Best: {b}')
      .replace('{p}',perfect).replace('{l}',Math.max(0,lives)).replace('{b}',hi);
}

loop();
</script></body></html>
