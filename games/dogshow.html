<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Dog Show</title><meta name="description" content="Play Dog Show free online — Press Space or Up Arrow or Tap to jump hurdles, use Left/Right Arrow to weave through poles, and race the clock through the tunnel."><link rel="canonical" href="https://games.multiportllc.com/games/dogshow"><meta property="og:title" content="Dog Show - Multiport Games"><meta property="og:description" content="Play Dog Show free online — Press Space or Up Arrow or Tap to jump hurdles, use Left/Right Arrow to weave through poles, and race the clock through the tunnel."><meta property="og:url" content="https://games.multiportllc.com/games/dogshow"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Dog Show","description":"Play Dog Show free online instantly. Guide your dog through an agility course — jump hurdles, weave through poles, and race through the tunnel against the clock. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/dogshow","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#2e7d32,#a1887f);display:block;border-radius:8px}
#score-display{color:#a5d6a7;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dog Show</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="250"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Up Arrow</b> or <b>Tap</b> to jump hurdles. Use <b>Left/Right Arrow</b> (or tap left/right side) to weave through the poles at the right moment. Run through the tunnel and race the clock!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const ground=200;
let hi=parseInt(localStorage.getItem('dogshow_hi')||'0',10);
let bestTime=parseFloat(localStorage.getItem('dogshow_besttime')||'0');
let score=0,elapsed=0,gameOver=false,started=false,won=false,spd=5.2,frame=0;
const COURSE_LEN=6000; // world units
let worldX=0;
let dog={x:80,y:ground,w:40,h:32,vy:0,jumps:0,lane:0}; // lane: -1 left,0 center,1 right during weave
let obstacles=[]; // {type:'hurdle'|'weave'|'tunnel', wx, w, h, hit:false, cleared:false, state}
let clean=true;

function buildCourse(){
  obstacles=[];
  let x=600;
  for(let i=0;i<3;i++){obstacles.push({type:'hurdle',wx:x,w:24,h:44,hit:false,cleared:false});x+=500+Math.random()*200;}
  obstacles.push({type:'weave',wx:x,w:220,h:60,hit:false,cleared:false,step:0,dir:1,timer:0});x+=500;
  obstacles.push({type:'tunnel',wx:x,w:140,h:60,hit:false,cleared:false,inside:false});x+=500;
  for(let i=0;i<2;i++){obstacles.push({type:'hurdle',wx:x,w:24,h:44,hit:false,cleared:false});x+=500+Math.random()*200;}
  obstacles.push({type:'weave',wx:x,w:220,h:60,hit:false,cleared:false,step:0,dir:1,timer:0});x+=520;
}

function reset(){
  worldX=0;score=0;elapsed=0;gameOver=false;started=false;won=false;spd=5.2;frame=0;clean=true;
  dog.y=ground;dog.vy=0;dog.jumps=0;dog.lane=0;
  buildCourse();
}
reset();

function jump(){
  if(gameOver){reset();return;}
  if(!started)started=true;
  if(dog.jumps<1){dog.vy=-13;dog.jumps++;SFX.jump();}
}
function weaveLeft(){ if(!started)started=true; if(gameOver){reset();return;} dog.lane=-1; }
function weaveRight(){ if(!started)started=true; if(gameOver){reset();return;} dog.lane=1; }

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='ArrowLeft'){e.preventDefault();weaveLeft();}
  else if(e.code==='ArrowRight'){e.preventDefault();weaveRight();}
});
c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();const x=e.clientX-r.left;
  if(x<c.width*0.33)weaveLeft();else if(x>c.width*0.66)weaveRight();else jump();
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];const r=c.getBoundingClientRect();const x=t.clientX-r.left;
  if(x<c.width*0.33)weaveLeft();else if(x>c.width*0.66)weaveRight();else jump();
},{passive:false});

function drawDog(){
  ctx.save();
  const laneOffsetY = dog.lane!==0 ? 4 : 0;
  ctx.fillStyle='#c98a4b';
  ctx.fillRect(dog.x,dog.y+laneOffsetY,dog.w,dog.h);
  ctx.fillRect(dog.x+dog.w-8,dog.y-14+laneOffsetY,18,18); // head
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(dog.x+dog.w+2,dog.y-16+laneOffsetY,6,10); // ear
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(dog.x+dog.w+8,dog.y-10+laneOffsetY,4,4); // eye
  const legOff=Math.floor(frame/5)%2===0?0:6;
  ctx.fillStyle='#8a5a2a';
  ctx.fillRect(dog.x+4,dog.y+dog.h+laneOffsetY,8,10+legOff);
  ctx.fillRect(dog.x+dog.w-12,dog.y+dog.h+laneOffsetY,8,10+(6-legOff));
  ctx.restore();
}

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function screenX(wx){ return wx-worldX; }

function drawHurdle(o){
  const sx=screenX(o.wx);
  if(sx<-40||sx>840)return;
  ctx.fillStyle=o.hit?'#e94560':'#fff5cc';
  ctx.fillRect(sx,ground+dog.h-o.h,o.w,o.h);
  ctx.fillStyle='#d2691e';
  ctx.fillRect(sx-4,ground+dog.h-o.h,o.w+8,6);
}
function drawWeave(o){
  const sx=screenX(o.wx);
  if(sx<-240||sx>840)return;
  const poleCount=5;
  for(let i=0;i<poleCount;i++){
    const px=sx+i*(o.w/(poleCount-1));
    ctx.fillStyle='#795548';
    ctx.fillRect(px-3,ground+dog.h-40,6,40);
  }
}
function drawTunnel(o){
  const sx=screenX(o.wx);
  if(sx<-160||sx>840)return;
  ctx.fillStyle='#4e342e';
  ctx.fillRect(sx,ground+dog.h-o.h,o.w,o.h);
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(sx+10,ground+dog.h-o.h+10,o.w-20,o.h-14);
}

function loop(){
  ctx.clearRect(0,0,800,250);
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#8fd3f4');sky.addColorStop(1,'#c9e8b8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,250);
  ctx.fillStyle='#7cb342';ctx.fillRect(0,ground+dog.h,800,50);
  ctx.fillStyle='#558b2f';ctx.fillRect(0,ground+dog.h,800,4);

  const progressPct=Math.min(100,Math.floor(worldX/COURSE_LEN*100));

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(won?I18N.t('course_complete','COURSE COMPLETE!'):I18N.t('game_over_title','GAME OVER'),400,110);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,145);
    updateHud();
    requestAnimationFrame(loop);return;
  }
  if(!started){
    ctx.fillStyle='#22222299';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),400,120);
    drawDog();
    requestAnimationFrame(loop);
    return;
  }

  frame++;
  elapsed+=1/60;
  worldX+=spd;
  spd=Math.min(9,5.2+worldX/2500);

  // gravity
  dog.vy+=0.75;
  dog.y+=dog.vy;
  if(dog.y>=ground){dog.y=ground;dog.vy=0;dog.jumps=0;}

  const dogHit={x:dog.x+4,y:dog.y-13,w:dog.w+4,h:dog.h+13};

  obstacles.forEach(o=>{
    if(o.type==='hurdle'){
      drawHurdle(o);
      const box={x:o.wx-worldX,y:ground+dog.h-o.h,w:o.w,h:o.h};
      if(!o.cleared&&o.wx<worldX-o.w-dog.w){o.cleared=true;score+=20;SFX.point();}
      if(rect(dogHit,box)&&!o.hit){o.hit=true;clean=false;score=Math.max(0,score-5);SFX.hit();}
    } else if(o.type==='weave'){
      drawWeave(o);
      const startX=o.wx-worldX, endX=startX+o.w;
      if(startX<dog.x+dog.w&&endX>dog.x){
        // inside weave zone: require alternating lane taps
        o.timer=(o.timer||0)+1;
        if(o.timer%40===0){
          const need=o.dir;
          if(dog.lane===need){o.dir*=-1;score+=8;SFX.tick();}
          else if(!o.hit){o.hit=true;clean=false;score=Math.max(0,score-5);SFX.error();}
        }
      } else if(endX<=dog.x&&!o.cleared){
        o.cleared=true;dog.lane=0;
        if(!o.hit)score+=15;
      }
    } else if(o.type==='tunnel'){
      drawTunnel(o);
      const startX=o.wx-worldX, endX=startX+o.w;
      if(startX<dog.x+dog.w&&endX>dog.x){
        o.inside=true;
      } else if(o.inside&&!o.cleared){
        o.cleared=true;o.inside=false;score+=25;SFX.point();
      }
    }
  });

  drawDog();

  if(worldX>=COURSE_LEN&&!gameOver){
    gameOver=true;won=true;
    const timeBonus=Math.max(0,Math.floor(2000-elapsed*10));
    score+=timeBonus+(clean?100:0);
    if(score>hi){hi=score;localStorage.setItem('dogshow_hi',hi);}
    if(bestTime===0||elapsed<bestTime){bestTime=elapsed;localStorage.setItem('dogshow_besttime',bestTime.toFixed(2));}
    SFX.win();
  }

  // progress bar
  ctx.fillStyle='#0006';ctx.fillRect(20,14,300,10);
  ctx.fillStyle='#ffd54f';ctx.fillRect(20,14,300*progressPct/100,10);

  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  if(gameOver&&!won&&score>hi){hi=score;localStorage.setItem('dogshow_hi',hi);}
  document.getElementById('score-display').textContent =
    I18N.t('dogshow_hud','Score: {s} | Hi: {h} | Best Time: {t}')
      .replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi))
      .replace('{t}',bestTime>0?bestTime.toFixed(1)+'s':'--');
}

loop();
</script></body></html>
