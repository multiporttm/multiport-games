<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#1a1a2e,#e94560);border-radius:14px;padding:22px;text-align:center;max-width:560px;margin:0 auto}
#hud{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:.95rem;margin-bottom:10px}
#hud span{background:rgba(0,0,0,.3);padding:4px 10px;border-radius:8px}
#timerWrap{height:8px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;margin-bottom:16px}
#timerBar{height:100%;background:#ffd54f;width:100%;transition:width .1s linear}
#emojis{font-size:3.4rem;letter-spacing:.15em;margin:20px 0;min-height:4.2rem}
#options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:#fff;color:#222;border:none;border-radius:10px;padding:14px 8px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt.correct{background:#4caf50;color:#fff}
.opt.wrong{background:#e94560;color:#fff}
#msg{color:#fff;font-weight:800;min-height:1.6em;margin-top:12px}
#overlay{color:#fff;font-weight:900;font-size:1.3rem;margin-top:14px}
#overlay button{margin-top:10px;padding:10px 26px;border:none;border-radius:20px;background:#ffd54f;color:#222;font-weight:800;cursor:pointer;font-size:1rem}
@media(max-width:480px){#emojis{font-size:2.4rem}#options{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Movie Emoji Quiz</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="hud"><span id="scoreDisp">Score: 0</span><span id="streakDisp">Streak: 0</span><span id="livesDisp">Lives: 3</span></div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="emojis">🎬</div>
      <div id="options"></div>
      <div id="msg"></div>
      <div id="overlay" style="display:none"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the emoji clue and click the matching movie title from the 4 choices before the <b>timer</b> runs out. Correct guesses score points and build a <b>streak</b> bonus; a wrong answer or timeout costs a <b>life</b>.</div>
</div>
<script>
const MOVIES=[
["The Lion King","🦁👑🌅"],["Titanic","🚢🧊💔"],["Jaws","🦈🌊🏊"],["Frozen","❄️👸⛄"],
["Finding Nemo","🐠🔍🌊"],["The Matrix","💊🕶️🖥️"],["Jurassic Park","🦖🏝️🚙"],["Toy Story","🤠🚀🧸"],
["Cars","🏎️🔧🏁"],["Up","🎈🏠👴"],["The Wizard of Oz","🌪️👠🧙"],["Home Alone","🏠🧒🔨"],
["Ratatouille","🐀🍳👨‍🍳"],["The Godfather","🐴🔫🍝"],["King Kong","🦍🏙️✈️"],["Alice in Wonderland","🐇🕳️🎩"],
["Cinderella","👠🎃👗"],["Pinocchio","🪵👃🎪"],["Dracula","🦇🧛🌙"],["The Mummy","🐫🏺🧟"],
["Shark Tale","🦈🐠🎤"],["Cast Away","🏝️⚽🌴"],["The Little Mermaid","🧜‍♀️🐚🌊"],["Avatar","💙🌴👽"],
["Rocky","🥊👊🏆"],["Sing","🎤🐷🎶"],["Moana","🌊⛵🌺"],["Zootopia","🦊🐰🏙️"],
["The Karate Kid","🥋🦵🇯🇵"],["Pirates of the Caribbean","🏴‍☠️⚓🦜"],["Ghost","👻🏺💑"],
["The Fast and the Furious","🏎️💨🔧"],["Grease","🚗🎸💋"],["Snow White","🍎👗7️⃣"],["Ice Age","🧊🐘🌰"]
];
let deck=[],round=null,score=0,streak=0,lives=3,timeLeft=0,timerId=null,over=false;
const ROUND_MS=8000;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newDeck(){deck=shuffle(MOVIES.slice());}

function nextRound(){
  if(over)return;
  if(!deck.length)newDeck();
  const pick=deck.pop();
  const wrongPool=shuffle(MOVIES.filter(m=>m[0]!==pick[0])).slice(0,3);
  const opts=shuffle([pick,...wrongPool]);
  round={answer:pick[0],emoji:pick[1],opts:opts.map(o=>o[0])};
  document.getElementById('emojis').textContent=round.emoji;
  const optWrap=document.getElementById('options');
  optWrap.innerHTML='';
  round.opts.forEach(title=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=title;
    b.onclick=()=>choose(title,b);
    optWrap.appendChild(b);
  });
  document.getElementById('msg').textContent='';
  startTimer();
}

function startTimer(){
  clearInterval(timerId);
  timeLeft=ROUND_MS;
  document.getElementById('timerBar').style.width='100%';
  const t0=performance.now();
  timerId=setInterval(()=>{
    const elapsed=performance.now()-t0;
    const pct=Math.max(0,1-elapsed/ROUND_MS);
    document.getElementById('timerBar').style.width=(pct*100)+'%';
    if(pct<=0){
      clearInterval(timerId);
      timeout();
    }
  },50);
}

function timeout(){
  if(over)return;
  streak=0;
  loseLife(I18N.t('time_up_msg','⏰ Time\'s up! It was "{a}"').replace('{a}',round.answer));
}

function choose(title,btn){
  if(over||!round)return;
  clearInterval(timerId);
  const buttons=[...document.querySelectorAll('.opt')];
  buttons.forEach(b=>{b.disabled=true;if(b.textContent===round.answer)b.classList.add('correct');});
  if(title===round.answer){
    streak++;
    const bonus=10+Math.min(streak,10)*5;
    score+=bonus;
    SFX.success();
    document.getElementById('msg').textContent=I18N.t('correct_msg','✅ Correct! +{b} (streak {s})').replace('{b}',bonus).replace('{s}',streak);
    updateHud();
    setTimeout(nextRound,900);
  }else{
    btn.classList.add('wrong');
    SFX.error();
    streak=0;
    loseLife(I18N.t('wrong_msg','❌ Wrong! It was "{a}"').replace('{a}',round.answer));
  }
}

function loseLife(msg){
  lives--;
  document.getElementById('msg').textContent=msg;
  updateHud();
  if(lives<=0){
    endGame();
  }else{
    setTimeout(nextRound,1100);
  }
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',score);
  document.getElementById('streakDisp').textContent=I18N.t('streak_label','Streak: {s}').replace('{s}',streak);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}',Math.max(0,lives));
}

function endGame(){
  over=true;
  clearInterval(timerId);
  const hi=Math.max(score,parseInt(localStorage.getItem('moviequiz_hi')||'0',10));
  localStorage.setItem('moviequiz_hi',hi);
  SFX.lose();
  document.getElementById('options').innerHTML='';
  document.getElementById('emojis').textContent='🎬';
  document.getElementById('msg').textContent='';
  const ov=document.getElementById('overlay');
  ov.style.display='block';
  ov.innerHTML=`${I18N.t('game_over_title','GAME OVER')}<br>${I18N.t('final_score_label','Final Score: {s}').replace('{s}',score)}<br>${I18N.t('high_score_label','High Score: {h}').replace('{h}',hi)}<br><button id="restartBtn">${I18N.t('play_again_btn','Play Again')}</button>`;
  document.getElementById('restartBtn').onclick=restart;
}

function restart(){
  score=0;streak=0;lives=3;over=false;
  document.getElementById('overlay').style.display='none';
  updateHud();
  newDeck();
  nextRound();
}

updateHud();
newDeck();
nextRound();
</script></body></html>
