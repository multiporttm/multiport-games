<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Dry Dock Scheduling</title><meta name="description" content="Play Dry Dock Scheduling free online — Match each ship to the right dry dock slot and keep the shipyard's docks full without conflicts."><link rel="canonical" href="https://games.multiportllc.com/games/drydockscheduling"><meta property="og:title" content="Dry Dock Scheduling - Multiport Games"><meta property="og:description" content="Play Dry Dock Scheduling free online — Match each ship to the right dry dock slot and keep the shipyard's docks full without conflicts."><meta property="og:url" content="https://games.multiportllc.com/games/drydockscheduling"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Dry Dock Scheduling","description":"Play Dry Dock Scheduling free online instantly. Schedule ships into a shipyard's dry docks for repair, matching each ship's size and required repair duration to the smallest free dock that fits, or holding it at the pier when none is free, to keep the yard's docks full and ships moving through on time. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/drydockscheduling","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#262a3d;display:block;border-radius:8px;touch-action:none}
#hud{color:#ef8354;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#80deea}
#hud span.hs{color:#7ec850}
#choiceBtns{display:flex;justify-content:center;gap:10px;padding:6px 10px;flex-wrap:wrap}
#choiceBtns button{padding:10px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.9rem;color:#fff;background:#2b2d42}
#choiceBtns button:active{transform:scale(0.95)}
#choiceBtns button.wait{background:#6c757d}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Dry Dock Scheduling</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="choiceBtns"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Each ship needs a dry dock that fits its size. Send it to the <b>smallest free dock</b> that can hold it: press <b>1/2/3</b> for Dock A/B/C, or <b>4</b> to hold it at the pier if no dock fits. Docks stay busy for the repair's duration — plan ahead!</div>
</div>
<script>
(function(){
const HS_KEY='drydockscheduling_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;

const DOCKS=[
  {key:'A',cap:1,label:'Dock A (Small)'},
  {key:'B',cap:2,label:'Dock B (Medium)'},
  {key:'C',cap:3,label:'Dock C (Large)'}
];
const SIZES=[{code:'S',cap:1,label:'Small'},{code:'M',cap:2,label:'Medium'},{code:'L',cap:3,label:'Large'}];
const SHIP_NAMES=['Rustbucket','Tidecrawler','Ironhull','Graywake','Saltspray','Oakbreaker','Fogrunner','Keelhaul'];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let busy=[0,0,0]; // rounds remaining busy for each dock
let ship=null,timeLeft=0,timeLimit=0,resolved=false,survey=0,surveyDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function buildButtons(){
  const el=document.getElementById('choiceBtns');
  el.innerHTML='';
  DOCKS.forEach((d,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+I18N.t('dock_'+d.key,d.label);
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(i);});
    el.appendChild(btn);
  });
  const wait=document.createElement('button');
  wait.className='wait';
  wait.textContent='4 '+I18N.t('hold_pier','Hold at Pier');
  wait.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(3);});
  el.appendChild(wait);
}

function tickBusy(){ busy=busy.map(b=>Math.max(0,b-1)); }

function newShip(){
  tickBusy();
  timeLimit=Math.max(200,460-level*20);
  timeLeft=timeLimit;
  survey=0;surveyDone=false;resolved=false;
  const sz=SIZES[Math.floor(Math.random()*SIZES.length)];
  const name=SHIP_NAMES[Math.floor(Math.random()*SHIP_NAMES.length)];
  const duration=2+Math.floor(Math.random()*3);
  ship={name,size:sz,duration};
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;busy=[0,0,0];newShip(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function bestDockIndex(){
  let best=-1;
  for(let i=0;i<DOCKS.length;i++){
    if(busy[i]>0)continue;
    if(DOCKS[i].cap>=ship.size.cap){
      if(best===-1||DOCKS[i].cap<DOCKS[best].cap)best=i;
    }
  }
  return best;
}

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newShip();
}

function passRound(assignedIdx){
  score+=25*level;SFX.coin();
  if(assignedIdx>=0)busy[assignedIdx]=ship.duration;
  if(score>=level*260)levelUp();
  newShip();
}

function onGuess(i){
  if(!started||gameOver)return;
  if(!surveyDone||resolved)return;
  resolved=true;
  const correctIdx=bestDockIndex();
  if(i===3){
    if(correctIdx===-1){ passRound(-1); } else { failRound(); }
    return;
  }
  if(i===correctIdx){ passRound(i); } else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m&&started&&!gameOver){ e.preventDefault(); onGuess(parseInt(m[1],10)-1); }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawDocks(){
  const bw=190,bh=100,gap=25,startX=(W-(bw*3+gap*2))/2,y=150;
  DOCKS.forEach((d,i)=>{
    const x=startX+i*(bw+gap);
    const isBusy=busy[i]>0;
    ctx.fillStyle=isBusy?'#5d4037':'#33415c';
    ctx.fillRect(x,y,bw,bh);
    ctx.strokeStyle='#ef8354';ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('dock_'+d.key,d.label),x+bw/2,y+28);
    ctx.font='14px Arial';
    ctx.fillStyle=isBusy?'#ffab91':'#9ef5c7';
    ctx.fillText(isBusy?I18N.t('busy_label','BUSY ({n})').replace('{n}',busy[i]):I18N.t('free_label','FREE'),x+bw/2,y+58);
  });
}

function drawShip(){
  if(!ship)return;
  const cx=W/2,cy=60;
  ctx.save();
  ctx.fillStyle='#cfd8dc';
  ctx.beginPath();ctx.moveTo(cx-60,cy);ctx.lineTo(cx+60,cy);ctx.lineTo(cx+45,cy+22);ctx.lineTo(cx-45,cy+22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#546e7a';ctx.fillRect(cx-20,cy-18,40,18);
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  if(surveyDone){
    ctx.fillText(ship.name,cx,cy+48);
    ctx.font='15px Arial';ctx.fillStyle='#ffe082';
    ctx.fillText(I18N.t('size_dur_label','Size: {s} · Repair: {d} rounds').replace('{s}',I18N.t('size_'+ship.size.code,ship.size.label)).replace('{d}',ship.duration),cx,cy+70);
  } else {
    ctx.fillText(I18N.t('inbound_hint','Ship inbound for survey...'),cx,cy+48);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#15182a');bg.addColorStop(1,'#262a3d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#ef8354';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawDocks();drawShip();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!surveyDone){
    survey+=0.02+level*0.002;
    if(survey>=1){survey=1;surveyDone=true;SFX.point();}
  } else {
    timeLeft--;
    if(timeLeft<=0){ failRound(); }
  }

  drawDocks();
  drawShip();

  ctx.fillStyle='#b2dfdb';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(surveyDone?I18N.t('pick_hint','Assign a dock — press 1-4 or tap below'):I18N.t('survey_wait','Surveying ship for repairs...'),W/2,318);

  if(surveyDone){
    const barW=400,barH=8,barX=W/2-barW/2,barY=300;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
