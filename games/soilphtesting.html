<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Soil pH Testing</title><meta name="description" content="Play Soil pH Testing free online — Read each plot's pH and mineral results, then choose lime, sulfur, compost, or none before planting season."><link rel="canonical" href="https://games.multiportllc.com/games/soilphtesting"><meta property="og:title" content="Soil pH Testing - Multiport Games"><meta property="og:description" content="Play Soil pH Testing free online — Read each plot's pH and mineral results, then choose lime, sulfur, compost, or none before planting season."><meta property="og:url" content="https://games.multiportllc.com/games/soilphtesting"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Soil pH Testing","description":"Play Soil pH Testing free online instantly. Read each plot's pH and mineral results, then choose lime, sulfur, compost, or none before planting season. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/soilphtesting","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a2016;display:block;border-radius:8px}
#score-display{color:#a3d977;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Soil pH Testing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read each plot's <b>pH</b> and <b>mineral content</b>, then press <b>1</b>-<b>4</b> or <b>tap</b> a button to apply <b>Lime</b> (raise low pH), <b>Sulfur</b> (lower high pH), <b>Compost</b> (fix low minerals), or <b>None</b> (soil is already ideal) — before the timer runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const AMENDMENTS=['Lime','Sulfur','Compost','None'];
let plotNum=0,ph=6.5,mineral='Medium',correct=0;
let score=0,hi=parseInt(localStorage.getItem('hi_soilphtesting')||'0',10);
let lives=3,level=1,streak=0,gameOver=false,started=false;
let timer=0,timerMax=0,lastTime=null,flashTimer=0,flashMsg='',flashGood=true,answeredIdx=-1,answerAnim=0;

function correctAnswer(){
  if(ph<6.0)return 0; // Lime
  if(ph>7.5)return 1; // Sulfur
  if(mineral==='Low')return 2; // Compost
  return 3; // None
}

function newSample(){
  plotNum++;
  ph=Math.round((4.5+Math.random()*4.0)*10)/10;
  const roll=Math.random();
  mineral=roll<0.34?'Low':(roll<0.67?'Medium':'High');
  correct=correctAnswer();
  timerMax=Math.max(170,420-level*22);
  timer=timerMax;
  answeredIdx=-1;answerAnim=0;
}

function reset(){
  score=0;lives=3;level=1;streak=0;plotNum=0;gameOver=false;started=false;lastTime=null;
  newSample();
}
reset();

function flash(msg,good){flashMsg=msg;flashGood=good;flashTimer=60;}

function endGame(){
  gameOver=true;SFX.lose();
  if(score>hi){hi=score;localStorage.setItem('hi_soilphtesting',String(hi));}
}

function answer(idx){
  if(answeredIdx!==-1)return;
  answeredIdx=idx;answerAnim=30;
  if(idx===correct){
    streak++;
    score+=15*level+Math.floor(timer/12);
    SFX.success();
    flash(I18N.t('correct_amendment','Correct treatment!'),true);
    if(streak%5===0){level++;SFX.levelup();flash(I18N.t('level_up','Level {n}!').replace('{n}',level),true);}
  }else{
    streak=0;
    lives--;
    SFX.fail();
    flash(I18N.t('wrong_amendment','Wrong choice — plot damaged!'),false);
    if(lives<=0){endGame();return;}
  }
  setTimeout(()=>{ if(!gameOver) newSample(); },650);
}

document.addEventListener('keydown',e=>{
  if(!started){started=true;return;}
  if(gameOver){if(e.code==='Space'||e.code==='Enter')reset();return;}
  if(e.key>='1'&&e.key<='4')answer(parseInt(e.key,10)-1);
});

function buttonRect(i){
  const bw=170,gap=20,totalW=4*bw+3*gap,startX=(W-totalW)/2;
  return {x:startX+i*(bw+gap),y:320,w:bw,h:60};
}
function inRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}

function handlePointer(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  for(let i=0;i<4;i++){
    if(inRect(x,y,buttonRect(i))){answer(i);return;}
  }
}

c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect();
  handlePointer((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];const r=c.getBoundingClientRect();
  handlePointer((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1c150d');bg.addColorStop(1,'#2a2016');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('vineyard_title','Vineyard Soil Lab'),W/2,32);
  ctx.font='14px Arial';
  ctx.fillText(I18N.t('lives_level_label','Lives: {l}  Level: {v}').replace('{l}','❤️'.repeat(Math.max(0,lives))).replace('{v}',level),W/2,54);

  if(!started){
    ctx.fillStyle='#a3d977';ctx.font='bold 22px Arial';
    ctx.fillText(I18N.t('start_hint4','Press any key or Tap to start'),W/2,H/2);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,180);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,216);
    document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
    requestAnimationFrame(loop);return;
  }

  if(answeredIdx===-1){
    timer-=dt;
    if(timer<=0){
      answeredIdx=-2;
      streak=0;lives--;
      SFX.fail();
      flash(I18N.t('timeout_msg','Too slow — sample spoiled!'),false);
      if(lives<=0){endGame();}else{setTimeout(()=>{ if(!gameOver) newSample(); },650);}
    }
  }

  // timer bar
  ctx.fillStyle='#1a1a1a';ctx.fillRect(100,66,600,14);
  ctx.fillStyle=timer/timerMax>0.3?'#7ec850':'#e05050';
  ctx.fillRect(100,66,600*Math.max(0,timer/timerMax),14);

  // sample card
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(220,100,360,180);
  ctx.strokeStyle='#5a4a30';ctx.lineWidth=2;ctx.strokeRect(220,100,360,180);
  ctx.fillStyle='#ffd54f';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('plot_label','Plot #{n}').replace('{n}',plotNum),W/2,130);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';
  ctx.fillText(I18N.t('ph_label','pH {v}').replace('{v}',ph.toFixed(1)),W/2,175);
  ctx.font='20px Arial';
  ctx.fillText(I18N.t('mineral_'+mineral.toLowerCase(),'Minerals: '+mineral),W/2,215);
  if(answeredIdx>=0){
    ctx.font='16px Arial';
    ctx.fillStyle=answeredIdx===correct?'#7ec850':'#e05050';
    ctx.fillText(answeredIdx===correct?I18N.t('correct_label','Correct!'):I18N.t('needed_label','Needed: {a}').replace('{a}',I18N.t('amend_'+AMENDMENTS[correct].toLowerCase(),AMENDMENTS[correct])),W/2,255);
  }

  for(let i=0;i<4;i++){
    const r=buttonRect(i);
    let col='#3a5a2a';
    if(answeredIdx!==-1){
      if(i===correct)col='#2e8b3d';
      else if(i===answeredIdx)col='#8a2222';
      else col='#2a2a2a';
    }
    ctx.fillStyle=col;ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle='#dde';ctx.lineWidth=1;ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('amend_'+AMENDMENTS[i].toLowerCase(),AMENDMENTS[i]),r.x+r.w/2,r.y+28);
    ctx.font='11px Arial';
    ctx.fillText('['+(i+1)+']',r.x+r.w/2,r.y+46);
  }

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/20);
    ctx.fillStyle=flashGood?'#7ec850':'#e05050';
    ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H-20);
    ctx.globalAlpha=1;
  }

  if(score>hi){hi=score;localStorage.setItem('hi_soilphtesting',String(hi));}
  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
