<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#2b1b4e,#4a2d6e);display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffd54f;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#pumpBtn{display:block;margin:10px auto 0;padding:14px 34px;background:#e94560;border:none;border-radius:24px;color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer;user-select:none;touch-action:none}
#pumpBtn:active{background:#ff6b85}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Balloon Twisting Inflation Control</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="330"></canvas>
    <button id="pumpBtn">PUMP (Hold Space)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Space</b> or the <b>Pump</b> button to inflate each balloon. Release inside the <b>green safe zone</b> on the gauge to tie it off and pass it on. Overshoot into the <b>red zone</b> and it pops! More balloons and tighter safe zones each round.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=330;
const KEY='balloontwistinginflationcontrol_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let round=1,score=0,balloonsLeft=0,balloonsTotal=0;
let size=0,growSpeed=0,pumping=false,state='ready'; // ready, inflating, popped, passed, gameover
let safeLo=0,safeHi=0,popAt=0;
let stateTimer=0;
let shake=0;
const colors=['#ff4d6d','#4dd2ff','#ffd54f','#7ed957','#c77dff','#ff9f4d'];
let balloonColor=colors[0];
let particles=[];

function newRound(){
  balloonsTotal=3+round;
  balloonsLeft=balloonsTotal;
  nextBalloon();
}
function nextBalloon(){
  if(balloonsLeft<=0){
    round++;
    setTimeout(()=>{ newRound(); },800);
    state='roundclear';
    SFX.levelup();
    stateTimer=0;
    return;
  }
  size=0;
  growSpeed=0.9+round*0.08;
  popAt=70-Math.min(round*1.2,25); // max safe size shrinks as rounds progress
  const zoneWidth=Math.max(7,18-round*1.1);
  const center=popAt-zoneWidth/2-2-Math.random()*6;
  safeLo=Math.max(20,center-zoneWidth/2);
  safeHi=safeLo+zoneWidth;
  balloonColor=colors[Math.floor(Math.random()*colors.length)];
  state='inflating';
  pumping=false;
}

function pop(){
  state='popped';
  stateTimer=0;
  SFX.hurt();
  shake=14;
  particles=[];
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
    particles.push({x:W/2,y:H/2-30,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30,color:balloonColor});
  }
}
function passBalloon(){
  state='passed';
  stateTimer=0;
  balloonsLeft--;
  score+=10+round*2;
  if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
  SFX.success();
}

function startPump(){
  if(state==='inflating'){pumping=true;}
  else if(state==='ready'||state==='gameover'){
    if(state==='gameover'){score=0;round=1;}
    newRound();
  }
}
function stopPump(){
  pumping=false;
  if(state==='inflating'){
    if(size>=popAt){pop();}
    else if(size>=safeLo&&size<=safeHi){passBalloon();}
    else{
      // released too early — balloon deflates, counts as a miss but no life lost, just retry same balloon
      state='early';
      stateTimer=0;
      SFX.error();
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!pumping)startPump();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();stopPump();}});
const pumpBtn=document.getElementById('pumpBtn');
pumpBtn.addEventListener('mousedown',e=>{e.preventDefault();startPump();});
pumpBtn.addEventListener('mouseup',e=>{e.preventDefault();stopPump();});
pumpBtn.addEventListener('mouseleave',e=>{if(pumping)stopPump();});
pumpBtn.addEventListener('touchstart',e=>{e.preventDefault();startPump();},{passive:false});
pumpBtn.addEventListener('touchend',e=>{e.preventDefault();stopPump();},{passive:false});
c.addEventListener('touchstart',e=>{e.preventDefault();startPump();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();stopPump();},{passive:false});

function drawBalloon(bsize,col,wobble){
  const cx=W/2+wobble,cy=H/2-30;
  const r=20+bsize*1.6;
  ctx.save();
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.ellipse(cx,cy,r*0.82,r,0,0,Math.PI*2);
  ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx-r*0.28,cy-r*0.4,r*0.18,r*0.28,0,0,Math.PI*2);
  ctx.fill();
  // knot
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(cx-6,cy+r);
  ctx.lineTo(cx+6,cy+r);
  ctx.lineTo(cx,cy+r+10);
  ctx.fill();
  // string
  ctx.strokeStyle='rgba(255,255,255,0.4)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx,cy+r+10);
  ctx.quadraticCurveTo(cx+10,cy+r+40,cx,cy+r+70);
  ctx.stroke();
  ctx.restore();
}

function drawGauge(){
  const gx=120,gy=300,gw=560,gh=18;
  ctx.save();
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(gx-4,gy-4,gw+8,gh+8);
  const maxSize=90;
  function xAt(v){return gx+(v/maxSize)*gw;}
  // red zone from popAt to max
  ctx.fillStyle='#4a1020';
  ctx.fillRect(xAt(popAt),gy,gw-(xAt(popAt)-gx),gh);
  // base track
  ctx.fillStyle='#333355';
  ctx.fillRect(gx,gy,xAt(popAt)-gx,gh);
  // safe zone
  ctx.fillStyle='#4caf50';
  ctx.fillRect(xAt(safeLo),gy,xAt(safeHi)-xAt(safeLo),gh);
  // pop line
  ctx.strokeStyle='#ff4d6d';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(xAt(popAt),gy-4);ctx.lineTo(xAt(popAt),gy+gh+4);ctx.stroke();
  // current fill marker
  const curX=Math.min(xAt(size),gx+gw);
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(curX-2,gy-8,4,gh+16);
  ctx.restore();
}

function loop(){
  shake*=0.85;
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(sx,sy);
  // background
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#2b1b4e');sky.addColorStop(1,'#4a2d6e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // confetti dots bg
  for(let i=0;i<40;i++){
    ctx.fillStyle=`hsla(${(i*47)%360},80%,65%,0.15)`;
    ctx.beginPath();ctx.arc((i*83)%W,(i*131)%H,3,0,7);ctx.fill();
  }

  if(state==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('inflate_start_hint','Hold Space or tap PUMP to start'),W/2,H/2-40);
  } else if(state==='gameover'){
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-40);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint2','Hold Space or tap PUMP to restart'),W/2,H/2);
  } else if(state==='popped'){
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;
      ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/30);
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.globalAlpha=1;
    });
    particles=particles.filter(p=>p.life>0);
    ctx.fillStyle='#ff4d6d';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('popped_label','POP!'),W/2,100);
    stateTimer++;
    if(stateTimer>55){state='gameover';}
    drawGauge();
  } else if(state==='early'){
    drawBalloon(size,balloonColor,0);
    drawGauge();
    ctx.fillStyle='#ffd54f';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('too_early_label','Too early! Try again'),W/2,100);
    stateTimer++;
    if(stateTimer>40){state='inflating';size=0;}
  } else if(state==='passed'){
    drawBalloon(size,balloonColor,0);
    drawGauge();
    ctx.fillStyle='#7ed957';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('nice_tie_label','Nice tie-off!'),W/2,100);
    stateTimer++;
    if(stateTimer>35){nextBalloon();}
  } else if(state==='roundclear'){
    ctx.fillStyle='#4dd2ff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('round_clear_label','Round Clear!'),W/2,H/2-10);
  } else if(state==='inflating'){
    if(pumping){
      size+=growSpeed;
      if(Math.random()<0.4)SFX.tick();
      if(size>=popAt){pop();}
    }
    const wobble=pumping?Math.sin(Date.now()/40)*3:0;
    drawBalloon(size,balloonColor,wobble);
    drawGauge();
    ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('balloons_left_label','Balloons left: {n}').replace('{n}',balloonsLeft),W/2,40);
  }

  ctx.restore();
  document.getElementById('score-display').textContent=
    I18N.t('round_score_hi_label','Round: {r} | Score: {s} | Hi: {h}')
      .replace('{r}',round).replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
