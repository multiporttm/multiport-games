<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a1810;display:block;border-radius:8px;touch-action:none}
#hud{color:#e8c77e;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#controls2{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
#controls2 button{padding:10px 18px;background:#8a5a2a;border:none;border-radius:20px;color:#fff;cursor:pointer;font-size:1.1rem;font-weight:700}
#controls2 button:active{transform:scale(.95)}
#controls2 button.test{background:#3f7d4a}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Music Box Tuning</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreDisp">Score: 0 | Hi: 0</span><span id="levelDisp">Level 1</span><span id="livesDisp">♥ ♥ ♥</span></div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="controls2">
      <button id="btnLeft">◀ Select</button>
      <button id="btnDown">− File Down</button>
      <button id="btnUp">+ File Up</button>
      <button id="btnRight">Select ▶</button>
      <button id="btnTest" class="test">▶ Test Playback</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Select a tine with <b>Left/Right Arrow</b> or <b>tap</b> it, then file it with <b>Up/Down Arrow</b> or the <b>+/-</b> buttons until it matches the target pitch (the pale marker). Click <b>Test Playback</b> to check your work. Tune every tine in before your mistakes run out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),levelDisp=document.getElementById('levelDisp'),livesDisp=document.getElementById('livesDisp');
let score=0,hi=parseInt(localStorage.getItem('musicboxtuning_hi')||'0',10);
let level=1,lives=3,sel=0,tines=[],gameOver=false,won=false,levelCleared=false,msg='',msgTimer=0;

function tolFor(lv){ return Math.max(2.2,6-lv*0.3); }
function countFor(lv){ return Math.min(10,3+lv); }

function newLevel(){
  const n=countFor(level);
  tines=[];
  for(let i=0;i<n;i++){
    const target=20+Math.random()*60;
    let current=target;
    while(Math.abs(current-target)<tolFor(level)+5)current=20+Math.random()*60;
    tines.push({target,current,locked:false});
  }
  sel=0;levelCleared=false;
}

function resetGame(){score=0;level=1;lives=3;gameOver=false;won=false;newLevel();}
resetGame();

function flash(t){msg=t;msgTimer=90;}

function fileTine(dir){
  if(gameOver)return;
  const t=tines[sel];
  if(t.locked)return;
  t.current=Math.max(0,Math.min(100,t.current+dir*0.8));
  SFX.click();
}

function selectTine(dir){
  if(gameOver)return;
  let i=sel;
  for(let k=0;k<tines.length;k++){
    i=(i+dir+tines.length)%tines.length;
    if(!tines[i].locked){sel=i;break;}
  }
}

function testPlayback(){
  if(gameOver||levelCleared)return;
  let allGood=true,anyWrong=false;
  tines.forEach((t,i)=>{
    const diff=Math.abs(t.current-t.target);
    setTimeout(()=>{
      if(diff<=tolFor(level)){
        t.locked=true;
        SFX.point();
      } else {
        anyWrong=true;
        SFX.error();
      }
    },i*140);
  });
  setTimeout(()=>{
    tines.forEach(t=>{ if(Math.abs(t.current-t.target)>tolFor(level))allGood=false; });
    if(allGood){
      levelCleared=true;
      score+=100*level;
      SFX.success();
      flash(I18N.t('level_clear','Level cleared!'));
      setTimeout(()=>{ level++; newLevel(); },1200);
    } else if(anyWrong){
      lives--;
      SFX.fail();
      flash(I18N.t('still_off','Some tines are still off pitch!'));
      if(lives<=0){
        gameOver=true;
        if(score>hi){hi=score;localStorage.setItem('musicboxtuning_hi',String(hi));}
        SFX.lose();
      }
    }
    selectTine(1); // move to next unlocked if current got locked
  },tines.length*140+80);
}

function restart(){ if(gameOver){ resetGame(); } }

document.addEventListener('keydown',e=>{
  if(gameOver&&(e.code==='Space'||e.code==='Enter')){ restart(); return; }
  if(e.code==='ArrowLeft'){e.preventDefault();selectTine(-1);}
  else if(e.code==='ArrowRight'){e.preventDefault();selectTine(1);}
  else if(e.code==='ArrowUp'){e.preventDefault();fileTine(1);}
  else if(e.code==='ArrowDown'){e.preventDefault();fileTine(-1);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();testPlayback();}
});

document.getElementById('btnLeft').addEventListener('click',()=>selectTine(-1));
document.getElementById('btnRight').addEventListener('click',()=>selectTine(1));
document.getElementById('btnUp').addEventListener('click',()=>fileTine(1));
document.getElementById('btnDown').addEventListener('click',()=>fileTine(-1));
document.getElementById('btnTest').addEventListener('click',()=>{ if(gameOver)restart(); else testPlayback(); });

c.addEventListener('pointerdown',e=>{
  if(gameOver){restart();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(800/rect.width);
  const n=tines.length;
  const slotW=700/n;
  const idx=Math.floor((x-50)/slotW);
  if(idx>=0&&idx<n&&!tines[idx].locked){sel=idx;SFX.select();}
});

function drawTine(t,i,n,selected){
  const slotW=700/n;
  const x=50+i*slotW+slotW/2;
  const baseY=260;
  const barH=150;
  const curY=baseY-(t.current/100)*barH;
  const targY=baseY-(t.target/100)*barH;
  // comb tine
  ctx.fillStyle=t.locked?'#6fcf6f':(selected?'#e8c77e':'#c9a876');
  ctx.fillRect(x-10,curY,20,baseY-curY);
  // target marker
  ctx.strokeStyle='#ffffffaa';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-18,targY);ctx.lineTo(x+18,targY);ctx.stroke();
  if(selected&&!t.locked){
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.strokeRect(x-14,40,28,230);
  }
  if(t.locked){
    ctx.fillStyle='#6fcf6f';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText('✓',x,30);
  }
}

function loop(){
  ctx.clearRect(0,0,800,300);
  const bg=ctx.createLinearGradient(0,0,0,300);
  bg.addColorStop(0,'#3a2418');bg.addColorStop(1,'#2a1810');
  ctx.fillStyle=bg;ctx.fillRect(0,0,800,300);
  ctx.fillStyle='#1a0f08';ctx.fillRect(0,260,800,6);

  const n=tines.length;
  tines.forEach((t,i)=>drawTine(t,i,n,i===sel));

  if(msgTimer>0){
    msgTimer--;
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(msg,400,290);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,800,300);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),400,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: {s}').replace('{s}',score),400,180);
    ctx.fillText(I18N.t('restart_hint2','Tap or press Space to restart'),400,210);
  }

  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  levelDisp.textContent=I18N.t('level_label','Level {l}').replace('{l}',level);
  livesDisp.textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
