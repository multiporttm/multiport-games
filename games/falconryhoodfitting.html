<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Falconry Hood Fitting</title><meta name="description" content="Play Falconry Hood Fitting free online — Watch the falcon's alertness gauge and slip the leather hood over its head only in its calm moments, without startling it."><link rel="canonical" href="https://games.multiportllc.com/games/falconryhoodfitting"><meta property="og:title" content="Falconry Hood Fitting - Multiport Games"><meta property="og:description" content="Play Falconry Hood Fitting free online — Watch the falcon's alertness gauge and slip the leather hood over its head only in its calm moments, without startling it."><meta property="og:url" content="https://games.multiportllc.com/games/falconryhoodfitting"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Falconry Hood Fitting - Multiport Games"><meta name="twitter:description" content="Play Falconry Hood Fitting free online — Watch the falcon's alertness gauge and slip the leather hood over its head only in its calm moments, without startling it."><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Falconry Hood Fitting","description":"Play Falconry Hood Fitting free online instantly. Carefully slip a leather hood over a perched falcon's head, timing your approach to the bird's calm moments shown on its alertness gauge without startling it. Birds grow more easily startled with each round. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/falconryhoodfitting","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a2f24;display:block;border-radius:8px;touch-action:none;cursor:pointer}
#hud{color:#e8d9b5;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.lives{letter-spacing:2px}
#meterWrap{max-width:600px;margin:0 auto 4px;background:#1e2217;border-radius:10px;padding:4px}
#meterLabel{color:#c9b787;font-size:.75rem;text-align:center;margin-bottom:2px}
#meterBar{height:16px;border-radius:8px;background:linear-gradient(90deg,#6fae3e,#f2d24b,#d1472c);width:40%;transition:width .08s linear}
#meterZone{position:relative;height:16px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Falconry Hood Fitting</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreLbl">Score: 0 | Hi: 0</span>
      <span id="livesLbl" class="lives">❤❤❤</span>
      <span id="levelLbl">Bird 1/8</span>
    </div>
    <div id="meterWrap">
      <div id="meterLabel">Alertness</div>
      <div id="meterBar"></div>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the falcon's <b>alertness gauge</b>. Click/Tap or press <b>Space</b> to slip the hood on only when alertness is low (green zone). Acting while the bird is alert will startle it and cost a life. Each new bird is more easily startled!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreLbl=document.getElementById('scoreLbl'),livesLbl=document.getElementById('livesLbl'),levelLbl=document.getElementById('levelLbl'),meterBar=document.getElementById('meterBar');
const HI_KEY='falconryhoodfitting_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let score=0,lives=3,round=1,maxRounds=8;
let alert=0.3,alertDir=1,alertSpeed=0.006;
let state='intro'; // intro, playing, success, startled, gameover
let flashTimer=0,flashColor='',approachAnim=0,approaching=false;
let perchBob=0;

function startledThreshold(r){return Math.max(0.62,0.92-r*0.035);} // top of safe zone shrinks each round
function calmTop(){return 0.30+Math.random()*0.04;}

function newRound(){
  round=Math.min(round,maxRounds);
  alertSpeed=0.0045+round*0.0014+Math.random()*0.0015;
  alertDir=1;
  alert=0.15+Math.random()*0.15;
  state='playing';
  approaching=false;approachAnim=0;
  levelLbl.textContent=I18N.t('bird_level_label','Bird {n}/{m}').replace('{n}',round).replace('{m}',maxRounds);
}

function resetGame(){
  score=0;lives=3;round=1;
  newRound();
}

function safeTop(){return startledThreshold(round);}

function attemptHood(){
  if(state!=='playing'||approaching)return;
  approaching=true;approachAnim=0;
  if(alert<safeTop()){
    // success
    SFX.success();
    score+=Math.round(100+ (safeTop()-alert)*200);
    if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
    flashColor='#6fae3e';flashTimer=28;
    setTimeout(()=>{
      if(round>=maxRounds){state='gameover';SFX.win();}
      else{round++;newRound();}
    },650);
    state='success';
  } else {
    SFX.hurt();
    lives--;
    flashColor='#d1472c';flashTimer=28;
    state='startled';
    setTimeout(()=>{
      if(lives<=0){state='gameover';SFX.lose();}
      else{newRound();}
    },650);
  }
}

function onInput(e){
  if(e)e.preventDefault();
  if(state==='intro'){resetGame();SFX.click();return;}
  if(state==='gameover'){resetGame();SFX.click();return;}
  if(state==='playing')attemptHood();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){onInput(e);}});
c.addEventListener('click',onInput);
c.addEventListener('touchstart',onInput,{passive:false});

function drawPerch(){
  ctx.fillStyle='#4a3626';
  ctx.fillRect(370,230,60,16);
  ctx.fillRect(395,170,12,70);
}

function drawFalcon(hoodProgress){
  const bx=401,by=160+Math.sin(perchBob)*2;
  ctx.save();
  ctx.translate(bx,by);
  // body
  ctx.fillStyle='#8a6c4a';
  ctx.beginPath();
  ctx.ellipse(0,20,32,46,0,0,Math.PI*2);
  ctx.fill();
  // wing folds
  ctx.fillStyle='#6b5338';
  ctx.beginPath();
  ctx.ellipse(10,28,20,34,0.2,0,Math.PI*2);
  ctx.fill();
  // chest streaks
  ctx.strokeStyle='#d8c9a8';ctx.lineWidth=2;
  for(let i=-10;i<18;i+=6){
    ctx.beginPath();ctx.moveTo(-14,i+10);ctx.lineTo(10,i+8);ctx.stroke();
  }
  // tail
  ctx.fillStyle='#7a5f3f';
  ctx.fillRect(-8,58,18,40);
  // head
  ctx.fillStyle='#a3875f';
  ctx.beginPath();ctx.ellipse(0,-28,20,22,0,0,Math.PI*2);ctx.fill();
  // beak
  ctx.fillStyle='#2c2c2c';
  ctx.beginPath();
  ctx.moveTo(-6,-26);ctx.lineTo(-22,-20);ctx.lineTo(-6,-16);ctx.closePath();ctx.fill();
  // eye (alert indicator)
  if(hoodProgress<1){
    const eyeOpen=0.4+alert*0.6;
    ctx.fillStyle='#f5d547';
    ctx.beginPath();ctx.ellipse(4,-30,7*eyeOpen,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();ctx.arc(4,-30,3*eyeOpen,0,Math.PI*2);ctx.fill();
  }
  // feet/perch grip
  ctx.fillStyle='#e8b23d';
  ctx.fillRect(-10,64,8,10);
  ctx.fillRect(4,64,8,10);
  ctx.restore();

  // hood sliding on from above
  if(hoodProgress>0){
    ctx.save();
    ctx.translate(bx,by);
    const hy=-70+hoodProgress*42;
    ctx.fillStyle='#5a3a24';
    ctx.beginPath();
    ctx.moveTo(-16,hy);
    ctx.quadraticCurveTo(0,hy-16,16,hy);
    ctx.lineTo(16,hy+30);
    ctx.quadraticCurveTo(0,hy+40,-16,hy+30);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#caa15a';ctx.lineWidth=2;ctx.stroke();
    // plume
    ctx.fillStyle='#d1472c';
    ctx.beginPath();ctx.moveTo(0,hy-16);ctx.lineTo(-4,hy-28);ctx.lineTo(4,hy-28);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

function drawHand(){
  if(!approaching)return;
  const t=Math.min(1,approachAnim/26);
  const x=401+ (1-t)*180, y=50+(1-t)*-20;
  ctx.save();
  ctx.fillStyle='#caa15a';
  ctx.beginPath();ctx.ellipse(x,y,16,22,0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a6c4a';
  ctx.fillRect(x-4,y+18,10,60);
  ctx.restore();
}

function loop(){
  // sky background
  const sky=ctx.createLinearGradient(0,0,0,320);
  sky.addColorStop(0,'#1d2a1a');sky.addColorStop(1,'#3a4a2c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,320);
  ctx.fillStyle='#2a3620';ctx.fillRect(0,280,800,40);

  perchBob+=0.04;
  drawPerch();

  if(state==='intro'){
    ctx.fillStyle='#e8d9b5';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hood_title','FALCONRY HOOD FITTING'),400,80);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('hood_start_hint','Tap / Space to begin'),400,120);
    drawFalcon(0);
    requestAnimationFrame(loop);return;
  }

  if(state==='playing'){
    alert+=alertDir*alertSpeed;
    if(alert>=1){alert=1;alertDir=-1;}
    if(alert<=0){alert=0;alertDir=1;}
  }

  const hoodProgress = state==='success'? Math.min(1,approachAnim/26) : (approaching? Math.min(1,approachAnim/26)*(1-((state==='startled')?1:0)) : 0);
  drawFalcon(state==='success'?hoodProgress:0);
  if(state==='startled'){
    // bird jerks away
    ctx.save();ctx.globalAlpha=0.0;ctx.restore();
  }
  drawHand();
  if(approaching)approachAnim++;

  // meter
  const safe=safeTop();
  meterBar.style.width=(alert*100)+'%';
  const hue = alert<safe? 'linear-gradient(90deg,#6fae3e,#9ed16a)' : 'linear-gradient(90deg,#f2d24b,#d1472c)';
  meterBar.style.background=hue;

  if(flashTimer>0){
    ctx.fillStyle=flashColor;
    ctx.globalAlpha=flashTimer/28*0.35;
    ctx.fillRect(0,0,800,320);
    ctx.globalAlpha=1;
    flashTimer--;
  }

  if(state==='startled'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hood_startled','STARTLED!'),400,160);
  }
  if(state==='success'){
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('hood_fitted','HOODED!'),400,160);
  }

  if(state==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,800,320);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    const won=lives>0;
    ctx.fillText(won?I18N.t('hood_win','ALL BIRDS HOODED!'):I18N.t('game_over_title','GAME OVER'),400,140);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,180);
  }

  let heartsStr='';
  for(let i=0;i<3;i++)heartsStr+= i<lives?'❤':'🖤';
  livesLbl.textContent=heartsStr;
  scoreLbl.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);

  requestAnimationFrame(loop);
}
levelLbl.textContent=I18N.t('bird_level_label','Bird {n}/{m}').replace('{n}',round).replace('{m}',maxRounds);
loop();
</script></body></html>
