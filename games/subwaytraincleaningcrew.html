<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1c2430;display:block;border-radius:8px;touch-action:none}
#score-display{color:#7ec8e3;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Subway Train Cleaning Crew</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Clean every spot on the car in the right order — <b>Sweep</b> (🧹) trash first, then <b>Wipe</b> (🧽) seats and poles, then <b>Mop</b> (🪣) the floor. Use <b>Arrow Keys</b> + <b>Space/Enter</b>, number keys <b>1-3</b>, or <b>Tap/Click</b> each spot. 3 mistakes and the train leaves dirty!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HS_KEY='hs_subwaytraincleaningcrew';
let hi=parseInt(localStorage.getItem(HS_KEY)||'0',10);

const STEPS=[
  {key:'sweep',icon:'🧹',label:()=>I18N.t('st_sweep','Sweep')},
  {key:'wipe',icon:'🧽',label:()=>I18N.t('st_wipe','Wipe')},
  {key:'mop',icon:'🪣',label:()=>I18N.t('st_mop','Mop')}
];

let spots=[];
let order=0;
let lives=3;
let score=0;
let level=1;
let timeLeft=0;
let maxTime=0;
let selIndex=0;
let gameState='ready'; // ready, playing, won, lost
let flashMsg='',flashTimer=0,flashColor='#fff';

function spotsForLevel(lv){
  const n=Math.min(3+lv,9);
  const cols=3;
  const rows=Math.ceil(n/cols);
  const gap=18, w=(W-gap*(cols+1))/cols, h=110;
  const startY=150;
  const arr=[];
  for(let i=0;i<n;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const stepIdx=Math.floor(Math.random()*3);
    arr.push({
      x:gap+col*(w+gap), y:startY+row*(h+gap), w,h,
      step:stepIdx, done:false
    });
  }
  return arr;
}

function startLevel(lv){
  spots=spotsForLevel(lv);
  order=0;
  selIndex=0;
  maxTime=Math.max(10,22-lv*1.2);
  timeLeft=maxTime;
  gameState='playing';
}

function newGame(){
  lives=3;score=0;level=1;
  startLevel(level);
  gameState='playing';
}

function flash(msg,color){flashMsg=msg;flashColor=color;flashTimer=60;}

function pendingSteps(){
  // the set of unique step-types remaining in correct cleaning order
  const remaining=spots.filter(s=>!s.done);
  if(remaining.length===0)return [];
  return remaining;
}

function attempt(spot){
  if(gameState!=='playing'||spot.done)return;
  if(spot.step===order){
    spot.done=true;
    score+=10+level;
    SFX.success();
    if(spots.every(s=>s.step!==order||s.done)){
      // advance to next step type if all of current type done
    }
    // advance order when no spot with current order remains undone
    if(!spots.some(s=>s.step===order&&!s.done)) order++;
    if(spots.every(s=>s.done)){
      SFX.levelup();
      score+=20;
      flash(I18N.t('car_clean','Car clean!'),'#7ec850');
      level++;
      setTimeout(()=>{ if(gameState==='playing') startLevel(level); },700);
    }
  } else {
    lives--;
    SFX.error();
    flash(I18N.t('wrong_order','Wrong order!'),'#e94560');
    if(lives<=0){
      gameState='lost';
      SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
    }
  }
}

function pointerToSpot(px,py){
  for(const s of spots){
    if(px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h)return s;
  }
  return null;
}

c.addEventListener('pointerdown',e=>{
  if(gameState==='ready'||gameState==='lost'){ newGame(); return; }
  const rect=c.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(W/rect.width);
  const py=(e.clientY-rect.top)*(H/rect.height);
  const s=pointerToSpot(px,py);
  if(s)attempt(s);
});

document.addEventListener('keydown',e=>{
  if(gameState==='ready'||gameState==='lost'){
    if(e.code==='Space'||e.code==='Enter'){ newGame(); }
    return;
  }
  if(gameState!=='playing')return;
  const undone=spots.filter(s=>!s.done);
  if(undone.length===0)return;
  if(e.code==='ArrowRight'){ selIndex=(selIndex+1)%undone.length; e.preventDefault(); }
  else if(e.code==='ArrowLeft'){ selIndex=(selIndex-1+undone.length)%undone.length; e.preventDefault(); }
  else if(e.code==='ArrowDown'){ selIndex=(selIndex+1)%undone.length; e.preventDefault(); }
  else if(e.code==='ArrowUp'){ selIndex=(selIndex-1+undone.length)%undone.length; e.preventDefault(); }
  else if(e.code==='Space'||e.code==='Enter'){ attempt(undone[selIndex]); e.preventDefault(); }
  else if(e.code>='Digit1'&&e.code<='Digit3'){
    const n=parseInt(e.code.slice(5),10)-1;
    if(undone[n])attempt(undone[n]);
  }
});

function draw(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#141b26');sky.addColorStop(1,'#1c2430');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#7ec8e3';ctx.font='bold 22px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {l}').replace('{l}',level),16,32);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('lives_label','Lives: {n}').replace('{n}',lives),W-16,32);

  // order hint
  ctx.textAlign='center';
  ctx.font='bold 18px Arial';
  ctx.fillStyle='#ffd54f';
  const stepLabel=order<3?STEPS[order].icon+' '+STEPS[order].label():I18N.t('all_done','All done!');
  ctx.fillText(I18N.t('next_step','Next: {s}').replace('{s}',stepLabel),W/2,62);

  if(gameState==='playing'){
    // timer bar
    const pct=Math.max(0,timeLeft/maxTime);
    ctx.fillStyle='#222';ctx.fillRect(200,78,400,14);
    ctx.fillStyle=pct>0.3?'#7ec850':'#e94560';
    ctx.fillRect(200,78,400*pct,14);
  }

  const undone=spots.filter(s=>!s.done);
  spots.forEach((s)=>{
    ctx.save();
    ctx.fillStyle=s.done?'#2d5a27':'#2a3645';
    ctx.strokeStyle=s.step===order&&!s.done?'#ffd54f':'#445566';
    ctx.lineWidth=s===undone[selIndex]?5:2;
    ctx.beginPath();
    ctx.roundRect?ctx.roundRect(s.x,s.y,s.w,s.h,10):ctx.rect(s.x,s.y,s.w,s.h);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='34px Arial';ctx.textAlign='center';
    ctx.fillText(s.done?'✅':STEPS[s.step].icon,s.x+s.w/2,s.y+s.h/2+5);
    ctx.font='13px Arial';
    ctx.fillStyle='#cde';
    ctx.fillText(STEPS[s.step].label(),s.x+s.w/2,s.y+s.h-12);
    ctx.restore();
  });

  if(flashTimer>0){
    flashTimer--;
    ctx.globalAlpha=Math.min(1,flashTimer/30);
    ctx.fillStyle=flashColor;
    ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(flashMsg,W/2,H-30);
    ctx.globalAlpha=1;
  }

  if(gameState==='ready'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_title','Subway Train Cleaning Crew'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('start_hint','Tap or Press Space to start'),W/2,H/2+20);
  }
  if(gameState==='lost'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','TRAIN LEFT DIRTY'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+10);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?0:(now-lastTime)/1000;
  lastTime=now;
  if(gameState==='playing'){
    timeLeft-=dt;
    if(timeLeft<=0){
      lives--;
      SFX.error();
      flash(I18N.t('too_slow','Too slow!'),'#e94560');
      if(lives<=0){
        gameState='lost';SFX.lose();
        if(score>hi){hi=score;localStorage.setItem(HS_KEY,String(hi));}
      } else {
        startLevel(level);
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
