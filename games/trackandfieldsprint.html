<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Track and Field Sprint</title><meta name="description" content="Play Track and Field Sprint free online — Wait for the GO! signal (a false start disqualifies you), then rapidly alternate the Left and Right Arrow keys (or tap) to sprint against AI runners to the finish line."><link rel="canonical" href="https://games.multiportllc.com/games/trackandfieldsprint"><meta property="og:title" content="Track and Field Sprint - Multiport Games"><meta property="og:description" content="Play Track and Field Sprint free online — Wait for the GO! signal (a false start disqualifies you), then rapidly alternate the Left and Right Arrow keys (or tap) to sprint against AI runners to the finish line."><meta property="og:url" content="https://games.multiportllc.com/games/trackandfieldsprint"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Track and Field Sprint","description":"Play Track and Field Sprint free online instantly. Wait for the GO! signal — a false start before it appears costs a disqualification and restart. Then rapidly alternate the Left and Right Arrow keys (or tap) to build running speed and race against AI competitors to the finish line. No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/trackandfieldsprint","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#d84315,#ffa726);display:block;border-radius:8px;touch-action:none}
#score-display{color:#bf360c;background:#fff3e0;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;border-radius:6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Track and Field Sprint</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <canvas id="c" width="800" height="280"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Wait for the <b>GO!</b> signal — moving too early is a <b>false start</b> and disqualifies you! Once it appears, rapidly alternate <b>Left Arrow</b> and <b>Right Arrow</b> (or tap the left/right side of the screen) to sprint to the finish line ahead of the field.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=280;
const TRACK_LEN=2400;
let hiTime=parseFloat(localStorage.getItem('sprint_hi')||'0')||null;
let wins=parseInt(localStorage.getItem('sprint_wins')||'0',10);

let racers,lastKey,phase,raceTime,camX,lastTime,waitTimer,goTime,falseStartMsg;
// phase: 'wait' -> 'go' -> 'finished'  (also 'falsestart' briefly)

function makeRacers(){
  return [
    {x:0,color:'#42a5f5',isPlayer:true,speed:0,legPhase:0,finishTime:null},
    {x:0,color:'#66bb6a',isPlayer:false,aiRhythm:20+Math.random()*8,aiTimer:0,finishTime:null},
    {x:0,color:'#ab47bc',isPlayer:false,aiRhythm:18+Math.random()*10,aiTimer:0,finishTime:null},
    {x:0,color:'#ffca28',isPlayer:false,aiRhythm:19+Math.random()*9,aiTimer:0,finishTime:null},
  ];
}

function reset(){
  racers=makeRacers();
  lastKey=null;
  phase='wait';
  raceTime=0;camX=0;lastTime=null;
  waitTimer=90+Math.random()*120; // frames before GO appears
  goTime=null;
  falseStartMsg=null;
}
reset();

function sprint(side){
  if(phase==='finished'){reset();return;}
  if(phase==='falsestart'){reset();return;}
  if(phase==='wait'){
    // false start!
    phase='falsestart';
    falseStartMsg=I18N.t('sprint_false_start','FALSE START! Disqualified.');
    SFX.error();
    return;
  }
  if(phase!=='go')return;
  const p=racers[0];
  if(side===lastKey){
    SFX.error(); // inefficient, no gain
    return;
  }
  lastKey=side;
  p.speed=Math.min(p.speed+3.2,26);
  p.legPhase=1;
  SFX.click();
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();sprint('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();sprint('R');}
});
c.addEventListener('mousedown',e=>{
  const r=c.getBoundingClientRect();
  const x=e.clientX-r.left;
  sprint(x<r.width/2?'L':'R');
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-r.left;
  sprint(x<r.width/2?'L':'R');
},{passive:false});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('sprint_score_label','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',hiTime?hiTime.toFixed(2)+'s':'--');
}

function drawRunner(r,laneY,label){
  const sx=r.x-camX+80;
  if(sx<-40||sx>W+40)return;
  const bob=r.legPhase>0?Math.sin(r.legPhase*Math.PI)*10:0;
  ctx.fillStyle='#3e2723';
  ctx.beginPath();ctx.ellipse(sx,laneY-bob,14,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=r.color;
  ctx.fillRect(sx-12,laneY-18-bob,24,22);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(sx,laneY-28-bob,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';
  ctx.fillText(label,sx,laneY-42-bob);
}

function loop(ts){
  if(lastTime===null)lastTime=ts;
  const dt=Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#4e342e');grad.addColorStop(1,'#d84315');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#bf360c';ctx.fillRect(0,60,W,200);
  for(let i=1;i<4;i++){
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(0,60+i*45);ctx.lineTo(W,60+i*45);ctx.stroke();
  }
  ctx.setLineDash([]);

  if(phase==='wait'){
    waitTimer-=dt;
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('sprint_ready','READY...'),W/2,45);
    racers.forEach((r,i)=>drawRunner(r,60+i*45+30,i===0?I18N.t('sprint_you_label','YOU'):'CPU'));
    if(waitTimer<=0){
      phase='go';
      goTime=0;
      SFX.powerup();
    }
    requestAnimationFrame(loop);return;
  }

  if(phase==='falsestart'){
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(falseStartMsg,W/2,45);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,75);
    racers.forEach((r,i)=>drawRunner(r,60+i*45+30,i===0?I18N.t('sprint_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  if(phase==='finished'){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    const won=racers[0].finishTime!==null&&racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    ctx.fillText(won?I18N.t('sprint_win','YOU WIN!'):I18N.t('sprint_lose','YOU LOSE'),W/2,45);
    ctx.font='15px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or key to restart'),W/2,72);
    racers.forEach((r,i)=>drawRunner(r,60+i*45+30,i===0?I18N.t('sprint_you_label','YOU'):'CPU'));
    requestAnimationFrame(loop);return;
  }

  // phase === 'go'
  raceTime+=dt/60;

  ctx.fillStyle='#ffeb3b';ctx.font='bold 36px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('sprint_go','GO!'),W/2,45);

  racers.forEach((r,i)=>{
    if(i===0){
      r.speed=Math.max(0,r.speed-0.12*dt); // speed decays, must keep alternating
      r.x+=r.speed*dt;
      return;
    }
    r.aiTimer+=dt;
    if(r.aiTimer>=r.aiRhythm){
      r.aiTimer=0;
      r.speed=Math.min((r.speed||0)+2.6,22);
      r.legPhase=1;
    }
    r.speed=Math.max(0,(r.speed||0)-0.1*dt);
    r.x+=r.speed*dt;
  });

  racers.forEach(r=>{
    if(r.legPhase>0){r.legPhase-=0.08*dt;if(r.legPhase<0)r.legPhase=0;}
    if(r.finishTime===null&&r.x>=TRACK_LEN){r.finishTime=raceTime;}
  });

  camX=Math.max(0,racers[0].x-200);

  const finishSx=TRACK_LEN-camX+80;
  if(finishSx>-20&&finishSx<W+20){
    for(let i=0;i<200;i+=20){
      ctx.fillStyle=((i/20)%2===0)?'#222':'#fff';
      ctx.fillRect(finishSx,60+i,10,20);
    }
  }

  racers.forEach((r,i)=>drawRunner(r,60+i*45+30,i===0?I18N.t('sprint_you_label','YOU'):'CPU'));

  if(racers[0].finishTime!==null&&phase!=='finished'){
    phase='finished';
    const won=racers.every(r=>r.finishTime===null||r.finishTime>=racers[0].finishTime);
    if(won){
      wins++;
      localStorage.setItem('sprint_wins',wins);
      if(hiTime===null||raceTime<hiTime){
        hiTime=raceTime;
        localStorage.setItem('sprint_hi',hiTime);
      }
      SFX.win();
    }else{
      SFX.lose();
    }
  } else if(phase!=='finished' && racers.some((r,i)=>i>0&&r.finishTime!==null)){
    phase='finished';
    SFX.lose();
  }

  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('sprint_time_label','Time: {t}s').replace('{t}',raceTime.toFixed(2)),10,20);
  ctx.textAlign='right';
  ctx.fillText(I18N.t('sprint_progress_label','{p}%').replace('{p}',Math.min(100,Math.floor(racers[0].x/TRACK_LEN*100))),W-10,20);

  updateScoreDisplay();
  requestAnimationFrame(loop);
}
updateScoreDisplay();
requestAnimationFrame(loop);
</script></body></html>
