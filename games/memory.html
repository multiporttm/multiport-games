<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Memory Match</title><meta name="description" content="Play Memory Match free online — Click cards to flip them. Find all matching pairs. Fewer moves = better score!"><link rel="canonical" href="https://games.multiportllc.com/games/memory"><meta property="og:title" content="Memory Match - Multiport Games"><meta property="og:description" content="Play Memory Match free online — Click cards to flip them. Find all matching pairs. Fewer moves = better score!"><meta property="og:url" content="https://games.multiportllc.com/games/memory"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Memory Match","description":"Play Memory Match free online instantly. Click cards to flip them. Find all matching pairs. Fewer moves = better score! No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/memory","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#grid{display:grid;grid-template-columns:repeat(4,90px);gap:10px;justify-content:center;margin:0 auto}
.card{width:90px;height:90px;background:#4a148c;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:transform .3s;transform:rotateY(180deg);border:2px solid #7b1fa2}
.card.flipped,.card.matched{transform:rotateY(0deg);background:#1a1a2e}
.card.matched{border-color:#ce93d8;cursor:default}
#ui{color:#ce93d8;text-align:center;padding:10px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Memory Match</div>
  <div class="game-frame" style="padding:20px">
    <div id="ui">Moves: 0 | Pairs: 0/8</div>
    <div id="grid"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click cards to flip them. Find all matching pairs. Fewer moves = better score!</div>
</div>
<script>
const EMOJIS=['🐶','🐱','🦊','🐼','🦁','🐯','🐨','🦋'];
let cards,flipped,locked,moves,pairs;

function init(){
  const deck=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-.5);
  cards=deck.map((e,i)=>({id:i,emoji:e,flipped:false,matched:false}));
  flipped=[];locked=false;moves=0;pairs=0;render();
}

function click(id){
  if(locked)return;
  const card=cards[id];
  if(card.flipped||card.matched)return;
  card.flipped=true;flipped.push(id);render();
  if(flipped.length===2){
    moves++;
    locked=true;
    const [a,b]=flipped;
    if(cards[a].emoji===cards[b].emoji){
      cards[a].matched=cards[b].matched=true;pairs++;
      flipped=[];locked=false;
      if(pairs===8){render();setTimeout(()=>alert(I18N.t('win_moves_alert','🎉 You won in {n} moves!').replace('{n}',moves)),50);}
    } else {
      setTimeout(()=>{cards[a].flipped=cards[b].flipped=false;flipped=[];locked=false;render();},900);
    }
    render();
  }
}

function render(){
  document.getElementById('ui').textContent=I18N.t('moves_pairs_label','Moves: {m} | Pairs: {p}/8').replace('{m}',moves).replace('{p}',pairs);
  const g=document.getElementById('grid');g.innerHTML='';
  cards.forEach(card=>{
    const d=document.createElement('div');
    d.className='card'+(card.flipped||card.matched?' flipped':'')+(card.matched?' matched':'');
    if(card.flipped||card.matched)d.textContent=card.emoji;
    else d.textContent='❓';
    d.onclick=()=>click(card.id);
    g.appendChild(d);
  });
}
init();
</script></body></html>
