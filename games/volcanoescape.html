<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a0f0f;cursor:pointer}
#ui{color:#ffccbc;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Volcano Escape</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Height: 0 | Best: 0</div>
    <canvas id="c" width="360" height="480"></canvas>
  </div>
  <div class="game-instructions">Tap left/right side of the screen (or use ← → arrow keys) to steer, and tap the top bar or press Space/↑ to jump up to the next platform. Climb as high as you can before the rising lava catches you!</div>
</div>
<script>
const W=360,H=480;
const GRAV=0.4,JUMP=-9.5,MOVE=3.2;
let plat,player,camY,lava,state,best,keys={},score;

function loadBest(){return +(localStorage.getItem('volcanoescape_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('volcanoescape_best',v);}

function genPlatforms(fromY){
  const arr=[];
  let y=fromY;
  for(let i=0;i<20;i++){
    y-=60+Math.random()*30;
    arr.push({x:20+Math.random()*(W-100),y,w:70+Math.random()*30});
  }
  return arr;
}

function init(){
  plat=[{x:W/2-50,y:H-40,w:100}].concat(genPlatforms(H-40));
  player={x:W/2,y:H-70,vy:0,vx:0,onGround:true};
  camY=0;lava=H+40;state='play';best=loadBest();score=0;
  updateUI();
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if((e.key===' '||e.key==='ArrowUp')&&state==='play'){doJump();}
  if(e.key===' ')e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function doJump(){
  if(player.onGround){
    player.vy=JUMP;player.onGround=false;
    SFX.jump();
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  if(mx<W*0.3)keys['arrowleft']=true,setTimeout(()=>keys['arrowleft']=false,180);
  else if(mx>W*0.7)keys['arrowright']=true,setTimeout(()=>keys['arrowright']=false,180);
  else doJump();
});

function update(){
  if(state!=='play')return;
  if(keys['arrowleft']||keys['a'])player.vx=-MOVE;
  else if(keys['arrowright']||keys['d'])player.vx=MOVE;
  else player.vx*=0.8;
  player.x+=player.vx;
  player.x=Math.max(10,Math.min(W-10,player.x));

  player.vy+=GRAV;
  player.y+=player.vy;

  player.onGround=false;
  for(const p of plat){
    if(player.vy>0&&player.x>p.x-10&&player.x<p.x+p.w+10&&player.y>p.y-4&&player.y<p.y+14){
      player.y=p.y-4;player.vy=0;player.onGround=true;
    }
  }

  if(player.y<H*0.4+camY){
    const dy=(H*0.4+camY)-player.y;
    camY-=dy;
  }

  const highestPlatY=Math.min(...plat.map(p=>p.y));
  if(highestPlatY-camY>-200){
    plat=plat.concat(genPlatforms(highestPlatY));
  }
  plat=plat.filter(p=>p.y<lava+100);

  lava-=0.55;
  const height=Math.max(0,Math.floor((H-40-player.y)/10));
  if(height>score){score=height;updateUI();}

  if(player.y>lava-camY-20){
    state='over';SFX.lose();saveBest(score);
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#1a0f0f';ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(0,camY);

  for(const p of plat){
    ctx.fillStyle='#4e342e';
    ctx.fillRect(p.x,p.y,p.w,10);
    ctx.fillStyle='#6d4c41';
    ctx.fillRect(p.x,p.y,p.w,3);
  }

  ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🧗',player.x,player.y-8);

  const lavaY=lava;
  const grad=ctx.createLinearGradient(0,lavaY,0,lavaY+120);
  grad.addColorStop(0,'#ff7043');grad.addColorStop(1,'#d84315');
  ctx.fillStyle=grad;
  ctx.fillRect(0,lavaY,W,300);

  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffccbc';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('CAUGHT BY LAVA!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Height: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to try again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Height: ${score} | Best: ${loadBest()}`;
}

init();draw();
</script></body></html>
