<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0a0a12;cursor:crosshair}
#ui{color:#b39ddb;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ghost Hunt Manor</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Caught: 0 | Time: 30s</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Move your mouse or finger to sweep the flashlight beam. Ghosts only show up inside the light — tap one while it's lit to catch it. Catch as many as you can before time runs out!</div>
</div>
<script>
const W=360,H=360,BEAM_R=55;
let ghosts,caught,timeLeft,state,beamX=W/2,beamY=H/2;

function loadBest(){return +(localStorage.getItem('ghosthunt_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('ghosthunt_best',v);}

function rand(min,max){return min+Math.random()*(max-min);}

function init(){
  ghosts=[];caught=0;timeLeft=30;state='play';
  for(let i=0;i<6;i++)spawnGhost();
}

function spawnGhost(){
  ghosts.push({x:rand(20,W-20),y:rand(20,H-20),vx:rand(-0.6,0.6),vy:rand(-0.6,0.6)});
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function setBeam(e){
  const rect=c.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  beamX=(p.clientX-rect.left)*(W/rect.width);
  beamY=(p.clientY-rect.top)*(H/rect.height);
}
c.addEventListener('mousemove',setBeam);
c.addEventListener('touchmove',e=>{e.preventDefault();setBeam(e);},{passive:false});
c.addEventListener('touchstart',e=>{e.preventDefault();setBeam(e);},{passive:false});

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  for(const g of ghosts){
    if(Math.hypot(g.x-beamX,g.y-beamY)<BEAM_R&&Math.hypot(g.x-x,g.y-y)<24){
      caught++;
      SFX.catch();
      saveBest(caught);
      ghosts.splice(ghosts.indexOf(g),1);
      spawnGhost();
      updateUI();
      return;
    }
  }
});

function update(){
  if(state!=='play')return;
  ghosts.forEach(g=>{
    g.x+=g.vx;g.y+=g.vy;
    if(g.x<15||g.x>W-15)g.vx*=-1;
    if(g.y<15||g.y>H-15)g.vy*=-1;
  });
  timeLeft-=1/60;
  if(timeLeft<=0){
    timeLeft=0;state='over';
    SFX.lose();
    saveBest(caught);
  }
  updateUI();
}

function draw(){
  ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(beamX,beamY,BEAM_R,0,Math.PI*2);
  ctx.clip();
  ctx.fillStyle='#2a2a40';ctx.fillRect(0,0,W,H);
  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ghosts.forEach(g=>ctx.fillText('👻',g.x,g.y));
  ctx.restore();

  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(beamX,beamY,BEAM_R,0,Math.PI*2);ctx.stroke();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#b39ddb';ctx.font='bold 26px Arial';
    ctx.fillText("TIME'S UP!",W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Caught: ${caught} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Caught: ${caught} | Time: ${Math.ceil(timeLeft)}s`;
}

init();draw();
</script></body></html>
