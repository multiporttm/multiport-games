<link rel="manifest" href="../manifest.json">

<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1c1510;display:block;border-radius:8px;touch-action:none}
#hud{color:#c9a876;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#e3cfa6}
#hud span.hs{color:#7ec850}
#strikeRow{display:flex;justify-content:center;padding:6px 10px}
#strikeBtn{padding:14px 40px;border:none;border-radius:20px;font-weight:800;cursor:pointer;font-size:1.1rem;color:#fff;background:#5d4037;user-select:none;touch-action:none}
#strikeBtn:active{transform:scale(0.95)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Boat Caulking Seams</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Seam: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="320"></canvas>
    <div id="strikeRow"><button id="strikeBtn">🔨 Strike</button></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b> or <b>tap Strike</b> to swing the mallet exactly when the caulking iron is lined up in the <b>green zone</b> on the moving gauge. Pack each seam tight with enough good strikes — but strike outside the zone and you'll split the planking.</div>
</div>
<script>
(function(){
const HS_KEY='boatcaulkingseams_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=320;

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let needlePos=0,speed=0.03,zoneStart=0.4,zoneWidth=0.2,progress=0,required=5,lastTime=null,strikeFlash=0,ironFlash=0,dir=1;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function newSeam(){
  progress=0;
  required=4+Math.floor(level/2);
  speed=0.022+level*0.0035;
  zoneWidth=Math.max(0.1,0.26-level*0.012);
  zoneStart=Math.random()*(1-zoneWidth);
  needlePos=0;dir=1;
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;newSeam(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('seam_label','Seam: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

function strike(){
  if(!started||gameOver){ startGame(); return; }
  ironFlash=10;
  const inZone=needlePos>=zoneStart&&needlePos<=zoneStart+zoneWidth;
  if(inZone){
    progress++;score+=15*level;SFX.hit();strikeFlash=8;
    if(progress>=required){
      score+=60*level;SFX.success();
      level++;
      newSeam();
    }
  } else {
    lives--;SFX.fail();strikeFlash=-8;
    if(lives<=0){ endGame(); return; }
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); strike(); }
});

const strikeBtn=document.getElementById('strikeBtn');
strikeBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();strike();});
c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawSeam(){
  const sx=100,sy=160,sw=600;
  ctx.save();
  ctx.fillStyle='#4a3524';ctx.fillRect(sx,sy-30,sw,28);
  ctx.fillStyle='#2e2015';ctx.fillRect(sx,sy+2,sw,28);
  ctx.fillStyle='#120b06';ctx.fillRect(sx,sy-2,sw,4);
  ctx.restore();

  const gaugeX=sx,gaugeY=60,gaugeW=sw,gaugeH=18;
  ctx.fillStyle='#000';ctx.fillRect(gaugeX,gaugeY,gaugeW,gaugeH);
  ctx.fillStyle='rgba(46,204,113,0.55)';ctx.fillRect(gaugeX+zoneStart*gaugeW,gaugeY,zoneWidth*gaugeW,gaugeH);
  const nx=gaugeX+needlePos*gaugeW;
  ctx.fillStyle='#ffd54f';ctx.fillRect(nx-3,gaugeY-6,6,gaugeH+12);

  const ironX=sx+needlePos*sw;
  ctx.fillStyle=ironFlash>0?'#fff':'#9e9e9e';
  ctx.fillRect(ironX-6,sy-46,12,36);
  ctx.fillStyle='#616161';
  ctx.fillRect(ironX-16,sy-52,32,10);

  if(strikeFlash!==0){
    ctx.fillStyle=strikeFlash>0?'rgba(46,204,113,0.25)':'rgba(231,76,60,0.25)';
    ctx.fillRect(0,0,W,H);
  }

  const barW=300,barH=12,barX=W/2-barW/2,barY=250;
  ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='#4fc3f7';ctx.fillRect(barX,barY,barW*(progress/required),barH);
  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('packed_label','Packed: {p}/{r}').replace('{p}',progress).replace('{r}',required),W/2,barY+28);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#120b07');bg.addColorStop(1,'#1c1510');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#c9a876';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawSeam();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  needlePos+=speed*dir*dt;
  if(needlePos>=1){needlePos=1;dir=-1;}
  if(needlePos<=0){needlePos=0;dir=1;}

  if(ironFlash>0)ironFlash-=dt;
  if(strikeFlash>0)strikeFlash=Math.max(0,strikeFlash-dt);
  if(strikeFlash<0)strikeFlash=Math.min(0,strikeFlash+dt);

  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('caulk_hint','Strike when the iron hits the green zone!'),W/2,30);

  drawSeam();

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
