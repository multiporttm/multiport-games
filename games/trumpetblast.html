<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#120c02}
#c{background:linear-gradient(#2b1d05,#120c02);display:block;border-radius:8px;max-width:100%;touch-action:manipulation}
#hud{color:#ffd166;font-size:1.05rem;font-weight:700;text-align:center;padding:6px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#f4a300}
#valvebar{display:flex;justify-content:center;gap:14px;margin-top:12px}
.valvebtn{width:70px;height:70px;border-radius:12px;border:3px solid #b8860b;background:#3b2a0f;color:#ffd166;font-weight:900;font-size:1.3rem;cursor:pointer;user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.valvebtn small{font-size:.6rem;font-weight:600;opacity:.8}
.valvebtn.down{background:#f4a300;color:#2b1d05;transform:translateY(4px)}
#blastBtn{display:block;margin:10px auto 0;padding:8px 26px;border-radius:20px;border:none;background:#f4a300;color:#2b1d05;font-weight:800;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Trumpet Blast</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="scoreEl">0</b></span><span>Combo: <b id="comboEl">0</b></span><span>Round: <b id="roundEl">1</b></span><span>Best: <b id="bestEl">0</b></span></div>
    <canvas id="c" width="800" height="220"></canvas>
    <div id="valvebar">
      <button class="valvebtn" id="v1" data-v="0"><span>1</span><small>key Q</small></button>
      <button class="valvebtn" id="v2" data-v="1"><span>2</span><small>key W</small></button>
      <button class="valvebtn" id="v3" data-v="2"><span>3</span><small>key E</small></button>
    </div>
    <button id="blastBtn">BLAST (Space)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Notes scroll toward the hit-line, each showing which valves (<b>1</b>/<b>2</b>/<b>3</b>, keys <b>Q W E</b>) to hold. Hold the correct valves and press <b>BLAST</b> (or <b>Space</b>) right as the note crosses the line. Tempo and note range increase every round — 5 misses ends the set.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=220,HITX=140;
// fingerings: 3 valves -> note name, ordered roughly low to high in difficulty tiers
const FINGERINGS=[
 {name:'C',v:[0,0,0]},
 {name:'D',v:[1,1,0]},
 {name:'E',v:[1,0,0]},
 {name:'F',v:[1,1,1]},
 {name:'G',v:[0,0,0]},
 {name:'A',v:[0,1,0]},
 {name:'B',v:[1,0,0]},
 {name:'Bb',v:[0,1,1]},
];
let active=FINGERINGS.slice(0,3);
let held=[false,false,false];
let notes=[],score=0,combo=0,misses=0,round=1,spd=2.6,spawnTimer=0,spawnInterval=100,gameOver=false,started=false,lastTime=null;
let best=parseInt(localStorage.getItem('trumpetblast_best')||'0',10);
document.getElementById('bestEl').textContent=best;

function setHeld(i,v){
  held[i]=v;
  const el=document.getElementById('v'+(i+1));
  el.classList.toggle('down',v);
}
[0,1,2].forEach(i=>{
  const el=document.getElementById('v'+(i+1));
  el.addEventListener('pointerdown',e=>{e.preventDefault();setHeld(i,true);});
  el.addEventListener('pointerup',e=>{e.preventDefault();setHeld(i,false);});
  el.addEventListener('pointerleave',e=>{setHeld(i,false);});
});
document.addEventListener('keydown',e=>{
  if(e.key==='q'||e.key==='Q'){setHeld(0,true);}
  if(e.key==='w'||e.key==='W'){setHeld(1,true);}
  if(e.key==='e'||e.key==='E'){setHeld(2,true);}
  if(e.code==='Space'){e.preventDefault();blast();}
});
document.addEventListener('keyup',e=>{
  if(e.key==='q'||e.key==='Q')setHeld(0,false);
  if(e.key==='w'||e.key==='W')setHeld(1,false);
  if(e.key==='e'||e.key==='E')setHeld(2,false);
});
document.getElementById('blastBtn').addEventListener('pointerdown',e=>{e.preventDefault();blast();});

function reset(){
  notes=[];score=0;combo=0;misses=0;round=1;spd=2.6;spawnTimer=0;spawnInterval=100;
  active=FINGERINGS.slice(0,3);gameOver=false;started=false;lastTime=null;
  document.getElementById('scoreEl').textContent=0;
  document.getElementById('comboEl').textContent=0;
  document.getElementById('roundEl').textContent=1;
}

function spawnNote(){
  const f=active[Math.floor(Math.random()*active.length)];
  notes.push({x:W+30,f,judged:false});
}

function advanceRound(){
  round++;
  document.getElementById('roundEl').textContent=round;
  spd=Math.min(6.5,spd+0.45);
  spawnInterval=Math.max(50,spawnInterval-8);
  if(active.length<FINGERINGS.length)active=FINGERINGS.slice(0,Math.min(FINGERINGS.length,active.length+1));
}

let popups=[];
function popup(x,text,color){popups.push({x,y:H/2,text,color,life:40});}

function matches(a,b){return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];}

function blast(){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  let best_=null,bestDist=Infinity;
  notes.forEach(n=>{
    if(n.judged)return;
    const d=Math.abs(n.x-HITX);
    if(d<bestDist){bestDist=d;best_=n;}
  });
  if(best_&&bestDist<70){
    best_.judged=true;
    if(matches(held,best_.f.v)){
      let quality=bestDist<22?'Perfect':(bestDist<45?'Good':'OK');
      let pts=bestDist<22?100:(bestDist<45?60:30);
      combo++;pts+=Math.min(combo,30)*3;score+=pts;
      SFX.success();popup(best_.x,quality,'#7ec850');
      if(combo>0&&combo%10===0)advanceRound();
    } else {
      combo=0;misses++;SFX.error();popup(best_.x,'Wrong valves','#ff6b6b');
      checkGameOver();
    }
  } else {
    combo=0;SFX.click();
  }
  document.getElementById('scoreEl').textContent=Math.floor(score);
  document.getElementById('comboEl').textContent=combo;
}

function checkGameOver(){
  if(misses>=5){
    gameOver=true;
    if(score>best){best=Math.floor(score);localStorage.setItem('trumpetblast_best',best);}
    document.getElementById('bestEl').textContent=best;
  }
}

function drawValveDiagram(x,y,f){
  ctx.save();ctx.translate(x,y);
  for(let i=0;i<3;i++){
    const vx=i*26;
    ctx.strokeStyle='#ffd166';ctx.lineWidth=2;
    ctx.strokeRect(vx,0,18,34);
    if(f.v[i]){ctx.fillStyle='#f4a300';ctx.fillRect(vx+3,4,12,26);}
  }
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
  ctx.fillText(f.name,39,52);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#ffd16655';ctx.fillRect(HITX-2,10,4,H-20);
  ctx.fillStyle='#ffd16622';ctx.beginPath();ctx.arc(HITX,H/2,34,0,7);ctx.fill();

  if(!started){
    ctx.fillStyle='#ffd166';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_trumpet','Hold valves and press BLAST / Space to start'),W/2,H/2-6);
    requestAnimationFrame(loop);return;
  }
  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('score_final','Score: {s}  Best: {b}').replace('{s}',Math.floor(score)).replace('{b}',best),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+40);
    requestAnimationFrame(loop);return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnNote();}

  notes.forEach(n=>n.x-=spd*dt);
  notes.forEach(n=>{
    if(!n.judged&&n.x<HITX-70){
      n.judged=true;misses++;combo=0;SFX.fail();
      document.getElementById('comboEl').textContent=0;
      checkGameOver();
    }
  });
  notes=notes.filter(n=>n.x>-60);

  notes.forEach(n=>drawValveDiagram(n.x-39,H/2-40,n.f));

  popups=popups.filter(p=>p.life>0);
  popups.forEach(p=>{
    p.life-=dt;p.y-=0.6*dt;
    ctx.globalAlpha=Math.max(0,p.life/40);
    ctx.fillStyle=p.color;ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(p.text,p.x,p.y-10);
    ctx.globalAlpha=1;
  });

  ctx.fillStyle='#f4a30099';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText('Misses: '+misses+'/5',10,18);

  requestAnimationFrame(loop);
}
c.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
loop();
</script></body></html>
