<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#0a0a2a}
#ui{color:#f8bbd0;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#launchBtn{display:block;margin:10px auto;padding:16px 40px;border-radius:12px;background:#ec407a;color:#fff;border:none;font-weight:700;font-size:1.1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#launchBtn:active{background:#c2185b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Fireworks Show</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Shells: 8</div>
    <canvas id="c" width="360" height="360"></canvas>
    <button id="launchBtn">HOLD TO CHARGE</button>
  </div>
  <div class="game-instructions">Hold the button to charge launch power — release when the power bar lines up with the gold target zone. A well-timed launch bursts right in the zone for max points. You've got 8 shells!</div>
</div>
<script>
const W=360,H=360,GROUND=H-30;
let power,dir,zoneStart,zoneLen,shells,score,shell,state;

function loadBest(){return +(localStorage.getItem('fireworksshow_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('fireworksshow_best',v);}

function init(){shells=8;score=0;state='play';newTarget();power=0;dir=1;shell=null;}
function newTarget(){
  zoneLen=Math.max(10,26-score);
  zoneStart=20+Math.random()*54;
}

const btn=document.getElementById('launchBtn');
let holding=false;
function press(e){e.preventDefault();if(state==='over'){init();return;}if(shell)return;holding=true;}
function release(e){
  e.preventDefault();
  if(!holding||shell)return;
  holding=false;
  launch();
}
btn.addEventListener('mousedown',press);
btn.addEventListener('mouseup',release);
btn.addEventListener('mouseleave',e=>{holding=false;});
btn.addEventListener('touchstart',press,{passive:false});
btn.addEventListener('touchend',release,{passive:false});

function launch(){
  shells--;
  const inZone=power>=zoneStart&&power<=zoneStart+zoneLen;
  shell={x:W/2,y:GROUND,vy:-(4+power/10),burst:false,burstT:0,inZone,power};
  SFX.jump();
}

function update(){
  if(state!=='play')return;
  if(holding&&!shell){
    power+=dir*2.2;
    if(power>90||power<10)dir*=-1;
  }
  if(shell&&!shell.burst){
    shell.y+=shell.vy;
    shell.vy+=0.08;
    if(shell.vy>=0){
      shell.burst=true;shell.burstT=30;
      if(shell.inZone){
        score+=10;
        SFX.success();
        saveBest(score);
      }else{
        SFX.fail();
      }
      newTarget();
    }
  }else if(shell&&shell.burst){
    shell.burstT--;
    if(shell.burstT<=0){
      shell=null;
      if(shells<=0){state='over';SFX.win();}
    }
  }
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#0a0a2a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1a3a';ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(20,40,W-40,16);
  ctx.fillStyle='#ffca28';
  ctx.fillRect(20+zoneStart*(W-40)/100,40,zoneLen*(W-40)/100,16);
  if(holding){
    ctx.fillStyle='#fff';
    ctx.fillRect(20+power*(W-40)/100-2,36,4,24);
  }

  if(shell){
    if(!shell.burst){
      ctx.fillStyle='#ff8a65';
      ctx.beginPath();ctx.arc(shell.x,shell.y,5,0,Math.PI*2);ctx.fill();
    }else{
      ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.globalAlpha=Math.max(0.2,shell.burstT/30);
      ctx.fillText(shell.inZone?'🎆':'✨',shell.x,GROUND-40);
      ctx.globalAlpha=1;
    }
  }

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f8bbd0';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('SHOW OVER!',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${score} | Shells: ${Math.max(0,shells)}`;
}

init();draw();
</script></body></html>
