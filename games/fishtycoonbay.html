<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#01579b;cursor:pointer}
#ui{color:#81d4fa;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Fish Tycoon Bay</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Coins: 0 | Catches: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Tap to cast. Wait for the "BITE!" alert, then tap when the moving marker is inside the green zone to reel it in. Miss and the fish gets away!</div>
</div>
<script>
const W=360,H=360;
const SPECIES=[
  {name:'Minnow',emoji:'🐟',value:5,rarity:.5},
  {name:'Bass',emoji:'🐠',value:12,rarity:.28},
  {name:'Golden Koi',emoji:'🐡',value:30,rarity:.15},
  {name:'Legendary Shark',emoji:'🦈',value:80,rarity:.07},
];
let coins=0,catches=0,state='idle',waitTimer=0,marker=0,markerDir=1,zoneStart=0,zoneWidth=0,currentFish=null,msg='Tap to cast your line';

function pickFish(){
  const r=Math.random();let acc=0;
  for(const s of SPECIES){acc+=s.rarity;if(r<acc)return s;}
  return SPECIES[0];
}

function loadBest(){return +(localStorage.getItem('fishbay_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('fishbay_best',v);}

const c=document.getElementById('c'),ctx=c.getContext('2d');

c.addEventListener('click',()=>{
  if(state==='idle'){
    state='waiting';
    waitTimer=60+Math.random()*90;
    msg='Waiting for a bite...';
  }else if(state==='biting'){
    state='reeling';
    currentFish=pickFish();
    zoneWidth=Math.max(30,70-catches*1.2);
    zoneStart=Math.random()*(W-40-zoneWidth)+20;
    marker=20;markerDir=1;
  }else if(state==='reeling'){
    if(marker>=zoneStart&&marker<=zoneStart+zoneWidth){
      coins+=currentFish.value;catches++;
      msg=`Caught a ${currentFish.name}! +${currentFish.value}`;
      saveBest(coins);
    }else{
      msg='It got away...';
    }
    state='idle';
    updateUI();
  }
});

function update(){
  if(state==='waiting'){
    waitTimer--;
    if(waitTimer<=0){state='biting';msg='BITE! Tap now!';waitTimer=45;}
  }else if(state==='biting'){
    waitTimer--;
    if(waitTimer<=0){state='idle';msg='Too slow, it swam off.';}
  }else if(state==='reeling'){
    marker+=markerDir*4;
    if(marker>W-20||marker<20)markerDir*=-1;
  }
}

function draw(){
  ctx.fillStyle='#01579b';ctx.fillRect(0,0,W,H);
  for(let i=0;i<4;i++){
    ctx.strokeStyle='rgba(255,255,255,.06)';
    ctx.beginPath();ctx.moveTo(0,60+i*70);ctx.lineTo(W,60+i*70);ctx.stroke();
  }

  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(state==='biting'?'❗':'🎣',W/2,120);

  if(state==='reeling'){
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.fillRect(20,200,W-40,24);
    ctx.fillStyle='#66bb6a';
    ctx.fillRect(zoneStart,200,zoneWidth,24);
    ctx.fillStyle='#fff';
    ctx.fillRect(marker-2,194,4,36);
  }

  ctx.fillStyle='#e1f5fe';ctx.font='16px Arial';
  ctx.fillText(msg,W/2,280);
  ctx.font='14px Arial';ctx.fillStyle='#81d4fa';
  ctx.fillText('Tap to cast / bite / reel',W/2,310);

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Coins: ${coins} | Catches: ${catches}`;
}

draw();
</script></body></html>
