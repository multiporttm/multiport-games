<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#xr-wrap{background:#0c1220;border-radius:14px;padding:14px;text-align:center}
#hud{display:flex;justify-content:space-between;max-width:600px;margin:0 auto 8px;color:#dbe7ff;font-weight:800;font-size:.95rem}
#hud span{color:#5ad1ff}
#timerbar-outer{max-width:600px;margin:0 auto 8px;height:10px;background:#1a2338;border-radius:6px;overflow:hidden}
#timerbar{height:100%;width:100%;background:linear-gradient(90deg,#5ad1ff,#7ee787);transition:width .08s linear}
#c{background:#05070c;border-radius:10px;cursor:crosshair;touch-action:none;display:block;margin:0 auto}
#msg{min-height:1.6em;color:#ffd54f;font-weight:800;margin-top:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">X-Ray Reading</div>
  <div class="game-frame">
    <div id="xr-wrap">
      <div id="hud"><div>Streak: <span id="streakVal">0</span></div><div>Score: <span id="scoreVal">0</span></div><div>Best: <span id="bestVal">0</span></div></div>
      <div id="timerbar-outer"><div id="timerbar"></div></div>
      <canvas id="c" width="600" height="420"></canvas>
      <div id="msg">Click Start to begin the shift</div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Study each X-ray and click the spot with the fracture or anomaly before time runs out. Wrong clicks cost points. Diagnose correctly in a row to raise your streak as scans get subtler and faster.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const streakEl=document.getElementById('streakVal'),scoreEl=document.getElementById('scoreVal'),bestEl=document.getElementById('bestVal');
const msgEl=document.getElementById('msg'),bar=document.getElementById('timerbar');
let best=parseInt(localStorage.getItem('xrayreading_best')||'0',10);
bestEl.textContent=best;

let score=0,streak=0,round=0,anomaly=null,timeLeft=0,timeMax=0,running=false,locked=false,rafId=null,lastT=null;
let bones=[];

function rand(a,b){return a+Math.random()*(b-a);}

function genBones(){
  bones=[];
  // spine
  bones.push({type:'spine',x:W/2,y:20,w:34,h:H-40});
  // ribs, alternating pairs
  const ribCount=6;
  for(let i=0;i<ribCount;i++){
    const y=70+i*48;
    bones.push({type:'rib',side:-1,cx:W/2,cy:y,rx:150+rand(-10,10),ry:26+rand(-4,4)});
    bones.push({type:'rib',side:1,cx:W/2,cy:y,rx:150+rand(-10,10),ry:26+rand(-4,4)});
  }
  // pelvis
  bones.push({type:'pelvis',cx:W/2,cy:H-55});
}

function drawBonesBase(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  // grain
  for(let i=0;i<220;i++){
    ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.03})`;
    ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
  }
  ctx.strokeStyle='rgba(210,220,235,0.85)';
  ctx.lineWidth=10;
  ctx.lineCap='round';
  bones.forEach(b=>{
    if(b.type==='spine'){
      ctx.save();
      ctx.strokeStyle='rgba(215,222,235,0.9)';
      ctx.lineWidth=22;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+b.h);ctx.stroke();
      ctx.strokeStyle='rgba(60,70,90,0.9)';
      ctx.lineWidth=3;
      for(let y=b.y+8;y<b.y+b.h;y+=16){ctx.beginPath();ctx.moveTo(b.x-11,y);ctx.lineTo(b.x+11,y);ctx.stroke();}
      ctx.restore();
    } else if(b.type==='rib'){
      ctx.beginPath();
      const startA=b.side<0?Math.PI*0.5:Math.PI*0.5;
      if(b.side<0)ctx.ellipse(b.cx,b.cy,b.rx,b.ry,0,Math.PI*0.55,Math.PI*1.05);
      else ctx.ellipse(b.cx,b.cy,b.rx,b.ry,0,-Math.PI*0.05,Math.PI*0.45);
      ctx.lineWidth=9;
      ctx.strokeStyle='rgba(200,210,225,0.8)';
      ctx.stroke();
    } else if(b.type==='pelvis'){
      ctx.strokeStyle='rgba(205,215,230,0.85)';
      ctx.lineWidth=14;
      ctx.beginPath();ctx.ellipse(b.cx-70,b.cy,55,45,0,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.ellipse(b.cx+70,b.cy,55,45,0,0,Math.PI*2);ctx.stroke();
    }
  });
}

function pickAnomalySpot(){
  // choose a rib or spine region for realism
  const pool=bones.filter(b=>b.type==='rib');
  const b=pool[Math.floor(Math.random()*pool.length)];
  const t=rand(0.25,0.75);
  let ang;
  if(b.side<0) ang=Math.PI*0.55+t*(Math.PI*0.5);
  else ang=-Math.PI*0.05+t*(Math.PI*0.5);
  const x=b.cx+Math.cos(ang)*b.rx;
  const y=b.cy+Math.sin(ang)*b.ry;
  return {x,y};
}

function drawAnomaly(alpha){
  if(!anomaly)return;
  ctx.save();
  ctx.translate(anomaly.x,anomaly.y);
  ctx.rotate(anomaly.rot);
  ctx.strokeStyle=`rgba(20,20,30,${alpha})`;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-10,-6);
  ctx.lineTo(-2,-1);
  ctx.lineTo(-5,4);
  ctx.lineTo(3,1);
  ctx.lineTo(10,7);
  ctx.stroke();
  ctx.restore();
}

function difficultyForRound(r){
  const timeSec=Math.max(2.2,5.5-r*0.28);
  const radius=Math.max(14,34-r*1.8);
  const alpha=Math.max(0.16,0.6-r*0.04);
  return {timeSec,radius,alpha};
}

function newRound(){
  locked=false;
  genBones();
  anomaly=pickAnomalySpot();
  anomaly.rot=rand(0,Math.PI*2);
  const d=difficultyForRound(round);
  anomaly.radius=d.radius;
  anomaly.alpha=d.alpha;
  timeMax=d.timeSec;
  timeLeft=d.timeSec;
  msgEl.textContent=I18N.t('xr_find','Find the anomaly!');
  render();
}

function render(){
  drawBonesBase();
  if(anomaly)drawAnomaly(anomaly.alpha);
}

function endRun(reasonKey,reasonFallback){
  running=false;
  cancelAnimationFrame(rafId);
  if(score>best){best=score;localStorage.setItem('xrayreading_best',String(best));bestEl.textContent=best;}
  msgEl.textContent=I18N.t(reasonKey,reasonFallback)+' '+I18N.t('xr_final_score','Final score: {s}. Click to try again.').replace('{s}',score);
  bar.style.width='100%';
  c.style.cursor='pointer';
}

function loop(ts){
  if(!running)return;
  if(lastT===null)lastT=ts;
  const dt=(ts-lastT)/1000;
  lastT=ts;
  timeLeft-=dt;
  bar.style.width=Math.max(0,(timeLeft/timeMax)*100)+'%';
  if(timeLeft<=0 && !locked){
    locked=true;
    SFX.fail();
    streak=0;streakEl.textContent=streak;
    endRun('xr_timeout','Time ran out!');
    return;
  }
  rafId=requestAnimationFrame(loop);
}

function startGame(){
  score=0;streak=0;round=0;
  scoreEl.textContent=score;streakEl.textContent=streak;
  running=true;lastT=null;
  c.style.cursor='crosshair';
  newRound();
  rafId=requestAnimationFrame(loop);
}

function handleClick(evt){
  if(!running){ startGame(); return; }
  if(locked)return;
  const rect=c.getBoundingClientRect();
  const cx=(evt.clientX-rect.left)*(W/rect.width);
  const cy=(evt.clientY-rect.top)*(H/rect.height);
  const dx=cx-anomaly.x,dy=cy-anomaly.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<=anomaly.radius){
    locked=true;
    SFX.success();
    streak++;
    score+=100+streak*10;
    round++;
    scoreEl.textContent=score;streakEl.textContent=streak;
    msgEl.textContent=I18N.t('xr_correct','Correct diagnosis!');
    lastT=null;
    setTimeout(()=>{ if(running) newRound(); },500);
  } else {
    SFX.error();
    score=Math.max(0,score-50);
    streak=0;
    scoreEl.textContent=score;streakEl.textContent=streak;
    msgEl.textContent=I18N.t('xr_wrong','Missed — that tissue looks normal.');
  }
}

function pointerHandler(evt){
  evt.preventDefault();
  const point=evt.touches&&evt.touches.length?evt.touches[0]:evt;
  handleClick(point);
}
c.addEventListener('click',handleClick);
c.addEventListener('touchstart',pointerHandler,{passive:false});

genBones();
render();
</script></body></html>
