<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1565c0;display:block;border-radius:8px;touch-action:none}
#score-display{color:#e3f2fd;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Paper Boat Race</div>
  <div class="game-frame">
    <div id="score-display">Distance: 0m | Lives: 3 | Best: 0m</div>
    <canvas id="c" width="500" height="600"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>A/D</b> (or <b>drag</b> on touch) to steer your paper boat left and right down the stream. Dodge leaves, twigs, and drain grates — hitting one costs a life. Ride the brighter fast-current lanes for a speed boost!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=500,H=600;
let best=parseFloat(localStorage.getItem('paperboatrace_best')||'0');

let boat,obstacles,lanes,distance,lives,gameState,spawnTimer,speed,lastTime,scrollOffset;

function statusDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('boat_status','Distance: {d}m | Lives: {l} | Best: {b}m')
      .replace('{d}',Math.floor(distance))
      .replace('{l}',lives)
      .replace('{b}',Math.floor(best));
}

function reset(){
  boat={x:W/2,y:H-100,w:34,h:50,vx:0};
  obstacles=[];
  distance=0;
  lives=3;
  gameState='ready'; // ready, playing, over
  spawnTimer=0;
  speed=3;
  lastTime=null;
  scrollOffset=0;
  statusDisplay();
}

// Fast current lanes: bands that shift slowly
function laneBoostAt(x){
  const band=Math.sin((x/W)*Math.PI*2 + scrollOffset*0.002);
  return band>0.5;
}

function spawnObstacle(){
  const types=['leaf','twig','grate'];
  const type=types[Math.floor(Math.random()*types.length)];
  obstacles.push({
    x:40+Math.random()*(W-80),
    y:-40,
    type,
    w:type==='grate'?70:28,
    h:type==='grate'?26:24,
    rot:Math.random()*Math.PI*2
  });
}

const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'&&(gameState==='ready'||gameState==='over'))reset();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let dragX=null;
c.addEventListener('mousedown',e=>{ if(gameState==='ready')gameState='playing'; if(gameState==='over')reset(); dragX=getX(e); });
c.addEventListener('mousemove',e=>{ if(dragX!==null)dragX=getX(e); });
window.addEventListener('mouseup',()=>{dragX=null;});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState==='ready')gameState='playing';
  if(gameState==='over'){reset();return;}
  dragX=getX(e);
},{passive:false});
c.addEventListener('touchmove',e=>{ e.preventDefault(); if(dragX!==null)dragX=getX(e); },{passive:false});
c.addEventListener('touchend',e=>{ e.preventDefault(); dragX=null; },{passive:false});

function getX(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  return (cx-r.left)*(W/r.width);
}

function rectHit(a,b){
  return Math.abs(a.x-b.x) < (a.w+b.w)/2*0.7 && Math.abs(a.y-b.y) < (a.h+b.h)/2*0.7;
}

function drawStream(){
  // gutter walls
  ctx.fillStyle='#616161';
  ctx.fillRect(0,0,26,H);
  ctx.fillRect(W-26,0,26,H);
  // water base
  ctx.fillStyle='#1976d2';
  ctx.fillRect(26,0,W-52,H);
  // fast current bands
  for(let x=26;x<W-26;x+=4){
    if(laneBoostAt(x)){
      ctx.fillStyle='rgba(129,212,250,0.35)';
      ctx.fillRect(x,0,4,H);
    }
  }
  // flow lines
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=2;
  for(let i=0;i<10;i++){
    const lx=40+i*46;
    const off=(scrollOffset*1.5+i*60)%(H+60)-60;
    ctx.beginPath();ctx.moveTo(lx,off);ctx.lineTo(lx,off+30);ctx.stroke();
  }
}

function drawBoat(){
  ctx.save();
  ctx.translate(boat.x,boat.y);
  ctx.rotate(boat.vx*0.04);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(0,-25);
  ctx.lineTo(18,10);
  ctx.lineTo(0,22);
  ctx.lineTo(-18,10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#bdbdbd';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-25);ctx.lineTo(0,22);ctx.stroke();
  ctx.restore();
}

function drawObstacle(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.rotate(o.rot);
  if(o.type==='leaf'){
    ctx.fillStyle='#8d6e63';
    ctx.beginPath();ctx.ellipse(0,0,14,9,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5d4037';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();
  } else if(o.type==='twig'){
    ctx.strokeStyle='#6d4c41';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(6,-8);ctx.stroke();
  } else {
    ctx.fillStyle='#424242';
    ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
    ctx.strokeStyle='#212121';ctx.lineWidth=3;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(i*13,-o.h/2);ctx.lineTo(i*13,o.h/2);ctx.stroke();
    }
  }
  ctx.restore();
}

function update(dt){
  if(gameState!=='playing')return;
  scrollOffset+=speed*dt;
  distance+=speed*dt*0.12;
  if(distance>best)best=distance;
  speed=Math.min(9,3+distance/300);

  // steering
  let steer=0;
  if(keys.ArrowLeft||keys.KeyA)steer=-1;
  if(keys.ArrowRight||keys.KeyD)steer=1;
  if(dragX!==null){
    const diff=dragX-boat.x;
    steer=Math.max(-1,Math.min(1,diff/40));
  }
  boat.vx+=steer*0.5*dt;
  boat.vx*=0.9;
  // current boost pushes boat slightly and speeds progress
  if(laneBoostAt(boat.x)){
    distance+=speed*dt*0.06;
  }
  boat.x+=boat.vx*dt*3;
  boat.x=Math.max(26+18,Math.min(W-26-18,boat.x));

  // spawn obstacles
  spawnTimer+=dt;
  const interval=Math.max(24,55-distance/20);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle();}

  obstacles=obstacles.filter(o=>o.y<H+60);
  obstacles.forEach(o=>{
    o.y+=speed*dt;
    o.rot+=0.01*dt;
    if(rectHit(boat,o)&&!o.hit){
      o.hit=true;
      lives--;
      SFX.hit();
      obstacles=obstacles.filter(ob=>ob!==o);
      if(lives<=0){
        gameState='over';
        if(distance>best){best=distance;localStorage.setItem('paperboatrace_best',best);}
        SFX.lose();
      }
    }
  });
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  drawStream();
  update(dt);
  obstacles.forEach(drawObstacle);
  drawBoat();

  if(gameState==='ready'){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('boat_start_hint','Click/Tap or press a key to start'),W/2,H/2);
  }

  if(gameState==='over'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('boat_sunk','BOAT SUNK!'),W/2,H/2-30);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('boat_final_dist','Distance: {d}m').replace('{d}',Math.floor(distance)),W/2,H/2+2);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+30);
  }

  statusDisplay();
  requestAnimationFrame(loop);
}
reset();
loop();
</script></body></html>
