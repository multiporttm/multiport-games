<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(135deg,#37474f,#90a4ae);display:block;border-radius:8px;cursor:crosshair;touch-action:none}
#score-display{color:#eceff1;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#score-display span{white-space:nowrap}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Skeet Shoot</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Ammo: 25 | Acc: 0% | Hi: 0</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move the <b>Mouse</b> or <b>Finger</b> to aim, and <b>Click / Tap</b> to fire. Lead your shots ahead of the moving targets — you only have <b>25 shots</b> per round!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450,GROUND=H-40;
let hi=parseInt(localStorage.getItem('skeetshoot_hi')||'0',10);
let score=0,ammo=25,hits=0,shots=0,gameOver=false,started=false;
let targets=[],particles=[];
let mx=W/2,my=H/2;
let spawnTimer=0,lastTime=null;

function reset(){score=0;ammo=25;hits=0;shots=0;gameOver=false;started=false;targets=[];particles=[];spawnTimer=0;lastTime=null;}

function spawnTarget(){
  const fromLeft=Math.random()<0.5;
  const x=fromLeft?-20:W+20;
  const vx=(fromLeft?1:-1)*(3+Math.random()*2.5);
  const y=GROUND-10;
  const vy=-(9+Math.random()*4);
  targets.push({x,y,vx,vy,r:16,alive:true,age:0});
}

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

c.addEventListener('mousemove',e=>{const p=pointerPos(e);mx=p.x;my=p.y;});
c.addEventListener('touchmove',e=>{e.preventDefault();const p=pointerPos(e);mx=p.x;my=p.y;},{passive:false});

function fire(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  if(ammo<=0)return;
  ammo--;shots++;
  let hitOne=false;
  for(const t of targets){
    if(!t.alive)continue;
    const dx=t.x-x,dy=t.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<t.r+10){
      t.alive=false;hitOne=true;hits++;
      score+=Math.max(10,50-Math.floor(t.age/4));
      SFX.point();
      for(let i=0;i<10;i++){
        particles.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-2,life:24,color:Math.random()<0.5?'#ff8a65':'#ffb74d'});
      }
      break;
    }
  }
  if(!hitOne)SFX.error();
  if(score>hi){hi=score;localStorage.setItem('skeetshoot_hi',String(hi));}
  if(ammo<=0){
    gameOver=true;
    if(hits/Math.max(1,shots)>=0.5)SFX.win();else SFX.lose();
  }
}

c.addEventListener('mousedown',e=>{const p=pointerPos(e);fire(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=pointerPos(e);mx=p.x;my=p.y;fire(p.x,p.y);},{passive:false});

function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#37474f');sky.addColorStop(1,'#90a4ae');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#455a64';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#263238';ctx.fillRect(0,GROUND,W,4);
}

function drawTarget(t){
  ctx.save();
  ctx.translate(t.x,t.y);
  ctx.rotate(t.age*0.15);
  ctx.fillStyle='#ff7043';
  ctx.beginPath();ctx.ellipse(0,0,t.r,t.r*0.45,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#bf360c';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function drawCrosshair(){
  ctx.strokeStyle='#ffeb3b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(mx-14,my);ctx.lineTo(mx+14,my);ctx.moveTo(mx,my-14);ctx.lineTo(mx,my+14);ctx.stroke();
  ctx.beginPath();ctx.arc(mx,my,8,0,Math.PI*2);ctx.stroke();
}

function updateScoreDisplay(){
  const acc=shots>0?Math.round(100*hits/shots):0;
  document.getElementById('score-display').textContent=
    I18N.t('skeet_status','Score: {s} | Ammo: {a} | Acc: {p}% | Hi: {h}')
      .replace('{s}',score).replace('{a}',ammo).replace('{p}',acc).replace('{h}',hi);
}

function loop(){
  drawSky();

  if(!started){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_skeet','Click / Tap to start'),W/2,H/2);
    drawCrosshair();
    updateScoreDisplay();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    targets.forEach(t=>{if(t.alive)drawTarget(t);});
    particles.forEach(p=>{ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);});
    const acc=shots>0?Math.round(100*hits/shots):0;
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('skeet_final','Hit {n} of {m} — {p}% accuracy').replace('{n}',hits).replace('{m}',shots).replace('{p}',acc),W/2,H/2+6);
    ctx.fillText(I18N.t('restart_hint','Tap or Click to restart'),W/2,H/2+36);
    drawCrosshair();
    updateScoreDisplay();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  spawnTimer+=dt;
  const interval=Math.max(28,55-score/20);
  if(spawnTimer>=interval&&targets.filter(t=>t.alive).length<5){spawnTimer=0;spawnTarget();}

  targets.forEach(t=>{
    if(!t.alive)return;
    t.age+=dt;
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.vy+=0.28*dt;
    if(t.y>GROUND+40||t.x<-60||t.x>W+60){t.alive=false;}
    drawTarget(t);
  });
  targets=targets.filter(t=>t.alive||t.age<200).slice(-40);

  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.3*dt;p.life-=dt;});
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);});

  drawCrosshair();
  updateScoreDisplay();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
