<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2b1608;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;align-items:center;color:#ffd54f;font-size:1.05rem;font-weight:800;padding:6px 4px;max-width:800px;margin:0 auto}
#meterWrap{background:#3a2213;border-radius:10px;height:14px;max-width:800px;margin:0 auto 6px;overflow:hidden;border:2px solid #5c3418}
#meterFill{height:100%;background:linear-gradient(90deg,#e94560,#ffd54f);width:60%;transition:width .15s}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Saloon Piano</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreDisp">Score: 0 | Hi: 0</span><span id="comboDisp">Combo: 0</span></div>
    <div id="meterWrap"><div id="meterFill"></div></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hit <b>A</b> <b>S</b> <b>D</b> <b>F</b> (or tap the lanes) as each note crosses the gold line to keep the crowd dancing. Build your <b>combo</b> and don't let the <b>crowd meter</b> hit empty!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const LANES=4;
const laneW=W/LANES;
const keyLabels=['A','S','D','F'];
const keyCodes=['KeyA','KeyS','KeyD','KeyF'];
const laneColors=['#e94560','#ffd54f','#4dd0e1','#7ec850'];
const hitY=340,hitTol=32;

let score=0,hi=parseFloat(localStorage.getItem('saloonpiano_hi')||'0');
let combo=0,maxCombo=0,meter=60,notes=[],particles=[];
let frame=0,gameOver=false,started=false,lastTime=null,spawnTimer=0,laneFlash=[0,0,0,0];
let spawnInterval=52; // frames-equivalent at dt scale

function reset(){
  score=0;combo=0;maxCombo=0;meter=60;notes=[];particles=[];frame=0;gameOver=false;started=false;lastTime=null;spawnTimer=0;laneFlash=[0,0,0,0];spawnInterval=52;
}

function spawnNote(){
  const lane=Math.floor(Math.random()*LANES);
  notes.push({lane,y:-20,hit:false});
}

function popParticles(lane,color){
  const x=lane*laneW+laneW/2;
  for(let i=0;i<10;i++){
    particles.push({x,y:hitY,vx:(Math.random()-0.5)*6,vy:-Math.random()*6-1,life:24,color});
  }
}

function tryHit(lane){
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  laneFlash[lane]=8;
  // find closest unhit note in this lane within tolerance
  let best=null,bestDist=999;
  for(const n of notes){
    if(n.lane===lane&&!n.hit){
      const d=Math.abs(n.y-hitY);
      if(d<bestDist){bestDist=d;best=n;}
    }
  }
  if(best&&bestDist<=hitTol){
    best.hit=true;
    combo++;
    if(combo>maxCombo)maxCombo=combo;
    const mult=1+Math.floor(combo/10)*0.5;
    score+=Math.round(10*mult);
    meter=Math.min(100,meter+5);
    popParticles(lane,laneColors[lane]);
    SFX.success();
  }else{
    combo=0;
    meter=Math.max(0,meter-6);
    SFX.error();
  }
}

document.addEventListener('keydown',e=>{
  const idx=keyCodes.indexOf(e.code);
  if(idx>=0){e.preventDefault();tryHit(idx);}
  else if(e.code==='Space'&&(!started||gameOver)){e.preventDefault();tryHit(0);}
});

function pointerLane(clientX){
  const rect=c.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  return Math.max(0,Math.min(LANES-1,Math.floor(x/laneW)));
}
c.addEventListener('pointerdown',e=>{e.preventDefault();tryHit(pointerLane(e.clientX));});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)tryHit(pointerLane(t.clientX));
},{passive:false});

function drawLane(i){
  const x=i*laneW;
  ctx.fillStyle=i%2===0?'#3a2213':'#33200f';
  ctx.fillRect(x,0,laneW,H);
  // hit zone
  ctx.fillStyle=laneFlash[i]>0?laneColors[i]+'55':'#00000022';
  ctx.fillRect(x,hitY-hitTol,laneW,hitTol*2);
  ctx.strokeStyle='#5c3418';
  ctx.strokeRect(x,0,laneW,H);
}

function drawKeyBar(){
  for(let i=0;i<LANES;i++){
    const x=i*laneW;
    ctx.fillStyle=laneFlash[i]>0?laneColors[i]:'#1d1108';
    ctx.fillRect(x+6,hitY+hitTol+10,laneW-12,46);
    ctx.strokeStyle='#000';ctx.strokeRect(x+6,hitY+hitTol+10,laneW-12,46);
    ctx.fillStyle=laneFlash[i]>0?'#1d1108':'#fff8e1';
    ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(keyLabels[i],x+laneW/2,hitY+hitTol+40);
    if(laneFlash[i]>0)laneFlash[i]--;
  }
}

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_hi_label_p','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('comboDisp').textContent=I18N.t('combo_label','Combo: {c}').replace('{c}',combo);
  document.getElementById('meterFill').style.width=meter+'%';
  document.getElementById('meterFill').style.background=meter<30?'linear-gradient(90deg,#e94560,#e94560)':'linear-gradient(90deg,#e94560,#ffd54f)';
}

function loop(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<LANES;i++)drawLane(i);
  ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,hitY-hitTol);ctx.lineTo(W,hitY-hitTol);ctx.moveTo(0,hitY+hitTol);ctx.lineTo(W,hitY+hitTol);ctx.stroke();
  ctx.lineWidth=1;

  if(!started){
    drawKeyBar();
    ctx.fillStyle='#ffd54f';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_p','Tap a lane or press A S D F to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawKeyBar();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+18);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;
  frame+=dt;

  spawnTimer+=dt;
  spawnInterval=Math.max(26,52-score/200);
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnNote();}

  const fallSpeed=4+score/400;
  for(const n of notes){
    if(!n.hit)n.y+=fallSpeed*dt;
  }
  // missed notes
  for(const n of notes){
    if(!n.hit&&n.y>hitY+hitTol+2&&!n.missed){
      n.missed=true;
      combo=0;
      meter=Math.max(0,meter-10);
      SFX.fail();
    }
  }
  notes=notes.filter(n=>n.y<H+20);

  // passive drain, keeps pressure on
  meter=Math.max(0,meter-0.03*dt);

  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.2*dt;p.life-=dt;});
  particles=particles.filter(p=>p.life>0);

  drawKeyBar();
  notes.forEach(n=>{
    if(n.hit)return;
    const x=n.lane*laneW+6,y=n.y;
    ctx.fillStyle=laneColors[n.lane];
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,laneW-12,22,6):ctx.rect(x,y,laneW-12,22);ctx.fill();
  });
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.globalAlpha=Math.max(0,p.life/24);
    ctx.fillRect(p.x-3,p.y-3,6,6);
    ctx.globalAlpha=1;
  });

  if(meter<=0&&!gameOver){
    gameOver=true;
    SFX.lose();
    if(score>hi){hi=score;localStorage.setItem('saloonpiano_hi',String(hi));}
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
