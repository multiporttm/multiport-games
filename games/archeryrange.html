<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#2e7d32;cursor:pointer}
#ui{color:#c8e6c9;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Archery Range</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Arrows: 6</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">A marker sweeps left and right across the target. Tap when it's over the center rings for the most points — you've got 6 arrows per round!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=180,R=110;
let markerX,dir,arrows,score,state,shots;

function loadBest(){return +(localStorage.getItem('archeryrange_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('archeryrange_best',v);}

function init(){arrows=6;score=0;state='play';markerX=-R;dir=1;shots=[];}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(arrows<=0)return;
  arrows--;
  const dist=Math.abs(markerX);
  let pts=0;
  if(dist<14)pts=10;else if(dist<32)pts=7;else if(dist<55)pts=4;else if(dist<80)pts=1;
  score+=pts;
  SFX[pts>=7?'success':pts>0?'point':'fail']();
  saveBest(score);
  shots.push({x:CX+markerX,y:CY,pts});
  if(arrows<=0){state='over';SFX.win();}
  updateUI();
});

function update(){
  if(state!=='play')return;
  markerX+=dir*3.2;
  if(markerX>R||markerX<-R)dir*=-1;
}

function draw(){
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,W,H);

  const rings=[[R,'#fff'],[R*0.75,'#333'],[R*0.5,'#42a5f5'],[R*0.28,'#ef5350'],[R*0.12,'#ffd54f']];
  rings.forEach(([rad,col])=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(CX,CY,rad,0,Math.PI*2);ctx.fill();});

  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(CX+markerX,CY-R-20);ctx.lineTo(CX+markerX,CY-R-4);ctx.stroke();
  ctx.fillStyle='#ffca28';ctx.beginPath();ctx.moveTo(CX+markerX,CY-R-2);ctx.lineTo(CX+markerX-6,CY-R-14);ctx.lineTo(CX+markerX+6,CY-R-14);ctx.fill();

  ctx.font='12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  shots.forEach(s=>{
    ctx.fillStyle='#212121';
    ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#c8e6c9';ctx.font='bold 26px Arial';
    ctx.fillText('ROUND OVER',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to shoot again',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Score: ${score} | Arrows: ${Math.max(0,arrows)}`;
}

init();draw();
</script></body></html>
