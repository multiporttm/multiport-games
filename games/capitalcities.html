<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Capital Cities</title><meta name="description" content="Play Capital Cities free online — A country is shown with 4 capital city choices; click the correct one before the timer runs out and build a streak."><link rel="canonical" href="https://games.multiportllc.com/games/capitalcities"><meta property="og:title" content="Capital Cities - Multiport Games"><meta property="og:description" content="Play Capital Cities free online — A country is shown with 4 capital city choices; click the correct one before the timer runs out and build a streak."><meta property="og:url" content="https://games.multiportllc.com/games/capitalcities"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Capital Cities","description":"Play Capital Cities free online instantly. A country name is shown with four multiple-choice capital city options — click the correct capital before the per-round timer runs out. Build a streak for bonus points; three wrong answers or timeouts ends the game. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/capitalcities","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#0d47a1,#4fc3f7);border-radius:14px;padding:22px;text-align:center}
#status{color:#fff;font-size:1rem;font-weight:700;margin-bottom:8px;min-height:1.4em;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#country{color:#fff;font-size:2rem;font-weight:900;margin:6px 0 18px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#timerbar-wrap{width:320px;max-width:90vw;height:10px;background:rgba(255,255,255,.2);border-radius:5px;margin:0 auto 18px;overflow:hidden}
#timerbar{height:100%;background:linear-gradient(90deg,#00e676,#ffeb3b,#ff5252);width:100%;transition:width .1s linear}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
.choice{background:rgba(255,255,255,.92);border:none;border-radius:10px;padding:14px 8px;font-size:1.05rem;font-weight:700;color:#0d47a1;cursor:pointer;transition:transform .1s,background .15s}
.choice:active{transform:scale(.96)}
.choice.correct{background:#4caf50;color:#fff}
.choice.wrong{background:#e94560;color:#fff}
#stats{color:#fff;font-weight:700;margin-top:16px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
@media(max-width:420px){#choices{grid-template-columns:1fr}}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Capital Cities</div>
  <div class="game-frame" style="padding:16px">
    <div id="table">
      <div id="status">What is the capital of...</div>
      <div id="country">?</div>
      <div id="timerbar-wrap"><div id="timerbar"></div></div>
      <div id="choices"></div>
      <div id="stats">Score: <span id="score">0</span> &nbsp;|&nbsp; Streak: <span id="streak">0</span> &nbsp;|&nbsp; <span id="lives">❤️❤️❤️</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A country name is shown with <b>4 capital city choices</b>. Click the correct capital before the timer runs out. Chain correct answers for a <b>streak bonus</b> — 3 wrong answers or timeouts ends the game.</div>
</div>
<script>
const COUNTRIES=[
["France","Paris"],["Germany","Berlin"],["Italy","Rome"],["Spain","Madrid"],["Portugal","Lisbon"],
["United Kingdom","London"],["Ireland","Dublin"],["Netherlands","Amsterdam"],["Belgium","Brussels"],
["Switzerland","Bern"],["Austria","Vienna"],["Poland","Warsaw"],["Sweden","Stockholm"],["Norway","Oslo"],
["Denmark","Copenhagen"],["Finland","Helsinki"],["Greece","Athens"],["Russia","Moscow"],["Turkey","Ankara"],
["Ukraine","Kyiv"],["Japan","Tokyo"],["China","Beijing"],["South Korea","Seoul"],["India","New Delhi"],
["Thailand","Bangkok"],["Vietnam","Hanoi"],["Indonesia","Jakarta"],["Philippines","Manila"],["Malaysia","Kuala Lumpur"],
["Australia","Canberra"],["New Zealand","Wellington"],["Canada","Ottawa"],["United States","Washington D.C."],
["Mexico","Mexico City"],["Brazil","Brasília"],["Argentina","Buenos Aires"],["Chile","Santiago"],["Peru","Lima"],
["Colombia","Bogotá"],["Egypt","Cairo"],["Nigeria","Abuja"],["Kenya","Nairobi"],["South Africa","Pretoria"],
["Morocco","Rabat"],["Saudi Arabia","Riyadh"],["Israel","Jerusalem"],["Iran","Tehran"],["Iraq","Baghdad"],
["Pakistan","Islamabad"],["Bangladesh","Dhaka"],["Cuba","Havana"],["Iceland","Reykjavik"],["Hungary","Budapest"],
["Czech Republic","Prague"]
];
let score=0,streak=0,lives=3,best=0,timeLeft,timerMax,timerId,cur,answered=false;
best=parseInt(localStorage.getItem('capitalcities_best')||'0',10);
document.getElementById('best').textContent=best;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function pickQuestion(){
  cur=COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
  const [country,capital]=cur;
  const wrong=shuffle(COUNTRIES.filter(c=>c[1]!==capital)).slice(0,3).map(c=>c[1]);
  const options=shuffle([capital,...wrong]);
  document.getElementById('country').textContent=country;
  document.getElementById('status').textContent=I18N.t('capital_prompt','What is the capital of...');
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  answered=false;
  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=opt;
    btn.onclick=()=>selectAnswer(opt,btn,capital);
    choicesEl.appendChild(btn);
  });
  timerMax=Math.max(4000,9000-streak*150);
  timeLeft=timerMax;
  document.getElementById('timerbar').style.width='100%';
  clearInterval(timerId);
  timerId=setInterval(tick,100);
}

function tick(){
  if(answered)return;
  timeLeft-=100;
  document.getElementById('timerbar').style.width=Math.max(0,(timeLeft/timerMax*100))+'%';
  if(timeLeft<=0){
    answered=true;
    clearInterval(timerId);
    revealAndFail();
  }
}

function revealAndFail(){
  SFX.error();
  lives--;
  streak=0;
  updateStats();
  document.querySelectorAll('.choice').forEach(btn=>{
    if(btn.textContent===cur[1])btn.classList.add('correct');
    btn.disabled=true;
  });
  document.getElementById('status').textContent=I18N.t('timeout_msg','Time up! The capital was {c}.').replace('{c}',cur[1]);
  if(lives<=0){setTimeout(endGame,900);}else{setTimeout(pickQuestion,1100);}
}

function selectAnswer(opt,btn,capital){
  if(answered)return;
  answered=true;
  clearInterval(timerId);
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  if(opt===capital){
    SFX.point();
    streak++;
    score+=10+streak*2;
    if(score>best){best=score;localStorage.setItem('capitalcities_best',best);}
    btn.classList.add('correct');
    document.getElementById('status').textContent=I18N.t('correct_msg','Correct! +{p} points (streak {s})').replace('{p}',10+streak*2).replace('{s}',streak);
    updateStats();
    setTimeout(pickQuestion,900);
  }else{
    SFX.error();
    lives--;
    streak=0;
    btn.classList.add('wrong');
    document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===capital)b.classList.add('correct');});
    document.getElementById('status').textContent=I18N.t('wrong_msg','Wrong! The capital was {c}.').replace('{c}',capital);
    updateStats();
    if(lives<=0){setTimeout(endGame,900);}else{setTimeout(pickQuestion,1100);}
  }
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('best').textContent=best;
}

function endGame(){
  clearInterval(timerId);
  SFX.lose();
  document.getElementById('country').textContent='💀';
  document.getElementById('status').textContent=I18N.t('game_over_final','GAME OVER — Final score: {s}').replace('{s}',score);
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  const retry=document.createElement('button');
  retry.className='choice';
  retry.style.gridColumn='1/-1';
  retry.textContent=I18N.t('play_again_btn','Play Again');
  retry.onclick=()=>{score=0;streak=0;lives=3;updateStats();pickQuestion();};
  choicesEl.appendChild(retry);
}

updateStats();
pickQuestion();
</script></body></html>
