<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#0b1730,#1c2f4a);display:block;border-radius:8px;touch-action:manipulation}
#hud{display:flex;justify-content:space-between;color:#ffd54f;font-weight:700;font-size:1.05rem;padding:6px 4px}
#hud span{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Owl Nest</div>
  <div class="game-frame">
    <div id="hud"><div>Round: <span id="round">1</span></div><div>Raised: <span id="raised">0</span></div><div>Time: <span id="time">60</span>s</div></div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Click the hungriest owlet to feed it before its meter fills. Click the ⚠️ warning icon when a predator approaches to scare it off. Raise as many owlets as you can before time runs out!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const HI_KEY='owlnest_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

let owlets=[],predator=null,round=1,raised=0,timeLeft=60,gameOver=false,started=false,lastTime=null;
let roundTimer=0,predTimer=0,shakeOwl=null,shakeT=0;

function spawnOwlets(n){
  owlets=[];
  const spacing=W/(n+1);
  for(let i=0;i<n;i++){
    owlets.push({x:spacing*(i+1),y:300,hunger:20+Math.random()*20,alive:true,fedFlash:0,dead:false});
  }
}

function startRound(r){
  round=r;
  const n=Math.min(3+Math.floor(r/2),7);
  spawnOwlets(n);
  timeLeft=Math.max(35,60-r*2);
  roundTimer=0;predTimer=0;predator=null;
  gameOver=false;
}

function reset(){
  raised=0;round=1;started=false;gameOver=false;lastTime=null;
  startRound(1);
}
reset();

function hungerRate(){ return 3.2+round*0.35; }
function predInterval(){ return Math.max(3.5,7.5-round*0.35); }

function feedOwlet(idx){
  const o=owlets[idx];
  if(!o||o.dead)return;
  o.hunger=Math.max(0,o.hunger-45);
  o.fedFlash=1;
  SFX.point();
}

function scarePredator(){
  if(predator){
    predator=null;
    raised+=0; // scaring doesn't count as raised, just survival
    SFX.success();
  }
}

function pointInCircle(px,py,cx,cy,r){ const dx=px-cx,dy=py-cy; return dx*dx+dy*dy<=r*r; }

function handleTap(x,y){
  if(!started){started=true;return;}
  if(gameOver){reset();started=true;return;}
  // predator warning icon hitbox
  if(predator && pointInCircle(x,y,predator.warnX,predator.warnY,26)){
    scarePredator();
    return;
  }
  // owlet hitbox
  for(let i=0;i<owlets.length;i++){
    const o=owlets[i];
    if(o.dead)continue;
    if(pointInCircle(x,y,o.x,o.y,32)){
      feedOwlet(i);
      return;
    }
  }
  SFX.error();
}

function getPos(e){
  const rect=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*(W/rect.width), y:cy*(H/rect.height)};
}
c.addEventListener('pointerdown',e=>{const p=getPos(e);handleTap(p.x,p.y);});
c.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);handleTap(p.x,p.y);},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!started){started=true;return;}
    if(gameOver){reset();started=true;return;}
    if(predator){scarePredator();return;}
    // feed hungriest
    let idx=-1,max=-1;
    owlets.forEach((o,i)=>{if(!o.dead&&o.hunger>max){max=o.hunger;idx=i;}});
    if(idx>=0)feedOwlet(idx);
  }
});

function drawOwlet(o){
  ctx.save();
  if(o.fedFlash>0){ctx.translate(0,-4*Math.sin(o.fedFlash*Math.PI));}
  // body
  const bodyColor= o.hunger>75 ? '#c96b3c' : (o.hunger>45?'#caa15a':'#8a6b3f');
  ctx.fillStyle=bodyColor;
  ctx.beginPath();ctx.ellipse(o.x,o.y,26,30,0,0,Math.PI*2);ctx.fill();
  // face disc
  ctx.fillStyle='#f2e6c9';
  ctx.beginPath();ctx.ellipse(o.x,o.y-4,20,18,0,0,Math.PI*2);ctx.fill();
  // eyes
  ctx.fillStyle='#2b1a0a';
  ctx.beginPath();ctx.arc(o.x-8,o.y-6,5,0,Math.PI*2);ctx.arc(o.x+8,o.y-6,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(o.x-9,o.y-8,1.6,0,Math.PI*2);ctx.arc(o.x+7,o.y-8,1.6,0,Math.PI*2);ctx.fill();
  // beak
  ctx.fillStyle='#e8a23a';
  ctx.beginPath();ctx.moveTo(o.x-4,o.y+2);ctx.lineTo(o.x+4,o.y+2);ctx.lineTo(o.x,o.y+9);ctx.closePath();ctx.fill();
  ctx.restore();
  // hunger meter
  const barW=52,barH=8;
  ctx.fillStyle='#00000055';ctx.fillRect(o.x-barW/2,o.y+38,barW,barH);
  const pct=Math.min(1,o.hunger/100);
  ctx.fillStyle= pct>0.8?'#e53935':(pct>0.5?'#ffb300':'#66bb6a');
  ctx.fillRect(o.x-barW/2,o.y+38,barW*pct,barH);
  ctx.strokeStyle='#fff5';ctx.strokeRect(o.x-barW/2,o.y+38,barW,barH);
  if(o.fedFlash>0)o.fedFlash=Math.max(0,o.fedFlash-0.08);
}

function drawPredator(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.fillStyle='#3a2540';
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-24,10);ctx.lineTo(0,2);ctx.lineTo(24,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffcc33';
  ctx.beginPath();ctx.arc(-6,-4,3,0,Math.PI*2);ctx.arc(6,-4,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // warning icon
  const pulse=1+0.15*Math.sin(performance.now()/120);
  ctx.save();
  ctx.translate(p.warnX,p.warnY);
  ctx.scale(pulse,pulse);
  ctx.fillStyle='#ffb300';
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(18,16);ctx.lineTo(-18,16);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('!',0,10);
  ctx.restore();
}

function drawNest(){
  ctx.fillStyle='#5a3d24';
  ctx.beginPath();ctx.ellipse(W/2,360,320,45,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3d2a18';ctx.lineWidth=3;
  for(let i=0;i<12;i++){
    ctx.beginPath();
    ctx.moveTo(W/2-300+i*55,335);
    ctx.quadraticCurveTo(W/2-270+i*55,360,W/2-300+i*55+30,385);
    ctx.stroke();
  }
}

function drawStars(){
  ctx.fillStyle='#ffffff33';
  for(let i=0;i<40;i++){
    const x=(i*137)%W, y=(i*89)%260;
    ctx.fillRect(x,y,2,2);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawStars();
  drawNest();

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Press Space to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_raised','Owlets Raised: {n}').replace('{n}',raised),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint2','Tap or Space to play again'),W/2,H/2+48);
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?0:Math.min((now-lastTime)/1000,0.1);
  lastTime=now;

  timeLeft-=dt;
  if(timeLeft<=0){
    timeLeft=0;
    // round complete: raise all currently alive owlets
    const survivors=owlets.filter(o=>!o.dead).length;
    raised+=survivors;
    if(raised>hi){hi=raised;localStorage.setItem(HI_KEY,String(hi));}
    SFX.levelup();
    startRound(round+1);
  } else {
    owlets.forEach(o=>{
      if(o.dead)return;
      o.hunger+=hungerRate()*dt;
      if(o.hunger>=100){
        o.dead=true;
        o.hunger=100;
        SFX.hurt();
      }
    });
    // predator spawn/movement
    predTimer+=dt;
    if(!predator && predTimer>=predInterval()){
      predTimer=0;
      const target=owlets[Math.floor(Math.random()*owlets.length)];
      predator={x:-40,y:150,warnX:0,warnY:0,target,speed:70+round*6};
    }
    if(predator){
      const tx=predator.target?predator.target.x:W/2;
      const dx=tx-predator.x;
      predator.x+=Math.sign(dx)*predator.speed*dt;
      predator.y+=(220-predator.y)*0.5*dt;
      predator.warnX=predator.x;
      predator.warnY=predator.y-40;
      if(Math.abs(predator.x-tx)<20 && predator.y>200){
        // predator reaches nest — one owlet lost
        if(predator.target && !predator.target.dead){
          predator.target.dead=true;
          SFX.lose();
        }
        predator=null;
      }
    }
    // all owlets dead -> game over
    if(owlets.every(o=>o.dead)){
      gameOver=true;
      SFX.fail();
    }
  }

  owlets.forEach(o=>{ if(!o.dead) drawOwlet(o); else drawDeadOwlet(o); });
  if(predator)drawPredator(predator);

  document.getElementById('round').textContent=round;
  document.getElementById('raised').textContent=raised;
  document.getElementById('time').textContent=Math.ceil(timeLeft);

  requestAnimationFrame(loop);
}

function drawDeadOwlet(o){
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#555';
  ctx.beginPath();ctx.ellipse(o.x,o.y,26,20,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

loop();
</script></body></html>
