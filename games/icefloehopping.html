<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0a3a5c;display:block;border-radius:8px;touch-action:none}
#score-display{color:#bfe9ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Floe Hopping</div>
  <div class="game-frame">
    <div id="score-display">Streak: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Up Arrow</b>, or <b>Tap</b> to jump to the next ice floe. Time your jump as the floes bob up and down — land on one and grab any fish for bonus points. Floes get smaller and drift further apart as your streak grows!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const HI_KEY='mp_hi_icefloehopping';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);

const waterline=300;
let player,floes,streak,gameOver,started,fishCollected,scroll;

function makeFloe(x,radius,phase){
  return {x,baseY:waterline-10,y:waterline-10,r:radius,phase:phase||Math.random()*Math.PI*2,fish:Math.random()<0.35,fishTaken:false,hasPlayer:false};
}

function reset(){
  floes=[];
  let x=100;
  for(let i=0;i<10;i++){
    const r=Math.max(26,46-i*1.5);
    floes.push(makeFloe(x,r));
    x+=120+Math.min(i*4,60);
  }
  floes[0].hasPlayer=true;
  player={floeIdx:0,x:floes[0].x,y:floes[0].y-20,jumping:false,jx:0,jy:0,t:0,vx:0,fromIdx:0,toIdx:0};
  streak=0;gameOver=false;fishCollected=0;scroll=0;
}
function startGame(){started=true;reset();}
reset();

function floeY(f,time){
  return f.baseY+Math.sin(time/420+f.phase)*8;
}

const COMFY_GAP=170;
function jump(){
  if(!started){startGame();return;}
  if(gameOver){reset();return;}
  if(player.jumping)return;
  const cur=floes[player.floeIdx];
  const next=floes[player.floeIdx+1];
  if(!next){return;}
  const gapDist=next.x-cur.x;
  let willMiss=false;
  if(gapDist>COMFY_GAP){
    const bobOffset=Math.abs(floeY(next,performance.now())-next.baseY); // 0 = perfectly timed (floe at rest height)
    let chance=Math.max(0.12,1-(gapDist-COMFY_GAP)/130);
    if(bobOffset<2.5)chance=Math.min(1,chance+0.25);
    willMiss=Math.random()>chance;
  }
  player.jumping=true;
  player.t=0;
  player.fromIdx=player.floeIdx;
  player.toIdx=player.floeIdx+1;
  player.willMiss=willMiss;
  SFX.jump();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
});
c.addEventListener('mousedown',jump);
c.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

function spawnMoreFloes(){
  while(floes.length<player.floeIdx+12){
    const i=floes.length;
    const r=Math.max(14,46-i*0.9);
    const gap=130+Math.min(i*3.2,140);
    const prevX=floes[floes.length-1].x;
    floes.push(makeFloe(prevX+gap,r));
  }
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,waterline);
  sky.addColorStop(0,'#b7e3f7');sky.addColorStop(1,'#e8f6fb');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,waterline);
  const water=ctx.createLinearGradient(0,waterline,0,H);
  water.addColorStop(0,'#1c6fa3');water.addColorStop(1,'#0a3a5c');
  ctx.fillStyle=water;ctx.fillRect(0,waterline,W,H-waterline);
  // water ripple lines
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    const yy=waterline+20+i*28;
    ctx.moveTo(0,yy);
    for(let x=0;x<=W;x+=20){ctx.lineTo(x,yy+Math.sin((x+now/200+i*40)/40)*4);}
    ctx.stroke();
  }

  if(!started){
    ctx.fillStyle='#0a3a5c';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press Space / Tap to start'),W/2,waterline/2);
    requestAnimationFrame(loop);return;
  }

  spawnMoreFloes();

  // camera follows player, keeping player near x=160
  const targetScroll=floes[player.floeIdx].x-160;
  scroll+=(Math.max(0,targetScroll)-scroll)*0.12*dt;

  // update floe bob positions
  floes.forEach(f=>{ f.y=floeY(f,now); });

  // draw floes
  floes.forEach((f,i)=>{
    const sx=f.x-scroll;
    if(sx< -80||sx>W+80)return;
    ctx.save();
    ctx.translate(sx,f.y);
    ctx.fillStyle='#eaf7ff';
    ctx.beginPath();ctx.ellipse(0,0,f.r,f.r*0.55,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#bcdfee';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#d7eefb';
    ctx.beginPath();ctx.ellipse(0,-3,f.r*0.65,f.r*0.3,0,0,Math.PI*2);ctx.fill();
    if(f.fish&&!f.fishTaken){
      ctx.fillStyle='#ff8a3d';
      ctx.beginPath();ctx.ellipse(0,-14,8,4,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(-8,-14);ctx.lineTo(-13,-10);ctx.lineTo(-13,-18);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  });

  // player movement/jump
  if(player.jumping){
    player.t+=0.045*dt;
    const from=floes[player.fromIdx],to=floes[player.toIdx];
    const tt=Math.min(1,player.t);
    const fx=from.x-scroll;
    const splashTx=fx+(to.x-from.x)*0.55; // if missing, player drops short of the target floe
    const tx=player.willMiss? splashTx : (to.x-scroll);
    player.x=fx+(tx-fx)*tt;
    const arc=Math.sin(tt*Math.PI)*(player.willMiss?36:50);
    const baseY=player.willMiss ? (from.y+(waterline+20-from.y)*tt) : (from.y+(to.y-from.y)*tt);
    player.y=baseY-20-arc;
    if(tt>=1){
      player.jumping=false;
      if(player.willMiss){
        gameOver=true;SFX.lose();
        return;
      }
      const landed=to;
      player.floeIdx=player.toIdx;
      landed.hasPlayer=true;
      from.hasPlayer=false;
      streak++;
      if(landed.fish&&!landed.fishTaken){ landed.fishTaken=true; SFX.catch(); fishCollected++; }
      else SFX.land();
      if(streak>hi){hi=streak;localStorage.setItem(HI_KEY,String(hi));}
      if(streak%10===0)SFX.levelup();
    }
  } else {
    const f=floes[player.floeIdx];
    player.x=f.x-scroll;
    player.y=f.y-20;
  }

  // draw player (seal-like explorer)
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.fillStyle='#2b4a7a';
  ctx.beginPath();ctx.ellipse(0,0,13,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc66';
  ctx.beginPath();ctx.arc(0,-14,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a2a44';
  ctx.beginPath();ctx.arc(-3,-15,1.6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-15,1.6,0,Math.PI*2);ctx.fill();
  ctx.restore();

  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Streak: {s} | Fish: {f} | Hi: {h}').replace('{s}',streak).replace('{f}',fishCollected).replace('{h}',hi);

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','SPLASH! YOU FELL IN'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to try again'),W/2,H/2+24);
  }

  requestAnimationFrame(loop);
}
loop();
</script></body></html>
