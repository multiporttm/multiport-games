<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#dcedf7;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;color:#eaf6ff;font-size:1rem;font-weight:700;padding:8px 14px;font-variant-numeric:tabular-nums}
#hud span b{color:#ffd54f}
#combo{color:#ff8a3d;text-align:center;font-weight:800;min-height:1.3em}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Snow Tubing</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Score: 0 | Hi: 0</span><span id="speed-display">Speed x1.0</span></div>
    <div id="combo">&nbsp;</div>
    <canvas id="c" width="480" height="640"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Steer with <b>Arrow Keys</b> / <b>A-D</b>, or drag/tap the slope. Weave around trees, rocks and other tubers, and hit the orange <b>ramps</b> to catch air for trick bonus points. Crashing ends the run!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const trackL=40,trackR=W-40;
let score=0,hi=parseFloat(localStorage.getItem('snowtubing_hi')||'0');
let started=false,gameOver=false,lastTime=null;
let combo=0,comboTimer=0;
let airborne=0; // ms remaining airborne
let scroll=0;

const tube={x:W/2,vx:0,targetX:W/2,y:H-120,r:24,lean:0};
let steerDir=0; // -1,0,1 keyboard
let dragging=false;

function reset(){
  score=0;started=false;gameOver=false;lastTime=null;combo=0;comboTimer=0;airborne=0;scroll=0;
  tube.x=W/2;tube.vx=0;tube.targetX=W/2;tube.lean=0;
  obstacles=[];spawnTimer=0;
}

function start(){ if(!started){started=true;} else if(gameOver){reset();} }

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){steerDir=-1;start();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){steerDir=1;start();}
  else if(e.code==='Space'){e.preventDefault();start();}
});
document.addEventListener('keyup',e=>{
  if((e.code==='ArrowLeft'||e.code==='KeyA')&&steerDir===-1)steerDir=0;
  if((e.code==='ArrowRight'||e.code==='KeyD')&&steerDir===1)steerDir=0;
});
function pointerToX(clientX){
  const rect=c.getBoundingClientRect();
  return (clientX-rect.left)*(W/rect.width);
}
c.addEventListener('pointerdown',e=>{ dragging=true; tube.targetX=pointerToX(e.clientX); start(); });
c.addEventListener('pointermove',e=>{ if(dragging) tube.targetX=pointerToX(e.clientX); });
window.addEventListener('pointerup',()=>{dragging=false;});
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;tube.targetX=pointerToX(e.touches[0].clientX);start();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)tube.targetX=pointerToX(e.touches[0].clientX);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;if(gameOver)start();},{passive:false});

let obstacles=[],spawnTimer=0;
const TYPES=['tree','rock','tuber','ramp'];
function spawnObstacle(spd){
  const r=Math.random();
  let type='tree';
  if(r<0.38)type='tree';else if(r<0.65)type='rock';else if(r<0.85)type='tuber';else type='ramp';
  const x=trackL+30+Math.random()*(trackR-trackL-60);
  obstacles.push({type,x,y:-40,w:type==='ramp'?70:34,h:type==='ramp'?26:34,hit:false});
}

function drawSnowBg(dt){
  ctx.fillStyle='#dcedf7';ctx.fillRect(0,0,W,H);
  // side banks
  ctx.fillStyle='#c3e0f1';
  ctx.fillRect(0,0,trackL,H);
  ctx.fillRect(trackR,0,W-trackR,H);
  // scrolling texture lines on track
  ctx.strokeStyle='rgba(150,190,220,0.5)';
  ctx.lineWidth=2;
  for(let i=-1;i<8;i++){
    const y=((scroll*0.5)+(i*90))%(H+90)-90;
    ctx.beginPath();ctx.moveTo(trackL+10,y);ctx.lineTo(trackR-10,y+40);ctx.stroke();
  }
}

function drawTube(){
  ctx.save();
  ctx.translate(tube.x,tube.y);
  ctx.rotate(tube.lean*0.35);
  const bob=airborne>0?-14:0;
  ctx.translate(0,bob);
  if(airborne>0){
    ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(0,14-bob,tube.r*0.9,8,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  // tube ring
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.arc(0,0,tube.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#dcedf7';
  ctx.beginPath();ctx.arc(0,0,tube.r*0.55,0,Math.PI*2);ctx.fill();
  // rider
  ctx.fillStyle='#3b4b6b';
  ctx.beginPath();ctx.arc(0,-4,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd9b3';
  ctx.beginPath();ctx.arc(0,-16,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawObstacle(o){
  ctx.save();ctx.translate(o.x,o.y);
  if(o.type==='tree'){
    ctx.fillStyle='#6b4226';ctx.fillRect(-4,10,8,14);
    ctx.fillStyle='#2f6d3a';
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(18,14);ctx.lineTo(-18,14);ctx.fill();
    ctx.fillStyle='#3d8c4c';
    ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(14,14);ctx.lineTo(-14,14);ctx.fill();
  }else if(o.type==='rock'){
    ctx.fillStyle='#8a8f98';
    ctx.beginPath();ctx.ellipse(0,4,18,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b0b5bd';
    ctx.beginPath();ctx.ellipse(-4,-2,9,7,0,0,Math.PI*2);ctx.fill();
  }else if(o.type==='tuber'){
    ctx.fillStyle='#4c8bf5';
    ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#dcedf7';ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd9b3';ctx.beginPath();ctx.arc(0,-14,6,0,Math.PI*2);ctx.fill();
  }else if(o.type==='ramp'){
    ctx.fillStyle='#ff8a3d';
    ctx.beginPath();ctx.moveTo(-35,13);ctx.lineTo(35,13);ctx.lineTo(20,-13);ctx.lineTo(-20,-13);ctx.fill();
    ctx.fillStyle='#ffab6b';ctx.fillRect(-20,-13,40,5);
  }
  ctx.restore();
}

function circleHit(a,b,rr){
  const dx=a.x-b.x,dy=a.y-b.y;
  return dx*dx+dy*dy < rr*rr;
}

function loop(ts){
  const dt=lastTime===null?1:Math.min((ts-lastTime)/16.6667,3);
  lastTime=ts;

  drawSnowBg(dt);

  if(!started){
    ctx.fillStyle='#3b4b6b';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Steer or drag to start'),W/2,H/2);
    drawTube();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    obstacles.forEach(drawObstacle);
    drawTube();
    ctx.fillStyle='rgba(20,30,50,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','WIPEOUT!'),W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap / press a key to try again'),W/2,H/2+16);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  const speedMul=1+score/900;
  const spd=(4.2*speedMul)*dt;
  scroll+=spd;
  score+=spd*0.12;
  if(score>hi){hi=score;localStorage.setItem('snowtubing_hi',hi);}

  // steering
  if(steerDir!==0){ tube.targetX+=steerDir*6*dt; dragging=false; }
  tube.targetX=Math.max(trackL+tube.r,Math.min(trackR-tube.r,tube.targetX));
  const dx=tube.targetX-tube.x;
  tube.vx=dx*0.18;
  tube.x+=tube.vx*dt;
  tube.lean=Math.max(-1,Math.min(1,tube.vx/6));

  if(airborne>0){airborne-=dt*16.6667; if(airborne<0)airborne=0;}
  if(comboTimer>0){comboTimer-=dt*16.6667; if(comboTimer<=0){combo=0;}}

  spawnTimer+=dt;
  const interval=Math.max(24,52-score/40);
  if(spawnTimer>=interval){spawnTimer-=interval;spawnObstacle(spd);}

  obstacles=obstacles.filter(o=>o.y<H+60);
  const tubeHitR=tube.r*0.75;
  obstacles.forEach(o=>{
    o.y+=spd;
    drawObstacle(o);
    if(o.hit)return;
    const rad=o.type==='ramp'?26:20;
    if(circleHit(tube,o,tubeHitR+rad-8)){
      if(o.type==='ramp'){
        o.hit=true;
        airborne=900;
        combo++;
        comboTimer=1600;
        const bonus=10*combo;
        score+=bonus;
        SFX.jump();
      }else if(airborne<=0){
        o.hit=true;
        gameOver=true;
        SFX.lose();
      }
    }
  });

  drawTube();

  document.getElementById('combo').textContent = combo>1 ? I18N.t('combo_label','{n}x Air Combo! +{b} pts').replace('{n}',combo).replace('{b}',10*combo) : ' ';
  document.getElementById('speed-display').textContent = I18N.t('speed_label','Speed x{s}').replace('{s}',speedMul.toFixed(1));
  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('score-display').textContent = I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
}

reset();
requestAnimationFrame(loop);
</script></body></html>
