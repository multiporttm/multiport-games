<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Sumo Ring Rumble</title><meta name="description" content="Play Sumo Ring Rumble free online — Time your shoves to push the AI opponent out of the ring before they push you out."><link rel="canonical" href="https://games.multiportllc.com/games/sumoring"><meta property="og:title" content="Sumo Ring Rumble - Multiport Games"><meta property="og:description" content="Play Sumo Ring Rumble free online — Time your shoves to push the AI opponent out of the ring before they push you out."><meta property="og:url" content="https://games.multiportllc.com/games/sumoring"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Sumo Ring Rumble","description":"Play Sumo Ring Rumble free online instantly. Time your shoves to push the AI opponent out of the ring before they push you out. No download or signup required.","genre":"Action","url":"https://games.multiportllc.com/games/sumoring","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#3e2723}
#ui{color:#ffcc80;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#shoveBtn{display:block;margin:10px auto;padding:14px 34px;border-radius:12px;background:#d84315;color:#fff;border:none;font-weight:700;font-size:1.1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#shoveBtn:active{background:#bf360c}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Sumo Ring Rumble</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Wins: 0 | Round: 1</div>
    <canvas id="c" width="360" height="360"></canvas>
    <button id="shoveBtn">💪 SHOVE (Space)</button>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap SHOVE (or Space) repeatedly to push your opponent toward the edge of the ring — but they're shoving back. Whoever crosses the white line first loses the round!</div>
</div>
<script>
const W=360,H=360,CX=W/2,CY=180,R=120;
let pos,round,wins,state,shakeT=0;

function loadBest(){return +(localStorage.getItem('sumoring_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('sumoring_best',v);}

function init(){round=1;wins=0;newRound();}
function newRound(){pos=0;state='play';}

function shove(){
  if(state==='over'){round=1;wins=0;newRound();return;}
  if(state!=='play')return;
  pos-=8+Math.random()*4;
  shakeT=6;
  SFX.hit();
  aiCounter();
}

function aiCounter(){
  setTimeout(()=>{
    if(state!=='play')return;
    pos+=5+Math.random()*5+round*0.4;
    checkEnd();
  },180);
}

function checkEnd(){
  if(pos<=-100){
    wins++;round++;
    SFX.win();
    saveBest(wins);
    newRound();
  }else if(pos>=100){
    state='over';
    SFX.lose();
  }
}

document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();shove();}});
document.getElementById('shoveBtn').addEventListener('click',shove);

function update(){
  if(shakeT>0)shakeT--;
  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);
  ctx.fillStyle='#3e2723';ctx.fillRect(-6,-6,W+12,H+12);

  ctx.fillStyle='#ffcc80';
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();

  const px=CX+pos*1.1;
  ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🤼',px-30,CY);
  ctx.fillText('🧑‍🦲',px+30,CY);

  ctx.restore();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcc80';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(I18N.t('ring_out_title','RING OUT!'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('wins_best_label','Wins: {n} | Best: {b}').replace('{n}',wins).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('shove_retry_hint','Tap SHOVE to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('wins_label','Wins: {n}').replace('{n}',wins)+' | '+I18N.t('round_label','Round: {n}').replace('{n}',round);
}

init();draw();
</script></body></html>
