<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#1a1030,#3d1f4d);display:block;border-radius:8px;touch-action:none;margin:0 auto}
#hud{display:flex;justify-content:space-between;max-width:600px;margin:0 auto 8px;color:#ffd54f;font-weight:700;font-size:1.05rem;flex-wrap:wrap;gap:4px}
#favorWrap{max-width:600px;margin:0 auto 8px;background:#1a1a2e;border-radius:10px;height:16px;overflow:hidden;border:2px solid #ffd54f44}
#favor{height:100%;background:linear-gradient(90deg,#e94560,#ffd54f,#4caf50);width:60%;transition:width .15s}
#lanesTouch{display:flex;gap:6px;max-width:600px;margin:8px auto 0;justify-content:center}
#lanesTouch button{flex:1;max-width:130px;padding:14px 0;font-size:1.1rem;font-weight:800;border:none;border-radius:10px;color:#fff;cursor:pointer}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../index.html" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Minstrel Performance</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreLabel">Score: 0 | Hi: 0</span><span id="comboLabel">Combo: 0</span></div>
    <div id="favorWrap"><div id="favor"></div></div>
    <canvas id="c" width="600" height="420"></canvas>
    <div id="lanesTouch">
      <button data-lane="0" style="background:#ff6b6b">D</button>
      <button data-lane="1" style="background:#4ecdc4">F</button>
      <button data-lane="2" style="background:#ffd93d;color:#222">J</button>
      <button data-lane="3" style="background:#a06bff">K</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>D</b>, <b>F</b>, <b>J</b>, <b>K</b> (or tap the matching button) as each note crosses the target line to strum your lute in time. Build your combo and keep the court's favor meter high to win the song!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='mp_hiscore';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
const W=600,H=420;
const laneX=[80,240,400,560];
const laneColors=['#ff6b6b','#4ecdc4','#ffd93d','#a06bff'];
const targetY=360,laneW=70;
const SONG_LEN=52000; // ms
let notes,score,combo,maxCombo,favor,songTime,gameOver,started,win;
let lastTime=null,spawnTimer=0,spawnInterval=650;

function reset(){
  notes=[];score=0;combo=0;maxCombo=0;favor=60;songTime=0;gameOver=false;started=false;win=false;
  lastTime=null;spawnTimer=0;spawnInterval=650;
}
reset();

function updateHud(){
  document.getElementById('scoreLabel').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('comboLabel').textContent=I18N.t('combo_label','Combo: {c}').replace('{c}',combo);
  document.getElementById('favor').style.width=Math.max(0,Math.min(100,favor))+'%';
}

function spawnNote(){
  const lane=Math.floor(Math.random()*4);
  notes.push({lane,y:-20,hit:false,missed:false});
}

function judge(lane){
  // find closest unhit note in that lane within window
  let best=null,bestDist=9999;
  notes.forEach(n=>{
    if(n.hit||n.missed||n.lane!==lane)return;
    const d=Math.abs(n.y-targetY);
    if(d<bestDist){bestDist=d;best=n;}
  });
  if(!best||bestDist>60){
    combo=0;favor-=6;SFX.error();
    return;
  }
  best.hit=true;
  if(bestDist<18){score+=100;favor=Math.min(100,favor+4);SFX.success();}
  else if(bestDist<38){score+=60;favor=Math.min(100,favor+2);SFX.point();}
  else{score+=25;favor=Math.min(100,favor+0.5);SFX.click();}
  combo++;
  if(combo>maxCombo)maxCombo=combo;
}

function startIfNeeded(){
  if(gameOver){reset();return true;}
  if(!started){started=true;}
  return false;
}

function pressLane(lane){
  if(startIfNeeded())return;
  judge(lane);
}

const keyMap={KeyD:0,KeyF:1,KeyJ:2,KeyK:3};
document.addEventListener('keydown',e=>{
  if(e.code in keyMap){e.preventDefault();pressLane(keyMap[e.code]);}
  else if(e.code==='Space'){e.preventDefault();startIfNeeded();}
});

document.querySelectorAll('#lanesTouch button').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    pressLane(parseInt(btn.dataset.lane,10));
  });
});
c.addEventListener('pointerdown',()=>{startIfNeeded();});

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a1030');sky.addColorStop(1,'#3d1f4d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // lane backgrounds
  laneX.forEach((x,i)=>{
    ctx.fillStyle='#ffffff08';
    ctx.fillRect(x-laneW/2,0,laneW,H);
  });
  // target line
  ctx.fillStyle='#ffffff55';
  ctx.fillRect(0,targetY,W,4);
  laneX.forEach((x,i)=>{
    ctx.strokeStyle=laneColors[i];ctx.lineWidth=3;
    ctx.strokeRect(x-laneW/2+4,targetY-22,laneW-8,44);
  });

  if(!started){
    ctx.fillStyle='#ffd54f';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press D/F/J/K or tap to begin the song'),W/2,60);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(win?I18N.t('you_win_title','THE COURT APPLAUDS!'):I18N.t('game_over_title','THE COURT IS UNIMPRESSED'),W/2,170);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press a note key to play again'),W/2,205);
    ctx.fillText(I18N.t('max_combo_label','Best combo: {c}').replace('{c}',maxCombo),W/2,235);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  songTime+=dt*16.6667;
  spawnInterval=Math.max(320,650-songTime/200);
  spawnTimer+=dt*16.6667;
  if(spawnTimer>=spawnInterval){spawnTimer-=spawnInterval;spawnNote();}

  favor-=dt*0.02;

  const speed=3.2*dt;
  notes.forEach(n=>{
    if(n.hit||n.missed)return;
    n.y+=speed;
    if(n.y>targetY+70){
      n.missed=true;combo=0;favor-=8;SFX.hit();
    }
  });
  notes=notes.filter(n=>n.y<H+40 && !(n.hit&&n.y>targetY+30));

  if(score>hi)hi=score;

  if(favor<=0){
    gameOver=true;win=false;SFX.lose();
  } else if(songTime>=SONG_LEN){
    gameOver=true;win=favor>=45;
    if(win){SFX.win();localStorage.setItem(KEY,String(Math.floor(hi)));}else{SFX.lose();}
  }

  notes.forEach(n=>{
    if(n.missed)return;
    const x=laneX[n.lane];
    ctx.beginPath();
    ctx.arc(x,n.y,18,0,Math.PI*2);
    ctx.fillStyle=n.hit?'#ffffff55':laneColors[n.lane];
    ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  });

  updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
