<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Restaurant Rush</title><meta name="description" content="Play Restaurant Rush free online — Tap ingredients in the order shown to plate each dish before the ticket timer runs out."><link rel="canonical" href="https://games.multiportllc.com/games/restaurantrush"><meta property="og:title" content="Restaurant Rush - Multiport Games"><meta property="og:description" content="Play Restaurant Rush free online — Tap ingredients in the order shown to plate each dish before the ticket timer runs out."><meta property="og:url" content="https://games.multiportllc.com/games/restaurantrush"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Restaurant Rush","description":"Play Restaurant Rush free online instantly. Tap ingredients in the order shown to plate each dish before the ticket timer runs out. No download or signup required.","genre":"Casual","url":"https://games.multiportllc.com/games/restaurantrush","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#fff3e0;cursor:pointer}
#ui{color:#ffb74d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Restaurant Rush</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Orders served: 0 | Streak: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Each ticket shows a sequence of ingredients — tap the matching icons at the bottom in that exact order before the timer bar empties. Wrong tap or timeout breaks your streak.</div>
</div>
<script>
const W=360,H=360;
const ITEMS=['🍞','🥬','🍅','🧀','🥩','🍳','🥓','🧅'];
let order,progress,orders,streak,best,timeLeft,maxTime,state;

function loadBest(){return +(localStorage.getItem('restaurantrush_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('restaurantrush_best',v);}

function init(){
  orders=0;streak=0;state='play';best=loadBest();
  newOrder();
}

function newOrder(){
  const len=3+Math.min(3,Math.floor(orders/3));
  order=[];
  for(let i=0;i<len;i++)order.push(ITEMS[Math.floor(Math.random()*ITEMS.length)]);
  progress=0;
  maxTime=4+len;
  timeLeft=maxTime;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
const ROWS=4,COLS=2,BTN_W=W/COLS,BTN_H=70,BTN_Y0=H-ROWS*BTN_H;

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  if(y<BTN_Y0)return;
  const col=Math.floor(x/BTN_W),row=Math.floor((y-BTN_Y0)/BTN_H);
  const idx=row*COLS+col;
  if(idx<0||idx>=ITEMS.length)return;
  handleTap(ITEMS[idx]);
});

function handleTap(item){
  if(item===order[progress]){
    progress++;
    if(progress>=order.length){
      orders++;streak++;
      SFX.coin();
      saveBest(streak);
      newOrder();
    }else{
      SFX.tick();
    }
  }else{
    streak=0;
    SFX.error();
    newOrder();
  }
  updateUI();
}

function update(){
  if(state!=='play')return;
  timeLeft-=1/60;
  if(timeLeft<=0){
    streak=0;
    newOrder();
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#fff3e0';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#333';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText('Order:',W/2,26);
  ctx.font='28px Arial';
  order.forEach((it,i)=>{
    ctx.globalAlpha=i<progress?0.25:1;
    ctx.fillText(it,W/2-order.length*16+i*32+16,60);
  });
  ctx.globalAlpha=1;

  ctx.fillStyle='#ddd';ctx.fillRect(20,80,W-40,14);
  ctx.fillStyle='#ff8a65';ctx.fillRect(20,80,(W-40)*Math.max(0,timeLeft/maxTime),14);

  ITEMS.forEach((it,i)=>{
    const col=i%COLS,row=Math.floor(i/COLS);
    const x=col*BTN_W,y=BTN_Y0+row*BTN_H;
    ctx.fillStyle='#fff';
    ctx.fillRect(x+4,y+4,BTN_W-8,BTN_H-8);
    ctx.strokeStyle='#ffb74d';ctx.strokeRect(x+4,y+4,BTN_W-8,BTN_H-8);
    ctx.font='30px Arial';ctx.fillText(it,x+BTN_W/2,y+BTN_H/2+2);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb74d';ctx.font='bold 26px Arial';
    ctx.fillText('SHIFT OVER',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Orders served: ${orders} | Best streak: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Orders served: ${orders} | Streak: ${streak}`;
}

init();draw();
</script></body></html>
