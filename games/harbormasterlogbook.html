<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Harbor Master Logbook</title><meta name="description" content="Play Harbor Master Logbook free online — Assign each incoming ship to the right open berth and log it correctly before the next vessel arrives."><link rel="canonical" href="https://games.multiportllc.com/games/harbormasterlogbook"><meta property="og:title" content="Harbor Master Logbook - Multiport Games"><meta property="og:description" content="Play Harbor Master Logbook free online — Assign each incoming ship to the right open berth and log it correctly before the next vessel arrives."><meta property="og:url" content="https://games.multiportllc.com/games/harbormasterlogbook"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Harbor Master Logbook","description":"Play Harbor Master Logbook free online instantly. As harbor master, log every vessel's arrival details and assign each incoming ship to the correct open berth before the next one arrives, or send it to the waiting list when no matching berth is free. No download or signup required.","genre":"Puzzle","url":"https://games.multiportllc.com/games/harbormasterlogbook","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0f2744;display:block;border-radius:8px;touch-action:none}
#hud{color:#4cc9f0;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span.lv{color:#80deea}
#hud span.hs{color:#7ec850}
#choiceBtns{display:flex;justify-content:center;gap:10px;padding:6px 10px;flex-wrap:wrap}
#choiceBtns button{padding:10px 16px;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-size:0.9rem;color:#fff;background:#1b4965}
#choiceBtns button:active{transform:scale(0.95)}
#choiceBtns button.wait{background:#6c757d}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Harbor Master Logbook</div>
  <div class="game-frame">
    <div id="hud">
      <span id="scoreDisp">Score: 0</span>
      <span class="lv" id="levelDisp">Round: 1</span>
      <span id="livesDisp">Lives: ❤❤❤</span>
      <span class="hs" id="hsDisp">Hi: 0</span>
    </div>
    <canvas id="c" width="800" height="340"></canvas>
    <div id="choiceBtns"></div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A ship radios in with its size. Log it into the matching open berth: press <b>1/2/3</b> for Berth A/B/C, or <b>4</b> to put it on the <b>Wait List</b> if no matching berth is open. Press the <b>number key</b> or <b>tap</b> a button before the vessel gives up.</div>
</div>
<script>
(function(){
const HS_KEY='harbormasterlogbook_hs';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=340;

const BERTHS=[
  {key:'A',size:'S',label:'Berth A (Small)'},
  {key:'B',size:'M',label:'Berth B (Medium)'},
  {key:'C',size:'L',label:'Berth C (Large)'}
];
const SIZES=['S','M','L'];
const SIZE_LABEL={S:'Small',M:'Medium',L:'Large'};
const SHIP_NAMES=['Coral Drifter','Iron Gull','Northwind','Pelican Star','Salt Harvest','Blue Mariner','Grey Petrel','Amber Tide','Harbor Light','Stone Cutter'];

let score=0,lives=3,level=1,hi=0,gameOver=false,started=false;
let occupied=[false,false,false];
let ship=null,timeLeft=0,timeLimit=0,resolved=false,radio=0,radioDone=false;

function loadHi(){ try{ hi=parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ hi=0; } }
function saveHi(){ try{ localStorage.setItem(HS_KEY,String(hi)); }catch(e){} }
loadHi();

function buildButtons(){
  const el=document.getElementById('choiceBtns');
  el.innerHTML='';
  BERTHS.forEach((b,i)=>{
    const btn=document.createElement('button');
    btn.textContent=(i+1)+' '+I18N.t('berth_'+b.key,b.label);
    btn.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(i);});
    el.appendChild(btn);
  });
  const wait=document.createElement('button');
  wait.className='wait';
  wait.textContent='4 '+I18N.t('wait_list','Wait List');
  wait.addEventListener('pointerdown',e=>{e.stopPropagation(); onGuess(3);});
  el.appendChild(wait);
}

function occChance(){ return Math.min(0.65,0.12+level*0.09); }

function newShip(){
  timeLimit=Math.max(200,460-level*20);
  timeLeft=timeLimit;
  radio=0;radioDone=false;resolved=false;
  occupied=occupied.map(()=>Math.random()<occChance());
  const size=SIZES[Math.floor(Math.random()*SIZES.length)];
  const name=SHIP_NAMES[Math.floor(Math.random()*SHIP_NAMES.length)];
  ship={name,size};
}

function reset(){ score=0;lives=3;level=1;gameOver=false;started=false;occupied=[false,false,false];newShip(); }
reset();

function updateHud(){
  document.getElementById('scoreDisp').textContent=I18N.t('score_label','Score: {s}').replace('{s}',Math.floor(score));
  document.getElementById('levelDisp').textContent=I18N.t('round_label','Round: {l}').replace('{l}',level);
  document.getElementById('livesDisp').textContent=I18N.t('lives_label','Lives: {h}').replace('{h}','❤'.repeat(Math.max(0,lives)));
  document.getElementById('hsDisp').textContent=I18N.t('hi_label','Hi: {h}').replace('{h}',Math.floor(hi));
}

function levelUp(){ level++; SFX.levelup(); }

function failRound(){
  lives--;SFX.fail();
  if(lives<=0){ endGame(); return; }
  newShip();
}

function passRound(){
  score+=25*level;SFX.coin();
  if(score>=level*260)levelUp();
  newShip();
}

function correctBerthIndex(){
  const idx=BERTHS.findIndex(b=>b.size===ship.size);
  return (idx>=0&&!occupied[idx])?idx:-1;
}

function onGuess(i){
  if(!started||gameOver)return;
  if(!radioDone||resolved)return;
  resolved=true;
  const correctIdx=correctBerthIndex();
  if(i===3){
    if(correctIdx===-1){ passRound(); } else { failRound(); }
    return;
  }
  if(i===correctIdx){ passRound(); } else { failRound(); }
}

function startGame(){ if(!started){started=true;} else if(gameOver){reset();started=true;} }

c.addEventListener('pointerdown',()=>{ if(!started||gameOver)startGame(); });

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!started||gameOver)startGame(); return; }
  const m=e.code.match(/^Digit([1-9])$/);
  if(m&&started&&!gameOver){ e.preventDefault(); onGuess(parseInt(m[1],10)-1); }
});

function endGame(){
  gameOver=true;
  if(score>hi){hi=score;saveHi();}
  SFX.lose();
}

function drawBerths(){
  const bw=190,bh=90,gap=25,startX=(W-(bw*3+gap*2))/2,y=150;
  BERTHS.forEach((b,i)=>{
    const x=startX+i*(bw+gap);
    ctx.fillStyle=occupied[i]?'#5d4037':'#13445e';
    ctx.fillRect(x,y,bw,bh);
    ctx.strokeStyle='#4cc9f0';ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('berth_'+b.key,b.label),x+bw/2,y+28);
    ctx.font='14px Arial';
    ctx.fillStyle=occupied[i]?'#ffab91':'#9ef5c7';
    ctx.fillText(occupied[i]?I18N.t('occupied_label','OCCUPIED'):I18N.t('open_label','OPEN'),x+bw/2,y+58);
  });
}

function drawShip(){
  if(!ship)return;
  const cx=W/2,cy=60;
  ctx.save();
  ctx.fillStyle='#cfd8dc';
  ctx.beginPath();ctx.moveTo(cx-60,cy);ctx.lineTo(cx+60,cy);ctx.lineTo(cx+45,cy+22);ctx.lineTo(cx-45,cy+22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#546e7a';ctx.fillRect(cx-20,cy-18,40,18);
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  if(radioDone){
    ctx.fillText(ship.name,cx,cy+48);
    ctx.font='15px Arial';ctx.fillStyle='#ffe082';
    ctx.fillText(I18N.t('size_label','Size: {s}').replace('{s}',I18N.t('size_'+ship.size,SIZE_LABEL[ship.size])),cx,cy+70);
  } else {
    ctx.fillText(I18N.t('radio_hint','Receiving radio call...'),cx,cy+48);
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#071a2e');bg.addColorStop(1,'#0f2744');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!started){
    ctx.fillStyle='#4cc9f0';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap / Space to start'),W/2,H/2);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawBerths();drawShip();
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score_label','Score: {s} — Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    updateHud();
    requestAnimationFrame(loop);return;
  }

  if(!radioDone){
    radio+=0.02+level*0.002;
    if(radio>=1){radio=1;radioDone=true;SFX.point();}
  } else {
    timeLeft--;
    if(timeLeft<=0){ failRound(); }
  }

  drawBerths();
  drawShip();

  ctx.fillStyle='#b2dfdb';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(radioDone?I18N.t('pick_hint','Assign a berth — press 1-4 or tap below'):I18N.t('radio_wait','Logging vessel details...'),W/2,318);

  if(radioDone){
    const barW=400,barH=8,barX=W/2-barW/2,barY=300;
    ctx.fillStyle='#222';ctx.fillRect(barX,barY,barW,barH);
    const frac=Math.max(0,timeLeft/timeLimit);
    ctx.fillStyle=frac>0.4?'#2ecc71':(frac>0.18?'#ffd54f':'#e74c3c');
    ctx.fillRect(barX,barY,barW*frac,barH);
  }

  updateHud();
  requestAnimationFrame(loop);
}
loop();
})();
</script></body></html>
