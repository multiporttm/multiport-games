<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#2a2435;display:block;border-radius:8px;cursor:crosshair}
#hud{display:flex;justify-content:space-between;align-items:center;color:#f0e6d2;font-weight:700;padding:6px 4px;font-size:1rem;flex-wrap:wrap;gap:4px}
#hud .lives{color:#e94560;letter-spacing:2px}
#hud .tension{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Embroidery Beadwork Applique</div>
  <div class="game-frame">
    <div id="hud"><span id="info">Row 1 | Score: 0 | Hi: 0</span><span class="tension" id="tension">Tension: 100%</span><span class="lives" id="lives">♥♥♥</span></div>
    <canvas id="c" width="800" height="480"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move the needle with your mouse, finger, or <b>Arrow Keys</b> onto the glowing bead slot, then press <b>Space</b>, <b>Enter</b>, or tap to stitch a bead down. Keep even spacing and tension across denser beadwork patterns to score big.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=480;
const HI_KEY='embroiderybeadworkapplique_hi';
let hi=parseInt(localStorage.getItem(HI_KEY)||'0',10);
let round=1,score=0,lives=3,gameState='ready';
const MAX_ROUND=6;
let slots=[],placedIdx=0,tension=100;
let cursor={x:W/2,y:H/2};
let keys={};
let msgTimer=0,flashOk=false,flashBad=false;
const PALETTE=['#e94560','#ffd54f','#56cfe1','#9d7bea','#7ec850'];

function patternForRound(r){
  const cx=W/2,cy=H/2-10;
  const pts=[];
  if(r%3===1){ // spiral
    const turns=1.4+r*0.25,count=14+r*4;
    for(let i=0;i<count;i++){
      const t=i/count*turns*Math.PI*2;
      const rad=18+ (i/count)*(150+r*6);
      pts.push({x:cx+Math.cos(t)*rad,y:cy+Math.sin(t)*rad*0.9});
    }
  } else if(r%3===2){ // rows (grid lattice like beadwork rows)
    const cols=5+Math.floor(r/1.2),rows=3+Math.floor(r/2);
    const gap=Math.max(26,54-r*3);
    for(let ry=0;ry<rows;ry++){
      for(let rx=0;rx<cols;rx++){
        const offset=(ry%2===0)?0:gap/2;
        pts.push({x:cx-((cols-1)*gap)/2+rx*gap+offset,y:cy-((rows-1)*gap)/2+ry*gap});
      }
    }
  } else { // flower / radial burst
    const petals=5+Math.floor(r/2);
    const rings=2+Math.floor(r/3);
    for(let ring=1;ring<=rings;ring++){
      const rad=30*ring+ring*r*1.5;
      const n=petals*ring;
      for(let i=0;i<n;i++){
        const t=Math.PI*2*i/n;
        pts.push({x:cx+Math.cos(t)*rad,y:cy+Math.sin(t)*rad*0.85});
      }
    }
  }
  return pts;
}

function tolForRound(r){ return Math.max(14,30-r*2); }

function startRound(r){
  round=r;
  slots=patternForRound(r);
  placedIdx=0;
  tension=100;
  gameState='playing';
}

function resetGame(){ score=0;lives=3;startRound(1); }

function flashGood(){flashOk=true;setTimeout(()=>flashOk=false,150);}
function flashBadFn(){flashBad=true;setTimeout(()=>flashBad=false,150);}

function attemptPlace(){
  if(gameState==='ready'||gameState==='gameover'||gameState==='win'){resetGame();return;}
  if(gameState!=='playing')return;
  const target=slots[placedIdx];
  if(!target)return;
  const dx=cursor.x-target.x,dy=cursor.y-target.y;
  const dist=Math.hypot(dx,dy);
  const tol=tolForRound(round);
  if(dist<=tol*2.2){
    const acc=Math.max(0,1-dist/(tol*2.2));
    const pts=Math.round(20+acc*60);
    score+=pts;
    target.placed=true;
    target.beadIdx=placedIdx;
    placedIdx++;
    tension=Math.min(100,tension+acc*6);
    flashGood();
    SFX.click();
    if(placedIdx>=slots.length){
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      if(round>=MAX_ROUND){ gameState='win'; SFX.win(); }
      else { SFX.levelup(); gameState='levelup'; msgTimer=90; }
    }
  } else {
    lives--;
    tension=Math.max(0,tension-20);
    flashBadFn();
    SFX.hit();
    if(lives<=0){
      if(score>hi){hi=score;localStorage.setItem(HI_KEY,String(hi));}
      gameState='gameover';
      SFX.lose();
    }
  }
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();attemptPlace();}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function clientToCanvas(clientX,clientY){
  const r=c.getBoundingClientRect();
  return {x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}
c.addEventListener('mousemove',e=>{const p=clientToCanvas(e.clientX,e.clientY);cursor.x=p.x;cursor.y=p.y;});
c.addEventListener('click',e=>{const p=clientToCanvas(e.clientX,e.clientY);cursor.x=p.x;cursor.y=p.y;attemptPlace();});
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const p=clientToCanvas(t.clientX,t.clientY);cursor.x=p.x;cursor.y=p.y;attemptPlace();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const p=clientToCanvas(t.clientX,t.clientY);cursor.x=p.x;cursor.y=p.y;},{passive:false});

function updateCursorKeys(){
  const spd=6;
  if(keys['ArrowLeft'])cursor.x-=spd;
  if(keys['ArrowRight'])cursor.x+=spd;
  if(keys['ArrowUp'])cursor.y-=spd;
  if(keys['ArrowDown'])cursor.y+=spd;
  cursor.x=Math.max(10,Math.min(W-10,cursor.x));
  cursor.y=Math.max(10,Math.min(H-10,cursor.y));
}

function drawFabric(){
  ctx.fillStyle='#2a2435';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawBead(p,color,r){
  ctx.save();
  const grad=ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,1,p.x,p.y,r);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(0.3,color);
  grad.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawSlots(){
  slots.forEach((s,i)=>{
    if(s.placed){
      drawBead(s,PALETTE[s.beadIdx%PALETTE.length],9);
    } else if(i===placedIdx){
      const pulse=3+Math.sin(Date.now()/140)*2;
      ctx.save();
      ctx.strokeStyle='#ffd54f';
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(s.x,s.y,10+pulse,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,0.18)';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  });
}

function drawCursor(){
  ctx.save();
  ctx.strokeStyle=flashBad?'#e94560':(flashOk?'#4caf50':'#fff');
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cursor.x-12,cursor.y);ctx.lineTo(cursor.x+12,cursor.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cursor.x,cursor.y-12);ctx.lineTo(cursor.x,cursor.y+12);ctx.stroke();
  ctx.beginPath();ctx.arc(cursor.x,cursor.y,16,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawCenterText(lines){
  ctx.save();
  ctx.fillStyle='rgba(10,10,20,0.78)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  ctx.textAlign='center';
  ctx.font='bold 34px Arial';
  ctx.fillText(lines[0],W/2,H/2-20);
  ctx.font='18px Arial';
  for(let i=1;i<lines.length;i++) ctx.fillText(lines[i],W/2,H/2+20+(i-1)*26);
  ctx.restore();
}

function updateHud(){
  document.getElementById('info').textContent=
    I18N.t('bead_hud','Row {r} | Score: {s} | Hi: {h}').replace('{r}',round).replace('{s}',score).replace('{h}',hi);
  document.getElementById('tension').textContent=I18N.t('tension_label','Tension: {t}%').replace('{t}',Math.round(tension));
  document.getElementById('lives').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
}

function loop(){
  updateCursorKeys();
  drawFabric();
  if(gameState==='ready'){
    drawCenterText([I18N.t('bead_title','Beadwork Applique'),I18N.t('start_hint','Press Space or Tap to start')]);
  } else if(gameState==='playing'){
    drawSlots();
    drawCursor();
  } else if(gameState==='levelup'){
    drawSlots();
    drawCenterText([I18N.t('level_clear','Pattern Complete!'),I18N.t('next_level','Next design loading...')]);
    msgTimer--;
    if(msgTimer<=0) startRound(round+1);
  } else if(gameState==='gameover'){
    drawCenterText([I18N.t('game_over_title','GAME OVER'),I18N.t('final_score','Score: {s}').replace('{s}',score),I18N.t('restart_hint','Tap or Space to restart')]);
  } else if(gameState==='win'){
    drawCenterText([I18N.t('you_win','BEADWORK MASTER!'),I18N.t('final_score','Score: {s}').replace('{s}',score),I18N.t('restart_hint','Tap or Space to restart')]);
  }
  updateHud();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
