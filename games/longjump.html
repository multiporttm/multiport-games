<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Long Jump</title><meta name="description" content="Play Long Jump free online — Mash Space or tap rapidly to sprint down the runway, then press once to jump before the foul line. Land as far as you can without fouling!"><link rel="canonical" href="https://games.multiportllc.com/games/longjump"><meta property="og:title" content="Long Jump - Multiport Games"><meta property="og:description" content="Play Long Jump free online — Mash Space or tap rapidly to sprint down the runway, then press once to jump before the foul line. Land as far as you can without fouling!"><meta property="og:url" content="https://games.multiportllc.com/games/longjump"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Long Jump","description":"Play Long Jump free online instantly. Mash Space or tap rapidly to sprint down the runway, then press once to jump before the foul line. Land as far as you can without fouling! No download or signup required.","genre":"Sports","url":"https://games.multiportllc.com/games/longjump","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#87ceeb,#cfeeff 40%,#e0c98a 40%);display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;padding:6px 4px;font-size:1rem}
#hud span{color:#ffd54f}
#speedWrap{background:rgba(255,255,255,.15);border-radius:8px;height:14px;width:100%;overflow:hidden;margin:4px 0 8px}
#speedBar{height:100%;width:0%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336);transition:width .05s linear}
#attempts{color:#ddd;text-align:center;font-size:.85rem;margin-top:4px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Long Jump</div>
  <div class="game-frame">
    <div id="hud"><span id="lastJump">Last: —</span><span id="best">Best: 0.00m</span></div>
    <div id="speedWrap"><div id="speedBar"></div></div>
    <canvas id="c" width="800" height="300"></canvas>
    <div id="attempts">Attempt 1 of 6</div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Mash <b>Space</b> or <b>tap rapidly</b> to sprint down the runway. Press <b>Space</b> / <b>tap</b> once to jump — but jump before the white foul line or the attempt won't count! Your speed and timing decide how far you fly. You get 6 attempts — beat your best legal distance.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300,GY=180;
const bestKey='longjump_best';
let best=parseFloat(localStorage.getItem(bestKey)||'0');
document.getElementById('best').textContent=I18N.t('best_label','Best: {v}m').replace('{v}',best.toFixed(2));

const FOUL_X=560; // foul line position
let state='ready'; // ready, running, airborne, result
let speed=0,runnerX=60,frame=0,attempt=1,MAX_ATTEMPTS=6;
let jumpT=0,jumpVX=0,jumpVY=0,jumpStartX=0,jumpStartY=GY,fouled=false,landX=0,distance=0;

function reset(){
  state='ready';speed=0;runnerX=60;frame=0;
  document.getElementById('speedBar').style.width='0%';
  document.getElementById('attempts').textContent=I18N.t('attempt_label','Attempt {n} of {m}').replace('{n}',attempt).replace('{m}',MAX_ATTEMPTS);
}

function press(){
  if(attempt>MAX_ATTEMPTS&&state==='result'){
    attempt=1;reset();return;
  }
  if(state==='ready'){ state='running'; return; }
  if(state==='running'){
    speed=Math.min(1,speed+0.11);
    SFX.tick();
    runnerX+=6+speed*10;
    document.getElementById('speedBar').style.width=(speed*100).toFixed(0)+'%';
    takeoff();
    return;
  }
  if(state==='result'){
    attempt++;
    reset();
  }
}

function takeoff(){
  state='airborne';
  jumpT=0;
  jumpStartX=runnerX;
  jumpStartY=GY;
  fouled=runnerX>FOUL_X;
  jumpVX=4+speed*7;
  jumpVY=-(6+speed*6);
  SFX.jump();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();press();}
});
c.addEventListener('pointerdown',e=>{e.preventDefault();press();});

function drawRunway(){
  ctx.fillStyle='#c9a35b';
  ctx.fillRect(0,GY,W,20);
  ctx.fillStyle='#fff';
  ctx.fillRect(FOUL_X-2,GY-4,4,90);
  ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('foul_label','FOUL LINE'),FOUL_X,GY-10);
  // distance markers on sand
  ctx.strokeStyle='rgba(0,0,0,.15)';
  ctx.lineWidth=1;
  for(let m=0;m<=12;m++){
    const x=FOUL_X+m*18;
    if(x>W)break;
    ctx.beginPath();ctx.moveTo(x,GY+20);ctx.lineTo(x,GY+90);ctx.stroke();
  }
}

function drawRunner(x,y,ang){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang);
  ctx.fillStyle='#e94560';
  ctx.fillRect(-8,-24,16,26);
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-30,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e94560';
  const legPhase=Math.sin(frame*0.6)*10;
  ctx.fillRect(-6,0,5,14+legPhase*0.3);
  ctx.fillRect(2,0,5,14-legPhase*0.3);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#5aa9e6');sky.addColorStop(1,'#cfeeff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GY);
  ctx.fillStyle='#e0c98a';ctx.fillRect(0,GY,W,H-GY);
  drawRunway();

  frame++;

  if(state==='ready'){
    ctx.fillStyle='#333';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lj_start','Tap / Space rapidly to sprint!'),W/2,50);
    drawRunner(runnerX,GY,0);
  } else if(state==='running'){
    speed=Math.max(0,speed-0.006);
    document.getElementById('speedBar').style.width=(speed*100).toFixed(0)+'%';
    drawRunner(Math.min(runnerX,W-40),GY,0);
    ctx.fillStyle='#333';ctx.font='bold 18px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lj_build','Jump before the foul line!'),W/2,50);
  } else if(state==='airborne'){
    jumpT+=1;
    const x=jumpStartX+jumpVX*jumpT;
    const y=Math.min(GY,jumpStartY+jumpVY*jumpT+0.9*jumpT*jumpT*0.5);
    const ang=Math.atan2(jumpVY+0.9*jumpT,jumpVX)*0.6;
    drawRunner(x,y,ang);
    if(y>=GY&&jumpT>3){
      landX=x;
      distance=Math.max(0,(landX-FOUL_X)/18*0.3+ (fouled?0:0));
      // scale: 18px per marker representing 0.3m -> convert consistently
      distance=(landX-FOUL_X)/60; // tuned scale for meters
      endJump();
    }
  } else if(state==='result'){
    drawRunner(landX,GY,0);
    ctx.font='bold 28px Arial';ctx.textAlign='center';
    if(fouled){
      ctx.fillStyle='#f44336';
      ctx.fillText(I18N.t('lj_foul','FOUL! Jumped past the line'),W/2,90);
    } else {
      ctx.fillStyle='#2d6a2d';
      ctx.fillText(I18N.t('lj_distance','Distance: {v}m').replace('{v}',Math.max(0,distance).toFixed(2)),W/2,90);
    }
    ctx.fillStyle='#333';ctx.font='18px Arial';
    if(attempt>=MAX_ATTEMPTS){
      ctx.fillText(I18N.t('lj_done','Final attempt done! Tap / Space to restart'),W/2,125);
    } else {
      ctx.fillText(I18N.t('lj_next','Tap / Space for next attempt'),W/2,125);
    }
  }

  requestAnimationFrame(loop);
}

function endJump(){
  state='result';
  const d=Math.max(0,distance);
  document.getElementById('lastJump').textContent=I18N.t('last_label','Last: {v}m').replace('{v}',fouled?'FOUL':d.toFixed(2));
  if(fouled){
    SFX.fail();
  } else {
    SFX.success();
    if(d>best){
      best=d;localStorage.setItem(bestKey,best.toFixed(2));
      document.getElementById('best').textContent=I18N.t('best_label','Best: {v}m').replace('{v}',best.toFixed(2));
    }
  }
  if(attempt>=MAX_ATTEMPTS){
    attempt=MAX_ATTEMPTS+1; // sentinel to trigger full reset on next press
  }
}

reset();
loop();
</script></body></html>
