<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:radial-gradient(circle at center,#101830 0%,#050510 75%);display:block;border-radius:8px;touch-action:none}
#score-display{color:#4fd8ff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Laser Turret</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Wave: 1 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your <b>mouse/finger</b> or use <b>Arrow Keys</b> to aim the turret, and press <b>Space</b> or <b>Click/Tap</b> to fire. Destroy enemies before they reach the base at the center — waves grow faster and tougher over time.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500,CX=W/2,CY=H/2;
let hi=parseInt(localStorage.getItem('laserturret_hi')||'0',10);
let score=0,wave=1,lives=3,gameOver=true,started=false;
let aimAngle=0;
let enemies=[],bolts=[],particles=[];
let waveTimer=0,spawnedThisWave=0,waveTarget=6;
let baseRadius=28;
let cooldown=0;

function reset(){
  score=0;wave=1;lives=3;gameOver=false;started=true;
  enemies=[];bolts=[];particles=[];
  waveTimer=0;spawnedThisWave=0;waveTarget=6;cooldown=0;
  aimAngle=0;
}

function spawnEnemy(){
  const angle=Math.random()*Math.PI*2;
  const dist=Math.max(W,H)*0.62;
  const speed=0.5+Math.min(2.2,wave*0.12)+Math.random()*0.3;
  enemies.push({x:CX+Math.cos(angle)*dist,y:CY+Math.sin(angle)*dist,angle,speed,r:14,hp:1+Math.floor(wave/4)});
  spawnedThisWave++;
}

function fire(){
  if(gameOver){ if(started){reset();} else {reset();} return; }
  if(!started){reset();return;}
  if(cooldown>0)return;
  cooldown=8;
  bolts.push({x:CX+Math.cos(aimAngle)*baseRadius,y:CY+Math.sin(aimAngle)*baseRadius,angle:aimAngle,speed:11,life:60});
  SFX.click();
}

// Aiming
let usingMouse=false;
function setAimFromClient(clientX,clientY){
  const rect=c.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  const y=(clientY-rect.top)*(H/rect.height);
  aimAngle=Math.atan2(y-CY,x-CX);
  usingMouse=true;
}
c.addEventListener('mousemove',e=>setAimFromClient(e.clientX,e.clientY));
c.addEventListener('mousedown',e=>{setAimFromClient(e.clientX,e.clientY);fire();});
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];setAimFromClient(t.clientX,t.clientY);fire();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];setAimFromClient(t.clientX,t.clientY);},{passive:false});

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();fire();}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function updateAimFromKeys(dt){
  if(usingMouse)return;
  const rotSpeed=0.045*dt;
  if(keys['ArrowLeft'])aimAngle-=rotSpeed;
  if(keys['ArrowRight'])aimAngle+=rotSpeed;
  if(keys['ArrowUp'])aimAngle-=rotSpeed*0; // no-op reserved
}

function rectDist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function drawBase(){
  ctx.save();
  const pulse=2+Math.sin(Date.now()/300)*1.5;
  ctx.fillStyle='#1c3d5a';
  ctx.beginPath();ctx.arc(CX,CY,baseRadius+8+pulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4fd8ff';
  ctx.beginPath();ctx.arc(CX,CY,baseRadius,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0a1622';
  ctx.beginPath();ctx.arc(CX,CY,baseRadius-8,0,Math.PI*2);ctx.fill();
  // turret barrel
  ctx.strokeStyle='#4fd8ff';ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(CX,CY);
  ctx.lineTo(CX+Math.cos(aimAngle)*(baseRadius+18),CY+Math.sin(aimAngle)*(baseRadius+18));
  ctx.stroke();
  ctx.restore();
}

function drawEnemy(en){
  ctx.save();
  ctx.translate(en.x,en.y);
  ctx.rotate(en.angle+Math.PI/2);
  ctx.fillStyle=en.hp>1?'#ff5566':'#ff9d4d';
  ctx.beginPath();
  ctx.moveTo(0,-en.r);
  ctx.lineTo(en.r*0.85,en.r*0.8);
  ctx.lineTo(-en.r*0.85,en.r*0.8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function spawnParticles(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,color});
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // background grid rings
  ctx.strokeStyle='rgba(79,216,255,0.08)';
  for(let r=60;r<420;r+=60){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();}

  if(!started){
    drawBase();
    ctx.fillStyle='#4fd8ff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('lt_start_hint','Click / Tap / Space to start'),CX,60);
    requestAnimationFrame(loop);
    return;
  }

  if(gameOver){
    drawBase();
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),CX,CY-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('lt_restart_hint','Click / Tap / Space to restart'),CX,CY+18);
    updateHud();
    requestAnimationFrame(loop);
    return;
  }

  const dt=1;
  updateAimFromKeys(dt);
  if(cooldown>0)cooldown-=dt;

  // Wave spawn logic
  waveTimer+=dt;
  const spawnInterval=Math.max(18,50-wave*3);
  if(spawnedThisWave<waveTarget && waveTimer>=spawnInterval){
    waveTimer=0;
    spawnEnemy();
  }
  if(spawnedThisWave>=waveTarget && enemies.length===0){
    wave++;
    waveTarget=6+wave*2;
    spawnedThisWave=0;
    waveTimer=0;
    SFX.levelup();
  }

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i];
    en.x+=Math.cos(en.angle)*en.speed*dt;
    en.y+=Math.sin(en.angle)*en.speed*dt;
    drawEnemy(en);
    if(rectDist(en,{x:CX,y:CY})<baseRadius+en.r*0.5){
      enemies.splice(i,1);
      lives--;
      spawnParticles(en.x,en.y,'#ff5566');
      SFX.hit();
      if(lives<=0){
        endGame();
      }
    }
  }

  // Update bolts
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.x+=Math.cos(b.angle)*b.speed*dt;
    b.y+=Math.sin(b.angle)*b.speed*dt;
    b.life-=dt;
    ctx.strokeStyle='#7cffb0';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-Math.cos(b.angle)*14,b.y-Math.sin(b.angle)*14);
    ctx.stroke();
    let hitIdx=-1;
    for(let j=0;j<enemies.length;j++){
      if(rectDist(b,enemies[j])<enemies[j].r){hitIdx=j;break;}
    }
    if(hitIdx>=0){
      const en=enemies[hitIdx];
      en.hp--;
      spawnParticles(b.x,b.y,'#7cffb0');
      bolts.splice(i,1);
      if(en.hp<=0){
        enemies.splice(hitIdx,1);
        score+=10*wave;
        if(score>hi){hi=score;localStorage.setItem('laserturret_hi',hi);}
        SFX.coin();
      }
      continue;
    }
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)bolts.splice(i,1);
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=Math.max(0,p.life/24);
    ctx.fillRect(p.x-2,p.y-2,4,4);
    ctx.globalAlpha=1;
    if(p.life<=0)particles.splice(i,1);
  }

  drawBase();
  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('score-display').textContent=
    I18N.t('lt_hud','Score: {s} | Wave: {w} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{w}',wave).replace('{l}',Math.max(0,lives)).replace('{h}',hi);
}

function endGame(){
  gameOver=true;
  SFX.lose();
}

loop();
</script></body></html>
