<style>
body{background:#08080f}
#c{background:#241a12;display:block;border-radius:8px;touch-action:none}
#score-display{color:#9ad1ff;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Skateboard Deck Sealing</div>
  <div class="game-frame">
    <div id="score-display">Round: 1 | Hi: 0</div>
    <canvas id="c" width="800" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Drag the brush (or use <b>Arrow Keys</b>) over the deck to coat it with sealant. Watch the gauge: keep your coverage speed inside the green safe band — too slow pools the sealant, too fast leaves it bare. Cover every cell before the sealant can runs dry!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=420;
const KEY='skateboarddecksealing_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let round=1,gameOver=false,won=false,started=false;
let grid,cols,rows,cellW,cellH,originX,originY;
let brush,timeLeft,maxTime,keys={};
let gaugeVal=0.5; // 0..1, target band is between .4 and .6

function setupRound(r){
  cols=6+Math.min(r,10);
  rows=3+Math.min(Math.floor(r/2),6);
  cellW=Math.min(60,(W-60)/cols);
  cellH=Math.min(48,(H-140)/rows);
  originX=(W-cols*cellW)/2;
  originY=90;
  grid=[];
  for(let y=0;y<rows;y++){
    const row=[];
    for(let x=0;x<cols;x++)row.push({state:0}); // 0 bare,1 sealed-good,2 pooled(bad)
    grid.push(row);
  }
  brush={x:W/2,y:H/2,r:22};
  maxTime=18+r*2;
  timeLeft=maxTime;
  gaugeVal=0.5;
  gameOver=false;won=false;
}

function newGame(){round=1;setupRound(round);started=false;}

let drag=false,lastPos=null;
function toCoords(evt){
  const rect=c.getBoundingClientRect();
  const cx=(evt.touches?evt.touches[0].clientX:evt.clientX)-rect.left;
  const cy=(evt.touches?evt.touches[0].clientY:evt.clientY)-rect.top;
  return {x:cx*(W/rect.width),y:cy*(H/rect.height)};
}

c.addEventListener('mousedown',e=>{started=true;drag=true;lastPos=toCoords(e);brush.x=lastPos.x;brush.y=lastPos.y;});
c.addEventListener('mousemove',e=>{if(drag){const p=toCoords(e);paintMove(p);} });
window.addEventListener('mouseup',()=>{drag=false;lastPos=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();started=true;drag=true;lastPos=toCoords(e);brush.x=lastPos.x;brush.y=lastPos.y;},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(drag){const p=toCoords(e);paintMove(p);} },{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();drag=false;lastPos=null;},{passive:false});
c.addEventListener('click',()=>{if(gameOver){ if(won){round++;setupRound(round);}else{newGame();} }});

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;started=true;
  if(e.code==='Enter'||e.code==='Space'){ if(gameOver){ if(won){round++;setupRound(round);}else{newGame();} } }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function paintMove(p){
  const dist=lastPos?Math.hypot(p.x-lastPos.x,p.y-lastPos.y):0;
  const speed=dist; // per-event speed proxy
  applyBrush(p.x,p.y,speed);
  lastPos=p;
  brush.x=p.x;brush.y=p.y;
}

function applyBrush(x,y,speed){
  brush.x=x;brush.y=y;
  // speed influences gauge: too slow -> pooling risk goes up, too fast -> misses
  const norm=Math.min(1,speed/26);
  gaugeVal += (norm-gaugeVal)*0.25;
  const inBand = gaugeVal>0.32 && gaugeVal<0.72;
  for(let ry=0;ry<rows;ry++){
    for(let rx=0;rx<cols;rx++){
      const cx=originX+rx*cellW+cellW/2, cy=originY+ry*cellH+cellH/2;
      if(Math.hypot(cx-x,cy-y)<brush.r){
        const cell=grid[ry][rx];
        if(cell.state===0){
          cell.state = inBand?1:2;
          if(inBand){SFX.click();} else {SFX.error();}
        } else if(cell.state===1 && !inBand){
          cell.state=2; // oversaturate turns it bad if we keep going out of band
        }
      }
    }
  }
}

function handleKeyMove(dt){
  if(gameOver||drag)return;
  if(!started)return;
  const spd=5*dt;
  let moved=false,dx=0,dy=0;
  if(keys['ArrowLeft']){dx-=spd;moved=true;}
  if(keys['ArrowRight']){dx+=spd;moved=true;}
  if(keys['ArrowUp']){dy-=spd;moved=true;}
  if(keys['ArrowDown']){dy+=spd;moved=true;}
  if(moved){
    const speed=Math.hypot(dx,dy);
    applyBrush(brush.x+dx,brush.y+dy,speed*2.2);
  }
}

function coverage(){
  let good=0,total=cols*rows;
  for(const row of grid)for(const cell of row)if(cell.state===1)good++;
  return good/total;
}
function hasBad(){
  for(const row of grid)for(const cell of row)if(cell.state===2)return true;
  return false;
}

function checkEnd(dt){
  if(timeLeft<=0){
    gameOver=true;won=false;SFX.lose();return;
  }
  const cov=coverage();
  if(cov>=0.97){
    gameOver=true;won=true;SFX.win();
    if(round>hi){hi=round;localStorage.setItem(KEY,String(hi));SFX.levelup();}
  }
}

function drawGrid(){
  for(let ry=0;ry<rows;ry++){
    for(let rx=0;rx<cols;rx++){
      const cell=grid[ry][rx];
      const x=originX+rx*cellW,y=originY+ry*cellH;
      let fill='#5a3d22';
      if(cell.state===1)fill='#7ec8ff';
      if(cell.state===2)fill='#e94560';
      ctx.fillStyle=fill;
      ctx.fillRect(x+1,y+1,cellW-2,cellH-2);
      ctx.strokeStyle='rgba(0,0,0,0.3)';
      ctx.strokeRect(x+1,y+1,cellW-2,cellH-2);
      if(cell.state===1){
        ctx.fillStyle='rgba(255,255,255,0.25)';
        ctx.fillRect(x+3,y+3,cellW-6,4);
      }
    }
  }
}

function drawBrush(){
  ctx.save();
  ctx.beginPath();ctx.arc(brush.x,brush.y,brush.r,0,Math.PI*2);
  ctx.fillStyle='rgba(126,200,255,0.35)';ctx.fill();
  ctx.strokeStyle='#9ad1ff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#caa368';
  ctx.fillRect(brush.x-8,brush.y-brush.r-18,16,18);
  ctx.fillStyle='#e8d9b0';
  ctx.fillRect(brush.x-10,brush.y-brush.r-6,20,8);
  ctx.restore();
}

function drawGauge(){
  const gx=W-180,gy=20,gw=160,gh=18;
  ctx.fillStyle='#1a1410';ctx.fillRect(gx,gy,gw,gh);
  // safe band
  ctx.fillStyle='rgba(126,222,126,0.5)';
  ctx.fillRect(gx+gw*0.32,gy,gw*(0.72-0.32),gh);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
  const px=gx+gaugeVal*gw;
  ctx.fillStyle='#ffd54f';
  ctx.fillRect(px-2,gy-4,4,gh+8);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('seal_gauge_label','Coat Speed'),gx,gy-8);
}

let lastTime=null;
function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  handleKeyMove(dt);
  if(started&&!gameOver){
    timeLeft-=dt/60;
    checkEnd(dt);
  }

  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1e1712');bg.addColorStop(1,'#2b2016');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawGrid();
  drawGauge();
  if(!gameOver)drawBrush();

  const cov=Math.round(coverage()*100);
  document.getElementById('score-display').textContent=
    I18N.t('seal_status','Round: {r} | Coverage: {c}% | Time: {t}s | Hi: {h}')
      .replace('{r}',round).replace('{c}',cov).replace('{t}',Math.max(0,Math.ceil(timeLeft))).replace('{h}',hi);

  if(!started){
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('seal_start','Drag or use arrows to start sealing'),W/2,40);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(won?I18N.t('seal_win','DECK SEALED!'):I18N.t('seal_lose','SEALANT RUINED'),W/2,H/2-10);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('seal_continue','Click or press Enter to continue'),W/2,H/2+26);
  }

  requestAnimationFrame(loop);
}
newGame();
loop();
</script></body></html>
