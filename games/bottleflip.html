<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0d2b3e;display:block;border-radius:8px;margin:0 auto;touch-action:none}
#score-display{color:#ffd54f;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bottle Flip</div>
  <div class="game-frame">
    <div id="score-display">Streak: 0 | Best: 0</div>
    <canvas id="c" width="480" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press and <b>Hold</b> (mouse or touch) to charge the flip meter, then <b>Release</b> to launch the bottle. Time your release so the bottle spins and lands upright on the ledge — each landing makes the next ledge tougher!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=480,H=420;
const GROUND=H-40;

let streak=parseInt(localStorage.getItem('bottleflip_streak')||'0',10);
let best=parseInt(localStorage.getItem('bottleflip_best')||'0',10);

let bottle,ledge,charging,charge,state,started;
// state: 'idle' (on ledge waiting), 'charging', 'flying', 'result'
let resultTimer=0,resultMsg='';

function newLedge(level){
  const width=Math.max(50,130-level*8);
  const x=80+Math.random()*(W-160-width);
  const moving=level>=3;
  return {x,y:GROUND,w:width,h:14,moving,vx:moving?(1+level*0.15)*(Math.random()<0.5?-1:1):0,level};
}

function resetBottle(onLedge){
  bottle={
    x:onLedge.x+onLedge.w/2,
    y:onLedge.y-30,
    vx:0,vy:0,
    rot:0,vrot:0,
    w:16,h:30,
    upright:true
  };
}

function reset(){
  streak=0;
  ledge=newLedge(0);
  resetBottle(ledge);
  charging=false;
  charge=0;
  state='idle';
  started=false;
  resultTimer=0;
}

function startCharge(){
  if(!started)started=true;
  if(state==='result'){ nextRound(); return; }
  if(state!=='idle')return;
  charging=true;
  charge=0;
  state='charging';
}

function releaseCharge(){
  if(state!=='charging')return;
  charging=false;
  state='flying';
  const power=0.3+charge*0.7; // 0.3 - 1.0
  bottle.vy=-(9+power*9);
  bottle.vx=(Math.random()-0.5)*1.5;
  bottle.vrot=(0.14+power*0.32)*(Math.random()<0.5?1:-1)*3.4* (0.55+power*0.9);
  // sweet spot: power in [0.55,0.8] gives cleaner spin counts; simulate physically instead of faking
  SFX.jump();
}

function nextRound(){
  ledge=newLedge(Math.min(streak,12));
  resetBottle(ledge);
  state='idle';
  charging=false;
  charge=0;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!charging&&state!=='flying')startCharge();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault(); if(charging)releaseCharge();}
});
c.addEventListener('mousedown',e=>{e.preventDefault();startCharge();});
document.addEventListener('mouseup',()=>{ if(charging)releaseCharge(); });
c.addEventListener('touchstart',e=>{e.preventDefault();startCharge();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault(); if(charging)releaseCharge(); },{passive:false});

function drawBottle(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(b.rot);
  ctx.fillStyle='#3fc1ff';
  ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h*0.75);
  ctx.fillStyle='#8fe0ff';
  ctx.fillRect(-b.w/2+2,-b.h/2+3,b.w-4,6);
  ctx.fillStyle='#1e6b8c';
  ctx.fillRect(-b.w/4,-b.h/2-8,b.w/2,8);
  ctx.restore();
}

function drawLedge(l){
  ctx.fillStyle=l.moving?'#c9724b':'#7ec850';
  ctx.fillRect(l.x,l.y,l.w,l.h);
  ctx.fillStyle='#5a3c1f';
  ctx.fillRect(l.x,l.y+l.h,l.w,H-l.y-l.h);
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function normalizedRot(r){
  let m=r%(Math.PI*2);
  if(m<0)m+=Math.PI*2;
  return m;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d2b3e');sky.addColorStop(1,'#123f57');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(ledge.moving&&state!=='result'){
    ledge.x+=ledge.vx;
    if(ledge.x<40||ledge.x+ledge.w>W-40)ledge.vx*=-1;
  }
  drawLedge(ledge);

  if(!started){
    drawBottle(bottle);
    ctx.fillStyle='#ffd54fcc';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('bf_start_hint','Hold to charge, release to flip'),W/2,H/2-100);
    ctx.textAlign='left';
    requestAnimationFrame(loop);
    return;
  }

  if(state==='charging'){
    charge=Math.min(1,charge+0.02);
  }

  if(state==='flying'){
    bottle.vy+=0.45;
    bottle.x+=bottle.vx;
    bottle.y+=bottle.vy;
    bottle.rot+=bottle.vrot*0.1;
    // landing check when falling and near ledge height
    if(bottle.vy>0&&bottle.y+bottle.h/2>=ledge.y){
      const onLedgeX=rectsOverlap(bottle.x-bottle.w/2,bottle.y-bottle.h/2,bottle.w,bottle.h,ledge.x,ledge.y-40,ledge.w,44);
      const rot=normalizedRot(bottle.rot);
      const upright=rot<0.35||rot>Math.PI*2-0.35;
      if(onLedgeX&&upright){
        bottle.y=ledge.y-bottle.h/2+2;
        bottle.vy=0;bottle.vx=0;bottle.vrot=0;bottle.rot=0;
        streak++;
        if(streak>best){best=streak;localStorage.setItem('bottleflip_best',best);}
        localStorage.setItem('bottleflip_streak',streak);
        resultMsg=I18N.t('bf_landed','Landed! Streak: {s}').replace('{s}',streak);
        state='result';
        resultTimer=55;
        SFX.success();
      } else {
        resultMsg=I18N.t('bf_missed','Missed! Streak reset.');
        state='result';
        resultTimer=65;
        SFX.fail();
        streak=0;
        localStorage.setItem('bottleflip_streak',streak);
      }
    }
    if(bottle.y>H+60){
      resultMsg=I18N.t('bf_missed','Missed! Streak reset.');
      state='result';
      resultTimer=65;
      streak=0;
      localStorage.setItem('bottleflip_streak',streak);
      SFX.fail();
    }
  }

  drawBottle(bottle);

  if(state==='charging'){
    ctx.fillStyle='#222';
    ctx.fillRect(W/2-80,20,160,18);
    ctx.fillStyle='#ffd54f';
    ctx.fillRect(W/2-78,22,156*charge,14);
    ctx.strokeStyle='#fff';ctx.strokeRect(W/2-80,20,160,18);
  }

  if(state==='result'){
    resultTimer--;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,150,W,90);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(resultMsg,W/2,190);
    ctx.font='16px Arial';
    ctx.fillText(I18N.t('bf_continue_hint','Tap / Space to continue'),W/2,218);
    ctx.textAlign='left';
    if(resultTimer<=0){
      // wait for explicit input via startCharge() which calls nextRound when state==='result'
    }
  }

  document.getElementById('score-display').textContent=
    I18N.t('bf_score_label','Streak: {s} | Best: {b}').replace('{s}',streak).replace('{b}',best);

  requestAnimationFrame(loop);
}

reset();
loop();
</script></body></html>
