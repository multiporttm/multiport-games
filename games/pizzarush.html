<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Pizza Rush</title><meta name="description" content="Play Pizza Rush free online — Add the toppings in the exact order shown before time runs out. Serve as many pizzas as you can!"><link rel="canonical" href="https://games.multiportllc.com/games/pizzarush"><meta property="og:title" content="Pizza Rush - Multiport Games"><meta property="og:description" content="Play Pizza Rush free online — Add the toppings in the exact order shown before time runs out. Serve as many pizzas as you can!"><meta property="og:url" content="https://games.multiportllc.com/games/pizzarush"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Pizza Rush","description":"Play Pizza Rush free online instantly. Add the toppings in the exact order shown before time runs out. Serve as many pizzas as you can! No download or signup required.","genre":"Casual","url":"https://games.multiportllc.com/games/pizzarush","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#ui{color:#ffb74d;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#order{text-align:center;font-size:1.6rem;padding:8px;letter-spacing:6px}
#pizza{text-align:center;font-size:2.2rem;padding:10px;min-height:48px;letter-spacing:4px}
#timer-bar{height:8px;background:#e65100;margin:0 20px 10px;border-radius:4px;transition:width .1s linear}
#toppings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px}
.topping-btn{width:54px;height:54px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:1.7rem;cursor:pointer}
.topping-btn:hover{background:rgba(255,255,255,.12)}
#msg{text-align:center;font-weight:700;min-height:24px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Pizza Rush</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">🍕 Served: 0 | Best: 0</div>
    <div id="timer-bar" style="width:100%"></div>
    <div>Order:</div>
    <div id="order"></div>
    <div>Your pizza:</div>
    <div id="pizza"></div>
    <div id="toppings"></div>
    <div id="msg"></div>
  </div>
  <div class="game-instructions">Tap the toppings in the exact order the ticket shows, left to right. Get it right before the timer runs out to serve the pizza — one mistake and you have to start that pizza over!</div>
</div>
<script>
const TOPPINGS=['🍅','🧀','🍄','🫑','🧅','🍍'];
let order,progress,served,timeLeft,timer,orderLen,best=+(localStorage.getItem('pizzarush_best')||0);

function loadBest(){return +(localStorage.getItem('pizzarush_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('pizzarush_best',v);}

function init(){
  served=0;orderLen=3;best=loadBest();
  renderToppings();
  updateUI();
  newOrder();
}

function newOrder(){
  order=Array.from({length:orderLen},()=>TOPPINGS[Math.floor(Math.random()*TOPPINGS.length)]);
  progress=[];
  document.getElementById('order').textContent=order.join(' ');
  document.getElementById('pizza').textContent='🍕';
  document.getElementById('msg').textContent='';
  timeLeft=100;
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft-=1.6;
    document.getElementById('timer-bar').style.width=Math.max(0,timeLeft)+'%';
    if(timeLeft<=0){
      clearInterval(timer);
      flash('⏱ Too slow! Try again.','#ff8a80');
      SFX.fail();
      setTimeout(newOrder,1000);
    }
  },100);
}

function addTopping(t){
  progress.push(t);
  document.getElementById('pizza').textContent='🍕 '+progress.join(' ');
  const idx=progress.length-1;
  if(order[idx]!==t){
    clearInterval(timer);
    flash('❌ Wrong topping!','#ff8a80');
    SFX.error();
    setTimeout(newOrder,1000);
    return;
  }
  SFX.tick();
  if(progress.length===order.length){
    clearInterval(timer);
    served++;
    if(served%3===0)orderLen=Math.min(6,orderLen+1);
    saveBest(served);best=loadBest();
    flash('✅ Served!','#69f0ae');
    SFX.coin();
    updateUI();
    setTimeout(newOrder,900);
  }
}

function flash(txt,color){
  const m=document.getElementById('msg');
  m.textContent=txt;m.style.color=color;
}

function renderToppings(){
  const el=document.getElementById('toppings');
  el.innerHTML='';
  TOPPINGS.forEach(t=>{
    const b=document.createElement('button');
    b.className='topping-btn';
    b.textContent=t;
    b.onclick=()=>addTopping(t);
    el.appendChild(b);
  });
}

function updateUI(){
  document.getElementById('ui').textContent=`🍕 Served: ${served} | Best: ${best}`;
}

init();
</script></body></html>
