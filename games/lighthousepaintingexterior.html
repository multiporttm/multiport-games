<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#5a7fa0;display:block;border-radius:8px}
#score-display{color:#fff176;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
#lives-display{color:#ff7043;font-size:1rem;font-weight:700;text-align:center;padding:0 0 6px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Lighthouse Painting Exterior</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <div id="lives-display">Lives: ♥♥♥</div>
    <canvas id="c" width="800" height="440"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>↑/↓</b> (or <b>drag/swipe</b>) to move the scaffold and hold <b>Space</b> (or <b>tap and hold</b>) to paint the current band the matching color shown on the left. Brace against wind gusts by staying centered — fall off three times and the job is done!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=440;
const HI_KEY='lighthousepaintingexterior_hi';

const PALETTE=['#ffffff','#e53935','#1e88e5','#ffd54f'];

let score=0,hi=parseInt(localStorage.getItem(HI_KEY)||'0',10),lives=3,gameOver=false,started=false,win=false;
let level=1,towerBands=6,bandH=50;
let bandColors=[],bandPainted=[];
let scaffoldY=0;
let windX=0,windTarget=0,windStrength=0.6;
let scaffoldX=0; // offset from center due to wind + correction
let painting=false;
let paintBtnFlash=0;
let lastTime=null;
let keys={};
let shakeT=0;
let fellT=0;
let dragStartY=null;

function setHi(v){hi=v;localStorage.setItem(HI_KEY,String(Math.floor(hi)));}

function towerTop(){ return 60; }
function towerBottom(){ return towerTop()+towerBands*bandH; }

function genBands(){
  bandColors=[];
  bandPainted=[];
  for(let i=0;i<towerBands;i++){
    // never two identical adjacent colors for visual variety, pattern style stripes
    let color;
    do{ color=PALETTE[Math.floor(Math.random()*PALETTE.length)]; }
    while(i>0&&color===bandColors[i-1]);
    bandColors.push(color);
    bandPainted.push(false);
  }
}

function buildLevel(){
  towerBands=5+level;
  bandH=Math.max(28,260/towerBands);
  windStrength=0.5+level*0.18;
  genBands();
  scaffoldY=towerBottom()-bandH/2;
  scaffoldX=0;
  windX=0;windTarget=(Math.random()-0.5)*2;
}

function reset(){
  score=0;lives=3;gameOver=false;started=false;win=false;level=1;
  buildLevel();
  lastTime=null;
}
reset();

function currentBandIdx(){
  const idx=Math.floor((scaffoldY-towerTop())/bandH);
  return Math.max(0,Math.min(towerBands-1,idx));
}

function allPainted(){ return bandPainted.every(Boolean); }

function nextLevel(){
  level++;
  if(level>6){win=true;gameOver=true;SFX.win();if(score>hi)setHi(score);return;}
  buildLevel();
  SFX.levelup();
}

function fallOff(){
  lives--;
  fellT=30;
  shakeT=18;
  SFX.hurt();
  scaffoldX=0;
  if(lives<=0){
    gameOver=true;win=false;SFX.lose();
    if(score>hi)setHi(score);
  }
}

function doPaint(dt){
  const idx=currentBandIdx();
  if(!bandPainted[idx]){
    bandPainted[idx+'_prog']=(bandPainted[idx+'_prog']||0)+0.025*dt;
    if(bandPainted[idx+'_prog']>=1){
      bandPainted[idx]=true;
      score+=25*level;
      SFX.point();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(!started)started=true;
  if(gameOver&&(e.code==='Enter'||e.code==='Space')){reset();return;}
  if(e.code==='ArrowUp'){e.preventDefault();keys.up=true;}
  if(e.code==='ArrowDown'){e.preventDefault();keys.down=true;}
  if(e.code==='ArrowLeft'){e.preventDefault();keys.left=true;}
  if(e.code==='ArrowRight'){e.preventDefault();keys.right=true;}
  if(e.code==='Space'){e.preventDefault();painting=true;}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp')keys.up=false;
  if(e.code==='ArrowDown')keys.down=false;
  if(e.code==='ArrowLeft')keys.left=false;
  if(e.code==='ArrowRight')keys.right=false;
  if(e.code==='Space')painting=false;
});

c.addEventListener('pointerdown',e=>{
  if(!started){started=true;return;}
  if(gameOver){reset();return;}
  const rect=c.getBoundingClientRect();
  dragStartY=(e.clientY-rect.top)*(H/rect.height);
  painting=true;
});
c.addEventListener('pointermove',e=>{
  if(dragStartY==null)return;
  const rect=c.getBoundingClientRect();
  const y=(e.clientY-rect.top)*(H/rect.height);
  const dy=y-dragStartY;
  scaffoldY=Math.max(towerTop()+bandH/2,Math.min(towerBottom()-bandH/2,scaffoldY+dy*0.3));
  dragStartY=y;
});
window.addEventListener('pointerup',()=>{painting=false;dragStartY=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});

function draw(){
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-0.5)*8;sy=(Math.random()-0.5)*4;shakeT--;}
  ctx.save();ctx.translate(sx,sy);

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#78a9c9');sky.addColorStop(1,'#b8d4e8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  const towerX=W/2-70,towerW=140;
  for(let i=0;i<towerBands;i++){
    const by=towerTop()+i*bandH;
    const prog=bandPainted[i]?1:(bandPainted[i+'_prog']||0);
    // base unpainted (grimy grey)
    ctx.fillStyle='#78909c';
    ctx.fillRect(towerX,by,towerW,bandH-2);
    if(prog>0){
      ctx.save();
      ctx.beginPath();
      ctx.rect(towerX,by,towerW*prog,bandH-2);
      ctx.clip();
      ctx.fillStyle=bandColors[i];
      ctx.fillRect(towerX,by,towerW,bandH-2);
      ctx.restore();
    }
    ctx.strokeStyle='#37474f';ctx.lineWidth=1;
    ctx.strokeRect(towerX,by,towerW,bandH-2);
  }

  // target color swatch legend on left for current band
  const idx=currentBandIdx();
  ctx.fillStyle='#263238';
  ctx.fillRect(20,60,90,50);
  ctx.fillStyle=bandColors[idx];
  ctx.fillRect(28,68,74,34);
  ctx.strokeStyle='#fff';ctx.strokeRect(28,68,74,34);
  ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';
  ctx.fillText(I18N.t('paint_target_label','Target color'),65,125);

  // scaffold
  const scafX=W/2+scaffoldX;
  ctx.save();
  ctx.translate(scafX,scaffoldY);
  ctx.fillStyle= fellT>0?'#e53935':'#5d4037';
  ctx.fillRect(-55,-5,110,10);
  ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
  ctx.strokeRect(-55,-5,110,10);
  // ropes
  ctx.strokeStyle='#8d6e63';
  ctx.beginPath();ctx.moveTo(-50,-5);ctx.lineTo(-50,-60);ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,-5);ctx.lineTo(50,-60);ctx.stroke();
  // painter figure
  ctx.fillStyle=painting?'#ffd54f':'#ffcc80';
  ctx.fillRect(-8,-30,16,25);
  ctx.beginPath();ctx.arc(0,-36,8,0,Math.PI*2);ctx.fill();
  if(painting){
    ctx.fillStyle='#8d6e63';
    ctx.fillRect(10,-20,22,6);
  }
  ctx.restore();

  // wind indicator
  ctx.textAlign='left';
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
  ctx.fillText(I18N.t('paint_wind_label','Wind'),640,80);
  ctx.strokeStyle='#333';ctx.strokeRect(640,88,120,16);
  ctx.save();
  ctx.beginPath();ctx.rect(640,88,120,16);ctx.clip();
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(640+60+windX*50-4,88,8,16);
  ctx.restore();
  ctx.strokeStyle='#fff176';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(700,86);ctx.lineTo(700,106);ctx.stroke();

  // HUD
  ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#fff';
  ctx.fillText(I18N.t('paint_level_label','Tower height: {n}').replace('{n}',level),20,30);
  ctx.textAlign='right';
  const painted=bandPainted.filter((v,i)=>v===true).length;
  ctx.fillText(I18N.t('paint_progress_label','Painted: {p}/{t}').replace('{p}',painted).replace('{t}',towerBands),780,30);

  ctx.restore();

  if(!started&&!gameOver){
    ctx.fillStyle='#ffffffcc';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('paint_start_hint','Move with ↑/↓ and hold Space to paint'),400,400);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(win?I18N.t('paint_win_title','TOWER GLEAMS!'):I18N.t('game_over_title','GAME OVER'),400,190);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi)),400,230);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),400,265);
  }

  document.getElementById('score-display').textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',Math.floor(score)).replace('{h}',Math.floor(hi));
  document.getElementById('lives-display').textContent=I18N.t('lives_label','Lives: {l}').replace('{l}','♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)));
}

function loop(){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  if(started&&!gameOver){
    if(keys.up)scaffoldY=Math.max(towerTop()+bandH/2,scaffoldY-2.4*dt);
    if(keys.down)scaffoldY=Math.min(towerBottom()-bandH/2,scaffoldY+2.4*dt);

    // wind gusts: windTarget drifts randomly, windX eases toward it
    if(Math.random()<0.01*dt)windTarget=(Math.random()-0.5)*2;
    windX+=(windTarget-windX)*0.02*dt;

    // player can counter wind with left/right
    let push=0;
    if(keys.left)push-=0.08*dt;
    if(keys.right)push+=0.08*dt;
    scaffoldX+=(windX*windStrength*0.6)*dt+push*20;
    scaffoldX*=0.995;

    if(fellT>0)fellT-=dt;

    if(Math.abs(scaffoldX)>70&&fellT<=0){
      fallOff();
    }

    if(painting&&fellT<=0){
      paintBtnFlash=8;
      doPaint(dt);
    }

    if(allPainted()){
      nextLevel();
    }
    if(score>hi)hi=score;
  }

  draw();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
