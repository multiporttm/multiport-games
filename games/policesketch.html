<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#ps-wrap{background:linear-gradient(135deg,#37474f,#b0bec5);border-radius:14px;padding:16px;max-width:640px;margin:0 auto}
#ps-desc{background:rgba(255,255,255,.92);border-radius:10px;padding:10px 14px;color:#222;font-weight:700;font-size:.95rem;margin-bottom:10px}
#ps-desc b{color:#37474f}
#ps-stats{color:#fff;font-weight:700;font-size:.9rem;margin-bottom:10px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#ps-main{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#ps-canvas-wrap{background:#eceff1;border-radius:10px;padding:8px}
#ps-palette{flex:1;min-width:240px;text-align:left}
.ps-row{margin-bottom:8px}
.ps-row .ps-label{color:#fff;font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ps-opts{display:flex;gap:5px;flex-wrap:wrap}
.ps-opt{padding:6px 10px;border:none;border-radius:16px;background:#16213e;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.ps-opt.sel{background:#ffd54f;color:#222}
.ps-opt.correctf{outline:3px solid #2ecc71}
.ps-opt.wrongf{outline:3px solid #e94560}
#ps-submit{margin-top:10px;padding:10px 24px;background:#e94560;border:none;border-radius:20px;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
#ps-next{margin-top:10px;padding:10px 24px;background:#2ecc71;border:none;border-radius:20px;color:#222;font-weight:800;cursor:pointer;font-size:1rem;display:none}
#ps-result{color:#fff;font-weight:900;font-size:1.05rem;margin-top:8px;min-height:1.4em;text-shadow:0 1px 3px rgba(0,0,0,.4)}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Police Sketch</div>
  <div class="game-frame" style="padding:16px">
    <div id="ps-wrap">
      <div id="ps-stats"><span id="ps-count">Sketches: 0</span><span id="ps-best">Best Accuracy: 0%</span></div>
      <div id="ps-desc">Witness says: <b id="ps-desc-text">...</b></div>
      <div id="ps-main">
        <div id="ps-canvas-wrap"><canvas id="ps-canvas" width="220" height="260"></canvas></div>
        <div id="ps-palette"></div>
      </div>
      <div style="text-align:center">
        <button id="ps-submit">Submit Sketch</button>
        <button id="ps-next">Next Witness</button>
        <div id="ps-result"></div>
      </div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Read the <b>witness description</b>, then click through the <b>face shape, hair, eyebrows, eyes and mouth</b> options to build a matching sketch. Click <b>Submit Sketch</b> to check your accuracy against the suspect, then move on to the next witness.</div>
</div>
<script>
const FEATURES={
  face:{label:'Face Shape',opts:['round','oval','square']},
  hair:{label:'Hair',opts:['bald','short','long','curly']},
  brows:{label:'Eyebrows',opts:['thin','thick','arched']},
  eyes:{label:'Eyes',opts:['small','round','narrow']},
  mouth:{label:'Mouth',opts:['small','wide','frown']}
};
const KEYS=Object.keys(FEATURES);
let target={},current={},count=0,best=0,submitted=false;
best=parseInt(localStorage.getItem('ps_best')||'0',10);

const cv=document.getElementById('ps-canvas'),ctx=cv.getContext('2d');
const CX=110,CY=140;

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function newRound(){
  submitted=false;
  target={};current={};
  KEYS.forEach(k=>{ target[k]=pick(FEATURES[k].opts); current[k]=FEATURES[k].opts[0]; });
  document.getElementById('ps-desc-text').textContent=describe(target);
  document.getElementById('ps-result').textContent='';
  document.getElementById('ps-submit').style.display='inline-block';
  document.getElementById('ps-next').style.display='none';
  renderPalette();
  draw();
}

function describe(t){
  const parts=[
    t.face+' face', t.hair==='bald'?'bald head':t.hair+' hair',
    t.brows+' eyebrows', t.eyes+' eyes', t.mouth+' mouth'
  ];
  return parts.join(', ')+'.';
}

function renderPalette(){
  const wrap=document.getElementById('ps-palette');
  wrap.innerHTML='';
  KEYS.forEach(k=>{
    const row=document.createElement('div');
    row.className='ps-row';
    const lbl=document.createElement('div');
    lbl.className='ps-label';lbl.textContent=FEATURES[k].label;
    row.appendChild(lbl);
    const optsWrap=document.createElement('div');
    optsWrap.className='ps-opts';
    optsWrap.id='ps-opts-'+k;
    FEATURES[k].opts.forEach(o=>{
      const b=document.createElement('button');
      b.className='ps-opt'+(current[k]===o?' sel':'');
      b.textContent=o;
      b.onclick=()=>{ if(submitted)return; current[k]=o; SFX.select(); renderPalette(); draw(); };
      optsWrap.appendChild(b);
    });
    row.appendChild(optsWrap);
    wrap.appendChild(row);
  });
}

function draw(){
  ctx.clearRect(0,0,220,260);
  ctx.fillStyle='#eceff1';ctx.fillRect(0,0,220,260);
  // neck/shoulders
  ctx.fillStyle='#e0b090';
  ctx.fillRect(CX-30,CY+90,60,50);
  // face shape
  ctx.fillStyle='#f2c9a0';
  ctx.beginPath();
  if(current.face==='round'){ ctx.ellipse(CX,CY,55,60,0,0,Math.PI*2); }
  else if(current.face==='oval'){ ctx.ellipse(CX,CY,46,66,0,0,Math.PI*2); }
  else { ctx.rect(CX-50,CY-55,100,110); }
  ctx.fill();
  ctx.strokeStyle='#c99b6f';ctx.lineWidth=2;ctx.stroke();
  // eyebrows
  ctx.strokeStyle='#3e2723';
  if(current.brows==='thin'){ ctx.lineWidth=2; drawBrowLines(); }
  else if(current.brows==='thick'){ ctx.lineWidth=6; drawBrowLines(); }
  else { ctx.lineWidth=3; ctx.beginPath(); ctx.arc(CX-22,CY-15,12,Math.PI,Math.PI*1.8); ctx.stroke();
         ctx.beginPath(); ctx.arc(CX+22,CY-15,12,Math.PI*1.2,Math.PI*2); ctx.stroke(); }
  function drawBrowLines(){
    ctx.beginPath();ctx.moveTo(CX-32,CY-16);ctx.lineTo(CX-10,CY-18);ctx.stroke();
    ctx.beginPath();ctx.moveTo(CX+10,CY-18);ctx.lineTo(CX+32,CY-16);ctx.stroke();
  }
  // eyes
  ctx.fillStyle='#222';
  if(current.eyes==='small'){ ctx.beginPath();ctx.arc(CX-20,CY-2,3,0,Math.PI*2);ctx.arc(CX+20,CY-2,3,0,Math.PI*2);ctx.fill(); }
  else if(current.eyes==='round'){ ctx.beginPath();ctx.arc(CX-20,CY-2,7,0,Math.PI*2);ctx.arc(CX+20,CY-2,7,0,Math.PI*2);ctx.fill(); }
  else { ctx.save(); ctx.translate(CX-20,CY-2); ctx.scale(1.6,0.6); ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill(); ctx.restore();
         ctx.save(); ctx.translate(CX+20,CY-2); ctx.scale(1.6,0.6); ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  // nose
  ctx.strokeStyle='#c99b6f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX-4,CY+16);ctx.lineTo(CX+4,CY+16);ctx.stroke();
  // mouth
  ctx.strokeStyle='#a33';ctx.lineWidth=3;
  ctx.beginPath();
  if(current.mouth==='small'){ ctx.moveTo(CX-8,CY+34);ctx.lineTo(CX+8,CY+34); }
  else if(current.mouth==='wide'){ ctx.arc(CX,CY+30,16,0.15*Math.PI,0.85*Math.PI); }
  else { ctx.arc(CX,CY+46,16,1.15*Math.PI,1.85*Math.PI); }
  ctx.stroke();
  // hair
  ctx.fillStyle='#3e2723';
  if(current.hair==='short'){
    ctx.beginPath();ctx.arc(CX,CY-30,58,Math.PI,Math.PI*2);ctx.fill();
  } else if(current.hair==='long'){
    ctx.beginPath();ctx.arc(CX,CY-30,58,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillRect(CX-58,CY-30,16,90);
    ctx.fillRect(CX+42,CY-30,16,90);
  } else if(current.hair==='curly'){
    ctx.beginPath();ctx.arc(CX,CY-30,58,Math.PI,Math.PI*2);ctx.fill();
    for(let i=-2;i<=2;i++){ ctx.beginPath();ctx.arc(CX+i*22,CY-58,14,0,Math.PI*2);ctx.fill(); }
  }
}

function submitSketch(){
  if(submitted)return;
  submitted=true;
  let matches=0;
  KEYS.forEach(k=>{
    const optsWrap=document.getElementById('ps-opts-'+k);
    optsWrap.querySelectorAll('.ps-opt').forEach(b=>{
      if(b.textContent===target[k])b.classList.add('correctf');
      if(b.textContent===current[k]&&current[k]!==target[k])b.classList.add('wrongf');
    });
    if(current[k]===target[k])matches++;
  });
  const accuracy=Math.round(matches/KEYS.length*100);
  count++;
  if(accuracy>best){best=accuracy;localStorage.setItem('ps_best',best);}
  document.getElementById('ps-count').textContent=I18N.t('ps_count_label','Sketches: {c}').replace('{c}',count);
  document.getElementById('ps-best').textContent=I18N.t('ps_best_label','Best Accuracy: {b}%').replace('{b}',best);
  document.getElementById('ps-result').textContent=I18N.t('ps_result_label','Match: {m}/{t} features — {a}% accuracy').replace('{m}',matches).replace('{t}',KEYS.length).replace('{a}',accuracy);
  document.getElementById('ps-submit').style.display='none';
  document.getElementById('ps-next').style.display='inline-block';
  if(accuracy===100)SFX.win(); else if(accuracy>=60)SFX.success(); else SFX.fail();
}

document.getElementById('ps-submit').addEventListener('click',submitSketch);
document.getElementById('ps-next').addEventListener('click',newRound);
newRound();
</script></body></html>
