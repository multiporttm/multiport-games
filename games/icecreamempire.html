<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#fce4ec;cursor:pointer}
#ui{color:#f48fb1;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Ice Cream Empire</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Coins: 0 | Served: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions">Each customer's order shows a stack of scoop flavors. Tap the matching flavor buttons at the bottom in order, bottom-to-top, then tap the cone to serve before the patience bar runs out!</div>
</div>
<script>
const W=360,H=360;
const FLAVORS=[{e:'🍦',c:'#fff'},{e:'🍫',c:'#795548'},{e:'🍓',c:'#f06292'},{e:'🍋',c:'#fff176'},{e:'🍇',c:'#ba68c8'}];
let order,progress,coins,served,maxTime,timeLeft,state;

function loadBest(){return +(localStorage.getItem('icecreamempire_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('icecreamempire_best',v);}

function init(){coins=0;served=0;state='play';newOrder();}

function newOrder(){
  const len=2+Math.min(3,Math.floor(served/3));
  order=[];
  for(let i=0;i<len;i++)order.push(Math.floor(Math.random()*FLAVORS.length));
  progress=0;
  maxTime=5+len*1.5;
  timeLeft=maxTime;
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
const BTN_Y=H-70,BTN_W=W/FLAVORS.length;

c.addEventListener('click',e=>{
  if(state==='over'){init();return;}
  const rect=c.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width),y=(e.clientY-rect.top)*(H/rect.height);
  if(y<BTN_Y)return;
  const idx=Math.floor(x/BTN_W);
  if(idx<0||idx>=FLAVORS.length)return;
  if(idx===order[progress]){
    progress++;
    if(progress>=order.length){
      coins+=8+order.length*2;served++;
      saveBest(coins);
      newOrder();
    }
  }else{
    coins=Math.max(0,coins-2);
    newOrder();
  }
  updateUI();
});

function update(){
  if(state!=='play')return;
  timeLeft-=1/60;
  if(timeLeft<=0){newOrder();}
}

function draw(){
  ctx.fillStyle='#fce4ec';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#333';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText('Customer wants:',W/2,26);

  const coneX=W/2,coneBottomY=170;
  ctx.font='34px Arial';ctx.fillText('🍦',coneX,coneBottomY+20);
  for(let i=0;i<order.length;i++){
    ctx.globalAlpha=i<progress?0.25:1;
    ctx.font='28px Arial';
    ctx.fillText(FLAVORS[order[i]].e,coneX,coneBottomY-i*26);
  }
  ctx.globalAlpha=1;

  ctx.fillStyle='#ddd';ctx.fillRect(20,90,W-40,12);
  ctx.fillStyle='#f06292';ctx.fillRect(20,90,(W-40)*Math.max(0,timeLeft/maxTime),12);

  FLAVORS.forEach((f,i)=>{
    const x=i*BTN_W;
    ctx.fillStyle='#fff';
    ctx.fillRect(x+3,BTN_Y,BTN_W-6,60);
    ctx.strokeStyle='#f48fb1';ctx.strokeRect(x+3,BTN_Y,BTN_W-6,60);
    ctx.font='28px Arial';
    ctx.fillText(f.e,x+BTN_W/2,BTN_Y+32);
  });

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f48fb1';ctx.font='bold 26px Arial';
    ctx.fillText('SHOP CLOSED',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Coins: ${coins} | Best: ${loadBest()}`,W/2,H/2+12);
    ctx.fillText('Tap to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Coins: ${coins} | Served: ${served}`;
}

init();draw();
</script></body></html>
