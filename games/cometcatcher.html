<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Comet Catcher</title><meta name="description" content="Play Comet Catcher free online — Move your catcher with Arrow Keys, A/D, or by dragging/tapping to catch glowing comets for points. Avoid the red meteor fragments — they cost lives! Comets fall faster and thicker as your score climbs."><link rel="canonical" href="https://games.multiportllc.com/games/cometcatcher"><meta property="og:title" content="Comet Catcher - Multiport Games"><meta property="og:description" content="Play Comet Catcher free online — Move your catcher with Arrow Keys, A/D, or by dragging/tapping to catch glowing comets for points. Avoid the red meteor fragments — they cost lives! Comets fall faster and thicker as your score climbs."><meta property="og:url" content="https://games.multiportllc.com/games/cometcatcher"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Comet Catcher","description":"Play Comet Catcher free online instantly. Move your catcher with Arrow Keys, A/D, or by dragging/tapping to catch glowing comets for points. Avoid the red meteor fragments — they cost lives! Comets fall faster and thicker as your score climbs. No download or signup required.","genre":"Arcade","url":"https://games.multiportllc.com/games/cometcatcher","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#05050f}
#c{background:#0a0a20;display:block;border-radius:8px;touch-action:none}
#hud{display:flex;justify-content:center;gap:22px;color:#cfd6ff;font-size:1.1rem;font-weight:700;padding:8px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
#lives{color:#ff6b6b}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Comet Catcher</div>
  <div class="game-frame">
    <div id="hud">
      <span id="score-display">Score: <b>0</b></span>
      <span id="hi-display">Best: <b>0</b></span>
      <span id="lives">❤❤❤</span>
    </div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Move your catcher with <b>Arrow Keys</b>, <b>A/D</b>, or by <b>dragging/tapping</b> to catch glowing comets for points. Avoid the red meteor fragments — they cost lives! Comets fall faster and thicker as your score climbs.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
const BEST_KEY='cometcatcher_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10);

const catcher={x:W/2,w:90,h:18,y:H-36,speed:9};
let keys={left:false,right:false};
let dragTargetX=null;

let objects=[];
let score=0,lives=3,gameOver=false,started=false,spawnTimer=0,elapsed=0;

function reset(){
  objects=[];score=0;lives=3;gameOver=false;started=false;spawnTimer=0;elapsed=0;
  catcher.x=W/2;dragTargetX=null;
  updateHud();
}

function updateHud(){
  document.getElementById('score-display').innerHTML=I18N.t('score_label','Score: <b>{s}</b>').replace('{s}',score);
  document.getElementById('hi-display').innerHTML=I18N.t('best_label','Best: <b>{h}</b>').replace('{h}',best);
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
}

function startIfNeeded(){
  if(!started){started=true;}
  if(gameOver){reset();started=true;}
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;startIfNeeded();e.preventDefault();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;startIfNeeded();e.preventDefault();}
  if(e.code==='Space'&&gameOver){startIfNeeded();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});

function pointerToX(clientX){
  const rect=c.getBoundingClientRect();
  return (clientX-rect.left)*(W/rect.width);
}
c.addEventListener('pointerdown',e=>{startIfNeeded();dragTargetX=pointerToX(e.clientX);});
c.addEventListener('pointermove',e=>{if(e.buttons>0||e.pointerType==='touch')dragTargetX=pointerToX(e.clientX);});
c.addEventListener('touchstart',e=>{e.preventDefault();startIfNeeded();dragTargetX=pointerToX(e.touches[0].clientX);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();dragTargetX=pointerToX(e.touches[0].clientX);},{passive:false});

const COMET_COLORS=[['#7ec8ff','#e6f7ff'],['#ffd54f','#fff4d0'],['#c084fc','#f3e0ff']];

function spawnObject(){
  const hazardChance=Math.min(0.42,0.16+elapsed/9000);
  const isHazard=Math.random()<hazardChance;
  const size=isHazard?18+Math.random()*10:14+Math.random()*10;
  const speed=(isHazard?2.6:2.0)+Math.random()*1.6+elapsed/6000;
  const drift=(Math.random()-0.5)*1.6;
  const value=isHazard?0:(size<19?10:(size<24?20:30));
  objects.push({
    x:40+Math.random()*(W-80),y:-30,size,speed,drift,hazard:isHazard,
    color:COMET_COLORS[Math.floor(Math.random()*COMET_COLORS.length)],value,
    tail:Math.random()*Math.PI*2
  });
}

function drawStarfield(){
  ctx.fillStyle='#05051a';
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){
    const sx=(i*137)%W, sy=(i*911+Math.floor(elapsed/40))%H;
    ctx.fillStyle=i%5===0?'#ffffff55':'#ffffff22';
    ctx.fillRect(sx,sy,2,2);
  }
}

function drawCatcher(){
  ctx.save();
  ctx.translate(catcher.x,catcher.y);
  const grad=ctx.createLinearGradient(-catcher.w/2,0,catcher.w/2,0);
  grad.addColorStop(0,'#4facfe');grad.addColorStop(1,'#00f2fe');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(-catcher.w/2,0);
  ctx.quadraticCurveTo(0,catcher.h*1.6,catcher.w/2,0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#e0f7ff';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function drawObject(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  if(o.hazard){
    ctx.rotate(o.tail);
    ctx.fillStyle='#8b2e2e';
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const ang=i/6*Math.PI*2;
      const r=o.size*(i%2===0?1:0.6);
      ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
    }
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;ctx.stroke();
  }else{
    // tail
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=o.color[0];
    ctx.lineWidth=o.size*0.5;
    ctx.beginPath();
    ctx.moveTo(0,-o.size*2.2-o.drift*3);
    ctx.lineTo(0,-o.size*0.6);
    ctx.stroke();
    ctx.globalAlpha=1;
    const g=ctx.createRadialGradient(0,0,1,0,0,o.size);
    g.addColorStop(0,o.color[1]);g.addColorStop(1,o.color[0]);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,o.size,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function circleRectHit(o){
  const halfW=catcher.w/2;
  const closestX=Math.max(catcher.x-halfW,Math.min(o.x,catcher.x+halfW));
  const closestY=Math.max(catcher.y,Math.min(o.y,catcher.y+catcher.h));
  const dx=o.x-closestX,dy=o.y-closestY;
  return (dx*dx+dy*dy)<(o.size*o.size*0.7);
}

let lastTime=null;
function loop(t){
  const now=performance.now();
  const dt=lastTime===null?1:Math.min((now-lastTime)/16.6667,3);
  lastTime=now;

  drawStarfield();

  if(!started){
    drawCatcher();
    ctx.fillStyle='#cfe8ff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('cc_start','Move / Tap to start catching comets!'),W/2,H/2);
    requestAnimationFrame(loop);return;
  }

  if(gameOver){
    drawCatcher();
    ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('cc_final','Final Score: {s}').replace('{s}',score),W/2,H/2+18);
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+48);
    requestAnimationFrame(loop);return;
  }

  elapsed+=dt*16.6667;

  // Movement
  if(dragTargetX!==null){
    catcher.x+=(dragTargetX-catcher.x)*0.25*dt;
  }
  if(keys.left)catcher.x-=catcher.speed*dt;
  if(keys.right)catcher.x+=catcher.speed*dt;
  catcher.x=Math.max(catcher.w/2,Math.min(W-catcher.w/2,catcher.x));

  // Spawn
  spawnTimer+=dt;
  const interval=Math.max(14,32-elapsed/2200);
  if(spawnTimer>=interval){spawnTimer=0;spawnObject();}

  // Update objects
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.y+=o.speed*dt;
    o.x+=o.drift*dt;
    o.tail+=0.05*dt;
    drawObject(o);
    if(circleRectHit(o)){
      objects.splice(i,1);
      if(o.hazard){lives--;SFX.hit();}
      else{score+=o.value;SFX.catch();if(score>best){best=score;localStorage.setItem(BEST_KEY,String(best));}}
      updateHud();
      if(lives<=0){gameOver=true;SFX.lose();}
      continue;
    }
    if(o.y>H+40){
      if(!o.hazard){lives--;updateHud();if(lives<=0){gameOver=true;SFX.lose();}}
      objects.splice(i,1);
    }
  }

  drawCatcher();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script></body></html>
