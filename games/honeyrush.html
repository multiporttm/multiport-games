<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#2e7d32}
#ui{color:#ffd54f;text-align:center;padding:8px;font-size:1.05rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Honey Rush</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">🍯 Honey: 0 | 🌸 Pollen: 0/5 | ⏱ 60s</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Arrow keys / WASD (or the D-pad on mobile) to fly. Land on flowers 🌸 to collect pollen (max 5 at a time), then return to the hive 🏠 to turn it into honey. Collect as much honey as you can in 60 seconds!</div>
</div>
<script>
const W=360,H=360,SIZE=24,CAP=5,TIME=60;
const hive={x:W/2,y:H/2};
let player,flowers,pollen,honey,timeLeft,keys={},best=+(localStorage.getItem('honeyrush_best')||0),active;

function loadBest(){return +(localStorage.getItem('honeyrush_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('honeyrush_best',v);}

function rand(min,max){return min+Math.random()*(max-min);}

function init(){
  player={x:W/2-60,y:H/2};
  flowers=[];
  for(let i=0;i<6;i++)spawnFlower();
  pollen=0;honey=0;timeLeft=TIME;active=false;best=loadBest();
  updateUI();
}

function spawnFlower(){
  let x,y;
  do{ x=rand(24,W-24); y=rand(24,H-24); }while(Math.hypot(x-hive.x,y-hive.y)<50);
  flowers.push({x,y,available:true,cooldown:0});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(!active&&!timerStarted)startTimer();});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;if(!timerStarted)startTimer();};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});

let timerStarted=false,timerInterval;
function startTimer(){
  timerStarted=true;active=true;
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateUI();
    if(timeLeft<=0){
      active=false;
      clearInterval(timerInterval);
      SFX.lose();
      saveBest(honey);best=loadBest();
      updateUI();
    }
  },1000);
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(!active)return;
  const spd=2.6;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  flowers.forEach(f=>{
    if(!f.available){f.cooldown--;if(f.cooldown<=0)f.available=true;return;}
    if(pollen<CAP&&dist(player,f)<22){
      f.available=false;f.cooldown=50;
      pollen++;
      SFX.tick();
      updateUI();
    }
  });

  if(pollen>0&&dist(player,hive)<28){
    honey+=pollen;
    pollen=0;
    SFX.coin();
    updateUI();
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🏠',hive.x,hive.y);

  flowers.forEach(f=>{
    ctx.globalAlpha=f.available?1:0.25;
    ctx.fillText('🌸',f.x,f.y);
    ctx.globalAlpha=1;
  });

  ctx.font='26px Arial';
  ctx.fillText('🐝',player.x,player.y);
  if(pollen>0){
    ctx.font='12px Arial';ctx.fillStyle='#fff';
    ctx.fillText(pollen,player.x+14,player.y-14);
  }

  if(!active&&timerStarted){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 28px Arial';
    ctx.fillText(I18N.t('times_up_msg',"TIME'S UP!"),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('honey_collected_label','Honey collected: {n}').replace('{n}',honey),W/2,H/2+14);
  } else if(!timerStarted){
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd54f';ctx.font='bold 20px Arial';
    ctx.fillText(I18N.t('move_to_start_msg','Move to start!'),W/2,H/2);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent='🍯 '+I18N.t('honey_pollen_best_label','Honey: {h} | 🌸 Pollen: {p}/{c} | ⏱ {t}s | Best: {b}').replace('{h}',honey).replace('{p}',pollen).replace('{c}',CAP).replace('{t}',Math.max(0,timeLeft)).replace('{b}',best);
}

init();draw();
</script></body></html>
