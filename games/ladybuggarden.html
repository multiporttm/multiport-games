<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#0a1608}
#c{background:#1c3a12;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
#hud{color:#c9e8a0;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:space-between;max-width:800px;margin:0 auto}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ladybug Garden</div>
  <div class="game-frame">
    <div id="hud"><span id="score-display">Eaten: 0</span><span id="plants-display">Plants: 6</span><span id="hi-display">Hi: 0</span></div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b>/<b>WASD</b>, or <b>drag/tap</b> to guide your ladybug across the garden. Fly onto aphids to eat them before they multiply and destroy your plants! Aphids spawn faster as time goes on — protect as many plants as you can!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
let eaten=0,hi=parseInt(localStorage.getItem('ladybuggarden_best')||'0'),gameOver=false,elapsed=0,spawnTimer=0;
const bug={x:W/2,y:H/2,vx:0,vy:0,r:14};
const keys={};
let dragTarget=null;
let plants=[],aphids=[];

function makePlants(){
  plants=[];
  const cols=3,rows=2;
  const marginX=100,marginY=90;
  for(let r=0;r<rows;r++){
    for(let cc=0;cc<cols;cc++){
      plants.push({
        x:marginX+cc*((W-2*marginX)/(cols-1)),
        y:marginY+r*((H-2*marginY)/(rows-1)),
        health:100,alive:true
      });
    }
  }
}

function reset(){
  eaten=0;gameOver=false;elapsed=0;spawnTimer=0;
  bug.x=W/2;bug.y=H/2;bug.vx=0;bug.vy=0;
  aphids=[];
  makePlants();
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
  if(gameOver)reset();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function pointerPos(e){
  const r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}
let dragging=false;
c.addEventListener('mousedown',e=>{dragging=true;dragTarget=pointerPos(e);if(gameOver)reset();});
c.addEventListener('mousemove',e=>{if(dragging)dragTarget=pointerPos(e);});
window.addEventListener('mouseup',()=>{dragging=false;dragTarget=null;});
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;dragTarget=pointerPos(e);if(gameOver)reset();},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)dragTarget=pointerPos(e);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();dragging=false;dragTarget=null;},{passive:false});

function spawnAphid(){
  const alivePlants=plants.filter(p=>p.alive);
  if(!alivePlants.length)return;
  const p=alivePlants[Math.floor(Math.random()*alivePlants.length)];
  const ang=Math.random()*Math.PI*2;
  aphids.push({x:p.x+Math.cos(ang)*30,y:p.y+Math.sin(ang)*30,target:p,r:6});
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(dt){
  if(gameOver)return;
  elapsed+=dt/60;
  let ax=0,ay=0;
  const speed=0.6;
  if(keys['arrowleft']||keys['a'])ax-=speed;
  if(keys['arrowright']||keys['d'])ax+=speed;
  if(keys['arrowup']||keys['w'])ay-=speed;
  if(keys['arrowdown']||keys['s'])ay+=speed;
  if(dragTarget){
    const dx=dragTarget.x-bug.x,dy=dragTarget.y-bug.y;
    const d=Math.hypot(dx,dy);
    if(d>4){ax+=(dx/d)*speed*1.6;ay+=(dy/d)*speed*1.6;}
  }
  bug.vx=(bug.vx+ax)*0.85;
  bug.vy=(bug.vy+ay)*0.85;
  bug.vx=Math.max(-7,Math.min(7,bug.vx));
  bug.vy=Math.max(-7,Math.min(7,bug.vy));
  bug.x=Math.max(bug.r,Math.min(W-bug.r,bug.x+bug.vx*dt));
  bug.y=Math.max(bug.r,Math.min(H-bug.r,bug.y+bug.vy*dt));

  // spawn aphids, ramps up over time
  spawnTimer+=dt;
  const interval=Math.max(18,60-elapsed*2.2);
  if(spawnTimer>=interval){spawnTimer=0;spawnAphid();}

  // aphid behavior: crawl toward/around their target plant, damage it over time
  for(const a of aphids){
    if(!a.target.alive){a.dead=true;continue;}
    const dx=a.target.x-a.x,dy=a.target.y-a.y;
    const d=Math.hypot(dx,dy)||1;
    if(d>26){a.x+=(dx/d)*0.5*dt;a.y+=(dy/d)*0.5*dt;}
    else {
      a.target.health-=0.09*dt;
      if(a.target.health<=0&&a.target.alive){
        a.target.alive=false;
        SFX.hurt();
      }
    }
    // eaten check
    if(dist(bug,a)<bug.r+a.r){
      a.dead=true;
      eaten++;
      SFX.catch();
    }
    // random multiply
    if(Math.random()<0.0009*dt*(1+elapsed*0.03)){
      aphids.push({x:a.x+(Math.random()-0.5)*20,y:a.y+(Math.random()-0.5)*20,target:a.target,r:6});
    }
  }
  aphids=aphids.filter(a=>!a.dead);

  const plantsAlive=plants.filter(p=>p.alive).length;
  if(plantsAlive===0){
    gameOver=true;
    SFX.lose();
    if(eaten>hi){hi=eaten;localStorage.setItem('ladybuggarden_best',String(hi));}
  }
}

function drawPlant(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  const scale=p.alive?0.5+0.5*(p.health/100):0.25;
  ctx.fillStyle=p.alive?'#3d8b1f':'#5c4a2e';
  ctx.beginPath();ctx.ellipse(0,10,26*scale,10*scale,0,0,Math.PI*2);ctx.fill();
  const leafColor=p.alive?'#4caf50':'#7a6a4a';
  for(let i=0;i<5;i++){
    const ang=(i/5)*Math.PI*2;
    ctx.fillStyle=leafColor;
    ctx.beginPath();
    ctx.ellipse(Math.cos(ang)*14*scale,Math.sin(ang)*10*scale-6*scale,12*scale,6*scale,ang,0,Math.PI*2);
    ctx.fill();
  }
  if(p.alive){
    ctx.fillStyle='#ff6b9d';
    ctx.beginPath();ctx.arc(0,-8*scale,6*scale,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // health bar
  if(p.alive){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(p.x-20,p.y+28,40,5);
    ctx.fillStyle=p.health>40?'#8bc34a':'#ef5350';
    ctx.fillRect(p.x-20,p.y+28,40*(p.health/100),5);
  }
}

function drawAphid(a){
  ctx.fillStyle='#8bc34a';
  ctx.beginPath();ctx.ellipse(a.x,a.y,a.r,a.r*0.75,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#558b2f';
  ctx.beginPath();ctx.arc(a.x-2,a.y-2,1.5,0,Math.PI*2);ctx.fill();
}

function drawLadybug(){
  ctx.save();
  ctx.translate(bug.x,bug.y);
  const ang=Math.atan2(bug.vy,bug.vx);
  if(Math.hypot(bug.vx,bug.vy)>0.5)ctx.rotate(ang);
  ctx.fillStyle='#e53935';
  ctx.beginPath();ctx.ellipse(0,0,bug.r,bug.r*0.8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,-bug.r*0.8);ctx.lineTo(0,bug.r*0.8);ctx.stroke();
  ctx.fillStyle='#1a1a1a';
  [[-5,-5],[5,-5],[-6,3],[6,3],[-3,7],[3,7]].forEach(([dx,dy])=>{
    ctx.beginPath();ctx.arc(dx,dy,2,0,Math.PI*2);ctx.fill();
  });
  ctx.beginPath();ctx.arc(bug.r*0.85,0,bug.r*0.35,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2e5a1a');bg.addColorStop(1,'#1c3a12');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<40;i++){
    const gx=(i*53)%W,gy=(i*97)%H;
    ctx.fillRect(gx,gy,2,2);
  }

  for(const p of plants)drawPlant(p);
  for(const a of aphids)drawAphid(a);
  drawLadybug();

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('garden_lost_title','GARDEN LOST'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint4','Tap, click or press any key to replant'),W/2,H/2+20);
  }

  const plantsAlive=plants.filter(p=>p.alive).length;
  document.getElementById('score-display').textContent=I18N.t('eaten_label','Eaten: {n}').replace('{n}',eaten);
  document.getElementById('plants-display').textContent=I18N.t('plants_label','Plants: {n}').replace('{n}',plantsAlive);
  document.getElementById('hi-display').textContent=I18N.t('hi_label4','Hi: {h}').replace('{h}',hi);
}

let last=null;
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/16.6667,3);
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script></body></html>
