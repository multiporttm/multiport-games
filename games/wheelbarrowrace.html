<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8d6e63;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ffb74d;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
#balance-wrap{max-width:800px;margin:0 auto 6px;background:#222;border-radius:8px;height:14px;overflow:hidden;position:relative}
#balance-fill{position:absolute;top:0;left:50%;height:100%;width:2px;background:#4caf50;transition:left .05s linear}
#balance-mid{position:absolute;top:0;left:50%;width:2px;height:100%;background:#fff;opacity:.4}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Wheelbarrow Race</div>
  <div class="game-frame">
    <div id="score-display">Wins: 0 | Best Time: --</div>
    <div id="balance-wrap"><div id="balance-mid"></div><div id="balance-fill"></div></div>
    <canvas id="c" width="800" height="300"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left Arrow</b> / <b>Right Arrow</b> (or tap the left/right halves of the screen) to push your wheelbarrow forward. Keep a steady rhythm over the bumps — pushing too erratically tips you over! Beat the AI racers to the finish line.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=300;
const TRACK_LEN=4000;
let wins=parseInt(localStorage.getItem('wbr_wins')||'0',10);
let bestTime=parseFloat(localStorage.getItem('wbr_best')||'0')||null;

let player,ais,terrain,gameOver,winnerText,started,startTime,elapsed,lastPush,leftDown,rightDown;

function genTerrain(){
  const bumps=[];
  for(let x=0;x<TRACK_LEN+200;x+=40+Math.random()*40){
    bumps.push({x,h:Math.random()*14});
  }
  return bumps;
}

function bumpAt(terrainArr,x){
  // simple lookup of nearest bump height for a smooth-ish bumpy ground
  let h=0;
  for(const b of terrainArr){
    if(Math.abs(b.x-x)<40){h=Math.max(h,b.h*(1-Math.abs(b.x-x)/40));}
  }
  return h;
}

function reset(){
  player={dist:0,speed:0,balance:0,tipped:false,tipTimer:0,lastSide:null};
  ais=[
    {dist:0,speed:1.0,name:'AI 1',color:'#ef5350'},
    {dist:0,speed:0.95,name:'AI 2',color:'#ab47bc'}
  ];
  terrain=genTerrain();
  gameOver=false;winnerText=null;started=false;startTime=null;elapsed=0;
  lastPush=null;leftDown=false;rightDown=false;
}
reset();

function push(side){
  if(gameOver){reset();return;}
  if(!started){started=true;startTime=performance.now();}
  if(player.tipped)return;
  if(lastPush===side){
    // pushing same side repeatedly is bad rhythm -> hurts balance & barely moves
    player.balance+=side==='left'?-8:8;
    SFX.error();
  }else{
    player.speed=Math.min(3.2,player.speed+0.55);
    player.balance+=side==='left'?-3:3;
    SFX.click();
  }
  lastPush=side;
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'){e.preventDefault();if(!leftDown){leftDown=true;push('left');}}
  else if(k==='arrowright'){e.preventDefault();if(!rightDown){rightDown=true;push('right');}}
  else if((k===' '||k==='enter')&&gameOver){reset();}
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft')leftDown=false;
  if(k==='arrowright')rightDown=false;
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  for(const t of e.changedTouches){
    const x=(t.clientX-r.left)*(W/r.width);
    push(x<W/2?'left':'right');
  }
},{passive:false});
c.addEventListener('click',e=>{
  if(gameOver){reset();return;}
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  push(x<W/2?'left':'right');
});

function updateScoreDisplay(){
  document.getElementById('score-display').textContent=
    I18N.t('wbr_score','Wins: {w} | Best Time: {t}')
      .replace('{w}',wins)
      .replace('{t}',bestTime?bestTime.toFixed(1)+'s':'--');
}

function updateBalanceBar(){
  const fill=document.getElementById('balance-fill');
  const pct=Math.max(-100,Math.min(100,player.balance));
  fill.style.left=(50+pct/2)+'%';
  fill.style.background=Math.abs(pct)>60?'#e53935':(Math.abs(pct)>30?'#fbc02d':'#4caf50');
}

function stepPlayer(dt){
  if(player.tipped){
    player.tipTimer-=dt;
    if(player.tipTimer<=0){player.tipped=false;player.balance=0;player.speed=0;}
    return;
  }
  // bumps push balance around based on terrain slope under the wheel
  const bh=bumpAt(terrain,player.dist);
  player.balance+=(bh-7)*0.08*dt;
  // natural balance decay toward center
  player.balance*=0.985;
  // friction / speed decay
  player.speed*=0.965;
  player.dist+=player.speed*dt*1.6;
  if(Math.abs(player.balance)>=85&&!player.tipped){
    player.tipped=true;player.tipTimer=70;player.speed=0;
    SFX.fail();
  }
}

function stepAI(ai,dt){
  ai.speed+=(Math.random()-0.48)*0.06;
  ai.speed=Math.max(0.7,Math.min(1.6,ai.speed));
  ai.dist+=ai.speed*dt*1.6;
}

function finishCheck(){
  const finishers=[{who:'player',dist:player.dist},...ais.map(a=>({who:a.name,dist:a.dist}))];
  const anyFinished=finishers.some(f=>f.dist>=TRACK_LEN);
  if(!anyFinished)return;
  gameOver=true;
  finishers.sort((a,b)=>b.dist-a.dist);
  const place=finishers.findIndex(f=>f.who==='player');
  elapsed=(performance.now()-startTime)/1000;
  if(place===0){
    winnerText=I18N.t('wbr_win','YOU WIN THE RACE!');
    wins++;localStorage.setItem('wbr_wins',wins);
    if(!bestTime||elapsed<bestTime){bestTime=elapsed;localStorage.setItem('wbr_best',bestTime);}
    SFX.win();
  }else{
    winnerText=I18N.t('wbr_loss','You finished {p}',).replace('{p}',(place+1)+(place===1?'nd':'rd'));
    SFX.lose();
  }
}

function drawRacer(x,y,color,tipped){
  ctx.save();
  ctx.translate(x,y);
  if(tipped)ctx.rotate(Math.PI/2.2);
  // person
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();ctx.arc(0,-38,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;
  ctx.fillRect(-8,-30,16,24);
  ctx.strokeStyle=color;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(-16,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-6);ctx.lineTo(16,10);ctx.stroke();
  // wheelbarrow
  ctx.strokeStyle='#5d4037';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-16,10);ctx.lineTo(-34,18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,10);ctx.lineTo(-6,18);ctx.stroke();
  ctx.fillStyle='#8d6e63';
  ctx.beginPath();
  ctx.moveTo(-42,18);ctx.lineTo(-2,18);ctx.lineTo(-10,2);ctx.lineTo(-34,2);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-42,22,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function loop(ts){
  if(!loop.last)loop.last=ts;
  const dt=Math.min(3,(ts-loop.last)/16.6667);
  loop.last=ts;

  ctx.clearRect(0,0,W,H);
  // sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#90caf9');sky.addColorStop(1,'#c8e6c9');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.7);
  ctx.fillStyle='#8d6e63';ctx.fillRect(0,H*0.7,W,H*0.3);
  ctx.fillStyle='#6d4c41';ctx.fillRect(0,H*0.7,W,4);

  if(started&&!gameOver){
    stepPlayer(dt);
    ais.forEach(a=>stepAI(a,dt));
    finishCheck();
  }

  // camera follows player
  const camX=player.dist-150;
  // finish line marker
  const finishScreenX=TRACK_LEN-camX;
  if(finishScreenX>-40&&finishScreenX<W+40){
    ctx.fillStyle='#fff';
    for(let i=0;i<8;i++){
      ctx.fillStyle=i%2===0?'#222':'#fff';
      ctx.fillRect(finishScreenX,H*0.7-i*10,14,10);
    }
  }

  drawRacer(150,H*0.7-4,'#4fc3f7',player.tipped);
  ais.forEach((a,i)=>{
    const sx=a.dist-camX;
    if(sx>-60&&sx<W+60)drawRacer(sx,H*0.7-4-i*0,a.color,false);
  });

  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,10,200,28);
  ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
  const dist_m=Math.max(0,Math.floor((TRACK_LEN-player.dist)/10));
  ctx.fillText(I18N.t('wbr_remaining','{d}m to go').replace('{d}',dist_m),18,30);

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wbr_start','Alternate arrow keys / tap to start pushing!'),W/2,H/2);
  }

  if(player.tipped){
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('wbr_tipped','TIPPED OVER! Recovering...'),W/2,60);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText(winnerText,W/2,H/2-20);
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('wbr_time','Time: {t}s').replace('{t}',elapsed.toFixed(1)),W/2,H/2+14);
    ctx.fillText(I18N.t('restart_hint2','Tap, click, or press Space to play again'),W/2,H/2+44);
  }

  updateBalanceBar();
  updateScoreDisplay();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
