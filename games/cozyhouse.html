<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Cozy House</title><meta name="description" content="Play Cozy House free online — Decorate rooms to match each order and earn coins to unlock new furniture. How many orders can you complete?"><link rel="canonical" href="https://games.multiportllc.com/games/cozyhouse"><meta property="og:title" content="Cozy House - Multiport Games"><meta property="og:description" content="Play Cozy House free online — Decorate rooms to match each order and earn coins to unlock new furniture. How many orders can you complete?"><meta property="og:url" content="https://games.multiportllc.com/games/cozyhouse"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Cozy House","description":"Play Cozy House free online instantly. Decorate rooms to match each order and earn coins to unlock new furniture. How many orders can you complete? No download or signup required.","genre":"Simulation","url":"https://games.multiportllc.com/games/cozyhouse","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=6">
<style>
body{background:#08080f}
#ui{color:#a5d6a7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#order{text-align:center;color:rgba(255,255,255,.6);font-size:.88rem;padding:4px 16px 10px}
#room{display:grid;grid-template-columns:repeat(5,56px);grid-template-rows:repeat(4,56px);gap:4px;justify-content:center;background:#3e2723;padding:8px;border-radius:12px;margin:0 auto}
.cell{background:rgba(255,255,255,.06);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer}
.cell:hover{background:rgba(255,255,255,.12)}
#palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px}
.item-btn{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.07);border:2px solid transparent;font-size:1.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.item-btn.selected{border-color:#a5d6a7;background:rgba(165,214,167,.2)}
#msg{text-align:center;font-weight:700;min-height:24px}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Cozy House</div>
  <div class="game-frame" style="padding:14px">
    <div id="ui">🪙 0 | Orders completed: 0</div>
    <div id="order"></div>
    <div id="room"></div>
    <div id="palette"></div>
    <div id="msg"></div>
  </div>
  <div class="game-instructions">Pick an item from the palette, then click a cell to place it (click again to remove). Match the order shown above to earn coins and complete it!</div>
</div>
<script>
const ITEMS=[
  {key:'bed',emoji:'🛏️'},
  {key:'plant',emoji:'🪴'},
  {key:'table',emoji:'🪑'},
  {key:'tv',emoji:'📺'},
  {key:'lamp',emoji:'💡'},
  {key:'rug',emoji:'🟫'},
];
const ROWS=4,COLS=5;
let grid,selected,coins,ordersDone,order;

function init(){
  grid=Array(ROWS*COLS).fill(null);
  coins=0;ordersDone=0;selected=ITEMS[0].key;
  newOrder();
  renderPalette();
  renderRoom();
  updateUI();
}

function newOrder(){
  order={};
  const numTypes=2+Math.floor(Math.random()*2);
  const chosen=[...ITEMS].sort(()=>Math.random()-.5).slice(0,numTypes);
  chosen.forEach(it=>{order[it.key]=1+Math.floor(Math.random()*2);});
  document.getElementById('order').textContent='Order: '+Object.entries(order).map(([k,v])=>`${v}× ${ITEMS.find(i=>i.key===k).emoji}`).join('   ');
  document.getElementById('msg').textContent='';
}

function renderPalette(){
  const el=document.getElementById('palette');
  el.innerHTML='';
  ITEMS.forEach(it=>{
    const b=document.createElement('div');
    b.className='item-btn'+(selected===it.key?' selected':'');
    b.textContent=it.emoji;
    b.onclick=()=>{selected=it.key;renderPalette();};
    el.appendChild(b);
  });
}

function renderRoom(){
  const el=document.getElementById('room');
  el.innerHTML='';
  grid.forEach((cellItem,i)=>{
    const d=document.createElement('div');
    d.className='cell';
    d.textContent=cellItem?ITEMS.find(it=>it.key===cellItem).emoji:'';
    d.onclick=()=>{
      grid[i]=grid[i]?null:selected;
      renderRoom();
      checkOrder();
    };
    el.appendChild(d);
  });
}

function checkOrder(){
  const counts={};
  grid.forEach(k=>{if(k)counts[k]=(counts[k]||0)+1;});
  const complete=Object.entries(order).every(([k,v])=>(counts[k]||0)>=v);
  if(complete){
    const reward=Object.values(order).reduce((a,b)=>a+b,0)*15;
    coins+=reward;ordersDone++;
    document.getElementById('msg').textContent=`🎉 Order complete! +${reward} coins`;
    document.getElementById('msg').style.color='#a5d6a7';
    updateUI();
    setTimeout(()=>{grid=Array(ROWS*COLS).fill(null);renderRoom();newOrder();},1400);
  }
}

function updateUI(){
  document.getElementById('ui').textContent=`🪙 ${coins} | Orders completed: ${ordersDone}`;
}

init();
</script></body></html>
