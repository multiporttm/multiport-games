<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a1a2e;display:block;border-radius:8px;touch-action:none;image-rendering:pixelated}
#hud{color:#7ec850;font-size:1.1rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:monospace}
#hud span b{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">8-Bit Challenge</div>
  <div class="game-frame">
    <div id="hud"><span>🏁 <b id="dist">0</b>m</span><span>🪙 <b id="coins">0</b></span><span>🏆 <b id="hi">0</b></span></div>
    <canvas id="c" width="800" height="260"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Press <b>Space</b>, <b>Up Arrow</b>, or <b>Tap</b> to jump. Press <b>Down Arrow</b>, <b>S</b>, or swipe down to duck. Dodge the pixel obstacles, grab coins, and survive as the retro world speeds up!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=800,H=260,GROUND=200;
let hi=parseInt(localStorage.getItem('8bitchallenge_best')||'0',10);
document.getElementById('hi').textContent=hi;

const player={x:70,y:GROUND-40,w:32,h:40,vy:0,ducking:false,onGround:true};
let obstacles=[],coins=[];
let dist=0,coinCount=0,speed=5,gameOver=false,started=false,frame=0,spawnTimer=0,coinTimer=0;

function reset(){
  player.y=GROUND-40;player.vy=0;player.ducking=false;player.onGround=true;
  obstacles=[];coins=[];dist=0;coinCount=0;speed=5;gameOver=false;started=true;frame=0;spawnTimer=0;coinTimer=40;
}

function jump(){
  if(!started){started=true;reset();return;}
  if(gameOver){reset();return;}
  if(player.onGround && !player.ducking){player.vy=-11.5;player.onGround=false;SFX.jump();}
}
function duckStart(){
  if(!started||gameOver)return;
  player.ducking=true;
}
function duckEnd(){ player.ducking=false; }

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();
  if(k===' '||k==='arrowup'||k==='w')jump();
  if(k==='arrowdown'||k==='s')duckStart();
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowdown'||k==='s')duckEnd();
});

let touchStartY=null;
c.addEventListener('pointerdown',e=>{ touchStartY=e.clientY; jump(); });
c.addEventListener('pointermove',e=>{
  if(touchStartY!=null && e.buttons>0){
    if(e.clientY-touchStartY>30) duckStart();
  }
});
c.addEventListener('pointerup',()=>{ touchStartY=null; duckEnd(); });
c.addEventListener('pointercancel',()=>{ touchStartY=null; duckEnd(); });

function spawnObstacle(){
  const type=Math.random()<0.35?'high':'ground'; // high = must duck (flying), ground = must jump
  if(type==='high'){
    obstacles.push({x:W+20,y:GROUND-70,w:28,h:24,type:'high'});
  } else {
    const tall=Math.random()<0.4;
    obstacles.push({x:W+20,y:GROUND-(tall?46:30),w:24,h:tall?46:30,type:'ground'});
  }
}
function spawnCoin(){
  const y=GROUND-30-Math.random()*70;
  coins.push({x:W+20,y,w:16,h:16,taken:false});
}

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(dt){
  if(!started||gameOver)return;
  frame+=dt;
  dist+=speed*dt*0.1;
  speed=5+dist/120;

  player.vy+=0.6*dt;
  player.y+=player.vy*dt;
  const groundY=GROUND-(player.ducking?24:40);
  if(player.y>=groundY){player.y=groundY;player.vy=0;player.onGround=true;}

  spawnTimer+=dt;
  const interval=Math.max(38,80-dist/8);
  if(spawnTimer>=interval){spawnTimer=0;spawnObstacle();}
  coinTimer+=dt;
  if(coinTimer>=60){coinTimer=0;if(Math.random()<0.7)spawnCoin();}

  const ph=player.ducking?24:40;
  const hitbox={x:player.x+4,y:player.y+4,w:player.w-8,h:ph-8};

  obstacles=obstacles.filter(o=>o.x>-40);
  obstacles.forEach(o=>{
    o.x-=speed*dt*2.2;
    if(rectsOverlap(hitbox,o)){
      gameOver=true;SFX.lose();
      const finalScore=Math.floor(dist)+coinCount*5;
      if(finalScore>hi){hi=finalScore;localStorage.setItem('8bitchallenge_best',hi);}
    }
  });

  coins=coins.filter(cn=>cn.x>-30 && !cn.taken);
  coins.forEach(cn=>{
    cn.x-=speed*dt*2.2;
    if(rectsOverlap(hitbox,cn)){cn.taken=true;coinCount++;SFX.coin();}
  });
}

function drawPixelChar(){
  ctx.save();
  ctx.fillStyle='#ffd54f';
  const h=player.ducking?24:40;
  ctx.fillRect(player.x,player.y,player.w,h);
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(player.x+player.w-12,player.y+6,6,6);
  const legOff=Math.floor(frame/5)%2===0?0:6;
  if(!player.ducking && player.onGround){
    ctx.fillStyle='#e6a800';
    ctx.fillRect(player.x+4,player.y+h,8,6+legOff*0.4);
    ctx.fillRect(player.x+player.w-12,player.y+h,8,6+(6-legOff)*0.4);
  }
  ctx.restore();
}
function drawObstacle(o){
  ctx.fillStyle=o.type==='high'?'#7c4dff':'#e94560';
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.fillStyle='#fff2';
  for(let i=0;i<o.h;i+=8)ctx.fillRect(o.x,o.y+i,o.w,3);
}
function drawCoin(cn){
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.arc(cn.x+8,cn.y+8,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e6a800';
  ctx.beginPath();ctx.arc(cn.x+8,cn.y+8,4,0,Math.PI*2);ctx.fill();
}

function drawBg(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#0b0f24');sky.addColorStop(1,'#302b63');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  // stars/pixels
  ctx.fillStyle='#ffffff33';
  for(let i=0;i<20;i++){
    const x=(i*67-Math.floor(frame*2))%W;
    ctx.fillRect((x+W)%W,20+((i*37)%80),3,3);
  }
  ctx.fillStyle='#4a3f7a';
  for(let i=-1;i<10;i++){
    const x=(i*100-(frame*speed*0.4)%100+100)%(W+100)-100;
    ctx.fillRect(x,GROUND-30,60,30);
  }
  ctx.fillStyle='#1e1436';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#3d3070';
  for(let i=-1;i<20;i++){
    const x=(i*40-(frame*speed*2.2)%40+40)%(W+40)-40;
    ctx.fillRect(x,GROUND,4,10);
  }
}

let lastTime=null;
function loop(t){
  const dt=lastTime===null?1:Math.min((t-lastTime)/16.6667,3);
  lastTime=t;
  update(dt);
  drawBg();

  if(!started){
    ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Tap or Space to start'),W/2,H/2);
    requestAnimationFrame(loop);
    return;
  }

  obstacles.forEach(drawObstacle);
  coins.forEach(drawCoin);
  drawPixelChar();

  document.getElementById('dist').textContent=Math.floor(dist);
  document.getElementById('coins').textContent=coinCount;
  document.getElementById('hi').textContent=hi;

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px monospace';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-10);
    ctx.font='16px monospace';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,H/2+20);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
