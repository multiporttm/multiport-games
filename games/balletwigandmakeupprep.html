<style>
body{background:#08080f}
#c{background:#1f1420;display:block;border-radius:8px;touch-action:none}
#hud{color:#f3c9e0;font-size:1.05rem;font-weight:700;text-align:center;padding:8px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#hud span b{color:#ffd54f}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ballet Wig and Makeup Prep</div>
  <div class="game-frame">
    <div id="hud"><span id="scoreDisp">Score: 0 | Hi: 0</span><span id="livesDisp">❤️❤️❤️</span><span id="levelDisp">Look 1</span></div>
    <canvas id="c" width="800" height="400" tabindex="0"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">The dresser calls out a station — <b>eyes</b>, <b>lips</b>, <b>blush</b>, or <b>wig</b>. <b>Click</b>, <b>tap</b>, or press its key (<b>E</b>, <b>L</b>, <b>B</b>, <b>W</b>) before the pre-show timer bar runs out. Each new look becomes more elaborate and the clock grows tighter.</div>
</div>
<script>
const GID='balletwigandmakeupprep';
const c=document.getElementById('c'),ctx=c.getContext('2d');
const scoreDisp=document.getElementById('scoreDisp'),livesDisp=document.getElementById('livesDisp'),levelDisp=document.getElementById('levelDisp');
const MAX_LEVEL=6;
const STATIONS=[
  {key:'E',code:'KeyE',name:'Eyes',color:'#7ec8e3',x:200,y:150},
  {key:'L',code:'KeyL',name:'Lips',color:'#e94560',x:400,y:150},
  {key:'B',code:'KeyB',name:'Blush',color:'#ff8fa3',x:600,y:150},
  {key:'W',code:'KeyW',name:'Wig',color:'#b388ff',x:400,y:280}
];
let hi=parseInt(localStorage.getItem(GID+'_hi')||'0',10);
let score=0,lives=3,level=1;
let queue=[],qIdx=0,queueLen=5;
let timeMax=90,timeLeft=90;
let active=-1,flashStation=-1,flashT=0,flashOk=false;
let phase='ready'; // ready|play|cleared|lost|won

function lives2str(){return '❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));}

function buildQueue(){
  queue=[];
  for(let i=0;i<queueLen;i++)queue.push(Math.floor(Math.random()*STATIONS.length));
}

function startLevel(){
  queueLen=5+level;
  timeMax=Math.max(26,95-level*10);
  buildQueue();
  qIdx=0;
  timeLeft=timeMax;
  phase='play';
}

function resetGame(){
  score=0;lives=3;level=1;
  startLevel();
}

function nextCall(){
  qIdx++;
  timeLeft=timeMax;
  if(qIdx>=queue.length){
    if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
    if(level>=MAX_LEVEL){phase='won';SFX.win();}
    else {phase='cleared';SFX.success();}
  }
}

function hit(stationIdx){
  if(phase!=='play')return;
  const target=queue[qIdx];
  flashStation=stationIdx;flashT=14;
  if(stationIdx===target){
    flashOk=true;
    score+=Math.round(40+timeLeft*1.2+level*5);
    SFX.success();
    nextCall();
  } else {
    flashOk=false;
    lives--;
    SFX.hurt();
    if(lives<=0){
      phase='lost';SFX.lose();
      if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
    } else {
      nextCall();
    }
  }
}

function timeout_(){
  lives--;
  SFX.hurt();
  flashStation=queue[qIdx];flashT=14;flashOk=false;
  if(lives<=0){
    phase='lost';SFX.lose();
    if(score>hi){hi=score;localStorage.setItem(GID+'_hi',String(hi));}
  } else {
    nextCall();
  }
}

function pointerPos(e){
  const rect=c.getBoundingClientRect();
  const sx=c.width/rect.width,sy=c.height/rect.height;
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx*sx,y:cy*sy};
}
function stationAt(x,y){
  for(let i=0;i<STATIONS.length;i++){
    const s=STATIONS[i];
    if(Math.hypot(x-s.x,y-s.y)<=55)return i;
  }
  return -1;
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(phase==='ready'||phase==='lost'||phase==='won'){resetGame();return;}
  if(phase==='cleared'){level++;startLevel();return;}
  const p=pointerPos(e);
  const i=stationAt(p.x,p.y);
  if(i>=0)hit(i);
});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(phase==='ready'||phase==='lost'||phase==='won'){resetGame();return;}
  if(phase==='cleared'){level++;startLevel();return;}
  const p=pointerPos(e);
  const i=stationAt(p.x,p.y);
  if(i>=0)hit(i);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(phase==='ready'||phase==='lost'||phase==='won'){
    if(e.code==='Space'||e.code==='Enter'){resetGame();}
    return;
  }
  if(phase==='cleared'){
    if(e.code==='Space'||e.code==='Enter'){level++;startLevel();}
    return;
  }
  const idx=STATIONS.findIndex(s=>s.code===e.code);
  if(idx>=0){e.preventDefault();hit(idx);}
});

function drawStations(){
  ctx.fillStyle='#160f17';ctx.fillRect(0,0,800,400);
  STATIONS.forEach((s,i)=>{
    let glow=0;
    if(phase==='play'&&queue[qIdx]===i)glow=0.4+0.3*Math.sin(Date.now()/120);
    ctx.save();
    ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(s.x,s.y,55,0,Math.PI*2);
    ctx.fillStyle=s.color+'55';
    if(flashStation===i&&flashT>0)ctx.fillStyle=flashOk?'#4caf5099':'#e5393599';
    ctx.fill();
    ctx.lineWidth=glow>0?6:3;
    ctx.strokeStyle=glow>0?'#ffd54f':s.color;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 16px Arial';
    ctx.fillText(s.name+' ('+s.key+')',s.x,s.y+5);
  });
  if(flashT>0)flashT--;
}

function drawCenterText(lines){
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,800,400);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 32px Arial';
  ctx.fillText(lines[0],400,170);
  ctx.font='20px Arial';
  for(let i=1;i<lines.length;i++)ctx.fillText(lines[i],400,170+28*i);
}

function loop(){
  if(phase==='ready'){
    drawStations();
    drawCenterText([I18N.t('mk_title','Ballet Wig and Makeup Prep'),I18N.t('start_hint','Click / Tap / Press a key to start')]);
  } else if(phase==='play'){
    drawStations();
    const target=STATIONS[queue[qIdx]];
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 22px Arial';
    ctx.fillText(I18N.t('dresser_calls','Dresser calls: {n}!').replace('{n}',target.name),400,40);
    // timer bar
    const pct=Math.max(0,timeLeft/timeMax);
    ctx.fillStyle='#3a2a3a';ctx.fillRect(220,55,360,14);
    ctx.fillStyle=pct<0.3?'#e53935':'#4caf50';
    ctx.fillRect(220,55,360*pct,14);
    timeLeft--;
    if(timeLeft<=0)timeout_();
  } else if(phase==='cleared'){
    drawStations();
    drawCenterText([I18N.t('look_complete','Look complete!'),I18N.t('continue_hint','Click / Tap / Space to continue')]);
  } else if(phase==='lost'){
    drawStations();
    drawCenterText([I18N.t('game_over_title','GAME OVER'),I18N.t('restart_hint','Tap or Space to restart')]);
  } else if(phase==='won'){
    drawStations();
    drawCenterText([I18N.t('show_complete','SHOW COMPLETE!'),I18N.t('restart_hint','Tap or Space to restart')]);
  }
  scoreDisp.textContent=I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  livesDisp.textContent=lives2str();
  levelDisp.textContent=I18N.t('look_label','Look {n}').replace('{n}',level);
  requestAnimationFrame(loop);
}
startLevel();
phase='ready';
loop();
</script></body></html>
