<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#1a0f1f;display:block;border-radius:8px;touch-action:none}
#score-display{color:#ff9e5e;font-size:1.15rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Glass Blower</div>
  <div class="game-frame">
    <div id="score-display">Pieces: 0 | Best Precision: 0%</div>
    <canvas id="c" width="800" height="450"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Hold <b>Mouse/Space</b> or <b>touch and hold</b> to blow air into the molten glass while it rotates on the pipe. Release when its size and shape best match the faint <b>target silhouette</b> behind it — match closely to score high precision!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=450;
const cx=400,cy=260;
let pieces=0,bestPrecision=0;
pieces=parseInt(localStorage.getItem('glassblower_pieces')||'0',10);
bestPrecision=parseInt(localStorage.getItem('glassblower_best')||'0',10);

const SHAPES=[
  {name:'Ornament',target:70,tol:14,ratio:1.0},
  {name:'Vase',target:95,tol:12,ratio:1.35},
  {name:'Bowl',target:60,tol:10,ratio:0.7},
  {name:'Bottle',target:110,tol:10,ratio:1.6},
  {name:'Globe',target:130,tol:9,ratio:1.0}
];
let round=0;
let shape=SHAPES[0];
let radius=18;
let baseRadius=18;
let blowing=false;
let rotation=0;
let done=false;
let resultText='';
let resultColor='#fff';
let popped=false;
let sizeHistory=[];

function pickShape(){
  const idx=Math.min(round,SHAPES.length-1);
  const s=SHAPES[idx];
  // add slight randomization to keep it fresh on repeats
  return {name:s.name,target:s.target+ (round>=SHAPES.length? (Math.random()*10-5):0),tol:Math.max(6,s.tol-Math.floor(round/SHAPES.length)*1.5),ratio:s.ratio};
}

function resetRound(){
  shape=pickShape();
  radius=18;
  blowing=false;
  rotation=0;
  done=false;
  popped=false;
  resultText='';
}
resetRound();

function startBlow(){
  if(done){ resetRound(); return; }
  blowing=true;
}
function stopBlow(){
  if(!blowing||done)return;
  blowing=false;
  finishPiece();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(!blowing) startBlow();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){e.preventDefault(); stopBlow();}
});
c.addEventListener('mousedown',startBlow);
window.addEventListener('mouseup',stopBlow);
c.addEventListener('touchstart',e=>{e.preventDefault();startBlow();},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();stopBlow();},{passive:false});

function finishPiece(){
  const diff=Math.abs(radius-shape.target);
  let precision=Math.max(0,100-(diff/shape.target)*140);
  precision=Math.round(Math.min(100,precision));
  done=true;
  pieces++;
  if(precision>bestPrecision){bestPrecision=precision;localStorage.setItem('glassblower_best',bestPrecision);}
  localStorage.setItem('glassblower_pieces',pieces);
  if(diff<=shape.tol){
    resultText=I18N.t('glass_perfect','{name} complete! Precision: {p}%').replace('{name}',shape.name).replace('{p}',precision);
    resultColor='#7ec850';
    SFX.success();
    round++;
  } else if(radius>shape.target+shape.tol*2.4){
    popped=true;
    resultText=I18N.t('glass_popped','Blown too far — it popped! Precision: {p}%').replace('{p}',precision);
    resultColor='#e94560';
    SFX.fail();
  } else {
    resultText=I18N.t('glass_close','Not quite matched. Precision: {p}%').replace('{p}',precision);
    resultColor='#ffb300';
    SFX.point();
  }
}

function drawTarget(){
  ctx.save();
  ctx.globalAlpha=0.22;
  ctx.strokeStyle='#8ecfff';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.ellipse(cx,cy,shape.target,shape.target*shape.ratio,0,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.fillStyle='#8ecfff';
  ctx.font='16px Arial';
  ctx.textAlign='center';
  ctx.fillText(shape.name,cx,cy-shape.target*shape.ratio-14);
  ctx.restore();
}

function drawPipe(){
  ctx.save();
  ctx.fillStyle='#555';
  ctx.fillRect(cx-8,H-40,16,80);
  ctx.restore();
}

function drawGlass(){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);
  const grad=ctx.createRadialGradient(-radius*0.3,-radius*0.3,radius*0.1,0,0,radius);
  grad.addColorStop(0,popped?'#ffb3b3':'#ffdca3');
  grad.addColorStop(0.5,popped?'#e94560':'#ff9e5e');
  grad.addColorStop(1,popped?'#7a1030':'#c2500f');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.ellipse(0,0,radius,radius*shape.ratio,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1530');bg.addColorStop(1,'#140a1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawTarget();
  drawPipe();

  if(!done){
    rotation+=0.03;
    if(blowing && !popped){
      radius+=0.6;
      if(radius>shape.target+shape.tol*2.4){
        blowing=false;
        finishPiece();
      }
    }
  }
  drawGlass();

  ctx.fillStyle='#fff';
  ctx.font='bold 22px Arial';
  ctx.textAlign='center';
  if(!done && !blowing){
    ctx.globalAlpha=0.75;
    ctx.fillText(I18N.t('glass_hint','Hold to blow — release to match the target'),cx,60);
    ctx.globalAlpha=1;
  }
  if(done){
    ctx.fillStyle=resultColor;
    ctx.fillText(resultText,cx,60);
    ctx.font='16px Arial';
    ctx.fillStyle='#ccc';
    ctx.fillText(I18N.t('glass_next','Click/Tap or press Space for next piece'),cx,90);
  }

  document.getElementById('score-display').textContent=I18N.t('glass_stats','Pieces: {p} | Best Precision: {b}%').replace('{p}',pieces).replace('{b}',bestPrecision);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
