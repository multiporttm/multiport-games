<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:linear-gradient(#a8d8f0,#e8f4f8);display:block;border-radius:8px;touch-action:none}
#hud{color:#fff;font-size:1.1rem;font-weight:700;text-align:center;padding:8px}
#hud span{color:#5ec8f0}
#pads{display:flex;gap:10px;justify-content:center;margin-top:10px}
#pads button{flex:1;max-width:180px;padding:18px 0;font-size:1.3rem;font-weight:900;border:none;border-radius:12px;background:#e94560;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#pads button:active{transform:scale(.94)}
#pads button.leap{background:#4caf50}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Bobsled Push</div>
  <div class="game-frame">
    <div id="hud">Speed: <span id="spd">0.0</span> m/s | Best: <span id="best">--</span></div>
    <canvas id="c" width="800" height="260"></canvas>
    <div id="pads">
      <button id="padL">PUSH L</button>
      <button id="padR">PUSH R</button>
      <button id="padLeap" class="leap">LEAP!</button>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">Alternate <b>Left</b> / <b>Right</b> Arrow keys (or tap <b>PUSH L</b> / <b>PUSH R</b>) as fast as you can to sprint-push the sled. Press <b>Space</b> or tap <b>LEAP!</b> at exactly the right moment to jump in — too early and you fall, too late and you miss the sled!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const KEY='bobsledpush_hi';
let best=parseFloat(localStorage.getItem(KEY)||'0');
document.getElementById('best').textContent=best>0?best.toFixed(2)+'s':'--';

const TRACK_LEN=620; // px of push zone before leap window
const LEAP_ZONE_START=560, LEAP_ZONE_END=610, LEAP_ZONE_MISS=650;
let state='ready'; // ready, pushing, result
let speed=0, dist=0, lastSide=null, comboTimer=0;
let sledX=100, crewX=100;
let resultText='', resultGood=false, finalTime=0;
let runTimer=0;
let legFrame=0;

function reset(){
  state='ready';speed=0;dist=0;lastSide=null;comboTimer=0;sledX=100;crewX=100;
  resultText='';runTimer=0;legFrame=0;
}
reset();

function startPush(){
  if(state==='ready'){state='pushing';SFX.click();}
}

function push(side){
  if(state==='result'){reset();return;}
  startPush();
  if(state!=='pushing')return;
  if(side!==lastSide||comboTimer<=0){
    speed=Math.min(speed+1.1,14);
    SFX.tick();
  }else{
    speed=Math.max(speed-0.15,0); // penalize mashing same side
  }
  lastSide=side;
  comboTimer=14;
  legFrame++;
}

function leap(){
  if(state==='result'){reset();return;}
  if(state!=='pushing')return;
  if(dist<LEAP_ZONE_START){
    // too early -> fall
    state='result';resultGood=false;
    resultText=I18N.t('bobsled_early','Too early — you fell!');
    SFX.fail();
  }else if(dist<=LEAP_ZONE_END){
    // perfect leap
    state='result';resultGood=true;
    finalTime=Math.max(3.2,10-speed*0.5);
    resultText=I18N.t('bobsled_good','Great leap!');
    if(best===0||finalTime<best){best=finalTime;localStorage.setItem(KEY,best.toString());document.getElementById('best').textContent=best.toFixed(2)+'s';}
    SFX.win();
  }else{
    state='result';resultGood=false;
    resultText=I18N.t('bobsled_late','Too late — missed the sled!');
    SFX.fail();
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();push('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();push('R');}
  else if(e.code==='Space'){e.preventDefault();leap();}
});
document.getElementById('padL').addEventListener('pointerdown',e=>{e.preventDefault();push('L');});
document.getElementById('padR').addEventListener('pointerdown',e=>{e.preventDefault();push('R');});
document.getElementById('padLeap').addEventListener('pointerdown',e=>{e.preventDefault();leap();});

function drawTrack(){
  ctx.fillStyle='#e8f4f8';ctx.fillRect(0,0,800,260);
  // ice track
  const g=ctx.createLinearGradient(0,140,0,220);
  g.addColorStop(0,'#cfeeff');g.addColorStop(1,'#9fd8ee');
  ctx.fillStyle=g;ctx.fillRect(0,150,800,90);
  ctx.strokeStyle='#7ec4de';ctx.lineWidth=2;
  for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*90-((dist*2)%90),150);ctx.lineTo(i*90-((dist*2)%90)-30,240);ctx.stroke();}
  // leap zone marker on track (mapped to screen space)
  const scale=560/TRACK_LEN;
  const zoneScreenStart=100+LEAP_ZONE_START*scale*0+ (LEAP_ZONE_START/TRACK_LEN)*560;
}

function screenX(d){ return 100 + (d/LEAP_ZONE_MISS)*560; }

function drawSled(){
  const x=screenX(Math.min(dist,LEAP_ZONE_MISS));
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();
  ctx.moveTo(x,190);ctx.quadraticCurveTo(x+60,175,x+90,190);ctx.lineTo(x+90,215);ctx.lineTo(x,215);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e94560';ctx.fillRect(x+10,180,70,10);
}

function drawCrew(){
  const x=screenX(Math.min(dist,LEAP_ZONE_MISS))-40;
  const bob=Math.sin(legFrame*0.9)*4;
  ctx.fillStyle='#ffd54f';
  for(let i=0;i<2;i++){
    const px=x-i*24;
    ctx.fillRect(px,195+((i%2===0)?bob:-bob),14,26);
    ctx.beginPath();ctx.arc(px+7,190+((i%2===0)?bob:-bob),8,0,7);ctx.fill();
  }
}

function drawZoneMarkers(){
  const xs=screenX(LEAP_ZONE_START), xe=screenX(LEAP_ZONE_END), xm=screenX(LEAP_ZONE_MISS);
  ctx.fillStyle='rgba(76,175,80,0.35)';
  ctx.fillRect(xs,150,xe-xs,90);
  ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.strokeRect(xs,150,xe-xs,90);
}

function loop(){
  drawTrack();
  drawZoneMarkers();
  drawCrew();
  drawSled();

  ctx.fillStyle='#1a1a2e';ctx.font='bold 20px Arial';ctx.textAlign='center';
  if(state==='ready'){
    ctx.fillText(I18N.t('bobsled_start','Alternate PUSH L / PUSH R to sprint!'),400,40);
  }else if(state==='pushing'){
    ctx.fillText(I18N.t('bobsled_push_hint','Push! Then LEAP in the green zone'),400,40);
    if(comboTimer>0)comboTimer--;
    dist+=speed*0.35;
    speed=Math.max(0,speed-0.02);
    if(dist>=LEAP_ZONE_MISS){
      state='result';resultGood=false;
      resultText=I18N.t('bobsled_late','Too late — missed the sled!');
      SFX.fail();
    }
  }else if(state==='result'){
    ctx.fillStyle=resultGood?'#2e7d32':'#c62828';
    ctx.font='bold 30px Arial';
    ctx.fillText(resultText,400,100);
    ctx.font='22px Arial';ctx.fillStyle='#1a1a2e';
    if(resultGood){
      ctx.fillText(I18N.t('bobsled_time','Launch time: {t}s').replace('{t}',finalTime.toFixed(2)),400,140);
    }
    ctx.font='18px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or press Space to try again'),400,175);
  }
  document.getElementById('spd').textContent=speed.toFixed(1);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
