pt>
<script src="https://cdn.counter.dev/script.js" data-id="24591d8d-bdbf-4574-877c-3fc91c262d01" data-utcoffset="-5"></script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#8fc7ee;display:block;border-radius:8px;touch-action:none}
#score-display{color:#2d6bb0;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Kite Launch Timing</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Hi: 0</div>
    <canvas id="c" width="800" height="400"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the gust marker sweep the runway. Press <b>Space</b>, <b>click</b>, or <b>tap</b> the instant it enters the green zone to launch cleanly. Too early stalls the kite, too late sends it into a nose-dive. You have 3 lives — survive as many rounds as you can!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=400;
const KEY='kitelaunchtiming_hi';
let hi=parseInt(localStorage.getItem(KEY)||'0',10);
let score=0,lives=3,level=1,gameOver=false,started=false;
let pos=0,dir=1,speed=2.6,zoneCenter=0.5,zoneWidth=0.16;
let state='run'; // run, result
let resultTimer=0,resultText='',resultGood=false;
let anim=0;
let kiteFlying=false,kiteY=0,kiteVX=0,kiteVY=0,kiteSpin=0,kiteRot=0;

function reset(){
  score=0;lives=3;level=1;gameOver=false;started=false;pos=0;dir=1;
  speed=2.6;zoneWidth=0.16;zoneCenter=0.5;state='run';kiteFlying=false;
}
reset();

function newRound(){
  zoneWidth=Math.max(0.045,0.17-level*0.012);
  speed=2.6+level*0.28;
  zoneCenter=0.3+Math.random()*0.4;
  pos=Math.random()<0.5?0:1;
  dir=pos===0?1:-1;
  state='run';
}

function attemptLaunch(){
  if(!started){started=true;newRound();return;}
  if(gameOver){
    score=0;lives=3;level=1;started=true;pos=0;dir=1;newRound();gameOver=false;
    return;
  }
  if(state!=='run')return;
  const dist=Math.abs(pos-zoneCenter);
  const half=zoneWidth/2;
  if(dist<=half){
    const precision=1-(dist/half);
    const gain=Math.round(40+precision*60+level*5);
    score+=gain;
    if(score>hi){hi=score;localStorage.setItem(KEY,String(hi));}
    resultGood=true;
    resultText=I18N.t('clean_launch','Clean launch! +'+gain);
    SFX.success();
    kiteFlying=true;kiteY=300;kiteVX=2+precision*2;kiteVY=-6-precision*4;kiteSpin=0;kiteRot=0;
    state='result';resultTimer=0;
    level++;
  } else {
    lives--;
    const early=pos<zoneCenter;
    resultGood=false;
    resultText=early?I18N.t('stall_msg','Too early — the kite stalled!'):I18N.t('dive_msg','Too late — nose-dive!');
    SFX.fail();
    kiteFlying=true;kiteY=300;
    if(early){kiteVX=0.4;kiteVY=-1;kiteSpin=0;kiteRot=0;}
    else{kiteVX=3.5;kiteVY=2;kiteSpin=0.25;kiteRot=0;}
    state='result';resultTimer=0;
    if(lives<=0){
      gameOver=true;
      SFX.lose();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();attemptLaunch();}
});
c.addEventListener('mousedown',attemptLaunch);
c.addEventListener('touchstart',e=>{e.preventDefault();attemptLaunch();},{passive:false});

function drawRunner(x,y){
  ctx.fillStyle='#2b2b2b';
  ctx.fillRect(x-6,y-28,12,28);
  ctx.beginPath();ctx.arc(x,y-34,8,0,Math.PI*2);ctx.fill();
}

function drawKiteShape(x,y,rot,scale){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(20,0);ctx.lineTo(0,10);ctx.lineTo(-20,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(0,10);ctx.lineTo(-20,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(-4,24);ctx.lineTo(4,30);ctx.lineTo(-4,38);ctx.stroke();
  ctx.restore();
}

function loop(dt){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#bfe3fb');sky.addColorStop(1,'#8fc7ee');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6bb551';ctx.fillRect(0,340,W,60);
  ctx.fillStyle='#4f9c3c';ctx.fillRect(0,340,W,5);

  // HUD
  ctx.fillStyle='#1a1a2e';ctx.font='bold 16px Arial';ctx.textAlign='left';
  ctx.fillText(I18N.t('level_label','Level {n}').replace('{n}',level),16,28);
  ctx.textAlign='right';
  for(let i=0;i<3;i++){
    ctx.font='20px Arial';
    ctx.fillStyle=i<lives?'#e94560':'#ffffff55';
    ctx.fillText('♥',W-16-i*26,28);
  }
  ctx.textAlign='left';

  if(!started){
    ctx.fillStyle='#1a1a2e';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint_launch','Press Space / Tap to start'),W/2,H/2);
    requestAnimationFrame(frame);return;
  }

  // runway bar
  const barX=100,barY=370,barW=600;
  ctx.fillStyle='#333a4d';ctx.fillRect(barX,barY-8,barW,16);
  const zx=barX+(zoneCenter-zoneWidth/2)*barW;
  ctx.fillStyle='#6bd36b';ctx.fillRect(zx,barY-8,zoneWidth*barW,16);

  if(state==='run'&&!gameOver){
    pos+=dir*speed*0.0032*dt;
    if(pos>1){pos=1;dir=-1;}
    if(pos<0){pos=0;dir=1;}
    const markerX=barX+pos*barW;
    drawRunner(markerX,barY-8);
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.moveTo(markerX,barY-30);ctx.lineTo(markerX-6,barY-16);ctx.lineTo(markerX+6,barY-16);ctx.closePath();ctx.fill();
  } else if(state==='result'){
    resultTimer+=dt;
    kiteY+=kiteVY*dt*0.06;
    kiteVY+=0.05*dt*(resultGood?0.3:1);
    if(!resultGood&&kiteVX>3){kiteRot+=kiteSpin*dt*0.06;}
    const kx=120+resultTimer*kiteVX*0.18;
    drawKiteShape(kx,kiteY,kiteRot,1.4);
    ctx.fillStyle=resultGood?'#2d8a3e':'#c0392b';
    ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText(resultText,W/2,90);
    if(resultTimer>70){
      if(gameOver){
        state='over';
      } else if(lives>0){
        newRound();
      }
    }
  } else if(state==='over'||gameOver){
    ctx.fillStyle='#1a1a2e';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,160);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('restart_hint','Tap or Space to restart'),W/2,196);
  }

  document.getElementById('score-display').textContent=
    I18N.t('score_hi_label','Score: {s} | Hi: {h}').replace('{s}',score).replace('{h}',hi);
  requestAnimationFrame(frame);
}
let lastT=null;
function frame(){
  const now=performance.now();
  const dt=lastT===null?1:Math.min((now-lastT)/1,34);
  lastT=now;
  loop(dt);
}
requestAnimationFrame(frame);
</script></body></html>
