<link rel="stylesheet" href="../css/style.css?v=7">
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#1a1a2e}
#ui{color:#4fc3f7;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <a href="../" class="back-btn">← Back</a>
  <div class="game-title">Turf Wars</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Wave: 1 | HP: 5 | Score: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to move — you shoot automatically at the nearest enemy. Survive as many waves as you can!</div>
</div>
<script>
const W=360,H=360,SIZE=20;
let player,enemies,bullets,wave,hp,score,keys={},spawnTimer,fireTimer,state,best=+(localStorage.getItem('turfwars_best')||0);

function loadBest(){return +(localStorage.getItem('turfwars_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('turfwars_best',v);}

function init(){
  player={x:W/2,y:H/2};
  enemies=[];bullets=[];
  wave=1;hp=5;score=0;spawnTimer=0;fireTimer=0;state='play';best=loadBest();
  spawnWave();
}

function spawnWave(){
  const count=3+wave;
  for(let i=0;i<count;i++)spawnEnemy();
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-20;}
  else if(side===1){x=Math.random()*W;y=H+20;}
  else if(side===2){x=-20;y=Math.random()*H;}
  else{x=W+20;y=Math.random()*H;}
  enemies.push({x,y,hp:2,speed:0.7+wave*0.05});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){
  if(state!=='play')return;
  const spd=2.6;
  if(keys['arrowup']||keys['w'])player.y-=spd;
  if(keys['arrowdown']||keys['s'])player.y+=spd;
  if(keys['arrowleft']||keys['a'])player.x-=spd;
  if(keys['arrowright']||keys['d'])player.x+=spd;
  player.x=Math.max(SIZE/2,Math.min(W-SIZE/2,player.x));
  player.y=Math.max(SIZE/2,Math.min(H-SIZE/2,player.y));

  fireTimer--;
  if(fireTimer<=0&&enemies.length){
    let nearest=enemies[0];
    enemies.forEach(e=>{if(dist(player,e)<dist(player,nearest))nearest=e;});
    const ang=Math.atan2(nearest.y-player.y,nearest.x-player.x);
    bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5});
    fireTimer=18;
  }

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  bullets=bullets.filter(b=>b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);

  enemies.forEach(e=>{
    const ang=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(ang)*e.speed;e.y+=Math.sin(ang)*e.speed;
  });

  for(let bi=bullets.length-1;bi>=0;bi--){
    for(let ei=enemies.length-1;ei>=0;ei--){
      if(dist(bullets[bi],enemies[ei])<14){
        enemies[ei].hp--;
        bullets.splice(bi,1);
        if(enemies[ei].hp<=0){enemies.splice(ei,1);score+=10;}
        break;
      }
    }
  }

  for(let ei=enemies.length-1;ei>=0;ei--){
    if(dist(player,enemies[ei])<16){
      enemies.splice(ei,1);hp--;
      if(hp<=0){state='over';saveBest(score);best=loadBest();}
    }
  }

  if(enemies.length===0){
    wave++;score+=25;
    spawnWave();
  }

  updateUI();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(79,195,247,.06)';
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

  bullets.forEach(b=>{ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();});
  enemies.forEach(e=>{
    ctx.fillStyle=e.hp>1?'#ef5350':'#e57373';
    ctx.beginPath();ctx.arc(e.x,e.y,12,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.arc(player.x,player.y,13,0,Math.PI*2);ctx.fill();

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4fc3f7';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('DEFEATED',W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(`Score: ${score} | Wave ${wave}`,W/2,H/2+12);
    ctx.fillText('Tap a D-pad button to retry',W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Wave: ${wave} | HP: ${Math.max(0,hp)} | Score: ${score} | Best: ${best}`;
}
document.querySelectorAll('#dpad button').forEach(btn=>btn.addEventListener('click',()=>{if(state==='over')init();}));

init();draw();
</script></body></html>
