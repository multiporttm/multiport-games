<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#0e3350;display:block;border-radius:8px;touch-action:manipulation;cursor:pointer}
#hud{display:flex;justify-content:center;gap:22px;color:#ffd54f;font-size:1.1rem;font-weight:700;padding:8px;flex-wrap:wrap}
#hud span b{color:#fff}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Apple Bobbing</div>
  <div class="game-frame">
    <div id="hud"><span>Score: <b id="scoreEl">0</b></span><span>Time: <b id="timeEl">30</b>s</span><span>Best: <b id="bestEl">0</b></span></div>
    <canvas id="c" width="700" height="420"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Watch the apples bob in the barrel. When your <b>glowing</b> target apple rises near the surface, press <b>Space</b> or <b>tap/click</b> the barrel to bite it! Catch as many as you can before time runs out.</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=420;
const BARREL={x:60,y:70,w:580,h:300};
const SURFACE=BARREL.y+40;
const BITE_ZONE=26;
const N_APPLES=6;
const ROUND_TIME=30;

let apples=[],score=0,timeLeft=ROUND_TIME,best=parseInt(localStorage.getItem('applebobbing_best')||'0',10),
    running=false,ended=false,targetIdx=0,lastTime=null,biteFlash=0,message='',msgTimer=0;

document.getElementById('bestEl').textContent=best;

function mkApple(i){
  return {
    baseY: SURFACE+20+Math.random()*60,
    amp: 30+Math.random()*35,
    speed: 0.6+Math.random()*0.9,
    phase: Math.random()*Math.PI*2,
    x: BARREL.x+60+ (i%3)*180 + (Math.random()*30-15),
    r: 26,
    caught:false,
    hue: 0
  };
}

function newTarget(){
  const avail=apples.map((a,i)=>i).filter(i=>!apples[i].caught);
  if(avail.length===0)return -1;
  return avail[Math.floor(Math.random()*avail.length)];
}

function reset(){
  apples=[];
  for(let i=0;i<N_APPLES;i++)apples.push(mkApple(i));
  score=0;timeLeft=ROUND_TIME;running=true;ended=false;lastTime=null;
  targetIdx=newTarget();
  message='';msgTimer=0;
  updateHud();
}

function updateHud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('timeEl').textContent=Math.max(0,Math.ceil(timeLeft));
}

function appleY(a,t){
  return a.baseY - Math.abs(Math.sin(t*a.speed+a.phase))*a.amp;
}

function bite(){
  if(!running){ reset(); return; }
  if(ended){ reset(); return; }
  if(targetIdx<0)return;
  const a=apples[targetIdx];
  const t=performance.now()/1000;
  const y=appleY(a,t);
  biteFlash=8;
  if(y<=SURFACE+BITE_ZONE){
    a.caught=true;
    score++;
    SFX.catch();
    message=I18N.t('nice_catch','Nice catch!');
    msgTimer=45;
    targetIdx=newTarget();
    if(targetIdx<0){
      // refill some apples so round continues
      for(let i=0;i<apples.length;i++){
        if(apples[i].caught && Math.random()<0.6){
          apples[i]=mkApple(i);
          apples[i].caught=false;
        }
      }
      targetIdx=newTarget();
    }
  } else {
    SFX.fail();
    message=I18N.t('too_soon','Too soon! Wait for it to surface.');
    msgTimer=45;
    timeLeft=Math.max(0,timeLeft-1.5);
  }
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();bite();}
});
c.addEventListener('click',bite);
c.addEventListener('touchstart',e=>{e.preventDefault();bite();},{passive:false});

function drawWater(t){
  ctx.save();
  ctx.beginPath();
  ctx.rect(BARREL.x,BARREL.y,BARREL.w,BARREL.h);
  ctx.clip();
  const grad=ctx.createLinearGradient(0,SURFACE,0,BARREL.y+BARREL.h);
  grad.addColorStop(0,'#4aa3d9');
  grad.addColorStop(1,'#1b5e8a');
  ctx.fillStyle=grad;
  ctx.fillRect(BARREL.x,SURFACE,BARREL.w,BARREL.h);
  // wavy surface
  ctx.fillStyle='#6dc0ea';
  ctx.beginPath();
  ctx.moveTo(BARREL.x,SURFACE);
  for(let x=0;x<=BARREL.w;x+=10){
    const y=SURFACE+Math.sin((x*0.05)+t*2)*3;
    ctx.lineTo(BARREL.x+x,y);
  }
  ctx.lineTo(BARREL.x+BARREL.w,SURFACE+20);
  ctx.lineTo(BARREL.x,SURFACE+20);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBarrel(){
  ctx.save();
  ctx.strokeStyle='#8a5a2b';
  ctx.lineWidth=10;
  ctx.strokeRect(BARREL.x,BARREL.y,BARREL.w,BARREL.h);
  ctx.strokeStyle='#6b4321';
  ctx.lineWidth=4;
  for(let i=1;i<4;i++){
    const y=BARREL.y+ (BARREL.h/4)*i;
    ctx.beginPath();ctx.moveTo(BARREL.x,y);ctx.lineTo(BARREL.x+BARREL.w,y);ctx.stroke();
  }
  ctx.restore();
}

function drawApple(a,t,isTarget){
  const y=appleY(a,t);
  ctx.save();
  if(isTarget){
    ctx.shadowColor='#fff176';
    ctx.shadowBlur=22;
  }
  ctx.fillStyle=isTarget?'#ff5252':'#e53935';
  ctx.beginPath();
  ctx.arc(a.x,y,a.r,0,Math.PI*2);
  ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(a.x-8,y-8,7,0,Math.PI*2);
  ctx.fill();
  // stem
  ctx.strokeStyle='#5d4037';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(a.x,y-a.r);ctx.lineTo(a.x+2,y-a.r-10);ctx.stroke();
  // leaf
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.ellipse(a.x+6,y-a.r-9,6,3,0.6,0,Math.PI*2);ctx.fill();
  if(isTarget){
    ctx.fillStyle='#fff176';
    ctx.beginPath();
    ctx.moveTo(a.x,y-a.r-22);
    ctx.lineTo(a.x-6,y-a.r-30);
    ctx.lineTo(a.x+6,y-a.r-30);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function loop(now){
  if(lastTime===null)lastTime=now;
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  const t=now/1000;

  ctx.clearRect(0,0,W,H);
  // background
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a2b40');sky.addColorStop(1,'#0e1a28');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  if(running&&!ended){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;running=false;ended=true;
      if(score>best){best=score;localStorage.setItem('applebobbing_best',best);SFX.win();}
      else SFX.lose();
      document.getElementById('bestEl').textContent=best;
    }
    if(msgTimer>0)msgTimer--;else message='';
    updateHud();
  }

  drawWater(t);
  apples.forEach((a,i)=>{
    if(a.caught)return;
    drawApple(a,t,i===targetIdx);
  });
  drawBarrel();

  if(biteFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${biteFlash/8*0.25})`;
    ctx.fillRect(0,0,W,H);
    biteFlash--;
  }

  ctx.textAlign='center';
  if(message){
    ctx.fillStyle='#ffd54f';ctx.font='bold 22px Arial';
    ctx.fillText(message,W/2,40);
  }
  if(!running&&!ended){
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
    ctx.fillText(I18N.t('start_hint_apple','Press Space or Tap to start bobbing!'),W/2,H/2);
  }
  if(ended){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';
    ctx.fillText(I18N.t('time_up','TIME\'S UP!'),W/2,H/2-20);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('final_score','Final Score: {s}').replace('{s}',score),W/2,H/2+16);
    ctx.fillText(I18N.t('restart_hint_apple','Tap or Space to play again'),W/2,H/2+46);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
