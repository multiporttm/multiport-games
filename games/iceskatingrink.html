<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#e1f5fe;cursor:pointer}
#ui{color:#0288d1;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Ice Skating Rink</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Score: 0 | Energy: 100</div>
    <canvas id="c" width="360" height="360"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Tap to jump into a spin, then tap again while spinning to land it — land inside the golden window for full points. Each jump costs energy; a clean landing refunds some. Run out of energy and the routine ends!</div>
</div>
<script>
const W=360,H=360;
let phase,spinT,landStart,landLen,score,energy,state;

function loadBest(){return +(localStorage.getItem('iceskatingrink_best')||0);}
function saveBest(v){if(v>loadBest())localStorage.setItem('iceskatingrink_best',v);}

function init(){score=0;energy=100;state='play';phase='ground';}

function startSpin(){
  if(energy<15)return;
  energy-=15;
  phase='spin';spinT=0;
  landLen=Math.max(10,24-Math.floor(score/20));
  landStart=20+Math.random()*40;
  SFX.jump();
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
c.addEventListener('click',()=>{
  if(state==='over'){init();return;}
  if(state!=='play')return;
  if(phase==='ground'){
    startSpin();
  }else if(phase==='spin'){
    if(spinT>=landStart&&spinT<=landStart+landLen){
      score+=20;
      energy=Math.min(100,energy+8);
      SFX.success();
      saveBest(score);
    }else{
      SFX.fail();
    }
    phase='ground';
  }
  if(energy<=0){
    state='over';
    SFX.lose();
    saveBest(score);
  }
  updateUI();
});

function update(){
  if(state!=='play'||phase!=='spin')return;
  spinT++;
  if(spinT>70){
    phase='ground';
    SFX.fail();
    updateUI();
  }
}

function draw(){
  ctx.fillStyle='#e1f5fe';ctx.fillRect(0,0,W,H);

  if(phase==='spin'){
    const barW=W-60;
    ctx.fillStyle='rgba(2,136,209,.15)';ctx.fillRect(30,60,barW,20);
    ctx.fillStyle='#ffca28';ctx.fillRect(30+landStart,60,landLen,20);
    ctx.fillStyle='#0288d1';ctx.fillRect(30+Math.min(barW,spinT)-2,55,4,30);
    ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(W/2,150);ctx.rotate(spinT*0.4);ctx.fillText('⛸️',0,0);ctx.restore();
  }else{
    ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⛸️',W/2,GROUND_Y());
  }

  ctx.fillStyle='#0288d1';ctx.font='14px Arial';
  ctx.fillText(phase==='ground'?I18N.t('jump_hint','Tap to jump!'):I18N.t('land_hint','Tap to land!'),W/2,220);

  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0288d1';ctx.font='bold 26px Arial';
    ctx.fillText(I18N.t('out_of_energy_title','OUT OF ENERGY'),W/2,H/2-16);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText(I18N.t('score_best','Score: {n} | Best: {b}').replace('{n}',score).replace('{b}',loadBest()),W/2,H/2+12);
    ctx.fillText(I18N.t('retry_hint','Tap to retry'),W/2,H/2+38);
  }

  update();
  requestAnimationFrame(draw);
}
function GROUND_Y(){return 220;}

function updateUI(){
  document.getElementById('ui').textContent=I18N.t('score_energy','Score: {n} | Energy: {e}').replace('{n}',score).replace('{e}',Math.max(0,Math.floor(energy)));
}

init();draw();
</script></body></html>
