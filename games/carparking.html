<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Car Parking</title><meta name="description" content="Play Car Parking free online — Use Arrow Keys or WASD (or drag/touch) to steer your car into the marked parking spot without hitting other cars, cones, or lamp posts."><link rel="canonical" href="https://games.multiportllc.com/games/carparking"><meta property="og:title" content="Car Parking - Multiport Games"><meta property="og:description" content="Play Car Parking free online — Use Arrow Keys or WASD (or drag/touch) to steer your car into the marked parking spot without hitting other cars, cones, or lamp posts."><meta property="og:url" content="https://games.multiportllc.com/games/carparking"><meta property="og:type" content="website"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Car Parking","description":"Play Car Parking free online instantly. Use Arrow Keys or WASD (or drag/touch) to steer your car into the marked parking spot without hitting other cars, cones, or lamp posts. Park cleanly and centered for a higher score before a new, trickier spot appears. No download or signup required.","genre":"Skill","url":"https://games.multiportllc.com/games/carparking","applicationCategory":"Game","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#c{background:#37474f;display:block;border-radius:8px;touch-action:none}
#score-display{color:#90a4ae;font-size:1.2rem;font-weight:700;text-align:center;padding:8px}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Car Parking</div>
  <div class="game-frame">
    <div id="score-display">Score: 0 | Spots: 0 | Lives: 3 | Hi: 0</div>
    <canvas id="c" width="800" height="500"></canvas>
  </div>
  <div class="game-instructions" data-i18n="instructions">Use <b>Arrow Keys</b> or <b>WASD</b> (or drag/touch the car) to steer into the marked parking spot. Avoid other cars, cones, and lamp posts — line up straight and centered for the best score!</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=500;
let score=0,hi=parseInt(localStorage.getItem('carparking_hi')||'0'),spots=0,lives=3,level=0,gameOver=false,started=false;
const START={x:70,y:450,angle:0};
const car={x:START.x,y:START.y,angle:START.angle,speed:0,w:26,h:44};
const MAXF=3.2,MAXR=-1.8,ACCEL=0.09,FRICTION=0.035,TURN=0.048;
let keys={};
let touchPos=null,touching=false;
let obstacles=[],spot=null;
let parkTimer=0;
let msg='';

function reset(){
  score=0;spots=0;lives=3;level=0;gameOver=false;started=false;
  car.x=START.x;car.y=START.y;car.angle=START.angle;car.speed=0;
  nextLevel();
}

function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}

function rand(a,b){return a+Math.random()*(b-a);}

function overlapsSpot(x,y,r){
  if(!spot)return false;
  return Math.hypot(x-spot.x,y-spot.y)<r+Math.max(spot.w,spot.h)/2+10;
}
function overlapsStart(x,y,r){
  return Math.hypot(x-START.x,y-START.y)<r+70;
}

function nextLevel(){
  level++;
  car.x=START.x;car.y=START.y;car.angle=START.angle;car.speed=0;
  parkTimer=0;
  // Spot: alternate orientation as level grows for parallel-parking-style challenge
  const angled = level%3===0;
  const sw = angled? rand(70,90) : rand(58,70-Math.min(level,10));
  const sh = angled? rand(46,54) : rand(90,110-Math.min(level*2,30));
  spot={
    x:rand(150,W-100),
    y:rand(90,H-160),
    w:sw,h:sh,
    angle: angled? Math.PI/2 : 0
  };
  obstacles=[];
  const n=3+Math.min(level,9);
  let tries=0;
  while(obstacles.length<n && tries<400){
    tries++;
    const x=rand(50,W-50),y=rand(50,H-50);
    const r=18;
    if(overlapsSpot(x,y,r))continue;
    if(overlapsStart(x,y,r))continue;
    let bad=false;
    for(const o of obstacles){ if(Math.hypot(x-o.x,y-o.y)<70){bad=true;break;} }
    if(bad)continue;
    const type=Math.random()<0.5?'car':(Math.random()<0.5?'cone':'lamp');
    obstacles.push({x,y,type,angle: type==='car'? (Math.random()<0.5?0:Math.PI/2):0});
  }
  msg='';
}

function keyDown(e){
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k))e.preventDefault();
  keys[k]=true;
  if(!started){started=true;}
  if(gameOver){reset();return;}
}
function keyUp(e){ keys[e.key.toLowerCase()]=false; }
document.addEventListener('keydown',keyDown);
document.addEventListener('keyup',keyUp);

function canvasPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
}
function onDown(e){
  e.preventDefault();
  if(!started)started=true;
  if(gameOver){reset();return;}
  touching=true;touchPos=canvasPos(e);
}
function onMove(e){ if(touching){e.preventDefault();touchPos=canvasPos(e);} }
function onUp(e){ touching=false; }
c.addEventListener('mousedown',onDown);
c.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
c.addEventListener('touchstart',onDown,{passive:false});
c.addEventListener('touchmove',onMove,{passive:false});
c.addEventListener('touchend',onUp);

function circCollide(ax,ay,ar,bx,by,br){ return Math.hypot(ax-bx,ay-by) < ar+br; }

function obstacleRadius(o){ return o.type==='car'?24:(o.type==='cone'?12:14); }

function drawCarShape(x,y,angle,color,darker){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.fillStyle=color;
  ctx.fillRect(-13,-22,26,44);
  ctx.fillStyle=darker;
  ctx.fillRect(-10,-16,20,12);
  ctx.fillRect(-10,4,20,12);
  ctx.fillStyle='#fffde7';
  ctx.fillRect(-9,-21,18,5);
  ctx.restore();
}

function drawObstacle(o){
  if(o.type==='car'){ drawCarShape(o.x,o.y,o.angle,'#5c6bc0','#3949ab'); }
  else if(o.type==='cone'){
    ctx.fillStyle='#ff7043';
    ctx.beginPath();ctx.moveTo(o.x,o.y-14);ctx.lineTo(o.x+10,o.y+12);ctx.lineTo(o.x-10,o.y+12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff3e0';ctx.fillRect(o.x-8,o.y+2,16,4);
  } else {
    ctx.strokeStyle='#78909c';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(o.x,o.y+14);ctx.lineTo(o.x,o.y-14);ctx.stroke();
    ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(o.x,o.y-18,7,0,7);ctx.fill();
  }
}

function drawSpot(){
  ctx.save();
  ctx.translate(spot.x,spot.y);ctx.rotate(spot.angle);
  ctx.strokeStyle='#ffee58';ctx.lineWidth=3;ctx.setLineDash([8,6]);
  ctx.strokeRect(-spot.w/2,-spot.h/2,spot.w,spot.h);
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,238,88,0.08)';
  ctx.fillRect(-spot.w/2,-spot.h/2,spot.w,spot.h);
  ctx.restore();
}

function checkParked(){
  const dx=car.x-spot.x, dy=car.y-spot.y;
  const ca=Math.cos(-spot.angle), sa=Math.sin(-spot.angle);
  const lx=dx*ca-dy*sa, ly=dx*sa+dy*ca;
  const fits = Math.abs(lx) < (spot.w/2 - 8) && Math.abs(ly) < (spot.h/2 - 4);
  if(!fits)return false;
  let ad = Math.abs(norm(car.angle-spot.angle));
  ad = Math.min(ad, Math.abs(norm(car.angle-spot.angle-Math.PI)));
  return {lx,ly,ad,offset:Math.hypot(lx,ly)};
}

function loop(){
  ctx.clearRect(0,0,W,H);
  // lot background
  ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(gameOver){
    ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('game_over_title','GAME OVER'),W/2,H/2-30);
    ctx.font='20px Arial';
    ctx.fillText(I18N.t('spots_parked_label','Spots parked: {n}').replace('{n}',spots),W/2,H/2+8);
    ctx.fillText(I18N.t('restart_hint','Tap or press a key to restart'),W/2,H/2+40);
    requestAnimationFrame(loop);return;
  }

  if(!started){
    drawSpot();
    obstacles.forEach(drawObstacle);
    drawCarShape(car.x,car.y,car.angle,'#ef5350','#c62828');
    ctx.fillStyle='#eceff1';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText(I18N.t('start_hint','Press a key or tap to start'),W/2,40);
    requestAnimationFrame(loop);return;
  }

  // input
  let steer=0,throttle=0;
  if(keys['arrowleft']||keys['a'])steer-=1;
  if(keys['arrowright']||keys['d'])steer+=1;
  if(keys['arrowup']||keys['w'])throttle+=1;
  if(keys['arrowdown']||keys['s'])throttle-=1;

  if(touching&&touchPos){
    const dx=touchPos.x-car.x, dy=touchPos.y-car.y;
    const dist=Math.hypot(dx,dy);
    if(dist>10){
      const targetAngle=Math.atan2(dx,-dy);
      let diff=norm(targetAngle-car.angle);
      steer = Math.max(-1,Math.min(1,diff*2));
      throttle = 1;
    }
  }

  if(throttle>0){ car.speed=Math.min(MAXF,car.speed+ACCEL); }
  else if(throttle<0){ car.speed=Math.max(MAXR,car.speed-ACCEL); }
  else {
    if(car.speed>0)car.speed=Math.max(0,car.speed-FRICTION);
    else if(car.speed<0)car.speed=Math.min(0,car.speed+FRICTION);
  }

  if(Math.abs(car.speed)>0.05){
    car.angle += steer*TURN*Math.sign(car.speed)*Math.min(1,Math.abs(car.speed)/1.5);
  }

  car.x += Math.sin(car.angle)*car.speed;
  car.y += -Math.cos(car.angle)*car.speed;
  car.x=Math.max(20,Math.min(W-20,car.x));
  car.y=Math.max(20,Math.min(H-20,car.y));

  drawSpot();
  obstacles.forEach(drawObstacle);

  // collisions
  const carR=20;
  let hit=false;
  for(const o of obstacles){
    if(circCollide(car.x,car.y,carR,o.x,o.y,obstacleRadius(o))){ hit=true;break; }
  }
  if(hit){
    lives--;
    SFX.hit();
    car.x=START.x;car.y=START.y;car.angle=START.angle;car.speed=0;
    if(lives<=0){ gameOver=true; if(score>hi){hi=score;localStorage.setItem('carparking_hi',hi);} SFX.lose(); }
  }

  drawCarShape(car.x,car.y,car.angle,'#ef5350','#c62828');

  // parking check
  const p=checkParked();
  if(p && Math.abs(car.speed)<0.15){
    parkTimer++;
    if(parkTimer>25){
      const angleDeg=p.ad*180/Math.PI;
      const pts=Math.max(15,Math.round(100 - p.offset*2.2 - angleDeg*0.9));
      score+=pts;
      spots++;
      SFX.success();
      msg=I18N.t('parked_msg','Parked! +{p}').replace('{p}',pts);
      nextLevel();
    }
  } else {
    parkTimer=0;
  }

  if(score>hi){hi=score;localStorage.setItem('carparking_hi',hi);}

  document.getElementById('score-display').textContent =
    I18N.t('carparking_status','Score: {s} | Spots: {n} | Lives: {l} | Hi: {h}')
      .replace('{s}',score).replace('{n}',spots).replace('{l}',lives).replace('{h}',hi);

  requestAnimationFrame(loop);
}
nextLevel();
loop();
</script></body></html>
