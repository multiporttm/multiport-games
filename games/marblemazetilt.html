<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<style>
body{background:#08080f}
#c{display:block;border-radius:8px;margin:0 auto;background:#37474f}
#ui{color:#b0bec5;text-align:center;padding:8px;font-size:1.1rem;font-weight:700}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center;margin:10px auto 4px;user-select:none;-webkit-user-select:none}
#dpad button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1.3rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(255,255,255,.2)}
#dpad .up{grid-column:2;grid-row:1}
#dpad .left{grid-column:1;grid-row:2}
#dpad .right{grid-column:3;grid-row:2}
#dpad .down{grid-column:2;grid-row:3}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Marble Maze Tilt</div>
  <div class="game-frame" style="padding:10px">
    <div id="ui">Level: 1 | Falls: 0</div>
    <canvas id="c" width="360" height="360"></canvas>
    <div id="dpad">
      <button class="up">⬆️</button>
      <button class="left">⬅️</button>
      <button class="right">➡️</button>
      <button class="down">⬇️</button>
    </div>
  </div>
  <div class="game-instructions">Arrow keys / WASD (or the D-pad) to tilt the board — the marble rolls with momentum in that direction. Reach the green goal while avoiding the black holes. Fall in a hole and you restart the level!</div>
</div>
<script>
const W=360,H=360,R=10;
let mx,my,mvx,mvy,holes,goal,level,falls,state,keys={};

function rand(min,max){return min+Math.random()*(max-min);}

function init(){level=1;falls=0;state='play';newLevel();}
function newLevel(){
  mx=30;my=30;mvx=0;mvy=0;
  goal={x:W-30,y:H-30,r:16};
  holes=[];
  for(let i=0;i<3+level;i++)holes.push({x:rand(60,W-60),y:rand(60,H-60),r:14});
}

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const DPAD_KEYS={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
document.querySelectorAll('#dpad button').forEach(btn=>{
  const key=DPAD_KEYS[btn.className];
  const press=e=>{e.preventDefault();keys[key]=true;};
  const release=e=>{e.preventDefault();keys[key]=false;};
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});

function update(){
  if(state!=='play')return;
  const tilt=0.35;
  if(keys['arrowup']||keys['w'])mvy-=tilt;
  if(keys['arrowdown']||keys['s'])mvy+=tilt;
  if(keys['arrowleft']||keys['a'])mvx-=tilt;
  if(keys['arrowright']||keys['d'])mvx+=tilt;
  mvx*=0.96;mvy*=0.96;
  mx+=mvx;my+=mvy;

  if(mx<R){mx=R;mvx=0;}
  if(mx>W-R){mx=W-R;mvx=0;}
  if(my<R){my=R;mvy=0;}
  if(my>H-R){my=H-R;mvy=0;}

  holes.forEach(h=>{
    if(Math.hypot(mx-h.x,my-h.y)<h.r){
      falls++;
      SFX.fail();
      newLevel();
      updateUI();
    }
  });

  if(Math.hypot(mx-goal.x,my-goal.y)<goal.r){
    level++;
    SFX.levelup();
    newLevel();
    updateUI();
  }
}

const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){
  ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#1b1b1b';
  holes.forEach(h=>{ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();});

  ctx.fillStyle='#66bb6a';
  ctx.beginPath();ctx.arc(goal.x,goal.y,goal.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a5d6a7';
  ctx.beginPath();ctx.arc(goal.x,goal.y,goal.r*0.5,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#e0e0e0';
  ctx.beginPath();ctx.arc(mx,my,R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();ctx.arc(mx-3,my-3,3,0,Math.PI*2);ctx.fill();

  update();
  requestAnimationFrame(draw);
}

function updateUI(){
  document.getElementById('ui').textContent=`Level: ${level} | Falls: ${falls}`;
}

init();draw();
</script></body></html>
