<link rel="stylesheet" href="../css/style.css?v=8">
<script src="../js/sound.js"></script>
<script src="../js/i18n.js"></script>
<style>
body{background:#08080f}
#table{background:linear-gradient(135deg,#a8e6cf,#3d84a8);border-radius:14px;padding:20px;text-align:center}
#status{color:#fff;font-size:1.05rem;font-weight:800;margin:4px 0 12px;min-height:1.6em;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#stats{color:#fffde7;font-size:.95rem;font-weight:700;margin-bottom:10px}
#targetBox{background:rgba(255,255,255,.9);border-radius:14px;padding:16px;margin:0 auto 14px;max-width:260px}
#targetShape{font-size:3.5rem;line-height:1}
#targetLabel{font-weight:800;color:#333;margin-top:4px}
#progressRow{display:flex;justify-content:center;gap:8px;margin:10px 0 16px;flex-wrap:wrap;min-height:2.4em}
.step-chip{background:rgba(255,255,255,.85);border-radius:20px;padding:6px 12px;font-weight:800;color:#333;font-size:1.2rem}
.step-chip.pending{opacity:.4}
#twistRow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.twist-btn{width:76px;height:76px;border-radius:16px;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:1.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s,background .15s;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.twist-btn:active{transform:scale(.92)}
.twist-btn span{font-size:.6rem;font-weight:800;color:#555;margin-top:2px}
.twist-btn:hover{background:#fff}
@media(max-width:480px){
  .twist-btn{width:64px;height:64px;font-size:1.5rem}
}
</style></head><body>
<div class="game-page">
  <div class="game-topbar">
    <a href="../" class="back-btn">← Back</a>
    <button class="sfx-toggle" id="sfx-toggle"></button>
  </div>
  <div class="game-title">Balloon Animals</div>
  <div class="game-frame" style="padding:18px">
    <div id="table">
      <div id="stats">Animals made: 0 | Lives: ♥♥♥</div>
      <div id="status">Twist the balloon into the shape shown!</div>
      <div id="targetBox">
        <div id="targetShape">🐶</div>
        <div id="targetLabel">Dog</div>
      </div>
      <div id="progressRow"></div>
      <div id="twistRow"></div>
    </div>
  </div>
  <div class="game-instructions" data-i18n="instructions">A target balloon shape is shown at the top. Click the <b>twist/fold buttons</b> in the exact order needed to build that shape. A wrong twist <b>pops the balloon</b> and costs a life. <b>3 lives</b> total.</div>
</div>
<script>
const TWISTS=[
  {id:'pinch',icon:'🤏',label:'Pinch'},
  {id:'loop',icon:'🔁',label:'Loop'},
  {id:'fold',icon:'📐',label:'Fold'},
  {id:'twist',icon:'🌀',label:'Twist'},
  {id:'ear',icon:'👂',label:'Ear Twist'}
];

const SHAPES=[
  {id:'sword',icon:'⚔️',label:'Sword',seq:['pinch','fold']},
  {id:'flower',icon:'🌸',label:'Flower',seq:['pinch','loop','twist']},
  {id:'dog',icon:'🐶',label:'Dog',seq:['pinch','loop','ear','twist']},
  {id:'hat',icon:'🎩',label:'Hat',seq:['fold','loop','pinch']},
  {id:'butterfly',icon:'🦋',label:'Butterfly',seq:['loop','fold','loop','twist']},
  {id:'giraffe',icon:'🦒',label:'Giraffe',seq:['pinch','twist','loop','ear','fold']}
];

let made=0,lives=3,gameOver=false,target=null,progress=[];

function pickTarget(){
  // weight easier shapes early, harder ones as `made` grows
  const maxLen=Math.min(SHAPES.length, 2+Math.floor(made/2)+1);
  const pool=SHAPES.slice().sort((a,b)=>a.seq.length-b.seq.length).slice(0,Math.max(2,maxLen));
  target=pool[Math.floor(Math.random()*pool.length)];
  progress=[];
  document.getElementById('targetShape').textContent='🎈';
  document.getElementById('targetLabel').textContent='?';
  setTimeout(()=>{
    document.getElementById('targetShape').textContent=target.icon;
    document.getElementById('targetLabel').textContent=target.label;
  },300);
  setStatus(I18N.t('ba_make_hint','Make a: {name}').replace('{name}',target.label));
  renderProgress();
}

function setStatus(t){document.getElementById('status').textContent=t;}

function renderStats(){
  let hearts='';
  for(let i=0;i<3;i++)hearts+= i<lives?'♥':'♡';
  document.getElementById('stats').textContent=I18N.t('ba_stats_label','Animals made: {n} | Lives: {l}').replace('{n}',made).replace('{l}',hearts);
}

function renderProgress(){
  const row=document.getElementById('progressRow');
  row.innerHTML='';
  target.seq.forEach((step,i)=>{
    const chip=document.createElement('div');
    chip.className='step-chip'+(i>=progress.length?' pending':'');
    const t=TWISTS.find(t=>t.id===step);
    chip.textContent = i<progress.length ? t.icon : '?';
    row.appendChild(chip);
  });
}

function doTwist(id){
  if(gameOver||!target)return;
  const expected=target.seq[progress.length];
  if(id===expected){
    progress.push(id);
    SFX.select();
    renderProgress();
    if(progress.length===target.seq.length){
      made++;
      SFX.success();
      setStatus(I18N.t('ba_complete','🎉 {name} complete!').replace('{name}',target.label));
      renderStats();
      setTimeout(()=>{ if(!gameOver) pickTarget(); },900);
    }
  }else{
    // wrong twist: pop
    SFX.error();
    lives--;
    setStatus(I18N.t('ba_pop','💥 Pop! Wrong twist — balloon popped.'));
    document.getElementById('targetShape').textContent='💥';
    renderStats();
    if(lives<=0){
      gameOver=true;
      SFX.lose();
      setTimeout(()=>{
        setStatus(I18N.t('ba_gameover','Game over! You made {n} balloon animals. Click a twist to play again.').replace('{n}',made));
      },600);
    }else{
      setTimeout(()=>{ if(!gameOver) pickTarget(); },900);
    }
  }
}

function renderTwists(){
  const row=document.getElementById('twistRow');
  row.innerHTML='';
  TWISTS.forEach(tw=>{
    const btn=document.createElement('button');
    btn.className='twist-btn';
    btn.innerHTML=`${tw.icon}<span>${tw.label}</span>`;
    btn.onclick=()=>{ if(gameOver)newGame(); else doTwist(tw.id); };
    row.appendChild(btn);
  });
}

function newGame(){
  made=0;lives=3;gameOver=false;
  renderStats();
  renderTwists();
  pickTarget();
}

newGame();
</script></body></html>
