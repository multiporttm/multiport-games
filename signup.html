<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up – Multiport Games™</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=8">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{width:100%;max-width:400px;background:rgba(255,255,255,0.07);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:36px 32px;box-shadow:0 24px 64px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1);}
.auth-card h2{font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:-.6px;margin-bottom:6px;text-align:center}
.auth-card .sub{color:rgba(255,255,255,.45);text-align:center;font-size:.9rem;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.field input{width:100%;padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:.95rem;outline:none;transition:all .18s}
.field input::placeholder{color:rgba(255,255,255,.3)}
.field input:focus{border-color:rgba(233,69,96,.55);background:rgba(255,255,255,.11);box-shadow:0 0 0 3px rgba(233,69,96,.14)}
.auth-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#e94560,#ff6b8a);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .18s;letter-spacing:.2px}
.auth-btn:hover{opacity:.88}
.auth-links{text-align:center;margin-top:20px;font-size:.88rem;color:rgba(255,255,255,.4)}
.auth-links a{color:#e94560;text-decoration:none;font-weight:600}
.auth-links a:hover{text-decoration:underline}
.back-home{display:block;text-align:center;margin-bottom:20px;color:rgba(255,255,255,.4);font-size:.85rem;text-decoration:none}
.back-home:hover{color:#fff}
.error{background:rgba(233,69,96,.15);border:1px solid rgba(233,69,96,.35);color:#ff8a9a;border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px;display:none}
.success{background:rgba(126,200,80,.15);border:1px solid rgba(126,200,80,.35);color:#a8e67a;border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px;display:none}
.logo{text-align:center;font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:24px}
.logo span{background:linear-gradient(135deg,#e94560,#ff8fa3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.agree-field{display:flex;align-items:flex-start;gap:9px;margin-bottom:16px}
.agree-field input{margin-top:3px;flex-shrink:0}
.agree-field label{text-transform:none;font-weight:400;font-size:.85rem;color:rgba(255,255,255,.55);letter-spacing:normal}
.agree-field a{color:#e94560;text-decoration:none;font-weight:600}
.agree-field a:hover{text-decoration:underline}
.auth-btn:disabled{opacity:.5;cursor:default}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:rgba(255,255,255,.3);font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.12)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:.92rem;font-weight:600;text-decoration:none;transition:background .18s}
.google-btn:hover{background:rgba(255,255,255,.1)}
.code-input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:1.4rem;font-weight:700;letter-spacing:8px;text-align:center;outline:none;transition:all .18s}
.code-input:focus{border-color:rgba(233,69,96,.55);background:rgba(255,255,255,.11);box-shadow:0 0 0 3px rgba(233,69,96,.14)}
.resend-link{background:none;border:none;color:#e94560;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:0}
.resend-link:hover{text-decoration:underline}
</style></head><body>
<div style="width:100%;max-width:400px">
  <a href="index.html" class="back-home">← Back to games</a>
  <div class="auth-card">
    <div class="logo">Multiport<span>Games</span></div>
    <h2>Create account</h2>
    <p class="sub">Join Multiport Games for free</p>
    <div class="error" id="err"></div>
    <div class="success" id="ok"></div>
    <div id="signup-step">
      <div class="field"><label>Username</label><input id="username" type="text" placeholder="Choose a username" autocomplete="username"></div>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password"></div>
      <div class="field"><label>Confirm Password</label><input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password"></div>
      <div class="agree-field">
        <input type="checkbox" id="agree">
        <label for="agree">I agree to the <a href="terms.html" id="terms-link">Terms of Service</a> and <a href="privacy.html" id="privacy-link">Privacy Policy</a></label>
      </div>
      <div id="human-verify" style="margin-bottom:16px" data-callback="onTsToken" data-expired-callback="onTsCleared"></div>
      <button class="auth-btn" id="signup-btn" onclick="doSignup()" disabled>Create Account</button>
      <div class="divider">or</div>
      <a href="/api/auth/google/start" class="google-btn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.7 34.7 27 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.6C41.5 36.4 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>Continue with Google</a>
      <div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
    <div id="code-step" style="display:none">
      <p class="sub" style="margin-bottom:20px">Enter the 6-digit code we emailed to <b id="code-email-display" style="color:#fff"></b></p>
      <div class="field"><input class="code-input" id="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000"></div>
      <button class="auth-btn" id="verify-btn" onclick="doVerifyCode()">Verify & Create Account</button>
      <div class="auth-links"><button class="resend-link" onclick="doSignup(true)">Resend code</button> &nbsp;·&nbsp; <button class="resend-link" onclick="backToSignupForm()">Use a different email</button></div>
    </div>
  </div>
</div>

<div id="legal-overlay">
  <div id="legal-modal">
    <button id="legal-modal-close">✕</button>
    <div id="legal-modal-body"></div>
  </div>
</div>
<script src="js/humanverify.js"></script>
<script>
// The human-verify widget calls these the same way Turnstile's
// data-callback / data-expired-callback used to — gate the button on
// both a verified token and the agree checkbox.
let hvToken='';
function updateSignupBtn(){
  document.getElementById('signup-btn').disabled=!(hvToken&&document.getElementById('agree').checked);
}
function onTsToken(token){
  hvToken=token;
  updateSignupBtn();
}
function onTsCleared(){
  hvToken='';
  updateSignupBtn();
}
HumanVerify.init('human-verify');

let pendingEmail='',pendingUsername='',pendingPassword='';

async function doSignup(isResend){
  const u=isResend?pendingUsername:document.getElementById('username').value.trim();
  const e=isResend?pendingEmail:document.getElementById('email').value.trim();
  const p=isResend?pendingPassword:document.getElementById('password').value;
  const cf=isResend?p:document.getElementById('confirm').value;
  const err=document.getElementById('err');const ok=document.getElementById('ok');
  err.style.display='none';ok.style.display='none';
  if(!isResend){
    if(!u||!e||!p||!cf){err.textContent='Please fill in all fields.';err.style.display='block';return;}
    if(u.length<3){err.textContent='Username must be at least 3 characters.';err.style.display='block';return;}
    if(p.length<6){err.textContent='Password must be at least 6 characters.';err.style.display='block';return;}
    if(p!==cf){err.textContent='Passwords do not match.';err.style.display='block';return;}
    if(!/\S+@\S+\.\S+/.test(e)){err.textContent='Please enter a valid email.';err.style.display='block';return;}
    if(!document.getElementById('agree').checked){err.textContent='You must agree to the Terms of Service and Privacy Policy.';err.style.display='block';return;}
  }

  if(!hvToken){err.textContent='Please complete the verification puzzle.';err.style.display='block';return;}

  const btn=document.getElementById('signup-btn');
  btn.disabled=true;btn.textContent='Sending code…';

  try{
    const res=await fetch('/api/signup-request-code',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,email:e,password:p,humanToken:hvToken})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'Sign up failed.';err.style.display='block';btn.disabled=false;btn.textContent='Create Account';
      onTsCleared();
      HumanVerify.refresh('human-verify');
      return;
    }
    pendingUsername=u;pendingEmail=e;pendingPassword=p;
    btn.disabled=false;btn.textContent='Create Account';
    document.getElementById('code-email-display').textContent=e;
    document.getElementById('signup-step').style.display='none';
    document.getElementById('code-step').style.display='block';
    document.getElementById('code-input').value='';
    document.getElementById('code-input').focus();
    if(isResend){ok.textContent='A new code was sent.';ok.style.display='block';setTimeout(()=>ok.style.display='none',2500);}
  }catch{
    err.textContent='Could not connect. Please try again.';err.style.display='block';
    btn.disabled=false;btn.textContent='Create Account';
    onTsCleared();
    HumanVerify.refresh('human-verify');
  }
}

async function doVerifyCode(){
  const code=document.getElementById('code-input').value.trim();
  const err=document.getElementById('err');const ok=document.getElementById('ok');
  err.style.display='none';ok.style.display='none';
  if(!/^\d{6}$/.test(code)){err.textContent='Enter the 6-digit code.';err.style.display='block';return;}

  const btn=document.getElementById('verify-btn');
  btn.disabled=true;btn.textContent='Verifying…';

  try{
    const res=await fetch('/api/signup-verify-code',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:pendingEmail,code})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'Verification failed.';err.style.display='block';btn.disabled=false;btn.textContent='Verify & Create Account';
      return;
    }
    localStorage.setItem('miniarcade_session',JSON.stringify({username:data.username}));
    ok.textContent='Account created! Redirecting…';ok.style.display='block';
    setTimeout(()=>location.href='index.html',800);
  }catch{
    err.textContent='Could not connect. Please try again.';err.style.display='block';
    btn.disabled=false;btn.textContent='Verify & Create Account';
  }
}

function backToSignupForm(){
  document.getElementById('err').style.display='none';
  document.getElementById('ok').style.display='none';
  document.getElementById('code-step').style.display='none';
  document.getElementById('signup-step').style.display='block';
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('code-step').style.display==='block')doVerifyCode();
  else doSignup();
});
document.getElementById('agree').addEventListener('change',updateSignupBtn);

// ── Legal mini-page modal ─────────────────────
async function openLegalModal(url){
  const body=document.getElementById('legal-modal-body');
  body.innerHTML='<div style="padding:32px;text-align:center;color:rgba(255,255,255,.4)">Loading…</div>';
  document.getElementById('legal-overlay').classList.add('open');
  try{
    const res=await fetch(url);
    const html=await res.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const content=doc.querySelector('.doc');
    body.innerHTML=content?content.outerHTML:'<div style="padding:32px">Could not load content.</div>';
  }catch{
    body.innerHTML='<div style="padding:32px">Could not load content.</div>';
  }
}
function closeLegalModal(){
  document.getElementById('legal-overlay').classList.remove('open');
}
document.getElementById('terms-link').addEventListener('click',e=>{e.preventDefault();openLegalModal('terms');});
document.getElementById('privacy-link').addEventListener('click',e=>{e.preventDefault();openLegalModal('privacy');});
document.getElementById('legal-modal-close').addEventListener('click',closeLegalModal);
document.getElementById('legal-overlay').addEventListener('click',e=>{
  if(e.target.id==='legal-overlay')closeLegalModal();
});

(function(){
  const params=new URLSearchParams(location.search);
  const gUser=params.get('g_user');
  const gError=params.get('g_error');
  if(gUser){
    localStorage.setItem('miniarcade_session',JSON.stringify({username:gUser}));
    location.href='index.html';
  } else if(gError){
    document.getElementById('err').textContent=gError;
    document.getElementById('err').style.display='block';
    history.replaceState(null,'','signup.html');
  }
})();
</script>
</body></html>
